<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── RENDERER ─────────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x87CEEB, 0.008);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 500);
camera.position.set(28, 18, 28);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 8;
controls.maxDistance = 120;
controls.maxPolarAngle = Math.PI * 0.48;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;
controls.target.set(0, 8, 0);

// ── PALETTE ───────────────────────────────────────────────────────────────────
const C = {
  vermillion: 0xC73E1D,
  gold:       0xE8B86D,
  teak:       0x4A2C1A,
  jade1:      0x2D6A4F,
  jade2:      0x40916C,
  sakura1:    0xFFB7C5,
  sakura2:    0xFF8FAB,
  sakura3:    0xFFE5EC,
  stone:      0x9AA0A6,
  pond:       0x7ED6DF,
  moss:       0x606C38,
  white:      0xFFFFFF,
  darkwood:   0x3D2B1F,
  sky_day:    0x87CEEB,
  sky_dusk:   0xFF7043,
  sky_night:  0x0a0a2e,
  lanternGlow:0xFFAA44,
  grass:      0x4CAF50,
  dirt:       0x8B6914,
};

// ── MATERIALS CACHE ───────────────────────────────────────────────────────────
const matCache = {};
function mat(hex, opts = {}) {
  const key = hex + JSON.stringify(opts);
  if (!matCache[key]) matCache[key] = new THREE.MeshStandardMaterial({ color: hex, ...opts });
  return matCache[key];
}

// ── INSTANCED VOXEL BUILDER ───────────────────────────────────────────────────
const voxelGroups = {};   // hex -> [{x,y,z}]
function addVoxel(hex, x, y, z) {
  if (!voxelGroups[hex]) voxelGroups[hex] = [];
  voxelGroups[hex].push({ x, y, z });
}

let totalVoxels = 0;
const clickables = [];   // { mesh, type, id }

function buildVoxels() {
  const boxGeo = new THREE.BoxGeometry(1, 1, 1);
  for (const [hexStr, positions] of Object.entries(voxelGroups)) {
    const hex = parseInt(hexStr);
    const iMesh = new THREE.InstancedMesh(boxGeo, mat(hex, { roughness: 0.8, metalness: 0.05 }), positions.length);
    iMesh.castShadow = true;
    iMesh.receiveShadow = true;
    const dummy = new THREE.Object3D();
    positions.forEach((p, i) => {
      dummy.position.set(p.x, p.y, p.z);
      dummy.updateMatrix();
      iMesh.setMatrixAt(i, dummy.matrix);
    });
    iMesh.instanceMatrix.needsUpdate = true;
    scene.add(iMesh);
    totalVoxels += positions.length;
  }
}

// ── TERRAIN ───────────────────────────────────────────────────────────────────
function buildTerrain() {
  // Simple heightmap — mostly flat with slight undulation
  const SIZE = 64;
  for (let x = -SIZE/2; x < SIZE/2; x++) {
    for (let z = -SIZE/2; z < SIZE/2; z++) {
      const dist = Math.sqrt(x*x + z*z);
      // pond area
      if (isPond(x, z)) continue;
      // slight height variation
      const h = Math.floor(Math.sin(x*0.15)*0.5 + Math.cos(z*0.13)*0.5);
      const col = isMoss(x, z) ? C.moss : (Math.random() < 0.08 ? C.jade1 : C.jade2);
      addVoxel(col, x, h, z);
      // dirt underneath
      addVoxel(C.dirt, x, h - 1, z);
    }
  }
}

function isPond(x, z) {
  return ((x + 14) * (x + 14) / 64 + (z - 8) * (z - 8) / 36) < 1;
}
function isMoss(x, z) {
  return Math.sin(x * 0.3) * Math.cos(z * 0.3) > 0.5;
}
function isPath(x, z) {
  // zig-zag stone path from torii (-20,0) toward pagoda (0,0)
  const pathPoints = [
    [-20,0],[-18,2],[-16,2],[-14,0],[-12,0],[-10,2],[-8,2],[-6,0],[-4,0],[-2,0],[0,0]
  ];
  for (const [px, pz] of pathPoints) {
    if (Math.abs(x - px) <= 1 && Math.abs(z - pz) <= 1) return true;
  }
  return false;
}

// ── POND ──────────────────────────────────────────────────────────────────────
function buildPond() {
  // flat water surface
  for (let x = -22; x <= -6; x++) {
    for (let z = 4; z <= 14; z++) {
      if (isPond(x, z)) addVoxel(C.pond, x, -1, z);
    }
  }
  // pond edge stones
  for (let x = -23; x <= -5; x++) {
    for (let z = 3; z <= 15; z++) {
      if (!isPond(x, z) && isPond(x + 0.5, z) || isPond(x - 0.5, z) || isPond(x, z + 0.5) || isPond(x, z - 0.5)) {
        if (Math.abs((x+14)*(x+14)/64 + (z-8)*(z-8)/36 - 1) < 0.15) {
          addVoxel(C.stone, x, -1, z);
        }
      }
    }
  }
}

// ── STONE PATH ────────────────────────────────────────────────────────────────
function buildPath() {
  const waypoints = [[-20,0],[-18,2],[-16,2],[-14,0],[-12,0],[-10,2],[-8,2],[-6,0],[-4,0],[-2,0],[0,0]];
  for (let i = 0; i < waypoints.length - 1; i++) {
    const [x1,z1] = waypoints[i], [x2,z2] = waypoints[i+1];
    const steps = Math.max(Math.abs(x2-x1), Math.abs(z2-z1));
    for (let s = 0; s <= steps; s++) {
      const t = s / steps;
      const x = Math.round(x1 + (x2-x1)*t);
      const z = Math.round(z1 + (z2-z1)*t);
      addVoxel(C.stone, x, 0, z);
      addVoxel(C.stone, x+1, 0, z);
    }
  }
}

// ── PAGODA ────────────────────────────────────────────────────────────────────
// 5 floors, each smaller than the last, with upturned roofs
const PAGODA_FLOORS = 5;
const floorDoorStates = [false, false, false, false, false]; // open/closed
const floorDoorMeshes = [];

function buildPagoda() {
  const floors = [
    { y: 0,  size: 9, height: 5 },
    { y: 6,  size: 7, height: 4 },
    { y: 11, size: 6, height: 4 },
    { y: 16, size: 5, height: 3 },
    { y: 20, size: 4, height: 3 },
  ];

  floors.forEach((fl, fi) => {
    const s = fl.size;
    const h = fl.height;
    const y0 = fl.y;
    const hs = Math.floor(s / 2);

    // --- Platform base ---
    for (let x = -hs; x <= hs; x++) {
      for (let z = -hs; z <= hs; z++) {
        addVoxel(C.stone, x, y0, z);
      }
    }

    // --- Walls (hollow interior) ---
    for (let dy = 1; dy < h; dy++) {
      for (let x = -hs; x <= hs; x++) {
        for (let z = -hs; z <= hs; z++) {
          const onEdge = Math.abs(x) === hs || Math.abs(z) === hs;
          if (onEdge) {
            // pillar corners in vermillion, walls in teak
            const isCorner = Math.abs(x) === hs && Math.abs(z) === hs;
            addVoxel(isCorner ? C.vermillion : C.teak, x, y0 + dy, z);
          } else if (dy === 1) {
            // interior floor
            addVoxel(C.darkwood, x, y0, z);
          }
        }
      }
      // Door gap (south face, floor 0 only)
      if (fi === 0 && dy >= 1 && dy <= 2) {
        addVoxel(C.teak, -1, y0 + dy, hs);
        addVoxel(C.teak,  1, y0 + dy, hs);
        // clear center for door
      }
    }

    // --- Gold beam top ---
    for (let x = -hs; x <= hs; x++) {
      addVoxel(C.gold, x, y0 + h, -hs);
      addVoxel(C.gold, x, y0 + h, hs);
      addVoxel(C.gold, -hs, y0 + h, x);
      addVoxel(C.gold, hs, y0 + h, x);
    }

    // --- Roof (upturned, stepped, jade) ---
    buildRoof(hs + 2, y0 + h, s);

    // --- Interior warm glow voxel ---
    addVoxel(C.gold, 0, y0 + 2, 0);
  });

  // Finial / spire on top
  const topY = floors[4].y + floors[4].height + 4; // after top roof
  for (let i = 0; i < 6; i++) {
    addVoxel(i % 2 === 0 ? C.gold : C.vermillion, 0, topY + i, 0);
  }
  addVoxel(C.gold, 0, topY + 6, 0);
  addVoxel(C.gold, 1, topY + 5, 0);
  addVoxel(C.gold, -1, topY + 5, 0);
  addVoxel(C.gold, 0, topY + 5, 1);
  addVoxel(C.gold, 0, topY + 5, -1);
}

function buildRoof(halfSize, baseY, floorSize) {
  // Stepped upturned roof: largest at base, each ring one up
  // Eave tips curl upward at corners
  const layers = halfSize + 1;
  for (let ring = 0; ring <= halfSize; ring++) {
    const y = baseY + ring;
    const hs = halfSize - ring;
    const col = ring % 2 === 0 ? C.jade1 : C.jade2;
    for (let x = -hs; x <= hs; x++) {
      addVoxel(col, x, y, -hs);
      addVoxel(col, x, y,  hs);
      addVoxel(col, -hs, y, x);
      addVoxel(col,  hs, y, x);
    }
    // fill interior
    if (hs === 0) addVoxel(col, 0, y, 0);
  }
  // upturned corner tips (one extra up at corners)
  const tip = halfSize;
  const corners = [[-tip, -tip],[-tip, tip],[tip, -tip],[tip, tip]];
  corners.forEach(([cx, cz]) => {
    addVoxel(C.gold, cx, baseY + 1, cz);
    addVoxel(C.gold, cx, baseY + 2, cz);
  });
}

// ── TORII GATE ────────────────────────────────────────────────────────────────
function buildTorii() {
  const tx = -20, tz = 0;
  // Two pillars
  for (let y = 0; y < 8; y++) {
    addVoxel(C.vermillion, tx - 2, y, tz);
    addVoxel(C.vermillion, tx + 2, y, tz);
  }
  // Top beam (kasagi)
  for (let x = tx - 3; x <= tx + 3; x++) {
    addVoxel(C.vermillion, x, 8, tz);
    addVoxel(C.vermillion, x, 7, tz);
  }
  // Second beam (shimagi)
  for (let x = tx - 2; x <= tx + 2; x++) {
    addVoxel(C.teak, x, 6, tz);
  }
  // Gold caps
  addVoxel(C.gold, tx - 3, 8, tz);
  addVoxel(C.gold, tx + 3, 8, tz);
}

// ── BAMBOO FENCE ─────────────────────────────────────────────────────────────
function buildFence() {
  const segments = [
    { x1:-28, z1:-28, x2: 28, z2:-28 },
    { x1:-28, z1: 28, x2: 28, z2: 28 },
    { x1:-28, z1:-28, x2:-28, z2: 28 },
    { x1: 28, z1:-28, x2: 28, z2: 28 },
  ];
  segments.forEach(({ x1, z1, x2, z2 }) => {
    const dx = x2 - x1, dz = z2 - z1;
    const len = Math.sqrt(dx*dx + dz*dz);
    const steps = Math.ceil(len);
    for (let i = 0; i <= steps; i += 2) {
      const t = i / steps;
      const x = Math.round(x1 + dx * t);
      const z = Math.round(z1 + dz * t);
      addVoxel(C.jade2, x, 1, z);
      addVoxel(C.jade2, x, 2, z);
    }
  });
}

// ── ARCHED BRIDGE ────────────────────────────────────────────────────────────
function buildBridge() {
  const bx = -14;
  for (let z = 4; z <= 12; z++) {
    const arch = Math.round(Math.sin((z - 4) / 8 * Math.PI) * 1.5);
    addVoxel(C.teak, bx, arch, z);
    addVoxel(C.teak, bx + 1, arch, z);
    // handrail
    if (z % 2 === 0) {
      addVoxel(C.darkwood, bx - 1, arch + 1, z);
      addVoxel(C.darkwood, bx + 2, arch + 1, z);
    }
  }
}

// ── TREES ─────────────────────────────────────────────────────────────────────
function buildTree(type, tx, tz) {
  if (type === 'sakura') buildSakura(tx, tz);
  else if (type === 'pine') buildPine(tx, tz);
  else if (type === 'maple') buildMaple(tx, tz);
  else if (type === 'willow') buildWillow(tx, tz);
}

function buildSakura(tx, tz) {
  for (let y = 1; y <= 6; y++) addVoxel(C.teak, tx, y, tz);
  // crown blobs
  const blobs = [[0,6,0],[1,7,0],[-1,7,0],[0,7,1],[0,7,-1],[0,8,0],[1,6,1],[-1,6,-1]];
  blobs.forEach(([dx,dy,dz]) => {
    addVoxel(C.sakura1, tx+dx, ty(dy), tz+dz);
    if (Math.random() > 0.3) addVoxel(C.sakura2, tx+dx+Math.sign(dx), ty(dy), tz+dz);
    function ty(y) { return y; }
  });
  blobs.forEach(([dx,dy,dz]) => addVoxel(Math.random()>0.5?C.sakura1:C.sakura2, tx+dx, dy, tz+dz));
}

function buildPine(tx, tz) {
  for (let y = 1; y <= 10; y++) addVoxel(C.teak, tx, y, tz);
  [[0,5,5],[0,7,4],[0,9,3],[0,11,2]].forEach(([,baseY, hs]) => {
    for (let x = -hs; x <= hs; x++) for (let z = -hs; z <= hs; z++) {
      if (Math.abs(x)+Math.abs(z) <= hs) addVoxel(C.jade1, tx+x, baseY, tz+z);
    }
  });
}

function buildMaple(tx, tz) {
  for (let y = 1; y <= 5; y++) addVoxel(C.teak, tx, y, tz);
  const maple = 0xC0392B;
  const blobs = [[0,5,0],[1,6,0],[-1,6,0],[0,6,1],[0,6,-1],[0,7,0],[2,5,1]];
  blobs.forEach(([dx,dy,dz]) => addVoxel(maple, tx+dx, dy, tz+dz));
  blobs.forEach(([dx,dy,dz]) => {
    if (Math.random()>0.4) addVoxel(0xE74C3C, tx+dx+1, dy, tz+dz);
  });
}

function buildWillow(tx, tz) {
  for (let y = 1; y <= 9; y++) addVoxel(C.teak, tx, y, tz);
  for (let arm = 0; arm < 8; arm++) {
    const angle = (arm / 8) * Math.PI * 2;
    for (let r = 1; r <= 4; r++) {
      const x = Math.round(Math.cos(angle) * r);
      const z = Math.round(Math.sin(angle) * r);
      const droop = Math.floor(r * r * 0.4);
      for (let d = 0; d <= droop; d++) addVoxel(C.jade2, tx+x, 9-d, tz+z);
    }
  }
}

// ── JIZO STATUES ──────────────────────────────────────────────────────────────
function buildJizo(jx, jz) {
  addVoxel(C.stone, jx, 1, jz);       // body
  addVoxel(C.stone, jx, 2, jz);
  addVoxel(C.stone, jx, 3, jz);       // head
  addVoxel(C.sakura1, jx, 3, jz);     // red bib (sakura colour)
  addVoxel(C.stone, jx, 4, jz);       // hat
  addVoxel(C.vermillion, jx-1, 3, jz);
}

// ── FLOWERS ───────────────────────────────────────────────────────────────────
function buildFlowers() {
  const flowerCols = [C.sakura1, C.sakura2, 0xFFFF88, 0xFF9800, 0xE040FB];
  let count = 0;
  const rng = mulberry32(42);
  while (count < 40) {
    const x = Math.floor(rng() * 48) - 24;
    const z = Math.floor(rng() * 48) - 24;
    if (isPond(x, z) || Math.abs(x) < 6 && Math.abs(z) < 6) continue;
    addVoxel(flowerCols[count % flowerCols.length], x, 1, z);
    count++;
  }
}
function mulberry32(a) {
  return function() { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

// ── LANTERNS (Three.js objects, not voxels) ───────────────────────────────────
const lanternLights = [];
const lanternMeshes = [];
const lanternPositions = [
  [-8, 1, -8], [8, 1, -8], [-8, 1, 8], [8, 1, 8]
];

function buildLanterns() {
  lanternPositions.forEach(([lx, ly, lz], i) => {
    // Post
    const postGeo = new THREE.BoxGeometry(0.4, 3, 0.4);
    const post = new THREE.Mesh(postGeo, mat(C.teak, { roughness: 0.9 }));
    post.position.set(lx, ly + 1.5, lz);
    post.castShadow = true;
    scene.add(post);

    // Lantern body
    const bodyGeo = new THREE.BoxGeometry(1.2, 1.5, 1.2);
    const body = new THREE.Mesh(bodyGeo, mat(C.gold, { roughness: 0.4, metalness: 0.3, emissive: C.lanternGlow, emissiveIntensity: 0.5 }));
    body.position.set(lx, ly + 3.5, lz);
    body.castShadow = true;
    scene.add(body);
    lanternMeshes.push(body);

    // Roof cap
    const capGeo = new THREE.BoxGeometry(1.6, 0.4, 1.6);
    const cap = new THREE.Mesh(capGeo, mat(C.vermillion, { roughness: 0.7 }));
    cap.position.set(lx, ly + 4.4, lz);
    scene.add(cap);

    // Point light
    const light = new THREE.PointLight(C.lanternGlow, 2, 12);
    light.position.set(lx, ly + 3.5, lz);
    light.castShadow = true;
    light.shadow.mapSize.set(512, 512);
    scene.add(light);
    lanternLights.push({ light, on: true, body });

    clickables.push({ mesh: body, type: 'lantern', id: i });
  });
}

// ── KOI (animated planes) ────────────────────────────────────────────────────
const koiMeshes = [];
const KOI_COLS = [0xFF6B35, 0xFFFFFF, 0xFF0000, 0xE8B86D, 0xFF6B35, 0xFFFFFF];

function buildKoi() {
  KOI_COLS.forEach((col, i) => {
    const geo = new THREE.BoxGeometry(0.8, 0.2, 0.3);
    const mesh = new THREE.Mesh(geo, mat(col, { roughness: 0.3 }));
    const angle = (i / 6) * Math.PI * 2;
    mesh.position.set(
      -14 + Math.cos(angle) * 3.5,
      -0.5,
      8  + Math.sin(angle) * 2
    );
    mesh.userData = { angle, speed: 0.003 + i * 0.0005, radius: 3.5 + i * 0.2 };
    scene.add(mesh);
    koiMeshes.push(mesh);
  });
}

// ── SAKURA PETALS ────────────────────────────────────────────────────────────
const petalCount = 200;
const petalGeo = new THREE.InstancedMesh(
  new THREE.BoxGeometry(0.15, 0.05, 0.15),
  mat(C.sakura2, { roughness: 0.5, transparent: true, opacity: 0.85 }),
  petalCount
);
petalGeo.castShadow = false;
scene.add(petalGeo);
const petalData = Array.from({ length: petalCount }, () => ({
  x: (Math.random() - 0.5) * 40,
  y: Math.random() * 25 + 2,
  z: (Math.random() - 0.5) * 40,
  vy: -(0.01 + Math.random() * 0.02),
  vx: (Math.random() - 0.5) * 0.02,
  vz: (Math.random() - 0.5) * 0.02,
  rot: Math.random() * Math.PI * 2,
  rotSpeed: (Math.random() - 0.5) * 0.05,
}));

// ── LIGHTING ─────────────────────────────────────────────────────────────────
const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x2D6A4F, 0.6);
scene.add(hemiLight);

const sunLight = new THREE.DirectionalLight(0xFFF5CC, 2.0);
sunLight.position.set(30, 50, 20);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 200;
sunLight.shadow.camera.left = -60;
sunLight.shadow.camera.right = 60;
sunLight.shadow.camera.top = 60;
sunLight.shadow.camera.bottom = -60;
scene.add(sunLight);

// Sky sphere
const skyGeo = new THREE.SphereGeometry(200, 16, 8);
skyGeo.scale(-1, 1, 1);
const skyMat = new THREE.MeshBasicMaterial({ color: C.sky_day });
const sky = new THREE.Mesh(skyGeo, skyMat);
scene.add(sky);

// ── BUILD ALL ─────────────────────────────────────────────────────────────────
buildTerrain();
buildPond();
buildPath();
buildPagoda();
buildTorii();
buildFence();
buildBridge();
buildTree('sakura', -5, -12);
buildTree('sakura', -10, -10);
buildTree('sakura', 12, -8);
buildTree('pine', 15, 10);
buildTree('pine', -15, -5);
buildTree('maple', 12, -14);
buildTree('maple', -18, 10);
buildTree('willow', -12, 14);
buildJizo(-3, -15);
buildJizo(3, -15);
buildFlowers();
buildLanterns();
buildKoi();
buildVoxels();  // commit all voxels to GPU

// ── CLICK DETECTION ──────────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
canvas.addEventListener('click', e => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const targets = [...lanternMeshes];
  const hits = raycaster.intersectObjects(targets);
  if (hits.length > 0) {
    const hit = hits[0].object;
    const idx = lanternMeshes.indexOf(hit);
    if (idx >= 0) {
      const ld = lanternLights[idx];
      ld.on = !ld.on;
      ld.light.intensity = ld.on ? 2 : 0;
      ld.body.material.emissiveIntensity = ld.on ? 0.5 : 0;
      controls.autoRotate = false;
      setTimeout(() => controls.autoRotate = true, 3000);
    }
  }
});

// ── CAMERA INTRO ─────────────────────────────────────────────────────────────
const introStart = performance.now();
const introDuration = 2500;
const introFrom = new THREE.Vector3(-22, 8, 2);
const introTo   = new THREE.Vector3(28, 18, 28);
camera.position.copy(introFrom);
let introActive = true;

// ── WINDOW RESIZE ─────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── HUD ───────────────────────────────────────────────────────────────────────
const statsEl = document.getElementById('stats');
let fps = 60, lastTime = performance.now(), frameCount = 0;

// ── DAY/NIGHT CYCLE ───────────────────────────────────────────────────────────
let cycleTime = 0;
const CYCLE_DURATION = 90;

function updateDayNight(dt) {
  cycleTime = (cycleTime + dt) % CYCLE_DURATION;
  const t = cycleTime / CYCLE_DURATION; // 0=dawn, 0.25=day, 0.5=dusk, 0.75=night
  const angle = t * Math.PI * 2 - Math.PI / 2;

  // Sun arc
  sunLight.position.set(
    Math.cos(angle) * 60,
    Math.sin(angle) * 60,
    20
  );

  // Sky color
  let skyCol;
  if (t < 0.25) {
    skyCol = new THREE.Color(C.sky_day).lerp(new THREE.Color(0xFFE0B2), 1 - t * 4);
  } else if (t < 0.5) {
    skyCol = new THREE.Color(C.sky_day);
  } else if (t < 0.6) {
    const f = (t - 0.5) / 0.1;
    skyCol = new THREE.Color(C.sky_day).lerp(new THREE.Color(C.sky_dusk), f);
  } else if (t < 0.7) {
    const f = (t - 0.6) / 0.1;
    skyCol = new THREE.Color(C.sky_dusk).lerp(new THREE.Color(C.sky_night), f);
  } else {
    skyCol = new THREE.Color(C.sky_night);
  }
  skyMat.color.copy(skyCol);
  scene.fog.color.copy(skyCol);

  // Sun intensity
  const sunIntensity = Math.max(0, Math.sin(angle + Math.PI / 2));
  sunLight.intensity = sunIntensity * 2.5;
  hemiLight.intensity = 0.3 + sunIntensity * 0.5;

  // Auto-lanterns at dusk
  const isDusk = t > 0.55;
  lanternLights.forEach(ld => {
    if (isDusk && !ld.on) {
      ld.on = true;
      ld.light.intensity = 2;
      ld.body.material.emissiveIntensity = 0.5;
    } else if (!isDusk && t < 0.05 && ld.on) {
      // dawn — don't force off, let user control
    }
  });

  return t;
}

// ── ANIMATE ───────────────────────────────────────────────────────────────────
const dummy = new THREE.Object3D();
let lastRender = performance.now();

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - lastRender) / 1000, 0.05);
  lastRender = now;

  // Camera intro
  if (introActive) {
    const elapsed = now - introStart;
    const p = Math.min(elapsed / introDuration, 1);
    const ease = 1 - Math.pow(1 - p, 3);
    camera.position.lerpVectors(introFrom, introTo, ease);
    if (p >= 1) introActive = false;
  }

  // Day/night
  const tod = updateDayNight(dt);

  // Koi
  koiMeshes.forEach(koi => {
    koi.userData.angle += koi.userData.speed;
    const a = koi.userData.angle;
    koi.position.x = -14 + Math.cos(a) * koi.userData.radius;
    koi.position.z =   8 + Math.sin(a) * koi.userData.radius * 0.6;
    koi.rotation.y = -a + Math.PI / 2;
    koi.position.y = -0.5 + Math.sin(a * 3) * 0.1;
  });

  // Petals
  petalData.forEach((p, i) => {
    p.x += p.vx + Math.sin(now * 0.001 + i) * 0.008;
    p.y += p.vy;
    p.z += p.vz + Math.cos(now * 0.001 + i) * 0.008;
    p.rot += p.rotSpeed;
    if (p.y < 0) {
      p.y = 20 + Math.random() * 10;
      p.x = (Math.random() - 0.5) * 40;
      p.z = (Math.random() - 0.5) * 40;
    }
    dummy.position.set(p.x, p.y, p.z);
    dummy.rotation.set(p.rot, p.rot * 0.7, 0);
    dummy.updateMatrix();
    petalGeo.setMatrixAt(i, dummy.matrix);
  });
  petalGeo.instanceMatrix.needsUpdate = true;

  // Lantern flicker
  lanternLights.forEach((ld, i) => {
    if (ld.on) {
      ld.light.intensity = 2 + Math.sin(now * 0.003 + i * 1.3) * 0.3 + Math.sin(now * 0.011 + i) * 0.15;
    }
  });

  // FPS
  frameCount++;
  if (now - lastTime > 500) {
    fps = Math.round(frameCount / ((now - lastTime) / 1000));
    frameCount = 0;
    lastTime = now;
    statsEl.textContent = `${totalVoxels.toLocaleString()} voxels | ${fps} FPS`;
  }

  controls.update();
  renderer.render(scene, camera);

  // Expose globals
  window.__VOXEL__ = {
    voxelCount: totalVoxels,
    fps,
    pagodaFloors: PAGODA_FLOORS,
    timeOfDay: tod,
  };
}

animate();
</script>
