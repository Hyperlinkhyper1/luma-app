    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      /* ============================================================
         VOXEL GARDEN — Spring Festival at the Five-Story Pagoda
         GPT 6 Astra (Max) — independent pagoda implementation (single scene file)
         Three.js r160 • BoxGeometry + InstancedMesh voxel engine
         ============================================================ */

      const errBox = document.getElementById("err");
      window.addEventListener("error", (e) => {
        errBox.style.display = "block";
        errBox.textContent = "Error: " + (e.message || e.error);
      });

      const V = 0.5;
      const PAGODA_FLOORS = 5;

      const C = {
        vermillion: 0xc73e1d,
        gold: 0xe8b86d,
        teak: 0x4a2c1a,
        teakDark: 0x33200f,
        jade: 0x2d6a4f,
        jadeLight: 0x40916c,
        sakura: 0xffb7c5,
        sakuraDeep: 0xff8fab,
        sakuraPale: 0xffe5ec,
        stone: 0x9aa0a6,
        stoneDark: 0x6f7479,
        stoneLight: 0xc9ced3,
        pond: 0x7ed6df,
        moss: 0x606c38,
        mossLight: 0x7a8c46,
        dirt: 0x5a3d24,
        rock: 0x7b7468,
        rockDark: 0x4e4a44,
        plaster: 0xf3e9d2,
        wood: 0x6b4423,
        bamboo: 0xb9a86a,
        bambooGreen: 0x7fa36a,
        maple: 0xd94f2b,
        mapleGold: 0xe9a13b,
        pine: 0x1f5c3d,
        pineDark: 0x14402a,
        willow: 0x6fae7a,
        glowWarm: 0xffc46b,
        white: 0xffffff,
        cloud: 0xf4f7fb,
      };

      const rnd = (() => { let s = 1337; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; })();
      const rr = (a, b) => a + (b - a) * rnd();
      const ri = (a, b) => Math.floor(rr(a, b + 1));
      const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
      const lerp = (a, b, t) => a + (b - a) * t;
      const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
      const easeInOut = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

      function h2(x, y) { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); }
      function h3(x, y, z) { const n = Math.sin(x * 12.9898 + y * 78.233 + z * 37.719) * 43758.5453; return n - Math.floor(n); }
      function vnoise(x, y) {
        const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
        const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
        const a = h2(xi, yi), b = h2(xi + 1, yi), c = h2(xi, yi + 1), d = h2(xi + 1, yi + 1);
        return lerp(lerp(a, b, u), lerp(c, d, u), v);
      }
      function fbm(x, y, oct = 4) {
        let s = 0, amp = 0.5, f = 1;
        for (let i = 0; i < oct; i++) { s += vnoise(x * f, y * f) * amp; f *= 2.03; amp *= 0.5; }
        return s;
      }

      class Vox {
        constructor() {
          this.groups = new Map();
          this.occ = new Set();
          this.count = 0;
        }
        key(x, y, z) {
          return Math.round(x / V) + "," + Math.round(y / V) + "," + Math.round(z / V);
        }
        add(x, y, z, color, opts = {}) {
          const gx = Math.round(x / V) * V;
          const gy = Math.round(y / V) * V;
          const gz = Math.round(z / V) * V;
          const k = this.key(gx, gy, gz);
          if (this.occ.has(k)) return false;
          this.occ.add(k);
          const e = opts.emissive ?? -1;
          const gk = color + "|" + e + "|" + (opts.transparent ? "t" : "o");
          let g = this.groups.get(gk);
          if (!g) {
            g = { color, opts, pts: [] };
            this.groups.set(gk, g);
          }
          g.pts.push({ x: gx, y: gy, z: gz });
          this.count++;
          return true;
        }
        box(cx, cy, cz, w, h, d, color, opts = {}) {
          const nx = Math.max(1, Math.round(w / V));
          const ny = Math.max(1, Math.round(h / V));
          const nz = Math.max(1, Math.round(d / V));
          const x0 = cx - (nx - 1) * V * 0.5;
          const y0 = cy - (ny - 1) * V * 0.5;
          const z0 = cz - (nz - 1) * V * 0.5;
          for (let ix = 0; ix < nx; ix++)
            for (let iy = 0; iy < ny; iy++)
              for (let iz = 0; iz < nz; iz++) this.add(x0 + ix * V, y0 + iy * V, z0 + iz * V, color, opts);
        }
        has(x, y, z) {
          return this.occ.has(this.key(x, y, z));
        }
      }

      function hashRand(seed) {
        let s = seed;
        return () => {
          s = (s * 16807) % 2147483647;
          return (s - 1) / 2147483646;
        };
      }

      function buildInstanced(builder, scene, emissiveMats) {
        const geo = new THREE.BoxGeometry(V * 0.98, V * 0.98, V * 0.98);
        let total = 0;
        const dummy = new THREE.Object3D();
        const col = new THREE.Color();
        builder.groups.forEach((g) => {
          const n = g.pts.length;
          if (!n) return;
          total += n;
          const mat = new THREE.MeshStandardMaterial({
            color: g.color,
            roughness: g.opts.roughness ?? 0.85,
            metalness: g.opts.metalness ?? 0.02,
            emissive: g.opts.emissive ?? 0x000000,
            emissiveIntensity: g.opts.emissiveIntensity ?? 1,
            transparent: g.opts.transparent ?? false,
            opacity: g.opts.opacity ?? 1,
          });
          if ((g.opts.emissive ?? 0) !== 0 || (g.opts.emissiveIntensity ?? 0) > 1) emissiveMats.push(mat);
          const mesh = new THREE.InstancedMesh(geo, mat, n);
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          for (let i = 0; i < n; i++) {
            const p = g.pts[i];
            dummy.position.set(p.x, p.y, p.z);
            dummy.rotation.set(0, 0, 0);
            dummy.scale.set(1, 1, 1);
            dummy.updateMatrix();
            mesh.setMatrixAt(i, dummy.matrix);
            const above = builder.has(p.x, p.y + V, p.z);
            const hShade = THREE.MathUtils.clamp(1 + p.y * 0.008, 0.82, 1.06);
            const j = 0.9 + ((i * 2654435761) % 1000) / 1000 * 0.18;
            const ao = above ? 0.72 : 1.0;
            const b = hShade * j * ao;
            col.setRGB(b, b, b);
            mesh.setColorAt(i, col);
          }
          mesh.instanceMatrix.needsUpdate = true;
          if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
          scene.add(mesh);
        });
        return total;
      }

      function islandEdge(angle) {
        return 15.2 + 1.3 * Math.sin(angle * 3 + 0.7) + 0.8 * Math.sin(angle * 5 + 1.3) + 0.4 * Math.sin(angle * 8);
      }
      function topYAt(x, z) {
        let h = 0.35 * Math.sin(x * 0.35) * Math.cos(z * 0.3) + 0.15 * Math.sin(x * 0.9 + z * 0.7);
        const dp = Math.hypot(x - 0, z + 4);
        h += 0.7 * Math.exp(-(dp * dp) / 22);
        const dn = Math.hypot(x + 3, z + 11);
        h += 0.7 * Math.exp(-(dn * dn) / 10);
        const dpond = Math.hypot(x - 7.5, z - 2.5);
        h -= 1.35 * Math.exp(-(dpond * dpond) / 9);
        const dw = Math.hypot((x - 10.5) / 2.2, (z - 5.2) / 1.1);
        if (dw < 1.4) h -= 0.9 * (1.4 - dw);
        return Math.round(h / V) * V;
      }

      /* ============ page state (replaces React state) ============ */
      const mount = document.getElementById("app");
      const statVox = document.getElementById("statVox");
      const statFps = document.getElementById("statFps");
      const timeLabelEl = document.getElementById("timeLabel");
      const btnPlay = document.getElementById("btnPlay");
      const slider = document.getElementById("tod");
      let tod = 18.3;
      let playing = true;

      /* ============ renderer / scene / camera ============ */
      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(mount.clientWidth, mount.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.12;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      mount.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87b5e0);
      scene.fog = new THREE.Fog(0x9fc3e8, 55, 140);

      const camera = new THREE.PerspectiveCamera(46, mount.clientWidth / mount.clientHeight, 0.1, 500);
      const camStart = new THREE.Vector3(1.5, 2.6, 19.5);
      const camEnd = new THREE.Vector3(19.5, 13.5, 23.5);
      camera.position.copy(camStart);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 9.5, -2);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.maxPolarAngle = Math.PI * 0.52;
      controls.minDistance = 8;
      controls.maxDistance = 70;
      controls.autoRotate = false;
      controls.autoRotateSpeed = 0.55;
      controls.enabled = false;

      /* ============ lights (1 dir + 1 hemi + 4 points) ============ */
      const sun = new THREE.DirectionalLight(0xffffff, 2.2);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.camera.left = -28;
      sun.shadow.camera.right = 28;
      sun.shadow.camera.top = 32;
      sun.shadow.camera.bottom = -24;
      sun.shadow.camera.near = 1;
      sun.shadow.camera.far = 120;
      sun.shadow.bias = -0.0006;
      sun.shadow.normalBias = 0.35;
      scene.add(sun);
      scene.add(sun.target);

      const hemi = new THREE.HemisphereLight(0xbfd9ff, 0x5c4a35, 0.85);
      scene.add(hemi);

      const lanternPositions = [
        new THREE.Vector3(-4.2, 0, 10.2),
        new THREE.Vector3(3.4, 0, 8.2),
        new THREE.Vector3(-6.4, 0, 0.6),
        new THREE.Vector3(6.8, 0, -1.4),
      ];
      const lanternLights = [];
      const lanternOn = [true, true, true, true];

      /* ============ voxel builders ============ */
      const staticVox = new Vox();
      const emissiveMats = [];

      /* ---- main flying island ---- */
      const islandCols = [];
      for (let ix = 0; ix < 64; ix++) {
        for (let iz = 0; iz < 64; iz++) {
          const x = (ix - 32) * V + V * 0.5;
          const z = (iz - 32) * V + V * 0.5;
          const r = Math.hypot(x, z);
          const ang = Math.atan2(z, x);
          const edge = islandEdge(ang);
          if (r > edge) continue;
          const top = topYAt(x, z);
          islandCols.push({ x, z, top, edge, r });
          const dpond = Math.hypot(x - 7.5, z - 2.5);
          const isPond = dpond < 3.6;
          if (isPond) {
            staticVox.add(x, top, z, C.stoneDark, { roughness: 0.95 });
            staticVox.add(x, top - V, z, C.stone, { roughness: 0.95 });
          } else {
            const mossMix = rnd();
            const gcol = mossMix < 0.55 ? C.moss : mossMix < 0.8 ? C.mossLight : C.jadeLight;
            staticVox.add(x, top, z, gcol, { roughness: 0.95 });
            if (rnd() < 0.1) staticVox.add(x, top + V, z, C.mossLight, { roughness: 1 });
          }
          staticVox.add(x, top - V * 1, z, isPond ? C.stone : C.dirt, { roughness: 1 });
          staticVox.add(x, top - V * 2, z, C.dirt, { roughness: 1 });
          staticVox.add(x, top - V * 3, z, rnd() < 0.5 ? C.rock : C.dirt, { roughness: 1 });
          const t = r / edge;
          const bottom = -2.5 - (1 - t) * 11;
          for (let y = top - V * 4; y > bottom; y -= V) {
            const yy = Math.round(y / V) * V;
            if (yy < -2.5) {
              const coneR = edge * (1 - (-2.5 - yy) / 11.5);
              const distIn = coneR - r;
              const nearSpine = Math.hypot(x, z + 1) < 1.6;
              if (distIn > 1.7 && !nearSpine && rnd() < 0.94) continue;
              if (rnd() < 0.3) continue;
            }
            let cc = C.rock;
            const rr2 = rnd();
            if (rr2 < 0.18) cc = C.rockDark;
            else if (rr2 < 0.3) cc = C.moss;
            else if (rr2 < 0.38) cc = C.dirt;
            if (y < bottom + V * 1.5 && rnd() < 0.6) continue;
            staticVox.add(x, yy, z, cc, { roughness: 1 });
          }
          if (r > edge - 1.1 && !isPond) {
            staticVox.add(x, top + V * 0, z, C.rock, { roughness: 1 });
            if (rnd() < 0.35) staticVox.add(x, top - V, z, C.moss, {});
          }
        }
      }
      for (let i = 0; i < 46; i++) {
        const a = rnd() * Math.PI * 2;
        const rr3 = rnd() * 4;
        const x = Math.cos(a) * rr3;
        const z = Math.sin(a) * rr3 * 0.8 - 1;
        const y = -13.2 - rnd() * 2.2 + (rr3 / 4) * 2;
        staticVox.add(x, y, z, i % 3 === 0 ? C.moss : C.rockDark, {});
        if (rnd() < 0.5) staticVox.add(x, y - V, z, C.willow, {});
      }

      /* ---- stone zig-zag path ---- */
      const pathPts = [];
      const zig = (x0, z0, x1, z1, segs, amp) => {
        for (let i = 0; i <= segs; i++) {
          const t = i / segs;
          const x = x0 + (x1 - x0) * t + (i % 2 === 0 ? amp : -amp) * Math.sin(t * Math.PI);
          const z = z0 + (z1 - z0) * t;
          pathPts.push([x, z]);
        }
      };
      zig(0.5, 13.2, 0.4, 6.5, 7, 1.1);
      zig(0.4, 6.5, 0, 0.5, 6, 1.2);
      zig(0, 0.5, 4.5, 2.2, 5, 0.9);
      pathPts.push([6.5, 2.4], [8.5, 2.6]);
      const pathTop = (x, z) => topYAt(x, z) + V;
      pathPts.forEach(([px, pz]) => {
        const y = pathTop(px, pz);
        for (let dx = -1; dx <= 1; dx++)
          for (let dz = -1; dz <= 1; dz++) {
            if (Math.abs(dx) + Math.abs(dz) > 2) continue;
            const shade = (dx + dz + 4) % 2 === 0 ? C.stoneLight : C.stone;
            staticVox.add(px + dx * V, y, pz + dz * V, shade, { roughness: 0.9 });
          }
      });

      /* ---- pagoda ---- */
      const PX = 0;
      const PZ = -4;
      const pagodaBaseTop = topYAt(PX, PZ) + V;
      staticVox.box(PX, pagodaBaseTop + 0.25, PZ, 9.6, 0.5, 9.6, C.stone, { roughness: 0.9 });
      staticVox.box(PX, pagodaBaseTop + 0.75, PZ, 8.6, 0.5, 8.6, C.stoneLight, { roughness: 0.9 });
      staticVox.box(PX, pagodaBaseTop + 1.2, PZ, 7.8, 0.4, 7.8, C.stone, { roughness: 0.9 });
      const floorBaseY = pagodaBaseTop + 1.4;
      const floorH = 3.1;
      const roofH = 1.35;
      const halfs = [3.7, 3.2, 2.72, 2.28, 1.88];

      const doorMeshes = [];
      const floorHitBoxes = [];
      const doorState = [
        { open: false, t: 0 },
        { open: false, t: 0 },
        { open: false, t: 0 },
        { open: false, t: 0 },
        { open: false, t: 0 },
      ];
      const doorPivots = [];

      function pagodaRoof(cx, y0, cz, half) {
        const layers = 5;
        for (let l = 0; l < layers; l++) {
          const w = half + 1.55 - l * 0.24;
          const y = y0 + l * V;
          const n = Math.round((w * 2) / V);
          for (let ix = 0; ix < n; ix++) {
            for (let iz = 0; iz < n; iz++) {
              const x = cx - w + ix * V + V * 0.5;
              const z = cz - w + iz * V + V * 0.5;
              const ex = Math.abs(x - cx) / w;
              const ez = Math.abs(z - cz) / w;
              const edge = Math.max(ex, ez);
              if (edge > 1) continue;
              let yy = y;
              const corner = ex * ez;
              if (corner > 0.45) yy += V * (corner > 0.72 ? 1 : 0.5);
              const inner = Math.max(ex, ez);
              if (l < layers - 1 && inner < 0.55 && l > 0) continue;
              const isTrim = edge > 0.86;
              const colr = isTrim ? C.gold : (ix + iz + l) % 2 === 0 ? C.jade : C.jadeLight;
              staticVox.add(x, yy, z, colr, {
                roughness: 0.7,
                metalness: isTrim ? 0.45 : 0.05,
              });
            }
          }
        }
        const uw = half + 1.15;
        const un = Math.round((uw * 2) / V);
        for (let ix = 0; ix < un; ix++) {
          for (let iz = 0; iz < un; iz++) {
            const x = cx - uw + ix * V + V * 0.5;
            const z = cz - uw + iz * V + V * 0.5;
            const edge = Math.max(Math.abs(x - cx) / uw, Math.abs(z - cz) / uw);
            if (edge > 1 || edge < 0.6) continue;
            staticVox.add(x, y0 - V * 0.5, z, C.teakDark, { roughness: 1 });
          }
        }
        staticVox.box(cx, y0 + layers * V + V * 0.2, cz, 1.1, 0.4, 1.1, C.gold, {
          metalness: 0.6,
          roughness: 0.35,
        });
      }

      let py = floorBaseY;
      const floorCenterY = [];
      for (let f = 0; f < PAGODA_FLOORS; f++) {
        const half = halfs[f];
        const y0 = py;
        const y1 = py + floorH;
        floorCenterY.push((y0 + y1) / 2);
        const n = Math.round((half * 2) / V);
        staticVox.box(PX, y0 + V * 0.5, PZ, half * 2 + 0.6, V, half * 2 + 0.6, C.teak, { roughness: 0.85 });
        staticVox.box(PX, y0 + floorH * 0.5, PZ, half * 1.1, floorH * 0.6, half * 1.1, C.glowWarm, {
          emissive: 0xff9a3c,
          emissiveIntensity: 1.6,
          roughness: 0.6,
        });
        for (let ix = 0; ix < n; ix++) {
          for (let iy = 0; iy < Math.round(floorH / V); iy++) {
            const y = y0 + V + iy * V;
            for (let iz = 0; iz < n; iz++) {
              const x = PX - half + ix * V + V * 0.5;
              const z = PZ - half + iz * V + V * 0.5;
              const ex = Math.abs(x - PX) / half;
              const ez = Math.abs(z - PZ) / half;
              const onFace = ex > 0.92 || ez > 0.92;
              if (!onFace) continue;
              const isCorner = ex > 0.92 && ez > 0.92;
              const isPillar = isCorner || (Math.round(ix % 3) === 0 && ex > 0.92) || (Math.round(iz % 3) === 0 && ez > 0.92);
              const southFace = z > PZ + half - V * 0.8;
              const doorW = Math.abs(x - PX) < 1.05;
              const doorH = y < y0 + V + 2.0;
              const isDoorHole = southFace && doorW && doorH && f < 5;
              if (isDoorHole) {
                continue;
              }
              const winBand = y > y0 + 1.3 && y < y0 + 2.4;
              const winSlot =
                winBand &&
                ((Math.abs(z - PZ) < 0.8 && Math.abs(x - PX) > half - V) ||
                  (Math.abs(x - PX) < 0.8 && Math.abs(z - PZ) > half - V) ||
                  (z < PZ - half + V && Math.abs(x - PX) < 0.9));
              if (winSlot && !isPillar) {
                staticVox.add(x, y, z, C.glowWarm, { emissive: 0xffb45e, emissiveIntensity: 2.0 });
                continue;
              }
              if (isPillar) staticVox.add(x, y, z, C.vermillion, { roughness: 0.7 });
              else {
                const beam = y < y0 + V * 1.5 || y > y1 - V * 1.2;
                staticVox.add(x, y, z, beam ? C.teak : C.plaster, { roughness: 0.85 });
              }
            }
          }
        }
        const rw = half + 0.45;
        const rn = Math.round((rw * 2) / V);
        for (let ix = 0; ix < rn; ix++) {
          for (let iz = 0; iz < rn; iz++) {
            const x = PX - rw + ix * V + V * 0.5;
            const z = PZ - rw + iz * V + V * 0.5;
            const edge = Math.max(Math.abs(x - PX) / rw, Math.abs(z - PZ) / rw);
            if (Math.abs(edge - 1) > 0.08) continue;
            staticVox.add(x, y0 + V * 1.4, z, C.teakDark, {});
            if ((ix + iz) % 3 === 0) staticVox.add(x, y0 + V * 2.2, z, C.gold, { metalness: 0.5, roughness: 0.4 });
            else staticVox.add(x, y0 + V * 2.0, z, C.vermillion, {});
          }
        }
        pagodaRoof(PX, y1, PZ, half);
        py = y1 + roofH;
      }
      const spireBase = py + 0.2;
      staticVox.box(PX, spireBase + 1.2, PZ, 0.7, 2.6, 0.7, C.teakDark, {});
      for (let r = 0; r < 9; r++) {
        const y = spireBase + 2.4 + r * 0.42;
        const w = 1.7 - r * 0.09;
        staticVox.box(PX, y, PZ, w, 0.22, w, C.gold, { metalness: 0.65, roughness: 0.3 });
        staticVox.box(PX, y + 0.2, PZ, 0.4, 0.22, 0.4, C.teakDark, {});
      }
      staticVox.box(PX, spireBase + 2.4 + 9 * 0.42 + 0.55, PZ, 0.7, 0.7, 0.7, C.gold, {
        emissive: 0xffd88a,
        emissiveIntensity: 1.4,
        metalness: 0.7,
        roughness: 0.25,
      });

      /* ---- pond edging stones ---- */
      for (let a = 0; a < 26; a++) {
        const th = (a / 26) * Math.PI * 2;
        const ex = 7.5 + Math.cos(th) * (3.9 + 0.3 * Math.sin(th * 3));
        const ez = 2.5 + Math.sin(th) * (3.1 + 0.3 * Math.cos(th * 2));
        const y = topYAt(ex, ez) + V * 0.5;
        staticVox.add(ex, y, ez, a % 2 ? C.stone : C.stoneLight, { roughness: 0.9 });
      }

      /* ---- arched wooden bridge ---- */
      for (let i = 0; i <= 14; i++) {
        const t = i / 14;
        const x = 4 + t * 7;
        const arch = Math.sin(t * Math.PI) * 1.25;
        const y = topYAt(x, 2.5) + 0.9 + arch;
        for (let w = -1; w <= 1; w++) {
          staticVox.add(x, y, 2.5 + w * V, C.wood, { roughness: 0.8 });
          staticVox.add(x, y - V, 2.5 + w * V, C.teak, {});
        }
        if (i % 2 === 0) {
          staticVox.add(x, y + V, 2.5 - V, C.vermillion, {});
          staticVox.add(x, y + V, 2.5 + V, C.vermillion, {});
          staticVox.add(x, y + V * 2, 2.5 - V, C.gold, { metalness: 0.4, roughness: 0.4 });
          staticVox.add(x, y + V * 2, 2.5 + V, C.gold, { metalness: 0.4, roughness: 0.4 });
        }
        staticVox.add(x, y + V * 1.5, 2.5 - V, C.vermillion, {});
        staticVox.add(x, y + V * 1.5, 2.5 + V, C.vermillion, {});
      }

      /* ---- torii gate ---- */
      {
        const tx = 0.5;
        const tz = 13.4;
        const ty = topYAt(tx, tz) + V;
        for (let iy = 0; iy < 9; iy++) {
          staticVox.add(tx - 2.2, ty + iy * V, tz, C.vermillion, { roughness: 0.65 });
          staticVox.add(tx + 2.2, ty + iy * V, tz, C.vermillion, { roughness: 0.65 });
          if (iy < 2) {
            staticVox.add(tx - 2.2, ty + iy * V, tz + V, C.stoneDark, {});
            staticVox.add(tx + 2.2, ty + iy * V, tz + V, C.stoneDark, {});
          }
        }
        for (let ix = -7; ix <= 7; ix++) {
          const curve = Math.abs(ix) > 4 ? V : 0;
          staticVox.add(tx + ix * V, ty + 9 * V + curve, tz, C.vermillion, { roughness: 0.6 });
          staticVox.add(tx + ix * V, ty + 9 * V + V + curve, tz, C.teakDark, {});
          staticVox.add(tx + ix * V * 0.8, ty + 7 * V, tz, C.vermillion, {});
        }
        staticVox.box(tx, ty + 10 * V, tz, 1.2, 0.6, 1.0, C.gold, { metalness: 0.55, roughness: 0.35 });
      }

      /* ---- bamboo fence ---- */
      for (let iz = 0; iz < 22; iz++) {
        const z = -6 + iz * V;
        const x = -12.6 + 0.25 * Math.sin(iz * 0.7);
        const y = topYAt(x, z) + V;
        staticVox.add(x, y + V, z, iz % 2 ? C.bamboo : C.bambooGreen, { roughness: 0.8 });
        staticVox.add(x, y + V * 2, z, iz % 2 ? C.bambooGreen : C.bamboo, { roughness: 0.8 });
        if (iz % 4 === 0) staticVox.add(x, y + V * 2.6, z, C.teakDark, {});
      }
      for (let k = 0; k < 22; k++) {
        const z = -6 + k * V;
        const x = -12.6;
        const y = topYAt(x, z);
        staticVox.add(x + V * 0.4, y + V * 1.6, z, C.teak, {});
        staticVox.add(x + V * 0.4, y + V * 2.4, z, C.teak, {});
      }

      /* ---- 4 stone lanterns ---- */
      const lanternFireY = [];
      lanternPositions.forEach((lp) => {
        const gy = topYAt(lp.x, lp.z) + V;
        lp.y = gy;
        staticVox.box(lp.x, gy + 0.25, lp.z, 1.0, 0.5, 1.0, C.stoneDark, {});
        staticVox.add(lp.x, gy + V * 1.4, lp.z, C.stone, {});
        staticVox.box(lp.x, gy + 1.15, lp.z, 0.9, 0.7, 0.9, C.stoneLight, {});
        staticVox.box(lp.x, gy + 1.15, lp.z, 0.55, 0.45, 0.55, C.glowWarm, {
          emissive: 0xffa63d,
          emissiveIntensity: 2.4,
        });
        staticVox.box(lp.x, gy + 1.75, lp.z, 1.15, 0.3, 1.15, C.stoneDark, {});
        staticVox.add(lp.x, gy + 2.15, lp.z, C.stone, {});
        staticVox.add(lp.x, gy + 2.6, lp.z, C.gold, { emissive: 0xffc46b, emissiveIntensity: 1.2, metalness: 0.4, roughness: 0.4 });
        lanternFireY.push(gy + 1.15);
        const pl = new THREE.PointLight(0xffa94d, 14, 13, 1.8);
        pl.position.set(lp.x, gy + 1.5, lp.z);
        pl.castShadow = false;
        scene.add(pl);
        lanternLights.push(pl);
      });

      /* ---- 2 jizo statues ---- */
      const jizoPos = [
        [4.6, 5.4],
        [-3.4, 4.4],
      ];
      jizoPos.forEach(([jx, jz], idx) => {
        const y = topYAt(jx, jz) + V;
        staticVox.box(jx, y + 0.25, jz, 0.9, 0.5, 0.9, C.stoneDark, {});
        staticVox.box(jx, y + 0.9, jz, 0.65, 0.8, 0.6, C.stoneLight, { roughness: 0.85 });
        staticVox.box(jx, y + 1.55, jz, 0.55, 0.5, 0.5, C.stoneLight, {});
        staticVox.add(jx, y + 0.95, jz + V * 0.55, C.vermillion, {});
        staticVox.add(jx, y + 1.2, jz + V * 0.55, C.vermillion, {});
        if (idx === 0) staticVox.add(jx, y + 1.95, jz, C.mapleGold, { emissive: 0x664411, emissiveIntensity: 0.4 });
      });

      /* ---- trees: exactly 8 ---- */
      function trunk(x, y, z, h) {
        const n = Math.round(h / V);
        for (let i = 0; i < n; i++) {
          staticVox.add(x, y + i * V, z, C.teak, { roughness: 1 });
          if (i > 1 && i % 2 === 0) staticVox.add(x + V * (i % 4 === 0 ? 1 : -1), y + i * V, z, C.teak, {});
        }
      }
      function canopyBlob(x, y, z, r, colors, density = 0.72) {
        const n = Math.ceil(r / V);
        for (let ix = -n; ix <= n; ix++)
          for (let iy = -n; iy <= n; iy++)
            for (let iz = -n; iz <= n; iz++) {
              const d = Math.sqrt(ix * ix + iy * iy * 1.25 + iz * iz);
              if (d > n) continue;
              if (rnd() > density * (1.15 - d / (n + 0.5))) continue;
              const c = colors[Math.floor(rnd() * colors.length)];
              staticVox.add(x + ix * V, y + iy * V, z + iz * V, c, { roughness: 0.95 });
            }
      }
      const sakuraCols = [C.sakura, C.sakuraDeep, C.sakuraPale];
      const sakuras = [
        [-8.2, 6.2],
        [9.6, -6.4],
        [-9.4, -7.2],
      ];
      const sakuraTops = [];
      sakuras.forEach(([sx, sz]) => {
        const y = topYAt(sx, sz) + V;
        trunk(sx, y, sz, 2.6);
        staticVox.add(sx + V, y + 2.4, sz, C.teak, {});
        staticVox.add(sx - V, y + 2.6, sz + V, C.teak, {});
        canopyBlob(sx, y + 4.1, sz, 2.3, sakuraCols, 0.8);
        canopyBlob(sx + 1.4, y + 3.4, sz + 0.6, 1.4, sakuraCols, 0.75);
        canopyBlob(sx - 1.3, y + 3.5, sz - 0.5, 1.3, sakuraCols, 0.75);
        sakuraTops.push(new THREE.Vector3(sx, y + 4.1, sz));
      });
      const pines = [
        [-3.2, -11.2],
        [11.8, -2.2],
      ];
      pines.forEach(([px, pz]) => {
        const y = topYAt(px, pz) + V;
        trunk(px, y, pz, 2.2);
        const layers = [
          [3.2, 2.0],
          [4.1, 1.6],
          [4.9, 1.2],
          [5.6, 0.8],
        ];
        layers.forEach(([ly, lr], li) => {
          const n = Math.ceil(lr / V);
          for (let ix = -n; ix <= n; ix++)
            for (let iz = -n; iz <= n; iz++) {
              if (Math.abs(ix) + Math.abs(iz) > n + 1) continue;
              if (rnd() < 0.2) continue;
              staticVox.add(px + ix * V, y + ly, pz + iz * V, li % 2 ? C.pine : C.pineDark, { roughness: 1 });
            }
        });
        staticVox.add(px, y + 6.1, pz, C.pine, {});
      });
      const maples = [
        [-11.2, 1.2],
        [6.2, 9.4],
      ];
      maples.forEach(([mx, mz]) => {
        const y = topYAt(mx, mz) + V;
        trunk(mx, y, mz, 2.3);
        canopyBlob(mx, y + 3.7, mz, 1.9, [C.maple, C.mapleGold, C.vermillion], 0.78);
        canopyBlob(mx + 1.1, y + 3.0, mz - 0.7, 1.1, [C.mapleGold, C.maple], 0.7);
      });
      {
        const [wx, wz] = [12.2, 4.6];
        const y = topYAt(wx, wz) + V;
        trunk(wx, y, wz, 2.8);
        canopyBlob(wx, y + 3.9, wz, 1.6, [C.willow, C.mossLight], 0.8);
        for (let s = 0; s < 14; s++) {
          const a = (s / 14) * Math.PI * 2;
          const sx = wx + Math.cos(a) * 1.3;
          const sz = wz + Math.sin(a) * 1.3;
          const len = 3 + Math.floor(rnd() * 3);
          for (let k = 0; k < len; k++) {
            staticVox.add(sx + Math.sin(k * 1.2 + s) * 0.12, y + 3.5 - k * V, sz, k % 2 ? C.willow : C.mossLight, {});
          }
        }
      }

      /* ---- 40 flowers (exact) ---- */
      const flowerCols = [C.sakuraDeep, C.white, C.mapleGold, C.vermillion, C.sakuraPale];
      const flowerSpots = [];
      let guard = 0;
      while (flowerSpots.length < 40 && guard++ < 3000) {
        const a = rnd() * Math.PI * 2;
        const r = 3 + rnd() * 10;
        const x = Math.cos(a) * r;
        const z = Math.sin(a) * r * 0.9 + 1;
        const dpond = Math.hypot(x - 7.5, z - 2.5);
        if (dpond < 4.1) continue;
        const dpag = Math.hypot(x - PX, z - PZ);
        if (dpag < 4.6) continue;
        if (Math.abs(x) < 1.6 && z > -1 && z < 13.5) continue;
        if (Math.hypot(x, z) > islandEdge(Math.atan2(z, x)) - 1.2) continue;
        if (flowerSpots.some(([fx, fz]) => Math.hypot(fx - x, fz - z) < 0.8)) continue;
        flowerSpots.push([Math.round(x / V) * V, Math.round(z / V) * V]);
      }
      flowerSpots.slice(0, 40).forEach(([fx, fz], i) => {
        const y = topYAt(fx, fz) + V;
        staticVox.add(fx, y + V * 0.5, fz, C.mossLight, {});
        staticVox.add(fx, y + V, fz, flowerCols[i % flowerCols.length], {
          emissive: i % 7 === 0 ? 0x553322 : 0x000000,
          emissiveIntensity: 0.5,
        });
      });

      /* ---- scattered rocks + moss bushes ---- */
      for (let i = 0; i < 120; i++) {
        const a = rnd() * Math.PI * 2;
        const r = 4 + rnd() * 10.5;
        const x = Math.cos(a) * r;
        const z = Math.sin(a) * r;
        if (Math.hypot(x - 7.5, z - 2.5) < 4.2) continue;
        if (Math.hypot(x - PX, z - PZ) < 5) continue;
        if (r > islandEdge(a) - 0.8) continue;
        const y = topYAt(x, z) + V;
        if (rnd() < 0.5) {
          staticVox.add(x, y + V * 0.4, z, rnd() < 0.5 ? C.stone : C.stoneDark, {});
          if (rnd() < 0.4) staticVox.add(x + V, y + V * 0.4, z, C.stone, {});
        } else {
          staticVox.add(x, y + V * 0.4, z, C.moss, {});
          staticVox.add(x, y + V * 1.2, z, C.mossLight, {});
        }
      }

      /* ---- build static instanced voxels ---- */
      const staticGroup = new THREE.Group();
      scene.add(staticGroup);
      let voxelCount = buildInstanced(staticVox, staticGroup, emissiveMats);

      /* ---- floating islands ---- */
      const floaters = [];
      function makeFloater(cx, cy, cz, rad, seed, deco) {
        const b = new Vox();
        const rr4 = hashRand(seed);
        const R = Math.round(rad / V);
        for (let ix = -R; ix <= R; ix++)
          for (let iz = -R; iz <= R; iz++) {
            const d = Math.hypot(ix, iz);
            if (d > R + (rr4() - 0.5)) continue;
            b.add(cx + ix * V, cy, cz + iz * V, rr4() < 0.6 ? C.moss : C.mossLight, { roughness: 1 });
            b.add(cx + ix * V, cy - V, cz + iz * V, C.dirt, {});
            const depth = Math.round((1 - d / (R + 1)) * 5) + 1;
            for (let k = 2; k < 2 + depth; k++) {
              if (rr4() < 0.15 && k > 3) continue;
              b.add(cx + ix * V, cy - k * V, cz + iz * V, rr4() < 0.7 ? C.rock : C.rockDark, {});
            }
          }
        b.add(cx, cy - (Math.round(rad / V) + 1) * V, cz, C.rockDark, {});
        if (deco === "rock") {
          b.add(cx + V, cy + V, cz, C.stone, {});
          b.add(cx - V, cy + V, cz + V, C.moss, {});
          b.add(cx, cy + V * 2, cz - V, C.stoneLight, {});
        } else if (deco === "bush") {
          b.add(cx, cy + V, cz, C.teak, {});
          b.add(cx, cy + V * 2, cz, C.sakura, {});
          b.add(cx + V, cy + V * 2, cz, C.sakuraPale, {});
          b.add(cx, cy + V * 2, cz + V, C.sakuraDeep, {});
        } else {
          b.add(cx, cy + V, cz, C.stone, {});
          b.box(cx, cy + V * 2.4, cz, 0.6, 0.6, 0.6, C.glowWarm, { emissive: 0xffa63d, emissiveIntensity: 2.2 });
          b.add(cx, cy + V * 3.4, cz, C.stoneDark, {});
        }
        const g = new THREE.Group();
        scene.add(g);
        voxelCount += buildInstanced(b, g, emissiveMats);
        floaters.push({ g, baseY: 0, ph: seed * 0.13, sp: 0.5 + (seed % 5) * 0.08 });
        return g;
      }
      makeFloater(15.5, 6.5, -10.5, 3.1, 11, "rock");
      makeFloater(-16.5, 3.2, 2.5, 2.3, 27, "lantern");
      makeFloater(11.5, 9.5, 12.5, 2.6, 43, "bush");

      /* ---- pond water ---- */
      const pondGeo = new THREE.CircleGeometry(3.55, 40, 0, Math.PI * 2);
      pondGeo.rotateX(-Math.PI / 2);
      const pondMat = new THREE.MeshStandardMaterial({
        color: C.pond,
        transparent: true,
        opacity: 0.82,
        roughness: 0.15,
        metalness: 0.1,
        emissive: 0x1a4a55,
        emissiveIntensity: 0.35,
      });
      const pondY = topYAt(7.5, 2.5) + 0.42;
      const pond = new THREE.Mesh(pondGeo, pondMat);
      pond.position.set(7.5, pondY, 2.5);
      pond.receiveShadow = true;
      scene.add(pond);
      const pondBase = pondGeo.attributes.position.array.slice();

      /* ---- waterfall ---- */
      const fallTop = new THREE.Vector3(12.4, topYAt(12.4, 5.2) + 0.35, 5.2);
      const fallH = fallTop.y + 15;
      const cnv = document.createElement("canvas");
      cnv.width = 64;
      cnv.height = 256;
      const ctx = cnv.getContext("2d");
      ctx.fillStyle = "#9fe8f2";
      ctx.fillRect(0, 0, 64, 256);
      for (let i = 0; i < 260; i++) {
        ctx.fillStyle = `rgba(255,255,255,${0.25 + Math.random() * 0.6})`;
        const w = 1 + Math.random() * 3;
        ctx.fillRect(Math.random() * 64, Math.random() * 256, w, 6 + Math.random() * 22);
      }
      const fallTex = new THREE.CanvasTexture(cnv);
      fallTex.wrapS = fallTex.wrapT = THREE.RepeatWrapping;
      fallTex.repeat.set(1, 2);
      const fallMat = new THREE.MeshStandardMaterial({
        color: 0xbdf3fa,
        map: fallTex,
        transparent: true,
        opacity: 0.9,
        roughness: 0.2,
        emissive: 0x3d8fa3,
        emissiveIntensity: 0.5,
        side: THREE.DoubleSide,
      });
      const fall = new THREE.Mesh(new THREE.PlaneGeometry(1.9, fallH, 1, 24), fallMat);
      fall.position.set(fallTop.x + 0.9, fallTop.y - fallH / 2 + 0.2, fallTop.z);
      fall.rotation.y = -Math.PI / 2 + 0.35;
      scene.add(fall);
      {
        const s = new Vox();
        for (let i = 0; i <= 8; i++) {
          const t = i / 8;
          const x = 7.5 + (fallTop.x - 7.5) * t;
          const z = 2.5 + (fallTop.z - 2.5) * t;
          const y = pondY + 0.06 - t * 0.35;
          s.add(x, y, z, C.pond, { transparent: true, opacity: 0.85, roughness: 0.15, emissive: 0x1a4a55, emissiveIntensity: 0.4 });
          s.add(x, y, z + V * 0.7, C.pond, { transparent: true, opacity: 0.85, roughness: 0.15 });
        }
        const sg = new THREE.Group();
        scene.add(sg);
        voxelCount += buildInstanced(s, sg, emissiveMats);
      }
      const mistGeo = new THREE.BufferGeometry();
      const mistN = 60;
      const mistPos = new Float32Array(mistN * 3);
      for (let i = 0; i < mistN; i++) {
        mistPos[i * 3] = fall.position.x + (Math.random() - 0.5) * 2.4;
        mistPos[i * 3 + 1] = fall.position.y - fallH / 2 + Math.random() * 2;
        mistPos[i * 3 + 2] = fall.position.z + (Math.random() - 0.5) * 2.4;
      }
      mistGeo.setAttribute("position", new THREE.BufferAttribute(mistPos, 3));
      const mistMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.55, transparent: true, opacity: 0.65, depthWrite: false });
      const mist = new THREE.Points(mistGeo, mistMat);
      scene.add(mist);

      /* ---- cloud sea below + drifting voxel clouds ---- */
      const cloudGroup = new THREE.Group();
      scene.add(cloudGroup);
      {
        const b = new Vox();
        const cr = hashRand(99);
        for (let c = 0; c < 16; c++) {
          const a = cr() * Math.PI * 2;
          const r = 16 + cr() * 22;
          const x = Math.cos(a) * r;
          const z = Math.sin(a) * r * 0.9;
          const y = -17 - cr() * 4;
          const s = 1.5 + cr() * 2.5;
          const n = Math.round(s / V);
          for (let ix = -n; ix <= n; ix++)
            for (let iz = -n; iz <= n; iz++)
              for (let iy = 0; iy < 2; iy++) {
                if (Math.hypot(ix, iz) > n) continue;
                if (cr() < 0.3) continue;
                b.add(x + ix * V, y + iy * V, z + iz * V, C.cloud, { roughness: 1 });
              }
        }
        voxelCount += buildInstanced(b, cloudGroup, emissiveMats);
        const discMat = new THREE.MeshBasicMaterial({ color: 0xdfe9f5, transparent: true, opacity: 0.5, depthWrite: false });
        for (let i = 0; i < 5; i++) {
          const d = new THREE.Mesh(new THREE.CircleGeometry(16 + i * 5, 32), discMat);
          d.rotation.x = -Math.PI / 2;
          d.position.set((Math.random() - 0.5) * 20, -19 - i * 1.6, (Math.random() - 0.5) * 20);
          cloudGroup.add(d);
        }
      }

      /* ---- pagoda doors + floor hit boxes ---- */
      const woodMat = new THREE.MeshStandardMaterial({ color: 0x6b3a1e, roughness: 0.8 });
      const woodMat2 = new THREE.MeshStandardMaterial({ color: 0x7d4a26, roughness: 0.8 });
      for (let f = 0; f < PAGODA_FLOORS; f++) {
        const half = halfs[f];
        const y0 = floorCenterY[f] - floorH / 2;
        const doorY = y0 + V + 1.0;
        const zFace = PZ + half + 0.12;
        const mkDoor = (off, mat) => {
          const pivot = new THREE.Group();
          pivot.position.set(PX + off, doorY, zFace);
          const panel = new THREE.Mesh(new THREE.BoxGeometry(0.95, 2.0, 0.14), mat);
          panel.position.x = off < 0 ? 0.475 : -0.475;
          panel.castShadow = true;
          pivot.add(panel);
          const knob = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 8), new THREE.MeshStandardMaterial({ color: C.gold, metalness: 0.7, roughness: 0.3 }));
          knob.position.set(off < 0 ? 0.8 : -0.8, 0, 0.12);
          pivot.add(knob);
          scene.add(pivot);
          doorMeshes.push(panel);
          panel.userData.floor = f;
          return pivot;
        };
        const l = mkDoor(-0.5, woodMat);
        const r = mkDoor(0.5, woodMat2);
        doorPivots.push({ l, r });
        const hit = new THREE.Mesh(
          new THREE.BoxGeometry(half * 2 + 1, floorH + 0.6, half * 2 + 1),
          new THREE.MeshBasicMaterial({ visible: false })
        );
        hit.position.set(PX, floorCenterY[f], PZ);
        hit.userData.floor = f;
        scene.add(hit);
        floorHitBoxes.push(hit);
      }
      const lanternHits = [];
      lanternPositions.forEach((lp, i) => {
        const h = new THREE.Mesh(new THREE.SphereGeometry(1.15, 8, 8), new THREE.MeshBasicMaterial({ visible: false }));
        h.position.set(lp.x, lp.y + 1.3, lp.z);
        h.userData.lantern = i;
        scene.add(h);
        lanternHits.push(h);
      });

      /* ---- koi ---- */
      const kois = [];
      const koiCols = [0xff6b35, 0xffffff, 0xffd166, 0x222222, 0xff8fab, 0xff9e00];
      for (let i = 0; i < 6; i++) {
        const g = new THREE.Group();
        const bodyMat = new THREE.MeshStandardMaterial({ color: koiCols[i], roughness: 0.5 });
        const body = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 8), bodyMat);
        body.scale.set(1.7, 0.6, 0.7);
        g.add(body);
        const tail = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.22), new THREE.MeshStandardMaterial({ color: koiCols[i], side: THREE.DoubleSide, roughness: 0.6 }));
        tail.position.x = -0.45;
        g.add(tail);
        scene.add(g);
        kois.push({ g, tail, t: (i / 6) * Math.PI * 2, sp: 0.35 + (i % 3) * 0.12, r: 1.4 + (i % 3) * 0.65, cx: 7.5, cz: 2.5, col: koiCols[i] });
      }

      /* ---- sakura petals ---- */
      const PETALS = 170;
      const petalGeo = new THREE.PlaneGeometry(0.16, 0.12);
      const petalMat = new THREE.MeshStandardMaterial({ color: 0xffffff, side: THREE.DoubleSide, roughness: 0.7 });
      const petals = new THREE.InstancedMesh(petalGeo, petalMat, PETALS);
      petals.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      scene.add(petals);
      const petalData = [];
      for (let i = 0; i < PETALS; i++) {
        petalData.push({
          x: (Math.random() - 0.5) * 26,
          y: Math.random() * 14 + 1,
          z: (Math.random() - 0.5) * 26,
          vy: 0.5 + Math.random() * 0.7,
          ph: Math.random() * Math.PI * 2,
          sw: 0.5 + Math.random(),
          src: sakuraTops[i % sakuraTops.length],
        });
      }
      {
        const c = new THREE.Color();
        for (let i = 0; i < PETALS; i++) {
          c.set([C.sakura, C.sakuraDeep, C.sakuraPale][i % 3]);
          petals.setColorAt(i, c);
        }
        if (petals.instanceColor) petals.instanceColor.needsUpdate = true;
      }

      /* ---- birds ---- */
      const birds = [];
      const birdMat = new THREE.MeshBasicMaterial({ color: 0x2b2b33, side: THREE.DoubleSide });
      for (let i = 0; i < 7; i++) {
        const g = new THREE.Group();
        const wl = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.32), birdMat);
        wl.position.x = -0.45;
        const wr = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.32), birdMat);
        wr.position.x = 0.45;
        g.add(wl, wr);
        scene.add(g);
        birds.push({ g, wl, wr, t: (i / 7) * Math.PI * 2, r: 16 + (i % 3) * 5, h: 20 + (i % 4) * 2.5, sp: 0.14 + (i % 3) * 0.03 });
      }

      /* ---- stars ---- */
      const starGeo = new THREE.BufferGeometry();
      const starN = 350;
      const starPos = new Float32Array(starN * 3);
      for (let i = 0; i < starN; i++) {
        const a = Math.random() * Math.PI * 2;
        const e = Math.random() * Math.PI * 0.45 + 0.08;
        const R = 160;
        starPos[i * 3] = Math.cos(a) * Math.cos(e) * R;
        starPos[i * 3 + 1] = Math.sin(e) * R;
        starPos[i * 3 + 2] = Math.sin(a) * Math.cos(e) * R;
      }
      starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
      const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.9, transparent: true, opacity: 0, depthWrite: false, sizeAttenuation: false });
      scene.add(new THREE.Points(starGeo, starMat));

      /* ---- moon ---- */
      const moon = new THREE.Mesh(new THREE.SphereGeometry(3, 16, 16), new THREE.MeshBasicMaterial({ color: 0xf4f1de }));
      scene.add(moon);

      /* ============ interaction ============ */
      const ray = new THREE.Raycaster();
      const ptr = new THREE.Vector2();
      let idleTimer = null;
      const goIdle = () => {
        controls.autoRotate = true;
      };
      controls.addEventListener("start", () => {
        controls.autoRotate = false;
        if (idleTimer) clearTimeout(idleTimer);
      });
      controls.addEventListener("end", () => {
        if (idleTimer) clearTimeout(idleTimer);
        idleTimer = setTimeout(goIdle, 5000);
      });

      const onClick = (e) => {
        const rect = renderer.domElement.getBoundingClientRect();
        ptr.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        ptr.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        ray.setFromCamera(ptr, camera);
        const lh = ray.intersectObjects(lanternHits, false);
        if (lh.length) {
          const i = lh[0].object.userData.lantern;
          lanternOn[i] = !lanternOn[i];
          return;
        }
        const fh = ray.intersectObjects([...doorMeshes, ...floorHitBoxes], false);
        if (fh.length) {
          const f = fh[0].object.userData.floor;
          if (f !== undefined) doorState[f].open = !doorState[f].open;
        }
      };
      renderer.domElement.addEventListener("pointerdown", (e) => {
        renderer.domElement.dataset.px = String(e.clientX);
        renderer.domElement.dataset.py = String(e.clientY);
      });
      renderer.domElement.addEventListener("pointerup", (e) => {
        const px = Number(renderer.domElement.dataset.px || e.clientX);
        const py = Number(renderer.domElement.dataset.py || e.clientY);
        if (Math.hypot(e.clientX - px, e.clientY - py) < 6) onClick(e);
      });

      /* ============ day/night + animation ============ */
      const clock = new THREE.Clock();
      let fpsEMA = 60;
      let hudTimer = 0;
      let introT = 0;
      const introDur = 2.5;
      let introDone = false;

      const skyDay = new THREE.Color(0x8ec9ee);
      const skyDusk = new THREE.Color(0xf2a06b);
      const skyNight = new THREE.Color(0x0b1026);
      const skyDawn = new THREE.Color(0xf7c8c4);
      const tmpSky = new THREE.Color();
      const fogDay = new THREE.Color(0x9fc3e8);
      const fogNight = new THREE.Color(0x11182e);

      const hourLabel = (t) => {
        const h = Math.floor(t);
        const m = Math.floor((t - h) * 60);
        const name = t < 4.5 || t >= 19.5 ? "Night" : t < 6.5 ? "Dawn" : t < 16.5 ? "Day" : t < 18.8 ? "Dusk" : "Twilight";
        return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")} · ${name}`;
      };

      window.__VOXEL__ = { voxelCount, fps: 60, pagodaFloors: 5, timeOfDay: tod };

      let raf = 0;
      const dummyP = new THREE.Object3D();
      const animate = () => {
        raf = requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);
        const t = clock.elapsedTime;
        if (dt > 0) fpsEMA += ((1 / dt) - fpsEMA) * 0.05;

        if (playing) tod = (tod + (dt * 24) / 90) % 24;
        void raf;

        const sunA = ((tod - 6) / 24) * Math.PI * 2;
        const sunEl = Math.sin(sunA);
        const sunX = Math.cos(sunA) * 45;
        const sunY = sunEl * 42 + 6;
        const sunZ = -12 + Math.cos(sunA * 0.5) * 10;
        sun.position.set(sunX, Math.max(sunY, -20), sunZ);
        const isNight = sunEl < -0.08;
        const duskF = THREE.MathUtils.clamp(1 - Math.abs(sunEl) * 3.2, 0, 1);

        if (!isNight && sunEl > 0.25) tmpSky.copy(skyDay).lerp(skyDusk, duskF * 0.55);
        else if (!isNight) tmpSky.copy(skyDawn).lerp(skyDusk, 0.5 + duskF * 0.3).lerp(skyDay, THREE.MathUtils.clamp(sunEl * 3, 0, 0.6));
        else tmpSky.copy(skyNight).lerp(skyDusk, THREE.MathUtils.clamp(1 + sunEl * 4, 0, 1) * 0.5);
        scene.background.copy(tmpSky);
        scene.fog.color.copy(tmpSky).lerp(isNight ? fogNight : fogDay, 0.45);
        starMat.opacity += ((isNight ? 0.9 : 0) - starMat.opacity) * 0.03;

        sun.intensity = isNight ? 0.28 : 1.6 + sunEl * 1.1;
        sun.color.set(isNight ? 0x8fa8ff : duskF > 0.4 ? 0xffb27a : 0xfff4e0);
        hemi.intensity = isNight ? 0.32 : 0.75 + sunEl * 0.3;
        hemi.color.set(isNight ? 0x2a3a66 : 0xbfd9ff);
        hemi.groundColor.set(isNight ? 0x1a1a2e : 0x5c4a35);
        renderer.toneMappingExposure = isNight ? 1.0 : 1.12;

        moon.position.set(-sunX * 1.8, Math.max(-sunY, 4) + 22, -sunZ * 1.5 - 20);
        moon.visible = sunEl < 0.18;

        const nightF = isNight ? 1 : duskF > 0.25 ? 0.85 : 0.12;
        lanternLights.forEach((pl, i) => {
          const flick = 1 + Math.sin(t * 11 + i * 2.4) * 0.07 + Math.sin(t * 23 + i) * 0.04;
          const target = lanternOn[i] ? (2 + nightF * 13) * flick : 0;
          pl.intensity += (target - pl.intensity) * 0.12;
        });

        for (let f = 0; f < PAGODA_FLOORS; f++) {
          const st = doorState[f];
          const target = st.open ? 1 : 0;
          st.t += (target - st.t) * Math.min(1, dt * 5);
          if (Math.abs(st.t - target) < 0.001) st.t = target;
          const ang = easeInOut(THREE.MathUtils.clamp(st.t, 0, 1)) * 1.85;
          doorPivots[f].l.rotation.y = -ang;
          doorPivots[f].r.rotation.y = ang;
        }

        {
          const pos = pondGeo.attributes.position;
          const arr = pos.array;
          for (let i = 0; i < pos.count; i++) {
            const bx = pondBase[i * 3];
            const bz = pondBase[i * 3 + 2];
            arr[i * 3 + 1] = Math.sin(bx * 2.2 + t * 2.1) * 0.035 + Math.cos(bz * 2.6 + t * 1.7) * 0.035;
          }
          pos.needsUpdate = true;
          pondGeo.computeVertexNormals();
        }

        kois.forEach((k, i) => {
          k.t += dt * k.sp;
          const wob = Math.sin(k.t * 2 + i) * 0.35;
          const x = k.cx + Math.cos(k.t) * k.r + Math.cos(k.t * 2.3 + i) * 0.3;
          const z = k.cz + Math.sin(k.t * 1.2) * (k.r * 0.62) + wob * 0.2;
          k.g.position.set(x, pondY - 0.12 + Math.sin(t * 2 + i * 2) * 0.03, z);
          const nx = k.cx + Math.cos(k.t + 0.08) * k.r;
          const nz = k.cz + Math.sin((k.t + 0.08) * 1.2) * (k.r * 0.62);
          k.g.rotation.y = Math.atan2(-(nz - z), nx - x);
          k.tail.rotation.y = Math.sin(t * 9 + i * 1.7) * 0.55;
        });

        for (let i = 0; i < PETALS; i++) {
          const p = petalData[i];
          p.y -= dt * p.vy;
          p.ph += dt * 2.2;
          p.x += Math.sin(p.ph) * dt * p.sw + Math.sin(t * 0.7 + i) * dt * 0.25;
          p.z += Math.cos(p.ph * 0.8) * dt * p.sw * 0.7;
          if (p.y < topYAt(p.x, p.z) + 0.3) {
            p.x = p.src.x + (Math.random() - 0.5) * 4;
            p.z = p.src.z + (Math.random() - 0.5) * 4;
            p.y = p.src.y + Math.random() * 1.5;
          }
          dummyP.position.set(p.x, p.y, p.z);
          dummyP.rotation.set(p.ph * 0.7, p.ph, p.ph * 0.4);
          dummyP.updateMatrix();
          petals.setMatrixAt(i, dummyP.matrix);
        }
        petals.instanceMatrix.needsUpdate = true;

        birds.forEach((b, i) => {
          b.t += dt * b.sp;
          const x = Math.cos(b.t + i) * b.r;
          const z = Math.sin(b.t * 0.9 + i * 1.3) * b.r - 2;
          b.g.position.set(x, b.h + Math.sin(t * 0.9 + i * 2) * 0.8, z);
          b.g.rotation.y = -b.t;
          const flap = Math.sin(t * 9 + i * 2.2) * 0.65;
          b.wl.rotation.y = flap * 0.5;
          b.wl.rotation.z = flap;
          b.wr.rotation.y = -flap * 0.5;
          b.wr.rotation.z = -flap;
        });

        floaters.forEach((f) => {
          f.g.position.y = Math.sin(t * f.sp + f.ph) * 0.55;
          f.g.rotation.y = Math.sin(t * 0.12 + f.ph) * 0.06;
        });
        cloudGroup.position.x = Math.sin(t * 0.02) * 2;
        mistMat.opacity = 0.5 + Math.sin(t * 3) * 0.12;
        fallTex.offset.y -= dt * 0.9;

        if (!introDone) {
          introT += dt;
          const k = easeInOut(Math.min(1, introT / introDur));
          camera.position.lerpVectors(camStart, camEnd, k);
          camera.lookAt(controls.target);
          if (introT >= introDur) {
            introDone = true;
            controls.enabled = true;
            idleTimer = setTimeout(goIdle, 4000);
          }
        } else {
          controls.update();
        }

        renderer.render(scene, camera);

        if (window.__VOXEL__) {
          window.__VOXEL__.voxelCount = voxelCount;
          window.__VOXEL__.fps = Math.round(fpsEMA);
          window.__VOXEL__.pagodaFloors = 5;
          window.__VOXEL__.timeOfDay = tod;
        }
        hudTimer += dt;
        if (hudTimer > 0.5) {
          hudTimer = 0;
          const kv = (voxelCount / 1000).toFixed(1);
          statVox.textContent = kv + "k";
          statFps.textContent = String(Math.round(fpsEMA));
          timeLabelEl.textContent = hourLabel(tod);
          if (document.activeElement !== slider) slider.value = String(tod);
        }
      };
      animate();

      const onResize = () => {
        camera.aspect = mount.clientWidth / mount.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(mount.clientWidth, mount.clientHeight);
      };
      window.addEventListener("resize", onResize);

      btnPlay.addEventListener("click", () => {
        playing = !playing;
        btnPlay.textContent = playing ? "⏸" : "▶";
      });
      slider.addEventListener("input", () => {
        tod = Number(slider.value);
      });
      document.querySelectorAll(".presets button").forEach((b) => {
        b.addEventListener("click", () => {
          tod = Number(b.dataset.v);
        });
      });

      document.getElementById("loading").style.opacity = "0";
      setTimeout(() => document.getElementById("loading").remove(), 650);
      console.log("[Pagoda Test — GPT 6 Astra (Max)] voxels:", voxelCount, "floors:", PAGODA_FLOORS);
    </script>
  </body>
</html>
