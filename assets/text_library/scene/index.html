<!doctype html>
<html lang="en" data-luma-hosted="true">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Text Library</title>
<script src="../../airline_tycoon/scene/luma_scene_i18n.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="classroom.css">
</head>
<body>
<canvas id="view" aria-hidden="true"></canvas>

<div id="loading" role="status" aria-live="polite">
  <p id="loading-text" class="mc-text">Building your library…</p>
  <div class="mc-progress"><i id="loading-bar"></i></div>
</div>

<div id="hud">
  <div id="scope" aria-hidden="true" hidden></div>
  <header id="heading">
    <h1 id="title" class="mc-title"></h1>
    <p id="subtitle" class="mc-text"></p>
  </header>
  <div id="crosshair" aria-hidden="true" hidden></div>
  <div id="tooltip" class="mc-tooltip" role="tooltip" hidden></div>
  <p id="actionbar" class="mc-text" aria-live="polite"></p>
  <div id="nav">
    <button id="back" class="mc-button" type="button" hidden></button>
  </div>
  <button id="case-prev" class="mc-arrow left" type="button" hidden></button>
  <button id="case-next" class="mc-arrow right" type="button" hidden></button>
  <div id="shelf-pages" hidden>
    <button id="page-prev" class="mc-page back" type="button" aria-label="Previous shelf"></button>
    <span id="page-label" class="mc-text"></span>
    <button id="page-next" class="mc-page forward" type="button" aria-label="Next shelf"></button>
  </div>
  <button id="settings-open" class="mc-button icon" type="button"><span class="gear"></span></button>
  <div id="move-pad" hidden>
    <button class="pad up" data-move="fwd:1" type="button" aria-label="Forward"></button>
    <button class="pad left" data-move="turn:1" type="button" aria-label="Turn left"></button>
    <button class="pad right" data-move="turn:-1" type="button" aria-label="Turn right"></button>
    <button class="pad down" data-move="fwd:-1" type="button" aria-label="Back"></button>
  </div>
  <div id="build-tools" role="toolbar" hidden>
    <button id="build-rotate" class="mc-button" type="button"></button>
    <button id="build-pick" class="mc-button" type="button"></button>
    <button id="build-done" class="mc-button" type="button"></button>
  </div>
  <div id="bar">
    <div id="purse" role="status" hidden><img id="purse-coin" alt=""><span id="purse-count" class="mc-text"></span></div>
    <div id="hotbar" role="toolbar" hidden></div>
  </div>
  <div id="toasts" aria-live="polite"></div>
</div>

<div id="settings" class="mc-screen" hidden>
  <div class="mc-dialog" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <h2 id="settings-title" class="mc-text"></h2>
    <button id="video-open" class="mc-button wide" type="button"></button>
    <button id="time" class="mc-button wide" type="button"></button>
    <button id="weather" class="mc-button wide" type="button"></button>
    <label class="mc-slider wide"><input id="sound" type="range" min="0" max="100" step="5"><span id="sound-label"></span></label>
    <p id="skin-label" class="mc-text dim"></p>
    <div class="row">
      <button id="skin-import" class="mc-button" type="button"></button>
      <button id="skin-name" class="mc-button" type="button"></button>
    </div>
    <button id="skin-reset" class="mc-button wide" type="button" hidden></button>
    <input id="skin-file" type="file" accept="image/png" hidden>
    <p id="texture-source" class="mc-text dim"></p>
    <button id="download" class="mc-button wide" type="button" hidden></button>
    <p id="download-note" class="mc-text dim small" hidden></p>
    <div class="mc-progress" id="download-progress" hidden><i></i></div>
    <button id="settings-done" class="mc-button wide" type="button"></button>
  </div>
</div>

<div id="video" class="mc-screen" hidden>
  <div class="mc-dialog" role="dialog" aria-modal="true" aria-labelledby="video-title">
    <h2 id="video-title" class="mc-text"></h2>
    <div id="video-options" class="options"></div>
    <button id="video-done" class="mc-button wide" type="button"></button>
  </div>
</div>

<div id="dialog" class="mc-screen" hidden>
  <form class="mc-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <h2 id="dialog-title" class="mc-text"></h2>
    <input id="dialog-input" class="mc-field" maxlength="48" autocomplete="off" spellcheck="false">
    <div class="swatches" id="dialog-colors" role="radiogroup"></div>
    <div class="row">
      <button id="dialog-cancel" class="mc-button" type="button"></button>
      <button id="dialog-ok" class="mc-button" type="submit"></button>
    </div>
  </form>
</div>

<div id="bookui" class="mc-screen clear" hidden>
  <div id="book-layout">
    <div id="history">
      <button class="mc-icon" data-cmd="undo" type="button"><svg viewBox="0 0 9 7" aria-hidden="true"><path d="M3 0h1v1h4v1h1v3H8v1H4V5h4V2H4v1H3V2H2V1h1zM0 1h2v1H1v1H0z"/></svg></button>
      <button class="mc-icon" data-cmd="redo" type="button"><svg viewBox="0 0 9 7" aria-hidden="true"><path d="M6 0H5v1H1v1H0v3h1v1h4V5H1V2h4v1h1V2h1V1H6zM9 1H7v1h1v1h1z"/></svg></button>
      <div id="shapes" class="shapes" role="radiogroup"></div>
    </div>
    <div id="book" class="mc-book">
      <p id="book-page" class="mc-ink"></p>
      <div id="book-viewport">
        <div id="book-flow" class="mc-ink" contenteditable="true" spellcheck="false" role="textbox" aria-multiline="true"></div>
        <canvas id="book-art" aria-hidden="true"></canvas>
      </div>
      <button id="book-prev" class="mc-page back" type="button" aria-label="Previous page"></button>
      <button id="book-next" class="mc-page forward" type="button" aria-label="Next page"></button>
      <div id="sign-screen" hidden>
        <p id="sign-label" class="mc-ink center"></p>
        <input id="sign-title" class="mc-ink sign-input" maxlength="32" autocomplete="off" spellcheck="false">
        <p id="spine-label" class="mc-ink center dim"></p>
        <input id="sign-spine" class="mc-ink sign-input small" maxlength="40" autocomplete="off" spellcheck="false">
        <p id="cover-label" class="mc-ink center dim"></p>
        <div id="cover-colors" class="swatches book" role="radiogroup"></div>
      </div>
      <div id="burn-confirm" hidden>
        <p id="burn-text" class="mc-ink center"></p>
      </div>
      <div id="tools" role="toolbar">
        <div class="tabs">
          <button class="tab" data-cmd="bold" type="button"><b>B</b></button>
          <button class="tab" data-cmd="italic" type="button"><i>I</i></button>
          <button class="tab" data-cmd="underline" type="button"><u>U</u></button>
          <button class="tab" data-cmd="strikeThrough" type="button"><s>S</s></button>
          <button class="tab" data-cmd="clear" type="button">r</button>
        </div>
        <div id="ink" class="palette" role="radiogroup"></div>
      </div>
    </div>
  </div>
  <div id="book-buttons">
    <button id="book-left" class="mc-button" type="button"></button>
    <button id="book-right" class="mc-button" type="button"></button>
  </div>
  <button id="book-burn" class="mc-button danger" type="button" hidden></button>
  <p id="book-hint" class="mc-text dim small"></p>
</div>

<div id="letter" class="mc-screen" hidden>
  <div id="letter-card" role="dialog" aria-modal="true" aria-labelledby="letter-title">
    <button id="envelope" type="button">
      <span class="flap" aria-hidden="true"></span>
      <span class="seal" aria-hidden="true"></span>
    </button>
    <p id="envelope-hint" class="mc-text"></p>
    <div id="letter-paper" hidden>
      <p id="letter-title" class="mc-ink"></p>
      <p id="letter-body" class="mc-ink"></p>
      <p class="mc-ink amount"><img id="letter-coin" alt=""><span id="letter-sum"></span></p>
      <p id="letter-sign" class="mc-ink"></p>
    </div>
  </div>
  <button id="letter-take" class="mc-button wide" type="button" hidden></button>
</div>

<div id="vault" class="mc-screen low" hidden>
  <div class="mc-dialog vault-panel" role="dialog" aria-modal="true" aria-labelledby="vault-title">
    <h2 id="vault-title" class="mc-text"></h2>
    <p class="vault-total"><img id="vault-coin" alt=""><span id="vault-sum" class="mc-title"></span><span id="vault-unit" class="mc-text dim"></span></p>
    <p id="vault-note" class="mc-text"></p>
    <button id="vault-done" class="mc-button wide" type="button"></button>
  </div>
</div>

<div id="shop" class="mc-screen" hidden>
  <div class="shop-panel" role="dialog" aria-modal="true" aria-labelledby="shop-title">
    <div class="shop-head">
      <h2 id="shop-title" class="mc-text"></h2>
      <p id="shop-timer" class="mc-text small"></p>
    </div>
    <div class="shop-body">
      <div id="shop-list" role="listbox"></div>
      <div class="shop-detail">
        <img id="shop-picture" alt="">
        <p id="shop-name" class="mc-text"></p>
        <p id="shop-where" class="mc-text small"></p>
        <p id="shop-desc" class="mc-text small"></p>
        <p class="shop-price"><img id="shop-coin" alt=""><span id="shop-cost" class="mc-title"></span></p>
        <p id="shop-owned" class="mc-text small" hidden></p>
        <button id="shop-buy" class="mc-button" type="button"></button>
      </div>
    </div>
    <div class="shop-foot">
      <p class="shop-wallet"><img id="shop-wallet-coin" alt=""><span id="shop-wallet" class="mc-text small"></span></p>
      <button id="shop-done" class="mc-button" type="button"></button>
    </div>
  </div>
</div>

<div id="pc" class="mc-screen clear" hidden>
  <div class="pc-frame" role="dialog" aria-modal="true" aria-labelledby="pc-title">
    <div class="pc-screen">
      <div class="pc-bar"><span id="pc-title"></span><span class="pc-dots" aria-hidden="true"></span></div>
      <div id="pc-body" aria-live="polite"></div>
      <div class="pc-actions">
        <button id="pc-send" class="pc-button" type="button"></button>
        <button id="pc-off" class="pc-button" type="button"></button>
      </div>
    </div>
    <div class="pc-chin" aria-hidden="true"><i></i></div>
  </div>
</div>

<nav id="a11y" class="sr-only" aria-label="Library"></nav>
<div id="error" role="alert" hidden></div>

<script src="../../airline_tycoon/scene/vendor/three-0.160.1.min.js"></script>
<script src="pixelfont.js"></script>
<script src="textures.js"></script>
<script src="labels.js"></script>
<script src="stairs.js"></script>
<script src="world.js"></script>
<script src="furniture.js"></script>
<script src="goods.js"></script>
<script src="skin.js"></script>
<script src="render.js"></script>
<script src="rain_audio.js"></script>
<script src="weather.js"></script>
<script src="gui.js"></script>
<script src="book.js"></script>
<script src="mail.js"></script>
<script src="market.js"></script>
<script src="desk.js"></script>
<script src="classroom.js"></script>
<script src="main.js"></script>
</body>
</html>
