name: Release build

# Builds the Windows, Linux, Android, and iOS apps and publishes a GitHub
# Release on every push to master. The in-app updater (lib/app/update/)
# checks these releases and can self-update the installed build.
#
# The iOS build is unsigned (no Apple Developer account configured for this
# project), so the .ipa cannot be installed on a device as downloaded —
# resign it yourself with a free Apple ID via a tool like AltStore or
# Sideloadly first.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: ver
        shell: bash
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter --version

      - run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --no-tree-shake-icons --dart-define=APP_VERSION=${{ steps.ver.outputs.version }}

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.ver.outputs.version }}" `
            windows/installer/luma.iss

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: luma ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: dist/luma-setup.exe

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: ver
        shell: bash
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter --version

      - run: flutter pub get

      # The runner's mirror list puts azure.archive.ubuntu.com first, and when
      # that mirror stalls apt has no timeout of its own — a release run once
      # sat in `apt-get update` for four hours, holding the `release`
      # concurrency group (cancel-in-progress: false) the entire time. Pin the
      # canonical mirror, cap every fetch, retry a few times, and let the step
      # die in minutes instead of hours. NEEDRESTART_MODE=a keeps the 24.04
      # needrestart hook from opening an interactive service-restart prompt.
      - name: Install Linux build dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          set -euo pipefail

          sudo tee /etc/apt/apt-mirrors.txt >/dev/null <<'EOF'
          https://archive.ubuntu.com/ubuntu/
          http://azure.archive.ubuntu.com/ubuntu/
          EOF
          sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null <<'EOF'
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::Retries "2";
          EOF

          retry() {
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              fi
              echo "attempt $attempt failed: $*"
              sleep 15
            done
            return 1
          }

          retry sudo apt-get update -y
          retry sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libglib2.0-dev libkeybinder-3.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Build Linux release
        run: flutter build linux --release --no-tree-shake-icons --dart-define=APP_VERSION=${{ steps.ver.outputs.version }}

      - name: Archive Linux bundle
        run: |
          cd build/linux/x64/release/bundle
          tar -czf "../../../luma-${{ steps.ver.outputs.version }}-linux-x64.tar.gz" .

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: luma ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: build/linux/x64/release/luma-${{ steps.ver.outputs.version }}-linux-x64.tar.gz

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: ver
        shell: bash
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Gradle/AGP 8.7 (pinned in android/settings.gradle.kts) doesn't support
      # the very newest JDKs yet, same reason the local build pins JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: flutter pub get

      # Reconstruct the release keystore from repo secrets so every CI build
      # is signed with the same persistent key. Without this, Gradle falls
      # back to a debug keystore that ephemeral runners regenerate per run,
      # giving every release a different signature — Android then refuses to
      # install any update over the previous one ("package conflicts with an
      # existing package").
      - name: Set up release signing
        shell: bash
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing — APK would get a throwaway debug signature and installed apps could never update. See android/key.properties on the dev machine."
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/luma-release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=luma-release.jks
          EOF

      # One APK per ABI, not a single universal one. A universal APK carries
      # arm64-v8a, armeabi-v7a and x86_64 copies of every native library —
      # the Flutter engine, libapp.so, ONNX Runtime, ML Kit — and AGP stores
      # them uncompressed so the installer can mmap them. That made the
      # universal APK ~240 MB against a 20 MB Windows installer, and a phone
      # then downloaded three ABIs to use one. The in-app updater picks the
      # asset matching its own ABI (UpdateService.pickAssetName).
      - name: Build APKs
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons --dart-define=APP_VERSION=${{ steps.ver.outputs.version }}

      # Fail loudly if the APKs somehow got a debug signature anyway — a
      # debug-signed release is worse than no release, because phones with
      # the proper release-signed app installed can never apply it.
      - name: Verify release signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "== $apk"
            CERT=$("$APKSIGNER" verify --print-certs "$apk")
            echo "$CERT"
            if echo "$CERT" | grep -q "Android Debug"; then
              echo "::error::$apk is debug-signed — signing config was not applied."
              exit 1
            fi
          done

      # `app-arm64-v8a-release.apk` → `luma-<version>-arm64-v8a.apk`. The
      # trailing ABI is what the updater matches on, so keep it last.
      - name: Rename APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$apk" | sed -e 's/^app-//' -e 's/-release\.apk$//')
            cp "$apk" "dist/luma-${{ steps.ver.outputs.version }}-$abi.apk"
          done
          ls -lh dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: luma ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: dist/luma-${{ steps.ver.outputs.version }}-*.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: ver
        shell: bash
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # No Apple Developer account is configured for this project, so this
      # is an unsigned build (--no-codesign). It produces a real Runner.app
      # but isn't installable on a device as-is — the .ipa needs resigning
      # with at least a free Apple ID (e.g. via AltStore or Sideloadly)
      # before it can be sideloaded.
      #
      # flutter_onnxruntime (used by Gallery's smart categories on desktop
      # only — see pubspec.yaml) still links on iOS, and it pulls its
      # onnxruntime_extensions binary target via Swift Package Manager
      # straight from download.onnxruntime.ai rather than a GitHub release,
      # with no cache in front of it. That download has no retry of its own
      # and occasionally times out on the runner's network, failing an
      # otherwise-unrelated build — the same class of flake the Linux job
      # works around above for apt. Retry the whole build a couple of times
      # before giving up; anything already resolved (pods, other SPM
      # checkouts) is cached on disk, so a retry only has to re-fetch what
      # actually failed.
      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail

          retry() {
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              fi
              echo "attempt $attempt failed: $*"
              sleep 20
            done
            return 1
          }

          retry flutter build ios --release --no-codesign --no-tree-shake-icons --dart-define=APP_VERSION=${{ steps.ver.outputs.version }}

      # An .ipa is just a zip of Payload/<App>.app, so this doesn't require
      # Xcode's archive/export step (which needs a signing identity).
      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r "../../../luma-${{ steps.ver.outputs.version }}-unsigned.ipa" Payload

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: luma ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: luma-${{ steps.ver.outputs.version }}-unsigned.ipa
