services:
  luma-sync:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Caddy sits in front of us, so the forwarded client IP is trustworthy.
      LUMA_TRUST_PROXY: "true"
      # The real client address, which the Caddyfile always overwrites from
      # Cloudflare's CF-Connecting-IP. The last X-Forwarded-For hop would be
      # a Cloudflare edge shared by many unrelated users.
      LUMA_CLIENT_IP_HEADER: X-Luma-Client-IP
      # Enables the /admin/website editor over the mounted wiki checkout.
      LUMA_WIKI_DIR: /wiki
      LUMA_SEARXNG_URL: http://searxng:8080
      LUMA_RENDERER_URL: http://renderer:8081
      LUMA_HOST_PROC: /host/proc
    volumes:
      - /opt/luma-sync-data:/data
      - ../wiki:/wiki
      # Read-only host procfs for the admin Metrics tab's per-process
      # breakdown. The container's own /proc lists only its own processes,
      # while the CPU tile (/proc/stat) is host-wide. Command lines read
      # from here have tokens, keys and passwords masked before the
      # dashboard sees them (redactCommandLine in process_metrics.dart).
      - /proc:/host/proc:ro
      # No Docker socket and no repo bind mount here on purpose. The admin
      # dashboard's "Update & restart server" button used to run
      # `git pull && docker compose up -d --build` directly inside this
      # container over a mounted host socket — but that command recreating
      # *this very container* killed the process orchestrating the recreate
      # partway through, before it ever started the new one. DeployConsole
      # now only drops a request file on the shared /data volume;
      # deploy-watcher.sh, a systemd service running directly on the host
      # (see luma-deploy-watcher.service), does the actual git pull and
      # rebuild from outside this container's blast radius. That also means
      # this container no longer needs host-Docker-socket access, which was
      # effectively root on the host.
    # No "ports:" on purpose — only Caddy may reach the app, over the
    # internal network. Never expose 8080 to the internet (plain HTTP).
    networks:
      - internal
      - renderer
    depends_on:
      - searxng
      - renderer
    # The server itself runs unprivileged: docker-entrypoint.sh starts as
    # root only to hand /data over, using the capabilities below, then
    # drops to the owner of /data (or LUMA_SYNC_UID) with none left. The
    # image is read-only apart from /data, /wiki and a scratch /tmp.
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - SETPCAP
    security_opt:
      - no-new-privileges:true

  renderer:
    build:
      context: .
      dockerfile: Renderer.Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./renderer-seccomp.json
      # Set to luma-renderer after loading renderer-apparmor on hosts that
      # restrict unprivileged user namespaces (see README).
      - apparmor=${LUMA_RENDERER_APPARMOR_PROFILE:-docker-default}
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=2g,mode=1777
    shm_size: 512mb
    pids_limit: 512
    mem_limit: 4g
    # Remove this mapping on a host without a GPU; SwiftShader is automatic.
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${LUMA_RENDERER_RENDER_GID:-65534}"
      - "${LUMA_RENDERER_VIDEO_GID:-65533}"
    networks:
      - renderer

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in server/.env}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - internal

  caddy:
    build:
      context: .
      dockerfile: Caddy.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      LUMA_DOMAIN: ${LUMA_DOMAIN}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      - luma-sync

volumes:
  caddy_data:
  caddy_config:

networks:
  internal:
  renderer:
    internal: true
