<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MSC Virtuosa</title>
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a1428; }
#scene { width: 100%; height: 100%; }
canvas { display: block; }
</style>
</head>
<body>
<div id="scene"></div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById('scene').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 3000);
camera.position.set(25, 13, 29);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 7;
controls.maxDistance = 170;
controls.maxPolarAngle = 1.47;
controls.target.set(0, 8, 0);

scene.add(new THREE.HemisphereLight(0xcfe4ff, 0x2a3a55, 0.8));
const ambient = new THREE.AmbientLight(0x33507a, 0.4);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff1dc, 2.4);
sun.position.set(30, 60, 20);
scene.add(sun);
const moon = new THREE.DirectionalLight(0x88aaff, 0);
scene.add(moon);

const sky = new THREE.Color(0x8fc0ea);
scene.background = sky;
scene.fog = new THREE.Fog(sky, 150, 600);

const whiteMat = new THREE.MeshStandardMaterial({ color: 0xf4f6f8, roughness: 0.55, metalness: 0.05 });
const stripeMat = new THREE.MeshStandardMaterial({ color: 0x1b6ea8, roughness: 0.5, metalness: 0.1 });
const glassMat = new THREE.MeshStandardMaterial({ color: 0x8fc8e8, roughness: 0.08, metalness: 0.6, emissive: 0x0d2b40, emissiveIntensity: 0.55 });
const orangeMat = new THREE.MeshStandardMaterial({ color: 0xff6a00, roughness: 0.4, metalness: 0.15 });
const grayMat = new THREE.MeshStandardMaterial({ color: 0x9aa5ad, roughness: 0.7 });
const seaMat = new THREE.MeshStandardMaterial({ color: 0x0e63a8, roughness: 0.22, metalness: 0.05 });

function addBox(w, h, d, x, y, z, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  scene.add(m);
  return m;
}

function accommodation(cx, cy, cz, sx, sy, sz) {
  addBox(sx, sy, sz, cx, cy, cz, whiteMat);
  const bands = [ { y: cy - sy / 2 + 1.7, h: 1.6 }, { y: cy - sy / 2 + sy - 3.4, h: 1.6 } ];
  bands.forEach(b => {
    addBox(sx * 0.8, b.h, sz * 0.8, cx + sx * 0.11, b.y, cz, glassMat);
    addBox(sx * 0.8, b.h, sz * 0.8, cx - sx * 0.11, b.y, cz, glassMat);
    addBox(sx * 0.8, b.h, sz * 0.8, cx, b.y, cz + sz * 0.11, glassMat);
    addBox(sx * 0.8, b.h, sz * 0.8, cx, b.y, cz - sz * 0.11, glassMat);
  });
}

// ---------------- HULL (lofted organic shape) ----------------
const stations = [
  { x: -15.0, w: 5.0 }, { x: -13.8, w: 5.05 }, { x: -11.5, w: 5.15 }, { x: -8.5, w: 5.3 },
  { x: -5.5, w: 5.45 }, { x: -2.5, w: 5.55 }, { x: 0.5, w: 5.65 }, { x: 3.5, w: 5.7 },
  { x: 6.5, w: 5.65 }, { x: 9.0, w: 5.5 }, { x: 11.0, w: 4.9 }, { x: 12.5, w: 3.9 },
  { x: 13.8, w: 2.8 }, { x: 14.8, w: 1.7 }, { x: 15.3, w: 0.5 }
];
const keel = -7.2;
const deckY = 8.6;
const sup = 2.8;
const M = 20;
const yc = (deckY + keel) / 2;
const hd = (deckY - keel) / 2;
const rings = [];
stations.forEach(s => {
  const ring = [];
  for (let i = 0; i < M; i++) {
    const t = (i / M) * Math.PI * 2;
    const c = Math.cos(t), sn = Math.sin(t);
    const z = Math.sign(c) * Math.pow(Math.abs(c), 2 / sup) * s.w;
    const y = yc + Math.sign(sn) * Math.pow(Math.abs(sn), 2 / sup) * hd;
    ring.push(new THREE.Vector3(s.x, y, z));
  }
  rings.push(ring);
});
const posArr = [];
rings.forEach(r => r.forEach(v => posArr.push(v.x, v.y, v.z)));
const idxArr = [];
for (let j = 0; j < rings.length - 1; j++) {
  for (let i = 0; i < M; i++) {
    const i2 = (i + 1) % M;
    const a = j * M + i, b = j * M + i2, c = (j + 1) * M + i2, d = (j + 1) * M + i;
    idxArr.push(a, b, c, a, c, d);
  }
}
{
  const face = [];
  for (let i = 0; i < M; i++) face.push((M - 1 - i) % M);
  idxArr.push(...face);
}
{
  const base = (rings.length - 1) * M;
  const face = [];
  for (let i = 0; i < M - 1; i++) face.push(base + i);
  face.push(base + (M - 1));
  idxArr.push(...face);
}
const hullGeo = new THREE.BufferGeometry();
hullGeo.setAttribute('position', new THREE.Float32BufferAttribute(posArr, 3));
hullGeo.setIndex(idxArr);
hullGeo.computeVertexNormals();
const hull = new THREE.Mesh(hullGeo, whiteMat);
hull.material.side = THREE.DoubleSide;
scene.add(hull);

const deckPos = [];
const deckIdx = [];
stations.forEach(s => { deckPos.push(s.x, deckY + 0.05, -(s.w - 0.06)); deckPos.push(s.x, deckY + 0.05, (s.w - 0.06)); });
for (let j = 0; j < stations.length - 1; j++) deckIdx.push(j * 2, j * 2 + 1, (j + 1) * 2 + 1, (j + 1) * 2);
const deckGeo = new THREE.BufferGeometry();
deckGeo.setAttribute('position', new THREE.Float32BufferAttribute(deckPos, 3));
deckGeo.setIndex(deckIdx);
const deck = new THREE.Mesh(deckGeo, whiteMat);
deck.material.side = THREE.DoubleSide;
deck.geometry.computeVertexNormals();
scene.add(deck);

const rowDefs = [];
stations.forEach(s => { rowDefs.push({ x: s.x, y: -1.2, zl: -(s.w - 0.08), zr: (s.w - 0.08) }); rowDefs.push({ x: s.x, y: 0.2, zl: -(s.w - 0.08), zr: (s.w - 0.08) }); });
const sPos = [], sIdx = [];
for (let r = 0; r < rowDefs.length - 1; r++) {
  const a = rowDefs[r], b = rowDefs[r + 1];
  sPos.push(a.x, a.y, a.zl); sPos.push(a.x, a.y, a.zr); sPos.push(b.x, b.y, b.zr); sPos.push(b.x, b.y, b.zl);
  sIdx.push(r * 2, r * 2 + 1, (r + 1) * 2 + 1, (r + 1) * 2);
}
const stripeGeo = new THREE.BufferGeometry();
stripeGeo.setAttribute('position', new THREE.Float32BufferAttribute(sPos, 3));
stripeGeo.setIndex(sIdx);
const stripe = new THREE.Mesh(stripeGeo, stripeMat);
stripe.material.side = THREE.DoubleSide;
scene.add(stripe);

// ---------------- SUPERSTRUCTURE ----------------
accommodation(-7.5, 14.35, 0, 13, 11.5, 10);
accommodation(6.5, 12.6, 0, 11, 8, 9.5);
accommodation(-1.0, 11.85, 0, 9, 6.5, 8.5);

// funnel
const funnel = new THREE.Mesh(new THREE.CylinderGeometry(4.4, 4.4, 12, 24), whiteMat);
funnel.position.set(-8.5, 26, 0.5);
scene.add(funnel);
const funnelTop = new THREE.Mesh(new THREE.CylinderGeometry(4.2, 4.2, 1.4, 24), orangeMat);
funnelTop.position.set(-8.5, 31.2, 0.5);
scene.add(funnelTop);
const swirlPts = [];
const turns = 2.2;
for (let i = 0; i <= 80; i++) { const t = i / 80; const a = t * turns * Math.PI * 2; const r = 3.2 * (1 - 0.3 * t); swirlPts.push(new THREE.Vector3(Math.cos(a) * r, 25.5 + 0.9 * t, Math.sin(a) * r)); }
const swirlCurve = new THREE.CatmullRomCurve3(swirlPts);
const swirl = new THREE.Mesh(new THREE.TubeGeometry(swirlCurve, 48, 0.26, 8, false), orangeMat);
scene.add(swirl);

// lifeboats
function addLifeboat(x, z, y) {
  const boat = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 2.4, 12, 1, false), orangeMat);
  boat.rotation.x = Math.PI / 2;
  boat.position.set(x, y, z);
  scene.add(boat);
  const dock = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.8, 0.9), grayMat);
  dock.position.set(x, y - 1.0, z);
  scene.add(dock);
}
addLifeboat(-9.0, 5.9, 22.2);
addLifeboat(-5.0, 5.9, 22.2);
addLifeboat(-9.0, -5.9, 22.2);
addLifeboat(-5.0, -5.9, 22.2);

// decks
addBox(20, 0.7, 11, 0.5, 8.85, 0, whiteMat);
addBox(11, 0.6, 8.5, -6.5, 20.3, 0, whiteMat);

// ---------------- SEA ----------------
const seaGeo = new THREE.PlaneGeometry(1500, 1500, 150, 150);
seaGeo.rotateX(-Math.PI / 2);
const sea = new THREE.Mesh(seaGeo, seaMat);
sea.position.y = -0.02;
scene.add(sea);

// ---------------- STARS ----------------
const starGeo = new THREE.BufferGeometry();
const sp = [];
for (let i = 0; i < 1200; i++) {
  const r = 250 + Math.random() * 400;
  const a = Math.random() * Math.PI * 2;
  const b = Math.random() * Math.PI;
  const z = Math.cos(b);
  const x = Math.sin(b) * Math.cos(a);
  const y = Math.sin(b) * Math.sin(a);
  sp.push(x, y, z);
}
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.8, sizeAttenuation: true, transparent: true, opacity: 0 }));
stars.position.y = 60;
scene.add(stars);
const starsMat = stars.material;

// ---------------- CLOUDS ----------------
function makeCloudTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const ctx = c.getContext('2d');
  for (let i = 0; i < 46; i++) {
    const x = Math.random() * 256, y = Math.random() * 128, r = 20 + Math.random() * 40;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(255,255,255,0.85)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  return new THREE.CanvasTexture(c);
}
const cloudTex = makeCloudTexture();
const cloudMat = new THREE.SpriteMaterial({ map: cloudTex, transparent: true, opacity: 0.75, depthWrite: false });
const cloud = new THREE.Sprite(cloudMat);
cloud.scale.set(700, 320, 1);
cloud.position.set(0, 110, -80);
scene.add(cloud);

// ---------------- DAY / NIGHT / WEATHER ----------------
const clock = new THREE.Clock();
const period = 220;
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const ph = (t % period) / period;
  const sunAng = ph * Math.PI * 2;
  const sunElev = Math.sin(sunAng) * 0.85 + 0.2;
  sun.position.set(Math.cos(sunAng) * 70, 15 + Math.sin(sunAng) * 85, Math.sin(sunAng * 0.8) * 45);
  const dayness = clamp01(sunElev);
  const skyDay = new THREE.Color(0x87bfe8);
  const skyNight = new THREE.Color(0x0a1030);
  sky.lerpColors(skyNight, skyDay, dayness);
  scene.background.copy(sky);
  scene.fog.color.copy(sky);
  sun.intensity = dayness * 2.4 + (1 - dayness) * 0.25;
  sun.color.setHex(dayness > 0.5 ? 0xfff0d8 : 0xbfd8ff);
  hemi.intensity = 0.8 * (0.15 + 0.85 * dayness);
  ambient.intensity = 0.4 * (0.15 + 0.85 * dayness);
  moon.intensity = (1 - dayness) * 0.6;
  moon.position.set(-Math.cos(sunAng) * 70, 10 - Math.sin(sunAng) * 60, -Math.sin(sunAng * 0.8) * 40);
  seaMat.color.setHex(dayness > 0.5 ? 0x0e63a8 : 0x052038);
  seaMat.roughness = dayness > 0.5 ? 0.22 : 0.4;
  stars.visible = dayness < 0.12;
  starsMat.opacity = (1 - dayness) * 0.9;
  cloudMat.opacity = (0.25 + 0.45 * dayness) * (0.5 + 0.5 * Math.sin(t * 0.07));

  const sp = seaGeo.attributes.position;
  for (let i = 0; i < sp.count; i++) {
    const x = sp.getX(i), z = sp.getZ(i);
    sp.setY(i, Math.sin(x * 0.22 + t * 2.1) * Math.cos(z * 0.19 - t * 1.7) * 0.9 + Math.sin(x * 0.09 - z * 0.12 + t * 1.2) * 0.45);
  }
  seaGeo.computeVertexNormals();
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
