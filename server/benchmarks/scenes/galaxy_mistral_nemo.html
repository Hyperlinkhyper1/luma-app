<!DOCTYPE html>
<html>
<head>
    <title>3D Galaxy Benchmark</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: #fff;
            z-index: 1;
        }
        #info, #ui {
            display: none;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1;
        }
        #minimap {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 200px;
            height: 200px;
            border: 1px solid #fff;
        }
        #hud {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 100%;
            text-align: left;
            color: #fff;
            z-index: 1;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2em;
            color: #fff;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div id="info">Loading...</div>
    <div id="ui">
        <button id="cinematic">Cinematic</button>
        <button id="chase">Chase</button>
        <button id="cockpit">Cockpit</button>
        <button id="galaxyMap">Galaxy Map</button>
        <button id="playPause">Play/Pause</button>
        <button id="speedUp">Speed Up</button>
        <button id="speedDown">Speed Down</button>
        <button id="toggleUI">Toggle UI</button>
        <button id="toggleAudio">Toggle Audio</button>
        <div id="minimap"></div>
        <div id="hud">
            <div id="region"></div>
            <div id="distance"></div>
            <div id="speed"></div>
            <div id="eta"></div>
        </div>
    </div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { Sky } from 'three/addons/objects/Sky.js';
        import { Water } from 'three/addons/objects/Water.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        let scene, camera, renderer, composer, controls, pointerLockControls, clock, ship, galaxy, audioListener, audioSource;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000000000);
            camera.position.z = 100;

            renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            composer = new EffectComposer(renderer);
            composer.setSize(window.innerWidth, window.innerHeight);

            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0, 0);
            composer.addPass(new THREE.RenderPass(scene, camera));
            composer.addPass(bloomPass);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.minDistance = 100;
            controls.maxDistance = 1000000000;

            pointerLockControls = new PointerLockControls(camera, document.body);
            document.addEventListener('click', () => {
                if (!pointerLockControls.isLocked) {
                    pointerLockControls.lock();
                }
            });

            clock = new THREE.Clock();

            createShip();
            createGalaxy();

            createAudio();

            document.getElementById('cinematic').addEventListener('click', () => {
                controls.enabled = true;
                pointerLockControls.enabled = false;
            });
            document.getElementById('chase').addEventListener('click', () => {
                controls.enabled = false;
                pointerLockControls.enabled = true;
            });
            document.getElementById('cockpit').addEventListener('click', () => {
                camera.position.copy(ship.position);
                camera.position.z = 10;
                controls.enabled = false;
                pointerLockControls.enabled = false;
            });
            document.getElementById('galaxyMap').addEventListener('click', () => {
                camera.position.set(0, 0, 100000000);
                controls.minDistance = 100000000;
                controls.maxDistance = 10000000000;
                controls.enabled = true;
                pointerLockControls.enabled = false;
            });
            document.getElementById('playPause').addEventListener('click', togglePlayPause);
            document.getElementById('speedUp').addEventListener('click', () => {
                ship.speed *= 2;
            });
            document.getElementById('speedDown').addEventListener('click', () => {
                ship.speed /= 2;
            });
            document.getElementById('toggleUI').addEventListener('click', toggleUI);
            document.getElementById('toggleAudio').addEventListener('click', toggleAudio);

            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', onDocumentKeyDown);

            document.getElementById('info').style.display = 'none';
            document.getElementById('ui').style.display = '';
        }

        function createShip() {
            const geometry = new THREE.BoxBufferGeometry(1, 1, 1);
            const material = new THREE.MeshStandardMaterial({ color: 0xffffff });
            ship = new THREE.Mesh(geometry, material);
            ship.position.z = -100;
            scene.add(ship);

            ship.speed = 100000;
            ship.route = [];
            ship.route.push({ x: 0, y: 0, z: 0 });
            ship.route.push({ x: 100000000, y: 0, z: 0 });
            ship.route.push({ x: 200000000, y: 0, z: 0 });
            ship.route.push({ x: 300000000, y: 0, z: 0 });
            ship.route.push({ x: 400000000, y: 0, z: 0 });
            ship.route.push({ x: 500000000, y: 0, z: 0 });
            ship.route.push({ x: 600000000, y: 0, z: 0 });
            ship.route.push({ x: 700000000, y: 0, z: 0 });
            ship.route.push({ x: 800000000, y: 0, z: 0 });
            ship.route.push({ x: 900000000, y: 0, z: 0 });
            ship.route.push({ x: 1000000000, y: 0, z: 0 });
        }

        function createGalaxy() {
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            const colors = [];
            const sizes = [];

            const numStars = 200000;
            for (let i = 0; i < numStars; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.pow(Math.random(), 2) * 100000000;
                const x = radius * Math.cos(angle);
                const y = radius * Math.sin(angle);
                const z = Math.random() * 100000000 - 50000000;

                vertices.push(x, y, z);

                const color = new THREE.Color();
                if (Math.abs(z) < 50000000) {
                    color.setHSL(Math.random(), 1, 0.5);
                } else {
                    color.setHSL(Math.random(), 0.5, 0.5);
                }
                colors.push(color.r, color.g, color.b);

                sizes.push(Math.random() * 0.1 + 0.1);
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

            const material = new THREE.PointsMaterial({ size: 0.1, vertexColors: true });
            galaxy = new THREE.Points(geometry, material);
            scene.add(galaxy);
        }

        function createAudio() {
            audioListener = new THREE.AudioListener();
            camera.add(audioListener);

            audioSource = new THREE.Audio(audioListener);
            const audioLoader = new THREE.AudioLoader();
            audioLoader.load('https://unpkg.com/three@0.160.0/examples/sounds/engine.mp3', (buffer) => {
                audioSource.setBuffer(buffer);
                audioSource.setLoop(true);
                audioSource.setVolume(0.5);
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            if (playing) {
                ship.position.lerp(ship.route[ship.currentRoute], delta * ship.speed);
                if (Math.abs(ship.position.distanceTo(ship.route[ship.currentRoute])) < 10000) {
                    ship.currentRoute = (ship.currentRoute + 1) % ship.route.length;
                }
            }

            composer.render(delta);
            updateHUD();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function onDocumentKeyDown(event) {
            if (event.key === ' ') {
                togglePlayPause();
            }
        }

        function togglePlayPause() {
            playing = !playing;
            document.getElementById('playPause').innerText = playing ? 'Pause' : 'Play';
        }

        function toggleUI() {
            document.getElementById('ui').style.display = document.getElementById('ui').style.display === 'none' ? '' : 'none';
        }

        function toggleAudio() {
            audioSource.setVolume(audioSource.getVolume() === 0 ? 0.5 : 0);
            document.getElementById('toggleAudio').innerText = audioSource.getVolume() === 0 ? 'Unmute' : 'Mute';
        }

        function updateHUD() {
            document.getElementById('region').innerText = 'Region';
            document.getElementById('distance').innerText = 'Distance: ' + ship.position.length() + ' ly';
            document.getElementById('speed').innerText = 'Speed: ' + (playing ? ship.speed : '0') + ' km/s';
            document.getElementById('eta').innerText = 'ETA: ' + (playing ? (ship.route[ship.currentRoute].distanceTo(ship.position) / ship.speed).toFixed(2) + ' s' : 'N/A');
        }
    </script>
</body>
</html>
