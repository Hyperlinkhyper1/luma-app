<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Timeline of the World</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05080f; }
  body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #world { display: block; width: 100vw; height: 100vh; touch-action: none; user-select: none; }
  text { font-family: inherit; }
  .scene { pointer-events: none; }
  .tiny { font-size: 10px; letter-spacing: 1.6px; font-weight: 750; }
  .small { font-size: 12px; letter-spacing: .7px; }
  .muted { fill: #a7b5c5; }
  .cream { fill: #fff4dc; }
  .hairline { vector-effect: non-scaling-stroke; }
  .clickable { cursor: pointer; }
  .clickable:focus { outline: none; }
  .clickable:focus-visible circle, .clickable:focus-visible rect { stroke: #ffe6a3; stroke-width: 3; }
  .tick-hit { fill: transparent; cursor: pointer; }
  .twinkle { animation: twinkle 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .twinkle.d1 { animation-delay: -.7s; }
  .twinkle.d2 { animation-delay: -1.5s; }
  .twinkle.d3 { animation-delay: -2.1s; }
  .ember { animation: ember 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  .ember.d1 { animation-delay: -.6s; }
  .ember.d2 { animation-delay: -1.3s; }
  .ember.d3 { animation-delay: -1.8s; }
  .snow { animation: snowFall 4.5s linear infinite; transform-box: fill-box; }
  .snow.d1 { animation-delay: -1.1s; }
  .snow.d2 { animation-delay: -2.3s; }
  .snow.d3 { animation-delay: -3.4s; }
  .cloud-a { animation: cloudDrift 18s ease-in-out infinite alternate; }
  .cloud-b { animation: cloudDrift 24s ease-in-out infinite alternate-reverse; }
  .swim-a { animation: swimA 6s ease-in-out infinite; }
  .swim-b { animation: swimB 7.5s ease-in-out infinite; }
  .swim-c { animation: swimA 9s ease-in-out infinite reverse; }
  .grow { transform-box: fill-box; transform-origin: bottom center; animation: grow 5s ease-in-out infinite alternate; }
  .breathe { animation: breathe 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .bob { animation: bob 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .bird { animation: birds 9s linear infinite; }
  .smoke { animation: smoke 5s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  .smoke.s2 { animation-delay: -1.7s; }
  .smoke.s3 { animation-delay: -3.1s; }
  .pulse { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .spin { animation: spin 8s linear infinite; transform-box: fill-box; transform-origin: center; }
  .flicker { animation: flicker 1.7s ease-in-out infinite alternate; }
  .copy-in { animation: copyIn .8s ease-out both; transform-box: fill-box; transform-origin: left center; }
  @keyframes twinkle { 0%,100% { opacity:.25; transform:scale(.75); } 50% { opacity:1; transform:scale(1.2); } }
  @keyframes ember { 0% { opacity:0; transform:translate(0,12px) scale(.5); } 20% { opacity:.9; } 100% { opacity:0; transform:translate(18px,-70px) scale(1.2); } }
  @keyframes snowFall { 0% { opacity:0; transform:translate(-12px,-35px); } 15% { opacity:.85; } 100% { opacity:.15; transform:translate(28px,90px); } }
  @keyframes cloudDrift { from { transform:translateX(-22px); } to { transform:translateX(28px); } }
  @keyframes swimA { 0%,100% { transform:translate(-18px,4px) rotate(-2deg); } 50% { transform:translate(22px,-8px) rotate(2deg); } }
  @keyframes swimB { 0%,100% { transform:translate(18px,8px) rotate(2deg); } 50% { transform:translate(-20px,-5px) rotate(-2deg); } }
  @keyframes grow { from { transform:scaleY(.72); } to { transform:scaleY(1.06); } }
  @keyframes breathe { 0%,100% { transform:scale(1); opacity:.75; } 50% { transform:scale(1.12); opacity:1; } }
  @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-7px); } }
  @keyframes birds { from { transform:translateX(-150px); } to { transform:translateX(150px); } }
  @keyframes smoke { 0% { opacity:0; transform:translate(0,16px) scale(.45); } 25% { opacity:.65; } 100% { opacity:0; transform:translate(26px,-66px) scale(1.8); } }
  @keyframes pulse { 0%,100% { opacity:.3; transform:scale(.8); } 50% { opacity:.9; transform:scale(1.15); } }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes flicker { from { opacity:.7; transform:scaleY(.92); } to { opacity:1; transform:scaleY(1.08); } }
  @keyframes copyIn { from { opacity:0; transform:translateX(-10px); } to { opacity:1; transform:translateX(0); } }
</style>
</head>
<body>
<svg id="world" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">A Timeline of the World</title>
  <desc id="svgDesc">An animated illustrated journey from the formation of Earth to the digital age, with an interactive historical timeline.</desc>
  <defs>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="wideGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="smokeBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">

    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">

      <feBlend in="SourceGraphic" in2="faint" mode="soft-light"/>

  <g id="scene-3" class="scene">
    <circle cx="1035" cy="370" r="252" fill="#5ad7c4" opacity=".16" filter="url(#wideGlow)"/>
    <g fill="none" stroke="#b87840" stroke-width="5" opacity=".65">

    }
    if (age >= 10e3) {
      return 1150 + Math.log(300e3 / age) / Math.log(300e3 / 10e3) * 70;
    }
    const year = -age;
    if (year <= 500) return 1220 + (year + 10000) / 10500 * 110;
    if (year <= 1450) return 1330 + (year - 500) / 950 * 55;
    return 1385 + (year - 1450) / 575 * 145;
  }

  const tickX = [
    dateToX(4.54e9), dateToX(4.2e9), dateToX(3.6e9), dateToX(2.4e9), dateToX(.72e9),
    dateToX(.538e9), dateToX(.47e9), dateToX(.252e9), dateToX(.066e9), 1011, dateToX(.0003e9),
    dateToX(-10000), dateToX(-3000), dateToX(-500), dateToX(500), dateToX(1450), dateToX(1492),
    dateToX(1760), dateToX(1903), dateToX(2025)
  ];

  const eras = [
    { name: "HADEAN", x: 70, w: 150, color: "#713d49" },
    { name: "ARCHEAN", x: 220, w: 200, color: "#4f7166" },
    { name: "PROTEROZOIC", x: 420, w: 330, color: "#3f7083" },
    { name: "PALEOZOIC", x: 750, w: 150, color: "#777044" },
    { name: "MESOZOIC", x: 900, w: 130, color: "#8b563b" },
    { name: "CENOZOIC", x: 1030, w: 190, color: "#6f4965" },
    { name: "HUMAN HISTORY", x: 1220, w: 310, color: "#5b6f77" }
  ];
  const eraGroup = document.getElementById("eraBands");
  eras.forEach(era => {
    const rect = document.createElementNS(NS, "rect");
    rect.setAttribute("x", era.x);
    rect.setAttribute("y", 823);
    rect.setAttribute("width", era.w);
    rect.setAttribute("height", 14);
    rect.setAttribute("rx", 3);
    rect.setAttribute("fill", era.color);
    rect.setAttribute("fill-opacity", ".8");
    eraGroup.appendChild(rect);
    const text = document.createElementNS(NS, "text");
    text.setAttribute("x", era.x + era.w / 2);
    text.setAttribute("y", 833);
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("font-size", era.w < 140 ? "8" : "9");
    text.setAttribute("font-weight", "750");
    text.setAttribute("letter-spacing", ".7");
    text.setAttribute("fill", "#eef3ef");
    text.setAttribute("fill-opacity", ".9");
    text.textContent = era.name;
    eraGroup.appendChild(text);
  });

  const ticksGroup = document.getElementById("ticks");
  tickX.forEach((x, i) => {
    const group = document.createElementNS(NS, "g");
    group.setAttribute("class", "clickable");
    group.setAttribute("role", "button");
    group.setAttribute("tabindex", "0");
    group.setAttribute("aria-label", `Chapter ${i + 1}: ${chapters[i].title}, ${chapters[i].readout}`);
    const title = document.createElementNS(NS, "title");
    title.textContent = `${i + 1}. ${chapters[i].title} — ${chapters[i].readout}`;
    group.appendChild(title);
    const line = document.createElementNS(NS, "line");
    line.setAttribute("x1", x); line.setAttribute("x2", x);
    line.setAttribute("y1", 813); line.setAttribute("y2", 843);
    line.setAttribute("stroke", i === 10 ? "#d8bd77" : "#a9c0ca");
    line.setAttribute("stroke-opacity", ".85");
    line.setAttribute("stroke-width", "1.5");
    group.appendChild(line);
    const circle = document.createElementNS(NS, "circle");
    circle.setAttribute("cx", x); circle.setAttribute("cy", 830); circle.setAttribute("r", i === 10 ? 6 : 4.5);
    circle.setAttribute("fill", i === 10 ? "#e5c979" : "#0a1623");
    circle.setAttribute("stroke", i === 10 ? "#fff0b6" : "#b4cbd5");
    circle.setAttribute("stroke-width", "1.5");
    group.appendChild(circle);
    const hit = document.createElementNS(NS, "circle");
    hit.setAttribute("cx", x); hit.setAttribute("cy", 830); hit.setAttribute("r", "10");
    hit.setAttribute("class", "tick-hit");
    group.appendChild(hit);
    const label = document.createElementNS(NS, "text");
    const low = i === 8 || i === 9 || i === 15 || i === 16 || i === 18;
    label.setAttribute("x", x);
    label.setAttribute("y", low ? 871 : 857);
    label.setAttribute("text-anchor", "middle");
    label.setAttribute("font-size", "10");
    label.setAttribute("font-weight", "700");
    label.setAttribute("fill", i === 10 ? "#f3d88d" : "#9fb4c0");
    label.textContent = String(i + 1);
    group.appendChild(label);
    group.addEventListener("pointerdown", e => { e.stopPropagation(); jumpTo(i); });
    group.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); jumpTo(i); }
    });
    ticksGroup.appendChild(group);
  });

  function updatePlayIcon() {
    playIcon.setAttribute("opacity", playing ? "0" : "1");
    pauseIcon.setAttribute("opacity", playing ? "1" : "0");
    playToggle.setAttribute("aria-label", playing ? "Pause" : "Play");
  }
  function jumpTo(index) {
    elapsed = clamp(index, 0, chapters.length - 1) * CHAPTER_SECONDS + .02;
    activeChapter = -1;
  }
  function restart() { elapsed = 0; activeChapter = -1; }
  function togglePlay() { playing = !playing; updatePlayIcon(); }

  playToggle.addEventListener("pointerdown", e => { e.stopPropagation(); togglePlay(); });
  playToggle.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); togglePlay(); } });
  document.getElementById("restart").addEventListener("pointerdown", e => { e.stopPropagation(); restart(); });
  document.getElementById("restart").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); restart(); } });

  const speedOptions = Array.from(document.querySelectorAll(".speed-option"));
  function setSpeed(value) {
    speed = value;
    speedOptions.forEach(option => {
      const active = Number(option.dataset.speed) === speed;
      const rect = option.querySelector("rect");
      const text = option.querySelector("text");
      rect.setAttribute("fill", active ? "#d4b568" : "#142537");
      rect.setAttribute("stroke", active ? "#f1d999" : "#426176");
      text.setAttribute("fill", active ? "#17202a" : "#c2d1d9");
    });
  }
  speedOptions.forEach(option => {
    option.addEventListener("pointerdown", e => { e.stopPropagation(); setSpeed(Number(option.dataset.speed)); });
    option.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); setSpeed(Number(option.dataset.speed)); } });
  });

  function svgPoint(event) {
    const pt = svg.createSVGPoint();
    pt.x = event.clientX;
    pt.y = event.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  function scrubTo(event) {
    const x = svgPoint(event).x;
    if (x <= tickX[0]) { elapsed = 0; return; }
    if (x >= tickX[tickX.length - 1]) { elapsed = (chapters.length - 1) * CHAPTER_SECONDS + CHAPTER_SECONDS * .96; return; }
    for (let i = 0; i < tickX.length - 1; i++) {
      if (x >= tickX[i] && x < tickX[i + 1]) {
        const f = (x - tickX[i]) / Math.max(1, tickX[i + 1] - tickX[i]);
        elapsed = (i + f) * CHAPTER_SECONDS;
        return;
      }
    }
  }
  const scrubZone = document.getElementById("scrubZone");
  scrubZone.addEventListener("pointerdown", e => {
    e.stopPropagation();
    dragging = true;
    dragPointer = e.pointerId;
    try { svg.setPointerCapture(e.pointerId); } catch (_) {}
    scrubTo(e);
  });
  svg.addEventListener("pointermove", e => { if (dragging) scrubTo(e); });
  svg.addEventListener("pointerup", e => {
    if (dragging) {
      dragging = false;
      try { svg.releasePointerCapture(e.pointerId); } catch (_) {}
    }
  });
  svg.addEventListener("pointercancel", () => { dragging = false; });

  window.addEventListener("keydown", e => {
    if (e.code === "Space") {
      e.preventDefault();
      togglePlay();
    } else if (e.key === "ArrowRight") {
      e.preventDefault();
      const current = Math.min(chapters.length - 1, Math.floor(elapsed / CHAPTER_SECONDS));
      jumpTo(current + 1);
    } else if (e.key === "ArrowLeft") {
      e.preventDefault();
      const current = Math.floor(elapsed / CHAPTER_SECONDS);
      jumpTo(current - 1);
    } else if (e.key === "Home") {
      e.preventDefault();
      restart();
    }
  });

  function updateAtmosphere(index, p) {
    const current = palettes[index];
    const next = palettes[Math.min(index + 1, palettes.length - 1)];
    const blend = smooth(.88, 1, p);
    const top = mixHex(current.sky[0], next.sky[0], blend);
    const bottom = mixHex(current.sky[1], next.sky[1], blend);
    setFill(skyTop, top);
    setFill(skyBottom, bottom);
    let ot = mixHex(current.ocean[0], next.ocean[0], blend);
    let ob = mixHex(current.ocean[1], next.ocean[1], blend);
    if (index === 1) {
      const cooling = smooth(0, .68, p);
      ot = mixHex("#9b2e20", "#075f82", cooling);
      ob = mixHex("#ed6d2c", "#168da3", cooling);
    }
    setFill(oceanTop, ot);
    setFill(oceanBottom, ob);
    const starOpacity = index === 0 ? .95 : index === 1 ? .45 : index === 2 ? .12 : index === 4 ? .02 : index === 9 ? .24 : index === 10 ? .36 : index === 18 ? .55 : 0;
    stars.setAttribute("opacity", starOpacity);
    ambient.querySelector("#sun").setAttribute("opacity", index === 0 ? .15 : index === 1 ? .35 : index === 2 ? .65 : index === 3 ? .58 : index === 4 ? .12 : index === 12 ? .75 : index === 18 ? .08 : .32);
  }

  function updateTheia(p) {
    const q = clamp(p / .55);
    const x = lerp(1372, 1071, q);
    const y = lerp(72, 286, q);
    theia.setAttribute("transform", `translate(${x} ${y}) rotate(${q * 210})`);
    theiaTrail.setAttribute("stroke-dashoffset", 500 * (1 - smooth(.08, .55, p)));
    const impact = smooth(.48, .55, p) * (1 - smooth(.68, .78, p));
    impactBurst.setAttribute("opacity", impact);
    moonBirth.setAttribute("opacity", smooth(.57, .72, p));
    const moonScale = lerp(.35, 1, smooth(.57, .85, p));
    moonBirth.setAttribute("transform", `translate(${lerp(1094, 1144, smooth(.57,.9,p))} ${lerp(245, 222, smooth(.57,.9,p))}) scale(${moonScale})`);
  }

  function updateImpact(p) {
    const q = smooth(0, .78, p);
    const x = lerp(1450, 1033, q);
    const y = lerp(70, 374, q);
    asteroid.setAttribute("transform", `translate(${x} ${y}) rotate(${q * 280})`);
    asteroid.setAttribute("opacity", 1 - smooth(.79, .84, p));
    asteroidTrail.setAttribute("stroke-dashoffset", 700 * (1 - q));
    const flash = smooth(.74, .78, p) * (1 - smooth(.84, .93, p));
    impactFlash.setAttribute("opacity", flash);
    impactCrater.setAttribute("opacity", smooth(.77, .88, p));
  }

  function render(globalPosition) {
    const index = Math.min(chapters.length - 1, Math.floor(globalPosition));
    const p = globalPosition - index;
    if (index !== activeChapter) {
      activeChapter = index;
      updateCopy(index);
    }

    scenes.forEach((scene, i) => {
      let opacity = 0;
      if (i === index) opacity = 1 - smooth(.88, 1, p);
      else if (i === index + 1) opacity = smooth(.88, 1, p);
      else if (i === index - 1) opacity = 0;
      scene.setAttribute("opacity", opacity.toFixed(3));
    });

    updateAtmosphere(index, p);
    updateTheia(index === 0 ? p : 0);
    updateImpact(index === 8 ? p : 0);

    let globeOpacity = 1;
    if (index === 8) globeOpacity = 1 - smooth(.78, .97, p);
    else if (index > 8) globeOpacity = 0;
    globeGroup.setAttribute("opacity", globeOpacity.toFixed(3));

    const landVisibility = index === 0 ? 0 : index === 1 ? .48 : 1;
    landGroup.setAttribute("opacity", landVisibility.toFixed(3));
    lavaCracks.setAttribute("opacity", index === 0 ? .95 : index === 1 ? .45 : 0);
    iceCap.setAttribute("opacity", index === 4 ? .98 : index === 3 ? .08 : 0);

    if (index === 7) {
      const joining = smooth(0, .53, p);
      const splitting = smooth(.62, 1, p);
      updateLand(joining * (1 - splitting));
    } else {
      updateLand(0);
    }

    if (index === 12) nilePath.setAttribute("stroke-dashoffset", 1000 * (1 - smooth(.08, .72, p)));
    else nilePath.setAttribute("stroke-dashoffset", 1000);

    let fade = 0;
    if (index === 0) fade = 1 - smooth(0, .12, p);
    else if (index === chapters.length - 1) fade = smooth(.88, 1, p);
    sceneFadeRect.setAttribute("opacity", fade.toFixed(3));

    let headX = tickX[index];
    if (index < tickX.length - 1) headX = lerp(tickX[index], tickX[index + 1], p);
    playhead.setAttribute("transform", `translate(${headX} 0)`);
  }

  function frame(now) {
    const dt = Math.min(.1, (now - lastTime) / 1000);
    lastTime = now;
    if (playing && !dragging) elapsed += dt * speed;
    if (elapsed >= TOTAL_SECONDS) elapsed %= TOTAL_SECONDS;
    render(elapsed / CHAPTER_SECONDS);
    requestAnimationFrame(frame);
  }

  updatePlayIcon();
  setSpeed(1);
  render(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
