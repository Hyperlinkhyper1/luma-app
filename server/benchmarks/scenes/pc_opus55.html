<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LUMEN Aurora X</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<style>
  :root { --rgb: #7c5cff; --bg: rgba(12,14,19,.78); --line: rgba(255,255,255,.08); --txt: #d8dde6; --dim: #7d8594; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060a; color: var(--txt);
    font: 12px/1.35 "Segoe UI", system-ui, -apple-system, sans-serif; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #brand { position: fixed; left: 22px; top: 18px; pointer-events: none; user-select: none; }
  #brand h1 { margin: 0; font-size: 15px; letter-spacing: .38em; font-weight: 600; color: #eef1f6; }
  #brand h1 b { color: var(--rgb); font-weight: 600; transition: color .3s; }
  #brand p { margin: 4px 0 0; color: var(--dim); font-size: 11px; letter-spacing: .06em; }
  #tip { position: fixed; pointer-events: none; padding: 8px 11px; border-radius: 8px; background: var(--bg);
    border: 1px solid var(--line); backdrop-filter: blur(10px); opacity: 0; transition: opacity .15s; max-width: 240px; z-index: 5; }
  #tip b { display: block; color: #fff; font-size: 12px; } #tip i { font-style: normal; color: var(--dim); display: block; }
  #tip em { font-style: normal; color: var(--rgb); display: block; margin-top: 3px; font-variant-numeric: tabular-nums; }

  #hud { position: fixed; right: 16px; bottom: 16px; width: 316px; max-width: calc(100vw - 32px);
    max-height: calc(100vh - 32px); overflow-y: auto; overscroll-behavior: contain; background: var(--bg);
    border: 1px solid var(--line); border-radius: 16px; backdrop-filter: blur(16px) saturate(1.3);
    box-shadow: 0 20px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05); z-index: 4; scrollbar-width: thin; }
  #hud header { display: flex; align-items: center; gap: 8px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
  #hud header .t { font-weight: 600; letter-spacing: .22em; font-size: 10.5px; color: #eef1f6; }
  #led { width: 7px; height: 7px; border-radius: 50%; background: #d9822b; box-shadow: 0 0 6px #d9822b; transition: .3s; }
  #led.on { background: var(--rgb); box-shadow: 0 0 8px var(--rgb); }
  #status { margin-left: auto; color: var(--dim); font-size: 10.5px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
  #min { background: none; border: 0; color: var(--dim); cursor: pointer; font-size: 14px; padding: 0 2px; line-height: 1; transition: transform .25s; }
  #hud.collapsed #min { transform: rotate(180deg); }
  #hud.collapsed .body { display: none; }
  .body { padding: 12px 14px 14px; display: grid; gap: 13px; }
  .row1 { display: grid; grid-template-columns: 74px 1fr; gap: 12px; align-items: center; }
  #power { width: 74px; height: 74px; border-radius: 50%; border: 1px solid rgba(255,255,255,.1); cursor: pointer;
    background: radial-gradient(circle at 50% 38%, #23262e, #0c0d11 70%); display: grid; place-items: center; position: relative;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.6), 0 4px 14px rgba(0,0,0,.5); transition: transform .12s, box-shadow .4s; }
  #power:hover { transform: scale(1.04); } #power:active { transform: scale(.95); }
  #power svg { width: 30px; height: 30px; stroke: #6b7280; transition: stroke .4s, filter .4s; }
  #power::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid transparent; transition: .4s; }
  #power.on svg { stroke: var(--rgb); filter: drop-shadow(0 0 6px var(--rgb)); }
  #power.on::after { border-color: var(--rgb); box-shadow: 0 0 14px var(--rgb); opacity: .7; }
  #power.boot::after { border-color: var(--rgb); border-right-color: transparent; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .stat { background: rgba(255,255,255,.035); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
  .stat span { display: block; color: var(--dim); font-size: 9.5px; letter-spacing: .12em; }
  .stat b { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; color: #eef1f6; }
  .stat b small { font-size: 10px; color: var(--dim); font-weight: 400; margin-left: 1px; }
  #spark { width: 100%; height: 34px; display: block; border-radius: 6px; background: rgba(255,255,255,.025); border: 1px solid var(--line); }
  .lbl { color: var(--dim); font-size: 9.5px; letter-spacing: .16em; margin-bottom: 6px; display: flex; justify-content: space-between; }
  .lbl b { color: var(--txt); font-weight: 500; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  .colors { display: flex; gap: 6px; align-items: center; }
  .sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255,255,255,.12); cursor: pointer; padding: 0; transition: transform .12s, border-color .2s; flex: none; }
  .sw:hover { transform: scale(1.12); } .sw.sel { border-color: #fff; }
  .pick { position: relative; width: 38px; height: 26px; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,.18); margin-left: auto; flex: none;
    background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); cursor: pointer; }
  .pick input { position: absolute; inset: -6px; width: 60px; height: 40px; opacity: 0; cursor: pointer; }
  .pick::after { content: "+"; position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; color: #fff; text-shadow: 0 0 3px #000; pointer-events: none; }
  .seg { display: flex; background: rgba(255,255,255,.035); border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px; }
  .seg button { flex: 1; border: 0; background: none; color: var(--dim); padding: 6px 0; border-radius: 7px; cursor: pointer; font: inherit; font-size: 11px; transition: .18s; }
  .seg button:hover { color: #fff; background: rgba(255,255,255,.05); }
  .seg button.sel { background: rgba(255,255,255,.1); color: #fff; box-shadow: inset 0 -2px 0 var(--rgb); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 4px; background: rgba(255,255,255,.1); outline: none; margin: 6px 0 2px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px var(--rgb); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 3px solid var(--rgb); cursor: pointer; }
  .toggles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
  .tg { border: 1px solid var(--line); background: rgba(255,255,255,.035); color: var(--dim); border-radius: 8px; padding: 7px 0 6px;
    font: inherit; font-size: 10.5px; cursor: pointer; transition: .18s; display: grid; justify-items: center; gap: 3px; }
  .tg svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .tg:hover { color: #fff; border-color: rgba(255,255,255,.2); } .tg:active { transform: scale(.96); }
  .tg.on { color: #fff; border-color: var(--rgb); box-shadow: inset 0 0 12px color-mix(in srgb, var(--rgb) 25%, transparent); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-height: 640px), (max-width: 560px) { #hud { width: 290px; } .row1 { grid-template-columns: 60px 1fr; } #power { width: 60px; height: 60px; } #spark { display: none; } }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="brand"><h1>LUMEN <b>AURORA X</b></h1><p>drag to orbit · scroll to zoom · right-drag to pan · click any part to inspect</p></div>
<div id="tip"></div>

<div id="hud">
  <header><div id="led"></div><div class="t">CONTROL</div><div id="status">Standby</div><button id="min" title="Collapse">▾</button></header>
  <div class="body">
    <div class="row1">
      <button id="power" title="Power (P)" aria-label="Power">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
      </button>
      <div class="stats">
        <div class="stat"><span>CPU</span><b id="sCpu">24<small>°C</small></b></div>
        <div class="stat"><span>GPU</span><b id="sGpu">24<small>°C</small></b></div>
        <div class="stat"><span>DRAW</span><b id="sW">0<small>W</small></b></div>
        <div class="stat"><span>FANS</span><b id="sFan">0<small>rpm</small></b></div>
      </div>
    </div>
    <canvas id="spark" width="576" height="68"></canvas>
    <div>
      <div class="lbl">RGB <b id="hex">#7C5CFF</b></div>
      <div class="colors" id="swatches">
        <input type="hidden"/>
        <label class="pick" title="Any color"><input id="color" type="color" value="#7c5cff"/></label>
      </div>
      <input id="bright" type="range" min="0" max="100" value="85" aria-label="Brightness"/>
    </div>
    <div>
      <div class="lbl">EFFECT</div>
      <div class="seg" id="mode"><button data-v="static">Static</button><button data-v="breathe">Breathe</button><button data-v="wave" class="sel">Wave</button><button data-v="spectrum">Cycle</button><button data-v="thermal">Thermal</button></div>
    </div>
    <div class="two">
      <div><div class="lbl">FAN CURVE</div><div class="seg" id="profile"><button data-v="silent">Quiet</button><button data-v="balanced" class="sel">Bal</button><button data-v="turbo">Max</button></div></div>
      <div><div class="lbl">WORKLOAD</div><div class="seg" id="load"><button data-v="idle" class="sel">Idle</button><button data-v="gaming">Game</button><button data-v="render">Render</button></div></div>
    </div>
    <div>
      <div class="lbl">EXPLODED VIEW <b id="exV">0%</b></div>
      <input id="explode" type="range" min="0" max="100" value="0" aria-label="Exploded view"/>
    </div>
    <div class="toggles">
      <button class="tg" id="tGlass" title="Open the glass door"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="12" height="18" rx="1"/><path d="M16 5l4 2v12l-4 2"/></svg>Door</button>
      <button class="tg on" id="tOrbit" title="Auto orbit"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="4"/><circle cx="12" cy="12" r="2"/></svg>Orbit</button>
      <button class="tg" id="tNight" title="Dark room"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>Night</button>
      <button class="tg" id="tSound" title="Fan + POST sound"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>Sound</button>
      <button class="tg" id="tReset" title="Reset camera"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v4h4"/></svg>View</button>
      <button class="tg" id="tShot" title="Save a snapshot"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l2-3h4l2 3"/></svg>Shot</button>
      <button class="tg" id="tXray" title="Hide the side panels"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" stroke-dasharray="3 2.5"/></svg>Shell</button>
      <button class="tg" id="tCool" title="Show airflow"><svg viewBox="0 0 24 24"><path d="M3 8h11a3 3 0 1 0-3-3"/><path d="M3 12h15a3 3 0 1 1-3 3"/><path d="M3 16h7"/></svg>Airflow</button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const $ = id => document.getElementById(id);
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07080c);
scene.fog = new THREE.Fog(0x07080c, 9, 22);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.4;

const camera = new THREE.PerspectiveCamera(34, 1, 0.05, 60);
const HOME = { pos: new THREE.Vector3(4.1, 2.25, 3.4), target: new THREE.Vector3(0, 1.05, 0) };
camera.position.copy(HOME.pos);
const controls = new OrbitControls(camera, canvas);
controls.target.copy(HOME.target);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.minDistance = 1.1; controls.maxDistance = 9;
controls.maxPolarAngle = Math.PI * 0.52;
controls.autoRotate = true; controls.autoRotateSpeed = 0.55;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.75, 0.55, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------- helpers ---------- */
const rand = (() => { let s = 1337; return () => ((s = (s * 16807) % 2147483647) / 2147483647); })();
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
function rrShape(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s;
}
function mesh(geo, mat, parent, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m;
}
const box = (w, h, d, mat, parent, x, y, z) => mesh(new THREE.BoxGeometry(w, h, d), mat, parent, x, y, z);
const rbox = (w, h, d, r, mat, parent, x, y, z) => mesh(new RoundedBoxGeometry(w, h, d, 3, r), mat, parent, x, y, z);

/* ---------- materials ---------- */
const M = {
  shell: new THREE.MeshStandardMaterial({ color: 0x15171c, metalness: 0.45, roughness: 0.6 }),
  alu: new THREE.MeshStandardMaterial({ color: 0x8e949d, metalness: 1, roughness: 0.3 }),
  darkAlu: new THREE.MeshStandardMaterial({ color: 0x2a2d34, metalness: 0.9, roughness: 0.32 }),
  matte: new THREE.MeshStandardMaterial({ color: 0x0f1014, metalness: 0.2, roughness: 0.75 }),
  gloss: new THREE.MeshStandardMaterial({ color: 0x0a0b0e, metalness: 0.4, roughness: 0.18 }),
  nickel: new THREE.MeshStandardMaterial({ color: 0xdfe3e8, metalness: 1, roughness: 0.12 }),
  copper: new THREE.MeshStandardMaterial({ color: 0xc98552, metalness: 1, roughness: 0.22 }),
  fanFrame: new THREE.MeshStandardMaterial({ color: 0x131419, metalness: 0.3, roughness: 0.55 }),
  hub: new THREE.MeshStandardMaterial({ color: 0x1c1e24, metalness: 0.5, roughness: 0.35 }),
  white: new THREE.MeshStandardMaterial({ color: 0xd9dce2, metalness: 0.1, roughness: 0.5 }),
  sleeveA: new THREE.MeshStandardMaterial({ color: 0x1b1c21, roughness: 0.65 }),
  sleeveB: new THREE.MeshStandardMaterial({ color: 0xcfd3da, roughness: 0.6 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xa8b6c8, metalness: 0, roughness: 0.04, transparent: true, opacity: 0.07, depthWrite: false, envMapIntensity: 1.4, side: THREE.DoubleSide }),
  tubeGlass: new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0, roughness: 0.05, transparent: true, opacity: 0.22, depthWrite: false, envMapIntensity: 2 }),
};

/* ---------- power groups + RGB registry ---------- */
const groups = {};   // name -> {delay, p}
function grp(name, delay) { if (!groups[name]) groups[name] = { delay, p: 0 }; return name; }
const rgbItems = [];
function rgbMat(group, phase, gain, extra = {}) {
  const m = new THREE.MeshStandardMaterial({ color: 0x0b0b0e, roughness: 0.45, metalness: 0, ...extra });
  rgbItems.push({ m, group, phase, gain }); return m;
}
const fans = [];
const parts = [];     // inspectable
const explodeList = [];
function part(obj, info, explodeVec) {
  obj.userData.info = info; parts.push(obj);
  if (explodeVec) explodeList.push({ obj, base: obj.position.clone(), vec: explodeVec });
}

/* ---------- fan factory ---------- */
const bladeGeoCache = {};
function bladeGeo(r) {
  if (bladeGeoCache[r]) return bladeGeoCache[r];
  const s = new THREE.Shape();
  s.moveTo(r * .26, -r * .1);
  s.quadraticCurveTo(r * .7, -r * .3, r * .97, -r * .06);
  s.quadraticCurveTo(r * .93, r * .2, r * .62, r * .27);
  s.quadraticCurveTo(r * .4, r * .22, r * .26, r * .12);
  const g = new THREE.ShapeGeometry(s, 10); g.rotateX(0.5);
  return (bladeGeoCache[r] = g);
}
const hubLogo = canvasTex(128, 128, (c, w, h) => {
  c.fillStyle = '#16181d'; c.fillRect(0, 0, w, h);
  c.strokeStyle = '#3a3f49'; c.lineWidth = 5; c.beginPath(); c.arc(64, 64, 50, 0, Math.PI * 2); c.stroke();
  c.fillStyle = '#8b93a1'; c.font = '700 30px Segoe UI, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('L', 64, 66);
});
const hubCapMat = new THREE.MeshStandardMaterial({ map: hubLogo, metalness: .5, roughness: .35 });
function makeFan({ r, depth = 0.026, group, phase = 0, frame = true, blades = 9, dir = 1, kind = 'case' }) {
  const root = new THREE.Group();
  if (frame) {
    const s = rrShape(2 * r + 0.04, 2 * r + 0.04, 0.03);
    const hole = new THREE.Path(); hole.absarc(0, 0, r + 0.007, 0, Math.PI * 2, true); s.holes.push(hole);
    const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: true, bevelThickness: .003, bevelSize: .003, bevelSegments: 2, curveSegments: 40 });
    g.translate(0, 0, -depth / 2);
    mesh(g, M.fanFrame, root);
    for (let i = 0; i < 4; i++) {
      const arm = box(r * 0.95, 0.008, 0.006, M.fanFrame, root, 0, 0, -depth / 2 + 0.004);
      arm.geometry.translate(r * 0.47, 0, 0); arm.position.set(0, 0, -depth / 2 + 0.004); arm.rotation.z = Math.PI / 4 + i * Math.PI / 2;
    }
    const rb = mesh(new THREE.TorusGeometry(r + 0.003, 0.004, 6, 64), rgbMat(group, phase + .1, 1.4), root);
    rb.position.z = -depth / 2 + 0.002;
  }
  const ring = mesh(new THREE.TorusGeometry(r + 0.004, 0.0065, 8, 72), rgbMat(group, phase, 2.6), root);
  ring.position.z = depth / 2 - 0.002;
  const spin = new THREE.Group(); root.add(spin);
  const bm = rgbMat(group, phase, 0.38, { color: 0xc9ced8, roughness: 0.35, side: THREE.DoubleSide });
  const bg = bladeGeo(r);
  for (let i = 0; i < blades; i++) { const b = mesh(bg, bm, spin); b.rotation.z = i * Math.PI * 2 / blades * dir; if (dir < 0) b.scale.x = -1; }
  const hg = new THREE.CylinderGeometry(r * 0.3, r * 0.3, depth * 0.8, 36); hg.rotateX(Math.PI / 2);
  mesh(hg, M.hub, spin);
  const cap = mesh(new THREE.CircleGeometry(r * 0.29, 36), hubCapMat, spin); cap.position.z = depth * 0.4 + 0.0006;
  fans.push({ spin, group, rpm: 0, dir, kind });
  return root;
}

/* ---------- textures ---------- */
const moboTex = canvasTex(640, 760, (c, w, h) => {
  const g = c.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#0c1016'); g.addColorStop(1, '#090b10');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.lineCap = 'round';
  for (let i = 0; i < 340; i++) {
    let x = rand() * w, y = rand() * h;
    c.strokeStyle = `rgba(${110 + rand() * 40},${140 + rand() * 30},${160},${.07 + rand() * .1})`; c.lineWidth = .8 + rand() * 1.4;
    c.beginPath(); c.moveTo(x, y);
    for (let k = 0; k < 4; k++) { if (rand() < .5) x += (rand() - .5) * 180; else y += (rand() - .5) * 180; c.lineTo(x, y); }
    c.stroke();
  }
  for (let i = 0; i < 700; i++) { c.fillStyle = rand() < .5 ? '#1c2129' : '#2a2f38'; c.fillRect(rand() * w, rand() * h, 3 + rand() * 4, 2 + rand() * 3); }
  // socket
  c.fillStyle = '#12151b'; c.fillRect(285, 105, 170, 170); c.strokeStyle = '#3c4350'; c.lineWidth = 3; c.strokeRect(285, 105, 170, 170);
  // DIMM slots
  for (let i = 0; i < 4; i++) { c.fillStyle = '#1a1d24'; c.fillRect(88 + i * 26, 70, 14, 250); }
  // PCIe

    const a = b.a + b.y * 5 + Math.sin(t * 2 + b.w) * 0.3;
    tmpM.compose(tmpV.set(Math.cos(a) * b.r, b.y, Math.sin(a) * b.r), q0, sc1.setScalar(pumpF > 0.05 ? 1 : 0.0001));
    bubbles.setMatrixAt(i, tmpM);
  }
  bubbles.instanceMatrix.needsUpdate = true;

  // airflow
  const airTarget = airOn ? clamp(caseFanRpm / 1200, 0.15, 1) * 0.85 : 0;
  airMat.opacity = damp(airMat.opacity, airTarget, 3, dt);
  air.visible = airMat.opacity > 0.01;
  if (air.visible) {
    for (let i = 0; i < AIR; i++) {
      const a = airData[i]; a.t = (a.t + dt * a.sp * (0.08 + caseFanRpm / 9000)) % 1;
      airCurves[a.lane].getPointAt(a.t, tmpV);
      airPos[i * 3] = tmpV.x + a.ox * (1 - a.t * .5); airPos[i * 3 + 1] = tmpV.y + a.oy * (1 - a.t * .5); airPos[i * 3 + 2] = tmpV.z;
    }
    airGeo.attributes.position.needsUpdate = true;
    airMat.color.copy(tmpC.setHSL(0.55 - clamp((cpuT - 30) / 60, 0, 1) * 0.55, .8, .6));
  }

  // door, explode, lighting mood
  doorA = damp(doorA, doorOpen ? 1.85 : 0, 3.2, dt); hinge.rotation.y = doorA;
  explodeCur = damp(explodeCur, explodeT, 4, dt);
  const e = explodeCur * explodeCur * (3 - 2 * explodeCur);
  for (const x of explodeList) x.obj.position.copy(x.base).addScaledVector(x.vec, e);
  loop.visible = cables.visible = explodeCur < 0.03;
  const nk = night ? 1 : 0;
  key.intensity = damp(key.intensity, night ? 3 : 26, 3, dt);
  hemi.intensity = damp(hemi.intensity, night ? 0.04 : 0.35, 3, dt);
  rim.intensity = damp(rim.intensity, night ? 0.12 : 1.1, 3, dt);
  scene.environmentIntensity = damp(scene.environmentIntensity, night ? 0.1 : 0.4, 3, dt);
  bloom.strength = damp(bloom.strength, night ? 1.0 : 0.72, 3, dt);

  // sound
  if (audio) {
    const v = soundOn ? clamp((caseFanRpm + gpuFanRpm * 0.6 + pumpRpm * 0.15) / 2600, 0, 1) * 0.35 : 0;
    audio.gain.gain.setTargetAtTime(v, audio.ctx.currentTime, 0.1);
    audio.lp.frequency.setTargetAtTime(250 + caseFanRpm * 0.6, audio.ctx.currentTime, 0.2);
  }

  // LCD + HUD (throttled)
  lcdAcc += dt;
  if (lcdAcc > 0.08) {
    lcdAcc = 0; drawLCD(t); lcdTex.needsUpdate = true;
    lcdMat.color.setScalar(flick(groups.cpu.p) * 1.05);
  }
  hudAcc += dt;
  if (hudAcc > 0.12) {
    hudAcc = 0;
    $('sCpu').innerHTML = `${cpuT.toFixed(0)}<small>°C</small>`; $('sGpu').innerHTML = `${gpuT.toFixed(0)}<small>°C</small>`;
    $('sW').innerHTML = `${Math.round(watts)}<small>W</small>`; $('sFan').innerHTML = `${Math.round(caseFanRpm)}<small>rpm</small>`;
    const css = '#' + modeColor(tmpC, 0.3, t).clone().convertLinearToSRGB().getHexString();
    document.documentElement.style.setProperty('--rgb', on ? css : '#' + baseColor.clone().convertLinearToSRGB().getHexString());
    if (!booting && on && statusEl.textContent !== 'Online') statusEl.textContent = 'Online';
    drawSpark(css);
    if (hovered && pointerIn) showTip(hovered, lastMove.clientX, lastMove.clientY);
  }
  histAcc += dt;
  if (histAcc > 0.25) { histAcc = 0; hist.push(cpuT); histG.push(gpuT); if (hist.length > 120) { hist.shift(); histG.shift(); } }

  // hover
  if (moved && pointerIn && lastMove.buttons === 0) { moved = false; hovered = pickAt(lastMove); showTip(hovered, lastMove.clientX, lastMove.clientY); }

  // camera
  if (fly) {
    fly.t = Math.min(1, fly.t + dt / 1.1); const k = 1 - Math.pow(1 - fly.t, 3);
    controls.target.lerpVectors(fly.fromT, fly.toT, k); camera.position.lerpVectors(fly.fromP, fly.toP, k);
    if (fly.t >= 1) fly = null;
  }
  controls.target.clamp(new THREE.Vector3(-2, 0, -2), new THREE.Vector3(2, 2.5, 2));
  controls.update(dt);
  composer.render(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
