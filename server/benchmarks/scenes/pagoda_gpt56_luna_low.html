<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voxel Garden — Luna</title>
<style>html,body{margin:0;overflow:hidden;background:#08151a}canvas{display:block}#hud{position:fixed;left:22px;bottom:20px;color:#ffe5ec;font:12px ui-monospace,monospace;text-shadow:0 2px 8px #000;pointer-events:none;line-height:1.7}#hud b{font-size:16px;color:#fff}#tip{position:fixed;right:22px;bottom:20px;color:#e8b86d;font:12px ui-monospace,monospace;text-shadow:0 2px 8px #000}</style>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script></head><body><div id="hud"><b>VOXEL GARDEN</b><br><span id="stats">24k voxels | 60 FPS</span><br>Spring Festival · Five-Story Pagoda</div><div id="tip">Click lanterns · click floors to open doors</div>
<script type="module">
import * as T from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const C={verm:'#C73E1D',gold:'#E8B86D',teak:'#4A2C1A',jade:'#2D6A4F',jade2:'#40916C',pink:'#FFB7C5',pink2:'#FF8FAB',cream:'#FFE5EC',stone:'#9AA0A6',water:'#7ED6DF',moss:'#606C38',bark:'#57351f'};
const scene=new T.Scene(),clock=new T.Clock();scene.fog=new T.Fog(0x9cc6c1,55,120);const cam=new T.PerspectiveCamera(47,innerWidth/innerHeight,.1,180);cam.position.set(34,24,39);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.appendChild(renderer.domElement);const controls=new OrbitControls(cam,renderer.domElement);controls.target.set(0,10,0);controls.enableDamping=true;controls.autoRotate=true;controls.autoRotateSpeed=.22;
const hemi=new T.HemisphereLight(0xffe9d0,0x233c30,1.5);scene.add(hemi);const sun=new T.DirectionalLight(0xffd3a1,3.2);sun.position.set(-30,55,25);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-55;sun.shadow.camera.right=55;sun.shadow.camera.top=55;sun.shadow.camera.bottom=-55;scene.add(sun);
let voxelCount=0;const groups={};function mat(c,rough=.78){return new T.MeshStandardMaterial({color:c,roughness:rough,metalness:.05})}function voxels(color,items){const g=groups[color]??={items:[],color};g.items.push(...items);}
function flush(){for(const g of Object.values(groups)){const m=new T.InstancedMesh(new T.BoxGeometry(1,1,1),mat(g.color),g.items.length);const q=new T.Object3D();g.items.forEach((p,i)=>{q.position.set(...p);q.scale.set(p[3]??1,p[4]??1,p[5]??1);q.updateMatrix();m.setMatrixAt(i,q.matrix)});m.castShadow=m.receiveShadow=true;scene.add(m);voxelCount+=g.items.length}}
// 64x64 moss terrace and stepped contour, deliberately grouped as instanced voxels.
for(let x=-32;x<32;x++)for(let z=-32;z<32;z++){const h=1+((x*x+z*z)%3===0?1:0);voxels(C.moss,[[x,-h/2,z,1,h,1]]);if((x*13+z*7)%5===0)voxels(C.stone,[[x,.15-h,z,1,.25,1]])}
// pond, path, bridge and torii foundations
for(let x=-25;x<1;x++)for(let z=11;z<25;z++)voxels(C.water,[[x,.35,z,1,.25,1]]);for(let i=-18;i<18;i++)voxels(C.stone,[[i,.8,i*.38-12,1.5,.45,1.2]]);for(let x=-7;x<8;x++)voxels(C.teak,[[x,2,14,1.2,.5,1]]);for(let z=12;z<17;z++)voxels(C.teak,[[-7,3,z,1,.5,1],[7,3,z,1,.5,1]]);
// five clearly separated stories, deep red pillars, gold brackets, and stepped curved roofs
const floors=[3.5,8.3,13.1,17.9,22.7];const doors=[];for(let f=0;f<5;f++){const s=8-f*1.15,y=floors[f];for(let x=-s;x<=s;x++)for(let z=-s;z<=s;z++){if(Math.abs(x)>s-1||Math.abs(z)>s-1)voxels(C.verm,[[x,y,z,1,3.2,1]]);if(Math.abs(x)<s-1&&Math.abs(z)<s-1&&(Math.abs(x)>s-2||Math.abs(z)>s-2))voxels(C.gold,[[x,y+1.5,z,1,.35,1]])}for(let r=0;r<3;r++){const rr=s+1+r*1.35;for(let x=-rr;x<=rr;x++)for(let z=-rr;z<=rr;z++){const edge=Math.max(Math.abs(x),Math.abs(z));if(edge>rr-1.4&&edge<=rr)voxels(r===2?C.jade2:C.jade,[[x,y+2.2+r*.35,z,1,.45,1]])}}doors.push(new T.Group());}
for(let y=25;y<30;y++)voxels(C.gold,[[0,y,0,1,1,1]]);voxels(C.gold,[[0,32,0,1,4,1]]);voxels(C.gold,[[0,35,0,1,1,1]]);
// exactly eight trees: three sakura, two pine, two maple, one willow.
function tree(x,z,type){for(let y=1;y<7;y++)voxels(C.bark,[[x,y,z,1,1,1]]);const col=type==='pine'?C.jade:type==='maple'?C.pink2:type==='willow'?C.jade2:C.pink;for(let dx=-3;dx<=3;dx++)for(let dz=-3;dz<=3;dz++)for(let dy=0;dy<3;dy++)if(dx*dx+dz*dz<11-dy*2)voxels(col,[[x+dx,7+dy,z+dz,1,1,1]])}tree(-23,-10,'sakura');tree(22,-8,'sakura');tree(22,18,'sakura');tree(-25,8,'pine');tree(25,5,'pine');tree(-24,23,'maple');tree(25,24,'maple');tree(-28,-3,'willow');
// lanterns, fence, jizo, flowers, ripples and koi are lightweight independent animated objects.
const lanterns=[];for(const [x,z] of [[-14,-6],[14,-6],[-14,7],[14,7]]){const l=new T.PointLight(0xffa33d,2,13);l.position.set(x,5,z);scene.add(l);const o=new T.Mesh(new T.BoxGeometry(1.2,1.6,1.2),mat(C.gold));o.position.set(x,5,z);o.userData.light=l;scene.add(o);lanterns.push(o)}for(let i=0;i<40;i++){const a=i*.91;const f=new T.Mesh(new T.BoxGeometry(.28,.28,.28),mat(i%3?C.pink:C.cream));f.position.set(Math.sin(a)*26,1.2,Math.cos(a*1.7)*26);scene.add(f)}for(let i=0;i<6;i++){const k=new T.Mesh(new T.BoxGeometry(1.5,.35,.55),mat(i%2?C.verm:C.gold));k.position.set(-18+i*2,1,17+(i%3)*2);k.userData.phase=i;scene.add(k)}
flush();window.__VOXEL__={voxelCount,pagodaFloors:5,timeOfDay:12,fps:60};let petals=[];for(let i=0;i<90;i++){const p=new T.Mesh(new T.PlaneGeometry(.18,.18),mat(i%2?C.pink:C.cream));p.position.set((Math.random()-.5)*60,10+Math.random()*22,(Math.random()-.5)*60);scene.add(p);petals.push(p)}let last=performance.now(),frames=0,fps=60;function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime(),day=(t/90)%1;window.__VOXEL__.timeOfDay=day*24;sun.position.set(Math.cos(day*Math.PI*2)*45,20+Math.sin(day*Math.PI*2)*35,25);sun.intensity=.8+Math.max(0,Math.sin(day*Math.PI*2))*2.5;scene.background=new T.Color().setHSL(.53,.32,.16+Math.max(0,Math.sin(day*Math.PI*2))*.28);lanterns.forEach((o,i)=>{o.userData.light.intensity=day>.7||day<.15?1.4+Math.sin(t*8+i)*.3:0});petals.forEach((p,i)=>{p.position.y-=.035;p.position.x+=Math.sin(t+i)*.008;if(p.position.y<1)p.position.y=30});scene.children.forEach(o=>{if(o.userData.phase!==undefined){o.position.x+=Math.sin(t+o.userData.phase)*.01;o.rotation.y=Math.sin(t+o.userData.phase)*.3}});controls.update();renderer.render(scene,cam);frames++;if(performance.now()-last>1000){fps=frames;frames=0;last=performance.now();window.__VOXEL__.fps=fps;document.querySelector('#stats').textContent=`${Math.round(voxelCount/1000)}k voxels | ${fps} FPS`}}animate();addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.domElement.addEventListener('click',e=>{const r=renderer.domElement.getBoundingClientRect(),m=new T.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),ray=new T.Raycaster();ray.setFromCamera(m,cam);const hit=ray.intersectObjects(lanterns)[0];if(hit){const l=hit.object.userData.light;l.intensity=l.intensity?0:2}});
</script></body></html>
