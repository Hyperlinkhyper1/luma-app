<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NOVA ATX — Interactive 3D PC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#27e0ff;
    --accent-soft:rgba(39,224,255,0.16);
    --panel:rgba(12,14,20,0.82);
    --panel-border:rgba(255,255,255,0.08);
    --text:#e8ebf1;
    --text-dim:#8b93a5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#05060a;font-family:'Inter',system-ui,sans-serif;color:var(--text);}
  body{
    background:
      radial-gradient(1200px 800px at 70% 20%, rgba(30,40,66,0.55), transparent 60%),
      radial-gradient(900px 700px at 20% 80%, rgba(10,16,30,0.7), transparent 60%),
      #05060a;
    transition:background 1s ease;
    -webkit-user-select:none;user-select:none;
  }
  body.studio{
    background:
      radial-gradient(1200px 800px at 70% 20%, rgba(70,82,112,0.5), transparent 60%),
      radial-gradient(900px 700px at 20% 80%, rgba(34,42,60,0.55), transparent 60%),
      #14171f;
  }
  #c{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
  #c:active{cursor:grabbing}
  .vignette{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 220px rgba(0,0,0,0.75);z-index:1}

  /* Brand */
  #brand{position:fixed;top:22px;left:26px;z-index:5;pointer-events:none}
  #brand .logo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:26px;letter-spacing:4px;line-height:1;
    background:linear-gradient(90deg,#fff,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 12px rgba(39,224,255,0.35));}
  #brand .sub{margin-top:6px;font-size:11px;letter-spacing:2.4px;color:var(--text-dim);text-transform:uppercase}

  /* Hint */
  #hint{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);z-index:5;pointer-events:none;
    background:var(--panel);border:1px solid var(--panel-border);border-radius:20px;padding:11px 18px;
    font-size:13px;color:var(--text-dim);letter-spacing:.5px;display:flex;align-items:center;gap:9px;
    transition:opacity .8s ease,transform .8s ease;backdrop-filter:blur(8px);}
  #hint .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  #hint.hide{opacity:0;transform:translateX(-50%) translateY(12px)}

  /* HUD */
  #hud{position:fixed;right:22px;bottom:22px;z-index:5;width:308px;max-height:calc(100vh - 44px);overflow-y:auto;
    background:var(--panel);border:1px solid var(--panel-border);border-radius:18px;padding:16px 16px 14px;
    backdrop-filter:blur(14px);box-shadow:0 18px 50px rgba(0,0,0,0.5);}
  #hud::-webkit-scrollbar{width:6px}
  #hud::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.14);border-radius:3px}
  .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .head .bm{font-family:'Orbitron',sans-serif;font-weight:700;font-size:13px;letter-spacing:3px;color:#fff}
  .status{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:1.5px;color:var(--text-dim)}
  .status .sd{width:8px;height:8px;border-radius:50%;background:#3a4356;transition:background .3s, box-shadow .3s}
  .status.on .sd{background:#39e86b;box-shadow:0 0 10px #39e86b}
  .status.on{color:#b9f0c9}

  .power-row{display:flex;align-items:center;gap:14px;margin-bottom:4px}
  .power-btn{position:relative;width:62px;height:62px;border-radius:50%;border:1px solid rgba(255,255,255,0.12);cursor:pointer;
    background:radial-gradient(circle at 35% 30%,#2b3040,#151922 70%);display:flex;align-items:center;justify-content:center;
    transition:transform .12s ease, box-shadow .25s ease;box-shadow:0 6px 18px rgba(0,0,0,0.5);}
  .power-btn:hover{transform:translateY(-1px)}
  .power-btn:active{transform:scale(0.94)}
  .power-btn svg{width:24px;height:24px;stroke:#9aa3b8;fill:none;stroke-width:2;transition:stroke .25s, filter .25s}
  .power-btn.on{border-color:rgba(39,224,255,0.6);box-shadow:0 0 0 4px rgba(39,224,255,0.12),0 0 22px rgba(39,224,255,0.4)}
  .power-btn.on svg{stroke:var(--accent);filter:drop-shadow(0 0 6px var(--accent))}
  .power-info .pl{font-size:11px;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase}
  .power-info .ps{font-size:13px;font-weight:600;margin-top:3px}

  .sep{height:1px;background:var(--panel-border);margin:12px 0}
  .st{font-size:10px;letter-spacing:2.4px;color:var(--text-dim);text-transform:uppercase;margin-bottom:9px}

  .picker{display:flex;gap:8px}
  .picker canvas{border-radius:8px;cursor:crosshair;border:1px solid var(--panel-border)}
  #svCanvas{width:176px;height:104px}
  #hueCanvas{width:24px;height:104px}

  .swatches{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .sw{width:20px;height:20px;border-radius:6px;cursor:pointer;border:1px solid rgba(255,255,255,0.18);transition:transform .12s}
  .sw:hover{transform:scale(1.18)}
  .sw.sel{box-shadow:0 0 0 2px #fff}

  .slider-row{display:flex;align-items:center;gap:9px;margin-top:9px}
  .slider-row label{font-size:11px;color:var(--text-dim);width:74px;letter-spacing:.5px;flex:none}
  .slider-row input{flex:1;appearance:none;-webkit-appearance:none;height:4px;border-radius:3px;background:linear-gradient(90deg,var(--accent),#3a4356);outline:none;cursor:pointer}
  .slider-row input::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;border:2px solid var(--accent);box-shadow:0 0 8px rgba(39,224,255,0.5)}
  .slider-row input::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--accent)}
  .slider-row .val{font-size:11px;color:var(--text);width:52px;text-align:right;font-variant-numeric:tabular-nums}

  .mode-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
  .mode{padding:8px 4px;border-radius:8px;border:1px solid var(--panel-border);background:rgba(255,255,255,0.03);color:var(--text-dim);
    font-size:11px;letter-spacing:.6px;cursor:pointer;transition:all .18s;font-family:'Inter',sans-serif}
  .mode:hover{color:var(--text)}
  .mode.active{background:var(--accent-soft);border-color:var(--accent);color:#fff}

  .btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .chip{padding:8px 6px;border-radius:8px;border:1px solid var(--panel-border);background:rgba(255,255,255,0.03);color:var(--text-dim);
    font-size:11px;cursor:pointer;transition:all .18s;font-family:'Inter',sans-serif;letter-spacing:.3px}
  .chip:hover{color:var(--text);border-color:rgba(255,255,255,0.2)}
  .chip.active{background:var(--accent-soft);border-color:var(--accent);color:#fff}

  @media (max-width:640px){
    #hud{right:10px;bottom:10px;width:286px}
    #brand{top:14px;left:16px}
    #brand .logo{font-size:20px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vignette"></div>

<div id="brand">
  <div class="logo">NOVA ATX</div>
  <div class="sub">Aeris Custom Loop · Interactive</div>
</div>

<div id="hint"><span class="dot"></span>Press the power button to boot the system</div>

<div id="hud">
  <div class="head">
    <span class="bm">CONTROL PANEL</span>
    <span class="status" id="status"><span class="sd"></span><span id="statusText">OFFLINE</span></span>
  </div>

  <div class="power-row">
    <button class="power-btn" id="powerBtn" title="Power">
      <svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg>
    </button>
    <div class="power-info">
      <div class="pl">System Power</div>
      <div class="ps" id="powerSub">Click to boot</div>
    </div>
  </div>

  <div class="sep"></div>

  <div class="st">RGB Lighting</div>
  <div class="picker">
    <canvas id="svCanvas" width="176" height="104"></canvas>
    <canvas id="hueCanvas" width="24" height="104"></canvas>
  </div>
  <div class="swatches" id="swatches"></div>

  <div class="slider-row">
    <label>Brightness</label>
    <input type="range" id="brightness" min="0" max="100" value="88">
    <span class="val" id="brightVal">88%</span>
  </div>

  <div class="mode-row">
    <button class="mode active" data-mode="static">Static</button>
    <button class="mode" data-mode="breathing">Breathe</button>
    <button class="mode" data-mode="rainbow">Rainbow</button>
    <button class="mode" data-mode="wave">Wave</button>
  </div>

  <div class="sep"></div>

  <div class="st">Cooling</div>
  <div class="slider-row">
    <label>Fan Speed</label>
    <input type="range" id="fanSpeed" min="0" max="100" value="55">
    <span class="val" id="rpmLabel">1100 RPM</span>
  </div>

  <div class="sep"></div>

  <div class="st">Environment</div>
  <div class="btn-grid">
    <button class="chip" id="panelBtn">Glass Panel: Closed</button>
    <button class="chip" id="envBtn">Room: Studio</button>
    <button class="chip" id="rotateBtn">Auto-Rotate: Off</button>
    <button class="chip" id="resetBtn">Reset View</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ============================== RENDERER / SCENE ==============================
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(7.2, 4.4, 8.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3.2;
controls.maxDistance = 16;
controls.maxPolarAngle = 1.52;
controls.minPolarAngle = 0.18;
controls.autoRotateSpeed = 0.9;

// Environment maps (studio + dark) built from procedural scenes
const pmrem = new THREE.PMREMGenerator(renderer);
function buildEnv(kind){
  const sc = new THREE.Scene();
  const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(60, 32, 16),
    new THREE.MeshBasicMaterial({ color: kind==='studio' ? 0x3b3f4a : 0x07080c, side: THREE.BackSide })
  );
  sc.add(sphere);
  const lights = kind==='studio'
    ? [ [0xffffff, 12], [0xffffff, 7] ]
    : [ [0x2266cc, 2.2], [0xcc2266, 1.4], [0x11cc99, 1.1] ];
  lights.forEach(([c, s], i)=>{
    const p = new THREE.Mesh(new THREE.PlaneGeometry(s, s), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide }));
    p.position.set(i===0 ? 9 : -14, 8 - i*3, -8);
    p.lookAt(0,0,0);
    sc.add(p);
  });
  return pmrem.fromScene(sc, 0.04).texture;
}
const envStudio = buildEnv('studio');
const envDark = buildEnv('dark');
scene.environment = envStudio;

// ============================== MATERIALS ==============================
const M = {
  caseWhite:  new THREE.MeshStandardMaterial({ color:0xe9eaef, roughness:0.42, metalness:0.08 }),
  caseWhite2: new THREE.MeshStandardMaterial({ color:0xdcdde3, roughness:0.5, metalness:0.06 }),
  dark:       new THREE.MeshStandardMaterial({ color:0x121318, roughness:0.55, metalness:0.25 }),
  darkMetal:  new THREE.MeshStandardMaterial({ color:0x1b1c22, roughness:0.5, metalness:0.45 }),
  pcb:        new THREE.MeshStandardMaterial({ color:0x0b0d14, roughness:0.62, metalness:0.15 }),
  silver:     new THREE.MeshStandardMaterial({ color:0xc9ccd4, roughness:0.3, metalness:0.85 }),
  silver2:    new THREE.MeshStandardMaterial({ color:0x9aa0ab, roughness:0.35, metalness:0.8 }),
  blackGloss: new THREE.MeshStandardMaterial({ color:0x0d0e12, roughness:0.35, metalness:0.4 }),
  blade:      new THREE.MeshStandardMaterial({ color:0x0c0d11, roughness:0.4, metalness:0.25 }),
  fanFrame:   new THREE.MeshStandardMaterial({ color:0x141519, roughness:0.55, metalness:0.2 }),
  cable:      new THREE.MeshStandardMaterial({ color:0xe7e8ec, roughness:0.65, metalness:0.02 }),
  cableDark:  new THREE.MeshStandardMaterial({ color:0x1a1b20, roughness:0.7, metalness:0.05 }),
  glass:      new THREE.MeshPhysicalMaterial({ color:0xf2f6ff, roughness:0.06, metalness:0, transparent:true, opacity:0.10, clearcoat:1, clearcoatRoughness:0.08 }),
  glassEdge:  new THREE.MeshPhysicalMaterial({ color:0xcdd4de, roughness:0.2, metalness:0.05, transparent:true, opacity:0.35 }),
  psu:        new THREE.MeshStandardMaterial({ color:0x181a1f, roughness:0.5, metalness:0.6 }),
};

// ============================== HELPERS ==============================
const fans = []; // registry of spinning fan blades (declared early — used by GPU/PSU/fans)
function box(w,h,d,mat){ return new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); }
function rbox(w,h,d,mat,r=0.03){ return new THREE.Mesh(new RoundedBoxGeometry(w,h,d,3,r), mat); }
function place(parent, mesh, x,y,z, rx=0,ry=0,rz=0){
  mesh.position.set(x,y,z);
  mesh.rotation.set(rx,ry,rz);
  parent.add(mesh);
  return mesh;
}
const smoothstep = (x)=> { x=Math.max(0,Math.min(1,x)); return x*x*(3-2*x); };

function canvasTexture(size, draw){
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  draw(cv.getContext('2d'), size);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
function brandLogo(size, color){
  return canvasTexture(size, (ctx,s)=>{
    ctx.fillStyle = '#0a0b0e'; ctx.fillRect(0,0,s,s);
    ctx.fillStyle = color; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font = `900 ${s*0.42}px Orbitron, sans-serif`;
    ctx.fillText('N', s*0.5, s*0.48);
    ctx.font = `${s*0.13}px Orbitron, sans-serif`;
    ctx.fillText('N O V A', s*0.5, s*0.82);
  });
}

// ============================== RGB SYSTEM ==============================
const rgbZones = [];
let rgbIndex = 0;
function addRgb(material, intensity, order){
  material.emissive = new THREE.Color(0,0,0);
  material.emissiveIntensity = 1;
  rgbZones.push({ material, intensity, idx: rgbIndex++, order: order ?? (rgbIndex/40) });
  return material;
}
function frost(intensity, order){
  const m = new THREE.MeshStandardMaterial({ color:0xd9dde4, roughness:0.34, metalness:0.04 });
  return addRgb(m, intensity, order);
}

let rgbColor = new THREE.Color(0.15, 0.85, 1.0);
let rgbBrightness = 0.88;
let rgbMode = 'static';
let hue = 0.52, sat = 1.0, val = 1.0;

function applyRgb(t){
  let baseColor = rgbColor.clone();
  const gated = [];
  for (let i=0;i<rgbZones.length;i++){
    const z = rgbZones[i];
    const gate = smoothstep((powerLevel - z.order*0.6)/0.42);
    gated.push(gate);
  }
  rgbZones.forEach((z, i)=>{
    let color, amt;
    if (rgbMode==='rainbow'){
      color = new THREE.Color().setHSL(((t*0.12) + z.idx*0.055)%1, 0.85, 0.55);
      amt = 1;
    } else if (rgbMode==='wave'){
      color = baseColor;
      amt = 0.5 + 0.5*Math.sin(t*2.4 + z.idx*0.85);
    } else if (rgbMode==='breathing'){
      color = baseColor;
      amt = 0.5 + 0.5*Math.sin(t*1.9);
    } else {
      color = baseColor; amt = 1;
    }
    z.material.emissive.copy(color);
    z.material.emissiveIntensity = Math.max(0, amt * rgbBrightness * z.intensity * gated[i]);
    z.material.color.setRGB(0.92,0.94,0.96); // keep frost bright when off
  });
  // RGB point lights
  const spill = rgbBrightness * (powerLevel>0.05 ? 1:0);
  rgbLights.forEach((l, i)=>{
    const c = rgbMode==='rainbow'
      ? new THREE.Color().setHSL((t*0.12 + i*0.1)%1, 0.85, 0.55)
      : rgbColor;
    l.color.copy(c);
    l.intensity = spill * l.userData.base * (0.55 + 0.45*Math.sin(t*1.9 + i));
  });
}

// ============================== LIGHTS ==============================
const ambient = new THREE.AmbientLight(0x3a4150, 0.55);
const hemi = new THREE.HemisphereLight(0x9fb0c8, 0x0d0e12, 0.5);
const key = new THREE.DirectionalLight(0xffffff, 1.7);
key.position.set(5, 8, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -7; key.shadow.camera.right = 7;
key.shadow.camera.top = 7; key.shadow.camera.bottom = -7;
key.shadow.camera.near = 1; key.shadow.camera.far = 40;
key.shadow.bias = -0.0004;
key.shadow.radius = 5;
const fill = new THREE.DirectionalLight(0x8fa6ff, 0.35);
fill.position.set(-5, 3, -4);
scene.add(ambient, hemi, key, fill);

const rgbLights = [];
function addRgbLight(x,y,z,base,dist){
  const l = new THREE.PointLight(0xffffff, 0, dist, 2);
  l.position.set(x,y,z); l.userData.base = base;
  scene.add(l); rgbLights.push(l);
  return l;
}
addRgbLight(0.1, 3.5, 1.1, 7, 7);   // interior upper
addRgbLight(-0.2, 1.0, 0.4, 6, 7);   // interior lower
addRgbLight(0, 0.12, 0, 5, 6);       // underglow

// ============================== FAN ==============================
function fanBladeGeometry(radius){
  const w = radius*0.24;
  const s = new THREE.Shape();
  s.moveTo(0, -w*0.32);
  s.lineTo(radius*0.9, -w*0.30);
  s.quadraticCurveTo(radius*1.02, 0.0, radius*0.88, w*0.55);
  s.lineTo(radius*0.12, w*0.52);
  s.quadraticCurveTo(-radius*0.04, 0.0, 0, -w*0.32);
  const g = new THREE.ExtrudeGeometry(s, { depth:0.035, bevelEnabled:false });
  g.translate(0,0,-0.017);
  return g;
}
const bladeGeos = new Map();
function createFan(radius, order){
  const g = new THREE.Group();
  const frame = rbox(radius*2.14, radius*2.14, 0.2, M.fanFrame, 0.045);
  g.add(frame);
  // corner braces
  const brace = box(radius*0.42, radius*0.42, 0.22, M.fanFrame);
  const bpos = radius*0.82;
  [[bpos,bpos],[bpos,-bpos],[-bpos,bpos],[-bpos,-bpos]].forEach(([x,y])=>{
    const b = brace.clone(); b.position.set(x,y,0); g.add(b);
  });
  // RGB ring
  const ring = new THREE.Mesh(new THREE.TorusGeometry(radius*0.94, radius*0.085, 14, 56), frost(1.5, order));
  g.add(ring);
  // hub
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(radius*0.3, radius*0.3, 0.14, 28), M.blackGloss);
  hub.rotation.x = Math.PI/2; g.add(hub);
  const hubCap = new THREE.Mesh(new THREE.CylinderGeometry(radius*0.16, radius*0.16, 0.16, 24), M.silver2);
  hubCap.rotation.x = Math.PI/2; g.add(hubCap);
  // blades (geometry cached per radius)
  if(!bladeGeos.has(radius)) bladeGeos.set(radius, fanBladeGeometry(radius));
  const bladeGeo = bladeGeos.get(radius);
  const blades = new THREE.Group();
  const n = 7;
  for(let i=0;i<n;i++){
    const holder = new THREE.Group();
    holder.rotation.z = (i/n)*Math.PI*2;
    const b = new THREE.Mesh(bladeGeo, M.blade);
    b.rotation.x = -0.5;
    holder.add(b);
    blades.add(holder);
  }
  g.add(blades);
  g.userData.blades = blades;
  g.userData.speed = 13;
  return g;
}

// ============================== FRAME / GLASS ==============================
function makeFrame(w,h,t,mat){
  const g = new THREE.Group();
  const bars = [[w,t,t,0,h/2-t/2,0],[w,t,t,0,-h/2+t/2,0],[t,h,t,w/2-t/2,0,0],[t,h,t,-w/2+t/2,0,0]];
  bars.forEach(([bw,bh,bd,x,y,z])=>{
    const m = rbox(bw,bh,bd, mat, 0.02); m.position.set(x,y,z); g.add(m);
  });
  return g;
}

// ============================== BUILD: FLOOR / PEDESTAL ==============================
const world = new THREE.Group();
scene.add(world);

const ground = new THREE.Mesh(new THREE.CircleGeometry(40, 64), new THREE.MeshStandardMaterial({ color:0x0a0b0f, roughness:0.7, metalness:0.1 }));
ground.rotation.x = -Math.PI/2; ground.position.y = -0.36; ground.receiveShadow = true;
scene.add(ground);

function makeCable(points, mat, r, strands=2){
  const g = new THREE.Group();
  const pts = points.map(p=>new THREE.Vector3(p[0],p[1],p[2]));
  const curve = new THREE.CatmullRomCurve3(pts);
  g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 36, r, 9, false), mat));
  const segs = curve.getPoints(40);
  for(let s=0;s<strands;s++){
    const dir = s===0?1:-1;
    const off = segs.map(pt=> new THREE.Vector3(pt.x + dir*r*0.72, pt.y, pt.z));
    const c2 = new THREE.CatmullRomCurve3(off);
    g.add(new THREE.Mesh(new THREE.TubeGeometry(c2, 36, r*0.55, 8, false), mat));
  }
  return g;
}

      powerSub.textContent = 'Click to boot';

}

// Color picker
const svCanvas = document.getElementById('svCanvas');
const hueCanvas = document.getElementById('hueCanvas');
const svCtx = svCanvas.getContext('2d');
const hueCtx = hueCanvas.getContext('2d');

function renderHue(){
  const g = hueCtx.createLinearGradient(0,0,0,hueCanvas.height);
  g.addColorStop(0,'#f00'); g.addColorStop(0.17,'#ff0'); g.addColorStop(0.33,'#0f0');
  g.addColorStop(0.5,'#0ff'); g.addColorStop(0.67,'#00f'); g.addColorStop(0.83,'#f0f'); g.addColorStop(1,'#f00');
  hueCtx.fillStyle = g; hueCtx.fillRect(0,0,hueCanvas.width,hueCanvas.height);
  const y = hue*hueCanvas.height;
  hueCtx.fillStyle='#fff'; hueCtx.strokeStyle='rgba(0,0,0,0.4)'; hueCtx.lineWidth=1;
  hueCtx.beginPath(); hueCtx.arc(hueCanvas.width/2, y, 5, 0, Math.PI*2); hueCtx.fill(); hueCtx.stroke();
}
function renderSV(){
  const w = svCanvas.width, h = svCanvas.height;
  const base = new THREE.Color().setHSL(hue,1,0.5);
  svCtx.fillStyle = '#'+base.getHexString();
  svCtx.fillRect(0,0,w,h);
  const gWhite = svCtx.createLinearGradient(0,0,w,0); gWhite.addColorStop(0,'#fff'); gWhite.addColorStop(1,'rgba(255,255,255,0)');
  svCtx.fillStyle = gWhite; svCtx.fillRect(0,0,w,h);
  const gBlack = svCtx.createLinearGradient(0,0,0,h); gBlack.addColorStop(0,'rgba(0,0,0,0)'); gBlack.addColorStop(1,'#000');
  svCtx.fillStyle = gBlack; svCtx.fillRect(0,0,w,h);
  const x = sat*w, y = (1-val)*h;
  svCtx.strokeStyle='#fff'; svCtx.lineWidth=2;
  svCtx.beginPath(); svCtx.arc(x,y,6,0,Math.PI*2); svCtx.stroke();
  svCtx.strokeStyle='rgba(0,0,0,0.5)'; svCtx.lineWidth=1;
  svCtx.beginPath(); svCtx.arc(x,y,8,0,Math.PI*2); svCtx.stroke();
}
function updateColor(){
  rgbColor.setHSL(hue, sat, val);
  renderHue(); renderSV();
  swatches.forEach(s=> s.classList.toggle('sel', Math.abs(s.dataset.h - hue)<0.005));
}
function pickSV(e){
  const r = svCanvas.getBoundingClientRect();
  sat = Math.max(0, Math.min(1, (e.clientX - r.left)/r.width));
  val = Math.max(0, Math.min(1, 1 - (e.clientY - r.top)/r.height));
  updateColor();
}
function pickHue(e){
  const r = hueCanvas.getBoundingClientRect();
  hue = Math.max(0, Math.min(1, (e.clientY - r.top)/r.height));
  updateColor();
}
let dragging = null;
svCanvas.addEventListener('pointerdown', e=>{ dragging='sv'; svCanvas.setPointerCapture(e.pointerId); pickSV(e); });
hueCanvas.addEventListener('pointerdown', e=>{ dragging='hue'; hueCanvas.setPointerCapture(e.pointerId); pickHue(e); });
window.addEventListener('pointermove', e=>{ if(dragging==='sv') pickSV(e); else if(dragging==='hue') pickHue(e); });
window.addEventListener('pointerup', ()=>{ dragging=null; });

  controls.autoRotate = autoRotate;
  rotateBtn.textContent = 'Auto-Rotate: ' + (autoRotate?'On':'Off');
  rotateBtn.classList.toggle('active', autoRotate);
});

// reset view
const resetBtn = document.getElementById('resetBtn');
let camAnim = null;
resetBtn.addEventListener('click', ()=>{
  camAnim = { t:0, fromPos:camera.position.clone(), toPos:new THREE.Vector3(7.2,4.4,8.2), fromTgt:controls.target.clone(), toTgt:new THREE.Vector3(0,2.1,0) };
});

// hint
function hideHint(){ document.getElementById('hint').classList.add('hide'); }
controls.addEventListener('start', hideHint);
controls.addEventListener('change', hideHint);

// ============================== LCD DRAW ==============================
function drawLcd(t, on, temp, load, fanPct){
  const s = 128; const ctx = lcdCtx;
  ctx.clearRect(0,0,s,s);
  ctx.fillStyle = on ? '#06070b' : '#08080b';
  ctx.fillRect(0,0,s,s);
  if(!on){
    ctx.fillStyle='#2a2f3a'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='700 12px Inter, sans-serif';
    ctx.fillText('— OFF —', s/2, s/2);
    lcdTex.needsUpdate = true; return;
  }
  // header
  ctx.fillStyle='#27e0ff'; ctx.textAlign='left'; ctx.font='900 18px Orbitron, sans-serif';
  ctx.fillText('NOVA', 8, 20);
  ctx.fillStyle='#5a6270'; ctx.font='600 8px Inter, sans-serif';
  ctx.fillText('AERIS AIO', 8, 32);
  // CPU temp
  ctx.textAlign='right'; ctx.fillStyle='#e8ebf1'; ctx.font='700 30px Orbitron, sans-serif';
  ctx.fillText(Math.round(temp)+'°', s-8, 52);
  ctx.fillStyle='#5a6270'; ctx.font='600 8px Inter, sans-serif'; ctx.fillText('CPU', s-8, 64);
  // bars
  const bars = [[ 'LOAD', load, 8 ], ['FAN', fanPct, 6 ], ['FLOW', 0.6+0.3*Math.sin(t), 4 ]];
  let y = 78;
  bars.forEach(([label, v, colorIdx])=>{
    ctx.textAlign='left'; ctx.fillStyle='#5a6270'; ctx.font='600 8px Inter, sans-serif';
    ctx.fillText(label, 8, y);
    ctx.fillStyle='#1a1e26'; ctx.fillRect(40, y-5, s-48, 8);
    const col = ['#27e0ff','#39e86b','#ffb03a'][colorIdx%3];
    ctx.fillStyle = col; ctx.fillRect(40, y-5, (s-48)*Math.max(0,Math.min(1,v)), 8);
    y += 15;
  });
  lcdTex.needsUpdate = true;
}

// ============================== ANIMATION LOOP ==============================
const clock = new THREE.Clock();
let lcdTimer = 0;
const tempBase = 42;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // power ramp
  const rate = powerTarget > powerLevel ? 1.5 : 2.8;
  powerLevel += (powerTarget - powerLevel) * Math.min(1, rate*dt);
  if(powerLevel < 0.002 && powerTarget === 0) powerLevel = 0;
  if(powerLevel > 0.998) powerLevel = 1;

  // fans
  for(const f of fans){
    f.blades.rotation.z += dt * f.speed * fanSpeedVal * powerLevel;
  }

  // RGB
  applyRgb(t);

  // environment lerp
  const envTarget = studioMode ? 0 : 1;
  envMix += (envTarget - envMix) * Math.min(1, 3*dt);
  const e = 1 - envMix;
  ambient.intensity = 0.18 + 0.5*e;
  hemi.intensity = 0.12 + 0.5*e;
  key.intensity = 0.4 + 1.5*e;
  fill.intensity = 0.05 + 0.4*e;
  renderer.toneMappingExposure = 0.85 + 0.3*e;
  if(envMix > 0.5 && scene.environment !== envDark) scene.environment = envDark;
  else if(envMix <= 0.5 && scene.environment !== envStudio) scene.environment = envStudio;

  // particles
  particles.rotation.y += dt*0.015;
  pMat.opacity = 0.25 + 0.4*e;

  // side panel animation (smooth slide + subtle glass wobble)
  panelLevel += ((panelOpen ? 1 : 0) - panelLevel) * Math.min(1, 5*dt);
  const panelOpenAmt = smoothstep(panelLevel);
  sidePanel.position.x = CASE.W/2 + panelOpenAmt*0.62;
  sidePanel.rotation.z = Math.sin(t*0.7)*0.006*panelOpenAmt;

  // LCD
  lcdTimer -= dt;
  if(lcdTimer <= 0){
    lcdTimer = 0.4;
    const load = powerLevel>0.05 ? (0.25 + 0.35*Math.abs(Math.sin(t*0.9)) + 0.1*Math.sin(t*3.1)) : 0;
    const temp = powerLevel>0.05 ? tempBase + load*30 + 3*Math.sin(t*1.3) : 22;
    drawLcd(t, powerLevel>0.05, temp, load, fanSpeedVal*powerLevel);
  }

  // camera tween
  if(camAnim){
    camAnim.t += dt*2.2;
    const k = smoothstep(camAnim.t);
    camera.position.lerpVectors(camAnim.fromPos, camAnim.toPos, k);
    controls.target.lerpVectors(camAnim.fromTgt, camAnim.toTgt, k);
    if(camAnim.t>=1) camAnim = null;
  }

  controls.update();
  renderer.render(scene, camera);
}

// ============================== RESIZE ==============================
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================== INIT ==============================
updateColor();
renderSV(); renderHue();
drawLcd(0, false, 22, 0, 0);
animate();
</script>
