<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0a0c0f">
<title>42U Server Rack — Full Rack + Single Slice · Sonnet 5.5 (Xhigh)</title>
<style>
:root{
  --bg:#090b0e; --panel:rgba(13,16,20,.80); --panel2:rgba(20,24,29,.86); --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --ink:#e9eef3; --mute:#97a3b0; --dim:#5d6975; --acc:#57c7f2; --acc-d:rgba(87,199,242,.16); --amber:#ffb454; --hot:#ff6b4a; --ok:#62d69a;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,"Liberation Mono",monospace; --sans:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}
#gl.pick{cursor:pointer}
#ui{position:fixed;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
.mono{font-family:var(--mono)}
.panel{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:3px}
.eyebrow{font:10px var(--mono);letter-spacing:2px;color:var(--mute);text-transform:uppercase}

/* ---------- brand / mode ---------- */
#brand{position:absolute;left:26px;top:22px;pointer-events:none}
#brand h1{margin:7px 0 0;font-size:25px;font-weight:700;letter-spacing:5px;line-height:1}
#brand h1 em{font-style:normal;font-weight:300;color:var(--mute);letter-spacing:3px}
#brand .model{margin-top:9px;font:10px var(--mono);letter-spacing:1.4px;color:var(--dim)}
#brand .model b{color:var(--acc);font-weight:600}
#modes{position:absolute;left:50%;top:20px;transform:translateX(-50%);display:flex;gap:0;border:1px solid var(--line2);border-radius:3px;overflow:hidden;background:var(--panel)}
#modes button{font:10.5px var(--mono);letter-spacing:1.8px;padding:10px 20px;color:var(--mute);transition:.2s}
#modes button.on{background:var(--acc);color:#04141b;font-weight:700}
#modes button:disabled{opacity:.45;cursor:default}
#modes button:not(.on):not(:disabled):hover{color:var(--ink);background:rgba(255,255,255,.06)}

/* ---------- inventory ---------- */
#inv{position:absolute;left:26px;top:112px;width:292px;max-height:calc(100vh - 235px);display:flex;flex-direction:column;padding:12px 0 6px}
#inv h2{margin:0 16px 8px;font:10px var(--mono);letter-spacing:2px;color:var(--mute);font-weight:500;display:flex;justify-content:space-between}
#inv h2 span{color:var(--dim)}
#invList{overflow:auto;padding:0 6px 6px;scrollbar-width:thin;scrollbar-color:#2c343c transparent}
.row{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;padding:6px 10px;border-radius:2px;font:11px var(--mono);color:var(--mute);cursor:pointer;border-left:2px solid transparent}
.row .u{color:var(--dim);letter-spacing:.3px}
.row .n{color:var(--ink);font:600 11px var(--sans);letter-spacing:.7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .h{color:var(--dim)}
.row.srv .n{color:#fff}
.row.net .n,.row.misc .n{color:#c3ccd5;font-weight:500}
.row.empty .n{color:var(--dim);font-weight:400;font-style:italic}
.row:hover,.row.hov{background:rgba(87,199,242,.09);border-left-color:var(--acc)}
.row.sel{background:rgba(87,199,242,.17);border-left-color:var(--acc)}
.row.sel .u{color:var(--acc)}

/* ---------- selection card ---------- */
#card{position:absolute;right:26px;top:112px;width:318px;padding:16px 18px 16px;max-height:calc(100vh - 235px);overflow:auto;scrollbar-width:thin;scrollbar-color:#2c343c transparent}
#card .tag{font:10px var(--mono);letter-spacing:2px;color:var(--acc)}
#card h3{margin:7px 0 2px;font-size:20px;font-weight:700;letter-spacing:1.5px;line-height:1.15}
#card .sub{font:11px var(--mono);color:var(--mute);letter-spacing:.8px}
#card .rule{height:1px;background:var(--line);margin:13px 0}
#card dl{margin:0;display:grid;grid-template-columns:78px 1fr;gap:6px 10px;font-size:11.5px;line-height:1.4}
#card dt{font:10px var(--mono);letter-spacing:1.2px;color:var(--dim);padding-top:1px}
#card dd{margin:0;color:#cfd7df}
#card .bar{height:3px;background:rgba(255,255,255,.08);margin-top:5px;border-radius:2px;overflow:hidden}
#card .bar i{display:block;height:100%;background:linear-gradient(90deg,#57c7f2,#ffb454,#ff6b4a)}
#card .why{margin:0;padding:0;list-style:none;display:grid;gap:7px}
#card .why li{font-size:11px;line-height:1.4;color:#b6c0ca;padding-left:12px;position:relative}
#card .why li:before{content:"";position:absolute;left:0;top:6px;width:5px;height:5px;background:var(--acc);border-radius:50%}
#card .why li b{color:#fff;font-weight:600}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:14px;padding:12px;background:var(--acc);color:#04141b;font:700 11.5px var(--mono);letter-spacing:2px;border-radius:2px;transition:.15s}
.cta:hover{background:#86dcff;transform:translateY(-1px)}
.cta:disabled{background:#26303a;color:var(--dim);cursor:default;transform:none}
.cta.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}
.cta.ghost:hover{background:rgba(255,255,255,.07)}

/* ---------- toggles / presets ---------- */
#tog{position:absolute;right:26px;top:22px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:560px}
.chip{font:10px var(--mono);letter-spacing:1.4px;padding:9px 12px;border:1px solid var(--line2);background:var(--panel);color:var(--mute);border-radius:2px;display:flex;align-items:center;gap:8px;transition:.15s;white-space:nowrap}
.chip:before{content:"";width:7px;height:7px;border:1px solid var(--dim);border-radius:50%}
.chip:hover{color:var(--ink);border-color:rgba(255,255,255,.34)}
.chip.on{color:#fff;border-color:var(--acc);background:var(--acc-d)}
.chip.on:before{background:var(--acc);border-color:var(--acc);box-shadow:0 0 8px var(--acc)}
.chip:disabled{opacity:.4;cursor:default}
#presets{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:0;border:1px solid var(--line2);background:var(--panel);border-radius:3px;overflow:hidden;max-width:calc(100vw - 40px)}
#presets button{font:10px var(--mono);letter-spacing:1.3px;padding:11px 14px;color:var(--mute);border-right:1px solid var(--line);white-space:nowrap;transition:.15s}
#presets button:last-child{border-right:0}
#presets button:hover{color:var(--ink);background:rgba(255,255,255,.06)}
#presets button.on{color:#04141b;background:var(--acc);font-weight:700}
#hint{position:absolute;left:26px;bottom:78px;text-shadow:0 1px 6px #000,0 0 10px #000;font:10px var(--mono);letter-spacing:.8px;color:var(--dim);line-height:1.8;pointer-events:none}
#hint b{color:var(--mute);font-weight:500}
#legend{position:absolute;right:26px;bottom:24px;width:230px;padding:11px 14px;display:none}
#legend .ramp{height:6px;border-radius:3px;background:linear-gradient(90deg,#3b8cff,#37d4e8,#8be36d,#ffd25a,#ff8a3d,#ff4a3a);margin:8px 0 6px}
#legend .lbl{display:flex;justify-content:space-between;font:9px var(--mono);letter-spacing:1px;color:var(--mute)}

/* ---------- slice bar ---------- */
#sliceHead{position:absolute;left:50%;top:70px;transform:translateX(-50%);display:none;flex-direction:column;align-items:center;pointer-events:none}
#sliceHead .row{display:flex;align-items:center;gap:26px}
#sliceHead .mid{text-align:center;min-width:360px}
#sliceHead .nav{pointer-events:auto}
#sliceHead .cnt{font:11px var(--mono);letter-spacing:3px;color:var(--acc)}
#sliceHead .nm{font-size:23px;font-weight:700;letter-spacing:4px;margin:6px 0 4px;text-shadow:0 2px 18px rgba(0,0,0,.7)}
#sliceHead .meta{font:11px var(--mono);letter-spacing:2px;color:var(--mute)}
#sliceHead .zones{margin-top:9px;font:9.5px var(--mono);letter-spacing:1.1px;color:var(--dim);white-space:nowrap}
#sliceHead .zones b{color:var(--acc);font-weight:600;letter-spacing:1.6px}
#sliceHead .zones i{font-style:normal;color:var(--mute)}
#stats{margin-top:5px;font:9.5px var(--mono);letter-spacing:1px;color:var(--dim)}
.nav{display:none;flex:none;white-space:nowrap;align-items:center;gap:12px;padding:12px 16px;font:10px var(--mono);letter-spacing:2px;color:var(--mute);border:1px solid var(--line);background:var(--panel);border-radius:3px;transition:.15s}
.nav:hover{color:#fff;border-color:var(--acc);background:var(--acc-d)}
.nav b{font:300 28px var(--sans);color:var(--acc);line-height:.8}
#returnBtn{position:absolute;left:26px;top:112px;display:none;width:auto;margin:0;padding:12px 18px}

/* ---------- floating bits ---------- */
#tip{position:fixed;left:0;top:0;pointer-events:none;display:none;padding:10px 14px;background:rgba(8,10,13,.92);border:1px solid var(--acc);border-radius:2px;z-index:6;min-width:150px;box-shadow:0 6px 28px rgba(0,0,0,.55)}
#tip .t1{font:700 13px var(--mono);letter-spacing:1.5px;color:#fff}
#tip .t2{font:12px var(--mono);letter-spacing:1px;color:var(--acc);margin-top:4px}
#tip .t3{font:11px var(--mono);letter-spacing:1px;color:var(--mute);margin-top:2px}
#tip .t4{font:9px var(--mono);letter-spacing:1.5px;color:var(--dim);margin-top:8px}
#pop{position:fixed;left:0;top:0;display:none;z-index:7;padding:11px 16px;background:var(--acc);color:#04141b;font:700 11px var(--mono);letter-spacing:2px;border-radius:2px;box-shadow:0 8px 30px rgba(0,0,0,.6),0 0 0 4px rgba(87,199,242,.25);white-space:nowrap}
#pop:hover{background:#9be3ff}
#leaders{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;font:10px var(--mono);letter-spacing:1.3px;color:#dbe6ee;padding:4px 8px 4px 9px;background:rgba(8,10,13,.78);border:1px solid rgba(255,255,255,.16);border-left:2px solid var(--acc);border-radius:2px;will-change:transform;opacity:0;transition:opacity .25s}
.lb.vis{opacity:1}
.lb small{display:block;font:8.5px var(--sans);letter-spacing:.2px;color:#8f9baa;margin-top:2px;white-space:normal;width:150px;line-height:1.3}
.lb.hot{border-left-color:var(--hot)}
.lb.cold{border-left-color:#57a8ff}
.lb.ex{border-left-color:#c7d1da;background:rgba(8,10,13,.6)}
.lb.rail{border-left-color:#8b97a3;color:#9cabb8;font-size:9px;padding:1px 6px 1px 7px;line-height:12px;background:rgba(8,10,13,.72)}
#flow{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);display:none;align-items:center;padding:9px 14px;gap:0;max-width:calc(100vw - 40px);overflow:hidden}
#flow .st{font:10px var(--mono);letter-spacing:1.4px;color:#cdd7e0;padding:6px 10px;border:1px solid var(--line2);border-radius:2px;position:relative}
#flow .ar{color:var(--acc);padding:0 7px;font-size:14px}
#flow .st i{display:block;height:2px;margin-top:5px;border-radius:2px;background:#3b8cff}
#boot{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:20;transition:opacity .6s}
#boot .bar{width:260px;height:2px;background:rgba(255,255,255,.1);overflow:hidden}
#boot .bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
#boot .txt{font:10px var(--mono);letter-spacing:2px;color:var(--mute)}
#err{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:22px 26px;max-width:520px;display:none;z-index:30;font:12px var(--mono);line-height:1.6;color:#ffb1a1;border-color:#ff6b4a}
#inv,#card,#presets,#tog,#sliceHead,#returnBtn,#hint,#legend,#flow,#modes,#pop{transition:opacity .35s}
.busy #inv,.busy #card,.busy #presets,.busy #tog,.busy #sliceHead,.busy #returnBtn,.busy #hint,.busy #legend,.busy #flow,.busy #pop,.busy #tip{opacity:0!important;pointer-events:none!important}
.busy #modes{opacity:.5;pointer-events:none}
.toast{position:fixed;left:50%;top:150px;transform:translateX(-50%);padding:9px 16px;font:10.5px var(--mono);letter-spacing:1.5px;color:#fff;background:rgba(8,10,13,.9);border:1px solid var(--line2);border-radius:2px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:9}
.toast.on{opacity:1}
@media (max-width:1500px){
  #sliceHead .zones{font-size:8.5px;letter-spacing:.5px}
  .chip{padding:8px 9px;letter-spacing:.8px;font-size:9.5px;gap:6px}
  #modes button{padding:10px 14px;letter-spacing:1.2px}
  .nav{font-size:0;gap:0;padding:12px 15px}
  .nav b{font-size:30px}
  #sliceHead .row{gap:14px}
  #presets button{padding:11px 10px;letter-spacing:.8px;font-size:9.5px}
}
@media (max-width:1120px){#sliceHead .zones{display:none}#inv{display:none}#brand h1{font-size:19px}#tog{max-width:380px}}
@media (max-width:820px){#card{display:none}#presets{overflow-x:auto}#tog{top:64px;left:14px;right:14px;max-width:none;justify-content:flex-start}#modes{top:auto;bottom:70px}#brand{left:14px;top:14px}#hint,#stats{display:none}#sliceHead{top:118px}#returnBtn{top:auto;bottom:118px;left:14px}#legend{bottom:118px;right:14px}#flow{bottom:112px}}
</style>
</head>
<body>
<canvas id="gl" tabindex="0"></canvas>
<svg id="leaders" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="labels"></div>
<div id="ui">
  <div id="brand">
    <div class="eyebrow">Luma · Server Rack Test</div>
    <h1>42U RACK <em>/ SLICE</em></h1>
    <div class="model">MODEL <b>SONNET 5.5 · XHIGH</b></div>
    <div id="stats"></div>
  </div>
  <div id="modes">
    <button id="mFull" class="on">FULL RACK</button>
    <button id="mSlice" disabled>SINGLE SLICE</button>
  </div>
  <div id="tog"></div>

  <div id="inv" class="panel">
    <h2>RACK INVENTORY <span id="invCount"></span></h2>
    <div id="invList"></div>
  </div>
  <div id="card" class="panel"></div>
  <button id="returnBtn" class="cta ghost">◂&nbsp; RETURN TO RACK</button>

  <div id="sliceHead"><div class="row"><button class="nav" id="prev"><b>‹</b>PREVIOUS SERVER</button><div class="mid"><div class="cnt" id="shCnt"></div><div class="nm" id="shName"></div><div class="meta" id="shMeta"></div></div><button class="nav" id="next">NEXT SERVER<b>›</b></button></div><div class="zones" id="shZones"></div></div>

  <div id="flow" class="panel"></div>
  <div id="presets"></div>
  <div id="hint"></div>
  <div id="legend" class="panel"><div class="eyebrow">AIR TEMPERATURE</div><div class="ramp"></div><div class="lbl"><span>INTAKE</span><span>EXHAUST</span></div></div>
</div>
<div id="tip"></div>
<button id="pop">INSPECT SLICE ▸</button>
<div class="toast" id="toast"></div>
<div id="boot"><div class="eyebrow">Assembling 42U rack</div><div class="bar"><i id="bootBar"></i></div><div class="txt" id="bootTxt">LOADING</div></div>
<div id="err" class="panel"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>

<script>
(function(){
'use strict';

/* ===== 10_core.js ===== */
if (!window.THREE) {
  var box = document.getElementById('err');
  box.style.display = 'block';
  box.innerHTML = 'three.js could not be loaded.<br>This scene reads <b>assets/airline_tycoon/scene/vendor/three-0.160.1.min.js</b> relative to itself.';
  throw new Error('THREE missing');
}
const T = THREE;
const $ = (id) => document.getElementById(id);
const TAU = Math.PI * 2;
const U = 0.04445;                       // one rack unit, metres
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t);
const easeIO = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeO = (t) => 1 - Math.pow(1 - t, 3);
const easeI = (t) => t * t * t;
const easeSin = (t) => 0.5 - 0.5 * Math.cos(Math.PI * t);
const seg01 = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
function mulberry(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const pad2 = (n) => (n < 10 ? '0' + n : '' + n);

/* ------------------------------------------------------------------ */
/* Geometry batching: every assembly is a handful of merged meshes     */
/* ------------------------------------------------------------------ */
const _m4 = new T.Matrix4(), _q = new T.Quaternion(), _q2 = new T.Quaternion(), _eu = new T.Euler();
const _p = new T.Vector3(), _s = new T.Vector3(), _v = new T.Vector3(), _n3 = new T.Matrix3(), _col = new T.Color();
const Q_X90 = new T.Quaternion().setFromEuler(new T.Euler(Math.PI / 2, 0, 0));
const Q_Z90 = new T.Quaternion().setFromEuler(new T.Euler(0, 0, Math.PI / 2));
const GEO = { box: new T.BoxGeometry(1, 1, 1), plane: new T.PlaneGeometry(1, 1), cyl: {}, sph: {} };
GEO.plane.rotateX(-Math.PI / 2);   // lies flat, normal +Y
function cylGeo(seg, rt, open) {
  const k = seg + '|' + rt + '|' + (open ? 1 : 0);
  return GEO.cyl[k] || (GEO.cyl[k] = new T.CylinderGeometry(rt, 1, 1, seg, 1, !!open));
}
function sphGeo(seg) { return GEO.sph[seg] || (GEO.sph[seg] = new T.SphereGeometry(1, seg, Math.max(6, seg >> 1))); }

class Batch {
  constructor() { this.g = new Map(); this.tris = 0; }
  _slot(mat) {
    let s = this.g.get(mat);
    if (!s) { s = { p: [], n: [], u: [], c: [], i: [], v: 0 }; this.g.set(mat, s); }
    return s;
  }
  geo(mat, geo, m4, col, uv) {
    const s = this._slot(mat), P = geo.attributes.position, N = geo.attributes.normal, UV = geo.attributes.uv;
    _n3.getNormalMatrix(m4);
    let r = 1, g = 1, b = 1;
    if (col !== undefined && col !== null) { _col.set(col); r = _col.r; g = _col.g; b = _col.b; }
    const su = uv ? uv[0] : 1, sv = uv ? uv[1] : 1, ou = uv && uv[2] ? uv[2] : 0, ov = uv && uv[3] ? uv[3] : 0;
    const base = s.v, e = m4.elements;
    for (let i = 0; i < P.count; i++) {
      const x = P.getX(i), y = P.getY(i), z = P.getZ(i);
      s.p.push(e[0] * x + e[4] * y + e[8] * z + e[12], e[1] * x + e[5] * y + e[9] * z + e[13], e[2] * x + e[6] * y + e[10] * z + e[14]);
      _v.set(N.getX(i), N.getY(i), N.getZ(i)).applyMatrix3(_n3).normalize();
      s.n.push(_v.x, _v.y, _v.z);
      s.u.push(UV ? UV.getX(i) * su + ou : 0, UV ? UV.getY(i) * sv + ov : 0);
      s.c.push(r, g, b);
    }
    if (geo.index) { const ix = geo.index.array; for (let i = 0; i < ix.length; i++) s.i.push(base + ix[i]); }
    else for (let i = 0; i < P.count; i++) s.i.push(base + i);
    s.v += P.count;
    this.tris += (geo.index ? geo.index.count : P.count) / 3;
  }
  _mat(x, y, z, sx, sy, sz, o) {
    _p.set(x, y, z); _s.set(sx, sy, sz);
    if (o && o.r) _q.setFromEuler(_eu.set(o.r[0], o.r[1], o.r[2])); else _q.identity();
    if (o && o.ax === 'x') _q.multiply(Q_Z90); else if (o && o.ax === 'z') _q.multiply(Q_X90);
    return _m4.compose(_p, _q, _s);
  }
  box(mat, sx, sy, sz, x, y, z, o) { this.geo(mat, GEO.box, this._mat(x, y, z, sx, sy, sz, o), o && o.c, o && o.uv); }
  // cylinder: radius r, length h, axis y unless o.ax = 'x'|'z'
  cyl(mat, r, h, x, y, z, o) {
    const seg = (o && o.seg) || 14, rt = o && o.rt !== undefined ? o.rt : 1;
    this.geo(mat, cylGeo(seg, rt, o && o.open), this._mat(x, y, z, r, h, r, o), o && o.c, o && o.uv);

/* ---------------- PSU ---------------- */

    const zc = -D + d / 2 - 0.0035;

    f.box(L.zinc, w - 0.001, 0.0012, d - 0.01, x, y0 + h - 0.0006, zc);

    f.box(L.plastic, 0.0105, Math.min(0.026, h * 0.62), 0.016, x - w * 0.32, y0 + h * 0.45, zr - 0.007);        // handle
    f.box(L.black, 0.0055, Math.min(0.018, h * 0.42), 0.017, x - w * 0.32, y0 + h * 0.45, zr - 0.0075);

/* A PCIe/OCP card with its rear bracket. flat: lies parallel to the board
   (1U/2U), otherwise stands vertically. Bracket belongs to the always-visible
   rear, the card body to the GPU/PCIe assembly. */
function partCard(c, o) {
  const { L } = c, D = c.spec.D, lite = c.asm.base.lite, M = c.asm.gpu.deep, gl = c.asm.gpu.lite;
  const len = o.len || 0.167, w = o.w || 0.069, nPort = o.ports === undefined ? 2 : o.ports;
  const body = o.black ? L.pcbK : L.pcb;
  const zEnd = -D + 0.002, zc = zEnd + len / 2, zf = zEnd + len;        // card runs forward from the rear wall
  const tr = D - 0.002 - len, tb = D - 0.002;
  if (o.flat) {
    const y = o.y;
    partRiser(c, o.x, tr - 0.004, 0.070, Math.max(0.012, y + 0.006 - YB - 0.0075));
    gl.box(L.zinc, 0.0795, 0.0018, 0.0015, o.x, y, -D - 0.0003);                       // bracket lies flat in 1U/2U
    M.box(body, w, 0.0016, len, o.x, y, zc, { uv: [1, 1] });
    M.box(L.gold, w * 0.7, 0.0004, 0.004, o.x, y, zf + 0.001);
    M.box(L.alu, 0.034, 0.011, 0.040, o.x, y + 0.0063, zc);
    for (let k = 0; k < 5; k++) M.box(L.alu, 0.0007, 0.010, 0.040, o.x - 0.015 + k * 0.0075, y + 0.0165, zc);
    for (let k = 0; k < nPort; k++) {

      lite.box(L.black, 0.0118, 0.0075, 0.004, px, y + 0.003, -D - 0.0005);
      lite.box(L.ledG, 0.0016, 0.0016, 0.0008, px - 0.003, y + 0.0092, -D - 0.0005);
      c.ports.net.push({ p: [px, y + 0.003, -D - 0.0030], kind: 'sfp', nic: true });
    }
    for (let k = 0; k < 8; k++) M.box(L.chip, 0.006, 0.0016, 0.006, o.x + (k % 2 ? 0.02 : -0.02), y + 0.0010, zEnd + len * (0.12 + 0.09 * k));
    obs(c, 'PCIe CARD', o.x - w / 2, y - 0.001, tr, o.x + w / 2, y + 0.019, tb, { kind: 'ch', heat: 0.5, spd: 0.8, tag: 'pcie' });
  } else {
    const x = o.x, y0 = o.y0 || 0.012, hgt = o.h || 0.11;
    gl.box(L.zinc, 0.0015, hgt, 0.0125, x, y0 + hgt / 2, -D - 0.0003);
    M.box(body, 0.0016, hgt, len, x, y0 + hgt / 2, zc);
    M.box(L.gold, 0.0004, hgt * 0.04, len * 0.9, x, y0 + 0.002, zc);
    M.box(L.alu, 0.011, hgt * 0.4, 0.05, x + 0.0066, y0 + hgt * 0.55, zEnd + len * 0.4);
    for (let k = 0; k < 4; k++) M.box(L.alu, 0.010, hgt * 0.38, 0.0007, x + 0.0066, y0 + hgt * 0.55, zEnd + len * 0.4 - 0.018 + k * 0.012);
    for (let k = 0; k < nPort; k++) {
      const py = y0 + hgt * 0.62 + (k ? -0.024 : 0.0);
      lite.box(L.zinc, 0.0128, 0.0135, 0.016, x + 0.0072, py, -D + 0.008);
      lite.box(L.black, 0.0108, 0.0112, 0.004, x + 0.0072, py, -D - 0.0005);
      c.ports.net.push({ p: [x + 0.0072, py, -D - 0.0030], kind: 'sfp', nic: true });

function partRiser(c, x, t, w, hgt) {

/* ---------------- air duct: translucent shroud + baffles ---------------- */

  for (const s of o.segs) {      // s: x0,x1,t0,t1  -> baffle walls up to `top` plus a smoked top plate
    const w = s.x1 - s.x0, d = s.t1 - s.t0, xc = (s.x0 + s.x1) / 2, tc = (s.t0 + s.t1) / 2;

/* assemble one server: lite groups are always shown, deep groups only in the slice */
function buildServer(spec, shared) {
  const L = cloneLib(shared);
  const c = mkCtx(spec, L);
  spec.build(c);
  const root = new T.Group(); root.name = spec.id;
  const asm = {}, rotors = [];
  for (const k of ASM) {
    const g = new T.Group(); g.name = k;
    const lite = c.asm[k].lite.build(), deep = c.asm[k].deep.build();
    lite.name = 'lite'; deep.name = 'deep';
    g.add(lite); g.add(deep);
    asm[k] = { g, lite, deep };
    root.add(g);
  }
  const tpl = new Map();
  for (const r of c.rotors) {
    const key = r.R.toFixed(4);
    if (!tpl.has(key)) tpl.set(key, rotorTemplate(L, r.R, r.R > 0.03 ? 9 : 7).build());
    const rg = tpl.get(key).clone();
    rg.position.set(r.x, r.y, r.z);
    rg.userData.dir = r.dir;
    asm.fan.deep.add(rg);
    rotors.push(rg);
  }
  return { spec, L, root, asm, rotors, obs: c.obs, zones: c.zones, ports: c.ports, fanZ: c.fanZ, fanBlock: c.fanBlock, driveT: c.driveT, sources: c.sources, gpuRange: c.gpuRange, dimmCount: c.dimmCount || 0, mats: libMats(L).concat(Object.values(c.LC)), coverMats: Object.values(c.LC) };
}

function buildRailKit(L, H) {
  const rh = Math.min(0.016, H * 0.42), outer = new T.Group(), middle = new T.Group();

  for (const sx of [-1, 1]) {

    bo.box(L.zinc, 0.012, rh * 1.5, 0.004, sx * (SW / 2 + 0.0145), 0, RK.zF - 0.003);
    bo.box(L.zinc, 0.012, rh * 1.5, 0.004, sx * (SW / 2 + 0.0145), 0, RK.zR + 0.003);
    bo.box(L.zinc, 0.0042, rh, 0.04, sx * (SW / 2 + 0.0112), 0, RK.zR - 0.01);
    bm.box(L.zinc, 0.0038, rh * 0.96, 0.62, sx * (SW / 2 + 0.0069), 0, RK.zF - 0.03 - 0.31);
    bm.cyl(L.black, 0.0022, 0.0012, sx * (SW / 2 + 0.0069), 0.0, RK.zF - 0.35, { ax: 'x', seg: 8 });
    bm.box(L.black, 0.0002, rh * 0.9, 0.5, sx * (SW / 2 + 0.0049), 0, RK.zF - 0.03 - 0.31);
  }
  outer.add(bo.build()); middle.add(bm.build());
  return { outer, middle };
}

  lerp(a, b, u) {

function safeArea() {

  const wide = W > 1120, mid = W > 820;
  let l = 24, r = 24, t = 70, b = W > 820 ? 84 : 130;

  else { if (mid) r = 372; l = wide ? 200 : 24; t = W > 820 ? 160 : 190; }

function fitDist(pts, c, safe) {

  const pull = pulledCam(srv, eMax), full = rackCam('front');

  const ex0 = srv.explode, cut0 = srv.cut, cov0 = srv.coverC;
  srv.exT = 0; srv.cutT = 0; A.tog.explode = false; A.tog.cutaway = false;
  for (const s of S.servers) if (s !== srv) s.root.visible = true;
  S.rackGroup.visible = true;
  const camA = { st: null }, camB = { st: null };
  let shadowSwitched = false, hid = false;
  if (!opts.instant) toast('RETURNING TO RACK');
  renderToggles();
  startTL([
    { t0: 0.0, t1: 0.8, fn: (u) => { srv.explode = ex0 * (1 - easeO(u)); srv.cut = cut0 * (1 - easeO(u)); } },
    { t0: 0.5, t1: 1.3, fn: (u) => { setCover(srv, cov0 * (1 - easeIO(u))); } },
    { t0: 1.2, t1: 2.5, fn: (u) => { poseLerp(srv, from, to, easeIO(u)); if (u > 0.9 && !hid) { hid = true; setDeep(srv, false); } } },
    { t0: 1.0, t1: 2.5, fn: (u) => { if (!camA.st) camA.st = Rig.snap(); Rig.lerp(camA.st, pull, easeIO(u)); followServer(srv); } },
    { t0: 1.3, t1: 2.5, fn: (u) => { A.rackFade = easeIO(u); A.stageFade = 1 - easeIO(u); if (!shadowSwitched && u > 0.3) { shadowSwitched = true; shadowFocus(0, 1.0, 0.1, 1.7); } } },
    { t0: 2.5, t1: 3.7, fn: (u) => { setExt(srv, eMax * (1 - easeIO(u))); const show = u > 0.25; srv.eq.cables.p.visible = srv.eq.cables.n.visible = show; if (show && (srv._ctick = (srv._ctick || 0) + 1) % 2 === 0) installCables(srv.eq); } },
    { t0: 3.4, t1: 3.9, fn: (u) => { srv.ledBoost = 2.6 * Math.sin(u * 12) ** 2; } },
    { t0: 3.5, t1: 4.9, fn: (u) => { if (!camB.st) camB.st = Rig.snap(); Rig.lerp(camB.st, full, easeIO(u)); } },
  ], 4.9, () => {
    setExt(srv, 0); installCables(srv.eq); srv.eq.cables.p.visible = srv.eq.cables.n.visible = true;
    srv.root.position.set(0, srv.eq.y0, RK.zF); srv.root.rotation.y = 0;
    srv.explode = 0; srv.cut = 0; srv.coverC = 0; setDeep(srv, false);
    srv.ledBoost = 0; srv.curFade = 1;
    A.rackFade = 1; A.stageFade = 0; A.mode = 'rack'; A.targetMode = null; A.cur = null;
    Rig.set(full);
    S.stageGroup.visible = false; A.lastStageFade = -1;
    A.sel = srv.eq; setHoverEq(srv.eq, true);
    renderHeader(); renderCard(); markInventory(); updateAirflowVis();
  }, true);
  if (opts.instant) finishTL();
}

function switchServer(dir) {
  if (A.busy || A.mode !== 'slice' || !A.cur) return;
  const n = SRV.length, idx = (A.sliceNo + dir + n) % n;
  const out = A.cur, nxt = S.servers.find((s) => s.spec === SRV[idx]);
  sliceFlow.group.visible = false; clearLabels('slice');
  const m0 = out.root.position.clone();
  const camA = { st: null };
  const stagePos = (srv) => { const p = new T.Vector3(); stageMatrix(srv).decompose(p, new T.Quaternion(), new T.Vector3()); return p; };
  const nPos = stagePos(nxt);
  nxt.curFade = 0; nxt.coverC = 1; nxt.explode = 0; nxt.cut = 0; nxt.exT = 0; nxt.cutT = 0;
  A.tog.explode = false; A.tog.cutaway = false;
  out.exT = 0; out.cutT = 0;
  buildStageProps(nxt, true);
  let swapped = false;
  const goal = (() => { const prev = A.cur; A.cur = nxt; const g = sliceCam(nxt, A.slicePreset); A.cur = prev; return g; })();
  A.targetMode = 'slice';
  toast(`SERVER ${pad2(idx + 1)} / ${pad2(SRV.length)} · ${nxt.spec.name}`);
  startTL([
    { t0: 0, t1: 0.7, fn: (u) => { out.root.position.set(m0.x, m0.y, m0.z - dir * 0.9 * easeI(u)); out.curFade = 1 - easeIO(u); out.explode = (out.explode || 0) * (1 - u); out.cut = (out.cut || 0) * (1 - u); } },
    { t0: 0.7, t1: 0.71, fn: () => {
      if (swapped) return; swapped = true;
      out.root.position.set(0, out.eq.y0, RK.zF); out.root.rotation.y = 0; setDeep(out, false); out.coverC = 0; out.curFade = 1; out.explode = 0; out.cut = 0; out.root.visible = false;
      A.cur = nxt; A.sliceNo = idx; nxt.root.visible = true; nxt.root.rotation.y = -Math.PI / 2; nxt.root.position.set(nPos.x, nPos.y, nPos.z + dir * 0.9); nxt.curFade = 0; setDeep(nxt, true); setCover(nxt, 1);
    } },
    { t0: 0.7, t1: 1.6, fn: (u) => { if (!swapped) return; nxt.root.position.set(nPos.x, nPos.y, nPos.z + dir * 0.9 * (1 - easeO(u))); nxt.curFade = easeIO(Math.min(1, u * 1.3)); } },
    { t0: 0.35, t1: 1.6, fn: (u) => { if (!camA.st) camA.st = Rig.snap(); Rig.lerp(camA.st, goal, easeIO(u)); } },
  ], 1.65, () => {
    nxt.root.position.copy(nPos); nxt.curFade = 1; Rig.set(goal);
    A.targetMode = null; enterSliceUI(nxt);
  }, true);
}

/* static stage props: a plate with four posts under the chassis */
function buildStageProps(srv) {
  if (S.cradle) { S.stageGroup.remove(S.cradle); S.cradle.traverse((o) => o.geometry && o.geometry.dispose()); }
  const b = new Batch(), D = srv.spec.D;
  if (!S.cradleMat) { S.cradleMat = new T.MeshStandardMaterial({ color: 0x2b3036, metalness: 0.35, roughness: 0.72, envMapIntensity: 0.35, vertexColors: true, transparent: true }); S.cradleMat.userData.base = { opacity: 1, transparent: true }; S.stageMats.push(S.cradleMat); }
  const m = S.cradleMat;
  b.box(m, D + 0.16, 0.008, SW + 0.16, 0, 0.012, 0, {});
  b.box(m, D + 0.19, 0.004, SW + 0.19, 0, 0.006, 0, {});
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) b.cyl(m, 0.012, STAGE_Y - 0.016, sx * (D / 2 - 0.07), 0.016 + (STAGE_Y - 0.016) / 2, sz * (SW / 2 - 0.05), { seg: 16 });
  S.cradle = b.build(); S.stageGroup.add(S.cradle);
}

/* ------------------------------------------------------------------ */
/* Flow glue + labels                                                  */
/* ------------------------------------------------------------------ */
let sliceFlow, rackFlow;
function prepareSliceFlow(srv) {
  sliceFlow.attach(srv.root);
  sliceFlow.configure({ mode: 'slice', D: srv.spec.D, H: srv.spec.H, obs: srv.obs, fanZ: srv.fanZ, kHeat: 1.15, seed: srv.spec.no * 31 + 5 });
}
function prepareRackFlow() {
  rackFlow.attach(world);
  rackFlow.lines.material.depthTest = false; rackFlow.pts.visible = false; rackFlow.setOpacity(0.7);
  const lanes = [], leaks = [];
  for (const e of S.equip) {
    const y0 = uy(e.u) + 0.003, y1 = uy(e.u) + e.h * U - 0.003;
    if (e.kind === 'server' || e.kind === 'switch' || e.kind === 'ups') {
      const pw = e.kind === 'server' ? e.spec.pw : e.kind === 'switch' ? 330 : 400;
      lanes.push({ y0, y1, w: e.h, tOut: clamp(0.1 + 0.55 * pw / (e.h * 1200), 0.1, 0.96) });
    } else if (e.kind === 'empty') leaks.push({ y0, y1 });
  }
  const tot = lanes.reduce((a, l) => a + l.w, 0);
  rackFlow.configure({ mode: 'rack', leaks, seed: 3, pickLane: (R) => { let r = R() * tot; for (const l of lanes) { r -= l.w; if (r <= 0) return l; } return lanes[lanes.length - 1]; } });
}
function worldOfServer(srv, x, y, z) { return (v) => { v.set(x, y, z); srv.root.localToWorld(v); }; }
function buildSliceLabels(srv) {
  clearLabels('slice');
  const H = srv.spec.H, D = srv.spec.D, base = (name) => (A.mode === 'slice' && A.cur === srv && !A.busy);
  const gz = (name) => srv.zones[name];
  const lblZone = (name, text, dy) => {
    const z = gz(name); if (!z) return;
    const dup = name === 'drives' || name === 'fans' || name === 'gpu';
    addLabel('slice', text, '', worldOfServer(srv, z.c[0], H + 0.03 + (dy || 0) + exLift(srv, 'base'), z.c[2]), 'c', () => base() && !A.tog.explode && srv.explode < 0.05 && !(A.tog.airflow && dup), name);
  };
  const exLift = (s, k) => (s.explode || 0) * LEVEL[k] * s.gap;
  addLabel('slice', 'FRONT', 'ex', worldOfServer(srv, 0, H * 0.5, 0.12), 'c', () => base() && srv.explode < 0.05 && !A.tog.airflow, 'ends');
  addLabel('slice', 'REAR', 'ex', worldOfServer(srv, 0, H * 0.5, -D - 0.13), 'c', () => base() && srv.explode < 0.05 && !A.tog.airflow, 'ends');
  lblZone('drives', 'DRIVES / INTAKE'); lblZone('fans', 'FAN WALL'); lblZone('psu', 'POWER SUPPLIES', 0.0);
  if (srv.gpuRange) lblZone('gpu', 'GPU / ACCELERATOR AREA', 0.075); else lblZone('pcie', 'PCIe / NETWORK');
  if (srv.sources.length) {
    const cs = srv.sources.filter((q) => q.w < 0.09 && q.y < 0.1);
    const cpuS = srv.sources.filter((q) => q.kind === 'cpu'), mx = cpuS.reduce((a, q) => a + q.x, 0) / (cpuS.length || 1), mt = cpuS.reduce((a, q) => a + q.t, 0) / (cpuS.length || 1);
    srv.cpuMid = [mx, mt];
    if (!srv.gpuRange) addLabel('slice', 'CPU + MEMORY', '', worldOfServer(srv, mx, H + 0.03, -mt), 'c', () => base() && !A.tog.explode && srv.explode < 0.05, 'cpu');
    else addLabel('slice', 'CPU + MEMORY', '', worldOfServer(srv, srv.cpuMid ? srv.cpuMid[0] : 0, H + 0.03, srv.cpuMid ? -srv.cpuMid[1] : -0.27), 'c', () => base() && !A.tog.explode && srv.explode < 0.05, 'cpu');
  }
  // exploded layers
  for (const k of ASM) addLabel('slice', ASM_TITLE[k], 'ex', (v) => { const c = srv.asmCenter[k]; v.set(c.x, c.y + LEVEL[k] * srv.gap * (srv.explode || 0), c.z); srv.root.localToWorld(v); }, 'r', () => base() && (srv.explode || 0) > 0.5, null, true);
  // airflow annotations
  addLabel('slice', 'COLD INTAKE', 'cold', worldOfServer(srv, 0, H * 0.5, 0.09), 'c', () => base() && A.tog.airflow && srv.explode < 0.1);
  addLabel('slice', 'HOT EXHAUST', 'hot', worldOfServer(srv, 0, H * 0.5, -D - 0.1), 'c', () => base() && A.tog.airflow && srv.explode < 0.1);
  const why = (tag, title, text, cls) => {
    const o = srv.obs.find((q) => q.tag === tag); if (!o) return;
    addLabel('slice', `${title}<small>${text}</small>`, cls || '', worldOfServer(srv, (o.min[0] + o.max[0]) / 2, H + 0.075, (o.min[2] + o.max[2]) / 2), 'c', () => base() && A.tog.airflow && srv.explode < 0.1, 'air');
  };
  why('cage', 'PERFORATED DRIVE CAGE', 'Cold intake passes through the carriers onto the drives.', 'cold');
  why('cpu', 'HEATSINK FINS', 'Fins run front → rear, so air flows through the channels.', 'hot');
  why('gpu', 'GPU AIR CHANNELS', 'Fin gaps line up with the stream: both rows get cool inlet air.', 'hot');
  if (srv.fanZ !== null) addLabel('slice', 'FAN WALL<small>Pulls air front → rear; pressure builds behind it.</small>', '', worldOfServer(srv, 0, H + 0.075, srv.fanZ), 'c', () => base() && A.tog.airflow && srv.explode < 0.1, 'air');
}

/* ------------------------------------------------------------------ */
/* Loop                                                                */
/* ------------------------------------------------------------------ */
let lastT = performance.now(), frames = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; frames++;
  stepTL(dt);
  Rig.update(dt); Rig.apply();
  applyRackFade();
  const tt = now / 1000;
  for (const srv of S.servers) {
    const k = srv.spec.no;
    srv.L.ledA.emissiveIntensity = 1.5 + 0.9 * Math.max(0, Math.sin(tt * 5.3 + k * 1.7) * Math.sin(tt * 2.1 + k)) + (srv.ledBoost || 0);
    srv.L.ledG.emissiveIntensity = 2.0 + 0.4 * Math.sin(tt * 1.3 + k);
  }
  if (frames % 30 === 0) {
    const ri = renderer.info.render;
    $('stats').textContent = 'GEOMETRY ' + (ri.triangles / 1000).toFixed(0) + 'k tris · ' + ri.calls + ' draws · LOD ' + (A.mode === 'slice' ? 'SLICE DETAIL' : 'RACK PROXY');
  }
  for (const srv of S.servers) {
    if (srv === A.cur) {
      const k = 1 - Math.exp(-dt * 3.4);
      if (srv.exT !== undefined && !(TL && A.mode !== 'slice' && A.targetMode === 'rack')) { srv.explode += (srv.exT - srv.explode) * k; if (Math.abs(srv.exT - srv.explode) < 0.0015) srv.explode = srv.exT; }
      if (srv.cutT !== undefined && !(TL && A.targetMode === 'rack')) { srv.cut += (srv.cutT - srv.cut) * k; if (Math.abs(srv.cutT - srv.cut) < 0.002) srv.cut = srv.cutT; }
      if (srv.deepOn) for (const r of srv.rotors) r.rotation.z -= r.userData.dir * dt * 26;
    }
    applyServer(srv);
  }
  if (sliceFlow.group.visible) { sliceFlow.setOpacity(A.cur ? 1 - clamp(A.cur.explode * 2, 0, 1) : 1); sliceFlow.update(dt); }
  if (rackFlow.group.visible) rackFlow.update(dt);
  if (S.hover.g.visible && S.hover.eq && S.hover.eq.kind === 'server' && A.mode === 'rack') { /* highlight follows slide */ }
  renderer.render(scene, camera);
  updateLabels(); updatePop();
}
function resize() {
  const W = innerWidth, H = innerHeight;
  renderer.setSize(W, H, false);
  if (A.mode === 'rack' && !A.busy) { Rig.set(rackCam(A.rackPreset)); }
  else if (A.mode === 'slice' && !A.busy && A.cur) { const g = sliceCam(A.cur, A.slicePreset); Rig.set(Object.assign({}, g, { dist: Rig.cur.dist })); }
}
addEventListener('resize', resize);


/* ===== 90_init.js ===== */
/* ------------------------------------------------------------------ */
/* Boot                                                                */
/* ------------------------------------------------------------------ */
function finishServer(srv) {
  const spec = srv.spec, H = spec.H, D = spec.D;
  srv.root.updateMatrixWorld(true);
  srv.asmCenter = {};
  for (const k of ASM) {
    const b = new T.Box3().setFromObject(srv.asm[k].g), c = b.getCenter(new T.Vector3());
    srv.root.worldToLocal(c);
    if (k === 'cover') c.set(0, H, -D * 0.5); else if (k === 'base') c.set(0, H * 0.4, -D * 0.5);
    srv.asmCenter[k] = c;
  }
  srv.gap = 0.058 + H * 0.28;
  srv.explode = 0; srv.cut = 0; srv.exT = 0; srv.cutT = 0; srv.coverC = 0; srv.curFade = 1;
  const pts = [];
  for (const x of [-SW / 2, SW / 2]) for (const z of [0, -D]) pts.push(x, 0, z, x, 1, z);
  const gg = new T.BufferGeometry(); gg.setAttribute('position', new T.Float32BufferAttribute(pts, 3));
  srv.guides = new T.LineSegments(gg, new T.LineBasicMaterial({ color: 0x57c7f2, transparent: true, opacity: 0.32, depthWrite: false }));
  srv.guides.visible = false; srv.guides.frustumCulled = false; srv.root.add(srv.guides);
  const edges = [], addBox = (w, h, d, x, y, z) => {
    const e = new T.EdgesGeometry(new T.BoxGeometry(w, h, d)), p = e.attributes.position;
    for (let i = 0; i < p.count; i++) edges.push(p.getX(i) + x, p.getY(i) + y, p.getZ(i) + z);
  };
  addBox(SW, H, D, 0, H / 2, -D / 2);
  for (const o of srv.obs) if (o.tag === 'cage' || o.tag === 'psu') addBox(o.max[0] - o.min[0], o.max[1] - o.min[1], o.max[2] - o.min[2], (o.min[0] + o.max[0]) / 2, (o.min[1] + o.max[1]) / 2, (o.min[2] + o.max[2]) / 2);
  if (srv.fanBlock) { const f = srv.fanBlock; addBox(f.x1 - f.x0, f.y1 - f.y0, f.t1 - f.t0, (f.x0 + f.x1) / 2, (f.y0 + f.y1) / 2, -(f.t0 + f.t1) / 2); }
  const og = new T.BufferGeometry(); og.setAttribute('position', new T.Float32BufferAttribute(edges, 3));
  srv.outline = new T.LineSegments(og, new T.LineBasicMaterial({ color: 0xbfd4e6, transparent: true, opacity: 0.7, depthWrite: false }));
  srv.outline.visible = false; srv.outline.frustumCulled = false; srv.root.add(srv.outline);
  srv.partHL = new T.LineSegments(new T.EdgesGeometry(new T.BoxGeometry(1, 1, 1)), new T.LineBasicMaterial({ color: 0x8fe0ff, transparent: true, opacity: 0.95, depthTest: false }));
  srv.partHL.renderOrder = 30; srv.partHL.visible = false; srv.partHL.frustumCulled = false; srv.root.add(srv.partHL);
  setDeep(srv, false);
}

async function init() {
  const bar = $('bootBar'), txt = $('bootTxt');
  const tick = (p, t) => { bar.style.width = (p * 100).toFixed(0) + '%'; txt.textContent = t; return new Promise((r) => setTimeout(r, 0)); };
  try {
    await tick(0.02, 'TEXTURES');
    buildTextures(); setupLights();
    scene.environment = makeEnv(renderer);
    buildFloors();
    S.stageMats = [S.stageMat];
    const pending = buildRackScene();
    for (let i = 0; i < pending.length; i++) {
      await tick(0.08 + 0.7 * (i / pending.length), `BUILDING EQUIPMENT ${i + 1} / ${pending.length}`);
      pending[i]();
    }
    await tick(0.82, 'CABLING');
    buildPicks(); buildHover(); buildSidePanels();
    for (const srv of S.servers) finishServer(srv);
    buildCables();
    S.rackMats = Object.values(S.RL).concat([S.floorMat, S.perfMat, S.sideMat]);
    for (const e of S.equip) if (e._mats) for (const m of e._mats) { m.userData.base = { opacity: 1, transparent: false }; S.rackMats.push(m); }
    sliceFlow = new Flow(950, 7); rackFlow = new Flow(2000, 7);
    world.add(sliceFlow.group);
    prepareRackFlow();
    shadowFocus(0, 1.0, 0.1, 1.7);
    buildInventory(); buildRackLabels();
    resize(); Rig.set(rackCam('front'));
    renderHeader();
    await tick(0.9, 'COMPILING SHADERS');
    // warm both opaque and transparent programs, and upload the slice geometry
    for (const s of S.servers) setDeep(s, true);
    for (const a of [0.5, 1]) {
      A.rackFade = a; applyRackFade(); for (const s of S.servers) applyServer(s);
      renderer.compile(scene, camera);
    }
    Rig.apply(); renderer.render(scene, camera);
    for (const s of S.servers) setDeep(s, false);
    A.lastRackFade = -1; applyRackFade();
    S.stageGroup.visible = false;
    await tick(1, 'READY');
    requestAnimationFrame(loop);
    $('boot').style.pointerEvents = 'none'; $('boot').style.opacity = 0; setTimeout(() => ($('boot').style.display = 'none'), 700);
    window.__ready = true;
    const q = new URLSearchParams(location.search);
    if (q.has('cam')) goRackPreset(q.get('cam'), true);
  } catch (e) {
    console.error(e);
    const b = $('err'); b.style.display = 'block'; b.innerHTML = 'Scene failed to start:<br>' + esc(e && e.message ? e.message : e);
  }
}

window.__RACK__ = {
  A, S, Rig, T, SRV, RK,
  inspectNo(no, instant) { const s = S.servers.find((x) => x.spec.no === no); return inspect(s.eq, { instant: instant !== false }); },
  back(instant) { return returnToRack({ instant: instant !== false }); },
  next(d) { return switchServer(d || 1); },
  rackPreset: (id) => goRackPreset(id, true),
  slicePreset: (id) => goSlicePreset(id, true),
  toggle, finish: () => { let n = 0; while (TL && n++ < 40) finishTL(); },
  step(dt) { stepTL(dt); },
  speed(v) { A.speed = v; },
  state() { return { mode: A.mode, busy: A.busy, cur: A.cur && A.cur.spec.key, tl: TL && TL.t, cam: Object.assign({}, Rig.cur), calls: renderer.info.render.calls, tris: renderer.info.render.triangles, geos: renderer.info.memory.geometries, tex: renderer.info.memory.textures }; },
  renderer,
};
init();

})();
</script>
