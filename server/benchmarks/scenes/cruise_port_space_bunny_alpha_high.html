<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lisbon Cruise Port — Interactive 3D</title>
<style>
  :root {
    --ink: #f7f4ea;
    --muted: #b9c6cf;
    --glass: rgba(8, 19, 28, 0.78);
    --glass-2: rgba(11, 28, 40, 0.9);
    --line: rgba(255,255,255,.15);
    --gold: #ffcf78;
    --aqua: #73dce2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #06131d; color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #viewport { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  button, input { font: inherit; }
  button { color: var(--ink); border: 1px solid var(--line); background: rgba(255,255,255,.07); border-radius: 9px; padding: 8px 11px; cursor: pointer; transition: .18s ease; white-space: nowrap; }
  button:hover { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.3); transform: translateY(-1px); }
  button.active { color: #071720; background: var(--gold); border-color: var(--gold); }
  button.primary { color: #071720; background: var(--aqua); border-color: var(--aqua); font-weight: 750; }
  #ui { position: fixed; inset: 0; pointer-events: none; transition: opacity .25s; }
  #ui.hidden { opacity: 0; pointer-events: none !important; }
  .glass { pointer-events: auto; background: var(--glass); border: 1px solid var(--line); box-shadow: 0 12px 35px rgba(0,0,0,.22); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  #brand { position: absolute; top: 14px; left: 14px; display: flex; align-items: center; gap: 11px; padding: 10px 13px; border-radius: 12px; }
  #brandMark { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; color: #10212a; background: linear-gradient(145deg, var(--gold), #e77f48); font-size: 19px; }
  #brand strong { display: block; font-size: 13px; letter-spacing: .12em; }
  #brand span { display: block; color: var(--muted); font-size: 10px; letter-spacing: .15em; margin-top: 2px; }
  #timePanel { position: absolute; top: 14px; right: 14px; width: 242px; padding: 11px 12px 10px; border-radius: 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .eyebrow { color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
  #clock { font-variant-numeric: tabular-nums; color: var(--gold); font-weight: 750; font-size: 18px; }
  #timeSlider { width: 100%; accent-color: var(--gold); margin: 8px 0 9px; cursor: pointer; }
  .miniButtons { display: flex; gap: 6px; }
  .miniButtons button { flex: 1; padding: 6px 7px; font-size: 10px; border-radius: 7px; }
  #cameraBar { position: absolute; left: 50%; bottom: 15px; transform: translateX(-50%); display: flex; align-items: center; gap: 5px; padding: 7px; border-radius: 13px; max-width: calc(100vw - 28px); overflow-x: auto; }
  #cameraBar button { font-size: 10px; letter-spacing: .06em; padding: 9px 11px; }
  #cameraBar .divider { width: 1px; height: 27px; background: var(--line); flex: none; }
  #help { position: absolute; left: 15px; bottom: 18px; color: rgba(255,255,255,.82); font-size: 10px; line-height: 1.45; text-shadow: 0 1px 3px #000; letter-spacing: .04em; }
  #hideUI { position: absolute; right: 15px; bottom: 18px; padding: 7px 10px; font-size: 10px; }
  #status { position: absolute; top: 82px; left: 50%; transform: translate(-50%,-8px); padding: 8px 14px; border-radius: 20px; font-size: 11px; opacity: 0; transition: .3s; white-space: nowrap; }
  #status.show { opacity: 1; transform: translate(-50%,0); }
  #loader { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #173b4a, #06131d 65%); transition: opacity .65s; }
  #loader.gone { opacity: 0; pointer-events: none; }
  .loaderCard { width: min(420px, calc(100vw - 40px)); text-align: center; }
  .loaderWave { width: 58px; height: 58px; border: 2px solid rgba(255,255,255,.2); border-top-color: var(--gold); border-radius: 50%; margin: 0 auto 19px; animation: spin 1s linear infinite; }
  .loaderCard h1 { font-size: 15px; letter-spacing: .18em; margin: 0 0 8px; }
  .loaderCard p { margin: 0; color: var(--muted); font-size: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 13px; height: 13px; transform: translate(-50%,-50%); border: 1px solid rgba(255,255,255,.7); border-radius: 50%; display: none; pointer-events: none; box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
  body.walking #crosshair { display: block; }
  body.walking #help { opacity: .35; }
  @media (max-width: 760px) {
    #brand span { display: none; }
    #brand { padding: 8px; }
    #brandMark { width: 30px; height: 30px; }
    #timePanel { top: 10px; right: 10px; width: 190px; }
    #cameraBar { bottom: 9px; left: 9px; right: 9px; transform: none; max-width: none; justify-content: flex-start; }
    #cameraBar button { padding: 8px; font-size: 9px; }
    #help { display: none; }
    #hideUI { bottom: 69px; right: 10px; }
  }
</style>

<body>
<div id="viewport"></div>
<div id="loader">
  <div class="loaderCard">
    <div class="loaderWave"></div>
    <h1>CRUISE PORT LISBOA</h1>
    <p id="loadMessage">Preparing Alfama, the Tagus and a 300-metre ship…</p>
  </div>
</div>
<div id="ui">
  <div id="brand" class="glass">
    <div id="brandMark">⚓</div>
    <div><strong>CRUISE PORT LISBOA</strong><span>JARDIM DO TABACO · TAGUS ESTUARY</span></div>
  </div>
  <div id="timePanel" class="glass">
    <div class="row"><span class="eyebrow">Lisbon time</span><span id="clock">17:48</span></div>
    <input id="timeSlider" aria-label="Time of day" type="range" min="0" max="24" step="0.01" value="17.8">
    <div class="miniButtons">
      <button id="playTime" title="Pause the time cycle">Ⅱ PAUSE TIME</button>
      <button id="weather" title="Cycle clear, haze and light rain">☀ CLEAR</button>
      <button id="hidePanel" title="Hide interface">HIDE UI</button>
    </div>

  <div id="status" class="glass"></div>
  <div id="help" class="glass" style="padding:8px 10px;border-radius:9px">DRAG TO ORBIT · SCROLL TO ZOOM<br>RIGHT-DRAG TO PAN · CLICK A VIEWPOINT</div>
  <div id="cameraBar" class="glass">
    <button data-view="miradouro" class="active">MIRADOURO</button>
    <button data-view="waterfront">WATERFRONT</button>
    <button data-view="aerial">AERIAL</button>
    <button data-view="river">FROM THE RIVER</button>
    <button data-view="deck">SHIP'S DECK</button>
    <div class="divider"></div>
    <button id="walk">WALK</button>
    <button id="depart" class="primary">DEPARTURE</button>
    <button id="return">RETURN</button>
  </div>
  <button id="hideUI">SHOW UI · H</button>
</div>
<div id="crosshair"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { Water } from 'three/addons/objects/Water.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const $ = id => document.getElementById(id);
const clamp = THREE.MathUtils.clamp;
const lerp = THREE.MathUtils.lerp;
const smooth = THREE.MathUtils.smoothstep;
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (error) {
  $('loadMessage').innerHTML = 'WebGL is unavailable in this browser.<br>Please enable hardware acceleration and reload this page.';
  document.querySelector('.loaderWave').style.animation = 'none';
  throw error;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x99c5d4);
scene.fog = new THREE.FogExp2(0xabc4c8, .0018);
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, .15, 5000);
camera.position.set(245, 145, 255);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-25, 30, -28);
controls.enableDamping = true;
controls.dampingFactor = .055;
controls.minDistance = 8;
controls.maxDistance = 1100;
controls.maxPolarAngle = Math.PI * .49;
controls.update();

const clock = new THREE.Clock();
const tmpM = new THREE.Matrix4();
const tmpQ = new THREE.Quaternion();
const tmpV = new THREE.Vector3();
const dummy = new THREE.Object3D();
const color = new THREE.Color();
const midnight = new THREE.Color(0x071321);
const dayBlue = new THREE.Color(0x9bcbd6);
const warmSky = new THREE.Color(0xd6a36f);

const hemi = new THREE.HemisphereLight(0xb8dded, 0x4b382e, 1.8);
scene.add(hemi);
const sunLight = new THREE.DirectionalLight(0xffd6a0, 3.2);
sunLight.position.set(-180, 170, 160);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
Object.assign(sunLight.shadow.camera, { left: -330, right: 330, top: 280, bottom: -280, near: 1, far: 800 });
sunLight.shadow.bias = -.0004;
scene.add(sunLight);
scene.add(sunLight.target);

const sky = new Sky();
sky.scale.setScalar(4500);
scene.add(sky);
const skyU = sky.material.uniforms;
skyU.turbidity.value = 5;
skyU.rayleigh.value = 2.1;
skyU.mieCoefficient.value = .006;
skyU.mieDirectionalG.value = .82;

const moon = new THREE.Mesh(new THREE.SphereGeometry(11, 20, 12), new THREE.MeshBasicMaterial({ color: 0xf4ead0 }));
scene.add(moon);

function makeNormalTexture(size = 128) {
  const data = new Uint8Array(size * size * 4);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const u = x / size * Math.PI * 2, v = y / size * Math.PI * 2;
    const dx = Math.cos(u * 5 + Math.sin(v * 3)) * .35 + Math.cos(u * 11 - v * 7) * .18;
    const dy = Math.sin(v * 6 + Math.cos(u * 4)) * .32 + Math.sin(v * 13 + u * 5) * .16;
    const i = (y * size + x) * 4;
    data[i] = 128 + dx * 105;
    data[i + 1] = 128 + dy * 105;
    data[i + 2] = 245;
    data[i + 3] = 255;
  }
  const t = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.generateMipmaps = true;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.magFilter = THREE.LinearFilter;
  t.needsUpdate = true;
  return t;
}
const water = new Water(new THREE.PlaneGeometry(3000, 1500), {
  textureWidth: 768,
  textureHeight: 768,
  waterNormals: makeNormalTexture(),
  sunDirection: new THREE.Vector3(-.5, .5, .5),
  sunColor: 0xffe2b0,
  waterColor: 0x155568,
  distortionScale: 2.1,
  alpha: .96,
  fog: true
});
water.rotation.x = -Math.PI / 2;
water.position.set(0, -.2, 260);
water.renderOrder = -1;
scene.add(water);

const mats = {
  stone: new THREE.MeshStandardMaterial({ color: 0xbeb4a2, roughness: .92 }),
  paleStone: new THREE.MeshStandardMaterial({ color: 0xe6dfcf, roughness: .86 }),
  asphalt: new THREE.MeshStandardMaterial({ color: 0x424a4d, roughness: .98 }),
  quay: new THREE.MeshStandardMaterial({ color: 0xaaa597, roughness: .9 }),
  white: new THREE.MeshStandardMaterial({ color: 0xf2f0e8, roughness: .48, metalness: .04 }),
  warmWhite: new THREE.MeshStandardMaterial({ color: 0xeee4d3, roughness: .55 }),
  navy: new THREE.MeshStandardMaterial({ color: 0x071c2a, roughness: .38, metalness: .18 }),
  orange: new THREE.MeshStandardMaterial({ color: 0xee6b2d, roughness: .5 }),
  gold: new THREE.MeshStandardMaterial({ color: 0xdca84e, roughness: .5, metalness: .15 }),
  glass: new THREE.MeshStandardMaterial({ color: 0x173f53, roughness: .22, metalness: .5, transparent: true, opacity: .78 }),
  window: new THREE.MeshStandardMaterial({ color: 0x0b2532, emissive: 0xffc46e, emissiveIntensity: .05, roughness: .3, metalness: .18 }),
  warmLight: new THREE.MeshStandardMaterial({ color: 0xffe6ae, emissive: 0xffb955, emissiveIntensity: .5, roughness: .35 }),
  red: new THREE.MeshStandardMaterial({ color: 0x9f2f25, roughness: .58, metalness: .35 }),
  darkRed: new THREE.MeshStandardMaterial({ color: 0x69251f, roughness: .64, metalness: .25 }),
  teal: new THREE.MeshStandardMaterial({ color: 0x28b9c5, roughness: .2, metalness: .15 }),
  waterBlue: new THREE.MeshStandardMaterial({ color: 0x24b9d1, roughness: .16, metalness: .12 }),
  rubber: new THREE.MeshStandardMaterial({ color: 0x161b1e, roughness: .85 }),
  chrome: new THREE.MeshStandardMaterial({ color: 0xbec9cd, roughness: .24, metalness: .8 }),
  green: new THREE.MeshStandardMaterial({ color: 0x527b59, roughness: .9 }),
  terracotta: new THREE.MeshStandardMaterial({ color: 0xb85235, roughness: .92 })
};

function mesh(geometry, material, pos, parent = scene, shadow = false) {
  const m = new THREE.Mesh(geometry, material);
  if (pos) m.position.set(...pos);
  m.castShadow = shadow;
  m.receiveShadow = shadow;
  parent.add(m);
  return m;
}
function box(w, h, d, material, pos, parent = scene, radius = 0) {
  const g = radius ? new RoundedBoxGeometry(w, h, d, 3, radius) : new THREE.BoxGeometry(w, h, d);
  return mesh(g, material, pos, parent, true);
}
function cylinder(rt, rb, h, mat, pos, parent = scene, sides = 16) {
  return mesh(new THREE.CylinderGeometry(rt, rb, h, sides), mat, pos, parent, true);
}
function beamBetween(a, b, radius, mat, parent = scene) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), d = B.clone().sub(A);
  const m = mesh(new THREE.CylinderGeometry(radius, radius, d.length(), 8), mat, A.clone().add(B).multiplyScalar(.5).toArray(), parent, true);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d.normalize());
  return m;
}
function groundHeight(x, z) {
  if (z > -52) return 0;
  const t = clamp((-z - 52) / 248, 0, 1);
  return 2 + Math.pow(t, 1.28) * 99 + Math.sin(x * .016) * Math.min(t * 7, 5);
}

const hillGeo = new THREE.PlaneGeometry(1000, 270, 64, 24);
hillGeo.rotateX(-Math.PI / 2);
const hp = hillGeo.attributes.position;
for (let i = 0; i < hp.count; i++) hp.setY(i, groundHeight(hp.getX(i), hp.getZ(i) - 195));
hillGeo.computeVertexNormals();
mesh(hillGeo, new THREE.MeshStandardMaterial({ color: 0x8f8874, roughness: 1 }), [0,0,-187]);
box(1080, 7, 51, mats.quay, [0,-2.1,-38.5]);
box(1080, .15, 8.4, mats.asphalt, [0,1.48,-19.5]);
for (let x = -500; x < 500; x += 12) box(5.5, .03, .22, mats.paleStone, [x,1.57,-18.8], scene);
for (let x = -520; x <= 520; x += 35) {
  cylinder(.23,.3,1.15,mats.navy,[x,2.1,-14.2],scene,8);
  cylinder(.34,.34,.16,mats.warmLight,[x,2.72,-14.2],scene,10);
  beamBetween([x,2.4,-14.2],[x,8.5,-14.2],.07,mats.chrome);
  beamBetween([x,8.5,-14.2],[x+2.2,8.5,-14.2],.07,mats.chrome);
}
for(let x=-500;x<520;x+=5) box(.5,.2,.45,mats.paleStone,[x,2.0,-12.6],scene);

function canvasTexture(w, h, draw) {
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4; return t;
}
const tileTex = canvasTexture(128,128,(g,w,h)=>{
  g.fillStyle='#e6efe9';g.fillRect(0,0,w,h);g.strokeStyle='#39788d';g.lineWidth=3;
  for(let y=-16;y<h+16;y+=32)for(let x=-16;x<w+16;x+=32){g.beginPath();g.arc(x+(y%64?16:0),y,9,0,Math.PI*2);g.stroke();g.beginPath();g.arc(x+(y%64?16:0),y,3,0,Math.PI*2);g.stroke();}
});
const tileMat = new THREE.MeshStandardMaterial({ map: tileTex, color: 0xffffff, roughness: .76 });

const houseData=[];
const pastel=[0xf2e6d0,0xe7c7b1,0xc7d8cf,0xd7b9ca,0xf0d69a,0xdce5e3,0xb9c9db,0xe7d6b4,0xf4eee4];
for(let row=0;row<8;row++){
  const z=-68-row*24;
  for(let col=0;col<29;col++){
    const x=-225+col*17+(row%2)*6+Math.sin(col*1.7+row)*2.8;
    const y=groundHeight(x,z);
    const w=8+Math.random()*5, d=9+Math.random()*5, floors=3+Math.floor(Math.random()*3);
    houseData.push({x,y,z,w,d,floors,rot:(Math.random()-.5)*.16,color: pastel[Math.floor(Math.random()*pastel.length)],tile:Math.random()<.28});
  }
}
const houseGeo=new THREE.BoxGeometry(1,1,1), roofGeo=new THREE.BufferGeometry();
roofGeo.setAttribute('position',new THREE.Float32BufferAttribute([
  -.5,0,-.5, .5,0,-.5, 0,1,-.5, -.5,0,.5, .5,0,.5, 0,1,.5
],3));
roofGeo.setIndex([0,2,1,3,4,5,0,3,5,0,5,2,1,2,5,1,5,4,0,1,4,0,4,3]);
roofGeo.computeVertexNormals();
const houseInst=new THREE.InstancedMesh(houseGeo,mats.warmWhite,houseData.length);
const tileInst=new THREE.InstancedMesh(houseGeo,tileMat,houseData.filter(h=>h.tile).length);
const roofInst=new THREE.InstancedMesh(roofGeo,mats.terracotta,houseData.length);
let hi=0,ti=0;
const windows=[];
houseData.forEach(h=>{
  const height=h.floors*3.05+1;
  dummy.position.set(h.x,h.y+height/2,h.z);dummy.rotation.set(0,h.rot,0);dummy.scale.set(h.w,height,h.d);dummy.updateMatrix();
  (h.tile?tileInst:houseInst).setMatrixAt(h.tile?ti++:hi++,dummy.matrix);
  (h.tile?tileInst:houseInst).setColorAt(h.tile?ti-1:hi-1,color.set(h.color));
  dummy.position.set(h.x,h.y+height+.9,h.z);dummy.scale.set(h.w+.8,2.5,h.d+.8);dummy.updateMatrix();roofInst.setMatrixAt(hi-1,dummy.matrix);
  for(let f=0;f<h.floors;f++)for(let k=-1;k<=1;k++)windows.push({x:h.x+k*h.w*.28,y:h.y+1.65+f*3.05,z:h.z+h.d*.505+.04,rot:h.rot,w:.7});
});
houseInst.instanceMatrix.needsUpdate=true;tileInst.instanceMatrix.needsUpdate=true;roofInst.instanceMatrix.needsUpdate=true;
scene.add(houseInst,tileInst,roofInst);
const winInst=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),mats.window,windows.length);
windows.forEach((w,i)=>{dummy.position.set(w.x,w.y,w.z);dummy.rotation.set(0,w.rot,0);dummy.scale.set(w.w,1.25,.06);dummy.updateMatrix();winInst.setMatrixAt(i,dummy.matrix);color.setHSL(.09+Math.random()*.06,.45,.24+Math.random()*.28);winInst.setColorAt(i,color)});
scene.add(winInst);
for(let i=0;i<5;i++){
  const pts=[];
  for(let j=0;j<32;j++){const t=j/31;const x=-210+t*440;const z=-62-i*35+Math.sin(t*Math.PI*4+i)*5;const y=groundHeight(x,z)+.22;pts.push(new THREE.Vector3(x,y,z));}
  mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),64,.75,4,false),mats.paleStone);
}

function makeCastle(x,z){
  const g=new THREE.Group();scene.add(g);g.position.set(x,groundHeight(x,z),z);
  box(85,9,38,mats.paleStone,[0,4.5,0],g);
  for(let i=-4;i<=4;i++)for(let j of [-1,1])box(5,11,5,mats.paleStone,[i*9,5,j*20],g);
  box(32,19,29,mats.stone,[0,13,0],g);
  for(let i=-14;i<=14;i+=3.5){box(2.3,2.3,2.2,mats.paleStone,[i,10,20],g);box(2.3,2.3,2.2,mats.paleStone,[i,10,-20],g)}
  for(let i=-1;i<=1;i++){cylinder(7,8,25,mats.paleStone,[i*31,12,-20],g,12);cylinder(8,8,2,mats.stone,[i*31,25.5,-20],g,12)}
  return g;
}
makeCastle(78,-252);

function makePantheon(){
  const x=-30,z=-75,y=groundHeight(x,z);const g=new THREE.Group();g.position.set(x,y,z);scene.add(g);
  cylinder(12,13,18,mats.white,[0,9,0],g,32);
  for(let i=0;i<16;i++){const a=i/16*Math.PI*2;cylinder(.65,.75,17,mats.white,[Math.sin(a)*12.5,8.5,Math.cos(a)*12.5],g,10)}
  const dome=mesh(new THREE.SphereGeometry(12.5,32,16,0,Math.PI*2,0,Math.PI/2),mats.white,[0,18,0],g,true);dome.scale.y=.72;
  cylinder(1.2,1.2,4,mats.gold,[0,28,0],g,12);
  box(5,10,4,mats.paleStone,[0,5,13],g,.3);
}
makePantheon();
function makeCathedral(){
  const x=-102,z=-88,y=groundHeight(x,z);const g=new THREE.Group();g.position.set(x,y,z);scene.add(g);
  box(28,24,42,mats.paleStone,[0,12,0],g);
  for(let i=-1;i<=1;i+=2){
    box(10,37,12,mats.white,[i*8,18.5,-15],g);
    box(12,3,14,mats.stone,[i*8,38,-15],g);
    box(7,3,9,mats.white,[i*8,40,-15],g);

for(let i=0;i<rainCount;i++){rainPos[i*3]=(Math.random()-.5)*850;rainPos[i*3+1]=Math.random()*180;rainPos[i*3+2]=(Math.random()-.5)*650-40}
const rainGeo=new THREE.BufferGeometry();rainGeo.setAttribute('position',new THREE.BufferAttribute(rainPos,3));
const rain=new THREE.Points(rainGeo,new THREE.PointsMaterial({color:0xcce9f0,size:.6,transparent:true,opacity:.45,depthWrite:false}));rain.visible=false;scene.add(rain);

let timeHour=17.8,timePlaying=true,weatherIndex=0,weatherNames=['CLEAR','HAZE','LIGHT RAIN'];
const weatherTypes=['clear','haze','rain'];
let nightFactor=0;
function updateAtmosphere(){
  const angle=(timeHour-6)/12*Math.PI;
  const elevation=Math.sin(angle);
  nightFactor=1-smooth(elevation,-.08,.22);
  const az=Math.cos(angle)*.8+.25;
  const sunDir=new THREE.Vector3(Math.cos(angle),elevation,az).normalize();
  sunLight.position.copy(sunDir).multiplyScalar(400);
  sunLight.intensity=.12+(1-nightFactor)*3.15;
  sunLight.color.set(nightFactor>.5?0xb8cfff:timeHour>16?0xffc078:0xfff1d0);
  hemi.intensity=.4+(1-nightFactor)*1.55;
  skyU.sunPosition.value.copy(sunDir);
  skyU.turbidity.value=weatherTypes[weatherIndex]==='haze'?12:5;
  sky.visible=nightFactor<.97;
  stars.material.opacity=nightFactor*.9;
  moon.position.set(250,320,-300);moon.visible=nightFactor>.6;
  scene.background.copy(dayBlue).lerp(midnight,nightFactor);
  if(timeHour>15&&timeHour<20&&nightFactor<.6)scene.background.lerp(warmSky,(1-nightFactor)*.22);
  const w=weatherTypes[weatherIndex];
  scene.fog.density=w==='haze'?.0052:w==='rain'?.0035:.00165+nightFactor*.0008;
  scene.fog.color.copy(scene.background).lerp(new THREE.Color(0x8ba3aa),.25);
  water.material.uniforms.sunDirection.value.copy(sunDir);
  water.material.uniforms.sunColor.value.set(nightFactor>.5?0x829ec4:0xffe0aa);
  water.material.uniforms.waterColor.value.set(nightFactor>.5?0x071b2a:0x155568);
  mats.window.emissiveIntensity=.04+nightFactor*2.2;
  mats.warmLight.emissiveIntensity=.2+nightFactor*4;
  renderer.toneMappingExposure=1.05-nightFactor*.13;
  const h=Math.floor(timeHour),m=Math.floor((timeHour-h)*60);$('clock').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
$('timeSlider').addEventListener('input',e=>{timeHour=parseFloat(e.target.value);updateAtmosphere()});
$('playTime').addEventListener('click',()=>{timePlaying=!timePlaying;$('playTime').textContent=timePlaying?'Ⅱ PAUSE TIME':'▶ PLAY TIME';$('playTime').classList.toggle('active',!timePlaying)});
$('weather').addEventListener('click',()=>{weatherIndex=(weatherIndex+1)%3;rain.visible=weatherTypes[weatherIndex]==='rain';$('weather').textContent=(weatherTypes[weatherIndex]==='rain'?'☂ ':weatherTypes[weatherIndex]==='haze'?'≋ ':'☀ ')+weatherNames[weatherIndex];updateAtmosphere()});

let fly=null;
const views={
  miradouro:{p:[-126,116,-207],t:[-5,27,17]},
  waterfront:{p:[-76,7,-14],t:[16,30,11]},
  aerial:{p:[220,185,245],t:[-30,27,-32]},
  river:{p:[90,13,210],t:[-30,33,-25]},
  deck:{p:[78,64,11],t:[-120,24,-130]}
};
function flyTo(name){
  const v=views[name];if(!v)return;
  fly={fromP:camera.position.clone(),fromT:controls.target.clone(),toP:new THREE.Vector3(...v.p),toT:new THREE.Vector3(...v.t),t:0,dur:2.1};
  controls.enabled=false;document.body.classList.remove('walking');if(document.pointerLockElement)document.exitPointerLock();
  document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===name));
}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>flyTo(b.dataset.view)));
controls.addEventListener('start',()=>{fly=null;controls.enabled=true});

let walking=false,keys={};
const euler=new THREE.Euler(0,0,0,'YXZ');
$('walk').addEventListener('click',()=>{
  walking=!walking;$('walk').classList.toggle('active',walking);document.body.classList.toggle('walking',walking);
  if(walking){
    fly=null;controls.enabled=false;camera.position.set(-70,3.3,-18);euler.setFromQuaternion(camera.quaternion);renderer.domElement.requestPointerLock?.();
  }else if(document.pointerLockElement)document.exitPointerLock();
});
document.addEventListener('mousemove',e=>{if(walking&&document.pointerLockElement===renderer.domElement){euler.y-=e.movementX*.002;euler.x=clamp(euler.x-e.movementY*.002,-1.4,1.4);camera.quaternion.setFromEuler(euler)}});
document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyH')toggleUI()});
document.addEventListener('keyup',e=>keys[e.code]=false);
function toggleUI(){$('ui').classList.toggle('hidden')}
$('hideUI').addEventListener('click',toggleUI);$('hidePanel').addEventListener('click',toggleUI);

let departureTarget=0,departureProgress=0;
function horn(){
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=new AC(),master=ac.createGain();master.gain.value=.12;master.connect(ac.destination);
  [0,.62].forEach(delay=>{const t=ac.currentTime+delay;const gain=ac.createGain();gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(.75,t+.12);gain.gain.setValueAtTime(.75,t+1.1);gain.gain.linearRampToValueAtTime(0,t+1.45);gain.connect(master);[92,116,138].forEach((f,i)=>{const o=ac.createOscillator();o.type=i===0?'sawtooth':'sine';o.frequency.setValueAtTime(f,t);o.frequency.linearRampToValueAtTime(f*.93,t+1.4);o.connect(gain);o.start(t);o.stop(t+1.5)})});
}
function showStatus(s){$('status').textContent=s;$('status').classList.add('show');clearTimeout(showStatus.timer);showStatus.timer=setTimeout(()=>$('status').classList.remove('show'),3500)}
$('depart').addEventListener('click',()=>{
  departureTarget=1;horn();mooringGroup.visible=false;gangways.forEach(g=>g.visible=true);showStatus('DEPARTURE · TWO LONG HORNS · ALL LINES RELEASED');
  flyTo('river');
});
$('return').addEventListener('click',()=>{departureTarget=0;showStatus('RETURNING TO JARDIM DO TABACO');flyTo('miradouro')});

function animateBoats(t,dt){
  tug.position.lerp(new THREE.Vector3(ship.position.x+158,0,ship.position.z-28),1-Math.exp(-dt*.8));
  tug.rotation.y=ship.rotation.y-.12;
  pilot.position.set(185+Math.sin(t*.13)*55,0,30+Math.cos(t*.16)*38);
  pilot.rotation.y=t*.7;
  ferries.forEach((f,i)=>{
    const phase=(t*(.012+i*.002)+i*.5)%1;f.position.set(65+i*70+Math.sin(t*.05)*22,0,330-phase*520);f.rotation.y=Math.PI/2+Math.sin(t*.07)*.1;
  });
  sailboat.position.set(-75+Math.sin(t*.07)*25,0,100+Math.cos(t*.05)*18);sailboat.rotation.y=Math.sin(t*.1)*.5;
  sailboat2.position.set(10+Math.cos(t*.06)*20,0,135+Math.sin(t*.08)*20);sailboat2.rotation.y=t*.3;
  vehicles.forEach(v=>{
    v.g.position.x+=v.speed*dt*v.dir;
    if(v.g.position.x>230)v.g.position.x=-230;if(v.g.position.x<-230)v.g.position.x=230;
  });
  forklift.position.x=100+Math.sin(t*.12)*34;forklift.position.y=1.6+Math.sin(t*.12*2)*.02;
  peopleData.forEach((p,i)=>{p.x+=p.dir*p.speed*dt;if(p.x>225)p.x=-225;if(p.x<-225)p.x=225;const bob=Math.abs(Math.sin(t*5+p.phase))*.055;dummy.position.set(p.x,2.05+bob,p.z+Math.sin(p.phase)*2);dummy.rotation.set(0,p.dir>0?Math.PI/2:-Math.PI/2,Math.sin(t*5+p.phase)*.035);const sc=p.scale;dummy.scale.set(sc,sc,sc);dummy.updateMatrix();peopleMesh.setMatrixAt(i,dummy.matrix)});peopleMesh.instanceMatrix.needsUpdate=true;
  gulls.forEach(b=>{const a=t*b.speed+b.phase;b.g.position.set(b.rx+Math.cos(a)*24,b.y+Math.sin(a*2)*3,b.rz+Math.sin(a)*28);b.g.rotation.y=-a;b.l.rotation.z=Math.sin(t*7+b.phase)*.38;b.r.rotation.z=-Math.sin(t*7+b.phase)*.38});
  if(rain.visible){const a=rainGeo.attributes.position;for(let i=0;i<rainCount;i++){a.array[i*3+1]-=dt*55;a.array[i*3]-=dt*4;if(a.array[i*3+1]<0){a.array[i*3+1]=180;a.array[i*3]=(Math.random()-.5)*850}a.setY(i,a.array[i*3+1])}a.needsUpdate=true}
  tram.group.position.copy(tram.start).add(new THREE.Vector3(Math.sin(t*.07)*18,Math.sin(t*.7)*.035,Math.cos(t*.07)*8));
}

function resize(){
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
}
addEventListener('resize',resize);

let elapsed=0;
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),.05);elapsed+=dt;
  if(timePlaying){timeHour=(timeHour+dt*.025)%24;$('timeSlider').value=timeHour}
  updateAtmosphere();
  departureProgress=THREE.MathUtils.damp(departureProgress,departureTarget,.13,dt);
  const p=smooth(departureProgress,0,1);
  ship.position.set(-470*p,0,10+185*p+Math.sin(p*Math.PI)*22);
  ship.rotation.y=2.72*p;
  gangways.forEach(g=>{g.position.y=-7*p;g.visible=p<.985});
  if(p<.01)mooringGroup.visible=true;
  if(fly){
    fly.t+=dt;let q=clamp(fly.t/fly.dur,0,1);q=q*q*(3-2*q);
    camera.position.lerpVectors(fly.fromP,fly.toP,q);controls.target.lerpVectors(fly.fromT,fly.toT,q);
    if(fly.t>=fly.dur){fly=null;controls.enabled=true}
  }else if(walking&&document.pointerLockElement===renderer.domElement){
    const speed=(keys.ShiftLeft?15:8)*dt;const f=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);f.y=0;f.normalize();const r=new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);r.y=0;r.normalize();
    if(keys.KeyW)camera.position.addScaledVector(f,speed);if(keys.KeyS)camera.position.addScaledVector(f,-speed);if(keys.KeyD)camera.position.addScaledVector(r,speed);if(keys.KeyA)camera.position.addScaledVector(r,-speed);
    camera.position.x=clamp(camera.position.x,-510,510);camera.position.z=clamp(camera.position.z,-68,-13.5);camera.position.y=3.3+Math.sin(elapsed*9)*.025*(keys.KeyW||keys.KeyS);
  }else controls.update();
  animateBoats(elapsed,dt);
  water.material.uniforms.time.value+=dt*.42;
  renderer.render(scene,camera);
}
updateAtmosphere();
frame();
setTimeout(()=>{$('loader').classList.add('gone');setTimeout(()=>$('loader').remove(),700)},650);
</script>
