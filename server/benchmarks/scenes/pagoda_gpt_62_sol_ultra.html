<!DOCTYPE html>

<title>Voxel Garden · Spring at the Five-Story Pagoda</title>
<style>

.footer { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
.hint { padding: 8px 12px; background: var(--panel); color: #eee0ca; font-size: 11px; letter-spacing: .024em; }
.clock { min-width: 240px; pointer-events: auto; display: grid; grid-template-columns: 34px minmax(88px, 1fr) 49px; align-items: center; gap: 10px; background: var(--panel); padding: 9px 13px 9px 8px; border: 1px solid var(--edge); box-shadow: 0 8px 26px #243b3328; }

button:focus-visible, input:focus-visible { outline: 2px solid #efbe89; outline-offset: 2px; }
#clock-time { text-align: end; color: #ffe2ab; font: 12px/1 ui-monospace, monospace; }

<body>
<p id="loading">Preparing the garden…</p>
<main id="hud" aria-label="Voxel Garden controls">
  <header class="identity"><h1>VOXEL GARDEN</h1><div id="stats">Preparing scene</div></header>
  <div class="footer">
    <div class="hint">Drag to orbit · Click lanterns or pagoda doors</div>
    <div class="clock">
      <button id="pause" type="button" aria-label="Pause daylight cycle" title="Pause daylight cycle">Ⅱ</button>
      <label id="daylight" for="time">Time of day<input id="time" type="range" min="0" max="1439" value="515"></label>
      <output id="clock-time" for="time">08:35</output>
    </div>
  </div>
</main>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(37, 1, .2, 550);
const renderer = new THREE.WebGLRenderer({antialias: true, powerPreference: 'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.domElement.setAttribute('aria-label', 'Interactive floating island and five-story pagoda');
document.body.prepend(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .072;
controls.autoRotateSpeed = .27;
controls.minDistance = 14;
controls.maxDistance = 280;
controls.minPolarAngle = .13;
controls.maxPolarAngle = 1.97;
controls.zoomToCursor = true;
controls.panSpeed = .65;

const hemisphere = new THREE.HemisphereLight(0xffe8cd, 0x877d86, 1.8);
const sun = new THREE.DirectionalLight(0xffdeb5, 2.8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-68,right:68,top:65,bottom:-64,near:8,far:235});
sun.shadow.bias = -.00025;
sun.shadow.normalBias = .21;
sun.target.position.set(0, 1, 0);
scene.add(hemisphere, sun, sun.target);
scene.fog = new THREE.FogExp2(0xb4c3b8, .00212);

const unitBox = new THREE.BoxGeometry(1, 1, 1);
const matrix = new THREE.Matrix4();
const workingColor = new THREE.Color();
const batches = new Map();
const interactions = [];
const doors = [];
const lanterns = [];
let dynamicVoxelCount = 0;
let seed = 0x8345013;
function random() {
  seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
  return seed / 4294967296;
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function hash(x, z, salt = 0) {
  let h = Math.imul(x + 171, 374761393) ^ Math.imul(z + 233, 668265263) ^ Math.imul(salt + 579, 19349663);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function shade(hex, amount) {
  workingColor.set(hex);
  if (amount > 0) workingColor.lerp(new THREE.Color(0xffffff), clamp(amount, 0, 1));
  else workingColor.multiplyScalar(1 + clamp(amount, -1, 0));
  return workingColor.getHex();
}
function block(x, y, z, sx, sy, sz, color, batch = 'solid') {
  if (!batches.has(batch)) batches.set(batch, []);
  batches.get(batch).push([x, y, z, sx, sy, sz, color]);
}
function makeMaterial(options = {}) {
  return new THREE.MeshStandardMaterial({roughness: .85, ...options});
}
function flushBlocks() {
  let count = 0;
  for (const [batch, list] of batches) {
    const options = {
      warm: {emissive: 0xffa23c, emissiveIntensity: .48},
      water: {transparent: true, opacity: .47, depthWrite: false, roughness: .28, metalness: .08},
      falls: {roughness: .32, emissive: 0x346a6e, emissiveIntensity: .16},
      cloud: {roughness: 1, emissive: 0xafa6a2, emissiveIntensity: .32}
    }[batch];
    const mesh = new THREE.InstancedMesh(unitBox, makeMaterial(options), list.length);
    mesh.name = batch;
    mesh.castShadow = batch === 'solid' || batch === 'canopy';
    mesh.receiveShadow = ['solid', 'ground', 'water', 'canopy'].includes(batch);
    mesh.renderOrder = batch === 'water' ? 3 : 0;
    list.forEach(([x,y,z,sx,sy,sz,color], i) => {
      matrix.makeScale(sx,sy,sz).setPosition(x,y,z);
      mesh.setMatrixAt(i, matrix);
      mesh.setColorAt(i, workingColor.set(color));
    });
    mesh.computeBoundingSphere();
    scene.add(mesh);
    count += list.length;
  }
  batches.clear();
  return count;
}

const sky = new THREE.Mesh(new THREE.SphereGeometry(360, 36, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { zenith:{value:new THREE.Color()}, horizon:{value:new THREE.Color()}, below:{value:new THREE.Color()}, sunDir:{value:new THREE.Vector3()}, sunGlow:{value:1}, night:{value:0} },
  vertexShader: `varying vec3 direction;
    void main() { direction = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: `varying vec3 direction;
    uniform vec3 zenith, horizon, below, sunDir;
    uniform float sunGlow, night;
    void main() {
      vec3 d = normalize(direction);
      float y = max(d.y, 0.);
      vec3 col = mix(horizon, zenith, smoothstep(-.04, .68, d.y));
      col = mix(col, below, smoothstep(.04, .78, -d.y));
      float s = max(dot(d, sunDir), 0.);
      float halo = pow(s, 28.) * .40 + pow(s, 290.) * .44;
      col += vec3(1., .61, .30) * halo * sunGlow;
      col = mix(col, vec3(1., .91, .72) * 2.2, smoothstep(.99885, .99908, s) * sunGlow);
      vec2 star = vec2(atan(d.z,d.x) * 92., d.y * 158.);
      vec2 cell = floor(star);
      float h = fract(sin(dot(cell, vec2(13.721, 79.831))) * 43758.545);
      float pin = 1. - smoothstep(.026,.116,length(fract(star) - vec2(.35 + h * .33,.55)));
      col += vec3(.72,.87,1.) * pin * step(.983,h) * night * smoothstep(.03,.35,y);
      gl_FragColor = vec4(col,1.);
      #include <colorspace_fragment>
    }`
}));
sky.renderOrder = -100;
sky.frustumCulled = false;
scene.add(sky);

const grassColors = [0x788744,0x84934e,0x8a9b50,0x738445,0x94a256,0x697f45,0x879550];
const mossColors = [0x606c38,0x687943,0x758745,0x7b8b4a];
const pathColors = [0xb9b2a2,0x9aa0a6,0xb1aaa0,0x98a097,0xa9aba0,0xc2b7a0];
const cliffColors = [0x79756c,0x7e796e,0x626c6a,0x8c8375,0x787d75,0x5f6767,0x8a796c];
const pick = (colors, roll) => colors[Math.min(colors.length - 1, Math.floor(roll * colors.length))];
const terrain = new Map();
const key = (x,z) => (x + 56) + (z + 48) * 112;
function cellAt(x,z) {
  const ix = Math.floor(x+.5), iz = Math.floor(z+.5);
  if (ix < -56 || ix > 55 || iz < -48 || iz > 47) return undefined;
  return terrain.get(key(ix,iz));
}
const groundAt = (x,z) => cellAt(x,z)?.top ?? 1.4;
const waterLevel = .62;
const pagodaX = -11, pagodaZ = -22, pagodaY = 8.1;
const creekZ = x => 23.5 + Math.sin((x - 20) * .086) * 3.5 + (x - 27) * .065;
const lowerStairs = [[-18,1.4,5],[-18,4.6,-1.4]];
const upperStairs = [[-8,4.6,1.2],[-11,pagodaY,-6.2]];
const stairways = [lowerStairs,upperStairs];

function pathSample(x,z,[ax,ay,az],[bx,by,bz]) {
  const dx=bx-ax, dz=bz-az;
  const t=clamp(((x-ax)*dx+(z-az)*dz)/(dx*dx+dz*dz),0,1);
  return [Math.hypot(x-ax-dx*t,z-az-dz*t),ay+(by-ay)*t,t];
}

function islandRim(x,z) {
  const nx = (x + 1) / 54, nz = (z - 1) / 44;
  const angle = Math.atan2(nz, nx);
  return Math.hypot(nx,nz) - (1 + .062 * Math.sin(angle * 3 + .54) + .053 * Math.cos(angle * 5 - .9) + .025 * Math.sin(angle * 9 + 1.1));
}
function traceTerrain() {
  for (let z = -48; z <= 47; z++) for (let x = -56; x <= 55; x++) {
    const rim = islandRim(x,z);
    if (rim > .005 + (hash(x,z)-.5)*.025) continue;
    const upperBoundary = -10 + Math.sin((x + 12) * .098) * 2.7;
    const midBoundary = 4 + Math.sin(x * .091) * 3.6;
    let top = z < upperBoundary ? pagodaY : z < midBoundary ? 4.6 : 1.4;
    const shrineTerrace = x >= pagodaX-12 && x <= pagodaX+12 && z >= pagodaZ-12 && z <= -6;
    if (shrineTerrace) top = pagodaY;
    if (x > 25 && z < -22) top += 1.25;
    if (x < -32 && z > 24) top += .55;
    for (const [a,b] of stairways) {
      const [distance,height] = pathSample(x,z,a,b);
      if (distance < 2.9) top = a[1]+Math.round((height-a[1])/.40)*.40;
    }
    const pondR = Math.hypot((x - 2) / 18.9, (z - 22) / 13.35) + .06 * Math.sin(x * .46 + z * .33);
    const channel = x >= 13 ? Math.abs(z - creekZ(x)) / (2.45 + .6 * Math.cos(x * .23)) : 99;
    const bank = Math.min(pondR, channel);
    if (bank < 1.19) {
      top = bank < .53 ? -1.30 : bank < .80 ? -.83 : bank < 1 ? -.17 : bank < 1.12 ? .51 : .99;
    }
    const deep = Math.max(1, 3 + 36 * Math.pow(clamp(-rim,0,1), .95) + 1.8*Math.sin(x*.16 + z*.125) + 1.45*Math.sin(z*.35 - x*.13));
    const bottom = -Math.round(deep);
    terrain.set(key(x,z), {x,z,top,bottom,bank,wet: bank < 1.095});
  }
}

function buildTerrain() {
  traceTerrain();
  const neighbors = [[1,0],[-1,0],[0,1],[0,-1]];
  for (const {x,z,top,bottom,bank,wet} of terrain.values()) {
    const adjacent = neighbors.map(([dx,dz]) => cellAt(x+dx,z+dz));
    const lo = Math.min(top - .3, ...adjacent.map(cell => cell?.top ?? bottom));
    const hi = Math.max(bottom, ...adjacent.map(cell => cell?.bottom ?? top));
    const noise = hash(x,z,1);
    const lawn = Math.sin(.16 * x + .051 * z) + .55 * Math.cos(.25 * z - .27 * x);
    const grassGroup = lawn < -.76 ? mossColors : grassColors;
    const patch = .5 + .24*Math.sin(x*.32-z*.14) + .15*Math.cos(z*.43+x*.21);
    const grass = pick(grassGroup,noise*.44+patch*.56);
    const color = wet ? pick([0x9d9d71,0x8c926a,0x778770,0xa4aa81,0xa6a579], noise) : bank < 1.23 ? shade(grass,-.18) : grass;
    block(x,top-.28,z,1,.56,1,color,'ground');
    if (!wet && noise > .964 && top > 1 && Math.abs(x+11) + Math.abs(z+22) > 12) {
      const tuft = shade(grass,.12);
      block(x-.22,top+.08,z+.09,.105,.19,.11,tuft,'ground');
      block(x-.10,top+.12,z+.15,.08,.28,.08,tuft,'ground');
    }
    const topSide = Math.ceil(top - .56), bottomSide = Math.floor(bottom);
    for (let layer = bottomSide; layer < topSide; layer++) {
      const y = layer + .5;
      if (layer >= hi && y < lo && layer !== bottomSide) continue;
      const roll = hash(x,z,layer);
      const band = Math.floor((y + 34 + Math.sin(x*.17)*1.3 + Math.cos(z*.13)*1.5) / 3.05);
      const rimGrass = y > top - 1.9 && !wet && roll < .32;
      const stone = rimGrass ? pick(mossColors,roll * 3) : shade(cliffColors[((band % 7) + 7) % 7], (roll-.55)*.31 - (y < -18 ? .085 : 0));
      const depth = Math.min(top-.55-y+.5, 1);
      if (depth > .02) block(x, layer+depth*.5, z, 1,depth,1,stone,'ground');
    }
    if (!wet && noise > .966 && adjacent.some(cell => !cell)) {
      for (let r = 0; r < 3; r++) {
        block(x+.16,top-.55-r*.43,z+.22,.23,.47,.27,shade(0x6b5942,-r*.08),'ground');
      }
    }
  }
  // Contiguous transparent strips have no overlapping per-cell faces.
  for (let z = -48; z <= 47; z++) {
    let start = null;
    for (let x = -56; x <= 56; x++) {
      const wet = cellAt(x,z)?.wet ?? false;
      if (wet && start === null) start = x;
      if (!wet && start !== null) {
        block((start+x-1)*.5,waterLevel,z,x-start,.025,.999,0x39bac1,'water');
        start = null;
      }
    }
  }
}

function buildSatellite(cx,cy,cz,rx,rz,variant) {
  for (let z = -rz-1; z <= rz+1; z++) for (let x = -rx-1; x <= rx+1; x++) {
    const a = Math.atan2(z/rz,x/rx);
    const r = Math.hypot(x/rx,z/rz) - .10*Math.sin(a*3+variant) - .074*Math.cos(a*5);
    if (r > 1) continue;
    const hill = r < .38 ? 2 : r < .65 ? 1 : 0;
    block(cx+x,cy+hill-.31,cz+z,1,.62,1,pick(grassColors,hash(x,z,variant)),'ground');
    const depth = Math.ceil((1-r)*Math.min(rx,rz)*1.7 + 1.5);
    for (let d = 1; d <= depth; d++) {
      if (d > 1 && d < depth - 1 && r < .74) continue;
      block(cx+x,cy+hill-d-.1,cz+z,1,1,1,shade(cliffColors[(d+variant)%7], (hash(x,z,d)-.6)*.2),'ground');
    }
    if (hash(x,z,variant+8) > .938) {
      const h = .5 + hash(x,z,variant+3)*1.1;
      block(cx+x,cy+hill+h*.5,cz+z,.3,h,.28,0x65773e,'ground');
      block(cx+x+.20,cy+hill+.25,cz+z-.25,.34,.5,.37,0x83934d,'ground');
    }
  }
  for (const [x,z] of [[-rx*.42,-1],[rx*.37,1.5]]) {
    const h = variant === 1 ? 2.7 : 1.6;
    block(cx+x,cy+2.0,cz+z,1.6,2.0,1.65,0x74796d);
    block(cx+x+.36,cy+3.1,cz+z-.1,.94,h,.99,0x879084);
    block(cx+x+.26,cy+3.1+h*.5,cz+z-.1,1.26,.18,1.22,0x778447);
  }
}

function skyBanks() {
  for (const [cx,cy,cz,len] of [[-95,-14,-54,28],[-76,-26,35,32],[52,-23,-72,30],[88,-20,28,30],[-43,30,-103,31],[40,24,-112,34],[-118,8,-16,20],[120,3,-21,32],[-44,-40,82,30]]) {
    for (let s = 0; s < 13; s++) {
      const x = cx + (random()-.5)*len*1.6;
      const y = cy+(random()-.5)*3.6;
      const z = cz+(random()-.5)*5.3;
      block(x,y,z,6+random()*12,.7+random()*1.25,3+random()*5,pick([0xe8d9c7,0xf2e4d0,0xcbd5ce,0xe2e0cf],random()),'cloud');
    }
  }
}

// Each paved cell gets a single stone, including around path junctions.
const paving = new Set();
function pave(x,z,tread=false) {
  const id=key(x,z);
  if (paving.has(id) || !cellAt(x,z)) return;
  paving.add(id);
  const y=groundAt(x,z);
  const color=pick(pathColors,hash(x,z,5));
  block(x,y+.06,z,tread?.985:.94,.185,tread?.985:.94,color,'ground');
  if (hash(x,z,9)>.90) block(x-.24,y+.157,z+.25,.24,.026,.11,0x7c8554,'ground');
}
function gradePath(points, width) {
  for (let j=1;j<points.length;j++) {
    const a=points[j-1], b=points[j];
    const radius=width*.50;
    const stair=stairways.some(([start,end])=>a===start && b===end);
    for (let z=Math.floor(Math.min(a[2],b[2])-radius);z<=Math.ceil(Math.max(a[2],b[2])+radius);z++) {
      for (let x=Math.floor(Math.min(a[0],b[0])-radius);x<=Math.ceil(Math.max(a[0],b[0])+radius);x++) {
        if (pathSample(x,z,a,b)[0]<radius+.025) pave(x,z,stair);
      }
    }
  }
}
function stoneCourt(cx,cz,rx,rz,y) {
  for (let z = -rz; z <= rz; z++) for (let x = -rx; x <= rx; x++) {
    const r = Math.hypot(x/rx,z/rz);
    if (r > 1 || (r > .86 && hash(x,z) > .72) || Math.abs(y-groundAt(cx+x,cz+z))>.45) continue;
    pave(cx+x,cz+z);
  }
}
function terraceWalls() {
  for (let x = -27; x <= 25; x++) {
    for (const [upper,lower,seek] of [[8.1,4.6,-6],[4.6,1.4,7]]) {
      let z = seek;
      while (z > -19 && groundAt(x,z) < upper-.03) z--;
      if (z <= -19 || (upper < 6 && Math.abs(x+18) < 4) || (upper > 6 && Math.abs(x+9) < 5)) continue;
      for (let y = lower+.34; y < upper-.45; y+=.64) {
        block(x,y,z+.5,.994,.61,.43,pick(cliffColors,hash(x,z,Math.round(y*10))),'solid');
      }
      block(x,upper-.19,z+.55,.99,.37,.66,shade(pick(pathColors,hash(x,z,2)),-.17));
    }
  }
}

function gardenRoute() {
  stoneCourt(-22,36,8,5,1.4);
  gradePath([[-24,1.4,42],[-22,1.4,36],[-13,1.4,35],[-11,1.4,34]],4);
  gradePath([[-11,1.4,9],[-15,1.4,8],...lowerStairs,[-12,4.6,-1.1],...upperStairs],4);
  stoneCourt(-11,-8,12,3,pagodaY);
  gradePath([[-11,8.1,-8],[2,8.1,-9],[10,8.1,-15],[23,8.1,-19],[34,8.1,-17],[39,8.1,-17]],3);
  stoneCourt(38,-17,5,4,groundAt(38,-17));
  gradePath([[-17,1.4,7],[-4,1.4,5],[6,1.4,7],[11,1.4,11],[15,1.4,12]],2);
  terraceWalls();
}

function putRock(x,y,z,s,seedValue) {
  for (let i = 0; i < 5; i++) {
    const offX = (hash(x,z,seedValue+i)-.48)*s;
    const offZ = (hash(z,x,seedValue+i)-.5)*s;
    const h = s*(.27+hash(x,z,i)*.49);
    const color = pick([0x7c8581,0x6a7974,0x91948b,0x8b9181,0x707d78],hash(x,z,i+13));
    block(x+offX,y+h*.28,z+offZ,s*(.38+.24*hash(x,z,i)),h,s*.54,color);
  }
}
function quietGrove() {
  const x=39,z=-19;
  const y=groundAt(x,z);
  for (const dx of [-1.57,1.57]) {
    block(x+dx,y+.37,z,.51,.78,.64,0x707a71);
    block(x+dx,y+.79,z-.36,.26,.86,.29,0x815037);
  }

function buildPagoda(x, baseY, z) {
  const dark = '#3b2217';
  const teak = '#603421';
  const red = '#b52e1a';
  const vermilion = '#c73e1d';
  const scarlet = '#e05226';
  const gold = '#e8b86d';
  const brass = '#9b6638';
  const pale = '#efd4a0';
  const jade = ['#275647', '#2d6a4f', '#32745a', '#3b8062', '#40916c', '#37795d'];
  const stone = ['#77818a', '#858c91', '#9aa0a6', '#949798', '#a7a8a2', '#82898a'];
  const floorWidths = [12.4, 10.7, 9.2, 7.7, 6.4];
  const floorPitches = [4.75, 4.54, 4.33, 4.14, 3.97];
  const wallHeights = [2.65, 2.53, 2.45, 2.34, 2.23];
  const sides = [[1, 0], [0, 1], [-1, 0], [0, -1]];
  const doorGeometry = new THREE.BoxGeometry();
  const doorMaterial = new THREE.MeshStandardMaterial({roughness: 0.79});
  const pickMaterial = new THREE.MeshBasicMaterial({visible: false});

  function piece(u, v, w, du, dv, dw, color, batch) {
    block(x + u, baseY + v, z + w, du, dv, dw, color, batch);
  }

  function face(side, u, v, r, du, dv, dr, color, batch) {
    const [a, b] = sides[side];
    piece(a*u + b*r, v, a*r - b*u, a ? du : dr, dv, a ? dr : du, color, batch);
  }

  let courseY = 0;
  for (const [width, height, units] of [[22.8,0.44,19],[22.0,0.47,18],[20.3,0.73,19],[19.9,0.46,18]]) {
    const middle = courseY + height/2;
    piece(0,middle,0,width-0.10,height,width-0.10,'#59636a');
    const pitch = width / units;
    for (let side=0; side<4; side++) {
      for (let i=0; i<units; i++) {
        const corner = side%2 && (i === 0 || i === units-1);
        const u = -width/2 + (i + 0.5)*pitch;
        const shift = corner ? -Math.sign(u)*0.09 : 0;
        const relief = (i*7+side*3+units)%5;
        face(side,u+shift,middle,width/2,pitch-(corner ? 0.20 : 0.026),height-0.03,0.16,
          stone[(i + side*3 + units + relief)%stone.length]);
        if (height > 0.7 && relief === 0) {
          face(side,u-0.13,middle-height*0.30,width/2+0.08,pitch*0.47,0.08,0.04,'#637044');
        }
      }
    }
    courseY += height;
  }

  const tiles = 20;
  const tileWidth = 19.72/tiles;
  for (let i=0; i<tiles; i++) {
    for (let j=0; j<tiles; j++) {
      const u = (i+0.5-tiles/2)*tileWidth;
      const w = (j+0.5-tiles/2)*tileWidth;
      if (Math.max(Math.abs(u),Math.abs(w)) < 6.65) continue;
      const rim = Math.max(Math.abs(u),Math.abs(w)) > 8.8;
      piece(u,2.12,w,tileWidth-0.022,0.085,tileWidth-0.022,
        rim ? stone[(i*3+j*5)%stone.length] : ['#aaa89a','#b7ad99','#c5b79d','#a5a499'][((i*7)^(j*5))%4]);
    }
  }

  const steps = 9;
  const stepRun = 6.6/steps;
  for (let step=0; step<steps; step++) {
    const height = (step+1)*(2.15/steps);
    const w = 15.8-(step+0.5)*stepRun;
    piece(0,height/2,w,5.10,height,stepRun+0.002,'#737d83');
    for (let stoneIndex=0; stoneIndex<6; stoneIndex++) {
      piece((stoneIndex-2.5)*0.83,height-0.04,w,0.808,0.09,stepRun-0.01,
        stone[(step*3+stoneIndex*5)%stone.length]);
    }
    for (const side of [-1,1]) {
      piece(side*2.76,(height+0.30)/2,w,0.43,height+0.30,stepRun+0.004,'#7b8588');
      piece(side*2.76,height+0.32,w,0.57,0.13,stepRun+0.015,'#a7a8a2');
    }
  }

  let floorY = 2.16;
  for (let tier=0; tier<5; tier++) {
    const half = floorWidths[tier]/2;
    const height = wallHeights[tier];
    const pitch = floorPitches[tier];
    const nextHalf = tier < 4 ? floorWidths[tier+1]/2 : 0;
    const deck = half + (tier ? 0.81 : 0.41);
    const outer = half+2.29-tier*0.105;
    const inner = nextHalf+(tier < 4 ? 0.57 : 0.56);
    const roofY = floorY + height + 0.20;
    const rise = pitch - height - 0.32;
    const roofBase = floorY + height;

    piece(0,floorY+0.08,0,deck*2,0.21,deck*2,dark);
    piece(0,floorY+0.23,0,deck*2-0.13,0.13,deck*2-0.13,teak);
    piece(0,floorY+height-0.15,0,half*2+0.50,0.29,half*2+0.50,dark);
    piece(0,floorY+height+rise*0.42,0,inner*2-0.04,rise+0.20,inner*2-0.04,'#364630');
    piece(0,floorY+pitch-0.25,0,inner*2+0.02,0.45,inner*2+0.02,'#345544');

      scene.add(pivot);
      const movingCrown = new THREE.Group();
      movingCrown.position.y = 3.8 * scale;
      pivot.add(movingCrown);

      for (const [i, clump] of crown.entries()) {
        const shape = clump.slice();
        shape[0] += (noise(variant, i, 1) - 0.5) * 0.55;
        shape[1] += (noise(variant, i, 2) - 0.5) * 0.45;
        shape[2] += (noise(variant, i, 3) - 0.5) * 0.52;
        addClump(cells, step, shape, variant);
      }
      if (name === 'willow') addWillowStems(cells, step);
      const leaves = [...cells.values()].filter(([lx, ly, lz]) => exposed(cells, lx, ly, lz));
      const canopy = new THREE.InstancedMesh(canopyGeometry, leafMaterial, leaves.length);
      canopy.castShadow = true;
      canopy.receiveShadow = true;
      for (const [i, [lx, ly, lz]] of leaves.entries()) {
        const overhead = cells.has(`${lx},${ly + 1},${lz}`);
        const underfoot = cells.has(`${lx},${ly - 1},${lz}`);
        const h = noise(lx + variant * 31 + 132, ly, lz);
        const tint = overhead ? 1 + Math.floor(h * 3) : 2 + Math.floor(h * 4);
        const pigment = !underfoot && overhead && h < 0.37 ? 0 : tint;
        dummy.position.set(lx * step * scale, (ly * step - 3.8) * scale, lz * step * scale);
        dummy.rotation.set(0, 0, 0);
        dummy.scale.setScalar(step * scale * 0.996);
        dummy.updateMatrix();
        canopy.setMatrixAt(i, dummy.matrix);
        canopy.setColorAt(i, color.setHex(palette[pigment]));
      }
      movingCrown.add(canopy);
      foliage.push({ object: movingCrown, strength: name === 'willow' ? 1.6 : 1, phase: variant * 0.86 });
      dynamicVoxelCount += leaves.length;

      const roots = [];
      for (let root = 0; root < 4; root++) {
        const angle = root * Math.PI / 2 + 0.45;
        roots.push([0.33, 0.1, [[0, 0.64, 0], [0.61 * Math.cos(angle), 0.13, 0.61 * Math.sin(angle)], [1.28 * Math.cos(angle), -0.06, 1.28 * Math.sin(angle)]]]);
      }
      const azimuthX = Math.cos(rotation);
      const azimuthZ = Math.sin(rotation);
      for (const [bx, by, bz] of drawWood([...model.boughs, ...roots])) {
        const horizontalX = (bx * azimuthX + bz * azimuthZ) * woodStep * scale;
        const horizontalZ = (bz * azimuthX - bx * azimuthZ) * woodStep * scale;
        const barkTone = shade(model.bark, (noise(bx * 2, Math.floor(by * woodStep), bz * 2) - 0.5) * 0.38);
        wood.push([x + horizontalX, y + by * woodStep * scale, z + horizontalZ, woodStep * scale, rotation, barkTone]);
      }
      if (name === 'sakura') {
        for (let i = 0; i < 46; i++) {
          const angle = random() * Math.PI * 2;
          const radius = (1.8 + random() * 2.45) * scale;
          fallenPetals.push({
            x: x + Math.cos(angle) * radius, z: z + Math.sin(angle) * radius,
            y: y + (5.25 + random() * 1.25) * scale,
            fall: (4 + random() * 1.3) * scale, phase: random(), period: 6 + random() * 6,
            angle, size: 0.09 + random() * 0.09,
          });
        }
      }
    }

    const trunks = new THREE.InstancedMesh(canopyGeometry, woodMaterial, wood.length);
    trunks.castShadow = true;
    trunks.receiveShadow = true;
    for (const [i, [x, y, z, size, angle, tint]] of wood.entries()) {
      dummy.position.set(x, y, z);
      dummy.rotation.set(0, angle, 0);
      dummy.scale.setScalar(size * 0.996);
      dummy.updateMatrix();
      trunks.setMatrixAt(i, dummy.matrix);
      trunks.setColorAt(i, typeof tint === 'number' ? color.setHex(tint) : color.set(tint));
    }
    scene.add(trunks);
    dynamicVoxelCount += wood.length;

    petalMesh = new THREE.InstancedMesh(canopyGeometry, new THREE.MeshStandardMaterial({ roughness: 0.95 }), fallenPetals.length);
    petalMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    petalMesh.frustumCulled = false;
    for (let i = 0; i < fallenPetals.length; i++) {
      petalMesh.setColorAt(i, color.setHex(species.sakura.palette[3 + i % 3]));
    }
    scene.add(petalMesh);
    dynamicVoxelCount += fallenPetals.length;
  }

  function buildFlowers(flowerBeds) {
    const blooms = [[0xf4a5a7, 0xffddd3], [0xe7ba63, 0xf9dfa0], [0x9278ad, 0xd5b8e2], [0xdf7a67, 0xffbe90]];
    for (const [bed, [cx, y, cz, count, radius]] of flowerBeds.entries()) {
      for (let i = 0; i < count; i++) {
        const angle = i * 2.39996323 + 0.57 * bed;
        const offset = radius * Math.sqrt((i + 0.2) / count) * (0.75 + random() * 0.24);
        const x = cx + Math.cos(angle) * offset;
        const z = cz + Math.sin(angle) * offset;
        const h = 0.42 + random() * 0.46;
        const [petal, accent] = blooms[(bed + (i % 4 === 0 ? 1 : 0)) % blooms.length];
        const width = 0.13 + random() * 0.08;
        block(x, y + h / 2, z, 0.082, h, 0.075, 0x536c41);
        block(x - 0.115, y + h * 0.39, z, 0.17, 0.085, 0.105, 0x7e9a59);
        block(x + 0.115, y + h * 0.55, z, 0.17, 0.085, 0.105, 0x627f48);
        block(x - width, y + h, z, width, 0.136, width, petal);
        block(x + width, y + h + 0.021, z, width, 0.114, width, petal);
        block(x, y + h - 0.014, z - width, width, 0.13, width, petal);
        block(x, y + h + 0.028, z + width, width, 0.145, width, petal);
        block(x, y + h + 0.025, z, width, 0.147, width, accent);
      }
    }
  }

  function animate(elapsed) {
    for (const { object, strength, phase } of foliage) {
      object.rotation.x = Math.sin(elapsed * 0.72 + phase) * 0.017 * strength;
      object.rotation.z = Math.sin(elapsed * 0.56 + phase + 0.6) * 0.023 * strength;
    }
    if (!petalMesh) return;
    for (const [i, petal] of fallenPetals.entries()) {
      const { phase, period, size, x, y, z, fall, angle } = petal;
      const t = (elapsed / period + phase) % 1;
      const swirl = t * 11 + angle;
      const flutter = Math.min(1, t * 13, (1 - t) * 11);
      dummy.position.set(x + t * 1.25 + Math.sin(swirl) * 0.32, y - t * fall, z + Math.cos(swirl) * 0.37);
      dummy.rotation.set(swirl * 1.4, angle + elapsed * 0.73, swirl * 0.83);
      dummy.scale.set(size * flutter, 0.032 * flutter, size * 0.83 * flutter);
      dummy.updateMatrix();
      petalMesh.setMatrixAt(i, dummy.matrix);
    }
    petalMesh.instanceMatrix.needsUpdate = true;
  }

  return { buildTrees, buildFlowers, animate };
})();

function buildVegetation(plantings, flowerBeds) {
  vegetation.buildTrees(plantings);
  vegetation.buildFlowers(flowerBeds);
  vegetation.animate(0);
}

function animateVegetation(elapsedSeconds) {
  vegetation.animate(elapsedSeconds);
}


buildTerrain();
buildSatellite(-65,-5,25,10,7,1);
buildSatellite(41,12,-62,12,8,5);
skyBanks();
gardenRoute();
details();
buildPagoda(pagodaX,pagodaY,pagodaZ);
buildTorii(-22,1.4,37);
bambooFence(-31,39,-26,39);
bambooFence(-18,39,-12,39);
bambooFence(-31,38,-31,34);
bambooFence(36,-19,44,-19);
jizo(-26.3,34.4);
jizo(-18.6,35.0);
bridge();
for (const [x,z] of [[-16,35],[-6,9],[-18,-10],[33,-15]]) gardenLantern(x,z);
const plantings = [
  ['sakura',-33,25,1.02,.2],['sakura',23,13,1.13,1.37],['sakura',3,-27,1.0,2.7],
  ['pine',-35,-22,1.18,1.8],['pine',23,-30,1.27,.7],
  ['maple',-25,8,.95,2],['maple',35,-14,1.07,.2],['willow',19,31,1.01,.6]
].map(([species,x,z,scale,turn]) => [species,x,groundAt(x,z),z,scale,turn]);
const flowerBeds = [
  [-27,34,7,1.5],[-13,38,5,1.5],[-17,20,5,1.3],[6,33,5,1.6],
  [25,12,5,1.7],[-27,-14,5,1.7],[13,-18,4,1.6],[39,-17,4,1.25]
].map(([x,z,count,radius]) => [x,groundAt(x,z),z,count,radius]);
buildVegetation(plantings,flowerBeds);
buildWaterLife();
buildBirds();
const voxelCount = flushBlocks()+dynamicVoxelCount;

const slider = document.getElementById('time');
const pause = document.getElementById('pause');
const clockTime = document.getElementById('clock-time');
const stats = document.getElementById('stats');
const loading = document.getElementById('loading');
let timeOfDay = .358, paused = false;
function setPaused(value) {
  paused=value;
  pause.textContent=paused ? '▶' : 'Ⅱ';
  const label=paused ? 'Play daylight cycle' : 'Pause daylight cycle';
  pause.setAttribute('aria-label',label);
  pause.title=label;
}
pause.addEventListener('click',()=>setPaused(!paused));
slider.addEventListener('input',()=>{timeOfDay=Number(slider.value)/1440;setPaused(true);});

const morning = new THREE.Color(0x9bb7bd), blue = new THREE.Color(0x72a7b7), twilight = new THREE.Color(0x3d5275), midnight = new THREE.Color(0x182541);
const warmHorizon = new THREE.Color(0xf2c6a3), paleHorizon = new THREE.Color(0xe9dbbf), nightHorizon = new THREE.Color(0x53647d), duskHorizon = new THREE.Color(0xe4a894);
const sunlight = new THREE.Color(0xfff1d9), sunset = new THREE.Color(0xffa46d), moonlight = new THREE.Color(0x91b6f5);
const blend = (a,b,x) => THREE.MathUtils.smoothstep(x,a,b);
function lightCycle(t) {
  const elevation = Math.sin((timeOfDay-.25)*Math.PI*2);
  const daylight = blend(-.19,.37,elevation);
  const warm = (1-blend(.12,.66,elevation))*blend(-.30,-.05,elevation);
  const setting = timeOfDay > .5;
  const angle = (timeOfDay-.25)*Math.PI*2;
  sun.position.set(Math.cos(angle)*99, Math.max(-.22,elevation)*89+13, 57+Math.sin(angle)*34);
  sun.color.copy(moonlight).lerp(workingColor.copy(sunlight).lerp(sunset,warm),daylight);
  sun.intensity = .33 + daylight*2.87;
  hemisphere.color.set(0x8aa3d4).lerp(workingColor.set(0xffeee4),daylight);
  hemisphere.groundColor.set(0x6e7082).lerp(workingColor.set(0xb3a38d),daylight);
  hemisphere.intensity = .77+.81*daylight;
  sky.material.uniforms.zenith.value.copy(midnight).lerp(twilight,warm*.77).lerp(setting?blue:morning,daylight);
  sky.material.uniforms.horizon.value.copy(nightHorizon).lerp(setting?duskHorizon:warmHorizon,warm).lerp(paleHorizon,daylight*(1-warm*.7));
  sky.material.uniforms.below.value.set(0x263854).lerp(workingColor.set(0x9dbdc0),daylight).lerp(workingColor.set(0xca9d9d),warm*.26);
  sky.material.uniforms.sunDir.value.copy(sun.position).normalize();
  sky.material.uniforms.sunGlow.value=blend(-.16,.02,elevation);
  sky.material.uniforms.night.value=1-daylight;
  scene.fog.color.copy(sky.material.uniforms.horizon.value);
  for (const state of lanterns) {
    const active=state.manual ?? elevation<.20;
    const flicker=.89+.095*Math.sin(t*12+state.phase)+.04*Math.sin(t*27+state.phase*2);
    state.active=active;
    state.lamp.intensity=active?54*flicker:0;
    state.lens.material.emissiveIntensity=active?1.08*flicker:.04;
    state.lens.material.color.set(active?0xffd591:0xaf9e73);
  }
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let press, interactive=false, lastControl=0;
const canvas=renderer.domElement;
function hitAt(e) {
  const rect=canvas.getBoundingClientRect();
  pointer.set((e.clientX-rect.left)/rect.width*2-1,1-(e.clientY-rect.top)/rect.height*2);
  raycaster.setFromCamera(pointer,camera);
  return raycaster.intersectObjects(interactions,false)[0]?.object;
}
canvas.addEventListener('pointerdown',e=>{press=[e.clientX,e.clientY];});
canvas.addEventListener('pointerup',e=>{
  if (interactive && press && Math.hypot(e.clientX-press[0],e.clientY-press[1])<5) hitAt(e)?.userData.action();
  press=null;
});
canvas.addEventListener('pointercancel',()=>{press=null;});
canvas.addEventListener('pointermove',e=>{
  if (interactive && !e.buttons) canvas.style.cursor = hitAt(e) ? 'pointer' : 'grab';
  else canvas.style.cursor='grabbing';
});
let manipulating=false;
controls.addEventListener('start',()=>{manipulating=true;lastControl=performance.now();});
controls.addEventListener('end',()=>{manipulating=false;lastControl=performance.now();});

const introOrigin = new THREE.Vector3(-9,12,51);
const introTarget = new THREE.Vector3(-20,5,32);
const overviewTarget = new THREE.Vector3(0,4,-1);
const overview = new THREE.Vector3(105,64,119);
const origin = performance.now();
function fit() {
  camera.aspect=innerWidth/Math.max(1,innerHeight);
  camera.fov= camera.aspect<1 ? Math.min(78,37/camera.aspect) : 37;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
}
fit();
addEventListener('resize',fit);
camera.position.copy(introOrigin);
controls.target.copy(introTarget);
controls.enabled=false;
controls.update();
window.__VOXEL__={voxelCount,fps:0,pagodaFloors:5,timeOfDay};
let prev = origin, hudAt = origin, frames = 0, shadowTime=-1;
renderer.shadowMap.autoUpdate=false;
function animate(now) {
  requestAnimationFrame(animate);
  const t=(now-origin)*.001;
  const elapsed=Math.max(0,(now-prev)*.001);
  const delta=Math.min(elapsed,.085);
  prev=now;
  if (!paused) timeOfDay=(timeOfDay+elapsed/90)%1;
  if (!interactive) {
    const progress=clamp(t/2.5,0,1);
    const f=1-Math.pow(1-progress,3);
    camera.position.lerpVectors(introOrigin,overview,f);
    controls.target.lerpVectors(introTarget,overviewTarget,f);
    if (progress>=1) { interactive=true; controls.enabled=true; lastControl=now; }
  }
  controls.autoRotate=interactive && !manipulating && now-lastControl>3700;
  controls.update(delta);
  sky.position.copy(camera.position);
  lightCycle(t);
  animateWater(t);
  animateBirds(t);
  animateVegetation(t);
  for (const update of doors) update(delta);
  if (t-shadowTime>.25) { renderer.shadowMap.needsUpdate=true; shadowTime=t; }
  renderer.render(scene,camera);
  if (loading.isConnected) loading.remove();
  frames++;
  window.__VOXEL__.timeOfDay=timeOfDay;
  if (now-hudAt>=400) {
    const fps=Math.round(frames*1000/(now-hudAt));
    const minutes=Math.floor(timeOfDay*1440);
    slider.value=minutes;
    clockTime.value=`${String(Math.floor(minutes/60)).padStart(2,'0')}:${String(minutes%60).padStart(2,'0')}`;
    window.__VOXEL__.fps=fps;
    stats.textContent=`${(voxelCount/1000).toFixed(1)}k voxels | ${fps} FPS`;
    frames=0;
    hudAt=now;
  }
}
requestAnimationFrame(animate);
</script>
