<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aether 65 · Mechanical Keyboard Showcase</title>
<style>
  :root{
    --u: 52px;                 /* 1 unit */
    --gap: 4px;                /* gap between keycaps */
    --case-pad: 18px;          /* padding inside case */
    --case-color-1: #2a2d33;
    --case-color-2: #1a1c21;
    --case-color-3: #3a3d44;
    --case-side:   #15161a;
    --cap-mod:     #e9e4d6;   /* cream */
    --cap-mod-top: #f4efe1;
    --cap-mod-side:#c7c1b0;
    --cap-acc:     #1f2126;   /* dark alpha */
    --cap-acc-top: #2b2d33;
    --cap-acc-side:#121317;
    --cap-pop:     #ff7a3d;   /* accent orange */
    --cap-pop-top: #ff9560;
    --cap-pop-side:#c8541f;
    --plate: #4a4d55;
    --plate-side:#2e3036;
    --foam: #2b2d33;
    --pcb:  #14312a;
    --pcb-side: #0a1a15;
    --switch-top:#f4efe1;
    --switch-side:#c7c1b0;
    --switch-stem:#ff7a3d;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;color:#e9ecef;background:#0a0b0e}
  body{
    background:
      radial-gradient(ellipse at 30% 10%, rgba(255,122,61,.08), transparent 60%),
      radial-gradient(ellipse at 70% 90%, rgba(90,140,255,.08), transparent 60%),
      linear-gradient(180deg, #0b0d12 0%, #06070a 100%);
    user-select:none;
  }

  /* ---------- UI chrome ---------- */
  header{
    position:fixed;top:0;left:0;right:0;z-index:20;
    display:flex;justify-content:space-between;align-items:center;
    padding:18px 26px;
    pointer-events:none;
  }
  header > *{pointer-events:auto}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.14em;font-size:13px;text-transform:uppercase;color:#cfd3db}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--cap-pop);box-shadow:0 0 14px var(--cap-pop)}
  .brand small{color:#6c7280;font-weight:400;letter-spacing:.1em;margin-left:6px}

  .controls{display:flex;gap:8px;flex-wrap:wrap}
  .btn{
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    color:#cfd3db;
    padding:9px 14px;
    border-radius:999px;
    font-size:12px;
    letter-spacing:.06em;
    cursor:pointer;
    transition:background .2s, border-color .2s, transform .15s;
    display:inline-flex;align-items:center;gap:8px;
    backdrop-filter: blur(8px);
  }
  .btn:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15)}
  .btn:active{transform:scale(.97)}
  .btn.active{background:rgba(255,122,61,.14);border-color:rgba(255,122,61,.4);color:#ffd9c2}
  .btn svg{width:14px;height:14px}

  footer{
    position:fixed;bottom:0;left:0;right:0;z-index:20;
    padding:16px 26px;display:flex;justify-content:space-between;align-items:center;
    font-size:11px;color:#6c7280;letter-spacing:.08em;
    pointer-events:none;
  }
  footer .hint{
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.06);
    padding:8px 12px;border-radius:999px;
    backdrop-filter:blur(6px);
    pointer-events:auto;
  }
  .hint b{color:#cfd3db;font-weight:500}
  .hint kbd{
    display:inline-block;padding:1px 6px;margin:0 2px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);
    border-radius:4px;font-family:inherit;font-size:10px;color:#cfd3db;
  }

  /* ---------- Stage ---------- */
  .stage{
    position:absolute;inset:0;
    perspective: 2200px;
    perspective-origin: 50% 40%;
    cursor:grab;
  }
  .stage:active{cursor:grabbing}
  .stage.disabled{cursor:default}

  .stage-inner{
    position:absolute;left:50%;top:50%;
    transform-style:preserve-3d;
    transform: translate(-50%,-50%) rotateX(28deg) rotateZ(-18deg) rotateY(0deg);
    transition: transform .15s linear;
    will-change: transform;
  }

  /* Ground shadow under keyboard */
  .shadow{
    position:absolute;left:50%;top:50%;
    width: 820px; height: 320px;
    transform: translate(-50%,-50%) translateZ(-60px) rotateX(90deg);
    background: radial-gradient(ellipse at center, rgba(0,0,0,.55), rgba(0,0,0,0) 65%);
    filter: blur(8px);
    pointer-events:none;
  }

  /* ---------- Keyboard structure ---------- */
  .keyboard{
    position:relative;
    transform-style:preserve-3d;
    width: calc(15 * var(--u) + 14 * var(--gap) + 2 * var(--case-pad));
    height: calc(5 * var(--u) + 4 * var(--gap) + 2 * var(--case-pad));
  }

  /* Case (the outer housing) */
  .case{
    position:absolute;inset:0;
    transform-style:preserve-3d;
  }
  .case .face{position:absolute;background:var(--case-color-1)}
  .case .top{
    inset:0;
    transform: translateZ(10px);
    background: linear-gradient(145deg, var(--case-color-3), var(--case-color-1) 40%, var(--case-color-2));
    border-radius:14px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.06), inset 0 2px 0 rgba(255,255,255,.05);
  }
  .case .bottom{
    inset:0;
    transform: translateZ(-14px) rotateX(180deg);
    background: var(--case-side);
    border-radius:14px;
  }
  /* Case sides (extruded walls) */
  .case .side{position:absolute;background:var(--case-side)}
  .case .side.front, .case .side.back{
    left:0;right:0;height:24px;
  }
  .case .side.front{
    bottom:0;
    transform-origin: center bottom;
    transform: rotateX(-90deg);
    background: linear-gradient(180deg, var(--case-color-2), #0e0f13);
    border-radius: 0 0 14px 14px;
  }
  .case .side.back{
    top:0;
    transform-origin: center top;
    transform: rotateX(90deg);
    background: linear-gradient(0deg, var(--case-color-2), #0e0f13);
    border-radius: 14px 14px 0 0;
  }
  .case .side.left, .case .side.right{
    top:0;bottom:0;width:24px;
  }
  .case .side.left{
    left:0;
    transform-origin: left center;
    transform: rotateY(90deg);
    background: linear-gradient(90deg, #0e0f13, var(--case-color-2));
    border-radius: 14px 0 0 14px;
  }
  .case .side.right{
    right:0;
    transform-origin: right center;
    transform: rotateY(-90deg);
    background: linear-gradient(270deg, #0e0f13, var(--case-color-2));
    border-radius: 0 14px 14px 0;
  }

  /* Underglow RGB strip */
  .underglow{
    position:absolute;inset:-6px;
    transform: translateZ(-13px);
    border-radius:18px;
    pointer-events:none;
    opacity:0; transition: opacity .5s;
    box-shadow:
      0 0 40px 4px rgba(120,180,255,.35),
      0 0 80px 14px rgba(255,120,200,.25),
      inset 0 0 30px rgba(120,180,255,.35);
    animation: glowShift 6s linear infinite;
  }
  .underglow.on{opacity:.85}
  @keyframes glowShift{
    0%  { filter: hue-rotate(0deg) }
    100%{ filter: hue-rotate(360deg) }
  }

  /* Inner deck (where the plate sits, recessed) */
  .deck{
    position:absolute;
    left:var(--case-pad);top:var(--case-pad);right:var(--case-pad);bottom:var(--case-pad);
    transform: translateZ(5px);
    background: #05060a;
    border-radius:6px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.8);
  }

  /* Layers: PCB, foam, plate - each a 3D slab */
  .layer{
    position:absolute;
    left:var(--case-pad);top:var(--case-pad);
    width: calc(100% - 2 * var(--case-pad));
    height: calc(100% - 2 * var(--case-pad));
    transform-style:preserve-3d;
    transition: transform .9s cubic-bezier(.2,.7,.2,1), opacity .5s;
  }
  .layer .face{position:absolute}
  /* PCB - sits inside the case deck */
  .layer.pcb{
    transform: translateZ(13px) translateY(-260px);
    opacity:0;
  }
  .layer.pcb.in{ transform: translateZ(13px); opacity:1 }
  .layer.pcb .top{
    inset:0;
    background:
      radial-gradient(circle at 20% 30%, rgba(255,215,120,.25), transparent 8%),
      radial-gradient(circle at 55% 70%, rgba(255,215,120,.25), transparent 6%),
      radial-gradient(circle at 80% 40%, rgba(255,215,120,.25), transparent 7%),
      radial-gradient(circle at 35% 80%, rgba(255,215,120,.18), transparent 5%),
      radial-gradient(circle at 65% 20%, rgba(255,215,120,.18), transparent 5%),
      linear-gradient(135deg, var(--pcb), #0e241d);
    border-radius:3px;
    box-shadow: inset 0 0 0 1px rgba(255,215,120,.15);
  }
  .layer.pcb .side{background: var(--pcb-side)}
  .layer.pcb .front, .layer.pcb .back{ left:0;right:0;height:3px }
  .layer.pcb .front{ bottom:0; transform-origin: center bottom; transform: rotateX(-90deg); }
  .layer.pcb .back { top:0;    transform-origin: center top;    transform: rotateX(90deg); }
  .layer.pcb .left, .layer.pcb .right{ top:0;bottom:0;width:3px }
  .layer.pcb .left { left:0;  transform-origin: left center;  transform: rotateY(90deg); }
  .layer.pcb .right{ right:0; transform-origin: right center; transform: rotateY(-90deg); }

  /* Foam - on top of PCB */
  .layer.foam{
    transform: translateZ(16px) translateY(-260px);
    opacity:0;
  }
  .layer.foam.in{ transform: translateZ(16px); opacity:1 }
  .layer.foam .top{
    inset:0;
    background: repeating-linear-gradient(45deg, #2a2c31 0 6px, #232529 6px 12px);
    border-radius:3px;
  }
  .layer.foam .side{background:#121316}
  .layer.foam .front, .layer.foam .back{ left:0;right:0;height:3px }
  .layer.foam .front{ bottom:0; transform-origin: center bottom; transform: rotateX(-90deg); }
  .layer.foam .back { top:0;    transform-origin: center top;    transform: rotateX(90deg); }
  .layer.foam .left, .layer.foam .right{ top:0;bottom:0;width:3px }
  .layer.foam .left { left:0;  transform-origin: left center;  transform: rotateY(90deg); }
  .layer.foam .right{ right:0; transform-origin: right center; transform: rotateY(-90deg); }

  /* Plate - on top of foam */
  .layer.plate{
    transform: translateZ(18px) translateY(-260px);
    opacity:0;
  }
  .layer.plate.in{ transform: translateZ(18px); opacity:1 }
  .layer.plate .top{
    inset:0;
    background: linear-gradient(140deg, #5a5e67, #3a3d44 50%, #2e3036);
    border-radius:3px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
  }
  .layer.plate .side{background:var(--plate-side)}
  .layer.plate .front, .layer.plate .back{ left:0;right:0;height:2px }
  .layer.plate .front{ bottom:0; transform-origin: center bottom; transform: rotateX(-90deg); }
  .layer.plate .back { top:0;    transform-origin: center top;    transform: rotateX(90deg); }
  .layer.plate .left, .layer.plate .right{ top:0;bottom:0;width:2px }
  .layer.plate .left { left:0;  transform-origin: left center;  transform: rotateY(90deg); }
  .layer.plate .right{ right:0; transform-origin: right center; transform: rotateY(-90deg); }

  /* Plate cutouts are painted via key slots below */
  .slots{ position:absolute;inset:0;pointer-events:none;transform:translateZ(0.5px) }
  .slot{
    position:absolute;
    background: #050608;
    border-radius:2px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.8), inset 0 1px 2px rgba(0,0,0,.9);
  }

  /* Switches layer */
  .switches{
    position:absolute;
    left:var(--case-pad);top:var(--case-pad);
    width: calc(100% - 2 * var(--case-pad));
    height: calc(100% - 2 * var(--case-pad));
    transform-style:preserve-3d;
  }
  .switch{
    position:absolute;
    transform-style:preserve-3d;
    transform: translateZ(28px) translateY(-260px);
    opacity:0;
    transition: transform .5s cubic-bezier(.2,.7,.2,1), opacity .3s;
  }
  .switch.in{ transform: translateZ(28px); opacity:1 }
  .switch .top{
    position:absolute;
    inset: calc(var(--gap) / 2);
    background: linear-gradient(140deg, #f6f1e3, #e2dcc8);
    border-radius:2px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.12);
  }
  .switch .stem{
    position:absolute;
    left:50%; top:50%;
    width:8px; height:8px;
    background: var(--switch-stem);
    transform: translate(-50%,-50%) translateZ(3px);
    border-radius:1px;
    box-shadow: 0 0 0 1px rgba(0,0,0,.3), 0 2px 0 rgba(0,0,0,.2);
  }
  .switch .side{position:absolute;background:var(--switch-side)}
  .switch .front, .switch .back{ left: calc(var(--gap) / 2); right: calc(var(--gap) / 2); height:10px }
  .switch .front{ bottom: calc(var(--gap) / 2); transform-origin: center bottom; transform: rotateX(-90deg); }
  .switch .back { top: calc(var(--gap) / 2);    transform-origin: center top;    transform: rotateX(90deg); }
  .switch .left, .switch .right{ top: calc(var(--gap) / 2); bottom: calc(var(--gap) / 2); width:10px }
  .switch .left { left: calc(var(--gap) / 2);  transform-origin: left center;  transform: rotateY(90deg); }
  .switch .right{ right: calc(var(--gap) / 2); transform-origin: right center; transform: rotateY(-90deg); }

  /* Keycaps */
  .keycaps{
    position:absolute;
    left:var(--case-pad);top:var(--case-pad);
    width: calc(100% - 2 * var(--case-pad));
    height: calc(100% - 2 * var(--case-pad));
    transform-style:preserve-3d;
  }
  .key{
    position:absolute;
    transform-style:preserve-3d;
    transform: translateZ(38px) translateY(-260px);
    opacity:0;
    transition: transform .5s cubic-bezier(.2,.7,.2,1), opacity .3s;
    cursor:pointer;
  }
  .key.in{ transform: translateZ(38px); opacity:1 }
  .key.pressed .cap-body{ transform: translateZ(-2px) }
  .key.pressed{ filter: brightness(0.92) }

  .cap-body{
    position:absolute;inset:0;
    transform-style:preserve-3d;
    transition: transform .08s cubic-bezier(.3,.8,.4,1);
  }

  /* Keycap shape: base skirt + smaller top (SA-ish profile) */
  .cap-skirt{
    position:absolute; inset:0;
    transform-style:preserve-3d;
  }
  .cap-skirt .top{
    position:absolute;inset:0;
    background: var(--cap-top, var(--cap-mod-top));
    border-radius:4px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.1), inset 0 2px 4px rgba(255,255,255,.06);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;
    color: rgba(0,0,0,.7);
    font-weight:600;
    letter-spacing:.02em;
  }
  .cap-skirt .top .legend{
    transform: translateZ(0.1px);
    text-shadow: 0 1px 0 rgba(255,255,255,.3);
    pointer-events:none;
  }
  .cap-skirt .top .legend.side-legend{
    position:absolute;left:6px;top:6px;right:auto;bottom:auto;font-size:9px;font-weight:500;
  }
  .cap-skirt .side{ position:absolute; background: var(--cap-side, var(--cap-mod-side)) }
  .cap-skirt .front, .cap-skirt .back{ left:0;right:0;height:10px }
  .cap-skirt .front{ bottom:0; transform-origin: center bottom; transform: rotateX(-90deg);
    background: linear-gradient(180deg, var(--cap-side, var(--cap-mod-side)), rgba(0,0,0,.45)); }
  .cap-skirt .back { top:0;    transform-origin: center top;    transform: rotateX(90deg); }
  .cap-skirt .left, .cap-skirt .right{ top:0;bottom:0;width:10px }
  .cap-skirt .left { left:0;  transform-origin: left center;  transform: rotateY(90deg);
    background: linear-gradient(90deg, rgba(0,0,0,.35), var(--cap-side, var(--cap-mod-side))); }
  .cap-skirt .right{ right:0; transform-origin: right center; transform: rotateY(-90deg);
    background: linear-gradient(270deg, rgba(0,0,0,.35), var(--cap-side, var(--cap-mod-side))); }

  /* Slight dish on top via an inset pseudo top cap */
  .cap-dish{
    position:absolute;
    left:6px;right:6px;top:6px;bottom:6px;
    transform: translateZ(0.5px);
    border-radius:3px;
    background: linear-gradient(145deg, rgba(255,255,255,.18), rgba(0,0,0,.08));
    pointer-events:none;
  }

  /* Color variants */
  .key.mod .cap-skirt{ --cap-top: var(--cap-mod-top); --cap-side: var(--cap-mod-side) }
  .key.mod .cap-skirt .top{ color: rgba(0,0,0,.7) }
  .key.acc .cap-skirt{ --cap-top: var(--cap-acc-top); --cap-side: var(--cap-acc-side) }
  .key.acc .cap-skirt .top{ color: rgba(255,255,255,.75) }
  .key.pop .cap-skirt{ --cap-top: var(--cap-pop-top); --cap-side: var(--cap-pop-side) }
  .key.pop .cap-skirt .top{ color: rgba(255,255,255,.95) }

  /* Knob */
  .knob-wrap{
    position:absolute;
    right: 10px;
    top: -6px;
    transform-style:preserve-3d;
    transform: translateZ(18px) translateY(-260px);
    opacity:0;
    transition: transform .6s cubic-bezier(.2,.7,.2,1), opacity .4s;
  }
  .knob-wrap.in{ transform: translateZ(18px); opacity:1 }
  .knob{
    position:relative;
    width:42px;height:42px;
    transform-style:preserve-3d;
    cursor:pointer;
  }
  .knob-body{
    position:absolute;inset:0;
    border-radius:50%;
    background:
      repeating-conic-gradient(from 0deg, #3a3d44 0 6deg, #2a2d33 6deg 12deg),
      #2a2d33;
    box-shadow: 0 0 0 2px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.08);
    transform: translateZ(12px);
  }
  .knob-top{
    position:absolute;inset:3px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #4a4d55, #1a1c21 70%);
    transform: translateZ(14px);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.1), inset 0 2px 4px rgba(255,255,255,.05);
  }
  .knob-indicator{
    position:absolute;left:50%;top:8px;
    width:3px;height:8px;
    background: var(--cap-pop);
    border-radius:2px;
    transform: translateX(-50%) translateZ(15px);
    box-shadow: 0 0 6px var(--cap-pop);
  }
  .knob.turning{ animation: knobTurn .25s ease-out }
  @keyframes knobTurn{
    0%{ transform: translateZ(12px) rotate(0) }
    50%{ transform: translateZ(12px) rotate(18deg) }
    100%{ transform: translateZ(12px) rotate(0) }
  }

  /* Sound hint */
  .sound-hint{
    position:fixed;bottom:70px;left:50%;transform:translateX(-50%);
    background: rgba(20,22,28,.85);
    border:1px solid rgba(255,255,255,.08);
    padding:10px 16px;border-radius:999px;
    font-size:12px;color:#cfd3db;
    opacity:0;transition:opacity .4s;
    pointer-events:none;
    z-index:30;
  }
  .sound-hint.show{opacity:1}
  .sound-hint b{color:var(--cap-pop)}

  @media (prefers-reduced-motion: reduce){
    .layer, .switch, .key, .knob-wrap{ transition: opacity .3s !important }
    .underglow{ animation:none }
    .knob.turning{ animation:none }
  }

  @media (max-width: 860px){
    :root{ --u: 38px; --gap: 3px; --case-pad: 14px }
    .brand small{ display:none }
    footer{ font-size:10px }
    .cap-skirt .top{ font-size:9px }
    .cap-skirt .top .legend.side-legend{ font-size:7px }
  }
  @media (max-width: 620px){
    :root{ --u: 28px; --gap: 2px; --case-pad: 10px }
    header{ padding:12px 14px }
    .btn{ padding:7px 10px; font-size:10px }
    .cap-skirt .top{ font-size:7px }
    .cap-skirt .top .legend.side-legend{ font-size:6px }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="dot"></span>
    AETHER · 65
    <small>Mechanical Keyboard Showcase</small>
  </div>
  <div class="controls">
    <button class="btn" id="btnReplay" title="Replay assembly">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      Replay
    </button>
    <button class="btn" id="btnRgb" title="Toggle RGB underglow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      RGB
    </button>
    <button class="btn" id="btnMute" title="Mute sound">
      <svg id="icoSound" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
      Sound
    </button>
  </div>
</header>

<div class="stage" id="stage">
  <div class="shadow"></div>
  <div class="stage-inner" id="stageInner">
    <div class="keyboard" id="keyboard">
      <!-- Case -->
      <div class="case">
        <div class="face top"></div>
        <div class="face bottom"></div>
        <div class="side front"></div>
        <div class="side back"></div>
        <div class="side left"></div>
        <div class="side right"></div>
      </div>
      <div class="underglow" id="underglow"></div>
      <div class="deck"></div>

      <!-- PCB -->
      <div class="layer pcb" data-layer="pcb">
        <div class="face top"></div>
        <div class="side front"></div>

<div class="sound-hint" id="soundHint">Tap anywhere or press a key to <b>enable sound</b></div>

<script>
/* ============================================================
   LAYOUT
   65% with knob at top-right corner.
   u = width in key units. r = row (0..4). c = column (in u).
   label = what's shown on keycap, key = KeyboardEvent.key match.
   kind = 'mod' | 'acc' | 'pop' (visual style)
   sound = sound profile name
   ============================================================ */
const LAYOUT = [
  // Row 0
  {r:0, c:0,    u:1,    label:'~',  sub:'`', key:'`',       kind:'acc', sound:'alpha'},
  {r:0, c:1,    u:1,    label:'!',  sub:'1', key:'1',       kind:'acc', sound:'alpha'},
  {r:0, c:2,    u:1,    label:'@',  sub:'2', key:'2',       kind:'acc', sound:'alpha'},
  {r:0, c:3,    u:1,    label:'#',  sub:'3', key:'3',       kind:'acc', sound:'alpha'},
  {r:0, c:4,    u:1,    label:'$',  sub:'4', key:'4',       kind:'acc', sound:'alpha'},
  {r:0, c:5,    u:1,    label:'%',  sub:'5', key:'5',       kind:'acc', sound:'alpha'},
  {r:0, c:6,    u:1,    label:'^',  sub:'6', key:'6',       kind:'acc', sound:'alpha'},
  {r:0, c:7,    u:1,    label:'&',  sub:'7', key:'7',       kind:'acc', sound:'alpha'},
  {r:0, c:8,    u:1,    label:'*',  sub:'8', key:'8',       kind:'acc', sound:'alpha'},
  {r:0, c:9,    u:1,    label:'(',  sub:'9', key:'9',       kind:'acc', sound:'alpha'},
  {r:0, c:10,   u:1,    label:')',  sub:'0', key:'0',       kind:'acc', sound:'alpha'},
  {r:0, c:11,   u:1,    label:'_',  sub:'-', key:'-',       kind:'acc', sound:'alpha'},
  {r:0, c:12,   u:1,    label:'+',  sub:'=', key:'=',       kind:'acc', sound:'alpha'},
  {r:0, c:13,   u:2,    label:'⌫',           key:'Backspace', kind:'mod', sound:'backspace', wide:true},
  // knob sits above rightmost area, handled separately

  // Row 1
  {r:1, c:0,    u:1.5,  label:'Tab',         key:'Tab',     kind:'mod', sound:'mod'},
  {r:1, c:1.5,  u:1,    label:'Q',           key:'q',       kind:'acc', sound:'alpha'},
  {r:1, c:2.5,  u:1,    label:'W',           key:'w',       kind:'acc', sound:'alpha'},
  {r:1, c:3.5,  u:1,    label:'E',           key:'e',       kind:'acc', sound:'alpha'},
  {r:1, c:4.5,  u:1,    label:'R',           key:'r',       kind:'acc', sound:'alpha'},
  {r:1, c:5.5,  u:1,    label:'T',           key:'t',       kind:'acc', sound:'alpha'},
  {r:1, c:6.5,  u:1,    label:'Y',           key:'y',       kind:'acc', sound:'alpha'},
  {r:1, c:7.5,  u:1,    label:'U',           key:'u',       kind:'acc', sound:'alpha'},
  {r:1, c:8.5,  u:1,    label:'I',           key:'i',       kind:'acc', sound:'alpha'},
  {r:1, c:9.5,  u:1,    label:'O',           key:'o',       kind:'acc', sound:'alpha'},
  {r:1, c:10.5, u:1,    label:'P',           key:'p',       kind:'acc', sound:'alpha'},
  {r:1, c:11.5, u:1,    label:'{',  sub:'[', key:'[',       kind:'acc', sound:'alpha'},
  {r:1, c:12.5, u:1,    label:'}',  sub:']', key:']',       kind:'acc', sound:'alpha'},
  {r:1, c:13.5, u:1.5,  label:'|',  sub:'\\',key:'\\',      kind:'mod', sound:'mod'},

  // Row 2
  {r:2, c:0,    u:1.75, label:'Caps',        key:'CapsLock',kind:'mod', sound:'mod'},
  {r:2, c:1.75, u:1,    label:'A',           key:'a',       kind:'acc', sound:'alpha'},
  {r:2, c:2.75, u:1,    label:'S',           key:'s',       kind:'acc', sound:'alpha'},
  {r:2, c:3.75, u:1,    label:'D',           key:'d',       kind:'acc', sound:'alpha'},
  {r:2, c:4.75, u:1,    label:'F',           key:'f',       kind:'acc', sound:'alpha'},
  {r:2, c:5.75, u:1,    label:'G',           key:'g',       kind:'acc', sound:'alpha'},
  {r:2, c:6.75, u:1,    label:'H',           key:'h',       kind:'acc', sound:'alpha'},
  {r:2, c:7.75, u:1,    label:'J',           key:'j',       kind:'acc', sound:'alpha'},
  {r:2, c:8.75, u:1,    label:'K',           key:'k',       kind:'acc', sound:'alpha'},
  {r:2, c:9.75, u:1,    label:'L',           key:'l',       kind:'acc', sound:'alpha'},
  {r:2, c:10.75,u:1,    label:':',  sub:';', key:';',       kind:'acc', sound:'alpha'},
  {r:2, c:11.75,u:1,    label:'"',  sub:"'", key:"'",       kind:'acc', sound:'alpha'},
  {r:2, c:12.75,u:2.25, label:'Enter',       key:'Enter',   kind:'pop', sound:'enter', wide:true},

  // Row 3
  {r:3, c:0,    u:2.25, label:'Shift',       key:'Shift',   kind:'mod', sound:'mod', wide:true, anyShift:true},
  {r:3, c:2.25, u:1,    label:'Z',           key:'z',       kind:'acc', sound:'alpha'},
  {r:3, c:3.25, u:1,    label:'X',           key:'x',       kind:'acc', sound:'alpha'},
  {r:3, c:4.25, u:1,    label:'C',           key:'c',       kind:'acc', sound:'alpha'},
  {r:3, c:5.25, u:1,    label:'V',           key:'v',       kind:'acc', sound:'alpha'},
  {r:3, c:6.25, u:1,    label:'B',           key:'b',       kind:'acc', sound:'alpha'},
  {r:3, c:7.25, u:1,    label:'N',           key:'n',       kind:'acc', sound:'alpha'},
  {r:3, c:8.25, u:1,    label:'M',           key:'m',       kind:'acc', sound:'alpha'},
  {r:3, c:9.25, u:1,    label:'<',  sub:',', key:',',       kind:'acc', sound:'alpha'},
  {r:3, c:10.25,u:1,    label:'>',  sub:'.', key:'.',       kind:'acc', sound:'alpha'},
  {r:3, c:11.25,u:1,    label:'?',  sub:'/', key:'/',       kind:'acc', sound:'alpha'},
  {r:3, c:12.25,u:1.75, label:'Shift',       key:'Shift',   kind:'mod', sound:'mod', wide:true, anyShift:true},
  {r:3, c:14,   u:1,    label:'↑',           key:'ArrowUp', kind:'mod', sound:'mod'},

  // Row 4
  {r:4, c:0,    u:1.25, label:'Ctrl',        key:'Control', kind:'mod', sound:'mod', anyCtrl:true},
  {r:4, c:1.25, u:1.25, label:'Win',         key:'Meta',    kind:'mod', sound:'mod'},
  {r:4, c:2.5,  u:1.25, label:'Alt',         key:'Alt',     kind:'mod', sound:'mod', anyAlt:true},
  {r:4, c:3.75, u:6.25, label:'',            key:' ',       kind:'mod', sound:'space', wide:true, isSpace:true},
  {r:4, c:10,   u:1,    label:'Alt',         key:'Alt',     kind:'mod', sound:'mod', anyAlt:true},
  {r:4, c:11,   u:1,    label:'Fn',          key:'Fn',      kind:'pop', sound:'mod'},
  {r:4, c:12,   u:1,    label:'Menu',        key:'ContextMenu', kind:'mod', sound:'mod'},
  {r:4, c:13,   u:1,    label:'←',           key:'ArrowLeft', kind:'mod', sound:'mod'},
  {r:4, c:14,   u:1,    label:'↓',           key:'ArrowDown', kind:'mod', sound:'mod'},
  // rightmost col 15 is empty (no key); knob occupies visual space above/right
];

/* ============================================================
   BUILD DOM
   ============================================================ */
const U = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u'));
const GAP = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap'));

const switchesEl = document.getElementById('switches');
const keycapsEl  = document.getElementById('keycaps');
const slotsEl    = document.getElementById('slots');

// Key registry: by KeyboardEvent.key (lowercased for letters) and special aliases
const keyRegistry = new Map(); // map key -> element
const allKeys = [];

function buildKey(def){
  const u = U(), gap = GAP();
  const w = def.u * u + (def.u - 1) * gap;
  const h = u;
  const x = def.c * (u + gap);
  const y = def.r * (u + gap);

  // Slot (plate cutout)
  const slot = document.createElement('div');
  slot.className = 'slot';
  slot.style.left = x + 'px';
  slot.style.top = y + 'px';
  slot.style.width = w + 'px';
  slot.style.height = h + 'px';
  slotsEl.appendChild(slot);

  // Switch
  const sw = document.createElement('div');
  sw.className = 'switch';
  sw.style.left = x + 'px';
  sw.style.top = y + 'px';
  sw.style.width = w + 'px';
  sw.style.height = h + 'px';
  sw.innerHTML = `
    <div class="top"></div>
    <div class="stem"></div>
    <div class="side front"></div>
    <div class="side back"></div>
    <div class="side left"></div>
    <div class="side right"></div>
  `;
  switchesEl.appendChild(sw);

  // Keycap
  const key = document.createElement('div');
  key.className = 'key ' + def.kind;
  key.style.left = x + 'px';
  key.style.top = y + 'px';
  key.style.width = w + 'px';
  key.style.height = h + 'px';
  key.dataset.sound = def.sound;
  key.dataset.keyname = def.key;

  // Build legend
  let legend = '';
  if (def.isSpace){
    legend = '';
  } else if (def.sub){
    legend = `<span class="legend side-legend">${def.sub}</span><span class="legend">${def.label}</span>`;
  } else {
    legend = `<span class="legend">${def.label}</span>`;
  }

  key.innerHTML = `
    <div class="cap-body">
      <div class="cap-skirt">
        <div class="top">${legend}</div>
        <div class="side front"></div>
        <div class="side back"></div>
        <div class="side left"></div>
        <div class="side right"></div>
      </div>
      <div class="cap-dish"></div>
    </div>
  `;
  keycapsEl.appendChild(key);

  // Register for keyboard mapping
  registerKey(def, key);

  allKeys.push({ def, key, sw, slot });
  return { def, key, sw, slot };
}

function registerKey(def, el){
  const k = def.key;
  if (def.anyShift) { keyRegistry.set('Shift', keyRegistry.get('Shift') || []); keyRegistry.get('Shift').push(el); }
  else if (def.anyCtrl) { keyRegistry.set('Control', keyRegistry.get('Control') || []); keyRegistry.get('Control').push(el); }
  else if (def.anyAlt) { keyRegistry.set('Alt', keyRegistry.get('Alt') || []); keyRegistry.get('Alt').push(el); }
  else {
    const norm = (k.length === 1) ? k.toLowerCase() : k;
    if (!keyRegistry.has(norm)) keyRegistry.set(norm, []);
    keyRegistry.get(norm).push(el);
  }
}

// Build in order (left to right, top to bottom) so animation stagger matches reading order
const ordered = [...LAYOUT].sort((a,b) => a.r - b.r || a.c - b.c);
ordered.forEach(buildKey);

// Knob
const knobWrap = document.createElement('div');
knobWrap.className = 'knob-wrap';
knobWrap.innerHTML = `
  <div class="knob" id="knob">
    <div class="knob-body"></div>
    <div class="knob-top"></div>
    <div class="knob-indicator"></div>
  </div>
`;
document.getElementById('keyboard').appendChild(knobWrap);

/* ============================================================
   ASSEMBLY ANIMATION
   ============================================================ */
const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function runAssembly(){
  // Reset states
  document.querySelectorAll('.layer').forEach(l => l.classList.remove('in'));
  document.querySelectorAll('.switch').forEach(s => s.classList.remove('in'));
  document.querySelectorAll('.key').forEach(k => k.classList.remove('in'));
  knobWrap.classList.remove('in');

  const baseDelay = prefersReduced ? 40 : 300;
  const layerGap  = prefersReduced ? 60 : 600;
  const perKey    = prefersReduced ? 8  : 30;

  // PCB
  setTimeout(() => document.querySelector('.layer.pcb').classList.add('in'), baseDelay);
  // Foam
  setTimeout(() => document.querySelector('.layer.foam').classList.add('in'), baseDelay + layerGap);
  // Plate
  setTimeout(() => document.querySelector('.layer.plate').classList.add('in'), baseDelay + layerGap*2);

  // Switches: stagger left to right across all rows, one by one
  const swStart = baseDelay + layerGap*2 + (prefersReduced ? 100 : 700);
  allKeys.forEach((k, i) => {
    setTimeout(() => k.sw.classList.add('in'), swStart + i * perKey);
  });

  // Keycaps: after all switches, stagger L→R
  const capStart = swStart + allKeys.length * perKey + (prefersReduced ? 80 : 500);
  allKeys.forEach((k, i) => {
    setTimeout(() => k.key.classList.add('in'), capStart + i * perKey);
  });

  // Knob arrives with keycaps
  setTimeout(() => knobWrap.classList.add('in'), capStart + allKeys.length * perKey + (prefersReduced ? 40 : 200));

  // Enable interaction after assembly
  interactionReady = false;
  const totalEnd = capStart + allKeys.length * perKey + (prefersReduced ? 100 : 600);
  setTimeout(() => { interactionReady = true; }, totalEnd);
}

/* ============================================================
   AUDIO
   ============================================================ */
let audioCtx = null;
let muted = false;
let audioUnlocked = false;

function ensureAudio(){
  if (!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended'){
    audioCtx.resume();
  }
  audioUnlocked = true;
  hideSoundHint();
}

function showSoundHint(){
  const el = document.getElementById('soundHint');
  el.classList.add('show');
}
function hideSoundHint(){
  document.getElementById('soundHint').classList.remove('show');
}

// Build a short click/thock using noise + filtered oscillator
function playKeySound(profile){
  if (muted) return;
  ensureAudio();
  const ctx = audioCtx;
  const now = ctx.currentTime;

  // Profile config
  const P = {
    alpha:     { freq: 1800, q: 6,  dur: 0.08, gain: 0.22, noise: 0.6, toneMix: 0.35 },
    mod:       { freq: 1200, q: 5,  dur: 0.10, gain: 0.26, noise: 0.7, toneMix: 0.40 },
    enter:     { freq:  900, q: 4,  dur: 0.13, gain: 0.30, noise: 0.8, toneMix: 0.45 },
    backspace: { freq: 1000, q: 4.5,dur: 0.12, gain: 0.28, noise: 0.75,toneMix: 0.42 },
    space:     { freq:  280, q: 2,  dur: 0.18, gain: 0.34, noise: 0.5, toneMix: 0.55 },
  }[profile] || { freq: 1500, q: 5, dur: 0.09, gain: 0.22, noise: 0.6, toneMix: 0.35 };

  // Noise buffer
  const bufferSize = Math.floor(ctx.sampleRate * P.dur * 1.5);
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++){
    data[i] = (Math.random()*2 - 1) * (1 - i/bufferSize);
  }
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;

  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'bandpass';
  noiseFilter.frequency.value = P.freq * 1.6;
  noiseFilter.Q.value = P.q;

  const noiseGain = ctx.createGain();
  noiseGain.gain.value = 0;

  noise.connect(noiseFilter).connect(noiseGain).connect(ctx.destination);

  // Tone
  const osc = ctx.createOscillator();
  osc.type = profile === 'space' ? 'sine' : 'triangle';
  osc.frequency.value = P.freq;

  const oscGain = ctx.createGain();
  oscGain.gain.value = 0;
  osc.connect(oscGain).connect(ctx.destination);

  // Master gain envelope
  const peak = P.gain;
  const t0 = now;
  noiseGain.gain.setValueAtTime(0, t0);
  noiseGain.gain.linearRampToValueAtTime(peak * P.noise, t0 + 0.004);
  noiseGain.gain.exponentialRampToValueAtTime(0.0001, t0 + P.dur);

  oscGain.gain.setValueAtTime(0, t0);
  oscGain.gain.linearRampToValueAtTime(peak * P.toneMix, t0 + 0.006);
  oscGain.gain.exponentialRampToValueAtTime(0.0001, t0 + P.dur * 0.9);

  // Pitch drop for "thock" character on spacebar/enter
  if (profile === 'space' || profile === 'enter'){
    osc.frequency.setValueAtTime(P.freq * 1.3, t0);
    osc.frequency.exponentialRampToValueAtTime(P.freq * 0.85, t0 + P.dur);
  }

  noise.start(t0);
  osc.start(t0);
  noise.stop(t0 + P.dur + 0.02);
  osc.stop(t0 + P.dur + 0.02);
}

/* ============================================================
   INTERACTION
   ============================================================ */
let interactionReady = false;

function pressKeyEl(el){
  if (!el || el.classList.contains('pressed')) return;
  el.classList.add('pressed');
  playKeySound(el.dataset.sound || 'alpha');
  clearTimeout(el._releaseT);
  el._releaseT = setTimeout(() => el.classList.remove('pressed'), 110);
}

function releaseKeyEl(el){
  // release handled by timeout for natural feel
}

// Mouse / touch
keycapsEl.addEventListener('pointerdown', (e) => {
  if (!interactionReady) return;
  const k = e.target.closest('.key');
  if (!k) return;
  e.preventDefault();
  pressKeyEl(k);
});

// Physical keyboard
const shiftedToBase = {
  '!':'1','@':'2','#':'3','$':'4','%':'5','^':'6','&':'7','*':'8','(':'9',')':'0',
  '_':'-','+':'=','{':'[','}':']','|':'\\',':':';','"':"'",'<':',','>':'.','?':'/','~':'`'
};
function normalizeKey(k){
  if (!k) return '';
  if (k.length === 1){
    if (shiftedToBase[k]) return shiftedToBase[k];
    return k.toLowerCase();
  }
  return k;
}

window.addEventListener('keydown', (e) => {
  // Unlock audio on first interaction
  if (!audioUnlocked) ensureAudio();

  // Prevent spacebar scrolling, etc.
  if (e.key === ' ' || e.key === 'Tab' || e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
    e.preventDefault();
  }

  if (!interactionReady) return;

  let matches = [];
  const k = e.key;
  if (k === 'Shift')        matches = keyRegistry.get('Shift') || [];
  else if (k === 'Control') matches = keyRegistry.get('Control') || [];
  else if (k === 'Alt')     matches = keyRegistry.get('Alt') || [];
  else if (k === 'Meta')    matches = keyRegistry.get('Meta') || [];
  else {
    matches = keyRegistry.get(normalizeKey(k)) || [];
  }

  matches.forEach(pressKeyEl);
});

// Knob
document.getElementById('knob').addEventListener('click', () => {
  if (!interactionReady) return;
  const knob = document.getElementById('knob');
  knob.classList.remove('turning');
  void knob.offsetWidth;
  knob.classList.add('turning');
  playKeySound('mod');
});

/* ============================================================
   CONTROLS
   ============================================================ */
document.getElementById('btnReplay').addEventListener('click', () => {
  if (!audioUnlocked) ensureAudio();
  runAssembly();
});

const btnRgb = document.getElementById('btnRgb');
btnRgb.addEventListener('click', () => {
  if (!audioUnlocked) ensureAudio();
  btnRgb.classList.toggle('active');
  document.getElementById('underglow').classList.toggle('on');
});

const btnMute = document.getElementById('btnMute');
btnMute.addEventListener('click', () => {
  muted = !muted;
  btnMute.classList.toggle('active', muted);
  const ico = document.getElementById('icoSound');
  if (muted){
    ico.innerHTML = '<path d="M11 5 6 9H2v6h4l5 4V5z"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/>';
  } else {
    ico.innerHTML = '<path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>';
  }
});

// Unlock audio on first user interaction
function firstUnlock(){
  if (!audioUnlocked){
    ensureAudio();
  }
  hideSoundHint();
  window.removeEventListener('pointerdown', firstUnlock);
  window.removeEventListener('keydown', firstUnlock);
}
window.addEventListener('pointerdown', firstUnlock);
window.addEventListener('keydown', firstUnlock);

// Show a gentle hint a couple seconds in, until the user interacts
setTimeout(() => {
  if (!audioUnlocked) showSoundHint();
}, 2200);

/* ============================================================
   ORBIT (drag to rotate)
   ============================================================ */
const stage = document.getElementById('stage');
const stageInner = document.getElementById('stageInner');
let isDragging = false;
let dragStart = {x:0, y:0};
let rot = { x: 28, y: 0, z: -18 }; // initial tilt
let baseRot = { ...rot };
let idleTimer = null;
let idleActive = false;

function applyRot(){
  stageInner.style.transform =
    `translate(-50%,-50%) rotateX(${rot.x}deg) rotateZ(${rot.z}deg) rotateY(${rot.y}deg)`;
}
applyRot();

stage.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.btn')) return;
  // Don't start drag if clicking a key or knob - let the click handler fire cleanly
  if (e.target.closest('.key') || e.target.closest('.knob')) return;
  isDragging = true;
  dragStart = { x: e.clientX, y: e.clientY };
  baseRot = { ...rot };
  stage.setPointerCapture(e.pointerId);
  stopIdle();
});
stage.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - dragStart.x;
  const dy = e.clientY - dragStart.y;
  rot.y = baseRot.y + dx * 0.35;
  rot.x = Math.max(-30, Math.min(70, baseRot.x - dy * 0.25));
  applyRot();
});
stage.addEventListener('pointerup', () => { isDragging = false; startIdle(); });
stage.addEventListener('pointercancel', () => { isDragging = false; startIdle(); });

function startIdle(){
  if (prefersReduced) return;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { idleActive = true; idleTick(); }, 3500);
}
function stopIdle(){ idleActive = false; clearTimeout(idleTimer); }
function idleTick(){
  if (!idleActive) return;
  rot.y += 0.08;
  applyRot();
  requestAnimationFrame(idleTick);
}
startIdle();

/* ============================================================
   RESPONSIVE REBUILD (on big viewport changes that affect --u)
   ============================================================ */
let lastU = U();
function maybeRebuild(){
  const newU = U();
  if (Math.abs(newU - lastU) > 0.5){
    lastU = newU;
    switchesEl.innerHTML = '';
    keycapsEl.innerHTML = '';
    slotsEl.innerHTML = '';
    keyRegistry.clear();
    allKeys.length = 0;
    ordered.forEach(buildKey);
    // Immediately show everything as assembled after rebuild (skip animation)
    document.querySelectorAll('.layer').forEach(l => l.classList.add('in'));
    document.querySelectorAll('.switch').forEach(s => s.classList.add('in'));
    document.querySelectorAll('.key').forEach(k => k.classList.add('in'));
    knobWrap.classList.add('in');
    interactionReady = true;
  }
}
window.addEventListener('resize', () => { requestAnimationFrame(maybeRebuild); });

/* ============================================================
   KICK OFF
   ============================================================ */
// Small delay so fonts/layout settle
setTimeout(runAssembly, 150);
</script>
