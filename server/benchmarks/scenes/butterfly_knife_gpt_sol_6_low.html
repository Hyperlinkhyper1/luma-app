document.getElementById('mute').onclick=e=>{muted=!muted;e.target.textContent=muted?'MUTED':'SOUND';e.target.classList.toggle('active',muted);if(audio)master.gain.value=muted?0:+document.getElementById('volume').value};
document.getElementById('volume').oninput=e=>{if(audio&&!muted)master.gain.value=+e.target.value};
document.getElementById('hide').onclick=e=>{let h=document.getElementById('ui').classList.toggle('hidden');e.target.textContent=h?'SHOW UI':'HIDE UI'};
document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>run(b.dataset.move));
const presets={hero:[0,-.1,7.6,0,.2,0],blade:[.22,1.45,3.1,0,1.35,0],pivot:[.5,-.15,2.7,0,-.1,0],latch:[.1,-1.8,2.6,0,-1.45,0],top:[.01,.01,7.0,0,0,0]};
let cameraGoal=null;document.querySelectorAll('[data-camera]').forEach(b=>b.onclick=()=>{cameraGoal=presets[b.dataset.camera];document.querySelectorAll('[data-camera]').forEach(x=>x.classList.toggle('active',x===b))});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;const ks=['open','close','chaplin','zen','fan','helix','aerial','signature'];if(+e.key>=1&&+e.key<=8)run(ks[+e.key-1]);if(e.key.toLowerCase()==='h')document.getElementById('hide').click()});
document.addEventListener('pointerdown',initAudio,{once:true});
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2(),hover=document.getElementById('hover');let dragging=null,downX=0,downY=0;
renderer.domElement.addEventListener('pointerdown',e=>{downX=e.clientX;downY=e.clientY;pointer.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(pointer,camera);const hits=ray.intersectObjects(handles.flatMap(h=>h.h.children),true);if(hits.length){let obj=hits[0].object,side=handles.findIndex(h=>h.h.children.includes(obj)||h.h===obj.parent);if(side>=0){dragging={side,start:handles[side].angle,x:e.clientX};controls.enabled=false;userMode=true;current='idle';loop='';queue=[];caption.textContent='MANUAL ARTICULATION';renderer.domElement.setPointerCapture(e.pointerId)}}});
renderer.domElement.addEventListener('pointermove',e=>{if(dragging){let val=dragging.start+(e.clientX-dragging.x)*.009;let a=Math.max(opened,Math.min(closed,val));handles[dragging.side].angle=a;handles[1-dragging.side].angle=a;latchAngle=a>.95?-.8:-.25;setHandles();return}if(explode<.15){hover.style.display='none';return}pointer.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(pointer,camera);let hits=ray.intersectObjects(hoverables,false);if(hits.length){hover.textContent=hits[0].object.userData.label;hover.style.display='block';hover.style.left=(e.clientX+15)+'px';hover.style.top=(e.clientY+15)+'px'}else hover.style.display='none'});
renderer.domElement.addEventListener('pointerup',()=>{dragging=null;controls.enabled=true});
let trailPts=[],trailMesh=null;
function updateTrail(tip){if(!trailOn){if(trailMesh){scene.remove(trailMesh);trailMesh.geometry.dispose();trailMesh=null}return}trailPts.push(tip.clone());if(trailPts.length>38)trailPts.shift();if(trailPts.length<3)return;if(trailMesh){scene.remove(trailMesh);trailMesh.geometry.dispose()}let verts=[],colors=[],indices=[];for(let i=0;i<trailPts.length;i++){let p=trailPts[i],q=trailPts[Math.min(i+1,trailPts.length-1)],dir=q.clone().sub(p).normalize(),side=new THREE.Vector3(-dir.y,dir.x,0).multiplyScalar(.015*i/trailPts.length);for(let k of [-1,1]){let v=p.clone().addScaledVector(side,k);verts.push(v.x,v.y,v.z);let c=new THREE.Color(0xd5a26c).multiplyScalar(i/trailPts.length);colors.push(c.r,c.g,c.b)}if(i<trailPts.length-1){let n=i*2;indices.push(n,n+1,n+2,n+1,n+3,n+2)}}let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));g.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));g.setIndex(indices);trailMesh=new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:.65,side:THREE.DoubleSide,depthWrite:false}));scene.add(trailMesh)}
let last=performance.now(),idleTime=0,wasOpen=false;
function animate(now){requestAnimationFrame(animate);let dt=Math.min(.05,(now-last)/1000);last=now;idleTime+=dt;
if(!dragging){
  if(current==='idle'){if(!userMode){knife.rotation.y+=dt*.13;knife.rotation.x=.05*Math.sin(idleTime*.7)}}
  else{phase+=dt*speed*(slow?.25:1);let t=Math.min(1,phase/durations[current]);let p=evalMove(current,t);
    let blend=Math.min(1,dt*8);handles[0].angle=lerp(handles[0].angle,p.a,blend);handles[1].angle=lerp(handles[1].angle,p.b,blend);
    knife.rotation.z=lerp(knife.rotation.z,p.r,blend);knife.rotation.x=lerp(knife.rotation.x,p.rx,blend);knife.rotation.y=lerp(knife.rotation.y,p.ry,blend);
    knife.position.x=lerp(knife.position.x,p.x,blend);knife.position.y=lerp(knife.position.y,p.y,blend);knife.position.z=lerp(knife.position.z,p.z,blend);
    let apart=Math.max(handles[0].angle,handles[1].angle);let desiredLatch=apart>.3?-.75:0;latchAngle=lerp(latchAngle,desiredLatch,Math.min(1,dt*.12));
    if(wasOpen!== (desiredLatch<-.4)){click(.6);wasOpen=desiredLatch<-.4}
    soundStops(dt);
    if(t>=1){if(current==='reveal'){current='idle';caption.textContent='TIDELINE · AT REST'}else next()}
  }
}
setHandles();explode=lerp(explode,explodeTarget,Math.min(1,dt*.5));for(let c of components)c.obj.position.z=c.base.z+c.offset*explode;
if(cameraGoal){camera.position.lerp(new THREE.Vector3(...cameraGoal.slice(0,3)),Math.min(1,dt*.3));controls.target.lerp(new THREE.Vector3(...cameraGoal.slice(3)),Math.min(1,dt*.3));if(camera.position.distanceTo(new THREE.Vector3(...cameraGoal.slice(0,3)))<.01)cameraGoal=null}
knife.updateWorldMatrix(true,false);let tip=blade.localToWorld(new THREE.Vector3(-.18,2.31,.04));tipVelocity=tip.distanceTo(lastTip)/Math.max(dt,.001);lastTip.copy(tip);updateTrail(tip);
if(audio&&swishGain){let v=Math.min(1,tipVelocity/8);swishGain.gain.setTargetAtTime(muted?0:v*.055,audio.currentTime,.055);swishFilter.frequency.setTargetAtTime(350+v*2100,audio.currentTime,.06)}
controls.update();renderer.render(scene,camera)}
pose(closed,closed,-.37,0,-.16);setHandles();requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

</script>
