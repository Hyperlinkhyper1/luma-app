<title>Lisboa · Cruise Terminal — Aurora Celeste</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#07090d;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#eef2f6}
  canvas{display:block}
  #wrap{position:fixed;inset:0}
  /* ---------- loading ---------- */
  #load{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
        background:radial-gradient(ellipse at 50% 60%,#20324a 0%,#0a0e15 70%);transition:opacity .9s ease}
  #load h1{font-size:clamp(18px,3.2vw,34px);letter-spacing:.42em;margin:0 0 6px;font-weight:300;text-transform:uppercase}
  #load h2{font-size:clamp(10px,1.3vw,13px);letter-spacing:.3em;margin:0 0 26px;font-weight:300;color:#f0c475;text-transform:uppercase}
  #bar{width:min(340px,60vw);height:3px;background:#ffffff22;border-radius:2px;overflow:hidden}
  #bar i{display:block;height:100%;width:4%;background:linear-gradient(90deg,#f0c475,#fff);transition:width .25s}
  #ltxt{margin-top:12px;font-size:11px;letter-spacing:.16em;color:#9fb0c4;text-transform:uppercase}
  /* ---------- ui ---------- */
  #ui{position:fixed;top:0;left:0;z-index:20;padding:10px;max-width:330px;transition:transform .35s ease,opacity .35s ease}
  #ui.hid{transform:translateX(-110%);opacity:0;pointer-events:none}
  #panel{background:rgba(10,16,24,.62);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
         border:1px solid rgba(255,255,255,.14);border-radius:11px;padding:9px 10px 8px;box-shadow:0 10px 34px #0008}
  .hdr{display:flex;align-items:baseline;gap:6px;margin-bottom:7px;font-size:12.5px;letter-spacing:.14em}
  .hdr b{font-weight:600;color:#fff}
  .hdr span{color:#f0c475;font-size:10px;letter-spacing:.2em}
  .hdr .sp{margin-left:auto}
  .row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px;align-items:center}
  button,select{font:inherit;font-size:10.5px;letter-spacing:.06em;color:#dde6ef;background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.16);border-radius:6px;padding:4px 7px;cursor:pointer;transition:.16s;white-space:nowrap}
  button:hover,select:hover{background:rgba(255,255,255,.17);color:#fff}
  button.on{background:#f0c475;border-color:#f0c475;color:#19202b;font-weight:600}
  button.go{background:#c0392b;border-color:#e0523e;color:#fff;font-weight:600}
  button.go:hover{background:#e0523e}
  button.sm{padding:2px 6px;font-size:10px}
  label{font-size:10px;letter-spacing:.1em;color:#9fb0c4;text-transform:uppercase}
  #clk{color:#f0c475;font-variant-numeric:tabular-nums;font-size:11px;letter-spacing:.08em}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:3px;border-radius:3px;background:#ffffff33;outline:none;min-width:120px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#f0c475;cursor:pointer;border:2px solid #1a222e}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#f0c475;cursor:pointer;border:2px solid #1a222e}
  .hint{font-size:9.5px;line-height:1.5;color:#8a9bae;letter-spacing:.04em;margin-top:5px;border-top:1px solid #ffffff14;padding-top:5px}
  #show{position:fixed;top:10px;left:10px;z-index:21;display:none}
  #show.vis{display:block}
  #stat{position:fixed;left:10px;bottom:9px;z-index:20;font-size:10px;letter-spacing:.1em;color:#a9bbcd;
        background:rgba(10,16,24,.5);border:1px solid #ffffff14;border-radius:7px;padding:4px 9px;backdrop-filter:blur(6px);transition:opacity .3s}
  #stat b{color:#f0c475;font-weight:500}
  #cross{position:fixed;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;z-index:19;display:none;pointer-events:none}
  #cross.vis{display:block}
  #cross:before,#cross:after{content:"";position:absolute;background:#ffffffcc}
  #cross:before{left:6px;top:0;width:2px;height:14px}
  #cross:after{top:6px;left:0;height:2px;width:14px}
  #err{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;background:#0a0e15;padding:30px;text-align:center}
  #err div{max-width:460px;line-height:1.7;font-size:14px;color:#cfdae6}
  @media (max-width:620px){#ui{max-width:260px}.hint{display:none}}
</style>

<div id="wrap"></div>

<div id="load">

</div>

  <div id="panel">

  </div>
</div>

<div id="stat">—</div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {PointerLockControls} from 'three/addons/controls/PointerLockControls.js';
import {Sky} from 'three/addons/objects/Sky.js';
import {Water} from 'three/addons/objects/Water.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import * as BGU from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================ UTIL */
const DEG=Math.PI/180;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
function smoothstep(e0,e1,x){const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R=mulberry32(20240617);
const rr=(a,b)=>a+(b-a)*R();
const pick=arr=>arr[(R()*arr.length)|0];
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const DUM=new THREE.Object3D();

function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function tex(c,rx,ry,srgb){const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx||1,ry||1);
  if(srgb!==false)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t;}
function nmat(m,ni){if(ni!==undefined)m.userData.ni=ni;nightMats.push(m);return m;}
const nightMats=[];

/* ============================================================ BOOT */
const wrap=document.getElementById('wrap');
let renderer;
try{
  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance',stencil:false});
}catch(e){}
if(!renderer||!renderer.getContext()){
  document.getElementById('err').style.display='flex';
  document.getElementById('load').style.display='none';
  throw new Error('no webgl');
}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
wrap.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,1,60000);
camera.position.set(330,118,-300);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.055;controls.maxPolarAngle=Math.PI*0.497;
controls.minDistance=12;controls.maxDistance=4200;controls.target.set(-10,34,30);

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.55,0.72,0.86);
composer.addPass(bloom);
let bloomOn=true;

const pmrem=new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();

/* ============================================================ TEXTURES */
function facadeTex(base,style){
  const W=160,H=192,c=cv(W,H),g=c.getContext('2d');
  g.fillStyle=base;g.fillRect(0,0,W,H);
  // plaster mottling
  for(let i=0;i<900;i++){g.fillStyle=`rgba(${R()*255|0},${R()*255|0},${R()*255|0},0.035)`;g.fillRect(R()*W,R()*H,rr(1,5),rr(1,5));}
  if(style==='azulejo'){
    const s=16;
    for(let y=0;y<H;y+=s)for(let x=0;x<W;x+=s){
      g.fillStyle=(x/s+y/s)%2?'#eef4f8':'#dce9f2';g.fillRect(x,y,s-1,s-1);
      g.strokeStyle='rgba(40,88,140,.75)';g.lineWidth=1.3;
      g.beginPath();g.arc(x+s/2,y+s/2,s*0.27,0,7);g.stroke();
      g.beginPath();g.moveTo(x+2,y+2);g.lineTo(x+s-3,y+s-3);g.moveTo(x+s-3,y+2);g.lineTo(x+2,y+s-3);g.stroke();
    }
  }
  const em=cv(W,H),e=em.getContext('2d');e.fillStyle='#000';e.fillRect(0,0,W,H);
  const cols=3,rows=4,wW=26,wH=30;
  for(let r=0;r<rows;r++)for(let col=0;col<cols;col++){
    const x=18+col*((W-36-wW)/(cols-1||1)),y=10+r*((H-20-wH)/(rows-1));
    g.fillStyle='rgba(28,24,22,.92)';g.fillRect(x,y,wW,wH);
    g.fillStyle='rgba(255,255,255,.22)';g.fillRect(x+1,y+1,wW-2,3);
    g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=2;g.strokeRect(x-1.5,y-1.5,wW+3,wH+3);
    // shutter / balcony rail
    if(R()<0.45){g.strokeStyle='rgba(40,40,45,.8)';g.lineWidth=1.2;
      for(let k=0;k<4;k++){g.beginPath();g.moveTo(x,y+wH+2+k*1.6);g.lineTo(x+wW,y+wH+2+k*1.6);g.stroke();}}
    if(R()<0.72){const lit=`rgba(${255},${rr(190,225)|0},${rr(110,160)|0},1)`;e.fillStyle=lit;e.fillRect(x,y,wW,wH);
      e.fillStyle='rgba(0,0,0,.45)';e.fillRect(x+wW*0.35,y,2.5,wH);}
  }
  g.fillStyle='rgba(0,0,0,.14)';g.fillRect(0,H-8,W,8);
  return {map:tex(c,1,1),emis:tex(em,1,1)};
}
function roofTex(){
  const c=cv(96,96),g=c.getContext('2d');
  g.fillStyle='#9d4a2c';g.fillRect(0,0,96,96);
  for(let y=0;y<96;y+=12)for(let x=-6;x<96;x+=12){
    const o=(y/12)%2?6:0;
    g.fillStyle=`rgb(${rr(150,196)|0},${rr(72,104)|0},${rr(44,62)|0})`;
    g.beginPath();g.arc(x+o+6,y+6,6.2,Math.PI,0);g.fill();
    g.strokeStyle='rgba(60,25,15,.55)';g.lineWidth=1;g.beginPath();g.arc(x+o+6,y+6,6.2,Math.PI,0);g.stroke();
  }
  return tex(c,1,1);
}
function groundTex(){
  const c=cv(256,256),g=c.getContext('2d');
  g.fillStyle='#8d8578';g.fillRect(0,0,256,256);
  for(let i=0;i<5000;i++){const s=rr(2,7);g.fillStyle=`rgba(${rr(95,165)|0},${rr(90,155)|0},${rr(80,140)|0},.5)`;
    g.fillRect(R()*256,R()*256,s,s*rr(.6,1.2));}
  for(let i=0;i<220;i++){g.fillStyle=`rgba(${rr(60,110)|0},${rr(70,110)|0},${rr(45,80)|0},.35)`;
    g.beginPath();g.arc(R()*256,R()*256,rr(3,14),0,7);g.fill();}
  return tex(c,1,1);
}
function concreteTex(){
  const c=cv(128,128),g=c.getContext('2d');
  g.fillStyle='#b9b4ab';g.fillRect(0,0,128,128);
  for(let i=0;i<2200;i++){g.fillStyle=`rgba(${rr(120,200)|0},${rr(120,195)|0},${rr(115,190)|0},.35)`;g.fillRect(R()*128,R()*128,rr(1,4),rr(1,4));}
  g.strokeStyle='rgba(90,88,84,.5)';g.lineWidth=1.6;
  for(let i=0;i<=128;i+=32){g.beginPath();g.moveTo(i,0);g.lineTo(i,128);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(128,i);g.stroke();}
  return tex(c,1,1);
}
function teakTex(){
  const c=cv(128,128),g=c.getContext('2d');
  g.fillStyle='#b98f57';g.fillRect(0,0,128,128);
  for(let y=0;y<128;y+=6){g.fillStyle=`rgb(${rr(166,196)|0},${rr(128,152)|0},${rr(76,98)|0})`;g.fillRect(0,y,128,5);
    g.fillStyle='rgba(60,40,20,.5)';g.fillRect(0,y+5,128,1);}
  for(let i=0;i<500;i++){g.fillStyle='rgba(120,80,40,.12)';g.fillRect(R()*128,R()*128,rr(4,22),1);}
  return tex(c,1,1);
}
// hull livery: v = height, u = length
function hullTex(){
  const W=512,H=256,c=cv(W,H),g=c.getContext('2d');
  const y=v=>H-v*H;   // v 0 bottom
  const band=(v0,v1,col)=>{g.fillStyle=col;g.fillRect(0,y(v1),W,y(v0)-y(v1));};
  band(0,.282,'#6b2b24');            // antifouling
  band(.282,.345,'#13161b');         // boot top
  band(.345,.80,'#17304f');          // navy hull
  band(.80,.818,'#d8b05f');          // gold sheer line
  band(.818,1,'#f2f3f1');            // white upper strake
  const em=cv(W,H),e=em.getContext('2d');e.fillStyle='#000';e.fillRect(0,0,W,H);
  // portholes rows
  [[.46,16],[.58,16],[.70,16]].forEach(([v,n])=>{
    for(let i=0;i<W;i+=W/n){
      g.fillStyle='#0b0f16';g.beginPath();g.arc(i+W/n/2,y(v),5.5,0,7);g.fill();
      g.strokeStyle='#c9ccd2';g.lineWidth=1.6;g.stroke();
      if(R()<.7){e.fillStyle='rgba(255,214,150,1)';e.beginPath();e.arc(i+W/n/2,y(v),4.6,0,7);e.fill();}
    }});
  // promenade window strip in the white band
  g.fillStyle='#0d1118';g.fillRect(0,y(.93),W,10);
  for(let i=0;i<W;i+=12){g.fillStyle='#f2f3f1';g.fillRect(i,y(.93),2.5,10);}
  for(let i=0;i<W;i+=12){if(R()<.8){e.fillStyle='rgba(255,226,176,1)';e.fillRect(i+3,y(.93)+1,8,8);}}
  g.fillStyle='rgba(255,255,255,.07)';g.fillRect(0,y(.95),W,2);
  return {map:tex(c,1,1),emis:tex(em,1,1)};
}
function balconyDoorTex(){
  const W=128,H=96,c=cv(W,H),g=c.getContext('2d');
  g.fillStyle='#262b33';g.fillRect(0,0,W,H);
  g.fillStyle='#14304a';g.fillRect(8,8,W-16,H-18);
  g.fillStyle='rgba(180,220,255,.22)';g.fillRect(8,8,(W-16)/2-2,H-18);
  g.strokeStyle='#cfd6de';g.lineWidth=3;g.strokeRect(8,8,W-16,H-18);
  g.beginPath();g.moveTo(W/2,8);g.lineTo(W/2,H-10);g.stroke();
  const em=cv(W,H),e=em.getContext('2d');e.fillStyle='#000';e.fillRect(0,0,W,H);
  e.fillStyle='rgba(255,219,160,1)';e.fillRect(10,10,W-20,H-22);
  e.fillStyle='rgba(0,0,0,.55)';e.fillRect(W/2-2,8,4,H-18);
  return {map:tex(c,1,1),emis:tex(em,1,1)};
}
function glassStripTex(){
  const W=128,H=64,c=cv(W,H),g=c.getContext('2d');
  g.fillStyle='#1d2b3a';g.fillRect(0,0,W,H);
  for(let i=0;i<W;i+=16){g.fillStyle='rgba(150,200,240,.25)';g.fillRect(i+2,6,12,H-12);
    g.fillStyle='#e8edf2';g.fillRect(i,0,2,H);}
  g.fillStyle='#e8edf2';g.fillRect(0,0,W,4);g.fillRect(0,H-4,W,4);
  const em=cv(W,H),e=em.getContext('2d');e.fillStyle='#000';e.fillRect(0,0,W,H);
  for(let i=0;i<W;i+=16){if(R()<.85){e.fillStyle='rgba(255,235,190,1)';e.fillRect(i+2,6,12,H-12);}}
  return {map:tex(c,1,1),emis:tex(em,1,1)};
}
function textTex(txt,col,px,wide){
  const W=1024,H=wide?160:200,c=cv(W,H),g=c.getContext('2d');
  g.clearRect(0,0,W,H);
  g.font=`600 ${px||110}px Georgia, "Times New Roman", serif`;
  g.textAlign='center';g.textBaseline='middle';
  g.fillStyle=col||'#ffffff';
  g.shadowColor='rgba(0,0,0,.4)';g.shadowBlur=6;
  g.fillText(txt,W/2,H/2);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;
}
function waterNormals(){
  const N=256,data=new Uint8Array(N*N*4);
  const F=[];for(let i=0;i<10;i++)F.push([(1+(R()*9|0)),(1+(R()*9|0)),R()*6.28,1/(1+i*0.8)]);
  const h=(x,y)=>{let s=0;for(const[a,b,p,amp]of F)s+=amp*Math.sin(2*Math.PI*(a*x/N+b*y/N)+p);return s;};
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const dx=h(x+1,y)-h(x-1,y),dy=h(x,y+1)-h(x,y-1);
    const n=new THREE.Vector3(-dx*0.5,-dy*0.5,2.2).normalize();
    const i=(y*N+x)*4;data[i]=(n.x*.5+.5)*255;data[i+1]=(n.z*.5+.5)*255;data[i+2]=(n.y*.5+.5)*255;data[i+3]=255;
  }
  const t=new THREE.DataTexture(data,N,N,THREE.RGBAFormat);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.needsUpdate=true;return t;
}
function softSprite(col,pow){
  const S=64,c=cv(S,S),g=c.getContext('2d');
  const gr=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  gr.addColorStop(0,col||'rgba(255,255,255,1)');gr.addColorStop(pow||.45,'rgba(255,255,255,.35)');gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,S,S);
  return tex(c,1,1);
}
function wakeTex(){
  const W=128,H=256,c=cv(W,H),g=c.getContext('2d');
  g.clearRect(0,0,W,H);
  for(let y=0;y<H;y++){
    const t=y/H, a=(1-t)*(1-t)*0.85, w=W*(0.18+0.82*t);
    g.fillStyle=`rgba(255,255,255,${a*0.5})`;
    g.fillRect(W/2-w/2,y,w,1);
    g.fillStyle=`rgba(255,255,255,${a})`;
    g.fillRect(W/2-w/2,y,w*0.1,1);g.fillRect(W/2+w/2-w*0.1,y,w*0.1,1);

/* ============================================================ LOFTED HULL BUILDER */
function loftHull(o){
  const L=o.L,B=o.B,draft=o.draft,deck=o.deck;
  const NS=o.ns||70,NK=o.nk||7;
  const planF=o.planF,flare=o.flare??0.02,rake=o.rake??0.4,sternRake=o.sternRake??0.3;
  const flatK=o.flatKeel??0.2,bilge=o.bilge??0.32;
  const sheerBow=o.sheerBow||0,sheerStern=o.sheerStern||0;
  const pos=[],uv=[],idx=[],deckEdge=[];
  const PR=2*NK+2;
  let yMax=deck+sheerBow, yMin=-draft;
  const vSc=1/(yMax-yMin);
  for(let i=0;i<=NS;i++){
    const u=i/NS,hw=Math.max(0.02,planF(u)*B*0.5);
    const yBot=-draft+Math.pow(Math.max(0,(0.13-u)/0.13),1.6)*draft*0.6+Math.pow(Math.max(0,(u-0.78)/0.22),1.75)*draft*1.15;
    const yDeck=deck+sheerBow*Math.pow(Math.max(0,(u-0.58)/0.42),2)+sheerStern*Math.pow(Math.max(0,(0.26-u)/0.26),2);
    const xB=(u-0.5)*L,bowF=smoothstep(0.72,1,u),stF=smoothstep(0.14,0,u);
    const kh=flatK*hw,yB=yBot+bilge*(yDeck-yBot);
    const half=[];
    for(let k=0;k<=NK;k++){
      const a=k/NK;let y,z;
      if(a<0.42){const th=(a/0.42)*Math.PI/2;z=kh+(hw-kh)*Math.sin(th);y=yBot+(yB-yBot)*(1-Math.cos(th));}
      else{const t=(a-0.42)/0.58;y=yB+(yDeck-yB)*t;z=hw*(1+flare*t);}
      const x=xB+bowF*rake*Math.max(0,y)-stF*sternRake*Math.max(0,y);
      half.push([x,y,z]);
    }
    for(let k=NK;k>=0;k--){const p=half[k];pos.push(p[0],p[1],-p[2]);uv.push((p[0]+L/2)/L,(p[1]-yMin)*vSc);}
    for(let k=0;k<=NK;k++){const p=half[k];pos.push(p[0],p[1],p[2]);uv.push((p[0]+L/2)/L,(p[1]-yMin)*vSc);}
    deckEdge.push([half[NK][0],half[NK][1],half[NK][2]]);
  }
  for(let i=0;i<NS;i++)for(let j=0;j<PR-1;j++){
    const a=i*PR+j,b=a+1,c=a+PR,d=c+1;
    idx.push(a,c,b, b,c,d);
  }
  // transom fan
  let cx=0,cy=0;for(let j=0;j<PR;j++){cx+=pos[j*3];cy+=pos[j*3+1];}cx/=PR;cy/=PR;
  const ci=pos.length/3;pos.push(cx-1.2,cy,0);uv.push(0,(cy-yMin)*vSc);
  for(let j=0;j<PR;j++){const a=j,b=(j+1)%PR;idx.push(ci,a,b);}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);g.computeVertexNormals();
  // deck cap
  const dp=[],du=[],di=[];
  for(let i=0;i<=NS;i++){const e=deckEdge[i];
    dp.push(e[0],e[1],-e[2]);du.push((e[0]+L/2)/L,0);
    dp.push(e[0],e[1],e[2]);du.push((e[0]+L/2)/L,1);}
  for(let i=0;i<NS;i++){const a=i*2,b=a+1,c=a+2,d=a+3;di.push(a,b,c,b,d,c);}
  const dg=new THREE.BufferGeometry();
  dg.setAttribute('position',new THREE.Float32BufferAttribute(dp,3));
  dg.setAttribute('uv',new THREE.Float32BufferAttribute(du,2));
  dg.setIndex(di);dg.computeVertexNormals();
  return {hull:g,deck:dg,edge:deckEdge};
}

function groundH(x,z){

  const ramp=smoothstep(-26,-70,z);
  const alfama=102*Math.exp(-(Math.pow((x+30)/360,2)+Math.pow((z+400)/330,2)));
  const graca=70*Math.exp(-(Math.pow((x-430)/300,2)+Math.pow((z+620)/300,2)));
  const west=48*Math.exp(-(Math.pow((x+900)/330,2)+Math.pow((z+520)/320,2)));
  const far=58*smoothstep(-700,-1500,z);
  let h=3.4+ramp*(alfama+graca*0.9+west+far);

}

  im.frustumCulled=false;

  for(let i=0;i<n;i++){
    c.setHSL(R(),rr(.25,.7),rr(.3,.7));im.setColorAt(i,c);
    agents.push({t:R(),sp:rr(.055,.14)*(kind==='ship'?.5:1),path:(R()*(kind==='ship'?2:4))|0,ph:R()*6.28,sc:rr(.93,1.07)});

}

function carBody(len,wid,hgt,col,type){
  const g=new THREE.Group();
  const s=new THREE.Shape();
  if(type==='sedan'){
    s.moveTo(-len/2,0);s.lineTo(len/2,0);s.lineTo(len/2,hgt*.52);
    s.quadraticCurveTo(len*.3,hgt*.62,len*.17,hgt);s.lineTo(-len*.2,hgt);
    s.quadraticCurveTo(-len*.42,hgt*.72,-len/2,hgt*.52);s.closePath();
  }else{
    s.moveTo(-len/2,0);s.lineTo(len/2,0);s.lineTo(len/2,hgt*.85);
    s.quadraticCurveTo(len/2,hgt,len/2-hgt*.18,hgt);s.lineTo(-len/2+hgt*.18,hgt);
    s.quadraticCurveTo(-len/2,hgt,-len/2,hgt*.85);s.closePath();
  }
  const geo=new THREE.ExtrudeGeometry(s,{depth:wid,bevelEnabled:true,bevelSize:.12,bevelThickness:.12,bevelSegments:1,curveSegments:7});
  geo.translate(0,0,-wid/2);
  const m=g_(geo,M(col,.4,.35));m.castShadow=true;g.add(m);
  const wg=new THREE.CylinderGeometry(hgt*.26,hgt*.26,.34,10);wg.rotateX(Math.PI/2);
  const wm=M(0x15171b,.9,.1);
  for(const sx of [-1,1])for(const sz of [-1,1]){
    const w=g_(wg,wm);w.position.set(sx*len*.33,hgt*.24,sz*(wid/2-.1));g.add(w);
  }
  return g;
}

function boatHull(L,B,draft,deck,col){
  const lo=loftHull({L,B,draft,deck,ns:26,nk:5,planF:u=>{
    if(u>0.70){const t=(u-0.70)/0.30;return Math.pow(Math.cos(t*Math.PI/2),.6)*.98+.02;}
    if(u<0.18){const t=u/0.18;return 0.74+0.26*t;}return 1;},flare:.05,rake:.35,flatKeel:.18,bilge:.4});
  const g=new THREE.Group();
  g.add(g_(lo.hull,M(col,.45,.2)));
  g.add(g_(lo.deck,M(0xd9d5c8,.8,.05)));
  return g;
}

  master=AC.createGain();master.gain.value=0.0;master.connect(AC.destination);
  // ambient: filtered noise (water + wind)
  const len=AC.sampleRate*4,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*0.6;
  const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;lp.Q.value=0.6;
  ambGain=AC.createGain();ambGain.gain.value=0.16;
  src.connect(lp);lp.connect(ambGain);ambGain.connect(master);src.start();
  // gentle swell LFO
  const lfo=AC.createOscillator(),lg=AC.createGain();
  lfo.frequency.value=0.08;lg.gain.value=0.07;lfo.connect(lg);lg.connect(ambGain.gain);lfo.start();
}
function setSound(on){
  soundOn=on;if(on)initAudio();
  if(AC){AC.resume();master.gain.linearRampToValueAtTime(on?0.55:0.0,AC.currentTime+0.6);}
  document.getElementById('snd').textContent=on?'♪ Sound on':'♪ Sound off';
  document.getElementById('snd').classList.toggle('on',on);
}
function horn(long){
  initAudio();AC.resume();
  const t=AC.currentTime,dur=long?5.2:2.2;
  const g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.9,t+0.35);
  g.gain.setValueAtTime(0.9,t+dur*0.72);
  g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1100;
  const dly=AC.createDelay(1.0);dly.delayTime.value=0.42;
  const fb=AC.createGain();fb.gain.value=0.3;
  dly.connect(fb);fb.connect(dly);
  const wet=AC.createGain();wet.gain.value=0.35;
  g.connect(lp);lp.connect(master||AC.destination);lp.connect(dly);dly.connect(wet);wet.connect(master||AC.destination);
  [[55,.55],[82.5,.38],[110,.3],[138,.14],[165,.1],[220,.05]].forEach(([f,a])=>{
    const o=AC.createOscillator();o.type=a>0.3?'sawtooth':'triangle';
    o.frequency.setValueAtTime(f*1.012,t);o.frequency.exponentialRampToValueAtTime(f,t+0.8);
    const gg=AC.createGain();gg.gain.value=a;o.connect(gg);gg.connect(g);o.start(t);o.stop(t+dur+0.3);
  });
  if(!soundOn&&master)master.gain.setTargetAtTime(0.55,AC.currentTime,0.1);
}
function gullCry(){
  if(!soundOn||!AC)return;
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
  f.type='bandpass';f.frequency.value=1700;f.Q.value=3;
  o.type='sawtooth';o.frequency.setValueAtTime(900,t);o.frequency.linearRampToValueAtTime(1500,t+0.09);
  o.frequency.linearRampToValueAtTime(700,t+0.3);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.09,t+0.04);g.gain.exponentialRampToValueAtTime(0.0005,t+0.38);
  o.connect(f);f.connect(g);g.connect(master);o.start(t);o.stop(t+0.4);
}

const sunCol=new THREE.Color(),fogCol=new THREE.Color();

function updateSun(force){
  const lat=38.72*DEG,dec=18*DEG;
  const H=(simTime-12)/12*Math.PI;
  const sinEl=Math.sin(dec)*Math.sin(lat)+Math.cos(dec)*Math.cos(lat)*Math.cos(H);
  const el=Math.asin(clamp(sinEl,-1,1));
  const az=Math.atan2(Math.sin(H),Math.cos(H)*Math.sin(lat)-Math.tan(dec)*Math.cos(lat));
  sunDir.set(-Math.sin(az)*Math.cos(el),Math.sin(el),Math.cos(az)*Math.cos(el)).normalize();
  const elDeg=el/DEG;
  night=1-smoothstep(-5,6,elDeg);
  const day=1-night;
  const golden=smoothstep(-2,2,elDeg)*(1-smoothstep(3,16,elDeg));
  skyU['sunPosition'].value.copy(sunDir);
  skyU['turbidity'].value=weather==='clear'?4.5:(weather==='haze'?13:9);
  skyU['rayleigh'].value=weather==='rain'?1.0:lerp(1.4,3.4,golden)+(weather==='haze'?0.4:0);
  skyU['mieCoefficient'].value=weather==='clear'?0.0045:0.011;
  skyU['mieDirectionalG'].value=0.82;
  dir.position.copy(sunDir).multiplyScalar(900).add(V3(shipGroup.position.x,0,shipGroup.position.z));
  dir.target.position.set(shipGroup.position.x,0,shipGroup.position.z);
  const wm=weather==='rain'?0.35:(weather==='haze'?0.65:1);
  sunCol.setHSL(lerp(0.075,0.12,smoothstep(0,22,elDeg)),lerp(0.85,0.18,smoothstep(0,26,elDeg)),lerp(0.5,0.96,smoothstep(-2,20,elDeg)));
  dir.color.copy(sunCol);
  dir.intensity=clamp(smoothstep(-3,9,elDeg)*3.0,0,3.0)*wm;
  dir.castShadow=dir.intensity>0.25;
  moon.position.copy(sunDir).multiplyScalar(-900);
  moon.intensity=night*0.35;
  hemi.intensity=lerp(0.12,0.75,day)*wm+0.08;
  hemi.color.setHSL(0.58,0.45,lerp(0.22,0.72,day));
  hemi.groundColor.setHSL(0.09,0.3,lerp(0.06,0.3,day));
  amb.intensity=lerp(0.16,0.3,day);
  amb.color.setHSL(0.6,0.4,lerp(0.3,0.6,day));
  fogCol.setHSL(lerp(0.60,lerp(0.09,0.58,smoothstep(2,18,elDeg)),day),lerp(0.35,weather==='clear'?0.28:0.12,day),lerp(0.05,lerp(0.55,0.82,smoothstep(0,18,elDeg)),day));
  scene.fog.color.copy(fogCol);
  scene.fog.density=(weather==='rain'?0.00075:(weather==='haze'?0.00055:0.00022))+night*0.00008;
  renderer.toneMappingExposure=lerp(1.25,0.95,day);
  water.material.uniforms['sunDirection'].value.copy(sunDir);
  water.material.uniforms['sunColor'].value.copy(sunCol);
  water.material.uniforms['waterColor'].value.setHSL(0.52,lerp(0.35,0.28,night),lerp(0.085,0.02,night));
  water.material.uniforms['distortionScale'].value=weather==='rain'?4.2:2.6;
  window.stars.material.opacity=night*0.9;
  // night emissives
  const ei=night;
  for(const m of nightMats){
    if(m.emissiveMap)m.emissiveIntensity=ei*1.15;
    else m.emissiveIntensity=ei*(m.userData.ni!==undefined?m.userData.ni:0.3);
  }
  bloom.strength=bloomOn?lerp(0.18,0.95,night)+golden*0.25:0;
  // env map refresh (throttled)
  if(force||Math.abs(sunDir.y-lastSunY)>0.035){
    lastSunY=sunDir.y;
    if(envRT)envRT.dispose();
    skyScene.add(sky);
    envRT=pmrem.fromScene(skyScene);
    scene.add(sky);
    scene.environment=envRT.texture;
  }
}

/* ============================================================ SHIP MOTION */
function shipPose(p){
  const lateral=72*smoothstep(0,0.26,p);
  const west=1780*Math.pow(smoothstep(0.12,1,p),1.2);
  const drift=330*smoothstep(0.2,1,p);
  return {x:-west,z:26+lateral+drift};
}
function updateShip(dt){
  // advance p
  const tgt=ship.target;
  if(Math.abs(ship.p-tgt)>0.0001){
    const dirn=Math.sign(tgt-ship.p);
    const rate=ship.p<0.22?0.0085:lerp(0.0085,0.028,smoothstep(0.22,0.6,ship.p));
    ship.p=clamp(ship.p+dirn*rate*dt*(dirn<0?1.35:1),0,1);
  }
  const p=ship.p;
  const a=shipPose(p),b=shipPose(Math.min(1,p+0.004));
  const dx=b.x-a.x,dz=b.z-a.z;
  let head=0;
  if(Math.hypot(dx,dz)>0.001)head=Math.atan2(dz,-dx);
  head*=smoothstep(0.03,0.16,p);
  if(ship.target<ship.p)head*=1;
  shipGroup.position.set(a.x,0,a.z);
  shipGroup.rotation.y=Math.PI+head;
  shipGroup.position.y=Math.sin(performance.now()*0.00035)*0.12*(1+p*3);
  shipGroup.rotation.z=Math.sin(performance.now()*0.00028)*0.0025*(1+p*4);
  // phase text
  if(p<0.002)ship.phase=ship.target>0?'letting go':'alongside — Jardim do Tabaco';
  else if(p<0.1)ship.phase='tug pushing the bow off';
  else if(p<0.3)ship.phase='swinging into the stream';
  else if(p<0.92)ship.phase='under way — down the Tagus';
  else ship.phase='passing the 25 de Abril bridge';
  if(ship.target<ship.p&&p>0.002)ship.phase='returning to the berth';
  // foam
  const sp=Math.min(1,Math.abs(ship.p-ship.lastP||0)*900);
  ship.lastP=p;
  const moving=smoothstep(0.004,0.08,p)*(Math.abs(ship.target-ship.p)>0.0005?1:0.25);
  window.shipFoam[0].material.opacity=0.65*moving;
  window.shipFoam[1].material.opacity=0.55*moving;
  // gangways
  const ext=1-smoothstep(0.0,0.04,p);
  gangways.forEach((gw,i)=>{
    const lx=i?-66:66;
    const anchor=new THREE.Vector3(lx,12.6,hwAt(lx,0)+0.35);
    shipGroup.localToWorld(anchor);
    const base=gw.base.clone().setY(14.0);
    gw.tower.position.set(gw.base.x,0,gw.base.z);
    const to=anchor.clone().sub(base);
    const dist=Math.max(0.001,to.length());
    gw.g.position.copy(base);
    gw.g.rotation.set(0,Math.atan2(-to.z,to.x),Math.asin(clamp(to.y/dist,-1,1)));
    gw.g.scale.set(Math.max(1.5,dist*ext),1,1);
    gw.g.visible=ext>0.05;
  });
  // mooring lines (rebuilt only while something moves)
  const slack=smoothstep(0,0.022,p);
  const moorMoved=(ship.moorP===undefined)||Math.abs(ship.moorP-p)>0.0004;
  if(moorMoved){
    ship.moorP=p;
    mooring.forEach((mo,i)=>{
      const d=MOOR_DEF[i];
      const a2=d.ship.clone();shipGroup.localToWorld(a2);
      const b2=BOLLARDS[d.bol]||V3(0,3.4,-6.5);
      if(p>0.06){mo.mesh.visible=false;return;}
      mo.mesh.visible=true;
      const pts=[];
      for(let k=0;k<=12;k++){
        const t=k/12;
        const pnt=a2.clone().lerp(b2,t);
        pnt.y-=Math.sin(Math.PI*t)*(1.4+slack*16);
        if(slack>0.45)pnt.y=Math.max(pnt.y,0.35);
        pts.push(pnt);
      }
      mo.mesh.geometry.dispose();
      mo.mesh.geometry=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),14,0.17,5,false);
    });
  }
  // tug behaviour
  tugB.manual=(p>0.001&&p<0.34);
  if(tugB.manual){
    const t2=smoothstep(0.0,0.1,p);
    const pos=new THREE.Vector3(96,0,-26-10*(1-t2));
    shipGroup.localToWorld(pos);
    tug.position.lerp(pos.setY(0),0.05);
    const look=new THREE.Vector3(96,0,0);shipGroup.localToWorld(look);
    const ang=Math.atan2(look.z-tug.position.z,look.x-tug.position.x);
    tug.rotation.y=-ang;
    tugB.wake.material.opacity=0.5;
  }
}

/* ============================================================ ACTORS UPDATE */
const tmpV=new THREE.Vector3(),tmpV2=new THREE.Vector3();
function updateActors(t,dt){
  // crowds
  for(const c of crowds){
    const paths=c.kind==='ship'?SHIPPATHS:PATHS;
    c.agents.forEach((a,i)=>{
      a.t+=a.sp*dt*0.06;if(a.t>1)a.t-=1;
      const path=paths[a.path%paths.length];
      path.getPoint(a.t,tmpV);path.getPoint((a.t+0.004)%1,tmpV2);
      const ang=Math.atan2(tmpV2.x-tmpV.x,tmpV2.z-tmpV.z);
      const off=(i%7-3)*0.9;
      DUM.position.set(tmpV.x+Math.cos(ang)*off,tmpV.y+Math.abs(Math.sin(t*5+a.ph))*0.045,tmpV.z-Math.sin(ang)*off);
      DUM.rotation.set(0,ang,0);
      DUM.scale.set(a.sc,a.sc*(1+Math.sin(t*10+a.ph)*0.012),a.sc);
      DUM.updateMatrix();c.im.setMatrixAt(i,DUM.matrix);
    });
    c.im.instanceMatrix.needsUpdate=true;
  }
  // vehicles
  for(const v of vehicles){
    v.t+=v.speed*dt;if(v.t>1)v.t-=1;
    v.path.getPoint(v.t,tmpV);v.path.getPoint(Math.min(1,v.t+0.01),tmpV2);
    v.g.position.copy(tmpV);
    v.g.rotation.y=Math.atan2(tmpV2.z-tmpV.z,tmpV2.x-tmpV.x)*-1;
  }
  // forklift shuttle
  const ft=(t*0.07)%1;
  const fx=lerp(150,96,Math.abs(Math.sin(ft*Math.PI)));
  forklift.position.set(fx,3.4,-64+Math.sin(ft*Math.PI*2)*6);
  forklift.rotation.y=Math.cos(ft*Math.PI)>0?Math.PI:0;
  forklift.userData.fork.position.y=0.3+Math.abs(Math.sin(t*0.6))*1.6;
  forklift.userData.pal.visible=Math.sin(ft*Math.PI*2)>-0.3;
  // boats
  for(const b of boats){
    if(b.manual)continue;
    b.t+=b.speed*dt;
    if(b.t>1){b.t-=1;}
    b.path.getPoint(b.t%1,tmpV);b.path.getPoint((b.t+0.006)%1,tmpV2);
    b.o.position.set(tmpV.x,Math.sin(t*1.3+b.t*20)*0.25,tmpV.z);
    b.o.rotation.y=Math.atan2(tmpV2.z-tmpV.z,tmpV2.x-tmpV.x)*-1;
    b.o.rotation.z=Math.sin(t*0.9+b.t*14)*0.025;
    b.o.rotation.x=Math.sin(t*1.1+b.t*9)*0.012;
  }
  tug.position.y=Math.sin(t*1.5)*0.2;
  // gulls
  for(const gl of gulls){
    gl.ph+=dt*gl.sp*0.4;
    const x=gl.cx+Math.cos(gl.ph)*gl.r,z=gl.cz+Math.sin(gl.ph)*gl.r*0.7;
    const y=gl.h+Math.sin(gl.ph*2.3)*6;
    gl.g.position.set(x,y,z);
    gl.g.rotation.y=-gl.ph-Math.PI/2;
    gl.g.rotation.z=Math.sin(gl.ph*2.3)*0.12;
    const f=Math.sin(t*gl.flap+gl.ph*3)*0.55;
    gl.wings[0].rotation.x=f;gl.wings[1].rotation.x=-f;
  }
  if(R()<dt*0.25)gullCry();
  // tram
  const tt=(t*0.012)%2;
  const tp=tt<1?tt:2-tt;
  tramPath.getPoint(tp,tmpV);tramPath.getPoint(clamp(tp+(tt<1?0.01:-0.01),0,1),tmpV2);
  tram.position.copy(tmpV);
  tram.rotation.y=Math.atan2(tmpV2.z-tmpV.z,tmpV2.x-tmpV.x)*-1;
  tram.rotation.z=clamp((tmpV2.y-tmpV.y)*0.4,-0.3,0.3)*(tt<1?1:-1);
  // flag
  if(window.flagMesh){
    const p=window.flagMesh.geometry.attributes.position;
    for(let i=0;i<p.count;i++){
      const x=p.getX(i);p.setZ(i,Math.sin(x*1.2+t*4)*0.5*(x+3.5)/7);
    }
    p.needsUpdate=true;
  }
  if(window.radarPivot)window.radarPivot.rotation.y=t*1.6;
  if(window.poolA)window.poolA.material.emissiveIntensity=night*0.7;
  // rain
  if(weather==='rain'){
    rain.pt.visible=true;
    const cp=camera.position;
    for(let i=0;i<rain.n;i++){
      rain.p[i*3+1]-=rain.v[i]*dt;
      if(rain.p[i*3+1]<-2||Math.abs(rain.p[i*3]-cp.x)>200||Math.abs(rain.p[i*3+2]-cp.z)>200){
        rain.p[i*3]=cp.x+rr(-180,180);rain.p[i*3+1]=cp.y+rr(60,160);rain.p[i*3+2]=cp.z+rr(-180,180);
      }
    }
    rain.pt.geometry.attributes.position.needsUpdate=true;
  }else rain.pt.visible=false;
}

/* ============================================================ CAMERA */
const CAMS={
  orbit:{p:V3(330,118,-300),t:V3(-10,34,30)},
  mirad:{p:V3(-96,86,-258),t:V3(10,30,40)},
  quay:{p:V3(118,6.5,-24),t:V3(-10,36,24)},
  aerial:{p:V3(-340,430,-640),t:V3(-80,20,240)},
};
let fly=null;
function flyTo(p,t,dur){
  fly={p0:camera.position.clone(),t0:controls.target.clone(),p1:p.clone(),t1:t.clone(),k:0,dur:dur||1.5};
}
function setCam(mode){
  document.querySelectorAll('#cams button').forEach(b=>b.classList.toggle('on',b.dataset.cam===mode));
  if(walkMode&&mode!=='walk')exitWalk();
  if(mode==='walk'){enterWalk();return;}
  camMode=mode;
  controls.enabled=(mode==='orbit'||mode==='mirad'||mode==='quay'||mode==='aerial');
  if(CAMS[mode]){
    const c=CAMS[mode];
    flyTo(c.p,c.t,1.6);
  }else{lookYaw=0;lookPitch=0;}
}
function enterWalk(){
  walkMode=true;camMode='walk';controls.enabled=false;
  camera.position.set(120,5.1,-22);
  plc.getObject().rotation.set(0,0,0);
  camera.lookAt(0,30,26);
  plc.lock();
  document.getElementById('cross').classList.add('vis');
}
function exitWalk(){
  walkMode=false;document.getElementById('cross').classList.remove('vis');
  if(plc.isLocked)plc.unlock();
  camMode='orbit';controls.enabled=true;controls.target.set(-10,34,30);
  document.querySelectorAll('#cams button').forEach(b=>b.classList.toggle('on',b.dataset.cam==='orbit'));
}
plc.addEventListener('unlock',()=>{if(walkMode)exitWalk();});
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='KeyH'){toggleUI();}
  if(e.code==='Escape'&&walkMode)exitWalk();
});
addEventListener('keyup',e=>keys[e.code]=false);

// drag-look for ferry / deck cams
let dragging=false,lx=0,ly=0;
renderer.domElement.addEventListener('pointerdown',e=>{if(camMode==='ferry'||camMode==='deck'){dragging=true;lx=e.clientX;ly=e.clientY;}});
addEventListener('pointerup',()=>dragging=false);
addEventListener('pointermove',e=>{
  if(!dragging)return;
  lookYaw-=(e.clientX-lx)*0.0032;lookPitch=clamp(lookPitch-(e.clientY-ly)*0.0028,-0.6,0.5);
  lx=e.clientX;ly=e.clientY;
});

function updateCamera(dt,t){
  if(fly){
    fly.k=Math.min(1,fly.k+dt/fly.dur);
    const e=fly.k<.5?4*fly.k**3:1-Math.pow(-2*fly.k+2,3)/2;
    camera.position.lerpVectors(fly.p0,fly.p1,e);
    controls.target.lerpVectors(fly.t0,fly.t1,e);
    if(fly.k>=1)fly=null;
  }
  if(walkMode){
    const sp=(keys['ShiftLeft']?11:4.5)*dt;
    velocity.set(0,0,0);
    if(keys['KeyW']||keys['ArrowUp'])velocity.z+=1;
    if(keys['KeyS']||keys['ArrowDown'])velocity.z-=1;
    if(keys['KeyA']||keys['ArrowLeft'])velocity.x-=1;
    if(keys['KeyD']||keys['ArrowRight'])velocity.x+=1;
    if(velocity.lengthSq()>0){velocity.normalize();plc.moveForward(velocity.z*sp);plc.moveRight(velocity.x*sp);}
    const o=plc.getObject();
    o.position.x=clamp(o.position.x,-420,560);
    o.position.z=clamp(o.position.z,-116,-2.5);
    o.position.y=5.1+Math.sin(t*9)*(velocity.lengthSq()>0?0.045:0);
    return;
  }
  if(camMode==='ferry'){
    const p=boats[2].o.position;
    camera.position.set(p.x,p.y+9.5,p.z);
    const target=new THREE.Vector3(shipGroup.position.x,36,shipGroup.position.z);
    const base=Math.atan2(target.x-p.x,target.z-p.z);
    const d=Math.max(20,Math.hypot(target.x-p.x,target.z-p.z));
    const pitch=Math.atan2(target.y-(p.y+9.5),d);
    const y=base+lookYaw,q=clamp(pitch+lookPitch,-0.8,0.6);
    camera.lookAt(camera.position.x+Math.sin(y)*Math.cos(q)*100,camera.position.y+Math.sin(q)*100,camera.position.z+Math.cos(y)*Math.cos(q)*100);
    return;
  }
  if(camMode==='deck'){
    const lp=new THREE.Vector3(66,58.8,-11);
    shipGroup.localToWorld(lp);
    camera.position.lerp(lp,0.25);
    const target=new THREE.Vector3(10,55,-340);
    const base=Math.atan2(target.x-camera.position.x,target.z-camera.position.z);
    const y=base+lookYaw,q=clamp(lookPitch-0.06,-0.7,0.5);
    camera.lookAt(camera.position.x+Math.sin(y)*Math.cos(q)*100,camera.position.y+Math.sin(q)*100,camera.position.z+Math.cos(y)*Math.cos(q)*100);
    return;
  }
  controls.update();
}

$('hide').onclick=toggleUI;$('show').onclick=toggleUI;
document.querySelectorAll('#cams button').forEach(b=>b.onclick=()=>setCam(b.dataset.cam));
$('time').oninput=e=>{simTime=parseFloat(e.target.value);updateSun(true);};
$('play').onclick=()=>{timePlaying=!timePlaying;$('play').textContent=timePlaying?'❚❚ Pause':'▶ Play';$('play').classList.toggle('on',timePlaying);};
$('speed').onchange=e=>timeSpeed=parseFloat(e.target.value);
$('weather').onchange=e=>{weather=e.target.value;updateSun(true);};
$('depart').onclick=()=>{
  if(ship.target===1&&ship.p>0.5)return;
  ship.target=1;horn(true);
  $('depart').classList.add('on');$('back').classList.remove('on');
};
$('back').onclick=()=>{ship.target=0;horn(false);$('back').classList.add('on');$('depart').classList.remove('on');};
$('horn').onclick=()=>horn(true);
$('snd').onclick=()=>setSound(!soundOn);
$('blm').onclick=()=>{bloomOn=!bloomOn;$('blm').classList.toggle('on',bloomOn);updateSun(true);};

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);
  bloom.setSize(innerWidth,innerHeight);
});

/* ============================================================ LOOP */
let frames=0,fpsT=0,fps=60;
const statEl=$('stat'),clkEl=$('clk'),timeEl=$('time');
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.05),t=clock.elapsedTime;
  if(timePlaying){simTime=(simTime+dt*timeSpeed)%24;timeEl.value=simTime;}
  updateSun(false);
  updateShip(dt);
  updateActors(t,dt);
  updateCamera(dt,t);
  water.material.uniforms['time'].value+=dt*0.55;
  // hud
  frames++;fpsT+=dt;
  if(fpsT>0.5){fps=frames/fpsT;frames=0;fpsT=0;
    const hh=Math.floor(simTime),mm=Math.floor((simTime%1)*60);
    clkEl.textContent=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
    statEl.innerHTML=`<b>AURORA CELESTE</b> · ${ship.phase} &nbsp;|&nbsp; ${weather} &nbsp;|&nbsp; ${fps.toFixed(0)} fps`;
  }
  if(bloomOn)composer.render();else renderer.render(scene,camera);
}

/* ============================================================ START */
const loadEl=$('load'),barEl=document.querySelector('#bar i'),ltxt=$('ltxt');
let step=0;
const steps=['shaping the hull…','tiling Alfama…','raising the castle…','hanging the bridge…','filling the quay…','lighting the Tagus…'];
function boot(){
  barEl.style.width=(18+step*14)+'%';
  ltxt.textContent=steps[Math.min(step,steps.length-1)];
  step++;
  if(step<6){setTimeout(boot,70);return;}
  updateSun(true);
  // warm up shaders
  renderer.compile(scene,camera);
  barEl.style.width='100%';
  setTimeout(()=>{
    loadEl.style.opacity='0';
    setTimeout(()=>loadEl.style.display='none',900);
  },120);
  clock.start();
  tick();
}
setTimeout(boot,60);
</script>
</body>
</html>
