<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURELION VANTA MK-IV — Interactive 3D Build</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --acc:#39d2ff;
    --panel:rgba(13,16,24,.82);
    --line:rgba(255,255,255,.09);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#05060a;font-family:'Chakra Petch',system-ui,sans-serif;color:#cfd6e4}
  #scene{position:fixed;inset:0;touch-action:none;cursor:grab}
  #scene:active{cursor:grabbing}

  /* ------- top-left title ------- */
  #brand{position:fixed;top:22px;left:26px;pointer-events:none;user-select:none;z-index:5}
  #brand h1{font-size:19px;font-weight:700;letter-spacing:.32em;color:#e8edf7;text-transform:uppercase}
  #brand h1 span{color:var(--acc);text-shadow:0 0 14px var(--acc)}
  #brand p{margin-top:5px;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:#5d6779}
  #hint{position:fixed;bottom:18px;left:26px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#49525f;pointer-events:none;user-select:none;z-index:5}

  /* ------- HUD ------- */
  #hud{
    position:fixed;right:18px;bottom:18px;width:262px;z-index:10;
    background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:16px;
    box-shadow:0 18px 50px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
    padding:14px 14px 12px;max-height:calc(100vh - 36px);overflow-y:auto;overflow-x:hidden;
    scrollbar-width:thin;scrollbar-color:#2a3242 transparent;
  }
  #hud::-webkit-scrollbar{width:5px}
  #hud::-webkit-scrollbar-thumb{background:#2a3242;border-radius:3px}

  .hud-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
  .hud-head .t{font-size:10.5px;font-weight:700;letter-spacing:.3em;color:#9aa6ba}
  .statusline{display:flex;align-items:center;gap:6px}
  #statusDot{width:7px;height:7px;border-radius:50%;background:#3a4150;transition:all .4s}
  #statusDot.on{background:var(--acc);box-shadow:0 0 8px var(--acc)}
  #statusDot.boot{background:#ffb347;box-shadow:0 0 8px #ffb347;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.35}}
  #statusTxt{font-size:9px;letter-spacing:.18em;color:#7b8598;text-transform:uppercase}

  .powrow{display:flex;align-items:center;gap:13px;margin-bottom:12px}
  #powerBtn{
    width:58px;height:58px;flex:none;border-radius:50%;cursor:pointer;position:relative;
    border:1px solid rgba(255,255,255,.14);
    background:radial-gradient(circle at 35% 30%, #232a38, #10141d 70%);
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s, box-shadow .45s;
  }
  #powerBtn:hover{transform:scale(1.05)}
  #powerBtn:active{transform:scale(.94)}
  #powerBtn svg{width:22px;height:22px;stroke:#4b5568;stroke-width:2.4;fill:none;stroke-linecap:round;transition:stroke .4s, filter .4s}
  #powerBtn.on{box-shadow:0 0 22px -2px var(--acc), inset 0 0 12px rgba(255,255,255,.06)}
  #powerBtn.on svg{stroke:var(--acc);filter:drop-shadow(0 0 6px var(--acc))}

  .telem{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;font-size:9.5px}
  .telem .k{color:#5d6779;letter-spacing:.14em}
  .telem .v{color:#dfe6f2;text-align:right;font-weight:600;letter-spacing:.06em}
  .telem .v em{font-style:normal;color:#5d6779;font-size:8.5px}

  .sect{border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
  .sect .lbl{font-size:9px;letter-spacing:.26em;color:#5d6779;text-transform:uppercase;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .sect .lbl b{color:#9aa6ba;font-weight:600;letter-spacing:.08em}

  .rgbrow{display:flex;gap:12px;align-items:center;margin-bottom:10px}
  #wheelWrap{position:relative;width:104px;height:104px;flex:none}
  #wheel{width:104px;height:104px;border-radius:50%;cursor:crosshair;display:block;border:1px solid rgba(255,255,255,.12)}
  #wheelDot{position:absolute;width:12px;height:12px;border:2px solid #fff;border-radius:50%;pointer-events:none;box-shadow:0 0 6px rgba(0,0,0,.8);transform:translate(-50%,-50%)}
  .modegrid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .chip{
    font-family:inherit;font-size:9px;letter-spacing:.14em;padding:7px 2px;border-radius:8px;cursor:pointer;
    background:#161b26;border:1px solid var(--line);color:#7b8598;text-transform:uppercase;transition:all .18s;
  }
  .chip:hover{color:#cfd6e4;border-color:rgba(255,255,255,.2)}
  .chip.sel{background:rgba(57,210,255,.13);border-color:var(--acc);color:var(--acc);box-shadow:0 0 10px -3px var(--acc)}
  #swatch{grid-column:1/3;height:9px;border-radius:5px;border:1px solid rgba(255,255,255,.14)}

  .sliderrow{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .sliderrow .sl{width:64px;flex:none;font-size:9px;letter-spacing:.18em;color:#5d6779;text-transform:uppercase}
  .sliderrow output{width:34px;flex:none;text-align:right;font-size:9.5px;color:#9aa6ba;font-weight:600}
  input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;background:#242b3a;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#e8edf7;border:2px solid var(--acc);box-shadow:0 0 8px -1px var(--acc);cursor:grab}
  input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#e8edf7;border:2px solid var(--acc);cursor:grab}

  .btngrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .tbtn{
    font-family:inherit;font-size:8.5px;letter-spacing:.1em;padding:8px 0;border-radius:8px;cursor:pointer;
    background:#161b26;border:1px solid var(--line);color:#7b8598;text-transform:uppercase;transition:all .18s;
  }
  .tbtn:hover{color:#cfd6e4;border-color:rgba(255,255,255,.22)}
  .tbtn:active{transform:scale(.95)}
  .tbtn.sel{background:rgba(57,210,255,.13);border-color:var(--acc);color:var(--acc);box-shadow:0 0 10px -3px var(--acc)}
  .tbtn.warn.sel{background:rgba(255,90,60,.14);border-color:#ff6a4d;color:#ff8a70;box-shadow:0 0 10px -3px #ff6a4d}

  @media (max-width:640px){
    #hud{width:232px;right:10px;bottom:10px}
    #brand h1{font-size:15px}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="brand">
  <h1>AURELION <span>VANTA</span> MK-IV</h1>
  <p>Interactive showcase build · 2077 series</p>
</div>
<div id="hint">Drag&nbsp;·&nbsp;orbit&nbsp;&nbsp;/&nbsp;&nbsp;Scroll&nbsp;·&nbsp;zoom&nbsp;&nbsp;/&nbsp;&nbsp;Click case button&nbsp;·&nbsp;power</div>

<div id="hud">
  <div class="hud-head">
    <div class="t">VANTA&nbsp;CTRL</div>
    <div class="statusline"><div id="statusDot"></div><span id="statusTxt">Offline</span></div>
  </div>

  <div class="powrow">
    <div id="powerBtn" title="Power">
      <svg viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.2 6.5a8 8 0 1 0 11.6 0"/></svg>
    </div>
    <div class="telem">
      <span class="k">CPU</span><span class="v" id="tCpu">—</span>
      <span class="k">GPU</span><span class="v" id="tGpu">—</span>
      <span class="k">FANS</span><span class="v" id="tRpm">—</span>
      <span class="k">PWR</span><span class="v" id="tWatt">—</span>
    </div>
  </div>

  <div class="sect">
    <div class="lbl">RGB Sync <b id="hexLbl">#39D2FF</b></div>
    <div class="rgbrow">
      <div id="wheelWrap"><canvas id="wheel" width="104" height="104"></canvas><div id="wheelDot"></div></div>
      <div class="modegrid">
        <button class="chip sel" data-mode="wave">Wave</button>
        <button class="chip" data-mode="static">Static</button>
        <button class="chip" data-mode="pulse">Pulse</button>
        <button class="chip" data-mode="cycle">Cycle</button>
        <div id="swatch"></div>
      </div>
    </div>
  </div>

  <div class="sect">
    <div class="lbl">System</div>
    <div class="sliderrow"><span class="sl">Fan curve</span><input type="range" id="fanSlider" min="0" max="100" value="42"><output id="fanOut">42%</output></div>
    <div class="sliderrow"><span class="sl">Room light</span><input type="range" id="roomSlider" min="0" max="100" value="55"><output id="roomOut">55%</output></div>
    <div class="btngrid" style="margin-bottom:6px">
      <button class="tbtn" id="btnGlass">Glass</button>
      <button class="tbtn" id="btnOrbit">Orbit</button>
      <button class="tbtn warn" id="btnTurbo">Turbo</button>
      <button class="tbtn" id="btnSound">Audio</button>
    </div>
  </div>

  <div class="sect">
    <div class="lbl">Camera</div>
    <div class="btngrid">
      <button class="tbtn" data-cam="hero">Hero</button>
      <button class="tbtn" data-cam="side">Side</button>
      <button class="tbtn" data-cam="inside">Inside</button>
      <button class="tbtn" data-cam="top">Top</button>
    </div>
  </div>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   CORE SETUP
============================================================ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060a);
scene.fog = new THREE.Fog(0x05060a, 160, 420);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, .5, 900);
camera.position.set(-72, 44, 76);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 25, 0);
controls.enableDamping = true;
controls.dampingFactor = .06;
controls.minDistance = 24;
controls.maxDistance = 220;
controls.maxPolarAngle = Math.PI * .52;
controls.autoRotateSpeed = .9;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .55, .55, .82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ============================================================
   LIGHTS / FLOOR
============================================================ */
const hemi = new THREE.HemisphereLight(0x8899bb, 0x0a0c12, .5);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xdfe8ff, 1.4);
key.position.set(70, 95, 45);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -70; key.shadow.camera.right = 70;
key.shadow.camera.top = 70;  key.shadow.camera.bottom = -70;
key.shadow.camera.far = 260; key.shadow.bias = -0.0006;
scene.add(key);
const rim = new THREE.DirectionalLight(0x5f78ff, .55);
rim.position.set(-80, 40, -70);
scene.add(rim);

// glossy studio floor
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(340, 64),
  new THREE.MeshStandardMaterial({ color:0x0a0c12, roughness:.32, metalness:.75, envMapIntensity:.55 })
);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

// pedestal
const pedestal = new THREE.Mesh(
  new THREE.BoxGeometry(66, 3.2, 60),
  new THREE.MeshStandardMaterial({ color:0x10131c, roughness:.25, metalness:.85, envMapIntensity:.8 })
);
pedestal.position.y = 1.6;
pedestal.castShadow = pedestal.receiveShadow = true;
scene.add(pedestal);

/* ============================================================
   RGB REGISTRY + STATE
============================================================ */
const state = {
  on:false, powerClock:0, mode:'wave',
  hue:.53, sat:1, fan:.42, room:.55,
  turbo:false, glassOpen:false, orbit:false, sound:false,
  cpuT:32, gpuT:28, rpm:0, watt:0,
  fanRamp:0,
};
const RGB = [];   // {mat, off, delay, k, isLight}
function regRGB(mat, off=0, delay=1.0, k=1.6){ RGB.push({mat, off, delay, k, isLight:false}); }
function regLight(light, off=0, delay=1.0, k=1){ RGB.push({mat:light, off, delay, k, isLight:true}); }

const _c = new THREE.Color();
function rgbColor(out, off, t){
  if(state.mode==='wave')       out.setHSL((state.hue + t*.045 + off*.55)%1, state.sat, .55);
  else if(state.mode==='cycle') out.setHSL((t*.06)%1, Math.max(.6,state.sat), .55);
  else                          out.setHSL(state.hue, state.sat, .55);
  if(state.mode==='pulse'){
    const p = .3 + .7*(0.5+0.5*Math.sin(t*2.4 + off*6.283));
    out.multiplyScalar(p);
  }
  return out;
}
// staged power: 0..1 per element
function pw(delay, fade=.6){
  return THREE.MathUtils.smoothstep(state.powerClock, delay, delay+fade);
}

/* ============================================================
   MATERIAL LIBRARY
============================================================ */
const M = {
  alu:      new THREE.MeshStandardMaterial({ color:0x1c2029, roughness:.4,  metalness:.9,  envMapIntensity:.9 }),
  aluLight: new THREE.MeshStandardMaterial({ color:0x2b313f, roughness:.45, metalness:.85, envMapIntensity:.8 }),
  black:    new THREE.MeshStandardMaterial({ color:0x0b0d13, roughness:.55, metalness:.4 }),
  pcb:      new THREE.MeshStandardMaterial({ color:0x0d1118, roughness:.6,  metalness:.3 }),
  gunmetal: new THREE.MeshStandardMaterial({ color:0x161a23, roughness:.28, metalness:.95, envMapIntensity:1.1 }),
  chrome:   new THREE.MeshStandardMaterial({ color:0xb8c2d4, roughness:.12, metalness:1,   envMapIntensity:1.3 }),
  rubber:   new THREE.MeshStandardMaterial({ color:0x0c0d10, roughness:.9,  metalness:.05 }),
  cableBlk: new THREE.MeshStandardMaterial({ color:0x14161c, roughness:.75, metalness:.15 }),
  copper:   new THREE.MeshStandardMaterial({ color:0x9a5b30, roughness:.35, metalness:.95 }),
  glass:    new THREE.MeshPhysicalMaterial({ color:0x9db4cc, roughness:.06, metalness:0, transparent:true, opacity:.14, envMapIntensity:1.5, side:THREE.DoubleSide, depthWrite:false }),
  darkGlass:new THREE.MeshPhysicalMaterial({ color:0x33404f, roughness:.08, metalness:0, transparent:true, opacity:.28, envMapIntensity:1.4, side:THREE.DoubleSide, depthWrite:false }),
};

function textTexture(lines, {w=512,h=128,font='bold 64px Chakra Petch',color='#ffffff',bg=null,align='center'}={}){
  const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
  const g = cv.getContext('2d');
  if(bg){ g.fillStyle=bg; g.fillRect(0,0,w,h); }
  g.font=font; g.fillStyle=color; g.textAlign=align; g.textBaseline='middle';
  const arr = Array.isArray(lines)?lines:[lines];
  arr.forEach((L,i)=> g.fillText(L, align==='center'?w/2:8, h*(i+.5)/arr.length));
  const tx = new THREE.CanvasTexture(cv);
  tx.colorSpace = THREE.SRGBColorSpace;
  tx.anisotropy = 4;
  return tx;
}
function label(text, w, h, opts={}){
  const tx = textTexture(text, Object.assign({w:Math.round(w*40),h:Math.round(h*40)},opts));
  const m = new THREE.MeshBasicMaterial({ map:tx, transparent:true, depthWrite:false, toneMapped:false });
  return { mesh:new THREE.Mesh(new THREE.PlaneGeometry(w,h), m), mat:m };
}

/* ============================================================
   FAN FACTORY  (axis = +Z, rotor spins around Z)
============================================================ */
const rotors = []; // {mesh, dir}
function makeFan(size, {ringDelay=1.2, ringOff=0, dir=1}={}){
  const g = new THREE.Group();
  const R = size/2, d = size*.2;
  // frame with round hole
  const sh = new THREE.Shape();
  const s = R;
  sh.moveTo(-s,-s); sh.lineTo(s,-s); sh.lineTo(s,s); sh.lineTo(-s,s); sh.closePath();
  const hole = new THREE.Path().absarc(0,0,R*.93,0,Math.PI*2,true);
  sh.holes.push(hole);
  const frame = new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:d,bevelEnabled:false}), M.black);
  frame.position.z = -d/2;
  g.add(frame);
  // corner screws
  const scrGeo = new THREE.CylinderGeometry(size*.03, size*.03, d+.1, 8);
  for(const [sx,sy] of [[-1,-1],[1,-1],[1,1],[-1,1]]){
    const sc = new THREE.Mesh(scrGeo, M.chrome);
    sc.rotation.x = Math.PI/2;
    sc.position.set(sx*R*.86, sy*R*.86, 0);
    g.add(sc);
  }
  // rotor: hub + 9 blades
  const rotor = new THREE.Group();
  const hubR = R*.32;
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(hubR,hubR,d*.85,24), M.gunmetal);
  hub.rotation.x = Math.PI/2;
  rotor.add(hub);
  const cap = new THREE.Mesh(new THREE.CircleGeometry(hubR*.7,24),
    new THREE.MeshBasicMaterial({ color:0x000000, toneMapped:false }));
  cap.position.z = d*.44;
  regRGB(cap.material, ringOff+.1, ringDelay+.15, 1.2);
  rotor.add(cap);
  // blade shape
  const b = new THREE.Shape();
  const oR = R*.9;
  b.moveTo(hubR*.9, -size*.045);
  b.quadraticCurveTo((hubR+oR)/2, -size*.14, oR, -size*.1);
  b.lineTo(oR, size*.085);
  b.quadraticCurveTo((hubR+oR)/2, size*.05, hubR*.9, size*.045);
  b.closePath();
  const bladeGeo = new THREE.ExtrudeGeometry(b,{depth:size*.012,bevelEnabled:false});
  const bladeMat = new THREE.MeshStandardMaterial({ color:0x11141b, roughness:.35, metalness:.5, envMapIntensity:.7, side:THREE.DoubleSide });
  for(let i=0;i<9;i++){
    const bl = new THREE.Mesh(bladeGeo, bladeMat);
    bl.rotation.x = .52;                 // pitch
    const holder = new THREE.Group();
    holder.rotation.z = i/9*Math.PI*2;
    holder.add(bl);
    rotor.add(holder);
  }
  g.add(rotor);
  rotors.push({mesh:rotor, dir});
  // RGB halo ring
  const ring = new THREE.Mesh(new THREE.TorusGeometry(R*.82, size*.021, 8, 48),
    new THREE.MeshBasicMaterial({ color:0x000000, toneMapped:false }));
  ring.position.z = d*.42;
  regRGB(ring.material, ringOff, ringDelay);
  g.add(ring);
  const ring2 = ring.clone();
  ring2.material = ring.material;
  ring2.position.z = -d*.42;
  g.add(ring2);
  return g;
}

/* ============================================================
   THE PC  — case: W 24 (x), H 50 (y), D 46 (z). front = +z, glass = -x
============================================================ */
const pc = new THREE.Group();
pc.position.y = 4.9;
scene.add(pc);
const shadowOn = m => { m.castShadow = true; return m; };

/* ---- frame skeleton ---- */
{
  const t = 1.6, W=24, H=50, D=46;
  const beam = (sx,sy,sz,x,y,z)=>{
    const m = new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz), M.alu);
    m.position.set(x,y,z); pc.add(shadowOn(m)); return m;
  };
  // 4 vertical pillars
  for(const [x,z] of [[-W/2,D/2],[W/2,D/2],[-W/2,-D/2],[W/2,-D/2]])
    beam(t, H, t, x, H/2, z);
  // top + bottom rails
  for(const y of [t/2, H-t/2]){
    beam(W, t, t, 0, y,  D/2);
    beam(W, t, t, 0, y, -D/2);
    beam(t, t, D, -W/2, y, 0);
    beam(t, t, D,  W/2, y, 0);
  }
  // bottom deck & top deck
  const deck = beam(W-1, 1, D-1, 0, .8, 0);
  deck.material = M.gunmetal;
  // top perforated panel (slightly raised for airflow gap)
  const top = new THREE.Mesh(new THREE.BoxGeometry(W-2.5, .7, D-3), M.aluLight);
  top.position.set(0, H+0.8, 0); pc.add(shadowOn(top));
  // top vent slats
  for(let i=0;i<11;i++){
    const sl = new THREE.Mesh(new THREE.BoxGeometry(W-4, .3, 1.4), M.black);
    sl.position.set(0, H+1.3, -19 + i*3.5);
    pc.add(sl);
  }
  // feet (case floats above pedestal on 4 machined feet)
  for(const [x,z] of [[-9,18],[9,18],[-9,-18],[9,-18]]){
    const f = new THREE.Mesh(new THREE.CylinderGeometry(1.5,2,1.7,20), M.gunmetal);
    f.position.set(x, -0.85, z);
    pc.add(shadowOn(f));
  }
}

/* ---- right side solid panel (behind motherboard) ---- */
{
  const p = new THREE.Mesh(new THREE.BoxGeometry(.8, 46.5, 43), M.alu);
  p.position.set(12.1, 25, 0);
  pc.add(shadowOn(p));
  const deco = label('A U R E L I O N', 26, 3, {font:'600 52px Chakra Petch', color:'#3a4353'});
  deco.mesh.rotation.y = Math.PI/2;
  deco.mesh.position.set(12.6, 25, 0);
  pc.add(deco.mesh);

/* ============================================================
   AUDIO — subtle fan hum + boot chime
============================================================ */
let AC=null, humGain=null, humFilter=null;
function initAudio(){
  if(AC) return;
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    const len = AC.sampleRate*2;
    const buf = AC.createBuffer(1, len, AC.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const src = AC.createBufferSource();
    src.buffer = buf; src.loop = true;
    humFilter = AC.createBiquadFilter();
    humFilter.type='bandpass'; humFilter.frequency.value=140; humFilter.Q.value=.8;
    humGain = AC.createGain(); humGain.gain.value = 0;
    src.connect(humFilter).connect(humGain).connect(AC.destination);
    src.start();
  }catch(e){ /* audio unavailable */ }
}
function chime(up=true){
  if(!AC || !state.sound) return;
  const o = AC.createOscillator(), gn = AC.createGain();
  o.type='sine';
  const t0 = AC.currentTime;
  o.frequency.setValueAtTime(up? 440: 660, t0);
  o.frequency.exponentialRampToValueAtTime(up? 880: 220, t0+.28);
  gn.gain.setValueAtTime(.0001,t0);
  gn.gain.exponentialRampToValueAtTime(.06,t0+.04);
  gn.gain.exponentialRampToValueAtTime(.0001,t0+.5);
  o.connect(gn).connect(AC.destination);
  o.start(t0); o.stop(t0+.55);
}

// color wheel
const wheel = $('wheel'), wheelDot = $('wheelDot'), wctx = wheel.getContext('2d');
{
  const img = wctx.createImageData(104,104), D=img.data, R=52;
  for(let y=0;y<104;y++) for(let x=0;x<104;x++){
    const dx=x-R, dy=y-R, r=Math.hypot(dx,dy), i=(y*104+x)*4;
    if(r>R){ D[i+3]=0; continue; }
    const h=(Math.atan2(dy,dx)/(Math.PI*2)+1)%1, s=Math.min(1,r/R);
    _c.setHSL(h, s, .5 + .5*(1-s)*.9); // hue/sat disc: white core -> saturated rim
    D[i]=_c.r*255; D[i+1]=_c.g*255; D[i+2]=_c.b*255;
    D[i+3]= r>R-1.5 ? (R-r)/1.5*255 : 255;
  }
  wctx.putImageData(img,0,0);
}
function setWheelDot(){
  const a = state.hue*Math.PI*2, r = state.sat*52;
  wheelDot.style.left = (52 + Math.cos(a)*r)+'px';
  wheelDot.style.top  = (52 + Math.sin(a)*r)+'px';
  _c.setHSL(state.hue, state.sat, .55);
  const hex = '#'+_c.getHexString();
  $('swatch').style.background = hex;
  $('hexLbl').textContent = hex.toUpperCase();
  document.documentElement.style.setProperty('--acc', hex);
}
function pickWheel(e){
  const rc = wheel.getBoundingClientRect();
  const dx = e.clientX-rc.left-52, dy = e.clientY-rc.top-52;
  state.hue = (Math.atan2(dy,dx)/(Math.PI*2)+1)%1;
  state.sat = Math.min(1, Math.hypot(dx,dy)/52);
  setWheelDot();
}
let wheelDown = false;
wheel.addEventListener('pointerdown', e=>{ wheelDown=true; wheel.setPointerCapture(e.pointerId); pickWheel(e); });
wheel.addEventListener('pointermove', e=>{ if(wheelDown) pickWheel(e); });
wheel.addEventListener('pointerup', ()=> wheelDown=false);
setWheelDot();

// sliders
$('fanSlider').addEventListener('input', e=>{ state.fan = e.target.value/100; $('fanOut').textContent = e.target.value+'%'; });
$('roomSlider').addEventListener('input', e=>{ state.room = e.target.value/100; $('roomOut').textContent = e.target.value+'%'; });

// toggles
$('btnGlass').addEventListener('click', function(){ state.glassOpen=!state.glassOpen; this.classList.toggle('sel', state.glassOpen); });
$('btnOrbit').addEventListener('click', function(){ state.orbit=!state.orbit; this.classList.toggle('sel', state.orbit); controls.autoRotate = state.orbit; });
$('btnTurbo').addEventListener('click', function(){ state.turbo=!state.turbo; this.classList.toggle('sel', state.turbo); chime(state.turbo); });
$('btnSound').addEventListener('click', function(){ state.sound=!state.sound; this.classList.toggle('sel', state.sound); initAudio(); if(AC&&AC.state==='suspended')AC.resume(); });

/* ---- camera presets ---- */
const camTween = { active:false, t:0, dur:1.4, p0:new THREE.Vector3(), p1:new THREE.Vector3(), t0:new THREE.Vector3(), t1:new THREE.Vector3() };
const CAMS = {
  hero:   { p:[-72,44,76],  t:[0,25,0] },
  side:   { p:[-95,30,6],   t:[0,26,0] },
  inside: { p:[-30,32,20],  t:[4,30,-6] },
  top:    { p:[-30,105,42], t:[0,26,0] },
};
document.querySelectorAll('[data-cam]').forEach(b=>{
  b.addEventListener('click', ()=>{
    const c = CAMS[b.dataset.cam];
    camTween.p0.copy(camera.position); camTween.p1.fromArray(c.p);
    camTween.t0.copy(controls.target);  camTween.t1.fromArray(c.t);
    camTween.t = 0; camTween.active = true;
  });
});
canvas.addEventListener('pointerdown', ()=> camTween.active = false);

/* ---- raycast: click the physical case button ---- */
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let downPos = null;
canvas.addEventListener('pointerdown', e=> downPos=[e.clientX,e.clientY]);
canvas.addEventListener('pointerup', e=>{
  if(!downPos) return;
  const moved = Math.hypot(e.clientX-downPos[0], e.clientY-downPos[1]);
  downPos = null;
  if(moved > 6) return;
  mouse.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(mouse, camera);
  if(ray.intersectObjects([caseBtn, caseBtnRing]).length) setPower(!state.on);
});
canvas.addEventListener('pointermove', e=>{
  mouse.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(mouse, camera);
  canvas.style.cursor = ray.intersectObjects([caseBtn, caseBtnRing]).length ? 'pointer' : '';
});

/* ============================================================
   MAIN LOOP
============================================================ */
const clock = new THREE.Clock();
let telemTick = 0;
const easeIO = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  const t = clock.elapsedTime;

  // staged power clock: boot takes ~3.2s, shutdown ~1.4s
  state.powerClock = THREE.MathUtils.clamp(
    state.powerClock + (state.on ? dt : -dt*2.4), 0, 3.4);
  const pPower = pw(0, .4);

  // ---- fan speed / ramp ----
  const fanTarget = state.on ? pw(.5, 1.6) * (state.turbo ? 1 : .25 + state.fan*.75) : 0;
  state.fanRamp += (fanTarget - state.fanRamp) * Math.min(1, dt*1.8);
  const spin = state.fanRamp * 26;
  for(const r of rotors) r.mesh.rotation.z += spin * r.dir * dt;
  state.rpm = state.fanRamp * 2300;

  // ---- pump ring slow rotation ----
  pumpRing.rotation.x += dt * pw(1.2) * 1.1;

  // ---- RGB updates ----
  for(const e of RGB){
    rgbColor(_c, e.off, t);
    const gate = pw(e.delay);
    if(e.isLight){
      e.mat.color.copy(_c);
      e.mat.intensity = gate * e.k * (state.mode==='pulse'?1:.85);
    } else {
      e.mat.color.copy(_c).multiplyScalar(gate * e.k);
    }
  }
  // case power button ring: dim amber standby when off, RGB when on
  if(state.powerClock < .05){
    caseBtnRing.material.color.setRGB(.28,.1,.02);
  } else {
    rgbColor(_c, 0, t);
    caseBtnRing.material.color.copy(_c).multiplyScalar(.4 + pPower*1.4);
  }

  // ---- glass panel slide ----
  const gx = state.glassOpen ? glassHomeX - 13 : glassHomeX;
  glassSide.position.x += (gx - glassSide.position.x) * Math.min(1, dt*4);
  glassSide.position.z += ((state.glassOpen? 8:0) - glassSide.position.z) * Math.min(1, dt*4);

  // ---- room lighting ----
  const room = state.room;
  key.intensity  = .15 + room*1.6;
  hemi.intensity = .08 + room*.55;
  rim.intensity  = .2 + room*.45;
  bloom.strength = .8 - room*.42;

  // ---- dust ----
  dustMat.opacity = pw(1.6) * .5;
  if(dustMat.opacity > .01){
    const pos = dust.geometry.attributes.position, seed = dust.userData.seed;
    for(let i=0;i<pos.count;i++){
      let y = pos.getY(i) + dt*(0.5 + state.fanRamp*2.2);
      if(y > 49){ y = 12; }
      pos.setY(i, y);
      pos.setX(i, pos.getX(i) + Math.sin(t*.7+seed[i])*dt*.25);
    }
    pos.needsUpdate = true;
  }

  // ---- telemetry sim ----
  const load = state.on ? (state.turbo ? 1 : .35) : 0;
  const cool = .35 + state.fanRamp*.65;
  const cpuTgt = state.on ? 34 + load*52/cool*.62 : 24;
  const gpuTgt = state.on ? 30 + load*46/cool*.62 : 24;
  state.cpuT += (cpuTgt + Math.sin(t*.8)*1.2 - state.cpuT)*dt*.5;
  state.gpuT += (gpuTgt + Math.sin(t*.6+2)*1.4 - state.gpuT)*dt*.5;
  state.watt = state.on ? Math.round(90 + load*640*pw(.4) + Math.sin(t*2)*8) : 0;

  telemTick += dt;
  if(telemTick > .25){
    telemTick = 0;
    drawOLED(t);
    $('tCpu').textContent = state.on ? Math.round(state.cpuT)+'°C' : '—';
    $('tGpu').textContent = state.on ? Math.round(state.gpuT)+'°C' : '—';
    $('tRpm').textContent = state.on ? Math.round(state.rpm)+' rpm' : '—';
    $('tWatt').textContent = state.on ? state.watt+' W' : '—';
    const booting = state.on && state.powerClock < 3.1;
    statusDot.className = state.on ? (booting?'boot':'on') : '';
    statusTxt.textContent = state.on ? (booting ? 'Booting' : (state.turbo?'Turbo':'Online')) : 'Offline';
  }

  // ---- audio hum ----
  if(humGain){
    const vol = state.sound ? state.fanRamp*.055 : 0;
    humGain.gain.value += (vol - humGain.gain.value)*Math.min(1,dt*5);
    if(humFilter) humFilter.frequency.value = 90 + state.fanRamp*160;
  }

  // ---- camera tween ----
  if(camTween.active){
    camTween.t += dt/camTween.dur;
    const k = easeIO(Math.min(1,camTween.t));
    camera.position.lerpVectors(camTween.p0, camTween.p1, k);
    controls.target.lerpVectors(camTween.t0, camTween.t1, k);
    if(camTween.t >= 1) camTween.active = false;
  }

  controls.update();
  composer.render();
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
