  document.getElementById('btn-rack').classList.add('active');
  document.getElementById('btn-slice').classList.remove('active');
  document.getElementById('rack-cam-section').style.display = 'block';
  document.getElementById('slice-cam-section').style.display = 'none';
  document.getElementById('rack-power-section').style.display = 'block';

  // Restore
  state.coverOpen = false;
  state.cutaway = false;
  state.exploded = false;
  state.showAirflow = false;
  state.showPower = false;
  state.showData = false;
  state.failures = { fan:false, psu:false, drive:false, gpu:false, net:false };
  airflowGroup.visible = false;
  pathGroup.visible = false;

  state.transition = { type: 'toRack', t: 0, duration: 1.0 };
}

// Move selected server to slice holder; during transition, we animate both visibility
function detachToSlice(srv) {
  // Clone? No - we want the SAME server visible. Strategy: remove srv from rackGroupServers, add to sliceSceneHolder, reset its local transform
  rackGroupServers.remove(srv);
  sliceSceneHolder.add(srv);
  // Server will be positioned at origin by animate (when transition starts, server is offset by the slide amount; we interpolate from rack position to origin)
  srv.position.set(0,0,0);
  srv.rotation.set(0,0,0);
  srv.scale.setScalar(1);
  sliceSceneHolder.visible = true;
  // Position sliceSceneHolder for good viewing
  sliceSceneHolder.position.set(0, 0, 0);
  // High detail: ensure all internals visible
  srv.userData.internals.visible = true;
  srv.userData.topCover.visible = true;
  // Build airflow and paths relative to this server
  rebuildAirflowFor(srv);
  buildPathsForServer(srv);
}

function reattachFromSlice(srv) {
  sliceSceneHolder.remove(srv);
  rackGroupServers.add(srv);
  srv.position.copy(srv.userData.basePos);
  srv.rotation.copy(srv.userData.baseRot);
  srv.scale.setScalar(1);
  sliceSceneHolder.visible = false;
  // Reset cover
  resetExploded(srv);
  srv.userData.topCover.position.y = srv.userData.h/2 + 0.0015;
  srv.userData.topCover.visible = true;
  // Reset all materials
  resetCutaway(srv);
  // Hide airflow/path groups
  airflowGroup.visible = state.showAirflow;
  pathGroup.visible = state.showPower || state.showData;
  updateRightPanel();
}

function rebuildAirflowFor(srv) {
  // Airflow group already has particles; we'll move them in local server coords? For simplicity, keep them in world space positioned at server world origin. In slice mode server is at world (0,0,0)
  // Particles initialized along z; we can keep them as-is
  airflowGroup.position.set(0,0,0);
}

// =================================================================
// COVER / CUTAWAY / EXPLODE
// =================================================================
function toggleCover(open) {
  if (!state.selectedServer) return;
  state.coverOpen = open;
  const tc = state.selectedServer.userData.topCover;
  // Animate to target
  const targetY = open ? state.selectedServer.userData.h/2 + 0.15 : state.selectedServer.userData.h/2 + 0.0015;
  const targetZ = open ? 0.2 : 0;
  state.animProps = state.animProps || {};
  state.animProps.cover = { targetY, targetZ, obj: tc };
  document.getElementById('btn-cover').classList.toggle('active', open);
  document.getElementById('btn-cover').textContent = open ? 'Close Cover' : 'Open Cover';
}

function toggleCutaway(on) {
  state.cutaway = on;
  if (!state.selectedServer) return;
  const srv = state.selectedServer;
  // Hide side walls, top cover already handled
  srv.children.forEach(ch => {
    if (ch === srv.userData.topCover) return;
    // Hide walls / tray if they are structural
    if (ch.userData && ch.userData.cutawayHide) ch.visible = !on;
  });
  document.getElementById('btn-cutaway').classList.toggle('active', on);
}

function toggleExplode(on) {
  state.exploded = on;
  if (!state.selectedServer) return;
  const srv = state.selectedServer;
  // Animate positions of major sub-groups
  const groups = [
    { obj: srv.userData.topCover, dy: 0.20, dz: 0.1 },
  ];
  if (srv.userData.driveCage) groups.push({ obj: srv.userData.driveCage, dz: -0.15, dy: -0.02 });
  if (srv.userData.airDuct) groups.push({ obj: srv.userData.airDuct, dy: 0.08 });
  // Fan modules lift slightly
  // CPU/heatsinks lift? for simplicity move CPUs up
  srv.userData.cpus.forEach((c,i) => groups.push({ obj: c, dy: 0.06 + i*0.01 }));
  srv.userData.gpus.forEach((g,i) => groups.push({ obj: g, dy: 0.10 + i*0.005, dz: 0.05 }));
  // PSUs move back
  srv.userData.psus.forEach((p,i) => groups.push({ obj: p, dz: 0.12, dx: (i%2?-0.02:0.02) }));
  // Store base positions for restore
  if (!srv.userData.explodeState) {
    srv.userData.explodeState = groups.map(g => ({
      obj: g.obj,
      basePos: g.obj.position.clone()
    }));
  }
  groups.forEach((g, i) => {
    const es = srv.userData.explodeState[i];
    const target = on ? es.basePos.clone().add(new THREE.Vector3(g.dx||0, g.dy||0, g.dz||0)) : es.basePos;
    state.animProps = state.animProps || {};
    state.animProps['exp'+i] = { targetPos: target, obj: g.obj };
  });
  document.getElementById('btn-explode').classList.toggle('active', on);
}

function resetExploded(srv) {
  if (!srv.userData.explodeState) return;
  srv.userData.explodeState.forEach(es => { es.obj.position.copy(es.basePos); });
}

function resetCutaway(srv) {
  srv.traverse(o => {
    if (o.isMesh && o.userData.cutawayHide) o.visible = true;
  });
}

// =================================================================
// ANIMATION LOOP
// =================================================================
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let mouseNDC = new THREE.Vector2();
const clock = new THREE.Clock();
let fpsTime = 0;
let fpsCount = 0;
let fps = 0;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  requestAnimationFrame(animate);

  // Camera transition
  if (state.targetCamPos) {
    camera.position.lerp(state.targetCamPos, Math.min(1, dt * 4));
    controls.target.lerp(state.targetCamTarget, Math.min(1, dt * 4));
    if (camera.position.distanceTo(state.targetCamPos) < 0.005) state.targetCamPos = null;
  }

  controls.update();

  // Process transition
  if (state.transition) {
    state.transition.t += dt;
    const tt = Math.min(1, state.transition.t / state.transition.duration);
    const ease = tt<0.5? 2*tt*tt : 1 - Math.pow(-2*tt+2, 2)/2;

    if (state.transition.type === 'toSlice') {
      const srv = state.selectedServer;
      if (tt === 1) {
        // Finalize: detach server to slice scene at matching world position, then tween holder to origin
        if (srv.parent !== sliceSceneHolder) {
          const worldPos = new THREE.Vector3();
          srv.getWorldPosition(worldPos);
          detachToSlice(srv);
          sliceSceneHolder.position.copy(worldPos);
          // store holder start/end
          state.transition.holderStart = worldPos.clone();
          state.transition.holderEnd = new THREE.Vector3(0,0,0);
        }
        state.transition.phase = 2;
        state.transition.t = 0;
        state.transition.duration = 0.6;
        rackGroup.visible = false;
      } else if (state.transition.phase === 2) {
        // Tween sliceSceneHolder from server's world pos to origin
        sliceSceneHolder.position.lerpVectors(state.transition.holderStart, state.transition.holderEnd, ease);
        // Camera goes to slice whole view
        const targetCam = new THREE.Vector3(0.55, 0.55, 0.7);
        camera.position.lerp(targetCam, dt * 3);
        controls.target.lerp(new THREE.Vector3(0,0,0), dt * 3);
        if (tt === 1) {
          state.transition = null;
          sliceSceneHolder.position.set(0,0,0);
          setSliceCamera('whole');
          updateRightPanel();
        }
      } else {
        // Phase 1: slide server out forward and lift slightly, rack stays until ~0.7
        if (srv.parent === rackGroupServers) {
          const base = srv.userData.basePos;
          const slideZ = -0.5;
          const liftY = 0.0;
          const pullX = 0;
          srv.position.set(base.x + pullX * ease, base.y + liftY * ease, base.z + slideZ * ease);
          rackGroupServers.children.forEach(c => {
            if (c !== srv) c.visible = ease < 0.7;
          });
          if (ease > 0.6) rackGroup.visible = false;
        }
        // Camera orbits to look at server's current world position
        const worldPos = new THREE.Vector3();
        srv.getWorldPosition(worldPos);
        const dist = 1.2;
        const camTarget = worldPos.clone().add(new THREE.Vector3(dist*0.5, dist*0.4, dist*0.7));
        camera.position.lerp(camTarget, dt * 3);
        controls.target.lerp(worldPos, dt * 3);
      }
    } else if (state.transition.type === 'toRack') {
      if (tt === 1 && state.transition.phase !== 2) {
        // Phase 2: server is back in rack
        if (state.selectedServer && state.selectedServer.parent !== rackGroupServers) {
          reattachFromSlice(state.selectedServer);
        }
        rackGroup.visible = true;
        rackGroupServers.children.forEach(c => c.visible = true);
        state.selectedComponent = null;
        state.transition = null;
        updateRightPanel();
        setRackCamera('34');
      } else if (!state.transition.phase) {
        // Phase 1: fly sliceHolder back to server's rack base position
        const srv = state.selectedServer;
        if (!state.transition.startPos) {
          state.transition.startPos = sliceSceneHolder.position.clone();
          state.transition.endPos = srv.userData.basePos.clone();
        }
        sliceSceneHolder.position.lerpVectors(state.transition.startPos, state.transition.endPos, ease);
        const camPos = state.transition.endPos.clone().add(new THREE.Vector3(1.6, 1.2, 2.2));
        const camTgt = state.transition.endPos.clone().add(new THREE.Vector3(0, 0.2, 0));
        camera.position.lerp(camPos, dt * 3);
        controls.target.lerp(new THREE.Vector3(0, RACK_H/2, 0), dt * 3);
        rackGroup.visible = ease > 0.4;
        rackGroupServers.children.forEach(c => c.visible = ease > 0.5);
        if (tt === 1) {
          state.transition.phase = 2;
          state.transition.t = 0;
          state.transition.duration = 0.3;
        }
      } else {
        // Phase 2: finalize server snapping into rail
        if (state.selectedServer && state.selectedServer.parent !== rackGroupServers) {
          reattachFromSlice(state.selectedServer);
        }
        rackGroup.visible = true;
        rackGroupServers.children.forEach(c => c.visible = true);
        state.selectedComponent = null;
        state.transition = null;
        updateRightPanel();
        setRackCamera('34');
      }
    }
  }

  // Animate properties
  if (state.animProps) {
    Object.keys(state.animProps).forEach(k => {
      const ap = state.animProps[k];
      if (ap.targetY !== undefined) {
        ap.obj.position.y += (ap.targetY - ap.obj.position.y) * Math.min(1, dt*6);
        if (Math.abs(ap.obj.position.y - ap.targetY) < 0.001) ap.obj.position.y = ap.targetY;
      }
      if (ap.targetZ !== undefined) {
        ap.obj.position.z += (ap.targetZ - ap.obj.position.z) * Math.min(1, dt*6);
      }
      if (ap.targetPos) {
        ap.obj.position.lerp(ap.targetPos, Math.min(1, dt*6));
      }
    });
  }

  // Fan rotation
  const activeSrv = state.mode === 'slice' ? state.selectedServer : null;
  rackServers.forEach(srv => {
    srv.userData.fans.forEach(fan => {
      const baseRPM = 9000 + srv.userData.def.u * 500;
      let rpm = baseRPM;
      // Fan failure?
      if (state.failures.fan && fan.userData.index === 0 && srv === activeSrv) {
        rpm = 0;
        fan.userData.status = 'failed';
        if (fan.userData.led) fan.userData.led.material = M.ledRed;
      } else {
        fan.userData.status = 'ok';
        if (fan.userData.led) fan.userData.led.material = M.ledGreen;
      }
      // GPU overheat increases RPM
      if (state.failures.gpu && srv === activeSrv) rpm *= 1.4;
      if (state.failures.fan && fan.userData.index > 0 && srv === activeSrv) rpm *= 1.3;
      fan.userData.rpm = rpm;
      if (fan.userData.blades) fan.userData.blades.rotation.z += rpm * dt * 0.0001;
    });
  });

  // PSU failure
  if (state.selectedServer && state.failures.psu) {
    const psu = state.selectedServer.userData.psus[0];
    if (psu && psu.userData.status === 'ok') {
      psu.userData.status = 'failed';
      if (psu.userData.led) psu.userData.led.material = M.ledRed;
    }
  } else if (state.selectedServer) {
    state.selectedServer.userData.psus.forEach(p => {
      p.userData.status = 'ok';
      if (p.userData.led) p.userData.led.material = M.ledGreen;
    });
  }

  // Drive failure
  if (state.selectedServer && state.failures.drive) {
    const drv = state.selectedServer.userData.drives[0];
    if (drv) { drv.userData.status = 'failed'; if (drv.userData.led) drv.userData.led.material = M.ledRed; }
  } else if (state.selectedServer) {
    state.selectedServer.userData.drives.forEach(d => { d.userData.status = 'ok'; if (d.userData.led) d.userData.led.material = M.ledGreen; });
  }

  // Temperatures drift
  rackServers.forEach(srv => {
    srv.userData.cpus.forEach((c, i) => {
      let target = 55 + Math.sin(t*0.2 + i + srv.userData.rackIdx)*3 + 15;
      if (state.failures.fan && srv === activeSrv) target = 85;
      if (state.failures.gpu && srv === activeSrv) target += 5;
      c.userData.temp += (target - c.userData.temp) * dt * 0.3;
    });
    srv.userData.gpus.forEach((g,i) => {
      let target = 65 + Math.sin(t*0.3 + i)*4 + 8;
      if (state.failures.gpu && srv === activeSrv) target = 92;
      if (state.failures.fan && srv === activeSrv) target += 8;
      g.userData.temp += (target - g.userData.temp) * dt * 0.2;
    });
  });

  // Airflow particles
  if (state.showAirflow && state.mode === 'slice' && state.selectedServer) {
    airflowGroup.visible = true;
    // airflowGroup is already child of sliceSceneHolder at local (0,0,0), same as server
    airflowGroup.position.set(0,0,0);
    const dummy = new THREE.Object3D();
    const srv = state.selectedServer;
    const ch = srv.userData.h;
    for (let i = 0; i < AIRFLOW_COUNT; i++) {
      airflowParticles.getMatrixAt(i, dummy.matrix);
      dummy.matrix.decompose(dummy.position, dummy.quaternion, dummy.scale);
      // Move along +z (front to rear)
      dummy.position.z += airflowVelocities[i] * dt * 4;
      // Slight upward drift as air warms
      dummy.position.y += 0.002 * dt;

      // Avoid solid obstacles: if inside GPU area, route around/through (simplified: continue but add slight lateral spread)
      const gpuZoneZ = 0.05;
      if (dummy.position.z > gpuZoneZ && srv.userData.gpus.length > 0) {
        // Jitter to show passing between GPUs
        dummy.position.x += Math.sin(t + i) * 0.0005;
      }

      if (dummy.position.z > CHASSIS_D/2 + 0.05) {
        // reset
        dummy.position.set((Math.random()-0.5) * (CHASSIS_W-0.06),
                           (Math.random()-0.5) * (ch*0.6),
                           -CHASSIS_D/2 - 0.05);
      }
      dummy.updateMatrix();
      airflowParticles.setMatrixAt(i, dummy.matrix);
    }
    airflowParticles.instanceMatrix.needsUpdate = true;
  } else {
    airflowGroup.visible = false;
  }

  // Path lines pulse
  if (state.showPower || state.showData) {
    pathGroup.visible = true;
    pathGroup.position.set(0,0,0);
    powerLines.forEach(l => l.visible = state.showPower);
    dataLines.forEach(l => l.visible = state.showData);
    if (state.mode === 'slice' && state.selectedServer) animatePathLines(t);
  } else {
    pathGroup.visible = false;
  }

  // Health panel update periodically
  if (Math.floor(t*2) !== Math.floor((t-dt)*2)) {
    if (state.mode === 'slice') updateHealthPanel();
  }

  // Selected server highlight box (rack mode)
  rackServers.forEach(srv => {
    if (!srv.userData.selBox) {
      const sb = new THREE.BoxGeometry(srv.userData.w * 1.02, srv.userData.h * 1.04, srv.userData.d * 1.02);
      const edges = new THREE.EdgesGeometry(sb);
      const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x4ca8e0, transparent: true, opacity: 0.9 }));
      srv.add(line);
      srv.userData.selBox = line;
      line.visible = false;
    }
    srv.userData.selBox.visible = (state.selectedServer === srv && state.mode === 'rack' && srv.parent === rackGroupServers);
  });

  // Hover highlight
  if (state.hovered && state.mode === 'slice') {
    const h = state.hovered;
    if (h.material && h.material.emissive) h.material.emissive.setHex(h.userData.emissiveRestore || 0x000000);
    state.hovered = null;
  }
  if (state.hoveredRackBox) {
    state.hoveredRackBox.visible = false;
    state.hoveredRackBox = null;
  }

  if (!state.transition) {
    raycaster.setFromCamera(mouseNDC, camera);
    const targets = [];
    if (state.mode === 'rack') {
      rackServers.forEach(srv => {
        srv.userData.raycastMeshes.forEach(m => {
          if (m.visible) targets.push(m);
        });
      });
    } else if (state.mode === 'slice' && state.selectedServer) {
      state.selectedServer.traverse(o => {
        if (o.isMesh && o.visible && o.userData.isComponent) targets.push(o);
      });
    }
    const intersects = raycaster.intersectObjects(targets, false);
    if (intersects.length > 0) {
      const obj = intersects[0].object;
      let label = '';
      if (state.mode === 'rack') {
        const srv = obj.userData.serverRoot;
        label = srv.userData.displayName + ' — ' + srv.userData.sizeU + 'U';
        if (!srv.userData.hoverBox) {
          const hb = new THREE.BoxGeometry(srv.userData.w * 1.01, srv.userData.h * 1.03, srv.userData.d * 1.01);
          const edges = new THREE.EdgesGeometry(hb);
          const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x88ccee, transparent: true, opacity: 0.7 }));
          srv.add(line);
          srv.userData.hoverBox = line;
        }
        srv.userData.hoverBox.visible = true;
        state.hoveredRackBox = srv.userData.hoverBox;
      } else {
        state.hovered = obj;
        if (obj.material && obj.material.emissive) {
          obj.userData.emissiveRestore = obj.material.emissive.getHex();
          obj.material.emissive.setHex(0x3a6890);
        }
        if (obj.userData.compName) label = obj.userData.compName;
      }
      const infoEl = document.getElementById('info');
      if (label) {
        infoEl.textContent = label;
        infoEl.style.display = 'block';
        infoEl.style.left = (mouse.x + 14) + 'px';
        infoEl.style.top = (mouse.y + 60) + 'px';
      } else {
        infoEl.style.display = 'none';
      }
      document.body.style.cursor = 'pointer';
    } else {
      document.getElementById('info').style.display = 'none';
      document.body.style.cursor = 'default';
    }
  }

  renderer.render(scene, camera);

  // Perf
  fpsCount++;
  fpsTime += dt;
  if (fpsTime >= 0.5) {
    fps = Math.round(fpsCount / fpsTime);
    fpsTime = 0; fpsCount = 0;
    document.getElementById('p-fps').textContent = fps;
    const info = renderer.info;
    document.getElementById('p-dc').textContent = info.render.calls;
    document.getElementById('p-tr').textContent = info.render.triangles.toLocaleString();
  }
}

animate();

// INPUT
// =================================================================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouseNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouseNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
});

window.addEventListener('click', (e) => {
  if (e.target.closest('.btn') || e.target.closest('#leftpanel') || e.target.closest('#rightpanel') || e.target.closest('#topbar') || e.target.closest('#bottombar')) return;
  if (state.transition) return;
  raycaster.setFromCamera(mouseNDC, camera);
  if (state.mode === 'rack') {
    const targets = [];
    rackServers.forEach(srv => srv.userData.raycastMeshes.forEach(m => { if (m.visible) targets.push(m); }));
    const hits = raycaster.intersectObjects(targets, false);
    if (hits.length > 0) {
      selectServer(hits[0].object.userData.serverRoot);
    }
  } else if (state.mode === 'slice' && state.selectedServer) {
    const targets = [];
    state.selectedServer.traverse(o => { if (o.isMesh && o.visible && o.userData.isComponent) targets.push(o); });
    const hits = raycaster.intersectObjects(targets, false);
    if (hits.length > 0) {
      state.selectedComponent = hits[0].object;
      updateRightPanel();
    } else {
      state.selectedComponent = null;
      updateRightPanel();
    }
  }
});

// Buttons
document.getElementById('btn-rack').addEventListener('click', () => { if (state.mode !== 'rack') exitSliceMode(); });
document.getElementById('btn-slice').addEventListener('click', () => { if (state.selectedServer) enterSliceMode(); });
document.querySelectorAll('[data-mode]').forEach(b => {
  b.addEventListener('click', () => {
    if (b.dataset.mode === 'rack') exitSliceMode();
    else if (state.selectedServer) enterSliceMode();
  });
});
document.querySelectorAll('[data-rcam]').forEach(b => b.addEventListener('click', () => setRackCamera(b.dataset.rcam)));
document.querySelectorAll('[data-scam]').forEach(b => b.addEventListener('click', () => setSliceCamera(b.dataset.scam)));
document.getElementById('btn-cover').addEventListener('click', () => toggleCover(!state.coverOpen));
document.getElementById('btn-cutaway').addEventListener('click', () => { state.cutaway = !state.cutaway; toggleCutaway(state.cutaway); });
document.getElementById('btn-explode').addEventListener('click', () => toggleExplode(!state.exploded));
document.getElementById('btn-airflow').addEventListener('click', () => {
  state.showAirflow = !state.showAirflow;
  document.getElementById('btn-airflow').classList.toggle('active', state.showAirflow);
  if (!state.showAirflow) airflowGroup.visible = false;
});
document.getElementById('btn-power').addEventListener('click', () => {
  state.showPower = !state.showPower;
  document.getElementById('btn-power').classList.toggle('active', state.showPower);
  if (!state.showPower && !state.showData) pathGroup.visible = false;
});
document.getElementById('btn-data').addEventListener('click', () => {
  state.showData = !state.showData;
  document.getElementById('btn-data').classList.toggle('active', state.showData);
  if (!state.showPower && !state.showData) pathGroup.visible = false;
});
document.getElementById('btn-failures').addEventListener('click', () => {
  state.showFailures = !state.showFailures;
  document.getElementById('btn-failures').classList.toggle('active', state.showFailures);
  document.getElementById('failure-section').style.display = state.mode==='slice' && state.showFailures ? 'block' : 'none';
});
document.getElementById('btn-reset').addEventListener('click', () => {
  state.failures = { fan:false, psu:false, drive:false, gpu:false, net:false };
  state.showAirflow = false; state.showPower = false; state.showData = false;
  document.getElementById('btn-airflow').classList.remove('active');
  document.getElementById('btn-power').classList.remove('active');
  document.getElementById('btn-data').classList.remove('active');
  airflowGroup.visible = false;
  pathGroup.visible = false;
  if (state.exploded) toggleExplode(false);
  if (state.cutaway) toggleCutaway(false);
  if (state.coverOpen) toggleCover(false);
  document.getElementById('warn-box').classList.remove('show');
  if (state.mode === 'slice') setSliceCamera('whole');
  else setRackCamera('34');
});
document.getElementById('btn-return').addEventListener('click', () => {
  if (state.mode === 'slice') exitSliceMode();
});
document.getElementById('prev-srv').addEventListener('click', () => {
  if (!state.selectedServer) return;
  const idx = (state.selectedServer.userData.rackIdx - 1 + rackServers.length) % rackServers.length;
  switchSliceServer(idx);
});
document.getElementById('next-srv').addEventListener('click', () => {
  if (!state.selectedServer) return;
  const idx = (state.selectedServer.userData.rackIdx + 1) % rackServers.length;
  switchSliceServer(idx);
});
document.querySelectorAll('[data-fail]').forEach(b => {
  b.addEventListener('click', () => {
    const f = b.dataset.fail;
    state.failures[f] = !state.failures[f];
    b.classList.toggle('active', state.failures[f]);
    if (f === 'psu' && state.selectedServer) {
      // reset LED when clearing
      state.selectedServer.userData.psus.forEach(p => {
        if (!state.failures.psu) { p.userData.status = 'ok'; if (p.userData.led) p.userData.led.material = M.ledGreen; }
      });
    }
    if (f === 'drive' && state.selectedServer) {
      state.selectedServer.userData.drives.forEach((d,i) => {
        if (i === 0) { d.userData.status = state.failures.drive ? 'failed':'ok'; if (d.userData.led) d.userData.led.material = state.failures.drive?M.ledRed:M.ledGreen; }
      });
    }
    updateHealthPanel();
  });
});

function switchSliceServer(idx) {
  const newSrv = rackServers[idx];
  // Remove current slice from holder, add back to rack
  if (state.selectedServer && state.selectedServer.parent === sliceSceneHolder) {
    reattachFromSlice(state.selectedServer);
    rackGroup.visible = false; // stay in slice mode, hide rack
  }
  state.selectedServer = newSrv;
  // remove from rack, add to slice
  rackGroupServers.remove(newSrv);
  sliceSceneHolder.add(newSrv);
  newSrv.position.set(0,0,0);
  newSrv.rotation.set(0,0,0);
  sliceSceneHolder.visible = true;
  // reset view toggles? Keep them but apply
  newSrv.userData.topCover.position.y = state.coverOpen ? newSrv.userData.h/2 + 0.15 : newSrv.userData.h/2 + 0.0015;
  newSrv.userData.explodeState = null;
  if (state.exploded) {
    // re-run explode after brief delay
    state.exploded = false;
    setTimeout(()=>toggleExplode(true), 100);
  }
  buildPathsForServer(newSrv);
  state.selectedComponent = null;
  updateServerListUI();
  updateRightPanel();
  setSliceCamera('whole');
}

// Initial camera preset
setRackCamera('34');

// Tag some structural elements as cutaway-hidable
rackServers.forEach(srv => {
  srv.traverse(o => {
    // Tag side walls and front/rear panels (direct children of srv except top cover and internals and base)
    if (o.parent === srv) {
      const isStructural = o !== srv.userData.topCover && o !== srv.userData.internals && o !== srv.userData.motherboard;
      if (isStructural && o.isMesh) {
        o.userData.cutawayHide = true;
      }
    }
  });
});

</script>
