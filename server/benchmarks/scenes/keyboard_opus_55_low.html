<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DUSK·75 — Mechanical Keyboard Showcase</title>
<style>
@property --hue { syntax: '<number>'; inherits: true; initial-value: 28; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color:#ece6d8;
  background:
    radial-gradient(ellipse 70% 55% at 50% 45%, #2b3150 0%, rgba(27,30,46,.6) 45%, transparent 75%),
    linear-gradient(180deg,#12141d 0%,#0b0c12 100%);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
.app{display:flex;flex-direction:column;min-height:100svh}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:18px clamp(14px,3vw,34px) 6px;position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#f08a4b,#c9571f);display:grid;place-items:center;box-shadow:0 6px 20px rgba(240,138,75,.25), inset 0 1px 0 rgba(255,255,255,.35)}
.logo span{width:14px;height:14px;border-radius:4px;background:#f5ecd9;box-shadow:0 2px 0 #cdbf9f}
.brand h1{font-size:16px;letter-spacing:.18em;font-weight:700}
.brand p{font-size:12px;color:#9aa0b8;letter-spacing:.04em;margin-top:2px}
.controls{display:flex;flex-wrap:wrap;gap:8px}
.btn{
  appearance:none;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);
  color:#ece6d8;font-family:inherit;font-weight:600;font-size:13px;line-height:1;padding:10px 14px;border-radius:999px;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;transition:background .2s,border-color .2s,transform .1s,opacity .2s;
  backdrop-filter:blur(6px);
}
.btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid #f08a4b;outline-offset:2px}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:linear-gradient(145deg,#f08a4b,#d8632a);border-color:transparent;color:#1b1206}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn[aria-pressed="true"]{background:rgba(240,138,75,.16);border-color:rgba(240,138,75,.5)}
.btn .dot{width:8px;height:8px;border-radius:50%;background:hsl(var(--hue) 90% 60%)}
#skipBtn{display:none}
body.assembling #skipBtn{display:inline-flex}

.stage{flex:1;position:relative;min-height:46vh}
.viewport{position:absolute;inset:0;perspective:2200px;perspective-origin:50% 35%}
.scaler{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
.tilt{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.camera{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(28deg) rotateZ(0deg) scale3d(1,1,1);transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
.camera.inspect{transform:rotateX(56deg) rotateZ(-20deg) scale3d(.78,.78,.78)}
.board{position:absolute;inset:0;transform-style:preserve-3d}
.layer{position:absolute;inset:0;transform-style:preserve-3d;transform:translateZ(0px);transition:transform .9s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.board.exploded .L-pcb{transform:translateZ(30px)}
.board.exploded .L-foam{transform:translateZ(75px)}
.board.exploded .L-plate{transform:translateZ(125px)}
.board.exploded .L-sw{transform:translateZ(185px)}
.board.exploded .L-caps{transform:translateZ(260px)}

.slab{position:absolute;transform-style:preserve-3d}
.f{position:absolute;display:block}
.f-front{left:0;right:0;top:100%;height:var(--d);transform-origin:top;transform:rotateX(-90deg)}
.f-left{top:0;bottom:0;right:100%;width:var(--d);transform-origin:right;transform:rotateY(-90deg)}
.f-right{top:0;bottom:0;left:100%;width:var(--d);transform-origin:left;transform:rotateY(90deg)}

/* ---------- CASE ---------- */
.shadow{position:absolute;left:3%;right:3%;top:8%;bottom:-4%;transform:translateZ(-16px);background:rgba(0,0,0,.65);filter:blur(28px);border-radius:40px}
.case-floor{position:absolute;inset:10px;transform:translateZ(0px);background:linear-gradient(180deg,#121624,#0d101a);border-radius:10px;box-shadow:inset 0 0 40px rgba(0,0,0,.6)}
.rim{inset:0;transform:translateZ(26px);--d:40px}
.rim-top{position:absolute;inset:0;border-radius:12px;padding:21px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,0) 8%),
    linear-gradient(160deg,#35406a 0%,#232b47 45%,#1a2036 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude}
.rim .f-front{background:linear-gradient(180deg,#2a3354 0%,#1a2037 55%,#10142280 100%),#141a2c;border-radius:0 0 10px 10px;overflow:hidden}
.rim .f-left,.rim .f-right{background:linear-gradient(90deg,#1a2036,#222a45)}
.badge{position:absolute;left:50%;top:13px;transform:translateX(-50%);font-weight:700;font-size:9px;line-height:1;letter-spacing:.5em;color:#c9a24a;opacity:.85;text-shadow:0 1px 0 rgba(0,0,0,.6)}
.glowstrip{position:absolute;left:8%;right:8%;bottom:6px;height:3px;border-radius:3px;background:hsl(var(--hue) 95% 62%);box-shadow:0 0 12px 2px hsl(var(--hue) 95% 55% / .7);transition:opacity .4s}
.inwall{position:absolute;background:linear-gradient(180deg,#141a2c,#0b0e18)}
.inwall.back{left:21px;right:21px;top:21px;height:26px;transform-origin:top;transform:rotateX(-90deg)}
.inwall.left{top:21px;bottom:21px;left:21px;width:26px;transform-origin:left;transform:rotateY(90deg);background:linear-gradient(90deg,#0b0e18,#171d31)}
.inwall.right{top:21px;bottom:21px;right:21px;width:26px;transform-origin:right;transform:rotateY(-90deg);background:linear-gradient(270deg,#0b0e18,#171d31)}

/* ---------- PCB ---------- */
.pcb{border-radius:6px;--d:2px;
  background:
    repeating-linear-gradient(90deg,transparent 0 27px,rgba(212,170,80,.13) 27px 28px),
    repeating-linear-gradient(0deg,transparent 0 13px,rgba(212,170,80,.07) 13px 14px),
    linear-gradient(160deg,#18251d,#0c1410);
  box-shadow:inset 0 0 0 2px rgba(212,170,80,.35)}
.pcb .f{background:#0a100c}
.pad{position:absolute;width:40px;height:40px;border:1px solid rgba(255,255,255,.22);border-radius:3px;
  background:
    radial-gradient(circle at 30% 30%,#e8c56a 0 3px,#8a6a22 3.5px,transparent 4.5px),
    radial-gradient(circle at 68% 18%,#e8c56a 0 3px,#8a6a22 3.5px,transparent 4.5px),
    radial-gradient(circle at 50% 50%,#050805 0 5px,transparent 5.5px),
    linear-gradient(#1b1f1d,#1b1f1d) 60% 82%/14px 5px no-repeat}
.chip{position:absolute;width:40px;height:40px;background:#0b0b0d;border-radius:3px;box-shadow:0 0 0 3px #0f1511,0 0 0 4px rgba(212,170,80,.6);
  background-image:radial-gradient(circle at 18% 18%,#333 0 2px,transparent 2.5px)}
.silk{position:absolute;font:700 9px/1 ui-monospace,Menlo,Consolas,monospace;color:rgba(255,255,255,.55);letter-spacing:.2em;white-space:nowrap}
.usb{position:absolute;width:30px;height:12px;border-radius:4px;background:linear-gradient(#d9dde3,#8d939c);box-shadow:inset 0 0 0 3px #aab0b8}

/* ---------- FOAM ---------- */
.foam{border-radius:6px;--d:4px;
  background:radial-gradient(rgba(60,40,80,.09) 1px,transparent 1.6px) 0 0/5px 5px,linear-gradient(160deg,#d9d1e4,#bdb3cc)}
.foam .f{background:#a79dba}
.hole{position:absolute;border-radius:4px;background:rgba(56,44,74,.38);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}

/* ---------- PLATE ---------- */
.plate{border-radius:6px;--d:2px;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px),
    linear-gradient(135deg,#ecd08a 0%,#c99f45 35%,#a47c2c 58%,#dcbc68 100%)}
.plate .f{background:#8a6624}
.cut{position:absolute;border-radius:2px;background:#16131b;box-shadow:inset 0 2px 3px rgba(0,0,0,.8),0 1px 0 rgba(255,240,200,.4)}
.slot{position:absolute;height:4px;border-radius:2px;background:#16131b}
.light{position:absolute;transform:translateZ(0.6px);pointer-events:none;
  background:radial-gradient(closest-side,hsl(var(--hue) 95% 62% / var(--la,.55)),hsl(var(--hue) 95% 55% / 0));transition:opacity .3s}
.board.rgb-warm{--hue:28}
.board.rgb-off .light,.board.rgb-off .glowstrip{opacity:0}
.board.rgb-reactive .light{opacity:0;--la:.95}
.board.rgb-reactive .glowstrip{opacity:.25;--hue:195}
.board.rgb-wave .light,.board.rgb-wave .glowstrip{animation:hueWave 6s linear infinite;animation-delay:calc(var(--kx,0) * -0.28s)}
@keyframes hueWave{from{--hue:0}to{--hue:360}}

/* ---------- SWITCHES ---------- */
.sw{position:absolute;transform-style:preserve-3d;transform:translateZ(16px)}
.housing{position:absolute;left:50%;top:50%;width:41px;height:41px;margin:-20.5px;transform-style:preserve-3d;transform:translateZ(12px);--d:12px;border-radius:3px;
  background:
    linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.2)) 50% 5px/12px 5px no-repeat,
    radial-gradient(circle at 50% 50%,#1d1428 0 11px,transparent 11.5px),
    linear-gradient(150deg,rgba(168,138,222,.95),rgba(98,70,160,.95));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.housing .f-front{background:linear-gradient(180deg,rgba(110,80,175,.95),rgba(60,40,110,.95))}
.housing .f-left,.housing .f-right{background:rgba(80,56,138,.95)}
.stem{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;transform:translateZ(3px);
  background:linear-gradient(#ffd24d,#f2b01e) center/16px 5px no-repeat,linear-gradient(#ffd24d,#f2b01e) center/5px 16px no-repeat}
.stab{position:absolute;width:10px;height:16px;border-radius:2px;background:#191a1f;transform-style:preserve-3d;transform:translateZ(7px);--d:7px}
.stab .f{background:#0e0f12}
.wire{position:absolute;height:2px;background:linear-gradient(#f4f6f8,#8e959e);transform:translateZ(2px);border-radius:1px}
.encoder{background:linear-gradient(160deg,#2c2e35,#16171b)!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.encoder .f{background:#101114!important}
.shaft{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f1d58c,#9b7a2e);transform:translateZ(6px)}

/* ---------- KEYCAPS ---------- */
.L-caps .cap,.L-caps .knob .kd,.L-caps .knob .ktop{pointer-events:auto}
.cap{position:absolute;transform-style:preserve-3d;transform:translateZ(42px);--d:12px;border-radius:6px;background:var(--cs);cursor:pointer;
  transition:transform .09s ease-out;-webkit-tap-highlight-color:transparent;user-select:none}
.cap.down{transform:translateZ(37px);transition-duration:.03s}
.cap .f-front{background:linear-gradient(180deg,var(--cs),var(--cf));border-radius:0 0 5px 5px}
.cap .f-left,.cap .f-right{background:var(--cside)}
.cap .top{position:absolute;top:2px;left:4px;right:4px;bottom:7px;border-radius:5px;
  background:linear-gradient(180deg,var(--ct1),var(--ct2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -3px 4px rgba(0,0,0,.07),0 1px 1px rgba(0,0,0,.15);
  color:var(--lg);overflow:hidden}
.cap.down .top{background:linear-gradient(180deg,var(--ct2),var(--ct1))}
.s-alpha{--ct1:#f6f0e2;--ct2:#e7ddc7;--cs:#d8cdb4;--cside:#cbbfa4;--cf:#b8ab8f;--lg:#2a2e3d}
.s-mod{--ct1:#5d6484;--ct2:#4b516c;--cs:#40465e;--cside:#373c52;--cf:#2c3043;--lg:#efe7d4}
.s-accent{--ct1:#f5925a;--ct2:#e06d33;--cs:#cc5f29;--cside:#bd5623;--cf:#a2461b;--lg:#fff6ea}
.lg{position:absolute;left:6px;top:5px;font-weight:650;font-size:14px;line-height:1;white-space:nowrap;letter-spacing:.01em}
.lg-sub{position:absolute;left:6px;top:4px;font-weight:600;font-size:10.5px;line-height:1;opacity:.72}
.has-sub .lg{top:auto;bottom:5px;font-size:13px}
.small .lg{top:auto;bottom:6px;left:7px;font-size:10px;font-weight:650;letter-spacing:.03em}
.center .lg{left:0;right:0;top:50%;bottom:auto;transform:translateY(-50%);text-align:center;font-size:13px}
.arrow .lg{color:#f5925a;font-size:14px}
.space-logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:700;font-size:8px;line-height:1;letter-spacing:.55em;color:#b8ab8f}
.lg .short{display:none}
body.compact .lg{font-size:20px;left:8px;top:6px}
body.compact .lg-sub{display:none}
body.compact .has-sub .lg{top:6px;bottom:auto;font-size:20px}
body.compact .small .lg{font-size:15px;bottom:7px;top:auto}
body.compact .center .lg{top:50%;font-size:18px}
body.compact .lg .long{display:none}
body.compact .lg .short{display:inline}

/* ---------- KNOB ---------- */
.knob{position:absolute;transform-style:preserve-3d;transform:translateZ(0px);transition:transform .08s}
.knob.down{transform:translateZ(-2px)}
.kd,.ktop{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;cursor:grab}
.kd{background:linear-gradient(90deg,#6a5020,#b08a3a 40%,#e0c070 55%,#7a5c24)}
.ktop{background:
  radial-gradient(circle,#f0d894 0 13px,#caa550 14px 15px,transparent 15.5px),
  repeating-conic-gradient(#c9a24a 0 5deg,#7d6128 5deg 10deg);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.kind{position:absolute;left:50%;top:5px;width:3px;height:12px;margin-left:-1.5px;border-radius:2px;background:#e06d33;box-shadow:0 0 4px rgba(224,109,51,.8)}

/* ---------- HUD ---------- */
footer{padding:4px clamp(14px,3vw,34px) 20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 24px;align-items:end;position:relative;z-index:5}
.hud{display:flex;flex-direction:column;gap:10px;max-width:560px}
.step{display:flex;gap:14px;align-items:center}
#stepNum{font:700 12px/1 ui-monospace,Menlo,Consolas,monospace;color:#1b1206;background:#f08a4b;border-radius:8px;padding:8px 9px;min-width:36px;text-align:center}
#stepTitle{font-weight:700;font-size:15px;letter-spacing:.02em}
#stepDesc{font-size:13px;color:#a3a9c0;margin-top:3px}
.bar{height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
#barFill{display:block;height:100%;background:linear-gradient(90deg,#f08a4b,#ffc58f);transform-origin:left;transform:scaleX(1)}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.readout{font:500 14px/1.2 ui-monospace,Menlo,Consolas,monospace;color:#d8d2c4;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:10px 12px;min-width:min(340px,70vw);max-width:min(420px,80vw);white-space:pre;overflow:hidden;text-align:right}
.readout .ph{color:#646a82}
.caret{display:inline-block;width:8px;height:15px;background:#f08a4b;vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#hint{font-size:12px;color:#1b1206;background:#ffc58f;padding:7px 12px;border-radius:999px;font-weight:650;display:flex;align-items:center;gap:6px;animation:pulse 2.2s ease-in-out infinite}
#hint.hide{display:none}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,197,143,.15)}}
#status{font-size:12px;color:#9aa0b8;min-height:14px;transition:opacity .3s}
@media (max-width:640px){
  footer{grid-template-columns:1fr}
  .side{align-items:stretch}
  .readout{max-width:none;min-width:0}
  .brand p{display:none}
  .btn{padding:9px 11px;font-size:12px}
}
@media (prefers-reduced-motion: reduce){
  .caret,#hint{animation:none}
  .camera,.layer,.tilt{transition-duration:.01s}
}
</style>
</head>
<body class="assembling">
<div class="app">
  <header>
    <div class="brand">
      <div class="logo"><span></span></div>
      <div>
        <h1>DUSK·75</h1>
        <p>Gasket-style 75% · brass plate · lubed linears · PBT doubleshot</p>
      </div>
    </div>
    <div class="controls">
      <button class="btn primary" id="replayBtn" title="Replay assembly animation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        Replay
      </button>
      <button class="btn" id="skipBtn" title="Skip to assembled keyboard">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 5l9 7-9 7zM15 5h3v14h-3z"/></svg>Skip
      </button>
      <button class="btn" id="explodeBtn" aria-pressed="false" title="Toggle exploded view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3l9 4.5-9 4.5-9-4.5z"/><path d="M3 12.5l9 4.5 9-4.5" opacity=".7"/><path d="M3 17l9 4.5 9-4.5" opacity=".45"/></svg>
        <span id="explodeLabel">Explode</span>
      </button>
      <button class="btn" id="rgbBtn" title="Cycle lighting mode"><span class="dot"></span><span id="rgbLabel">Light: Warm</span></button>
      <button class="btn" id="muteBtn" aria-pressed="false" title="Mute / unmute sound">
        <svg id="icoOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg id="icoOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="display:none"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
        <span id="muteLabel">Sound on</span>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="viewport">
      <div class="scaler" id="scaler">
        <div class="tilt" id="tilt">
          <div class="camera" id="camera">
            <div class="board rgb-warm" id="board"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="hud" id="hud">
      <div class="step">
        <span id="stepNum">01</span>
        <div><div id="stepTitle">Printed circuit board</div><div id="stepDesc">Preparing assembly…</div></div>
      </div>
      <div class="bar"><i id="barFill"></i></div>
    </div>
    <div class="side">
      <div id="hint">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/></svg>
        Click anywhere or press a key to enable sound
      </div>
      <div id="status"></div>
      <div class="readout" id="readout"><span id="typed"><span class="ph">type something…</span></span><span class="caret"></span></div>
    </div>
  </footer>
</div>

<script>
(() => {
'use strict';
const U = 56, PAD = 26, GAP = 2.5;
const BW = 16 * U + PAD * 2, BH = 6.25 * U + PAD * 2;
const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const $ = s => document.querySelector(s);
function el(tag, cls, parent, css) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (css) e.style.cssText = css;
  if (parent) parent.appendChild(e);
  return e;
}
function faces(parent, list = ['front', 'left', 'right']) {
  list.forEach(f => el('i', 'f f-' + f, parent));
}

/* ------------------ LAYOUT ------------------ */
const keys = [];
function row(r, items) {
  let x = 0;
  const y = r === 0 ? 0 : r + 0.25;
  for (const it of items) {
    const [label, code, w = 1, o = {}] = it;
    keys.push({
      label, code, w, x, y, row: r,
      g: o.g || 'alpha', s: o.s || 'alpha', sub: o.sub || '',
      short: o.short || label, layout: o.layout || '',
      ch: o.ch !== undefined ? o.ch : (label.length === 1 ? label.toLowerCase() : '')
    });
    x += w;
  }
}
const M = (label, code, w = 1, extra = {}) => [label, code, w, Object.assign({ g: 'mod', s: 'mod', layout: 'small' }, extra)];
const N = (label, code, extra = {}) => [label, code, 1, Object.assign({ g: 'nav', s: 'mod', layout: 'small' }, extra)];
const Lt = c => [c, 'Key' + c, 1];
const P = (c, code, sub) => [c, code, 1, { sub, layout: 'has-sub' }];

const fkeys = [];
for (let i = 1; i <= 12; i++) fkeys.push(['F' + i, 'F' + i, 1, { g: 'fn', s: (i >= 5 && i <= 8) ? 'alpha' : 'mod', layout: 'small', ch: '' }]);
row(0, [['Esc', 'Escape', 1, { g: 'fn', s: 'accent', layout: 'small', ch: '' }], ...fkeys,

function initAudio() {

const SND = {
  alpha: { f: 3600, q: 1.4, cd: .022, cg: .55, b: 190, bd: .045, bg: .32, r: 0 },
  fn:    { f: 4500, q: 1.7, cd: .017, cg: .5,  b: 250, bd: .035, bg: .24, r: 0 },
  nav:   { f: 4000, q: 1.5, cd: .02,  cg: .48, b: 225, bd: .04,  bg: .27, r: 0 },
  mod:   { f: 2500, q: 1.0, cd: .028, cg: .42, b: 160, bd: .06,  bg: .42, r: 0 },
  back:  { f: 2100, q: 1.1, cd: .03,  cg: .55, b: 138, bd: .075, bg: .55, r: .12 },
  enter: { f: 1750, q: 1.0, cd: .034, cg: .6,  b: 112, bd: .09,  bg: .66, r: .14 },
  space: { f: 820,  q: .8,  cd: .05,  cg: .7,  b: 76,  bd: .15,  bg: .95, r: .18 }
};
function noiseHit(t, type, freq, q, gain, decay, rate = 1) {
  const src = actx.createBufferSource(); src.buffer = noiseBuf; src.playbackRate.value = rate;
  const f = actx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(gain, t + 0.0015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
  src.connect(f).connect(g).connect(master);
  src.start(t, Math.random() * 0.8); src.stop(t + decay + 0.03);
}
function tone(t, f0, f1, gain, decay, type = 'sine') {

  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + decay * 0.6);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(gain, t + 0.003);
  g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
  o.connect(g).connect(master); o.start(t); o.stop(t + decay + 0.03);
}
function playKey(group, down, soft = 1) {
  if (!actx || muted || actx.state !== 'running') return;
  const p = SND[group] || SND.alpha;
  const t = actx.currentTime + 0.002;
  const v = 1 + (Math.random() - 0.5) * 0.08;
  const k = (down ? 1 : 0.38) * soft;
  noiseHit(t, 'bandpass', p.f * v * (down ? 1 : 1.3), p.q, p.cg * k, p.cd * (down ? 1 : 0.7), v);
  noiseHit(t, 'lowpass', p.b * 5 * v, 0.7, p.bg * 0.45 * k, p.bd * 0.8);
  tone(t, p.b * 1.9 * v, p.b * v, p.bg * k * (down ? 1 : 0.5), p.bd);
  if (p.r && down) noiseHit(t + 0.011 + Math.random() * 0.005, 'highpass', 3200, 0.8, p.r * soft, 0.014);
}
function playTick() {
  if (!actx || muted || actx.state !== 'running') return;
  const t = actx.currentTime + 0.002;
  noiseHit(t, 'bandpass', 5200, 3, 0.35, 0.012);
  tone(t, 2400, 1800, 0.08, 0.012, 'triangle');
}
function playThud() {
  if (!actx || muted || actx.state !== 'running') return;
  const t = actx.currentTime + 0.002;
  noiseHit(t, 'lowpass', 400, 0.7, 0.5, 0.18);

let anims = [], timers = [];

const later = (fn, t) => timers.push(setTimeout(fn, t));
const stepNum = $('#stepNum'), stepTitle = $('#stepTitle'), stepDesc = $('#stepDesc'), hud = $('#hud');
function setStep(n, title, desc) {

  if (!RM) hud.animate([{ opacity: 0.2, transform: 'translateY(4px)' }, { opacity: 1, transform: 'none' }], { duration: 350, easing: 'ease-out' });
}
const STEPS = {
  pcb: ['01', 'Printed circuit board', 'Hot-swap PCB with gold-plated sockets and a QMK/VIA-ready MCU.'],
  foam: ['02', 'Plate foam', 'Poron foam layer dampens hollow ping between plate and PCB.'],
  plate: ['03', 'Brass plate', 'Machined brass with flex cuts for a dense, pingless sound.'],
  sw: ['04', 'Switches', 'Pre-lubed linear switches seated one by one, left to right.'],
  caps: ['05', 'Keycaps', 'Doubleshot PBT in a cream, slate & ember colourway.'],
  done: ['✓', 'Ready to type', 'Click the keys or type on your keyboard · scroll or drag the knob for volume.']
};

function resetAll() {
  anims.forEach(a => a.cancel()); anims = [];
  timers.forEach(clearTimeout); timers = [];
  setExploded(false);
  tilt.style.transform = '';
  endMouse(); releaseAll();
}
function done() {
  timers.forEach(clearTimeout); timers = [];
  ready = true;
  document.body.classList.remove('assembling');
  explodeBtn.disabled = false;
  setStep(...STEPS.done);
}
function skip() {
  anims.forEach(a => { try { a.finish(); } catch (_) {} });
  done();
}
function dropLayer(elm, delay, dur, from) {
  track(elm.animate([
    { transform: `translateZ(${from}px)`, visibility: 'hidden' },
    { transform: 'translateZ(-3px)', visibility: 'visible', offset: 0.82 },
    { transform: 'translateZ(0px)', visibility: 'visible' }
  ], { delay, duration: dur, easing: 'cubic-bezier(.3,.7,.25,1)', fill: 'backwards' }));
}

function assemble() {
  resetAll();
  ready = false;
  document.body.classList.add('assembling');
  explodeBtn.disabled = true;
  const n = order.length;
  const T = { pcb: 350, foam: 1550, plate: 2750, sw: 3950 };
  const swSpan = 1900, swDur = 420;
  const capStart = T.sw + swSpan + swDur + 250;
  const capSpan = 2300, capDur = 540;
  const camStart = capStart + capSpan + capDur + 150;
  const camDur = 1400;
  const total = camStart + camDur;

  dropLayer(L.pcb, T.pcb, 1100, 380);
  dropLayer(L.foam, T.foam, 1000, 340);
  dropLayer(L.plate, T.plate, 1100, 320);
  later(() => setStep(...STEPS.pcb), 0);
  later(() => setStep(...STEPS.foam), T.foam);
  later(() => setStep(...STEPS.plate), T.plate);
  later(() => setStep(...STEPS.sw), T.sw);
  later(() => setStep(...STEPS.caps), capStart);
  [T.pcb + 900, T.foam + 820, T.plate + 900].forEach(t => later(playThud, t));

  order.forEach((it, i) => {
    const sd = T.sw + i * swSpan / n;
    track(it.swEl.animate([
      { transform: 'translateZ(150px)', visibility: 'hidden' },
      { transform: 'translateZ(16px)', visibility: 'visible' }
    ], { delay: sd, duration: swDur, easing: 'cubic-bezier(.3,.85,.35,1)', fill: 'backwards' }));
    const cd = capStart + i * capSpan / n;
    const bz = it.baseZ;
    track(it.capEl.animate([
      { transform: `translateZ(${bz + 190}px) rotateX(-8deg)`, visibility: 'hidden' },
      { transform: `translateZ(${bz - 2}px) rotateX(0deg)`, visibility: 'visible', offset: 0.8 },
      { transform: `translateZ(${bz}px) rotateX(0deg)`, visibility: 'visible' }
    ], { delay: cd, duration: capDur, easing: 'cubic-bezier(.3,.75,.3,1)', fill: 'backwards' }));
    if (i % 2 === 0) later(() => playKey('fn', true, 0.18), sd + swDur * 0.85);
    if (i % 2 === 1) later(() => playKey(it.g || 'alpha', true, 0.22), cd + capDur * 0.8);
  });

  const A0 = 'rotateX(58deg) rotateZ(-24deg) scale3d(0.8,0.8,0.8)';
  const A1 = 'rotateX(52deg) rotateZ(-15deg) scale3d(0.84,0.84,0.84)';
  const F = 'rotateX(28deg) rotateZ(0deg) scale3d(1,1,1)';
  track(camera.animate([
    { transform: A0, offset: 0, easing: 'ease-in-out' },
    { transform: A1, offset: camStart / total, easing: 'cubic-bezier(.5,0,.2,1)' },
    { transform: F, offset: 1 }
  ], { duration: total, fill: 'backwards' }));
  track($('#barFill').animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: total, easing: 'linear', fill: 'backwards' }));
  later(done, total);
}

$('#replayBtn').addEventListener('click', e => { initAudio(); assemble(); e.currentTarget.blur(); });
$('#skipBtn').addEventListener('click', e => { skip(); e.currentTarget.blur(); });

// Start
if (RM) {
  assemble(); skip();
  stepDesc.textContent = 'Reduced motion detected: assembly skipped. Press Replay to watch it.';
} else {
  requestAnimationFrame(() => assemble());
}
})();
</script>
</body>
