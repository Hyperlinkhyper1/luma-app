<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }
        
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        
        #ui {
            position: absolute;
            bottom: 0;
            left: 0;
            background: #000;
            color: #fff;
            padding: 5px;
            border-top: 1px solid #fff;
            font-family: monospace;
        }
        
        #ui select {
            padding: 2px 0;
        }
        
        #ui button {
            padding: 2px 5px;
            border: none;
            border-radius: 5px;
            background: #000;
            color: #fff;
            cursor: pointer;
        }
        
        #ui button:hover {
            background: #444;
        }
        
        #ui span {
            position: relative;
            top: 2px;
            margin-right: 5px;
        }
        
        #ui input {
            width: 30px;
            text-align: center;
        }
        
        #info {
            position: absolute;
            top: 90%;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
        }
    </style>
</head>
<body>
    <canvas id="canvas" style="width: 100%; height: 100%"></canvas>
    <div id="ui">
        <select id="time">
            <option value="0">Midday</option>
            <option value="1">Gold hour</option>
            <option value="2">Night</option>
            <option value="3">Hazy afternoon</option>
        </select>
        <button id="play">Play</button>
        <span>|</span>
        <input type="range" id="speed" min="0" max="1" value="0" step="0.01">
        <span>|</span>
        <button id="depart">Depart</button>
        <span>|</span>
        <select id="view">
            <option value="0">Miradouro</option>
            <option value="1">Waterfront</option>
            <option value="2">Aerial</option>
            <option value="3">River</option>
            <option value="4">Ship's deck</option>
        </select>
        <button id="walk" style="display: none;">Walk</button>
        <span>|</span>
        <span id="fps" style="display: none;"></span>
        <span id="error" style="color: #f00;"></span>
    </div>
    <script type="module" src="main.js"></script>
    <script type="importmap">
        {"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
    </script>
</body>
</html>
