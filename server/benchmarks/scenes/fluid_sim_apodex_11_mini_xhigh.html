<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>3D Fluid Simulation Benchmark</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style type="text/css">
  :root { --c1:#0b0f19; --c2:#1e293b; --c3:#334155; --acc:#38bdf8; --txt:#e2e8f0; --err:#f87171; }
  html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: var(--c1); color: var(--txt); font-family: 'Segoe UI', system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  
  #ui { position: absolute; top: 10px; left: 10px; width: 320px; pointer-events: none; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
  .panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); border: 1px solid #334155; border-radius: 12px; padding: 12px; pointer-events: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
  .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; }
  .row label { color: #94a3b8; }
  .row strong { color: #fff; font-family: monospace; }
  h3 { margin: 0 0 8px 0; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--acc); border-bottom: 1px solid #334155; padding-bottom: 4px; }
  button, select { background: var(--c2); border: 1px solid #475569; color: white; padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: all 0.2s; width: 100%; text-align: left; }
  button:hover { background: #283547; border-color: var(--acc); }
  button:active { transform: translateY(1px); }
  .btn-row { display: flex; gap: 6px; }
  input[type=range] { width: 100%; pointer-events: auto; accent-color: var(--acc); }
  .stats { font-family: monospace; font-size: 11px; line-height: 1.5; color: #94a3b8; }
  .stats div { display: flex; justify-content: space-between; }
  #fps { color: #4ade80; }
  #density { color: #38bdf8; }
  #mode-text { color: #fbbf24; }
  #warn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #fff; background: rgba(0,0,0,0.9); padding: 40px; border-radius: 16px; z-index: 100; display: none; border: 2px solid var(--err); }
  #loader { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--c1); z-index: 50; display: flex; align-items: center; justify-content: center; flex-direction: column; transition: opacity 0.5s; }
  #loader.hidden { opacity: 0; pointer-events: none; }
  .spinner { width: 40px; height: 40px; border: 3px solid #334155; border-top: 3px solid var(--acc); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .hint { font-size: 11px; color: #64748b; margin-top: 4px; font-style: italic; }
  #toggle-ui { position: absolute; bottom: 10px; right: 10px; pointer-events: auto; z-index: 20; width: auto; }
  .hidden-ui .panel:not(#toggle-ui) { display: none; }
  .hidden-ui #ui { width: 100%; }
  .key { display: inline-block; background: #334155; padding: 2px 6px; border-radius: 4px; font-size: 10px; color: #fff; margin: 0 1px; }
</style>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>

</head>
<body>
<canvas id="gl"></canvas>

<div id="loader"><div class="spinner"></div><div id="loading-text">Initializing Physics Engine...</div></div>

<div id="ui">
  <div class="panel">
    <h3>Simulation</h3>
    <div class="row">Method <strong id="mode-text">PBF + SSFR</strong></div>
    <div class="row">Particles <strong id="stat-count">0</strong></div>
    <div class="row">Avg Density Err <strong id="density">0</strong></div>
    <div class="row">Sim Time <strong id="stat-time">0 ms</strong></div>
    <div class="row">FPS <strong id="fps">0</strong></div>
    <div class="row">
      <span style="display:flex;align-items:center;gap:8px; width:100%">
        <button id="btn-pause" style="width:auto">Pause</button>
        <button id="btn-step" style="width:auto">Step</button>
      </span>
    </div>
    <div class="row">
      <label style="flex:1">Particles: <strong id="val-count">6000</strong></label>
      <input type="range" id="inp-count" min="2000" max="24000" step="1000" value="6000">
    </div>
    <div class="row">
      <label style="flex:1">Gravity: <strong id="val-grav">9.8</strong></label>
      <input type="range" id="inp-grav" min="0" max="30" step="0.1" value="9.8">
    </div>
    <div class="row">
      <label style="flex:1">Viscosity: <strong id="val-visc">0</strong></label>
      <input type="range" id="inp-visc" min="0" max="5" step="0.1" value="0">
    </div>
  </div>

  <div class="panel">
    <h3>Scenario</h3>
    <div class="row">
      <button id="scen-dam">1. Dam Break</button>
      <button id="scen-double">2. Double Dam</button>
    </div>
    <div class="row">
      <button id="scen-drop">3. Droplet</button>
      <button id="scen-faucet">4. Faucet</button>
    </div>
    <div class="row">
      <button id="scen-wave">5. Wave Machine</button>
    </div>
    <div class="row">
      <button id="btn-reset" style="background:#ef4444; border-color:#b91c1c;">Hard Reset</button>
    </div>
  </div>

  <div class="panel">
    <h3>Interaction</h3>
    <div class="row">
      <label>Tilt Tank: <strong id="val-tilt">0°</strong></label>
      <input type="range" id="inp-tilt" min="-45" max="45" step="1" value="0">
    </div>
    <div class="row">
      <label>View Mode</label>
      <select id="sel-mode">
        <option value="liquid">Liquid Surface</option>
        <option value="particles">Raw Particles</option>
        <option value="vel">Velocity Vectors</option>
      </select>
    </div>
    <div class="row btn-row">
      <button id="btn-duck">Drop Rubber Duck</button>
      <button id="btn-crate">Drop Crate</button>
    </div>
    <div class="hint">Drag mouse in water to stir.<br>Mouse wheel to zoom.</div>
  </div>

  <div class="panel">
    <h3>Stats</h3>
    <div class="stats" id="stats-detail">
      <div><span>FPS</span><span id="sd-fps">0</span></div>
      <div><span>Render(ms)</span><span id="sd-render">0</span></div>
      <div><span>Grid Load</span><span id="sd-load">0</span></div>
      <div><span>Solver Iters</span><span id="sd-iters">0</span></div>
    </div>
  </div>
</div>

<button id="toggle-ui" class="panel" style="width:auto; padding:8px 12px; margin:0;"><span>Toggle UI</span></button>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const DUMMY = { style: {}, classList: { add() {}, remove() {}, toggle() {} }, addEventListener() {}, textContent: '', value: '' };
        const $ = (id) => document.getElementById(id) || DUMMY;
        const clamp = (v, a, b) => Math.min(Math.max(v, a), b);

        // ------------------------------------------------------------------
        // Settings and state
        // ------------------------------------------------------------------
        const cfg = { dt: 0.016, viscosity: 0.02, gravity: 9.81, absorption: 0.8, reflection: 0.5, fresnel: 1.0, tiltX: 0, tiltY: 0, zoom: 34, iterations: 3 };
        const BOX = new THREE.Vector3(10, 6, 5);          // tank half extents
        const MAX_PARTICLES = 24000;
        const MAX_NEIGHBORS = 56;
        let scenario = 'dam-break';
        let renderMode = 'screen-space';
        let paused = false, stepOnce = false;
        let simTime = 0;

        // Particle storage
        let N = 6000, count = 0, spacing = 0.45, kh = 0.9, rho0 = 1;
        let pos, vel, pred, lam, dpos, speedAttr, nbr, nbrCount;
        let cellStart, cellOrder, cellOf, gx = 1, gy = 1, gz = 1;
        let densityError = 0, epsG2 = 1;
        const balls = [];
        let emitCursor = 0;

        // ------------------------------------------------------------------
        // Renderer, scene, camera
        // ------------------------------------------------------------------
        const canvas = $('gl');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
        renderer.setPixelRatio(1);
        renderer.setSize(window.innerWidth, window.innerHeight);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a1220);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 300);
        camera.position.set(0, 10, cfg.zoom);
        const controls = new OrbitControls(camera, canvas);
        controls.target.set(0, 0, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 8; controls.maxDistance = 60;
        controls.mouseButtons = { LEFT: -1, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
        controls.touches = { ONE: -1, TWO: THREE.TOUCH.DOLLY_ROTATE };

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
        keyLight.position.set(6, 14, 8);
        scene.add(keyLight);

        // Tank frame: everything that tilts with the tank lives here
        const tank = new THREE.Group();
        scene.add(tank);
        const edges = new THREE.LineSegments(
            new THREE.EdgesGeometry(new THREE.BoxGeometry(BOX.x * 2, BOX.y * 2, BOX.z * 2)),
            new THREE.LineBasicMaterial({ color: 0x9bc7ff }));
        tank.add(edges);
        const glass = new THREE.Mesh(
            new THREE.BoxGeometry(BOX.x * 2, BOX.y * 2, BOX.z * 2),
            new THREE.MeshBasicMaterial({ color: 0x88bbff, transparent: true, opacity: 0.05, side: THREE.DoubleSide, depthWrite: false }));
        tank.add(glass);
        const paddle = new THREE.Mesh(new THREE.BoxGeometry(0.6, BOX.y * 2, BOX.z * 2), new THREE.MeshBasicMaterial({ color: 0x7a8aa6, transparent: true, opacity: 0.55 }));
        paddle.visible = false;
        tank.add(paddle);
        const nozzle = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 1.2, 16), new THREE.MeshStandardMaterial({ color: 0x9aa4b4, metalness: 0.8, roughness: 0.3 }));
        nozzle.position.set(0, BOX.y + 0.6, 0);
        nozzle.visible = false;
        tank.add(nozzle);

        const floor = new THREE.GridHelper(80, 40, 0x24364f, 0x14202f);
        floor.position.y = -BOX.y - 2;
        scene.add(floor);
        const floorGlow = new THREE.Mesh(new THREE.CircleGeometry(40, 48), new THREE.MeshBasicMaterial({ color: 0x0f1d33 }));
        floorGlow.rotation.x = -Math.PI / 2; floorGlow.position.y = -BOX.y - 2.02;
        scene.add(floorGlow);

        const ballMat = new THREE.MeshStandardMaterial({ color: 0xe0503c, roughness: 0.35, metalness: 0.1 });
        const ballGeo = new THREE.SphereGeometry(1, 32, 24);

        // ------------------------------------------------------------------
        // Particle buffers + drawables
        // ------------------------------------------------------------------
        const geometry = new THREE.BufferGeometry();
        let posAttr, speedAttrBuf;

        const rtOpts = (type) => ({ minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, type, format: THREE.RGBAFormat, depthBuffer: false });
        let sceneRT, depthRT, blurRT1, blurRT2, thickRT;
        function makeTargets() {
            const w = renderer.domElement.width, h = renderer.domElement.height;
            [sceneRT, depthRT, blurRT1, blurRT2, thickRT].forEach(t => t && t.dispose());
            sceneRT = new THREE.WebGLRenderTarget(w, h, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: true });
            depthRT = new THREE.WebGLRenderTarget(w, h, { ...rtOpts(THREE.FloatType), depthBuffer: true });
            blurRT1 = new THREE.WebGLRenderTarget(w, h, rtOpts(THREE.FloatType));
            blurRT2 = new THREE.WebGLRenderTarget(w, h, rtOpts(THREE.FloatType));
            thickRT = new THREE.WebGLRenderTarget(w, h, { ...rtOpts(THREE.HalfFloatType), minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
        }
        makeTargets();

        const pointVS = `
            uniform float uRadius; uniform float uScale;
            attribute float aSpeed;
            varying vec3 vView; varying float vSpeed;
            void main() {
                vec4 mv = modelViewMatrix * vec4(position, 1.0);
                vView = mv.xyz; vSpeed = aSpeed;
                gl_Position = projectionMatrix * mv;
                gl_PointSize = max(1.0, uRadius * 2.0 * uScale / max(0.1, -mv.z));
            }`;
        const depthMat = new THREE.ShaderMaterial({
            uniforms: { uRadius: { value: 0.6 }, uScale: { value: 1 }, uProj: { value: new THREE.Matrix4() } },
            vertexShader: pointVS,
            fragmentShader: `
                uniform float uRadius; uniform mat4 uProj;
                varying vec3 vView; varying float vSpeed;
                void main() {
                    vec2 c = gl_PointCoord * 2.0 - 1.0; c.y = -c.y;
                    float r2 = dot(c, c);
                    if (r2 > 1.0) discard;
                    float nz = sqrt(1.0 - r2);
                    vec3 p = vView + vec3(c, nz) * uRadius;
                    vec4 clip = uProj * vec4(p, 1.0);
                    gl_FragDepth = (clip.z / clip.w) * 0.5 + 0.5;
                    gl_FragColor = vec4(-p.z, 0.0, 0.0, 1.0);
                }`
        });
        const thickMat = new THREE.ShaderMaterial({
            uniforms: { uRadius: { value: 0.6 }, uScale: { value: 1 } },
            vertexShader: pointVS,
            fragmentShader: `
                varying vec3 vView; varying float vSpeed;
                void main() {
                    vec2 c = gl_PointCoord * 2.0 - 1.0;
                    float r2 = dot(c, c);
                    if (r2 > 1.0) discard;
                    gl_FragColor = vec4(sqrt(1.0 - r2) * 0.6, 0.0, 0.0, 1.0);
                }`,
            blending: THREE.CustomBlending, blendEquation: THREE.AddEquation, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,
            depthTest: false, depthWrite: false, transparent: true
        });
        const dotMat = new THREE.ShaderMaterial({
            uniforms: { uRadius: { value: 0.3 }, uScale: { value: 1 }, uRing: { value: 0 }, uVel: { value: 0 } },
            vertexShader: pointVS,
            fragmentShader: `
                uniform float uRing; uniform float uVel;
                varying vec3 vView; varying float vSpeed;
                void main() {
                    vec2 c = gl_PointCoord * 2.0 - 1.0;
                    float r2 = dot(c, c);
                    if (r2 > 1.0) discard;
                    if (uRing > 0.5 && r2 < 0.55) discard;
                    float s = clamp(vSpeed / 12.0, 0.0, 1.0);
                    vec3 col = mix(vec3(0.15, 0.45, 1.0), vec3(0.85, 0.95, 1.0), s);
                    if (uVel > 0.5) col = mix(mix(vec3(0.1, 0.2, 0.9), vec3(0.1, 0.9, 0.7), clamp(s * 2.0, 0.0, 1.0)), mix(vec3(0.1, 0.9, 0.7), vec3(1.0, 0.35, 0.1), clamp(s * 2.0 - 1.0, 0.0, 1.0)), step(0.5, s));
                    gl_FragColor = vec4(col, 1.0);
                }`
        });
        const fluidPoints = new THREE.Points(geometry, dotMat);
        fluidPoints.frustumCulled = false;
        tank.add(fluidPoints);

        // Screen-space helper scenes (share the particle geometry and the tank transform)
        const depthScene = new THREE.Scene(), thickScene = new THREE.Scene();
        const depthPts = new THREE.Points(geometry, depthMat), thickPts = new THREE.Points(geometry, thickMat);
        depthPts.frustumCulled = thickPts.frustumCulled = false;
        depthPts.matrixAutoUpdate = thickPts.matrixAutoUpdate = false;
        depthScene.add(depthPts); thickScene.add(thickPts);

        const quadGeo = new THREE.PlaneGeometry(2, 2);
        const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const quadVS = `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
        const blurMat = new THREE.ShaderMaterial({
            uniforms: { tDepth: { value: null }, uDir: { value: new THREE.Vector2() } },
            vertexShader: quadVS,
            fragmentShader: `
                uniform sampler2D tDepth; uniform vec2 uDir; varying vec2 vUv;
                void main() {
                    float d0 = texture2D(tDepth, vUv).r;
                    if (d0 <= 0.0) { gl_FragColor = vec4(0.0); return; }
                    float sum = 0.0, wsum = 0.0;
                    for (int i = -9; i <= 9; i++) {
                        float d = texture2D(tDepth, vUv + uDir * float(i)).r;
                        if (d <= 0.0) continue;
                        float ws = exp(-float(i * i) / 40.0);
                        float diff = d - d0;
                        float wr = exp(-diff * diff / 0.35);
                        sum += d * ws * wr; wsum += ws * wr;
                    }
                    gl_FragColor = vec4(sum / max(wsum, 1e-5), 0.0, 0.0, 1.0);
                }`,
            depthTest: false, depthWrite: false
        });
        const compositeMat = new THREE.ShaderMaterial({
            uniforms: {
                tScene: { value: null }, tDepth: { value: null }, tThick: { value: null },
                uTexel: { value: new THREE.Vector2() }, uTanHalf: { value: 0.4 }, uAspect: { value: 1 },
                uAbsorb: { value: 0.8 }, uReflect: { value: 0.5 }, uFresnel: { value: 1.0 },
                uView: { value: new THREE.Matrix3() }
            },
            vertexShader: quadVS,
            fragmentShader: `
                uniform sampler2D tScene, tDepth, tThick;
                uniform vec2 uTexel; uniform float uTanHalf, uAspect, uAbsorb, uReflect, uFresnel;
                uniform mat3 uView;
                varying vec2 vUv;
                vec3 viewPos(vec2 uv, float d) {
                    vec2 ndc = uv * 2.0 - 1.0;
                    return vec3(ndc.x * d * uTanHalf * uAspect, ndc.y * d * uTanHalf, -d);
                }
                float depthAt(vec2 uv) { return texture2D(tDepth, uv).r; }
                void main() {
                    vec4 scn = texture2D(tScene, vUv);
                    float d = depthAt(vUv);
                    if (d <= 0.0) { gl_FragColor = vec4(scn.rgb, 1.0); return; }
                    vec3 P = viewPos(vUv, d);
                    vec2 ex = vec2(uTexel.x, 0.0), ey = vec2(0.0, uTexel.y);
                    float dR = depthAt(vUv + ex), dL = depthAt(vUv - ex), dU = depthAt(vUv + ey), dD = depthAt(vUv - ey);
                    if (dR <= 0.0) dR = d; if (dL <= 0.0) dL = d; if (dU <= 0.0) dU = d; if (dD <= 0.0) dD = d;
                    vec3 ddx = (abs(dR - d) < abs(d - dL)) ? viewPos(vUv + ex, dR) - P : P - viewPos(vUv - ex, dL);
                    vec3 ddy = (abs(dU - d) < abs(d - dD)) ? viewPos(vUv + ey, dU) - P : P - viewPos(vUv - ey, dD);
                    vec3 N = normalize(cross(ddx, ddy));
                    if (N.z < 0.0) N = -N;
                    vec3 V = normalize(-P);
                    float thick = texture2D(tThick, vUv).r;
                    float cosT = clamp(dot(N, V), 0.0, 1.0);
                    float fres = (0.02 + 0.98 * pow(1.0 - cosT, 5.0)) * uFresnel;
                    vec2 off = N.xy * 0.035 * clamp(thick * 0.5, 0.0, 1.5);
                    vec3 refr = texture2D(tScene, clamp(vUv + off, 0.001, 0.999)).rgb;
                    vec3 tint = exp(-thick * uAbsorb * vec3(0.55, 0.16, 0.06));
                    vec3 deep = vec3(0.04, 0.32, 0.62);
                    vec3 body = mix(deep, refr, 0.35) * tint + deep * (1.0 - tint.b) * 0.5;
                    vec3 R = reflect(-V, N);
                    vec3 Rw = transpose(uView) * R;
                    float sky = clamp(Rw.y * 0.5 + 0.5, 0.0, 1.0);
                    vec3 env = mix(vec3(0.16, 0.2, 0.28), vec3(0.75, 0.88, 1.0), sky);
                    vec3 L = normalize(uView * vec3(0.4, 0.8, 0.5));
                    float spec = pow(max(dot(R, L), 0.0), 90.0);
                    float foam = smoothstep(1.6, 0.2, thick) * 0.3;
                    vec3 col = mix(body, env, clamp(fres * uReflect * 1.6, 0.0, 1.0)) + vec3(spec) * 0.9 + vec3(foam);
                    gl_FragColor = vec4(col, 1.0);
                }`,
            depthTest: false, depthWrite: false
        });
        const quadScene = new THREE.Scene();
        const quad = new THREE.Mesh(quadGeo, blurMat);
        quad.frustumCulled = false;
        quadScene.add(quad);

        // ------------------------------------------------------------------
        // Simulation setup
        // ------------------------------------------------------------------
        function allocate(n) {
            N = n;
            pos = new Float32Array(N * 3); vel = new Float32Array(N * 3); pred = new Float32Array(N * 3);
            lam = new Float32Array(N); dpos = new Float32Array(N * 3); speedAttr = new Float32Array(N);
            nbr = new Int32Array(N * MAX_NEIGHBORS); nbrCount = new Uint8Array(N);
            cellOf = new Int32Array(N); cellOrder = new Int32Array(N);
            posAttr = new THREE.BufferAttribute(pos, 3); posAttr.setUsage(THREE.DynamicDrawUsage);
            speedAttrBuf = new THREE.BufferAttribute(speedAttr, 1); speedAttrBuf.setUsage(THREE.DynamicDrawUsage);
            geometry.setAttribute('position', posAttr);
            geometry.setAttribute('aSpeed', speedAttrBuf);
            geometry.setDrawRange(0, 0);
        }

        function setSpacing(r) {
            spacing = r; kh = 2.0 * r;
            gx = Math.floor((BOX.x * 2) / kh) + 3; gy = Math.floor((BOX.y * 2) / kh) + 3; gz = Math.floor((BOX.z * 2) / kh) + 3;
            cellStart = new Int32Array(gx * gy * gz + 1);
            // rest density from the lattice the particles start on
            const h2 = kh * kh, c6 = 315 / (64 * Math.PI * Math.pow(kh, 9));
            let sum = 0;
            for (let i = -3; i <= 3; i++) for (let j = -3; j <= 3; j++) for (let k = -3; k <= 3; k++) {
                const d2 = (i * i + j * j + k * k) * r * r;
                if (d2 < h2) sum += c6 * Math.pow(h2 - d2, 3);
            }
            rho0 = sum;
            let g2 = 0;
            const cs0 = 45 / (Math.PI * Math.pow(kh, 6));
            for (let i = -3; i <= 3; i++) for (let j = -3; j <= 3; j++) for (let k = -3; k <= 3; k++) {
                const d = Math.sqrt(i * i + j * j + k * k) * r;
                if (d > 1e-6 && d < kh) g2 += Math.pow(cs0 * (kh - d) * (kh - d) / rho0, 2);
            }
            epsG2 = Math.max(g2 * 0.1, 1e-4);
            depthMat.uniforms.uRadius.value = r * 1.5;
            thickMat.uniforms.uRadius.value = r * 1.9;
            dotMat.uniforms.uRadius.value = r * 0.55;
        }

        function fillBox(x0, x1, y0, y1, z0, z1, r, list) {
            for (let z = z0 + r / 2; z < z1; z += r) for (let y = y0 + r / 2; y < y1; y += r) for (let x = x0 + r / 2; x < x1; x += r) list.push(x, y, z);
        }

        function buildScenario(name) {
            const volumes = {
                'dam-break': [[-9.8, -3.0, -5.8, 3.6, -4.8, 4.8]],
                'double-dam': [[-9.8, -6.3, -5.8, 3.2, -4.8, 4.8], [6.3, 9.8, -5.8, 3.2, -4.8, 4.8]],
                'drop': [[-9.8, 9.8, -5.8, -3.0, -4.8, 4.8]],
                'faucet': [[-9.8, 9.8, -5.8, -4.6, -4.8, 4.8]],
                'wave-machine': [[-8.0, 9.8, -5.8, -0.8, -4.8, 4.8]]
            }[name];
            let vol = 0;
            for (const b of volumes) vol += (b[1] - b[0]) * (b[3] - b[2]) * (b[5] - b[4]);
            if (name === 'drop') vol += (4 / 3) * Math.PI * Math.pow(2.3, 3);
            const initial = name === 'faucet' ? Math.floor(N / 3) : N;
            const r = Math.cbrt(vol / initial);
            setSpacing(r);
            const list = [];
            for (const b of volumes) fillBox(b[0], b[1], b[2], b[3], b[4], b[5], r, list);
            if (name === 'drop') {
                for (let z = -2.3; z <= 2.3; z += r) for (let y = -2.3; y <= 2.3; y += r) for (let x = -2.3; x <= 2.3; x += r)
                    if (x * x + y * y + z * z < 5.29) list.push(x, y + 3.2, z);
            }
            count = Math.min(N, list.length / 3);
            pos.fill(0); vel.fill(0);
            for (let i = 0; i < count * 3; i++) pos[i] = list[i];
            // tiny jitter so the lattice does not lock up
            for (let i = 0; i < count * 3; i++) pos[i] += (Math.random() - 0.5) * r * 0.02;
            emitCursor = 0;
            paddle.visible = name === 'wave-machine';
            nozzle.visible = name === 'faucet';
            geometry.setDrawRange(0, count);
        }

        function resetSimulation() {
            simTime = 0;
            for (const b of balls) tank.remove(b.mesh);
            balls.length = 0;
            buildScenario(scenario);
            $('particles-stats').textContent = count;
        }

        function changeParticleCount(n) {
            n = clamp(Math.floor(n) || 8000, 2000, MAX_PARTICLES);
            $('inp-count').value = n; $('val-count').textContent = n;
            allocate(n);
            resetSimulation();
        }

        // ------------------------------------------------------------------
        // Position based fluids
        // ------------------------------------------------------------------
        const gLocal = new THREE.Vector3();
        const tmpM = new THREE.Matrix4(), tmpV = new THREE.Vector3();
        const stir = { active: false, p: new THREE.Vector3(), v: new THREE.Vector3(), seen: false };

        function paddleX(t) { return 1.6 * (1 + Math.sin(t * 2.4)) + 0.3; }

        function applyBounds(i3, wallX) {
            const m = spacing * 0.5;
            const x = pred[i3], y = pred[i3 + 1], z = pred[i3 + 2];
            const lo = -BOX.x + wallX + m;
            if (x < lo) pred[i3] = lo + Math.random() * 1e-3; else if (x > BOX.x - m) pred[i3] = BOX.x - m - Math.random() * 1e-3;
            if (y < -BOX.y + m) pred[i3 + 1] = -BOX.y + m + Math.random() * 1e-3; else if (y > BOX.y - m) pred[i3 + 1] = BOX.y - m;
            if (z < -BOX.z + m) pred[i3 + 2] = -BOX.z + m + Math.random() * 1e-3; else if (z > BOX.z - m) pred[i3 + 2] = BOX.z - m - Math.random() * 1e-3;
        }

        function buildGrid() {
            const cells = gx * gy * gz;
            cellStart.fill(0);
            for (let i = 0; i < count; i++) {
                const i3 = i * 3;
                const cx = clamp(Math.floor((pred[i3] + BOX.x) / kh) + 1, 0, gx - 1);
                const cy = clamp(Math.floor((pred[i3 + 1] + BOX.y) / kh) + 1, 0, gy - 1);
                const cz = clamp(Math.floor((pred[i3 + 2] + BOX.z) / kh) + 1, 0, gz - 1);
                const c = cx + gx * (cy + gy * cz);
                cellOf[i] = c; cellStart[c + 1]++;
            }
            for (let c = 0; c < cells; c++) cellStart[c + 1] += cellStart[c];
            const fillPos = cellStart.slice(0, cells);
            for (let i = 0; i < count; i++) cellOrder[fillPos[cellOf[i]]++] = i;
        }

        function buildNeighbors() {
            const h2 = kh * kh;
            for (let i = 0; i < count; i++) {
                const i3 = i * 3;
                const px = pred[i3], py = pred[i3 + 1], pz = pred[i3 + 2];
                const cx = clamp(Math.floor((px + BOX.x) / kh) + 1, 0, gx - 1);
                const cy = clamp(Math.floor((py + BOX.y) / kh) + 1, 0, gy - 1);
                const cz = clamp(Math.floor((pz + BOX.z) / kh) + 1, 0, gz - 1);
                let n = 0;
                const base = i * MAX_NEIGHBORS;
                for (let dz = -1; dz <= 1 && n < MAX_NEIGHBORS; dz++) {
                    const zz = cz + dz; if (zz < 0 || zz >= gz) continue;
                    for (let dy = -1; dy <= 1; dy++) {
                        const yy = cy + dy; if (yy < 0 || yy >= gy) continue;
                        for (let dx = -1; dx <= 1; dx++) {
                            const xx = cx + dx; if (xx < 0 || xx >= gx) continue;
                            const c = xx + gx * (yy + gy * zz);
                            for (let k = cellStart[c], e = cellStart[c + 1]; k < e; k++) {
                                const j = cellOrder[k];
                                if (j === i) continue;
                                const j3 = j * 3;
                                const ddx = px - pred[j3], ddy = py - pred[j3 + 1], ddz = pz - pred[j3 + 2];
                                if (ddx * ddx + ddy * ddy + ddz * ddz < h2 && n < MAX_NEIGHBORS) nbr[base + n++] = j;
                            }
                        }
                    }
                }
                nbrCount[i] = n;
            }
        }

        function solveDensity(wallX, measure) {
            const h = kh, h2 = h * h;
            const c6 = 315 / (64 * Math.PI * Math.pow(h, 9));
            const cs = -45 / (Math.PI * Math.pow(h, 6));
            const invRho0 = 1 / rho0;
            let err = 0, errN = 0;
            for (let i = 0; i < count; i++) {
                const i3 = i * 3;
                const px = pred[i3], py = pred[i3 + 1], pz = pred[i3 + 2];
                let rho = c6 * h2 * h2 * h2;
                let gxs = 0, gys = 0, gzs = 0, sumG2 = 0;
                const n = nbrCount[i], base = i * MAX_NEIGHBORS;
                for (let k = 0; k < n; k++) {
                    const j3 = nbr[base + k] * 3;
                    const dx = px - pred[j3], dy = py - pred[j3 + 1], dz = pz - pred[j3 + 2];
                    const r2 = dx * dx + dy * dy + dz * dz;
                    const w = h2 - r2;
                    rho += c6 * w * w * w;
                    const r = Math.sqrt(r2) + 1e-6;
                    const f = cs * (h - r) * (h - r) / r * invRho0;
                    const gxj = f * dx, gyj = f * dy, gzj = f * dz;
                    gxs += gxj; gys += gyj; gzs += gzj;
                    sumG2 += gxj * gxj + gyj * gyj + gzj * gzj;
                }
                sumG2 += gxs * gxs + gys * gys + gzs * gzs;
                const C = rho * invRho0 - 1;
                if (measure && i % 8 === 0) { err += Math.abs(C); errN++; }
                lam[i] = C > 0 ? -C / (sumG2 + epsG2) : 0;
            }
            for (let i = 0; i < count; i++) {
                const i3 = i * 3;
                const px = pred[i3], py = pred[i3 + 1], pz = pred[i3 + 2];
                let sx = 0, sy = 0, sz = 0;
                const n = nbrCount[i], base = i * MAX_NEIGHBORS, li = lam[i];
                for (let k = 0; k < n; k++) {
                    const j = nbr[base + k], j3 = j * 3;
                    const dx = px - pred[j3], dy = py - pred[j3 + 1], dz = pz - pred[j3 + 2];
                    const r = Math.sqrt(dx * dx + dy * dy + dz * dz) + 1e-6;
                    const f = (li + lam[j]) * cs * (h - r) * (h - r) / r * invRho0;
                    sx += f * dx; sy += f * dy; sz += f * dz;
                }
                dpos[i3] = sx; dpos[i3 + 1] = sy; dpos[i3 + 2] = sz;
            }
            for (let i = 0; i < count; i++) {
                const i3 = i * 3;
                pred[i3] += dpos[i3] * 0.8; pred[i3 + 1] += dpos[i3 + 1] * 0.8; pred[i3 + 2] += dpos[i3 + 2] * 0.8;
                applyBounds(i3, wallX);
            }
            if (measure && errN) densityError = (err / errN) * 100;
        }

        function stepBalls(dt) {
            for (const b of balls) {
                b.vel.addScaledVector(gLocal, dt * 0.45);
                b.vel.multiplyScalar(1 - 0.35 * dt);
                const R = b.r, R2 = (R + spacing * 0.5) * (R + spacing * 0.5);
                let px = 0, py = 0, pz = 0, hits = 0;
                for (let i = 0; i < count; i++) {
                    const i3 = i * 3;
                    const dx = pred[i3] - b.pos.x, dy = pred[i3 + 1] - b.pos.y, dz = pred[i3 + 2] - b.pos.z;
                    const d2 = dx * dx + dy * dy + dz * dz;
                    if (d2 < R2) {
                        const d = Math.sqrt(d2) + 1e-6, pen = (R + spacing * 0.5) - d;
                        const nx = dx / d, ny = dy / d, nz = dz / d;
                        pred[i3] += nx * pen; pred[i3 + 1] += ny * pen; pred[i3 + 2] += nz * pen;
                        px -= nx * pen; py -= ny * pen; pz -= nz * pen; hits++;
                    }
                }
                if (hits) b.vel.addScaledVector(tmpV.set(px, py, pz), 1.1);
                if (b.vel.length() > 14) b.vel.setLength(14);
                b.pos.addScaledVector(b.vel, dt);
                if (b.pos.x < -BOX.x + R) { b.pos.x = -BOX.x + R; b.vel.x *= -0.4; } else if (b.pos.x > BOX.x - R) { b.pos.x = BOX.x - R; b.vel.x *= -0.4; }
                if (b.pos.y < -BOX.y + R) { b.pos.y = -BOX.y + R; b.vel.y *= -0.3; } else if (b.pos.y > BOX.y - R) { b.pos.y = BOX.y - R; b.vel.y *= -0.3; }
                if (b.pos.z < -BOX.z + R) { b.pos.z = -BOX.z + R; b.vel.z *= -0.4; } else if (b.pos.z > BOX.z - R) { b.pos.z = BOX.z - R; b.vel.z *= -0.4; }
                b.mesh.position.copy(b.pos);
            }
        }

        function spawnBall(kind = 'duck') {
            const r = 1.1;
            const mesh = new THREE.Group();
            if (kind === 'crate') {
                const box = new THREE.Mesh(new THREE.BoxGeometry(1.7, 1.7, 1.7), new THREE.MeshStandardMaterial({ color: 0xb07a3c, roughness: 0.8 }));
                const band = new THREE.Mesh(new THREE.BoxGeometry(1.74, 0.2, 1.74), new THREE.MeshStandardMaterial({ color: 0x6b4420, roughness: 0.9 }));
                mesh.add(box, band);
                mesh.rotation.y = Math.random() * 3;
            } else {
                const yellow = new THREE.MeshStandardMaterial({ color: 0xffd23c, roughness: 0.4 });
                const body = new THREE.Mesh(new THREE.SphereGeometry(0.95, 24, 16), yellow); body.scale.set(1.1, 0.8, 0.9);
                const head = new THREE.Mesh(new THREE.SphereGeometry(0.55, 20, 14), yellow); head.position.set(0.55, 0.85, 0);
                const beak = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.5, 12), new THREE.MeshStandardMaterial({ color: 0xff8c1a }));
                beak.rotation.z = -Math.PI / 2; beak.position.set(1.1, 0.8, 0);
                const eye = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), new THREE.MeshBasicMaterial({ color: 0x111111 }));
                eye.position.set(0.85, 1.05, 0.3);
                const eye2 = eye.clone(); eye2.position.z = -0.3;
                mesh.add(body, head, beak, eye, eye2);
                mesh.rotation.y = Math.random() * 6;
            }
            const b = { pos: new THREE.Vector3((Math.random() - 0.5) * 8, BOX.y - 1.8, (Math.random() - 0.5) * 4), vel: new THREE.Vector3(0, -2, 0), r, mesh };
            mesh.position.copy(b.pos);
            tank.add(mesh);
            balls.push(b);
            if (balls.length > 4) { tank.remove(balls.shift().mesh); }
        }

        function emitFaucet() {
            if (count === 0) return;
            for (let e = 0; e < 5; e++) {
                let idx;
                if (count < N) { idx = count++; } else { idx = emitCursor; emitCursor = (emitCursor + 1) % N; }
                const a = Math.random() * Math.PI * 2, rad = Math.random() * 0.45;
                const i3 = idx * 3;
                pos[i3] = Math.cos(a) * rad; pos[i3 + 1] = BOX.y - 0.9 - Math.random() * 0.6; pos[i3 + 2] = Math.sin(a) * rad;
                vel[i3] = (Math.random() - 0.5) * 0.4; vel[i3 + 1] = -6.5; vel[i3 + 2] = (Math.random() - 0.5) * 0.4;
            }
            geometry.setDrawRange(0, count);
            $('particles-stats').textContent = count;
        }

        let frameCount = 0;
        function simulateStep() {
            const dt = cfg.dt;
            simTime += dt;
            const wallX = scenario === 'wave-machine' ? paddleX(simTime) : 0;
            if (scenario === 'wave-machine') paddle.position.set(-BOX.x + wallX - 0.3, 0, 0);
            if (scenario === 'faucet') emitFaucet();

            // gravity in the tank's own frame
            tmpM.makeRotationFromEuler(tank.rotation).invert();
            gLocal.set(0, -cfg.gravity, 0).applyMatrix4(tmpM);

            const stirOn = stir.active;
            for (let i = 0; i < count; i++) {
                const i3 = i * 3;
                if (stirOn) {
                    const dx = pos[i3] - stir.p.x, dy = pos[i3 + 1] - stir.p.y, dz = pos[i3 + 2] - stir.p.z;
                    const d2 = dx * dx + dy * dy + dz * dz;
                    if (d2 < 6) { const f = (1 - d2 / 6) * 0.12; vel[i3] += stir.v.x * f; vel[i3 + 1] += stir.v.y * f; vel[i3 + 2] += stir.v.z * f; }
                }
                vel[i3] += gLocal.x * dt; vel[i3 + 1] += gLocal.y * dt; vel[i3 + 2] += gLocal.z * dt;
                const sp2 = vel[i3] * vel[i3] + vel[i3 + 1] * vel[i3 + 1] + vel[i3 + 2] * vel[i3 + 2];
                if (sp2 > 400) { const s = 20 / Math.sqrt(sp2); vel[i3] *= s; vel[i3 + 1] *= s; vel[i3 + 2] *= s; }
                pred[i3] = pos[i3] + vel[i3] * dt; pred[i3 + 1] = pos[i3 + 1] + vel[i3 + 1] * dt; pred[i3 + 2] = pos[i3 + 2] + vel[i3 + 2] * dt;
                applyBounds(i3, wallX);
            }
            stepBalls(dt);
            buildGrid();
            buildNeighbors();
            const measureAt = (frameCount++ % 12) === 0;
            for (let it = 0; it < cfg.iterations; it++) solveDensity(wallX, measureAt && it === cfg.iterations - 1);

            // velocities from displacement + XSPH smoothing
            const vmix = clamp(cfg.viscosity * 6, 0, 0.9);
            const inv = 1 / dt;
            for (let i = 0; i < count; i++) {
                const i3 = i * 3;
                vel[i3] = (pred[i3] - pos[i3]) * inv; vel[i3 + 1] = (pred[i3 + 1] - pos[i3 + 1]) * inv; vel[i3 + 2] = (pred[i3 + 2] - pos[i3 + 2]) * inv;
            }
            if (vmix > 0.001) {
                for (let i = 0; i < count; i++) {
                    const n = nbrCount[i]; if (!n) continue;
                    const i3 = i * 3, base = i * MAX_NEIGHBORS;
                    let ax = 0, ay = 0, az = 0;
                    for (let k = 0; k < n; k++) { const j3 = nbr[base + k] * 3; ax += vel[j3]; ay += vel[j3 + 1]; az += vel[j3 + 2]; }
                    dpos[i3] = ax / n; dpos[i3 + 1] = ay / n; dpos[i3 + 2] = az / n;
                }
                for (let i = 0; i < count; i++) {
                    if (!nbrCount[i]) continue;
                    const i3 = i * 3;
                    vel[i3] += (dpos[i3] - vel[i3]) * vmix; vel[i3 + 1] += (dpos[i3 + 1] - vel[i3 + 1]) * vmix; vel[i3 + 2] += (dpos[i3 + 2] - vel[i3 + 2]) * vmix;
                }
            }
            for (let i = 0; i < count; i++) {
                const i3 = i * 3;
                pos[i3] = pred[i3]; pos[i3 + 1] = pred[i3 + 1]; pos[i3 + 2] = pred[i3 + 2];
                speedAttr[i] = Math.sqrt(vel[i3] * vel[i3] + vel[i3 + 1] * vel[i3 + 1] + vel[i3 + 2] * vel[i3 + 2]);
            }
            posAttr.needsUpdate = true; speedAttrBuf.needsUpdate = true;
        }

        // ------------------------------------------------------------------
        // Rendering
        // ------------------------------------------------------------------
        const normalView = new THREE.Matrix3();
        function renderFrame() {
            const w = renderer.domElement.width, h = renderer.domElement.height;
            const scale = h / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
            for (const m of [depthMat, thickMat, dotMat]) m.uniforms.uScale.value = scale;
            fluidPoints.visible = renderMode !== 'screen-space';
            dotMat.uniforms.uRing.value = renderMode === 'wireframe' ? 1 : 0;
            dotMat.uniforms.uVel.value = renderMode === 'velocity' ? 1 : 0;
            if (renderMode !== 'screen-space' || count === 0) {
                renderer.setRenderTarget(null);
                renderer.render(scene, camera);
                return;
            }
            // 1. everything except the water
            renderer.setRenderTarget(sceneRT);
            renderer.render(scene, camera);
            // 2. particle depth and thickness
            tank.updateMatrixWorld(true);
            camera.updateMatrixWorld(true);
            depthPts.matrixWorld.copy(tank.matrixWorld); thickPts.matrixWorld.copy(tank.matrixWorld);
            depthPts.matrixWorldNeedsUpdate = false;
            depthMat.uniforms.uProj.value.copy(camera.projectionMatrix);
            renderer.setRenderTarget(depthRT);
            renderer.setClearColor(0x000000, 0); renderer.clear(true, true, false);
            renderer.render(depthScene, camera);
            renderer.setRenderTarget(thickRT);
            renderer.clear(true, false, false);
            renderer.render(thickScene, camera);
            // 3. bilateral blur
            quad.material = blurMat;
            blurMat.uniforms.tDepth.value = depthRT.texture; blurMat.uniforms.uDir.value.set(1 / w, 0);
            renderer.setRenderTarget(blurRT1); renderer.render(quadScene, quadCam);
            blurMat.uniforms.tDepth.value = blurRT1.texture; blurMat.uniforms.uDir.value.set(0, 1 / h);
            renderer.setRenderTarget(blurRT2); renderer.render(quadScene, quadCam);
            blurMat.uniforms.tDepth.value = blurRT2.texture; blurMat.uniforms.uDir.value.set(1 / w, 0);
            renderer.setRenderTarget(blurRT1); renderer.render(quadScene, quadCam);
            // 4. composite
            quad.material = compositeMat;
            const u = compositeMat.uniforms;
            u.tScene.value = sceneRT.texture; u.tDepth.value = blurRT1.texture; u.tThick.value = thickRT.texture;
            u.uTexel.value.set(1 / w, 1 / h);
            u.uTanHalf.value = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)); u.uAspect.value = camera.aspect;
            u.uAbsorb.value = cfg.absorption; u.uReflect.value = cfg.reflection; u.uFresnel.value = cfg.fresnel;
            u.uView.value.setFromMatrix4(camera.matrixWorldInverse);
            renderer.setRenderTarget(null);
            renderer.render(quadScene, quadCam);
        }

        // ------------------------------------------------------------------
        // UI
        // ------------------------------------------------------------------
        function updateTank() { tank.rotation.set(THREE.MathUtils.degToRad(cfg.tiltX), 0, THREE.MathUtils.degToRad(cfg.tiltY)); }
        const bindRange = (id, valId, fmt, fn) => {
            const el = $(id);
            const apply = () => { $(valId).textContent = fmt(+el.value); fn(+el.value); };
            el.addEventListener('input', apply);
            apply();
        };
        bindRange('inp-grav', 'val-grav', (v) => v.toFixed(1), (v) => { cfg.gravity = v; });
        bindRange('inp-visc', 'val-visc', (v) => v.toFixed(1), (v) => { cfg.viscosity = v * 0.03; });
        bindRange('inp-tilt', 'val-tilt', (v) => v + '°', (v) => { cfg.tiltY = v; updateTank(); });
        $('inp-count').addEventListener('input', (e) => { $('val-count').textContent = e.target.value; });
        $('inp-count').addEventListener('change', (e) => changeParticleCount(+e.target.value));
        const sliders = {
            'camera-y': { set(v) { cfg.tiltY = clamp(v, -45, 45); $('inp-tilt').value = cfg.tiltY; $('val-tilt').textContent = Math.round(cfg.tiltY) + '°'; updateTank(); } },
            'camera-x': { set(v) { cfg.tiltX = clamp(v, -45, 45); updateTank(); } }
        };
        function setPaused(p) { paused = p; $('btn-pause').textContent = p ? 'Resume' : 'Pause'; }
        $('btn-pause').addEventListener('click', () => setPaused(!paused));
        $('btn-step').addEventListener('click', () => { setPaused(true); stepOnce = true; });
        $('btn-reset').addEventListener('click', () => { cfg.tiltX = 0; cfg.tiltY = 0; $('inp-tilt').value = 0; $('val-tilt').textContent = '0°'; updateTank(); resetSimulation(); });
        const scenarioButtons = { 'scen-dam': 'dam-break', 'scen-double': 'double-dam', 'scen-drop': 'drop', 'scen-faucet': 'faucet', 'scen-wave': 'wave-machine' };
        for (const [id, name] of Object.entries(scenarioButtons)) {
            $(id).addEventListener('click', () => {
                scenario = name;
                for (const other of Object.keys(scenarioButtons)) $(other).style.borderColor = other === id ? '#38bdf8' : '';
                resetSimulation();
            });
        }
        $('scen-dam').style.borderColor = '#38bdf8';
        $('sel-mode').addEventListener('change', (e) => { renderMode = { liquid: 'screen-space', particles: 'particles', vel: 'velocity' }[e.target.value]; });
        $('btn-duck').addEventListener('click', () => spawnBall('duck'));
        $('btn-crate').addEventListener('click', () => spawnBall('crate'));
        $('toggle-ui').addEventListener('click', () => document.body.classList.toggle('hidden-ui'));

        // Stir with the left mouse button on a plane through the tank centre
        const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), stirPlane = new THREE.Plane(), hitW = new THREE.Vector3();
        let lastStirP = null, lastStirT = 0;
        function stirPoint(e) {
            ndc.set(e.clientX / window.innerWidth * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
            ray.setFromCamera(ndc, camera);
            stirPlane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(tmpV).negate(), tank.position);
            if (!ray.ray.intersectPlane(stirPlane, hitW)) return null;
            return tank.worldToLocal(hitW.clone());
        }
        canvas.addEventListener('pointerdown', (e) => {
            if (e.button !== 0) return;
            const p = stirPoint(e); if (!p) return;
            stir.active = true; stir.p.copy(p); stir.v.set(0, 0, 0); lastStirP = p; lastStirT = performance.now();
        });
        canvas.addEventListener('pointermove', (e) => {
            if (!stir.active) return;
            const p = stirPoint(e); if (!p) return;
            const now = performance.now(), dt = Math.max(0.008, (now - lastStirT) / 1000);
            stir.v.copy(p).sub(lastStirP).multiplyScalar(1 / dt);
            if (stir.v.length() > 30) stir.v.setLength(30);
            stir.p.copy(p); lastStirP = p; lastStirT = now;
        });
        const endStir = () => { stir.active = false; };
        window.addEventListener('pointerup', endStir);
        canvas.addEventListener('pointerleave', endStir);

        const keys = {};
        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            keys[k] = true;
            if (e.key.startsWith('Arrow')) e.preventDefault();
            if (e.code === 'Space') { e.preventDefault(); spawnBall('duck'); }
            else if (k === 'r') resetSimulation();
            else if (k === 'p') { if (e.shiftKey) { setPaused(true); stepOnce = true; } else setPaused(!paused); }
            else if (k === 'u') document.body.classList.toggle('hidden-ui');
        });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            makeTargets();
        });

        function handleKeys(dt) {
            if (keys['arrowleft']) sliders['camera-y'].set(cfg.tiltY - 40 * dt);
            if (keys['arrowright']) sliders['camera-y'].set(cfg.tiltY + 40 * dt);
            if (keys['arrowup']) sliders['camera-x'].set(cfg.tiltX - 40 * dt);
            if (keys['arrowdown']) sliders['camera-x'].set(cfg.tiltX + 40 * dt);
            const off = camera.position.clone().sub(controls.target);
            const sph = new THREE.Spherical().setFromVector3(off);
            let moved = false;
            if (keys['a']) { sph.theta -= 1.2 * dt; moved = true; }
            if (keys['d']) { sph.theta += 1.2 * dt; moved = true; }
            if (keys['w']) { sph.phi = clamp(sph.phi - 0.9 * dt, 0.15, 1.5); moved = true; }
            if (keys['s']) { sph.phi = clamp(sph.phi + 0.9 * dt, 0.15, 1.5); moved = true; }
            if (moved) camera.position.copy(controls.target).add(off.setFromSpherical(sph));
        }

        // ------------------------------------------------------------------
        // Main loop
        // ------------------------------------------------------------------
        let last = performance.now(), fpsFrames = 0, fpsTime = 0, simMs = 0, renderMs = 0;
        function animate(now) {
            requestAnimationFrame(animate);
            const dt = Math.min((now - last) / 1000, 0.1); last = now;
            handleKeys(dt);
            if (!paused || stepOnce) {
                const t0 = performance.now();
                simulateStep();
                simMs = simMs * 0.9 + (performance.now() - t0) * 0.1;
                stepOnce = false;
            }
            controls.update();
            const t1 = performance.now();
            renderFrame();
            renderMs = renderMs * 0.9 + (performance.now() - t1) * 0.1;
            fpsFrames++; fpsTime += dt;
            if (fpsTime >= 0.5) {
                const fps = Math.round(fpsFrames / fpsTime);
                $('fps').textContent = fps; $('sd-fps').textContent = fps;
                $('stat-count').textContent = count;
                $('stat-time').textContent = simMs.toFixed(1) + ' ms';
                $('sd-render').textContent = renderMs.toFixed(1);
                $('sd-load').textContent = Math.round(count / Math.max(1, gx * gy * gz) * 100) / 100;
                $('sd-iters').textContent = cfg.iterations;
                $('density').textContent = densityError.toFixed(2) + '%';
                fpsFrames = 0; fpsTime = 0;
            }
        }

        if (!renderer.capabilities.isWebGL2) {
            const msg = document.createElement('div');
            msg.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:16px sans-serif;background:#000;z-index:99';
            msg.textContent = 'This simulation needs WebGL 2.';
            document.body.appendChild(msg);
        }
        $('loader').classList.add('hidden');
                allocate(N);
        resetSimulation();
        requestAnimationFrame(animate);
        window.__FLUID__ = { cfg, get count() { return count; }, resetSimulation, spawnBall };
    </script>
</body>
</html>
