<!doctype html>
<html lang="en">
<head>

<title>42U Rack · Opus 5.5 Low</title>
<style>
  :root { --bg:#14171b; --panel:rgba(16,20,25,.88); --line:#2c343e; --ink:#d9e0e8; --dim:#8794a3; --acc:#4fa3e0; --warn:#e0a24f; }

  #slicebar .mid { text-align:center; min-width:190px; }

</style>

<body>
<div id="title" class="panel"><b>42U RACK · OPUS 5.5 (LOW)</b><small id="modeName">FULL RACK MODE — hover a server, click to inspect</small></div>
<div id="tip" class="panel"></div>

  <button id="prev">&lt; PREVIOUS SERVER</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
<script>
if (!window.THREE) {
  document.body.insertAdjacentHTML('beforeend', '<div class="panel" style="left:30%;top:40%;padding:16px">three.js could not be loaded from ../../airline_tycoon/scene/vendor/.</div>');
  throw new Error('three missing');
}
const V3 = THREE.Vector3;

// ───────────────────────────── renderer / scene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14171b);
const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 400);

(() => {
  const pm = new THREE.PMREMGenerator(renderer), es = new THREE.Scene();
  es.add(new THREE.Mesh(new THREE.BoxGeometry(60, 30, 60), new THREE.MeshBasicMaterial({ color: 0x262c34, side: THREE.BackSide })));
  const lp = (c, x, y, z, sx, sy, sz) => { const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), new THREE.MeshBasicMaterial({ color: new THREE.Color(c, c, c) })); m.position.set(x, y, z); es.add(m); };
  lp(6, 0, 14, 0, 30, 1, 8); lp(3, -28, 6, 0, 1, 10, 30); lp(2, 28, 4, 10, 1, 6, 20); lp(1.5, 0, 6, 28, 30, 6, 1);
  scene.environment = pm.fromScene(es, 0.04).texture;
})();
scene.add(new THREE.HemisphereLight(0xdfe8f0, 0x1c2026, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.5); key.position.set(10, 24, 16); scene.add(key);
const fill = new THREE.DirectionalLight(0xbcd2ff, 0.45); fill.position.set(-14, 8, -10); scene.add(fill);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x1a1e23, roughness: .9, metalness: 0 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const grid = new THREE.GridHelper(120, 120, 0x2a3138, 0x20262c); grid.position.y = 0.002; scene.add(grid);

// ───────────────────────────── materials + instancing kit
function makeMats() {
  const s = (c, m, r) => new THREE.MeshStandardMaterial({ color: c, metalness: m, roughness: r });
  const e = (c, i = 2.2) => new THREE.MeshStandardMaterial({ color: 0x111111, emissive: c, emissiveIntensity: i });
  const duct = s(0x15171a, .1, .6); duct.transparent = true; duct.opacity = .42; duct.depthWrite = false;
  return {
    chassis: s(0x3a3f46, .75, .42), wall: s(0x484e57, .78, .38), cover: s(0x50565f, .75, .4), silver: s(0xb7bcc3, .92, .28),
    alu: s(0xcdd1d6, .88, .3), dark: s(0x1c1f23, .4, .6), black: s(0x0e0f11, .1, .7), plastic: s(0x2a2c30, .1, .55),
    pcb: s(0x1d4a2b, .15, .5), pcbDark: s(0x161c19, .2, .5), gold: s(0xd2a54a, 1, .25), copper: s(0xb8733a, 1, .3),
    spreader: s(0x2a2e35, .7, .35), fan: s(0x131416, .1, .6), grille: s(0x08090a, .3, .7), psu: s(0x5d636b, .8, .4),
    label: s(0xd8dce1, 0, .8), blue: s(0x2a6fb8, 0, .55), yellow: s(0xc6a02a, 0, .55), orange: s(0xc0651f, 0, .55),
    pcable: s(0x18191b, 0, .75), rackFrame: s(0x23272c, .7, .45), rail: s(0x8e949b, .85, .35), blank: s(0x1e2125, .5, .55),
    pdu: s(0x141619, .3, .55), duct,
    ledG: e(0x37ff6e), ledB: e(0x3aa0ff), ledA: e(0xffaa2a), ledW: e(0xe8f2ff, 1.6)
  };
}
const UB = new THREE.BoxGeometry(1, 1, 1), UC = new THREE.CylinderGeometry(.5, .5, 1, 14);
class Kit {
  constructor(group, mats) { this.g = group; this.m = mats; this.b = {}; }
  add(geo, mk, x, y, z, sx, sy, sz, rx = 0, ry = 0, rz = 0) {
    const k = (geo === UB ? 'b' : 'c') + mk;
    (this.b[k] || (this.b[k] = { geo, mk, list: [] })).list.push([x, y, z, sx, sy, sz, rx, ry, rz]);
  }
  box(w, h, d, x, y, z, mk, rx, ry, rz) { this.add(UB, mk, x, y + h / 2, z, w, h, d, rx, ry, rz); }
  cyl(r, h, x, y, z, mk, axis = 'y') { this.add(UC, mk, x, y, z, 2 * r, h, 2 * r, axis === 'z' ? Math.PI / 2 : 0, 0, axis === 'x' ? Math.PI / 2 : 0); }
  flush() {
    const o = new THREE.Object3D();
    for (const k in this.b) {
      const { geo, mk, list } = this.b[k];
      const im = new THREE.InstancedMesh(geo, this.m[mk], list.length);
      list.forEach((p, i) => { o.position.set(p[0], p[1], p[2]); o.rotation.set(p[6], p[7], p[8]); o.scale.set(p[3], p[4], p[5]); o.updateMatrix(); im.setMatrixAt(i, o.matrix); });
      im.instanceMatrix.needsUpdate = true; im.computeBoundingSphere(); this.g.add(im);
    }
    this.b = {};
  }
}
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function label(txt, h = .3, col = '#dfe6ee', border = '#4a90c8') {
  const c = document.createElement('canvas'), x = c.getContext('2d'), fs = 44, lines = txt.split('\n');
  x.font = `600 ${fs}px Segoe UI, sans-serif`;
  const w = Math.ceil(Math.max(...lines.map(l => x.measureText(l).width)) + 36), hh = Math.ceil(lines.length * fs * 1.2 + 20);
  c.width = w; c.height = hh;
  x.fillStyle = 'rgba(12,16,20,.85)'; x.beginPath(); x.roundRect(2, 2, w - 4, hh - 4, 12); x.fill();
  x.strokeStyle = border; x.lineWidth = 3; x.stroke();
  x.font = `600 ${fs}px Segoe UI, sans-serif`; x.fillStyle = col; x.textBaseline = 'top';
  lines.forEach((l, i) => x.fillText(l, 18, 12 + i * fs * 1.2));
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false, transparent: true }));
  const H = h * lines.length; s.scale.set(H * w / hh, H, 1); s.renderOrder = 20; return s;
}

// ───────────────────────────── rack geometry constants
const U = 0.445, RAIL_W = 4.82, RACK_W = 6.4, RACK_D = 10.6, BASE = 0.9, RACK_H = 42 * U;
const ZF = 4.8, W = 4.3, BT = .12;              // server front plane in rack, chassis width, mainboard top
const uY = n => BASE + (n - 1) * U;
const STAGE = new V3(0, 1.0, 17);

const TYPES = {
  gp:      { D: 6.6, info: '1U · compact & shallow · 2 CPU · 16 DIMM · 1 LP PCIe', role: 'Web / app tier' },
  virt:    { D: 7.2, info: '2U · CPU-heavy · 2 CPU · 32 DIMM · 2 risers', role: 'Hypervisor (VM density)' },
  db:      { D: 7.2, info: '2U · 24× NVMe U.2 · 32 DIMM · 4× 100G', role: 'OLTP database' },
  gpu:     { D: 8.6, info: '4U · 8× SXM accelerators · 10-fan wall · 6 PSU', role: 'Training / inference' },
  storage: { D: 8.2, info: '4U · 24× 3.5" LFF · SAS backplane · HBA', role: 'Object / backup storage' }
};
const SERVERS = [
  { name: 'AI COMPUTE NODE', type: 'gpu', top: 39, u: 4, host: 'gpu-01' },
  { name: 'DATABASE SERVER', type: 'db', top: 34, u: 2, host: 'db-01' },
  { name: 'VIRTUALIZATION HOST', type: 'virt', top: 32, u: 2, host: 'vmh-01' },
  { name: 'VIRTUALIZATION HOST', type: 'virt', top: 30, u: 2, host: 'vmh-02' },
  { name: 'GENERAL PURPOSE', type: 'gp', top: 28, u: 1, host: 'app-01' },
  { name: 'GENERAL PURPOSE', type: 'gp', top: 27, u: 1, host: 'app-02' },
  { name: 'GENERAL PURPOSE', type: 'gp', top: 26, u: 1, host: 'app-03' },
  { name: 'STORAGE NODE', type: 'storage', top: 8, u: 4, host: 'stor-01' },
  { name: 'AI COMPUTE NODE', type: 'gpu', top: 4, u: 4, host: 'gpu-02' }
];
SERVERS.forEach(s => { s.bottom = s.top - s.u + 1; s.D = TYPES[s.type].D; s.range = `U${s.bottom}-U${s.top}`; if (s.u === 1) s.range = `U${s.top}`; });
const SWITCHES = [
  { name: 'TOR SWITCH A', u: 42, ports: 'blue', info: '48× 25G SFP28 · 8× 100G' },
  { name: 'TOR SWITCH B', u: 41, ports: 'yellow', info: '48× 25G SFP28 · 8× 100G' },
  { name: 'MGMT SWITCH', u: 21, ports: 'orange', info: '48× 1G RJ45 (BMC network)' }
];
const BLANKS = [35, 25, 24, 20, 19, 18, 17, 16, 15, 14, 13, 12, 11, 10, 9, 21];
const OPEN = [22, 23];

const rackMats = makeMats();

// ───────────────────────────── server builder (shared by rack LOD and slice LOD)
const LAYERS = ['base', 'rear', 'storage', 'board', 'fans', 'cpumem', 'duct', 'pcie', 'cover'];
const EXPLODE_IDX = { base: 0, rear: 0, storage: 1, board: 2, fans: 3, cpumem: 4, duct: 5, pcie: 6, cover: 7 };
const EXPLODE_NAME = { storage: 'STORAGE BACKPLANE', board: 'MAINBOARD', fans: 'FAN WALL', cpumem: 'CPU + MEMORY', duct: 'AIR DUCT', pcie: 'GPU / PCIe ASSEMBLY', cover: 'TOP COVER', base: 'BASE CHASSIS' };

function buildServer(spec, hi) {
  const H = spec.u * U - .02, D = spec.D, mats = hi ? makeMats() : rackMats;
  const root = new THREE.Group(), L = {}, kits = {};
  for (const n of LAYERS) { L[n] = new THREE.Group(); root.add(L[n]); kits[n] = new Kit(L[n], mats); }
  const c = { spec, hi, H, D, f: D / 2, r: -D / 2, K: n => kits[n], L, mats, obs: [], rotors: [], zones: {}, vents: [], rnd: rng(spec.top * 97 + spec.u) };
  const k = c.K('base');
  if (!hi) k.box(W, H, D - .04, 0, 0, 0, 'chassis');
  else {
    k.box(W, .04, D, 0, 0, 0, 'chassis');
    for (const sx of [-1, 1]) {
      k.box(.04, H, D, sx * (W / 2 - .02), 0, 0, 'wall');
      k.box(.05, .16, D * .94, sx * (W / 2 + .045), H / 2 - .08, 0, 'silver');
      for (let z = -D / 2 + .4; z < D / 2; z += 1.2) k.cyl(.025, .03, sx * (W / 2 + .07), H / 2, z, 'silver', 'x');
      k.box(.18, .03, D - .1, sx * (W / 2 - .13), H - .05, 0, 'wall');
    }
    for (const z of [c.f - .25, c.r + .25]) k.box(W, .05, .04, 0, H - .07, z, 'wall');
    const cv = c.K('cover');
    cv.box(W + .02, .03, D, 0, H, 0, 'cover');
    for (let i = 0; i < 9; i++) cv.box(.9, .006, .05, .9, H + .03, c.r + .5 + i * .12, 'grille');
    for (let z = -D / 2 + .3; z < D / 2; z += .9) for (const sx of [-1, 1]) cv.cyl(.035, .02, sx * (W / 2 - .1), H + .035, z, 'silver');
  }
  for (const sx of [-1, 1]) {
    k.box(.42, H, .07, sx * (W / 2 + .2), 0, c.f - .035, 'chassis');
    k.cyl(.045, .1, sx * (W / 2 + .26), H / 2, c.f + .02, 'silver', 'z');
    if (spec.u > 1) { k.box(.05, H * .6, .05, sx * (W / 2 + .3), H * .2, c.f + .09, 'silver'); }
  }
  k.box(.18, .05, .01, -W / 2 - .18, H - .09, c.f + .002, 'label');
  BUILD[spec.type](c);
  if (hi) {
    const rp = c.K('base');
    rp.box(W - .08, H - .05, .025, 0, .03, c.r + .015, 'wall');
    for (const [x0, x1, y0, y1] of c.vents)
      for (let x = x0 + .04; x < x1 - .03; x += .09) for (let y = y0 + .04; y < y1 - .03; y += .09) rp.box(.055, .055, .006, x, y, c.r - .001, 'grille');
  }
  for (const n of LAYERS) kits[n].flush();
  root.userData.ctx = c;
  return c;
}

// ── shared parts
const ob = (c, x0, x1, y0, y1, z0, z1, kind, heat = 0) => c.hi && c.obs.push({ x0, x1, y0, y1, z0: Math.min(z0, z1), z1: Math.max(z0, z1), kind, heat });

function drive(c, x, y, w, h, len, lff) {
  const k = c.K('storage');
  k.box(w, h, .06, x, y, c.f + .03, 'dark');
  k.box(w * (lff ? .9 : .28), h * (lff ? .22 : .86), .02, x + (lff ? 0 : w * .28), y + h * (lff ? .62 : .07), c.f + .065, 'silver');
  k.cyl(.018, .02, x - w * (lff ? .42 : .25), y + h * .82, c.f + .07, c.rnd() < .9 ? 'ledG' : 'ledA', 'z');
  if (lff) for (let i = 0; i < 5; i++) k.box(.1, h * .12, .01, x - w * .3 + i * .15, y + h * .2, c.f + .065, 'grille');
  if (c.hi) {
    k.box(w * .92, h * .86, len, x, y + h * .07, c.f - len / 2, lff ? 'alu' : 'spreader');
    k.box(w * .9, .01, len * .5, x, y + h * .93, c.f - len * .4, 'pcb');
  }
}
function backplane(c, z, x0, x1, h, slots) {
  const k = c.K('storage'), n = slots, sw = (x1 - x0) / n;
  for (let i = 0; i < n; i++) {
    const a = x0 + i * sw, w = sw * .55;
    k.box(w, h, .035, a + w / 2, .06, z, 'pcb');
    k.box(w * .7, .05, .06, a + w / 2, .2, z + .04, 'black');
    k.box(w * .5, .04, .05, a + w / 2, h * .7, z - .03, 'plastic');
    ob(c, a, a + w, 0, h + .06, z - .05, z + .05, 'solid');
  }
  k.box(x1 - x0, .05, .035, (x0 + x1) / 2, .06, z, 'pcb');
  k.box(x1 - x0, .05, .035, (x0 + x1) / 2, h + .01, z, 'pcb');
  for (let i = 0; i < n; i += 2) k.cyl(.012, .01, x0 + i * sw + .08, h * .9, z + .02, 'ledG', 'z');
  c.zones.backplane = z;
}
function fanWall(c, z, cols, rows, size, depth) {
  const k = c.K('fans'), x0 = -(cols - 1) / 2 * (size + .04), yb = .06, ys = (c.H - .1 - yb) / rows;
  k.box(W - .12, .05, depth + .1, 0, c.H - .1, z, 'silver');
  k.box(W - .12, .04, depth + .1, 0, .04, z, 'silver');
  for (let i = 0; i <= cols; i++) k.box(.03, c.H - .12, depth + .08, x0 - (size + .04) / 2 + i * (size + .04), .06, z, 'silver');
  const bladeGeo = new THREE.BoxGeometry(size * .34, size * .13, .015);
  for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
    const x = x0 + i * (size + .04), yc = yb + ys * (j + .5), t = .05;
    k.box(size, t, depth, x, yc - size / 2, z, 'fan'); k.box(size, t, depth, x, yc + size / 2 - t, z, 'fan');
    k.box(t, size, depth, x - size / 2 + t / 2, yc - size / 2, z, 'fan'); k.box(t, size, depth, x + size / 2 - t / 2, yc - size / 2, z, 'fan');
    for (const a of [.785, 2.356]) k.box(size * 1.25, .02, .02, x, yc, z + depth / 2 + .01, 'fan', 0, 0, a);
    k.cyl(size * .17, depth * .6, x, yc, z, 'fan', 'z');
    k.cyl(.015, .02, x + size * .38, yc + size * .38, z + depth / 2 + .02, 'ledG', 'z');
    if (c.hi) {
      const rot = new THREE.Group(); rot.position.set(x, yc, z + depth * .1);
      for (let b = 0; b < 7; b++) {
        const piv = new THREE.Group(); piv.rotation.z = b / 7 * Math.PI * 2;
        const m = new THREE.Mesh(bladeGeo, c.mats.fan); m.position.x = size * .27; m.rotation.x = .45; piv.add(m); rot.add(piv);
      }
      c.L.fans.add(rot); c.rotors.push(rot);
      k.box(.06, .03, .12, x + size * .3, .04, z - depth / 2 - .08, 'plastic');
    }
  }
  ob(c, -W / 2, W / 2, 0, c.H, z - depth / 2, z + depth / 2, 'fan');
  c.zones.fans = z;
}
function board(c, z0, z1) {
  const k = c.K('board'), len = z0 - z1, zc = (z0 + z1) / 2, bw = W - .3, R = c.rnd;
  k.box(bw, .02, len, 0, .1, zc, 'pcbDark');
  for (let x = -bw / 2 + .15; x <= bw / 2; x += bw / 3 - .1) for (let z = z1 + .15; z <= z0; z += len / 3 - .1) { k.cyl(.04, .06, x, .07, z, 'silver'); k.cyl(.03, .015, x, BT + .007, z, 'silver'); }
  for (let i = 0; i < 160; i++) {
    const along = R() < .5, l = .3 + R() * 1.4, x = (R() - .5) * (bw - .3), z = z1 + .2 + R() * (len - .4);
    k.box(along ? .008 : l, .002, along ? l : .008, x, BT, z, R() < .7 ? 'copper' : 'gold');
  }
  for (let i = 0; i < 90; i++) {
    const x = (R() - .5) * (bw - .3), z = z1 + .2 + R() * (len - .4), r = .018 + R() * .02;
    k.cyl(r, .05, x, BT + .025, z, 'black'); k.cyl(r * .9, .006, x, BT + .053, z, 'silver');

  for (let i = 0; i < N; i++) { const p = {}; spawn(p, true); P.push(p); }
  const tmp = new THREE.Color(), cA = new THREE.Color(0x3d8cff), cC = new THREE.Color(0xff4b3a);
  return {
    pts, step(dt) {
      for (let i = 0; i < N; i++) {
        const p = P[i], l = p.l;
        if (l.dir < 0) { p.z -= 2.8 * dt; if (p.z < l.z1) { p.v += dt * 1.2; p.y += p.v * dt * 2; p.z -= dt * .5; } if (p.z < -7.5 || p.y > BASE + RACK_H + 1.5) spawn(p, false); }
        else { p.z += 2.4 * dt; if (p.z > l.z1 + 1.2) spawn(p, false); }
        const hot = l.dir < 0 ? Math.max(0, Math.min(1, (l.z0 - 1 - p.z) / (l.z0 - l.z1))) : 1;
        tmp.lerpColors(cA, cC, hot);
        pos[i * 3] = p.x; pos[i * 3 + 1] = p.y; pos[i * 3 + 2] = p.z; col[i * 3] = tmp.r; col[i * 3 + 1] = tmp.g; col[i * 3 + 2] = tmp.b;
      }
      g.attributes.position.needsUpdate = true; g.attributes.color.needsUpdate = true;
    }
  };
})();
rackAir.pts.visible = false; scene.add(rackAir.pts);

// ───────────────────────────── transitions
async function inspect(i) {
  if (busy) return; busy = true; hideCard(); hl.visible = false; tip.style.display = 'none';
  const s = SERVERS[i]; cur = i; mode = 'trans'; state.explode = 0; state.cut = 0; state.xOn = false; state.cOn = false; state.airflow = false; state.coverOff = 0; state.preset = 'WHOLE SLICE';
  rackAir.pts.visible = false; ui();
  const low = s.low, p0 = s.home.clone();
  await tween(.35, k => low.position.z = p0.z + Math.sin(k * Math.PI) * .05 - Math.sin(k * Math.PI * 3) * .015);
  const p1 = p0.clone(); p1.z += .7 * s.D;
  await Promise.all([tween(1.1, k => low.position.z = p0.z + .7 * s.D * ease(k)), camTo({ t: new V3(0, p1.y + .4, p1.z - .5), r: fitR(s.D * .7), th: .75, ph: .32 }, 1.3)]);
  const c = makeHi(s); curHi = c; c.root.position.copy(p1); scene.add(c.root); low.visible = false; applyState(c);
  const goal = slicePreset('WHOLE SLICE', c);
  await Promise.all([tween(1.8, k => {
    const kz = ease(Math.min(1, k * 1.5)), ky = ease(Math.max(0, (k - .2) / .8));
    c.root.position.set(p1.x + (STAGE.x - p1.x) * kz, p1.y + (STAGE.y - p1.y) * ky, p1.z + (STAGE.z - p1.z) * kz);
    setRackFade(1 - k); setStage(k);
  }), camTo(goal, 1.9)]);
  await tween(1.0, k => { state.coverOff = ease(k); });
  mode = 'slice'; busy = false; ui();
}
async function backToRack() {
  if (busy || mode !== 'slice') return; busy = true;
  const c = curHi, s = SERVERS[cur], e0 = state.explode, cut0 = state.cut;
  state.airflow = false; state.xOn = false; state.cOn = false; mode = 'trans'; ui();
  if (e0 > 0 || cut0 > 0) await tween(.7, k => { state.explode = e0 * (1 - ease(k)); state.cut = cut0 * (1 - k); });
  await tween(.8, k => state.coverOff = 1 - ease(k));
  const p1 = s.home.clone(); p1.z += .7 * s.D; const st = c.root.position.clone();
  await Promise.all([tween(1.8, k => {
    const ky = ease(Math.min(1, k * 1.4)), kz = ease(Math.max(0, (k - .25) / .75));
    c.root.position.set(st.x + (p1.x - st.x) * kz, st.y + (p1.y - st.y) * ky, st.z + (p1.z - st.z) * kz);
    setRackFade(k); setStage(1 - k);
  }), camTo({ t: new V3(0, p1.y + .4, p1.z - .5), r: fitR(s.D * .7), th: .75, ph: .32 }, 1.8)]);
  s.low.position.copy(p1); s.low.visible = true; disposeHi(c); curHi = null;
  await tween(1.0, k => s.low.position.z = p1.z - .7 * s.D * ease(k));
  await camTo(RACK_PRESETS['FULL RACK 3/4'](), 1.3);
  mode = 'rack'; busy = false; ui();
}
async function switchTo(d) {
  if (busy || mode !== 'slice') return; busy = true;
  const old = curHi, os = SERVERS[cur], n = (cur + d + SERVERS.length) % SERVERS.length, ns = SERVERS[n];
  os.low.position.copy(os.home); os.low.visible = true; ns.low.visible = false;
  const c = makeHi(ns); c.root.position.copy(STAGE); c.root.position.x += d * 14; scene.add(c.root);
  cur = n; curHi = c; ui();
  await Promise.all([tween(1.0, k => { const e = ease(k); old.root.position.x = STAGE.x - d * 14 * e; c.root.position.x = STAGE.x + d * 14 * (1 - e); }), camTo(slicePreset(state.preset, c), 1.0)]);
  disposeHi(old); busy = false; ui();
}

// ───────────────────────────── UI
const bar = document.getElementById('bar'), tip = document.getElementById('tip'), card = document.getElementById('card');
const sb = document.getElementById('slicebar'), notes = document.getElementById('notes'), spec = document.getElementById('spec'), legend = document.getElementById('legend');
let rackPreset = 'FULL RACK 3/4';
const NOTES = {
  gp: 'Shallow 1U: 40 mm fans spin fast to push air through a 43 mm tall gap. Low-profile heatsinks use many thin fins so the short air column still picks up heat.',
  virt: 'Thirty-two DIMMs stand parallel to the airflow so air runs down the channels between them; the black duct forces fan air through the CPU fins instead of around them.',
  db: 'Twenty-four NVMe bays choke the intake: air leaks through carrier gaps and the slotted backplane, which is why the fan wall sits right behind it.',
  gpu: 'Ten 80 mm fans in two rows pressurise the chassis. GPU heatsinks have tall fins running front-to-rear — channels — so air gets hotter row by row and leaves through the rear.',
  storage: 'Thirty-two millimetres of drive face per bay: perforated carriers let air slip between drives, the backplane has cut-outs, and the fans pull rather than push.'
};
function btn(t, on, f, cls = '') { const b = document.createElement('button'); b.textContent = t; if (on) b.classList.add('on'); if (cls) b.classList.add(cls); b.onclick = f; bar.appendChild(b); return b; }
function sep() { const d = document.createElement('div'); d.className = 'sep'; bar.appendChild(d); }
function ui() {
  bar.innerHTML = '';
  const slice = mode === 'slice';
  document.getElementById('modeName').textContent = mode === 'rack' ? 'FULL RACK MODE — hover a server, click to inspect' : slice ? 'SINGLE SLICE MODE — drag to orbit, scroll to zoom' : 'TRANSITION…';
  sb.style.display = slice ? 'flex' : 'none';
  spec.style.display = slice ? 'block' : 'none';
  notes.style.display = slice && state.airflow ? 'block' : 'none';
  legend.style.display = (slice && state.airflow) || (mode === 'rack' && state.rackAir) ? 'block' : 'none';
  if (mode === 'rack') {
    for (const n of Object.keys(RACK_PRESETS)) btn(n, rackPreset === n, () => { rackPreset = n; camTo(RACK_PRESETS[n](), 1.1); ui(); });
    sep(); btn('SHOW AIRFLOW', state.rackAir, () => { state.rackAir = !state.rackAir; rackAir.pts.visible = state.rackAir; ui(); });
  } else if (slice) {
    for (const n of ['WHOLE SLICE', 'TOP DOWN', '3/4 ENGINEERING VIEW', 'FRONT INTERNALS', 'REAR INTERNALS', 'CPU + MEMORY', 'GPU AREA', 'STORAGE AREA'])
      btn(n, state.preset === n, () => { state.preset = n; camTo(slicePreset(n, curHi), 1.0); ui(); });
    sep();
    btn('EXPLODED VIEW', state.xOn, () => { if (busy) return; state.xOn = !state.xOn; const a = state.explode, b = state.xOn ? 1 : 0; tween(1.2, k => state.explode = a + (b - a) * ease(k)).then(() => camTo(slicePreset(state.preset, curHi), .7)); ui(); });
    btn('CHASSIS CUTAWAY', state.cOn, () => { state.cOn = !state.cOn; const a = state.cut, b = state.cOn ? 1 : 0; tween(.6, k => state.cut = a + (b - a) * k); ui(); });
    btn('SHOW AIRFLOW', state.airflow, () => { state.airflow = !state.airflow; ui(); });
    sep(); btn('RETURN TO RACK', false, backToRack, 'big');
    const s = SERVERS[cur], c = curHi.spec ? curHi : null;
    document.getElementById('sIdx').textContent = `SERVER ${String(cur + 1).padStart(2, '0')} / ${String(SERVERS.length).padStart(2, '0')}`;
    document.getElementById('sName').innerHTML = `${s.name}<br>${s.u}U · ${s.range}`;
    const T = TYPES[s.type];
    spec.innerHTML = `<div><span>Host</span><span>${s.host}</span></div><div><span>Role</span><span>${T.role}</span></div><div><span>Size</span><span>${s.u}U · ${s.range}</span></div><div><span>Depth</span><span>${Math.round(s.D * 100)} mm</span></div><div style="border:0;display:block;color:#b9c3cf;margin-top:4px">${T.info}</div>`;
    notes.innerHTML = `<h4>WHY THE AIR GOES WHERE IT DOES</h4><p>${NOTES[s.type]}</p><p>Front → rear only: the fan wall makes a pressure step, every heat source lies downstream of it, and the rear panel is perforated so the hot air has a short way out.</p><p>Fins and DIMMs run front-to-rear on purpose — crosswise they would block the flow you see.</p>`;
  }
}
function hideCard() { card.style.display = 'none'; }
function showCard(o) {
  card.style.display = 'block';
  if (o.sw) { card.innerHTML = `<h3>${o.sw.name}</h3><div class="k">U${o.sw.u} · 1U · rear-mounted, ports face the hot aisle</div><div>${o.sw.info}</div>`; return; }
  const s = o.spec, i = SERVERS.indexOf(s);
  card.innerHTML = `<h3>${s.name}</h3><div class="k">${s.range} · ${s.u}U · ${s.host}</div><div>${TYPES[s.type].info}</div><button class="big" id="ins">INSPECT SLICE</button>`;
  document.getElementById('ins').onclick = () => inspect(i);
}
document.getElementById('prev').onclick = () => switchTo(-1);
document.getElementById('next').onclick = () => switchTo(1);

// ───────────────────────────── input
const el = renderer.domElement, ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let drag = null;
function pick(e) {
  mouse.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1); ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(lowRoots.filter(r => r.visible), true)[0];
  if (!hit) return null; let o = hit.object; while (o && !o.userData.spec && !o.userData.sw) o = o.parent; return o ? o.userData : null;
}
el.addEventListener('contextmenu', e => e.preventDefault());
el.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, b: e.button, m: 0 }; el.setPointerCapture(e.pointerId); });
el.addEventListener('pointerup', e => {
  if (drag && drag.m < 5 && drag.b === 0 && mode === 'rack' && !busy) { const p = pick(e); if (p) showCard(p); else hideCard(); }
  drag = null;
});
el.addEventListener('pointermove', e => {
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.m += Math.abs(dx) + Math.abs(dy); drag.x = e.clientX; drag.y = e.clientY;
    if (busy) return;
    if (drag.b === 0 && !e.shiftKey) { cam.th -= dx * .006; cam.ph = Math.max(-.3, Math.min(1.55, cam.ph + dy * .005)); }
    else {
      const rgt = new V3().setFromMatrixColumn(camera.matrix, 0), up = new V3().setFromMatrixColumn(camera.matrix, 1), s = cam.r * .0011;
      cam.t.addScaledVector(rgt, -dx * s).addScaledVector(up, dy * s);
    }
    return;
  }
  if (mode !== 'rack' || busy) return;
  const p = pick(e);
  if (p && p.spec) { showHL(p.spec.bottom, p.spec.u); tip.innerHTML = `${p.spec.name}<br><span>${p.spec.range}</span><br><span>${p.spec.u}U</span>`; }
  else if (p && p.sw) { showHL(p.sw.u, 1); tip.innerHTML = `${p.sw.name}<br><span>U${p.sw.u}</span><br><span>1U</span>`; }
  else { hl.visible = false; tip.style.display = 'none'; el.style.cursor = ''; return; }
  tip.style.display = 'block'; tip.style.left = e.clientX + 16 + 'px'; tip.style.top = e.clientY + 12 + 'px'; el.style.cursor = 'pointer';
});
el.addEventListener('wheel', e => { e.preventDefault(); if (!busy) cam.r = Math.max(1.5, Math.min(140, cam.r * Math.exp(e.deltaY * .0012))); }, { passive: false });
addEventListener('keydown', e => {
  if (mode === 'slice') { if (e.key === 'ArrowLeft') switchTo(-1); if (e.key === 'ArrowRight') switchTo(1); if (e.key === 'Escape') backToRack(); }
});

function resize() { if (!innerWidth || !innerHeight) return; renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
Object.assign(cam, RACK_PRESETS['FULL RACK 3/4']());
ui();

// ───────────────────────────── loop
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => frame(Math.min(.05, clock.getDelta())));
function frame(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; tw.t += dt; const k = Math.min(1, tw.t / tw.d); tw.f(k);
    if (k >= 1) { tweens.splice(i, 1); tw.res(); }
  }
  for (const c of live) {
    applyState(c);
    for (const r of c.rotors) r.rotation.z += dt * 30;
    if (state.airflow && c.air.group.visible) c.air.step(dt);
  }
  if (rackAir.pts.visible && mode === 'rack') rackAir.step(dt);
  if (!isFinite(cam.r)) Object.assign(cam, RACK_PRESETS['FULL RACK 3/4']());
  applyCam();
  renderer.render(scene, camera);
}
</script>
</body>
