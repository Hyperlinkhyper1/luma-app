function waterNormals(){

function makeTerrainGeo(x0,x1,z0,z1,nx,nz,fn){
  const pos=[],col=[],idx=[];
  for(let j=0;j<=nz;j++)for(let i=0;i<=nx;i++){
    const x=x0+(x1-x0)*i/nx,z=z0+(z1-z0)*j/nz,y=fn(x,z);

function createHullGeo(){
  const N=82,M=20,L=300,W=38,keel=-8,deck=10,pos=[],col=[],idx=[];

    for(let i=0;i<=N;i++){
      const s=i/N,x0=L/2-s*L;let half=W/2;
      if(s<.12)half*=.82+.18*(s/.12);

  for(let side=0;side<2;side++){const b=side*(N+1)*(M+1);for(let i=0;i<N;i++)for(let j=0;j<M;j++){const a=b+i*(M+1)+j,bb=b+(i+1)*(M+1)+j,c=bb+1,d=a+1;if(side===0)idx.push(a,bb,d,bb,c,d);else idx.push(a,d,bb,bb,d,c)}}
  for(let i=0;i<N;i++){const l=i*(M+1),r=(N+1)*(M+1)+i*(M+1),l1=(i+1)*(M+1),r1=(N+1)*(M+1)+(i+1)*(M+1);idx.push(l,r,l1,r,r1,l1)}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));g.setIndex(idx);g.computeVertexNormals();return g;
}

  const g=new THREE.Group();g.add(makeBoatHull(18,7,3.2,matDark));g.add(rbox(7,2.5,4,.5,matWhite,0,4,0));g.add(box(4,1.4,4.1,matGlass,0,4.2,0));g.add(cyl(.2,.2,2,matDark,0,6.5,0,6));g.add(box(4,.3,2,matRail,0,5.6,0));
  const tireMat=new THREE.MeshStandardMaterial({color:0x111111,roughness:.9});for(const x of [-5,0,5])for(const z of [-3.2,3.2]){const t=new THREE.Mesh(new THREE.TorusGeometry(.7,.25,6,10),tireMat);t.rotation.y=Math.PI/2;t.position.set(x,1.2,z);g.add(t)}
  g.traverse(m=>{if(m.isMesh){m.castShadow=true;m.receiveShadow=true}});return g;
}
function makeFerry(){
  const g=new THREE.Group();g.add(makeBoatHull(42,13,4.2,matWhite));g.add(box(28,3.2,10,matWhite,1,5.2,0));g.add(box(24,1.6,10.1,matGlass,1,6.2,0));g.add(box(10,2.5,9,matBlue,14,7.2,0));
  const wc=addWake(g,36,12,.3);g.userData.wake=wc;return g;
}
function makeSailboat(){
  const g=new THREE.Group();g.add(makeBoatHull(10,3.6,1.5,matWhite));g.add(cyl(.12,.12,9,matRail,0,5.2,0,6));
  const s=new THREE.Shape();s.moveTo(0,0);s.lineTo(0,8);s.lineTo(5,0);s.closePath();const sail=new THREE.Mesh(new THREE.ShapeGeometry(s),new THREE.MeshStandardMaterial({color:0xf4f1e6,side:THREE.DoubleSide,roughness:.8}));sail.position.set(0,6,0);g.add(sail);addWake(g,12,4,.22);return g;
}
function createBoats(){
  tug=makeTug();tug.position.set(-190,.5,30);scene.add(tug);
  const f1=makeFerry();f1.position.set(-300,.4,500);f1.rotation.y=Math.PI/2;scene.add(f1);boats.push({obj:f1,type:'ferry',offset:0,speed:11});
  const f2=makeFerry();f2.position.set(180,.4,250);f2.rotation.y=-Math.PI/2;scene.add(f2);boats.push({obj:f2,type:'ferry',offset:350,speed:9});
  for(let i=0;i<3;i++){const b=makeSailboat();b.position.set(-200+i*180,.4,120+i*60);scene.add(b);boats.push({obj:b,type:'sail',offset:i*2,speed:.03,cx:-200+i*180,cz:120+i*60})}
  const p=makeBoatHull(14,4,1.8,matBlue);const pg=new THREE.Group();pg.add(p);pg.add(box(6,1.2,3.4,matWhite,0,2.4,0));pg.position.set(220,.4,55);scene.add(pg);
}
function createGulls(){
  const tex=makeGullTexture(),mat=new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false});
  for(let i=0;i<26;i++){const s=new THREE.Sprite(mat);s.scale.set(2.2,1.1,1);scene.add(s);gulls.push({s,cx:-100+rng()*300,cz:50+rng()*300,r:30+rng()*80,speed:.15+rng()*.35,phase:rng()*TAU,h:25+rng()*55})}
}
function createRain(){
  const N=1200,pos=new Float32Array(N*3);for(let i=0;i<N;i++){pos[i*3]=-500+rng()*1000;pos[i*3+1]=rng()*110;pos[i*3+2]=-50+rng()*450}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const rainPts=new THREE.Points(g,new THREE.PointsMaterial({color:0xaaccff,size:.25,transparent:true,opacity:.55,depthWrite:false}));rainPts.visible=false;scene.add(rainPts);window.rainPts=rainPts;
}
function createMooring(){
  const mat=new THREE.MeshStandardMaterial({color:0x20262a,roughness:.85});
  const pts=[[-140,8,35,-140,1,-2],[-100,7,35,-100,1,-2],[100,7,35,100,1,-2],[140,8,35,140,1,-2]];
  for(const p of pts){
    const c=new THREE.CatmullRomCurve3([new V3(p[0],p[1],p[2]),new V3((p[0]+p[3])/2,3.8,(p[2]+p[4])/2),new V3(p[3],p[4],p[5])]);
    const m=new THREE.Mesh(new THREE.TubeGeometry(c,24,.16,5,false),mat);scene.add(m);moorings.push(m);
  }
  for(const x of [-30,55]){
    const g=new THREE.Group();g.position.set(x,0,0);
    g.add(box(3.4,.45,18,matRail,0,5.8,7));g.add(box(3.4,.15,.15,matDark,0,6.3,-2));g.add(box(3.4,.15,.15,matDark,0,6.3,16));
    g.traverse(m=>{if(m.isMesh){m.castShadow=true;m.receiveShadow=true}});scene.add(g);gangways.push(g);
  }
}
function updateEnvironment(dt){
  if(timePlaying){timeOfDay=(timeOfDay+dt*.035)%24;const sl=document.getElementById('time');if(document.activeElement!==sl)sl.value=timeOfDay}
  const t=(timeOfDay-6)/12*Math.PI,sy=Math.sin(t);
  const dayF=THREE.MathUtils.smoothstep(sy,-.08,.25),night=1-dayF;
  const golden=clamp(1-Math.abs(sy-.05)*3.5,0,1)*dayF;
  const sd=new V3(Math.cos(t),sy,.28).normalize();
  sun.position.copy(sd).multiplyScalar(850);sun.intensity=dayF*2.3*(weather==='rain'?.45:1);
  sun.color.setRGB(1,.65+.25*dayF,.42+.28*dayF);
  hemi.intensity=.2+dayF*.9;ambient.intensity=.15+dayF*.25;
  const top=new THREE.Color(0x07101f).lerp(new THREE.Color(0x5b8fc9),dayF);
  const bot=new THREE.Color(0x101a2e).lerp(new THREE.Color(0xf0b47a),dayF);
  if(golden>0)bot.lerp(new THREE.Color(0xff9d4a),golden*.55);
  sky.material.uniforms.top.value.copy(top);sky.material.uniforms.bottom.value.copy(bot);sky.material.uniforms.sunDir.value.copy(sd);sky.material.uniforms.sunColor.value.set(0xffb060).lerp(new THREE.Color(0xffffff),dayF);
  scene.fog.color.copy(bot).multiplyScalar(.8);scene.fog.density=weather==='rain'?.0016:weather==='haze'?.0011:.00045;
  water.material.uniforms.sunDirection.value.copy(sd);water.material.uniforms.sunColor.value.copy(new THREE.Color(0xfff0d0).multiplyScalar(.5+dayF*.5));
  stars.material.opacity=night*.9;
  cityLights.material.opacity=night*.9;
  shipLights.material.opacity=night*.9;
  shipGlassMat.emissiveIntensity=night*.6;
  shipDeckLightsMat.opacity=night;
  bridgeLightMat.opacity=night;
  castleGlowMat.emissiveIntensity=night*1.2;
  castleLight.intensity=night*2.5;quayLight.intensity=night*2;
  const hh=Math.floor(timeOfDay),mm=Math.floor((timeOfDay-hh)*60);
  document.getElementById('clock').textContent=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
}
function updateShip(dt){
  if(shipState==='departing'){
    shipT+=dt;
    if(shipT>2.5)gangways.forEach(g=>g.visible=false);
    if(shipT>3.5)moorings.forEach(m=>m.visible=false);
    if(shipT>5){
      const t=clamp((shipT-5)/35,0,1),e=t*t*(3-2*t);
      ship.position.x=-e*560;ship.position.z=35+Math.sin(e*Math.PI*.5)*22;ship.rotation.y=-.18*e;
      shipWake.visible=e>.02;tug.position.set(ship.position.x-190,.5,ship.position.z+8);tug.rotation.y=ship.rotation.y;
      if(shipT>46)shipState='away';
    }else{tug.position.set(-190+shipT*4,.5,30+Math.sin(shipT)*2);tug.rotation.y=.1}
  }else if(shipState==='returning'){
    shipT+=dt;const t=clamp(shipT/30,0,1),e=t*t*(3-2*t);
    ship.position.x=-560*(1-e);ship.position.z=35+22*(1-e);ship.rotation.y=-.18*(1-e);
    if(shipT>1.2)gangways.forEach(g=>g.visible=true);
    if(shipT>1.8)moorings.forEach(m=>m.visible=true);
    shipWake.visible=false;tug.position.set(ship.position.x-190,.5,ship.position.z+8);tug.rotation.y=0;
    if(shipT>30){shipState='docked';ship.position.set(0,0,35);ship.rotation.y=0;tug.position.set(-190,.5,30)}
  }else{
    tug.position.set(-190,.5,30+Math.sin(performance.now()*.001)*1.2);tug.rotation.y=.1;
  }
}
function updatePassengers(t){
  if(!passBody)return;
  for(let i=0;i<passengers.length;i++){
    const p=passengers[i];let tt=(t*p.speed+p.phase)%2,u=tt<1?tt:2-tt;
    dummy.position.lerpVectors(p.a,p.b,u);dummy.rotation.set(0,0,0);dummy.scale.set(1,1,1);dummy.updateMatrix();passBody.setMatrixAt(i,dummy.matrix);
    dummy.position.y+=.82;dummy.updateMatrix();passHead.setMatrixAt(i,dummy.matrix);
  }
  passBody.instanceMatrix.needsUpdate=true;passHead.instanceMatrix.needsUpdate=true;
}
function updateVehicles(t){
  for(const v of vehicles){
    const p0=v.path[0],p1=v.path[1];let u=(t*v.speed+v.phase)%2,rev=u>=1;if(rev)u=2-u;
    v.obj.position.set(lerp(p0[0],p1[0],u),0,lerp(p0[1],p1[1],u));
    const dx=(p1[0]-p0[0])*(rev?-1:1),dz=(p1[1]-p0[1])*(rev?-1:1);v.obj.rotation.y=Math.atan2(-dz,dx);
  }
}
function updateBoats(t){
  for(const b of boats){
    if(b.type==='ferry'){
      const z=600-((t*b.speed+b.offset)%760);b.obj.position.set(b.obj.position.x,.4,z);
      b.obj.rotation.y=z>300?Math.PI/2:-Math.PI/2;
    }else{
      const a=t*b.speed+b.offset;b.obj.position.set(b.cx+Math.cos(a)*90,.4,b.cz+Math.sin(a)*90);b.obj.rotation.y=-a+Math.PI/2;
    }
  }
}
function updateGulls(t){
  for(const g of gulls){const a=t*g.speed+g.phase;g.s.position.set(g.cx+Math.cos(a)*g.r,g.h+Math.sin(a*2)*5,g.cz+Math.sin(a)*g.r);g.s.material.rotation=Math.sin(a)*.2}
}
function playHorn(){
  if(!window.audioCtx)window.audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  const a=window.audioCtx,now=a.currentTime,g=a.createGain();g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.26,now+.2);g.gain.setValueAtTime(.26,now+1.2);g.gain.exponentialRampToValueAtTime(.0001,now+2.5);g.connect(a.destination);
  [82,110,164].forEach((f,i)=>{const o=a.createOscillator();o.type=i===0?'sawtooth':'sine';o.frequency.value=f;const og=a.createGain();og.gain.value=.22/(i+1);o.connect(og);og.connect(g);o.start(now);o.stop(now+2.6)});
}
function setView(name){
  if(walk)toggleWalk();
  let pos,target;
  if(name==='miradouro'){pos=new V3(-260,125,-140);target=new V3(0,25,40)}
  else if(name==='waterfront'){pos=new V3(-230,6,-10);target=new V3(0,22,30)}
  else if(name==='aerial'){pos=new V3(450,350,600);target=new V3(0,20,0)}
  else if(name==='river'){pos=new V3(-300,15,460);target=new V3(0,25,0)}
  else if(name==='deck'){pos=ship.localToWorld(new V3(20,53,0));target=new V3(-380,70,-120)}
  else return;
  cameraTween={startPos:camera.position.clone(),endPos:pos,startTarget:controls.target.clone(),endTarget:target,t:0,dur:1.5};controls.enabled=false;
}
function toggleWalk(){
  if(walk){walk=false;controls.enabled=true;document.exitPointerLock();document.getElementById('help').style.display='none';return}
  walk=true;cameraTween=null;controls.enabled=false;camera.position.set(0,3,-12);yaw=0;pitch=0;camera.rotation.set(0,0,0,'YXZ');document.body.requestPointerLock();document.getElementById('help').style.display='block';
}
function setWeather(w){
  weather=w;document.getElementById('clear').style.background=w==='clear'?'rgba(46,92,145,.85)':'';
  document.getElementById('haze').style.background=w==='haze'?'rgba(46,92,145,.85)':'';
  document.getElementById('rain').style.background=w==='rain'?'rgba(46,92,145,.85)':'';
}
function createUI(){
  const sl=document.getElementById('time');sl.addEventListener('input',e=>{timeOfDay=parseFloat(e.target.value);timePlaying=false;document.getElementById('play').textContent='PLAY'});
  document.getElementById('play').onclick=()=>{timePlaying=!timePlaying;document.getElementById('play').textContent=timePlaying?'PAUSE':'PLAY'};
  document.getElementById('depart').onclick=()=>{if(shipState==='docked'){shipState='departing';shipT=0;playHorn();document.getElementById('depart').textContent='UNDER WAY'}};
  document.getElementById('return').onclick=()=>{if(shipState!=='docked'){shipState='returning';shipT=0;document.getElementById('depart').textContent='DEPARTURE'}else{ship.position.set(0,0,35);ship.rotation.y=0;gangways.forEach(g=>g.visible=true);moorings.forEach(m=>m.visible=true);shipWake.visible=false;document.getElementById('depart').textContent='DEPARTURE'}};
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
  document.getElementById('walk').onclick=toggleWalk;
  document.getElementById('clear').onclick=()=>setWeather('clear');
  document.getElementById('haze').onclick=()=>setWeather('haze');
  document.getElementById('rain').onclick=()=>setWeather('rain');
  document.getElementById('hide').onclick=()=>{document.getElementById('hud').classList.add('hidden');document.getElementById('show').style.display='block'};
  document.getElementById('show').onclick=()=>{document.getElementById('hud').classList.remove('hidden');document.getElementById('show').style.display='none'};
  document.getElementById('reset').onclick=()=>{if(walk)toggleWalk();cameraTween={startPos:camera.position.clone(),endPos:new V3(260,160,400),startTarget:controls.target.clone(),endTarget:new V3(0,28,-20),t:0,dur:1.4};controls.enabled=false};
  document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement&&walk){walk=false;controls.enabled=true;document.getElementById('help').style.display='none'}});
  document.addEventListener('mousemove',e=>{if(walk&&document.pointerLockElement){yaw-=e.movementX*.002;pitch-=e.movementY*.002;pitch=clamp(pitch,-1.25,1.25);camera.rotation.set(pitch,yaw,0,'YXZ')}});
  document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Escape'&&walk){walk=false;controls.enabled=true;document.exitPointerLock();document.getElementById('help').style.display='none'}});
  document.addEventListener('keyup',e=>{keys[e.code]=false});
}
function updateWalk(dt){
  const speed=11*dt,dir=new V3();camera.getWorldDirection(dir);dir.y=0;dir.normalize();
  const right=new V3().crossVectors(dir,new V3(0,1,0)).normalize(),move=new V3();
  if(keys['KeyW'])move.add(dir);if(keys['KeyS'])move.sub(dir);if(keys['KeyD'])move.add(right);if(keys['KeyA'])move.sub(right);
  if(move.lengthSq()>0){move.normalize().multiplyScalar(speed);camera.position.add(move);camera.position.x=clamp(camera.position.x,-620,620);camera.position.z=clamp(camera.position.z,-45,4);camera.position.y=3}
}
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  updateEnvironment(dt);updateShip(dt);updatePassengers(t);updateVehicles(t);updateBoats(t);updateGulls(t);
  if(tram){const tt=(t*.012)%1,p=tramCurve.getPointAt(tt);p.y+=.55;tram.position.copy(p);const tan=tramCurve.getTangentAt(tt);tram.rotation.y=Math.atan2(tan.x,tan.z)}
  if(window.rainPts){if(weather==='rain'){window.rainPts.visible=true;const a=window.rainPts.geometry.attributes.position.array;for(let i=1;i<a.length;i+=3){a[i]-=dt*55;if(a[i]<-8)a[i]=110}window.rainPts.geometry.attributes.position.needsUpdate=true;window.rainPts.position.set(camera.position.x,0,camera.position.z)}else window.rainPts.visible=false}
  if(cameraTween){cameraTween.t+=dt;const k=Math.min(1,cameraTween.t/cameraTween.dur),e=k*k*(3-2*k);camera.position.lerpVectors(cameraTween.startPos,cameraTween.endPos,e);controls.target.lerpVectors(cameraTween.startTarget,cameraTween.endTarget,e);if(k>=1){cameraTween=null;controls.enabled=true}}
  else if(walk&&document.pointerLockElement)updateWalk(dt);
  else controls.update();
  if(water)water.material.uniforms.time.value+=dt*.35;
  renderer.render(scene,camera);
  if(!started){started=true;setTimeout(()=>document.getElementById('loading').style.display='none',180)}
}
function init(){
  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.getElementById('app').appendChild(renderer.domElement);
  scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0xbfc9d6,.0007);
  camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,6000);camera.position.set(260,160,400);
  controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,28,-20);controls.enableDamping=true;controls.dampingFactor=.06;controls.maxPolarAngle=Math.PI/2-.03;controls.minDistance=15;controls.maxDistance=2300;
  clock=new THREE.Clock();
  initMaterials();createSky();createLights();createWater();createTerrain();createCity();createCastle();createPantheon();createSe();createPraca();createBridge();createCristo();createSouthBank();createShip();createPassengers();createVehicles();createBoats();createGulls();createRain();createMooring();createUI();
  window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
  setWeather('clear');animate();
}
try{
  const c=document.createElement('canvas');if(!c.getContext('webgl2')&&!c.getContext('webgl'))throw new Error('WebGL unavailable');
  init();
}catch(e){document.getElementById('error').hidden=false;document.getElementById('loading').style.display='none';console.error(e)}
</script>
