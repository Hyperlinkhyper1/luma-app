<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------- WebGL check ----------
{
  const c=document.createElement('canvas');
  const ok=!!(window.WebGLRenderingContext && (c.getContext('webgl2')||c.getContext('webgl')));
  if(!ok){document.getElementById('nowebgl').style.display='flex';document.getElementById('loader').style.display='none';throw new Error('No WebGL');}
}

// ---------- Scene core ----------
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.5, 12000);
camera.position.set(260, 90, 380);

const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

// ---------- Postprocessing (bloom for night lights) ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 0.55, 0.8, 0.85);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- Orbit controls ----------
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enableDamping = true;
orbit.dampingFactor = 0.08;
orbit.minDistance = 10;
orbit.maxDistance = 1800;
orbit.maxPolarAngle = Math.PI * 0.495;
orbit.target.set(0, 30, 40);

// ============================================================
// PROCEDURAL TEXTURES
// ============================================================

function noiseCanvas(w,h,scale=4,base=[240,230,210]){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d');
  const img=ctx.createImageData(w,h);
  for(let i=0;i<w*h;i++){
    const n=(Math.random()*2-1)*scale;
    img.data[i*4]=Math.max(0,Math.min(255,base[0]+n*8));
    img.data[i*4+1]=Math.max(0,Math.min(255,base[1]+n*8));
    img.data[i*4+2]=Math.max(0,Math.min(255,base[2]+n*8));
    img.data[i*4+3]=255;
  }
  ctx.putImageData(img,0,0);
  return c;
}

function makeCanvasTex(canvas, repeat=1){
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(repeat,repeat);
  t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=4;
  return t;
}

// Water normal map (procedural)
function makeWaterNormal(sz=256){
  const c=document.createElement('canvas');c.width=c.height=sz;
  const ctx=c.getContext('2d');
  const img=ctx.createImageData(sz,sz);
  // Build height field
  const h=new Float32Array(sz*sz);
  for(let y=0;y<sz;y++)for(let x=0;x<sz;x++){
    let v=0;
    v+=Math.sin(x*0.06)*Math.cos(y*0.08)*0.6;
    v+=Math.sin((x+y)*0.11)*0.35;
    v+=Math.sin(x*0.21+y*0.17)*0.18;
    v+=Math.sin(x*0.4)*Math.sin(y*0.37)*0.1;
    h[y*sz+x]=v;
  }
  for(let y=0;y<sz;y++)for(let x=0;x<sz;x++){
    const l=h[y*sz+((x-1+sz)%sz)];
    const r=h[y*sz+((x+1)%sz)];
    const u=h[((y-1+sz)%sz)*sz+x];
    const d=h[((y+1)%sz)*sz+x];
    const dx=(r-l)*1.4;
    const dy=(d-u)*1.4;
    const i=(y*sz+x)*4;
    img.data[i]  =Math.max(0,Math.min(255,128+dx*120));
    img.data[i+1]=Math.max(0,Math.min(255,128+dy*120));
    img.data[i+2]=255;
    img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.magFilter=THREE.LinearFilter;
  t.minFilter=THREE.LinearMipMapLinearFilter;
  t.anisotropy=4;
  return t;
}

// House facade atlas with windows + azulejos tiles
function makeFacadeAtlas(){
  const sz=256;
  const c=document.createElement('canvas');c.width=c.height=sz;
  const ctx=c.getContext('2d');
  // base pastel colors in 4 tiles (2x2)
  const palettes=[
    ['#f4e4c1','#d9b27c'], // cream
    ['#e8d5a8','#b89968'], // ochre
    ['#f0ead0','#c5bd9a'], // bone
    ['#cfe3f0','#7aa9c4'], // light blue azulejo
  ];
  for(let ty=0;ty<2;ty++)for(let tx=0;tx<2;tx++){
    const idx=ty*2+tx;
    const col=palettes[idx];
    const x=tx*sz/2, y=ty*sz/2, s=sz/2;
    // base
    ctx.fillStyle=col[0];
    ctx.fillRect(x,y,s,s);
    // subtle grout/tile pattern for azulejo
    if(idx===3){
      ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=1;
      for(let i=0;i<=s;i+=8){
        ctx.beginPath();ctx.moveTo(x+i,y);ctx.lineTo(x+i,y+s);ctx.stroke();
        ctx.beginPath();ctx.moveTo(x,y+i);ctx.lineTo(x+s,y+i);ctx.stroke();
      }
      // small floral pattern
      ctx.fillStyle='rgba(60,90,130,0.45)';
      for(let i=8;i<s;i+=16)for(let j=8;j<s;j+=16){
        ctx.beginPath();ctx.arc(x+i,y+j,2.4,0,Math.PI*2);ctx.fill();
      }
    } else {
      // stucco noise
      for(let i=0;i<400;i++){
        ctx.fillStyle=`rgba(0,0,0,${Math.random()*0.06})`;
        ctx.fillRect(x+Math.random()*s, y+Math.random()*s, 1, 1);
      }
    }
    // windows
    const rows=3, cols=3;
    const ww=s*0.16, wh=s*0.2;
    for(let r=0;r<rows;r++)for(let cc=0;cc<cols;cc++){
      const wx=x+s*0.12+cc*s*0.26;
      const wy=y+s*0.08+r*s*0.28;
      // frame
      ctx.fillStyle='#ffffff';
      ctx.fillRect(wx-2,wy-2,ww+4,wh+4);
      // dark window
      ctx.fillStyle='#1a1f2a';
      ctx.fillRect(wx,wy,ww,wh);
      // mullion
      ctx.fillStyle='#ffffff';
      ctx.fillRect(wx+ww/2-0.5,wy,1,wh);
      ctx.fillRect(wx,wy+wh/2-0.5,ww,1);
      // little balcony ledge
      ctx.fillStyle='rgba(60,50,40,0.5)';
      ctx.fillRect(wx-3,wy+wh,ww+6,1.5);
    }
    // door at ground
    ctx.fillStyle='#3b2a1a';
    ctx.fillRect(x+s*0.42,y+s*0.82,s*0.16,s*0.18);
  }
  return c;
}

// Terracotta roof tile texture
function makeRoofTex(){
  const c=document.createElement('canvas');c.width=128;c.height=64;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#a54a2a';ctx.fillRect(0,0,128,64);
  for(let y=0;y<64;y+=8){
    for(let x=0;x<128;x+=16){
      const ox=(y%16===0)?0:8;
      ctx.fillStyle=`rgb(${140+Math.random()*30},${55+Math.random()*20},${30+Math.random()*15})`;
      ctx.fillRect(x+ox,y,14,6);
      ctx.fillStyle='rgba(0,0,0,0.25)';
      ctx.fillRect(x+ox,y+6,14,2);
    }
  }
  return c;
}

// Grass/ground for hills
function makeGrassTex(){
  const c=document.createElement('canvas');c.width=256;c.height=256;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#6b7a4a';ctx.fillRect(0,0,256,256);
  for(let i=0;i<4000;i++){
    ctx.fillStyle=`rgba(${60+Math.random()*60},${80+Math.random()*60},${30+Math.random()*40},0.6)`;
    ctx.fillRect(Math.random()*256,Math.random()*256,1+Math.random()*2,1);
  }
  return c;
}

// Pavement
function makePaveTex(){
  const c=document.createElement('canvas');c.width=256;c.height=256;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#8a8a8a';ctx.fillRect(0,0,256,256);
  ctx.strokeStyle='#555';ctx.lineWidth=1;
  for(let y=0;y<=256;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(256,y);ctx.stroke();}
  for(let x=0;x<=256;x+=32){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,256);ctx.stroke();}
  for(let i=0;i<3000;i++){
    ctx.fillStyle=`rgba(0,0,0,${Math.random()*0.1})`;
    ctx.fillRect(Math.random()*256,Math.random()*256,1,1);
  }
  return c;
}

const facadeTex = makeCanvasTex(makeFacadeAtlas(), 1);
const roofTex   = makeCanvasTex(makeRoofTex(), 2);
const grassTex  = makeCanvasTex(makeGrassTex(), 8);
const paveTex   = makeCanvasTex(makePaveTex(), 6);

// ============================================================
// LIGHTING
// ============================================================
const hemi = new THREE.HemisphereLight(0xbfd9ff, 0x4a3a2a, 0.55);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2dd, 1.2);
sun.position.set(200, 400, 300);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-600; sun.shadow.camera.right=600;
sun.shadow.camera.top=600; sun.shadow.camera.bottom=-600;
sun.shadow.camera.near=1; sun.shadow.camera.far=1600;
sun.shadow.bias=-0.0005;
scene.add(sun);
scene.add(sun.target);

// City light points (used at night via emissive + bloom)
const cityLights = [];

// ============================================================
// SKY + WATER + TIME
// ============================================================
const sky = new Sky();
sky.scale.setScalar(10000);
scene.add(sky);
const skyUni = sky.material.uniforms;
skyUni.turbidity.value = 4;
skyUni.rayleigh.value = 2;
skyUni.mieCoefficient.value = 0.005;
skyUni.mieDirectionalG.value = 0.82;
const sunPos = new THREE.Vector3();

function updateSky(elevation, azimuth){
  const phi = THREE.MathUtils.degToRad(90 - elevation);
  const theta = THREE.MathUtils.degToRad(azimuth);
  sunPos.setFromSphericalCoords(1, phi, theta);
  skyUni.sunPosition.value.copy(sunPos);
  sun.position.copy(sunPos).multiplyScalar(400);
  const t = Math.max(0, elevation) / 90;
  sun.intensity = THREE.MathUtils.lerp(0.05, 1.6, t);
  sun.color.setHSL(0.10, 0.45 + (1-t)*0.3, 0.55 + t*0.2);
  hemi.intensity = THREE.MathUtils.lerp(0.15, 0.65, t);
  renderer.toneMappingExposure = THREE.MathUtils.lerp(0.45, 1.05, Math.min(1,t*2.5));
  // fog density tied to time/weather handled in render
}

// Water
const waterNormals = makeWaterNormal(256);
// Custom water shader for better control
const waterGeo = new THREE.PlaneGeometry(6000, 6000, 1, 1);
const waterMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: {value:0},
    uNormal: {value:waterNormals},
    uSunDir: {value:new THREE.Vector3(0.3,0.8,0.2)},
    uSunColor: {value:new THREE.Color(0xfff2dd)},
    uSkyTop: {value:new THREE.Color(0x4a87c0)},
    uSkyBot: {value:new THREE.Color(0xc8d8e4)},
    uWaterDeep: {value:new THREE.Color(0x0a2236)},
    uWaterShallow: {value:new THREE.Color(0x2f6680)},
    uNight: {value:0},
  },
  vertexShader: `
    varying vec3 vWorld; varying vec2 vUv;
    void main(){
      vUv = uv;
      vec4 w = modelMatrix * vec4(position,1.0);
      vWorld = w.xyz;
      gl_Position = projectionMatrix * viewMatrix * w;
    }
  `,
  fragmentShader: `
    varying vec3 vWorld; varying vec2 vUv;
    uniform float uTime, uNight;
    uniform sampler2D uNormal;
    uniform vec3 uSunDir, uSunColor, uSkyTop, uSkyBot, uWaterDeep, uWaterShallow;
    void main(){
      vec2 uv1 = vWorld.xz*0.02 + vec2(uTime*0.02, uTime*0.01);
      vec2 uv2 = vWorld.xz*0.04 + vec2(-uTime*0.015, uTime*0.02);
      vec3 n1 = texture2D(uNormal, uv1).rgb*2.0-1.0;
      vec3 n2 = texture2D(uNormal, uv2).rgb*2.0-1.0;
      vec3 n = normalize(vec3(n1.x+n2.x, 1.0, n1.z+n2.z));
      vec3 viewDir = normalize(cameraPosition - vWorld);
      float fres = pow(1.0 - max(dot(viewDir, vec3(0,1,0)), 0.0), 3.0);
      vec3 waterCol = mix(uWaterDeep, uWaterShallow, 0.4 + 0.3*fres);
      vec3 skyCol = mix(uSkyBot, uSkyTop, 0.6);
      vec3 refl = reflect(-viewDir, n);
      float skyMix = clamp(refl.y*0.5+0.5, 0.0, 1.0);
      vec3 reflCol = mix(uSkyBot, uSkyTop, skyMix);
      vec3 col = mix(waterCol, reflCol, fres*0.7 + 0.2);
      // Sun specular
      vec3 h = normalize(uSunDir + viewDir);
      float sp = pow(max(dot(n,h),0.0), 180.0);
      col += uSunColor * sp * (1.0-uNight*0.9);
      // Night darkening
      col = mix(col, col*vec3(0.25,0.3,0.42), uNight*0.7);
      gl_FragColor = vec4(col, 0.98);
    }
  `,
  transparent:true,
});
const water = new THREE.Mesh(waterGeo, waterMat);
water.rotation.x = -Math.PI/2;
water.position.y = 0;
scene.add(water);

// ============================================================
// SOUTH BANK (Almada low land)
// ============================================================
{
  const g = new THREE.PlaneGeometry(4000, 400);
  const m = new THREE.MeshStandardMaterial({color:0x7a8568, roughness:1, map:grassTex});
  const sb = new THREE.Mesh(g, m);
  sb.rotation.x = -Math.PI/2;
  sb.position.set(0, 0.2, -700);
  sb.receiveShadow=true;
  scene.add(sb);
  // sparse south-bank buildings
  const bmat = new THREE.MeshStandardMaterial({color:0xb8a892, roughness:0.95});
  for(let i=0;i<60;i++){
    const bx = -800 + Math.random()*1600;
    const bz = -720 - Math.random()*180;
    const bh = 6 + Math.random()*14;
    const bw = 10 + Math.random()*18;
    const bd = 10 + Math.random()*18;
    const b = new THREE.Mesh(new THREE.BoxGeometry(bw,bh,bd), bmat);
    b.position.set(bx, bh/2, bz);
    scene.add(b);
  }
}

// ============================================================
// NORTH QUAY / TERMINAL GROUND
// ============================================================
const quay = new THREE.Group();
scene.add(quay);
{
  // Main quay (concrete) where ship docks
  const g = new THREE.BoxGeometry(600, 2, 90);
  const m = new THREE.MeshStandardMaterial({color:0x6b6b6b, roughness:0.95, map:paveTex});
  const q = new THREE.Mesh(g, m);
  q.position.set(0, 1, 100);
  q.receiveShadow=true;
  quay.add(q);
  // Quay edge (slightly darker)
  const edge = new THREE.Mesh(new THREE.BoxGeometry(600, 3, 4),
    new THREE.MeshStandardMaterial({color:0x3a3a3a, roughness:0.9}));
  edge.position.set(0, 1.5, 55);
  quay.add(edge);
  // Alfama hill base (rising behind quay)
  const hillGeo = new THREE.PlaneGeometry(800, 500, 40, 25);
  const pos = hillGeo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), y=pos.getY(i);
    // PlaneGeometry y ranges -250..250; after rotation -PI/2, world z = -y + 340.
    // d = 0 near quay (world z~90), d = 1 far up the hill (world z~590).
    const d = (250 - y) / 500;
    const h = Math.pow(Math.max(0,d), 1.1) * 120 + Math.sin(x*0.02)*4 + Math.cos(y*0.03+x*0.01)*3;
    pos.setZ(i, h);
  }

    -W/2,H/2,D/2,  W/2,H/2,D/2,  W/2,H/2,-D/2,  -W/2,H/2,-D/2,
  ];
  const ind = [0,1,2, 0,2,3, 4,5,6, 4,6,7, 8,9,10, 8,10,11, 12,13,14, 12,14,15, 16,17,18, 16,18,19];

  const rgeo = new THREE.BufferGeometry();
  const rh=3;
  const rv = [
    // left slope
    -W/2-0.3,H/2,D/2+0.3, 0,H/2+rh,D/2+0.3, 0,H/2+rh,-D/2-0.3, -W/2-0.3,H/2,-D/2-0.3,
    // right slope
    0,H/2+rh,D/2+0.3, W/2+0.3,H/2,D/2+0.3, W/2+0.3,H/2,-D/2-0.3, 0,H/2+rh,-D/2-0.3,
    // front gable
    -W/2-0.3,H/2,D/2+0.3, W/2+0.3,H/2,D/2+0.3, 0,H/2+rh,D/2+0.3,
    // back gable
    W/2+0.3,H/2,-D/2-0.3, -W/2-0.3,H/2,-D/2-0.3, 0,H/2+rh,-D/2-0.3,
  ];

    const x = -220 + Math.random()*520;

    const baseY = Math.pow(Math.max(0,d),1.1) * 120 + Math.sin(x*0.02)*4 + Math.cos((340-zLocal)*0.03+x*0.01)*3;

    dummy.rotation.set(0, Math.random()*0.4-0.2, 0);
    dummy.scale.set(scale * (0.8+Math.random()*0.4), scale * (0.7+Math.random()*0.6), scale * (0.8+Math.random()*0.4));
    dummy.updateMatrix();
    houses.setMatrixAt(placed, dummy.matrix);
    roofs.setMatrixAt(placed, dummy.matrix);
    color.set(palette[Math.floor(Math.random()*palette.length)]);
    houses.setColorAt(placed, color);
    placed++;
  }
  houses.instanceMatrix.needsUpdate=true;
  roofs.instanceMatrix.needsUpdate=true;
  houses.instanceColor.needsUpdate=true;
  quay.add(houses); quay.add(roofs);
}

  bridge.add(road);

  const rail = new THREE.Mesh(new THREE.BoxGeometry(deckLen, 2, 12), red);
  rail.position.set(0, 60, 0);

      tower.add(leg);

    for(const y of [70, 110, 150, 185]){
      const bm = new THREE.Mesh(new THREE.BoxGeometry(14, 3, 4), red);
      bm.position.set(0, y, 0); bm.castShadow=true;
      tower.add(bm);
    }
    tower.position.x = tx;
    bridge.add(tower);
  }

  // Cables (catenary between towers and to ends)
  const cableMat = new THREE.LineBasicMaterial({color:0x888888});
  const makeCable = (x1,y1,x2,y2,sag)=>{
    const pts=[];
    for(let t=0;t<=1;t+=0.02){
      const x = x1 + (x2-x1)*t;
      const y = y1 + (y2-y1)*t - 4*sag*t*(1-t);
      pts.push(new THREE.Vector3(x,y,6));
      const p = new THREE.Vector3(x,y,-6);
      pts.push(p);
    }
    // separate for +z and -z
  };
  // Actually simpler: use many thin lines for each side
  for(const zoff of [6,-6]){
    const pts=[];
    const segs=80;
    for(let i=0;i<=segs;i++){
      const t=i/segs;
      const x = -deckLen/2 + deckLen*t;
      // parabolic - lowest at center, highest at towers
      let y;
      if(x<-260){
        const lt=(x+deckLen/2)/(deckLen/2-260);
        y = 72 + (towerH-72) * Math.pow(lt, 1.3);
      } else if(x>260){
        const lt=(deckLen/2-x)/(deckLen/2-260);
        y = 72 + (towerH-72) * Math.pow(lt, 1.3);
      } else {
        // between towers - sag from top
        const lt=(x+260)/520;
        y = towerH - (towerH-74)*4*lt*(1-lt);
      }
      pts.push(new THREE.Vector3(x,y,zoff));
    }
    const g = new THREE.BufferGeometry().setFromPoints(pts);
    bridge.add(new THREE.Line(g, cableMat));
    // vertical hangers
    for(let i=0;i<=segs;i+=2){
      const p = pts[i];
      const hg = new THREE.BufferGeometry().setFromPoints([p, new THREE.Vector3(p.x, 71.5, p.z)]);
      bridge.add(new THREE.Line(hg, cableMat));
    }
  }

  // Bridge lights at night
  const blmat = new THREE.MeshStandardMaterial({color:0xffffaa, emissive:0xffdd88, emissiveIntensity:0});
  for(let x=-deckLen/2;x<=deckLen/2;x+=40){
    const l = new THREE.Mesh(new THREE.SphereGeometry(0.8,6,5), blmat);
    l.position.set(x, 73, 9);
    bridge.add(l);
    cityLights.push({mesh:l, mat:blmat, intensity:1.5});
  }
}

// THE CRUISE SHIP
// ============================================================
const ship = new THREE.Group();
ship.position.set(0, 0, 45); // moored at quay, in the water
scene.add(ship);

function buildShip(){
  const L=300, W=38, Hdeck=2.3; // deck height
  const decks = 14; // above-waterline balcony decks
  const hullDepth = 10;

  // ---- HULL ----
  // Build hull from a lathe-like approach: define half-width as function of x (length)
  // and height as function of z (from keel to top).
  // Use BufferGeometry with rows/columns.
  const xSegs=40, ySegs=12;
  const hullPositions=[];
  const hullUvs=[];
  const hullIndices=[];

  // Helper: half-width at position x (-L/2..L/2)
  function halfWidth(x, yRel){
    // x along length, yRel 0=keel, 1=main deck
    const t = x/(L/2); // -1..1
    // Entrance at bow: sharp taper near t=1
    let w;
    const absT = Math.abs(t);
    if(t > 0.5){
      // bow: sharp taper
      const bt = (t-0.5)/0.5; // 0..1
      w = 1 - Math.pow(bt, 1.4);
    } else if(t < -0.7){
      // stern: mild taper
      const st = (-t-0.7)/0.3;
      w = 1 - Math.pow(st, 2.2)*0.4;
    } else {
      w = 1;
    }
    // Flare at top: slightly wider at main deck
    const flare = 1 + yRel*0.05;
    // Bulbous bow: wider at bottom near bow
    if(t > 0.75 && yRel < 0.2){
      w *= 1.05;
    }
    return (W/2) * w * flare;
  }

  // Build ring of cross-sections
  for(let i=0;i<=xSegs;i++){
    const t = i/xSegs;
    const x = -L/2 + L*t;
    for(let j=0;j<=ySegs;j++){
      const yRel = j/ySegs; // 0=keel, 1=main deck
      const y = -hullDepth + (hullDepth)*yRel;
      // angle around cross-section (we only want bottom half of oval? We'll do full oval for simplicity)
      // Actually: cross-section is U-shaped underwater. Let's parameterize by angle 0..PI for bottom, then vertical sides up.
      // Simpler: for each yRel, half-width varies.
      // We'll just push two points per (x,yRel): +hw and -hw. But we need a closed surface.
      // Let me do angle parameterization:
      // angle from -PI/2 (bottom) to PI/2 (top), covering the half-shell on each side.
      // This is getting complex. Let's use a different approach: build from stacked boxes with scaled width.
    }
  }
  // Simpler: stacked boxes approach — each deck is a box scaled to the local half-width.
  // This won't give smooth hull curvature but with many slices looks good.

  // Actually let's do this properly: build the hull as a single BufferGeometry using
  // rings of points around the cross-section at each x.
  const ringSegs=16; // points around cross-section (below waterline)
  const positions=[];
  const uvs=[];
  const indices=[];
  for(let i=0;i<=xSegs;i++){
    const t=i/xSegs;
    const x = -L/2 + L*t;
    for(let j=0;j<=ringSegs;j++){
      const a = (j/ringSegs)*Math.PI*2;
      // cross-section: ellipse, but flattened top
      let hw = halfWidth(x, 1);
      // Below waterline (y<0) use full ellipse; above waterline, vertical sides
      // Parametrize by angle: at a=PI/2 = top, a=3PI/2 = bottom
      const cosA = Math.cos(a), sinA = Math.sin(a);
      // Make it boxy on top: when |sinA| < 0.3 (near top), keep width = hw, y from 0 to some small freeboard
      let y;
      let widthScale;
      if(sinA > 0.3){
        // upper side
        y = sinA * 2; // small freeboard up to 2m
        widthScale = hw * (0.85 + 0.15*Math.max(0, 1-(sinA-0.3)/0.7));
      } else {
        // underwater
        y = sinA * hullDepth;
        widthScale = hw * Math.max(0.3, Math.abs(cosA));
      }
      const px = cosA * widthScale;
      positions.push(x, y, px); // note: ship length along X, width along Z
      uvs.push(t, j/ringSegs);
    }
  }
  for(let i=0;i<xSegs;i++){
    for(let j=0;j<ringSegs;j++){
      const a = i*(ringSegs+1)+j;
      const b = a+1;
      const c = (i+1)*(ringSegs+1)+j;
      const d = c+1;
      indices.push(a,b,c, b,d,c);
    }
  }
  const hullGeo = new THREE.BufferGeometry();
  hullGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
  hullGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs,2));
  hullGeo.setIndex(indices);
  hullGeo.computeVertexNormals();

  // Hull material: dark blue with boot-top stripe
  const hullMat = new THREE.MeshStandardMaterial({color:0x152040, roughness:0.6, metalness:0.2, side:THREE.DoubleSide});
  const hull = new THREE.Mesh(hullGeo, hullMat);
  hull.castShadow=true; hull.receiveShadow=true;
  ship.add(hull);

  // Boot-top red stripe (just above waterline)
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(L*0.95, 0.8, W*1.02),
    new THREE.MeshStandardMaterial({color:0x8a1a1a, roughness:0.7}));
  stripe.position.set(0, 0.4, 0);
  ship.add(stripe);

  // Waterline paint (red below)
  const wlGeo = new THREE.BufferGeometry();
  // copy hull below y=0, color it red - just add a thin box at bottom
  const keel = new THREE.Mesh(new THREE.BoxGeometry(L*0.85, 0.3, W*0.95),
    new THREE.MeshStandardMaterial({color:0x6a1818, roughness:0.8}));
  keel.position.set(0, -hullDepth+0.2, 0);
  ship.add(keel);

  // ---- MAIN DECK PLATE (deck 0) ----
  const deckPlate = new THREE.Mesh(new THREE.BoxGeometry(L*0.96, 0.3, W*1.02),
    new THREE.MeshStandardMaterial({color:0xc4b89a, roughness:0.7}));
  deckPlate.position.set(0, 2, 0);

  // ---- SUPERSTRUCTURE: stacked deck blocks tapering at bow/stern ----
  // Each balcony deck: a box with window stripes applied via texture
  function deckWidth(x, deckIdx){

    let w = W;
    // bow taper
    if(x>0){

      const bt = Math.max(0, (-x - L*0.4)/(L*0.1));
      w = W * (1 - Math.pow(bt, 2));
    }
    // slight inset at upper decks
    w *= (1 - deckIdx*0.008);
    return Math.max(2, w);
  }

  // Balcony texture
  function balconyTex(){

    // horizontal divider lines (decks)

    for(let y=0;y<=128;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(512,y);ctx.stroke();}
    // balcony openings
    for(let x=0;x<512;x+=16){
      for(let y=8;y<128;y+=32){
        // dark recess
        ctx.fillStyle='#1a2430';
        ctx.fillRect(x+2, y+2, 12, 18);

  const balcTex = makeCanvasTex(balconyTex(), 1);

  const whiteMat = new THREE.MeshStandardMaterial({color:0xf4f0e8, roughness:0.6});

  // ---- UPPER DECKS (non-balcony, pool decks etc.) ----
  const upperDecks = 4;

  const pool2 = new THREE.Mesh(new THREE.BoxGeometry(14, 0.3, 8), poolMat);

  // Sun loungers (instanced tiny)

  // Water slide (curved tube)
  const slideCurve = new THREE.CatmullRomCurve3([

  // Running track line

  // ---- FUNNELS (2 raked) ----
  const funnelMat = new THREE.MeshStandardMaterial({color:0xf0f0ec, roughness:0.6});

  for(const fx of [-15, 25]){

  // ---- BRIDGE (navigation) with wings ----
  const bridgeGrp = new THREE.Group();
  bridgeGrp.position.set(L*0.3, topDeckY-2, 0);

  const bridgeBox = new THREE.Mesh(new THREE.BoxGeometry(14, 4, W*0.8),

  // Bridge wings extending past hull
  for(const sx of [-1,1]){

  // Balcony interior glow (subtle emissive on facade) - applied via balcMat emissive map
  balcMat.emissive.set(0xffcc88);
  balcMat.emissiveIntensity = 0;
  cityLights.push({mesh:null, mat:balcMat, intensity:0.6});
}

function buildMoorings(){

  const points = [
    [140, 8, W=>W/2, -200, 3, 60],
    [120, 8, W=>W/2, -150, 3, 60],
    [-140, 8, W=>W/2, 150, 3, 60],
    [-120, 8, W=>W/2, 200, 3, 60],
    [140, 8, W=>-W/2, -200, 3, 130],
    [-140, 8, W=>-W/2, 200, 3, 130],
  ];
  for(const p of points){
    const pts = [
      new THREE.Vector3(p[0], p[1], p[2](19)),
      new THREE.Vector3(p[0]*0.7, 5, (p[2](19)+p[5])/2),
      new THREE.Vector3(p[3], p[4], p[5]),
    ];
    const curve = new THREE.CatmullRomCurve3(pts);
    const geo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(20));
    const line = new THREE.Line(geo, mat);
    mooringGroup.add(line);
    mooringLines.push(line);
  }
  // Bollards on quay
  const bollardMat = new THREE.MeshStandardMaterial({color:0x222222, roughness:0.8});
  for(const x of [-200,-150,150,200]){

}

function setNightness(hour){
  // 0=midnight, 12=noon
  const h = hour%24;
  let night = 0;
  if(h<5 || h>20) night = 1;
  else if(h<7) night = 1-(h-5)/2;
  else if(h>18) night = (h-18)/2;
  // Emissive intensity
  for(const L of cityLights){
    L.mat.emissiveIntensity = L.intensity * night;
  }
  bloom.strength = THREE.MathUtils.lerp(0.3, 1.1, night);
  waterMat.uniforms.uNight.value = night;
  // Weather
  let fogDensity = 0;
  if(state.weather==='haze'){ fogDensity = 0.0012; }
  else if(state.weather==='rain'){ fogDensity = 0.002; }
  if(fogDensity>0){
    scene.fog = new THREE.FogExp2(0x8898a8, fogDensity);
    rain.visible = state.weather==='rain';
  } else {
    scene.fog = null;
    rain.visible = false;
  }
}

function updateTimeOfDay(hour){
  state.timeHour = hour;
  // Sun elevation & azimuth
  const t = hour/24;
  const elev = Math.sin((t-0.25)*Math.PI*2)*80; // -80..80
  const azi = (t*360 + 180) % 360;
  updateSky(elev, azi);
  // Sky color at horizon for water
  const isDay = elev>0;
  if(elev>10){
    waterMat.uniforms.uSkyTop.value.setRGB(0.3, 0.55, 0.8);
    waterMat.uniforms.uSkyBot.value.setRGB(0.75, 0.85, 0.95);
  } else if(elev>-5){
    // Golden hour
    const k = Math.max(0, (elev+5)/15);
    waterMat.uniforms.uSkyTop.value.setRGB(0.2+k*0.3, 0.3+k*0.3, 0.4+k*0.3);
    waterMat.uniforms.uSkyBot.value.setRGB(0.9, 0.5, 0.3);
    sun.color.setRGB(1, 0.75, 0.45);
  } else {
    waterMat.uniforms.uSkyTop.value.setRGB(0.03, 0.04, 0.1);
    waterMat.uniforms.uSkyBot.value.setRGB(0.08, 0.1, 0.2);
  }
  waterMat.uniforms.uSunDir.value.copy(sunPos).normalize();
  waterMat.uniforms.uSunColor.value.copy(sun.color);
  setNightness(hour);
  // UI clock
  const hh = Math.floor(hour).toString().padStart(2,'0');
  const mm = Math.floor((hour%1)*60).toString().padStart(2,'0');
  document.getElementById('clock').textContent = `${hh}:${mm}`;
}

function animateCamera(toPos, toTarget, dur=1200){
  const startPos = camera.position.clone();
  const startTarget = orbit.target.clone();
  const endPos = new THREE.Vector3(...toPos);
  const endTarget = new THREE.Vector3(...toTarget);
  const t0 = performance.now();
  function step(){
    const k = Math.min(1, (performance.now()-t0)/dur);
    const e = k<0.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
    camera.position.lerpVectors(startPos, endPos, e);
    orbit.target.lerpVectors(startTarget, endTarget, e);
    if(k<1) requestAnimationFrame(step);
  }
  step();
}

// ---- Web Audio horn ----
let audioCtx = null;
function getAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function playHorn(){
  const ctx = getAudio();
  const now = ctx.currentTime;
  // Three blasts: low rumble + mid tone
  for(let i=0;i<3;i++){
    const start = now + i*1.6;
    const dur = 1.2;
    const o1 = ctx.createOscillator();
    o1.type='sawtooth'; o1.frequency.setValueAtTime(92, start);
    o1.frequency.exponentialRampToValueAtTime(88, start+dur);
    const o2 = ctx.createOscillator();
    o2.type='sine'; o2.frequency.setValueAtTime(184, start);
    const o3 = ctx.createOscillator();
    o3.type='triangle'; o3.frequency.setValueAtTime(276, start);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(0.18, start+0.15);
    g.gain.setValueAtTime(0.18, start+dur-0.2);
    g.gain.linearRampToValueAtTime(0, start+dur);
    const filter = ctx.createBiquadFilter();
    filter.type='lowpass'; filter.frequency.value=600;
    o1.connect(g); o2.connect(g); o3.connect(g);
    g.connect(filter); filter.connect(ctx.destination);
    o1.start(start); o2.start(start); o3.start(start);
    o1.stop(start+dur); o2.stop(start+dur); o3.stop(start+dur);
  }
}

// ============================================================
// ANIMATION LOOP
// ============================================================
const clock = new THREE.Clock();
const dummy = new THREE.Object3D();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  const elapsed = clock.elapsedTime;

  // Time playback
  if(state.timePlaying){
    state.timeHour = (state.timeHour + dt*0.3) % 24;
    timeSlider.value = state.timeHour;
    updateTimeOfDay(state.timeHour);
  }

  // Water animation
  waterMat.uniforms.uTime.value = elapsed;

  // Radar rotation
  if(ship.userData.radar) ship.userData.radar.rotation.y = elapsed*0.8;

  // People movement
  for(let i=0;i<peopleCount;i++){
    const p = peopleData[i];
    p.pos.addScaledVector(p.dir, p.speed*dt);
    // bounds
    if(p.pos.x<-150||p.pos.x>150){ p.dir.x*=-1; }
    if(p.pos.z<65||p.pos.z>125){ p.dir.z*=-1; }
    // bobbing
    const bob = Math.abs(Math.sin(elapsed*4+p.phase))*0.08;
    dummy.position.copy(p.pos);
    dummy.position.y += bob;
    dummy.rotation.y = Math.atan2(p.dir.x, p.dir.z);
    dummy.scale.set(1,1,1);
    dummy.updateMatrix();
    people.setMatrixAt(i, dummy.matrix);
  }
  people.instanceMatrix.needsUpdate=true;

  // Vehicle movement
  for(let i=0;i<vehicleCount;i++){
    const v = vehicleData[i];
    v.pos.x += v.dir*v.speed*dt;
    if(v.pos.x>220){ v.pos.x=-220; }
    if(v.pos.x<-220){ v.pos.x=220; }
    dummy.position.copy(v.pos);
    dummy.rotation.set(0, v.dir>0?Math.PI/2:-Math.PI/2, 0);
    dummy.scale.copy(v.size);
    dummy.updateMatrix();
    vehicles.setMatrixAt(i, dummy.matrix);
  }
  vehicles.instanceMatrix.needsUpdate=true;

  // Boats
  for(const b of boats){
    if(b.mode==='ferry'){
      b.mesh.position.z += b.vel.z*dt;
      if(b.mesh.position.z < -600){ b.mesh.position.z = -100; b.vel.z = -Math.abs(b.vel.z); }
      if(b.mesh.position.z > -100){ b.mesh.position.z = -600; b.vel.z = Math.abs(b.vel.z); }
      b.mesh.rotation.y = b.vel.z<0 ? 0 : Math.PI;
    } else if(b.mode==='patrol'){
      b.mesh.position.x += Math.sin(elapsed*0.3)*dt*2;
      b.mesh.position.z += Math.cos(elapsed*0.3)*dt*2;
      b.mesh.rotation.y = Math.atan2(Math.sin(elapsed*0.3), Math.cos(elapsed*0.3));
    } else if(b.mode==='sail'){
      b.mesh.position.x += b.vel.x*dt;
      b.mesh.position.z += b.vel.z*dt;
      if(b.mesh.position.x<-500||b.mesh.position.x>500) b.vel.x*=-1;
      if(b.mesh.position.z<-500||b.mesh.position.z>0) b.vel.z*=-1;
      b.mesh.rotation.y = Math.atan2(b.vel.x, b.vel.z);
    }
    // Slight bob
    b.mesh.position.y = Math.sin(elapsed*1.2+b.mesh.position.x*0.02)*0.3;
    b.mesh.rotation.z = Math.sin(elapsed*1.1+b.mesh.position.z*0.02)*0.03;
  }

  // Gulls
  for(let i=0;i<gullCount;i++){
    const g = gullData[i];
    g.ang += g.speed*dt;
    g.pos.x = g.cx + Math.cos(g.ang)*g.r;
    g.pos.z = g.cz + Math.sin(g.ang)*g.r;
    g.pos.y = g.h + Math.sin(elapsed*0.7+i)*3;
    g.flapPhase += dt*10;
    const flap = Math.sin(g.flapPhase)*0.3;
    dummy.position.copy(g.pos);
    dummy.rotation.set(flap*0.3, -g.ang-Math.PI/2, 0);
    dummy.scale.set(1+Math.abs(flap)*0.4, 1, 1);
    dummy.updateMatrix();
    gulls.setMatrixAt(i, dummy.matrix);
  }
  gulls.instanceMatrix.needsUpdate=true;

  // Rain update
  if(rain.visible){
    const p = rainGeo.attributes.position;
    for(let i=0;i<rainCount;i++){
      let y = p.getY(i) - dt*40;
      if(y<0) y = 120;
      p.setY(i, y);
    }
    p.needsUpdate=true;
    rain.position.copy(camera.position);
    rain.position.y = 0;
  }

  // Ship departure animation
  if(state.shipDeparted){
    state.departureT = Math.min(1, state.departureT + dt*0.06);
    const k = state.departureT;
    // Phase 1 (0-0.2): gangways retract, lines released
    // Phase 2 (0.2-0.5): tug pushes bow out
    // Phase 3 (0.5-1): ship turns and sails west
    const gangwayK = Math.min(1, k/0.15);
    gangways.position.z = gangwayK*15;
    gangways.position.y = -gangwayK*2;
    if(k>0.12){
      mooringGroup.visible = false;
    }
    if(k<0.5){
      const t2 = (k-0.15)/0.35;
      const e = Math.max(0,t2);
      ship.position.x = shipHome.x + e*20;
      ship.rotation.y = e*0.15;
    } else {
      const t3 = (k-0.5)/0.5;
      ship.position.x = shipHome.x + 20 + t3*(-350-20);
      ship.position.z = shipHome.z + Math.sin(t3*Math.PI*0.5)*(-40);
      ship.rotation.y = 0.15 + t3*(-Math.PI/2-0.15);
    }
  }
  if(state.shipReturning){
    state.returnT = Math.min(1, state.returnT + dt*0.1);
    const k = state.returnT;
    if(k<0.5){
      const t = k/0.5;
      ship.position.x = -350 + t*(shipHome.x+350);
      ship.position.z = shipHome.z - Math.sin(t*Math.PI)*40;
      ship.rotation.y = -Math.PI/2 + t*(Math.PI/2);
    } else {
      const t = (k-0.5)/0.5;
      ship.position.x = shipHome.x + (1-t)*20;
      ship.position.z = shipHome.z;
      ship.rotation.y = (1-t)*0.15;
      gangways.position.z = (1-t)*15;
      gangways.position.y = -(1-t)*2;
    }
    if(k>=1){
      state.shipReturning=false;
      state.shipDeparted=false;
      mooringGroup.visible=true;
      ship.position.copy(shipHome);
      ship.rotation.copy(shipHomeRot);
    }
  }

  // Walk mode WASD
  if(state.walkMode){
    const speed = 30*dt;
    const fwd = new THREE.Vector3();
    camera.getWorldDirection(fwd);
    fwd.y=0; fwd.normalize();
    const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,1,0));
    if(keys.w){ camera.position.addScaledVector(fwd, speed); orbit.target.addScaledVector(fwd, speed); }
    if(keys.s){ camera.position.addScaledVector(fwd, -speed); orbit.target.addScaledVector(fwd, -speed); }
    if(keys.a){ camera.position.addScaledVector(right, -speed); orbit.target.addScaledVector(right, -speed); }
    if(keys.d){ camera.position.addScaledVector(right, speed); orbit.target.addScaledVector(right, speed); }
    camera.position.y = 5;
    orbit.target.y = 5;
  }

  orbit.update();
  composer.render();
}

document.addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  if(k in keys)keys[k]=false;
});

// Resize
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

// ============================================================
// LOADING & START
// ============================================================
let loadProg = 0;
const loadBar = document.getElementById('loadBar');
const loadMsg = document.getElementById('loadMsg');
const msgs = ['Constructing the Tagus…', 'Painting Alfama…', 'Hoisting the sails…', 'Boarding passengers…'];
const loader = document.getElementById('loader');
let mi=0;
const loadInt = setInterval(()=>{
  loadProg = Math.min(100, loadProg + 12+Math.random()*15);
  loadBar.style.width = loadProg+'%';
  mi = (mi+1)%msgs.length;
  loadMsg.textContent = msgs[mi];
  if(loadProg>=100){
    clearInterval(loadInt);
    setTimeout(()=>{
      loader.style.opacity='0';
      setTimeout(()=>loader.style.display='none', 800);
    }, 300);
  }
}, 180);

// Start
updateTimeOfDay(10);
animate();

// First-time click enables audio context (for browsers)
document.addEventListener('click', ()=>{ getAudio().resume?.(); }, {once:true});

</script>
</body>
</html>
