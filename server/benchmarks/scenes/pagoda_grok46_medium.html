<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================================
 * world.ts — procedural voxel-garden data (types stripped for plain JS).
 * ============================================================================ */

const SIZE = 64;
const PAGODA_FLOORS = 5;

function key(x, y, z) {
  return `${x | 0},${y | 0},${z | 0}`;
}

function hash(x, z) {
  let n = Math.imul(x | 0, 374761393) + Math.imul(z | 0, 668265263);
  n = (n ^ (n >>> 13)) * 1274126177;
  return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
}

function fade(t) {
  return t * t * (3 - 2 * t);
}

function noise(x, z) {
  const xi = Math.floor(x);
  const zi = Math.floor(z);
  const xf = x - xi;
  const zf = z - zi;
  const u = fade(xf);
  const v = fade(zf);
  const a = hash(xi, zi);
  const b = hash(xi + 1, zi);
  const c = hash(xi, zi + 1);
  const d = hash(xi + 1, zi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

function fbm(x, z) {
  return (
    noise(x, z) * 0.55 +
    noise(x * 2.03, z * 2.03) * 0.3 +
    noise(x * 4.07, z * 4.07) * 0.15
  );
}

class Grid {
  cells = new Map();
  pagoda = 0;
  countingPagoda = false;

  set(x, y, z, color) {
    this.cells.set(key(x, y, z), color);
    if (this.countingPagoda) this.pagoda += 1;
  }

  has(x, y, z) {
    return this.cells.has(key(x, y, z));
  }
}

function inIsland(x, z) {
  const nx = (x - 31.5) / 32;
  const nz = (z - 31.5) / 32;
  const ang = Math.atan2(nz, nx);
  const r2 = nx * nx * 1.12 + nz * nz * 0.9 + nx * nz * 0.18;
  const lobe = 0.1 * Math.sin(ang * 3 + 0.5) + 0.05 * Math.sin(ang * 5 + 1.2);
  const n = (fbm(x * 0.07, z * 0.07) - 0.5) * 0.22;
  return r2 + lobe < 0.7 + n;
}

function pondField(x, z) {
  const dx = (x - 42) / 9;
  const dz = (z - 44) / 6.5;
  return dx * dx + dz * dz;
}

function surfaceY(x, z) {
  let h = 11 + (fbm(x * 0.05, z * 0.05) - 0.4) * 6;
  const pd = Math.hypot(x - 32, z - 22);
  if (pd < 14) h = Math.max(h, 14.2 - pd * 0.18);
  if (pd < 9) h = 15;
  const pf = pondField(x, z);
  if (pf < 1) h = 8 + pf * 2.4;
  const edge =
    Math.hypot((x - 31.5) / 32, (z - 31.5) / 32) > 0.62
      ? (fbm(x * 0.2, z * 0.2) - 0.5) * 3
      : 0;
  return Math.round(h + edge);
}

function isEdgeColumn(x, z) {
  return (
    !inIsland(x + 1, z) ||
    !inIsland(x - 1, z) ||
    !inIsland(x, z + 1) ||
    !inIsland(x, z - 1)
  );
}

function addIsland(g, pondWaterY) {
  for (let x = 0; x < SIZE; x += 1) {
    for (let z = 0; z < SIZE; z += 1) {
      if (!inIsland(x, z)) continue;
      const top = surfaceY(x, z);
      const pf = pondField(x, z);
      const thickness = 7 + Math.round(fbm(x * 0.12, z * 0.12) * 6);
      const bottom = top - thickness - (isEdgeColumn(x, z) ? 2 : 0);
      const edge = isEdgeColumn(x, z);

      for (let y = bottom; y <= top; y += 1) {
        const nearSkin = y >= top - 2 || y <= bottom + 1 || edge;
        const cave = noise(x * 0.18, y * 0.14 + z * 0.11) > 0.78 && y < top - 3;
        if (!nearSkin && !cave) continue;
        if (!nearSkin) continue;

        let color = "stone";
        if (y === top) {
          if (pf < 1) color = pf < 0.72 ? "pond" : "stone";
          else if (noise(x * 0.3, z * 0.3) > 0.62) color = "moss";
          else color = "moss";
        } else if (y === top - 1) color = "teak";
        else if (y <= bottom + 1) color = noise(x, z) > 0.5 ? "stone" : "teak";
        else color = noise(x * 0.2, y * 0.2) > 0.55 ? "stone" : "teak";

        if (y === top && pf < 0.55) color = "pond";
        if (y === pondWaterY - 1 && pf < 0.92 && pf >= 0.55) color = "stone";
        g.set(x, y, z, color);

        if (y === bottom && noise(x * 0.4, z * 0.4) > 0.72) {
          g.set(x, y - 1, z, "moss");
          if (noise(x * 0.9, z * 0.4) > 0.8) g.set(x, y - 2, z, "jade");
        }
      }

      if (edge && noise(x, z) > 0.35) {
        const drip = 2 + Math.floor(hash(x, z) * 4);
        for (let d = 1; d <= drip; d += 1) {
          g.set(x, bottom - d, z, d % 2 === 0 ? "moss" : "stone");
        }
      }
    }
  }

  for (let i = 0; i < 18; i += 1) {
    const ox = 8 + hash(i, 9) * 48;
    const oz = 8 + hash(i, 3) * 48;
    const oy = -6 - hash(i, 7) * 8;
    const r = 1 + Math.floor(hash(i, 11) * 3);
    for (let x = -r; x <= r; x += 1) {
      for (let y = -r; y <= r; y += 1) {
        for (let z = -r; z <= r; z += 1) {
          if (x * x + y * y + z * z <= r * r + 1) {
            g.set(Math.round(ox + x), Math.round(oy + y), Math.round(oz + z), "stone");
          }
        }
      }
    }
  }
}

function addPath(g) {
  const pts = [
    [32, 56],
    [32, 53],
    [28, 51],
    [26, 48],
    [28, 45],
    [33, 43],
    [36, 40],
    [34, 36],
    [32, 33],
    [32, 29],
  ];
  for (let i = 0; i < pts.length - 1; i += 1) {
    const [x0, z0] = pts[i];
    const [x1, z1] = pts[i + 1];
    const steps = Math.max(Math.abs(x1 - x0), Math.abs(z1 - z0)) * 2;
    for (let s = 0; s <= steps; s += 1) {
      const t = s / steps;
      const x = Math.round(x0 + (x1 - x0) * t);
      const z = Math.round(z0 + (z1 - z0) * t);
      const zigzag = i % 2 === 0 ? 0 : 1;
      for (let w = -1; w <= 1; w += 1) {
        const xx = x + (zigzag ? w : 0);
        const zz = z + (zigzag ? 0 : w);
        if (!inIsland(xx, zz)) continue;
        if (pondField(xx, zz) < 0.5) continue;
        const y = surfaceY(xx, zz);
        g.set(xx, y, zz, "stone");
        if (Math.abs(w) === 1) g.set(xx, y, zz, noise(xx, zz) > 0.5 ? "stone" : "moss");
      }
    }
  }
}

function addPagoda(g, floors, doors) {
  const cx = 32;
  const cz = 22;
  const baseY = 16;
  g.countingPagoda = true;

  for (let x = -7; x <= 7; x += 1) {
    for (let z = -7; z <= 7; z += 1) {
      const cheb = Math.max(Math.abs(x), Math.abs(z));
      if (cheb > 7) continue;
      for (let y = 0; y < 2; y += 1) {
        const color = y === 1 && noise(x + 40, z + 20) > 0.7 ? "moss" : "stone";
        g.set(cx + x, baseY - 2 + y, cz + z, color);
      }
      if (cheb === 7) g.set(cx + x, baseY, cz + z, "stone");
    }
  }

  for (let s = 0; s < 6; s += 1) {
    for (let x = -2; x <= 2; x += 1) {
      g.set(cx + x, baseY - 2 + Math.min(s, 2), cz + 9 + s, "stone");
      g.set(cx + x, baseY - 1 + Math.min(s, 2), cz + 9 + s, "stone");
    }
  }

  const stories = [
    { w: 13, h: 8, roof: 5 },
    { w: 11, h: 7, roof: 4 },
    { w: 9, h: 6, roof: 4 },
    { w: 7, h: 5, roof: 3 },
    { w: 5, h: 5, roof: 3 },
  ];

  let yCursor = baseY;
  for (let i = 0; i < stories.length; i += 1) {
    const st = stories[i];
    const hw = Math.floor(st.w / 2);
    floors.push({ index: i, cx, cz, y: yCursor, h: st.h, w: st.w });

    for (let x = -hw; x <= hw; x += 1) {
      for (let z = -hw; z <= hw; z += 1) {
        g.set(cx + x, yCursor, cz + z, "teak");
      }
    }

    for (let y = 1; y < st.h; y += 1) {
      for (let x = -hw; x <= hw; x += 1) {
        for (let z = -hw; z <= hw; z += 1) {
          const ax = Math.abs(x);
          const az = Math.abs(z);
          const edge = ax === hw || az === hw;
          const inner = (ax === hw - 1 || az === hw - 1) && ax < hw && az < hw;
          if (!edge && !inner) continue;

          const southDoor =
            z === hw &&
            Math.abs(x) <= 1 &&
            y >= 1 &&
            y <= st.h - 2;
          if (southDoor) continue;

          const pillar =
            (ax === hw && az === hw) ||
            (ax === hw && z % 2 === 0) ||
            (az === hw && x % 2 === 0);

          if (inner) {
            g.set(cx + x, yCursor + y, cz + z, "interior");
          } else if (pillar) {
            g.set(cx + x, yCursor + y, cz + z, "vermillion");
          } else if (y === st.h - 1) {
            g.set(cx + x, yCursor + y, cz + z, "teak");
          } else {
            g.set(cx + x, yCursor + y, cz + z, "sakuraPale");
          }

          if (edge && y === Math.floor(st.h * 0.55) && x % 3 === 0 && z % 3 === 0) {
            g.set(cx + x, yCursor + y, cz + z, "gold");
          }
        }
      }
    }

    doors.push({
      floor: i,
      hingeX: cx - 1,
      y: yCursor + 1,
      hingeZ: cz + hw,
      h: st.h - 2,
      w: 1,
      side: "left",
    });
    doors.push({
      floor: i,
      hingeX: cx + 1,
      y: yCursor + 1,
      hingeZ: cz + hw,
      h: st.h - 2,
      w: 1,
      side: "right",
    });

    const roofBase = yCursor + st.h - 1;
    addRoof(g, cx, roofBase, cz, hw + 3, st.roof);

    const rail = hw + 2;
    for (let x = -rail; x <= rail; x += 1) {
      for (let z = -rail; z <= rail; z += 1) {
        const ax = Math.abs(x);
        const az = Math.abs(z);
        if (ax !== rail && az !== rail) continue;
        if (ax <= hw && az <= hw) continue;
        if ((x + z) % 2 !== 0) continue;
        g.set(cx + x, roofBase + 1, cz + z, "vermillion");
        g.set(cx + x, roofBase + 2, cz + z, "gold");
      }
    }

    yCursor = roofBase + st.roof - 1;
  }

  const spireY = yCursor;
  for (let i = 0; i < 16; i += 1) {
    g.set(cx, spireY + i, cz, "gold");
    g.set(cx + 1, spireY + i, cz, i % 3 === 0 ? "gold" : "vermillion");
    g.set(cx - 1, spireY + i, cz, i % 3 === 0 ? "gold" : "vermillion");
    g.set(cx, spireY + i, cz + 1, i % 3 === 0 ? "gold" : "vermillion");
    g.set(cx, spireY + i, cz - 1, i % 3 === 0 ? "gold" : "vermillion");
    if (i >= 2 && i <= 11) {
      const r = i % 2 === 0 ? 2 : 1;
      for (let x = -r; x <= r; x += 1) {
        for (let z = -r; z <= r; z += 1) {
          if (Math.abs(x) + Math.abs(z) === r || (Math.abs(x) === r && Math.abs(z) === r)) {
            g.set(cx + x, spireY + i, cz + z, "gold");
          }
        }
      }
    }
  }
  g.set(cx, spireY + 16, cz, "gold");
  g.set(cx, spireY + 17, cz, "glow");
  g.set(cx + 1, spireY + 16, cz, "gold");
  g.set(cx - 1, spireY + 16, cz, "gold");
  g.set(cx, spireY + 16, cz + 1, "gold");
  g.set(cx, spireY + 16, cz - 1, "gold");

  g.countingPagoda = false;
  return { cx, cz, baseY, topY: spireY + 17 };
}

function addRoof(g, cx, baseY, cz, eave, height) {
  for (let x = -eave; x <= eave; x += 1) {
    for (let z = -eave; z <= eave; z += 1) {
      const ax = Math.abs(x);
      const az = Math.abs(z);
      const cheb = Math.max(ax, az);
      if (cheb > eave) continue;
      const nx = ax / eave;
      const nz = az / eave;
      const hip = Math.max(nx, nz);
      const curve = hip ** 0.52;
      let yOff = Math.round((1 - curve) * (height - 1));
      const corner = Math.min(nx, nz);
      if (hip > 0.7) {
        yOff += Math.round(corner ** 1.35 * hip ** 2 * 3.1);
      }
      const y = baseY + yOff;
      const isEdge = cheb >= eave - 1;
      const isRidge = cheb <= 1;
      let color = (x + z) % 2 === 0 ? "jade" : "jadeLight";
      if (isEdge || isRidge) color = "gold";
      g.set(cx + x, y, cz + z, color);
      if (isEdge || cheb >= eave - 2 || isRidge) {
        g.set(cx + x, y - 1, cz + z, "teak");
      }
      if (cheb === eave) {
        g.set(cx + x, y, cz + z, "gold");
      }
      if (ax >= eave - 1 && az >= eave - 1) {
        const sx = x < 0 ? -1 : 1;
        const sz = z < 0 ? -1 : 1;
        g.set(cx + x + sx, y + 1, cz + z + sz, "gold");
        g.set(cx + x + sx, y + 2, cz + z + sz, "gold");
        g.set(cx + x + sx * 2, y + 2, cz + z + sz * 2, "gold");
        g.set(cx + x + sx * 2, y + 3, cz + z + sz * 2, "vermillion");
      }
      if (cheb === eave && (x + z) % 3 === 0) {
        g.set(cx + x, y - 2, cz + z, "teak");
      }
    }
  }
}

function addTorii(g) {
  const x = 32;
  const z = 56;
  const y = surfaceY(x, z);
  for (let i = 0; i < 8; i += 1) {
    g.set(x - 3, y + i, z, "vermillion");
    g.set(x + 3, y + i, z, "vermillion");
  }
  for (let bx = -5; bx <= 5; bx += 1) {
    g.set(x + bx, y + 6, z, "vermillion");
    g.set(x + bx, y + 7, z, "vermillion");
    const lift = Math.abs(bx) >= 4 ? 1 : 0;
    g.set(x + bx, y + 8 + lift, z, "gold");
    if (Math.abs(bx) === 5) g.set(x + bx, y + 9, z, "gold");
  }
  for (let bx = -3; bx <= 3; bx += 1) g.set(x + bx, y + 5, z, "gold");
  g.set(x, y + 6, z, "gold");
  return { x, y, z };
}

function addBridge(g, waterY) {
  for (let i = 0; i <= 14; i += 1) {
    const t = i / 14;
    const x = 34 + i;
    const z = 42;
    const arch = Math.round(Math.sin(t * Math.PI) * 4);
    const y = waterY + 1 + arch;
    for (let w = -1; w <= 1; w += 1) {
      g.set(x, y, z + w, "teak");
      if (w !== 0) g.set(x, y + 1, z + w, "vermillion");
    }
    g.set(x, y + 1, z, "gold");
    if (i < 2 || i > 12) {
      for (let s = 0; s < y - 8; s += 1) g.set(x, 8 + s, z, "teak");
    }
  }
}

function addFence(g) {
  const posts = [];
  for (let z = 18; z <= 52; z += 2) posts.push([16, z]);
  for (let x = 16; x <= 28; x += 2) posts.push([x, 52]);
  for (const [x, z] of posts) {
    if (!inIsland(x, z) || pondField(x, z) < 0.9) continue;
    const y = surfaceY(x, z);
    for (let h = 1; h <= 4; h += 1) g.set(x, y + h, z, h === 4 ? "gold" : "jade");
    g.set(x + 1, y + 2, z, "jadeLight");
    g.set(x - 1, y + 2, z, "jadeLight");
    g.set(x + 1, y + 3, z, "jade");
    g.set(x - 1, y + 3, z, "jade");
  }
}

function addLanterns(g, lanterns) {
  const spots = [
    [30, 52],
    [27, 44],
    [35, 36],
    [29, 30],
  ];
  for (const [x, z] of spots) {
    const y = surfaceY(x, z);
    g.set(x, y + 1, z, "stone");
    g.set(x, y + 2, z, "teak");
    g.set(x, y + 3, z, "glow");
    g.set(x, y + 4, z, "gold");
    g.set(x + 1, y + 3, z, "stone");
    g.set(x - 1, y + 3, z, "stone");
    g.set(x, y + 3, z + 1, "stone");
    g.set(x, y + 3, z - 1, "stone");
    lanterns.push({ x, y: y + 3, z });
  }
}

function addJizo(g) {
  const spots = [
    [26, 34],
    [38, 32],
  ];
  for (const [x, z] of spots) {
    const y = surfaceY(x, z);
    g.set(x, y + 1, z, "stone");
    g.set(x, y + 2, z, "vermillion");
    g.set(x, y + 3, z, "stone");
    g.set(x, y + 4, z, "stone");
    g.set(x + 1, y + 2, z, "stone");
    g.set(x - 1, y + 2, z, "stone");
  }
}

function addFlowers(g) {
  let n = 0;
  let seed = 3;
  while (n < 40) {
    seed += 1;
    const x = 8 + Math.floor(hash(seed, 1) * 48);
    const z = 8 + Math.floor(hash(seed, 2) * 48);
    if (!inIsland(x, z)) continue;
    if (pondField(x, z) < 1.05) continue;
    const pd = Math.hypot(x - 32, z - 22);
    if (pd < 10) continue;
    const y = surfaceY(x, z);
    const bloom = hash(seed, 4) > 0.66 ? "gold" : hash(seed, 5) > 0.5 ? "sakura" : "sakuraMid";
    g.set(x, y + 1, z, "jade");
    g.set(x, y + 2, z, bloom);
    g.set(x, y + 3, z, hash(seed, 6) > 0.5 ? "sakuraPale" : bloom);
    n += 1;
  }
}

function addLeaves(leaves, x, y, z, color, phase) {
  leaves.push({ x, y, z, color, phase });
}

function addSakura(g, leaves, anchors, tx, tz) {
  const y0 = surfaceY(tx, tz);
  const h = 8;
  for (let y = 1; y <= h; y += 1) {
    g.set(tx, y0 + y, tz, "teak");
    if (y < 4 && y % 2 === 0) {
      g.set(tx + 1, y0 + y, tz, "teak");
      g.set(tx - 1, y0 + y, tz, "teak");
    }
  }
  const top = y0 + h;
  anchors.push({ x: tx, y: top, z: tz });
  for (let x = -5; x <= 5; x += 1) {
    for (let y = -3; y <= 4; y += 1) {
      for (let z = -5; z <= 5; z += 1) {
        const d = x * x * 0.7 + y * y * 1.2 + z * z * 0.7;
        if (d > 18) continue;
        if (noise(tx + x * 0.4, tz + z * 0.4 + y) < 0.32) continue;
        const c =
          noise(x + tx, z + tz) > 0.7
            ? "sakuraPale"
            : noise(x + 3, z) > 0.45
              ? "sakura"
              : "sakuraMid";
        addLeaves(leaves, tx + x, top + y, tz + z, c, hash(tx + x, tz + z));
      }
    }
  }
}

function addPine(g, leaves, tx, tz) {
  const y0 = surfaceY(tx, tz);
  const h = 7;
  for (let y = 1; y <= h; y += 1) g.set(tx, y0 + y, tz, "teak");
  for (let layer = 0; layer < 7; layer += 1) {
    const r = 4 - Math.floor(layer * 0.55);
    const y = y0 + 4 + layer;
    for (let x = -r; x <= r; x += 1) {
      for (let z = -r; z <= r; z += 1) {
        if (Math.abs(x) + Math.abs(z) > r + 1) continue;
        const c = (x + z + layer) % 2 === 0 ? "jade" : "jadeLight";
        addLeaves(leaves, tx + x, y, tz + z, c, hash(tx + x, tz + z + layer));
      }
    }
  }
}

function addMaple(g, leaves, tx, tz) {
  const y0 = surfaceY(tx, tz);
  for (let y = 1; y <= 6; y += 1) g.set(tx, y0 + y, tz, "teak");
  const top = y0 + 6;
  for (let x = -5; x <= 5; x += 1) {
    for (let y = -2; y <= 3; y += 1) {
      for (let z = -5; z <= 5; z += 1) {
        const d = Math.abs(x) + Math.abs(z) + Math.abs(y);
        if (d > 7 || d < 2) continue;
        if (noise(tx + x, tz + z) < 0.28) continue;
        const c = noise(x + 8, z + 2) > 0.55 ? "vermillion" : "gold";
        addLeaves(leaves, tx + x, top + y, tz + z, c, hash(tx + x, tz + z));
      }
    }
  }
}

function addWillow(g, leaves, tx, tz) {
  const y0 = surfaceY(tx, tz);
  for (let y = 1; y <= 8; y += 1) g.set(tx, y0 + y, tz, "teak");
  const top = y0 + 8;
  for (let x = -4; x <= 4; x += 1) {
    for (let z = -4; z <= 4; z += 1) {
      if (x * x + z * z > 18) continue;
      addLeaves(leaves, tx + x, top, tz + z, "jade", hash(tx + x, tz + z));
      addLeaves(leaves, tx + x, top + 1, tz + z, "jadeLight", hash(tx + x, tz + z + 3));
      const hang = 4 + Math.floor(hash(tx + x, tz + z) * 6);
      if (Math.abs(x) >= 2 || Math.abs(z) >= 2) {
        for (let h = 1; h <= hang; h += 1) {
          addLeaves(
            leaves,
            tx + x,
            top - h,
            tz + z,
            h % 2 === 0 ? "jadeLight" : "jade",
            hash(tx + x, h),
          );
        }
      }
    }
  }
}

function addClouds(g) {
  for (let i = 0; i < 10; i += 1) {
    const cx = 6 + hash(i, 20) * 52;
    const cz = 4 + hash(i, 21) * 56;
    const cy = -4 - hash(i, 22) * 7;
    const rx = 4 + Math.floor(hash(i, 23) * 4);
    const rz = 3 + Math.floor(hash(i, 24) * 3);
    for (let x = -rx; x <= rx; x += 1) {
      for (let y = -2; y <= 2; y += 1) {
        for (let z = -rz; z <= rz; z += 1) {
          if ((x * x) / (rx * rx) + (z * z) / (rz * rz) + (y * y) / 6 > 1) continue;
          if (noise(cx + x, cz + z) < 0.3) continue;
          g.set(
            Math.round(cx + x),
            Math.round(cy + y),
            Math.round(cz + z),
            noise(x, z) > 0.5 ? "sakuraPale" : "stone",
          );
        }
      }
    }
  }
}

function buildWorld() {
  const g = new Grid();
  const leaves = [];
  const lanterns = [];
  const doors = [];
  const floors = [];
  const sakuraAnchors = [];
  const pond = { cx: 42, cz: 44, rx: 9, rz: 6.5, waterY: 10 };

  addIsland(g, pond.waterY);
  addPath(g);
  const pagoda = addPagoda(g, floors, doors);
  const torii = addTorii(g);
  addBridge(g, pond.waterY);
  addFence(g);
  addLanterns(g, lanterns);
  addJizo(g);
  addFlowers(g);
  addSakura(g, leaves, sakuraAnchors, 20, 38);
  addSakura(g, leaves, sakuraAnchors, 24, 48);
  addSakura(g, leaves, sakuraAnchors, 44, 28);
  addPine(g, leaves, 22, 18);
  addPine(g, leaves, 42, 16);
  addMaple(g, leaves, 14, 30);
  addMaple(g, leaves, 50, 32);
  addWillow(g, leaves, 50, 44);
  addClouds(g);

  return {
    cells: g.cells,
    leaves,
    lanterns,
    doors,
    floors,
    pond,
    sakuraAnchors,
    torii,
    pagoda,
    koiY: pond.waterY,
    voxelCount: g.cells.size + leaves.length,
    pagodaVoxels: g.pagoda,
  };
}

/* ============================================================================
 * engine.ts — render/animation layer (types stripped for plain JS).
 * ============================================================================ */

const VOX = 0.48;
const CYCLE = 90;
const INTRO = 2.5;
const PAGODA_FLOORS_COUNT = 5;

const HEX = {
  vermillion: 0xc73e1d,
  gold: 0xe8b86d,
  teak: 0x4a2c1a,
  jade: 0x2d6a4f,
  jadeLight: 0x40916c,
  sakura: 0xffb7c5,
  sakuraMid: 0xff8fab,
  sakuraPale: 0xffe5ec,
  stone: 0x9aa0a6,
  pond: 0x7ed6df,
  moss: 0x606c38,
  interior: 0xe8b86d,
  glow: 0xe8b86d,
};

function wx(x) {
  return (x - 31.5) * VOX;
}
function wy(y) {
  return y * VOX;
}
function wz(z) {
  return (z - 31.5) * VOX;
}

function makeMaterial(id) {
  const mat = new THREE.MeshStandardMaterial({
    color: HEX[id],
    roughness: id === "gold" ? 0.28 : id === "pond" ? 0.18 : 0.72,
    metalness: id === "gold" ? 0.78 : id === "jade" || id === "jadeLight" ? 0.18 : 0.04,
    emissive:
      id === "glow" || id === "interior" || id === "gold"
        ? HEX[id]
        : 0x000000,
    emissiveIntensity: id === "glow" ? 1.4 : id === "interior" ? 0.45 : id === "gold" ? 0.12 : 0,
    transparent: id === "pond",
    opacity: id === "pond" ? 0.82 : 1,
    polygonOffset: true,
    polygonOffsetFactor: 1,
    polygonOffsetUnits: 1,
  });
  return mat;
}

function shadeColor(id, neighbors, target) {
  const shade = 1 - neighbors * 0.09;
  const lift = id === "glow" || id === "interior" ? 0.85 : 0.52;
  target.setHex(HEX[id]).multiplyScalar(lift + shade * (1 - lift));
}

function neighborCount(occupied, x, y, z) {
  let n = 0;
  if (occupied.has(`${x + 1},${y},${z}`)) n += 1;
  if (occupied.has(`${x - 1},${y},${z}`)) n += 1;
  if (occupied.has(`${x},${y + 1},${z}`)) n += 1;
  if (occupied.has(`${x},${y - 1},${z}`)) n += 1;
  if (occupied.has(`${x},${y},${z + 1}`)) n += 1;
  if (occupied.has(`${x},${y},${z - 1}`)) n += 1;
  return n;
}

function buildInstanced(items, occupied, geometry, materials) {
  const grouped = new Map();
  for (const item of items) {
    const list = grouped.get(item.id) ?? [];
    list.push(item);
    grouped.set(item.id, list);
  }
  const dummy = new THREE.Object3D();
  const color = new THREE.Color();
  const meshes = [];
  for (const [id, list] of grouped) {
    const mesh = new THREE.InstancedMesh(geometry, materials.get(id), list.length);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    for (let i = 0; i < list.length; i += 1) {
      const v = list[i];
      dummy.position.set(wx(v.x), wy(v.y), wz(v.z));
      dummy.scale.setScalar(0.94);
      dummy.rotation.set(0, 0, 0);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
      shadeColor(id, neighborCount(occupied, v.x, v.y, v.z), color);
      mesh.setColorAt(i, color);
    }
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    mesh.computeBoundingSphere();
    meshes.push(mesh);
  }
  return meshes;
}

function skyColor(t, target) {
  const dawn = new THREE.Color(0xe7a07a);
  const day = new THREE.Color(0x9ec9e0);
  const dusk = new THREE.Color(0xc45c3a);
  const night = new THREE.Color(0x12182a);
  const noon = new THREE.Color(0xb9d8ee);
  if (t < 0.2) return target.copy(night).lerp(dawn, t / 0.2);
  if (t < 0.3) return target.copy(dawn).lerp(day, (t - 0.2) / 0.1);
  if (t < 0.55) return target.copy(day).lerp(noon, (t - 0.3) / 0.25);
  if (t < 0.7) return target.copy(noon).lerp(dusk, (t - 0.55) / 0.15);
  if (t < 0.82) return target.copy(dusk).lerp(night, (t - 0.7) / 0.12);
  return target.copy(night);
}

function makeBird() {
  const mat = new THREE.MeshStandardMaterial({
    color: 0x4a2c1a,
    roughness: 0.7,
    emissive: 0xc73e1d,
    emissiveIntensity: 0.12,
  });
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.08, 0.42), mat);
  const wingL = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.035, 0.18), mat);
  const wingR = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.035, 0.18), mat);
  wingL.position.set(-0.28, 0, 0);
  wingR.position.set(0.28, 0, 0);
  g.add(body, wingL, wingR);
  return { group: g, wingL, wingR };
}

function makeKoi(color) {
  const mat = new THREE.MeshStandardMaterial({
    color,
    roughness: 0.35,
    metalness: 0.12,
    emissive: color,
    emissiveIntensity: 0.08,
  });
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.1, 0.42), mat));
  const tail = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 0.12), mat);
  tail.position.z = 0.26;
  g.add(tail);
  return g;
}

function mount(canvas) {
  const world = buildWorld();
  const occupied = new Set(world.cells.keys());
  for (const leaf of world.leaves) occupied.add(`${leaf.x},${leaf.y},${leaf.z}`);

  const renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: true,
    alpha: false,
    powerPreference: "high-performance",
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.12;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setClearColor(0x9ec9e0, 1);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x9ec9e0, 0.018);

  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 220);
  const clock = new THREE.Clock();
  const boxGeo = new THREE.BoxGeometry(VOX, VOX, VOX);

  const materials = new Map();
  Object.keys(HEX).forEach((id) => {
    materials.set(id, makeMaterial(id));
  });

  const staticVoxels = [...world.cells.entries()].map(([k, id]) => {
    const [x, y, z] = k.split(",").map(Number);
    return { x, y, z, id };
  });
  for (const mesh of buildInstanced(staticVoxels, occupied, boxGeo, materials)) {
    scene.add(mesh);
  }

  const dummy = new THREE.Object3D();
  const tmpColor = new THREE.Color();
  const leafGroups = new Map();
  const leavesByColor = new Map();
  for (const leaf of world.leaves) {
    const list = leavesByColor.get(leaf.color) ?? [];
    list.push(leaf);
    leavesByColor.set(leaf.color, list);
  }
  for (const [id, list] of leavesByColor) {
    const mesh = new THREE.InstancedMesh(boxGeo, materials.get(id), list.length);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    for (let i = 0; i < list.length; i += 1) {
      const v = list[i];
      dummy.position.set(wx(v.x), wy(v.y), wz(v.z));
      dummy.scale.setScalar(0.9);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
      shadeColor(id, neighborCount(occupied, v.x, v.y, v.z), tmpColor);
      mesh.setColorAt(i, tmpColor);
    }
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    scene.add(mesh);
    leafGroups.set(id, { mesh, items: list });
  }

  const hemi = new THREE.HemisphereLight(0xcfe6f5, 0x3a2a1c, 0.85);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff1d6, 1.6);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.near = 2;
  sun.shadow.camera.far = 140;
  sun.shadow.camera.left = -36;
  sun.shadow.camera.right = 36;
  sun.shadow.camera.top = 36;
  sun.shadow.camera.bottom = -36;
  sun.shadow.bias = -0.0006;
  sun.shadow.normalBias = 0.04;
  scene.add(sun);
  scene.add(sun.target);

  const lanternLights = [];
  const lanternMat = new THREE.MeshStandardMaterial({
    color: 0xe8b86d,
    emissive: 0xe8b86d,
    emissiveIntensity: 1.6,
    roughness: 0.3,
  });
  for (const lantern of world.lanterns) {
    const light = new THREE.PointLight(0xe8b86d, 1.4, 14, 2);
    light.position.set(wx(lantern.x), wy(lantern.y), wz(lantern.z));
    scene.add(light);
    const glow = new THREE.Mesh(new THREE.BoxGeometry(VOX * 1.6, VOX * 1.6, VOX * 1.6), lanternMat);
    glow.position.copy(light.position);
    glow.userData.kind = "lantern";
    glow.userData.index = lanternLights.length;
    scene.add(glow);
    lanternLights.push({ light, glow, userOn: null });
  }

  const doorGroups = [];
  const doorMat = materials.get("vermillion");
  const goldMat = materials.get("gold");
  for (const door of world.doors) {
    const group = new THREE.Group();
    const w = door.w;
    const h = door.h;
    const mesh = new THREE.InstancedMesh(boxGeo, doorMat, w * h + 2);
    let i = 0;
    for (let vx = 0; vx < w; vx += 1) {
      for (let vy = 0; vy < h; vy += 1) {
        dummy.position.set(
          (door.side === "left" ? vx + 0.5 : -(vx + 0.5)) * VOX,
          (vy + 0.5) * VOX,
          0,
        );
        dummy.scale.setScalar(0.94);
        dummy.updateMatrix();
        mesh.setMatrixAt(i, dummy.matrix);
        i += 1;
      }
    }
    group.add(mesh);
    const trim = new THREE.Mesh(new THREE.BoxGeometry(VOX * 0.3, h * VOX, VOX * 0.2), goldMat);
    trim.position.set(door.side === "left" ? VOX : -VOX, (h * VOX) / 2, VOX * 0.3);
    group.add(trim);
    group.position.set(wx(door.hingeX), wy(door.y), wz(door.hingeZ) + VOX * 0.2);
    scene.add(group);
    doorGroups.push({ floor: door.floor, group, side: door.side, open: false, t: 0 });
  }

  const floorPick = [];
  for (const floor of world.floors) {
    const pick = new THREE.Mesh(
      new THREE.BoxGeometry(floor.w * VOX, floor.h * VOX, floor.w * VOX),
      new THREE.MeshBasicMaterial({ visible: false }),
    );
    pick.position.set(
      wx(floor.cx),
      wy(floor.y + floor.h / 2),
      wz(floor.cz),
    );
    pick.userData.kind = "floor";
    pick.userData.floor = floor.index;
    scene.add(pick);
    floorPick.push(pick);
  }

  const pond = world.pond;
  const waterGeo = new THREE.CircleGeometry(Math.max(pond.rx, pond.rz) * VOX, 48);
  waterGeo.rotateX(-Math.PI / 2);
  const waterMat = new THREE.MeshStandardMaterial({
    color: 0x7ed6df,
    roughness: 0.12,
    metalness: 0.18,
    transparent: true,
    opacity: 0.72,
    emissive: 0x7ed6df,
    emissiveIntensity: 0.12,
  });
  const water = new THREE.Mesh(waterGeo, waterMat);
  water.position.set(wx(pond.cx), wy(pond.waterY) + 0.08, wz(pond.cz));
  water.scale.set(1.05, 1, 0.78);
  water.receiveShadow = true;
  scene.add(water);

  const koi = [];
  const koiColors = [0xc73e1d, 0xe8b86d, 0xffe5ec, 0xc73e1d, 0xe8b86d, 0xff8fab];
  for (let i = 0; i < 6; i += 1) {
    const mesh = makeKoi(koiColors[i]);
    scene.add(mesh);
    koi.push({
      mesh,
      radius: 1.4 + (i % 3) * 0.55,
      speed: 0.35 + i * 0.07,
      phase: i * 1.1,
    });
  }

  const petalCount = 140;
  const petalMesh = new THREE.InstancedMesh(
    new THREE.BoxGeometry(0.12, 0.03, 0.08),
    materials.get("sakura"),
    petalCount,
  );
  const petals = Array.from({ length: petalCount }, (_, i) => {
    const a = world.sakuraAnchors[i % world.sakuraAnchors.length];
    return {
      x: wx(a.x) + (Math.random() - 0.5) * 3,
      y: wy(a.y) + Math.random() * 4,
      z: wz(a.z) + (Math.random() - 0.5) * 3,
      spin: Math.random() * Math.PI * 2,
      drift: 0.4 + Math.random() * 0.5,
    };
  });
  scene.add(petalMesh);

  const birds = Array.from({ length: 7 }, (_, i) => {
    const b = makeBird();
    scene.add(b.group);
    return { ...b, radius: 8 + (i % 3) * 1.6, speed: 0.22 + i * 0.03, height: 18 + (i % 4), phase: i };
  });

  const sunMesh = new THREE.Mesh(
    new THREE.SphereGeometry(1.3, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0xffe5c4 }),
  );
  scene.add(sunMesh);
  const moonMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.9, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0xdde6ff }),
  );
  scene.add(moonMesh);

  const starGeo = new THREE.BufferGeometry();
  const starCount = 350;
  const starPos = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i += 1) {
    const r = 70 + Math.random() * 40;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.random() * Math.PI * 0.45;
    starPos[i * 3] = Math.cos(theta) * Math.sin(phi) * r;
    starPos[i * 3 + 1] = 12 + Math.cos(phi) * r * 0.45;
    starPos[i * 3 + 2] = Math.sin(theta) * Math.sin(phi) * r;
  }
  starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
  const stars = new THREE.Points(
    starGeo,
    new THREE.PointsMaterial({ color: 0xf2ebe3, size: 0.12, transparent: true, opacity: 0 }),
  );
  scene.add(stars);

  const pagodaTarget = new THREE.Vector3(
    wx(world.pagoda.cx),
    wy(world.pagoda.baseY + 18),
    wz(world.pagoda.cz),
  );

  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.autoRotate = false;
  controls.autoRotateSpeed = 0.55;
  controls.maxPolarAngle = Math.PI * 0.84;
  controls.minPolarAngle = 0.18;
  controls.minDistance = 8;
  controls.maxDistance = 48;
  controls.target.copy(pagodaTarget);
  controls.enabled = false;

  const introFrom = new THREE.Vector3(
    wx(world.torii.x),
    wy(world.torii.y + 5),
    wz(world.torii.z + 8),
  );
  const introTo = new THREE.Vector3(wx(32 + 18), wy(28), wz(22 + 28));
  camera.position.copy(introFrom);
  camera.lookAt(pagodaTarget);

  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  let pointerDown = { x: 0, y: 0 };
  let lastInput = 0;
  let introT = 0;
  let timeOfDay = 0.32;
  let cyclePaused = false;
  let fps = 60;
  let fpsFrames = 0;
  let fpsElapsed = 0;
  const sky = new THREE.Color();
  const waterBase = waterGeo.attributes.position;

  const api = {
    voxelCount: world.voxelCount,
    fps: 60,
    pagodaFloors: PAGODA_FLOORS_COUNT,
    timeOfDay,
    setTimeOfDay: (value) => {
      timeOfDay = Math.min(1, Math.max(0, value));
      api.timeOfDay = timeOfDay;
    },
    cyclePaused,
    setCyclePaused: (value) => {
      cyclePaused = value;
      api.cyclePaused = value;
    },
  };
  window.__VOXEL__ = api;
  void PAGODA_FLOORS;

  function resize() {
    const w = canvas.clientWidth || canvas.parentElement?.clientWidth || window.innerWidth;
    const h = canvas.clientHeight || canvas.parentElement?.clientHeight || window.innerHeight;
    const width = Math.max(1, Math.floor(w));
    const height = Math.max(1, Math.floor(h));
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height, false);
  }
  resize();
  const ro = new ResizeObserver(() => resize());
  ro.observe(canvas.parentElement ?? canvas);

  function applyDay(t) {
    const angle = (t - 0.25) * Math.PI * 2;
    const elev = Math.sin(angle);
    const day = Math.max(0, elev);
    sun.position.set(Math.cos(angle) * 46, Math.max(elev, -0.15) * 38, Math.sin(angle * 0.35) * 16);
    sun.target.position.copy(pagodaTarget);
    sun.intensity = 0.18 + day * 1.65;
    sun.color.setRGB(1, 0.82 + day * 0.14, 0.62 + day * 0.3);
    hemi.intensity = 0.38 + day * 0.55;
    hemi.color.set(day > 0.15 ? 0xd7ecf8 : 0x8aa0c8);
    hemi.groundColor.set(0x3a2a1c);
    sunMesh.position.copy(sun.position);
    moonMesh.position.set(-sun.position.x, 22, -sun.position.z);
    skyColor(t, sky);
    scene.background = sky;
    scene.fog.color.copy(sky);
    renderer.setClearColor(sky, 1);
    const night = 1 - day;
    stars.material.opacity = Math.max(0, night - 0.25);
    const interior = materials.get("interior");
    interior.emissiveIntensity = 0.28 + night * 0.9;
    const glow = materials.get("glow");
    glow.emissiveIntensity = 0.8 + night * 1.1;
    renderer.toneMappingExposure = 0.92 + day * 0.28;

    const autoOn = day < 0.22;
    for (let i = 0; i < lanternLights.length; i += 1) {
      const L = lanternLights[i];
      const on = L.userOn === null ? autoOn : L.userOn;
      const flicker = on ? 1.15 + Math.sin(clock.elapsedTime * 17 + i) * 0.18 + Math.sin(clock.elapsedTime * 29 + i * 2) * 0.08 : 0;
      L.light.intensity = flicker * 1.6;
      L.glow.material.emissiveIntensity = on ? 1.3 + flicker * 0.4 : 0.12;
    }
  }

  function onPointerDown(event) {
    pointerDown = { x: event.clientX, y: event.clientY };
    lastInput = clock.elapsedTime;
    controls.autoRotate = false;
  }

  function onPointerUp(event) {
    lastInput = clock.elapsedTime;
    if (Math.hypot(event.clientX - pointerDown.x, event.clientY - pointerDown.y) > 6) return;
    const rect = canvas.getBoundingClientRect();
    pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(
      [...lanternLights.map((l) => l.glow), ...floorPick],
      false,
    );
    const hit = hits[0];
    if (!hit) return;
    if (hit.object.userData.kind === "lantern") {
      const L = lanternLights[hit.object.userData.index];
      const currently =
        L.userOn === null ? sun.intensity < 0.7 : L.userOn;
      L.userOn = !currently;
    } else if (hit.object.userData.kind === "floor") {
      const floor = hit.object.userData.floor;
      for (const door of doorGroups) {
        if (door.floor === floor) door.open = !door.open;
      }
    }
  }

  function onLost() {
    lastInput = clock.elapsedTime;
  }

  canvas.addEventListener("pointerdown", onPointerDown);
  canvas.addEventListener("pointerup", onPointerUp);
  window.addEventListener("resize", resize);
  canvas.addEventListener("webglcontextlost", onLost);

  let running = true;
  function animate() {
    if (!running) return;
    const dt = Math.min(clock.getDelta(), 0.1);
    const t = clock.elapsedTime;
    fpsFrames += 1;
    fpsElapsed += dt;
    if (fpsElapsed >= 0.4) {
      fps = fpsFrames / fpsElapsed;
      fpsFrames = 0;
      fpsElapsed = 0;
      api.fps = fps;
    }

    if (!cyclePaused) {
      timeOfDay = (timeOfDay + dt / CYCLE) % 1;
      api.timeOfDay = timeOfDay;
    }
    applyDay(timeOfDay);

    if (introT < INTRO) {
      introT += dt;
      const k = Math.min(1, introT / INTRO);
      const e = k * k * (3 - 2 * k);
      camera.position.lerpVectors(introFrom, introTo, e);
      camera.lookAt(pagodaTarget);
      if (k >= 1) {
        controls.enabled = true;
        controls.target.copy(pagodaTarget);
        controls.update();
      }
    } else {
      if (t - lastInput > 4) controls.autoRotate = true;
      controls.update();
    }

    for (const door of doorGroups) {
      const goal = door.open ? 1 : 0;
      door.t += (goal - door.t) * Math.min(1, dt * 4.2);
      const angle = door.t * (door.side === "left" ? -Math.PI / 2 : Math.PI / 2);
      door.group.rotation.y = angle;
    }

    for (const [, group] of leafGroups) {
      for (let i = 0; i < group.items.length; i += 1) {
        const leaf = group.items[i];
        const sway = Math.sin(t * 1.1 + leaf.phase * 6.2) * 0.07;
        dummy.position.set(wx(leaf.x) + sway, wy(leaf.y), wz(leaf.z));
        dummy.rotation.set(0, sway * 0.8, sway);
        dummy.scale.setScalar(0.9);
        dummy.updateMatrix();
        group.mesh.setMatrixAt(i, dummy.matrix);
      }
      group.mesh.instanceMatrix.needsUpdate = true;
    }

    for (let i = 0; i < petals.length; i += 1) {
      const p = petals[i];
      p.y -= dt * p.drift;
      p.x += Math.sin(t * 0.8 + i) * dt * 0.35;
      p.z += Math.cos(t * 0.7 + i) * dt * 0.28;
      p.spin += dt * 1.8;
      if (p.y < wy(8)) {
        const a = world.sakuraAnchors[i % world.sakuraAnchors.length];
        p.x = wx(a.x) + (Math.random() - 0.5) * 3;
        p.y = wy(a.y) + 2 + Math.random() * 3;
        p.z = wz(a.z) + (Math.random() - 0.5) * 3;
      }
      dummy.position.set(p.x, p.y, p.z);
      dummy.rotation.set(p.spin, p.spin * 0.4, p.spin * 0.7);
      dummy.scale.setScalar(1);
      dummy.updateMatrix();
      petalMesh.setMatrixAt(i, dummy.matrix);
    }
    petalMesh.instanceMatrix.needsUpdate = true;

    for (let i = 0; i < koi.length; i += 1) {
      const koiFish = koi[i];
      const a = t * koiFish.speed + koiFish.phase;
      const px = wx(pond.cx) + Math.cos(a) * koiFish.radius * 1.15;
      const pz = wz(pond.cz) + Math.sin(a * 0.85) * koiFish.radius * 0.75;
      koiFish.mesh.position.set(px, wy(pond.waterY) - 0.12 + Math.sin(a * 2) * 0.04, pz);
      koiFish.mesh.rotation.y = Math.atan2(
        Math.cos(a * 0.85) * koiFish.radius * 0.75,
        -Math.sin(a) * koiFish.radius * 1.15,
      );
    }

    const pos = waterBase;
    for (let i = 0; i < pos.count; i += 1) {
      const x = pos.getX(i);
      const z = pos.getZ(i);
      pos.setY(i, Math.sin(x * 3.2 + t * 1.6) * 0.045 + Math.cos(z * 2.8 + t * 1.2) * 0.03);
    }
    pos.needsUpdate = true;
    waterGeo.computeVertexNormals();

    for (const bird of birds) {
      const a = t * bird.speed + bird.phase;
      bird.group.position.set(
        wx(world.pagoda.cx) + Math.cos(a) * bird.radius,
        wy(bird.height) + Math.sin(a * 2) * 0.4,
        wz(world.pagoda.cz) + Math.sin(a) * bird.radius,
      );
      bird.group.rotation.y = -a + Math.PI / 2;
      const flap = Math.sin(t * 8 + bird.phase) * 0.5;
      bird.wingL.rotation.z = flap;
      bird.wingR.rotation.z = -flap;
    }

    renderer.render(scene, camera);
  }
  renderer.setAnimationLoop(animate);

  return {
    dispose() {
      running = false;
      renderer.setAnimationLoop(null);
      canvas.removeEventListener("pointerdown", onPointerDown);
      canvas.removeEventListener("pointerup", onPointerUp);
      window.removeEventListener("resize", resize);
      canvas.removeEventListener("webglcontextlost", onLost);
      ro.disconnect();
      controls.dispose();
      boxGeo.dispose();
      waterGeo.dispose();
      starGeo.dispose();
      for (const mat of materials.values()) mat.dispose();
      lanternMat.dispose();
      waterMat.dispose();
      scene.traverse((obj) => {
        const mesh = obj;
        if (mesh.geometry && mesh.geometry !== boxGeo && mesh.geometry !== waterGeo) {
          mesh.geometry.dispose();
        }
      });
      renderer.dispose();
      if (window.__VOXEL__ === api) delete window.__VOXEL__;
    },
  };
}

/* ============================================================================
 * Page wiring: mount the scene onto the canvas and drive the HUD.
 * ============================================================================ */

mount(document.getElementById('scene'));

const statsEl = document.getElementById('stats');
setInterval(() => {
  const v = window.__VOXEL__;
  if (!v) return;
  statsEl.textContent = `${Math.round(v.voxelCount / 1000)}k voxels | ${Math.round(v.fps)} FPS`;
}, 400);
</script>
</body>
</html>
