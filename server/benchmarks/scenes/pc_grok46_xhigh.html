<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AURORA NEXUS — Signature Build</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root {
      --rgb: #00e5ff;
      --panel: rgba(8, 10, 16, 0.78);
      --line: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #050507; color: #e8eef4;
      font-family: Rajdhani, system-ui, sans-serif;
      user-select: none; -webkit-user-select: none;
    }
    #c { display: block; width: 100%; height: 100%; touch-action: none; }
    .vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 2;
      background: radial-gradient(ellipse at 42% 48%, transparent 42%, rgba(0,0,0,.55) 100%);
    }
    #brand {
      position: fixed; top: 22px; left: 26px; z-index: 5; pointer-events: none;
    }
    #brand h1 {
      margin: 0; font-size: 13px; letter-spacing: 0.46em; font-weight: 700;
      color: rgba(255,255,255,.78);
    }
    #brand p {
      margin: 4px 0 0; font-size: 10px; letter-spacing: 0.32em; color: rgba(255,255,255,.32);
    }
    #hint {
      position: fixed; left: 26px; bottom: 22px; z-index: 5; pointer-events: none;
      font-family: "Share Tech Mono", monospace; font-size: 9px; letter-spacing: 0.18em;
      color: rgba(255,255,255,.28);
    }
    #hud {
      position: fixed; right: 18px; bottom: 18px; z-index: 20;
      width: 292px; max-height: calc(100vh - 36px); overflow: auto;
      background: var(--panel); backdrop-filter: blur(22px) saturate(1.4);
      -webkit-backdrop-filter: blur(22px) saturate(1.4);
      border: 1px solid var(--line); border-radius: 16px;
      box-shadow: 0 18px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05);
      padding: 14px 14px 12px; color: #dce6ef;
    }
    #hud::-webkit-scrollbar { width: 0; }
    .k {
      font-size: 9px; letter-spacing: 0.28em; color: rgba(255,255,255,.38);
      font-weight: 600; margin-bottom: 6px;
    }
    .hud-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .sysname { font-size: 13px; letter-spacing: 0.28em; font-weight: 700; }
    #sysStatus {
      font-family: "Share Tech Mono", monospace; font-size: 9px; letter-spacing: 0.16em;
      color: #8a93a3; margin-top: 2px;
    }
    #sysStatus.on { color: var(--rgb); text-shadow: 0 0 10px var(--rgb); }
    #sysStatus.boot { color: #ffcc66; }
    #wattage { font-family: "Share Tech Mono", monospace; font-size: 12px; color: var(--rgb); }
    .power-wrap { display: flex; flex-direction: column; align-items: center; margin: 4px 0 10px; }
    #powerBtn {
      width: 68px; height: 68px; border-radius: 50%; cursor: pointer;
      border: 1px solid rgba(255,255,255,.12);
      background:
        radial-gradient(circle at 40% 32%, #2c3038, #09090c 62%);
      position: relative; display: grid; place-items: center;
      transition: box-shadow .35s, border-color .35s, transform .15s;
    }
    #powerBtn:hover { transform: scale(1.04); border-color: rgba(255,255,255,.28); }
    #powerBtn:active { transform: scale(0.96); }
    #powerBtn svg { width: 26px; height: 26px; stroke: #9aa4b2; fill: none; stroke-width: 1.8; transition: stroke .3s; }
    #powerBtn.on {
      border-color: var(--rgb);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--rgb) 40%, transparent), 0 0 28px color-mix(in srgb, var(--rgb) 45%, transparent), inset 0 0 16px color-mix(in srgb, var(--rgb) 25%, transparent);
    }
    #powerBtn.on svg { stroke: var(--rgb); filter: drop-shadow(0 0 6px var(--rgb)); }
    .boot-ring {
      position: absolute; inset: -5px; pointer-events: none; transform: rotate(-90deg);
    }
    .boot-ring circle {
      fill: none; stroke: var(--rgb); stroke-width: 2; stroke-linecap: round;
      stroke-dasharray: 226; stroke-dashoffset: 226; opacity: .85;
    }
    #powerLabel {
      margin-top: 7px; font-size: 9px; letter-spacing: 0.34em; color: rgba(255,255,255,.4);
    }
    #bootlog {
      font-family: "Share Tech Mono", monospace; font-size: 9px; line-height: 1.45;
      color: color-mix(in srgb, var(--rgb) 80%, #fff); min-height: 0;
      max-height: 72px; overflow: hidden; margin-bottom: 8px; opacity: .85;
      white-space: pre-wrap;
    }
    section.hsec {
      border-top: 1px solid var(--line); padding: 9px 0 2px; margin-top: 4px;
    }
    .row { display: flex; align-items: center; gap: 10px; }
    #rgbPicker {
      -webkit-appearance: none; appearance: none; width: 36px; height: 28px; border: 0;
      background: none; cursor: pointer; padding: 0;
    }
    #rgbPicker::-webkit-color-swatch-wrapper { padding: 0; }
    #rgbPicker::-webkit-color-swatch {
      border: 1px solid rgba(255,255,255,.2); border-radius: 6px;
    }
    #rgbHex { font-family: "Share Tech Mono", monospace; font-size: 11px; letter-spacing: 0.12em; color: var(--rgb); }
    .modes { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 6px; }
    .modes button, .grid2 button {
      font-family: Rajdhani, sans-serif; font-weight: 600; letter-spacing: 0.14em;
      font-size: 9px; color: rgba(255,255,255,.55); background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.07); border-radius: 6px; padding: 5px 7px;
      cursor: pointer; transition: .2s ease;
    }
    .modes button:hover, .grid2 button:hover { color: #fff; border-color: rgba(255,255,255,.2); }
    .modes button.active, .grid2 button.active {
      color: #041016; background: var(--rgb); border-color: var(--rgb);
      box-shadow: 0 0 12px color-mix(in srgb, var(--rgb) 45%, transparent);
    }
    label.sl {
      display: flex; justify-content: space-between; font-size: 9px; letter-spacing: 0.18em;
      color: rgba(255,255,255,.4); margin: 4px 0 3px;
    }
    label.sl b { font-family: "Share Tech Mono", monospace; font-weight: 400; color: var(--rgb); letter-spacing: 0; }
    input[type=range] {
      -webkit-appearance: none; appearance: none; width: 100%; height: 3px;
      background: rgba(255,255,255,.1); border-radius: 99px; outline: none; margin: 4px 0 8px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
      background: var(--rgb); cursor: pointer; box-shadow: 0 0 8px var(--rgb); border: 0;
    }
    .temps { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 4px; }
    .temps div {
      background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.05);
      border-radius: 8px; padding: 6px 6px 5px; text-align: center;
      font-size: 8px; letter-spacing: 0.16em; color: rgba(255,255,255,.4);
    }
    .temps b {
      display: block; font-family: "Share Tech Mono", monospace; font-weight: 400;
      font-size: 13px; color: #e8eef4; letter-spacing: 0; margin-top: 2px;
    }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 6px; }
    #specPanel { background: rgba(0,0,0,.25); border-radius: 10px; padding: 8px 10px; margin-top: 8px; }
    #partName { color: var(--rgb); letter-spacing: 0.2em; font-size: 9px; margin-bottom: 3px; }
    #partSpec {
      font-family: "Share Tech Mono", monospace; font-size: 10px; line-height: 1.45;
      color: rgba(230,240,255,.7); white-space: pre-wrap;
    }
    #loader {
      position: fixed; inset: 0; z-index: 40; display: grid; place-items: center;
      background: #050507; transition: opacity .7s ease;
    }
    #loader .inner { text-align: center; }
    #loader h2 {
      margin: 0; font-size: 14px; letter-spacing: 0.5em; font-weight: 700;
    }
    #loader span {
      display: block; margin-top: 10px; font-family: "Share Tech Mono", monospace;
      font-size: 10px; letter-spacing: 0.28em; color: var(--rgb); opacity: .7;
    }
    .bar {
      width: 160px; height: 2px; background: #1a1a20; margin: 18px auto 0; overflow: hidden;
    }
    .bar i {
      display: block; height: 100%; width: 40%; background: var(--rgb);
      animation: load 1.1s ease infinite; box-shadow: 0 0 12px var(--rgb);
    }
    @keyframes load { 0% { transform: translateX(-120%); } 100% { transform: translateX(350%); } }
    .tag {
      color: #d8f7ff; font-family: "Share Tech Mono", monospace; font-size: 10px;
      letter-spacing: 0.08em; background: rgba(4,8,14,.78);
      border: 1px solid color-mix(in srgb, var(--rgb) 50%, transparent);
      padding: 3px 8px; border-radius: 3px; white-space: nowrap; pointer-events: none;
      text-shadow: 0 0 8px rgba(0,229,255,.4);
    }
    @media (max-width: 720px) {
      #hud { width: min(300px, calc(100vw - 16px)); right: 8px; bottom: 8px; transform: scale(0.92); transform-origin: bottom right; }
      #brand, #hint { display: none; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="vignette"></div>
  <div id="brand">
    <h1>AURORA NEXUS</h1>
    <p>SIGNATURE BUILD  ·  CRYOLOOP</p>
  </div>
  <div id="hint">DRAG ORBIT  ·  SCROLL ZOOM  ·  CLICK HARDWARE</div>
  <div id="loader"><div class="inner"><h2>AURORA NEXUS</h2><span>FORGING CORE</span><div class="bar"><i></i></div></div></div>

  <aside id="hud">
    <div class="hud-head">
      <div>
        <div class="sysname">AURORA NEXUS</div>
        <div id="sysStatus">STANDBY</div>
      </div>
      <div id="wattage">0 W</div>
    </div>
    <div class="power-wrap">
      <button id="powerBtn" aria-label="Power">
        <svg class="boot-ring" viewBox="0 0 78 78"><circle id="bootCircle" cx="39" cy="39" r="36"></circle></svg>
        <svg viewBox="0 0 24 24"><path d="M12 3v8" /><path d="M8.2 6.1a7 7 0 1 0 7.6 0" /></svg>
      </button>
      <div id="powerLabel">POWER</div>
    </div>
    <div id="bootlog"></div>
    <section class="hsec">
      <div class="k">RGB LIGHTING</div>
      <div class="row">
        <input id="rgbPicker" type="color" value="#00e5ff" />
        <span id="rgbHex">#00E5FF</span>
      </div>
      <div class="modes" id="rgbModes">
        <button data-mode="static">STATIC</button>
        <button data-mode="breathe">BREATHE</button>
        <button data-mode="wave" class="active">WAVE</button>
        <button data-mode="rainbow">PRISM</button>
        <button data-mode="pulse">PULSE</button>
      </div>
      <label class="sl">INTENSITY <b id="intVal">85%</b></label>
      <input type="range" id="rgbInt" min="0" max="100" value="85" />
    </section>
    <section class="hsec">
      <div class="k">THERMAL</div>
      <div class="modes" id="fanModes">
        <button data-fan="silent">SILENT</button>
        <button data-fan="balanced" class="active">BALANCED</button>
        <button data-fan="turbo">TURBO</button>
      </div>
      <label class="sl">FAN SPEED <b id="fanVal">0 RPM</b></label>
      <input type="range" id="fanSpeed" min="15" max="100" value="55" />
      <div class="temps">
        <div>CPU <b id="cpuT">24°C</b></div>
        <div>GPU <b id="gpuT">24°C</b></div>
        <div>LOOP <b id="loopT">24°C</b></div>
      </div>
    </section>
    <section class="hsec">
      <div class="k">CONTROL</div>
      <div class="grid2">
        <button id="btnPanel">OPEN PANEL</button>
        <button id="btnInspect">INSPECT</button>
        <button id="btnTour">CINEMA</button>
        <button id="btnOrbit">AUTO-ORBIT</button>
      </div>
      <div class="modes" id="envModes">
        <button data-env="void" class="active">VOID</button>
        <button data-env="studio">STUDIO</button>
        <button data-env="neon">NEON</button>
      </div>
    </section>
    <div id="specPanel">
      <div class="k" id="partName">SIGNATURE BUILD</div>
      <div id="partSpec">Click any component to inspect hardware.</div>
    </div>
  </aside>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    const W = 23, H = 48, D = 45, WALL = 0.55;
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050507);
    scene.fog = new THREE.Fog(0x050507, 90, 210);

    const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.2, 400);
    camera.position.set(62, 40, -56);

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(innerWidth, innerHeight);
    labelRenderer.domElement.style.position = 'fixed';
    labelRenderer.domElement.style.left = '0';
    labelRenderer.domElement.style.top = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';
    labelRenderer.domElement.style.zIndex = '4';
    document.body.appendChild(labelRenderer.domElement);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 22;
    controls.maxDistance = 130;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.target.set(0, 26.2, 0);
    controls.autoRotateSpeed = 0.7;

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 0.55;

    const hemi = new THREE.HemisphereLight(0x9aa8bc, 0x0a0806, 0.45);
    scene.add(hemi);
    const key = new THREE.DirectionalLight(0xfff3e4, 2.15);
    key.position.set(48, 78, -38);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.near = 10;
    key.shadow.camera.far = 220;
    key.shadow.camera.left = -70;
    key.shadow.camera.right = 70;
    key.shadow.camera.top = 70;
    key.shadow.camera.bottom = -70;
    key.shadow.bias = -0.0004;
    scene.add(key);
    const fill = new THREE.DirectionalLight(0x8fb4ff, 0.55);
    fill.position.set(-60, 30, 40);
    scene.add(fill);
    const rim = new THREE.DirectionalLight(0x6a7f9a, 0.7);
    rim.position.set(-10, 28, 70);
    scene.add(rim);
    const neonA = new THREE.PointLight(0xff2fa0, 0, 90, 2);
    neonA.position.set(-40, 20, -30);
    scene.add(neonA);
    const neonB = new THREE.PointLight(0x00e5ff, 0, 90, 2);
    neonB.position.set(40, 35, 30);
    scene.add(neonB);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.42, 0.55, 0.62);
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());

    const rgbMats = [];
    const fans = [];
    const clickables = [];
    const labels = [];
    const rgbLights = [];
    const screens = [];
    const postLeds = [];
    let glassPivot, impellerCPU, impellerRes, flowTex, coolantMat, liquidMat;
    let casePowerBtn, gpuGroup, ramGroup, cpuBlock, resGroup, mbGroup;
    let dust, dustPos, dustVel;
    const tubeMats = [];

    const state = {
      powered: false,
      powering: false,
      shutting: false,
      boot: 0,
      rgbColor: new THREE.Color(0x00e5ff),
      rgbMode: 'wave',
      rgbInt: 0.85,
      fanProfile: 'balanced',
      fanSlider: 0.55,
      rpm: 0,
      targetRpm: 0,
      panelOpen: false,
      panel: 0,
      inspect: false,
      cinematic: false,
      orbit: false,
      env: 'void',
      bloomFlash: 0,
      cpuT: 24, gpuT: 24, loopT: 24,
      watts: 0,
      selected: null
    };

    function makeRGB(phase = 0, intensity = 1.7) {
      const m = new THREE.MeshStandardMaterial({
        color: 0x0a0a0c, roughness: 0.32, metalness: 0.4,
        emissive: new THREE.Color(0x00e5ff), emissiveIntensity: 0
      });
      m.userData.phase = phase;
      m.userData.base = intensity;
      rgbMats.push(m);
      return m;
    }

    function canvasTex(draw, w = 512, h = 512) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const g = c.getContext('2d');
      draw(g, w, h);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = 8;
      return t;
    }

    const pcbTex = canvasTex((g, w, h) => {
      g.fillStyle = '#0a100e';
      g.fillRect(0, 0, w, h);
      g.fillStyle = '#0d1612';
      for (let y = 0; y < h; y += 18) g.fillRect(0, y, w, 1);
      g.strokeStyle = 'rgba(196,162,70,0.28)';
      g.lineWidth = 1.2;
      for (let i = 0; i < 90; i++) {
        g.beginPath();
        const x = Math.random() * w, y = Math.random() * h;
        g.moveTo(x, y);
        g.lineTo(x + (Math.random() - 0.5) * 180, y);
        g.lineTo(x + (Math.random() - 0.5) * 140, y + (Math.random() - 0.5) * 160);
        g.stroke();
      }
      g.fillStyle = 'rgba(214,178,70,0.45)';
      for (let i = 0; i < 520; i++) g.fillRect(Math.random() * w, Math.random() * h, 3, 7);
      g.fillStyle = 'rgba(20,20,22,0.9)';
      g.fillRect(w * 0.38, h * 0.18, 90, 90);
      g.strokeStyle = 'rgba(180,180,190,0.25)';
      g.strokeRect(w * 0.38, h * 0.18, 90, 90);
      for (let i = 0; i < 4; i++) g.fillRect(w * 0.58, h * 0.16 + i * 22, 18, 110);
      for (let i = 0; i < 5; i++) g.fillRect(w * 0.18, h * 0.48 + i * 28, w * 0.62, 14);
      g.fillStyle = 'rgba(230,230,240,0.28)';
      g.font = '22px monospace';
      g.fillText('NEXUS X870E DARK', 28, 40);
      g.font = '16px monospace';
      g.fillText('AURORA LABS  ·  24+2+1 PHASE', 28, 64);
      g.fillText('PCIE 5.0  ·  DDR5  ·  WIFI 7', 28, h - 28);
    }, 1024, 1280);

    const meshTex = canvasTex((g, w, h) => {
      g.fillStyle = '#ffffff';
      g.fillRect(0, 0, w, h);
      g.fillStyle = '#000000';
      for (let y = 6; y < h; y += 9) {
        for (let x = 6; x < w; x += 9) {
          g.beginPath();
          g.arc(x + (y % 18 === 6 ? 0 : 4.5), y, 3.1, 0, Math.PI * 2);
          g.fill();
        }
      }
    }, 256, 512);
    meshTex.colorSpace = THREE.NoColorSpace;

    const hexTex = canvasTex((g, w, h) => {
      g.fillStyle = '#16181c';
      g.fillRect(0, 0, w, h);
      g.strokeStyle = 'rgba(220,230,240,0.07)';
      g.lineWidth = 1;
      const s = 16;
      for (let y = 0; y < h + s; y += s * 1.6) {
        for (let x = 0; x < w + s; x += s * 1.8) {
          const ox = (Math.floor(y / (s * 1.6)) % 2) * s * 0.9;
          g.beginPath();
          for (let i = 0; i < 6; i++) {
            const a = Math.PI / 3 * i;
            const px = x + ox + Math.cos(a) * 8, py = y + Math.sin(a) * 8;
            i ? g.lineTo(px, py) : g.moveTo(px, py);
          }
          g.closePath(); g.stroke();
        }
      }
      g.fillStyle = 'rgba(230,240,255,0.18)';
      g.font = 'bold 42px sans-serif';
      g.textAlign = 'center';
      g.fillText('PHANTOM', w / 2, h / 2 - 8);
      g.font = '18px sans-serif';
      g.fillText('90   ·   24G', w / 2, h / 2 + 22);
    }, 512, 256);

    const carbonTex = canvasTex((g, w, h) => {
      g.fillStyle = '#121214';
      g.fillRect(0, 0, w, h);
      g.strokeStyle = 'rgba(255,255,255,0.045)';
      for (let i = 0; i < w; i += 4) {
        g.beginPath(); g.moveTo(i, 0); g.lineTo(i, h); g.stroke();
        g.beginPath(); g.moveTo(0, i); g.lineTo(w, i); g.stroke();
      }
    }, 128, 128);
    carbonTex.wrapS = carbonTex.wrapT = THREE.RepeatWrapping;
    carbonTex.repeat.set(6, 6);

    const brushed = canvasTex((g, w, h) => {
      g.fillStyle = '#7b8088';
      g.fillRect(0, 0, w, h);
      for (let i = 0; i < 400; i++) {
        g.strokeStyle = `rgba(255,255,255,${Math.random() * 0.08})`;
        g.beginPath();
        const y = Math.random() * h;

    const audio = {
      ctx: null, gain: null,
      ensure() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          const n = this.ctx.sampleRate * 2;
          const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
          const d = buf.getChannelData(0);
          for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
          const src = this.ctx.createBufferSource();
          src.buffer = buf; src.loop = true;
          const f = this.ctx.createBiquadFilter();
          f.type = 'bandpass'; f.frequency.value = 380; f.Q.value = 0.55;
          this.gain = this.ctx.createGain();
          this.gain.gain.value = 0;
          src.connect(f); f.connect(this.gain); this.gain.connect(this.ctx.destination);
          src.start();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      },
      fan(v) {
        if (!this.gain) return;
        this.gain.gain.linearRampToValueAtTime(Math.max(0, v) * 0.028, this.ctx.currentTime + 0.08);
      },
      tone(freq, dur, type = 'sine', vol = 0.04) {
        if (!this.ctx) return;
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(vol, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + dur);
      }
    };

      state.panelOpen = !state.panelOpen;
      e.currentTarget.classList.toggle('active', state.panelOpen);
      e.currentTarget.textContent = state.panelOpen ? 'CLOSE PANEL' : 'OPEN PANEL';
    });
    document.getElementById('btnInspect').addEventListener('click', e => {
      state.inspect = !state.inspect;
      e.currentTarget.classList.toggle('active', state.inspect);
      labels.forEach(l => { l.style.display = state.inspect ? 'block' : 'none'; });
    });
    document.getElementById('btnOrbit').addEventListener('click', e => {
      state.orbit = !state.orbit;
      controls.autoRotate = state.orbit;
      e.currentTarget.classList.toggle('active', state.orbit);
    });
    document.getElementById('envModes').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      setEnv(b.dataset.env);
      [...e.currentTarget.children].forEach(x => x.classList.toggle('active', x === b));
    });

    function setEnv(name) {
      state.env = name;
      if (name === 'void') {
        scene.background.set(0x050507); scene.fog.color.set(0x050507);
        key.intensity = 2.15; fill.intensity = 0.55; hemi.intensity = 0.45;
        neonA.intensity = 0; neonB.intensity = 0; renderer.toneMappingExposure = 1.05;
      } else if (name === 'studio') {
        scene.background.set(0x18181e); scene.fog.color.set(0x18181e);
        key.intensity = 3.1; fill.intensity = 0.9; hemi.intensity = 0.7;
        neonA.intensity = 0; neonB.intensity = 0; renderer.toneMappingExposure = 1.15;
      } else {
        scene.background.set(0x0a0412); scene.fog.color.set(0x0a0412);
        key.intensity = 1.3; fill.intensity = 0.25; hemi.intensity = 0.3;
        neonA.intensity = 14; neonB.intensity = 10; renderer.toneMappingExposure = 0.95;
      }
    }

    const tour = [
      { p: new THREE.Vector3(62, 40, -56), t: new THREE.Vector3(0, 26.2, 0), d: 4.5 },
      { p: new THREE.Vector3(38, 22, -6), t: new THREE.Vector3(3, 16, 0), d: 4 },
      { p: new THREE.Vector3(26, 38, 14), t: new THREE.Vector3(-3, 34, 9), d: 3.6 },
      { p: new THREE.Vector3(24, 14, 10), t: new THREE.Vector3(5, 12, 2), d: 3.6 },
      { p: new THREE.Vector3(-42, 32, -18), t: new THREE.Vector3(0, 24, 0), d: 4 },
      { p: new THREE.Vector3(8, 62, -8), t: new THREE.Vector3(0, 22, 0), d: 3.8 },
      { p: new THREE.Vector3(18, 28, 58), t: new THREE.Vector3(0, 22, 8), d: 4 },
      { p: new THREE.Vector3(62, 40, -56), t: new THREE.Vector3(0, 26.2, 0), d: 4.5 }
    ];
    let tourI = 0, tourT = 0, tourFromP, tourFromT;
    const tmpP = new THREE.Vector3(), tmpT = new THREE.Vector3();

    document.getElementById('btnTour').addEventListener('click', e => {
      state.cinematic = !state.cinematic;
      e.currentTarget.classList.toggle('active', state.cinematic);
      if (state.cinematic) {
        tourI = 0; tourT = 0;
        tourFromP = camera.position.clone();
        tourFromT = controls.target.clone();
        controls.enabled = false;
        if (state.orbit) {
          state.orbit = false; controls.autoRotate = false;
          document.getElementById('btnOrbit').classList.remove('active');
        }
      } else controls.enabled = true;
    });
    controls.addEventListener('start', () => {
      if (state.cinematic) {
        state.cinematic = false;
        document.getElementById('btnTour').classList.remove('active');
        controls.enabled = true;
      }
    });

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    canvas.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      pointer.x = (e.clientX / innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(clickables, true);
      if (!hits.length) return;
      let o = hits[0].object;
      while (o && !o.userData.click && !o.userData.part) o = o.parent;
      if (!o) return;
      if (o.userData.click === 'power') togglePower();
      else if (o.userData.part) {
        document.getElementById('partName').textContent = o.userData.part.name;
        document.getElementById('partSpec').textContent = o.userData.part.spec;
        if (!state.inspect) {
          labels.forEach(l => l.style.display = 'none');
          o.traverse(ch => {
            if (ch.isCSS2DObject) ch.element.style.display = 'block';
          });
        }
      }
    });
    canvas.addEventListener('dblclick', () => {
      camera.position.set(62, 40, -56);
      controls.target.set(0, 26.2, 0);
    });
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    const tmpC = new THREE.Color();
    const hsl = { h: 0, s: 0, l: 0 };

    function rgbFrame(t, phase) {
      const mode = state.rgbMode;
      const live = Math.min(1, Math.max(0, state.boot));
      let intensity = state.rgbInt * live;
      tmpC.copy(state.rgbColor);
      if (mode === 'breathe') {
        intensity *= 0.18 + 0.82 * (0.5 + 0.5 * Math.sin(t * 1.6));
      } else if (mode === 'pulse') {
        const p = Math.pow(0.5 + 0.5 * Math.sin(t * 4.2), 4);
        intensity *= 0.08 + 0.92 * p;
      } else if (mode === 'rainbow') {
        tmpC.setHSL((t * 0.07 + phase * 0.08) % 1, 0.95, 0.5);
      } else if (mode === 'wave') {
        state.rgbColor.getHSL(hsl);
        tmpC.setHSL((hsl.h + 0.08 * Math.sin(t * 2.1 + phase * 2.4) + phase * 0.12 + t * 0.04) % 1, Math.max(0.55, hsl.s), 0.5);
      }
      return { color: tmpC, intensity };
    }

    function drawScreens(t, live) {
      screens.forEach(s => {
        const g = s.ctx, w = s.c.width, h = s.c.height;
        g.fillStyle = '#030508';
        g.fillRect(0, 0, w, h);
        s.mat.emissiveIntensity = 0.15 + live * 1.1;
        if (live < 0.2) { s.tex.needsUpdate = true; return; }
        const col = '#' + state.rgbColor.getHexString();
        if (s.kind === 'cpu') {
          g.strokeStyle = col; g.lineWidth = 6; g.beginPath(); g.arc(w / 2, h / 2, 90, 0, Math.PI * 2); g.stroke();
          g.fillStyle = col; g.font = 'bold 48px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
          g.fillText(Math.round(state.cpuT) + '°', w / 2, h / 2 - 10);
          g.font = '22px sans-serif'; g.fillText('CORE', w / 2, h / 2 + 36);
        } else if (s.kind === 'gpu') {
          g.fillStyle = col; g.font = 'bold 28px sans-serif'; g.textAlign = 'left';
          g.fillText('PHANTOM 90', 16, 32);
          g.font = '18px sans-serif'; g.fillText(Math.round(state.gpuT) + '°C   ' + Math.round(state.rpm * 0.85) + ' RPM', 16, 62);
          const n = 18;
          for (let i = 0; i < n; i++) {
            const bh = (0.25 + 0.75 * Math.abs(Math.sin(t * 3 + i * 0.4))) * (h - 20) * 0.35;
            g.globalAlpha = 0.85;
            g.fillRect(16 + i * 13, h - 10 - bh, 9, bh);
          }
          g.globalAlpha = 1;
        } else if (s.kind === 'logo') {
          g.fillStyle = col; g.font = 'bold 28px sans-serif'; g.textAlign = 'center';
          g.fillText(live > 0.9 ? 'AURORA NEXUS' : 'POST ' + Math.round(live * 100) + '%', w / 2, h / 2 + 8);
        } else if (s.kind === 'io') {
          g.fillStyle = col; g.font = 'bold 22px sans-serif'; g.textAlign = 'center';
          g.fillText(state.powered || state.powering ? Math.round(state.watts) + ' W' : 'STANDBY', w / 2, 32);
          g.font = '16px sans-serif';
          g.fillText(Math.round(state.rpm) + ' RPM', w / 2, 58);
        }
        s.tex.needsUpdate = true;
      });
    }

    const clock = new THREE.Clock();
    let accScreen = 0;

    function update(dt, t) {
      if (state.powering) {
        state.boot = Math.min(1, state.boot + dt / 3.35);
        bootCircle.style.strokeDashoffset = String(226 * (1 - state.boot));
        while (logShown < bootLines.length && state.boot * 3.35 >= bootLines[logShown].t) {
          logEl.textContent = (logEl.textContent ? logEl.textContent + '\n' : '') + bootLines[logShown].s;
          logEl.scrollTop = logEl.scrollHeight;
          logShown++;
        }
        if (state.boot >= 1) {
          state.powering = false;
          state.powered = true;
          sysStatus.textContent = 'ONLINE';
          sysStatus.className = 'on';
          audio.tone(1320, 0.09, 'sine', 0.03);
        }
      } else if (state.shutting) {
        state.boot = Math.max(0, state.boot - dt / 1.4);
        bootCircle.style.strokeDashoffset = String(226 * (1 - state.boot));
        if (state.boot <= 0) {
          state.shutting = false;
          sysStatus.textContent = 'STANDBY';
          setLog(true);
        }
      } else if (state.powered) {
        bootCircle.style.strokeDashoffset = '0';
      }

      const live = state.boot;
      const profileMul = state.fanProfile === 'silent' ? 0.55 : state.fanProfile === 'turbo' ? 1.15 : 1;
      state.targetRpm = live * (420 + state.fanSlider * 1480) * profileMul;
      state.rpm = THREE.MathUtils.damp(state.rpm, state.targetRpm, 2.2, dt);
      fans.forEach((f, i) => {
        const mul = 0.85 + (i % 5) * 0.04;
        f.userData.blades.rotation.z += (state.rpm * mul / 60) * Math.PI * 2 * dt;
      });
      if (impellerCPU) impellerCPU.rotation.x += live * (2.2 + state.fanSlider * 6) * dt;
      if (impellerRes) impellerRes.rotation.y += live * (3.5 + state.fanSlider * 8) * dt;
      flowTex.offset.x -= dt * live * (0.4 + state.fanSlider * 1.4);

      state.panel = THREE.MathUtils.damp(state.panel, state.panelOpen ? 1 : 0, 3.2, dt);
      const pe = state.panel * state.panel * (3 - 2 * state.panel);
      glassPivot.rotation.y = pe * 2.12;
      if (state.panelOpen && pe > 0.85) mats.glass.transmission = 0.15;
      else mats.glass.transmission = 0.9;

      state.bloomFlash = Math.max(0, state.bloomFlash - dt * 1.3);
      bloomPass.strength = 0.32 + live * 0.22 + state.bloomFlash * 0.7;

      const primary = rgbFrame(t, 0);
      const primaryCol = primary.color.clone();
      const primaryInt = primary.intensity;
      rgbMats.forEach(m => {
        const r = rgbFrame(t, m.userData.phase);
        m.emissive.copy(r.color);
        m.emissiveIntensity = r.intensity * m.userData.base;
      });
      rgbLights.forEach((l, i) => {
        const r = rgbFrame(t, i * 0.4);
        l.color.copy(r.color);
        l.intensity = r.intensity * (5.5 - i * 0.8);
      });
      tubeMats.forEach(m => {
        m.color.copy(primaryCol);
        m.emissive.copy(primaryCol);
        m.emissiveIntensity = primaryInt * 0.85;
        m.opacity = 0.35 + live * 0.5;
      });
      if (dust) {
        dust.material.opacity = 0.05 + live * 0.28;
        dust.material.color.copy(primary.color);
        for (let i = 0; i < dustVel.length; i++) {
          dustPos[i * 3] += dustVel[i].x * dt * (0.4 + live * 1.6);
          dustPos[i * 3 + 1] += dustVel[i].y * dt * (0.3 + live * 2.2);
          dustPos[i * 3 + 2] += dustVel[i].z * dt * (0.4 + live);
          if (dustPos[i * 3 + 1] > H / 2 - 3) dustPos[i * 3 + 1] = -H / 2 + 4;
          if (dustPos[i * 3] > W / 2 - 2) dustPos[i * 3] = -W / 2 + 2;
          if (dustPos[i * 3] < -W / 2 + 2) dustPos[i * 3] = W / 2 - 2;
        }
        dust.geometry.attributes.position.needsUpdate = true;
      }

      postLeds.forEach((led, i) => {
        const th = 0.18 + i * 0.16;
        const on = live > th && (live < 0.92 || i === 3);
        led.material.emissiveIntensity = on ? 3.2 : live > 0.05 && i === 0 && !state.powered ? 1.2 : 0;
      });

      const load = 0.55 + 0.1 * Math.sin(t * 0.35) + (1 - state.fanSlider) * 0.2;
      const tgtCpu = 24 + live * (28 + load * 22 + (1 - state.fanSlider) * 14);
      const tgtGpu = 24 + live * (32 + load * 26 + (1 - state.fanSlider) * 16);
      const tgtLoop = 24 + live * (18 + load * 10);
      state.cpuT = THREE.MathUtils.damp(state.cpuT, tgtCpu, 1.2, dt);
      state.gpuT = THREE.MathUtils.damp(state.gpuT, tgtGpu, 1.1, dt);
      state.loopT = THREE.MathUtils.damp(state.loopT, tgtLoop, 0.9, dt);
      const tgtW = live * (95 + 220 * load + state.fanSlider * 40);
      state.watts = THREE.MathUtils.damp(state.watts, tgtW, 2.5, dt);

      document.getElementById('cpuT').textContent = Math.round(state.cpuT) + '°C';
      document.getElementById('gpuT').textContent = Math.round(state.gpuT) + '°C';
      document.getElementById('loopT').textContent = Math.round(state.loopT) + '°C';
      document.getElementById('fanVal').textContent = Math.round(state.rpm) + ' RPM';
      document.getElementById('wattage').textContent = Math.round(state.watts) + ' W';
      audio.fan(live * (0.25 + state.fanSlider * 0.8) * (state.rpm > 50 ? 1 : 0));

      accScreen += dt;
      if (accScreen > 0.08) { accScreen = 0; drawScreens(t, live); }

      if (state.cinematic) {
        const wp = tour[tourI];
        tourT += dt;
        const k = Math.min(1, tourT / wp.d);
        const e = k * k * (3 - 2 * k);
        camera.position.lerpVectors(tourFromP, wp.p, e);
        controls.target.lerpVectors(tourFromT, wp.t, e);
        if (k >= 1) {
          tourFromP = wp.p.clone();
          tourFromT = wp.t.clone();
          tourI = (tourI + 1) % tour.length;
          tourT = 0;
        }
      }
    }

    function loop() {
      requestAnimationFrame(loop);
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;
      update(dt, t);
      controls.update();
      composer.render();
      labelRenderer.render(scene, camera);
    }

    function onResize() {
      const w = innerWidth, h = innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
      bloomPass.resolution.set(w, h);
      labelRenderer.setSize(w, h);
    }
    window.addEventListener('resize', onResize);
    canvas.addEventListener('wheel', e => e.preventDefault(), { passive: false });

    renderer.compile(scene, camera);
    loop();
    requestAnimationFrame(() => {
      const loader = document.getElementById('loader');
      loader.style.opacity = '0';
      setTimeout(() => loader.remove(), 750);
    });
  </script>
</body>
</html>
