<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Voxel Garden — Spring Festival at the Five-Story Pagoda</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#101a24;font-family:"Segoe UI",Helvetica,Arial,sans-serif;}
  #app{position:fixed;inset:0;}
  canvas{display:block;}
  .hud{position:fixed;top:18px;left:20px;color:#fff;pointer-events:none;z-index:10;text-shadow:0 2px 10px rgba(0,0,0,.5);}
  .hud h1{margin:0;font-size:22px;letter-spacing:6px;font-weight:800;color:#ffe9d2;}
  .hud .sub{margin-top:4px;font-size:12px;letter-spacing:2px;opacity:.92;color:#ffd9a8;}
  .hud .hint{margin-top:8px;font-size:11px;letter-spacing:1px;opacity:.75;}
  .ctrl{position:fixed;left:20px;bottom:18px;z-index:10;display:flex;gap:10px;align-items:center;background:rgba(16,22,32,.55);
        padding:10px 14px;border-radius:12px;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);}
  .ctrl label{font-size:11px;letter-spacing:2px;color:#ffd9a8;}
  .ctrl input[type=range]{width:200px;accent-color:#e8b86d;cursor:pointer;}
  .ctrl button{background:#c73e1d;border:none;color:#fff;font-size:11px;letter-spacing:2px;padding:7px 14px;border-radius:8px;cursor:pointer;}
  .ctrl button:hover{background:#e0512c;}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at center,transparent 55%,rgba(8,10,18,.45) 100%);}
  #toast{position:fixed;top:22px;left:50%;transform:translateX(-50%);z-index:11;background:rgba(20,26,36,.72);color:#ffe9d2;
         padding:8px 18px;border-radius:20px;font-size:12px;letter-spacing:2px;opacity:0;transition:opacity .4s;pointer-events:none;border:1px solid rgba(255,255,255,.15);}
</style>
</head>
<body>
<div id="app"></div>
<div class="vignette"></div>
<div class="hud">
  <h1>VOXEL GARDEN</h1>
  <div class="sub" id="stats">— voxels | — FPS</div>
  <div class="hint">Click lanterns &nbsp;•&nbsp; Click pagoda floors &nbsp;•&nbsp; Drag to orbit</div>
</div>
<div class="ctrl">
  <label>TIME OF DAY</label>
  <input id="timeSlider" type="range" min="0" max="1" step="0.001" value="0.34"/>
  <button id="pauseBtn">PAUSE</button>
</div>
<div id="toast"></div>

<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================== CORE ============================== */
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xaecbdf, 90, 250);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 600);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.getElementById('app').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 14;
controls.maxDistance = 130;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, 12, 0);
controls.autoRotate = false;
controls.autoRotateSpeed = 0.45;

/* ============================== LIGHTING ============================== */
const sun = new THREE.DirectionalLight(0xfff2dd, 1.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -55; sun.shadow.camera.right = 55;
sun.shadow.camera.top = 60;  sun.shadow.camera.bottom = -30;
sun.shadow.camera.near = 10; sun.shadow.camera.far = 320;
sun.shadow.bias = -0.0006;
scene.add(sun); scene.add(sun.target);

const hemi = new THREE.HemisphereLight(0xbdd7ee, 0x606c38, 0.55);
scene.add(hemi);

/* ============================== VOXEL ENGINE ============================== */
const VS = 0.5; // voxel size
const buckets = new Map();
let TOTAL = 0;
const P = {
  vermillion:0xC73E1D, gold:0xE8B86D, goldBright:0xFFD27A, deepTeak:0x4A2C1A, darkWood:0x33200f,
  jadeDark:0x2D6A4F, jade:0x40916C, sakura:0xFFB7C5, sakuraDeep:0xFF8FAB, sakuraLight:0xFFE5EC,
  stone:0x9AA0A6, stoneDark:0x7d838a, pond:0x7ED6DF, moss:0x606C38, mossDark:0x4c562c,
  cream:0xFFF3E0, paper:0xFFE9C9, dark:0x1c1410, bark:0x5a3a22, pine:0x2f6b4f, pineDark:0x245743,
  maple:0xD94F30, mapleDeep:0xB23A22, willow:0x9CCB5E, willowDeep:0x7fb348, soil:0x4a3423,
  rock:0x8b9096, rockDark:0x6e7378, cloud:0xf4f8fb, leafGold:0xE8C86D
};
function key(c){ return 'k'+c; }
function push(c, x, y, z){
  const k = key(c);
  let a = buckets.get(k);
  if(!a){ a = []; buckets.set(k, a); }
  a.push(x, y, z);
  TOTAL++;
}
function pushBox(c, x0,y0,z0, x1,y1,z1){
  for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++) for(let z=z0;z<=z1;z++) push(c,x,y,z);
}
function ring(c, hx, hz, y, half, c2){
  for(let x=-hx;x<=hx;x++) for(let z=-hz;z<=hz;z++){
    if(Math.abs(x)===hx || Math.abs(z)===hz) push(((x+z)%2===0)?c:(c2||c), x, y, z);
  }
}
function disc(c, cx, cz, r, y){
  for(let x=-r;x<=r;x++) for(let z=-r;z<=r;z++){
    if(x*x+z*z <= r*r) push(c, cx+x, y, cz+z);
  }
}
function fillColumn(c, x, z, y0, y1){ for(let y=y0;y<=y1;y++) push(c,x,y,z); }

/* ============================== TERRAIN (flying island) ============================== */
const RX=28, RZ=26, DOME=3, ROCK=9;
for(let x=-RX;x<=RX;x++){
  for(let z=-RZ;z<=RZ;z++){
    const t = (x*x)/(RX*RX) + (z*z)/(RZ*RZ);
    if(t > 1) continue;
    const surf = Math.round(DOME*(1-t));
    const rockTop = Math.round(ROCK*(1-t));
    for(let y=-rockTop;y<=surf;y++){
      let c;
      if(y === surf)      c = (Math.random()<0.12) ? P.mossDark : P.moss;
      else if(y >= surf-2) c = P.soil;
      else {
        const sh = 0.55 + 0.45*(1 - (-y)/(ROCK+2));
        c = Math.random()<0.5 ? P.rock : P.rockDark;
        push(c, x, y, z); continue; // rocks already varied
      }
      push(c, x, y, z);
    }
  }
}
// pond (front-right)
const POND = {x:15, z:12, r:7};
disc(P.pond, POND.x, POND.z, POND.r, 3);
disc(P.stoneDark, POND.x, POND.z, POND.r+1, 3);
// flatten a clearing around the pagoda
for(let x=-6;x<=6;x++) for(let z=-6;z<=6;z++){
  if(Math.abs(x)>5||Math.abs(z)>5) continue;
  const t=(x*x)/(RX*RX)+(z*z)/(RZ*RZ);
  const s=Math.round(DOME*(1-t));
  for(let y=s+1;y<=s+3;y++) push(P.stoneDark, x, y, z);
}
// zig-zag stone path from pond to pagoda
const pathPts = [[15,12],[12,9],[9,9],[7,6],[5,6],[4,4],[3,2],[2,0]];
pathPts.forEach(([px,pz])=>{
  const t=(px*px)/(RX*RX)+(pz*pz)/(RZ*RZ);
  const s=Math.round(DOME*(1-t));
  for(let x=px-1;x<=px+1;x++) for(let z=pz-1;z<=pz+1;z++){
    if(Math.abs(x-px)+Math.abs(z-pz)<=1) push(P.stone, x, s+1, z);
  }
});
// stepping stones to the waterfall
[[-16,2],[-18,1],[-20,0],[-22,-1]].forEach(([px,pz])=>{
  const t=(px*px)/(RX*RX)+(pz*pz)/(RZ*RZ);
  const s=Math.round(DOME*(1-t));
  for(let x=px-1;x<=px+1;x++) for(let z=pz-1;z<=pz+1;z++) if(Math.abs(x-px)+Math.abs(z-pz)<=1) push(P.stone, x, s+1, z);
});
// flowers
const FLOWER_COLS=[P.sakura, P.sakuraDeep, P.gold, P.cream, P.maple];
let placedFlowers=0, guard=0;
while(placedFlowers<40 && guard++<4000){
  const a=Math.random()*Math.PI*2, rr=Math.sqrt(Math.random())*0.92;
  const x=Math.round(Math.cos(a)*rr*RX), z=Math.round(Math.sin(a)*rr*RZ);
  const t=(x*x)/(RX*RX)+(z*z)/(RZ*RZ); if(t>1) continue;
  if(Math.abs(x)<=7&&Math.abs(z)<=7) continue;
  if((x-POND.x)**2+(z-POND.z)**2 < 80) continue;
  if(pathPts.some(([px,pz])=>Math.abs(px-x)<=2&&Math.abs(pz-z)<=2)) continue;
  const s=Math.round(DOME*(1-t));
  push(P.mossDark, x, s+1, z);
  push(FLOWER_COLS[placedFlowers%FLOWER_COLS.length], x, s+2, z);
  placedFlowers++;
}

/* ============================== PAGODA ============================== */
const floors = [];
const doorGroups = [];
const PX=0, PZ=0, BASE=5;
const FW=[11,9,7,5,4];
const RH=[4,4,4,4,4];
const roofYs=[0];

function buildFloor(i){
  const w = FW[i], hw = Math.floor(w/2);
  const y0 = BASE + roofYs[i];
  const top = y0 + RH[i] - 1;
  // plinth
  pushBox(P.stoneDark, PX-hw-1, y0-1, PZ-hw-1, PX+hw+1, y0-1, PZ+hw+1);
  pushBox(P.stone, PX-hw-1, y0, PZ-hw-1, PX+hw+1, y0, PZ+hw+1);
  // vermillion pillars (corners + mids)
  const pillarPos = [];
  for(let sx=-1;sx<=1;sx+=2) for(let sz=-1;sz<=1;sz+=2) pillarPos.push([sx*hw, sz*hw]);
  if(w>=7){ pillarPos.push([0,-hw],[0,hw],[-hw,0],[hw,0]); }
  pillarPos.forEach(([px,pz])=> fillColumn(P.vermillion, PX+px, PZ+pz, y0+1, top));
  // walls (cream) with door + windows
  const wallTop = top;
  for(let x=-hw;x<=hw;x++) for(let z=-hz_;z<=hz_;z++){} // noop guard
  const hz_ = hw;
  for(let x=-hw;x<=hw;x++){
    for(const z of [-hw, hw]){
      if(i>0 && Math.abs(x)<=1) { /* door gap on front of upper floors */ if(z===hw) continue; }
      if(i===0 && Math.abs(x)<=1 && z===hw) continue;
      push(P.cream, PX+x, y0+1, PZ+z); push(P.cream, PX+x, y0+2, PZ+z);
      if(wallTop>y0+2) push(P.cream, PX+x, wallTop, PZ+z);
      if(wallTop>y0+3) push(P.cream, PX+x, wallTop-1, PZ+z);
    }
  }
  for(let z=-hw;z<=hw;z++){
    for(const x of [-hw, hw]){
      push(P.cream, PX+x, y0+1, PZ+z); push(P.cream, PX+x, y0+2, PZ+z);
      if(wallTop>y0+2) push(P.cream, PX+x, wallTop, PZ+z);
      if(wallTop>y0+3) push(P.cream, PX+x, wallTop-1, PZ+z);
    }
  }
  // glowing windows on side walls
  for(let k=-2;k<=2;k++){
    if(Math.abs(k)===0) continue;
    push(P.paper, PX-hw, y0+2, PZ+k); push(P.paper, PX+hw, y0+2, PZ+k);
    push(P.paper, PX+k, y0+2, PZ-hw); push(P.paper, PX+k, y0+2, PZ+hw);
  }
  // interior glow core
  push(P.goldBright, PX, y0+2, PZ);
  push(P.gold, PX-1, y0+2, PZ); push(P.gold, PX+1, y0+2, PZ);
  push(P.gold, PX, y0+2, PZ-1); push(P.gold, PX, y0+2, PZ+1);
  // door (animated) on +z face
  const doorGroup = new THREE.Group();
  doorGroup.position.set((PX+hw+1)*VS, (y0+1)*VS, (PZ+hw+1)*VS);
  doorGroup.userData = { open:false, angle:0, target:0, floor:i };
  const doorGeo = new THREE.BoxGeometry(1*VS, 2*VS, 0.35*VS);
  const doorMat = getMat(P.deepTeak);
  const dl = new THREE.Mesh(doorGeo, doorMat); dl.position.x = -0.5*VS;
  const dr = new THREE.Mesh(doorGeo, doorMat); dr.position.x =  0.5*VS;
  dl.castShadow = dr.castShadow = true;
  doorGroup.add(dl, dr);
  doorGroup.userData.left = dl; doorGroup.userData.right = dr;
  scene.add(doorGroup);
  doorGroups.push(doorGroup);
  floors.push({ y0, y1: top, w });
}
function buildRoof(i){
  const w = FW[i], hw = Math.floor(w/2);
  const y = BASE + roofYs[i] + RH[i];
  const R = hw + 3;
  const layers = 5;
  for(let l=0;l<layers;l++){
    const rad = Math.max(1, Math.round(R*(1 - l*0.16)));
    const yy = y + l;
    const upturn = l===0 ? 0 : Math.round(l*0.7);
    ring(P.jadeDark, rad, rad, yy, rad, P.jade);
    // upturned corners
    if(upturn>0){
      for(let k=0;k<=upturn;k++){
        push(P.jade,  rad, yy+k,  rad); push(P.jade, -rad, yy+k,  rad);
        push(P.jade,  rad, yy+k, -rad); push(P.jade, -rad, yy+k, -rad);
      }
    }
    // gold trim dots
    for(let x=-rad;x<=rad;x+=2){
      push(P.gold, x, yy, rad); push(P.gold, x, yy, -rad);
      push(P.gold, rad, yy, x); push(P.gold, -rad, yy, x);
    }
  }
  return y + layers - 1;
}
function buildPagoda(){
  for(let i=0;i<5;i++){
    buildFloor(i);
    const top = buildRoof(i);
    if(i<4){
      // gold railing
      const w = FW[i], hw=Math.floor(w/2);
      for(let x=-hw;x<=hw;x++){ push(P.gold, PX+x, top+1, PZ+hw); push(P.gold, PX+x, top+1, PZ-hw); }
      for(let z=-hw;z<=hw;z++){ push(P.gold, PX+hw, top+1, PZ+z); push(P.gold, PX-hw, top+1, PZ+z); }
      roofYs.push(top + 1 - BASE + 2);
    }
  }
  // finial
  let fy = BASE + roofYs[4] + RH[4] + 5;
  const fw = FW[4], fhw=Math.floor(fw/2);
  pushBox(P.jadeDark, PX-fhw-1, fy, PZ-fhw-1, PX+fhw+1, fy, PZ+fhw+1);
  fy++;
  const finial = [[1,1,1,P.gold],[0,0,0,P.goldBright],[1,1,1,P.gold],[0,0,0,P.goldBright],[1,0,1,P.gold],[0,0,0,P.goldBright],[0,0,0,P.goldBright]];
  finial.forEach(([sx,sy,sz,c])=>{ if(sx===1) ring(c, 1, 1, fy, 1); else push(c, PX, fy, PZ); fy++; });
  push(P.goldBright, PX, fy, PZ);
}
buildPagoda();

/* ============================== TORII GATE ============================== */
function buildTorii(){
  const tx=-14, tz=-18;
  const t=(tx*tx)/(RX*RX)+(tz*tz)/(RZ*RZ);
  const gy=Math.round(DOME*(1-t));
  for(const dx of [-4,4]) fillColumn(P.vermillion, tx+dx, tz, gy+1, gy+8);
  push(P.gold, tx-4, gy+8, tz); push(P.gold, tx+4, gy+8, tz);
  for(let x=tx-6;x<=tx+6;x++){ push(P.vermillion, x, gy+9, tz); push(P.vermillion, x, gy+10, tz); }
  for(let x=tx-5;x<=tx+5;x++) push(P.vermillion, x, gy+7, tz);
  push(P.deepTeak, tx, gy+9, tz); push(P.deepTeak, tx, gy+10, tz);
  for(let x=-6;x<=6;x++) if(Math.abs(x)>1) push(P.vermillion, tx+x, gy+6, tz);
}
buildTorii();

/* ============================== TREES (exactly 8) ============================== */
const treeWind = [];
function treeBase(x,z){
  const t=(x*x)/(RX*RX)+(z*z)/(RZ*RZ);
  return Math.round(DOME*(1-t));
}
function sakura(x,z){
  const gy=treeBase(x,z);
  fillColumn(P.bark, x, z, gy+1, gy+4);
  fillColumn(P.bark, x, z, gy+1, gy+2);
  push(P.bark, x+1, gy+3, z); push(P.bark, x-1, gy+2, z);
  const g=new THREE.Group(); g.position.set(x*VS,(gy+4)*VS,z*VS);
  const blobs=[[0,2,0,3],[2,1,1,2],[-2,1,-1,2],[1,1,2,2],[-1,2,-2,2],[0,3,1,2],[2,3,-1,2],[-2,2,1,2],[0,0,0,1]];
  blobs.forEach(([bx,by,bz,r],bi)=>{
    for(let dx=-r;dx<=r;dx++)for(let dy=-r;dy<=r;dy++)for(let dz=-r;dz<=r;dz++){
      if(dx*dx+dy*dy+dz*dz<=r*r+0.5){
        const rnd=Math.random();
        push(rnd<0.55?P.sakura:(rnd<0.8?P.sakuraDeep:P.sakuraLight), bx+dx, by+dy, bz+dz);
      }
    }
  });
  treeWind.push(g); scene.add(g);
}
function pine(x,z){
  const gy=treeBase(x,z);
  fillColumn(P.bark, x, z, gy+1, gy+5);
  push(P.bark, x+1, gy+2, z); push(P.bark, x-1, gy+4, z);
  const g=new THREE.Group(); g.position.set(x*VS,(gy+3)*VS,z*VS);
  const tiers=[[0,1,0,4],[0,3,0,3],[0,5,0,2]];
  tiers.forEach(([bx,by,bz,r])=>{
    for(let dx=-r;dx<=r;dx++)for(let dz=-r;dz<=r;dz++){
      const rr=r-Math.max(Math.abs(dx),Math.abs(dz));
      const h=1+rr;
      for(let dy=0;dy<h;dy++){
        const c=Math.random()<0.5?P.pine:P.pineDark;
        push(c, bx+dx, by+dy, bz+dz);
      }
    }
  });
  push(P.pine, 0, 7, 0); push(P.pine, 1, 7, 0); push(P.pine, 0, 7, 1);
  treeWind.push(g); scene.add(g);
}
function maple(x,z){
  const gy=treeBase(x,z);
  fillColumn(P.bark, x, z, gy+1, gy+4);
  push(P.bark, x+1, gy+3, z); push(P.bark, x, gy+2, z+1);
  const g=new THREE.Group(); g.position.set(x*VS,(gy+4)*VS,z*VS);
  const blobs=[[0,1,0,3],[2,0,1,2],[-2,0,-1,2],[1,0,2,2],[-1,1,-2,2],[0,2,0,2]];
  blobs.forEach(([bx,by,bz,r])=>{
    for(let dx=-r;dx<=r;dx++)for(let dy=-r;dy<=r;dy++)for(let dz=-r;dz<=r;dz++){
      if(dx*dx+dy*dy+dz*dz<=r*r+0.5){
        const rnd=Math.random();
        push(rnd<0.5?P.maple:(rnd<0.8?P.mapleDeep:P.sakuraDeep), bx+dx, by+dy, bz+dz);
      }
    }
  });
  treeWind.push(g); scene.add(g);
}
function willow(x,z){
  const gy=treeBase(x,z);
  fillColumn(P.bark, x, z, gy+1, gy+6);
  push(P.bark, x+1, gy+4, z); push(P.bark, x-1, gy+3, z);
  const g=new THREE.Group(); g.position.set(x*VS,(gy+5)*VS,z*VS);
  for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++){
    if(dx*dx+dz*dz<=4){ push(P.willow, dx, 1, dz); push(P.willow, dx, 2, dz); }
  }
  for(let dx=-3;dx<=3;dx++)for(let dz=-3;dz<=3;dz++){
    const d=Math.max(Math.abs(dx),Math.abs(dz));
    if(d===3){ const len=2+((dx*7+dz*13)%2); for(let dy=0;dy<len;dy++) push(P.willowDeep, dx, -dy, dz); }
  }
  for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++){
    const d=Math.max(Math.abs(dx),Math.abs(dz));
    if(d===2){ for(let dy=0;dy<3;dy++) push(P.willow, dx, -dy, dz); }
  }
  treeWind.push(g); scene.add(g);
}
sakura(-18,-4); pine(19,-12); maple(-19,10); sakura(20,3);
pine(-9,17); willow(10,-16); maple(17,17); sakura(-12,14);

/* ============================== BAMBOO FENCE ============================== */
function bambooFence(){
  const segs=[[[-22,-14],[-22,14]],[[-22,14],[8,14]],[[-22,-14],[6,-14]]];
  segs.forEach(([[x0,z0],[x1,z1]])=>{
    const dx=Math.sign(x1-x0), dz=Math.sign(z1-z0);
    const len=Math.max(Math.abs(x1-x0),Math.abs(z1-z0));
    for(let i=0;i<=len;i++){
      const x=x0+dx*i, z=z0+dz*i;
      const gy=treeBase(x,z);
      if(i%2===0){ fillColumn(P.jadeDark, x, z, gy+1, gy+3); push(P.jade, x, gy+4, z); }
      else push(P.jade, x, gy+2, z);
    }
  });
}
bambooFence();

/* ============================== KOI POND + BRIDGE ============================== */
const koi = [];
function buildKoi(){
  for(let i=0;i<6;i++){
    const g=new THREE.Group();
    const bodyC = i%2 ? P.sakuraDeep : P.gold;
    for(let dx=-1;dx<=1;dx++){ push(bodC(dx), dx, 0, 0); }
    function bodC(dx){ return dx===0 ? bodyC : (i%2? P.sakura : P.cream); }
    push(P.dark, -2, 0, 0);
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(3*VS,VS,VS), getMat(bodyC));
    const tail = new THREE.Mesh(new THREE.BoxGeometry(VS,VS,VS), getMat(P.cream));
    tail.position.x = -2*VS;
    g.add(mesh, tail);
    scene.add(g);
    koi.push({ g, tail, cx:POND.x, cz:POND.z, r:2.5+i*0.5, speed:0.5+Math.random()*0.4, phase:Math.random()*Math.PI*2, y:3.6 });
  }
}
buildKoi();

const bridge = new THREE.Group();
{

/* ============================== JIZO STATUES ============================== */

/* ============================== LANTERNS ============================== */
const lanterns = [];
function lantern(x,z){
  const gy=treeBase(x,z);
  pushBox(P.stoneDark, x-1, gy+1, z-1, x+1, gy+1, z+1);
  push(P.stoneDark, x, gy+2, z);
  pushBox(P.gold, x-1, gy+3, z-1, x+1, gy+3, z+1);
  const glowMat = new THREE.MeshStandardMaterial({ color:0xFFE9B0, emissive:0xFFB84D, emissiveIntensity:1.6 });
  const m = new THREE.Mesh(new THREE.BoxGeometry(2*VS, 2*VS, 2*VS), glowMat);
  m.position.set(x*VS, (gy+4)*VS, z*VS);
  m.castShadow = false;
  const g=new THREE.Group(); g.add(m); scene.add(g);
  const light = new THREE.PointLight(0xffb056, 0, 16, 1.8);
  light.position.set(x*VS, (gy+4)*VS, z*VS);
  scene.add(light);
  pushBox(P.gold, x-1, gy+5, z-1, x+1, gy+5, z+1);
  push(P.gold, x, gy+6, z);
  lanterns.push({ g, light, glowMat, on:true, x:x*VS, y:(gy+4)*VS, z:z*VS, phase:Math.random()*10 });
}
lantern(-7,7); lantern(7,-7); lantern(-19,-12); lantern(12,18);

/* ============================== WATERFALL ============================== */
const waterfall = { parts:[], foam:[] };
function buildWaterfall(){
  const wx=-28;
  for(let z=-4;z<=4;z++){
    push(P.stoneDark, wx, 2, z); push(P.stoneDark, wx, 3, z);
  }
  push(P.pond, wx, 3, 0);
  for(let i=0;i<26;i++){
    const m=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.7,0.5), getMat(P.pond));
    m.position.set(wx*VS, (3-Math.random()*8)*VS, (Math.random()*8-4)*VS);
    scene.add(m);
    waterfall.parts.push({ m, speed:6+Math.random()*4, off:Math.random()*10 });
  }
  for(let i=0;i<10;i++){
    const m=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.3,0.6), getMat(0xeafcff));
    m.position.set((wx-0.5)*VS, (-6-Math.random()*2)*VS, (Math.random()*8-4)*VS);
    scene.add(m);
    waterfall.foam.push({ m, off:Math.random()*10 });

}
buildWaterfall();

/* ============================== SMALLER FLOATING ISLANDS ============================== */
const floatIslands = [];
function miniIsland(cx,cy,cz,r,withTree){
  const g=new THREE.Group();
  for(let x=-r;x<=r;x++)for(let z=-r;z<=r;z++){
    const t=(x*x+z*z)/(r*r);
    if(t>1) continue;
    const surf=Math.round(1.5*(1-t)), rock=Math.round(3*(1-t));
    for(let y=-rock;y<=surf;y++){
      const c = y===surf ? P.moss : (y>=surf-1?P.soil:(Math.random()<0.5?P.rock:P.rockDark));
      pushLocal(g,c,x,y,z);
    }
  }
  if(withTree){
    for(let y=1;y<=3;y++) pushLocal(g,P.bark,0,y,0);
    for(let dx=-2;dx<=2;dx++)for(let dy=0;dy<=2;dy++)for(let dz=-2;dz<=2;dz++){
      if(dx*dx+dy*dy+dz*dz<=5){ const rnd=Math.random(); pushLocal(g, rnd<0.6?P.sakura:(rnd<0.85?P.sakuraDeep:P.sakuraLight), dx,3+dy,dz); }
    }
  } else {
    for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++) if(dx*dx+dz*dz<=1) pushLocal(g,P.jade,dx,2,dz);
  }
  g.position.set(cx,cy,cz);
  scene.add(g);
  floatIslands.push({ g, baseY:cy, phase:Math.random()*Math.PI*2, speed:0.4+Math.random()*0.3 });
}
function pushLocal(g,c,x,y,z){
  const m=new THREE.Mesh(new THREE.BoxGeometry(VS,VS,VS), getMat(c));
  m.position.set(x*VS,y*VS,z*VS);
  g.add(m);
}
miniIsland(-48, 6, -22, 4, true);
miniIsland(46, 10, -28, 5, false);
miniIsland(40, -4, 30, 4, true);
miniIsland(-42, 2, 30, 3, false);

/* ============================== BIRDS ============================== */
const birds = [];
for(let i=0;i<5;i++){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.25,0.25), getMat(P.dark));
  const wl=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.08,0.3), getMat(P.dark));
  const wr=wl.clone();
  wl.position.set(0,0.1,-0.35); wr.position.set(0,0.1,0.35);
  g.add(body,wl,wr);
  scene.add(g);
  birds.push({ g, wl, wr, r:30+i*6, h:26+i*3, speed:0.15+i*0.04, phase:i*1.3 });

/* ============================== CLOUDS ============================== */
const clouds=[];
for(let i=0;i<6;i++){
  const g=new THREE.Group();
  for(let j=0;j<7;j++){

/* ============================== SAKURA PETALS ============================== */
const PETAL_N=260;
const petalPos=new Float32Array(PETAL_N*3);
const petalData=[];
for(let i=0;i<PETAL_N;i++){
  petalPos[i*3]= (Math.random()*70-35);
  petalPos[i*3+1]= 4+Math.random()*28;
  petalPos[i*3+2]= (Math.random()*70-35);
  petalData.push({ sp:0.6+Math.random()*0.9, ph:Math.random()*Math.PI*2, sw:0.5+Math.random() });
}
const petalGeo=new THREE.BufferGeometry();
petalGeo.setAttribute('position', new THREE.BufferAttribute(petalPos,3));
const petalMat=new THREE.PointsMaterial({ color:0xFFC9D6, size:0.28, transparent:true, opacity:0.9, sizeAttenuation:true });
const petals=new THREE.Points(petalGeo, petalMat);
scene.add(petals);

/* ============================== INSTANCED MESH BUILD ============================== */
const matCache = new Map();
function getMat(c){
  if(matCache.has(c)) return matCache.get(c);
  const m=new THREE.MeshStandardMaterial({ color:c, roughness:0.85, metalness:0.05, flatShading:true });
  matCache.set(c,m);
  return m;
}
const dummy=new THREE.Object3D();
buckets.forEach((arr,c)==>{
  const color=parseInt(c.slice(1));
  const n=arr.length/3;
  const geo=new THREE.BoxGeometry(VS,VS,VS);
  const mesh=new THREE.InstancedMesh(geo, getMat(color), n);
  mesh.castShadow=true; mesh.receiveShadow=true;
  for(let i=0;i<n;i++){
    dummy.position.set(arr[i*3]*VS, arr[i*3+1]*VS, arr[i*3+2]*VS);
    dummy.rotation.set(0,0,0);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  mesh.instanceMatrix.needsUpdate=true;
  scene.add(mesh);
});
const voxelCount=TOTAL;

/* ============================== SKY ============================== */
const skyMat=new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false,
  uniforms:{
    topColor:{value:new THREE.Color(0x6fa8dc)},
    bottomColor:{value:new THREE.Color(0xf6d9a8)},
    sunDir:{value:new THREE.Vector3(0,1,0)},
    sunColor:{value:new THREE.Color(0xfff0c8)},
    nightMix:{value:0.0}
  },
  vertexShader:`varying vec3 vDir; void main(){ vDir=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
    varying vec3 vDir;
    uniform vec3 topColor; uniform vec3 bottomColor; uniform vec3 sunDir; uniform vec3 sunColor; uniform float nightMix;
    void main(){
      float h=clamp(vDir.y*0.5+0.5,0.0,1.0);
      vec3 col=mix(bottomColor,topColor,pow(h,0.75));
      float s=max(dot(normalize(vDir),normalize(sunDir)),0.0);
      col+=sunColor*pow(s,180.0)*1.6;
      col+=sunColor*pow(s,6.0)*0.22;
      col=mix(col,col*0.18+vec3(0.02,0.03,0.08),nightMix);
      gl_FragColor=vec4(col,1.0);
    }`
});
const sky=new THREE.Mesh(new THREE.SphereGeometry(280,32,20), skyMat);
scene.add(sky);

/* ============================== DAY / NIGHT ============================== */
const SKY_KEYS=[
  {t:0.00, top:0x1b2440, bot:0x2a2f4a, sun:0x8fa0c8, hemi:0.16, sunI:0.10, night:1.0},
  {t:0.20, top:0x5a6fa8, bot:0xf0a868, sun:0xffb37a, hemi:0.42, sunI:0.90, night:0.15},
  {t:0.30, top:0x6fa8dc, bot:0xf6d9a8, sun:0xfff0c8, hemi:0.58, sunI:1.70, night:0.0},
  {t:0.50, top:0x5f9fdd, bot:0xcfe4f0, sun:0xfff4e0, hemi:0.62, sunI:1.85, night:0.0},
  {t:0.72, top:0x7a6a9a, bot:0xf0a06a, sun:0xff9a55, hemi:0.45, sunI:1.00, night:0.10},
  {t:0.85, top:0x2a2a55, bot:0x6a4a6a, sun:0xc88a9a, hemi:0.24, sunI:0.28, night:0.60},
  {t:1.00, top:0x1b2440, bot:0x2a2f4a, sun:0x8fa0c8, hemi:0.16, sunI:0.10, night:1.0}
];
function lerpC(a,b,t){ return a.clone().lerp(b,t); }
let timeOfDay=0.34, paused=false;
const _c1=new THREE.Color(), _c2=new THREE.Color();
function applyTimeOfDay(t){
  let i=0;
  while(i<SKY_KEYS.length-2 && t>SKY_KEYS[i+1].t) i++;
  const a=SKY_KEYS[i], b=SKY_KEYS[i+1];
  const f=THREE.MathUtils.clamp((t-a.t)/(b.t-a.t),0,1);
  skyMat.uniforms.topColor.value.copy(lerpC(_c1.setHex(a.top),_c2.setHex(b.top),f));
  skyMat.uniforms.bottomColor.value.copy(lerpC(_c1.setHex(a.bot),_c2.setHex(b.bot),f));
  skyMat.uniforms.sunColor.value.copy(lerpC(_c1.setHex(a.sun),_c2.setHex(b.sun),f));
  skyMat.uniforms.nightMix.value=THREE.MathUtils.lerp(a.night,b.night,f);
  const ang=t*Math.PI*2 - Math.PI/2;
  sun.position.set(Math.cos(ang)*140, Math.sin(ang)*140, 40);
  sun.target.position.set(0,8,0);
  sun.color.copy(skyMat.uniforms.sunColor.value);
  sun.intensity=THREE.MathUtils.lerp(a.sunI,b.sunI,f);
  hemi.intensity=THREE.MathUtils.lerp(a.hemi,b.hemi,f);
  hemi.color.copy(skyMat.uniforms.topColor.value).lerp(new THREE.Color(0xffffff),0.4);
  scene.fog.color.copy(skyMat.uniforms.bottomColor.value).lerp(skyMat.uniforms.topColor.value,0.35);
  const darkness=THREE.MathUtils.lerp(a.night,b.night,f);
  lanterns.forEach(L=>{
    const auto = darkness>0.45;
    const flick = 0.85 + 0.15*Math.sin(performance.now()*0.012 + L.phase*7) * Math.sin(performance.now()*0.031+L.phase*3);
    L.light.intensity = L.on ? (auto ? 2.6*flick : 1.4*flick) : 0;
    L.glowMat.emissiveIntensity = L.on ? (1.2 + darkness*1.4)*flick : 0.08;
  });
  petals.material.opacity = 0.55 + 0.4*(1-darkness);
}

/* ============================== INTERACTION ============================== */
const ray=new THREE.Raycaster();
const mouse=new THREE.Vector2();
let downAt=0, downX=0, downY=0;
renderer.domElement.addEventListener('pointerdown',e=>{ downAt=performance.now(); downX=e.clientX; downY=e.clientY; });
renderer.domElement.addEventListener('pointerup',e=>{
  if(performance.now()-downAt>280 || Math.hypot(e.clientX-downX,e.clientY-downY)>6) return;
  mouse.set((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(mouse,camera);
  // lanterns
  const lanternHits=ray.intersectObjects(lanterns.map(L=>L.g),true);
  if(lanternHits.length){
    const g=lanternHits[0].object.parent;
    const L=lanterns.find(l=>l.g===g);
    if(L){ L.on=!L.on; toast(L.on?'LANTERN LIT':'LANTERN DIMMED'); return; }
  }
  // pagoda doors
  const doorHits=ray.intersectObjects(doorGroups.map(d=>d.children),true);
  if(doorHits.length){
    const dg=doorGroups.find(d=>d.children.includes(doorHits[0].object));
    if(dg){ dg.userData.open=!dg.userData.open; dg.userData.target=dg.userData.open?1:0;
      toast(dg.userData.open?`FLOOR ${dg.userData.floor+1} — DOORS OPEN`:`FLOOR ${dg.userData.floor+1} — DOORS CLOSED`); return; }
  }
});
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.style.opacity=1;
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.style.opacity=0,1600);
}
document.getElementById('timeSlider').addEventListener('input',e=>{ timeOfDay=parseFloat(e.target.value); applyTimeOfDay(timeOfDay); });
document.getElementById('pauseBtn').addEventListener('click',e=>{ paused=!paused; e.target.textContent=paused?'PLAY':'PAUSE'; });

/* ============================== CAMERA INTRO ============================== */
const introT0=performance.now();
const introFrom=new THREE.Vector3(-34,7,-44);
const introTo=new THREE.Vector3(30,20,42);
let introDone=false;
controls.enabled=false;

/* ============================== HUD / STATE ============================== */
let fps=60, fpsAcc=0, fpsN=0, fpsTimer=0;
const statsEl=document.getElementById('stats');
window.__VOXEL__={
  voxelCount,
  get fps(){ return Math.round(fps); },
  pagodaFloors:5,
  get timeOfDay(){ return timeOfDay; }
};

/* ============================== ANIMATE ============================== */
const clock=new THREE.Clock();
let idleTimer=0;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const now=performance.now();
  const t=now*0.001;

  // intro
  if(!introDone){
    const p=Math.min(1,(now-introT0)/2500);
    const e=p*p*(3-2*p);
    camera.position.lerpVectors(introFrom,introTo,e);
    camera.lookAt(0,12,0);
    if(p>=1){ introDone=true; controls.enabled=true; controls.autoRotate=true; }
  } else {
    idleTimer+=dt;
    controls.autoRotate = idleTimer>4;
    controls.update();
  }

  // day cycle
  if(!paused){
    timeOfDay=(timeOfDay+dt/90)%1;
    document.getElementById('timeSlider').value=timeOfDay;
  }
  applyTimeOfDay(timeOfDay);

  // doors
  doorGroups.forEach(d=>{
    const u=d.userData;
    u.angle += (u.target-u.angle)*Math.min(1,dt*4);
    const a=u.angle*1.9;
    u.left.rotation.y = a;
    u.right.rotation.y = -a;
  });

  // tree wind
  treeWind.forEach((g,i)=>{
    g.rotation.z=Math.sin(t*0.9+i*1.7)*0.022;
    g.rotation.x=Math.cos(t*0.7+i*1.3)*0.018;
  });

  // koi
  koi.forEach(k=>{
    const a=t*k.speed+k.phase;
    const px=(k.cx+Math.cos(a)*k.r)*VS;
    const pz=(k.cz+Math.sin(a)*k.r)*VS;
    const nx=(k.cx+Math.cos(a+0.1)*k.r)*VS;
    const nz=(k.cz+Math.sin(a+0.1)*k.r)*VS;
    k.g.position.set(px, k.y*VS+Math.sin(t*3+k.phase)*0.06, pz);
    k.g.lookAt(nx, k.g.position.y, nz);
    k.tail.rotation.y=Math.sin(t*8+k.phase)*0.5;
  });

  // waterfall
  waterfall.parts.forEach(p=>{
    p.m.position.y -= p.speed*dt*0.5;
    p.m.position.x += Math.sin(t*3+p.off)*dt*0.15;
    if(p.m.position.y < -7*VS) p.m.position.y = 3*VS;
  });
  waterfall.foam.forEach(f=>{
    f.m.position.y += Math.sin(t*2+f.off)*dt*0.3;
    f.m.rotation.y += dt*2;
  });

  // petals
  const arr=petalGeo.attributes.position.array;
  for(let i=0;i<PETAL_N;i++){
    const d=petalData[i];
    arr[i*3+1]-=d.sp*dt;
    arr[i*3]+=Math.sin(t*d.sw+d.ph)*dt*0.6;
    arr[i*3+2]+=Math.cos(t*d.sw*0.8+d.ph)*dt*0.6;
    if(arr[i*3+1]<0.5){
      arr[i*3+1]=26+Math.random()*8;
      arr[i*3]=Math.random()*70-35;
      arr[i*3+2]=Math.random()*70-35;
    }
  }
  petalGeo.attributes.position.needsUpdate=true;

  // floating islands
  floatIslands.forEach(f=>{
    f.g.position.y=f.baseY+Math.sin(t*f.speed+f.phase)*0.8;
    f.g.rotation.y+=dt*0.05;
  });

  // birds
  birds.forEach(b=>{
    const a=t*b.speed+b.phase;
    b.g.position.set(Math.cos(a)*b.r*VS, b.h*VS+Math.sin(t*0.8+b.phase)*1.2, Math.sin(a)*b.r*VS);
    b.g.lookAt(Math.cos(a+0.1)*b.r*VS, b.g.position.y, Math.sin(a+0.1)*b.r*VS);
    const flap=Math.sin(t*9+b.phase)*0.6;
    b.wl.rotation.x=flap; b.wr.rotation.x=-flap;
  });

  // clouds
  clouds.forEach(c=>{
    c.g.position.x+=c.speed*dt;
    if(c.g.position.x>90) c.g.position.x=-90;
  });

  // fps
  fpsAcc+=dt; fpsN++; fpsTimer+=dt;
  if(fpsTimer>0.5){ fps=fpsN/fpsAcc; fpsAcc=0; fpsN=0; fpsTimer=0;
    statsEl.textContent=`${(voxelCount/1000).toFixed(1)}k voxels | ${Math.round(fps)} FPS`;
  }

  renderer.render(scene,camera);
}
applyTimeOfDay(timeOfDay);
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
