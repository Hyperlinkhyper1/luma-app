<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#d8d3c8">
  <title>ARC 75 Mechanical Keyboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root {
      --paper: #d8d3c8;
      --ink: #171916;
      --muted: #65675f;
      --accent: #d85f32;
      --case-top: #28362f;
      --case-side: #15211c;
      --rx: 57deg;
      --rz: -7deg;
      --fit: 0.9;
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; min-height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    button { font: inherit; }

    .page {
      position: relative;
      width: 100vw;
      height: 100svh;
      min-height: 580px;
      isolation: isolate;
      overflow: hidden;
      background:
        radial-gradient(circle at 74% 26%, rgba(255,255,255,.55), transparent 31%),
        linear-gradient(118deg, rgba(255,255,255,.18), transparent 45%),
        var(--paper);
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: .26;
      background-image:
        linear-gradient(rgba(23,25,22,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23,25,22,.08) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, black, transparent 78%);
    }

    .topbar {
      position: absolute;
      z-index: 50;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      padding: clamp(22px, 3vw, 44px) clamp(20px, 4vw, 64px);
      pointer-events: none;
    }

    .brand {
      pointer-events: auto;
      animation: brand-in 900ms cubic-bezier(.2,.8,.2,1) both;
    }

    .brand-mark {
      display: flex;
      align-items: baseline;
      gap: 13px;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(38px, 6vw, 82px);
      line-height: .83;
      letter-spacing: -.065em;
      font-weight: 780;
    }

    .edition {
      font-size: 11px;
      line-height: 1;
      letter-spacing: .2em;
      font-weight: 800;
      color: var(--accent);
    }

    .brand p {
      margin: 14px 0 0 3px;
      max-width: 360px;
      color: var(--muted);
      font-size: clamp(11px, 1vw, 13px);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .controls {
      display: flex;
      gap: 9px;
      pointer-events: auto;
      animation: controls-in 900ms 250ms cubic-bezier(.2,.8,.2,1) both;
    }

    .control {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 17px;
      border: 1px solid rgba(23,25,22,.22);
      border-radius: 0;
      background: rgba(216,211,200,.68);
      color: var(--ink);
      backdrop-filter: blur(12px);
      cursor: pointer;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
      transition: color 180ms ease, background 180ms ease, transform 180ms ease, border-color 180ms ease;
    }

    .control:hover { background: var(--ink); color: #f2eee5; border-color: var(--ink); }
    .control:active { transform: translateY(2px); }
    .control:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .control .signal {
      width: 6px;
      height: 6px;
      margin-right: 8px;
      border-radius: 50%;
      background: #447761;
      box-shadow: 0 0 0 3px rgba(68,119,97,.12);
    }

    .control[aria-pressed="true"] .signal {
      background: #87877f;
      box-shadow: none;
    }

    .scene {
      position: absolute;
      inset: 0;
      perspective: 1450px;
      perspective-origin: 50% 41%;
      touch-action: none;
      cursor: grab;
    }

    .scene.dragging { cursor: grabbing; }
    .scene.assembling { cursor: wait; }

    .ambient-shadow {
      position: absolute;
      left: 50%;
      top: 68%;
      width: min(82vw, 910px);
      height: 24%;
      transform: translate(-50%, -50%) rotate(-5deg);
      border-radius: 50%;
      background: rgba(25,28,24,.28);
      filter: blur(38px);
      opacity: .58;
      transition: opacity 900ms ease, transform 1.2s cubic-bezier(.2,.8,.2,1);
    }

    .scene.assembling .ambient-shadow {
      opacity: .25;
      transform: translate(-50%, -34%) rotate(-5deg) scale(.82);
    }

    .ghost-type {
      position: absolute;
      z-index: -1;
      right: -1.5vw;
      bottom: -4.5vh;
      margin: 0;
      color: rgba(23,25,22,.035);
      font-size: clamp(150px, 29vw, 460px);
      line-height: .78;
      font-weight: 850;
      letter-spacing: -.09em;
      white-space: nowrap;
      pointer-events: none;
    }

    .assembly {
      position: absolute;
      left: 50%;
      top: 55%;
      width: 930px;
      height: 384px;
      transform-style: preserve-3d;
      transform: translate3d(-50%, -50%, 0) rotateX(var(--rx)) rotateZ(var(--rz)) scale(var(--fit));
      transform-origin: 50% 50%;
      transition: transform 250ms cubic-bezier(.2,.8,.2,1);
      will-change: transform;
    }

    .scene.dragging .assembly { transition: none; }

    .box3d,
    .box3d .face,
    .switch,
    .keycap {
      position: absolute;
      transform-style: preserve-3d;
    }

    .box3d { width: var(--w); height: var(--h); }

    .face {
      left: 50%;
      top: 50%;
      backface-visibility: hidden;
      overflow: hidden;
    }

    .face.top,
    .face.bottom {
      width: var(--w);
      height: var(--h);
    }

    .face.top { transform: translate(-50%, -50%) translateZ(calc(var(--d) / 2)); }
    .face.bottom { transform: translate(-50%, -50%) rotateX(180deg) translateZ(calc(var(--d) / 2)); }

    .face.front,
    .face.back {
      width: var(--w);
      height: var(--d);
    }

    .face.front {
      transform: translate(-50%, -50%) translateY(calc(var(--h) / 2)) rotateX(90deg);
      transform-origin: center;
    }

    .face.back {
      transform: translate(-50%, -50%) translateY(calc(var(--h) / -2)) rotateX(90deg) rotateZ(180deg);
      transform-origin: center;
    }

    .face.left,
    .face.right {
      width: var(--d);
      height: var(--h);
    }

    .face.left {
      transform: translate(-50%, -50%) translateX(calc(var(--w) / -2)) rotateY(90deg);
    }

    .face.right {
      transform: translate(-50%, -50%) translateX(calc(var(--w) / 2)) rotateY(90deg);
    }

    .case {
      --w: 930px;
      --h: 384px;
      --d: 28px;
      left: 0;
      top: 0;
      transform: translateZ(0);
    }

    .case > .top {
      background:
        linear-gradient(145deg, rgba(255,255,255,.11), transparent 34%),
        var(--case-top);
      border: 1px solid rgba(255,255,255,.1);
    }

    .case > .front,
    .case > .back,
    .case > .left,
    .case > .right { background: linear-gradient(#223029, var(--case-side)); }
    .case > .bottom { background: #0d1511; }

    .case > .front::after {
      content: "ARC // 75";
      position: absolute;
      right: 30px;
      top: 7px;
      color: rgba(255,255,255,.46);
      font-size: 7px;
      font-weight: 800;
      letter-spacing: .28em;
    }

    .case-screw {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #c9bca0 0 14%, #736d60 19% 45%, #1c2721 49% 100%);
      transform: translateZ(14.7px);
      box-shadow: 0 1px 2px rgba(0,0,0,.6);
    }

    .layer {
      opacity: 0;
      will-change: transform, opacity;
    }

    .pcb {
      --w: 902px;
      --h: 356px;
      --d: 8px;
      left: 14px;
      top: 14px;
      transform: translateZ(19px);
    }

    .pcb > .top {
      background-color: #174b43;
      background-image:
        radial-gradient(circle, #d7b662 0 1.5px, transparent 1.8px),
        linear-gradient(28deg, transparent 47%, rgba(201,181,92,.22) 48% 49%, transparent 50%),
        linear-gradient(152deg, transparent 48%, rgba(201,181,92,.18) 49% 50%, transparent 51%);
      background-size: 27px 27px, 74px 38px, 91px 51px;
      border: 1px solid rgba(216,193,100,.36);
    }

    .pcb > .front,
    .pcb > .back,
    .pcb > .left,
    .pcb > .right { background: #0d302a; }
    .pcb > .bottom { background: #09241f; }

    .pcb-chip {
      --w: 46px;
      --h: 28px;
      --d: 5px;
      transform: translateZ(6.5px);
    }

    .pcb-chip > .top { background: #171b19; border: 1px solid #303631; }
    .pcb-chip > .front,
    .pcb-chip > .back,
    .pcb-chip > .left,
    .pcb-chip > .right { background: #090b0a; }
    .pcb-chip > .bottom { background: #090b0a; }

    .pcb-chip > .top::after {
      content: "ARC";
      position: absolute;
      left: 7px;
      top: 6px;
      color: #777d74;
      font-size: 6px;
      font-weight: 800;
      letter-spacing: .18em;
    }

    .pcb-contact {
      position: absolute;
      width: 5px;
      height: 26px;
      transform: translateZ(4.4px);
      background: repeating-linear-gradient(to bottom, #d4b458 0 3px, #7a652d 3px 4px);
      box-shadow: 0 0 4px rgba(238,201,98,.28);
    }

    .foam {
      --w: 892px;
      --h: 346px;
      --d: 6px;
      left: 19px;
      top: 19px;
      transform: translateZ(27px);
    }

    .foam > .top {
      background:
        radial-gradient(circle, rgba(4,6,5,.85) 0 7px, transparent 8px),
        linear-gradient(135deg, rgba(255,255,255,.03), transparent 45%),
        #252a27;
      background-size: 54px 54px, auto, auto;
      background-position: 12px 12px, 0 0, 0 0;
      border: 1px solid #343b36;
    }

    .foam > .front,
    .foam > .back,
    .foam > .left,
    .foam > .right { background: #121613; }
    .foam > .bottom { background: #0c0f0d; }

    .plate {
      --w: 902px;
      --h: 356px;
      --d: 6px;
      left: 14px;
      top: 14px;
      transform: translateZ(34px);
    }

    .plate > .top {
      background:
        radial-gradient(circle, rgba(33,36,31,.9) 0 8px, transparent 9px),
        linear-gradient(105deg, rgba(255,255,255,.38), transparent 24% 72%, rgba(255,255,255,.16)),
        #aa9e83;
      background-size: 54px 54px, auto, auto;
      background-position: 13px 13px, 0 0, 0 0;
      border: 1px solid #d1c4a5;
    }

    .plate > .front,
    .plate > .back,
    .plate > .left,
    .plate > .right { background: linear-gradient(#8d826d, #625a4b); }
    .plate > .bottom { background: #605847; }

    .switch {
      --w: 21px;
      --h: 21px;
      --d: 17px;
      z-index: 4;
      transform: translateZ(45.5px);
      opacity: 0;
      will-change: transform, opacity;
    }

    .switch > .top {
      background: rgba(212,225,214,.92);
      border: 2px solid rgba(53,81,68,.45);
      border-radius: 2px;
    }

    .switch > .front,
    .switch > .back,
    .switch > .left,
    .switch > .right { background: rgba(94,128,109,.82); border: 1px solid rgba(38,61,49,.36); }
    .switch > .bottom { background: #30483c; }

    .stem {
      --w: 8px;
      --h: 8px;
      --d: 7px;
      left: 6.5px;
      top: 6.5px;
      transform: translateZ(12px);
    }

    .stem > .top { background: #dc6538; }
    .stem > .front,
    .stem > .back,
    .stem > .left,
    .stem > .right { background: #a33d1f; }
    .stem > .bottom { background: #7c2b16; }

    .keycap {
      --d: 16px;
      z-index: 8;
      transform: translateZ(62px);
      opacity: 0;
      cursor: pointer;
      will-change: transform, opacity;
      transition: transform 65ms cubic-bezier(.2,.7,.2,1);
      -webkit-tap-highlight-color: transparent;
    }

    .keycap:hover > .top { filter: brightness(1.045); }
    .keycap.pressed { transform: translateZ(57px); }
    .keycap.pressed > .top { filter: brightness(.9); }
    .keycap:focus-visible { outline: none; }
    .keycap:focus-visible > .top { box-shadow: inset 0 0 0 3px var(--accent); }

    .keycap > .top {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
      border: 1px solid rgba(255,255,255,.58);
      border-radius: 6px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.32), transparent 44%),
        var(--key-top, #e5dfd1);
      color: var(--key-legend, #1c211e);
      box-shadow: inset 0 -2px 5px rgba(39,37,31,.1);
      font-size: 10px;
      font-weight: 720;
      letter-spacing: .035em;
      text-transform: uppercase;
    }

    .keycap > .bottom { background: var(--key-bottom, #918b7e); }
    .keycap > .front,
    .keycap > .back,
    .keycap > .left,
    .keycap > .right {
      background: linear-gradient(var(--key-side-light, #c7c0b2), var(--key-side, #9d9689));
    }

    .keycap.mod {
      --key-top: #9caf9e;
      --key-side-light: #829986;
      --key-side: #647869;
      --key-bottom: #506157;
      --key-legend: #142018;
    }

    .keycap.dark {
      --key-top: #314139;
      --key-side-light: #28372f;
      --key-side: #18251f;
      --key-bottom: #111b17;
      --key-legend: #eeeadd;
    }

    .keycap.accent {
      --key-top: #dc683d;
      --key-side-light: #c4512c;
      --key-side: #92371f;
      --key-bottom: #6e2817;
      --key-legend: #21150f;
    }

    .keycap.function > .top { font-size: 8px; color: #41453f; }
    .keycap.accent > .top,
    .keycap.dark > .top { color: var(--key-legend); }

    .space-mark {
      width: 25px;
      height: 2px;
      margin-top: 8px;
      background: currentColor;
      opacity: .45;
    }

    .statusbar {
      position: absolute;
      z-index: 40;
      left: clamp(20px, 4vw, 64px);
      bottom: clamp(22px, 4vw, 48px);
      width: min(310px, calc(100vw - 40px));
      pointer-events: none;
      animation: controls-in 900ms 400ms cubic-bezier(.2,.8,.2,1) both;
    }

    .status-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 9px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .status-detail { color: var(--muted); text-align: right; }

    .progress-track {
      position: relative;
      width: 100%;
      height: 1px;
      overflow: hidden;
      background: rgba(23,25,22,.2);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--ink);
      transition: width 500ms cubic-bezier(.2,.8,.2,1);
    }

    .sound-hint {
      position: absolute;
      z-index: 45;
      left: 50%;
      bottom: clamp(22px, 4vw, 48px);
      transform: translateX(-50%);
      padding: 8px 11px;
      background: rgba(23,25,22,.9);
      color: #ede8dc;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      pointer-events: none;
      opacity: 1;
      transition: opacity 350ms ease, transform 350ms ease;
    }

    .sound-hint.hidden { opacity: 0; transform: translate(-50%, 8px); }

    .drag-hint {
      position: absolute;
      z-index: 30;
      right: clamp(20px, 4vw, 64px);
      bottom: clamp(22px, 4vw, 48px);
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 500ms ease, transform 500ms ease;
      pointer-events: none;
    }

    .scene.ready ~ .drag-hint { opacity: .8; transform: translateY(0); }

    @keyframes brand-in {
      from { opacity: 0; transform: translateY(-16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes controls-in {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 760px) {
      .page { min-height: 520px; }
      .topbar { align-items: flex-start; gap: 10px; }
      .brand p { display: none; }
      .controls { flex-direction: column; align-items: stretch; }
      .control { min-height: 38px; padding: 0 12px; font-size: 9px; }
      .scene { perspective-origin: 50% 47%; }
      .assembly { top: 55%; }
      .drag-hint { display: none; }
      .sound-hint { left: auto; right: 20px; bottom: 64px; transform: none; }
      .sound-hint.hidden { transform: translateY(8px); }
      .statusbar { width: 190px; }
      .status-detail { display: none; }
    }

    @media (max-width: 500px) {
      .brand h1 { font-size: 34px; }
      .edition { display: none; }
      .control { min-height: 36px; padding-inline: 10px; }
    }

    @media (max-height: 650px) and (orientation: landscape) {
      .page { min-height: 100svh; }
      .topbar { padding-top: 18px; padding-bottom: 18px; }
      .brand h1 { font-size: 44px; }
      .brand p { display: none; }
      .assembly { top: 55%; }
      .statusbar, .sound-hint, .drag-hint { bottom: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
      .assembly, .ambient-shadow, .progress-bar { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page" aria-label="ARC 75 mechanical keyboard interactive showcase">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">
          <h1>ARC 75</h1>
          <span class="edition">REV. 02</span>
        </div>
        <p>Gasket-mounted custom mechanical keyboard</p>
      </div>
      <div class="controls" aria-label="Showcase controls">
        <button class="control" id="replayButton" type="button">Replay assembly</button>
        <button class="control" id="muteButton" type="button" aria-pressed="false">
          <span class="signal" aria-hidden="true"></span><span id="muteLabel">Sound on</span>
        </button>
      </div>
    </header>

    <section class="scene assembling" id="scene" aria-label="Interactive three dimensional keyboard. Drag to rotate after assembly.">
      <div class="ambient-shadow" aria-hidden="true"></div>
      <p class="ghost-type" aria-hidden="true">75</p>
      <div class="assembly" id="assembly" aria-live="off"></div>
    </section>

    <div class="statusbar" aria-live="polite">
      <div class="status-line">
        <span id="stageLabel">Assembly 01 / 05</span>
        <span class="status-detail" id="stageDetail">PCB alignment</span>
      </div>
      <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
    </div>

    <div class="sound-hint" id="soundHint">Press a key to enable sound</div>
    <div class="drag-hint">Drag to inspect / Press any key</div>
  </main>

  <script>
    (() => {
      const BOARD_W = 930;
      const BOARD_H = 384;
      const UNIT = 48;
      const GAP = 6;
      const PITCH = UNIT + GAP;
      const ROW_H = 48;
      const ROW_Y = [24, 76, 132, 188, 244, 300];
      const ROW_X = 25;

      const assembly = document.getElementById('assembly');
      const scene = document.getElementById('scene');
      const replayButton = document.getElementById('replayButton');
      const muteButton = document.getElementById('muteButton');
      const muteLabel = document.getElementById('muteLabel');
      const soundHint = document.getElementById('soundHint');
      const stageLabel = document.getElementById('stageLabel');
      const stageDetail = document.getElementById('stageDetail');
      const progressBar = document.getElementById('progressBar');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

      const keyMap = new Map();
      const switches = [];
      const keycaps = [];
      let activeAnimations = [];
      let assemblyToken = 0;
      let isAssembling = true;
      let audioContext = null;
      let masterGain = null;
      let muted = false;
      let rotationX = 57;
      let rotationZ = -7;

      const rows = [
        [
          { label: 'Esc', code: 'Escape', cls: 'accent' },
          { gap: .35 },
          { label: 'F1', code: 'F1', cls: 'function' }, { label: 'F2', code: 'F2', cls: 'function' },
          { label: 'F3', code: 'F3', cls: 'function' }, { label: 'F4', code: 'F4', cls: 'function' },
          { gap: .25 },
          { label: 'F5', code: 'F5', cls: 'function' }, { label: 'F6', code: 'F6', cls: 'function' },
          { label: 'F7', code: 'F7', cls: 'function' }, { label: 'F8', code: 'F8', cls: 'function' },
          { gap: .25 },
          { label: 'F9', code: 'F9', cls: 'function' }, { label: 'F10', code: 'F10', cls: 'function' },
          { label: 'F11', code: 'F11', cls: 'function' }, { label: 'F12', code: 'F12', cls: 'function' },
          { gap: .35 }, { label: 'Del', code: 'Delete', cls: 'dark' }
        ],
        [
          { label: '`', code: 'Backquote' }, { label: '1', code: 'Digit1' }, { label: '2', code: 'Digit2' },
          { label: '3', code: 'Digit3' }, { label: '4', code: 'Digit4' }, { label: '5', code: 'Digit5' },
          { label: '6', code: 'Digit6' }, { label: '7', code: 'Digit7' }, { label: '8', code: 'Digit8' },
          { label: '9', code: 'Digit9' }, { label: '0', code: 'Digit0' }, { label: '-', code: 'Minus' },
          { label: '=', code: 'Equal' }, { label: 'Backspace', code: 'Backspace', u: 2, cls: 'mod', sound: 'backspace' },
          { gap: .25 }, { label: 'Home', code: 'Home', cls: 'dark' }
        ],
        [
          { label: 'Tab', code: 'Tab', u: 1.5, cls: 'mod', sound: 'modifier' },
          { label: 'Q', code: 'KeyQ' }, { label: 'W', code: 'KeyW' }, { label: 'E', code: 'KeyE' },
          { label: 'R', code: 'KeyR' }, { label: 'T', code: 'KeyT' }, { label: 'Y', code: 'KeyY' },
          { label: 'U', code: 'KeyU' }, { label: 'I', code: 'KeyI' }, { label: 'O', code: 'KeyO' },
          { label: 'P', code: 'KeyP' }, { label: '[', code: 'BracketLeft' }, { label: ']', code: 'BracketRight' },
          { label: '\\', code: 'Backslash', u: 1.5, cls: 'mod', sound: 'modifier' },
          { gap: .25 }, { label: 'PgUp', code: 'PageUp', cls: 'dark' }
        ],
        [
          { label: 'Caps', code: 'CapsLock', u: 1.75, cls: 'mod', sound: 'modifier' },
          { label: 'A', code: 'KeyA' }, { label: 'S', code: 'KeyS' }, { label: 'D', code: 'KeyD' },
          { label: 'F', code: 'KeyF' }, { label: 'G', code: 'KeyG' }, { label: 'H', code: 'KeyH' },
          { label: 'J', code: 'KeyJ' }, { label: 'K', code: 'KeyK' }, { label: 'L', code: 'KeyL' },
          { label: ';', code: 'Semicolon' }, { label: "'", code: 'Quote' },
          { label: 'Enter', code: 'Enter', u: 2.25, cls: 'accent', sound: 'enter' },
          { gap: .25 }, { label: 'PgDn', code: 'PageDown', cls: 'dark' }
        ],
        [
          { label: 'Shift', code: 'ShiftLeft', u: 2.25, cls: 'mod', sound: 'modifier' },
          { label: 'Z', code: 'KeyZ' }, { label: 'X', code: 'KeyX' }, { label: 'C', code: 'KeyC' },
          { label: 'V', code: 'KeyV' }, { label: 'B', code: 'KeyB' }, { label: 'N', code: 'KeyN' },
          { label: 'M', code: 'KeyM' }, { label: ',', code: 'Comma' }, { label: '.', code: 'Period' },
          { label: '/', code: 'Slash' },
          { label: 'Shift', code: 'ShiftRight', u: 2.75, cls: 'mod', sound: 'modifier' },
          { gap: .25 }, { label: 'Up', code: 'ArrowUp', cls: 'dark' }
        ],
        [
          { label: 'Ctrl', code: 'ControlLeft', u: 1.25, cls: 'mod', sound: 'modifier' },
          { label: 'Cmd', code: 'MetaLeft', u: 1.25, cls: 'mod', sound: 'modifier' },
          { label: 'Alt', code: 'AltLeft', u: 1.25, cls: 'mod', sound: 'modifier' },
          { label: '', code: 'Space', u: 5.75, cls: 'mod', sound: 'space', space: true },
          { label: 'Alt', code: 'AltRight', u: 1.25, cls: 'mod', sound: 'modifier' },
          { label: 'Fn', code: 'Fn', u: 1, cls: 'mod', sound: 'modifier' },
          { label: 'Ctrl', code: 'ControlRight', u: 1, cls: 'mod', sound: 'modifier' },
          { gap: .5 },
          { label: 'Left', code: 'ArrowLeft', cls: 'dark' },
          { label: 'Down', code: 'ArrowDown', cls: 'dark' },
          { label: 'Right', code: 'ArrowRight', cls: 'dark' }
        ]
      ];

      function addFaces(element, label = '', isSpace = false) {
        ['top', 'bottom', 'front', 'back', 'left', 'right'].forEach((side) => {
          const face = document.createElement('div');
          face.className = `face ${side}`;
          if (side === 'top') {
            if (isSpace) {
              const mark = document.createElement('span');
              mark.className = 'space-mark';
              face.appendChild(mark);
            } else {
              face.textContent = label;
            }
          }
          element.appendChild(face);
        });
        return element;
      }

      function makeBox(className, width, height, depth, label = '', isSpace = false) {
        const box = document.createElement('div');
        box.className = `box3d ${className}`;
        box.style.setProperty('--w', `${width}px`);
        box.style.setProperty('--h', `${height}px`);
        box.style.setProperty('--d', `${depth}px`);
        return addFaces(box, label, isSpace);
      }

      function buildBoard() {
        const keyboardCase = makeBox('case', BOARD_W, BOARD_H, 28);
        assembly.appendChild(keyboardCase);

        [[13,13], [BOARD_W - 21,13], [13,BOARD_H - 21], [BOARD_W - 21,BOARD_H - 21],
          [BOARD_W / 2 - 4,13], [BOARD_W / 2 - 4,BOARD_H - 21]].forEach(([x,y]) => {
          const screw = document.createElement('span');
          screw.className = 'case-screw';
          screw.style.left = `${x}px`;
          screw.style.top = `${y}px`;
          keyboardCase.appendChild(screw);
        });

        const pcb = makeBox('layer pcb', 902, 356, 8);
        pcb.id = 'pcb';
        assembly.appendChild(pcb);

        [[78,42,46,28], [742,51,58,32], [422,284,52,29], [146,275,40,24], [640,274,44,26]].forEach(([x,y,w,h]) => {
          const chip = makeBox('pcb-chip', w, h, 5);
          chip.style.left = `${x}px`;
          chip.style.top = `${y}px`;
          pcb.appendChild(chip);
        });

        for (let i = 0; i < 12; i += 1) {
          const contact = document.createElement('span');
          contact.className = 'pcb-contact';
          contact.style.left = `${835 + (i % 6) * 8}px`;
          contact.style.top = `${245 + Math.floor(i / 6) * 36}px`;
          pcb.appendChild(contact);
        }

        const foam = makeBox('layer foam', 892, 346, 6);
        foam.id = 'foam';
        assembly.appendChild(foam);

        const plate = makeBox('layer plate', 902, 356, 6);
        plate.id = 'plate';
        assembly.appendChild(plate);

        buildKeys();
      }

      function buildKeys() {
        rows.forEach((row, rowIndex) => {
          let cursor = ROW_X;
          row.forEach((key) => {
            if (key.gap) {
              cursor += key.gap * PITCH;
              return;
            }

            const units = key.u || 1;
            const width = units * PITCH - GAP;
            const capWidth = width - 5;
            const capHeight = rowIndex === 0 ? 39 : ROW_H;
            const y = ROW_Y[rowIndex] + (rowIndex === 0 ? 4 : 0);

            const switchNode = makeBox('switch', 21, 21, 17);
            switchNode.style.left = `${cursor + (width - 21) / 2}px`;
            switchNode.style.top = `${y + (capHeight - 21) / 2}px`;
            switchNode.dataset.orderX = cursor;
            switchNode.dataset.orderY = y;

            const stem = makeBox('stem', 8, 8, 7);
            switchNode.appendChild(stem);
            assembly.appendChild(switchNode);
            switches.push(switchNode);

            const cap = makeBox(`keycap ${key.cls || ''}`.trim(), capWidth, capHeight - 5, 16, key.label, key.space);
            cap.style.left = `${cursor + 2.5}px`;
            cap.style.top = `${y + 2.5}px`;
            cap.dataset.code = key.code;
            cap.dataset.sound = key.sound || (key.cls === 'dark' || key.cls === 'function' ? 'function' : 'letter');
            cap.dataset.orderX = cursor;
            cap.dataset.orderY = y;
            cap.setAttribute('role', 'button');
            cap.setAttribute('tabindex', '0');
            cap.setAttribute('aria-label', key.label ? `${key.label} key` : 'Spacebar');
            assembly.appendChild(cap);
            keycaps.push(cap);
            if (!keyMap.has(key.code)) keyMap.set(key.code, cap);

            bindKeyPointer(cap);
            cursor += units * PITCH;
          });
        });
      }

      function bindKeyPointer(cap) {
        cap.addEventListener('pointerdown', (event) => {
          if (isAssembling) return;
          event.preventDefault();
          event.stopPropagation();
          cap.setPointerCapture?.(event.pointerId);
          ensureAudio();
          pressKey(cap, true);
        });

        const release = (event) => {
          event.stopPropagation();
          releaseKey(cap);
        };
        cap.addEventListener('pointerup', release);
        cap.addEventListener('pointercancel', release);
        cap.addEventListener('lostpointercapture', () => releaseKey(cap));
        cap.addEventListener('keydown', (event) => {
          if ((event.key === 'Enter' || event.key === ' ') && !event.repeat) {
            event.preventDefault();
            ensureAudio();
            pressKey(cap, true);
          }
        });
        cap.addEventListener('keyup', (event) => {
          if (event.key === 'Enter' || event.key === ' ') releaseKey(cap);
        });
      }

      function sortedByRows(nodes) {
        return [...nodes].sort((a, b) => {
          const rowDelta = Number(a.dataset.orderY) - Number(b.dataset.orderY);
          return Math.abs(rowDelta) > 2 ? rowDelta : Number(a.dataset.orderX) - Number(b.dataset.orderX);
        });
      }

      function setStatus(index, detail, progress) {
        stageLabel.textContent = `Assembly ${String(index).padStart(2, '0')} / 05`;
        stageDetail.textContent = detail;
        progressBar.style.width = `${progress}%`;
      }

      function cancelAnimations() {
        activeAnimations.forEach((animation) => animation.cancel());
        activeAnimations = [];
      }

      function settleNode(node) {
        node.style.opacity = '1';
        node.style.transform = '';
      }

      function animateNode(node, keyframes, options, token) {
        const animation = node.animate(keyframes, { fill: 'both', ...options });
        activeAnimations.push(animation);
        return animation.finished.then(() => {
          if (token === assemblyToken) settleNode(node);
          animation.cancel();
        }).catch(() => {});
      }

      function wait(ms) {
        return new Promise((resolve) => window.setTimeout(resolve, ms));
      }

      async function playAssembly() {
        assemblyToken += 1;
        const token = assemblyToken;
        cancelAnimations();
        isAssembling = true;
        scene.classList.add('assembling');
        scene.classList.remove('ready');
        replayButton.disabled = true;
        replayButton.style.opacity = '.55';
        setStatus(1, 'PCB alignment', 0);
        keycaps.forEach(releaseKey);

        const pcb = document.getElementById('pcb');
        const foam = document.getElementById('foam');
        const plate = document.getElementById('plate');
        [pcb, foam, plate, ...switches, ...keycaps].forEach((node) => {
          node.style.opacity = '0';
          node.style.transform = '';
        });

        if (reducedMotion.matches) {
          [pcb, foam, plate, ...switches, ...keycaps].forEach(settleNode);
          setStatus(5, 'Assembly complete', 100);
          finishAssembly(token);
          return;
        }

        await wait(360);
        if (token !== assemblyToken) return;

        setStatus(1, 'PCB alignment', 8);
        await animateNode(pcb, [
          { opacity: 0, transform: 'translate3d(-270px, -145px, 190px) rotateZ(-12deg) rotateX(-13deg)' },
          { opacity: 1, offset: .76 },
          { opacity: 1, transform: 'translateZ(19px)' }
        ], { duration: 1150, easing: 'cubic-bezier(.16,.78,.18,1)' }, token);
        if (token !== assemblyToken) return;

        setStatus(2, 'Acoustic foam', 24);
        await animateNode(foam, [
          { opacity: 0, transform: 'translate3d(250px, -110px, 205px) rotateZ(10deg) rotateX(-18deg)' },
          { opacity: 1, offset: .72 },
          { opacity: 1, transform: 'translateZ(27px)' }
        ], { duration: 950, easing: 'cubic-bezier(.16,.78,.18,1)' }, token);
        if (token !== assemblyToken) return;

        setStatus(3, 'Brass plate', 40);
        await animateNode(plate, [
          { opacity: 0, transform: 'translate3d(-80px, -250px, 235px) rotateZ(-7deg) rotateX(-22deg)' },
          { opacity: 1, offset: .7 },
          { opacity: 1, transform: 'translateZ(34px)' }
        ], { duration: 1050, easing: 'cubic-bezier(.16,.78,.18,1)' }, token);
        if (token !== assemblyToken) return;

        setStatus(4, 'Installing switches', 53);
        const switchOrder = sortedByRows(switches);
        await Promise.all(switchOrder.map((node, index) => animateNode(node, [
          { opacity: 0, transform: 'translate3d(-55px, -105px, 210px) rotateX(-28deg) rotateZ(-18deg)' },
          { opacity: 1, offset: .62 },
          { opacity: 1, transform: 'translateZ(45.5px)' }
        ], {
          duration: 520,
          delay: index * 46,
          easing: 'cubic-bezier(.18,.78,.22,1)'
        }, token)));
        if (token !== assemblyToken) return;

        setStatus(5, 'Installing keycaps', 78);
        const capOrder = sortedByRows(keycaps);
        await Promise.all(capOrder.map((node, index) => animateNode(node, [
          { opacity: 0, transform: 'translate3d(65px, -150px, 250px) rotateX(-20deg) rotateZ(14deg)' },
          { opacity: 1, offset: .68 },
          { opacity: 1, transform: 'translateZ(62px)' }
        ], {
          duration: 600,
          delay: index * 50,
          easing: 'cubic-bezier(.16,.82,.22,1)'
        }, token)));
        if (token !== assemblyToken) return;

        setStatus(5, 'Assembly complete', 100);
        finishAssembly(token);
      }

      function finishAssembly(token) {
        if (token !== assemblyToken) return;
        isAssembling = false;
        scene.classList.remove('assembling');
        scene.classList.add('ready');
        replayButton.disabled = false;
        replayButton.style.opacity = '1';
      }

      function pressKey(cap, withSound) {
        if (!cap || isAssembling || cap.classList.contains('pressed')) return;
        cap.classList.add('pressed');
        if (withSound) playKeySound(cap.dataset.sound);
      }

      function releaseKey(cap) {
        cap?.classList.remove('pressed');
      }

      function ensureAudio() {
        if (!audioContext) {
          const AudioCtor = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtor) return;
          audioContext = new AudioCtor();
          masterGain = audioContext.createGain();
          masterGain.gain.value = muted ? 0 : .72;
          masterGain.connect(audioContext.destination);
        }
        if (audioContext.state === 'suspended') audioContext.resume();
        soundHint.classList.add('hidden');
      }

      function playKeySound(type = 'letter') {
        if (muted) return;
        ensureAudio();
        if (!audioContext || !masterGain) return;

        const profiles = {
          letter: { frequency: 205, decay: .07, tone: .08, noise: .045, filter: 2300 },
          function: { frequency: 250, decay: .055, tone: .06, noise: .036, filter: 2800 },
          modifier: { frequency: 122, decay: .095, tone: .085, noise: .052, filter: 1400 },
          enter: { frequency: 145, decay: .12, tone: .11, noise: .07, filter: 1850 },
          backspace: { frequency: 175, decay: .085, tone: .09, noise: .07, filter: 3200 },
          space: { frequency: 72, decay: .18, tone: .14, noise: .075, filter: 720 }
        };
        const profile = profiles[type] || profiles.letter;
        const now = audioContext.currentTime;

        const oscillator = audioContext.createOscillator();
        const toneGain = audioContext.createGain();
        oscillator.type = type === 'space' ? 'sine' : 'triangle';
        oscillator.frequency.setValueAtTime(profile.frequency, now);
        oscillator.frequency.exponentialRampToValueAtTime(Math.max(40, profile.frequency * .56), now + profile.decay);
        toneGain.gain.setValueAtTime(profile.tone, now);
        toneGain.gain.exponentialRampToValueAtTime(.0001, now + profile.decay);
        oscillator.connect(toneGain).connect(masterGain);
        oscillator.start(now);
        oscillator.stop(now + profile.decay + .01);

        const noiseLength = Math.floor(audioContext.sampleRate * Math.min(.07, profile.decay));
        const noiseBuffer = audioContext.createBuffer(1, noiseLength, audioContext.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < data.length; i += 1) {
          const envelope = 1 - i / data.length;
          data[i] = (Math.random() * 2 - 1) * envelope;
        }
        const noise = audioContext.createBufferSource();
        const filter = audioContext.createBiquadFilter();
        const noiseGain = audioContext.createGain();
        noise.buffer = noiseBuffer;
        filter.type = 'bandpass';
        filter.frequency.value = profile.filter;
        filter.Q.value = type === 'space' ? .7 : 1.15;
        noiseGain.gain.setValueAtTime(profile.noise, now);
        noiseGain.gain.exponentialRampToValueAtTime(.0001, now + Math.min(.08, profile.decay));
        noise.connect(filter).connect(noiseGain).connect(masterGain);
        noise.start(now);
      }

      function updateMuteControl() {
        muteButton.setAttribute('aria-pressed', String(muted));
        muteLabel.textContent = muted ? 'Sound off' : 'Sound on';
        if (masterGain && audioContext) {
          masterGain.gain.setTargetAtTime(muted ? 0 : .72, audioContext.currentTime, .012);
        }
        if (muted) soundHint.classList.add('hidden');
      }

      function updateFit() {
        const rect = scene.getBoundingClientRect();
        const widthFit = (rect.width * (rect.width < 720 ? .98 : .88)) / BOARD_W;
        const heightFit = (rect.height * (rect.width < 720 ? .7 : .67)) / BOARD_H;
        const fit = Math.min(1, Math.max(.29, Math.min(widthFit, heightFit)));
        document.documentElement.style.setProperty('--fit', fit.toFixed(3));
      }

      function setRotation() {
        document.documentElement.style.setProperty('--rx', `${rotationX}deg`);
        document.documentElement.style.setProperty('--rz', `${rotationZ}deg`);
      }

      let dragState = null;
      scene.addEventListener('pointerdown', (event) => {
        if (isAssembling || event.target.closest('.keycap') || event.button !== 0) return;
        dragState = { x: event.clientX, y: event.clientY, rx: rotationX, rz: rotationZ };
        scene.setPointerCapture?.(event.pointerId);
        scene.classList.add('dragging');
      });

      scene.addEventListener('pointermove', (event) => {
        if (!dragState) return;
        rotationZ = Math.max(-27, Math.min(18, dragState.rz + (event.clientX - dragState.x) * .055));
        rotationX = Math.max(40, Math.min(70, dragState.rx - (event.clientY - dragState.y) * .045));
        setRotation();
      });

      const endDrag = () => {
        dragState = null;
        scene.classList.remove('dragging');
      };
      scene.addEventListener('pointerup', endDrag);
      scene.addEventListener('pointercancel', endDrag);

      // Resume Web Audio on the earliest eligible gesture, even if the user drags first.
      document.addEventListener('pointerdown', ensureAudio, { once: true, capture: true });

      window.addEventListener('keydown', (event) => {
        const cap = keyMap.get(event.code);
        if (!cap || isAssembling || event.target.closest?.('button')) return;
        if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(event.code)) event.preventDefault();
        ensureAudio();
        if (!event.repeat) pressKey(cap, true);
      });

      window.addEventListener('keyup', (event) => releaseKey(keyMap.get(event.code)));
      window.addEventListener('blur', () => keycaps.forEach(releaseKey));

      replayButton.addEventListener('click', () => {
        ensureAudio();
        playAssembly();
      });

      muteButton.addEventListener('click', () => {
        ensureAudio();
        muted = !muted;
        updateMuteControl();
      });

      window.addEventListener('resize', updateFit);
      reducedMotion.addEventListener?.('change', updateFit);

      buildBoard();
      updateFit();
      setRotation();
      updateMuteControl();
      window.setTimeout(playAssembly, 180);
    })();
  </script>
</body>
</html>
