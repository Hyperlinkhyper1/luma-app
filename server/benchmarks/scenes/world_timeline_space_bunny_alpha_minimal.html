  const landSets = [
    [
      [[-100,-48],[-57,-76],[-8,-62],[24,-77],[55,-40],[86,-8],[72,31],[45,54],[15,76],[-18,68],[-47,81],[-85,51],[-118,20],[-123,-15]],
      [[-170,-28],[-138,-60],[-105,-35],[-91,4],[-112,38],[-156,52],[-190,18]],
      [[68,70],[112,47],[156,59],[190,24],[177,-14],[137,-35],[99,-12]],
      [[82,-156],[126,-132],[154,-94],[133,-61],[97,-76],[67,-113]]
    ],
    [
      [[-90,-105],[-45,-95],[-15,-67],[18,-82],[45,-52],[78,-28],[65,13],[45,54],[15,72],[-18,68],[-47,81],[-85,51],[-108,11],[-120,-47]],
      [[-140,-70],[-104,-65],[-78,-35],[-91,5],[-119,35],[-153,28]],
      [[60,63],[102,55],[150,66],[191,20],[172,-20],[126,-38],[88,-5]],
      [[90,-150],[137,-126],[156,-89],[130,-66],[94,-88],[64,-118]]
    ],
    [
      [[-105,-65],[-63,-80],[-20,-64],[20,-79],[50,-50],[79,-15],[69,30],[43,58],[13,73],[-18,67],[-48,80],[-86,47],[-120,16],[-125,-24]],
      [[-150,-38],[-119,-58],[-91,-31],[-88,9],[-112,43],[-150,50]],
      [[71,72],[113,48],[151,57],[185,21],[172,-18],[128,-39],[93,-9]],
      [[81,-155],[128,-132],[155,-95],[132,-62],[96,-75],[65,-115]]
    ],
    [
      [[-92,-78],[-43,-80],[-7,-54],[18,-64],[43,-36],[71,-15],[59,22],[38,48],[9,68],[-18,62],[-46,74],[-78,46],[-105,8],[-115,-37]],
      [[-133,-67],[-99,-66],[-72,-33],[-83,13],[-112,36],[-146,26]],
      [[60,58],[100,42],[144,54],[187,10],[165,-32],[120,-42],[84,-11]],
      [[74,-146],[122,-120],[153,-88],[127,-58],[90,-73],[58,-108]]
    ]
  ];
  const skies = [
    ["#251324","#6e2a22","#d65a27"],["#241a2a","#763326","#c66235"],["#102c46","#275d73","#8ac5c3"],
    ["#26354b","#71807b","#b9b58c"],["#a9c9d4","#d9e6e6","#f4f2df"],["#143b58","#4b9cad","#b5dfd6"],
    ["#183950","#4e8290","#b8d4ba"],["#1c3d50","#4c807f","#9bc9aa"],["#1b3045","#4a6570","#b8a983"],
    ["#182f46","#3d6678","#a3c6ba"],["#162d45","#3a6576","#9bc3ba"],["#183a4a","#557c67","#c5bd78"],
    ["#214052","#8a7048","#e0b56b"],["#1b4054","#687f73","#d2b579"],["#1c394c","#4b6670","#a1ac9d"],
    ["#16394e","#4d7b8c","#b8c7b8"],["#222d3b","#514b4c","#b79b79"],["#172d43","#3b657a","#8fb5bd"],
    ["#081225","#102a45","#295073"]
  ];

  const ids = ["land0","land1","land2","land3"];
  ids.forEach((id,i) => {
    $(id).setAttribute("d", smooth(landSets[0][i]));
    $("ticks").insertAdjacentHTML("beforeend", `<g data-index="${i}" class="tick" transform="translate(${chapters[i].x} 9)"><line y1="-6" y2="6"/><circle r="5" fill="#ffe29a"/></g>`);
  });
  document.querySelectorAll(".tick").forEach(t => t.addEventListener("click", e => jump(Number(t.dataset.index), true)));

  const starGroup = $("stars"), particleGroup = $("particles");
  const stars = [];
  for (let i=0;i<65;i++) {
    const c=document.createElementNS(NS,"circle"); const r=.5+Math.random()*1.7;
    c.setAttribute("cx",Math.random()*1600); c.setAttribute("cy",Math.random()*740); c.setAttribute("r",r);
    c.setAttribute("opacity",.2+Math.random()*.65); starGroup.appendChild(c);
    stars.push({el:c,x:+c.getAttribute("cx"),y:+c.getAttribute("cy"),r});
  }
  const particles=[];
  for (let i=0;i<34;i++) {
    const c=document.createElementNS(NS,"circle"); c.setAttribute("r",1+Math.random()*2.4); particleGroup.appendChild(c);
    particles.push({el:c,x:Math.random()*1600,y:Math.random()*700,s:.15+Math.random()*.65,p:Math.random()*Math.PI*2});
  }

  const duration = 171;
  let elapsed=0, playing=true, speed=1, last=performance.now();
  let current=-1, displayedA="", displayedB="";
  const baseIce = $("iceGroup");

  function smooth(a) {
    let s=`M${a[0][0]} ${a[0][1]}`;
    for(let i=0;i<a.length-1;i++) {
      const p0=a[(i-1+a.length)%a.length], p1=a[i], p2=a[i+1], p3=a[(i+2)%a.length];
      const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6];
      const c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
      s+=`C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
    }
    return s+"Z";
  }
  function mix(a,b,t){ return a.map((v,i)=>v+(b[i]-v)*t); }
  function mixSky(a,b,t){
    $("sky0").setAttribute("stop-color",rgb(mix(hex(a[0]),hex(b[0]),t)));
    $("sky1").setAttribute("stop-color",rgb(mix(hex(a[1]),hex(b[1]),t)));
    $("sky2").setAttribute("stop-color",rgb(mix(hex(a[2]),hex(b[2]),t)));
  }
  function hex(s){ return [parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)]; }
  function rgb(a){ return `rgb(${a.map(v=>Math.round(v)).join(",")})`; }
  function chapterAt(t){
    const per=duration/chapters.length, i=Math.floor(t/per);
    return {i,local:(t-i*per)/per};
  }
  function setChapter(i){
    if(i===current) return;
    current=i;
    const c=chapters[i];
    $("chapterNumber").textContent=`CHAPTER ${String(i+1).padStart(2,"0")} / 19`;
    $("chapterTitle").textContent=c.title;
    $("chapterDate").textContent=c.date;
    $("captionA").textContent=c.a;
    $("captionB").textContent=c.b;
    $("chapterTitle").setAttribute("opacity",0);
    $("captionBox").setAttribute("fill-opacity",0);
  }
  function band(t){ return t<.5?0:t<.62?1:t<.74?2:1; }
  function updateArt(t){
    const {i,local}=chapterAt(t);
    if(i!==current) setChapter(i);
    const a=band(i), b=band(i+1), u=smoothstep(local);
    for(let k=0;k<4;k++) $(ids[k]).setAttribute("d",smooth(landSets[a][k].map((p,j)=>mix(p,landSets[b][k][j]||p,u))));
    mixSky(skies[i],skies[i+1],u);
    const e=local;
    const magma=Math.max(0,1-i*1.55);
    $("moltenSurface").setAttribute("opacity",magma);
    $("lavaA").setAttribute("opacity",.8*magma);
    $("lavaB").setAttribute("opacity",.7*magma);
    $("theia").setAttribute("opacity",i===0?Math.sin(Math.PI*Math.min(1,local*1.15))*.95:0);
    const theiaX=1110-e*185, theiaY=205+e*110;
    $("theia").setAttribute("transform",`translate(${theiaX-1110} ${theiaY-205})`);
    const ice=i===4?1:(i===5?(1-local*.65):0);
    baseIce.setAttribute("opacity",ice);
    $("atmoRing").setAttribute("stroke",i===3?"#b8e5a6":i>=12?"#86cde2":"#8de8e5");
    const op=(id,on)=>$(id).setAttribute("opacity",on?Math.min(1,on):0);
    op("stromatolites",i===2?Math.min(1,local*5):0);
    op("trilobites",i===5?Math.min(1,local*5):0);
    op("forests",i===6?Math.min(1,local*5):0);
    op("dinosaurs",i===7?Math.min(1,local*5):0);
    op("impact",i===8?Math.min(1,local*7):0);
    op("mammals",i===9?Math.min(1,local*4):0);
    op("humans",i>=10?(i===10?Math.min(1,local*5):1):0);
    op("fields",i===11?Math.min(1,local*5):0);
    op("pyramids",i===12?Math.min(1,local*5):0);
    op("classical",i===13?Math.min(1,local*5):0);
    op("medieval",i===14?Math.min(1,local*5):0);
    op("ship",i===15?Math.min(1,local*5):0);
    op("industry",i===16?Math.min(1,local*5):0);
    op("modern",i===17?Math.min(1,local*5):0);
    op("moonLanding",i===17?Math.max(0,Math.sin((local-.55)*Math.PI*3))*1:0);
    op("digital",i===18?Math.min(1,local*4):0);
    const zoom=1+Math.sin(t/duration*Math.PI*2)*.018;
    const panX=Math.sin(t*.12)*8+Math.sin(t*.035)*18;
    $("camera").setAttribute("transform",`translate(${800-800*0} ${405-405*0}) translate(${panX} 0) translate(800 405) scale(${zoom}) translate(-800 -405)`);
    const px=chapters[i].x+(chapters[i+1]?.x-chapters[i].x||0)*local;
    $("playhead").setAttribute("transform",`translate(${px} 9)`);
    const captionFade=Math.min(1,local/.09);
    $("chapterTitle").setAttribute("opacity",captionFade);
    $("captionBox").setAttribute("fill-opacity",.7*captionFade);
    $("clock").textContent=`${String(Math.floor(t/60)).padStart(2,"0")}:${String(Math.floor(t%60)).padStart(2,"0")}`;
    svg.setAttribute("aria-label",`${chapters[i].title}. ${chapters[i].date}. ${chapters[i].a}`);
  }
  function smoothstep(x){ return x*x*(3-2*x); }
  function jump(i,play){
    elapsed=i*duration/chapters.length+.01;
    updateArt(elapsed);
    if(play!==false) setPlaying(true);
  }
  function setPlaying(v){
    playing=v;
    $("play").textContent=v?"PAUSE":"PLAY";
    $("play").setAttribute("aria-label",v?"Pause":"Play");
  }

  $("play").addEventListener("click",()=>setPlaying(!playing));
  $("restart").addEventListener("click",()=>{elapsed=0;current=-1;setPlaying(true);});
  $("speed").addEventListener("change",e=>speed=+e.target.value);
  window.addEventListener("keydown",e=>{
    if(e.code==="Space"){e.preventDefault();setPlaying(!playing);}
    if(e.code==="ArrowRight"){e.preventDefault();jump((chapterAt(elapsed).i+1)%chapters.length);}
    if(e.code==="ArrowLeft"){e.preventDefault();jump((chapterAt(elapsed).i+chapters.length-1)%chapters.length);}
  });

  let dragging=false;
  function scrub(e){
    const r=svg.getBoundingClientRect(), vw=1600/viewportScale(r), vh=900/viewportScale(r);
    const px=(e.clientX-r.left)/r.width*vw, py=(e.clientY-r.top)/r.height*vh;
    const x=Math.max(0,Math.min(1440,px-70));
    elapsed=x/1440*duration;
    updateArt(elapsed);
  }
  function viewportScale(r){ return Math.min(r.width/1600,r.height/900); }
  svg.addEventListener("pointerdown",e=>{dragging=true;svg.setPointerCapture(e.pointerId);scrub(e);});
  svg.addEventListener("pointermove",e=>{if(dragging)scrub(e);});
  svg.addEventListener("pointerup",()=>dragging=false);
  svg.addEventListener("pointercancel",()=>dragging=false);

  function frame(now){
    const dt=Math.min(.05,(now-last)/1000); last=now;
    if(playing&&!dragging){
      elapsed+=dt*speed;
      if(elapsed>=duration) elapsed%=duration;
    }
    updateArt(elapsed);
    const {i,local}=chapterAt(elapsed);
    for(const p of particles){
      p.p+=dt*(.5+p.s);
      p.y+=dt*(14+p.s*35);
      if(i<2) p.y-=dt*22;
      if(p.y>760){p.y=40;p.x=Math.random()*1600;}
      if(p.y<30)p.y=730;
      p.x+=Math.sin(p.p)*dt*12;
      p.el.setAttribute("cx",p.x); p.el.setAttribute("cy",p.y);
      p.el.setAttribute("fill",i<2?"#ffbd48":i===4?"#ffffff":i>=17?"#78eaff":"#bde9d2");
      p.el.setAttribute("opacity",i<2?.8:i===4?.9:.25+Math.sin(p.p)*.25);
    }
    stars.forEach((s,n)=>{
      s.el.setAttribute("cx",s.x+Math.sin(now*.00012+n)*2);
      s.el.setAttribute("opacity",i>=11?.1:.35+.35*Math.sin(now*.001+n));
    });
    requestAnimationFrame(frame);
  }
  updateArt(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
