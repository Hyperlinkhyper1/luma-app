<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  box.style.display = 'block';

/* =====================================================================
   VOXEL GARDEN - Spring Festival at the Five-Story Pagoda
   One voxel is one metre. A five-storey Goju-no-To rises from a genuine
   floating island; a waterfall spills off its edge and smaller islands
   drift around it. Everything is generated procedurally - no assets.
   ===================================================================== */

/* ------------------------------------------------------------ helpers */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;

/* ------------------------------------------------------------ renderer */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });

const scene = new THREE.Scene();

const controls = new OrbitControls(camera, renderer.domElement);

controls.dampingFactor = 0.06;
controls.minDistance = 14;
controls.maxDistance = 125;
controls.maxPolarAngle = Math.PI * 0.55;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.42;

/* shared uniforms */
const U = { time: { value: 0 }, wind: { value: 1 } };

/* ------------------------------------------------------------ palette */
const MAT_DEFS = {

  vermDark:   { c: 0x9E2E14, r: 0.60 },
  gold:       { c: 0xDDA232, r: 0.36, m: 0.20, e: 0xB8741A, ei: 0.14 },
  teak:       { c: 0x4A2C1A, r: 0.78 },
  teakLight:  { c: 0x6B4229, r: 0.80 },
  jadeA:      { c: 0x2D6A4F, r: 0.42 },
  jadeB:      { c: 0x40916C, r: 0.42 },
  jadeDark:   { c: 0x24593F, r: 0.46 },
  shoji:      { c: 0xF3E6C8, r: 0.90, e: 0xFFC060, ei: 0.0 },

  floorGlow:  { c: 0x8A5A34, r: 0.70, e: 0xFFA24A, ei: 0.4 },
  ember:      { c: 0xFFD98A, r: 0.60, e: 0xFFA640, ei: 0.55 },
  stone:      { c: 0x9AA0A6, r: 0.92 },
  stoneDark:  { c: 0x767C83, r: 0.95 },
  stoneLight: { c: 0xB6BBC0, r: 0.90 },
  stoneWarm:  { c: 0xA79F94, r: 0.92 },
  rock:       { c: 0x6D6963, r: 1.0 },
  rockDark:   { c: 0x54514F, r: 1.0 },
  dirt:       { c: 0x6A4E37, r: 1.0 },
  moss:       { c: 0x606C38, r: 0.95 },
  mossLight:  { c: 0x7C8A44, r: 0.95 },
  grass:      { c: 0x6F8F3C, r: 0.95 },
  grassDark:  { c: 0x4F6B2E, r: 0.95 },

  bark:       { c: 0x5B4030, r: 1.0 },
  barkDark:   { c: 0x3E2B20, r: 1.0 },
  sakuraA:    { c: 0xFFB7C5, r: 0.85, wind: 1 },
  sakuraB:    { c: 0xFF8FAB, r: 0.85, wind: 1 },
  sakuraC:    { c: 0xFFE5EC, r: 0.85, wind: 1 },
  pineA:      { c: 0x2C5A3A, r: 0.9, wind: 1 },
  pineB:      { c: 0x1F4A2E, r: 0.9, wind: 1 },

  willowB:    { c: 0xBAD886, r: 0.9, wind: 1 },

  bambooDark: { c: 0xB3A44E, r: 0.7 },
  black:      { c: 0x231E1B, r: 0.6 },
  white:      { c: 0xF4EEE2, r: 0.8 },
  stem:       { c: 0x4C8A3A, r: 0.9 },
  fPink:      { c: 0xFFB7C5, r: 0.8, e: 0xFF8FAB, ei: 0.12 },
  fRose:      { c: 0xFF8FAB, r: 0.8, e: 0xFF6F91, ei: 0.12 },
  fWhite:     { c: 0xFFF6EE, r: 0.8, e: 0xFFFFFF, ei: 0.12 },
  fGold:      { c: 0xFFD166, r: 0.8, e: 0xFFC233, ei: 0.14 },
  fViolet:    { c: 0xC9A0FF, r: 0.8, e: 0xA070FF, ei: 0.12 },
  pondBed:    { c: 0x3B5058, r: 1.0 },
  cloud:      { c: 0xF2F6FA, r: 1.0 },
};
const MAT_KEYS = Object.keys(MAT_DEFS);
const KEYID = {};
MAT_KEYS.forEach((k, i) => { KEYID[k] = i + 1; });
const FOLIAGE = new Set(MAT_KEYS.filter((k) => MAT_DEFS[k].wind));

const MATS = {};
function patchVoxelMaterial(mat, wind) {
  if (wind) mat.defines = { USE_WIND: '' };
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = U.time;
    sh.uniforms.uWind = U.wind;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
        attribute vec4 aAO0; attribute vec4 aAO1; attribute vec4 aAO2;
        attribute vec4 aAO3; attribute vec4 aAO4; attribute vec4 aAO5;
        #ifdef USE_WIND
        attribute float aSway;
        #endif
        uniform float uTime; uniform float uWind;
        varying float vAO; varying vec3 vLP; varying vec3 vLN;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        vLP = position; vLN = normal;
        vec4 aoQ = normal.x > 0.5 ? aAO0 : normal.x < -0.5 ? aAO1 : normal.y > 0.5 ? aAO2
                 : normal.y < -0.5 ? aAO3 : normal.z > 0.5 ? aAO4 : aAO5;
        vec2 fq = abs(normal.x) > 0.5 ? position.yz : abs(normal.y) > 0.5 ? position.xz : position.xy;
        int aoI = (fq.x > 0.0 ? 2 : 0) + (fq.y > 0.0 ? 1 : 0);
        vAO = aoQ[aoI];
        #ifdef USE_WIND
        vec3 ip = instanceMatrix[3].xyz;
        float f1 = sin(uTime * 1.1 + ip.x * 0.35 + ip.z * 0.27);
        float f2 = sin(uTime * 2.3 + ip.y * 0.6 + ip.x * 0.15);
        transformed.x += (f1 * 0.6 + f2 * 0.4) * 0.17 * aSway * uWind;
        transformed.z += (f2 * 0.6 - f1 * 0.3) * 0.13 * aSway * uWind;
        transformed.y -= abs(f1) * 0.06 * aSway * uWind;

      .replace('#include <common>', `#include <common>
        varying float vAO; varying vec3 vLP; varying vec3 vLN;`)
      .replace('#include <color_fragment>', `#include <color_fragment>

for (const k of MAT_KEYS) {
  const d = MAT_DEFS[k];

    color: d.c, roughness: d.r, metalness: d.m || 0,
    emissive: d.e !== undefined ? d.e : 0x000000, emissiveIntensity: d.ei || 0,

/* ------------------------------------------------------------ voxel grid */
const X0 = -66, Y0 = -50, Z0 = -66, GW = 132, GH = 100, GD = 132;
const GRID = new Uint8Array(GW * GH * GD);
const inb = (x, y, z) => x >= X0 && x < X0 + GW && y >= Y0 && y < Y0 + GH && z >= Z0 && z < Z0 + GD;

const idAt = (x, y, z) => (inb(x, y, z) ? GRID[gi(x, y, z)] : 0);

function put(x, y, z, key) {
  x = Math.round(x); y = Math.round(y); z = Math.round(z);
  if (!inb(x, y, z)) return false;
  const i = gi(x, y, z);
  if (GRID[i]) return false;
  GRID[i] = KEYID[key];
  return true;
}
function set(x, y, z, key) {
  x = Math.round(x); y = Math.round(y); z = Math.round(z);
  if (!inb(x, y, z)) return false;
  GRID[gi(x, y, z)] = key ? KEYID[key] : 0;
  return true;
}
function paint(x, y, z, key) {
  x = Math.round(x); y = Math.round(y); z = Math.round(z);
  if (!solid(x, y, z)) return false;
  GRID[gi(x, y, z)] = KEYID[key];
  return true;
}
function box(x0, y0, z0, w, h, d, key, over) {
  for (let y = y0; y < y0 + h; y++)
    for (let z = z0; z < z0 + d; z++)
      for (let x = x0; x < x0 + w; x++) (over ? set : put)(x, y, z, key);
}
function boxc(cx, y0, cz, hx, h, hz, key, over) {
  box(cx - hx, y0, cz - hz, 2 * hx + 1, h, 2 * hz + 1, key, over);
}
function ringc(cx, y, cz, hx, hz, key, over) {
  for (let z = cz - hz; z <= cz + hz; z++)
    for (let x = cx - hx; x <= cx + hx; x++)
      if (Math.abs(x - cx) === hx || Math.abs(z - cz) === hz) (over ? set : put)(x, y, z, key);
}
function cyl(cx, cz, r, y0, y1, key, over) {
  const r2 = r * r + 0.25;
  for (let y = y0; y <= y1; y++)
    for (let z = Math.floor(cz - r); z <= Math.ceil(cz + r); z++)
      for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++)
        if ((x - cx) * (x - cx) + (z - cz) * (z - cz) <= r2) (over ? set : put)(x, y, z, key);
}
function blob(cx, cy, cz, rx, ry, rz, pick, holes) {
  const X = Math.ceil(rx), Y = Math.ceil(ry), Z = Math.ceil(rz);
  for (let y = -Y; y <= Y; y++)
    for (let z = -Z; z <= Z; z++)
      for (let x = -X; x <= X; x++) {
        const q = (x * x) / (rx * rx) + (y * y) / (ry * ry) + (z * z) / (rz * rz);
        if (q > 1.0) continue;
        if (holes && holes(x, y, z, q)) continue;
        const key = typeof pick === 'function' ? pick(x, y, z, q) : pick;
        if (key) put(cx + x, cy + y, cz + z, key);
      }

function line(x0, y0, z0, x1, y1, z1, key, thick = 0) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), Math.abs(z1 - z0), 1) * 2;
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const x = Math.round(lerp(x0, x1, t)), y = Math.round(lerp(y0, y1, t)), z = Math.round(lerp(z0, z1, t));
    put(x, y, z, key);
    if (thick) { put(x + 1, y, z, key); put(x, y, z + 1, key); if (thick > 1) put(x + 1, y, z + 1, key); }
  }

/* --------------------------------------------------- instanced meshes */
const voxelRoot = new THREE.Group();
scene.add(voxelRoot);
const TREES = [];
const NOSHADOW = new Set(['crystal']);
let voxelCount = 0;

const FACES = [
  { n: [1, 0, 0], u: [0, 1, 0], v: [0, 0, 1] },
  { n: [-1, 0, 0], u: [0, 1, 0], v: [0, 0, 1] },
  { n: [0, 1, 0], u: [1, 0, 0], v: [0, 0, 1] },
  { n: [0, -1, 0], u: [1, 0, 0], v: [0, 0, 1] },
  { n: [0, 0, 1], u: [1, 0, 0], v: [0, 1, 0] },
  { n: [0, 0, -1], u: [1, 0, 0], v: [0, 1, 0] },
];
const AO_LEVEL = [1.0, 0.84, 0.69, 0.55];

function swayWeight(key, x, y, z) {
  let best = null, bd = 1e9;
  for (const t of TREES) {
    const d = Math.hypot(x - t.x, z - t.z);
    if (d < bd) { bd = d; best = t; }
  }
  if (!best || bd > 16) return 0.25;
  if (best.kind === 'willow' && y < best.crownY) {
    return 0.35 + 0.65 * clamp((best.crownY - y) / 8, 0, 1);
  }
  const w = clamp((y - best.y) / best.h, 0, 1);
  return 0.12 + 0.88 * Math.pow(w, 1.25);

function buildVoxelMeshes() {
  const lists = MAT_KEYS.map(() => []);
  for (let y = Y0; y < Y0 + GH; y++)
    for (let z = Z0; z < Z0 + GD; z++)
      for (let x = X0; x < X0 + GW; x++) {
        const id = GRID[gi(x, y, z)];
        if (!id) continue;
        if (solid(x + 1, y, z) && solid(x - 1, y, z) && solid(x, y + 1, z) &&
            solid(x, y - 1, z) && solid(x, y, z + 1) && solid(x, y, z - 1)) continue;
        lists[id - 1].push(x, y, z);
      }
  const m4 = new THREE.Matrix4();
  const col = new THREE.Color();
  MAT_KEYS.forEach((key, mi) => {
    const list = lists[mi];

  for (const s of [-1, 1]) for (const dz of [-1, 0]) set(cx + s * 3, g + 7, cz + dz, 'vermDark');
}

/* arched wooden bridge over the pond, north-south at x = 19 */
function buildBridge() {
  const bx = POND.x, z0 = -3, z1 = 12;
  for (let z = z0; z <= z1; z++) {
    const t = (z - z0) / (z1 - z0);
    const y = Math.round(3.2 * Math.sin(Math.PI * t));
    for (let dx = -1; dx <= 1; dx++) {
      set(bx + dx, y, z, z % 2 === 0 ? 'teakLight' : 'teak');
      if (Math.abs(dx) === 1 && y > 0) { set(bx + dx, y - 1, z, 'teak'); if (y > 1) set(bx + dx, y - 2, z, 'teak'); }
    }
    for (const s of [-2, 2]) {
      set(bx + s, y + 1, z, 'vermilion');
      if ((z - z0) % 3 === 0) { set(bx + s, y + 2, z, 'vermilion'); set(bx + s, y + 3, z, 'gold'); }
    }

}

/* bamboo fence following the coast of the island */
function buildFence(a0, a1, inset, step) {
  let last = null;
  for (let a = a0; a <= a1; a += step) {
    const R = mainShape(a) - inset;
    const x = Math.round(Math.cos(a) * R), z = Math.round(Math.sin(a) * R);
    const y = colTop(x, z, 6);
    if (y === null || (inPond(x, z) < 2.0)) { last = null; continue; }
    if (pathDist(x, z) < 3) { last = null; continue; }
    for (let k = 1; k <= 4; k++) set(x, y + k, z, k === 4 ? 'teak' : (k & 1) ? 'bamboo' : 'bambooDark');
    if (last) {
      const [lx, ly, lz] = last;
      line(lx, ly + 2, lz, x, y + 2, z, 'bambooDark');
      line(lx, ly + 3, lz, x, y + 3, z, 'bamboo');
    }
    last = [x, y, z];
  }
}

/* ------------------------------------------------------------ trees
   Exactly eight: 3 sakura, 2 pine, 2 maple, 1 willow. */
const holes = (seed, p) => (x, y, z, q) => q > 0.72 && hash2(x * 3 + seed, z * 5 + y * 2, seed) < p;
const CROWN_DOT = (a, b, c, ta, tb) => (x, y, z, q) => {
  const n = vnoise(x * 0.5 + y * 0.25, z * 0.5 - y * 0.2, 9);
  const h = hash2(x * 7 + y, z * 3 + y * 5, 31);
  if (n < ta || h < 0.09) return b;
  if (n > tb || h > 0.92) return c;
  return a;
};

function sakura(x, z, g, s = 1) {
  const H = Math.round(6 * s);
  for (let y = 1; y <= 3; y++) {
    put(x, g + y, z, 'bark'); put(x + 1, g + y, z, 'barkDark');
    put(x, g + y, z + 1, 'bark'); put(x + 1, g + y, z + 1, 'bark');
  }
  line(x, g + 4, z, x + 1, g + H, z, 'bark', 2);
  const tips = [[-4, 2, -2], [4, 3, 1], [0, 3, 4], [-2, 3, -4], [3, 2, -4]].map(([a, b, c]) => [Math.round(a * s), Math.round(b * s), Math.round(c * s)]);
  const cx = x + 1, cy = g + H;
  const pick = CROWN_DOT('sakuraA', 'sakuraB', 'sakuraC', 0.30, 0.72);
  for (const [a, b, c] of tips.slice(0, 4)) {
    line(cx, g + H - 1, z, cx + a, cy + b - 1, z + c, 'bark');
    blob(cx + a, cy + b + 1, z + c, 3.1 * s, 2.3 * s, 3.0 * s, (px, py, pz, q) => pick(cx + a + px, cy + b + py, z + c + pz, q), holes(7, 0.16));
  }
  blob(cx, cy + Math.round(4 * s), z, 3.9 * s, 2.8 * s, 3.6 * s, (px, py, pz, q) => pick(cx + px, cy + py, z + pz, q), holes(5, 0.14));
  TREES.push({ x: cx, y: g, z, h: H + Math.round(7 * s), kind: 'sakura', crownY: cy });
}

function pine(x, z, g, s = 1) {
  const H = Math.round(11 * s);
  for (let y = 1; y <= H; y++) {
    const dx = Math.round(1.3 * Math.sin(y * 0.55));
    put(x + dx, g + y, z, y < 3 ? 'barkDark' : 'bark');
    if (y < 3) { put(x + dx + 1, g + y, z, 'bark'); put(x + dx, g + y, z + 1, 'bark'); }
  }
  const lv = [4, 6, 8, 10].map((v) => Math.round(v * s));
  const ph = [0.4, 2.7, 4.6, 1.6];
  lv.forEach((h, i) => {
    const bx = x + Math.round(1.3 * Math.sin(h * 0.55)), bz = z;
    const px = bx + Math.round(Math.cos(ph[i]) * 3.6 * s), pz = bz + Math.round(Math.sin(ph[i]) * 3.2 * s);
    line(bx, g + h, bz, px, g + h + 1, pz, 'bark');
    blob(px, g + h + 2, pz, 3.2 * s, 1.25, 2.7 * s, (a, b, c, q) => {
      const t = hash2(px + a * 5, pz + c * 3 + b, 41);
      return q > 0.62 && b >= 0 ? (t < 0.5 ? 'pineC' : 'pineA') : t < 0.6 ? 'pineB' : 'pineA';
    }, holes(3, 0.12));
  });
  const tx = x + Math.round(1.3 * Math.sin(H * 0.55));
  blob(tx, g + H + 1, z, 2.4 * s, 1.5, 2.3 * s, (a, b, c, q) => (b > 0 && q > 0.5 ? 'pineC' : 'pineA'), holes(4, 0.1));
  TREES.push({ x, y: g, z, h: H + 3, kind: 'pine', crownY: g + H });
}

function maple(x, z, g, s = 1) {
  const H = Math.round(6 * s);
  for (let y = 1; y <= H; y++) {
    put(x, g + y, z, y < 3 ? 'barkDark' : 'bark');
    if (y < 3) { put(x + 1, g + y, z, 'bark'); put(x, g + y, z + 1, 'bark'); put(x + 1, g + y, z + 1, 'bark'); }
  }
  const cy = g + H;
  const tips = [[-3, 3, 1], [3, 3, -1], [0, 4, 3], [-1, 4, -3]].map(([a, b, c]) => [Math.round(a * s), Math.round(b * s), Math.round(c * s)]);
  const pick = (ox, oy, oz) => (a, b, c) => {
    const wy = oy + b;
    const n = vnoise((ox + a) * 0.5, (oz + c) * 0.5 + wy * 0.3, 21);
    const h = hash2(ox + a * 3, oz + c * 7 + wy, 23);
    if (wy > cy + 4 && (n > 0.5 || h > 0.8)) return 'mapleC';
    if (n < 0.4 || h < 0.12) return 'mapleA';
    return h > 0.86 ? 'mapleC' : 'mapleB';
  };
  for (const [a, b, c] of tips) {
    line(x, cy - 1, z, x + a, cy + b - 1, z + c, 'bark');
    blob(x + a, cy + b + 1, z + c, 2.7 * s, 2.1 * s, 2.7 * s, pick(x + a, cy + b + 1, z + c), holes(9, 0.14));
  }
  blob(x, cy + Math.round(3 * s), z, 3.3 * s, 2.6 * s, 3.3 * s, pick(x, cy + Math.round(3 * s), z), holes(6, 0.12));
  TREES.push({ x, y: g, z, h: H + Math.round(6 * s), kind: 'maple', crownY: cy });
}

function willow(x, z, g, lx, lz) {
  const H = 8;
  for (let y = 1; y <= H; y++) {
    const t = y / H;
    const px = x + Math.round(lx * t * t), pz = z + Math.round(lz * t * t);
    put(px, g + y, pz, 'bark'); put(px + 1, g + y, pz, 'barkDark');
    if (y < 5) { put(px, g + y, pz + 1, 'bark'); put(px + 1, g + y, pz + 1, 'bark'); }
  }
  const cx = x + lx, cz = z + lz, cy = g + H + 1;
  const rx = 4.4, ry = 2.2, rz = 4.4;
  blob(cx, cy, cz, rx, ry, rz, (a, b, c) => (hash2(cx + a * 5, cz + c * 3 + b, 51) < 0.55 ? 'willowA' : 'willowB'), holes(2, 0.10));
  for (let dz = -4; dz <= 4; dz++)
    for (let dx = -4; dx <= 4; dx++) {
      const q = (dx * dx) / (rx * rx) + (dz * dz) / (rz * rz);
      if (q > 0.98 || q < 0.28) continue;
      if (hash2(cx + dx, cz + dz, 53) > 0.72) continue;
      const hh = Math.floor(ry * Math.sqrt(1 - q));
      const L = 4 + Math.floor(hash2(cx + dx * 3, cz + dz, 57) * 5);
      for (let k = 1; k <= L; k++) put(cx + dx, cy - hh - k, cz + dz, k % 3 === 0 ? 'willowA' : 'willowB');
    }
  TREES.push({ x: cx, y: g, z: cz, h: H + 4, kind: 'willow', crownY: cy - 1 });
}

/* main island: 2 sakura, 1 pine, 1 maple, 1 willow */

sakura(-14, 20, gy(-14, 20), 1.0);

      _s1.makeScale(sx, sy, sz);

      birdParts[idx].setMatrixAt(inst, _H);
    };
    _t1.makeTranslation(0, 0, 0);
    S(0, _B, 0.5, 0.42, 1.5, i);
    _P.copy(_B).multiply(_t1.makeTranslation(0, 0.28, 0.95)); S(1, _P, 0.34, 0.34, 0.4, i);
    _P.copy(_B).multiply(_t1.makeTranslation(0, 0.5, 0.98)); S(2, _P, 0.2, 0.08, 0.22, i);
    _P.copy(_B).multiply(_t1.makeTranslation(0, 0.26, 1.35)); S(3, _P, 0.1, 0.1, 0.42, i);
    _P.copy(_B).multiply(_t1.makeTranslation(0, 0.02, -0.98)); S(4, _P, 0.42, 0.06, 0.65, i);
    for (let side = 0; side < 2; side++) {
      const sd = side === 0 ? 1 : -1;
      const f1 = flap * sd;
      const f2 = (flap * 0.85 + Math.sin(t * 7.2 + b.ph * 3 - 0.9) * 0.22 * (1 - glide)) * sd;
      const hinge = _W1.copy(_B).multiply(_t1.makeTranslation(sd * 0.22, 0.15, 0.1)).multiply(_r1.makeRotationZ(f1));
      const inner = _W2.copy(hinge).multiply(_t1.makeTranslation(sd * 0.58, 0, 0));
      S(5, inner, 1.15, 0.07, 0.72, i * 2 + side);
      const hinge2 = _W3.copy(hinge).multiply(_t1.makeTranslation(sd * 1.15, 0, -0.05)).multiply(_r1.makeRotationZ(f2 * 0.6));
      const outer = _W2.copy(hinge2).multiply(_t1.makeTranslation(sd * 0.5, 0, -0.06));
      S(6, outer, 1.05, 0.06, 0.52, i * 2 + side);
    }
  }
  birdParts.forEach((m) => { m.instanceMatrix.needsUpdate = true; });
}

/* --------------------------------------------------------------- clouds */
const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, emissive: 0xdfe8ff, emissiveIntensity: 0.14 });
const clouds = [];
function makeCloud(cx, cy, cz, cells, seed, drift, cs = 2) {
  const rr = rng(seed);
  const set2 = new Set();
  const key = (x, y, z) => x + ',' + y + ',' + z;
  const nb = 3 + Math.floor(rr() * 3);
  const sx = cells * 0.5, sz = cells * 0.32;
  for (let b = 0; b < nb; b++) {
    const bx = (rr() - 0.5) * sx * 1.4, bz = (rr() - 0.5) * sz * 1.4;
    const rx = 2.4 + rr() * cells * 0.24, rz = 2.2 + rr() * cells * 0.2, ry = 1.4 + rr() * 1.6;
    for (let y = 0; y <= ry; y++)
      for (let z = -Math.ceil(rz); z <= Math.ceil(rz); z++)
        for (let x = -Math.ceil(rx); x <= Math.ceil(rx); x++) {
          const q = (x * x) / (rx * rx) + (z * z) / (rz * rz) + (y * y) / (ry * ry);
          if (q <= 1) set2.add(key(Math.round(bx) + x, y, Math.round(bz) + z));
        }
  }
  const keep = [];
  for (const k of set2) {
    const [x, y, z] = k.split(',').map(Number);
    if (set2.has(key(x + 1, y, z)) && set2.has(key(x - 1, y, z)) && set2.has(key(x, y + 1, z)) &&
        set2.has(key(x, y - 1, z)) && set2.has(key(x, y, z + 1)) && set2.has(key(x, y, z - 1))) continue;
    keep.push([x, y, z]);
  }
  const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(cs, cs, cs), cloudMat, keep.length);
  const col = new THREE.Color();
  keep.forEach(([x, y, z], i) => {
    _m4.makeTranslation(x * cs, y * cs, z * cs);
    mesh.setMatrixAt(i, _m4);
    const g = 0.80 + 0.2 * Math.min(1, y / 2.4) + (hash2(x, z, seed) - 0.5) * 0.08;
    col.setRGB(g, g * 0.985, Math.min(1, g * 1.02));
    mesh.setColorAt(i, col);
  });
  mesh.castShadow = false; mesh.receiveShadow = false; mesh.frustumCulled = false;
  const grp = new THREE.Group();
  grp.position.set(cx, cy, cz);
  grp.add(mesh);
  scene.add(grp);
  clouds.push({ grp, drift });
  voxelCount += keep.length;
}
{
  const rr = rng(4242);
  for (let i = 0; i < 28; i++) {
    const a = (i / 28) * Math.PI * 2 + rr() * 0.4, r = 22 + rr() * 78;
    makeCloud(Math.cos(a) * r, -44 + rr() * 5, Math.sin(a) * r, 12 + Math.floor(rr() * 12), 100 + i, 0.25 + rr() * 0.4);
  }
  for (let i = 0; i < 9; i++) {
    const a = rr() * Math.PI * 2, r = 138 + rr() * 30;
    makeCloud(Math.cos(a) * r, -4 + rr() * 40, Math.sin(a) * r, 12 + Math.floor(rr() * 8), 300 + i, 0.3 + rr() * 0.35, 3);
  }
  for (const [x, y, z] of [[52, -20, 30], [-58, -22, -24], [10, -24, -58]]) makeCloud(x, y, z, 9, 500 + x, 0.4, 2);
}
function updateClouds(dt) {
  for (const c of clouds) {
    c.grp.position.x += c.drift * dt;
    if (c.grp.position.x > 135) c.grp.position.x = -135;

}

/* ----------------------------------------------------------- fireflies */
const FF_N = 70;
const ffGeo = new THREE.BufferGeometry();
const ffPos = new Float32Array(FF_N * 3);
const ffSeed = Array.from({ length: FF_N }, () => [rnd() * 6.28, rnd() * 6.28, 0.3 + rnd() * 0.7]);
const ffBase = Array.from({ length: FF_N }, () => {
  const a = rnd() * 6.28, r = 6 + rnd() * 20;
  return [Math.cos(a) * r * 1.1, 0.8 + rnd() * 3.4, Math.sin(a) * r];
});
ffGeo.setAttribute('position', new THREE.BufferAttribute(ffPos, 3));
const ffMat = new THREE.PointsMaterial({ size: 0.55, color: 0xfff0a0, map: GLOW_TEX, transparent: true, opacity: 0,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true, fog: false });
const fireflies = new THREE.Points(ffGeo, ffMat);
fireflies.frustumCulled = false;
scene.add(fireflies);
function updateFireflies(t) {
  for (let i = 0; i < FF_N; i++) {
    const [a, b, s] = ffSeed[i], [bx, by, bz] = ffBase[i];
    ffPos[i * 3] = bx + Math.sin(t * 0.5 * s + a) * 2.2;
    ffPos[i * 3 + 1] = by + Math.sin(t * 0.8 * s + b) * 0.7;
    ffPos[i * 3 + 2] = bz + Math.cos(t * 0.45 * s + b) * 2.2;
  }
  ffGeo.attributes.position.needsUpdate = true;
}

/* ================================================================
   PAGODA DOORS - hinged leaves that swing smoothly open into the room
   ================================================================ */
const doorRed = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1),
  new THREE.MeshStandardMaterial({ color: 0xC73E1D, roughness: 0.5 }), STORIES.length * 2);
const doorGold = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1),
  new THREE.MeshStandardMaterial({ color: 0xDDA232, roughness: 0.36, metalness: 0.2, emissive: 0xB8741A, emissiveIntensity: 0.14 }), STORIES.length * 12);
[doorRed, doorGold].forEach((m) => { m.castShadow = true; m.receiveShadow = true; m.frustumCulled = false; scene.add(m); });
const DOOR_OPEN_ANGLE = 1.52;
const _dv = new V3(), _ds = new V3(), _dh = new V3();
function setDoorPose(S, openT) {
  const e = openT < 0.5 ? 4 * openT * openT * openT : 1 - Math.pow(-2 * openT + 2, 3) / 2;
  const theta = e * DOOR_OPEN_ANGLE;
  const H = S.wh - 0.06, y0 = S.Y - 0.47;
  for (let leaf = 0; leaf < 2; leaf++) {
    const dir = leaf === 0 ? 1 : -1;
    _dh.set(PAG.x - dir * 1.5, y0, S.cz + S.hw);
    _qa.setFromAxisAngle(Y_AXIS, dir * theta);
    const put1 = (mesh, idx, lx, ly, lz, sx, sy, sz) => {
      _dv.set(dir * lx, ly, lz).applyQuaternion(_qa).add(_dh);
      _ds.set(sx, sy, sz);
      _m4.compose(_dv, _qa, _ds);
      mesh.setMatrixAt(idx, _m4);
    };
    put1(doorRed, S.k * 2 + leaf, 0.75, H / 2, 0, 1.46, H, 0.2);
    const g = S.k * 12 + leaf * 6;
    put1(doorGold, g, 0.75, H * 0.2, 0, 1.48, 0.13, 0.26);
    put1(doorGold, g + 1, 0.75, H * 0.8, 0, 1.48, 0.13, 0.26);
    put1(doorGold, g + 2, 0.4, H * 0.5, 0.14, 0.16, 0.16, 0.12);
    put1(doorGold, g + 3, 0.85, H * 0.5, 0.14, 0.16, 0.16, 0.12);
    put1(doorGold, g + 4, 1.28, H * 0.5, 0.14, 0.16, 0.16, 0.12);
    put1(doorGold, g + 5, 1.4, H * 0.42, 0.17, 0.1, 0.34, 0.1);
  }
  doorRed.instanceMatrix.needsUpdate = true;
  doorGold.instanceMatrix.needsUpdate = true;
}
STORIES.forEach((S) => { S.doorT = 0; S.doorTarget = 0; setDoorPose(S, 0); });
function updateDoors(dt) {
  for (const S of STORIES) {
    if (S.doorT === S.doorTarget) continue;
    const step = dt / 0.95;
    S.doorT = S.doorTarget > S.doorT ? Math.min(S.doorTarget, S.doorT + step) : Math.max(S.doorTarget, S.doorT - step);
    setDoorPose(S, S.doorT);
  }
}

/* ---------------------------------------------------- invisible hit boxes */
const HITS = [];
const hitMat = new THREE.MeshBasicMaterial({ visible: false });
STORIES.forEach((S) => {
  const h = new THREE.Mesh(new THREE.BoxGeometry(2 * S.e + 1, S.yd - S.Y + 1, 2 * S.e + 1), hitMat);
  h.position.set(S.cx, (S.Y - 0.5 + S.yd + 0.5) / 2, S.cz);

});
LANTERNS.forEach((L, i) => {
  const h = new THREE.Mesh(new THREE.BoxGeometry(4, 8, 4), hitMat);
  h.position.set(L.x, L.y + 0.5, L.z);

  scene.add(h); h.updateMatrixWorld(true); HITS.push(h);
});

/* ------------------------------------------------------------ interaction */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function pick(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(HITS, false);
  return hits.length ? hits[0].object.userData : null;
}
function activate(u) {
  if (!u) return;
  if (u.type === 'lantern') {
    const L = LANTERNS[u.i];
    L.on = !L.on; L.manual = true; L.pulse = 1;
  } else if (u.type === 'story') {
    const S = STORIES[u.k];
    S.doorTarget = S.doorTarget ? 0 : 1;
  }
}
let down = null, hoverT = 0;
const dom = renderer.domElement;
dom.addEventListener('pointerdown', (e) => {
  down = { x: e.clientX, y: e.clientY, t: performance.now() };
  if (intro.active) finishIntro();
});
dom.addEventListener('pointerup', (e) => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
  if (moved < 6 && performance.now() - down.t < 500) activate(pick(e));
  down = null;
});
dom.addEventListener('pointermove', (e) => {
  const now = performance.now();
  if (now - hoverT < 60 || down) return;
  hoverT = now;
  dom.style.cursor = pick(e) ? 'pointer' : 'grab';
});
dom.addEventListener('pointerleave', () => { down = null; });

let idleT = 0, dragging = false;
controls.addEventListener('start', () => { dragging = true; controls.autoRotate = false; });
controls.addEventListener('end', () => { dragging = false; idleT = 0; });

/* ------------------------------------------------------------- camera intro */
const HERO_POS = new V3(58, 35, 80), HERO_TARGET = new V3(5, 9, -2);
const intro = { active: true, t: -0.45, dur: 2.6 };
const INTRO_POS = new V3(0.5, 5.2, 33), INTRO_TARGET = new V3(0, 11, -2);
const _hv = new V3();
const heroPose = (out) => out.copy(HERO_TARGET).addScaledVector(_hv.subVectors(HERO_POS, HERO_TARGET), clamp(1.5 / camera.aspect, 1, 1.7));
function finishIntro() {
  intro.active = false;
  heroPose(camera.position);
  controls.target.copy(HERO_TARGET);
  controls.enabled = true;
  controls.update();
  idleT = 0;
}
const _hp = new V3();
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
function updateIntro(dt) {
  intro.t += dt;
  const k = clamp(intro.t / intro.dur, 0, 1);
  const e = ease(k);
  camera.position.lerpVectors(INTRO_POS, heroPose(_hp), e);
  camera.position.y += Math.sin(k * Math.PI) * 6;
  _p.lerpVectors(INTRO_TARGET, HERO_TARGET, e);
  camera.lookAt(_p);
  if (k >= 1) finishIntro();
}
camera.position.copy(INTRO_POS);
camera.lookAt(INTRO_TARGET);

/* ================================================================
   TIME OF DAY, HUD AND THE MAIN LOOP
   ================================================================ */
const state = { tod: 0.09, playing: true, cycleSeconds: 90 };
const $ = (id) => document.getElementById(id);
const hudStats = $('stats'), hudClock = $('clock'), scrub = $('scrub'), playBtn = $('playBtn');
let scrubbing = false;
scrub.addEventListener('pointerdown', () => { scrubbing = true; });
addEventListener('pointerup', () => { scrubbing = false; });
scrub.addEventListener('input', () => { state.tod = scrub.value / 1000; });
document.querySelectorAll('.btn[data-t]').forEach((b) => b.addEventListener('click', () => { state.tod = parseFloat(b.dataset.t); }));
playBtn.addEventListener('click', () => {
  state.playing = !state.playing;
  playBtn.textContent = state.playing ? 'PAUSE CYCLE' : 'PLAY CYCLE';
  playBtn.classList.toggle('on', state.playing);
});
['pointerdown', 'wheel'].forEach((ev) => $('daybox').addEventListener(ev, (e) => e.stopPropagation()));

const sunDir = new V3(), moonDir = new V3(), lightDir = new V3();
const SUN_LOW = new THREE.Color(0xff9a52), SUN_HIGH = new THREE.Color(0xfff3df), MOON_COL = new THREE.Color(0x8fa8ff);
const HEMI_G_DAY = new THREE.Color(0xa9b6c4), HEMI_G_NIGHT = new THREE.Color(0x3b4374), HEMI_S_NIGHT = new THREE.Color(0x8ba0e0);
const CLOUD_NIGHT = new THREE.Color(0x5a67a0), CLOUD_DAY = new THREE.Color(0xffffff);
let lastAuto = null;
const tmpC = new THREE.Color();

function applyTime(t, dt) {
  const a = state.tod * Math.PI * 2;
  sunDir.set(Math.cos(a) * 0.92, Math.sin(a), 0.38).normalize();
  moonDir.copy(sunDir).negate();
  const h = sunDir.y;
  const evening = Math.cos(a) < 0;
  const dayF = smooth(-0.10, 0.28, h);
  const nightF = 1 - smooth(-0.30, 0.03, h);
  const twil = 1 - clamp(Math.abs(h) / 0.35, 0, 1);

  skyColor(skyU.uTop.value, 'top', h, evening);
  skyColor(skyU.uMid.value, 'mid', h, evening);
  skyColor(skyU.uHor.value, 'hor', h, evening);
  skyU.uSunDir.value.copy(sunDir);
  skyU.uMoonDir.value.copy(moonDir);
  skyU.uSunCol.value.copy(SUN_LOW).lerp(SUN_HIGH, smooth(0.0, 0.35, h)).multiplyScalar(smooth(-0.08, 0.02, h));
  skyU.uNight.value = nightF;

  const sunI = 3.5 * smooth(-0.03, 0.30, h);
  const moonI = 2.0 * smooth(0.0, 0.25, -h);
  lightDir.copy(h > -0.03 ? sunDir : moonDir);
  sun.position.copy(sun.target.position).addScaledVector(lightDir, 160);
  sun.intensity = h > -0.03 ? sunI : moonI;
  sun.color.copy(SUN_LOW).lerp(SUN_HIGH, smooth(0.0, 0.4, h));
  if (h <= -0.03) sun.color.copy(MOON_COL);

  hemi.color.copy(HEMI_S_NIGHT).lerp(skyU.uMid.value, smooth(-0.30, 0.0, h)).lerp(tmpC.set(0xdfeeff), 0.35 * dayF);
  hemi.groundColor.copy(HEMI_G_NIGHT).lerp(HEMI_G_DAY, dayF);
  hemi.intensity = lerp(1.45, 1.05, dayF) + twil * 0.06;

  scene.fog.color.copy(skyU.uHor.value).lerp(skyU.uMid.value, 0.55).multiplyScalar(0.98);
  scene.fog.density = 0.0040 + twil * 0.0008;
  FOGU.uFogC.value.copy(scene.fog.color);
  FOGU.uFogD.value = scene.fog.density;

  waterU.uLight.value = lerp(0.42, 1.0, dayF);
  waterU.uSky.value.copy(skyU.uMid.value).lerp(tmpC.set(0xffffff), 0.25 * dayF);
  waterU.uSunDir.value.copy(lightDir);
  waterU.uSunCol.value.copy(h > -0.03 ? sun.color : MOON_COL).multiplyScalar(h > -0.03 ? 1 : 0.5);

  MATS.shoji.emissiveIntensity = lerp(0.42, 1.35, nightF);
  MATS.glow.emissiveIntensity = lerp(0.95, 1.7, nightF);
  MATS.ceilGlow.emissiveIntensity = lerp(0.9, 1.5, nightF);
  MATS.floorGlow.emissiveIntensity = lerp(0.4, 0.8, nightF);
  MATS.ember.emissiveIntensity = lerp(0.55, 1.1, nightF);
  MATS.gold.emissiveIntensity = lerp(0.12, 0.34, nightF);
  MATS.crystal.emissiveIntensity = lerp(0.5, 1.1, nightF);
  doorGold.material.emissiveIntensity = lerp(0.14, 0.32, nightF);
  cloudMat.color.copy(CLOUD_NIGHT).lerp(CLOUD_DAY, dayF);
  cloudMat.emissiveIntensity = 0.05 + 0.10 * dayF;

  /* lanterns light themselves at dusk; a click overrides until the next
     dusk or dawn */
  const autoOn = h < 0.14;
  if (lastAuto === null || autoOn !== lastAuto) {
    LANTERNS.forEach((L) => { L.on = autoOn; L.manual = false; });
    lastAuto = autoOn;
  }
  LANTERNS.forEach((L) => {
    L.cur += ((L.on ? 1 : 0) - L.cur) * (1 - Math.exp(-dt * 5));
    L.pulse = Math.max(0, (L.pulse || 0) - dt * 2.5);
    const flick = 0.9 + 0.1 * Math.sin(t * 9.3 + L.phase) * Math.sin(t * 5.1 + L.phase * 2.1) + 0.04 * Math.sin(t * 23 + L.phase);
    L.light.intensity = L.cur * 42 * flick;
    L.mat.emissiveIntensity = 0.03 + L.cur * 1.9 * flick;
    L.halo.material.opacity = clamp(L.cur * (0.20 + 0.55 * nightF) * flick + L.pulse * 0.4, 0, 1);
    const hs = 6.5 + L.pulse * 2.5;
    L.halo.scale.set(hs, hs, 1);
  });
  tipHalo.material.opacity = 0.10 + nightF * 0.75 + twil * 0.1;
  ffMat.opacity = nightF * 0.9 * (0.8 + 0.2 * Math.sin(t * 3.1));
  return { h, nightF, dayF };
}

function clockText() {
  const hours = (6 + state.tod * 24) % 24;
  const hh = Math.floor(hours), mm = Math.floor((hours - hh) * 60);
  return String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
}

/* ----------------------------------------------------------------- resize */
function onResize() {
  const w = innerWidth, hgt = innerHeight;
  renderer.setSize(w, hgt);
  camera.aspect = w / hgt;
  camera.updateProjectionMatrix();
}
addEventListener('resize', onResize);
onResize();

/* -------------------------------------------------------------------- loop */
const VOX = window.__VOXEL__ = {
  voxelCount, fps: 60, pagodaFloors: STORIES.length, timeOfDay: state.tod,
  pagodaVoxels: PAGODA_VOXELS, pagodaHeight: PAGODA_TIP_Y, trees: TREES.length, flowers: FLOWERS,
  lanterns: LANTERNS.length, koi: KOI_N, birds: BIRD_N,
  setTimeOfDay(v) { state.tod = ((v % 1) + 1) % 1; },
};
window.__setTod = (v) => { state.playing = false; VOX.setTimeOfDay(v); };
window.__dbg = { camera, controls, scene, THREE, state, STORIES, LANTERNS, intro, finishIntro, skyU, sky, hemi, sun, waterU, renderer };

let last = null, fpsAcc = 0, fpsFrames = 0, hudT = 0, simT = 0, firstFrame = true;
function frame(now) {
  requestAnimationFrame(frame);
  if (last === null) last = now;
  const dt = Math.min(0.1, Math.max(0, (now - last) / 1000));
  last = now;
  simT += dt;
  U.time.value = simT;

  if (state.playing) state.tod = (state.tod + dt / state.cycleSeconds) % 1;
  const env = applyTime(simT, dt);
  if (!scrubbing) scrub.value = Math.round(state.tod * 1000);

  U.wind.value = 0.85 + 0.35 * Math.sin(simT * 0.37) + 0.15 * Math.sin(simT * 1.13);
  updateKoi(simT);
  updatePetals(simT, dt);
  updateBirds(simT);
  updateClouds(dt);
  updateFall(simT);
  updateFireflies(simT);
  updateDoors(dt);

  if (intro.active) updateIntro(dt);
  else {
    if (!dragging) {
      idleT += dt;
      if (idleT > 4) controls.autoRotate = true;
    }
    controls.update();
  }
  sky.position.copy(camera.position);
  renderer.render(scene, camera);

  fpsAcc += dt; fpsFrames++;
  if (fpsAcc >= 0.5) {
    VOX.fps = Math.round(fpsFrames / fpsAcc);
    fpsAcc = 0; fpsFrames = 0;
  }
  VOX.timeOfDay = state.tod;
  VOX.voxelCount = voxelCount;
  hudT += dt;
  if (hudT > 0.25) {
    hudT = 0;
    hudStats.textContent = Math.round(voxelCount / 1000) + 'k voxels | ' + VOX.fps + ' FPS';
    hudClock.textContent = clockText();
  }
  if (firstFrame) {
    firstFrame = false;
    const boot = $('boot');
    boot.style.opacity = '0';
    setTimeout(() => boot.remove(), 900);
  }
}
requestAnimationFrame(frame);
