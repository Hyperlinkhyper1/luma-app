function setProgress(ms){
 let p=Math.max(0,Math.min(.999999,ms/duration)), idx=Math.min(N-1,Math.floor(p*N));
 for(let i=0;i<N;i++){let center=(i+.5)/N;let o=1-smooth(.18,.48,Math.abs(p-center));art[i].setAttribute('opacity',o.toFixed(3));}
 title.textContent=data[idx][0];date.textContent=data[idx][1];cap.textContent=data[idx][2];cap2.textContent=data[idx][3];num.textContent=String(idx+1).padStart(2,'0')+' / 19';
 playhead.setAttribute('cx',(x0+p*totalTicks).toFixed(1));
 let landTarget=p<.62?early:(p<.76?modern:p>.83?modern:early); // continuous continental drift
 if(p>.64&&p<.78){let t=smooth(.64,.78,p);document.getElementById('land').setAttribute('d','M '+lerpPath(pangaea,modern,t));}else document.getElementById('land').setAttribute('d','M '+modern.join(' '));
 let snowball=(p>.39&&p<.48)?smooth(.39,.43,p)*(1-smooth(.45,.5,p))*.78:0;
 document.getElementById('iceCap').setAttribute('opacity',snowball.toFixed(3));
 document.getElementById('earth').setAttribute('transform','translate('+(Math.sin(p*18)*5).toFixed(1)+','+(Math.cos(p*12)*3).toFixed(1)+')');
}
function toggle(){playing=!playing;playIcon.textContent=playing?'Ⅱ':'▶'}
function restart(){elapsed=0;setProgress(0);if(!playing){playing=true;playIcon.textContent='Ⅱ'}}

document.getElementById('controls').children[1].addEventListener('click',()=>{speed=speed===1?.5:speed===.5?2:1;speedText.textContent=speed+'×'});
