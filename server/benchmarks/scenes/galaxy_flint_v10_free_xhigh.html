<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const container = document.getElementById('app');
const loadingEl = document.getElementById('loading');
const loadBar = document.getElementById('loadBar');
const loadText = document.getElementById('loadText');

let renderer;
let scene;
let camera;
let composer;
let bloomPass;
let clock = new THREE.Clock();
let raycaster = new THREE.Raycaster();
let mouse = new THREE.Vector2();

const state = {
  mode: 'cinematic',
  phase: 'departure',
  paused: false,
  speed: 1,
  journeyTime: 0,
  journeyDuration: 180,
  destination: null,
  region: 'Perseus Arm',
  distanceLy: 12400,
  speedKmS: 0.08,
  eta: 0,
  muted: false,
  uiHidden: false,
  audioCtx: null,
  masterGain: null,
  engineOsc: null,
  controls: null,
  ship: null,
};

function init() {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.logarithmicDepthBuffer = true;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x010208);
  scene.fog = new THREE.Fog(0x010208, 20, 120);

  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 2000);
  camera.position.set(0, 0, 10);

  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.4, 0.85);
  composer.addPass(bloomPass);

  scene.add(new THREE.AmbientLight(0x334466, 0.6));
  const coreLight = new THREE.PointLight(0xffaa44, 2000, 100, 1.8);
  coreLight.position.set(0, 0, 0);
  scene.add(coreLight);

  generateGalaxy();
  generateBlackHole();
  generateNebula();
  generateShip();
  generatePlanet();

  state.controls = new OrbitControls(camera, renderer.domElement);
  state.controls.enableDamping = true;
  state.controls.dampingFactor = 0.05;
  state.controls.minDistance = 10;
  state.controls.maxDistance = 500;
  state.controls.target.set(0, 0, 0);

  updateHUD();
  window.addEventListener('resize', onResize);
  renderer.domElement.addEventListener('pointerdown', initAudioOnInteraction);
  window.addEventListener('pointerdown', initAudioOnInteraction);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  composer.setSize(window.innerWidth, window.innerHeight);
  if (state.controls) state.controls.update();
}

function initAudioOnInteraction() {
  if (!state.audioCtx) {
    try {
      state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      state.masterGain = state.audioCtx.createGain();
      state.masterGain.gain.value = state.muted ? 0 : 0.04;
      state.masterGain.connect(state.audioCtx.destination);
      state.engineOsc = state.audioCtx.createOscillator();
      state.engineOsc.type = 'sawtooth';
      state.engineOsc.frequency.value = 40;
      const engineGain = state.audioCtx.createGain();
      engineGain.gain.value = 0.5;
      state.engineOsc.connect(engineGain);
      engineGain.connect(state.masterGain);
      state.engineOsc.start();
    } catch (e) {}
  }
  if (state.audioCtx && state.audioCtx.state === 'suspended') state.audioCtx.resume();
}

function toggleMute() {
  state.muted = !state.muted;
  if (state.masterGain) state.masterGain.gain.value = state.muted ? 0 : 0.04;
  document.getElementById('muteBtn').textContent = state.muted ? 'Unmute' : 'Mute';
}

function updateAudio() {
  if (!state.audioCtx) return;
  const target = 40 + state.speed * 30;
  if (state.engineOsc) state.engineOsc.frequency.setTargetAtTime(target, state.audioCtx.currentTime, 0.1);
  if (state.masterGain) state.masterGain.gain.value = state.paused ? 0 : (state.muted ? 0 : 0.04);
}

function generateGalaxy() {
  const pos = new Float32Array(220000 * 3);
  const col = new Float32Array(220000 * 3);
  const size = new Float32Array(220000);
  let idx = 0;
  const addStar = (x, y, z, r, g, b, s) => {
    pos[idx * 3] = x; pos[idx * 3 + 1] = y; pos[idx * 3 + 2] = z;
    col[idx * 3] = r; col[idx * 3 + 1] = g; col[idx * 3 + 2] = b;
    size[idx] = s;
    idx++;
  };

  for (let i = 0; i < 30000; i++) {
    const r = 0.8 + Math.pow(Math.random(), 0.5) * 3;
    const th = Math.random() * Math.PI * 2;
    const x = Math.cos(th) * r, y = Math.sin(th) * r, z = (Math.random() - 0.5) * 2;
    const c = new THREE.Color(1.0, 0.65 + Math.random() * 0.2, 0.2 + Math.random() * 0.2);
    addStar(x, y, z, c.r, c.g, c.b, 1.5 + Math.random() * 2);
  }

  for (let i = 0; i < 8000; i++) {
    const x = -2.5 + Math.random() * 5;
    const y = (Math.random() - 0.5) * 1.5;
    const z = (Math.random() - 0.5) * 1.5;
    const c = new THREE.Color(1.0, 0.7, 0.3);
    addStar(x, y, z, c.r, c.g, c.b, 2 + Math.random() * 2);
  }

  for (let arm = 0; arm < 5; arm++) {
    const armAngle = arm * Math.PI * 2 + Math.PI / 5;
    const phase = Math.random() * Math.PI * 2;
    for (let i = 0; i < 24000; i++) {
      const t = Math.pow(Math.random(), 0.6);
      const r = 5 + t * 45;
      const th = armAngle + phase + t * t * Math.PI * 4;
      const x = Math.cos(th) * r;
      const y = Math.sin(th) * r;
      const z = (Math.random() - 0.5) * 2;
      const young = Math.random() < 0.7;
      const c = young ? new THREE.Color(0.6, 0.8, 1.0) : new THREE.Color(1.0, 0.7, 0.3);
      addStar(x, y, z, c.r, c.g, c.b, young ? 1 + Math.random() * 2 : 2 + Math.random() * 2);
    }
  }

  for (let i = 0; i < 20000; i++) {
    const r = 50 + Math.pow(Math.random(), 2) * 150;
    const th = Math.random() * Math.PI * 2;
    const x = Math.cos(th) * r;
    const y = Math.random() * 2;
    const z = Math.sin(th) * r;
    const c = new THREE.Color(0.3, 0.4, 0.8);
    addStar(x, y, z, c.r, c.g, c.b, 0.5 + Math.random());
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geometry.setAttribute('size', new THREE.BufferAttribute(size, 1));
  const material = new THREE.ShaderMaterial({
    uniforms: { uPixelRatio: { value: 1.0 }, uTime: { value: 0 }, uWarp: { value: 0 } },
    vertexShader: `
      attribute vec3 position;
      attribute vec3 color;
      attribute float size;
      uniform float uPixelRatio;
      uniform float uTime;
      uniform float uWarp;
      varying vec3 vColor;
      varying float vSize;
      varying float vWarp;
      void main() {
        vColor = color;
        vSize = size;
        vWarp = uWarp;
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mvPosition;
        float perspective = 300.0 / -mvPosition.z;
        gl_PointSize = vSize * uPixelRatio * perspective * (1.0 + uWarp);
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      varying float vSize;
      varying float vWarp;
      void main() {
        vec2 uv = gl_PointCoord - 0.5;
        float dist = length(uv);
        float alpha = smoothstep(0.5, 0.0, dist) * step(0.05, vSize);
        vec3 col = vColor * (1.0 + vWarp * 2.0);
        gl_FragColor = vec4(col, alpha);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });
  const points = new THREE.Points(geometry, material);
  points.frustumCulled = false;
  scene.add(points);
}

function generateBlackHole() {
  const group = new THREE.Group();
  const core = new THREE.Mesh(
    new THREE.SphereGeometry(0.3, 32, 32),
    new THREE.MeshBasicMaterial({ color: 0x000000 })
  );
  group.add(core);
  const disc = new THREE.Mesh(
    new THREE.RingGeometry(0.5, 2.0, 64),
    new THREE.MeshBasicMaterial({ color: 0xff5500, transparent: true, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false })
  );
  disc.rotation.x = Math.PI / 2;
  group.add(disc);
  const glowTex = makeGlowTexture();
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xffaa33, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  glow.scale.set(12, 12, 1);
  group.add(glow);
  scene.add(group);
}

function makeGlowTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  grad.addColorStop(0, 'rgba(255,220,160,1)');
  grad.addColorStop(0.2, 'rgba(255,120,40,0.6)');
  grad.addColorStop(0.5, 'rgba(180,40,80,0.2)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 256, 256);
  const tex = new THREE.CanvasTexture(canvas);
  return tex;
}

function generateNebula() {
  const nebulaPos = new THREE.Vector3(8, 2, 4);
  for (let i = 0; i < 6; i++) {
    const canvas = document.createElement('canvas');
    canvas.width = 128; canvas.height = 128;
    const ctx = canvas.getContext('2d');
    const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
    const colors = ['255,80,200', '180,40,255', '40,160,255', '255,40,120'];
    const col = colors[i % colors.length].split(',').map(Number);
    g.addColorStop(0, `rgba(${col[0]},${col[1]},${col[2]},0.8)`);
    g.addColorStop(0.4, `rgba(${col[0]},${col[1]},${col[2]},0.3)`);
    g.addColorStop(1, `rgba(${col[0]},${col[1]},${col[2]},0)`);
    g.fillStyle = g;
    g.fillRect(0, 0, 128, 128);
    const tex = new THREE.CanvasTexture(canvas);
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.8 }));
    sprite.position.copy(nebulaPos);
    sprite.scale.set(20 + Math.random() * 15, 20 + Math.random() * 15, 1);
    scene.add(sprite);
  }
}

function generateShip() {
  const group = new THREE.Group();
  const hullMat = new THREE.MeshStandardMaterial({ color: 0x8899aa, metalness: 0.8, roughness: 0.3 });
  const hull = new THREE.Mesh(new THREE.BoxGeometry(2, 1.2, 4), hullMat);
  hull.position.y = 0.6;
  group.add(hull);
  const deck = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.3, 3), new THREE.MeshStandardMaterial({ color: 0x223344, metalness: 0.6, roughness: 0.4 }));
  deck.position.y = 1.2;
  group.add(deck);
  const cockpit = new THREE.Mesh(new THREE.SphereGeometry(0.7, 24, 16), new THREE.MeshStandardMaterial({ color: 0x88ccff, metalness: 0.9, roughness: 0.1, transparent: true, opacity: 0.8, side: THREE.DoubleSide }));
  cockpit.position.set(0, 1.3, -0.5);
  cockpit.scale.set(1, 0.7, 1.2);
  group.add(cockpit);
  const engine1 = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.4, 1.2, 16), new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.7, roughness: 0.5 }));
  engine1.position.set(-0.8, 0.2, 2.2);
  engine1.rotation.z = Math.PI / 2;
  group.add(engine1);
  const engine2 = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.4, 1.2, 16), new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.7, roughness: 0.5 }));
  engine2.position.set(0.8, 0.2, 2.2);
  engine2.rotation.z = Math.PI / 2;
  group.add(engine2);
  const nozzle1 = new THREE.Mesh(new THREE.ConeGeometry(0.45, 1.0, 16), new THREE.MeshBasicMaterial({ color: 0xffaa33, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  nozzle1.position.set(-0.8, -0.2, 2.8);
  nozzle1.rotation.x = Math.PI / 2;
  group.add(nozzle1);
  const nozzle2 = new THREE.Mesh(new THREE.ConeGeometry(0.45, 1.0, 16), new THREE.MeshBasicMaterial({ color: 0xffaa33, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  nozzle2.position.set(0.8, -0.2, 2.8);
  nozzle2.rotation.x = Math.PI / 2;
  group.add(nozzle2);
  const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 2, 8), new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9, roughness: 0.2 }));
  antenna.position.set(0.8, 1.8, -0.5);
  antenna.rotation.z = Math.PI / 2;
  group.add(antenna);
  const red = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff2222 }));
  red.position.set(-0.9, 0.6, 0);
  group.add(red);
  const green = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), new THREE.MeshBasicMaterial({ color: 0x22ff44 }));
  green.position.set(0.9, 0.6, 0);
  group.add(green);
  const white = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  white.position.set(0, 0.9, -0.5);
  group.add(white);
  group.position.copy(state.shipPosition || new THREE.Vector3(10, 2, 0));
  group.traverse(o => { if (o.isMesh) o.castShadow = true; });
  scene.add(group);
  state.ship = group;
}

function generatePlanet() {
  const planet = new THREE.Mesh(
    new THREE.SphereGeometry(1.2, 48, 32),
    new THREE.MeshStandardMaterial({ color: 0x886644, metalness: 0.2, roughness: 0.8 })
  );
  planet.position.set(25, 2, 0);
  scene.add(planet);
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(1.6, 2.4, 64),
    new THREE.MeshBasicMaterial({ color: 0x998877, transparent: true, side: THREE.DoubleSide, opacity: 0.7 })
  );
  ring.rotation.x = Math.PI / 2;
  ring.position.copy(planet.position);
  scene.add(ring);
}

function updateCinematic(dt) {
  state.journeyTime += dt * state.speed;
  if (state.journeyTime > state.journeyDuration) state.journeyTime = 0;
  const t = state.journeyTime;
  const waypoints = [
    { t: 0, pos: [10, 2, 0], target: [10, 0, 0], fov: 70, phase: 'departure' },
    { t: 20, pos: [30, 5, -5], target: [30, 0, 0], fov: 75, phase: 'cruise' },
    { t: 40, pos: [60, 10, -10], target: [60, 0, 0], fov: 85, phase: 'warp' },
    { t: 60, pos: [150, 20, -30], target: [150, 0, 0], fov: 100, phase: 'deep' },
    { t: 80, pos: [30, 5, -10], target: [0, 0, 0], fov: 100, phase: 'core' },
    { t: 100, pos: [10, 2, 10], target: [5, 0, 5], fov: 80, phase: 'nebula' },
    { t: 130, pos: [20, 5, -5], target: [25, 0, 0], fov: 70, phase: 'arrival' },
  ];
  let wp = waypoints[0];
  for (const w of waypoints) if (t >= w.t) wp = w;
  const next = waypoints[Math.min(waypoints.indexOf(wp) + 1, waypoints.length - 1)];
  const localT = Math.min(1, (t - wp.t) / Math.max(0.0001, next.t - wp.t));
  const eased = localT * localT * (3 - 2 * localT);
  camera.position.lerpVectors(new THREE.Vector3(...wp.pos), new THREE.Vector3(...next.pos), eased);
  camera.lookAt(new THREE.Vector3(...next.target));
  camera.fov = THREE.MathUtils.lerp(wp.fov, next.fov, eased);
  camera.updateProjectionMatrix();
  state.phase = wp.phase;
  if (state.phase !== 'core') state.phase = wp.phase;
}

function updateChase(dt) {
  if (!state.ship) return;
  const offset = new THREE.Vector3(0, 4, 8);
  camera.position.copy(state.ship.position).add(offset);
  camera.lookAt(state.ship.position);
}

function updateCockpit(dt) {
  if (!state.ship) return;
  camera.position.copy(state.ship.position).add(new THREE.Vector3(0, 1.3, 1.5));
  camera.lookAt(state.ship.position.add(new THREE.Vector3(0, 1.2, 8)));
}

function updateGalaxyMap(dt) {
  if (state.controls) state.controls.update();
}

function update(dt) {
  if (!state.paused) {
    if (state.mode === 'cinematic') updateCinematic(dt);
    else if (state.mode === 'chase') updateChase(dt);
    else if (state.mode === 'cockpit') updateCockpit(dt);
  }
  if (state.mode === 'galaxy' && state.controls) state.controls.update();
  updateAudio();
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  if (state.mode === 'galaxy' && state.controls) {
    state.controls.target.set(0, 0, 0);
    state.controls.update();
  }
  composer.render();
  requestAnimationFrame(animate);
}

function updateHUD() {
  const dist = state.ship ? state.ship.position.length() * 1000 : 12400;
  state.distanceLy = dist;
  const speed = state.phase === 'warp' ? state.speed * 299792 : 0.08 * state.speed;
  state.speedKmS = speed;
  state.region = state.distanceLy > 50000 ? 'Outer Arm' : state.distanceLy > 20000 ? 'Perseus Arm' : state.distanceLy > 5000 ? 'Inner Arm' : 'Galactic Core';
  document.getElementById('region').textContent = state.region;
  document.getElementById('distance').textContent = Math.round(state.distanceLy).toLocaleString() + ' ly';
  document.getElementById('speed').textContent = speed.toExponential(2) + 'c';
  document.getElementById('eta').textContent = Math.max(0, Math.round(state.distanceLy / Math.max(0.01, speed) * 1000)).toLocaleString() + ' s';
  document.getElementById('camMode').textContent = state.mode;
  document.getElementById('shipSpeed').textContent = speed.toExponential(2) + 'c';
}

function onModeClick(e) {
  const btn = e.target.closest('button[data-mode]');
  if (!btn) return;
  state.mode = btn.dataset.mode;
  document.querySelectorAll('#modebar button').forEach(b => b.classList.toggle('active', b === btn));
  document.getElementById('camMode').textContent = state.mode;
  if (state.mode === 'galaxy') {
    camera.position.set(0, 80, 0);
    camera.fov = 70;
    camera.updateProjectionMatrix();
  }
}

function onPauseClick() {
  state.paused = !state.paused;
  document.getElementById('pauseBtn').textContent = state.paused ? 'Resume' : 'Pause';
}

function onSpeedClick() {
  const speeds = [0.5, 1, 2, 4];
  const idx = speeds.indexOf(state.speed);
  state.speed = speeds[(idx + 1) % speeds.length];
  document.getElementById('speedBtn').textContent = 'Speed: ' + state.speed + 'x';
}

function onMuteClick() {
  toggleMute();
}

function onHideUiClick() {
  state.uiHidden = !state.uiHidden;
  document.body.classList.toggle('ui-hidden', state.uiHidden);
  document.getElementById('controls').classList.toggle('hidden', state.uiHidden);
  document.getElementById('hud').style.display = state.uiHidden ? 'none' : 'block';
  document.getElementById('how').classList.toggle('hidden', state.uiHidden);
  document.getElementById('hideUiBtn').textContent = state.uiHidden ? 'Show UI' : 'Hide UI';
}

document.getElementById('pauseBtn').addEventListener('click', onPauseClick);
document.getElementById('speedBtn').addEventListener('click', onSpeedClick);
document.getElementById('muteBtn').addEventListener('click', onMuteClick);
document.getElementById('hideUiBtn').addEventListener('click', onHideUiClick);
document.getElementById('modebar').addEventListener('click', onModeClick);

function onPointerLock() {}
function onKeyDown(e) {
  if (e.code === 'Space') { e.preventDefault(); onPauseClick(); }
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') { state.speed = 4; document.getElementById('speedBtn').textContent = 'Speed: 4x'; }
}

window.addEventListener('keydown', onKeyDown);

function start() {
  loadingEl.classList.remove('hidden');
  const progressInterval = setInterval(() => {
    const p = Math.min(0.99, 0.2 + Math.random() * 0.7);
    loadBar.style.width = (p * 100) + '%';
    loadText.textContent = 'Generating galaxy... ' + Math.round(p * 100) + '%';
  }, 120);
  setTimeout(() => {
    clearInterval(progressInterval);
    loadBar.style.width = '100%';
    loadText.textContent = 'Ready';
    setTimeout(() => loadingEl.classList.add('hidden'), 300);
  }, 1800);
}

function initAll() {
  init();
  start();
}

if (!window.WebGLRenderingContext) {
  document.getElementById('loading').innerHTML = '<div style="color:#fff;padding:20px;text-align:center">WebGL is not available. Your browser or device does not support 3D rendering.</div>';
} else {
  initAll();
}

window.addEventListener('resize', onResize);
setTimeout(() => { if (renderer) animate(); }, 100);
</script>
</body>
</html>
