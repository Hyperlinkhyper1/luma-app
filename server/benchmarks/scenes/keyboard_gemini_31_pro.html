<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive 3D Mechanical Keyboard Showcase</title>
<style>
    :root {
        --u: 40px; /* Base unit size (1U) */
        --bg: #1a1a24;
        --text: #f0f0f0;
        
        /* Layer colors */
        --case-color: #d9d3c5;
        --pcb-color: #1b4028;
        --foam-color: #222222;
        --plate-color: #a3a7ab;
        
        /* Keycap Theme (Retro Dolch-ish) */
        --kc-alpha: #e2dfd3;
        --kc-alpha-txt: #333;
        --kc-mod: #676a6c;
        --kc-mod-txt: #e2dfd3;
        --kc-acc: #c25345;
        --kc-acc-txt: #fff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
        background: radial-gradient(circle at 50% 30%, #2a2a35, var(--bg));
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
        height: 100vh;
        user-select: none;
    }

    /* UI Overlay */
    #ui {
        position: absolute;
        top: 20px; left: 20px; right: 20px;
        display: flex;
        justify-content: space-between;
        z-index: 100;
        pointer-events: none;
    }
    .controls { pointer-events: auto; display: flex; gap: 10px; }
    button {
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.2);
        color: white;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        backdrop-filter: blur(4px);
        transition: all 0.2s;
        font-weight: 600;
    }
    button:hover { background: rgba(255,255,255,0.2); }
    button.active { background: var(--kc-acc); border-color: var(--kc-acc); }
    
    .hint {
        position: absolute;
        bottom: 20px; left: 50%;
        transform: translateX(-50%);
        opacity: 0.6;
        font-size: 14px;
        pointer-events: none;
    }

    #start-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 200;
        transition: opacity 0.5s;
    }
    #start-overlay button {
        font-size: 1.2rem;
        padding: 15px 30px;
        background: var(--kc-acc);
        border: none;
        box-shadow: 0 4px 15px rgba(194, 83, 69, 0.4);
    }

    /* 3D Scene Setup */
    #world {
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 2000px;
        cursor: grab;
    }
    #world:active { cursor: grabbing; }

    #scene {
        position: relative;
        transform-style: preserve-3d;
        /* Initial rotation set by JS */
        transition: transform 0.1s ease-out;
    }

    /* Shadow under keyboard */
    #shadow {
        position: absolute;
        width: calc(15 * var(--u));
        height: calc(5 * var(--u));
        background: rgba(0,0,0,0.8);
        filter: blur(30px);
        transform: translateZ(-20px);
    }

    /* CSS 3D Box Engine */
    .layer { position: absolute; transform-style: preserve-3d; inset: 0; }
    .box {
        position: absolute;
        transform-style: preserve-3d;
        /* transform applied inline */
    }
    
    .face {
        position: absolute;
        backface-visibility: hidden;
        border: 1px solid rgba(0,0,0,0.1);
        box-sizing: border-box;
    }

    /* Base face styling relative to box dimensions */
    .face.bottom { width: 100%; height: 100%; transform: translateZ(0) rotateY(180deg); }
    .face.top    { width: 100%; height: 100%; transform: translateZ(var(--d)); }
    .face.front  { width: 100%; height: var(--d); bottom: 0; transform-origin: bottom; transform: rotateX(-90deg); }
    .face.back   { width: 100%; height: var(--d); top: 0; transform-origin: top; transform: rotateX(90deg); }
    .face.left   { width: var(--d); height: 100%; left: 0; transform-origin: left; transform: rotateY(-90deg); }
    .face.right  { width: var(--d); height: 100%; right: 0; transform-origin: right; transform: rotateY(90deg); }

    /* Lighting simulation via brightness filters */
    .face.top    { filter: brightness(1.1); }
    .face.front  { filter: brightness(0.85); }
    .face.back   { filter: brightness(0.95); }
    .face.left   { filter: brightness(0.9); }
    .face.right  { filter: brightness(0.75); }
    .face.bottom { filter: brightness(0.5); }

    /* Component Specific Styles */
    .case-part .face { background: var(--case-color); }
    .pcb-part .face { background: var(--pcb-color); }
    .pcb-part .face.top {
        background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(212,175,55,0.1) 10px, rgba(212,175,55,0.1) 12px);
    }
    .foam-part .face { background: var(--foam-color); border: none; }
    .plate-part .face { background: var(--plate-color); }
    
    /* Switches */
    .switch-part .face.bottom, .switch-part .face.left, .switch-part .face.right, .switch-part .face.front, .switch-part .face.back {
        background: rgba(40,40,40,0.9);
    }
    .switch-part .face.top {
        background: rgba(220,220,230,0.8);
        border: 1px solid rgba(0,0,0,0.2);
        display: flex; justify-content: center; align-items: center;
    }
    .switch-stem {
        width: 4px; height: 4px; background: #c00; border-radius: 1px;
    }

    /* Keycaps */
    .keycap-part { cursor: pointer; }
    .keycap-part .face { border-color: rgba(0,0,0,0.15); }
    .keycap-part .face.top {
        display: flex; justify-content: center; align-items: center;
        font-size: 11px; font-weight: 700;
        /* Simulate scoop */
        box-shadow: inset 0 3px 6px rgba(255,255,255,0.4), inset 0 -3px 6px rgba(0,0,0,0.15);
        border: 2px solid rgba(0,0,0,0.05);
        border-radius: 4px;
        padding: 2px 4px;
    }

    /* Color Groups */
    .kc-alpha .face { background: var(--kc-alpha); color: var(--kc-alpha-txt); }
    .kc-mod .face { background: var(--kc-mod); color: var(--kc-mod-txt); }
    .kc-acc .face { background: var(--kc-acc); color: var(--kc-acc-txt); }

    /* Animations */
    .anim-drop {
        transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease-in !important;
    }
    .anim-start {
        transform: translateZ(calc(var(--tz) + 800px)) !important;
        opacity: 0 !important;
        pointer-events: none;
    }
    
    /* Typing Interaction */
    .keycap-part { transition: transform 0.08s ease-out; }
    .keycap-part.pressed {
        transform: translateZ(calc(var(--tz) - 4px)) !important;
    }

</style>
</head>
<body>

<div id="start-overlay">
    <button id="btn-start">Click to Assemble & Enable Audio</button>
</div>

<div id="ui">
    <div style="font-weight: bold; letter-spacing: 1px;">60% MECHANICAL</div>
    <div class="controls">
        <button id="btn-replay">Replay Assembly</button>
        <button id="btn-mute">Mute</button>
    </div>
</div>
<div class="hint">Drag to rotate • Type to test • Scroll to zoom</div>

<div id="world">
    <div id="scene" style="width: 600px; height: 200px;">
        <div id="shadow"></div>
        <div id="layer-case" class="layer"></div>
        <div id="layer-pcb" class="layer"></div>
        <div id="layer-foam" class="layer"></div>
        <div id="layer-plate" class="layer"></div>
        <div id="layer-switches" class="layer"></div>
        <div id="layer-keycaps" class="layer"></div>
    </div>
</div>

<script>
    // --- Layout Definition (60% ANSI) ---
    const U = 40;
    const layout = [
        [{c:'Escape',l:'Esc',w:1,g:'kc-acc',s:'mod'}, {c:'Digit1',l:'1',w:1,g:'kc-alpha'}, {c:'Digit2',l:'2',w:1,g:'kc-alpha'}, {c:'Digit3',l:'3',w:1,g:'kc-alpha'}, {c:'Digit4',l:'4',w:1,g:'kc-alpha'}, {c:'Digit5',l:'5',w:1,g:'kc-alpha'}, {c:'Digit6',l:'6',w:1,g:'kc-alpha'}, {c:'Digit7',l:'7',w:1,g:'kc-alpha'}, {c:'Digit8',l:'8',w:1,g:'kc-alpha'}, {c:'Digit9',l:'9',w:1,g:'kc-alpha'}, {c:'Digit0',l:'0',w:1,g:'kc-alpha'}, {c:'Minus',l:'-',w:1,g:'kc-alpha'}, {c:'Equal',l:'=',w:1,g:'kc-alpha'}, {c:'Backspace',l:'Backspace',w:2,g:'kc-mod',s:'mod'}],
        [{c:'Tab',l:'Tab',w:1.5,g:'kc-mod',s:'mod'}, {c:'KeyQ',l:'Q',w:1,g:'kc-alpha'}, {c:'KeyW',l:'W',w:1,g:'kc-alpha'}, {c:'KeyE',l:'E',w:1,g:'kc-alpha'}, {c:'KeyR',l:'R',w:1,g:'kc-alpha'}, {c:'KeyT',l:'T',w:1,g:'kc-alpha'}, {c:'KeyY',l:'Y',w:1,g:'kc-alpha'}, {c:'KeyU',l:'U',w:1,g:'kc-alpha'}, {c:'KeyI',l:'I',w:1,g:'kc-alpha'}, {c:'KeyO',l:'O',w:1,g:'kc-alpha'}, {c:'KeyP',l:'P',w:1,g:'kc-alpha'}, {c:'BracketLeft',l:'[',w:1,g:'kc-alpha'}, {c:'BracketRight',l:']',w:1,g:'kc-alpha'}, {c:'Backslash',l:'\\',w:1.5,g:'kc-alpha'}],
        [{c:'CapsLock',l:'Caps',w:1.75,g:'kc-mod',s:'mod'}, {c:'KeyA',l:'A',w:1,g:'kc-alpha'}, {c:'KeyS',l:'S',w:1,g:'kc-alpha'}, {c:'KeyD',l:'D',w:1,g:'kc-alpha'}, {c:'KeyF',l:'F',w:1,g:'kc-alpha'}, {c:'KeyG',l:'G',w:1,g:'kc-alpha'}, {c:'KeyH',l:'H',w:1,g:'kc-alpha'}, {c:'KeyJ',l:'J',w:1,g:'kc-alpha'}, {c:'KeyK',l:'K',w:1,g:'kc-alpha'}, {c:'KeyL',l:'L',w:1,g:'kc-alpha'}, {c:'Semicolon',l:';',w:1,g:'kc-alpha'}, {c:'Quote',l:'\'',w:1,g:'kc-alpha'}, {c:'Enter',l:'Enter',w:2.25,g:'kc-acc',s:'enter'}],
        [{c:'ShiftLeft',l:'Shift',w:2.25,g:'kc-mod',s:'mod'}, {c:'KeyZ',l:'Z',w:1,g:'kc-alpha'}, {c:'KeyX',l:'X',w:1,g:'kc-alpha'}, {c:'KeyC',l:'C',w:1,g:'kc-alpha'}, {c:'KeyV',l:'V',w:1,g:'kc-alpha'}, {c:'KeyB',l:'B',w:1,g:'kc-alpha'}, {c:'KeyN',l:'N',w:1,g:'kc-alpha'}, {c:'KeyM',l:'M',w:1,g:'kc-alpha'}, {c:'Comma',l:',',w:1,g:'kc-alpha'}, {c:'Period',l:'.',w:1,g:'kc-alpha'}, {c:'Slash',l:'/',w:1,g:'kc-alpha'}, {c:'ShiftRight',l:'Shift',w:2.75,g:'kc-mod',s:'mod'}],
        [{c:'ControlLeft',l:'Ctrl',w:1.25,g:'kc-mod',s:'mod'}, {c:'MetaLeft',l:'Win',w:1.25,g:'kc-mod',s:'mod'}, {c:'AltLeft',l:'Alt',w:1.25,g:'kc-mod',s:'mod'}, {c:'Space',l:'',w:6.25,g:'kc-alpha',s:'space'}, {c:'AltRight',l:'Alt',w:1.25,g:'kc-mod',s:'mod'}, {c:'MetaRight',l:'Win',w:1.25,g:'kc-mod',s:'mod'}, {c:'ContextMenu',l:'Menu',w:1.25,g:'kc-mod',s:'mod'}, {c:'ControlRight',l:'Ctrl',w:1.25,g:'kc-mod',s:'mod'}]
    ];

    // --- State & DOM References ---
    const scene = document.getElementById('scene');
    const keyMap = new Map(); // code -> DOM element
    const allAnimElements = [];
    
    let isAssembling = false;
    let muted = false;
    
    // Camera state
    let rotX = 55, rotZ = 20, zoom = 1;
    let isDragging = false, lastMouseX, lastMouseY;

    // --- 3D Builder Engine ---
    function createBox(parent, className, w, h, d, x, y, z, innerHTML = '') {
        const box = document.createElement('div');
        box.className = `box ${className}`;
        box.style.width = `${w}px`;
        box.style.height = `${h}px`;
        box.style.left = `${x}px`;
        box.style.top = `${y}px`;
        box.style.setProperty('--d', `${d}px`);
        box.style.setProperty('--tz', `${z}px`);
        box.style.transform = `translateZ(${z}px)`;
        
        const faces = ['bottom', 'top', 'front', 'back', 'left', 'right'];
        faces.forEach(face => {
            const f = document.createElement('div');
            f.className = `face ${face}`;
            if (face === 'top') f.innerHTML = innerHTML;
            box.appendChild(f);
        });
        
        parent.appendChild(box);
        allAnimElements.push(box);
        return box;
    }

    function buildKeyboard() {
        const boardW = 15 * U; // 600
        const boardH = 5 * U;  // 200
        const margin = 10;
        
        // 1. Case (Hollow tray) Base Z=0
        const lCase = document.getElementById('layer-case');
        createBox(lCase, 'case-part', boardW, boardH, 6, 0, 0, 0); // Floor
        createBox(lCase, 'case-part', boardW, margin, 20, 0, 0, 6); // Top wall
        createBox(lCase, 'case-part', boardW, margin, 20, 0, boardH-margin, 6); // Bottom wall
        createBox(lCase, 'case-part', margin, boardH-margin*2, 20, 0, margin, 6); // Left wall
        createBox(lCase, 'case-part', margin, boardH-margin*2, 20, boardW-margin, margin, 6); // Right wall

        // 2. PCB Z=8
        const lPcb = document.getElementById('layer-pcb');
        createBox(lPcb, 'pcb-part', boardW - margin*2, boardH - margin*2, 2, margin, margin, 8);

        // 3. Foam Z=10
        const lFoam = document.getElementById('layer-foam');
        createBox(lFoam, 'foam-part', boardW - margin*2, boardH - margin*2, 3, margin, margin, 10);

        // 4. Plate Z=13
        const lPlate = document.getElementById('layer-plate');
        createBox(lPlate, 'plate-part', boardW - margin*2, boardH - margin*2, 2, margin, margin, 13);

        // 5 & 6. Switches & Keycaps
        const lSwitches = document.getElementById('layer-switches');
        const lKeycaps = document.getElementById('layer-keycaps');
        
        let currentY = 0;
        layout.forEach(row => {
            let currentX = 0;
            row.forEach(key => {
                const keyW = key.w * U;
                const keyH = U;
                
                // Switch (Z=15)
                const swSize = 14;
                const swX = currentX + keyW/2 - swSize/2;
                const swY = currentY + keyH/2 - swSize/2;
                createBox(lSwitches, 'switch-part', swSize, swSize, 12, swX, swY, 15, '<div class="switch-stem"></div>');
                
                // Keycap (Z=27)
                const pad = 2;
                const capW = keyW - pad*2;
                const capH = keyH - pad*2;
                const capX = currentX + pad;
                const capY = currentY + pad;
                
                const cap = createBox(lKeycaps, `keycap-part ${key.g}`, capW, capH, 12, capX, capY, 27, key.l);
                cap.dataset.code = key.c;
                cap.dataset.sound = key.s || 'normal';
                
                // Interaction on DOM element
                cap.addEventListener('mousedown', () => pressKey(cap));
                cap.addEventListener('mouseup', () => releaseKey(cap));
                cap.addEventListener('mouseleave', () => releaseKey(cap));
                
                keyMap.set(key.c, cap);
                currentX += keyW;
            });
            currentY += U;
        });
    }

    // --- Audio Synthesizer ---
    let audioCtx;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        if (muted || !audioCtx) return;
        
        const t = audioCtx.currentTime;
        
        // Oscillator for tonal body (thock/clack)
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        // Noise buffer for the mechanical scratch/click
        const bufferSize = audioCtx.sampleRate * 0.05;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for(let i=0; i<bufferSize; i++) data[i] = Math.random() * 2 - 1;
        
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const noiseFilter = audioCtx.createBiquadFilter();
        noiseFilter.type = 'bandpass';
        const noiseGain = audioCtx.createGain();
        
        noise.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);

        // Sound profiles
        let freq = 600, decay = 0.04, noiseFreq = 3500, noiseDecay = 0.015, vol = 0.4;
        
        if (type === 'space') {
            freq = 200; decay = 0.08; noiseFreq = 1200; vol = 0.6;
        } else if (type === 'enter') {
            freq = 300; decay = 0.06; noiseFreq = 2000; vol = 0.5;
        } else if (type === 'mod') {
            freq = 400; decay = 0.05; noiseFreq = 2500; vol = 0.45;
        }

        // Tone envelope
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, t);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.4, t + decay);
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(vol, t + 0.002);
        gain.gain.exponentialRampToValueAtTime(0.001, t + decay);

        // Noise envelope
        noiseFilter.frequency.value = noiseFreq;
        noiseFilter.Q.value = 1;
        noiseGain.gain.setValueAtTime(0, t);
        noiseGain.gain.linearRampToValueAtTime(vol * 0.6, t + 0.001);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, t + noiseDecay);

        osc.start(t); osc.stop(t + decay);
        noise.start(t); noise.stop(t + noiseDecay);
    }

    // --- Interactions ---
    function pressKey(cap) {
        if (!cap || cap.classList.contains('pressed') || isAssembling) return;
        cap.classList.add('pressed');
        playSound(cap.dataset.sound);
    }

    function releaseKey(cap) {
        if (cap) cap.classList.remove('pressed');
    }

    window.addEventListener('keydown', e => {
        if (e.repeat) return;
        // Map common physical differences
        let code = e.code;
        if(code === 'IntlBackslash' || code === 'Enter') code = 'Enter'; // Handle ISO enter roughly
        pressKey(keyMap.get(code));
    });
    
    window.addEventListener('keyup', e => {
        let code = e.code;
        if(code === 'IntlBackslash') code = 'Enter';
        releaseKey(keyMap.get(code));
    });

    // --- Animation Sequence ---
    const delay = ms => new Promise(r => setTimeout(r, ms));

    async function runAssemblyAnimation() {
        if (isAssembling) return;
        isAssembling = true;

        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        
        // Reset state
        allAnimElements.forEach(el => {
            el.classList.add('anim-drop');
            el.classList.add('anim-start');
        });

        // Force reflow
        void scene.offsetWidth;
        
        if (prefersReducedMotion) {
            allAnimElements.forEach(el => el.classList.remove('anim-start'));
            await delay(600);
        } else {
            // Group by layers
            const drop = async (selector, ms) => {
                const els = Array.from(document.querySelectorAll(selector));
                for(let el of els) {
                    el.classList.remove('anim-start');
                    if(ms) await delay(ms);
                }
                if(!ms) await delay(400); // Layer gap
            };

            await delay(300);
            await drop('.case-part', 0);
            await drop('.pcb-part', 0);
            await drop('.foam-part', 0);
            await drop('.plate-part', 0);
            
            // Fast cascade for switches and keycaps
            await drop('.switch-part', 15);
            await delay(200);
            await drop('.keycap-part', 20);
            
            await delay(600); // Wait for final transition
        }

        // Cleanup drop animation classes so typing is fast
        allAnimElements.forEach(el => el.classList.remove('anim-drop'));
        isAssembling = false;
    }

    // --- Camera Control ---
    function updateCamera() {
        scene.style.transform = `scale(${zoom}) rotateX(${rotX}deg) rotateZ(${rotZ}deg)`;
    }

    document.addEventListener('mousedown', e => {
        if(e.target.closest('#ui') || e.target.closest('#start-overlay') || e.target.closest('.keycap-part')) return;
        isDragging = true;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
    });
    
    document.addEventListener('mouseup', () => isDragging = false);
    
    document.addEventListener('mousemove', e => {
        if(!isDragging) return;
        let dx = e.clientX - lastMouseX;
        let dy = e.clientY - lastMouseY;
        
        rotZ += dx * 0.4;
        rotX -= dy * 0.4;
        rotX = Math.max(0, Math.min(80, rotX)); // Clamp tilt
        
        updateCamera();
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
    });

    document.addEventListener('wheel', e => {
        zoom += e.deltaY * -0.001;
        zoom = Math.max(0.5, Math.min(2, zoom));
        updateCamera();
    }, {passive: true});

    // Auto-scale on load
    function handleResize() {
        if (window.innerWidth < 800) {
            zoom = window.innerWidth / 800;
            updateCamera();
        }
    }
    window.addEventListener('resize', handleResize);

    // --- Initialization ---
    buildKeyboard();
    handleResize();
    updateCamera();
    
    // Set initial positions off-screen
    allAnimElements.forEach(el => el.classList.add('anim-start'));

    document.getElementById('btn-start').addEventListener('click', () => {
        initAudio();
        document.getElementById('start-overlay').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('start-overlay').style.display = 'none';
            runAssemblyAnimation();
        }, 500);
    });

    document.getElementById('btn-replay').addEventListener('click', runAssemblyAnimation);
    
    const btnMute = document.getElementById('btn-mute');
    btnMute.addEventListener('click', () => {
        muted = !muted;
        btnMute.classList.toggle('active', muted);
        btnMute.innerText = muted ? "Unmute" : "Mute";
    });

    // Prevent context menu on right click dragging
    document.addEventListener('contextmenu', e => e.preventDefault());

</script>
</body>
</html>
