<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aether PC - 3D Desktop Builder</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; font-family: 'Segoe UI', system-ui, sans-serif; color: #e0e0e0; }
        #scene { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
        
        /* HUD Panel */
        #hud {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 280px;
            background: rgba(15, 15, 25, 0.85);
            border: 1px solid rgba(100, 120, 200, 0.3);
            border-radius: 12px;
            padding: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            z-index: 100;
            transition: transform 0.3s ease;
        }
        #hud h3 {
            font-size: 14px;
            margin-bottom: 12px;
            color: #8ab4f8;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(100, 120, 200, 0.2);
            padding-bottom: 8px;
        }
        .control-group { margin-bottom: 16px; }
        .control-group label {
            display: block;
            font-size: 11px;
            color: #888;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .btn {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background: linear-gradient(145deg, #1e1e2e, #2a2a3e);
            border: 1px solid #444;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:hover { background: linear-gradient(145deg, #2a2a3e, #3a3a4e); border-color: #555; }
        .btn:active { transform: scale(0.96); }
        .btn.power { background: linear-gradient(145deg, #2a1a1a, #3a1a1a); border-color: #5a2a2a; color: #ffaaaa; }
        .btn.power.on { background: linear-gradient(145deg, #1a2a1a, #2a3a2a); border-color: #2a5a2a; color: #aaffaa; }
        
        .color-picker {
            width: 100%;
            height: 40px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #111;
            overflow: hidden;
            cursor: pointer;
        }
        .color-picker input { width: 100%; height: 100%; border: none; background: none; cursor: pointer; }
        
        .slider-container { display: flex; align-items: center; gap: 10px; }
        .slider-container input[type="range"] { flex: 1; accent-color: #6a8cff; }
        .slider-container span { font-size: 12px; width: 40px; text-align: right; color: #aaa; }
        
        .toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 8px;
        }
        .switch {
            width: 36px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            position: relative;
            cursor: pointer;
            transition: background 0.2s;
        }
        .switch::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: #aaa;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: transform 0.2s, background 0.2s;
        }
        .switch.on { background: #4a6cff; }
        .switch.on::after { transform: translateX(16px); background: #fff; }
        
        .preset-colors {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .preset {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .preset:hover { transform: scale(1.1); }
        
        .status {
            font-size: 11px;
            color: #666;
            margin-top: 10px;
            text-align: center;
            min-height: 16px;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #8ab4f8;
            font-size: 18px;
            z-index: 1000;
            background: rgba(0,0,0,0.7);
            padding: 20px 40px;
            border-radius: 8px;
        }
        
        /* Tooltip */
        .tooltip {
            position: absolute;
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 11px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 1001;
            border: 1px solid #444;
        }
    </style>
</head>
<body>
    <canvas id="scene"></canvas>
    
    <div id="loading">Initializing Aether PC...</div>
    
    <div id="hud">
        <h3>Aether Control</h3>
        
        <div class="control-group">
            <button class="btn power" id="powerBtn">
                <span id="powerText">POWER ON</span>
            </button>
            <div class="status" id="status">System Standby</div>
        </div>
        
        <div class="control-group">
            <label>RGB Lighting</label>
            <div class="color-picker">
                <input type="color" id="rgbColor" value="#6a8cff">
            </div>
            <div class="preset-colors">
                <div class="preset" style="background:#ff3b30" data-color="#ff3b30"></div>
                <div class="preset" style="background:#30ff3b" data-color="#30ff3b"></div>
                <div class="preset" style="background:#3b8cff" data-color="#3b8cff"></div>
                <div class="preset" style="background:#ff3bf0" data-color="#ff3bf0"></div>
                <div class="preset" style="background:#f0ff3b" data-color="#f0ff3b"></div>
                <div class="preset" style="background:#ffffff" data-color="#ffffff"></div>
            </div>
        </div>
        
        <div class="control-group">
            <label>Fan Speed</label>
            <div class="slider-container">
                <input type="range" id="fanSpeed" min="0" max="100" value="70">
                <span id="fanValue">70%</span>
            </div>
        </div>
        
        <div class="control-group">
            <label>CPU Cooling</label>
            <div class="toggle">
                <span>Liquid Loop</span>
                <div class="switch on" id="coolingToggle"></div>
            </div>
        </div>
        
        <div class="control-group">
            <label>Display Effects</label>
            <div class="toggle">
                <span>Screen Glow</span>
                <div class="switch on" id="glowToggle"></div>
            </div>
        </div>
        
        <div class="control-group">
            <label>Case Ambience</label>
            <div class="slider-container">
                <input type="range" id="ambience" min="0" max="100" value="30">
                <span id="ambienceValue">30%</span>
            </div>
        </div>
    </div>
    
    <div class="tooltip" id="tooltip"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';

        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

        // Scene Setup
        const canvas = document.getElementById('scene');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0f);
        scene.fog = new THREE.FogExp2(0x0a0a0f, 0.015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 6, 10);

        const controls = new OrbitControls(camera, canvas);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 5;
        controls.maxDistance = 30;
        controls.maxPolarAngle = Math.PI * 0.85;
        controls.target.set(0, 1, 0);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404060, 0.4);
        scene.add(ambientLight);

        const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
        keyLight.position.set(10, 15, 10);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.set(2048, 2048);
        keyLight.shadow.camera.near = 1;
        keyLight.shadow.camera.far = 50;
        keyLight.shadow.camera.left = -15;
        keyLight.shadow.camera.right = 15;
        keyLight.shadow.camera.top = 15;
        keyLight.shadow.camera.bottom = -15;
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0x4060ff, 0.3);
        fillLight.position.set(-10, 5, -10);
        scene.add(fillLight);

        const rimLight = new THREE.PointLight(0x6a8cff, 0.5, 50);
        rimLight.position.set(-5, 2, -5);
        scene.add(rimLight);

        // Post-processing
        const composer = new EffectComposer(renderer);
        // three.js ships no PixelatedShader; the scene renders directly instead.

        // PC Group
        const pcGroup = new THREE.Group();
        scene.add(pcGroup);

        // Materials
        const materials = {
            caseMetal: new THREE.MeshStandardMaterial({ 
                color: 0x1a1a2e, 
                metalness: 0.8, 
                roughness: 0.3,
                emissive: 0x000000,
                emissiveIntensity: 0
            }),
            caseAccent: new THREE.MeshStandardMaterial({
                color: 0x2a2a4a,
                metalness: 0.6,
                roughness: 0.4
            }),
            glass: new THREE.MeshStandardMaterial({
                color: 0x88ccff,
                transparent: true,
                opacity: 0.15,
                roughness: 0.05,
                metalness: 0.9
            }),
            motherboard: new THREE.MeshStandardMaterial({
                color: 0x0a1a2a,
                metalness: 0.3,
                roughness: 0.7
            }),
            heatsink: new THREE.MeshStandardMaterial({
                color: 0x333344,
                metalness: 0.9,
                roughness: 0.2
            }),
            rgbEmissive: new THREE.MeshStandardMaterial({
                color: 0x6a8cff,
                emissive: 0x6a8cff,
                emissiveIntensity: 0,
                metalness: 0.5,
                roughness: 0.3
            }),
            cable: new THREE.MeshStandardMaterial({
                color: 0x222222,
                roughness: 0.8,
                metalness: 0.1
            }),
            screen: new THREE.MeshStandardMaterial({
                color: 0x001122,
                emissive: 0x001133,
                emissiveIntensity: 0,
                transparent: true,
                opacity: 0.9
            })
        };

        // Geometry Builders
        function buildCase() {
            // Main chassis
            const caseGeo = new THREE.BoxGeometry(6, 5, 2.5);
            const caseMesh = new THREE.Mesh(caseGeo, materials.caseMetal);
            caseMesh.castShadow = true;
            caseMesh.receiveShadow = true;
            pcGroup.add(caseMesh);

            // Front panel glass
            const glassGeo = new THREE.PlaneGeometry(5.8, 4.8);
            const glassMesh = new THREE.Mesh(glassGeo, materials.glass);
            glassMesh.position.z = 1.26;
            glassMesh.rotation.y = Math.PI;
            pcGroup.add(glassMesh);

            // Side panel (transparent)
            const sideGeo = new THREE.PlaneGeometry(2.4, 4.8);
            const sideMesh = new THREE.Mesh(sideGeo, materials.glass);
            sideMesh.position.x = 3.01;
            sideMesh.rotation.y = Math.PI / 2;
            pcGroup.add(sideMesh);

            // Top ventilation
            for (let i = 0; i < 8; i++) {
                const ventGeo = new THREE.BoxGeometry(0.6, 0.05, 1.8);
                const ventMesh = new THREE.Mesh(ventGeo, materials.caseAccent);
                ventMesh.position.y = 2.51;
                ventMesh.position.z = (i - 3.5) * 0.7;
                pcGroup.add(ventMesh);
            }

            // Feet
            for (let x = -2.5; x <= 2.5; x += 5) {
                for (let z = -1; z <= 1; z += 2) {
                    const footGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.2, 16);
                    const footMesh = new THREE.Mesh(footGeo, materials.heatsink);
                    footMesh.position.set(x, -2.6, z);
                    pcGroup.add(footMesh);
                }
            }
        }

        function buildMotherboard() {
            const mbGroup = new THREE.Group();
            mbGroup.position.y = -0.5;
            mbGroup.position.z = -0.2;
            pcGroup.add(mbGroup);

            // PCB
            const pcbGeo = new THREE.BoxGeometry(4.5, 0.1, 2.2);
            const pcb = new THREE.Mesh(pcbGeo, materials.motherboard);
            pcb.position.y = 0.1;
            mbGroup.add(pcb);

            // CPU Socket & Cooler
            const cpuGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.4, 32);
            const cpu = new THREE.Mesh(cpuGeo, materials.heatsink);
            cpu.position.set(0, 0.3, 0.3);
            cpu.rotation.x = Math.PI / 2;
            mbGroup.add(cpu);

            // CPU Pump
            const pumpGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.1, 16);
            const pump = new THREE.Mesh(pumpGeo, materials.caseAccent);
            pump.position.set(0, 0.5, 0.3);
            mbGroup.add(pump);

            // RAM Sticks
            for (let i = 0; i < 4; i++) {
                const ramGeo = new THREE.BoxGeometry(0.2, 0.5, 0.8);
                const ram = new THREE.Mesh(ramGeo, materials.rgbEmissive);
                ram.position.set(-1.2 + i * 0.8, 0.35, -0.8);
                ram.castShadow = true;
                mbGroup.add(ram);
            }

            // VRM Heatsinks
            for (let i = 0; i < 3; i++) {
                const vrmGeo = new THREE.BoxGeometry(0.4, 0.2, 0.6);
                const vrm = new THREE.Mesh(vrmGeo, materials.heatsink);
                vrm.position.set(1.5, 0.2, -0.5 + i * 0.5);
                mbGroup.add(vrm);
            }

            // M.2 Drives
            for (let i = 0; i < 2; i++) {
                const m2Geo = new THREE.BoxGeometry(0.3, 0.05, 0.8);
                const m2 = new THREE.Mesh(m2Geo, materials.heatsink);
                m2.position.set(1.8, 0.15, 0.5 - i * 1.2);
                mbGroup.add(m2);
            }
        }

        function buildGPU() {
            const gpuGroup = new THREE.Group();
            gpuGroup.position.set(0, -0.2, -0.8);
            gpuGroup.rotation.x = Math.PI / 2;
            pcGroup.add(gpuGroup);

            // GPU PCB
            const pcbGeo = new THREE.BoxGeometry(3.2, 0.2, 1.2);
            const pcb = new THREE.Mesh(pcbGeo, materials.motherboard);
            gpuGroup.add(pcb);

            // GPU Shroud
            const shroudGeo = new THREE.BoxGeometry(3.4, 0.6, 1.4);
            const shroud = new THREE.Mesh(shroudGeo, materials.caseAccent);
            shroud.position.y = 0.2;
            gpuGroup.add(shroud);

            // Fans
            for (let i = 0; i < 3; i++) {
                const fanGroup = new THREE.Group();
                fanGroup.position.set(-1 + i, 0.4, 0);
                
                const fanRingGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 32);
                const fanRing = new THREE.Mesh(fanRingGeo, materials.heatsink);
                fanRing.rotation.x = Math.PI / 2;
                fanGroup.add(fanRing);

                const bladeGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.02, 8);
                const blade = new THREE.Mesh(bladeGeo, materials.rgbEmissive);
                blade.rotation.x = Math.PI / 2;
                fanGroup.add(blade);
                
                gpuGroup.add(fanGroup);
            }

            // Backplate
            const backGeo = new THREE.BoxGeometry(3.2, 0.1, 1.2);
            const back = new THREE.Mesh(backGeo, materials.heatsink);
            back.position.y = -0.3;
            gpuGroup.add(back);
        }

        function buildCooling() {
            // Case Fans
            const fanPositions = [
                { pos: [0, 2.3, 1.2], rot: [Math.PI/2, 0, 0] }, // Front
                { pos: [0, 2.3, -1.2], rot: [Math.PI/2, 0, Math.PI] }, // Back
                { pos: [2.5, 1.5, 0], rot: [0, Math.PI/2, 0] }, // Side
                { pos: [-2.5, 1.5, 0], rot: [0, -Math.PI/2, 0] }  // Side
            ];

            fanPositions.forEach((fp, index) => {
                const fanGroup = new THREE.Group();
                fanGroup.position.set(...fp.pos);
                fanGroup.rotation.set(...fp.rot);
                
                const ringGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.1, 32);
                const ring = new THREE.Mesh(ringGeo, materials.heatsink);
                fanGroup.add(ring);

                const bladeGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.02, 8);
                const blade = new THREE.Mesh(bladeGeo, materials.rgbEmissive);
                fanGroup.add(blade);
                
                pcGroup.add(fanGroup);
                
                // Store for animation
                fanData.push({ group: fanGroup, blade: blade, speed: 0.7 });
            });

            // Radiator
            const radGroup = new THREE.Group();
            radGroup.position.set(0, 1.8, -1.2);
            pcGroup.add(radGroup);

            const radGeo = new THREE.BoxGeometry(2.5, 0.3, 0.6);
            const rad = new THREE.Mesh(radGeo, materials.heatsink);
            radGroup.add(rad);

            // Fins
            for (let i = 0; i < 20; i++) {
                const finGeo = new THREE.BoxGeometry(2.4, 0.02, 0.02);
                const fin = new THREE.Mesh(finGeo, materials.heatsink);
                fin.position.y = 0.15 - i * 0.015;
                radGroup.add(fin);
            }
        }

        function buildCables() {
            // Power Supply
            const psuGroup = new THREE.Group();
            psuGroup.position.set(0, -1.5, 1);
            pcGroup.add(psuGroup);

            const psuGeo = new THREE.BoxGeometry(4, 0.8, 1.2);
            const psu = new THREE.Mesh(psuGeo, materials.caseAccent);
            psu.castShadow = true;
            psuGroup.add(psu);

            // Fan on PSU
            const psuFanGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.1, 16);
            const psuFan = new THREE.Mesh(psuFanGeo, materials.rgbEmissive);
            psuFan.position.set(1.5, 0.4, 0.6);
            psuFan.rotation.x = Math.PI / 2;
            psuGroup.add(psuFan);

            // Cables
            const cablePaths = [
                { from: [0, -1.2, 1.2], to: [0, -0.3, 0.3] }, // 24-pin
                { from: [0, -1.2, 1.2], to: [0, 0.3, -0.8] }, // CPU
                { from: [0, -1.2, 1.2], to: [0, -0.2, -0.8] }, // GPU
            ];

            cablePaths.forEach(path => {
                const curve = new THREE.CatmullRomCurve3([
                    new THREE.Vector3(...path.from),
                    new THREE.Vector3(path.from[0], path.from[1] - 0.5, path.from[2]),
                    new THREE.Vector3(path.to[0], path.to[1] + 0.5, path.to[2]),
                    new THREE.Vector3(...path.to)
                ]);
                
                const tubeGeo = new THREE.TubeGeometry(curve, 20, 0.03, 8);
                const tube = new THREE.Mesh(tubeGeo, materials.cable);
                tube.castShadow = true;
                pcGroup.add(tube);
            });
        }

        function buildDisplay() {
            // AIO Screen
            const screenGroup = new THREE.Group();
            screenGroup.position.set(0, 1.2, -1.2);
            pcGroup.add(screenGroup);

            const screenGeo = new THREE.BoxGeometry(1.5, 0.8, 0.05);
            const screen = new THREE.Mesh(screenGeo, materials.screen);
            screenGroup.add(screen);

            // Screen Bezel
            const bezelGeo = new THREE.BoxGeometry(1.6, 0.9, 0.03);
            const bezel = new THREE.Mesh(bezelGeo, materials.caseAccent);
            bezel.position.z = 0.01;
            screenGroup.add(bezel);
        }

        function buildAmbient() {
            // LED Strips
            const stripPositions = [
                { pos: [0, 2.4, 0], rot: [Math.PI/2, 0, 0], length: 2.0 },
                { pos: [2.4, 0, 0], rot: [0, Math.PI/2, 0], length: 2.0 },
                { pos: [-2.4, 0, 0], rot: [0, -Math.PI/2, 0], length: 2.0 },
            ];

            stripPositions.forEach((sp, index) => {
                const stripGroup = new THREE.Group();
                stripGroup.position.set(...sp.pos);
                stripGroup.rotation.set(...sp.rot);
                
                const stripGeo = new THREE.BoxGeometry(sp.length, 0.05, 0.05);
                const strip = new THREE.Mesh(stripGeo, materials.rgbEmissive);
                stripGroup.add(strip);
                
                pcGroup.add(stripGroup);
                
                // Store for RGB control
                rgbElements.push(strip);
            });
        }

        // Animation Data (declared before the build calls that fill it)
        const fanData = [];
        const rgbElements = [];
        let isPowered = false;
        let currentRGB = new THREE.Color(0x6a8cff);
        let fanSpeed = 0.7;
        let ambienceIntensity = 0.3;

        // Build PC
        buildCase();
        buildMotherboard();
        buildGPU();
        buildCooling();
        buildCables();
        buildDisplay();
        buildAmbient();


        // Power System
        function setPower(on) {
            isPowered = on;
            const powerBtn = document.getElementById('powerBtn');
            const powerText = document.getElementById('powerText');
            const status = document.getElementById('status');
            
            if (on) {
                powerBtn.classList.add('on');
                powerText.textContent = 'POWER OFF';
                status.textContent = 'System Online';
                status.style.color = '#aaffaa';
                
                // Startup sequence
                startStartupSequence();
            } else {
                powerBtn.classList.remove('on');
                powerText.textContent = 'POWER ON';
                status.textContent = 'System Standby';
                status.style.color = '#ffaaaa';
                
                // Shutdown
                shutdownSequence();
            }
        }

        function startStartupSequence() {
            // Progressive lighting
            let step = 0;
            const interval = setInterval(() => {
                step++;
                const intensity = step / 10;
                
                materials.rgbEmissive.emissiveIntensity = intensity;
                materials.screen.emissiveIntensity = intensity * 0.3;
                
                if (step >= 10) {
                    clearInterval(interval);
                    materials.rgbEmissive.emissiveIntensity = 1;
                    materials.screen.emissiveIntensity = 0.3;
                }
            }, 100);
        }

        function shutdownSequence() {
            materials.rgbEmissive.emissiveIntensity = 0;
            materials.screen.emissiveIntensity = 0;
            fanData.forEach(fd => fd.speed = 0);
        }

        // RGB Control
        function updateRGB(color) {
            currentRGB.set(color);
            materials.rgbEmissive.color.set(color);
            materials.rgbEmissive.emissive.set(color);
            
            rgbElements.forEach(el => {
                el.material.color.set(color);
                el.material.emissive.set(color);
            });
        }

        // Fan Animation
        function updateFans(delta) {
            fanData.forEach(fd => {
                if (isPowered && fd.speed > 0) {
                    fd.blade.rotation.z += delta * fd.speed * 2;
                }
            });
        }

        // Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            
        });

        // HUD Event Handlers
        document.getElementById('powerBtn').addEventListener('click', () => {
            setPower(!isPowered);
        });

        document.getElementById('rgbColor').addEventListener('input', (e) => {
            updateRGB(e.target.value);
        });

        document.querySelectorAll('.preset').forEach(preset => {
            preset.addEventListener('click', () => {
                const color = preset.getAttribute('data-color');
                document.getElementById('rgbColor').value = color;
                updateRGB(color);
            });
        });

        document.getElementById('fanSpeed').addEventListener('input', (e) => {
            fanSpeed = parseInt(e.target.value) / 100;
            document.getElementById('fanValue').textContent = e.target.value + '%';
            fanData.forEach(fd => fd.speed = fanSpeed);
        });

        document.getElementById('coolingToggle').addEventListener('click', (e) => {
            e.target.classList.toggle('on');
            // Toggle liquid cooling animation
        });

        document.getElementById('glowToggle').addEventListener('click', (e) => {
            e.target.classList.toggle('on');
            materials.screen.emissiveIntensity = e.target.classList.contains('on') ? 0.3 : 0;
        });

        document.getElementById('ambience').addEventListener('input', (e) => {
            ambienceIntensity = parseInt(e.target.value) / 100;
            document.getElementById('ambienceValue').textContent = e.target.value + '%';
            ambientLight.intensity = 0.4 + ambienceIntensity * 0.6;
        });

        // Tooltip
        const tooltip = document.getElementById('tooltip');
        const controlsTooltips = {
            'powerBtn': 'Toggle system power',
            'rgbColor': 'Custom RGB color picker',
            'fanSpeed': 'Adjust case fan speed',
            'coolingToggle': 'Toggle liquid cooling',
            'glowToggle': 'Toggle screen glow effect',
            'ambience': 'Adjust ambient lighting'
        };

        Object.keys(controlsTooltips).forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('mouseenter', (e) => {
                    tooltip.textContent = controlsTooltips[id];
                    tooltip.style.opacity = 1;
                });
                el.addEventListener('mouseleave', () => {
                    tooltip.style.opacity = 0;
                });
                el.addEventListener('mousemove', (e) => {
                    tooltip.style.left = (e.clientX + 15) + 'px';
                    tooltip.style.top = (e.clientY + 15) + 'px';
                });
            }
        });

        // Animation Loop
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            updateFans(delta);
            controls.update();
            
            // Subtle PC idle animation
            if (isPowered) {
                pcGroup.rotation.y += delta * 0.05;
                pcGroup.position.y = Math.sin(clock.elapsedTime * 0.5) * 0.05;
            }
            
            renderer.render(scene, camera);
        }

        // Initialize
        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
            animate();
        }, 1000);
    </script>
</body>
</html>
