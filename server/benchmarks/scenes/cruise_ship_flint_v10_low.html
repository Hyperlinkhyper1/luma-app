<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
html, body { margin:0; height:100%; overflow:hidden; background:#000; }
#app { width:100vw; height:100vh; }
canvas { display:block; }
</style>
</head>
<body>
<div id="app"></div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(0, 40, 30);
let renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.getElementById('app').appendChild(renderer.domElement);

let hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
scene.add(hemi);
let sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(100, 150, 50);
scene.add(sun);
scene.add(new THREE.AmbientLight(0x404040, 0.5));

let sea = new THREE.Mesh(
  new THREE.CircleGeometry(500, 64),
  new THREE.MeshStandardMaterial({ color: 0x006699, metalness: 0.2, roughness: 0.1 })
);
sea.rotation.x = -Math.PI / 2;
sea.position.y = -0.5;
scene.add(sea);

scene.fog = new THREE.Fog(0x87ceeb, 100, 800);

let ship = new THREE.Group();
scene.add(ship);

let hull = new THREE.Mesh(
  new THREE.BoxGeometry(220, 30, 80, 12, 8, 12),
  new THREE.MeshStandardMaterial({ color: 0xf0f0f0, metalness: 0.6, roughness: 0.4 })
);
hull.position.set(0, 5, 0);
ship.add(hull);

let hullTop = new THREE.Mesh(
  new THREE.BoxGeometry(220, 2, 80, 12, 8, 12),
  new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.6, roughness: 0.4 })
);
hullTop.position.set(0, 20.5, 0);
ship.add(hullTop);

let bow = new THREE.Mesh(
  new THREE.BoxGeometry(30, 12, 80, 8, 6, 8),
  new THREE.MeshStandardMaterial({ color: 0xf0f0f0, metalness: 0.6, roughness: 0.4 })
);
bow.position.set(95, 26, 0);
ship.add(bow);

let stern = new THREE.Mesh(
  new THREE.BoxGeometry(20, 10, 80, 6, 5, 6),
  new THREE.MeshStandardMaterial({ color: 0xf0f0f0, metalness: 0.6, roughness: 0.4 })
);
stern.position.set(-105, 24, 0);
ship.add(stern);

function addBox(w, h, d, x, y, z, color = 0xf0f0f0) {
  let m = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d, 4, 4, 4),
    new THREE.MeshStandardMaterial({ color: color, metalness: 0.6, roughness: 0.4 })
  );
  m.position.set(x, y, z);
  ship.add(m);
  return m;
}

addBox(60, 25, 70, -30, 35, 0);
addBox(30, 20, 70, -70, 30, 0);
addBox(30, 20, 70, 20, 30, 0);
addBox(40, 15, 70, -30, 55, 0);

let funnel = new THREE.Mesh(
  new THREE.CylinderGeometry(10, 12, 50, 16),
  new THREE.MeshStandardMaterial({ color: 0x003366, metalness: 0.4, roughness: 0.3 })
);
funnel.position.set(-30, 75, 0);
ship.add(funnel);

let cap = new THREE.Mesh(
  new THREE.CylinderGeometry(12, 12, 2, 16),
  new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.2, roughness: 0.5 })
);
cap.position.set(-30, 102, 0);
ship.add(cap);

function addLifeboat(x, z, y) {
  let boat = new THREE.Mesh(
    new THREE.CylinderGeometry(2.5, 2.5, 7, 12),
    new THREE.MeshStandardMaterial({ color: 0xff6600, metalness: 0.3, roughness: 0.4 })
  );
  boat.rotation.z = Math.PI / 2;
  boat.position.set(x, y, z);
  ship.add(boat);
  let top = new THREE.Mesh(
    new THREE.CylinderGeometry(2.5, 2.5, 1, 12),
    new THREE.MeshStandardMaterial({ color: 0xff3300, metalness: 0.3, roughness: 0.4 })
  );
  top.rotation.z = Math.PI / 2;
  top.position.set(x, y + 4, z);
  ship.add(top);
  let davit = new THREE.Mesh(
    new THREE.CylinderGeometry(0.2, 0.2, 5, 6),
    new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8, roughness: 0.2 })
  );
  davit.position.set(x + 3, y + 2, z);
  ship.add(davit);
}

addLifeboat(-30, 20, 45);
addLifeboat(-30, -20, 45);

let deck7 = new THREE.Mesh(
  new THREE.BoxGeometry(80, 2, 60, 4, 4, 4),
  new THREE.MeshStandardMaterial({ color: 0x8B7355, metalness: 0.7, roughness: 0.6 })
);
deck7.position.set(0, 45, 0);
ship.add(deck7);

camera.position.set(0, 46.7, 15);
camera.rotation.order = 'YXZ';
camera.rotation.set(0, 0, 0);

let keys = {};
document.addEventListener('keydown', e => { keys[e.code] = true; });
document.addEventListener('keyup', e => { keys[e.code] = false; });
document.addEventListener('click', () => { if (document.pointerLockElement === null) { renderer.domElement.requestPointerLock(); } });
document.addEventListener('pointerlockchange', () => {});
document.addEventListener('mousemove', e => {
  if (document.pointerLockElement === renderer.domElement) {
    camera.rotation.y -= e.movementX * 0.002;
    camera.rotation.x -= e.movementY * 0.002;
    camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
  }
});

let clock = new THREE.Clock();

function updateNightDay() {
  let t = clock.getElapsedTime();
  let dayIntensity = (Math.sin(t * 0.02) * 0.5 + 0.5);
  let bgColor = new THREE.Color().setHSL(0.6 - dayIntensity * 0.6, 0.7, 0.5 - dayIntensity * 0.5);
  scene.background = bgColor;
  scene.fog = new THREE.Fog(bgColor.clone(), 100, 800);
  hemi.intensity = 0.2 + dayIntensity * 0.4;
  sun.intensity = 0.5 + dayIntensity * 2;
  sun.position.set(Math.cos(t * 0.02) * 100, Math.sin(t * 0.02) * 100, 50);
}

let rainGeom = new THREE.BufferGeometry();
let rainPos = new Float32Array(1000 * 3);
for (let i = 0; i < 1000; i++) {
  let x = (Math.random() - 0.5) * 200;
  let y = Math.random() * 100;
  let z = (Math.random() - 0.5) * 200;
  rainPos[i*3] = x; rainPos[i*3+1] = y; rainPos[i*3+2] = z;
}
rainGeom.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
let rain = new THREE.Points(rainGeom, new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, transparent: true, opacity: 0.6 }));
scene.add(rain);

function animate() {
  requestAnimationFrame(animate);
  let t = clock.getElapsedTime();
  updateNightDay();
  let weatherFactor = (Math.sin(t * 0.005) + 1) / 2;
  rain.visible = weatherFactor > 0.85;
  if (rain.visible) {
    let pos = rain.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      pos.setY(i, pos.getY(i) - 0.5);
      if (pos.getY(i) < 0) pos.setY(i, 100);
    }
    pos.needsUpdate = true;
  }

  let speed = 5;
  let forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  let right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
  let move = new THREE.Vector3();
  if (keys['KeyW'] || keys['ArrowUp']) move.add(forward);
  if (keys['KeyS'] || keys['ArrowDown']) move.sub(forward);
  if (keys['KeyD'] || keys['ArrowRight']) move.add(right);
  if (keys['KeyA'] || keys['ArrowLeft']) move.sub(right);
  move.normalize();
  camera.position.add(move.multiplyScalar(speed / 60));
  camera.position.y = 46.7;

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
