<head>
  <meta charset="UTF-8">

  <title>SERVER ARCHITECTURE LAB</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #ui {
      position: absolute;
      top: 0;
      left: 0;
      background: #333;
      color: #fff;
      padding: 8px;
      z-index: 1;
    }
    #info {
      position: absolute;
      top: 0;
      right: 0;
      background: #333;
      color: #fff;
      padding: 8px;
      z-index: 1;
    }
    #tools {
      position: absolute;
      bottom: 0;
      left: 0;
      background: #333;
      color: #fff;
      padding: 8px;
      z-index: 1;
    }
    #stats {
      position: absolute;
      top: 0;
      right: 0;
      background: #333;
      color: #fff;
      padding: 8px;
      z-index: 1;
    }
    #server-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    #server-list li {
      padding: 4px 8px;
      cursor: pointer;
    }
    #server-list li:hover {
      background: #555;
    }
  </style>
</head>

    <button id="open-cover">OPEN COVER</button>
    <button id="cutaway">CUTAWAY</button>
    <button id="explode">EXPLODE</button>
    <button id="airflow">AIRFLOW</button>
    <button id="power">POWER</button>
    <button id="data">DATA</button>
    <button id="failure">FAILURE</button>
    <button id="reset">RESET</button>
    <button id="prev-server">PREVIOUS SERVER</button>
    <button id="next-server">NEXT SERVER</button>
    <button id="return-rack">RETURN TO RACK</button>
  </div>
  <ul id="server-list"></ul>
