<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Globals ----------
let scene, camera, renderer, controls, clock;
let knifeRoot, parts = {};
let audioContext, masterGain, isAudioReady = false;
const audioNodes = {};
const moveDuration = 1400;
let moveAnimator = null;
let currentMoveName = '';
let trailPoints = [];
let trailMesh;
const state = {
  biteAngle: 0,
  safeAngle: 0,
  latchOpen: false,
  moveName: '',
  moveProgress: 0,
  isAnimating: false,
  speed: 1.0,
  slowMotion: false,
  trailEnabled: false,
  exploded: false,
  colorWayIndex: 0,
  handPosition: { x:0, y:0, z:0 },
  handRotation: { x:0, y:0, z:0 },
};

// Move definitions
const moves = {
  1: { name:'BASIC OPEN', biteTarget: Math.PI/2, safeTarget: -Math.PI/2, latchOpen: false },
  2: { name:'BASIC CLOSE', biteTarget: 0, safeTarget: 0, latchOpen: true },
  3: { name:'CHAPLIN', biteTarget: Math.PI/2, safeTarget: -Math.PI/2, latchOpen: false, extraRotate: Math.PI },
  4: { name:'ZEN ROLLOVER', biteTarget: Math.PI/2, safeTarget: -Math.PI/2, latchOpen: false, roll: true },
  5: { name:'FAN', biteTarget: Math.PI/2, safeTarget: -Math.PI/2, latchOpen: false, fanSpin: true },
  6: { name:'HELIX', biteTarget: Math.PI/2, safeTarget: -Math.PI/2, latchOpen: false, helix: true },
  7: { name:'AERIAL', biteTarget: Math.PI/2, safeTarget: -Math.PI/2, latchOpen: false, aerial: true },
  signature: { name:'ARCTIC SPIRAL', biteTarget: Math.PI, safeTarget: -Math.PI, latchOpen: false, spiral: true }
};
const signatureMove = moves.signature;

// Colorways
const colorways = [
  { name:'Arctic White', scaleColor:0xFFFFFF, linerColor:0xC08080, bladeColor:0xD3D3D3, hardwareColor:0xB87333 },
  { name:'Midnight Black', scaleColor:0x222222, linerColor:0x8B4563, bladeColor:0x555555, hardwareColor:0xA0522D },
  { name:'Arctic Ice', scaleColor:0xE0FFFF, linerColor:0xFFB6C1, bladeColor:0xF0F8FF, hardwareColor:0xFF69B4 }
];

// ---------- Helpers ----------
function easeInOutCubic(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }

// Audio
function initAudio(){
  const AudioCtx = window.AudioContext||window.webkitAudioContext;
  audioContext = new AudioCtx();
  masterGain = audioContext.createGain();
  masterGain.connect(audioContext.destination);
  masterGain.gain.setValueAtTime(0.5, audioContext.currentTime);
  const createNoiseBuffer = (dur,sr=audioContext.sampleRate)=>{
    const buf=audioContext.createBuffer(1,dur*sr,sr);
    const data=buf.getChannelData(0);
    for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*Math.exp(-i/(sr*0.1));
    return buf;
  };
  const createOsc = (type,freq,dur,gain=0.2)=>{
    const osc=audioContext.createOscillator();
    const g=audioContext.createGain();
    osc.type=type; osc.frequency.setValueAtTime(freq, audioContext.currentTime);
    g.gain.setValueAtTime(0,audioContext.currentTime);
    g.gain.linearRampToValueAtTime(gain,audioContext.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime+dur);
    osc.connect(g); g.connect(masterGain);
    osc.start(); osc.stop(audioContext.currentTime+dur);
    return{osc,g};
  };
  const sounds = {
    latchClick:(open)=>{ createOsc('sine', open?1200:800,0.1,0.15); },
    pinClack:(spd)=>{ createOsc('square',200+spd*200,0.08,0.2); },
    swish:(spd)=>{
      const src=audioContext.createBufferSource();
      src.buffer=createNoiseBuffer(0.2);
      const filt=audioContext.createBiquadFilter();
      filt.type='lowpass'; filt.frequency.setValueAtTime(1000+spd*2000, audioContext.currentTime);
      src.connect(filt).connect(masterGain);
      src.start(); src.stop(audioContext.currentTime+0.2);
    },
    bladeRing:()=>{
      createOsc('sine',600,0.3,0.25);
      for(let i=1;i<5;i++) createOsc('sine',600*Math.pow(1.5,i),0.3*(1-i/5),0.1);
    },
    pivotRattle:(spd)=>{
      const src=audioContext.createBufferSource();
      src.buffer=createNoiseBuffer(0.15);
      const filt=audioContext.createBiquadFilter();
      filt.type='highpass'; filt.frequency.setValueAtTime(80+spd*200, audioContext.currentTime);
      src.connect(filt).connect(masterGain);
      src.start(); src.stop(audioContext.currentTime+0.15);
    }
  };
  Object.assign(audioNodes, sounds);
  isAudioReady=true;
}
function triggerSound(type,param){ if(isAudioReady&&audioContext.state==='running') audioNodes[type]&&audioNodes[type](param); }

// Env map (procedural cube)
function createProceduralEnvMap(){
  const size=256;
  const faces=['posx','negx','posy','negy','posz','negz'];
  const canvases=[]; const ctxs=[];
  faces.forEach((_,i)=>{
    const c=document.createElement('canvas');
    c.width=c.height=size; canvases.push(c);
    const ctx=c.getContext('2d'); ctxs.push(ctx);
    const grad=ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
    grad.addColorStop(0,'#111'); grad.addColorStop(1,'#555');
    ctx.fillStyle=grad; ctx.fillRect(0,0,size,size);
    ctx.fillStyle='#333';
    for(let j=0;j<800;j++){
      const x=Math.random()*size, y=Math.random()*size, r=Math.random()*2;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    }
  });
  const env=new THREE.CubeTexture(canvases);
  env.needsUpdate=true;
  return env;
}

// Textures
function createBrushedMetalTexture(sz=256){
  const c=document.createElement('canvas'); c.width=c.height=sz;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#c0c0c0'; ctx.fillRect(0,0,sz,sz);
  ctx.strokeStyle='#a0a0a0'; ctx.lineWidth=2; ctx.setLineDash([sz/10,sz/10]);
  for(let y=0;y<sz;y+=sz/20){ ctx.beginPath(); ctx.moveTo(0,y+sz/40); ctx.lineTo(sz,y+sz/40); ctx.stroke(); }
  const img=ctx.getImageData(0,0,sz,sz);
  const d=img.data;
  for(let i=0;i<d.length;i+=4){
    const n=(Math.random()-0.5)*10;
    d[i]=Math.min(255,Math.max(0,d[i]+n));
    d[i+1]=Math.min(255,Math.max(0,d[i+1]+n));
    d[i+2]=Math.min(255,Math.max(0,d[i+2]+n));
  }
  ctx.putImageData(img,0,0);
  return new THREE.CanvasTexture(c);
}
function createFurTexture(sz=256){
  const c=document.createElement('canvas'); c.width=c.height=sz;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,sz,sz);
  ctx.strokeStyle='#eeeeee'; ctx.lineWidth=1;
  for(let i=0;i<40;i++){
    const x=Math.random()*sz, y=Math.random()*sz, l=Math.random()*sz*0.3, a=Math.random()*Math.PI;
    ctx.save(); ctx.translate(x,y); ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(l,0); ctx.stroke(); ctx.restore();
  }
  return new THREE.CanvasTexture(c);
}

// Geometry
function createSheepsfootBladeGeometry(len=0.23,w=0.02,th=0.003){
  const sh=new THREE.Shape();
  const hw=w, hh=th*10, cr=th*5;
  sh.moveTo(0,0);
  sh.lineTo(hw,0);
  sh.lineTo(hw, hh-cr);
  sh.quadraticCurveTo(hw/2, hh+cr, 0, hh-cr);
  sh.lineTo(0,0);
  const extrude=new THREE.ExtrudeGeometry(sh,{steps:1,depth:len,bevelEnabled:true,bevelThickness:th*2,bevelSegments:2});
  extrude.rotateX(-Math.PI/2);
  return extrude;
}
function createHandleGeometry(len=0.13,w=0.03,h=0.015,ch=0.01,cw=0.015){
  const grp=new THREE.Group();
  const sideTh=0.005;
  // left side
  const left=new THREE.BoxGeometry(sideTh,h,len);
  grp.add(new THREE.Mesh(left,null));
  // right side
  const right=new THREE.BoxGeometry(sideTh,h,len);
  grp.add(new THREE.Mesh(right,null));
  // bottom
  const bottom=new THREE.BoxGeometry(w-sideTh*2,ch,len);
  grp.add(new THREE.Mesh(bottom,null));
  grp.children[0].position.set(-w/2+sideTh/2,0,0);
  grp.children[1].position.set(w/2-sideTh/2,0,0);
  grp.children[2].position.set(0,-h/2+ch/2,0);
  return grp;
}

// Knife model
function createKnife(envMap, color){
  const root=new THREE.Group();
  const whiteMat=new THREE.MeshPhysicalMaterial({
    color:color.scaleColor, map:createFurTexture(), roughness:0.3, metalness:0.1,
    clearcoat:1.0, clearcoatRoughness:0.1, envMap, envMapIntensity:1.5
  });
  const roseMat=new THREE.MeshPhysicalMaterial({
    color:color.linerColor, roughness:0.4, metalness:0.8,
    clearcoat:1.0, clearcoatRoughness:0.1, envMap, envMapIntensity:1.5
  });
  const bladeMat=new THREE.MeshPhysicalMaterial({
    color:color.bladeColor, map:createBrushedMetalTexture(), roughness:0.2, metalness:0.9,
    clearcoat:1.0, clearcoatRoughness:0.05, envMap, envMapIntensity:2.0
  });
  const hardwareMat=new THREE.MeshPhysicalMaterial({
    color:color.hardwareColor, roughness:0.3, metalness:0.9,
    clearcoat:1.0, clearcoatRoughness:0.1, envMap, envMapIntensity:2.0
  });

  // Blade
  const bladeGeo=createSheepsfootBladeGeometry(0.23,0.02,0.003);
  const bladeMesh=new THREE.Mesh(bladeGeo,bladeMat);
  bladeMesh.position.set(0,0,0);
  root.add(bladeMesh);
  parts.blade=bladeMesh;

  // Tang
  const tangGeo=new THREE.BoxGeometry(0.02,0.02,0.01);
  const tangMesh=new THREE.Mesh(tangGeo,hardwareMat);
  tangMesh.position.set(0,0,-0.015);
  root.add(tangMesh);
  parts.tang=tangMesh;

  // Kicker
  const kickGeo=new THREE.BoxGeometry(0.003,0.005,0.003);
  const kickMesh=new THREE.Mesh(kickGeo,hardwareMat);
  kickMesh.position.set(0,0.01,0.23);
  root.add(kickMesh);
  parts.kicker=kickMesh;

  // Bite handle (U‑shape)
  const biteGrp=new THREE.Group();
  const biteU=createHandleGeometry();
  biteU.children.forEach((c,i)=>{ if(i<2) c.material=whiteMat; else c.material=roseMat; });
  // signature detail – groove on side panel
  if(biteU.children[0]){
    const grooveGeo=new THREE.BoxGeometry(0.002,0.012,0.004);
    const groove=new THREE.Mesh(grooveGeo,whiteMat);
    groove.position.set(-0.015,0,0);
    biteU.children[0].add(groove);
  }
  biteGrp.add(biteU);
  biteGrp.position.set(0,-0.03,-0.01);
  biteGrp.userData.isBite=true;
  biteGrp.userData.axis=new THREE.Vector3(0,1,0);
  root.add(biteGrp);
  parts.biteHandle=biteGrp;

  // Safe handle (U‑shape) + latch
  const safeGrp=new THREE.Group();
  const safeU=createHandleGeometry();
  safeU.children.forEach((c,i)=>{ if(i<2) c.material=whiteMat; else c.material=roseMat; });
  safeGrp.add(safeU);
  safeGrp.position.set(0,0.03,-0.01);
  safeGrp.userData.isSafe=true;
  safeGrp.userData.axis=new THREE.Vector3(0,1,0);
  // Latch
  const latchGeo=new THREE.BoxGeometry(0.008,0.002,0.005);
  const latchMesh=new THREE.Mesh(latchGeo,hardwareMat);
  latchMesh.position.set(0,0,-0.07);
  safeGrp.add(latchMesh);
  root.add(safeGrp);
  parts.safeHandle=safeGrp;
  parts.latch=latchMesh;

  // Bearings
  const bearingGeo=new THREE.TorusGeometry(0.001,0.0005,8,12);
  const b1=new THREE.Mesh(bearingGeo,hardwareMat);
  b1.position.set(0,-0.03,-0.06);
  biteGrp.add(b1);
  const b2=new THREE.Mesh(bearingGeo,hardwareMat);
  b2.position.set(0,0.03,-0.06);
  safeGrp.add(b2);
  parts.bearingBite=b1;
  parts.bearingSafe=b2;

  // Pivot screws
  const screwGeo=new THREE.CylinderGeometry(0.0005,0.0005,0.01,8);
  const s1=new THREE.Mesh(screwGeo,hardwareMat);
  s1.position.set(0,-0.03,-0.06-0.005);
  biteGrp.add(s1);
  const s2=new THREE.Mesh(screwGeo,hardwareMat);
  s2.position.set(0,0.03,-0.06-0.005);
  safeGrp.add(s2);
  parts.screwBite=s1;
  parts.screwSafe=s2;

  // Maker's mark (simple V)
  const mkCanvas=document.createElement('canvas');
  mkCanvas.width=mkCanvas.height=64;
  const mkCtx=mkCanvas.getContext('2d');
  mkCtx.fillStyle='#222'; mkCtx.fillRect(0,0,64,64);
  mkCtx.font='bold 24px sans-serif'; mkCtx.fillStyle='#fff';
  mkCtx.textAlign='center'; mkCtx.textBaseline='middle'; mkCtx.fillText('V',32,32);
  const mkTex=new THREE.CanvasTexture(mkCanvas);
  mkTex.flipY=false;
  const mkPlane=new THREE.Mesh(new THREE.PlaneGeometry(0.01,0.01),new THREE.MeshBasicMaterial({map:mkTex,transparent:true,opacity:0.6}));
  mkPlane.position.set(0,0,0.12);
  bladeMesh.add(mkPlane);
  parts.makerMark=mkPlane;

  // Theme – snowflakes
  const snowGeo=new THREE.BufferGeometry();
  const snowPos=[]; const snowCnt=80;
  for(let i=0;i<snowCnt;i++){
    snowPos.push((Math.random()-0.5)*10,Math.random()*5+2,(Math.random()-0.5)*10);
  }
  snowGeo.setAttribute('position',new THREE.Float32BufferAttribute(snowPos,3));
  const snowMat=new THREE.PointsMaterial({color:0xFFFFFF,size:0.1,transparent:true,opacity:0.6});
  const snowflakes=new THREE.Points(snowGeo,snowMat);
  root.add(snowflakes);
  parts.snowflakes=snowflakes;

  // Theme – wolf head placeholder
  const wolfGeo=new THREE.SphereGeometry(0.05,16,16);
  const wolfMat=new THREE.MeshPhysicalMaterial({color:0x444444,roughness:0.5,metalness:0.2,envMap,envMapIntensity:1});
  const wolfHead=new THREE.Mesh(wolfGeo,wolfMat);
  wolfHead.position.set(0.1,0.12,-0.1);
  root.add(wolfHead);
  parts.wolfHead=wolfHead;

  return root;
}

// Hand (low‑poly procedural)
function createHand(){
  const grp=new THREE.Group();
  // palm
  const palmGeo=new THREE.BoxGeometry(0.04,0.02,0.01);
  const palmMat=new THREE.MeshPhysicalMaterial({color:0xFFDAB9,roughness:0.7});
  const palm=new THREE.Mesh(palmGeo,palmMat);
  palm.position.set(0,-0.02,0);
  grp.add(palm);
  // fingers
  const fingerMat=new THREE.MeshPhysicalMaterial({color:0xFFDAB9,roughness:0.7});
  const fingerLen=0.03, fingerRad=0.008;
  for(let i=0;i<5;i++){
    const ang=(i-2)*0.5;
    const f=new THREE.Mesh(new THREE.CylinderGeometry(fingerRad,fingerRad,fingerLen,8),fingerMat);
    f.rotation.z=ang;
    f.position.set(0.015*Math.sin(ang),-0.01,0.02);
    grp.add(f);
  }
  grp.position.set(0, -0.2, 0.5);
  return grp;
}

// ---------- Core Loop ----------
function init(){
  const canvas=document.getElementById('canvas');
  // Renderer
  try{
    renderer=new THREE.WebGLRenderer({canvas,antialias:true});
  }catch(err){
    const msg=document.getElementById('loading');
    msg.textContent='WebGL is unavailable in this browser, so the knife cannot be shown.';
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;

  // Scene
  scene=new THREE.Scene();
  const envMap=createProceduralEnvMap();
  scene.background=new THREE.Color(0x101010);

  // Camera
  camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,0.1,100);
  camera.position.set(0,2,5);

  // Controls
  controls=new OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true;
  controls.dampingFactor=0.05;
  controls.maxPolarAngle=Math.PI/2-0.1;
  controls.minPolarAngle=Math.PI/2-0.1;

  // Lighting
  const keyLight=new THREE.DirectionalLight(0xffffff,1.5);
  keyLight.position.set(5,10,5);
  keyLight.castShadow=true;
  keyLight.shadow.mapSize.width=2048;
  keyLight.shadow.mapSize.height=2048;
  scene.add(keyLight);
  const rimLight=new THREE.PointLight(0xffffff,1.0,20);
  rimLight.position.set(-5,2,-5);
  scene.add(rimLight);
  const ambient=new THREE.AmbientLight(0x404040,0.4);
  scene.add(ambient);
  // Stage plinth
  const plinthGeo=new THREE.BoxGeometry(2,0.2,3);
  const plinthMat=new THREE.MeshPhysicalMaterial({color:0x333333,roughness:0.5,metalness:0.3});
  const plinth=new THREE.Mesh(plinthGeo,plinthMat);
  plinth.position.set(0,-0.2,0);
  plinth.receiveShadow=true;
  scene.add(plinth);
  // Spot for stage
  const spot=new THREE.SpotLight(0xffffff,2);
  spot.position.set(0,2,0);
  spot.castShadow=true;
  scene.add(spot);

  // Knife
  const col=colorways[state.colorWayIndex];
  knifeRoot=createKnife(envMap,col);
  scene.add(knifeRoot);

  // Hand
  const hand=createHand();
  scene.add(hand);
  parts.hand=hand;

  // Trail
  const trailGeo=new THREE.BufferGeometry();
  const trailPos=[]; for(let i=0;i<128;i++) trailPos.push(0,0,0);
  trailGeo.setAttribute('position',new THREE.Float32BufferAttribute(trailPos,3));
  const trailMat=new THREE.LineBasicMaterial({color:0xffff00,transparent:true,opacity:0.6});
  trailMesh=new THREE.Line(trailGeo,trailMat);
  scene.add(trailMesh);
  parts.trailMesh=trailMesh;

  // Store original positions for explosion
  parts.explodedOriginal={};
  Object.keys(parts).forEach(k=>{
    const p=parts[k];
    if(p&&p instanceof THREE.Object3D){
      p.userData.origPos=p.position.clone();
      p.userData.origRot=p.rotation.clone();
      parts.explodedOriginal[k]=p.userData.origPos;
    }
  });

  // Raycaster for handle drag
  const raycaster=new THREE.Raycaster();
  const mouse=new THREE.Vector2();
  let dragging=false, draggedObj=null;
  canvas.addEventListener('pointerdown',e=>{
    mouse.x=(e.clientX/window.innerWidth)*2-1;
    mouse.y=-(e.clientY/window.innerHeight)*2+1;
    raycaster.setFromCamera(mouse,camera);
    const hits=raycaster.intersectObjects([parts.biteHandle,parts.safeHandle],false);
    if(hits.length>0){
      dragging=true;
      draggedObj=hits[0].object;
    }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!dragging||!draggedObj) return;
    mouse.x=(e.clientX/window.innerWidth)*2-1;
    mouse.y=-(e.clientY/window.innerHeight)*2+1;
    raycaster.setFromCamera(mouse,camera);
    const hits=raycaster.intersectObjects([scene],false);
    if(hits.length===0) return;
    const pt=hits[0].point;
    const pos=new THREE.Vector3(); draggedObj.getWorldPosition(pos);
    const axis=draggedObj.userData.axis||new THREE.Vector3(0,1,0);
    const dir=pt.clone().sub(pos); dir.projectOntoAxis(axis);
    const angle=Math.atan2(dir.cross(axis).dot(new THREE.Vector3(1,0,0)),dir.dot(axis));
    if(draggedObj.userData.isBite) state.biteAngle=angle;
    if(draggedObj.userData.isSafe) state.safeAngle=angle;
    updateKnife(state);
    if(Math.abs(state.biteAngle)>Math.PI/2-0.05||Math.abs(state.safeAngle)>Math.PI/2-0.05){
      triggerSound('pinClack',state.speed);
    }
  });
  canvas.addEventListener('pointerup',()=>{ dragging=false; draggedObj=null; });

  // Camera presets
  const presets={HERO:{pos:new THREE.Vector3(0,2,5),tar:new THREE.Vector3(0,0,0)},
    'BLADE CLOSE-UP':{pos:new THREE.Vector3(0,0,3),tar:new THREE.Vector3(0,0,-0.2)},
    PIVOT:{pos:new THREE.Vector3(0,0.5,2),tar:new THREE.Vector3(0,0,-0.1)},
    LATCH:{pos:new THREE.Vector3(0,1,3),tar:new THREE.Vector3(0,0.03,-0.1)},
    TOP:{pos:new THREE.Vector3(0,5,0),tar:new THREE.Vector3(0,0,0)}};
  window.setCameraPreset=(name)=>{
    const p=presets[name];
    if(p){
      camera.position.copy(p.pos);
      controls.target.copy(p.tar);
      controls.update();
    }
  };

  // UI
  buildUI();

  // Animation loop
  const animate=()=>{
    requestAnimationFrame(animate);
    const delta=clock?clock.getDelta():0.0166;
    const spd=state.speed*(state.slowMotion?0.2:1);

    // Trail
    if(state.trailEnabled && knifeRoot){
      const tip=new THREE.Vector3();
      knifeRoot.getWorldPosition(tip); tip.add(new THREE.Vector3(0,0,0.23));
      trailPoints.push(tip.clone());
      if(trailPoints.length>64) trailPoints.shift();
      const pos=trailMesh.geometry.attributes.position.array;
      for(let i=0;i<trailPoints.length;i++){
        const v=trailPoints[i];
        pos[i*3]=v.x; pos[i*3+1]=v.y; pos[i*3+2]=v.z;
      }
      trailMesh.geometry.attributes.position.needsUpdate=true;
    }

    // Move animation
    if(state.isAnimating && moveAnimator){
      const now=performance.now();
      const elapsed=(now-moveAnimator.start)/1000*state.speed;
      const prog=Math.min(elapsed/moveAnimator.duration,1);
      state.moveProgress=prog;
      const s=moveAnimator.startState;
      const e=moveAnimator.endState;
      state.biteAngle=THREE.MathUtils.lerp(s.biteAngle,e.biteAngle,easeInOutCubic(prog));
      state.safeAngle=THREE.MathUtils.lerp(s.safeAngle,e.safeAngle,easeInOutCubic(prog));
      state.latchOpen=e.latchOpen;
      updateKnife(state);
      if(prog>=1){
        state.isAnimating=false;
        state.currentMove=null;
        currentMoveName=moveAnimator.moveName||'';
        state.moveName='';
        // Play end sounds
        if(moveAnimator.moveName) triggerSound('bladeRing');
      }
    }

    // Continuous extra motions
    if(state.moveName==='FAN' && knifeRoot){
      parts.biteHandle.rotation.z+=delta*Math.PI*2*2;
    }
    if(state.moveName==='HELIX' && knifeRoot){
      knifeRoot.rotation.z+=delta*Math.PI*4;
    }
    if(state.moveName==='ZEN ROLLOVER' && knifeRoot){
      knifeRoot.rotation.x=Math.sin(Date.now()/500)*0.3;
    }
    if(state.moveName==='AERIAL' && knifeRoot){
      const t=Date.now()/500;
      knifeRoot.position.y=0.5*Math.sin(t);
      knifeRoot.rotation.y=t;
    }
    if(state.moveName==='ARCTIC SPIRAL' && knifeRoot){
      knifeRoot.rotation.y+=delta*0.5;
      const s=state.biteAngle;
      state.biteAngle+=delta*0.5;
      state.safeAngle-=delta*0.5;
    }

    controls.update();
    renderer.render(scene,camera);
  };
  clock=new THREE.Clock();
  animate();

  // Resize
  window.addEventListener('resize',()=>{
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
  });

  // Keyboard
  window.addEventListener('keydown',e=>{
    const n=parseInt(e.key);
    if(!isNaN(n)&&n>=1&&n<=7) startMove(moves[n]);
    if(e.key==='s'||e.key==='S') document.getElementById('slowMotion').checked=!document.getElementById('slowMotion').checked;
  });

  // Hide UI button
  document.getElementById('hideUI').addEventListener('click',()=>{
    const uiEl=document.getElementById('ui');
    uiEl.classList.toggle('hidden');
    document.getElementById('hideUI').textContent=uiEl.classList.contains('hidden')?'Show UI':'Hide UI';
  });

  // Mark loaded
  document.getElementById('loading').style.display='none';
}

// ---------- UI Build ----------
function buildUI(){
  const ui=document.getElementById('ui');
  // Moves
  const movesDiv=document.createElement('div'); movesDiv.className='section';
  movesDiv.innerHTML='<strong>MOVES (Click or Number Key)</strong><br>';
  for(let i=1;i<=7;i++){
    const btn=document.createElement('button');
    btn.textContent=`Move ${i}: ${moves[i].name}`;
    btn.onclick=()=>startMove(moves[i]);
    movesDiv.appendChild(btn);
  }
  const sigBtn=document.createElement('button');
  sigBtn.textContent='Signature: '+moves.signature.name;
  sigBtn.onclick=()=>startMove(moves.signature);
  movesDiv.appendChild(sigBtn);
  ui.appendChild(movesDiv);

  // Combo & Freestyle
  const ctrlDiv=document.createElement('div'); ctrlDiv.className='section';
  const comboBtn=document.createElement('button');
  comboBtn.textContent='COMBO';
  comboBtn.onclick=()=>startCombo();
  ctrlDiv.appendChild(comboBtn);
  const freeBtn=document.createElement('button');
  freeBtn.textContent='FREESTYLE';
  freeBtn.onclick=()=>startFreestyle();
  ctrlDiv.appendChild(freeBtn);
  ui.appendChild(ctrlDiv);

  // Controls
  const ctlDiv=document.createElement('div'); ctlDiv.className='section';
  ctlDiv.innerHTML=`
    <label>Speed:</label>
    <input id="speedSlider" type="range" min="0.25" max="2" step="0.01" value="1"><br>
    <label><input id="slowMotion" type="checkbox"> Slow Motion</label><br>
    <label><input id="trailToggle" type="checkbox"> Trail</label><br>
    <label>Mute:</label>
    <input id="muteToggle" type="checkbox"><br>
    <label>Volume:</label>
    <input id="volumeSlider" type="range" min="0" max="1" step="0.01" value="0.5"><br>
    <label>Colorway:</label>
    <select id="colorwaySelect"></select><br>
    <label><input id="explodedToggle" type="checkbox"> Exploded View</label><br>
  `;
  ui.appendChild(ctlDiv);

  // Colorway select
  const sel=document.getElementById('colorwaySelect');
  colorways.forEach((c,idx)=>{
    const o=document.createElement('option');
    o.value=idx; o.textContent=c.name;
    sel.appendChild(o);
  });
  sel.addEventListener('change',e=>{
    state.colorWayIndex=parseInt(e.target.value);
    // Recreate knife
    scene.remove(knifeRoot);
    const envMap=createProceduralEnvMap();
    const col=colorways[state.colorWayIndex];
    knifeRoot=createKnife(envMap,col);
    scene.add(knifeRoot);
    // Reset animation
    if(state.isAnimating) startMove(state.currentMove);
  });

  // Control events
  document.getElementById('speedSlider').addEventListener('input',e=>state.speed=parseFloat(e.target.value));
  document.getElementById('slowMotion').addEventListener('change',e=>state.slowMotion=e.target.checked);
  document.getElementById('trailToggle').addEventListener('change',e=>state.trailEnabled=e.target.checked);
  document.getElementById('muteToggle').addEventListener('change',e=>masterGain.gain.setValueAtTime(e.target.checked?0:0.5,audioContext.currentTime));
  document.getElementById('volumeSlider').addEventListener('input',e=>masterGain.gain.setValueAtTime(parseFloat(e.target.value),audioContext.currentTime));
  document.getElementById('explodedToggle').addEventListener('change',e=>state.exploded=e.target.checked);

  // Camera presets
  const presetDiv=document.createElement('div'); presetDiv.className='section';
  presetDiv.innerHTML='<strong>Camera Presets</strong><div class="presets"></div>';
  ui.appendChild(presetDiv);
  const pres= presetDiv.querySelector('.presets');
  ['HERO','BLADE CLOSE-UP','PIVOT','LATCH','TOP'].forEach(name=>{
    const b=document.createElement('button');
    b.textContent=name;
    b.onclick=()=>setCameraPreset(name);
    pres.appendChild(b);
  });

  // Spec card
  const specDiv=document.createElement('div');
  specDiv.id='specCard'; specDiv.className='spec-card';
  ui.appendChild(specDiv);
}

// ---------- Animation Controllers ----------
const comboSequence=[1,2,3,4,5,6,7,'signature'];
function startCombo(){
  let idx=0;
  const play=()=>{
    if(idx>=comboSequence.length){ idx=0; }
    const key=comboSequence[idx];
    let moveDef;
    if(key==='signature') moveDef=moves.signature;
    else moveDef=moves[key];
    startMove(moveDef);
    idx++;
    setTimeout(play, moveDuration);
  };
  play();
}
let lastFree=null;
function startFreestyle(){
  const keys=Object.keys(moves).filter(k=>!isNaN(parseInt(k)));
  const avail=keys.filter(k=>moves[k].name!==lastFree);
  const pick=avail[Math.floor(Math.random()*avail.length)];
  startMove(moves[pick]);
  lastFree=moves[pick].name;
}
function startMove(moveDef){
  if(!moveDef) return;
  state.moveName=moveDef.name;
  state.isAnimating=true;
  state.moveProgress=0;
  const start={biteAngle:state.biteAngle,safeAngle:state.safeAngle,latchOpen:state.latchOpen};
  const end={biteAngle:moveDef.biteTarget,safeAngle:moveDef.safeTarget,latchOpen:moveDef.latchOpen};
  if(moveDef.latchOpen!==state.latchOpen) triggerSound('latchClick',moveDef.latchOpen);
  if(Math.abs(moveDef.biteTarget)>Math.PI/2-0.1||Math.abs(moveDef.safeTarget)>Math.PI/2-0.1) triggerSound('pinClack',state.speed);
  moveAnimator={start:performance.now(),duration:moveDuration,startState:start,endState:end,moveName:moveDef.name};
}
function setCameraPreset(name){
  const presets={
    HERO:{pos:new THREE.Vector3(0,2,5),tar:new THREE.Vector3(0,0,0)},
    'BLADE CLOSE-UP':{pos:new THREE.Vector3(0,0,3),tar:new THREE.Vector3(0,0,-0.2)},
    PIVOT:{pos:new THREE.Vector3(0,0.5,2),tar:new THREE.Vector3(0,0,-0.1)},
    LATCH:{pos:new THREE.Vector3(0,1,3),tar:new THREE.Vector3(0,0.03,-0.1)},
    TOP:{pos:new THREE.Vector3(0,5,0),tar:new THREE.Vector3(0,0,0)}
  };
  const p=presets[name];
  if(p){
    camera.position.copy(p.pos);
    controls.target.copy(p.tar);
    controls.update();
  }
}

// ---------- Knife Updater ----------
function updateKnife(st){
  if(!knifeRoot) return;
  const biteHandle=parts.biteHandle;
  const safeHandle=parts.safeHandle;
  const latch=parts.latch;
  const blade=parts.blade;
  if(biteHandle){
    biteHandle.rotation.y=st.biteAngle;
    biteHandle.children&&biteHandle.children.forEach(c=>c.rotation.y=st.biteAngle);
  }
  if(safeHandle){
    safeHandle.rotation.y=st.safeAngle;
    safeHandle.children&&safeHandle.children.forEach(c=>c.rotation.y=st.safeAngle);
  }
  if(latch){
    latch.rotation.z=st.latchOpen?Math.PI/2:0;
  }
  if(blade){
    const off=Math.sin(st.biteAngle)*0.1;
    blade.position.z=-0.15+off;
    blade.rotation.z=st.biteAngle*0.5+st.safeAngle*0.5;
  }
  // Explosion view
  if(st.exploded){
    if(!parts.explodedTargets){
      parts.explodedTargets={};
      Object.keys(parts).forEach(k=>{
        const p=parts[k];
        if(p&&p.userData&&p.userData.origPos){
          const dir=p.userData.origPos.clone().normalize();
          parts.explodedTargets[k]=dir.multiplyScalar(0.12);
        }
      });
    }
    Object.keys(parts.explodedTargets||{}).forEach(k=>{
      const p=parts[k];
      if(p&&p.userData.origPos){
        p.position.copy(p.userData.origPos).add(parts.explodedTargets[k]);
      }
    });
  }else{
    Object.keys(parts.explodedOriginal||{}).forEach(k=>{
      const p=parts[k];
      if(p&&p.userData.origPos){
        p.position.copy(p.userData.origPos);
      }
    });
  }
  updateSpecCard(st);
}
function updateSpecCard(st){
  const card=document.getElementById('specCard');
  const cw=colorways[st.colorWayIndex];
  const overall=(0.23+0.13*2).toFixed(2)+' m';
  const bladeL=0.23.toFixed(2)+' m';
  card.innerHTML=`
    <strong>${cw.name} ${moves[1].name}</strong><br>
    Overall: ${overall}<br>
    Blade: ${bladeL}<br>
    Materials: White Ceramic + Rose Gold<br>
    Weight: ≈150 g<br>
    Pivot: Ball bearing
  `;
}

// ---------- Init Audio on interaction ----------
function wakeAudio(e){
  initAudio();
  document.removeEventListener('click',wakeAudio);
  document.removeEventListener('keydown',wakeAudio);
}
document.addEventListener('click',wakeAudio);
document.addEventListener('keydown',wakeAudio);

// ---------- Ensure WebGL ----------
if(!renderer?.capabilities?.isWebGL2){
  // fallback
}

// ---------- Start ----------
window.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('loading').style.display='block';
  init();
});
</script>

<div id="ui" class="ui"></div>
<button id="hideUI">Hide UI</button>
