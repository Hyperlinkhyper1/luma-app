<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURORA-X Interactive PC</title>
<style>
:root{--acc:#00e5ff;--bg:#07080c;--panel:rgba(14,16,24,.78);--line:rgba(255,255,255,.09);--txt:#dfe6f0;--dim:#7d889a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font:13px/1.35 "Segoe UI",system-ui,-apple-system,sans-serif;overscroll-behavior:none}
#app{position:fixed;inset:0}
canvas{display:block;touch-action:none;outline:none}
#brand{position:fixed;left:22px;top:18px;pointer-events:none;user-select:none}
#brand b{font-size:20px;letter-spacing:.32em;font-weight:700}
#brand b i{color:var(--acc);font-style:normal;text-shadow:0 0 14px var(--acc)}
#brand span{display:block;color:var(--dim);font-size:11px;letter-spacing:.18em;margin-top:3px}
#hint{position:fixed;left:50%;top:24px;transform:translateX(-50%);color:var(--dim);font-size:12px;letter-spacing:.08em;pointer-events:none;transition:opacity .6s;text-align:center}
#tip{position:fixed;pointer-events:none;padding:5px 9px;border:1px solid var(--line);background:rgba(10,12,18,.88);border-radius:6px;font-size:12px;opacity:0;transition:opacity .15s;white-space:nowrap;z-index:5}
#tip small{color:var(--dim);display:block}
#hud{position:fixed;right:14px;bottom:14px;width:318px;max-height:calc(100vh - 28px);display:flex;flex-direction:column;background:var(--panel);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 50px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.4),0 0 40px -12px var(--acc);z-index:10}
#hud header{display:flex;align-items:center;gap:12px;padding:12px 14px;flex:none}
#pwr{width:54px;height:54px;flex:none;border-radius:50%;border:2px solid #3a4152;background:radial-gradient(circle at 35% 30%,#2a2f3c,#12141b);color:#8a93a6;cursor:pointer;display:grid;place-items:center;transition:all .25s;box-shadow:inset 0 2px 4px rgba(255,255,255,.08),0 4px 12px rgba(0,0,0,.5)}
#pwr svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
#pwr:hover{border-color:var(--acc);color:#fff}
#pwr:active{transform:scale(.92)}
#pwr.on{color:var(--acc);border-color:var(--acc);box-shadow:inset 0 0 14px -2px var(--acc),0 0 22px -2px var(--acc)}
#pwr.on svg{filter:drop-shadow(0 0 5px var(--acc))}
#pwr:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ttl{flex:1;min-width:0}
.ttl b{display:block;letter-spacing:.2em;font-size:13px}
#status{font-size:11px;letter-spacing:.14em;color:var(--dim)}
#status.live{color:var(--acc)}
#fold{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer;font-size:16px;line-height:1}
#fold:hover{color:#fff;border-color:var(--acc)}
#body{overflow-y:auto;padding:0 14px 14px;scrollbar-width:thin;scrollbar-color:#333 transparent}
#hud.folded #body{display:none}
.sec{border-top:1px solid var(--line);padding:11px 0 2px}
.sec h4{margin:0 0 8px;font-size:10px;letter-spacing:.2em;color:var(--dim);font-weight:600;text-transform:uppercase}
.row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.row label{width:66px;flex:none;color:var(--dim);font-size:12px}
.row .v{width:38px;text-align:right;font-variant-numeric:tabular-nums;color:var(--dim);font-size:11px;flex:none}
input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:6px;border-radius:4px;background:linear-gradient(90deg,var(--acc) var(--p,50%),#252a36 var(--p,50%));outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#eef3fa;border:2px solid var(--acc);box-shadow:0 0 8px var(--acc)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#eef3fa;border:2px solid var(--acc)}
#hue{background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)!important}
input[type=color]{width:38px;height:30px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:2px}input[type=color]::-webkit-color-swatch{border:0;border-radius:6px}
#hex{width:82px;background:#0b0d13;border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:6px 8px;font:12px ui-monospace,Consolas,monospace;text-transform:uppercase}
.sw{display:flex;gap:6px;flex:1;justify-content:flex-end}
.sw button{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.18);cursor:pointer;padding:0;transition:transform .15s}
.sw button:hover{transform:scale(1.25)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.chip{padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--dim);cursor:pointer;font-size:11.5px;transition:all .18s}
.chip:hover{color:#fff;border-color:rgba(255,255,255,.3)}
.chip:active{transform:scale(.94)}
.chip.on{color:#05070b;background:var(--acc);border-color:var(--acc);box-shadow:0 0 14px -2px var(--acc);font-weight:600}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:9px}
.tg .chip{border-radius:10px;text-align:center}
.tel{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.tel div{background:#0b0d13;border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center}
.tel b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.tel span{font-size:9px;letter-spacing:.14em;color:var(--dim)}
#spark{width:100%;height:38px;display:block;border-radius:8px;background:#0b0d13;border:1px solid var(--line)}
@media (max-width:720px){#hud{width:auto;left:10px;right:10px;bottom:10px;max-height:56vh}#brand{display:none}}
@media (max-height:640px){#hud{max-height:calc(100vh - 20px);bottom:10px}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="app"></div>
<div id="brand"><b>AURORA<i>·</i>X</b><span>INTERACTIVE 3D WORKSTATION</span></div>
<div id="hint">Drag to orbit · scroll to zoom · hover parts · press the power button ↘</div>
<div id="tip"></div>

<aside id="hud" aria-label="PC control panel">
  <header>
    <button id="pwr" aria-label="Power" aria-pressed="false" title="Power (Space)"><svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.3 6.6a8 8 0 1 0 11.4 0"/></svg></button>
    <div class="ttl"><b>AURORA·X CONTROL</b><span id="status">STANDBY</span></div>
    <button id="fold" title="Collapse panel" aria-label="Collapse panel">–</button>
  </header>
  <div id="body">
    <div class="sec">
      <h4>RGB lighting</h4>
      <div class="row"><input type="color" id="col" value="#00e5ff" aria-label="Pick any colour"><input id="hex" value="#00E5FF" maxlength="7" spellcheck="false" aria-label="Hex colour"><div class="sw" id="sw"></div></div>
      <div class="row"><label>Hue</label><input type="range" id="hue" min="0" max="360" value="187"></div>
      <div class="row"><label>Brightness</label><input type="range" id="bri" min="20" max="150" value="100"><span class="v" id="briv">100%</span></div>
      <div class="chips" id="modes"></div>
      <div class="row"><label>Effect speed</label><input type="range" id="spd" min="10" max="300" value="100"><span class="v" id="spdv">1.0×</span></div>
    </div>
    <div class="sec">
      <h4>Cooling &amp; scene</h4>
      <div class="row"><label>Fan speed</label><input type="range" id="fan" min="0" max="100" value="55"><span class="v" id="fanv">55%</span></div>
      <div class="row"><label>Bloom</label><input type="range" id="glow" min="0" max="200" value="90"><span class="v" id="glowv">90%</span></div>
      <div class="row"><label>Glass</label><input type="range" id="glass" min="0" max="100" value="22"><span class="v" id="glassv">22%</span></div>
      <div class="tg">
        <button class="chip" id="turbo">⚡ Turbo</button>
        <button class="chip on" id="room">💡 Room light</button>
        <button class="chip" id="explode">✦ Exploded</button>
        <button class="chip" id="auto">⟳ Auto-orbit</button>
        <button class="chip" id="sound" style="grid-column:span 2">🔈 Fan sound: off</button>
      </div>
    </div>
    <div class="sec">
      <h4>Camera</h4>
      <div class="chips" id="cams"></div>
    </div>
    <div class="sec">
      <h4>Telemetry</h4>
      <div class="tel"><div><b id="tCpu">--</b><span>CPU °C</span></div><div><b id="tGpu">--</b><span>GPU °C</span></div><div><b id="tRpm">--</b><span>FAN RPM</span></div><div><b id="tW">--</b><span>WATTS</span></div></div>
      <canvas id="spark" width="580" height="76"></canvas>
    </div>
  </div>
</aside>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const $=id=>document.getElementById(id);
const PI=Math.PI, clamp=(v,a,b)=>Math.min(b,Math.max(a,v)), lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};

/* ---------------- state ---------------- */
const S={on:false,color:new THREE.Color('#00e5ff'),mode:'wave',speed:1,bright:1,fan:.55,glass:.22,turbo:false,room:true,explode:false,sound:false};
const lvl={psu:0,fan:0,mobo:0,ram:0,gpu:0,aio:0,front:0,top:0,rear:0,case:0};
const delay={psu:0,fan:.35,mobo:.8,ram:1.15,front:1.3,top:1.55,rear:1.7,gpu:1.95,aio:2.3,case:2.7};
let tOn=0, tAll=0;

/* ---------------- renderer ---------------- */
const app=$('app');
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x06070b);
scene.fog=new THREE.FogExp2(0x06070b,.045);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,80);
camera.position.set(-4.6,1.9,7.4);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,-.1,0);
controls.enableDamping=true;controls.dampingFactor=.07;
controls.minDistance=2.5;controls.maxDistance=15;
controls.maxPolarAngle=PI*.53;
controls.autoRotateSpeed=.9;
controls.update();

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),.04).texture;

const rt=new THREE.WebGLRenderTarget(innerWidth,innerHeight,{type:THREE.HalfFloatType,samples:4});
const composer=new EffectComposer(renderer,rt);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.8,.65,.88);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------------- lights ---------------- */
const hemi=new THREE.HemisphereLight(0x8fa4c8,0x1a1d28,.5);scene.add(hemi);
const key=new THREE.DirectionalLight(0xdfe8ff,1.9);
key.position.set(-5,8,6);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-6,right:6,top:6,bottom:-6,near:1,far:24});
key.shadow.bias=-.0004;key.shadow.radius=4;
scene.add(key);
const rim=new THREE.DirectionalLight(0x6b7fb0,.7);rim.position.set(6,3,-6);scene.add(rim);
const glowLights=[
  {l:new THREE.PointLight(0xffffff,0,5,2),p:[.2,-.5,.9],g:'gpu',k:9},
  {l:new THREE.PointLight(0xffffff,0,4.5,2),p:[.3,.5,.3],g:'ram',k:7},
  {l:new THREE.PointLight(0xffffff,0,4.5,2),p:[.3,1.6,.5],g:'top',k:7},
  {l:new THREE.PointLight(0xffffff,0,4.5,2),p:[-1.3,0,.6],g:'front',k:6},
  {l:new THREE.PointLight(0xffffff,0,6,2),p:[0,-1.9,1.5],g:'case',k:8}
];
glowLights.forEach(o=>{o.l.position.set(...o.p);scene.add(o.l)});

/* ---------------- materials ---------------- */
const M={
  steel:new THREE.MeshStandardMaterial({color:0x1b1e26,metalness:.9,roughness:.32}),
  black:new THREE.MeshStandardMaterial({color:0x0c0d11,metalness:.4,roughness:.55}),
  rubber:new THREE.MeshStandardMaterial({color:0x08090b,metalness:.1,roughness:.8}),
  alu:new THREE.MeshStandardMaterial({color:0x9aa1ae,metalness:1,roughness:.28}),
  brushed:new THREE.MeshStandardMaterial({color:0x5b6170,metalness:1,roughness:.4}),
  gold:new THREE.MeshStandardMaterial({color:0xc9a24b,metalness:1,roughness:.3}),
  pcb:new THREE.MeshStandardMaterial({color:0x0a0e15,metalness:.3,roughness:.5}),
  blade:new THREE.MeshStandardMaterial({color:0x1a1d25,metalness:.3,roughness:.35,transparent:true,opacity:.88,side:THREE.DoubleSide}),
  glass:new THREE.MeshPhysicalMaterial({color:0xaec4da,transparent:true,opacity:.22,roughness:.04,metalness:0,clearcoat:1,side:THREE.DoubleSide,depthWrite:false}),
  cable:new THREE.MeshStandardMaterial({color:0x0e1015,metalness:.1,roughness:.7})
};
const tex=(c)=>{const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t};
const mkCanvas=(w,h,fn)=>{const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);return c};

/* lit (RGB) registry */
const lit=[];
function led(group,k=1,base=0x0d0f14){
  const m=new THREE.MeshStandardMaterial({color:base,emissive:0x000000,emissiveIntensity:2.4,roughness:.35,metalness:.2});
  const e={m,g:group,k,mesh:null,p:0};lit.push(e);return e;
}
function ledMesh(geo,group,k,parent,x=0,y=0,z=0){
  const e=led(group,k);const mesh=new THREE.Mesh(geo,e.m);mesh.position.set(x,y,z);e.mesh=mesh;parent.add(mesh);return mesh;
}
function add(mesh,parent,x=0,y=0,z=0,cast=true){mesh.position.set(x,y,z);mesh.castShadow=cast;mesh.receiveShadow=true;parent.add(mesh);return mesh}
const box=(w,h,d,m,p,x,y,z,c)=>add(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m),p,x,y,z,c);
const cyl=(rt,rb,h,s,m,p,x,y,z,rx=0)=>{const g=new THREE.CylinderGeometry(rt,rb,h,s);if(rx)g.rotateX(rx);return add(new THREE.Mesh(g,m),p,x,y,z)};
function rr(w,h,r){const s=new THREE.Shape();const x=-w/2,y=-h/2;s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s}
function hole(s,cx,cy,r){const h=new THREE.Path();h.absarc(cx,cy,r,0,PI*2,true);s.holes.push(h)}
function group(label,p,x=0,y=0,z=0,sub){const g=new THREE.Group();g.position.set(x,y,z);g.userData.label=label;g.userData.sub=sub||'';if(p)p.add(g);return g}
function textTex(w,h,draw){return tex(mkCanvas(w,h,draw))}

/* ---------------- fans ---------------- */
const fans=[];
const bladeGeo=(()=>{ // unit radius blade
  const s=new THREE.Shape();
  s.moveTo(.2,-.05);s.quadraticCurveTo(.6,-.12,.96,-.02);s.quadraticCurveTo(1.01,.15,.92,.34);s.quadraticCurveTo(.55,.22,.2,.06);s.closePath();
  const g=new THREE.ExtrudeGeometry(s,{depth:.012,bevelEnabled:false});return g;
})();
function makeFan(size,parent,x,y,z,ledGroup,opts={}){
  const g=new THREE.Group();g.position.set(x,y,z);parent.add(g);
  const R=size*.46;
  if(!opts.bare){
    const sh=rr(size,size,.07);hole(sh,0,0,R);
    const geo=new THREE.ExtrudeGeometry(sh,{depth:.12,bevelEnabled:true,bevelSize:.008,bevelThickness:.008,bevelSegments:2});geo.translate(0,0,-.06);
    add(new THREE.Mesh(geo,M.black),g,0,0,0);
    for(const [sx,sy] of [[1,1],[-1,1],[1,-1],[-1,-1]]) cyl(.028,.028,.02,10,M.alu,g,sx*size*.44,sy*size*.44,.065,PI/2);
  }
  ledMesh(new THREE.TorusGeometry(R*1.005,.013,8,72),ledGroup,1,g,0,0,.062);
  ledMesh(new THREE.TorusGeometry(R*.985,.011,8,72),ledGroup,.7,g,0,0,-.05);
  const rot=new THREE.Group();g.add(rot);
  const hubGeo=new THREE.CylinderGeometry(R*.25,R*.27,.09,32);hubGeo.rotateX(PI/2);
  add(new THREE.Mesh(hubGeo,M.steel),rot,0,0,0);
  const cap=new THREE.CircleGeometry(R*.17,32);
  const capM=ledMesh(cap,ledGroup,1.2,rot,0,0,.047);
  const n=9;
  for(let i=0;i<n;i++){
    const bg=new THREE.Group();bg.rotation.z=i*PI*2/n;rot.add(bg);
    const b=new THREE.Mesh(bladeGeo,M.blade);b.scale.set(R,R,1);b.rotation.x=.5;b.position.z=-.01;bg.add(b);
  }
  const disc=new THREE.Mesh(new THREE.CircleGeometry(R*.97,48),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
  disc.position.z=.02;disc.raycast=()=>{};g.add(disc);
  const f={rot,disc,ledGroup,w:0,dir:opts.dir||1,gpu:!!opts.gpu,mul:opts.mul||1};fans.push(f);
  return g;
}

/* ---------------- CASE ---------------- */
const pc=new THREE.Group();scene.add(pc);
const parts={}; // explode-able
function part(name,g,ex){parts[name]={g,base:g.position.clone(),ex:new THREE.Vector3(...ex)}}

// floor + ambience
const floor=new THREE.Mesh(new THREE.CircleGeometry(14,72).rotateX(-PI/2),new THREE.MeshStandardMaterial({color:0x0b0c12,metalness:.6,roughness:.28}));
floor.position.y=-2.12;floor.receiveShadow=true;floor.raycast=()=>{};scene.add(floor);
const glowTex=tex(mkCanvas(256,256,(c,w,h)=>{const g=c.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.35,'rgba(255,255,255,.4)');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(0,0,w,h)}));
const floorGlowMat=new THREE.MeshBasicMaterial({map:glowTex,color:0,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false});
const floorGlow=new THREE.Mesh(new THREE.PlaneGeometry(9,9).rotateX(-PI/2),floorGlowMat);floorGlow.position.y=-2.1;floorGlow.raycast=()=>{};scene.add(floorGlow);
ledMesh(new THREE.RingGeometry(3.5,3.54,128).rotateX(-PI/2),'case',1,scene,0,-2.115,0).raycast=()=>{};
ledMesh(new THREE.RingGeometry(5.2,5.22,128).rotateX(-PI/2),'case',.5,scene,0,-2.115,0).raycast=()=>{};
[[-6.5,9],[-4,6],[4.3,7],[6.8,10],[-1.8,5],[1.6,5.5]].forEach(([x,h])=>{ledMesh(new THREE.BoxGeometry(.07,h,.07),'case',.8,scene,x,-2.1+h/2,-5.5-Math.abs(x)*.15).raycast=()=>{}});

// shell
const shell=group('Chassis',null,0,0,0);pc.add(shell);shell.userData.label='Chassis — aluminium & tempered glass';shell.userData.sub='Aurora Monolith full-tower';
box(2.9,.12,1.5,M.steel,shell,0,-1.96,0);
box(2.9,3.8,.05,M.steel,shell,0,0,-.725);
box(.05,3.8,1.5,M.steel,shell,1.45,0,0);
for(const [x,z] of [[-1.25,-.6],[1.25,-.6],[-1.25,.6],[1.25,.6]]) cyl(.09,.11,.14,20,M.alu,shell,x,-2.06,z);
const perf=tex(mkCanvas(128,128,(c,w,h)=>{c.fillStyle='#fff';c.fillRect(0,0,w,h);c.fillStyle='#000';for(let r=0;r<8;r++)for(let q=0;q<8;q++){c.beginPath();c.arc(q*16+(r%2?8:0)+4,r*16+8,4.6,0,PI*2);c.fill()}}));
perf.wrapS=perf.wrapT=THREE.RepeatWrapping;perf.colorSpace=THREE.NoColorSpace;

/* ---------------- RGB effect ---------------- */
const _h={h:0,s:0,l:0};
function effect(p,t,out){
  const sp=S.speed*(S.turbo?1.6:1);
  switch(S.mode){
    case 'static':out.copy(S.color);break;
    case 'breathe':out.copy(S.color).multiplyScalar(.15+.85*(.5+.5*Math.sin(t*sp*1.7)));break;
    case 'wave':out.copy(S.color).multiplyScalar(.1+.9*Math.pow(.5+.5*Math.sin(p*10-t*sp*3.2),1.6));break;
    case 'aurora':S.color.getHSL(_h);out.setHSL((_h.h+.16*Math.sin(p*6-t*sp*1.3)+1)%1,.85,.5);break;
    case 'rainbow':out.setHSL((((p*.9-t*.12*sp)%1)+1)%1,1,.5);break;
  }
}

/* ---------------- simulation / telemetry ---------------- */
const sim={load:.08,cpu:32,gpu:30,rpm:0,watts:8,hist:new Array(120).fill(0)};
let loadTgt=.1,nextLoad=0;
function stepSim(dt){
  const anyOn=lvl.psu>.5;
  if(tAll>nextLoad){nextLoad=tAll+1.5+Math.random()*3;loadTgt=S.turbo?.85+Math.random()*.15:(Math.random()<.3?.35+Math.random()*.4:.05+Math.random()*.15)}
  const lt=anyOn&&lvl.mobo>.5?loadTgt:0;
  sim.load+=(lt-sim.load)*(1-Math.exp(-dt*2.2));
  const cool=fanPct()*10;
  const tc=anyOn?28+sim.load*(S.turbo?58:44)-cool*.6:25;
  const tg=anyOn?29+sim.load*(S.turbo?52:38)-cool*.5:25;
  sim.cpu+=(tc-sim.cpu)*(1-Math.exp(-dt*.5));
  sim.gpu+=(tg-sim.gpu)*(1-Math.exp(-dt*.45));
  sim.watts+=((anyOn?45+sim.load*(S.turbo?520:280):0)-sim.watts)*(1-Math.exp(-dt*3));
}
function fanPct(){return clamp(Math.max(S.fan,S.turbo?1:0,(sim.cpu-50)/40),0,1)}

/* ---------------- audio ---------------- */
let ac=null,noiseGain=null,noiseFilt=null;
function startAudio(){
  if(ac){ac.resume();return}
  ac=new (window.AudioContext||window.webkitAudioContext)();
  const b=ac.createBuffer(1,ac.sampleRate*3,ac.sampleRate),d=b.getChannelData(0);let last=0;
  for(let i=0;i<d.length;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.5}
  const src=ac.createBufferSource();src.buffer=b;src.loop=true;
  noiseFilt=ac.createBiquadFilter();noiseFilt.type='lowpass';noiseFilt.frequency.value=300;
  noiseGain=ac.createGain();noiseGain.gain.value=0;
  src.connect(noiseFilt).connect(noiseGain).connect(ac.destination);src.start();
}

/* hover labels */
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),tip=$('tip');let lastPick=0;
renderer.domElement.addEventListener('pointermove',e=>{
  const now=performance.now();if(now-lastPick<60)return;lastPick=now;
  mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObjects(pickables,false)[0];let lab=null;
  if(hit){let o=hit.object;while(o&&!o.userData.label)o=o.parent;if(o)lab=o.userData}
  if(lab){tip.innerHTML=lab.label+(lab.sub?'<small>'+lab.sub+'</small>':'');tip.style.left=Math.min(e.clientX+16,innerWidth-260)+'px';tip.style.top=(e.clientY+14)+'px';tip.style.opacity=1}else tip.style.opacity=0;
});
renderer.domElement.addEventListener('pointerleave',()=>tip.style.opacity=0);
renderer.domElement.addEventListener('wheel',e=>e.preventDefault(),{passive:false});

/* sparkline */
const sp=$('spark'),spx=sp.getContext('2d');let spT=0;
function drawSpark(){
  const w=sp.width,h=sp.height;spx.clearRect(0,0,w,h);
  const css='#'+S.color.clone().convertLinearToSRGB().getHexString();
  spx.strokeStyle=css;spx.lineWidth=3;spx.beginPath();
  sim.hist.forEach((v,i)=>{const x=i/(sim.hist.length-1)*w,y=h-4-v*(h-8);i?spx.lineTo(x,y):spx.moveTo(x,y)});spx.stroke();
  spx.lineTo(w,h);spx.lineTo(0,h);spx.closePath();spx.globalAlpha=.15;spx.fillStyle=css;spx.fill();spx.globalAlpha=1;
}

/* ---------------- resize ---------------- */
function resize(){
  const w=innerWidth,h=innerHeight;renderer.setSize(w,h);composer.setSize(w,h);
  camera.aspect=w/h;camera.fov=w/h<1.2?38*Math.min(1.9,1.2/(w/h)):38;camera.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();

/* ---------------- main loop ---------------- */
const clock=new THREE.Clock();const col=new THREE.Color(),tmp=new THREE.Color();
let exT=0,roomT=1,glassOp=.22,lcdAcc=0,spinAcc=0;
function frame(){
  const dt=Math.min(clock.getDelta(),.05);tAll+=dt;if(S.on)tOn+=dt;
  // power levels
  let anyRising=false;
  for(const k in lvl){
    const target=S.on&&tOn>delay[k]?1:0;
    const rate=target?(k==='psu'?9:4.5):(k==='fan'?2:5);
    lvl[k]+=(target-lvl[k])*(1-Math.exp(-dt*rate));
    if(Math.abs(target-lvl[k])<.002)lvl[k]=target;
    if(target&&lvl[k]<.98)anyRising=true;
  }
  const busy=!!S.on&&anyRising;
  $('status').textContent=!S.on?(lvl.psu>.05||sim.watts>10?'SHUTTING DOWN…':'STANDBY'):busy?'BOOTING…':(S.turbo?'TURBO · ONLINE':'ONLINE');
  $('status').classList.toggle('live',S.on);
  stepSim(dt);

  // RGB
  for(const e of lit){
    effect(e.p,tAll,col);
    let l=lvl[e.g]*e.k*S.bright;
    if(target(e.g)&&lvl[e.g]>.05&&lvl[e.g]<.85)l*=.55+.45*Math.random();
    e.m.emissive.copy(col).multiplyScalar(l);
    if(e.m.emissiveMap&&e.mesh&&e.mesh.userData)e.m.emissiveIntensity=2.4;
  }
  effect(.5,tAll,rgbNow);
  for(const g of glowLights){
    effect((g.p[0]+2)/4*.7+(g.p[1]+2.2)/4.4*.3,tAll,tmp);
    g.l.color.copy(tmp);g.l.intensity=lvl[g.g]*S.bright*g.k*(S.room?1:1.6);
  }
  floorGlowMat.color.copy(rgbNow).multiplyScalar(lvl.case*S.bright*.9);
  moteM.color.copy(rgbNow).lerp(tmp.set(0x8899bb),.5).multiplyScalar(.6+lvl.case*.6);

  // fans
  const fp=fanPct();
  const rpmTarget=(1.8+fp*8.5)*lvl.fan;
  let rpmAvg=0;
  for(const f of fans){
    let tgt=rpmTarget*f.dir;
    if(f.gpu&&fp<.35&&sim.gpu<52&&!S.turbo)tgt=0;
    const up=tgt!==0&&Math.abs(tgt)>Math.abs(f.w);
    f.w+=(tgt-f.w)*(1-Math.exp(-dt*(up?1.3:.55)));
    f.rot.rotation.z+=f.w*dt;
    const a=clamp(Math.abs(f.w)/9,0,1);
    f.disc.material.opacity=a*a*.16*S.bright;
    f.disc.material.color.copy(rgbNow);
    rpmAvg+=Math.abs(f.w);
  }
  rpmAvg/=fans.length;
  sim.rpm=rpmAvg/9*1750;
  if(ac&&noiseGain){noiseGain.gain.value=S.sound?clamp(rpmAvg/9,0,1)*.22:0;noiseFilt.frequency.value=180+rpmAvg*90}

  // explode / glass / room
  exT+=((S.explode?1:0)-exT)*(1-Math.exp(-dt*3.2));
  const e=smooth(exT);
  for(const k in parts){const p=parts[k];p.g.position.copy(p.base).addScaledVector(p.ex,e)}
  glassOp+=(S.glass-glassOp)*(1-Math.exp(-dt*8));
  M.glass.opacity=glassOp;M.glass.visible=glassOp>.004;
  roomT+=((S.room?1:0)-roomT)*(1-Math.exp(-dt*4));
  key.intensity=.15+1.75*roomT;hemi.intensity=.06+.44*roomT;rim.intensity=.15+.55*roomT;
  scene.environmentIntensity=.08+.62*roomT;
  bloom.strength=$('glow').value/100*.9*(.7+.3*(1-roomT*.5));
  bloom.threshold=.85;

  // motes
  const pa=moteGeo.attributes.position;
  for(let i=0;i<N;i++){mv[i]+=dt*.3;pa.array[i*3+1]+=Math.sin(mv[i])*dt*.03+dt*.02;pa.array[i*3]+=Math.cos(mv[i]*.7)*dt*.03;if(pa.array[i*3+1]>3)pa.array[i*3+1]=-2}
  pa.needsUpdate=true;

  // LCD ~20 fps
  lcdAcc+=dt;if(lcdAcc>.05){lcdAcc=0;drawLCD(tAll)}
  // telemetry ~ 4 Hz
  spT+=dt;if(spT>.25){spT=0;
    sim.hist.push(sim.load);sim.hist.shift();
    const on=lvl.psu>.05;
    $('tCpu').textContent=on?Math.round(sim.cpu):'--';$('tGpu').textContent=on?Math.round(sim.gpu):'--';
    $('tRpm').textContent=on?Math.round(sim.rpm/10)*10:'0';$('tW').textContent=Math.round(sim.watts);drawSpark();
  }
  // camera tween
  if(camTween){camTween.t=Math.min(1,camTween.t+dt/1.1);const k=smooth(camTween.t);
    camera.position.lerpVectors(camTween.fp,camTween.tp,k);controls.target.lerpVectors(camTween.ft,camTween.tt,k);
    if(camTween.t>=1)camTween=null}
  controls.update();
  composer.render();
  requestAnimationFrame(frame);
}
function target(g){return S.on&&tOn>delay[g]}
requestAnimationFrame(frame);
renderer.domElement.addEventListener('pointerdown',()=>{camTween=null});
</script>
</body>
