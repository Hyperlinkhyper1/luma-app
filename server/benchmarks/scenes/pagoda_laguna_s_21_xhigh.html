<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Voxel Garden</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: monospace;
            background: rgba(0,0,0,0.5);
            padding: 10px;
        }
        .control {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            font-family: monospace;
            background: rgba(0,0,0,0.5);
            padding: 10px;
        }
    </style>
</head>
<body>
    <div id="hud">
        <div>Voxel Garden</div>
        <div id="hud-voxels">24k voxels | 60 FPS</div>
        <div>Click lanterns</div>
    </div>
    <div class="control">
        <input type="range" id="timeSlider" min="0" max="24" step="0.1" value="12" />
        <button id="pauseBtn">Pause</button>
    </div>

    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let clock = new THREE.Clock();
        let voxelCount = 0;
        let fps = 60;
        let timeOfDay = 12.0;
        let paused = false;
        let frameCount = 0;
        let lastTime = performance.now();

        init();
        animate();

        function init() {
            // Scene
            scene = new THREE.Scene();

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(15, 10, 20);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            document.body.appendChild(renderer.domElement);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;

            // Lights
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(5, 10, 7);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.top = 10;
            dirLight.shadow.camera.bottom = -10;
            dirLight.shadow.camera.left = -10;
            dirLight.shadow.camera.right = 10;
            scene.add(dirLight);

            // Sky
            scene.background = new THREE.Color(0xbfd1e9);

            // Terrain
            createTerrain();

            // Pagoda
            createPagoda();

            // Garden elements
            createGardenElements();

            // Floating island
            createFloatingIsland();

            // Koi fish
            createKoi();

            // Sakura petals
            createSakuraPetals();

            // Birds
            createBirds();

            // Resize handler
            window.addEventListener('resize', onWindowResize);

            // HUD update
            document.getElementById('timeSlider').addEventListener('input', (e) => {
                timeOfDay = parseFloat(e.target.value);
            });
            document.getElementById('pauseBtn').addEventListener('click', () => {
                paused = !paused;
                document.getElementById('pauseBtn').textContent = paused ? 'Resume' : 'Pause';
            });

            // Window resize
            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        function createTerrain() {
            const size = 64;
            const geometry = new THREE.PlaneGeometry(size, size);
            const material = new THREE.MeshStandardMaterial({ color: 0x228B22 });
            const terrain = new THREE.Mesh(geometry, material);
            terrain.rotation.x = -Math.PI / 2;
            terrain.receiveShadow = true;
            scene.add(terrain);
        }

        function createPagoda() {
            const group = new THREE.Group();
            const floorHeight = 2;
            const baseSize = 4;
            const vermillionMat = new THREE.MeshStandardMaterial({ color: 0xC73E1D });
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xE8B86D });
            const jadeMat = new THREE.MeshStandardMaterial({ color: 0x40916C });
            const interiorMat = new THREE.MeshStandardMaterial({ color: 0xFFFF00, emissive: 0x333300 });

            for (let i = 0; i < 5; i++) {
                const scale = 1 - (i * 0.15);
                const size = baseSize * scale;

                // Floor
                const floorGeo = new THREE.BoxGeometry(size, floorHeight * 0.5, size);
                const floor = new THREE.Mesh(floorGeo, vermillionMat);
                floor.position.y = i * floorHeight;
                floor.castShadow = true;
                floor.receiveShadow = true;
                group.add(floor);

                // Interior lights
                const interiorLight = new THREE.PointLight(0xFFFF00, 0.5, 5);
                interiorLight.position.set(0, i * floorHeight + 0.2, 0);
                group.add(interiorLight);

                // Jade roof (curved/stepped)
                const roofSegments = 8;
                const roofGroup = new THREE.Group();
                for (let s = 0; s < roofSegments; s++) {
                    const t = s / roofSegments;
                    const roofScale = size * (1 - t * 0.3);
                    const roofGeo = new THREE.BoxGeometry(roofScale, 0.3, roofScale);
                    const roof = new THREE.Mesh(i % 2 === 0 ? jadeMat : goldMat, roofGeo);
                    roof.position.y = i * floorHeight + floorHeight * 0.5 + s * 0.2;
                    roof.castShadow = true;
                    roof.receiveShadow = true;
                    roofGroup.add(roof);
                }
                group.add(roofGroup);

                // Finial
                if (i === 4) {
                    const finialGeo = new THREE.CylinderGeometry(0.1, 0.1, 2);
                    const finial = new THREE.Mesh(finialGeo, goldMat);
                    finial.position.y = i * floorHeight + floorHeight + 2;
                    group.add(finial);
                }
            }

            // Doors (simplified)
            for (let i = 0; i < 3; i++) {
                const doorGeo = new THREE.BoxGeometry(0.8, 1.5, 0.2);
                const doorMat = new THREE.MeshStandardMaterial({ color: 0x4A2C1A });
                const door = new THREE.Mesh(doorGeo, doorMat);
                door.position.set(baseSize / 2 - 0.1, i * floorHeight + 0.75, 0);
                group.add(door);
            }

            group.position.set(0, 0, 0);
            scene.add(group);
        }

        function createGardenElements() {
            // Stone zig-zag path
            const pathMat = new THREE.MeshStandardMaterial({ color: 0x9AA0A6 });
            const pathGeo = new THREE.BoxGeometry(1, 0.2, 10);
            const path = new THREE.Mesh(pathGeo, pathMat);
            path.position.set(0, 0.1, -10);
            path.rotation.y = Math.PI / 8;
            path.receiveShadow = true;
            scene.add(path);

            // Pond
            const pondGeo = new THREE.CylinderGeometry(6, 6, 0.5, 32);
            const pondMat = new THREE.MeshStandardMaterial({ color: 0x7ED6DF });
            const pond = new THREE.Mesh(pondGeo, pondMat);
            pond.rotation.x = -Math.PI / 2;
            pond.position.set(8, 0.1, -2);
            pond.receiveShadow = true;
            scene.add(pond);

            // Trees
            const treePositions = [
                [-5, 0, -5], [5, 0, -5], [0, 0, 5], [-4, 0, 3], [4, 0, 3], [0, 0, -2]
            ];
            const treeTypes = ['sakura', 'pine', 'maple', 'willow'];
            treePositions.forEach((pos, idx) => {
                const type = treeTypes[idx % treeTypes.length];
                createTree(type, pos[0], pos[1], pos[2]);
            });

            // Lanterns
            const lanternPositions = [
                [-6, 1, -6], [6, 1, 6], [-6, 1, 6], [6, 1, -6]
            ];
            lanternPositions.forEach(pos => {
                createLantern(pos[0], pos[1], pos[2]);
            });

            // Torii gate
            const toriiMat = new THREE.MeshStandardMaterial({ color: 0xC73E1D });
            const toriiGeo = new THREE.BoxGeometry(4, 0.5, 0.5);
            const toriiTop = new THREE.Mesh(toriiGeo, toriiMat);
            toriiTop.position.set(0, 2, -15);
            toriiTop.castShadow = true;
            scene.add(toriiTop);

            const sideGeo = new THREE.BoxGeometry(0.5, 2, 0.5);
            const leftSide = new THREE.Mesh(sideGeo, toriiMat);
            leftSide.position.set(-2, 1, -15);
            scene.add(leftSide);

            const rightSide = new THREE.Mesh(sideGeo, toriiMat);
            rightSide.position.set(2, 1, -15);
            scene.add(rightSide);

            // Bamboo fence
            const fenceMat = new THREE.MeshStandardMaterial({ color: 0x228B22 });
            const fenceGeo = new THREE.BoxGeometry(0.2, 1, 2);
            for (let i = 0; i < 5; i++) {
                const fence = new THREE.Mesh(fenceGeo, fenceMat);
                fence.position.set(-8 + i * 2, 0.5, 0);
                fence.castShadow = true;
                scene.add(fence);
            }

            // Jizo statues
            const jizoMat = new THREE.MeshStandardMaterial({ color: 0x9AA0A6 });
            const jizoGeo = new THREE.BoxGeometry(1, 2, 1);
            for (let i = 0; i < 2; i++) {
                const jizo = new THREE.Mesh(jizoGeo, jizoMat);
                jizo.position.set(-3 + i * 6, 1, 3);
                jizo.castShadow = true;
                scene.add(jizo);
            }

            // Flowers
            const flowerGeo = new THREE.SphereGeometry(0.2);
            const flowerMat = new THREE.MeshStandardMaterial({ color: 0xFF69B4 });
            for (let i = 0; i < 40; i++) {
                const flower = new THREE.Mesh(flowerGeo, flowerMat);
                flower.position.set(
                    Math.random() * 30 - 15,
                    0.2,
                    Math.random() * 30 - 15
                );
                scene.add(flower);
            }

            // Bridge
            const bridgeMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            const bridgeGeo = new THREE.BoxGeometry(3, 0.3, 1);
            const bridge = new THREE.Mesh(bridgeGeo, bridgeMat);
            bridge.position.set(-8, 0.5, -2);
            bridge.rotation.z = Math.PI / 8;
            bridge.castShadow = true;
            scene.add(bridge);
        }

        function createTree(type, x, y, z) {
            const group = new THREE.Group();
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            const leafMat = new THREE.MeshStandardMaterial({ color: type === 'sakura' ? 0xFFB7C5 :
                                                              type === 'pine' ? 0x228B22 :
                                                              type === 'maple' ? 0x8B0000 :
                                                              0x228B22 });

            const trunkGeo = new THREE.CylinderGeometry(0.3, 0.5, 2);
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.castShadow = true;
            group.add(trunk);

            let leafGeo;
            if (type === 'willow') {
                leafGeo = new THREE.SphereGeometry(1.5);
            } else {
                leafGeo = new THREE.ConeGeometry(1.5, 2, 8);
            }
            const leaf = new THREE.Mesh(leafGeo, leafMat);
            leaf.position.y = 2;
            leaf.castShadow = true;
            leaf.receiveShadow = true;
            group.add(leaf);

            group.position.set(x, y + 1, z);
            scene.add(group);
        }

        function createLantern(x, y, z) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0xE8B86D });
            const geo = new THREE.BoxGeometry(0.5, 1, 0.5);
            const body = new THREE.Mesh(geo, mat);
            body.castShadow = true;
            group.add(body);

            const topGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.2);
            const top = new THREE.Mesh(topGeo, mat);
            top.position.y = 0.6;
            group.add(top);

            const light = new THREE.PointLight(0xFFFF99, 0.8, 5);
            light.position.y = 0.5;
            group.add(light);

            group.position.set(x, y, z);
            scene.add(group);

            // Interactivity
            group.userData = { light: light, clicked: false };
            group.callback = () => {
                group.userData.clicked = !group.userData.clicked;
                light.intensity = group.userData.clicked ? 0 : 0.8;
            };
        }

        function createFloatingIsland() {
            const group = new THREE.Group();
            const islandMat = new THREE.MeshStandardMaterial({ color: 0x228B22 });
            const islandGeo = new THREE.SphereGeometry(8, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2);
            const island = new THREE.Mesh(islandGeo, islandMat);
            island.rotation.x = Math.PI;
            island.castShadow = true;
            island.receiveShadow = true;
            group.add(island);

            // Waterfall
            const waterfallMat = new THREE.MeshStandardMaterial({ color: 0x7ED6DF, transparent: true, opacity: 0.7 });
            const waterfallGeo = new THREE.PlaneGeometry(2, 6);
            const waterfall = new THREE.Mesh(waterfallGeo, waterfallMat);
            waterfall.rotation.y = Math.PI / 4;
            waterfall.position.set(-4, -3, 0);
            group.add(waterfall);

            group.position.set(0, 15, -10);
            scene.add(group);

            // Small floating islands
            const smallIslandGeo = new THREE.SphereGeometry(3, 8, 8);
            const positions = [[-5, 18, -12], [5, 20, -8]];
            positions.forEach(pos => {
                const isl = new THREE.Mesh(smallIslandGeo, islandMat);
                isl.position.set(...pos);
                scene.add(isl);
            });
        }

        function createKoi() {
            const koiGroup = new THREE.Group();
            const koiMat = new THREE.MeshStandardMaterial({ color: 0xFF4500 });
            const koiGeo = new THREE.SphereGeometry(0.3, 8, 8);
            for (let i = 0; i < 6; i++) {
                const koi = new THREE.Mesh(koiGeo, koiMat);
                koi.position.set(Math.cos(i / 6 * Math.PI * 2) * 5, 0.2, Math.sin(i / 6 * Math.PI * 2) * 5);
                koi.userData = { angle: i / 6 * Math.PI * 2 };
                koiGroup.add(koi);
            }
            koiGroup.position.set(8, 0.2, -2);
            scene.add(koiGroup);
        }

        function createSakuraPetals() {
            const petalGroup = new THREE.Group();
            const petalGeo = new THREE.SphereGeometry(0.05, 6, 6);
            const petalMat = new THREE.MeshStandardMaterial({ color: 0xFFB7C5, transparent: true, opacity: 0.7 });
            for (let i = 0; i < 200; i++) {
                const petal = new THREE.Mesh(petalGeo, petalMat);
                petal.position.set(Math.random() * 20 - 10, Math.random() * 5 + 5, Math.random() * 20 - 10);
                petal.userData = { speed: Math.random() * 0.02 + 0.01 };
                petalGroup.add(petal);
            }
            scene.add(petalGroup);
        }

        function createBirds() {
            const birdGroup = new THREE.Group();
            const birdGeo = new THREE.ConeGeometry(0.2, 0.5);
            const birdMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
            for (let i = 0; i < 5; i++) {
                const bird = new THREE.Mesh(birdGeo, birdMat);
                bird.position.set(i * 3 - 6, 10 + Math.random() * 3, Math.random() * 5 - 2.5);
                bird.rotation.z = Math.PI / 4;
                bird.userData = { direction: Math.random() > 0.5 ? 1 : -1 };
                birdGroup.add(bird);
            }
            scene.add(birdGroup);
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            // FPS counter
            frameCount++;
            const now = performance.now();
            if (now - lastTime >= 1000) {
                fps = Math.round((frameCount * 1000) / (now - lastTime));
                frameCount = 0;
                lastTime = now;
                updateHUD();
            }

            if (!paused) {
                timeOfDay += delta * 0.01;
                if (timeOfDay > 24) timeOfDay = 0;
                document.getElementById('timeSlider').value = timeOfDay;
            }

            // Day/night cycle
            const t = timeOfDay / 24;
            const sunTheta = t * Math.PI * 2;
            const sunX = Math.cos(sunTheta) * 10;
            const sunY = Math.sin(sunTheta) * 8 + 5;
            const sunZ = Math.sin(sunTheta) * 10;

            const dirLight = scene.getObjectByName('DirectionalLight') || 
                            Array.from(scene.children).find(c => c.type === 'DirectionalLight');
            if (dirLight) {
                dirLight.position.set(sunX, sunY, sunZ);
                const intensity = Math.max(0.1, Math.sin(sunTheta) * 0.9);
                dirLight.intensity = intensity;
            }

            // Sky color
            const skyColor = new THREE.Color().setHSL(t, 0.5, 0.5);
            scene.background = skyColor;

            // Lantern flickering and auto-toggle at dusk
            scene.traverse(child => {
                if (child.userData && child.userData.light && child.userData.light.type === 'PointLight') {
                    const flickering = Math.random() * 0.2 + 0.8;
                    const isNight = t > 0.7 || t < 0.2;
                    child.userData.light.intensity = isNight ? 0.8 * flickering : 0;
                }
            });

            // Koi movement
            scene.traverse(child => {
                if (child.type === 'Group' && child.userData.koi) {
                    child.children.forEach((koi, i) => {
                        koi.userData.angle += delta * 0.2;
                        koi.position.set(
                            Math.cos(koi.userData.angle) * 5,
                            0.2,
                            Math.sin(koi.userData.angle) * 5
                        );
                    });
                }
            });

            // Sakura petals
            scene.traverse(child => {
                if (child.type === 'Group' && child.children[0].geometry.type.includes('Sphere')) {
                    child.children.forEach(petal => {
                        petal.rotation.y += delta * 0.5;
                        petal.position.y -= petal.userData.speed;
                        if (petal.position.y < 0) {
                            petal.position.set(
                                Math.random() * 20 - 10,
                                Math.random() * 5 + 5,
                                Math.random() * 20 - 10
                            );
                        }
                    });
                }
            });

            // Birds
            scene.traverse(child => {
                if (child.type === 'Group' && child.children[0].type === 'Mesh' && 
                    child.children[0].material.color.getHex() === 0x000000) {
                    child.children.forEach(bird => {
                        bird.position.x += bird.userData.direction * delta * 0.5;
                        if (bird.position.x > 10) bird.position.x = -10;
                        if (bird.position.x < -10) bird.position.x = 10;
                    });
                }
            });

            // Clickable lanterns
            controls.addEventListener('click', () => {
                const raycaster = new THREE.Raycaster();
                const mouse = new THREE.Vector2();
                mouse.x = 0;
                mouse.y = 0;
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(scene.children, true);
                if (intersects.length > 0) {
                    const obj = intersects[0].object;
                    if (obj.callback) {
                        obj.callback();
                    }
                }
            });

            // Auto-rotate when idle
            if (!controls.dragging) {
                controls.autoRotate = true;
            } else {
                controls.autoRotate = false;
            }
            controls.update();

            // Estimate voxel count
            voxelCount = 4000; // Pagoda
            voxelCount += 200; // Petals
            voxelCount += 6; // Koi
            voxelCount += 5; // Birds
            voxelCount += 40; // Flowers
            voxelCount += 6; // Trees
            voxelCount += 4;  // Lanterns
            voxelCount += 10; // Jizo
            voxelCount += 1000; // Terrain (estimated)
            voxelCount += 500; // Bridge, path, fence

            renderer.render(scene, camera);
        }

        function updateHUD() {
            const voxelDisplay = (voxelCount >= 1000 ? (voxelCount / 1000).toFixed(0) + 'k' : voxelCount.toString());
            document.getElementById('hud-voxels').textContent = `${voxelDisplay} voxels | ${fps} FPS`;
        }

        // Initial HUD update
        updateHUD();

        // Expose window API
        window.__VOXEL__ = {
            get voxelCount() { return voxelCount; },
            get fps() { return fps; },
            pagodaFloors: 5,
            get timeOfDay() { return Math.round(timeOfDay * 10) / 10; }
        };
    </script>
</body>
</html>
