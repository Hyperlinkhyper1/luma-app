<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Lisbon Cruise Port</title><style>body,html{margin:0;height:100%;overflow:hidden;background:#000} #ui{position:fixed;top:10px;left:10px;background:rgba(20,20,20,.8);color:#fff;font-family:Arial,Helvetica,sans-serif;padding:10px;border-radius:5px;z-index:10} #ui.hidden{display:none} button{background:#555;color:#fff;border:none;padding:5px 10px;margin:2px;border-radius:3px;cursor:pointer} button:hover{background:#777} #timeSlider{width:200px;margin-top:5px} </style></head><body><div id="ui"><button id="toggleUI">Hide UI</button><div><button data-preset="miradouro">Miradouro</button><button data-preset="waterfront">Waterfront</button><button data-preset="aerial">Aerial</button><button data-preset="river">River</button><button data-preset="ship">Ship Deck</button></div><label>Time: <input id="timeSlider" type="range" min="0" max="24" step=".1" value="12"><span id="timeDisplay">12:00</span></label><button id="playPause">Play</button><button id="depart">Depart</button><button id="arrive">Arrive</button></div><script type="module">import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';if (!THREE.WEBGL.isWebGL2Available()){const warning=THREE.WEBGL.getWebGL2ErrorMessage();document.body.innerHTML=warning;throw new Error('WebGL 2 not available');}const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));document.body.appendChild(renderer.domElement);const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x000024,200,1000);const ambient=new THREE.AmbientLight(0xffffff,0.2);scene.add(ambient);const sun=new THREE.DirectionalLight(0xffeed0,1);sun.position.set(100,200,100);scene.add(sun);const sunRay=new THREE.DirectionalLight(0xffbb55,0.3);sunRay.position.copy(sun.position);scene.add(sunRay);const controls=new OrbitControls(renderer.domElement);controls.enableDamping=true;controls.dampingFactor=0.05;controls.maxDistance=5000;controls.minDistance=200;const camera=new THREE.PerspectiveCamera(55,window.innerWidth/window.innerHeight,1,5000);camera.position.set(0,200,400);controls.update();window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});const waterGeo=new THREE.PlaneGeometry(2000,2000,100,100);waterGeo.rotateX(-Math.PI/2);const waterMat=new THREE.MeshPhongMaterial({color:0x006688,shininess:15,specular:0x004455,opacity:1,transparent:false,side:THREE.DoubleSide});const water=new THREE.Mesh(waterGeo,waterMat);scene.add(water);const waterV=water.geometry.attributes.position;const waterT={t:0};function animateWater(){waterT.t+=0.02;for(let i=0;i<waterV.count;i++){const ix=waterV.getX(i),iz=waterV.getZ(i);const wave=Math.sin((ix+waterT.t)*0.01)*Math.cos((iz+waterT.t)*0.01);waterV.setY(i,wave*1.5);}waterV.needsUpdate=true;water.geometry.computeVertexNormals();}animateWater();const cityGrp=new THREE.Group();scene.add(cityGrp);const houseM=new THREE.MeshLambertMaterial({color:0xffffff});const roofM=new THREE.MeshLambertMaterial({color:0xffa500});function makeHouse(x,z){const h=30+Math.random()*50,w=10+Math.random()*10,d=10+Math.random()*10;const houseGeo=new THREE.BoxGeometry(w,h,d);const house=new THREE.Mesh(houseGeo,houseM);house.position.set(x,h/2,z);cityGrp.add(house);const roof=new THREE.ConeGeometry(w/2,5,4);roof.rotation.y=Math.PI/4;roof.position.set(x,h+2.5,z);cityGrp.add(roof);}for(let i=-400;i<=400;i+=15){for(let j=-200;j<=200;j+=15){if(Math.random()<0.6&&!(i===0&&j===0))makeHouse(i,j);}}const termM=new THREE.MeshPhongMaterial({color:0x888888});const terminal=new THREE.Mesh(new THREE.BoxGeometry(200,30,120),termM);terminal.position.set(0,15,-200);scene.add(terminal);const shipGrp=new THREE.Group();scene.add(shipGrp);function makeHull(){const prof=[];prof.push(new THREE.Vector2(0,0));prof.push(new THREE.Vector2(30,0));prof.push(new THREE.Vector2(120,0));prof.push(new THREE.Vector2(140,10));prof.push(new THREE.Vector2(135,30));prof.push(new THREE.Vector2(120,45));prof.push(new THREE.Vector2(80,60));prof.push(new THREE.Vector2(40,55));prof.push(new THREE.Vector2(0,35));const lathe=new THREE.LatheGeometry(prof,64);const mat=new THREE.MeshStandardMaterial({color:0x0047ab,metalness:0.1,roughness:0.9});const hull=new THREE.Mesh(lathe,mat);hull.rotation.y=Math.PI;hull.position.set(0,0,10);shipGrp.add(hull);}makeHull();const deckGeo=new THREE.BoxGeometry(240,5,80);const deckMat=new THREE.MeshStandardMaterial({color:0x556699});const deck=new THREE.Mesh(deckGeo,deckMat);deck.position.set(0,10,20);shipGrp.add(deck);const winGeo=new THREE.CylinderGeometry(0.8,0.8,1,12);const winMat=new THREE.MeshBasicMaterial({color:0x333333});const winInst=new THREE.InstancedMesh(winGeo,winMat,200);for(let i=0;i<200;i++){const mo=new THREE.Object3D();mo.position.set((Math.random()-0.5)*200,12+Math.random()*10,30+Math.random()*70);mo.rotation.y=Math.PI;mo.updateMatrix();winInst.setMatrixAt(i,mo.matrix);}shipGrp.add(winInst);const bridgeGeo=new THREE.CylinderGeometry(5,5,20);const bridgeMat=new THREE.MeshStandardMaterial({color:0x555555});const bridge=new THREE.Mesh(bridgeGeo,bridgeMat);bridge.position.set(0,30,60);shipGrp.add(bridge);const funnelGeo=new THREE.CylinderGeometry(4,4,30);const funnelMat=new THREE.MeshStandardMaterial({color:0x333333});const funnel=new THREE.Mesh(funnelGeo,funnelMat);funnel.position.set(0,25,20);shipGrp.add(funnel);shipGrp.position.set(0,0,-200);const gangM=new THREE.MeshStandardMaterial({color:0xffff00});const gangGeo=new THREE.BoxGeometry(10,2,200);const gang=new THREE.Mesh(gangGeo,gangM);gang.position.set(0,5,-200);scene.add(gang);const winLight=new THREE.PointLight(0xffccaa,0.5,20);winLight.position.set(0,30,0);scene.add(winLight);winLight.visible=false;let time=12;function updateTime(){const hour=Math.floor(time),minutes=Math.round((time-hour)*60);document.getElementById('timeDisplay').textContent=`${String(hour).padStart(2,'0')}:${String(minutes).padStart(2,'0')}`;const factor=Math.max(0,Math.cos((time/24-0.25)*Math.PI*2));sun.intensity=1*factor+0.1;sunRay.intensity=0.3*factor;shipGrp.traverse(obj=>{if(obj.isMesh)obj.material.emissive.setScalar(0.05*(1-factor));});}document.getElementById('timeSlider').addEventListener('input',e=>{time=parseFloat(e.target.value);updateTime();});let play=true;document.getElementById('playPause').addEventListener('click',()=>{play=!play;document.getElementById('playPause').textContent=play?'Pause':'Play';});document.getElementById('toggleUI').addEventListener('click',()=>{document.getElementById('ui').classList.toggle('hidden');});const presets={miradouro:{pos:new THREE.Vector3(-100,200,200),target:new THREE.Vector3(0,20,0)},waterfront:{pos:new THREE.Vector3(0,50,100),target:new THREE.Vector3(0,20,0)},aerial:{pos:new THREE.Vector3(0,400,0),target:new THREE.Vector3(0,20,0)},river:{pos:new THREE.Vector3(500,150,-500),target:new THREE.Vector3(0,20,0)},ship:{pos:new THREE.Vector3(0,200,10),target:new THREE.Vector3(0,20,0)}};document.querySelectorAll('[data-preset]').forEach(btn=>{btn.addEventListener('click',()=>{const p=presets[btn.dataset.preset];controls.target.copy(p.target);camera.position.copy(p.pos);camera.lookAt(p.target);});});function depart(){const t0=performance.now(),dur=5000;const start=shipGrp.position.clone(),end=new THREE.Vector3(300,0,-200);const sr=shipGrp.rotation.y,er=sr+Math.PI/4;function a(t){const p=Math.min((t-t0)/dur,1);shipGrp.position.copy(start.clone().lerp(end,p));shipGrp.rotation.y=sr+(er-sr)*p;winLight.position.copy(shipGrp.position.clone().add(new THREE.Vector3(0,30,0)));if(p<1)requestAnimationFrame(a);}requestAnimationFrame(a);}document.getElementById('depart').addEventListener('click',depart);document.getElementById('arrive').addEventListener('click',()=>{shipGrp.position.set(0,0,-200);shipGrp.rotation.y=0;});function animate(){requestAnimationFrame(animate);animateWater();if(play){time+=0.005;if(time>24)time=0;updateTime();}controls.update();renderer.render(scene,camera);}animate();</script></body></html>
