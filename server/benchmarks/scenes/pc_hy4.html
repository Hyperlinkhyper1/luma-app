<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<title>AXIOM-9 // Custom Loop Workstation</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#05070b; }
  body { font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased; }
  canvas { display:block; touch-action:none; }
  .panel {
    background: linear-gradient(160deg, rgba(19,24,34,.88), rgba(9,12,18,.94));
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    border: 1px solid rgba(255,255,255,.09);
    box-shadow: 0 18px 50px -12px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .hair { height:1px; background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  input[type=range]{ -webkit-appearance:none; appearance:none; background:transparent; width:100%; height:16px; cursor:pointer; }
  input[type=range]::-webkit-slider-runnable-track{ height:4px; border-radius:99px; background:rgba(255,255,255,.13); }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:12px;height:12px;margin-top:-4px;border-radius:50%;
    background:#e8eef7; border:2px solid #0b0e14; box-shadow:0 0 0 1px rgba(255,255,255,.25), 0 0 10px rgba(255,255,255,.45);}
  input[type=range]::-moz-range-track{height:4px;border-radius:99px;background:rgba(255,255,255,.13);}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border:2px solid #0b0e14;border-radius:50%;background:#e8eef7;}
  input[type=range]:disabled::-webkit-slider-thumb{opacity:.35}
  .btn { transition: transform .12s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease, color .18s ease; }
  .btn:hover { background: rgba(255,255,255,.10); border-color: rgba(255,255,255,.22); }
  .btn:active { transform: scale(.94); }
  .seg { font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; }
  #sv { width:100%; height:150px; display:block; border-radius:10px; cursor:crosshair; touch-action:none; }
  .glowdot { box-shadow: 0 0 8px currentColor; }
  #loader{position:fixed;inset:0;display:grid;place-items:center;background:#05070b;z-index:60;transition:opacity .7s ease}
  .bar{width:180px;height:2px;background:rgba(255,255,255,.12);overflow:hidden;border-radius:99px}
  .bar>i{display:block;height:100%;width:40%;background:#7fe7ff;animation:sl 1.1s ease-in-out infinite}
  @keyframes sl{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
  #boot{transition:opacity .35s ease}
  #hint{transition:opacity .5s ease}
</style>
</head>

<div id="loader"><div class="text-center"><div class="mono text-[10px] tracking-[.35em] text-slate-400">AXIOM&nbsp;BOOT</div><div class="bar mt-3 mx-auto"><i></i></div></div></div>

<div class="fixed top-4 right-4 z-20 panel rounded-xl px-3 py-2 w-[176px]">

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ==================== RENDERER / SCENE ==================== */
const canvas = document.createElement('canvas');
document.body.appendChild(canvas);
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070b);
scene.fog = new THREE.Fog(0x05070b, 16, 40);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.08, 140);
camera.position.set(-5.0, 2.7, 5.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.target.set(0, 1.9, 0);
controls.minDistance = 1.6;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI*0.497;
controls.autoRotateSpeed = 0.55;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ==================== LIGHTS ==================== */
const hemi = new THREE.HemisphereLight(0x9fc6ff, 0x080b10, 0.34);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xdbe8ff, 1.45);
key.position.set(-6, 9, 7);
key.castShadow = true;
key.shadow.mapSize.set(1024,1024);
key.shadow.camera.near = 1; key.shadow.camera.far = 32;
const sd = 7;
key.shadow.camera.left=-sd; key.shadow.camera.right=sd;
key.shadow.camera.top=sd; key.shadow.camera.bottom=-sd;
key.shadow.bias = -0.0008;
scene.add(key);
const rim = new THREE.DirectionalLight(0x3f63c8, 0.55);
rim.position.set(7, 3.5, -6); scene.add(rim);
const warm = new THREE.PointLight(0xffb070, 0.5, 12, 2);
warm.position.set(4.5, 1.2, 4.5); scene.add(warm);

/* ==================== MATERIALS ==================== */
const M = {};
M.frame    = new THREE.MeshPhysicalMaterial({ color:0x15191f, metalness:0.94, roughness:0.32, clearcoat:0.45, clearcoatRoughness:0.25 });
M.frameDk  = new THREE.MeshPhysicalMaterial({ color:0x0a0d12, metalness:0.86, roughness:0.48 });
M.glass    = new THREE.MeshPhysicalMaterial({ color:0x0b1522, metalness:0.0, roughness:0.045, transmission:0.93,
               thickness:0.30, ior:1.5, transparent:true, opacity:0.5, side:THREE.DoubleSide,
               clearcoat:1, clearcoatRoughness:0.03, envMapIntensity:1.5, depthWrite:false });
M.pcb      = new THREE.MeshStandardMaterial({ color:0x0c1a15, metalness:0.32, roughness:0.7 });
M.pcbDark  = new THREE.MeshStandardMaterial({ color:0x08120f, metalness:0.3, roughness:0.8 });
M.gpuBody  = new THREE.MeshPhysicalMaterial({ color:0x191c23, metalness:0.9, roughness:0.26, clearcoat:0.6 });
M.fin      = new THREE.MeshStandardMaterial({ color:0xa7b1bf, metalness:1.0, roughness:0.3 });
M.copper   = new THREE.MeshStandardMaterial({ color:0xb87333, metalness:1.0, roughness:0.28 });
M.nickel   = new THREE.MeshStandardMaterial({ color:0xcbd3dd, metalness:1.0, roughness:0.17 });
M.chrome   = new THREE.MeshStandardMaterial({ color:0xe6ecf3, metalness:1.0, roughness:0.07 });
M.black    = new THREE.MeshStandardMaterial({ color:0x08090c, metalness:0.45, roughness:0.62 });
M.rubber   = new THREE.MeshStandardMaterial({ color:0x0b0c0f, metalness:0.1, roughness:0.92 });
M.blade    = new THREE.MeshStandardMaterial({ color:0x0e1117, metalness:0.62, roughness:0.26, side:THREE.DoubleSide });
M.fluid    = new THREE.MeshPhysicalMaterial({ color:0x0aa0c8, transmission:0.88, roughness:0.1, thickness:0.5,
               transparent:true, opacity:0.7, metalness:0, ior:1.33, emissive:0x000000, emissiveIntensity:0.4 });
M.tube     = new THREE.MeshPhysicalMaterial({ color:0xdde5ef, transmission:0.92, roughness:0.07, thickness:0.14,
               transparent:true, opacity:0.32, metalness:0, ior:1.45, side:THREE.DoubleSide });
M.cable    = new THREE.MeshStandardMaterial({ color:0x0f1116, metalness:0.18, roughness:0.86 });

const rgbMats = [];
const rgbLights = [];
function rgbEmissive(k=1, delay=0.15){
  const m = new THREE.MeshStandardMaterial({ color:0x08080a, metalness:0.25, roughness:0.35,
    emissive: new THREE.Color(0x38e1ff), emissiveIntensity:0 });
  m.userData.k = k; m.userData.d = delay;
  rgbMats.push(m); return m;
}
function rgbLight(k=1, delay=0.2){
  const l = new THREE.PointLight(0x38e1ff, 0, 3.4, 2);
  l.userData.k = k; l.userData.d = delay;
  rgbLights.push(l); return l;
}

/* ==================== HELPERS ==================== */
const box = (w,h,d,mat,x=0,y=0,z=0) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); return m;
};
const cyl = (rt,rb,h,mat,seg=24) => new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat);
function addMesh(parent, m, shadow=true){ m.castShadow=shadow; m.receiveShadow=shadow; parent.add(m); return m; }

/* ==================== FAN ==================== */
const FANS = [];
function fanFrameGeo(size, depth){
  const s = new THREE.Shape();
  const h = size/2;
  s.moveTo(-h,-h); s.lineTo(h,-h); s.lineTo(h,h); s.lineTo(-h,h); s.closePath();
  const hole = new THREE.Path();
  hole.absarc(0,0,size*0.44,0,Math.PI*2,true);
  s.holes.push(hole);
  const g = new THREE.ExtrudeGeometry(s,{depth,bevelEnabled:false,curveSegments:26});
  g.translate(0,0,-depth/2);
  return g;
}
const bladeShape = (()=>{
  const s = new THREE.Shape();
  s.moveTo(0,0);
  s.bezierCurveTo(0.20,0.08, 0.44,0.22, 0.53,0.52);
  s.bezierCurveTo(0.50,0.67, 0.35,0.73, 0.15,0.60);
  s.bezierCurveTo(0.05,0.50, 0.02,0.22, 0,0);
  return s;
})();
const bladeGeo = new THREE.ExtrudeGeometry(bladeShape,{depth:0.012,bevelEnabled:false,curveSegments:12});
const frameCache = new Map();
function makeFan(size, opt={}){
  const depth = 0.055, R = size/2;
  const g = new THREE.Group();
  if(!frameCache.has(size)) frameCache.set(size, fanFrameGeo(size, depth));
  const fr = new THREE.Mesh(frameCache.get(size), opt.frameMat || M.black);
  fr.castShadow = true; fr.receiveShadow = true; g.add(fr);
  // corner anti-vibration pads
  const padOff = size/2 - 0.05;
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sy])=>{
    g.add(box(0.10, 0.10, depth*1.06, M.rubber, sx*padOff, sy*padOff, 0));
  });
  // rotor
  const rotor = new THREE.Group();
  const hub = cyl(R*0.30, R*0.33, depth*0.92, M.frameDk, 22);
  hub.rotation.x = Math.PI/2; hub.castShadow = true; rotor.add(hub);
  const hubFace = cyl(R*0.26, R*0.26, 0.006, M.chrome, 22);
  hubFace.rotation.x = Math.PI/2; hubFace.position.z = depth*0.5; rotor.add(hubFace);
  let hubRing=null, glow=null;
  if(opt.led !== false){
    hubRing = new THREE.Mesh(new THREE.TorusGeometry(R*0.24, 0.011, 8, 30), rgbEmissive(2.0, 0.45));
    hubRing.rotation.x = Math.PI/2; hubRing.position.z = depth*0.5+0.004; rotor.add(hubRing);
    glow = new THREE.Mesh(new THREE.RingGeometry(R*0.32, R*0.93, 44),
      new THREE.MeshBasicMaterial({ color:0x38e1ff, transparent:true, opacity:0, side:THREE.DoubleSide,
        blending:THREE.AdditiveBlending, depthWrite:false }));
    glow.position.z = -depth*0.5 - 0.004; rotor.add(glow);
  }
  const N = opt.blades || 9;
  for(let i=0;i<N;i++){
    const holder = new THREE.Group();
    holder.rotation.z = (i/N)*Math.PI*2;
    const b = new THREE.Mesh(bladeGeo, M.blade);
    b.scale.setScalar(R/0.55);
    b.rotation.x = Math.PI/2;
    b.rotation.y = -0.45;
    b.castShadow = true;
    holder.add(b); rotor.add(holder);
  }
  g.add(rotor);
  // motor pod + struts on back
  const pod = cyl(R*0.19, R*0.21, 0.03, M.black, 16);
  pod.rotation.x = Math.PI/2; pod.position.z = -depth*0.5-0.015; g.add(pod);
  for(let i=0;i<4;i++){
    const st = box(R*0.60, 0.028, 0.02, M.black, 0,0,-depth*0.5-0.01);
    st.rotation.z = i*Math.PI/4; g.add(st);
  }
  g.userData = { rotor, hubRing, glow, R, size };
  FANS.push(g);
  return g;
}

/* ==================== CASE DIMENSIONS ==================== */
const W = 2.30, H = 4.05, D = 4.60;
const baseY = 0.16, topY = baseY + H;
const PC = new THREE.Group(); scene.add(PC);

/* ---- floor ---- */

  const f = cyl(0.058,0.066,0.14, M.chrome, 16);

  c.position.copy(f.position); c.rotation.copy(f.rotation); c.rotateX(Math.PI/2); PC.add(c);

  [0.16,'CPU  16C/32T  5.7GHz   OK'],
  [0.30,'MEM  64GB DDR5-6400  XMP'],

const smooth = (a,b,x)=>{ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };
const WHITE = new THREE.Color(0xffffff);

function updateRGB(t){
  let c = S.accent;
  if(S.mode==='cycle'){ c.setHSL(((t*22)%360)/360, 0.92, 0.56); }
  else { c.setHSL(S.hsv.h/360, S.hsv.s, S.hsv.v*0.5); }
  const boot = S.power ? S.boot : 0;
  let gi = S.brightness * boot;
  if(S.mode==='breath') gi *= 0.30 + 0.70*(0.5+0.5*Math.sin(t*1.25));
  if(S.mode==='pulse')  gi *= 0.55 + 0.45*Math.pow(Math.max(0,Math.sin(t*2.6)), 3);
  if(S.mode==='cycle')  gi *= 0.85 + 0.15*Math.sin(t*3);
  if(S.stress) gi *= 1.0 + 0.18*Math.sin(t*7.5);

  for(const m of rgbMats){
    const on = smooth(m.userData.d, Math.min(0.98, m.userData.d+0.22), boot);
    m.emissive.copy(c);
    m.emissiveIntensity = gi * m.userData.k * on;
  }
  for(const l of rgbLights){
    const on = smooth(l.userData.d, Math.min(0.98, l.userData.d+0.25), boot);
    l.color.copy(c);
    l.intensity = gi * l.userData.k * on * 1.6;
  }
  for(const f of FANS){
    const ud = f.userData;
    if(ud.glow){ ud.glow.material.color.copy(c); ud.glow.material.opacity = boot>0.4 ? 0.085*Math.min(1.4,gi) : 0; }
  }
  const ug = Math.min(1.4, gi);
  underGlow.material.color.copy(c);
  underGlow.material.opacity = boot>0.05 ? 0.14*ug : 0;
  flowMat.color.copy(c).lerp(WHITE, 0.6);
  flowMat.opacity = 0.30 + 0.5*boot;
  M.fluid.emissive.copy(c); M.fluid.emissiveIntensity = boot>0.4 ? 0.35+0.2*Math.sin(t*1.6) : 0.05;
  M.fluid.color.copy(c).multiplyScalar(0.45);
  bloom.strength = 0.28 + 0.55*Math.min(1.2, gi);
  hemi.intensity = 0.30 + 0.07*boot;
}

const svCv = document.getElementById('sv'), svCtx = svCv.getContext('2d');
let svW=180, svH=150;
function drawSV(){
  const r = svCv.getBoundingClientRect();
  svW = Math.max(150, Math.floor(r.width)); svH = 150;
  const dpr = Math.min(devicePixelRatio,2);
  svCv.width = svW*dpr; svCv.height = svH*dpr;
  svCtx.setTransform(dpr,0,0,dpr,0,0);
  svCtx.clearRect(0,0,svW,svH);
  const g1 = svCtx.createLinearGradient(0,0,svW,0);
  g1.addColorStop(0,'#ffffff'); g1.addColorStop(1,`hsl(${S.hsv.h},100%,50%)`);
  svCtx.fillStyle=g1; svCtx.fillRect(0,0,svW,svH);
  const g2 = svCtx.createLinearGradient(0,0,0,svH);
  g2.addColorStop(0,'rgba(0,0,0,0)'); g2.addColorStop(1,'#000');
  svCtx.fillStyle=g2; svCtx.fillRect(0,0,svW,svH);
  const x = S.hsv.s*svW, y = (1-S.hsv.v)*svH;
  svCtx.beginPath(); svCtx.arc(x,y,6.5,0,Math.PI*2);
  svCtx.lineWidth=2; svCtx.strokeStyle='rgba(255,255,255,.95)'; svCtx.stroke();
  svCtx.beginPath(); svCtx.arc(x,y,5.5,0,Math.PI*2);
  svCtx.lineWidth=1.2; svCtx.strokeStyle='rgba(0,0,0,.6)'; svCtx.stroke();
}
function hsvHex(h,s,v){
  const f=(n)=>{ const k=(n+h/60)%6; const val=v-v*s*Math.max(0,Math.min(k,4-k,1));
    return Math.round(255*val).toString(16).padStart(2,'0'); };
  return '#'+f(5)+f(3)+f(1);
}
let picking=false;
function pickAt(cx,cy){
  const r = svCv.getBoundingClientRect();
  S.hsv.s = Math.min(1,Math.max(0,(cx-r.left)/r.width));
  S.hsv.v = Math.min(1,Math.max(0,1-(cy-r.top)/r.height));
  syncColor();
}
svCv.addEventListener('pointerdown', e=>{ picking=true; svCv.setPointerCapture(e.pointerId); pickAt(e.clientX,e.clientY); });
svCv.addEventListener('pointermove', e=>{ if(picking) pickAt(e.clientX,e.clientY); });
svCv.addEventListener('pointerup', ()=>picking=false);
svCv.addEventListener('pointercancel', ()=>picking=false);

/* ==================== LOOP ==================== */
const clock = new THREE.Clock();
const tmpV = new THREE.Vector3(), tmpO = new THREE.Object3D();
let dispT=0, badgeT=0, texT=0;

function fanNorm(){
  let b = S.fanPct/100;
  if(S.stress) b = Math.max(b, 0.93);
  if(!S.power) return 0;
  return b * smooth(0.28, 0.6, S.boot);
}
function pumpRPM(){
  if(!S.power) return 0;
  return (800 + 2700*(S.fanPct/100) + (S.stress?700:0)) * smooth(0.35,0.75,S.boot);
}

function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if(S.power && S.boot<1){
    S.bootT += dt;
    S.boot = Math.min(1, S.bootT/BOOT_LEN);
    let msg = BOOT_SEQ[0][1];
    for(const m of BOOT_SEQ) if(m[0] <= S.boot) msg = m[1];
    bootTxt.textContent = msg;
    if(S.boot>=1){
      bootEl.style.opacity='0';
      stateTxt.textContent=' ONLINE';
      stateTxt.className='mono text-[9px] tracking-[.2em] text-emerald-400 glowdot';
    }
  }
  const boot = S.power ? S.boot : 0;

  updateRGB(t);

  // fans
  const rpm = fanNorm()*2200;
  for(const f of FANS){
    f.userData.rotor.rotation.z -= dt*(rpm/60)*Math.PI*2*0.30;
    if(f.userData.glow) f.userData.glow.rotation.z = -f.userData.rotor.rotation.z*0.5;
  }

  // coolant
  for(const fs of flowSets){
    const vis = S.flow || (S.power && S.boot>0.42);
    fs.inst.visible = vis;
    if(!vis) continue;
    fs.off = (fs.off + dt*(0.05 + 0.13*(S.fanPct/100) + (S.stress?0.12:0))) % 1;
    for(let k=0;k<fs.n;k++){
      const u = (fs.off + k/fs.n) % 1;
      fs.curve.getPointAt(u, tmpV);
      tmpO.position.copy(tmpV); tmpO.rotation.set(0,0,0);
      tmpO.scale.setScalar(0.75 + 0.3*Math.sin(t*4 + k*1.7));
      tmpO.updateMatrix(); fs.inst.setMatrixAt(k, tmpO.matrix);
    }
    fs.inst.instanceMatrix.needsUpdate = true;
  }
  resFluid.rotation.y += dt*0.3;
  resTop.position.y = 0.28 + Math.sin(t*1.15)*0.012;
  resFluid.scale.y = 1 + Math.sin(t*2.1)*0.012;
  pumpRing.rotation.z += dt*0.9;
  pumpRing.scale.setScalar(1 + (S.power?0.035*Math.sin(t*3.2):0));
  ioRing.rotation.z += dt*0.6;

  // dust
  dust.material.opacity += ((S.dust?0.5:0)-dust.material.opacity)*Math.min(1,dt*3);
  if(dust.material.opacity>0.01){
    const a = dustGeo.attributes.position.array;
    for(let i=0;i<DN;i++){
      const p=dph[i];
      a[i*3]   += Math.sin(t*0.32+p)*0.0018;
      a[i*3+1] += (0.05+0.05*Math.sin(t*0.45+p))*dt*1.6;
      a[i*3+2] += Math.cos(t*0.26+p*1.6)*0.0018;
      if(a[i*3+1]>6.2) a[i*3+1]=0.06;
    }
    dustGeo.attributes.position.needsUpdate=true;
  }

  // badge
  badgeT += dt;
  const bt = (S.power && S.boot>0.93) ? 0.92 : 0;
  badge.material.opacity += (bt-badge.material.opacity)*Math.min(1,dt*2.2);
  badge.position.y = topY+0.78 + Math.sin(t*0.85)*0.05;
  if(badge.material.opacity>0.02){
    const dx = camera.position.x-badge.position.x, dz = camera.position.z-badge.position.z;
    badge.rotation.y = Math.atan2(dx,dz) + Math.sin(t*0.4)*0.10;
    if(badgeT>0.12){ drawBadge(); badgeT=0; }
  }

  // textures
  texT += dt;
  if(texT>0.2){ drawBrand(); drawLogo(); texT=0; }
  dispT += dt;
  if(dispT>0.1){ drawDisplay(t); dispT=0; }

  // telemetry
  const tc = S.power ? (S.stress? 84+3*Math.sin(t*2.2) : 33+9*Math.sin(t*0.7)+ (S.fanPct/100)*(-7)) : 22;
  const tg = S.power ? (S.stress? 78+3*Math.sin(t*1.8) : 31+7*Math.sin(t*0.5+1)) : 22;
  S.cpu += (tc-S.cpu)*Math.min(1,dt*1.5);
  S.gpu += (tg-S.gpu)*Math.min(1,dt*1.5);
  S.pump += (pumpRPM()-S.pump)*Math.min(1,dt*2);
  const tw = S.power ? (S.stress? 760 : 90+50*(S.fanPct/100)+18*Math.abs(Math.sin(t*0.8))) : 3;
  S.watt += (tw-S.watt)*Math.min(1,dt*1.3);
  const tf = S.power ? (1.1 + 2.6*(S.fanPct/100) + (S.stress?1.4:0)) * smooth(0.4,0.8,boot) : 0;
  S.flowL += (tf-S.flowL)*Math.min(1,dt*1.5);

  if(S.power){
    const col=(v,a,b)=> v>a? '#ff8fa3' : v>b? '#ffd580' : '#cbd5e1';
    tCpu.textContent=S.cpu.toFixed(0)+'°C'; tCpu.style.color=col(S.cpu,75,52);
    tGpu.textContent=S.gpu.toFixed(0)+'°C'; tGpu.style.color=col(S.gpu,72,50);
    tPump.textContent=Math.round(S.pump)+' RPM'; tPump.style.color='#cbd5e1';
    tFlow.textContent=S.flowL.toFixed(1)+' L/m'; tFlow.style.color = S.flowL<0.4?'#ff8fa3':'#cbd5e1';
    tWatt.textContent=Math.round(S.watt)+' W'; tWatt.style.color='#cbd5e1';
    $('loadBar').style.width = Math.min(100,(S.watt/820)*100)+'%';
    $('rpmTxt').textContent = Math.round(fanNorm()*2200)+' RPM';
  } else {
    $('rpmTxt').textContent='0 RPM';
  }

  // camera tween
  if(camTween){
    camTween.t = Math.min(1, camTween.t + dt/1.15);
    const e = 1-Math.pow(1-camTween.t,3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.q0, camTween.q1, e);
    if(camTween.t>=1) camTween=null;
  }
  controls.autoRotate = S.orbit;

  const now=new Date();
  $('clock').textContent = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');

  controls.update();
  composer.render();
}

/* ==================== 3D CASE BUTTON (raycast) ==================== */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let downX=0, downY=0, downT=0;
function toNDC(e){
  const r = renderer.domElement.getBoundingClientRect();
  ndc.x = ((e.clientX-r.left)/r.width)*2-1;
  ndc.y = -((e.clientY-r.top)/r.height)*2+1;
}
function hitCase(){
  ray.setFromCamera(ndc, camera);
  return ray.intersectObjects([ioBtn, ioRing], false).length > 0;
}
renderer.domElement.addEventListener('pointerdown', e=>{ downX=e.clientX; downY=e.clientY; downT=performance.now(); });
renderer.domElement.addEventListener('pointerup', e=>{
  if(Math.hypot(e.clientX-downX, e.clientY-downY) > 5) return;
  if(performance.now()-downT > 600) return;
  toNDC(e);
  if(hitCase()){ setPower(!S.power); }
});
renderer.domElement.addEventListener('pointermove', e=>{
  toNDC(e);
  renderer.domElement.style.cursor = hitCase() ? 'pointer' : 'default';
});

/* ==================== RESIZE / INPUT ==================== */
function onResize(){
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.resolution.set(Math.max(1,innerWidth*0.5), Math.max(1,innerHeight*0.5));
  drawSV();
}
addEventListener('resize', onResize);
addEventListener('wheel', e=>{ if(e.ctrlKey) e.preventDefault(); }, {passive:false});
addEventListener('contextmenu', e=>e.preventDefault());
addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); setPower(!S.power); }
  if(e.key==='r'||e.key==='R'){ if(S.power){ S.bootT=0; S.boot=0; bootEl.style.opacity='1'; } }
});

/* ==================== INIT ==================== */
syncColor();
drawBrand(); drawLogo(); drawDisplay(0);
setPower(false);
onResize();
requestAnimationFrame(()=>{
  const l=document.getElementById('loader');
  l.style.opacity='0'; setTimeout(()=>l.remove(),800);
});
tick();
</script>
