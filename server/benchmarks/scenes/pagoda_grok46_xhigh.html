<script type="text/babel" data-type="module" data-presets="typescript">// @ts-nocheck
import * as THREE from "three";
import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";

const VOX = 0.4;
const CYCLE = 90;

const C = {
  vermillion: 0xc73e1d,
  gold: 0xe8b86d,
  teak: 0x4a2c1a,
  jade: 0x2d6a4f,
  jade2: 0x40916c,
  sakura: 0xffb7c5,
  sakura2: 0xff8fab,
  sakura3: 0xffe5ec,
  stone: 0x9aa0a6,
  pond: 0x7ed6df,
  moss: 0x606c38,
  cream: 0xf4e6d0,
  plaster: 0xfff8ee,
  darkStone: 0x5e646b,
  rock: 0x6a5f50,
  rock2: 0x4d463c,
  dirt: 0x6b4f3a,
  pine: 0x1b4332,
  maple: 0xd8572a,
  maple2: 0xe76f51,
  maple3: 0xffb703,
  willow: 0x74a57f,
  bamboo: 0xa3b18a,
  bamboo2: 0x78866b,
  waterDeep: 0x1b5c68,
  foam: 0xd4f1f4,
  paper: 0xffd9a0,
  iron: 0x2a2a2a,
  cloud: 0xfff5f7,
  cloud2: 0xffe5ec,
  glow: 0xffcc77,
  grass: 0x52796f,
  white: 0xf7f3ea,
  crane: 0xf8f4ec,
};

class RNG {
  s: number;
  constructor(seed: number) {
    this.s = seed >>> 0;
  }
  next() {
    this.s = (Math.imul(this.s, 1664525) + 1013904223) >>> 0;
    return this.s / 4294967296;
  }
  range(a: number, b: number) {
    return a + (b - a) * this.next();
  }
  int(a: number, b: number) {
    return Math.floor(this.range(a, b + 1));
  }
  pick<T>(arr: T[]): T {
    return arr[Math.floor(this.next() * arr.length)];
  }
}

function hash3(x: number, y: number, z: number) {
  const n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453;
  return n - Math.floor(n);
}

function noise2(x: number, z: number) {
  const ix = Math.floor(x);
  const iz = Math.floor(z);
  const fx = x - ix;
  const fz = z - iz;
  const a = hash3(ix, 0, iz);
  const b = hash3(ix + 1, 0, iz);
  const c = hash3(ix, 0, iz + 1);
  const d = hash3(ix + 1, 0, iz + 1);
  const ux = fx * fx * (3 - 2 * fx);
  const uz = fz * fz * (3 - 2 * fz);
  return a + (b - a) * ux + (c - a) * uz + (a - b - c + d) * ux * uz;
}

function fbm(x: number, z: number) {
  return noise2(x, z) * 0.5 + noise2(x * 2, z * 2) * 0.25 + noise2(x * 4, z * 4) * 0.125;
}

class VoxelGrid {
  s: number;
  occ = new Set<string>();
  bins = new Map<number, number[]>();
  count = 0;
  constructor(s = VOX) {
    this.s = s;
  }
  k(x: number, y: number, z: number) {
    return `${x},${y},${z}`;
  }
  has(x: number, y: number, z: number) {
    return this.occ.has(this.k(x, y, z));
  }
  add(x: number, y: number, z: number, color: number) {
    x = Math.round(x);
    y = Math.round(y);
    z = Math.round(z);
    const key = this.k(x, y, z);
    if (this.occ.has(key)) return false;
    this.occ.add(key);
    let arr = this.bins.get(color);
    if (!arr) {
      arr = [];
      this.bins.set(color, arr);
    }
    arr.push(x, y, z);
    this.count++;
    return true;
  }
  build(scene: THREE.Scene) {
    const geo = new THREE.BoxGeometry(this.s, this.s, this.s);
    const dummy = new THREE.Object3D();
    const meshes: THREE.InstancedMesh[] = [];
    const gold = C.gold;
    const paper = C.paper;
    const glow = C.glow;
    const foam = C.foam;
    this.bins.forEach((arr, color) => {
      const n = arr.length / 3;
      if (n <= 0) return;
      const isMetal = color === gold;
      const isEmit = color === paper || color === glow || color === foam;
      const mat = new THREE.MeshStandardMaterial({
        color,
        roughness: isMetal ? 0.26 : isEmit ? 0.45 : 0.82,
        metalness: isMetal ? 0.78 : 0.04,
        emissive: isEmit || isMetal ? new THREE.Color(color) : new THREE.Color(0x000000),
        emissiveIntensity: isEmit ? 0.7 : isMetal ? 0.18 : 0,
        flatShading: true,
      });
      const mesh = new THREE.InstancedMesh(geo, mat, n);
      mesh.castShadow = color !== C.cloud && color !== C.cloud2;
      mesh.receiveShadow = true;
      const tmp = new THREE.Color();
      const base = new THREE.Color(color);
      for (let i = 0; i < n; i++) {
        const x = arr[i * 3];
        const y = arr[i * 3 + 1];
        const z = arr[i * 3 + 2];
        dummy.position.set((x + 0.5) * this.s, (y + 0.5) * this.s, (z + 0.5) * this.s);
        dummy.rotation.set(0, 0, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        mesh.setMatrixAt(i, dummy.matrix);
        let nOcc = 0;
        if (this.has(x + 1, y, z)) nOcc++;
        if (this.has(x - 1, y, z)) nOcc++;
        if (this.has(x, y + 1, z)) nOcc++;
        if (this.has(x, y - 1, z)) nOcc++;
        if (this.has(x, y, z + 1)) nOcc++;
        if (this.has(x, y, z - 1)) nOcc++;
        const ao = 0.5 + 0.5 * (1 - nOcc / 6);
        const jitter = 0.9 + hash3(x, y, z) * 0.16;
        tmp.copy(base).multiplyScalar(ao * jitter);
        mesh.setColorAt(i, tmp);
      }
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      mesh.instanceMatrix.needsUpdate = true;
      scene.add(mesh);
      meshes.push(mesh);
    });
    return { geo, meshes };
  }
}

function insideIsland(x: number, z: number) {
  const n = fbm(x * 0.09 + 4, z * 0.09);
  const e = (x * x) / (28 * 28) + (z * z) / (24 * 24);
  return e + n * 0.16 < 1;
}

function islandTop(x: number, z: number) {
  if (!insideIsland(x, z)) return -999;
  const n = fbm(x * 0.07, z * 0.07);
  const d = Math.hypot(x / 26, z / 22);
  let h = 12.4 + n * 3.2 - d * d * 2.2;
  const pd = Math.hypot(x - 9, z - 4);
  if (pd < 7.5) h -= (1 - pd / 7.5) * (1 - pd / 7.5) * 4.4;
  const cd = Math.hypot(x, z);
  if (cd < 9) h = Math.max(h, 13.2);
  if (x > 16 && Math.abs(z - 3) < 6) h -= 1.5;
  return Math.round(h);
}

function islandBottom(x: number, z: number) {
  const n = fbm(x * 0.13 + 9, z * 0.13 + 2);
  const d = Math.hypot(x / 26, z / 22);
  return Math.round(-7 - (1 - Math.min(d, 1)) * 11 - n * 5);
}

function toWorld(x: number, y: number, z: number) {
  return new THREE.Vector3((x + 0.5) * VOX, (y + 0.5) * VOX, (z + 0.5) * VOX);
}

function makeGlowTexture() {
  const c = document.createElement("canvas");
  c.width = 64;
  c.height = 64;
  const g = c.getContext("2d")!;
  const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0, "rgba(255,230,160,1)");
  grd.addColorStop(0.35, "rgba(255,170,70,0.45)");
  grd.addColorStop(1, "rgba(255,80,0,0)");
  g.fillStyle = grd;
  g.fillRect(0, 0, 64, 64);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}

export function mountPagoda(container: HTMLElement): () => void {
  const rng = new RNG(20260328);
  const grid = new VoxelGrid(VOX);

  const pondCx = 9;
  const pondCz = 4;
  const pondR = 6.4;
  const waterY = 10;

  const heights = new Map<string, number>();
  for (let x = -32; x < 32; x++) {
    for (let z = -32; z < 32; z++) {
      const top = islandTop(x, z);
      if (top > -100) heights.set(`${x},${z}`, top);
    }
  }
  const surf = (x: number, z: number) => heights.get(`${x},${z}`);

  for (let x = -32; x < 32; x++) {
    for (let z = -32; z < 32; z++) {
      const top = surf(x, z);
      if (top === undefined) continue;
      const bot = islandBottom(x, z);
      const edge =
        surf(x + 1, z) === undefined ||
        surf(x - 1, z) === undefined ||
        surf(x, z + 1) === undefined ||
        surf(x, z - 1) === undefined;
      const pd = Math.hypot(x - pondCx, z - pondCz);
      for (let y = bot; y <= top; y++) {
        const nearEdge = edge || y === top || y <= bot + 1 || y >= top - 1;
        const fillShell = Math.abs(x) % 5 === 0 && Math.abs(z) % 5 === 0 && y % 3 === 0;
        if (!nearEdge && !fillShell) continue;
        let col = C.rock;
        if (y === top) {
          if (pd < pondR + 1 && pd > pondR - 1.2) col = C.stone;
          else if (pd < pondR) col = C.waterDeep;
          else {
            const n = fbm(x * 0.2, z * 0.2);
            col = n > 0.62 ? C.moss : n > 0.4 ? C.grass : n > 0.22 ? C.dirt : C.jade2;
          }
        } else if (y >= top - 1) col = C.dirt;
        else if (y < bot + 3) col = hash3(x, y, z) > 0.5 ? C.rock2 : C.darkStone;
        else col = hash3(x, y, z) > 0.55 ? C.rock : C.rock2;
        grid.add(x, y, z, col);
      }
      if (edge && top - bot > 8) {
        for (let i = 0; i < 3; i++) {
          const yy = bot + 2 + rng.int(0, Math.max(1, top - bot - 6));
          grid.add(x + (rng.next() > 0.5 ? 1 : 0), yy, z, C.moss);
        }
      }
      if (edge && hash3(x, 9, z) > 0.72) {
        const len = 3 + rng.int(0, 5);
        for (let i = 1; i <= len; i++) {
          grid.add(x, bot - i, z, i % 2 === 0 ? C.moss : C.rock2);
        }
      }
    }
  }

  const addMiniIsland = (cx: number, cy: number, cz: number, rx: number, rz: number, hy: number) => {
    for (let x = -rx; x <= rx; x++) {
      for (let z = -rz; z <= rz; z++) {
        const e = (x * x) / (rx * rx) + (z * z) / (rz * rz) + fbm(x * 0.3 + cx, z * 0.3) * 0.18;
        if (e > 1) continue;
        const h = Math.round(hy * (1 - e) + fbm(x * 0.2, z * 0.2) * 2);
        for (let y = -h - 2; y <= h; y++) {
          if (y !== h && y > -h && Math.abs(x) < rx - 1 && Math.abs(z) < rz - 1) continue;
          let col = y === h ? (hash3(x, y, z) > 0.5 ? C.moss : C.grass) : C.rock;
          if (y < -h + 1) col = C.rock2;
          grid.add(cx + x, cy + y, cz + z, col);
        }
      }
    }
  };
  addMiniIsland(-26, 8, -12, 6, 5, 3);
  addMiniIsland(24, 4, 14, 5, 4, 2);
  addMiniIsland(-18, 2, 20, 4, 4, 2);
  addMiniIsland(22, 10, -16, 4, 3, 2);

  const addCloud = (cx: number, cy: number, cz: number, rx: number, ry: number, rz: number) => {
    for (let x = -rx; x <= rx; x++) {
      for (let y = -ry; y <= ry; y++) {
        for (let z = -rz; z <= rz; z++) {
          if (grid.count > 26500) return;
          const e = (x * x) / (rx * rx) + (y * y) / (ry * ry) + (z * z) / (rz * rz);
          if (e + hash3(x + cx, y + cy, z + cz) * 0.45 > 0.92) continue;
          grid.add(cx + x, cy + y, cz + z, hash3(x, y, z) > 0.55 ? C.cloud : C.cloud2);
        }
      }
    }
  };

  const baseY = 14;
  const stories = [
    { half: 5, body: 7, roof: 8 },
    { half: 4, body: 6, roof: 7 },
    { half: 4, body: 6, roof: 6 },
    { half: 3, body: 5, roof: 5 },
    { half: 3, body: 5, roof: 5 },
  ];

  for (let x = -8; x <= 8; x++) {
    for (let z = -8; z <= 8; z++) {
      if (Math.max(Math.abs(x), Math.abs(z)) > 8) continue;
      grid.add(x, baseY - 2, z, C.stone);
      grid.add(x, baseY - 1, z, Math.max(Math.abs(x), Math.abs(z)) === 8 ? C.gold : C.darkStone);
    }
  }
  for (let i = -9; i <= 9; i++) {
    grid.add(i, baseY - 1, -9, C.stone);
    grid.add(i, baseY - 1, 9, C.stone);
    grid.add(-9, baseY - 1, i, C.stone);
    grid.add(9, baseY - 1, i, C.stone);
  }

  const addRoof = (cx: number, y0: number, cz: number, R: number) => {
    for (let dx = -R; dx <= R; dx++) {
      for (let dz = -R; dz <= R; dz++) {
        const cheb = Math.max(Math.abs(dx), Math.abs(dz));
        if (cheb > R) continue;
        const radial = Math.hypot(dx, dz) / (R + 0.2);
        let dy = -Math.round(radial * radial * 3.1);
        const corner = Math.abs(dx) >= R - 1 && Math.abs(dz) >= R - 1;
        const rim = cheb >= R - 1;
        if (rim) dy += 1;
        if (cheb === R) dy += 1;
        if (corner) dy += 2;
        if (Math.abs(dx) === R && Math.abs(dz) === R) dy += 1;
        const y = y0 + dy;
        const goldTip = Math.abs(dx) === R && Math.abs(dz) === R;
        const col = goldTip ? C.gold : cheb === R ? C.gold : (dx + dz + R) % 2 === 0 ? C.jade : C.jade2;
        grid.add(cx + dx, y, cz + dz, col);
        grid.add(cx + dx, y - 1, cz + dz, C.teak);
        if (cheb >= R - 1 && (dx + dz) % 2 === 0) grid.add(cx + dx, y - 2, cz + dz, C.vermillion);
        if (goldTip) {
          grid.add(cx + dx, y + 1, cz + dz, C.gold);
          grid.add(cx + dx + Math.sign(dx || 1), y + 2, cz + dz + Math.sign(dz || 1), C.gold);
        }
      }
    }
    grid.add(cx, y0 + 1, cz, C.gold);
  };

  const floorY: number[] = [];
  const doorCenters: { x: number; y: number; z: number; h: number; w: number }[] = [];
  let yCursor = baseY;

  stories.forEach((st, si) => {
    const w = st.half;
    floorY.push(yCursor);
    for (let x = -w; x <= w; x++) {
      for (let z = -w; z <= w; z++) {
        const cheb = Math.max(Math.abs(x), Math.abs(z));
        if (cheb <= w) grid.add(x, yCursor, z, cheb === w ? C.vermillion : C.teak);
      }
    }
    for (let y = 1; y <= st.body; y++) {
      for (let x = -w; x <= w; x++) {
        for (let z = -w; z <= w; z++) {
          const edge = Math.abs(x) === w || Math.abs(z) === w;
          if (!edge) {
            if (y === 1 && Math.abs(x) < w - 1 && Math.abs(z) < w - 1) grid.add(x, yCursor + y, z, C.glow);
            continue;
          }
          const doorHole = z === w && Math.abs(x) <= 1 && y >= 1 && y <= st.body - 1;
          if (doorHole) continue;
          const windowHole =
            ((Math.abs(x) === w && Math.abs(z) <= 1 && y >= 2 && y <= st.body - 2 && z !== w) ||
              (Math.abs(z) === w && Math.abs(x) <= 1 && y >= 2 && y <= st.body - 2 && z !== w)) &&
            si > 0;
          const pillar =
            (Math.abs(x) === w && Math.abs(z) === w) ||
            (Math.abs(x) === w && z === 0) ||
            (Math.abs(z) === w && x === 0);
          if (windowHole) {
            grid.add(x, yCursor + y, z, C.paper);
            continue;
          }
          grid.add(x, yCursor + y, z, pillar ? C.vermillion : C.cream);
        }
      }
    }
    const railY = yCursor + st.body;
    for (let x = -w - 1; x <= w + 1; x++) {
      for (let z = -w - 1; z <= w + 1; z++) {
        const cheb = Math.max(Math.abs(x), Math.abs(z));
        if (cheb === w + 1) {
          grid.add(x, railY, z, C.teak);
          if ((x + z) % 2 === 0) grid.add(x, railY + 1, z, C.vermillion);
        }
      }
    }
    addRoof(0, yCursor + st.body + 1, 0, st.roof);
    doorCenters.push({ x: 0, y: yCursor + 1, z: w, h: st.body - 1, w: 2 });
    yCursor += st.body + 2;
  });

  const finBase = yCursor + 2;
  for (let i = 0; i < 3; i++) {
    for (let x = -1; x <= 1; x++) {
      for (let z = -1; z <= 1; z++) grid.add(x, finBase + i, z, C.gold);
    }
  }
  for (let i = 0; i < 9; i++) {
    const y = finBase + 3 + i;
    grid.add(0, y, 0, C.gold);
    grid.add(1, y, 0, i % 2 === 0 ? C.gold : C.vermillion);
    grid.add(-1, y, 0, i % 2 === 0 ? C.gold : C.vermillion);
    grid.add(0, y, 1, i % 2 === 0 ? C.gold : C.vermillion);
    grid.add(0, y, -1, i % 2 === 0 ? C.gold : C.vermillion);
  }

  const dropCount = 90;
  const dropMesh = new THREE.InstancedMesh(
    new THREE.BoxGeometry(0.12, 0.28, 0.12),
    new THREE.MeshStandardMaterial({
      color: C.pond,
      transparent: true,
      opacity: 0.72,
      roughness: 0.3,
      emissive: new THREE.Color(C.foam),
      emissiveIntensity: 0.12,
    }),
    dropCount,
  );
  dropMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  scene.add(dropMesh);
  const drops = Array.from({ length: dropCount }, () => ({
    x: (fallX + rng.range(-0.6, 0.8)) * VOX,
    y: rng.range(-6, fallTop * VOX),
    z: (fallZ + rng.range(-0.3, 0.7)) * VOX,
    vy: rng.range(3.5, 6.5),
  }));

  const birds: { g: THREE.Group; wingL: THREE.Mesh; wingR: THREE.Mesh; t: number; r: number; sp: number; y: number }[] =
    [];
  for (let i = 0; i < 8; i++) {
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({
      color: i % 2 === 0 ? C.crane : 0x222222,
      roughness: 0.7,
      flatShading: true,
    });
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.08, 0.28), mat);
    const wingL = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.04, 0.14), mat);
    const wingR = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.04, 0.14), mat);
    wingL.position.x = -0.24;
    wingR.position.x = 0.24;
    g.add(body);
    g.add(wingL);
    g.add(wingR);
    scene.add(g);
    birds.push({
      g,
      wingL,
      wingR,
      t: rng.range(0, Math.PI * 2),
      r: 4.5 + i * 0.45,
      sp: 0.28 + rng.next() * 0.25,
      y: (baseY + 16 + i) * VOX,
    });
  }

  const fireGeo = new THREE.BufferGeometry();
  const firePos = new Float32Array(24 * 3);
  fireGeo.setAttribute("position", new THREE.BufferAttribute(firePos, 3));
  const fireMat = new THREE.PointsMaterial({
    color: 0xffe29a,
    size: 0.12,
    transparent: true,
    opacity: 0,
    depthWrite: false,
  });
  const fireflies = new THREE.Points(fireGeo, fireMat);
  scene.add(fireflies);

  const dummy = new THREE.Object3D();
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.055;
  controls.autoRotate = false;
  controls.autoRotateSpeed = 0.42;
  controls.minDistance = 5;
  controls.maxDistance = 48;
  controls.maxPolarAngle = Math.PI * 0.62;
  controls.minPolarAngle = 0.18;
  controls.target.set(0, (baseY + 8) * VOX, 0);

  const introFrom = new THREE.Vector3(0.15, (toriiY + 2.2) * VOX, (toriiZ + 9) * VOX);
  const introLook = new THREE.Vector3(0, (baseY + 5) * VOX, 2);
  const introTo = new THREE.Vector3(10.6, (baseY + 15) * VOX, 12.4);
  const introToLook = new THREE.Vector3(0, (baseY + 9) * VOX, 0);
  camera.position.copy(introFrom);
  controls.target.copy(introLook);

  const hud = injectHud(container);
  let timeOfDay = 0.38;
  let paused = false;
  let lastInteract = 0;
  let introT = 0;
  let fps = 60;
  let lastT = performance.now();
  let raf = 0;
  const clock = new THREE.Clock();

  hud.slider.value = String(timeOfDay);
  hud.slider.addEventListener("input", () => {
    timeOfDay = parseFloat(hud.slider.value);
    lastInteract = clock.elapsedTime;
  });
  hud.pause.addEventListener("click", () => {
    paused = !paused;
    hud.pause.textContent = paused ? "PLAY" : "PAUSE";
    lastInteract = clock.elapsedTime;
  });

  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  let downX = 0;
  let downY = 0;

  const onDown = (e: PointerEvent) => {
    downX = e.clientX;
    downY = e.clientY;
    lastInteract = clock.elapsedTime;
    controls.autoRotate = false;
  };
  const onUp = (e: PointerEvent) => {
    if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;
    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(
      [...lanterns.map((l) => l.mesh), ...floors.map((f) => f.hit)],
      false,
    );
    if (!hits.length) return;
    const obj = hits[0].object;
    if (obj.userData.lantern !== undefined) {
      const L = lanterns[obj.userData.lantern as number];
      const lit = lanternLit(L, isNight());
      if (lit) {
        L.userOff = true;
        L.userOn = false;
      } else {
        L.userOn = true;
        L.userOff = false;
      }
    } else if (obj.userData.floor !== undefined) {
      const f = floors[obj.userData.floor as number];
      f.open = !f.open;
    }
  };

  function isNight() {
    return timeOfDay < 0.22 || timeOfDay > 0.78;
  }
  function lanternLit(L: Lantern, night: boolean) {
    if (L.userOn) return true;
    if (L.userOff) return false;
    return night || timeOfDay > 0.7 || timeOfDay < 0.28;
  }

  renderer.domElement.addEventListener("pointerdown", onDown);
  renderer.domElement.addEventListener("pointerup", onUp);
  controls.addEventListener("start", () => {
    lastInteract = clock.elapsedTime;
    controls.autoRotate = false;
  });

  const onResize = () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  };
  window.addEventListener("resize", onResize);

  const skyTop = new THREE.Color();
  const skyMid = new THREE.Color();
  const skyBot = new THREE.Color();
  const fogCol = new THREE.Color();
  const dayTop = new THREE.Color(0x6eb6de);
  const dayMid = new THREE.Color(0xd7f1f8);
  const dayBot = new THREE.Color(0xf3d3b5);
  const duskTop = new THREE.Color(0x2a1d4a);
  const duskMid = new THREE.Color(0xd45d3a);
  const duskBot = new THREE.Color(0xf0b27a);
  const nightTop = new THREE.Color(0x0b1024);
  const nightMid = new THREE.Color(0x1a2a4a);
  const nightBot = new THREE.Color(0x24324a);
  const dawnTop = new THREE.Color(0x5b7cae);
  const dawnMid = new THREE.Color(0xf3a38a);
  const dawnBot = new THREE.Color(0xffd1a6);

  function applySky() {
    const t = timeOfDay;
    let mix = 0;
    let fromT = dayTop;
    let fromM = dayMid;
    let fromB = dayBot;
    let toT = dayTop;
    let toM = dayMid;
    let toB = dayBot;
    if (t < 0.2) {
      fromT = nightTop;
      fromM = nightMid;
      fromB = nightBot;
      toT = dawnTop;
      toM = dawnMid;
      toB = dawnBot;
      mix = t / 0.2;
    } else if (t < 0.3) {
      fromT = dawnTop;
      fromM = dawnMid;
      fromB = dawnBot;
      toT = dayTop;
      toM = dayMid;
      toB = dayBot;
      mix = (t - 0.2) / 0.1;
    } else if (t < 0.62) {
      fromT = dayTop;
      fromM = dayMid;
      fromB = dayBot;
      toT = dayTop;
      toM = dayMid;
      toB = dayBot;
      mix = 0;
    } else if (t < 0.78) {
      fromT = dayTop;
      fromM = dayMid;
      fromB = dayBot;
      toT = duskTop;
      toM = duskMid;
      toB = duskBot;
      mix = (t - 0.62) / 0.16;
    } else {
      fromT = duskTop;
      fromM = duskMid;
      fromB = duskBot;
      toT = nightTop;
      toM = nightMid;
      toB = nightBot;
      mix = (t - 0.78) / 0.22;
    }
    skyTop.copy(fromT).lerp(toT, mix);
    skyMid.copy(fromM).lerp(toM, mix);
    skyBot.copy(fromB).lerp(toB, mix);
    (skyMat.uniforms.topColor.value as THREE.Color).copy(skyTop);
    (skyMat.uniforms.midColor.value as THREE.Color).copy(skyMid);
    (skyMat.uniforms.botColor.value as THREE.Color).copy(skyBot);
    fogCol.copy(skyMid).lerp(skyBot, 0.35);
    (scene.fog as THREE.FogExp2).color.copy(fogCol);
    renderer.setClearColor(fogCol, 1);
  }

  function animate() {
    raf = requestAnimationFrame(animate);
    const now = performance.now();
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    const t = clock.getElapsedTime();
    fps = fps * 0.9 + (1 / Math.max(dt, 1 / 240)) * 0.1;

    if (!paused) {
      timeOfDay = (timeOfDay + dt / CYCLE) % 1;
      hud.slider.value = String(timeOfDay);
    }

    introT = Math.min(1, introT + dt / 2.5);
    const e = introT < 0.5 ? 2 * introT * introT : 1 - Math.pow(-2 * introT + 2, 2) / 2;
    if (introT < 1) {
      camera.position.lerpVectors(introFrom, introTo, e);
      controls.target.lerpVectors(introLook, introToLook, e);
    } else if (t - lastInteract > 4.2) {
      controls.autoRotate = true;
    }

    const sunAng = (timeOfDay - 0.25) * Math.PI * 2;
    const sunY = Math.sin(sunAng);
    const sunX = Math.cos(sunAng);
    sun.position.set(sunX * 36, Math.max(sunY, 0.05) * 32 + 4, 10 + Math.cos(sunAng * 0.6) * 8);
    sun.target.position.set(0, (baseY + 6) * VOX, 0);
    sunBall.position.copy(sun.position).multiplyScalar(1.15);
    sunHalo.position.copy(sunBall.position);
    moonBall.position.set(-sunX * 34, Math.max(-sunY, 0.05) * 28 + 6, -8);

    const dayFactor = THREE.MathUtils.clamp(sunY * 1.15 + 0.28, 0.28, 1);
    sun.intensity = 0.55 + dayFactor * 1.85;
    sun.color.set(sunY > 0.12 ? 0xfff3d6 : 0xc9d6ff);
    hemi.intensity = 0.42 + dayFactor * 0.45;
    hemi.color.set(sunY > 0 ? 0xd7ecff : 0xa8b8e8);
    fill.intensity = 0.18 + (1 - dayFactor) * 0.28;
    renderer.toneMappingExposure = 1.02 + dayFactor * 0.28;
    interior.intensity = 0.55 + (1 - dayFactor) * 1.1;
    starMat.opacity = THREE.MathUtils.clamp(1 - dayFactor * 1.6, 0, 0.9);
    fireMat.opacity = THREE.MathUtils.clamp(1 - dayFactor * 1.8, 0, 0.85);
    applySky();

    const night = isNight() || dayFactor < 0.35;
    lanterns.forEach((L, i) => {
      const on = lanternLit(L, night);
      const flick = on ? L.base * (0.82 + Math.sin(t * 17 + i * 2.1) * 0.1 + Math.sin(t * 31 + i) * 0.06) : 0;
      L.light.intensity = flick * (on ? 1 : 0);
      (L.sprite.material as THREE.SpriteMaterial).opacity = on ? 0.55 + Math.sin(t * 14 + i) * 0.08 : 0.02;
      L.sprite.scale.setScalar(on ? 1.7 + Math.sin(t * 9 + i) * 0.12 : 0.4);
    });

    floors.forEach((f) => {
      f.t = THREE.MathUtils.lerp(f.t, f.open ? 1 : 0, 1 - Math.pow(0.001, dt));
      f.left.rotation.y = -f.t * 1.15;
      f.right.rotation.y = f.t * 1.15;
    });

    waterUniforms.uTime.value = t;
    koi.forEach((k, i) => {
      const a = t * k.speed + k.phase;
      const x = (pondCx + 0.5) * VOX + Math.cos(a) * k.a;
      const z = (pondCz + 0.5) * VOX + Math.sin(a * 0.92 + i) * k.b;
      k.group.position.set(x, k.y + Math.sin(a * 2) * 0.04, z);
      k.group.rotation.y = Math.atan2(Math.cos(a * 0.92 + i) * k.b, -Math.sin(a) * k.a) + Math.PI;
      k.group.rotation.z = Math.sin(a * 3) * 0.12;
    });

    petals.forEach((p, i) => {
      p.y -= p.vy * dt;
      p.x += Math.sin(t * 0.7 + p.phase) * p.drift * dt;
      p.z += Math.cos(t * 0.55 + p.phase) * p.drift * 0.6 * dt;
      if (p.y < 5.5) {
        p.y = rng.range(12, 18);
        p.x = rng.range(-12, 6);
        p.z = rng.range(2, 16);
      }
      dummy.position.set(p.x, p.y, p.z);
      dummy.rotation.set(t * p.spin, t * 0.4 + p.phase, Math.sin(t + p.phase));
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      petalMesh.setMatrixAt(i, dummy.matrix);
    });
    petalMesh.instanceMatrix.needsUpdate = true;

    windLeaves.forEach((w, i) => {
      dummy.position.set(
        w.x + Math.sin(t * 1.4 + w.ph) * 0.12,
        w.y + Math.sin(t * 1.1 + w.ph) * 0.05,
        w.z,
      );
      dummy.rotation.set(0.2, t * 0.3 + w.ph, Math.sin(t * 1.6 + w.ph) * 0.45);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      windMesh.setMatrixAt(i, dummy.matrix);
    });
    windMesh.instanceMatrix.needsUpdate = true;

    drops.forEach((d, i) => {
      d.y -= d.vy * dt;
      if (d.y < -6.8) d.y = (fallTop + rng.range(0, 2)) * VOX;
      dummy.position.set(d.x + Math.sin(t * 3 + i) * 0.05, d.y, d.z);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(1, 1 + (d.vy - 4) * 0.08, 1);
      dummy.updateMatrix();
      dropMesh.setMatrixAt(i, dummy.matrix);
    });
    dropMesh.instanceMatrix.needsUpdate = true;

    birds.forEach((b, i) => {
      b.t += dt * b.sp;
      const x = Math.cos(b.t + i) * b.r;
      const z = Math.sin(b.t + i) * b.r * 0.78;
      b.g.position.set(x, b.y + Math.sin(b.t * 2) * 0.25, z);
      b.g.lookAt(0, b.y, 0);
      b.g.rotateY(Math.PI);
      const flap = Math.sin(t * 10 + i) * 0.55;
      b.wingL.rotation.z = flap;
      b.wingR.rotation.z = -flap;
    });

    const fp = fireGeo.attributes.position as THREE.BufferAttribute;
    for (let i = 0; i < 24; i++) {
      fp.setXYZ(
        i,
        Math.sin(t * 0.4 + i) * 6 + Math.sin(t * 0.7 + i * 2) * 2,
        (baseY + 2) * VOX + (i % 7) * 0.55 + Math.sin(t * 1.3 + i) * 0.4,
        Math.cos(t * 0.35 + i * 1.3) * 6,
      );
    }
    fp.needsUpdate = true;

    controls.update();
    renderer.render(scene, camera);

    const voxels = grid.count + petalCount + dropCount + windCount;
    hud.stats.textContent = `${(voxels / 1000).toFixed(1)}k voxels | ${Math.round(fps)} FPS`;
    window.__VOXEL__ = {
      voxelCount: voxels,
      fps,
      pagodaFloors: 5,
      timeOfDay,
    };
  }

  window.__VOXEL__ = {
    voxelCount: grid.count,
    fps: 60,
    pagodaFloors: 5,
    timeOfDay,
  };

  animate();

  return () => {
    cancelAnimationFrame(raf);
    window.removeEventListener("resize", onResize);
    renderer.domElement.removeEventListener("pointerdown", onDown);
    renderer.domElement.removeEventListener("pointerup", onUp);
    controls.dispose();
    built.meshes.forEach((m) => {
      scene.remove(m);
      (m.material as THREE.Material).dispose();
    });
    built.geo.dispose();
    renderer.dispose();
    if (renderer.domElement.parentElement === container) container.removeChild(renderer.domElement);
  };
}

declare global {
  interface Window {
    __VOXEL__: {
      voxelCount: number;
      fps: number;
      pagodaFloors: number;
      timeOfDay: number;
    };
  }
}
mountPagoda(document.getElementById("stage")!);
</script>
</body>
</html>
