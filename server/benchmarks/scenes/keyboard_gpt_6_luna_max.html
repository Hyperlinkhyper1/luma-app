<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ebe8e0">
  <title>MORA / 75 - Mechanical Keyboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root {
      color-scheme: light;
      --paper: #ebe8e0;
      --paper-light: #f5f2eb;
      --ink: #242a27;
      --muted: #747972;
      --line: rgba(43, 51, 46, .18);
      --copper: #a76547;
      --unit: 43px;
      --gap: 4px;
      --pitch: 47px;
      --case-dark: #1c2522;
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; background: var(--paper); }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 43%, rgba(255, 255, 255, .57), transparent 51%),
        var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    button { font: inherit; }

    .page-shell {
      width: min(100%, 1600px);
      min-height: 100svh;
      margin: 0 auto;
      padding: 0 52px 24px;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 78px;
      flex: 0 0 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .studio-mark {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--ink);
      text-decoration: none;
    }

    .mark-symbol {
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(47, 56, 50, .55);
      border-radius: 50%;
    }

    .mark-symbol::before {
      content: "";
      width: 8px;
      height: 8px;
      display: block;
      background: var(--copper);
      border-radius: 2px;
      transform: rotate(45deg);
    }

    .studio-wordmark {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .21em;
      text-transform: uppercase;
    }

    .topbar-note {
      margin: 0;
      color: #6f746e;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .topbar-note span { padding: 0 11px; color: #b4ab9c; }

    .showcase {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
    }

    .hero-intro {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 28px;
      padding: 31px 4px 0;
    }

    .hero-overline {
      margin: 0 0 8px 3px;
      color: var(--copper);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #252b28;
      font-size: clamp(45px, 6.5vw, 76px);
      font-weight: 560;
      letter-spacing: -.085em;
      line-height: .9;
    }

    h1 .model-number {
      color: #7a8179;
      font-size: .69em;
      font-weight: 400;
      letter-spacing: -.07em;
    }

    .hero-deck {
      max-width: 255px;
      margin: 0 5px 4px 0;
      color: #666d66;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.6;
      text-align: right;
    }

    .scene {
      position: relative;
      height: clamp(385px, 57vh, 545px);
      min-height: 0;
      flex: 0 1 auto;
      overflow: hidden;
      perspective: 1550px;
      perspective-origin: 50% 46%;
      isolation: isolate;
    }

    .scene::before {
      content: "";
      position: absolute;
      inset: 4% 0 3%;
      z-index: -2;
      background: radial-gradient(ellipse at 50% 52%, rgba(255, 255, 255, .74), rgba(245, 242, 234, .31) 43%, transparent 71%);
      pointer-events: none;
    }

    .scene-shadow {
      position: absolute;
      top: 58%;
      left: 50%;
      width: min(76vw, 980px);
      height: 86px;
      border-radius: 50%;
      background: rgba(42, 47, 42, .19);
      filter: blur(28px);
      transform: translate(-50%, -50%) rotate(-12deg) skewX(-12deg);
      pointer-events: none;
    }

    .scene-glint {
      position: absolute;
      right: 12%;
      bottom: 14%;
      width: 1px;
      height: 58px;
      background: linear-gradient(transparent, rgba(170, 133, 96, .25), transparent);
      transform: rotate(37deg);
      pointer-events: none;
    }

    .board-scale {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(var(--object-scale, 1));
      transform-origin: 50% 50%;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .board-tilt {
      position: absolute;
      inset: 0;
      transform: rotateX(56deg) rotateZ(-12deg);
      transform-style: preserve-3d;
      will-change: transform;
    }

    .board-tilt.is-idle {
      animation: idle-float 7.5s ease-in-out infinite;
    }

    @keyframes idle-float {
      0%, 100% { transform: rotateX(56deg) rotateZ(-12deg) translateY(0); }
      50% { transform: rotateX(56deg) rotateZ(-12deg) translateY(-3px); }
    }

    .case-shell {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
    }

    .case-floor {
      position: absolute;
      inset: 10px;
      border: 1px solid #2d3834;
      border-radius: 15px;
      background: linear-gradient(145deg, #222c28, #111816 68%);
      transform: translateZ(-30px);
      box-shadow: inset 0 0 0 1px rgba(202, 178, 135, .08);
    }

    .case-rim {
      position: absolute;
      inset: 0;
      border: 13px solid #28332f;
      border-top-color: #37433e;
      border-right-color: #202a26;
      border-bottom-color: #141b19;
      border-left-color: #303b36;
      border-radius: 20px;
      background: transparent;
      transform: translateZ(0);
      box-shadow: inset 0 0 0 1px rgba(207, 176, 127, .38), 0 0 0 1px #101614;
    }

    .case-rim::after {
      content: "";
      position: absolute;
      inset: -7px;
      border: 1px solid rgba(223, 203, 165, .26);
      border-radius: 12px;
      pointer-events: none;
    }

    .case-front, .case-back, .case-left, .case-right {
      position: absolute;
      background: linear-gradient(180deg, #303b36, #1c2522 38%, #111715);
      backface-visibility: visible;
    }

    .case-front {
      top: 100%;
      left: 0;
      width: 100%;
      height: 30px;
      transform-origin: top center;
      transform: rotateX(-90deg);
      border-top: 1px solid rgba(219, 185, 133, .6);
      border-radius: 0 0 10px 10px;
    }

    .case-front::after {
      content: "";
      position: absolute;
      top: 15px;
      left: 50%;
      width: 96px;
      height: 2px;
      background: repeating-linear-gradient(90deg, rgba(184, 170, 142, .56) 0 3px, transparent 3px 9px);
      opacity: .66;
      transform: translateX(-50%);
    }

    .case-back {
      top: 0;
      left: 0;
      width: 100%;
      height: 30px;
      transform-origin: bottom center;
      transform: rotateX(90deg);
      background: linear-gradient(180deg, #121917, #28332f);
    }

    .case-left {
      top: 0;
      left: 0;
      width: 30px;
      height: 100%;
      transform-origin: left center;
      transform: translateZ(-30px) rotateY(-90deg);
      background: linear-gradient(90deg, #141b19, #313c37);
    }

    .case-right {
      top: 0;
      left: 100%;
      width: 30px;
      height: 100%;
      transform-origin: left center;
      transform: rotateY(90deg);
      background: linear-gradient(90deg, #303b36, #131a18);
    }

    .case-screw {
      position: absolute;
      z-index: 3;
      width: 7px;
      height: 7px;
      border: 1px solid rgba(228, 211, 176, .63);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #b8a47f, #4c5147 66%);
      transform: translateZ(2px);
      box-shadow: 0 1px 1px rgba(0, 0, 0, .4);
    }

    .case-screw::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 1px;
      width: 3px;
      height: 1px;
      background: #313a34;
      transform: rotate(-38deg);
    }

    .case-screw.one { top: 7px; left: 7px; }
    .case-screw.two { top: 7px; right: 7px; }
    .case-screw.three { bottom: 7px; left: 7px; }
    .case-screw.four { right: 7px; bottom: 7px; }

    .assembly-piece {
      position: absolute;
      top: var(--y);
      left: var(--x);
      transform-style: preserve-3d;
      transform-origin: 50% 50%;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      will-change: transform, opacity;
      transition:
        transform var(--motion-duration, 850ms) cubic-bezier(.18, .74, .21, 1),
        opacity 240ms ease,
        visibility 0s linear 300ms;
    }

    .assembly-piece.is-visible {
      opacity: 1;
      visibility: visible;
      transition-delay: 0s;
    }

    .assembly-piece.is-installed {
      --lift: 0px;
      --dx: 0px;
      --dy: 0px;
      --rx: 0deg;
      --ry: 0deg;
      --rz: 0deg;
      --scale: 1;
    }

    .sheet {
      width: var(--w);
      height: var(--h);
      --lift: var(--lift-start, 0px);
      --dx: var(--dx-start, 0px);
      --dy: var(--dy-start, 0px);
      --rx: var(--rx-start, 0deg);
      --ry: var(--ry-start, 0deg);
      --rz: var(--rz-start, 0deg);
      --scale: var(--scale-start, .98);
      transform: translate3d(var(--dx), var(--dy), calc(var(--z) + var(--lift))) rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(var(--rz)) scale(var(--scale));
    }

    .sheet-top, .sheet-front, .sheet-back, .sheet-left, .sheet-right {
      position: absolute;
      box-sizing: border-box;
    }

    .sheet-top {
      inset: 0;
      border: 1px solid rgba(9, 20, 16, .3);
      border-radius: 7px;
      transform: translateZ(var(--depth));
      overflow: hidden;
    }

    .sheet-front {
      top: 100%;
      left: 0;
      width: 100%;
      height: var(--depth);
      transform-origin: top center;
      transform: translateZ(var(--depth)) rotateX(-90deg);
      border-top: 1px solid rgba(255, 255, 255, .3);
    }

    .sheet-back {
      top: 0;
      left: 0;
      width: 100%;
      height: var(--depth);
      transform-origin: bottom center;
      transform: rotateX(-90deg);
    }

    .sheet-left {
      top: 0;
      left: 0;
      width: var(--depth);
      height: 100%;
      transform-origin: left center;
      transform: rotateY(-90deg);
    }

    .sheet-right {
      top: 0;
      left: 100%;
      width: var(--depth);
      height: 100%;
      transform-origin: left center;
      transform: translateZ(var(--depth)) rotateY(90deg);
    }

    .sheet-details {
      position: absolute;
      inset: 0;
      transform: translateZ(calc(var(--depth) + 1px));
      transform-style: preserve-3d;
      pointer-events: none;
    }

    .sheet-pcb .sheet-top {
      border-color: rgba(175, 202, 148, .35);
      border-radius: 5px;
      background-color: #1d5e50;
      background-image:
        linear-gradient(90deg, transparent 0 21px, rgba(198, 175, 107, .1) 21px 22px, transparent 22px 58px),
        linear-gradient(0deg, transparent 0 27px, rgba(195, 176, 117, .09) 27px 28px, transparent 28px 62px),
        radial-gradient(circle at 22% 28%, rgba(199, 166, 100, .19) 0 2px, transparent 2.5px),
        linear-gradient(140deg, #28735f, #164b42 77%);
      background-size: 62px 64px, 64px 62px, 88px 76px, auto;
      box-shadow: inset 0 0 0 2px rgba(11, 41, 35, .32);
    }

    .sheet-pcb .sheet-front, .sheet-pcb .sheet-back,
    .sheet-pcb .sheet-left, .sheet-pcb .sheet-right {
      background: linear-gradient(180deg, #2c806b, #16483f);
    }

    .sheet-foam .sheet-top {
      border-color: rgba(222, 224, 209, .08);
      border-radius: 4px;
      background-color: #333a35;
      background-image:
        repeating-linear-gradient(113deg, rgba(220, 220, 203, .035) 0 1px, transparent 1px 4px),
        radial-gradient(ellipse at 47% 40%, #3d4540, #242b27 77%);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .28);
    }

    .sheet-foam .sheet-front, .sheet-foam .sheet-back,
    .sheet-foam .sheet-left, .sheet-foam .sheet-right {
      background: linear-gradient(180deg, #3a413d, #202622);
    }

    .sheet-plate .sheet-top {
      border-color: rgba(90, 69, 43, .48);
      border-radius: 5px;
      background-color: #b5a17d;
      background-image:
        repeating-linear-gradient(0deg, rgba(255, 246, 220, .12) 0 1px, transparent 1px 3px),
        linear-gradient(135deg, #d2c09d, #aa9876 52%, #c3b18f);
      box-shadow: inset 0 0 0 1px rgba(255, 246, 222, .25);
    }

    .sheet-plate .sheet-front, .sheet-plate .sheet-back,
    .sheet-plate .sheet-left, .sheet-plate .sheet-right {
      background: linear-gradient(180deg, #ccb997, #88785d);
    }

    .pcb-stamp {
      position: absolute;
      right: 24px;
      bottom: 16px;
      color: rgba(231, 217, 176, .82);
      font: 600 9px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .pcb-substamp {
      display: block;
      margin-top: 4px;
      font-size: 7px;
      letter-spacing: .1em;
      opacity: .72;
    }

    .pcb-contact {
      position: absolute;
      width: 17px;
      height: 17px;
      border: 1px solid rgba(224, 187, 112, .58);
      border-radius: 4px;
      background: linear-gradient(145deg, rgba(219, 185, 116, .64), rgba(119, 97, 56, .36));
      box-shadow: inset 0 0 0 3px rgba(21, 68, 55, .6);
    }

    .pcb-contact::after {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      background: #d5b879;
      opacity: .72;
    }

    .pcb-trace {
      position: absolute;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(219, 183, 107, .65), transparent);
      transform-origin: left center;
      opacity: .55;
    }

    .pcb-chip {
      position: absolute;
      width: 43px;
      height: 24px;
      border: 1px solid rgba(221, 187, 121, .56);
      border-radius: 3px;
      background: repeating-linear-gradient(90deg, #18241e 0 4px, #26352b 4px 6px);
      box-shadow: 0 0 0 3px rgba(218, 181, 104, .12);
    }

    .surface-cutout {
      position: absolute;
      width: 26px;
      height: 26px;
      border: 1px solid rgba(61, 50, 34, .68);
      border-radius: 5px;
      background: linear-gradient(145deg, #252d28, #111815 72%);
      box-shadow: 0 0 0 1px rgba(229, 209, 169, .25), inset 0 1px 2px rgba(0, 0, 0, .62);
    }

    .foam-aperture {
      position: absolute;
      width: 22px;
      height: 22px;
      border: 1px solid rgba(6, 12, 10, .65);
      border-radius: 4px;
      background: rgba(14, 19, 17, .75);
      box-shadow: 0 0 0 2px rgba(193, 197, 178, .035);
    }

    .plate-mark {
      position: absolute;
      width: 16px;
      height: 5px;
      border: 1px solid rgba(73, 61, 43, .5);
      border-radius: 3px;
      background: linear-gradient(180deg, #d7c5a0, #938263);
    }

    .switch-part {
      width: 23px;
      height: 23px;
      --lift: var(--lift-start, 58px);
      --dx: var(--dx-start, 0px);
      --dy: var(--dy-start, 0px);
      --rx: var(--rx-start, -7deg);
      --ry: var(--ry-start, 4deg);
      --rz: var(--rz-start, 0deg);
      --scale: var(--scale-start, .94);
      transform: translate3d(var(--dx), var(--dy), calc(var(--z) + var(--lift))) rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(var(--rz)) scale(var(--scale));
      --motion-duration: 430ms;
      transition:
        transform var(--motion-duration) cubic-bezier(.16, .77, .26, 1),
        opacity 170ms ease,
        visibility 0s linear 200ms;
    }

    .switch-part.is-visible { transition-delay: 0s; }

    .switch-body {
      position: absolute;
      inset: 0;
      border: 1px solid #75412b;
      border-radius: 4px;
      background: linear-gradient(145deg, #c57447, #8f4c31 74%);
      box-shadow: inset 0 0 0 2px rgba(237, 161, 103, .18), 0 2px 2px rgba(0, 0, 0, .2);
      transform: translateZ(0);
    }

    .switch-side-front, .switch-side-back, .switch-side-left, .switch-side-right {
      position: absolute;
      border: 1px solid #75412b;
      background: linear-gradient(180deg, #b96c43, #713e2c);
    }

    .switch-side-front {
      top: 100%;
      left: 0;
      width: 100%;
      height: 11px;
      transform-origin: top center;
      transform: translateZ(11px) rotateX(-90deg);
      border-top: 1px solid rgba(248, 184, 125, .5);
    }

    .switch-side-back {
      top: 0;
      left: 0;
      width: 100%;
      height: 11px;
      transform-origin: bottom center;
      transform: rotateX(-90deg);
    }

    .switch-side-left {
      top: 0;
      left: 0;
      width: 11px;
      height: 100%;
      transform-origin: left center;
      transform: rotateY(-90deg);
    }

    .switch-side-right {
      top: 0;
      left: 100%;
      width: 11px;
      height: 100%;
      transform-origin: left center;
      transform: translateZ(11px) rotateY(90deg);
    }

    .switch-housing-top {
      position: absolute;
      inset: 2px;
      border: 1px solid rgba(235, 166, 106, .55);
      border-radius: 3px;
      background: linear-gradient(135deg, #c17a4d, #9e5e3d);
      transform: translateZ(11px);
      box-shadow: inset 0 0 0 1px rgba(76, 39, 24, .28);
    }

    .switch-stem {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 7px;
      height: 17px;
      border: 1px solid #382c24;
      border-radius: 2px;
      background: linear-gradient(90deg, #302820, #574333 55%, #2a241e);
      transform: translate3d(-50%, -50%, calc(14px - var(--stem-press, 0px)));
      transition: transform 105ms ease-out;
      box-shadow: 0 1px 1px rgba(0, 0, 0, .35);
    }

    .switch-stem::after {
      content: "";
      position: absolute;
      top: 4px;
      left: -5px;
      width: 15px;
      height: 7px;
      border: 1px solid #382c24;
      border-radius: 2px;
      background: linear-gradient(180deg, #514032, #2b251f);
    }

    .switch-part.is-active .switch-stem {
      --stem-press: 3px;
      transition-duration: 70ms;
    }

    .keycap {
      z-index: 1;
      width: var(--w);
      height: var(--h);
      padding: 0;
      border: 0;
      border-radius: 7px;
      appearance: none;
      color: var(--legend);
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      --lift: var(--lift-start, 74px);
      --dx: var(--dx-start, 0px);
      --dy: var(--dy-start, -8px);
      --rx: var(--rx-start, -13deg);
      --ry: var(--ry-start, 4deg);
      --rz: var(--rz-start, 0deg);
      --scale: var(--scale-start, .93);
      --pressed: 0px;
      --motion-duration: 460ms;
      transform: translate3d(var(--dx), var(--dy), calc(var(--z) + var(--lift) - var(--pressed))) rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(var(--rz)) scale(var(--scale));
      transition:
        transform var(--motion-duration) cubic-bezier(.15, .77, .23, 1),
        opacity 220ms ease,
        visibility 0s linear 250ms,
        filter 160ms ease;
      outline: none;
    }

    .keycap.is-visible {
      pointer-events: auto;
      transition-delay: 0s;
    }

    .keycap.is-installed {
      --lift: 0px;
      --dx: 0px;
      --dy: 0px;
      --rx: 0deg;
      --ry: 0deg;
      --rz: 0deg;
      --scale: 1;
    }

    .keycap.is-pressed {
      --pressed: 7px;
      filter: brightness(.93);
      transition-duration: 76ms;
      transition-timing-function: cubic-bezier(.2, .75, .35, 1);
    }

    .keycap:focus-visible .cap-top {
      box-shadow: inset 0 0 0 2px rgba(164, 91, 60, .78), 0 0 0 2px rgba(245, 239, 224, .8);
    }

    .cap-top, .cap-front, .cap-back, .cap-left, .cap-right {
      position: absolute;
      box-sizing: border-box;
      pointer-events: none;
    }

    .cap-top {
      inset: 1px 2px 2px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--top-edge);
      border-radius: 6px;
      background: linear-gradient(148deg, var(--top-hi), var(--top) 58%, var(--top-low));
      transform: translateZ(16px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .47), inset 0 -2px 3px rgba(48, 43, 34, .13), 0 1px 0 rgba(25, 31, 27, .34);
    }

    .cap-front {
      top: 100%;
      left: 0;
      width: 100%;
      height: 16px;
      transform-origin: top center;
      transform: translateZ(16px) rotateX(-90deg);
      border: 1px solid var(--side-edge);
      border-top: 0;
      border-radius: 0 0 5px 5px;
      background: linear-gradient(180deg, var(--side-hi), var(--side));
    }

    .cap-back {
      top: 0;
      left: 0;
      width: 100%;
      height: 16px;
      transform-origin: bottom center;
      transform: rotateX(-90deg);
      background: linear-gradient(180deg, var(--side), var(--side-hi));
    }

    .cap-left {
      top: 0;
      left: 0;
      width: 16px;
      height: 100%;
      transform-origin: left center;
      transform: rotateY(-90deg);
      background: linear-gradient(90deg, var(--side), var(--side-hi));
    }

    .cap-right {
      top: 0;
      left: 100%;
      width: 16px;
      height: 100%;
      transform-origin: left center;
      transform: translateZ(16px) rotateY(90deg);
      background: linear-gradient(90deg, var(--side-hi), var(--side));
    }

    .key-label {
      position: relative;
      z-index: 2;
      display: block;
      max-width: 100%;
      padding: 0 3px;
      font-size: 9px;
      font-weight: 650;
      letter-spacing: .025em;
      line-height: 1;
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
      text-shadow: 0 1px rgba(255, 255, 255, .2);
    }

    .keycap[data-code="Space"] .key-label {
      font-size: 8px;
      font-weight: 500;
      letter-spacing: .29em;
    }

    .keycap[data-group="modifier"] .key-label,
    .keycap[data-group="backspace"] .key-label,
    .keycap[data-group="enter"] .key-label,
    .keycap[data-group="nav"] .key-label {
      font-size: 7px;
      letter-spacing: .035em;
    }

    .keycap[data-tone="cream"] {
      --top: #e2dac7;
      --top-hi: #f0e8d6;
      --top-low: #d4cbb8;
      --top-edge: rgba(99, 91, 74, .33);
      --side: #aaa28f;
      --side-hi: #c2b9a5;
      --side-edge: rgba(68, 64, 53, .53);
      --legend: #343b35;
    }

    .keycap[data-tone="sage"] {
      --top: #9da99a;
      --top-hi: #bac4b1;
      --top-low: #889589;
      --top-edge: rgba(51, 65, 55, .45);
      --side: #68766b;
      --side-hi: #819083;
      --side-edge: rgba(31, 44, 36, .58);
      --legend: #26332c;
    }

    .keycap[data-tone="rust"] {
      --top: #b96f50;
      --top-hi: #d08b67;
      --top-low: #a65d42;
      --top-edge: rgba(79, 43, 31, .52);
      --side: #804b37;
      --side-hi: #9a6047;
      --side-edge: rgba(55, 32, 24, .68);
      --legend: #f4e9d7;
    }

    .keycap[data-tone="forest"] {
      --top: #40564c;
      --top-hi: #597064;
      --top-low: #34483f;
      --top-edge: rgba(20, 31, 25, .64);
      --side: #25362f;
      --side-hi: #34463d;
      --side-edge: rgba(12, 20, 16, .78);
      --legend: #eee5d4;
    }

    .sequence-console {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-top: 1px solid var(--line);
    }

    .sequence-state {
      min-width: 0;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .state-light {
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border-radius: 50%;
      background: var(--copper);
      box-shadow: 0 0 0 3px rgba(167, 101, 71, .12);
      animation: status-breathe 2.2s ease-in-out infinite;
    }

    .state-light.is-done {
      background: #647d66;
      box-shadow: 0 0 0 3px rgba(100, 125, 102, .12);
      animation: none;
    }

    @keyframes status-breathe {
      0%, 100% { box-shadow: 0 0 0 3px rgba(167, 101, 71, .1); }
      50% { box-shadow: 0 0 0 6px rgba(167, 101, 71, .025); }
    }

    .state-copy { min-width: 0; }

    .state-title {
      display: block;
      overflow: hidden;
      color: #454c46;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .15em;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .state-detail {
      display: block;
      min-height: 13px;
      margin-top: 3px;
      color: #878c84;
      font-size: 9px;
      letter-spacing: .035em;
      white-space: nowrap;
    }

    .progress-track {
      width: min(18vw, 142px);
      height: 2px;
      margin-left: 12px;
      overflow: hidden;
      background: rgba(49, 58, 51, .12);
    }

    .progress-fill {
      width: var(--progress, 0%);
      height: 100%;
      background: #a76547;
      transition: width 420ms cubic-bezier(.2, .7, .2, 1);
    }

    .control-group {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 22px;
    }

    .control-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 0;
      border: 0;
      color: #47504a;
      background: transparent;
      cursor: pointer;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .045em;
      white-space: nowrap;
      transition: color 160ms ease, opacity 160ms ease;
    }

    .control-button:hover { color: var(--copper); }
    .control-button:focus-visible { outline: 1px solid var(--copper); outline-offset: 5px; }
    .control-button svg { width: 15px; height: 15px; stroke: currentColor; }

    .audio-hint {
      color: #888b83;
      font-size: 9px;
      letter-spacing: .035em;
      white-space: nowrap;
      transition: opacity 260ms ease, max-width 260ms ease;
    }

    .audio-hint.is-ready { opacity: 0; max-width: 0; overflow: hidden; }

    .page-foot {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: #94958d;
      font-size: 8px;
      font-weight: 600;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .page-foot span:last-child { text-align: right; }

    @media (max-width: 760px) {
      .page-shell { padding-right: 27px; padding-left: 27px; }
      .topbar { height: 68px; flex-basis: 68px; }
      .hero-intro { padding-top: 27px; }
      .scene { height: clamp(320px, 47vh, 420px); }
      .scene-shadow { width: 88vw; height: 60px; filter: blur(23px); }
      .sequence-console { min-height: 68px; gap: 14px; }
      .control-group { gap: 16px; }
      .progress-track { width: 74px; }
      .page-foot { padding-top: 2px; }
    }

    @media (max-width: 520px) {
      .page-shell { padding-right: 18px; padding-left: 18px; padding-bottom: 16px; }
      .topbar { height: 60px; flex-basis: 60px; }
      .topbar-note { font-size: 8px; letter-spacing: .12em; }
      .topbar-note span { padding: 0 5px; }
      .hero-intro { gap: 12px; padding: 25px 1px 0; }
      .hero-overline { margin-bottom: 8px; font-size: 8px; }
      h1 { font-size: clamp(43px, 12vw, 57px); }
      .hero-deck { max-width: 145px; margin-bottom: 1px; font-size: 10px; line-height: 1.45; }
      .scene { height: clamp(315px, 42vh, 365px); }
      .scene-glint { right: 7%; bottom: 12%; }
      .sequence-console { align-items: flex-start; flex-direction: column; justify-content: center; gap: 8px; padding: 10px 0; }
      .sequence-state { width: 100%; }
      .progress-track { width: min(19vw, 76px); margin-left: auto; }
      .control-group { width: 100%; justify-content: flex-start; gap: 18px; }
      .control-button { font-size: 9px; }
      .audio-hint { max-width: 100px; margin-left: auto; overflow: hidden; font-size: 8px; text-overflow: ellipsis; }
      .page-foot { font-size: 7px; }
      .key-label { font-size: 10px; }
    }

    @media (max-width: 360px) {
      .control-group { gap: 10px; }
      .audio-hint { max-width: 78px; font-size: 7px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="studio-mark" href="#" aria-label="Mora Studio home">
        <span class="mark-symbol" aria-hidden="true"></span>
        <span class="studio-wordmark">Mora Studio</span>
      </a>
      <p class="topbar-note">Objects for the daily ritual <span>/</span> 01</p>
    </header>

    <main class="showcase">
      <section class="hero-intro" aria-labelledby="product-title">
        <div>
          <p class="hero-overline">Mechanical study / 01</p>
          <h1 id="product-title">MORA<span class="model-number"> / 75</span></h1>
        </div>
        <p class="hero-deck">A considered 75% instrument.<br>Built from the circuit up.</p>
      </section>

      <section class="scene" id="scene" aria-label="Three-dimensional MORA 75 keyboard assembly">
        <div class="scene-shadow" aria-hidden="true"></div>
        <div class="scene-glint" aria-hidden="true"></div>
        <div class="board-scale" id="boardScale">
          <div class="board-tilt" id="boardTilt"></div>
        </div>
      </section>

      <section class="sequence-console" aria-label="Assembly and sound controls">
        <div class="sequence-state">
          <span class="state-light" id="stateLight" aria-hidden="true"></span>
          <div class="state-copy">
            <span class="state-title" id="assemblyStatus" aria-live="polite">Preparing assembly</span>
            <span class="state-detail" id="assemblyDetail">Motherboard, foam, plate, switches, keycaps</span>
          </div>
          <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>
        </div>
        <div class="control-group">
          <button class="control-button" id="replayButton" type="button" aria-label="Replay the assembly animation">
            <svg viewBox="0 0 20 20" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 7.5A6.4 6.4 0 1 0 16.2 12"/><path d="M16 3.7v4.5h-4.5"/></svg>
            <span>Replay assembly</span>
          </button>
          <button class="control-button" id="muteButton" type="button" aria-label="Mute keyboard sound" aria-pressed="false">
            <svg id="soundIcon" viewBox="0 0 20 20" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8v4h3.3L11 15V5L6.3 8H3Z"/><path d="M13.5 7.2a4 4 0 0 1 0 5.6"/><path d="M15.7 5.2a7 7 0 0 1 0 9.6"/></svg>
            <span id="muteLabel">Sound on</span>
          </button>
          <span class="audio-hint" id="audioHint">Tap a key to enable sound</span>
        </div>
      </section>

      <footer class="page-foot">
        <span>Aluminium case / tactile switch</span>
        <span>Designed to be heard</span>
      </footer>
    </main>
  </div>

  <script>
    (() => {
      const scene = document.getElementById("scene");
      const boardScale = document.getElementById("boardScale");
      const boardTilt = document.getElementById("boardTilt");
      const statusTitle = document.getElementById("assemblyStatus");
      const statusDetail = document.getElementById("assemblyDetail");
      const progressFill = document.getElementById("progressFill");
      const stateLight = document.getElementById("stateLight");
      const replayButton = document.getElementById("replayButton");
      const muteButton = document.getElementById("muteButton");
      const muteLabel = document.getElementById("muteLabel");
      const soundIcon = document.getElementById("soundIcon");
      const audioHint = document.getElementById("audioHint");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

      const unit = 43;
      const gap = 4;
      const pitch = unit + gap;
      const padX = 18;
      const padY = 15;
      const rowCount = 6;
      const rowPitch = pitch;
      const capsByCode = new Map();
      const switchesByCode = new Map();
      const activeSources = new Map();
      const timers = new Set();
      let runToken = 0;
      let audioContext = null;
      let masterGain = null;
      let muted = false;

      const makeKey = (code, label, width = 1, group = "letter", tone = "cream") => ({ code, label, width, group, tone });
      const gapBy = amount => ({ gap: amount });
      const rowData = [
        [
          makeKey("Escape", "esc", 1.15, "modifier", "rust"), gapBy(.55),
          ...["F1", "F2", "F3", "F4"].map(label => makeKey(label, label, 1, "function", "sage")), gapBy(.35),
          ...["F5", "F6", "F7", "F8"].map(label => makeKey(label, label, 1, "function", "sage")), gapBy(.35),
          ...["F9", "F10", "F11", "F12"].map(label => makeKey(label, label, 1, "function", "sage")), gapBy(.65),
          makeKey("PrintScreen", "prtsc", 1, "function", "sage")
        ],
        [
          makeKey("Backquote", "~", 1), ..."1234567890".split("").map((label, index) => makeKey(`Digit${label}`, label)),
          makeKey("Minus", "-"), makeKey("Equal", "="), makeKey("Backspace", "bksp", 2, "backspace", "rust"), gapBy(.65),
          makeKey("Insert", "ins", 1, "nav", "sage"), makeKey("Home", "home", 1, "nav", "sage"), makeKey("PageUp", "pgup", 1, "nav", "sage")
        ],
        [
          makeKey("Tab", "tab", 1.5, "modifier", "sage"), ..."QWERTYUIOP".split("").map(label => makeKey(`Key${label}`, label)),
          makeKey("BracketLeft", "["), makeKey("BracketRight", "]"), makeKey("Backslash", "\\", 1.5), gapBy(.65),
          makeKey("Delete", "del", 1, "nav", "sage"), makeKey("End", "end", 1, "nav", "sage"), makeKey("PageDown", "pgdn", 1, "nav", "sage")
        ],
        [
          makeKey("CapsLock", "caps", 1.75, "modifier", "sage"), ..."ASDFGHJKL".split("").map(label => makeKey(`Key${label}`, label)),
          makeKey("Semicolon", ";"), makeKey("Quote", "'"), makeKey("Enter", "enter", 2.25, "enter", "rust"), gapBy(.65), gapBy(1),
          makeKey("ArrowUp", "up", 1, "nav", "rust"), gapBy(1)
        ],
        [
          makeKey("ShiftLeft", "shift", 2.25, "modifier", "sage"), ..."ZXCVBNM".split("").map(label => makeKey(`Key${label}`, label)),
          makeKey("Comma", ","), makeKey("Period", "."), makeKey("Slash", "/"), makeKey("ShiftRight", "shift", 2.75, "modifier", "sage"), gapBy(.65),
          makeKey("ArrowLeft", "left", 1, "nav", "rust"), makeKey("ArrowDown", "down", 1, "nav", "rust"), makeKey("ArrowRight", "right", 1, "nav", "rust")
        ],
        [
          makeKey("ControlLeft", "ctrl", 1.25, "modifier", "sage"), makeKey("MetaLeft", "win", 1.25, "modifier", "sage"),
          makeKey("AltLeft", "alt", 1.5, "modifier", "sage"), makeKey("Space", "mora", 6.25, "space", "forest"),
          makeKey("AltRight", "alt", 1.5, "modifier", "sage"), makeKey("ContextMenu", "menu", 1.25, "modifier", "sage"),
          makeKey("ControlRight", "ctrl", 1.25, "modifier", "sage")
        ]
      ];

      const keyRecords = [];
      let widestRow = 0;

      function calculateRows() {
        rowData.forEach((row, rowIndex) => {
          let cursor = 0;
          row.forEach(item => {
            if (item.gap) {
              cursor += item.gap;
              return;
            }
            const widthPx = unit * item.width + gap * (item.width - 1);
            keyRecords.push({ ...item, row: rowIndex, xUnits: cursor, x: padX + cursor * pitch, y: padY + rowIndex * rowPitch, widthPx, heightPx: unit });
            cursor += item.width;
          });
          widestRow = Math.max(widestRow, cursor);
        });
      }

      function addFace(parent, name) {
        const face = document.createElement("div");
        face.className = name;
        face.setAttribute("aria-hidden", "true");
        parent.appendChild(face);
        return face;
      }

      function setGeometry(node, x, y, width, height, z, depth, extras = {}) {
        node.style.setProperty("--x", `${x}px`);
        node.style.setProperty("--y", `${y}px`);
        node.style.setProperty("--w", `${width}px`);
        node.style.setProperty("--h", `${height}px`);
        node.style.setProperty("--z", `${z}px`);
        node.style.setProperty("--depth", `${depth}px`);
        Object.entries(extras).forEach(([name, value]) => node.style.setProperty(name, value));
      }

      function createSheet(kind, x, y, width, height, z, depth, start = {}) {
        const sheet = document.createElement("div");
        sheet.className = `assembly-piece sheet sheet-${kind}`;
        sheet.dataset.part = kind;
        setGeometry(sheet, x, y, width, height, z, depth, {
          "--lift-start": start.lift || "0px",
          "--dx-start": start.dx || "0px",
          "--dy-start": start.dy || "0px",
          "--rx-start": start.rx || "0deg",
          "--ry-start": start.ry || "0deg",
          "--rz-start": start.rz || "0deg",
          "--scale-start": start.scale || ".98",
          "--motion-duration": start.duration || "900ms"
        });
        addFace(sheet, "sheet-top");
        addFace(sheet, "sheet-front");
        addFace(sheet, "sheet-back");
        addFace(sheet, "sheet-left");
        addFace(sheet, "sheet-right");
        const details = document.createElement("div");
        details.className = "sheet-details";
        details.setAttribute("aria-hidden", "true");
        sheet.appendChild(details);
        boardTilt.appendChild(sheet);
        return { sheet, details, x, y, width, height, depth, kind };
      }

      function placeMarker(container, className, centerX, centerY, sheet, width, height) {
        const marker = document.createElement("div");
        marker.className = className;
        marker.style.left = `${centerX - sheet.x - width / 2}px`;
        marker.style.top = `${centerY - sheet.y - height / 2}px`;
        container.appendChild(marker);
        return marker;
      }

      function createCase(width, height) {
        const shell = document.createElement("div");
        shell.className = "case-shell";
        shell.setAttribute("aria-hidden", "true");
        const floor = document.createElement("div");
        floor.className = "case-floor";
        shell.appendChild(floor);
        ["case-front", "case-back", "case-left", "case-right"].forEach(name => addFace(shell, name));
        const rim = document.createElement("div");
        rim.className = "case-rim";
        shell.appendChild(rim);
        ["one", "two", "three", "four"].forEach(position => {
          const screw = document.createElement("div");
          screw.className = `case-screw ${position}`;
          screw.setAttribute("aria-hidden", "true");
          shell.appendChild(screw);
        });
        shell.style.width = `${width}px`;
        shell.style.height = `${height}px`;
        boardTilt.appendChild(shell);
      }

      function createSwitch(record) {
        const size = 23;
        const switchPart = document.createElement("div");
        switchPart.className = "assembly-piece switch-part";
        switchPart.dataset.code = record.code;
        setGeometry(
          switchPart,
          record.x + (record.widthPx - size) / 2,
          record.y + (unit - size) / 2,
          size,
          size,
          -18,
          12,
          { "--lift-start": "57px", "--rx-start": "-8deg", "--ry-start": "5deg", "--scale-start": ".92", "--motion-duration": "430ms" }
        );
        const body = document.createElement("div");
        body.className = "switch-body";
        body.setAttribute("aria-hidden", "true");
        switchPart.appendChild(body);
        ["switch-side-front", "switch-side-back", "switch-side-left", "switch-side-right"].forEach(name => addFace(switchPart, name));
        const housing = document.createElement("div");
        housing.className = "switch-housing-top";
        housing.setAttribute("aria-hidden", "true");
        switchPart.appendChild(housing);
        const stem = document.createElement("div");
        stem.className = "switch-stem";
        stem.setAttribute("aria-hidden", "true");
        switchPart.appendChild(stem);
        boardTilt.appendChild(switchPart);
        switchesByCode.set(record.code, switchPart);
        return switchPart;
      }

      function createKeycap(record) {
        const cap = document.createElement("button");
        cap.className = "assembly-piece keycap";
        cap.type = "button";
        cap.dataset.code = record.code;
        cap.dataset.group = record.group;
        cap.dataset.tone = record.tone;
        const spoken = record.code === "Space" ? "Space bar" : record.label;
        cap.setAttribute("aria-label", `${spoken} key`);
        cap.setAttribute("aria-hidden", "true");
        cap.tabIndex = -1;
        setGeometry(cap, record.x, record.y, record.widthPx, record.heightPx, -1, 16, {
          "--lift-start": "72px",
          "--dx-start": "0px",
          "--dy-start": "-7px",
          "--rx-start": "-12deg",
          "--ry-start": "4deg",
          "--scale-start": ".93",
          "--motion-duration": "460ms"
        });
        addFace(cap, "cap-front");
        addFace(cap, "cap-back");
        addFace(cap, "cap-left");
        addFace(cap, "cap-right");
        const top = document.createElement("span");
        top.className = "cap-top";
        top.setAttribute("aria-hidden", "true");
        const label = document.createElement("span");
        label.className = "key-label";
        label.textContent = record.label;
        top.appendChild(label);
        cap.appendChild(top);
        cap.addEventListener("pointerdown", event => {
          if (event.button !== 0) return;
          event.stopPropagation();
          pressKey(record.code, `pointer:${event.pointerId}`);
          try { cap.setPointerCapture(event.pointerId); } catch (_) {}
        });
        const pointerRelease = event => releaseKey(record.code, `pointer:${event.pointerId}`);
        cap.addEventListener("pointerup", pointerRelease);
        cap.addEventListener("pointercancel", pointerRelease);
        cap.addEventListener("lostpointercapture", pointerRelease);
        cap.addEventListener("click", event => {
          if (event.detail === 0) tapKey(record.code);
        });
        boardTilt.appendChild(cap);
        capsByCode.set(record.code, cap);
        return cap;
      }

      function buildKeyboard() {
        calculateRows();
        const boardWidth = widestRow * pitch - gap + padX * 2;
        const boardHeight = padY * 2 + rowCount * unit + (rowCount - 1) * gap;
        boardScale.style.width = `${boardWidth}px`;
        boardScale.style.height = `${boardHeight}px`;
        boardTilt.style.width = `${boardWidth}px`;
        boardTilt.style.height = `${boardHeight}px`;
        document.documentElement.style.setProperty("--unit", `${unit}px`);
        document.documentElement.style.setProperty("--gap", `${gap}px`);
        document.documentElement.style.setProperty("--pitch", `${pitch}px`);
        createCase(boardWidth, boardHeight);

        const pcb = createSheet("pcb", 9, 9, boardWidth - 18, boardHeight - 18, -28, 4, {
          lift: "142px", dx: "-8px", dy: "-14px", rx: "-11deg", ry: "4deg", rz: "-2deg", scale: ".97", duration: "960ms"
        });
        const foam = createSheet("foam", 14, 12, boardWidth - 28, boardHeight - 24, -23, 4, {
          lift: "-105px", dx: "9px", dy: "16px", rx: "8deg", ry: "-3deg", rz: "1deg", scale: ".98", duration: "850ms"
        });
        const plate = createSheet("plate", 14, 12, boardWidth - 28, boardHeight - 24, -18, 6, {
          lift: "125px", dx: "5px", dy: "-12px", rx: "-9deg", ry: "-4deg", rz: "2deg", scale: ".97", duration: "900ms"
        });

        keyRecords.forEach(record => {
          const centerX = record.x + record.widthPx / 2;
          const centerY = record.y + unit / 2;
          placeMarker(pcb.details, "pcb-contact", centerX, centerY, pcb, 17, 17);
          placeMarker(foam.details, "foam-aperture", centerX, centerY, foam, 22, 22);
          placeMarker(plate.details, "surface-cutout", centerX, centerY, plate, 26, 26);
          if (record.width >= 1.75) {
            const stabilizerY = centerY - plate.y;
            [record.x + 9, record.x + record.widthPx - 19].forEach(pointX => {
              const mark = document.createElement("div");
              mark.className = "plate-mark";
              mark.style.left = `${pointX - plate.x}px`;
              mark.style.top = `${stabilizerY - 2.5}px`;
              plate.details.appendChild(mark);
            });
          }
        });

        const stamp = document.createElement("div");
        stamp.className = "pcb-stamp";
        stamp.innerHTML = "MORA / H75<span class=\"pcb-substamp\">REV 03 - 1.6MM / PCB</span>";
        pcb.details.appendChild(stamp);

        [
          { x: boardWidth * .27, y: boardHeight * .36, width: 60, angle: 10 },
          { x: boardWidth * .52, y: boardHeight * .68, width: 110, angle: -7 },
          { x: boardWidth * .74, y: boardHeight * .29, width: 70, angle: 14 },
          { x: boardWidth * .14, y: boardHeight * .73, width: 85, angle: -12 }
        ].forEach(trace => {
          const line = document.createElement("div");
          line.className = "pcb-trace";
          line.style.left = `${trace.x - pcb.x}px`;
          line.style.top = `${trace.y - pcb.y}px`;
          line.style.width = `${trace.width}px`;
          line.style.transform = `rotate(${trace.angle}deg)`;
          pcb.details.appendChild(line);
        });
        const chip = document.createElement("div");
        chip.className = "pcb-chip";
        chip.style.left = `${boardWidth * .64 - pcb.x}px`;
        chip.style.top = `${boardHeight * .78 - pcb.y}px`;
        pcb.details.appendChild(chip);

        keyRecords.forEach(record => {
          createSwitch(record);
          createKeycap(record);
        });
        return { boardWidth, boardHeight, pcb: pcb.sheet, foam: foam.sheet, plate: plate.sheet };
      }

      const keyboard = buildKeyboard();

      function resizeBoard() {
        const projectedWidth = keyboard.boardWidth * Math.cos(12 * Math.PI / 180) + keyboard.boardHeight * Math.sin(12 * Math.PI / 180) + 56;
        const projectedHeight = keyboard.boardWidth * Math.sin(12 * Math.PI / 180) + (keyboard.boardHeight + 56) * Math.cos(56 * Math.PI / 180) + 70;
        const fitWidth = (scene.clientWidth - 22) / projectedWidth;
        const fitHeight = (scene.clientHeight - 22) / projectedHeight;
        const scale = Math.max(.28, Math.min(1.08, fitWidth, fitHeight));
        boardScale.style.setProperty("--object-scale", scale.toFixed(4));
      }

      resizeBoard();
      window.addEventListener("resize", resizeBoard, { passive: true });
      if ("ResizeObserver" in window) new ResizeObserver(resizeBoard).observe(scene);

      function updateStatus(title, detail, progress, complete = false) {
        statusTitle.textContent = title;
        statusDetail.textContent = detail;
        progressFill.style.setProperty("--progress", `${Math.max(0, Math.min(100, progress))}%`);
        stateLight.classList.toggle("is-done", complete);
      }

      function scheduleAssembly(callback, delay, token) {
        const timer = window.setTimeout(() => {
          timers.delete(timer);
          if (token === runToken) callback();
        }, delay);
        timers.add(timer);
      }

      function clearAssemblyTimers() {
        timers.forEach(timer => window.clearTimeout(timer));
        timers.clear();
      }

      function revealAndSeat(part, token, seatDelay = 110) {
        part.classList.add("is-visible");
        scheduleAssembly(() => part.classList.add("is-installed"), seatDelay, token);
      }

      function setPressVisual(code, pressed) {
        const cap = capsByCode.get(code);
        const switchPart = switchesByCode.get(code);
        if (cap) cap.classList.toggle("is-pressed", pressed);
        if (switchPart) switchPart.classList.toggle("is-active", pressed);
      }

      function updateProgressForSequence(index, total, base, span) {
        if (index === total - 1 || index % 6 === 0) {
          updateStatus(
            statusTitle.textContent,
            `${String(index + 1).padStart(2, "0")} / ${total} installed`,
            base + ((index + 1) / total) * span
          );
        }
      }

      function finishAssembly(token, reduced = false) {
        if (token !== runToken) return;
        boardTilt.classList.add("is-idle");
        updateStatus("Assembly complete", reduced ? "Motion minimized" : "Ready to play - click or press any key", 100, true);
      }

      function assemble(replay = false) {
        runToken += 1;
        const token = runToken;
        clearAssemblyTimers();
        releaseAllKeys();
        boardTilt.classList.remove("is-idle");
        document.querySelectorAll(".assembly-piece").forEach(part => part.classList.remove("is-visible", "is-installed"));
        capsByCode.forEach(cap => {
          cap.setAttribute("aria-hidden", "true");
          cap.tabIndex = -1;
        });
        void boardTilt.offsetHeight;
        updateStatus(replay ? "Replaying assembly" : "Assembly sequence", "Motherboard / PCB", 2);

        if (reduceMotion.matches) {
          [keyboard.pcb, keyboard.foam, keyboard.plate].forEach(part => part.classList.add("is-visible", "is-installed"));
          switchesByCode.forEach(part => part.classList.add("is-visible", "is-installed"));
          capsByCode.forEach(part => {
            part.classList.add("is-visible", "is-installed");
            part.setAttribute("aria-hidden", "false");
            part.tabIndex = 0;
          });
          scheduleAssembly(() => finishAssembly(token, true), 60, token);
          return;
        }

        revealAndSeat(keyboard.pcb, token, 125);
        scheduleAssembly(() => {
          updateStatus("Acoustic foam", "A soft layer between circuit and plate", 17);
          revealAndSeat(keyboard.foam, token, 120);
        }, 1290, token);
        scheduleAssembly(() => {
          updateStatus("Aluminium plate", "Brushed champagne finish", 32);
          revealAndSeat(keyboard.plate, token, 120);
        }, 2470, token);

        const switchParts = [...switchesByCode.values()];
        const switchStart = 3710;
        const switchStep = 39;
        const switchSeatDelay = 145;
        scheduleAssembly(() => {
          updateStatus("Tactile switches", "Floating into position, left to right", 47);
          switchParts.forEach(part => part.classList.add("is-visible"));
          switchParts.forEach((part, index) => {
            scheduleAssembly(() => {
              part.classList.add("is-installed");
              updateProgressForSequence(index, switchParts.length, 47, 23);
            }, switchSeatDelay + index * switchStep, token);
          });
        }, switchStart, token);

        const switchStageLength = switchSeatDelay + (switchParts.length - 1) * switchStep + 470;
        const capStart = switchStart + switchStageLength + 220;
        const caps = [...capsByCode.entries()];
        const capStep = 39;
        const capSeatDelay = 150;
        scheduleAssembly(() => {
          updateStatus("Sculpted keycaps", "Settling into the finished layout, left to right", 71);
          caps.forEach(([, cap]) => {
            cap.classList.add("is-visible");
            cap.setAttribute("aria-hidden", "false");
            cap.tabIndex = 0;
          });
          caps.forEach(([code, cap], index) => {
            scheduleAssembly(() => {
              cap.classList.add("is-installed");
              setPressVisual(code, activeSources.has(code));
              updateProgressForSequence(index, caps.length, 71, 28);
            }, capSeatDelay + index * capStep, token);
          });
        }, capStart, token);

        const completionTime = capStart + capSeatDelay + (caps.length - 1) * capStep + 520;
        scheduleAssembly(() => finishAssembly(token), completionTime, token);
      }

      function getAudioContext() {
        if (audioContext) return audioContext;
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return null;
        try {
          audioContext = new AudioContextClass();
          masterGain = audioContext.createGain();
          masterGain.gain.value = muted ? 0 : .42;
          masterGain.connect(audioContext.destination);
          return audioContext;
        } catch (_) {
          audioContext = null;
          masterGain = null;
          return null;
        }
      }

      function unlockAudio() {
        const context = getAudioContext();
        if (!context) {
          audioHint.textContent = "Web Audio is unavailable";
          return;
        }
        if (context.state === "suspended") context.resume().catch(() => {});
        audioHint.classList.add("is-ready");
      }

      document.addEventListener("pointerdown", unlockAudio, { capture: true, once: true });
      document.addEventListener("keydown", unlockAudio, { capture: true, once: true });

      function noiseBurst(context, time, group, intensity = 1) {
        const duration = group === "space" ? .052 : .032;
        const buffer = context.createBuffer(1, Math.ceil(context.sampleRate * duration), context.sampleRate);
        const channel = buffer.getChannelData(0);
        for (let i = 0; i < channel.length; i += 1) {
          const fade = 1 - i / channel.length;
          channel[i] = (Math.random() * 2 - 1) * fade * fade;
        }
        const source = context.createBufferSource();
        const filter = context.createBiquadFilter();
        const envelope = context.createGain();
        const cutoff = group === "space" ? 740 : group === "modifier" ? 1250 : group === "enter" ? 1650 : 2200;
        source.buffer = buffer;
        filter.type = group === "space" ? "lowpass" : "highpass";
        filter.frequency.setValueAtTime(cutoff, time);
        filter.Q.value = .7;
        envelope.gain.setValueAtTime(.0001, time);
        envelope.gain.exponentialRampToValueAtTime((group === "space" ? .2 : .105) * intensity, time + .002);
        envelope.gain.exponentialRampToValueAtTime(.0001, time + duration);
        source.connect(filter);
        filter.connect(envelope);
        envelope.connect(masterGain);
        source.start(time);
        source.stop(time + duration + .008);
      }

      function resonantTap(context, time, group, intensity = 1) {
        const oscillator = context.createOscillator();
        const envelope = context.createGain();
        const filter = context.createBiquadFilter();
        const settings = {
          space: { frequency: 116, end: 76, level: .2, decay: .17, wave: "sine", filter: 380 },
          enter: { frequency: 235, end: 132, level: .095, decay: .105, wave: "triangle", filter: 950 },
          backspace: { frequency: 310, end: 170, level: .09, decay: .082, wave: "triangle", filter: 1200 },
          modifier: { frequency: 182, end: 110, level: .085, decay: .12, wave: "triangle", filter: 740 },
          nav: { frequency: 275, end: 170, level: .075, decay: .075, wave: "triangle", filter: 1150 },
          function: { frequency: 350, end: 230, level: .055, decay: .065, wave: "sine", filter: 1450 },
          letter: { frequency: 295, end: 185, level: .065, decay: .06, wave: "triangle", filter: 1300 }
        };
        const sound = settings[group] || settings.letter;
        oscillator.type = sound.wave;
        oscillator.frequency.setValueAtTime(sound.frequency, time);
        oscillator.frequency.exponentialRampToValueAtTime(sound.end, time + sound.decay);
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(sound.filter, time);
        envelope.gain.setValueAtTime(.0001, time);
        envelope.gain.exponentialRampToValueAtTime(sound.level * intensity, time + .002);
        envelope.gain.exponentialRampToValueAtTime(.0001, time + sound.decay);
        oscillator.connect(filter);
        filter.connect(envelope);
        envelope.connect(masterGain);
        oscillator.start(time);
        oscillator.stop(time + sound.decay + .015);
      }

      function playKeySound(group) {
        if (muted) return;
        const context = getAudioContext();
        if (!context) return;
        if (context.state === "suspended") context.resume().catch(() => {});
        const now = context.currentTime + .002;
        const hitCount = group === "enter" || group === "backspace" ? 2 : 1;
        for (let hit = 0; hit < hitCount; hit += 1) {
          const offset = hit * (group === "enter" ? .028 : .023);
          const strength = hit === 0 ? 1 : .56;
          noiseBurst(context, now + offset, group, strength);
          resonantTap(context, now + offset, group, strength);
        }
      }

      function pressKey(code, source) {
        if (!code) return;
        let sources = activeSources.get(code);
        if (!sources) {
          sources = new Set();
          activeSources.set(code, sources);
        }
        if (sources.has(source)) return;
        const wasDown = sources.size > 0;
        sources.add(source);
        setPressVisual(code, true);
        if (!wasDown) {
          const cap = capsByCode.get(code);
          playKeySound(cap ? cap.dataset.group : groupForCode(code));
        }
      }

      function releaseKey(code, source) {
        const sources = activeSources.get(code);
        if (!sources) return;
        sources.delete(source);
        if (sources.size === 0) {
          activeSources.delete(code);
          setPressVisual(code, false);
        }
      }

      function releaseAllKeys() {
        [...activeSources.keys()].forEach(code => {
          setPressVisual(code, false);
          activeSources.delete(code);
        });
      }

      function groupForCode(code) {
        const record = keyRecords.find(key => key.code === code);
        return record ? record.group : "letter";
      }

      function tapKey(code) {
        const source = `tap:${code}:${performance.now()}`;
        pressKey(code, source);
        window.setTimeout(() => releaseKey(code, source), 145);
      }

      function findCode(event) {
        if (capsByCode.has(event.code)) return event.code;
        if (event.key === " ") return "Space";
        return null;
      }

      window.addEventListener("keydown", event => {
        const code = findCode(event);
        if (!code) return;
        if (!event.repeat) pressKey(code, "keyboard");
        const target = event.target instanceof Element ? event.target : null;
        const focusedControl = target?.closest(".control-button");
        const shouldPrevent = ["Space", "Backspace", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(code) || target?.classList.contains("keycap");
        if (shouldPrevent && !(code === "Space" && focusedControl)) {
          event.preventDefault();
        }
      });

      window.addEventListener("keyup", event => {
        const code = findCode(event);
        if (code) releaseKey(code, "keyboard");
      });

      window.addEventListener("blur", releaseAllKeys);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) releaseAllKeys();
      });

      function refreshMuteButton() {
        muteLabel.textContent = muted ? "Sound muted" : "Sound on";
        muteButton.setAttribute("aria-label", muted ? "Unmute keyboard sound" : "Mute keyboard sound");
        muteButton.setAttribute("aria-pressed", String(muted));
        soundIcon.innerHTML = muted
          ? '<path d="M3 8v4h3.3L11 15V5L6.3 8H3Z"/><path d="m14 7 4 6m0-6-4 6"/>'
          : '<path d="M3 8v4h3.3L11 15V5L6.3 8H3Z"/><path d="M13.5 7.2a4 4 0 0 1 0 5.6"/><path d="M15.7 5.2a7 7 0 0 1 0 9.6"/>';
        if (masterGain && audioContext) {
          masterGain.gain.setTargetAtTime(muted ? 0 : .42, audioContext.currentTime, .025);
        }
      }

      muteButton.addEventListener("click", () => {
        muted = !muted;
        refreshMuteButton();
      });

      replayButton.addEventListener("click", () => assemble(true));

      window.setTimeout(() => assemble(false), 300);
    })();
  </script>
</body>
</html>
