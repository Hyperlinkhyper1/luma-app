const matV=new THREE.MeshStandardMaterial({roughness:.86,metalness:.02}); const matE=new THREE.MeshStandardMaterial({roughness:.55,metalness:.18,emissive:0xFFB35C,emissiveIntensity:.28}); const matB=new THREE.MeshStandardMaterial({roughness:.92,metalness:.02});

 m.instanceMatrix.needsUpdate=true; if(m.instanceColor)m.instanceColor.needsUpdate=true; m.computeBoundingSphere(); return m;
}
const VOXELCOUNT=()=>{let n=0;for(const k in V)n+=V[k].length;return n;};

/* ---------------- floating island terrain ---------------- */
function island(x,z,rx,rz,top,h,seedOff=0){
 const nx=Math.ceil(rx*2), nz=Math.ceil(rz*2), ox=x-rx, oz=z-rz;
 const hash=(i,j)=>Math.sin(i*127.1+j*311.7+seedOff*7.3)*43758.5453%1;
 for(let i=0;i<nx;i++)for(let j=0;j<nz;j++){
  const px=i+ox, pz=j+oz, dx=(px-x)/rx, dz=(pz-z)/rz, d=Math.sqrt(dx*dx+dz*dz), wob=hash(i,j)*.045;
  if(d>1-wob)continue;
  const edge=1-d; const hh=Math.max(0,h*(.42+.58*Math.pow(edge,.42))+.24*Math.sin(i*.8+j*.5+seedOff)*(edge<.35?1:0));
  const surf=Math.round(hh*2)/2;
  const inWater=(Math.abs(px+11)<5.2&&Math.abs(pz-11)<5.2)||(d<.19);
  let topC=(d>.90? C.earthD : inWater? C.mossL : C.moss);
  if(inWater&&px>-16&&px<-6&&pz>6&&pz<16) topC=C.water;
  put(V.moss,px,surf-.18,pz,topC,1.0);
  const depth=Math.floor(surf+4+3.2*Math.sin(seedOff*3+i*.32+j*.21));
  for(let y=surf-.55;y>-depth;y-=1){const pick=(y< -6? C.earthD:C.earth); put(V.earth,px,y,pz,((i+j+y)%7===0?C.earthD:pick),1);}
  if(edge>.6 && hash(i+40,j+20)>.72) put(V.moss,px,surf+.43,pz,C.mossL,1);
  if(edge>.7&&hash(i+90,j+30)>.84){put(V.stone,px,surf+.44,pz,C.stoneL,.6);put(V.stone,px+.28,surf+.38,pz+.1,C.stone,.48);}
 }
}
island(0,0,32,32,8,7.0,1);
island(-34,8,8,7,6,6.5,2);
island(31,-12,7,6,3,4.2,3);
island(5,35,6,5,8,4.0,4);

/* ---------------- pagoda ---------------- */
const pagodaFloors=[], floorGroups=[], doorPivots=[];
const PAGES=[{y:9.2,w:17.0,h:3.3},{y:13.9,w:14.6,h:3.05},{y:18.1,w:12.3,h:2.85},{y:21.85,w:10.2,h:2.65},{y:25.0,w:8.2,h:2.5}];
function voxelRect(x0,x1,y0,y1,z0,z1,c,step=1){for(let x=x0;x<=x1;x+=step)for(let y=y0;y<=y1;y+=step)for(let z=z0;z<=z1;z+=step)put(V.verm,x,y,z,c,step);}
function ring(x,y,z,w,d,t,h,c){put(V.verm,x,y,z,C.gold,t); put(V.verm,x+w,y,z,c,t);put(V.verm,x,y+d,z,c,t);put(V.verm,x+w,y+d,z,c,t);}
function pagodaRoof(y,w,wallH){
 const rw=w+4.4, tiers=4;

  const scale=1-t*.085, half=rw*scale/2, hy=y+t*.72;

  for(const sx of[-1,1])for(const sz of[-1,1]){
   put(V.jade, sx*(half-1.4),hy, sz*(half-1.4), C.jade, 1.0);
   put(V.jadeL, sx*(half-2.4),hy+.32, sz*(half-2.4), C.jadeL, .9);
   put(V.jade, sx*(half-.7),hy+.55, sz*(half-.7), C.jadeD, .8);
  }
  put(V.jade,0,hy,-(half-1.4),C.jade,1.15);put(V.jadeL,0,hy+.3,-(half-.65),C.jadeL,.9);
  put(V.jade,0,hy,(half-1.4),C.jade,1.15);put(V.jadeL,0,hy+.3,(half-.65),C.jadeL,.9);
  put(V.jade,-(half-1.4),hy,0,C.jade,1.15);put(V.jadeL,-(half-.65),hy+.3,0,C.jadeL,.9);
  put(V.jade,(half-1.4),hy,0,C.jade,1.15);put(V.jadeL,(half-.65),hy+.3,0,C.jadeL,.9);
  // deep broad planes made of small voxels
  for(let a=-half+1.1;a<=half-1.1;a+=1.5)for(let b=1.1;b<=half-1.5;b+=1.5){
   const rise=.13+Math.pow(b/(half),.7)*.52 + (b>half-3?.18:0);
   put(V.jade, a,hy+rise,-b, (Math.round(a*2)+t)%4===0?C.jadeL:C.jade, .72);
   put(V.jade, a,hy+rise,b, C.jade, .72);
   put(V.jade, -b,hy+rise,a, C.jade, .72);
   put(V.jade, b,hy+rise,a, C.jade, .72);
  }

  for(const sx of[-1,1])for(const sz of[-1,1])put(V.gold, sx*(half-.2),hy+1.2, sz*(half-.2), C.gold, .5);
 }
 // ridge
 put(V.gold,0,y+3.15,0,C.gold,1.4);
 for(let x=-w/2;x<=w/2;x+=1.2){put(V.gold,x,y+2.8,0,C.gold,.42);put(V.gold,x,y+2.8,1.8*C.gold*.8,.4);}

}
function pagodaFloor(i,P){
 const g=new THREE.Group(); scene.add(g); g.position.y=P.y; floorGroups.push(g);

 // vermillion platform & main structure
 for(let x=-w/2;x<=w/2;x++)for(let z=-w/2;z<=w/2;z++){
   const edge=Math.abs(x)>w/2-1||Math.abs(z)>w/2-1;
   put(V.verm,x,-.6,z,edge?C.vermD:C.verm,1);
   if(Math.abs(x)>w/2-1||Math.abs(z)>w/2-1)put(V.gold,x,-1.45,z,C.gold,.55);

 // walls: stone-white panels with vermillion frames

  const wall=Math.abs(x)>=w/2-.5||Math.abs(z)>=w/2-.5;
  if(!wall)continue;
  const post=(Math.abs(Math.abs(x)-(w/2))<.6&&(Math.round(z)%4===0))||(Math.abs(Math.abs(z)-(w/2))<.6&&(Math.round(x)%4===0));
  const band=(y===0||y===h-1);
  put(V.verm,x,y,z, post? C.verm : band? C.vermD : (Math.round((x+z)*.5)%2? C.white:C.stoneL),1);
 }
 // columns at corners and mid edges
 for(let sx=-1;sx<=1;sx+=2)for(let sz=-1;sz<=1;sz+=2)for(let y=0;y<h;y++){
  put(V.verm,sx*(w/2),y,sz*(w/2),y===h-1?C.gold:C.verm,.95);
  put(V.gold,sx*(w/2),y+.25,sz*(w/2),C.gold,.6);
 }
 // balcony / railing
 if(i<3){
  const b=w/2+1.6;
  for(let x=-b;x<=b;x+=1.4)for(let z=-b;z<=b;z+=1.4){if(Math.abs(x)>b-1||Math.abs(z)>b-1){put(V.teak,x,-.3,z,C.teak,.48);put(V.gold,x,.35,z,C.gold,.28);}}
  for(let x=-b;x<=b;x+=1.3){put(V.gold,x,.25,b,C.gold,.22);put(V.gold,x,.25,-b,C.gold,.22);put(V.verm,x,.9,b,C.verm,.34);put(V.verm,x,.9,-b,C.verm,.34);}
  for(let z=-b;z<=b;z+=1.3){put(V.gold,b,.25,z,C.gold,.22);put(V.gold,-b,.25,z,C.gold,.22);put(V.verm,b,.9,z,C.verm,.34);put(V.verm,-b,.9,z,C.verm,.34);}
 }
 // interior: warm wood floor and glow
 for(let x=-w/2+1;x<w/2;x++)for(let z=-w/2+1;z<w/2;z++)put(V.teakL,x,-.15,z,(x+z)%3===0?C.teakL:C.teak,.75);
 // front doors on +Z, opening inward; pivot groups (not instanced)
 const dw=Math.min(3.2,w*.33);
 for(const side of[-1,1]){
  const pivot=new THREE.Group(); pivot.position.set(side*dw/2,0,w/2-.35); g.add(pivot);
  const dm=new THREE.MeshStandardMaterial({color:C.verm,roughness:.62,metalness:.12});
  const leaf=new THREE.Mesh(new THREE.BoxGeometry(dw,.72,dw*1.06),dm); leaf.castShadow=true; leaf.position.set(-side*dw*.36,h*.36,0); pivot.add(leaf);
  const goldBand=new THREE.Mesh(new THREE.BoxGeometry(dw*.82,.18,.5),new THREE.MeshStandardMaterial({color:C.gold,roughness:.42,metalness:.3})); goldBand.position.set(-side*dw*.36,h*.62,.15); pivot.add(goldBand);
  doorPivots.push({pivot,side,group:g,open:false,angle:0});
 }
 const warm=new THREE.PointLight(0xffb15e,i===0?13:7.5,22,1.8); warm.position.set(0,1.0,0); g.add(warm);

}
for(let i=0;i<5;i++){pagodaFloor(i,PAGES[i]);pagodaRoof(PAGES[i].y+PAGES[i].h, PAGES[i].w, PAGES[i].h);}
commit(matV,'verm'); commit(matB,'moss'); commit(matB,'earth'); commit(matV,'stone'); commit(matV,'teak'); commit(matV,'teakL'); commit(matV,'jade'); commit(matV,'jadeL'); commit(matV,'gold');
// fix: several groups written into same key (verm/moss etc) so commit with correct mats
// Rebuild grouped instance sets properly:
scene.children.filter(o=>o.isInstancedMesh).forEach(o=>{scene.remove(o);o.geometry.dispose();});
const GROUPS={}; const MATERIALS={};
function emit(key,c,s=1,ry=0,x=0,y=0,z=0){}
// collect all put data was already in V; rebuild with categorized materials
function buildVoxels(){
 const bins={}; for(const k in V)for(const q of V[k]){const b=keyOf(q.c); (bins[b]||(bins[b]=[])).push(q);}
 const mats={moss:new THREE.MeshStandardMaterial({roughness:.95,metalness:.0}),earth:new THREE.MeshStandardMaterial({roughness:1,metalness:0}),stone:new THREE.MeshStandardMaterial({roughness:.88,metalness:.02}),verm:new THREE.MeshStandardMaterial({roughness:.7,metalness:.06}),jade:new THREE.MeshStandardMaterial({roughness:.62,metalness:.08}),gold:new THREE.MeshStandardMaterial({roughness:.32,metalness:.72}),teak:new THREE.MeshStandardMaterial({roughness:.85,metalness:.02}),teakL:new THREE.MeshStandardMaterial({roughness:.8,metalness:.02}),leaf:new THREE.MeshStandardMaterial({roughness:.92,metalness:0})};
 for(const k in bins){const a=bins[k];const m=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),mats[k]||mats.stone,a.length);m.castShadow=true;m.receiveShadow=true;scene.add(m);for(let i=0;i<a.length;i++){const q=a[i];tmp.position.set(q.x,q.y,q.z);tmp.rotation.set(0,q.ry||0,0);tmp.scale.set(q.sx||q.s,q.sy||q.s,q.sz||q.s);tmp.updateMatrix();m.setMatrixAt(i,tmp.matrix);col.setRGB(q.c.r,q.c.g,q.c.b);m.setColorAt(i,col);}m.instanceMatrix.needsUpdate=true;if(m.instanceColor)m.instanceColor.needsUpdate=true;}
}

// NOTE: rebuilt below in a second pass after all terrain is constructed; current pass for pagoda only

/* ---------------- terrain water / stone path ---------------- */
// pond bed and water are instanced in leaf-ish bins; use dedicated translucent water meshes for clarity
const waterMat=new THREE.MeshStandardMaterial({color:0x7ED6DF,transparent:true,opacity:.72,roughness:.12,metalness:.2,emissive:0x1d6570,emissiveIntensity:.25});
function waterTile(x,y,z,s){const m=new THREE.Mesh(new THREE.BoxGeometry(s,.28,s),waterMat);m.position.set(x,y,z);scene.add(m);return m;}
const ripples=[];
for(let x=-15;x<-7;x+=1.5)for(let z=7;z<16;z+=1.5){if((x+11)**2+(z-11)**2<23)waterTile(x,6.05,z,1.55);}
// pond rim stones
for(let a=0;a<Math.PI*2;a+=.22){const x=-11+Math.cos(a)*7.6,z=11+Math.sin(a)*7.4;put(V.stone,Math.round(x),6.5,Math.round(z),a%1>0.5?C.stoneL:C.stone,.75);}
// zig-zag stone path
function stonePath(pts,width=1.5){
 for(let s=0;s<pts.length-1;s++){
  const [x0,z0]=pts[s],[x1,z1]=pts[s+1],len=Math.hypot(x1-x0,z1-z0),n=Math.ceil(len/.7);
  for(let i=0;i<=n;i++){const t=i/n,x=x0+(x1-x0)*t,z=z0+(z1-z0)*t;
   put(V.stone,Math.round(x),8.55,Math.round(z),C.stone,.7);
   if(i%4===0){put(V.stoneL||V.stone,Math.round(x+width),8.42,Math.round(z),C.stoneL,.42);put(V.stone,Math.round(x-width),8.42,Math.round(z),C.stone,.42);}
  }

}
stonePath([[0,31],[0,26],[-3,22],[2,18],[-2,14],[0,10],[0,6]],1.0);
stonePath([[0,6],[8,6],[12,1],[6,-2],[1,-2]],.9);

/* ---------------- arched wooden bridge over pond ---------------- */
function bridge(x,z,len,w){

  const t=i/steps, px=x-len/2+t*len, y=7.2+Math.sin(t*Math.PI)*2.6;
  put(V.teak,Math.round(px),y,z,C.teak,.75);put(V.teak,Math.round(px),y,z-w,C.teak,.75);put(V.teak,Math.round(px),y,z+w,C.teak,.75);
  if(i%2===0){put(V.teakL,px,y+.7,z-w-0.4,C.teakL,.38);put(V.teakL,px,y+.7,z+w+.4,C.teakL,.38);put(V.gold,px,y+1.5,z-w-.4,C.gold,.3);put(V.gold,px,y+1.5,z+w+.4,C.gold,.3);}
 }
 for(const side of[-1,1])for(let t=0;t<=1.001;t+=1/18){const px=x-len/2+t*len,y=7.2+Math.sin(t*Math.PI)*2.6;put(V.teak,Math.round(px),y+.35,z+side*w*1.45,C.teak,.24);}
}
bridge(0,9,12,2.3);

/* ---------------- torii gate ---------------- */
function torii(x,z,ry=0,s=1){

/* ---------------- final voxel rebuild (all bins) ---------------- */
function commitAll(){
 const bins={};
 const M={
  verm:new THREE.MeshStandardMaterial({color:0xffffff,roughness:.68,metalness:.07}),
  gold:new THREE.MeshStandardMaterial({color:0xffffff,roughness:.32,metalness:.62}),
  jade:new THREE.MeshStandardMaterial({color:0xffffff,roughness:.58,metalness:.1}),
  jadeL:new THREE.MeshStandardMaterial({color:0xffffff,roughness:.55,metalness:.1}),
  stone:new THREE.MeshStandardMaterial({color:0xffffff,roughness:.9,metalness:.02}),
  moss:new THREE.MeshStandardMaterial({color:0xffffff,roughness:1,metalness:0}),
  earth:new THREE.MeshStandardMaterial({color:0xffffff,roughness:1,metalness:0}),
  teak:new THREE.MeshStandardMaterial({color:0xffffff,roughness:.85,metalness:.03}),
  leaf:new THREE.MeshStandardMaterial({color:0xffffff,roughness:.92,metalness:0})
 };
 const cls=c=>{
  const {r,g,b}=c;
  if(g>0.34&&g>r*1.18&&g>b*1.1)return (g>0.55&&b<0.38)?'jade':'jade';
  if(r>0.4&&r>g*1.5&&r>b*1.9)return 'verm';
  if(r>0.62&&g>0.42&&g>b*1.25)return 'gold';
  if(b>0.4&&b>r*1.05)return 'jade';
  if(g>0.38&&g>r*1.02&&g>b*1.15)return 'moss';
  if(Math.max(r,g,b)-Math.min(r,g,b)<0.13&&r>0.32)return 'stone';
  if(r>0.2&&r>g*1.4&&r>b*1.7)return 'teak';
  return 'earth';
 };
 for(const k in V)for(const q of V[k]) { const c=cls(q.c); (bins[c]||(bins[c]=[])).push(q); }
 const mats=M;
 for(const key in bins){const a=bins[key];const m=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),mats[key]||mats.earth,a.length);m.castShadow=true;m.receiveShadow=true;scene.add(m);
  for(let i=0;i<a.length;i++){const q=a[i];tmp.position.set(q.x,q.y,q.z);tmp.rotation.set(0,q.ry||0,0);tmp.scale.set(q.sx||q.s,q.sy||q.s,q.sz||q.s);tmp.updateMatrix();m.setMatrixAt(i,tmp.matrix);col.setRGB(q.c.r,q.c.g,q.c.b);m.setColorAt(i,col);}
  m.instanceMatrix.needsUpdate=true;if(m.instanceColor)m.instanceColor.needsUpdate=true;m.computeBoundingSphere();
 }
}

 }
});
timeSlider.addEventListener('input',()=>{timeOfDay=(timeSlider.value/1000)*24; paused=true; pauseBtn.textContent='RESUME';updateSky();});
pauseBtn.addEventListener('click',()=>{paused=!paused;pauseBtn.textContent=paused?'RESUME':'PAUSE';});
let idleT=0;
renderer.domElement.addEventListener('pointerdown',()=>{idleT=0;controls.autoRotate=false;});
renderer.domElement.addEventListener('pointermove',()=>{idleT=0;});
addEventListener('keydown',e=>{if(e.key===' '){paused=!paused;pauseBtn.textContent=paused?'RESUME':'PAUSE';}});

/* ---------------- resize ---------------- */
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));});

/* ---------------- animation loop ---------------- */
let last=performance.now();
function animate(now){
 const dt=Math.min(.05,(now-last)/1000); last=now; frame++; fpsT+=dt;
 if(fpsT>0.5){fps=Math.round(frame/fpsT);frame=0;fpsT=0;statsEl.textContent=VOXELCOUNT().toLocaleString()+' voxels | '+fps+' FPS';}
 idleT+=dt; if(!intro&&idleT>2.2&&!paused){controls.autoRotate=true;controls.autoRotateSpeed=.22;}else if(!paused)controls.autoRotate=false;
 if(!paused){
  timeOfDay=(timeOfDay+dt*(24/90))%24; updateSky();
  for(const l of lanterns){if(l.on)l.box.material.emissiveIntensity+=(0.9+Math.sin(now*.005+l.x*3)*.12-l.box.material.emissiveIntensity)*.15;}
  for(let i=0;i<doorPivots.length;i++){const d=doorPivots[i];d.angle+=( (d.open?1.15:0)-d.angle)*Math.min(1,dt*4);d.pivot.rotation.y=d.side*d.angle;}
 }
 if(intro){
  introT=Math.min(1,introT+dt/2.5);
  const t=ease(introT); const p=new THREE.Vector3().copy(camStart).lerp(camMid,t).lerp(camEnd,t*t);
  camera.position.copy(p); controls.target.set(0,15.5+1.5*t,0);
  if(introT>=1){intro=false;controls.autoRotate=true;controls.target.set(0,14,0);}
 }
 // petals
 for(const p of petals){p.m.position.x+=(p.vx+Math.sin(now*.001+p.ph)*.16)*dt;p.m.position.z+=(p.vz+Math.cos(now*.0008+p.ph)*.12)*dt;p.m.position.y+=p.vy*dt;
  if(p.m.position.y<8.5||Math.abs(p.m.position.x)>30||Math.abs(p.m.position.z)>30){p.m.position.set((Math.random()-.5)*26,22+Math.random()*10,(Math.random()-.5)*24);}
  p.m.rotation.x+=dt*1.4;p.m.rotation.y+=dt*1.1;
 }
 // koi swim within pond
 for(const k of koi){k.ph+=dt*k.sp*3;const cx=-11,cz=11;k.g.position.x=cx+Math.cos(k.ph)*k.r;k.g.position.z=cz+Math.sin(k.ph*.8)*k.r*.8;k.g.rotation.y=-k.ph+Math.PI/2;k.g.position.y=k.cy+Math.sin(now*.002+k.ph)*.06;k.tail.rotation.y=Math.sin(now*.006+k.ph)*.4;}
 // ripples
 for(const r of ripples){const t=((now*.0007+r.ph)%1);r.m.scale.setScalar(.7+t*2.4);r.m.material.opacity=.32*(1-t);}
 // birds
 for(const b of birds){const a=now*.0001*b.sp*10+b.ph;b.g.position.set(Math.cos(a)*b.r,b.y+Math.sin(a*3)*1.5,Math.sin(a)*b.r);b.g.rotation.y=-a+Math.PI/2;for(let w=0;w<2;w++)b.wings[w].rotation.z=Math.sin(now*.012+b.ph+w)*.65;}
 // falls
 for(const f of falls){f.m.position.y=f.y-((now*.0011*f.sp)%1.2);f.m.position.x+=Math.sin(now*.001+f.ph)*.002;}
 // clouds
 for(const c of clouds){c.g.position.x=c.x+Math.sin(now*.00008*c.sp*10+c.sp)*14;}
 // flowers sway
 for(let i=0;i<flowerGroups.length;i++){flowerGroups[i].rotation.z=Math.sin(now*.0015+i)*.04;flowerGroups[i].rotation.x=Math.cos(now*.0012+i*1.3)*.03;}
 // water shimmer
 waterMat.emissiveIntensity=.2+Math.sin(now*.0012)*.05;
 // lantern point light flicker only when on
 for(const l of lanterns){if(l.on&&lanternPowerCache>0.1){/* intensity handled in updateSky each frame while unpaused */}
 }
 lanternPowerCache=1-Math.max(0,Math.min(1,(Math.sin((timeOfDay/24)*Math.PI*2-Math.PI/2)+.12)/.6));
 controls.update(); renderer.render(scene,camera); requestAnimationFrame(animate);
}
let lanternPowerCache=1;
window.__VOXEL__.fps=60;
requestAnimationFrame(animate);
</script>
</body>
