<style>
  :root {

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// Opus 5.5 XHigh — "Spring Festival at the Five-Story Pagoda".
// One voxel is 0.5 m. The main island is a 64×64 voxel terrain grid.

const $ = (id) => document.getElementById(id);
function fail(msg) {
  const e = $('err'); e.textContent = msg; e.style.display = 'flex'; $('loader').style.display = 'none';
}
window.addEventListener('error', (e) => { if (!window.__VOXEL__) fail('The Pagoda scene failed to start:\n' + e.message); });

// ---------------------------------------------------------------- utilities
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(0x0DA5A55);
const rr = (a, b) => a + (b - a) * rand();
const ri = (a, b) => Math.floor(rr(a, b + 1));
const pick = (arr) => arr[Math.floor(rand() * arr.length)];
function hash3(x, y, z) {
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(z | 0, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise2(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash3(xi, 7, zi), b = hash3(xi + 1, 7, zi), c = hash3(xi, 7, zi + 1), d = hash3(xi + 1, 7, zi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm2(x, z, oct = 3) {
  let s = 0, amp = 0.5, f = 1, n = 0;
  for (let i = 0; i < oct; i++) { s += amp * vnoise2(x * f, z * f); n += amp; amp *= 0.5; f *= 2.03; }
  return s / n;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };

// ------------------------------------------------------------------ palette
const P = {
  verm: '#C73E1D', vermD: '#A5321A', gold: '#E8B86D', goldD: '#C99A4E', teak: '#4A2C1A', teakL: '#6B4226', teakM: '#5A3620',
  jade: '#2D6A4F', jadeL: '#40916C', jadeD: '#1F5540', jadeR: '#5FAE86',
  sak1: '#FFB7C5', sak2: '#FF8FAB', sak3: '#FFE5EC',
  stone: '#9AA0A6', stoneD: '#7C8288', stoneL: '#B3B8BC', pond: '#7ED6DF', moss: '#606C38',
  plaster: '#EFE4CC', paper: '#FFD08C', bronze: '#4E5148', black: '#1D1B1C',
  dirt: '#71502F', dirtD: '#5E4127', bark: '#4B3226', barkL: '#5E4032',
};

// ---------------------------------------------------------------- renderer
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  fail('WebGL is not available in this view, so the Pagoda scene cannot render.');
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const viewAspect = () => (innerWidth > 0 && innerHeight > 0 ? innerWidth / innerHeight : 1.6);
const camera = new THREE.PerspectiveCamera(40, viewAspect(), 0.5, 4000);

// ------------------------------------------------------- voxel materials
// Every voxel is a unit BoxGeometry instance. Per-instance attributes carry
// eight corner AO terms (smooth voxel AO, interpolated across each face) and
// a wind-sway weight used by foliage.
const U = { time: { value: 0 }, wind: { value: 1 } };
const AO_CURVE = [1.12, 1.07, 1.03, 1.0, 0.8, 0.66, 0.55, 0.47];
const WIND_GLSL = `
  if (aSway > 0.0) {
    #ifdef USE_INSTANCING
      vec3 ip = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
      vec3 isc = vec3(length(instanceMatrix[0].xyz), length(instanceMatrix[1].xyz), length(instanceMatrix[2].xyz));
    #else
      vec3 ip = vec3(0.0); vec3 isc = vec3(1.0);
    #endif
    float ph = uTime * 1.55 + ip.x * 0.19 + ip.z * 0.15 + ip.y * 0.07;
    vec3 off = vec3(
      sin(ph) + 0.45 * sin(uTime * 3.3 + ip.z * 0.41 + ip.y * 0.2),
      0.16 * sin(uTime * 2.4 + ip.x * 0.33),
      0.6 * cos(uTime * 1.21 + ip.z * 0.23 + ip.x * 0.12));
    transformed += off * aSway * uWind / max(isc, vec3(0.05));
  }`;

function voxMat(params, glow = null) {
  const m = new THREE.MeshStandardMaterial(params);
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = U.time;
    sh.uniforms.uWind = U.wind;
    if (glow) sh.uniforms.uGlow = glow;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
attribute vec4 aoA; attribute vec4 aoB; attribute float aSway;
uniform float uTime; uniform float uWind; varying float vAO;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
{
  int ci = (position.x > 0.0 ? 1 : 0) + (position.y > 0.0 ? 2 : 0) + (position.z > 0.0 ? 4 : 0);
  vec4 s4 = ci < 4 ? aoA : aoB;
  int k = ci < 4 ? ci : ci - 4;
  vAO = k == 0 ? s4.x : (k == 1 ? s4.y : (k == 2 ? s4.z : s4.w));
}
${WIND_GLSL}`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
varying float vAO;${glow ? '\nuniform float uGlow;' : ''}`)
      .replace('#include <color_fragment>', `#include <color_fragment>
diffuseColor.rgb *= vAO;`);
    if (glow) {
      sh.fragmentShader = sh.fragmentShader.replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
totalEmissiveRadiance += vColor.rgb * uGlow;`);
    }
  };
  m.customProgramCacheKey = () => (glow ? 'voxel-glow' : 'voxel');
  return m;
}
function windDepthMat() {
  const m = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking });
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = U.time;
    sh.uniforms.uWind = U.wind;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
attribute float aSway; uniform float uTime; uniform float uWind;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
${WIND_GLSL}`);
  };
  m.customProgramCacheKey = () => 'voxel-wind-depth';
  return m;
}

const GLOW = {
  inside: { value: 0.6 },   // pagoda interior shrine lights
  win: { value: 0.2 },      // paper lattice windows
  cloud: { value: 0.15 },
  lantern: [{ value: 0 }, { value: 0 }, { value: 0 }, { value: 0 }],
};
const MATS = {
  solid: voxMat({ roughness: 0.86, metalness: 0.0, envMapIntensity: 0.42 }),
  roof: voxMat({ roughness: 0.4, metalness: 0.05, envMapIntensity: 0.85 }),
  gold: voxMat({ roughness: 0.34, metalness: 0.5, envMapIntensity: 0.95 }),
  leaf: voxMat({ roughness: 0.74, envMapIntensity: 0.45 }),
  glowIn: voxMat({ roughness: 0.55, envMapIntensity: 0.3 }, GLOW.inside),
  glowWin: voxMat({ roughness: 0.7, envMapIntensity: 0.3 }, GLOW.win),
  cloud: voxMat({ roughness: 1.0, envMapIntensity: 0.7 }, GLOW.cloud),
  koi: voxMat({ roughness: 0.3, envMapIntensity: 0.9 }),
  bird: voxMat({ roughness: 0.85, envMapIntensity: 0.5 }),
};
for (let i = 0; i < 4; i++) MATS['lantern' + i] = voxMat({ roughness: 0.6, envMapIntensity: 0.3 }, GLOW.lantern[i]);
const SWAY_MATS = new Set(['leaf']);
const NO_SHADOW_MATS = new Set(['cloud']);
const BOX = new THREE.BoxGeometry(1, 1, 1);

// An InstancedMesh of unit boxes carrying the AO / sway attributes.
function makeIM(material, n) {
  const geo = BOX.clone();
  geo.setAttribute('aoA', new THREE.InstancedBufferAttribute(new Float32Array(n * 4).fill(1), 4));
  geo.setAttribute('aoB', new THREE.InstancedBufferAttribute(new Float32Array(n * 4).fill(1), 4));
  geo.setAttribute('aSway', new THREE.InstancedBufferAttribute(new Float32Array(n), 1));
  const im = new THREE.InstancedMesh(geo, material, n);
  im.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(n * 3).fill(1), 3);
  return im;
}

// ------------------------------------------------------------ voxel grid
const TAG = { none: 0, terrain: 1, pagoda: 2, tree: 3, deco: 4, island: 5 };
const K = (x, y, z) => ((x + 512) * 1024 + (y + 512)) * 1024 + (z + 512);
const _col = new THREE.Color();
const _colCache = new Map();
function baseColor(c) {
  let v = _colCache.get(c);
  if (!v) { v = new THREE.Color(c); _colCache.set(c, v); }
  return v;
}

class VoxelGrid {
  constructor() { this.cells = new Map(); this.details = []; }
  set(x, y, z, c, m = 'solid', s = 0, t = TAG.none, b = 1) {
    this.cells.set(K(x, y, z), { x, y, z, c, m, s, t, b });
  }
  get(x, y, z) { return this.cells.get(K(x, y, z)); }
  has(x, y, z) { return this.cells.has(K(x, y, z)); }
  del(x, y, z) { this.cells.delete(K(x, y, z)); }
  fill(x0, y0, z0, x1, y1, z1, c, m, s, t) {
    for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) for (let z = z0; z <= z1; z++) this.set(x, y, z, c, m, s, t);
  }
  // Off-grid box for fine detail (lattice slats, rings, bells...). Never occludes.
  detail(x, y, z, sx, sy, sz, c, m = 'solid', s = 0, t = TAG.none, ry = 0) {
    this.details.push({ x, y, z, sx, sy, sz, c, m, s, t, ry });
  }
  // Cull hidden voxels, bake corner AO and build one InstancedMesh per material.
  build({ shadows = true } = {}) {
    const groups = new Map();
    const bucket = (m) => {
      let g = groups.get(m);
      if (!g) { g = { items: [] }; groups.set(m, g); }
      return g;
    };
    const cells = this.cells;
    const occ = new Uint8Array(27);
    const tags = {};
    for (const v of cells.values()) {
      const { x, y, z } = v;
      if (cells.has(K(x + 1, y, z)) && cells.has(K(x - 1, y, z)) && cells.has(K(x, y + 1, z)) &&
          cells.has(K(x, y - 1, z)) && cells.has(K(x, y, z + 1)) && cells.has(K(x, y, z - 1))) continue;
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) for (let dz = -1; dz <= 1; dz++) {
        occ[(dx + 1) * 9 + (dy + 1) * 3 + dz + 1] = cells.has(K(x + dx, y + dy, z + dz)) ? 1 : 0;
      }
      const ao = new Float32Array(8);
      for (let ci = 0; ci < 8; ci++) {
        const sx = ci & 1 ? 2 : 0, sy = ci & 2 ? 2 : 0, sz = ci & 4 ? 2 : 0;
        let n = 0;
        for (let a = 0; a < 2; a++) for (let b = 0; b < 2; b++) for (let c = 0; c < 2; c++) {
          if (!a && !b && !c) continue;
          const ix = a ? sx : 1, iy = b ? sy : 1, iz = c ? sz : 1;
          n += occ[ix * 9 + iy * 3 + iz];
        }
        ao[ci] = AO_CURVE[n];
      }
      bucket(v.m).items.push({ v, ao, detail: false });
      tags[v.t] = (tags[v.t] || 0) + 1;
    }
    for (const d of this.details) {
      bucket(d.m).items.push({ v: d, ao: null, detail: true });
      tags[d.t] = (tags[d.t] || 0) + 1;
    }
    const group = new THREE.Group();
    const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), s = new THREE.Vector3();
    const yAxis = new THREE.Vector3(0, 1, 0);
    let total = 0;
    for (const [mname, g] of groups) {
      const n = g.items.length;
      const im = makeIM(MATS[mname], n);
      const aoA = im.geometry.attributes.aoA.array, aoB = im.geometry.attributes.aoB.array;
      const sw = im.geometry.attributes.aSway.array, col = im.instanceColor.array;
      for (let i = 0; i < n; i++) {
        const { v, ao, detail } = g.items[i];
        if (detail) {
          p.set(v.x, v.y, v.z); s.set(v.sx, v.sy, v.sz); q.setFromAxisAngle(yAxis, v.ry);
          m4.compose(p, q, s);
        } else {
          m4.makeTranslation(v.x, v.y, v.z);
          aoA.set(ao.subarray(0, 4), i * 4);
          aoB.set(ao.subarray(4, 8), i * 4);
        }
        im.setMatrixAt(i, m4);
        sw[i] = v.s;
        const j = 1 + (hash3(Math.round(v.x * 7), Math.round(v.y * 7), Math.round(v.z * 7)) - 0.5) * 0.11;
        _col.copy(baseColor(v.c)).multiplyScalar(j * (v.b || 1));
        col[i * 3] = _col.r; col[i * 3 + 1] = _col.g; col[i * 3 + 2] = _col.b;
      }
      im.castShadow = shadows && !NO_SHADOW_MATS.has(mname);
      im.receiveShadow = !NO_SHADOW_MATS.has(mname);
      if (SWAY_MATS.has(mname)) im.customDepthMaterial = windDepthMat();
      im.computeBoundingSphere();
      im.matrixAutoUpdate = false;
      im.name = mname;
      group.add(im);
      total += n;
    }
    return { group, total, tags };
  }
}

// ============================================================ MAIN ISLAND
// 64×64 voxel terrain (x, z ∈ [-32, 31]) cut to an organic outline and
// hung over the sky on a rocky, stalactite underside.
const G = new VoxelGrid();
const PX = 0, PZ = -11;                   // pagoda centre
const WATER_Y = -0.32;                    // pond / stream surface
const K2 = (x, z) => (x + 128) * 512 + (z + 128);
const TER = new Map();                    // K2 -> column info

function islandR(th) {
  const f = th - Math.PI / 2;
  return Math.min(31.4, 28.6 + 1.5 * Math.cos(3 * f) + 0.8 * Math.cos(5 * f + 1.3) + 0.5 * Math.sin(7 * f + 0.5));
}
const PONDB = [[-6, 12, 9.2, 5.2], [8, 11.5, 9, 5.6], [16, 9.6, 5.2, 4.1]];
function pondVal(x, z) {
  let v = -1;
  for (const [cx, cz, rx, rz] of PONDB) v = Math.max(v, 1 - ((x - cx) / rx) ** 2 - ((z - cz) / rz) ** 2);
  return v + (fbm2(x * 0.23 + 7.1, z * 0.23 + 3.3) - 0.5) * 0.34;
}
const streamZ = (x) => 9.6 + 1.3 * Math.sin((x - 18) * 0.34);

const PATH_S = [[0, 29], [0, 25.5], [-3, 23], [2.4, 20.2], [0, 18.2]];
const PATH_N = [[0, 6], [-2.6, 3.8], [2.2, 1.6], [0, -1.5]];
function segDist(px, pz, pts) {
  let best = 1e9, bs = 0, acc = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const [ax, az] = pts[i], [bx, bz] = pts[i + 1];
    const vx = bx - ax, vz = bz - az, L2 = vx * vx + vz * vz, L = Math.sqrt(L2);
    const t = clamp(((px - ax) * vx + (pz - az) * vz) / L2, 0, 1);

    const sd = Math.hypot(x - spike.x * 2, z - spike.z * 2);
    if (sd < 3) depth += spike.L * (1 - sd / 3);
    const bot = -Math.round(depth);
    tops.set(K2(x, z), { x, z, e });
    for (let y = bot; y <= 0; y++) {
      const ft = -y;
      let c, b = 1;
      if (ft === 0) c = e < 1.3 && hash3(x, seed, z) > 0.5 ? P.moss : GRASS[Math.floor(hash3(x, 3, z) * 4)];
      else if (ft <= 2) c = ft === 1 ? P.dirt : P.dirtD;

      g.set(x, y, z, c, 'solid', 0, TAG.island, b);
    }
    if (e < 1.5 && hash3(x, 71, z) > 0.78) {
      const len = 2 + Math.floor(hash3(x, 72, z) * 6);
      for (let k = 1; k <= len; k++) g.set(x, bot - k, z, k % 2 ? '#4D7A35' : '#5D8C3C', 'leaf', 0.1 + 0.05 * k, TAG.island);
    }
  }
  decor && decor(g, (x, z) => tops.has(K2(x, z)));
  const built = g.build();
  built.group.position.copy(pos);
  scene.add(built.group);
  FLOATERS.push({ group: built.group, base: pos.clone(), amp, speed, phase: rnd() * 6.28, count: built.total });

}

  const y0 = (i === 0 ? 1 : f.base - 1) - 0.5, y1 = (i < 4 ? FLOORS[i + 1].base - 1 : PEAK + 10) - 0.5;
  const m = new THREE.Mesh(new THREE.BoxGeometry(2 * f.R + 1, y1 - y0, 2 * f.R + 1), invisible);
  m.position.set(PX, (y0 + y1) / 2, PZ);
  m.userData = { kind: 'floor', i };
  m.updateMatrixWorld();
  PROXIES.push(m);
});
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pickAt(cx, cy) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(PROXIES, false)[0];
  return hit ? hit.object.userData : null;
}
const FLOOR_NAMES = ['First', 'Second', 'Third', 'Fourth', 'Fifth'];
const tip = $('tip');
function describe(u) {
  if (!u) return '';
  if (u.kind === 'lantern') { const l = LAMPS[u.i]; return (lanternsAuto !== l.flip ? 'Lantern lit' : 'Lantern dark') + ' · click to ' + (lanternsAuto !== l.flip ? 'extinguish' : 'light'); }
  return `${FLOOR_NAMES[u.i]} floor · click to ${FLOOR_STATE[u.i].target ? 'close' : 'open'} the doors`;
}
let downAt = null, hoverQueued = null;
renderer.domElement.addEventListener('pointerdown', (ev) => {
  downAt = { x: ev.clientX, y: ev.clientY, t: performance.now() };
  if (INTRO.active) endIntro();
});
renderer.domElement.addEventListener('pointerup', (ev) => {
  if (!downAt) return;
  const moved = Math.hypot(ev.clientX - downAt.x, ev.clientY - downAt.y), held = performance.now() - downAt.t;
  downAt = null;
  if (moved > 6 || held > 600) return;
  const u = pickAt(ev.clientX, ev.clientY);
  if (!u) return;
  if (u.kind === 'lantern') LAMPS[u.i].flip = !LAMPS[u.i].flip;
  else { const st = FLOOR_STATE[u.i]; st.target = st.target ? 0 : 1; st.dirty = true; }
  tip.textContent = describe(u);
  lastInteract = performance.now();
  controls.autoRotate = false;
});
renderer.domElement.addEventListener('pointermove', (ev) => { hoverQueued = { x: ev.clientX, y: ev.clientY }; });
renderer.domElement.addEventListener('pointerleave', () => { hoverQueued = null; tip.style.opacity = 0; renderer.domElement.style.cursor = ''; });
function processHover() {
  if (!hoverQueued) return;
  const { x, y } = hoverQueued;
  hoverQueued = null;
  const u = downAt ? null : pickAt(x, y);
  renderer.domElement.style.cursor = u ? 'pointer' : '';
  tip.style.opacity = u ? 1 : 0;
  if (u) { tip.textContent = describe(u); tip.style.left = x + 'px'; tip.style.top = y + 'px'; }
}

// ===================================================================== HUD
let playing = true, dragging = false, speedIdx = 0;
const SPEEDS = [1, 2, 4, 0.5];
const todEl = $('tod'), clockEl = $('clock'), statEl = $('stat'), playEl = $('play'), phaseEl = $('phase');
const fmtTime = (h) => `${String(Math.floor(h)).padStart(2, '0')}:${String(Math.floor((h % 1) * 60)).padStart(2, '0')}`;
function setTime(h) { ENV.hours = ((h % 24) + 24) % 24; envLast = -9; }
todEl.addEventListener('pointerdown', () => { dragging = true; });
window.addEventListener('pointerup', () => { dragging = false; });
todEl.addEventListener('input', () => setTime(parseFloat(todEl.value)));
playEl.addEventListener('click', () => { playing = !playing; playEl.textContent = playing ? '❚❚' : '▶'; playEl.classList.toggle('on', !playing); });
document.querySelectorAll('.chips button[data-t]').forEach((b) => b.addEventListener('click', () => setTime(parseFloat(b.dataset.t))));
$('spd').addEventListener('click', () => {
  speedIdx = (speedIdx + 1) % SPEEDS.length;
  $('spd').textContent = (SPEEDS[speedIdx] === 0.5 ? '½' : SPEEDS[speedIdx]) + '×';
  $('cyc').textContent = `${Math.round(90 / SPEEDS[speedIdx])} s day`;
});
window.addEventListener('keydown', (e) => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); playEl.click(); } });

// ============================================================ BOOKKEEPING
const VOXELS = MAIN.total + FLOATERS.reduce((s, f) => s + f.count, 0) + DEBRIS.length + CLOUD_BOXES.length +
  doorPieces.length + studPieces.length + koiIM.count + birdIM.count + DROPS.length;
const PAGODA_VOXELS = (MAIN.tags[TAG.pagoda] || 0) + doorPieces.length + studPieces.length;
window.__VOXEL__ = {
  model: 'Opus 5.5 XHigh',
  voxelCount: VOXELS,
  fps: 0,
  pagodaFloors: FLOORS.length,
  timeOfDay: ENV.hours,
  pagodaVoxels: PAGODA_VOXELS,
  pagodaHeightMeters: +PAGODA_HEIGHT_M.toFixed(1),
  terrain: '64x64',
  trees: { sakura: 3, pine: 2, maple: 2, willow: 1, total: TREES.length },
  koi: KOI.length, lanterns: LAMPS.length, flowers: FLOWERS.length, birds: BIRDS.length, floatingIslands: FLOATERS.length,
  lanternsLit: [false, false, false, false], doorsOpen: [false, false, false, false, false],
  setTime, toggleLantern: (i) => { LAMPS[i].flip = !LAMPS[i].flip; },
  toggleFloor: (i) => { const st = FLOOR_STATE[i]; st.target = st.target ? 0 : 1; st.dirty = true; },
};

// ============================================================ MAIN LOOP
let simT = 0, fps = 60, fpsFrames = 0, fpsTime = 0, hudT = 0, slowFor = 0, quality = 2, firstFrame = true;
const clockT = new THREE.Clock();
function onResize() {
  if (!(innerWidth > 0 && innerHeight > 0)) return;
  camera.aspect = viewAspect();
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (composer) { composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth, innerHeight); }
}
window.addEventListener('resize', onResize);

function frame() {
  requestAnimationFrame(frame);
  const raw = clockT.getDelta(), dt = Math.min(raw, 1 / 20);
  simT += dt;
  U.time.value = simT;
  if (playing && !dragging) ENV.hours = (ENV.hours + dt * 24 / (90 / SPEEDS[speedIdx])) % 24;
  U.wind.value = 0.8 + 0.3 * Math.sin(simT * 0.13) + 0.15 * Math.sin(simT * 0.71);
  WIND.set(Math.cos(simT * 0.03), 0, 0.35 + 0.3 * Math.sin(simT * 0.05));

  updateEnvironment(dt, simT);
  updateDoors(dt);
  updateKoi(simT);
  updateBirds(simT);
  updatePetals(dt, simT);
  updateDebrisAndDrops(dt, simT);
  cloudGroup.rotation.y += dt * 0.004;
  if (rand() < dt * 0.5) {
    const c = POND_CELLS[Math.floor(rand() * POND_CELLS.length)];
    if (c) spawnRipple(c.x + rr(-0.4, 0.4), c.z + rr(-0.4, 0.4), 0.55);
  }

  if (INTRO.active) updateIntro(dt);
  else {
    if (!controls.autoRotate && performance.now() - lastInteract > 4500) controls.autoRotate = true;
    controls.update(dt);
  }
  sky.position.copy(camera.position);
  processHover();

  if (usePost && composer) composer.render(dt);
  else renderer.render(scene, camera);

  if (firstFrame) {
    firstFrame = false;
    const ld = $('loader');
    ld.style.opacity = 0;
    setTimeout(() => ld.remove(), 700);
  }

  fpsFrames++; fpsTime += raw;
  if (fpsTime >= 0.5) {
    fps = Math.round(fpsFrames / fpsTime);
    fpsFrames = 0; fpsTime = 0;
    if (!INTRO.active && fps < 40 && document.visibilityState === 'visible') slowFor += 0.5; else slowFor = 0;
    if (slowFor >= 3 && quality > 0) {
      quality--; slowFor = 0;
      if (quality === 1) { renderer.setPixelRatio(1); onResize(); }
      else { usePost = false; }
    }
  }
  const V = window.__VOXEL__;
  V.fps = fps;
  V.timeOfDay = +ENV.hours.toFixed(2);
  hudT += raw;
  if (hudT > 0.25) {
    hudT = 0;
    statEl.textContent = `${Math.round(VOXELS / 1000)}k voxels | ${fps} FPS`;
    clockEl.textContent = fmtTime(ENV.hours);
    phaseEl.textContent = ENV.elev > -0.03 ? '☀' : '☾';
    if (!dragging) todEl.value = ENV.hours.toFixed(2);
    LAMPS.forEach((l, i) => { V.lanternsLit[i] = lanternsAuto !== l.flip; });
    FLOOR_STATE.forEach((s, i) => { V.doorsOpen[i] = !!s.target; });
  }
}
const POND_CELLS = [...TER.values()].filter((c) => c.type === 'pond' || c.type === 'deep');
statEl.textContent = `${Math.round(VOXELS / 1000)}k voxels | 60 FPS`;
updateDoors(0);
frame();
</script>
