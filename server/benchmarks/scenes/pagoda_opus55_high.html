<style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// =====================================================================
// ===GEN-START=== (pure procedural voxel generation — no THREE / DOM)
// =====================================================================
const COL = {
  VERM:0xC73E1D, VERM_D:0xA5321A, GOLD:0xE8B86D, GOLD_D:0xC99A4E, TEAK:0x4A2C1A, TEAK_D:0x351F12, TEAK_L:0x6E4630,
  JADE_D:0x2D6A4F, JADE_L:0x40916C, JADE_M:0x357B5C, SAK1:0xFFB7C5, SAK2:0xFF8FAB, SAK3:0xFFE5EC,
  STONE:0x9AA0A6, STONE_D:0x7D838A, STONE_L:0xB3B8BC, POND:0x7ED6DF, MOSS:0x606C38,
  PLASTER:0xEFE6D2, PAPER:0xFFF1D0, TATAMI:0xF0CF8F, SOIL:0x5E3F27, SOIL_D:0x4A311E, KASAGI:0x2A1E1A
};
const MAT = { STD:0, GOLD:1, ROOF:2, LEAF:3, INTERIOR:4, WINDOW:5, CRYSTAL:6 };

function hash3(x,y,z){
  let h = (Math.imul(x|0,374761393) + Math.imul(y|0,668265263) + Math.imul(z|0,1440662683))|0;
  h = Math.imul(h ^ (h>>>13), 1274126177); h ^= h>>>16;
  return (h>>>0)/4294967296;
}
function vnoise(x,z){
  const xi=Math.floor(x), zi=Math.floor(z), xf=x-xi, zf=z-zi;
  const u=xf*xf*(3-2*xf), v=zf*zf*(3-2*zf);
  const a=hash3(xi,17,zi), b=hash3(xi+1,17,zi), c=hash3(xi,17,zi+1), d=hash3(xi+1,17,zi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,z){ return vnoise(x,z)*0.5 + vnoise(x*2.07+5.3,z*2.07+1.7)*0.3 + vnoise(x*4.11+9.1,z*4.11+3.3)*0.2; }
function makeRng(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function mulHex(c,f){ const r=Math.min(255,Math.round(((c>>16)&255)*f)), g=Math.min(255,Math.round(((c>>8)&255)*f)), b=Math.min(255,Math.round((c&255)*f)); return (r<<16)|(g<<8)|b; }
function mixHex(a,b,t){ const ar=(a>>16)&255, ag=(a>>8)&255, ab=a&255, br=(b>>16)&255, bg=(b>>8)&255, bb=b&255;
  return (Math.round(ar+(br-ar)*t)<<16)|(Math.round(ag+(bg-ag)*t)<<8)|Math.round(ab+(bb-ab)*t); }
const pickH = (arr,h)=>arr[Math.min(arr.length-1,Math.floor(h*arr.length))];

const KX = 4096;
function vkey(x,y,z){ return ((x+2048)*KX + (y+2048))*KX + (z+2048); }
class VoxelSet {
  constructor(s,name){ this.s=s; this.name=name; this.map=new Map(); this.visible=0; }
  set(x,y,z,c,m=0){ this.map.set(vkey(x,y,z), m*16777216 + c); }
  add(x,y,z,c,m=0){ const k=vkey(x,y,z); if(!this.map.has(k)) this.map.set(k, m*16777216 + c); }
  del(x,y,z){ this.map.delete(vkey(x,y,z)); }
  has(x,y,z){ return this.map.has(vkey(x,y,z)); }
}

// Face-culling + per-instance ambient occlusion (neighbour + sky occlusion)
function collectVisible(set, occluders){
  const S=set.map, occ=occluders||[], out=new Map();
  const solid=(x,y,z)=>{ const k=vkey(x,y,z); if(S.has(k)) return true; for(let i=0;i<occ.length;i++) if(occ[i].map.has(k)) return true; return false; };
  let n=0;
  for(const [k,v] of S){
    const zz=k%KX; const z=zz-2048; const q=(k-zz)/KX; const yy=q%KX; const y=yy-2048; const x=(q-yy)/KX-2048;
    if(solid(x+1,y,z)&&solid(x-1,y,z)&&solid(x,y+1,z)&&solid(x,y-1,z)&&solid(x,y,z+1)&&solid(x,y,z-1)) continue;
    let o=0;
    for(let dx=-1;dx<=1;dx++) for(let dz=-1;dz<=1;dz++){ if(!(dx|dz)) continue; if(solid(x+dx,y+1,z+dz)) o++; }
    let ao = 1 - o*0.052;
    if(!solid(x,y+1,z)){ for(let kk=2;kk<=12;kk++){ if(solid(x,y+kk,z)){ ao*=0.8; break; } } }
    if(!solid(x,y-1,z) && solid(x,y+1,z)) ao*=0.92;
    ao *= 0.94 + hash3(x,y,z)*0.11;
    const m=Math.floor(v/16777216), c=v-m*16777216;
    let arr=out.get(m); if(!arr){ arr=[]; out.set(m,arr); }
    arr.push(x,y,z,c,ao); n++;
  }
  set.visible=n;
  return out;
}

function blob(set,cx,cy,cz,rx,ry,rz,colFn,mat,rough,seed){
  const x0=Math.floor(cx-rx-1), x1=Math.ceil(cx+rx+1), y0=Math.floor(cy-ry-1), y1=Math.ceil(cy+ry+1), z0=Math.floor(cz-rz-1), z1=Math.ceil(cz+rz+1);
  for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++) for(let z=z0;z<=z1;z++){
    const dx=(x-cx)/rx, dy=(y-cy)/ry, dz=(z-cz)/rz, d=dx*dx+dy*dy+dz*dz;
    const n=(hash3(x*3+seed,y*5+seed,z*7)-0.5)*rough;
    if(d<1+n) set.add(x,y,z,colFn(x,y,z,d),mat);
  }
}
function line3(set,a,b,col,mat,thick){
  const n=Math.ceil(Math.max(Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1]),Math.abs(b[2]-a[2]))*2)+1;
  for(let i=0;i<n;i++){
    const t=n>1?i/(n-1):0;
    const x=Math.round(a[0]+(b[0]-a[0])*t), y=Math.round(a[1]+(b[1]-a[1])*t), z=Math.round(a[2]+(b[2]-a[2])*t);
    set.set(x,y,z,col,mat);
    if(thick && t<=thick){ set.set(x+1,y,z,col,mat); set.set(x-1,y,z,col,mat); set.set(x,y,z+1,col,mat); set.set(x,y,z-1,col,mat); }
  }
}

// ---------------- layout ----------------
const PX=0, PZ=-9;
const POND={cx:-10,cz:10,rx:10,rz:6};
const inPond=(x,z)=>((x-POND.cx)**2)/(POND.rx**2)+((z-POND.cz)**2)/(POND.rz**2)<1;
const inStream=(x,z)=>z>=9&&z<=11&&x<=-19&&!inPond(x,z);
const isWater=(x,z)=>inPond(x,z)||inStream(x,z);
const inCourt=(x,z)=>x>=-12&&x<=12&&z>=-22&&z<=2;
const PATH=[[2,30,2,21],[2,21,-4,21],[-4,21,-4,16],[-4,4,-4,2],[-4,2,0,2],[0,2,0,1]];
function pathDist(x,z){ let best=99; for(const [ax,az,bx,bz] of PATH){ const x0=Math.min(ax,bx),x1=Math.max(ax,bx),z0=Math.min(az,bz),z1=Math.max(az,bz);
  const dx=Math.max(x0-x,0,x-x1), dz=Math.max(z0-z,0,z-z1); best=Math.min(best,Math.max(dx,dz)); } return best; }
const inBridge=(x,z)=>x>=-5&&x<=-3&&z>=4&&z<=16;
const isPath=(x,z)=>pathDist(x,z)<=1&&!inBridge(x,z)&&!isWater(x,z);
const TREES=[
  {type:'sakura',x:15,z:8,seed:11},{type:'sakura',x:-22,z:-2,seed:23},{type:'sakura',x:-11,z:23,seed:37},
  {type:'pine',x:24,z:-6,seed:41},{type:'pine',x:-20,z:-16,seed:53},
  {type:'maple',x:17,z:19,seed:61},{type:'maple',x:16,z:-18,seed:73},
  {type:'willow',x:-19,z:15,seed:89}
];
const LANTERNS=[[6,3],[-8,1],[5,18],[-7,19]];
const JIZO=[[8,23],[10,23]];
const TORII={x0:-1,x1:5,z:25};
function isFlat(x,z){
  if(x>=-15&&x<=15&&z>=-23&&z<=4) return true;
  if(pathDist(x,z)<=3) return true;
  if(((x-POND.cx)**2)/((POND.rx+2)**2)+((z-POND.cz)**2)/((POND.rz+2)**2)<1) return true;
  if(z>=7&&z<=13&&x<=-17) return true;
  if(x>=-6&&x<=10&&z>=21&&z<=28) return true;
  for(const [lx,lz] of LANTERNS) if(Math.abs(x-lx)<=2&&Math.abs(z-lz)<=2) return true;
  return false;
}
function rawHeight(x,z){
  const g=(cx,cz,a,s)=>a*Math.exp(-((x-cx)**2+(z-cz)**2)/(2*s*s));
  return g(-22,-13,3.4,5)+g(22,-12,2.6,4.5)+g(21,22,1.8,3.5)+g(-25,3,1.5,3)+g(25,6,1.2,3);
}
function heightAt(x,z){
  if(isFlat(x,z)) return 0;
  let h=Math.round(rawHeight(x,z));
  if(fbm(x*0.16+4,z*0.16+9)>0.68) h+=1;
  return h;
}
function mainRadius(x,z){ const a=Math.atan2(z,x); return 30.5*(1+0.04*Math.sin(3*a+0.7)+0.025*Math.sin(5*a+2.1)+0.02*Math.sin(8*a+4.0))+(fbm(Math.cos(a)*2+10,Math.sin(a)*2+10)-0.5)*2; }

function genAll(){
  const C=new VoxelSet(1,'terrain'), F=new VoxelSet(.5,'fine'), M=new VoxelSet(.25,'micro');
  const PC=new VoxelSet(1,'pagoda'), PF=new VoxelSet(.5,'pagodaF'), PM=new VoxelSet(.25,'pagodaM');
  const TOP=new Map();      // "x,z" -> top voxel y (land) ; water -> 'w'
  const SURF=new Map();     // "x,z" -> walkable surface height (world y)
  const topAt=(x,z)=>{ const t=TOP.get(x+','+z); return (t===undefined||t==='w')?0:t; };
  const stoneV=(x,y,z)=>pickH([COL.STONE,0x8F959B,0xA6ABB0,0x959BA1],hash3(x,y,z));
  const sakuraList=TREES.filter(t=>t.type==='sakura');

  // ---------- main flying island (64x64 organic, conical rocky underside) ----------
  let lipX=0;
  const waterTiles=[];
  for(let x=-32;x<=31;x++) for(let z=-32;z<=31;z++){
    const d=Math.hypot(x,z), r=mainRadius(x,z);
    if(d>=r) continue;
    const t=d/r, water=isWater(x,z), h=water?0:heightAt(x,z);
    const bottom=Math.min(-3,-Math.round(3+Math.pow(1-t,0.7)*25+(fbm(x*0.18+3,z*0.18+7)-0.5)*7));
    const top=water?-2:h;
    for(let y=bottom;y<=top;y++){
      let c;
      if(y===top){
        if(water) c=pickH([0x3F6F6A,0x4A7A72,0x557F74,0x6E8A80],hash3(x,y,z));
        else c=surfaceColor(x,z);
      } else if(y>=top-2 && !water){ c=hash3(x,y,z)<0.5?COL.SOIL:COL.SOIL_D; }
      else c=rockColor(x,y,z);
      C.set(x,y,z,c);
    }
    if(water){ TOP.set(x+','+z,'w'); SURF.set(x+','+z,-0.35); waterTiles.push(x,z); if(inStream(x,z)&&z===10) lipX=Math.min(lipX,x); }
    else { TOP.set(x+','+z,top); SURF.set(x+','+z,top+0.5); }
    // hanging vines & roots on the rim
    if(t>0.86 && !water && hash3(x,5,z)<0.38){
      const L=2+Math.floor(hash3(x,6,z)*7);
      for(let k=1;k<=L;k++){ const y=top-k; if(y<bottom) break; C.set(x,y,z,pickH([0x4F6B2F,0x5E7A34,0x6F8A3A,0x3F5A2A],hash3(x,y,z))); }
    }
    // glowing jade crystals under the tip
    if(t<0.16 && hash3(x,9,z)<0.55){
      const L=1+Math.floor(hash3(x,10,z)*(t<0.07?5:3));
      for(let k=0;k<L;k++) C.set(x,bottom-k,z,pickH([0x6EE7C8,0x4FD1B0,0x9BF3DD],hash3(x,k,z)),MAT.CRYSTAL);
    }
  }
  function surfaceColor(x,z){
    if(isPath(x,z)){ const e=pathDist(x,z)===1; const h=hash3(x,1,z);
      if(h<0.1) return 0x6F7B45; return e?pickH([0x80868D,0x8A9097,0x777D84],h):pickH([COL.STONE,0xA9AEB3,0x949AA0,0xB0B4B8],h); }
    if(inCourt(x,z)){ const ring=Math.max(Math.abs(x-PX),Math.abs(z-PZ)); return (ring%2===0)?0xE0DACB:0xCFC8B6; }
    for(const s of sakuraList){ const dd=Math.hypot(x-s.x,z-s.z); if(dd<5.5 && hash3(x,2,z)<0.55-dd*0.07) return hash3(x,3,z)<0.5?COL.SAK3:COL.SAK1; }
    const n=fbm(x*0.13+1,z*0.13+2);
    return pickH([0x55632F,COL.MOSS,0x6B783B,0x778541,0x839049],Math.min(0.999,Math.max(0,(n-0.25)*1.9+hash3(x,4,z)*0.12)));
  }
  function rockColor(x,y,z){
    const band=Math.floor((y+fbm(x*0.1,z*0.1)*4)/2.5);

  const FLOORS=[]; { const B=[5,5,4,4,3], R=[10,9,8,7,6]; let yb=3; for(let i=0;i<5;i++){ const wallH=i===0?3:2, y0=yb+wallH; FLOORS.push({i,b:B[i],R:R[i],yb,wallH,y0}); yb=y0+2; } }

// ---------------- water (instanced voxel tiles with ripple shader) ----------------
function buildWater(){
  const geo=new THREE.PlaneGeometry(1,1); geo.rotateX(-Math.PI/2);
  const mat=new THREE.MeshStandardMaterial({color:0x7ED6DF,roughness:0.12,metalness:0.15,transparent:true,opacity:0.74,depthWrite:false});
  mat.onBeforeCompile=(sh)=>{
    sh.uniforms.uTime=U.time;
    sh.vertexShader='uniform float uTime;\nvarying vec3 vW;\n'+sh.vertexShader.replace('#include <begin_vertex>',`#include <begin_vertex>
      vec4 wp0 = modelMatrix * instanceMatrix * vec4(transformed,1.0);
      transformed.y += sin(wp0.x*1.3+uTime*1.6)*0.025 + cos(wp0.z*1.7+uTime*1.3)*0.025;
      vW = wp0.xyz;`);
    sh.fragmentShader='uniform float uTime;\nvarying vec3 vW;\n'+sh.fragmentShader.replace('#include <emissivemap_fragment>',`#include <emissivemap_fragment>
      float w1 = sin(vW.x*1.9 + uTime*1.1 + sin(vW.z*1.3+uTime*0.7)*1.5);
      float w2 = sin(vW.z*2.3 - uTime*0.9 + sin(vW.x*1.1-uTime*0.5)*1.7);
      float caust = pow(max(0.0, w1*w2), 3.0);
      float flow = step(vW.x, -19.5) * step(abs(vW.z-10.0), 1.6);
      float streak = flow * pow(max(0.0, sin(vW.x*3.0 + uTime*9.0 + sin(vW.z*4.0)*2.0)), 6.0);
      vec2 cell = fract(vW.xz + 0.5) - 0.5;
      float grid = smoothstep(0.42,0.5,max(abs(cell.x),abs(cell.y)));
      totalEmissiveRadiance += vec3(0.30,0.55,0.60)*caust*0.35 + vec3(0.8,0.95,1.0)*streak*0.5 + vec3(0.2,0.35,0.4)*grid*0.08;`);
  };
  const n=G.waterTiles.length/2; waterMesh=new THREE.InstancedMesh(geo,mat,n);
  for(let i=0;i<n;i++){ _m.makeTranslation(G.waterTiles[i*2],-0.35,G.waterTiles[i*2+1]); waterMesh.setMatrixAt(i,_m); }
  waterMesh.receiveShadow=true; waterMesh.frustumCulled=false; waterMesh.renderOrder=2; world.add(waterMesh);
}

// ---------------- waterfall off the island edge ----------------
function buildWaterfall(){
  const lip=G.lipX-0.5;
  const H=46;
  const mk=(w,speed,alpha,off)=>{
    const geo=new THREE.PlaneGeometry(w,H,8,40); geo.translate(0,-H/2,0); geo.rotateY(Math.PI/2);
    const mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,fog:true,
      uniforms:THREE.UniformsUtils.merge([THREE.UniformsLib.fog,{uTime:{value:0},uA:{value:alpha},uS:{value:speed},uCol:{value:new THREE.Color(0x9fe6ee)}}]),
      vertexShader:`uniform float uTime; varying vec2 vUv; varying float vDrop;
        #include <fog_pars_vertex>
        void main(){ vUv=uv; vec3 p=position; float drop=-p.y; vDrop=drop;
          p.x -= 1.15*sqrt(max(drop,0.0)) + ${off.toFixed(2)};
          p.z *= 1.0 + drop*0.012;
          vec4 mvPosition=modelViewMatrix*vec4(p,1.0); gl_Position=projectionMatrix*mvPosition;
          #include <fog_vertex>
        }`,
      fragmentShader:`uniform float uTime,uA,uS; uniform vec3 uCol; varying vec2 vUv; varying float vDrop;
        #include <fog_pars_fragment>
        float h1(float n){ return fract(sin(n)*43758.5453); }
        void main(){
          float col=floor(vUv.x*18.0);
          float sp=uS*(0.8+h1(col)*0.5);
          float s=fract(vUv.y*6.0 + uTime*sp + h1(col*3.1));
          float streak=smoothstep(0.0,0.25,s)*smoothstep(1.0,0.55,s);
          float edge=smoothstep(0.0,0.18,vUv.x)*smoothstep(1.0,0.82,vUv.x);
          float fade=smoothstep(0.0,0.55,vUv.y);
          float a=(0.35+0.65*streak)*edge*fade*uA;
          vec3 c=mix(uCol,vec3(1.0),streak*0.7+ (1.0-vUv.y)*0.2);
          gl_FragColor=vec4(c*1.25,a);
          #include <fog_fragment>
        }`});
    const m=new THREE.Mesh(geo,mat); m.position.set(lip,-0.38,10); m.renderOrder=3; world.add(m); return m;
  };
  waterfall=[mk(3.0,1.6,0.85,0.0),mk(2.4,2.3,0.55,0.12)];
  // spray droplets
  const N=320; fallParts=new THREE.InstancedMesh(new THREE.BoxGeometry(0.2,0.2,0.2),new THREE.MeshStandardMaterial({color:0xe8fbff,emissive:0x9adfe8,emissiveIntensity:0.45,roughness:0.3,transparent:true,opacity:0.85}),N);
  fallParts.frustumCulled=false; world.add(fallParts);
  const r=makeRng(5);
  for(let i=0;i<N;i++) fallData.push({ph:r(),z:(r()-0.5)*3.0,jx:r()*0.6,sp:0.85+r()*0.3,lip});
  // mist puffs where the water dissolves into the clouds
  const tex=radialTex('rgba(255,255,255,1)','rgba(255,255,255,0)');
  const mistMat=new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false,opacity:0.5,color:0xeaf8ff});
  for(let i=0;i<9;i++){ const s=new THREE.Sprite(mistMat); const d=6+i*4.5; s.position.set(lip-1.15*Math.sqrt(d)-1,-0.4-d,10+(r()-0.5)*3); s.scale.setScalar(3+i*1.4); s.userData.ph=r()*6; world.add(s); fallData.push({sprite:s,base:s.position.y}); }
}
function radialTex(a,b){ const c=document.createElement('canvas'); c.width=c.height=64; const x=c.getContext('2d'); const g=x.createRadialGradient(32,32,0,32,32,32); g.addColorStop(0,a); g.addColorStop(1,b); x.fillStyle=g; x.fillRect(0,0,64,64); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; }

// ---------------- pagoda doors (animated, per floor) + floor hitboxes ----------------
function buildDoors(){
  const vm=new THREE.MeshStandardMaterial({color:0xC73E1D,roughness:0.55});
  const gm=new THREE.MeshStandardMaterial({color:0xE8B86D,roughness:0.3,metalness:0.6,emissive:0x5a3c10,emissiveIntensity:0.5});
  const gL=new THREE.BoxGeometry(1.5,2,0.18); gL.translate(0.75,1,0);
  const gR=new THREE.BoxGeometry(1.5,2,0.18); gR.translate(-0.75,1,0);
  const band=new THREE.BoxGeometry(1.34,0.1,0.22), knob=new THREE.BoxGeometry(0.12,0.3,0.26);
  G.FLOORS.forEach((f,idx)=>{
    const pivots=[];
    for(let side=0;side<4;side++){
      const sg=new THREE.Group(); sg.position.set(PX,0,PZ); sg.rotation.y=side*Math.PI/2; world.add(sg);
      for(const dir of [-1,1]){
        const pv=new THREE.Group(); pv.position.set(dir*1.5,f.yb-0.5,f.b+0.3); sg.add(pv);
        const p=new THREE.Mesh(dir<0?gL:gR,vm); p.castShadow=true; p.receiveShadow=true; pv.add(p);
        for(const by of [0.45,1.55]){ const b=new THREE.Mesh(band,gm); b.position.set(-dir*0.75,by,0); pv.add(b); }
        const k=new THREE.Mesh(knob,gm); k.position.set(-dir*1.32,1.0,0); pv.add(k);
        pv.userData.dir=dir; pivots.push(pv);
      }
    }
    const y0=f.yb-0.5, y1=idx===4?33:f.y0+1.5;
    const w=2*f.R+1, hit=new THREE.Mesh(new THREE.BoxGeometry(w,y1-y0,w),new THREE.MeshBasicMaterial({visible:false}));
    hit.position.set(PX,(y0+y1)/2,PZ); hit.userData={type:'floor',idx}; world.add(hit); pickables.push(hit);
    floors.push({f,pivots,open:0,target:0,hit,box:[w,y1-y0,w]});
  });
}

  for(let i=0;i<N;i++){ petals.setColorAt(i,_c.setHex(cols[i%4])); petalData.push(spawnPetal({},true)); }

}
function spawnPetal(p,initial){
  const s=SAK[Math.floor(Math.random()*3)];
  const a=Math.random()*Math.PI*2, r=Math.random()*4.2;
  p.x=s.x+Math.cos(a)*r; p.z=s.z+Math.sin(a)*r; p.y=initial?0.6+Math.random()*10:s.y+(Math.random()-0.5)*3;
  p.vy=-(0.5+Math.random()*0.55); p.ph=Math.random()*6.28; p.rx=Math.random()*6.28; p.ry=Math.random()*6.28; p.rz=Math.random()*6.28;
  p.sx=(Math.random()-0.5)*4; p.sy=(Math.random()-0.5)*4; p.rest=0; return p;
}
function surfaceAt(x,z){ const v=G.SURF.get(Math.round(x)+','+Math.round(z)); return v===undefined?-60:v; }

function buildBirds(){
  const W=new THREE.MeshStandardMaterial({color:0xf6f3ee,roughness:0.7}), K=new THREE.MeshStandardMaterial({color:0x1d1d22,roughness:0.7}), Rm=new THREE.MeshStandardMaterial({color:0xd8321e,emissive:0x400000}), Y=new THREE.MeshStandardMaterial({color:0xe8b86d});
  const crane=()=>{ const g=new THREE.Group();
    const body=new THREE.Mesh(new THREE.BoxGeometry(0.55,0.45,1.4),W); g.add(body);
    const neck=new THREE.Mesh(new THREE.BoxGeometry(0.18,0.18,0.9),K); neck.position.set(0,0.12,1.05); g.add(neck);
    const head=new THREE.Mesh(new THREE.BoxGeometry(0.26,0.24,0.34),W); head.position.set(0,0.16,1.6); g.add(head);
    const crown=new THREE.Mesh(new THREE.BoxGeometry(0.18,0.06,0.16),Rm); crown.position.set(0,0.3,1.6); g.add(crown);
    const beak=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.08,0.45),Y); beak.position.set(0,0.12,1.95); g.add(beak);
    const tail=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.12,0.4),K); tail.position.set(0,0.02,-0.85); g.add(tail);
    const legs=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.08,0.9),K); legs.position.set(0,-0.12,-1.3); g.add(legs);
    const wings=[]; for(const s of [-1,1]){ const p=new THREE.Group(); p.position.set(s*0.27,0.12,0.1); g.add(p);
      const w1=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.07,0.75),W); w1.position.x=s*0.75; p.add(w1);
      const p2=new THREE.Group(); p2.position.x=s*1.5; p.add(p2);
      const w2=new THREE.Mesh(new THREE.BoxGeometry(1.3,0.06,0.6),W); w2.position.x=s*0.65; p2.add(w2);
      const tip=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.075,0.62),K); tip.position.x=s*1.05; p2.add(tip);
      wings.push({p,p2,s}); }
    g.scale.setScalar(1.25); return {g,wings}; };
  const offs=[[0,0,0],[-3,0.3,-3],[3,0.3,-3],[-6,0.6,-6],[6,0.6,-6],[-9,0.9,-9],[9,0.9,-9]];
  offs.forEach((o,i)=>{ const b=crane(); scene.add(b.g); birds.push({...b,off:o,ph:i*0.7}); });
  const S=new THREE.MeshStandardMaterial({color:0x22263a,roughness:0.6}), SW=new THREE.MeshStandardMaterial({color:0xf2e6e0,roughness:0.6});
  for(let i=0;i<6;i++){ const g=new THREE.Group(); const b=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.12,0.5),S); g.add(b);
    const belly=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.06,0.3),SW); belly.position.set(0,-0.06,0.05); g.add(belly);
    const wings=[]; for(const s of [-1,1]){ const p=new THREE.Group(); p.position.x=s*0.08; g.add(p); const w=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.03,0.22),S); w.position.x=s*0.35; p.add(w); wings.push({p,s}); }
    g.scale.setScalar(1.6); scene.add(g); swallows.push({g,wings,ph:i*1.05,r:13+i*1.6,h:19+i*1.6,sp:0.5+i*0.06}); }
}

const KEYS=[
  {t:0.00,top:0x0b1433,hor:0x2b3a6e,bot:0x121a3a,sun:0x9fb4ff},
  {t:0.20,top:0x1a2458,hor:0x6a4f86,bot:0x241e46,sun:0xffa27a},
  {t:0.255,top:0x4d6fb3,hor:0xffae8a,bot:0x8a6f9a,sun:0xff8a50},
  {t:0.32,top:0x5f9fe0,hor:0xffe0c8,bot:0xc9d3e6,sun:0xffd2a0},
  {t:0.50,top:0x3f8fdc,hor:0xbfe2f4,bot:0xb4cfe6,sun:0xfff4e0},
  {t:0.67,top:0x4d8ed6,hor:0xf9dcc0,bot:0xcdc6dc,sun:0xffd6a0},
  {t:0.745,top:0x3c3f86,hor:0xff8a5e,bot:0x7b4f7a,sun:0xff6a3a},
  {t:0.80,top:0x1c2458,hor:0x5a4580,bot:0x221c44,sun:0xff9a7a},
  {t:1.00,top:0x0b1433,hor:0x2b3a6e,bot:0x121a3a,sun:0x9fb4ff}
];
const cA=new THREE.Color(), cB=new THREE.Color(), tmpC=new THREE.Color();
function keyColor(t,field,out){ for(let i=0;i<KEYS.length-1;i++){ const a=KEYS[i], b=KEYS[i+1]; if(t>=a.t&&t<=b.t){ const f=(t-a.t)/(b.t-a.t), s=f*f*(3-2*f); cA.setHex(a[field]); cB.setHex(b[field]); return out.copy(cA).lerp(cB,s); } } return out.setHex(KEYS[0][field]); }
const sunDir=new THREE.Vector3(), moonDir=new THREE.Vector3();
let nightF=0;
const ss=(a,b,x)=>{ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };
function updateSky(t){
  const a=(t-0.25)*Math.PI*2;
  sunDir.set(Math.cos(a),Math.sin(a),0.42).normalize();
  moonDir.set(-sunDir.x,-sunDir.y,0.3).normalize();
  const el=sunDir.y;
  nightF=1-ss(-0.12,0.08,el);
  keyColor(t,'top',skyMat.uniforms.uTop.value); keyColor(t,'hor',skyMat.uniforms.uHor.value); keyColor(t,'bot',skyMat.uniforms.uBot.value); keyColor(t,'sun',skyMat.uniforms.uSunCol.value);
  skyMat.uniforms.uSun.value.copy(sunDir); skyMat.uniforms.uMoon.value.copy(moonDir); skyMat.uniforms.uNight.value=nightF;
  scene.fog.color.copy(skyMat.uniforms.uHor.value).lerp(skyMat.uniforms.uTop.value,0.18);
  starMat.opacity=nightF*0.95;
  // one directional light: sun by day, moon by night
  if(el>-0.03){
    const d=ss(-0.03,0.22,el);
    sun.position.copy(sunDir).multiplyScalar(130).add(sun.target.position);
    tmpC.setHex(0xff8a4a).lerp(cB.setHex(0xfff1dc),ss(0.02,0.45,el)); sun.color.copy(tmpC);
    sun.intensity=3.1*d;
  } else {
    const d=ss(-0.03,-0.2,el);
    sun.position.copy(moonDir).multiplyScalar(130).add(sun.target.position);
    sun.color.setHex(0xa9bcff); sun.intensity=0.75*d;
  }
  const day=1-nightF;
  hemi.color.setHex(0x6070b0).lerp(tmpC.copy(skyMat.uniforms.uTop.value).lerp(cA.setHex(0xffffff),0.55),day);
  hemi.groundColor.setHex(0x2c2840).lerp(cA.setHex(0x6b5a3a),day);
  hemi.intensity=0.75+0.35*day;
  renderer.toneMappingExposure=1.0+nightF*0.3;
  bloom.strength=0.32+nightF*0.55;
  for(const g of allGlow){ g.w.emissiveIntensity=0.28+nightF*2.3; g.i.emissiveIntensity=0.45+nightF*1.3; g.c.emissiveIntensity=1.0+nightF*1.2; }
  if(scene.userData.cloudMat){ const cm=scene.userData.cloudMat; cm.emissive.copy(skyMat.uniforms.uHor.value); cm.emissiveIntensity=0.22+nightF*0.1; cm.color.setHex(0xffffff).lerp(cA.setHex(0x8a90c0),nightF*0.6); }
  const fog=scene.fog.color;
  fujiMats.forEach(m=>{ m.color.copy(fog).lerp(cA.setHex(m.userData.snow?0xffffff:0x2f3f78),m.userData.snow?0.6:0.55); });
}

$('play').onclick=()=>{ playing=!playing; $('play').textContent=playing?'❚❚':'▶'; };
$('speed').onclick=()=>{ speed=SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length]; $('speed').textContent=(speed===0.25?'¼':speed)+'×'; };
$('rot').onclick=()=>{ autoRot=!autoRot; $('rot').classList.toggle('on',autoRot); if(!autoRot) controls.autoRotate=false; };
todEl.addEventListener('input',()=>{ tod=todEl.value/1000; todTween=null; });
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ let target=parseFloat(b.dataset.t); let from=tod; if(target<from-0.5) target+=1; if(target>from+0.5) from+=1; todTween={from,to:target,t:0}; });

window.__VOXEL__={voxelCount:0,fps:0,pagodaFloors:5,timeOfDay:tod,pagodaVoxels:0,model:'Opus 5.5 (High)'};

const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
let downPos=null, lastInteract=performance.now(), hoverObj=null, pendingHover=null;
function pick(cx,cy){ ptr.set(cx/innerWidth*2-1,-(cy/innerHeight)*2+1); ray.setFromCamera(ptr,camera); const hits=ray.intersectObjects(pickables,false); return hits.length?hits[0].object:null; }
const FLOOR_NAMES=['初重 · First floor','二重 · Second floor','三重 · Third floor','四重 · Fourth floor','五重 · Fifth floor'];
function lanternOn(L){ return L.override!==null?L.override:nightF>0.42; }
canvas.addEventListener('pointerdown',e=>{ downPos=[e.clientX,e.clientY,performance.now()]; lastInteract=performance.now(); controls.autoRotate=false; });
canvas.addEventListener('pointerup',e=>{
  if(!downPos||introT<INTRO) return; const dx=e.clientX-downPos[0], dy=e.clientY-downPos[1];
  if(dx*dx+dy*dy<36 && performance.now()-downPos[2]<600){
    const o=pick(e.clientX,e.clientY);
    if(o){ const u=o.userData;
      if(u.type==='lantern'){ const L=lanterns[u.idx]; L.override=!lanternOn(L); }
      else if(u.type==='floor'){ const F=floors[u.idx]; F.target=F.target?0:1; }
      showTip(o,e.clientX,e.clientY);
    }
  }
  downPos=null;
});
canvas.addEventListener('pointermove',e=>{ pendingHover=[e.clientX,e.clientY]; });
canvas.addEventListener('pointerleave',()=>{ pendingHover=null; hoverObj=null; tip.style.opacity=0; outline.visible=false; canvas.style.cursor=''; });
controls.addEventListener('start',()=>{ lastInteract=performance.now(); controls.autoRotate=false; });
canvas.addEventListener('wheel',()=>{ lastInteract=performance.now(); controls.autoRotate=false; },{passive:true});
function showTip(o,x,y){
  const u=o.userData;
  if(u.type==='lantern'){ const on=lanternOn(lanterns[u.idx]); tip.innerHTML=`石灯籠 · Stone lantern ${u.idx+1}<small>${on?'Lit':'Unlit'} — click to ${on?'extinguish':'light'}</small>`; }
  else { const F=floors[u.idx]; tip.innerHTML=`${FLOOR_NAMES[u.idx]}<small>Doors ${F.target?'open':'closed'} — click to ${F.target?'close':'open'}</small>`; }
  tip.style.left=x+'px'; tip.style.top=y+'px'; tip.style.opacity=1;
}
function updateHover(){
  if(!pendingHover||introT<INTRO) return; const [x,y]=pendingHover; pendingHover=null;
  const o=pick(x,y); hoverObj=o;
  if(o){ canvas.style.cursor='pointer'; showTip(o,x,y); const L=o.userData.type==='lantern'?lanterns[o.userData.idx]:floors[o.userData.idx]; outline.position.copy(o.position); outline.scale.set(...L.box); outline.visible=true; }
  else { canvas.style.cursor=''; tip.style.opacity=0; outline.visible=false; }
}

addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); composer.setPixelRatio(Math.min(devicePixelRatio,1.5)); composer.setSize(innerWidth,innerHeight); });

// =====================================================================
// Intro camera: from the torii toward the pagoda (~2.5 s)
// =====================================================================
const INTRO=2.6; let introT=-1;
const I0=new THREE.Vector3(2,3.2,40), I1=new THREE.Vector3(2,9,24), I2=new THREE.Vector3(-38,33,52);
const T0=new THREE.Vector3(2,8,-9), T2=new THREE.Vector3(0,11.5,-7);
const _v=new THREE.Vector3(), _t=new THREE.Vector3();
function introStep(dt){
  introT+=dt; const k=Math.min(1,introT/INTRO); const e=k<0.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
  const a=1-e; _v.set(0,0,0).addScaledVector(I0,a*a).addScaledVector(I1,2*a*e).addScaledVector(I2,e*e);
  camera.position.copy(_v); _t.copy(T0).lerp(T2,e); camera.lookAt(_t);
  if(k>=1){ controls.target.copy(T2); controls.enabled=true; controls.update(); lastInteract=performance.now()-3500; $('intro').style.opacity=0; }
}

// =====================================================================
// Main loop
// =====================================================================
let T=0, last=performance.now(), fpsAcc=0, fpsN=0, fps=60, hudT=0, envT=99;
const dummy=new THREE.Object3D();
const pmrem=new THREE.PMREMGenerator(renderer); let envRT=null;
const envScene=new THREE.Scene(); const envSky=new THREE.Mesh(new THREE.SphereGeometry(50,24,12),skyMat); envScene.add(envSky);
function refreshEnv(){ const r=pmrem.fromScene(envScene,0,0.1,200); if(envRT) envRT.dispose(); envRT=r; for(const [m,k] of envTargets){ m.envMap=r.texture; m.envMapIntensity=k; m.needsUpdate=false; } }

function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,0.05); last=now; T+=dt; U.time.value=T;
  fpsAcc+=dt; fpsN++; if(fpsAcc>=0.5){ fps=Math.round(fpsN/fpsAcc); fpsAcc=0; fpsN=0; }

  if(todTween){ todTween.t+=dt/1.3; const k=Math.min(1,todTween.t), e=k*k*(3-2*k); tod=((todTween.from+(todTween.to-todTween.from)*e)%1+1)%1; if(k>=1) todTween=null; }
  else if(playing) tod=(tod+dt*speed/90)%1;
  updateSky(tod);
  envT+=dt; if(envT>2.0){ envT=0; refreshEnv(); }

  if(introT<INTRO){ if(introT<0) introT=0; introStep(dt); }
  else { if(autoRot && performance.now()-lastInteract>6000) controls.autoRotate=true; controls.update(dt); }
  sky.position.copy(camera.position); stars.position.copy(camera.position);

  // lanterns (auto at dusk, click override, flicker)
  const autoOn=nightF>0.42;
  lanterns.forEach(L=>{
    if(L.override!==null && L.override===autoOn && L.lastAuto!==undefined && L.lastAuto!==autoOn) L.override=null;
    if(L.lastAuto!==undefined && L.lastAuto!==autoOn) L.override=null;
    L.lastAuto=autoOn;
    const on=lanternOn(L); L.level+=((on?1:0)-L.level)*Math.min(1,dt*3.5);
    const fl=0.82+0.1*Math.sin(T*13+L.ph)+0.06*Math.sin(T*27.3+L.ph*2)+0.05*Math.sin(T*5.1+L.ph);
    L.light.intensity=L.level*fl*(26+nightF*22);
    L.flameMat.emissiveIntensity=L.level*fl*4.2;
    L.halo.material.opacity=L.level*fl*(0.35+nightF*0.5);
    L.halo.scale.setScalar(2.6+fl*0.8);
  });
  // pagoda doors
  floors.forEach(F=>{ F.open+=(F.target-F.open)*Math.min(1,dt*3.2); const e=F.open*F.open*(3-2*F.open); const ang=e*Math.PI*0.5; F.pivots.forEach(p=>{ p.rotation.y=-p.userData.dir*ang; }); });
  // koi
  koi.forEach((k,i)=>{
    const th=k.ph+T*k.sp; const px=POND.cx+Math.cos(th)*k.rx+Math.sin(2*th+k.ph)*0.6, pz=POND.cz+Math.sin(th)*k.rz+Math.cos(3*th)*0.35;
    const th2=th+0.02*Math.sign(k.sp); const nx=POND.cx+Math.cos(th2)*k.rx+Math.sin(2*th2+k.ph)*0.6, nz=POND.cz+Math.sin(th2)*k.rz+Math.cos(3*th2)*0.35;
    k.g.position.set(px,k.y+Math.sin(T*1.3+i)*0.05,pz); k.g.rotation.y=Math.atan2(nx-px,nz-pz);
    k.tp.rotation.y=Math.sin(T*7+i)*0.35; k.tp2.rotation.y=Math.sin(T*7+i-0.9)*0.45;
  });
  rippleTimer+=dt; if(rippleTimer>0.55){ rippleTimer=0; if(Math.random()<0.6){ const k=koi[Math.floor(Math.random()*koi.length)]; spawnRipple(k.g.position.x,k.g.position.z); } else { const a=Math.random()*6.28, r=Math.sqrt(Math.random()); spawnRipple(POND.cx+Math.cos(a)*r*8,POND.cz+Math.sin(a)*r*4.5); } }
  ripples.forEach(r=>{ r.t+=dt; const k=Math.min(1,r.t/2.2); r.m.scale.setScalar(0.25+k*2.1); r.m.material.opacity=(1-k)*0.5*(r.t<2.2?1:0); });
  // petals
  const wx=0.75+0.45*Math.sin(T*0.11), wz=0.25+0.3*Math.sin(T*0.07+1);
  for(let i=0;i<petalData.length;i++){
    const p=petalData[i];
    if(p.rest>0){ p.rest-=dt; if(p.rest<=0) spawnPetal(p,false); }
    else {
      p.x+=(wx+Math.sin(T*1.7+p.ph)*0.55)*dt; p.z+=(wz+Math.cos(T*1.3+p.ph)*0.45)*dt; p.y+=(p.vy+Math.sin(T*2.4+p.ph)*0.25)*dt;
      p.rx+=p.sx*dt; p.ry+=p.sy*dt;
      const gy=surfaceAt(p.x,p.z);
      if(p.y<=gy+0.04 && gy>-50){ p.y=gy+0.04; p.rest=2.5+Math.random()*4; p.rx=-Math.PI/2; p.ry=0; }
      if(p.y<-45) spawnPetal(p,false);
    }
    dummy.position.set(p.x,p.y,p.z); dummy.rotation.set(p.rx,p.ry,p.rz); dummy.scale.setScalar(p.rest>0?Math.min(1,p.rest*0.6):1); dummy.updateMatrix(); petals.setMatrixAt(i,dummy.matrix);
  }
  petals.instanceMatrix.needsUpdate=true;
  // waterfall
  waterfall.forEach(w=>w.material.uniforms.uTime.value=T);
  for(let i=0;i<fallData.length;i++){
    const f=fallData[i];
    if(f.sprite){ f.sprite.position.y=f.base+Math.sin(T*0.8+f.sprite.userData.ph)*0.6; f.sprite.material.opacity=0.32+0.1*Math.sin(T*0.6+f.sprite.userData.ph); continue; }
    const tau=((T*f.sp+f.ph)%1)*3.0, drop=4.9*tau*tau;
    dummy.position.set(f.lip-1.15*Math.sqrt(drop)-f.jx*tau,-0.4-drop,10+f.z*(1+drop*0.015)); const sc=Math.max(0.1,1-drop/48)*(0.8+f.jx); dummy.scale.setScalar(sc); dummy.rotation.set(0,0,0); dummy.updateMatrix(); fallParts.setMatrixAt(i,dummy.matrix);
  }
  fallParts.instanceMatrix.needsUpdate=true;
  // floating islands bob, clouds drift
  islandGroups.forEach(g=>{ g.position.y=g.userData.base+Math.sin(T*0.45+g.userData.ph)*0.7; g.rotation.y=Math.sin(T*0.1+g.userData.ph)*0.05; });
  if(scene.userData.cloudRoot) scene.userData.cloudRoot.rotation.y=T*0.004;
  cloudGroups.forEach((g,i)=>{ g.position.x+=Math.sin(T*0.05+i)*0.01*g.userData.spd; });
  // cranes
  const lt=T*0.07; const lx=Math.cos(lt)*62, lz=Math.sin(lt)*48, ly=36+Math.sin(T*0.3)*3;
  const hdg=Math.atan2(-Math.sin(lt)*62,Math.cos(lt)*48);
  birds.forEach(b=>{
    const o=b.off, c=Math.cos(hdg), s=Math.sin(hdg);
    b.g.position.set(lx+o[0]*c+o[2]*s, ly+o[1]+Math.sin(T*1.1+b.ph)*0.3, lz-o[0]*s+o[2]*c);
    b.g.rotation.set(Math.sin(T*1.1+b.ph)*0.05,hdg,Math.sin(T*0.5)*0.1);
    const fl=Math.sin(T*3.4+b.ph); b.wings.forEach(w=>{ w.p.rotation.z=w.s*fl*0.55; w.p2.rotation.z=w.s*Math.sin(T*3.4+b.ph-0.7)*0.35; });
  });
  swallows.forEach(s=>{ const a=T*s.sp+s.ph; s.g.position.set(PX+Math.cos(a)*s.r,s.h+Math.sin(a*2.3)*2,PZ+Math.sin(a)*s.r); s.g.rotation.set(0,Math.atan2(-Math.sin(a),Math.cos(a))+Math.PI,-0.45); const f=Math.sin(T*16+s.ph); s.wings.forEach(w=>w.p.rotation.z=w.s*f*0.7); });

  updateHover();
  composer.render();

  hudT+=dt;
  if(hudT>0.25){ hudT=0;
    statsEl.textContent=`${(VOXELS/1000).toFixed(1)}k voxels | ${fps} FPS`;
    const hrs=tod*24, hh=Math.floor(hrs), mm=Math.floor((hrs-hh)*60);
    clockTx.textContent=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
    clockIc.textContent=nightF>0.5?'☾':(tod<0.3||tod>0.7)?'◐':'☀';
    if(document.activeElement!==todEl) todEl.value=Math.round(tod*1000);
  }
  const V=window.__VOXEL__; V.voxelCount=VOXELS; V.fps=fps; V.timeOfDay=+tod.toFixed(4); V.pagodaVoxels=pagodaVoxels; V.pagodaFloors=5;
}

// boot: paint loader first, then generate
requestAnimationFrame(()=>setTimeout(()=>{
  buildWorld();
  updateSky(tod); refreshEnv();
  window.__VOXEL__.voxelCount=VOXELS; window.__VOXEL__.pagodaVoxels=pagodaVoxels;
  $('loader').style.opacity=0; setTimeout(()=>$('loader').remove(),800);
  setTimeout(()=>{ if(introT>=INTRO) $('intro').style.display='none'; },4200);
  last=performance.now(); requestAnimationFrame(frame);
},30));
addEventListener('pagehide',()=>{ renderer.dispose(); });
</script>
</body>
</html>
