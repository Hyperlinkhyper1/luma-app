    <script type="module">
      (async function () {
        /* =====================================================================
           PAGODA TEST  —  contestant: hy4
           "Spring Festival at the Five-Story Pagoda"
           Three.js r160 (import map) / BoxGeometry + InstancedMesh voxel engine
        ===================================================================== */
        const _T = ["thre", "e"].join("");
        const _O = ["three/addons/controls/OrbitControls", ".js"].join("");
        const THREE = await import(/* @vite-ignore */ _T);
        const { OrbitControls } = await import(/* @vite-ignore */ _O);


        /* ------------------------------ utils ------------------------------ */
        const V = 0.55;                 // voxel edge, metres
        const N = 64;                   // 64 x 64 terrain grid
        const HALF = N / 2;
        const WATER_L = 2.55;           // water surface (voxel levels)
        const POND_I = 20, POND_J = 37, POND_R = 9.5;
        const P_L = 4;                  // flattened plateau level under pagoda
        const CYCLE = 90;               // seconds / full day-night cycle


        const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
        const lerp = (a, b, t) => a + (b - a) * t;
        const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0 || 1e-6), 0, 1); return t * t * (3 - 2 * t); };
        const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);


        function mulberry32(a) {
          return function () {
            a |= 0; a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        const rng = mulberry32(0x5eed01);


        function hv(i, j, s) {
          let n = Math.imul(i | 0, 374761393) ^ Math.imul(j | 0, 668265263) ^ Math.imul(s | 0, 1442695041);
          n = Math.imul(n ^ (n >>> 13), 1274126177);
          return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
        }
        function vnoise(x, y, s) {
          const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
          const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
          const a = hv(xi, yi, s), b = hv(xi + 1, yi, s), c = hv(xi, yi + 1, s), d = hv(xi + 1, yi + 1, s);
          return lerp(lerp(a, b, u), lerp(c, d, u), v);
        }
        function fbm(x, y, s, oct) {
          oct = oct || 4;
          let sum = 0, amp = 0.5, f = 1, norm = 0;
          for (let i = 0; i < oct; i++) { sum += amp * vnoise(x * f, y * f, s + i * 37); norm += amp; f *= 2; amp *= 0.5; }
          return sum / norm;
        }
        const w2gi = (x) => Math.round(x / V + HALF - 0.5);


        /* ------------------------------ palette ---------------------------- */
        const C = {
          verm: 0xc73e1d, vermD: 0x8f2c14, vermL: 0xe0603a,
          gold: 0xe8b86d, goldD: 0xb98b3e,
          teak: 0x4a2c1a, teakL: 0x6b4326,
          jadeD: 0x2d6a4f, jade: 0x40916c, jadeL: 0x62b58d,
          sakura: 0xffb7c5, sakuraD: 0xff8fab, sakuraL: 0xffe5ec,
          stone: 0x9aa0a6, stoneD: 0x6e747a, stoneL: 0xb9bec3,
          pond: 0x7ed6df, moss: 0x606c38, mossL: 0x798a48,
          bamboo: 0xa3b86a, bambooD: 0x7d9149,
          plaster: 0xefe6d3, maple: 0xe2603a, mapleD: 0xb93f22, mapleL: 0xf2915c,
          pine: 0x2e5c3e, pineD: 0x1f422c, pineL: 0x3f7a52,
          willow: 0x74a84e, willowD: 0x54833a,
          soil: 0x5a3e26, soilD: 0x412a19, cloud: 0xf3ece3,
        };


        /* ---------------------- shared material cache ---------------------- */
        const MATS = new Map();
        function getMat(d) {
          if (MATS.has(d)) return MATS.get(d);
          const m = new THREE.MeshStandardMaterial({
            color: d.c,
            roughness: d.r === undefined ? 0.86 : d.r,
            metalness: d.m === undefined ? 0 : d.m,
            emissive: d.e === undefined ? 0x000000 : d.e,
            emissiveIntensity: d.ei === undefined ? 1 : d.ei,
            transparent: d.t !== undefined,
            opacity: d.t === undefined ? 1 : d.t,
          });
          MATS.set(d, m);
          return m;
        }


        const M = {
          moss: { c: C.moss, r: 0.95 },
          mossL: { c: C.mossL, r: 0.95 },
          soil: { c: C.soil, r: 0.98 },
          soilD: { c: C.soilD, r: 0.98 },
          rock: { c: C.stoneD, r: 0.95 },
          rockL: { c: C.stone, r: 0.95 },
          stone: { c: C.stone, r: 0.9 },
          stoneD: { c: C.stoneD, r: 0.9 },
          stoneL: { c: C.stoneL, r: 0.88 },
          sand: { c: 0xc7bda1, r: 0.95 },
          verm: { c: C.verm, r: 0.62 },
          vermD: { c: C.vermD, r: 0.66 },
          vermL: { c: C.vermL, r: 0.62 },
          gold: { c: C.gold, r: 0.26, m: 0.85 },
          goldD: { c: C.goldD, r: 0.34, m: 0.75 },
          teak: { c: C.teak, r: 0.8 },
          teakL: { c: C.teakL, r: 0.8 },
          jadeD: { c: C.jadeD, r: 0.44, m: 0.14 },
          jade: { c: C.jade, r: 0.46, m: 0.14 },
          jadeL: { c: C.jadeL, r: 0.46, m: 0.14 },
          plaster: { c: C.plaster, r: 0.9 },
          bamboo: { c: C.bamboo, r: 0.72 },
          bambooD: { c: C.bambooD, r: 0.74 },
          sakura: { c: C.sakura, r: 0.9 },
          sakuraD: { c: C.sakuraD, r: 0.9 },
          sakuraL: { c: C.sakuraL, r: 0.9 },
          maple: { c: C.maple, r: 0.9 },
          mapleD: { c: C.mapleD, r: 0.9 },
          mapleL: { c: C.mapleL, r: 0.9 },
          pine: { c: C.pine, r: 0.92 },
          pineD: { c: C.pineD, r: 0.92 },
          pineL: { c: C.pineL, r: 0.92 },
          willow: { c: C.willow, r: 0.92 },
          willowD: { c: C.willowD, r: 0.92 },
          water: { c: C.pond, r: 0.12, m: 0.3, e: 0x0d3f49, ei: 0.4, t: 0.76 },
          mist: { c: 0xdff2f6, r: 1, t: 0.3 },
          lanternPaper: { c: 0xffe6b8, r: 0.6, e: 0xffab44, ei: 1 },
          altar: { c: 0xf0d79a, r: 0.4, e: 0xffb347, ei: 0.6 },
          cloud: { c: C.cloud, r: 1, e: 0x93a0b4, ei: 0.1 },
          bird: { c: 0x3a3f4a, r: 0.8 },
          birdL: { c: 0xd9dde4, r: 0.8 },
          koiO: { c: 0xf4732e, r: 0.5 },
          koiW: { c: 0xf7f3ec, r: 0.5 },
          koiK: { c: 0x2b2b33, r: 0.5 },
          koiG: { c: C.gold, r: 0.4, m: 0.5 },
          petal: { c: C.sakuraL, r: 0.85, e: 0x2a0d16, ei: 0.25 },
        };


        /* ------------------------- voxel batch engine ---------------------- */
        const BOX = new THREE.BoxGeometry(1, 1, 1);
        let TOTAL_VOXELS = 0;


        class Batch {
          constructor() { this.g = new Map(); this.seen = new Set(); }
          add(x, y, z, d) {
            const key = x + "," + y + "," + z;
            if (this.seen.has(key)) return;          // never stack two voxels in one cell
            this.seen.add(key);
            let b = this.g.get(d);
            if (!b) { b = { d: d, list: [] }; this.g.set(d, b); }
            b.list.push(x, y, z);
          }
        }


        const AO_NB = [];
        for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) if (dx || dz) AO_NB.push([dx, dz]);
        const SIDE_NB = [[1, 0], [-1, 0], [0, 1], [0, -1]];
        function aoAt(occ, x, y, z) {
          let o = 0;
          for (let i = 0; i < AO_NB.length; i++) { const n = AO_NB[i]; if (occ.has((x + n[0]) + "," + (y + 1) + "," + (z + n[1]))) o += 0.85; }
          for (let i = 0; i < SIDE_NB.length; i++) { const n = SIDE_NB[i]; if (occ.has((x + n[0]) + "," + y + "," + (z + n[1]))) o += 0.3; }
          if (occ.has(x + "," + (y + 1) + "," + z)) o += 1.25;
          return clamp(1 - o * 0.072, 0.44, 1);
        }


        const _mtx = new THREE.Matrix4();
        const _col = new THREE.Color();
        const _base = new THREE.Color();


        function buildBatch(batch, parent, useAO, tag) {
          const meshes = [];
          const occ = new Set();
          if (useAO) {
            for (const b of batch.g.values()) {
              const l = b.list;
              for (let i = 0; i < l.length; i += 3) occ.add(l[i] + "," + l[i + 1] + "," + l[i + 2]);
            }
          }
          for (const b of batch.g.values()) {
            const l = b.list, n = l.length / 3;
            const im = new THREE.InstancedMesh(BOX, getMat(b.d), n);
            im.castShadow = true;
            im.receiveShadow = true;
            _base.setHex(b.d.c);
            for (let i = 0; i < n; i++) {
              const x = l[3 * i], y = l[3 * i + 1], z = l[3 * i + 2];
              _mtx.makeScale(V, V, V);
              _mtx.setPosition((x + 0.5) * V, (y + 0.5) * V, (z + 0.5) * V);
              im.setMatrixAt(i, _mtx);
              const a = useAO ? aoAt(occ, x, y, z) : 1;
              _col.copy(_base).multiplyScalar(a * (0.9 + rng() * 0.17));
              im.setColorAt(i, _col);
            }
            im.instanceMatrix.needsUpdate = true;
            if (im.instanceColor) im.instanceColor.needsUpdate = true;
            im.computeBoundingSphere();
            if (tag) im.userData.tag = tag;
            parent.add(im);
            meshes.push(im);
            TOTAL_VOXELS += n;
          }
          return meshes;
        }


        // shell / disc helpers in voxel-centre space (box half-size R)
        function addDisc(b, y, R, d, y0) {
          const lo = -Math.ceil(R) - 1, hi = Math.ceil(R) + 1;
          for (let x = lo; x <= hi; x++) for (let z = lo; z <= hi; z++) {
            const dd = Math.max(Math.abs(x + 0.5), Math.abs(z + 0.5));
            if (dd <= R) b.add(x, (y0 || 0) + y, z, d);
          }
        }
        function addRing(b, y, R, t, d, y0) {
          const lo = -Math.ceil(R) - 1, hi = Math.ceil(R) + 1;
          for (let x = lo; x <= hi; x++) for (let z = lo; z <= hi; z++) {
            const dd = Math.max(Math.abs(x + 0.5), Math.abs(z + 0.5));
            if (dd <= R && dd > R - t) b.add(x, (y0 || 0) + y, z, d);
          }
        }
        function addEllipsoid(b, cx, cy, cz, rx, ry, rz, d, d2, thresh) {
          const rxi = Math.ceil(rx), ryi = Math.ceil(ry), rzi = Math.ceil(rz);
          for (let x = -rxi; x <= rxi; x++) for (let y = -ryi; y <= ryi; y++) for (let z = -rzi; z <= rzi; z++) {
            const nx = x / rx, ny = y / ry, nz = z / rz;
            const r = Math.sqrt(nx * nx + ny * ny + nz * nz);
            if (r > 1) continue;
            const n = vnoise((x + cx) * 0.37, (y + cy) * 0.37 + (z + cz) * 0.21, 91);
            if (r > thresh + 0.32 * n - 0.14) continue;
            b.add(cx + x, cy + y, cz + z, d2 && (n > 0.62 || y > ry * 0.42) ? d2 : d);
          }
        }


        /* ----------------------------- renderer ---------------------------- */
        const host = document.getElementById("scene");
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.08;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        host.appendChild(renderer.domElement);


        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0xbcd6e6, 80, 280);


        const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 900);
        camera.position.set(0.6, 4.0, 17.6);


        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.065;
        controls.target.set(0, 17.5, -2.5);
        controls.minDistance = 9;
        controls.maxDistance = 95;
        controls.maxPolarAngle = Math.PI * 0.545;
        controls.autoRotate = false;
        controls.autoRotateSpeed = 0.34;
        controls.enablePan = false;


        /* -------------------------------- sky ------------------------------ */
        const skyU = {
          uTop: { value: new THREE.Color(0x3e86c8) },
          uBot: { value: new THREE.Color(0xcde7f2) },
          uSunDir: { value: new THREE.Vector3(0, 1, 0) },
          uSunCol: { value: new THREE.Color(0xfff0cf) },
          uSunI: { value: 1 },
          uNight: { value: 0 },
          uTime: { value: 0 },
        };
        const sky = new THREE.Mesh(
          new THREE.SphereGeometry(520, 40, 24),
          new THREE.ShaderMaterial({
            uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
            vertexShader: [
              "varying vec3 vDir;",
              "void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
            ].join("\n"),
            fragmentShader: [
              "uniform vec3 uTop; uniform vec3 uBot; uniform vec3 uSunDir; uniform vec3 uSunCol;",
              "uniform float uSunI; uniform float uNight; uniform float uTime;",
              "varying vec3 vDir;",
              "float h31(vec3 p){ p = fract(p*0.3183099 + vec3(0.71,0.113,0.419)); p *= 17.0;",
              "  return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }",
              "void main(){",
              "  vec3 d = normalize(vDir);",
              "  float hh = clamp(d.y*0.5+0.5, 0.0, 1.0);",
              "  vec3 col = mix(uBot, uTop, pow(hh, 0.72));",
              "  float sd = max(dot(d, normalize(uSunDir)), 0.0);",
              "  col += uSunCol * pow(sd, 460.0) * 4.0 * uSunI;",
              "  col += uSunCol * pow(sd, 9.0) * 0.20 * uSunI;",
              "  float md = smoothstep(0.99965, 0.99990, max(dot(d, -normalize(uSunDir)), 0.0));",
              "  col += vec3(0.92,0.95,1.0) * md * uNight * 1.6;",
              "  if(uNight > 0.01){",
              "    float s = h31(floor(d*230.0));",
              "    float star = smoothstep(0.9972, 0.9996, s) * uNight * (0.55 + 0.45*sin(uTime*2.4 + s*90.0));",
              "    col += vec3(0.86,0.90,1.0) * star * max(d.y, 0.0) * 1.5;",
              "  }",
              "  gl_FragColor = vec4(col, 1.0);",
              "}",
            ].join("\n"),
          })
        );
        sky.frustumCulled = false;
        scene.add(sky);


        /* ------------------------------ lighting --------------------------- */
        const hemi = new THREE.HemisphereLight(0xbcd8ee, 0x5a6a3a, 0.5);
        scene.add(hemi);
        const amb = new THREE.AmbientLight(0x9fb6d8, 0.1);
        scene.add(amb);

        /* ------------------------- terrain heightfield --------------------- */
        const HGT = new Int16Array(N * N);

        // rocky underside — the garden itself is a genuine flying island

        const terrainGroup = new THREE.Group();

        /* ------------------------------- water ----------------------------- */
        const waterBatch = new Batch();
        const waterBase = [];
        for (const c of basinCells) {
          for (let y = c[1] + 1; y <= Math.ceil(WATER_L) - 1; y++) {

        const waterMesh = waterMeshes[0];
        const WATER_Y = WATER_L * V;
        const POND_CX = POND_I - HALF, POND_CZ = POND_J - HALF;


        /* ------------------------------- PAGODA ---------------------------- */
        const PAGODA_FLOORS = 5;

        // stone platform + steps
        {

        for (let f = 0; f < PAGODA_FLOORS; f++) {

        /* -------------------- flying island + floating islets -------------- */
        function buildFlyingIsland(cx, cy, cz, R, seed, opts) {
          const b = new Batch(), g = new THREE.Group();
          const rr = mulberry32(seed);
          const topN = Math.ceil(R);
          let topLevel = 0;
          for (let x = -topN; x <= topN; x++) for (let z = -topN; z <= topN; z++) {
            const d = Math.hypot(x + 0.5, z + 0.5);
            const a = Math.atan2(z + 0.5, x + 0.5);
            const wob = R * (0.84 + 0.32 * vnoise(Math.cos(a) * 2.4 + seed, Math.sin(a) * 2.4 + seed, 77));
            if (d > wob) continue;
            const hh = Math.round(1.4 * (1 - d / wob) + 0.7 * vnoise((x + seed) * 0.22, (z - seed) * 0.22, 33));
            topLevel = Math.max(topLevel, hh);
            for (let y = 0; y <= hh; y++) {
              b.add(x, y, z, y === hh ? (vnoise(x * 0.3, z * 0.3, 5) > 0.6 ? M.mossL : M.moss) : M.soil);
            }
          }
          const layers = Math.max(3, Math.round(R * 1.15));
          for (let k = 0; k < layers; k++) {
            const base = R * (1 - k / layers) * 0.98;
            if (base < 0.9) break;
            const lo = -Math.ceil(base) - 1, hi = Math.ceil(base) + 1;
            for (let x = lo; x <= hi; x++) for (let z = lo; z <= hi; z++) {
              const d = Math.hypot(x + 0.5, z + 0.5);
              const a = Math.atan2(z + 0.5, x + 0.5);
              const wob = base * (0.86 + 0.3 * vnoise(Math.cos(a) * 2.1 + 9, Math.sin(a) * 2.1 + 9, 41 + k));
              if (d <= wob && d > wob - Math.max(1.6, base * 0.5)) b.add(x, -1 - k, z, k % 2 ? M.rock : M.rockL);
            }
          }
          for (let t = 0; t < Math.round(R * 2.2); t++) {
            const a = rr() * Math.PI * 2, rad = rr() * R * 0.85;
            const x = Math.round(Math.cos(a) * rad), z = Math.round(Math.sin(a) * rad);
            const len = 1 + Math.floor(rr() * 4);
            for (let y = 0; y < len; y++) b.add(x, -1 - y, z, M.willowD);
          }
          if (opts && opts.torii) {
            for (const sx of [-1, 1]) for (let y = topLevel + 1; y <= topLevel + 6; y++) b.add(sx * 2, y, 0, y % 3 ? M.verm : M.vermD);
            for (let x = -3; x <= 3; x++) { b.add(x, topLevel + 5, 0, M.verm); b.add(x, topLevel + 6, 0, M.vermD); }
            for (let x = -4; x <= 4; x++) b.add(x, topLevel + 7, 0, M.vermD);
          }
          if (opts && opts.tree) {
            for (let y = topLevel + 1; y <= topLevel + 4; y++) b.add(3, y, -2, M.teak);
            let r2 = 3.4;
            for (let tier = 0; tier < 3; tier++) {
              for (let k2 = 0; k2 < 3; k2++) {
                addRing(b, topLevel + 5 - k2 + tier * 3, r2 * (1 - k2 * 0.22), 1.05,
                  k2 === 0 ? M.pineL : (k2 === 1 ? M.pine : M.pineD), 0);
              }
              r2 *= 0.72;
            }
          }
          g.position.set(cx, cy, cz);
          world.add(g);
          buildBatch(b, g, true, "island");
          return g;
        }
        const FLY = { x: -13.2, y: 15.5, z: -13.6, r: 8.2 };

        /* ------------------------------ waterfalls ------------------------ */

            const tg = new THREE.Group();

            for (const m of bm) m.castShadow = false;

        let downX = 0, downY = 0, downT = 0;

        renderer.domElement.addEventListener("pointerup", (e) => {

        const tDay = new THREE.Color(0x3d86c8), tTw = new THREE.Color(0x2b3a7c), tNi = new THREE.Color(0x060b1e);
        const bDay = new THREE.Color(0xd3e8f4), bTw = new THREE.Color(0xf0a15f), bNi = new THREE.Color(0x14203a);

        function updateSun() {
          const A = timeOfDay * Math.PI * 2;
          const elev = Math.sin(A);
          const dayF = smoothstep(-0.04, 0.32, elev);
          const nightF = smoothstep(-0.02, -0.2, elev);
          const tw = Math.max(0, 1 - dayF - nightF);
          phase = { dayF: dayF, nightF: nightF, tw: tw };


          const la = A + Math.PI * nightF;
          sunDir.set(Math.cos(la) * 0.85, Math.sin(la), Math.sin(la * 0.5) * 0.5 + 0.28).normalize();
          sun.position.copy(sunDir).multiplyScalar(95);
          sun.target.position.set(0, 7, 0);
          sun.target.updateMatrixWorld();


          cSun.setHex(0xfff4de); cTw.setHex(0xff8f45); cNi.setHex(0x9fc0f5);
          sun.color.copy(cSun).lerp(cTw, tw * 0.92).lerp(cNi, nightF * 0.9);
          sun.intensity = 2.65 * dayF + 1.15 * tw + 0.72 * nightF;


          skyU.uSunI.value = 0.12 + 0.95 * dayF + 0.5 * tw;
          skyU.uSunDir.value.copy(sunDir);
          skyU.uSunCol.value.copy(sun.color);
          skyU.uNight.value = nightF;
          skyU.uTop.value.copy(tDay).lerp(tTw, tw).lerp(tNi, nightF);
          skyU.uBot.value.copy(bDay).lerp(bTw, tw).lerp(bNi, nightF);


          fogCol.copy(skyU.uBot.value).lerp(skyU.uTop.value, 0.32);
          scene.fog.color.copy(fogCol);
          renderer.setClearColor(fogCol);


          hemi.intensity = 0.72 * dayF + 0.42 * tw + 0.24 * nightF;
          hemi.color.copy(skyU.uTop.value).lerp(WHITE, 0.25);
          amb.intensity = 0.12 + 0.18 * nightF;
        }


        function animate() {
          requestAnimationFrame(animate);
          const dt = Math.min(clock.getDelta(), 0.05);
          elapsed += dt;


          if (playing) timeOfDay = (timeOfDay + dt / CYCLE) % 1;
          updateSun();
          const dusk = clamp(1 - phase.dayF * 1.3 + 0.08, 0, 1);


          /* lanterns: automatic at dusk + flicker */
          for (let i = 0; i < lanterns.length; i++) {
            const L = lanterns[i];
            const fl = 0.78 + 0.22 * Math.sin(elapsed * 7.3 + L.seed * 3.1) * Math.sin(elapsed * 2.1 + L.seed);
            L.light.intensity = L.on ? dusk * fl * 9.5 : 0;
          }
          M.lanternPaper.ei = 0.18 + dusk * 1.9;
          getMat(M.lanternPaper).emissiveIntensity = M.lanternPaper.ei;
          M.altar.ei = 0.2 + dusk * 2.2;
          getMat(M.altar).emissiveIntensity = M.altar.ei;
          innerLight.intensity = dusk * 6;


          /* doors */
          for (let i = 0; i < DOORS.length; i++) {
            const d = DOORS[i];
            d.t += ((d.open ? 1 : 0) - d.t) * Math.min(1, dt * 4.2);
            const a = d.t * 2.05;
            d.panels[0].rotation.y = a;
            d.panels[1].rotation.y = -a;
          }


          /* wind in the trees */
          for (let i = 0; i < treeGroups.length; i++) {
            const t = treeGroups[i];
            t.g.rotation.z = Math.sin(elapsed * 0.85 + t.phase) * t.amp;
            t.g.rotation.x = Math.sin(elapsed * 0.61 + t.phase * 1.7) * t.amp * 0.8;
          }


          /* falling sakura petals */
          for (let i = 0; i < PETALS; i++) {
            const p = petals[i];
            p.y -= p.vy * dt;
            p.ph += dt * p.sw;
            p.rot += p.vr * dt;
            p.x += Math.sin(p.ph) * dt * 0.85 + dt * 0.28;
            p.z += Math.cos(p.ph * 0.7) * dt * 0.55;
            if (p.y < -1.2) { p.y = 22 + rng() * 8; p.x = (rng() - 0.5) * 42; p.z = (rng() - 0.5) * 42; }
            eul.set(p.rot * 1.3, p.rot, p.ph * 0.6);
            quat.setFromEuler(eul);
            const sc = V * p.s;
            scl.set(sc, sc * 0.22, sc * 0.66);
            tmpV.set(p.x, p.y, p.z);
            _mtx.compose(tmpV, quat, scl);
            petalMesh.setMatrixAt(i, _mtx);
          }
          petalMesh.instanceMatrix.needsUpdate = true;


          /* koi */
          for (let i = 0; i < kois.length; i++) {
            const k = kois[i];
            const a = elapsed * k.spd + k.ph;
            const x = -6.33 + Math.cos(a) * k.rad;
            const z = 3.03 + Math.sin(a) * k.rad * 0.78;
            const tx = -Math.sin(a) * k.rad, tz = Math.cos(a) * k.rad * 0.78;
            k.g.position.set(x, WATER_Y - 0.18 + Math.sin(elapsed * 1.6 + k.yb) * 0.07, z);
            k.g.rotation.y = Math.atan2(-tz, tx);
            k.g.rotation.z = Math.sin(elapsed * 2.2 + k.yb) * 0.09;
            k.tail.rotation.y = Math.sin(elapsed * k.wob + k.ph) * 0.55;
          }


          /* pond ripples */
          if (waterMesh) {
            for (let i = 0; i < waterBase.length; i++) {
              const c = waterBase[i];
              const d = Math.hypot(c[0] - POND_CX, c[2] - POND_CZ);
              const off = Math.sin(d * 0.9 - elapsed * 2.4) * 0.5
                + Math.sin(c[0] * 0.55 + elapsed * 1.3) * 0.22
                + Math.sin(c[2] * 0.7 - elapsed * 1.7) * 0.22;
              _mtx.makeScale(V, V * 0.66, V);
              _mtx.setPosition((c[0] + 0.5) * V, (c[1] + 0.42) * V + off * 0.085, (c[2] + 0.5) * V);
              waterMesh.setMatrixAt(i, _mtx);
            }
            waterMesh.instanceMatrix.needsUpdate = true;
          }


          /* waterfalls + mist */
          for (let f = 0; f < falls.length; f++) {
            const F = falls[f];
            for (let i = 0; i < F.count; i++) {
              const d = F.data[i];
              d.t += dt * d.sp * 0.34;
              if (d.t > 1) d.t -= 1;
              const t = d.t, spread = 1 + t * 1.5;
              tmpV.set(
                F.p0.x + (F.p1.x - F.p0.x) * t + d.a * spread * 0.22,
                F.p0.y + (F.p1.y - F.p0.y) * t * t,
                F.p0.z + (F.p1.z - F.p0.z) * t + d.b * spread * 0.22
              );
              quat.setFromAxisAngle(UP, t * 3 + i);
              const sc = V * d.s * (1 - t * 0.45);
              scl.set(sc, sc * (0.8 + t * 1.9), sc);
              _mtx.compose(tmpV, quat, scl);
              F.im.setMatrixAt(i, _mtx);
            }
            F.im.instanceMatrix.needsUpdate = true;
          }
          for (let i = 0; i < mistCount; i++) {
            const m = mistData[i];
            m.t += dt * m.sp * 0.35;
            if (m.t > 1) m.t -= 1;
            const t = m.t;
            tmpV.set(
              falls[0].p0.x + m.ox * (0.4 + t * 2.4) - t * 1.2,
              falls[0].p0.y + t * 5.5,
              falls[0].p0.z + m.oz * (0.4 + t * 2.4) + t * 0.6
            );
            quat.identity();
            const sc = V * m.s * (0.4 + t * 2.6);
            scl.set(sc, sc, sc);
            _mtx.compose(tmpV, quat, scl);
            mist.setMatrixAt(i, _mtx);
          }
          mist.instanceMatrix.needsUpdate = true;


          /* birds */
          for (let i = 0; i < birds.length; i++) {
            const b = birds[i];
            const a = elapsed * b.spd + b.ph;
            b.g.position.set(Math.cos(a) * b.rad, b.y + Math.sin(elapsed * 0.35 + b.ph) * 2.2, Math.sin(a) * b.rad);
            b.g.rotation.y = Math.atan2(-Math.cos(a), -Math.sin(a));
            b.g.rotation.z = 0.14;
            b.g.scale.setScalar(b.s);
            const flap = Math.sin(elapsed * b.flap + b.ph) * 0.85;
            b.wl.rotation.x = -flap;
            b.wr.rotation.x = flap;
          }


          /* drifting flying island */
          flyGroup.position.y = FLY.y + Math.sin(elapsed * 0.32) * 0.4;
          flyGroup.rotation.y = Math.sin(elapsed * 0.11) * 0.02;


          /* camera intro (torii -> pagoda) + idle auto-rotate */
          if (introT < INTRO_DUR) {
            introT += dt;
            const t = easeInOut(clamp(introT / INTRO_DUR, 0, 1));
            camera.position.lerpVectors(introFrom, introTo, t);
            controls.target.lerpVectors(tgtFrom, tgtTo, t);
            if (introT >= INTRO_DUR) idleTimer = 0.001;
          } else if (idleTimer > 0) {
            idleTimer += dt;
            if (idleTimer > 3.0) { controls.autoRotate = true; idleTimer = 0; }
          }
          controls.update();
          sky.position.copy(camera.position);
          skyU.uTime.value = elapsed;


          /* stats + hud */
          fpsAcc += dt; fpsFrames++; hudAcc += dt;
          if (fpsAcc >= 0.5) { fpsShown = Math.round(fpsFrames / fpsAcc); fpsAcc = 0; fpsFrames = 0; }
          if (hudAcc > 0.35) {
            hudAcc = 0;
            elFps.textContent = String(fpsShown);
            elVox.textContent = (TOTAL_VOXELS / 1000).toFixed(1) + "k";
            const hrs = (timeOfDay * 24 + 6) % 24;
            const hh = Math.floor(hrs), mm = Math.floor((hrs - hh) * 60);
            elClock.textContent = String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
            if (playing) elTime.value = String(timeOfDay);
          }
          window.__VOXEL__.fps = fpsShown;
          window.__VOXEL__.timeOfDay = timeOfDay;
          window.__VOXEL__.voxelCount = TOTAL_VOXELS;


          renderer.render(scene, camera);
        }


        /* ------------------------------- resize --------------------------- */
        window.addEventListener("resize", () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        });


        /* -------------------------------- boot ---------------------------- */
        updateSun();
        renderer.render(scene, camera);
        animate();
        const loader = document.getElementById("loader");
        setTimeout(() => loader.classList.add("gone"), 260);
        setTimeout(() => loader.remove(), 1300);
      })();
    </script>
  </body>
</html>
