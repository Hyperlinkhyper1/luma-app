const foamMat=new T.MeshBasicMaterial({color:0xcfe8ee,transparent:true,opacity:.24,depthWrite:false});

for(let x=-141;x<=137;x+=10){for(let s of [1,-1]){for(let y=14;y<=58;y+=6){let l=new T.PointLight(0xffca7a,.9,18,1.7);l.position.set(x,y,s*29.1);lightGroup.add(l);if(emit.length<65)emit.push(l);}}}
for(let x=-116;x<=115;x+=18){for(let s of [1,-1]){let l=new T.PointLight(0xffdfaa,1.1,30,1.7);l.position.set(x,12,s*30);lightGroup.add(l);}}
for(let x=-69;x<=29;x+=10){let l=new T.PointLight(0xffd9a2,1.1,35,1.6);l.position.set(x,70,0);lightGroup.add(l);}
// install instanced meshes
inst(new T.BoxGeometry(1,1,1),glassMat,glassB);inst(new T.BoxGeometry(1,1,1),M,whiteB);inst(new T.BoxGeometry(1,1,1),Mgold,goldB);inst(new T.BoxGeometry(1,1,1),Mb,blackB);inst(new T.BoxGeometry(1,1,1),M2,deckB);inst(new T.BoxGeometry(1,1,1),Mnavy,navyB);inst(new T.BoxGeometry(1,1,1),Mred,redB);inst(new T.BoxGeometry(1,1,1),Mwood,woodB);inst(new T.BoxGeometry(1,1,1),Mb,tealB);inst(new T.BoxGeometry(1,1,1),Mwhite,litB);
// controls + deck walking
let mode='orbit',yaw=0,pitch=0,deck=9.4,key={};let view=0;
const views=[{p:[245,78,240],t:[0,32,0]},{p:[9.5,46,31.9],t:[9.5,46,-12]},{p:[-102,12,32],t:[2,21,0]},{p:[50,72,0],t:[-40,68,0]},{p:[170,9,70],t:[75,35,0]}];
function setView(i){view=i%views.length;const v=views[view];if(mode==='walk'){mode='orbit';document.querySelector('#btnB').classList.remove('active');}ctr.enabled=true;cam.position.fromArray(v.p);ctr.target.fromArray(v.t);ctr.update();}
cam.position.set(238,88,238);ctr.update();
document.querySelector('#hint').style.opacity=1;setTimeout(()=>{document.querySelector('#hint').style.opacity=.4;},7000);
function enterWalk(){mode='walk';ctr.enabled=false;document.querySelector('#btnB').classList.add('active');document.querySelector('#hint').style.display='none';cam.position.set(0,deck,31.2);yaw=-Math.PI/2;pitch=0;cam.rotation.set(0,0,0,'YXZ');}
function exitWalk(){mode='orbit';ctr.enabled=true;document.querySelector('#btnB').classList.remove('active');}
document.querySelector('#btnB').onclick=()=>{if(mode==='walk')exitWalk();else enterWalk();};
renderer.domElement.addEventListener('click',()=>{if(mode==='orbit'){renderer.domElement.requestPointerLock?.();}});
document.addEventListener('pointerlockchange',()=>{if(document.pointerLockElement===renderer.domElement){if(mode==='orbit'){mode='walk';document.querySelector('#btnB').classList.add('active');document.querySelector('#hint').style.display='none';}}else if(mode==='walk'&&!document.querySelector('#btnB').classList.contains('active')){document.querySelector('#hint').style.display='';}});
let drag=false,px=0,py=0;renderer.domElement.addEventListener('mousedown',e=>{drag=true;px=e.clientX;py=e.clientY;});window.addEventListener('mouseup',()=>drag=false);window.addEventListener('mousemove',e=>{if(drag&&mode!=='walk'&&!ctr.enabled){yaw-=(e.clientX-px)*.003;pitch-=(e.clientY-py)*.003;px=e.clientX;py=e.clientY;}else if(mode==='walk'&&document.pointerLockElement!==renderer.domElement&&drag){yaw-=(e.clientX-px)*.0025;pitch-=(e.clientY-py)*.0025;px=e.clientX;py=e.clientY;}});
window.addEventListener('keydown',e=>{key[e.code]=true;if(e.code==='KeyF'){if(mode==='walk')exitWalk();else enterWalk();}if(e.code==='KeyL')document.querySelector('#btnN').click();if(e.code==='KeyV')document.querySelector('#btnV').click();});window.addEventListener('keyup',e=>key[e.code]=false);
document.querySelector('#btnF').onclick=()=>{if(mode==='walk')exitWalk();else{setView(0);ctr.enabled=true;}};
document.querySelector('#btnV').onclick=()=>{if(mode==='walk'){enterWalk();}else setView(view+1);};
// day night / weather state
let night=false,weather=0;const sunP=new T.Vector3(),moonP=new T.Vector3();let time=5.8;
document.querySelector('#btnN').onclick=()=>{night=!night;document.querySelector('#btnN').textContent=night?'DAY':'NIGHT';};
document.querySelector('#btnW').onclick=()=>{weather=(weather+1)%3;document.querySelector('#btnW').textContent=['CALM','WINDY','STORM'][weather];waterU.amp.value=[.9,2.3,4.2][weather];scene.fog.density=[.00065,.0011,.0022][weather];renderer.toneMappingExposure=night?.72:1.02;document.querySelector('#btnW').classList.toggle('active',weather!==0);};
// weather particles (procedural rain / spray)
const rainGeo=new T.BufferGeometry();const rp=new Float32Array(3200*3);for(let i=0;i<3200;i++){rp[i*3]=(Math.random()-.5)*650;rp[i*3+1]=Math.random()*210;rp[i*3+2]=(Math.random()-.5)*650;}rainGeo.setAttribute('position',new T.BufferAttribute(rp,3));const rain=new T.Points(rainGeo,new T.PointsMaterial({color:0xbcd6e4,size:.28,transparent:true,opacity:.0,depthWrite:false}));scene.add(rain);
const cloudU=[];const cloudMat=new T.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.18,depthWrite:false});for(let i=0;i<22;i++){let c=new T.Mesh(new T.SphereGeometry(1,8,5),cloudMat);c.scale.set(35+Math.random()*90,5+Math.random()*10,18+Math.random()*35);c.position.set((Math.random()-.5)*900,130+Math.random()*110,(Math.random()-.5)*700);scene.add(c);cloudU.push(c);}
const starsG=new T.BufferGeometry();let sp=[];for(let i=0;i<700;i++){let a=Math.random()*Math.PI*2,b=Math.random()*Math.PI*.42;sp.push(Math.cos(a)*Math.sin(b)*3400,Math.cos(b)*3400,Math.sin(a)*Math.sin(b)*3400);}starsG.setAttribute('position',new T.Float32BufferAttribute(sp,3));const stars=new T.Points(starsG,new T.PointsMaterial({color:0xffffff,size:5,sizeAttenuation:true,transparent:true,opacity:0}));scene.add(stars);
// soft dynamic flag and mast motion
const birds=new T.Group();scene.add(birds);for(let i=0;i<12;i++){let b=new T.Mesh(new T.ConeGeometry(.22,1.0,4),new T.MeshBasicMaterial({color:0x42545f}));b.rotation.z=Math.PI/2;b.position.set(-80+Math.random()*160,55+Math.random()*35,60+Math.random()*100);birds.add(b);}
const wake=[];
// resize and loop
function onResize(){cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}window.addEventListener('resize',onResize);
let prev=performance.now(),tt=0;
function loop(now){requestAnimationFrame(loop);let dt=Math.min((now-prev)/1000,.05);prev=now;tt+=dt;time+=dt*(.028+weather*.01);let ph=time*.1;let day=Math.max(0,Math.sin((ph%6.283)*.9));let daylight=night?0:day;
 // cycle sunrise / sunset palette
let elev=Math.sin(ph);sunP.set(Math.cos(ph*.8)*400,elev*260,Math.sin(ph*.55)*340);sun.position.copy(sunP);sun.intensity=night?.28:1.4+day*.9;hr.intensity=night?.48:.55+day*.75;am.intensity=night?.24:.35;
let skyTop=new T.Color(night?0x061126:0x234e78),skyBot=new T.Color(night?0x18334c:0xb9d6e2);skyMat.uniforms.top.value.copy(skyTop);skyMat.uniforms.bot.value.copy(skyBot);skyMat.uniforms.sunDir.value.copy(sunP.clone().normalize());waterU.sunC.value.set(night?0x8bb4d2:0xffefd3);waterU.skyC.value.set(night?0x14324a:0x9fc9dc);waterU.deep.value.set(night?0x04121d:0x082535);waterU.sunD.value.copy(sunP.clone().normalize());waterU.time.value=tt*.65;
lightGroup.visible=night||day<.25;stars.material.opacity=night?.85:Math.max(0,(.2-day)*3.2);cloudMat.opacity=night?.09:.17+weather*.1;cloudMat.color.set(night?0x4e6880:0xffffff);
rain.material.opacity=weather===2?.3:weather===1?.06:0;rain.rotation.y=tt*.004;if(rain.material.opacity>0){let a=rainGeo.attributes.position.array;for(let i=0;i<3200;i++){a[i*3+1]-=dt*(42+weather*8);a[i*3]-=dt*7;if(a[i*3+1]<0)a[i*3+1]=205;}rainGeo.attributes.position.needsUpdate=true;}
for(let i=0;i<birds.children.length;i++){let b=birds.children[i];b.position.x+=Math.sin(tt*.1+i)*dt*.25;b.position.z+=Math.cos(tt*.08+i)*dt*.3;b.rotation.y=Math.sin(tt*.2+i)*.1;}
ship.position.y=Math.sin(tt*.38)*.18;ship.rotation.z=Math.sin(tt*.22)*.0009;ship.rotation.x=Math.cos(tt*.19)*.00065;
if(mode==='walk'){
 let mv=new T.Vector3();if(key.KeyW||key.ArrowUp)mv.z-=1;if(key.KeyS||key.ArrowDown)mv.z+=1;if(key.KeyA||key.ArrowLeft)mv.x-=1;if(key.KeyD||key.ArrowRight)mv.x+=1;if(mv.length()>0){mv.normalize();mv.applyAxisAngle(new T.Vector3(0,1,0),yaw);cam.position.addScaledVector(mv,dt*7.5);}
 if(key.ShiftLeft)cam.position.addScaledVector(mv,dt*7.5);
 cam.position.x=Math.max(-144,Math.min(137,cam.position.x));cam.position.z=Math.max(30.5,Math.min(31.7,cam.position.z));cam.position.y=deck+Math.sin(tt*.38)*.18+(key.Space?Math.sin(tt*9)*.18:0);cam.rotation.set(pitch,yaw,0,'YXZ');
}else ctr.update();
document.querySelector('#st').innerHTML=(night?'22:14':'14:36')+' &nbsp; '+(weather===0?'CALM SEA':weather===1?'MODERATE WIND':'STORM APPROACHING')+'<br>DECK 7 · PROMENADE<br>'+ (mode==='walk'?'WALKING':'ORBIT VIEW');
renderer.render(scene,cam);}
requestAnimationFrame(loop);
