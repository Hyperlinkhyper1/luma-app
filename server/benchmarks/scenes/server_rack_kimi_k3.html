<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SERVER ARCHITECTURE LAB</title>
<style>
:root{
  --bg:#0a0d12; --panel:rgba(13,17,24,.88); --panel2:rgba(18,24,33,.92);
  --line:rgba(140,175,215,.16); --line2:rgba(140,175,215,.28);
  --txt:#ccd8e4; --dim:#7e8da1; --faint:#57657a;
  --acc:#57c8ff; --accD:#1d6f9b; --grn:#8ce6a4; --warn:#ffb454; --bad:#ff6b6b;
  --mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{font:12px/1.5 "Inter","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased}
#view{position:fixed;inset:0}
#view canvas{display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.45)}
/* ---------- top bar ---------- */
#top{position:fixed;top:10px;left:10px;right:10px;height:48px;display:flex;align-items:center;gap:16px;padding:0 16px;z-index:30}
.logo{display:flex;align-items:center;gap:10px}
.logo b{font-size:12.5px;letter-spacing:3.5px;color:#eaf3fb;font-weight:700}
.logo .pulse{width:7px;height:7px;border-radius:50%;background:var(--grn);box-shadow:0 0 8px var(--grn);animation:pl 2s infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.35}}
.spacer{flex:1}
.chip{font-family:var(--mono);font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:7px;padding:4px 9px;background:rgba(10,14,20,.5);display:flex;gap:6px;align-items:center}
.chip b{color:var(--acc);font-weight:600}
.modeTabs{display:flex;gap:5px;margin-left:6px}
/* ---------- side panels ---------- */
.side{position:fixed;top:70px;bottom:76px;width:252px;overflow-y:auto;overflow-x:hidden;z-index:25;padding:12px}
#left{left:10px}
#right{right:10px;width:296px}
.side::-webkit-scrollbar{width:8px}
.side::-webkit-scrollbar-thumb{background:#223047;border-radius:4px}
.side::-webkit-scrollbar-track{background:transparent}
h3.sec{font-size:9.5px;letter-spacing:2.2px;color:var(--faint);font-weight:700;margin:14px 0 7px;display:flex;align-items:center;gap:8px}
h3.sec:first-child{margin-top:2px}
h3.sec::after{content:"";flex:1;height:1px;background:var(--line)}
/* rack U strip */
#rackmap{display:flex;gap:8px}
#ugrid{display:flex;flex-direction:column-reverse;gap:1px;flex:0 0 30px}
#ugrid .u{height:9.2px;border-radius:2px;background:#1a222d;cursor:pointer;position:relative;transition:filter .15s}
#ugrid .u:hover{filter:brightness(1.8)}
#ugrid .u.sel{outline:1px solid var(--acc);outline-offset:0}
#ugrid .u.blnk{background:#141a23}
#ugrid .u.cm{background:#233144}
#ulegend{font-family:var(--mono);font-size:8px;color:var(--faint);display:flex;flex-direction:column-reverse;justify-content:space-between;padding:1px 0}
/* server list */
.srv{border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:6px;cursor:pointer;background:rgba(16,22,31,.55);transition:border-color .15s,background .15s}
.srv:hover{border-color:var(--line2);background:rgba(28,38,53,.6)}
.srv.sel{border-color:rgba(87,200,255,.65);background:rgba(30,60,84,.42);box-shadow:inset 0 0 18px rgba(87,200,255,.08)}
.srv .nm{font-weight:700;font-size:11px;letter-spacing:.4px;color:#e6eef7;display:flex;justify-content:space-between;align-items:center}
.srv .nm .dot{width:7px;height:7px;border-radius:2px;flex:0 0 auto}
.srv .mt{font-family:var(--mono);font-size:9px;color:var(--dim);margin-top:3px;display:flex;justify-content:space-between}
/* power list */
.pow{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.pow .l{width:104px;font-size:10px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pow .bar{flex:1;height:7px;background:#141c27;border-radius:4px;overflow:hidden}
.pow .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#2b83b4,#57c8ff)}
.pow .v{font-family:var(--mono);font-size:9.5px;color:var(--acc);width:52px;text-align:right}
.pow.total{margin-top:9px;padding-top:8px;border-top:1px solid var(--line)}
.pow.total .v{color:#ffd27a;font-weight:700}
.heat{font-size:9.5px;color:var(--dim);background:rgba(43,131,180,.08);border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-top:8px}
.heat b{color:#ffd27a}
/* ---------- right panel content ---------- */
.rh{font-size:13px;font-weight:800;letter-spacing:1.2px;color:#eef5fc;margin-bottom:2px}
.rs{font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-bottom:9px}
.tagrow{display:flex;flex-wrap:wrap;gap:4px;margin:7px 0}
.tag{font-family:var(--mono);font-size:8.5px;letter-spacing:.6px;border:1px solid var(--line2);border-radius:6px;padding:2px 6px;color:var(--acc)}
.tag.g{color:var(--grn)} .tag.w{color:var(--warn)}
.kv{display:grid;grid-template-columns:88px 1fr;gap:2px 8px;font-size:10.5px;margin:6px 0}
.kv span{color:var(--dim)} .kv b{color:var(--txt);font-weight:600}
.why{font-size:10.5px;color:#a9b9ca;background:rgba(87,200,255,.05);border-left:2px solid var(--accD);padding:8px 10px;border-radius:0 8px 8px 0;margin:8px 0}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accD);background:linear-gradient(180deg,rgba(87,200,255,.16),rgba(87,200,255,.05));color:#dff2ff;border-radius:8px;padding:7px 12px;font-size:10px;font-weight:700;letter-spacing:1.4px;cursor:pointer;transition:all .15s}
.btn:hover{background:rgba(87,200,255,.28)}
.btn.ghost{border-color:var(--line);background:rgba(20,26,35,.6);color:var(--dim)}
.btn.ghost:hover{color:var(--txt);border-color:var(--line2)}
.btnrow{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
/* health */
.hp{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:center;padding:4.5px 2px;border-bottom:1px dashed rgba(140,175,215,.09)}
.hp span{color:var(--dim);font-size:10.5px}
.hp b{font-family:var(--mono);font-size:11px;font-weight:600;color:#d5ecff}
.hp b.warm{color:var(--warn)} .hp b.hot{color:var(--bad)} .hp b.ok{color:var(--grn)}
/* failures */
.fbtn{border:1px solid var(--line);background:rgba(22,28,38,.6);color:var(--txt);border-radius:8px;padding:6px 9px;font-size:9.5px;font-weight:600;letter-spacing:.8px;cursor:pointer;display:flex;gap:6px;align-items:center}
.fbtn:hover{border-color:var(--warn);color:#ffd9a0}
.fbtn.on{border-color:var(--bad);background:rgba(255,107,107,.14);color:#ffb3b3;box-shadow:0 0 10px rgba(255,107,107,.2)}
.warnbox{border:1px solid rgba(255,107,107,.5);background:rgba(255,107,107,.1);border-radius:8px;padding:7px 10px;font-size:10px;color:#ffc9c9;margin-top:7px;display:flex;gap:7px;align-items:flex-start}
.warnbox.amber{border-color:rgba(255,180,84,.5);background:rgba(255,180,84,.09);color:#ffe1b0}
.okbox{border:1px solid rgba(140,230,164,.4);background:rgba(140,230,164,.07);border-radius:8px;padding:7px 10px;font-size:10px;color:#c9f2d4;margin-top:7px}
/* ---------- presets & bottom bar ---------- */
#presets{position:fixed;left:50%;transform:translateX(-50%);bottom:70px;display:flex;gap:5px;z-index:25;padding:6px 8px}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;display:flex;gap:5px;z-index:26;padding:7px 9px;align-items:center}
.tb{border:1px solid var(--line);background:rgba(19,25,34,.72);color:var(--txt);border-radius:8px;padding:7px 11px;font-size:9.5px;font-weight:700;letter-spacing:1.1px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;transition:all .14s}
.tb:hover{border-color:var(--line2);color:#eaf4ff}
.tb.on{border-color:rgba(87,200,255,.7);background:linear-gradient(180deg,rgba(87,200,255,.22),rgba(87,200,255,.07));color:#dcf2ff;box-shadow:0 0 14px rgba(87,200,255,.22)}
.tb.warn.on{border-color:rgba(255,180,84,.7);background:rgba(255,180,84,.14);color:#ffe1b0;box-shadow:0 0 14px rgba(255,180,84,.18)}
.tb:disabled{opacity:.32;pointer-events:none}
.tb.sep{border:none;background:transparent;width:6px;pointer-events:none}
.vdiv{width:1px;height:20px;background:var(--line);margin:0 3px}
/* ---------- compare ---------- */
#compare{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(5,8,12,.72);backdrop-filter:blur(6px)}
#compare.show{display:flex}
.cmp{width:820px;max-width:94vw;max-height:86vh;overflow:auto;padding:20px 22px}
.cmp table{width:100%;border-collapse:collapse;font-size:10.5px}
.cmp th{font-size:9.5px;letter-spacing:1.4px;color:var(--dim);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line2)}
.cmp td{padding:7px 8px;border-bottom:1px solid rgba(140,175,215,.08);color:var(--txt)}
.cmp td:first-child{color:var(--dim);font-family:var(--mono);font-size:9.5px;letter-spacing:.8px;width:130px}
.cmp .cb{height:8px;background:#18202c;border-radius:4px;overflow:hidden;width:110px;display:inline-block;vertical-align:middle;margin-right:7px}
.cmp .cb i{display:block;height:100%;border-radius:4px}
.cmp .note{font-size:9.5px;color:var(--faint);margin-top:10px}
/* ---------- misc ---------- */
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(12px);z-index:70;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:8px 16px;font-size:10.5px;letter-spacing:.8px;color:#dfeeff;opacity:0;transition:all .3s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#tip{position:fixed;z-index:65;pointer-events:none;background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:4px 9px;font-family:var(--mono);font-size:9.5px;color:var(--acc);opacity:0;transition:opacity .12s;white-space:nowrap}
#load{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;transition:opacity .5s}
#load b{font-size:12px;letter-spacing:4px;color:#dce9f5}
#load .sp{width:26px;height:26px;border-radius:50%;border:2px solid #223047;border-top-color:var(--acc);animation:spn .8s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}
#load small{color:var(--faint);font-family:var(--mono);font-size:9px;letter-spacing:2px}
svg.ic{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.fade{transition:opacity .25s}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="view"></div>

<!-- SVG icon sprite (inline, no external assets) -->
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-hex" viewBox="0 0 24 24"><path d="M12 2l8.5 5v10L12 22l-8.5-5V7z"/><path d="M12 8v8M8 10l8 4M16 10l-8 4"/></symbol>
  <symbol id="i-chevL" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-chevR" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18.5v.5"/></symbol>
  <symbol id="i-wind" viewBox="0 0 24 24"><path d="M3 8h9a3 3 0 1 0-3-3M3 12h13a3 3 0 1 1-3 3M3 16h6a2.5 2.5 0 1 1-2.5 2.5"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></symbol>
  <symbol id="i-flow" viewBox="0 0 24 24"><circle cx="5" cy="6" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M7.5 6H15a4 4 0 0 1 0 8H9a4 4 0 0 0 0 4h7.5"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 2l9 5-9 5-9-5z"/><path d="M3 12l9 5 9-5M3 17l9 5 9-5"/></symbol>
  <symbol id="i-cut" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><path d="M8 7.5L21 19M8 16.5L21 5"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></symbol>
  <symbol id="i-cmp" viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></symbol>
</svg>

<div id="load"><div class="sp"></div><b>SERVER ARCHITECTURE LAB</b><small>CONSTRUCTING RACK GEOMETRY</small></div>

<div id="top" class="panel">
  <div class="logo">
    <svg class="ic" style="width:18px;height:18px;color:var(--acc)"><use href="#i-hex"/></svg>
    <b>SERVER ARCHITECTURE LAB</b>
    <span class="pulse"></span>
  </div>
  <div class="chip">MODE <b id="modeEl">FULL RACK</b></div>
  <div class="spacer"></div>
  <div class="chip">FPS <b id="fpsEl">--</b></div>
  <div class="chip">DRAW CALLS <b id="dcEl">--</b></div>
  <div class="chip">TRIANGLES <b id="trEl">--</b></div>
</div>

<div id="left" class="panel side"></div>
<div id="right" class="panel side"></div>
<div id="presets" class="panel"></div>
<div id="bar" class="panel"></div>

<div id="compare"><div class="cmp panel" id="cmpBody"></div></div>
<div id="toast"></div>
<div id="tip"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============================================================
   0. CORE ENGINE  (all dimensions in millimeters, 1U = 44.45)
   ============================================================ */
const U = 44.45;
const RACK = { w:600, d:944, y0:150, post:42, totalH:2100, frontZ:470, rearZ:-470, railX:231 };
const uBottom = n => RACK.y0 + (n-1)*U;          // bottom Y of rack unit n
const uMid = (a,b) => (uBottom(a)+uBottom(b)+U)/2;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c1016);
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.getElementById('view').appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 5, 25000);
camera.position.set(3600, 2600, 5200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .07;
controls.maxDistance = 9000; controls.minDistance = 120;
controls.target.set(0, 1050, 0);

try {
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(new RoomEnvironment(), .04).texture;
} catch(e) { /* environment is optional */ }

/* lights */
scene.add(new THREE.HemisphereLight(0xdfe9ff, 0x131820, .55));
const key = new THREE.DirectionalLight(0xffffff, 1.9);
key.position.set(1900, 3200, 2400);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
const sc = key.shadow.camera;
sc.left=-3800; sc.right=3800; sc.top=3800; sc.bottom=-3800; sc.near=200; sc.far=11000;
key.shadow.bias = -0.0004; key.shadow.radius = 3;
scene.add(key);
const rim = new THREE.DirectionalLight(0x9fc4ff, .6); rim.position.set(-1600, 2100, -2600); scene.add(rim);
const fill = new THREE.DirectionalLight(0xfff1dd, .35); fill.position.set(-900, 1200, 3000); scene.add(fill);

/* floor */
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30000, 30000), new THREE.ShadowMaterial({opacity:.32}));
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
const grid = new THREE.GridHelper(14000, 56, 0x24405c, 0x141d29);
grid.material.transparent = true; grid.material.opacity = .42; grid.position.y = .6; scene.add(grid);

/* ---------- shared materials ---------- */
const M = {
  frame:   new THREE.MeshStandardMaterial({color:0x23272e, metalness:.75, roughness:.5}),
  frame2:  new THREE.MeshStandardMaterial({color:0x2c313a, metalness:.7,  roughness:.52}),
  shell:   new THREE.MeshStandardMaterial({color:0x272c34, metalness:.78, roughness:.48}),
  galv:    new THREE.MeshStandardMaterial({color:0x8b95a1, metalness:.85, roughness:.38}),
  galvD:   new THREE.MeshStandardMaterial({color:0x565f6b, metalness:.8,  roughness:.45}),
  alu:     new THREE.MeshStandardMaterial({color:0xc7ccd4, metalness:.9,  roughness:.34}),
  aluD:    new THREE.MeshStandardMaterial({color:0x9aa1ab, metalness:.85, roughness:.42}),
  copper:  new THREE.MeshStandardMaterial({color:0xc47a3a, metalness:.95, roughness:.32}),
  brass:   new THREE.MeshStandardMaterial({color:0xd9b454, metalness:1,   roughness:.3}),
  pcb:     new THREE.MeshStandardMaterial({color:0x11402d, metalness:.25, roughness:.62}),
  pcbBlue: new THREE.MeshStandardMaterial({color:0x14324a, metalness:.25, roughness:.62}),
  ic:      new THREE.MeshStandardMaterial({color:0x101214, metalness:.4,  roughness:.55}),
  plas:    new THREE.MeshStandardMaterial({color:0x141619, metalness:.2,  roughness:.6}),
  plasD:   new THREE.MeshStandardMaterial({color:0x0b0c0e, metalness:.1,  roughness:.7}),
  white:   new THREE.MeshStandardMaterial({color:0xc9cdd2, metalness:.3,  roughness:.5}),
  fan:     new THREE.MeshStandardMaterial({color:0x191b1e, metalness:.3,  roughness:.55}),
  blade:   new THREE.MeshStandardMaterial({color:0x33373c, metalness:.4,  roughness:.5}),
  drive:   new THREE.MeshStandardMaterial({color:0x3c4149, metalness:.7,  roughness:.45}),
  driveF:  new THREE.MeshStandardMaterial({color:0x20242a, metalness:.6,  roughness:.5}),
  blank:   new THREE.MeshStandardMaterial({color:0x151920, metalness:.5,  roughness:.62}),
  vent:    new THREE.MeshStandardMaterial({color:0x11141a, metalness:.6,  roughness:.6}),
  slot:    new THREE.MeshStandardMaterial({color:0x232a18, metalness:.3,  roughness:.6}),
  gold:    new THREE.MeshStandardMaterial({color:0xd7ae4a, metalness:1,   roughness:.28}),
  duct:    new THREE.MeshStandardMaterial({color:0x2a3138, metalness:.1,  roughness:.9, transparent:true, opacity:.55}),
  ledOn:   new THREE.MeshBasicMaterial({color:0x53ff8e}),
  pdu:     new THREE.MeshStandardMaterial({color:0x1d2126, metalness:.6,  roughness:.55}),
  cableP:  new THREE.MeshStandardMaterial({color:0x15171a, metalness:.2,  roughness:.8}),
  cableN:  new THREE.MeshStandardMaterial({color:0x2e5fb0, metalness:.2,  roughness:.7}),
  cableN2: new THREE.MeshStandardMaterial({color:0xc9a13c, metalness:.2,  roughness:.7}),
};
M.frame.envMapIntensity = M.shell.envMapIntensity = .9;

/* archetype identity colors */
const ACOL = { gpu:0xff8d4d, virt:0x57c8ff, compute:0x8ce6a4, storage:0xc792ea, db:0xffd166, netapp:0x6be3d8, fabric:0x7aa2ff, cm:0x8b95a1 };

/* ---------- helpers ---------- */
const P = (o,x,y,z)=>{o.position.set(x,y,z);return o};
const R = (o,x,y,z)=>{o.rotation.set(x,y,z);return o};
function B(w,h,d,mat,x=0,y=0,z=0,shadow=true){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.castShadow = shadow; m.receiveShadow = true; return m;
}
function CY(rt,rb,h,mat,x=0,y=0,z=0,seg=18){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat);
  m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true; return m;
}
const _dummy = new THREE.Object3D();
function instFrom(geo, mat, items, shadows=false){
  const im = new THREE.InstancedMesh(geo, mat, items.length);
  items.forEach((it,i)=>{
    _dummy.position.copy(it.p); _dummy.rotation.set(0,0,0);
    if(it.rx) _dummy.rotation.x = it.rx; if(it.ry) _dummy.rotation.y = it.ry; if(it.rz) _dummy.rotation.z = it.rz;
    _dummy.scale.setScalar(it.s||1); _dummy.updateMatrix();
    im.setMatrixAt(i,_dummy.matrix);
  });
  im.castShadow = shadows; im.receiveShadow = true;
  return im;
}
function tube(points, r, mat, seg=40){

    g.stroke();
  }

class LedBank {
  constructor(){ this.items=[]; }
  add(x,y,z,color,kind,label){ this.items.push({x,y,z,color,kind,label}); return this.items.length-1; }
  build(){
    const geo = new THREE.SphereGeometry(1.7, 8, 6);
    this.mesh = new THREE.InstancedMesh(geo, new THREE.MeshBasicMaterial({toneMapped:false}), this.items.length);
    this.items.forEach((it,i)=>{ _dummy.position.set(it.x,it.y,it.z); _dummy.rotation.set(0,0,0); _dummy.scale.setScalar(1); _dummy.updateMatrix(); this.mesh.setMatrixAt(i,_dummy.matrix); this.mesh.setColorAt(i, new THREE.Color(it.color)); });
    this.mesh.instanceColor.needsUpdate = true;
    const ciArr = this.items.map(it=>({t:it.label||it.kind.toUpperCase()+' STATUS LED', rows:[['Indicator',it.kind],['Green','OK / activity'],['Amber/Off','Fault / no link']]}));
    this.mesh.userData.iinfo = ciArr;
    return this.mesh;
  }
  set(i,color){ this.mesh.setColorAt(i, new THREE.Color(color)); this.mesh.instanceColor.needsUpdate = true; }
  restore(){ this.items.forEach((it,i)=> this.set(i, it.color)); }
}

/* generic CPU + DIMM zone on a motherboard */
function cpuZone(srv, moboG, top, sockets, dimmPerSide, watt, finH, opts={}){
  const caps=[], chokes=[], slotItems=[], dimmDefs=[];
  sockets.forEach((s,i)=>{
    const cpu = mkCPU('CPU '+(i+1), finH, watt);
    P(cpu, s.x, top, s.z); moboG.add(cpu);
    const v = vrmItems(s.x, s.z); caps.push(...v.caps.map(it=>({p:it.p.clone().setY(it.p.y+top)})));
    chokes.push(...v.chokes.map(it=>({p:it.p.clone().setY(it.p.y+top)})));
    const lanes = [];
    for(let side=-1; side<=1; side+=2){
      for(let k=0;k<dimmPerSide;k++) lanes.push({x:s.x + side*(66+k*7.6), side, k});
    }
    lanes.forEach((ln,li)=>{
      const bank = 'ABCDEFGH'[li>7?li-8:li];
      const label = (ln.side<0?'A':'B') === 'A' ? 'A'+(ln.k+1) : 'B'+(ln.k+1);
      slotItems.push({p:new THREE.Vector3(ln.x, top+4, s.z)});
      dimmDefs.push({p:new THREE.Vector3(ln.x, top+7, s.z), label:(i===0?'A':'P')+(ln.k+1)+(li>7?'':'')+li, cpu:i+1, pop: opts.popEvery ? (li%opts.popEvery===0) : true});
    });
  });
  caps.forEach(c=>c.p.y = top+6); chokes.forEach(c=>c.p.y = top+5);
  moboG.add(instFrom(new THREE.CylinderGeometry(3.4,3.4,9,10), M.plasD, caps));
  moboG.add(instFrom(new THREE.BoxGeometry(7,7,7), M.ic, chokes));
  const chL = 'ABCDEFGH';
  dimmDefs.forEach((d,i)=>{
    const lane = i % (dimmPerSide*2), sideIdx = lane>=dimmPerSide?1:0, k = lane%dimmPerSide;
    d.label = (sockets.length>1 ? (i< dimmPerSide*2 ? 'A':'B') : 'A') + (k+1+sideIdx*dimmPerSide);
  });
  // slot guides (instanced) + DIMM cards + chips
  moboG.add(instFrom(new THREE.BoxGeometry(6,7,138), M.white, slotItems, false));
  const latch = []; slotItems.forEach(s=>{ latch.push({p:new THREE.Vector3(s.p.x, top+9, s.p.z-70)}); latch.push({p:new THREE.Vector3(s.p.x, top+9, s.p.z+70)}); });
  moboG.add(instFrom(new THREE.BoxGeometry(7,10,5), M.plas, latch, false));
  const pop = dimmDefs.filter(d=>d.pop);
  const dimmMesh = instFrom(new THREE.BoxGeometry(2.4,24,131), new THREE.MeshStandardMaterial({color:0x123a54, metalness:.3, roughness:.55}), pop.map(d=>({p:d.p.clone().setY(top+15)})));
  dimmMesh.userData.iinfo = pop.map(d=>({t:'DIMM '+d.label, rows:[['Type','ECC DDR5 RDIMM'],['Capacity', opts.gb||'64 GB'],['Attached to','CPU '+d.cpu],['Population','Channel-ordered, bank-first'],['Label','DIMM '+d.label]]}));
  moboG.add(dimmMesh);
  const chips=[]; pop.forEach(d=>{ for(let c=0;c<9;c++) chips.push({p:new THREE.Vector3(d.p.x+1.8, top+15, d.p.z-56+c*14)}); });
  moboG.add(instFrom(new THREE.BoxGeometry(1.4,15,9), M.ic, chips, false));
  moboG.children.slice(-1)[0].userData.iinfo = null;
  return {dimmCount: dimmDefs.length, dimmPop: pop.length};
}

function healthHTML(srv){

function metricText(m){
  if(!m.unit.startsWith('|')) return `${m.val.toFixed(0)}${m.unit}`;
  const base = m.unit.slice(1);
  const f = m.val/(m.base||1);
  let done = false;
  return base.replace(/[\d][\d.,]*/, num=>{
    if(done) return num; done = true;
    const v = parseFloat(num.replace(/,/g,''));
    return (v*f).toLocaleString(undefined,{maximumFractionDigits:1});
  });
}
function updateHealthDOM(srv){
  if(!srv) return;
  srv.healthState.forEach(m=>{
    const el = $('hp_'+m.key); if(!el) return;
    let txt = metricText(m);
    if(m.unit==='|') txt = m.raw;
    el.textContent = txt;
    const hot = (m.key.startsWith('cpu')&&m.val>82)||(m.key==='gpu'&&m.val>86)||(m.key==='asic'&&m.val>75);
    const warn = (m.key.startsWith('cpu')&&m.val>76)||(m.key==='gpu'&&m.val>80);
    el.className = hot?'hot':warn?'warm':'';
  });
}

function failActive(srv, k){
  const f = srv.fail;
  return (k==='fan'&&f.fan>=0)||(k==='psu'&&f.psu>=0)||(k==='drive'&&f.drive>=0)||(k==='gpu'&&f.gpu)||(k==='net'&&f.net);
}
function reapplyFaultLeds(srv){
  const f = srv.fail;
  if(f.psu>=0 && srv.psuLed) srv.leds.set(srv.psuLed[f.psu], 0xff4040);
  if(f.fan>=0 && srv.ledMap.fan) srv.leds.set(srv.ledMap.fan[Math.min(f.fan, srv.ledMap.fan.length-1)], 0xff4040);
  if(f.drive>=0 && srv.ledMap.drv) srv.leds.set(srv.ledMap.drv[f.drive], 0xff4040);
  if(f.gpu && srv.ledMap.gpu) srv.leds.set(srv.ledMap.gpu[Math.min(3, srv.ledMap.gpu.length-1)], 0xffb454);
  if(f.net && srv.ledMap.net) srv.leds.set(srv.ledMap.net[0], 0x1a1a1a);
}
function toggleFailure(srv, k){
  const f = srv.fail, on = !failActive(srv,k);
  if(k==='fan'){
    f.fan = on ? Math.min(2, srv.fans.length-1) : -1;
    srv.fans.forEach((fn,i)=> fn.tgt = (i===f.fan) ? 0 : (f.fan>=0?1.35:1));
    toast(on?'FAN MODULE FAULT — neighbor fans ramping, watch thermals':'Fan fault cleared');
  }
  if(k==='psu'){ f.psu = on?0:-1; toast(on?'PSU A OFFLINE — load picked up by remaining modules (N+1)':'PSU A restored'); }
  if(k==='drive'){ f.drive = on ? (srv.ledMap.drv? Math.min(5, srv.ledMap.drv.length-1) : 0) : -1; toast(on?'DRIVE FAULT — array DEGRADED, rebuild pending':'Drive replaced, rebuild complete'); }
  if(k==='gpu'){
    if(srv.spec.arch!=='gpu'){ toast('Not applicable: this system has no accelerators'); return; }
    f.gpu = on; toast(on?'GPU THERMAL EVENT — fans to max, clocks throttled':'GPU thermal event cleared');
  }
  if(k==='net'){ f.net = on; toast(on?'LINK DOWN port 1 — bonded failover to secondary path':'Link restored'); }
  srv.leds.restore(); reapplyFaultLeds(srv);
  renderFailWarns(); updateFailBtnStates();
}

function stripeTex(){

const SPRITE = spriteTex(), STRIPE = stripeTex();
const flowMats = [];
function flowMat(color){

  flowMats.push(m); return m;

function makeLane(pts){
  const v = pts.map(p=>new THREE.Vector3(...p));
  const cum=[0];
  for(let i=1;i<v.length;i++) cum.push(cum[i-1]+v[i].distanceTo(v[i-1]));
  return {v, cum, total:cum[cum.length-1]};
}
function laneAt(lane, u, out){
  const d = (u%1+1)%1 * lane.total, v=lane.v, c=lane.cum;
  let i=1; while(i<c.length-1 && c[i]<d) i++;

  return out.lerpVectors(v[i-1], v[i], k);
}
function flowTube(a, b, color, r=2.2){
  const mid = a.clone().lerp(b,.5);
  mid.y += Math.min(60, a.distanceTo(b)*.09);
  const curve = new THREE.CatmullRomCurve3([a, mid, b]);
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 26, r, 6, false), flowMat(color));
  const arrows = new THREE.Group();
  [0.42, 0.8].forEach(u=>{
    const cone = new THREE.Mesh(new THREE.ConeGeometry(r*2.4, r*6.5, 8), new THREE.MeshBasicMaterial({color, transparent:true, opacity:.95, blending:THREE.AdditiveBlending, depthWrite:false}));
    const p = curve.getPointAt(u), t = curve.getTangentAt(u);
    cone.position.copy(p); cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), t.normalize());
    arrows.add(cone);
  });
  const g = new THREE.Group(); g.add(m, arrows); return g;
}

function buildAir(srv){

    data.push({lane:(Math.random()*lanes.length)|0, u:Math.random(), sp:(0.18+Math.random()*.22)*(srv.airflow.speed||1), ox:(Math.random()-.5)*10, oy:(Math.random()-.5)*6, oz:(Math.random()-.5)*4});

        this.pos[i*3]   = this.tmp.x + p.ox;
        this.pos[i*3+1] = this.tmp.y + p.oy;
        this.pos[i*3+2] = this.tmp.z + p.oz;
      });
      this.geo.attributes.position.needsUpdate = true;
    }};
  return mesh;
}
/* -------- power path: AC inlet → PSU → PDB → board → loads -------- */
function buildPower(srv){
  const a = srv.anchors, g = new THREE.Group(), O = 0xffa63d;
  const cg = (...args)=>g.add(flowTube(...args));
  (a.psus||[]).forEach((p,i)=>{
    const inlet = p.clone().add(new THREE.Vector3(0, 0, -60));
    cg(inlet, p.clone().add(new THREE.Vector3(0,6,0)), O, 2.6);                  // feed into PSU
    cg(p.clone(), (a.pdb||a.mbpwr).clone(), O, 2.2);                              // PSU → PDB/board
  });
  if(a.pdb && a.mbpwr) cg(a.pdb.clone(), a.mbpwr.clone(), O);
  if(a.mbpwr){
    if(a.cpu) a.cpu.forEach(c=> cg(a.mbpwr.clone().lerp(c,.35), c.clone(), O));
    if(a.mem) cg(a.mbpwr.clone().lerp(a.mem,.4), a.mem.clone(), O);
    if(a.nvme) cg(a.mbpwr.clone().lerp(a.nvme,.4), a.nvme.clone(), O, 1.8);
    if(a.bp) cg(a.mbpwr.clone().lerp(a.bp,.35), a.bp.clone().add(new THREE.Vector3(0,-30,0)), O, 1.8);
  }
  if(a.gpu && a.pdb) cg(a.pdb.clone(), a.gpu.clone(), O, 3);
  g.visible = false; return g;
}
/* -------- conceptual data paths (educational, not PCB traces) -------- */
function buildData(srv){
  const a = srv.anchors, g = new THREE.Group(), C = 0x4fe3c1, C2=0x6fb4ff;
  const cpu = a.cpu ? a.cpu[Math.floor(a.cpu.length/2)] : null;
  const arch = srv.spec.arch;
  const out = (a.nic||cpu||new THREE.Vector3(0,30,-200)).clone().add(new THREE.Vector3(0, 4, -(srv.D*0.5-40)));
  const link = (p,q,col,r)=>g.add(flowTube(p,q,col,r));
  if(arch==='storage'){
    if(a.bp && a.hba) link(a.bp.clone(), a.hba.clone(), C);
    if(a.hba && cpu) link(a.hba.clone(), cpu.clone(), C);
  } else {
    if(a.nvme && cpu) link(a.nvme.clone(), cpu.clone(), C);
  }
  if(cpu && a.mem){ link(cpu.clone(), a.mem.clone(), C2); link(a.mem.clone(), cpu.clone().add(new THREE.Vector3(8,6,4)), C2); }
  if(arch==='gpu' && a.gpu){
    if(cpu) link(cpu.clone(), a.gpu.clone(), C, 2.8);
    if(a.gpuPair) link(a.gpu.clone(), a.gpuPair.clone(), 0xb78cff, 2);
    link(a.gpu.clone(), a.nic.clone(), C);
  }
  if(arch==='netapp' || arch==='fabric'){
    const front = new THREE.Vector3(0, 22, srv.D*0.5-40);
    if(a.asic){ link(front, a.asic.clone(), C); if(cpu) link(a.asic.clone(), cpu.clone(), C2); }
  }
  if(a.nic && arch!=='gpu') link((cpu||a.nic).clone(), a.nic.clone(), C, arch==='db'?2.8:2.2);
  if(a.nic) link(a.nic.clone(), out, C, 2.2);
  g.visible = false;
  g.userData.legend = true;
  return g;
}
function buildViz(srv){
  disposeViz(srv);
  const g = new THREE.Group();
  const air = buildAir(srv); const pw = buildPower(srv); const dt = buildData(srv);
  g.add(air, pw, dt);
  srv._viz = g; srv._pwG = pw; srv._dtG = dt; srv.group.add(g);
  setVizVisible();
}
function disposeViz(srv){
  if(srv && srv._viz){
    srv.group.remove(srv._viz);
    srv._viz.traverse(o=>{ if(o.geometry && o.geometry.dispose) o.geometry.dispose(); });
    srv._viz = null; srv._air = null;
  }
}
function setVizVisible(){
  const srv = S.sel;
  if(!srv || !srv._viz) return;
  if(srv._air) srv._air.mesh.visible = S.airflow;
  if(srv._pwG) srv._pwG.visible = S.power;
  if(srv._dtG) srv._dtG.visible = S.data;
}
/* ============================================================
   8. INTERACTION · SIM TICK · MAIN LOOP · BOOT
   ============================================================ */
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2(-2,-2);
let tipX=0, tipY=0, hoverDirty=false, downX=0, downY=0;
renderer.domElement.addEventListener('pointermove', e=>{
  mouse.set((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1);
  tipX = e.clientX+16; tipY = e.clientY+12; hoverDirty = true;
});
renderer.domElement.addEventListener('pointerdown', e=>{ downX=e.clientX; downY=e.clientY; });
renderer.domElement.addEventListener('pointerup', e=>{ if(Math.hypot(e.clientX-downX,e.clientY-downY)<6) doClick(); });
addEventListener('keydown', e=>{ if(e.key==='Escape') $('compare').classList.remove('show'); });
function resolveSrvObj(o){ let p=o; while(p){ if(p.userData.srv) return p.userData.srv; p=p.parent; } return null; }
function pickHover(){
  hoverDirty = false;
  ray.setFromCamera(mouse, camera);
  const tip = $('tip');
  if(S.mode==='rack'){
    const hits = ray.intersectObjects(SERVERS.map(s=>s.group), true);
    const srv = hits.length ? resolveSrvObj(hits[0].object) : null;
    if(srv){
      hlShow(srv.group); S.hover = srv;
      tip.style.opacity = 1; tip.style.left = tipX+'px'; tip.style.top = tipY+'px';
      tip.textContent = `${srv.spec.name} · ${uLabel(srv.spec)} · ${srv.spec.form} · CLICK TO SELECT`;
    } else {
      S.hover = null; tip.style.opacity = 0;
      if(S.sel) hlShow(S.sel.group); else hlBox.visible = false;
    }
  } else if(S.mode==='slice' && S.sel){
    const hits = ray.intersectObjects(S.sel.pickables, false);
    let ci = null, h = null;
    for(const hit of hits){
      const c = hit.object.userData.iinfo && hit.instanceId!=null ? hit.object.userData.iinfo[hit.instanceId] : hit.object.userData.ci;
      if(c){ ci = c; h = hit; break; }
    }
    if(ci){
      if(h.instanceId!=null && h.object.userData.iinfo) hlShowInstance(h.object, h.instanceId); else hlShow(h.object);
      tip.style.opacity = 1; tip.style.left = tipX+'px'; tip.style.top = tipY+'px'; tip.textContent = ci.t;
      S.hover = {ci};
    } else { S.hover = null; tip.style.opacity = 0; hlBox.visible = false; }
  }
}
function doClick(){
  if(S.mode==='rack' && S.hover){ selectNode(S.hover); }
  else if(S.mode==='slice' && S.hover && S.hover.ci){ renderComp(S.hover.ci); }
}
function selectNode(srv){
  S.sel = srv; S.comp = null;
  if(S.mode==='rack' && srv) hlShow(srv.group);
  updateLeftSel(); renderRight(); updateBar();
}
/* ---------------- simulated telemetry ---------------- */
function simTick(){
  SERVERS.forEach(s=>{
    healthTargets(s);
    s.healthState.forEach(m=>{ m.val += (m.tgt - m.val)*.45; });
  });
  if(S.sel) updateHealthDOM(S.sel);
}
setInterval(simTick, 1300);
/* ---------------- main loop ---------------- */
const clock = new THREE.Clock();
let frames = 0, meterT = 0;
const _m4 = new THREE.Matrix4();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  const el = clock.elapsedTime;
  controls.update();
  if(camFly.on){
    camFly.t += dt/camFly.d;
    const k = smooth(Math.min(1, camFly.t));
    camera.position.lerpVectors(camFly.p0, camFly.p1, k);
    controls.target.lerpVectors(camFly.v0, camFly.v1, k);
    if(camFly.t>=1) camFly.on = false;
  }
  updateSlice(dt);
  const sel = S.sel;
  if(S.mode==='slice' && sel){
    sel.fans.forEach(f=>{
      const tgt = (f.tgt===undefined?1:f.tgt);
      f.v = THREE.MathUtils.lerp(f.v===undefined?1:f.v, tgt, Math.min(1, dt*2.2));
      f.rotor.rotation.z += (f.v>0.01?1:f.v) * (5.5 + (f.base||.5)*11) * dt * Math.max(f.v, .001) / Math.max(f.v, .001) * f.v;
    });
    if(S.airflow && sel._air) sel._air.update(dt);
  }
  for(const m of flowMats){ m.map.offset.x -= dt*.85; }
  if(hoverDirty) pickHover();
  hlBox.material.opacity = .62 + .34*Math.sin(el*4.2);
  renderer.render(scene, camera);
  frames++; meterT += dt;
  if(meterT >= .5){
    $('fpsEl').textContent = String(Math.round(frames/meterT));
    $('dcEl').textContent = String(renderer.info.render.calls);
    const tr = renderer.info.render.triangles;
    $('trEl').textContent = tr>1e6 ? (tr/1e6).toFixed(2)+' M' : (tr/1e3).toFixed(0)+' K';
    frames = 0; meterT = 0;
  }
}
/* ---------------- boot ---------------- */
buildBar(); buildLeftPanel(); buildCompare();
selectNode(SERVERS[0]);
renderPresets(); updateBar();
applyPreset('q3', true);
setTimeout(()=>{ const l=$('load'); l.style.opacity=0; setTimeout(()=>l.remove(), 620); }, 350);
setTimeout(()=>toast('Hover a system · click to select · INSPECT SLICE for internals'), 1200);
animate();
</script>
