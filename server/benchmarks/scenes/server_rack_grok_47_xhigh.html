<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SERVER ARCHITECTURE LAB</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  :root {
    --bg: #121418;
    --panel: #161a1f;
    --panel-2: #1c2128;
    --line: #2c333d;
    --text: #e7ebf0;
    --muted: #8e99a6;
    --amber: #e3a23a;
    --amber-2: #8a6420;
    --cyan: #7eb8c9;
    --good: #3dce8e;
    --warn: #e3a23a;
    --bad: #e15d4f;
    --blue: #8aa4e8;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body {
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 13px;
    overflow: hidden;
  }
  button, input { font-family: inherit; }
  #app {
    height: 100%;
    display: grid;
    grid-template-rows: 52px minmax(0, 1fr) auto;
    grid-template-columns: 312px minmax(0, 1fr) 360px;
  }
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 0 16px;
    background: linear-gradient(180deg, #1b2027, #14181d);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .mark {
    width: 28px; height: 28px; border: 1px solid var(--amber);
    display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 4px;
  }
  .mark i { background: var(--amber); display: block; }
  .mark i:nth-child(2) { opacity: .45; }
  .mark i:nth-child(3) { opacity: .7; }
  h1 {
    margin: 0; font-size: 15px; letter-spacing: .16em; font-weight: 650;
    white-space: nowrap;
  }
  .sub { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  .stats { display: flex; gap: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-family: ui-monospace, Consolas, monospace; font-size: 11px; letter-spacing: .06em; }
  .stats b { color: var(--text); font-weight: 600; }
  .modepill {
    border: 1px solid var(--line); padding: 4px 8px; border-radius: 99px;
    letter-spacing: .14em; font-size: 10px; color: var(--amber);
  }
  aside {
    background: var(--panel);
    border-right: 1px solid var(--line);
    min-height: 0;
    overflow: auto;
    padding: 12px;
  }
  aside.right { border-right: 0; border-left: 1px solid var(--line); }
  #viewport { position: relative; min-width: 0; min-height: 0; background: #1a1e23; }
  #viewport canvas { display: block; width: 100%; height: 100%; }
  footer {
    grid-column: 1 / -1;
    background: #14181d;
    border-top: 1px solid var(--line);
    padding: 8px 10px 10px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .tools, .slicebar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .slicebar { display: none; padding-top: 2px; }
  body.slice .slicebar { display: flex; }
  .sep { width: 1px; height: 22px; background: var(--line); margin: 0 2px; }
  button.tool, button.cam, button.mini {
    background: var(--panel-2); color: var(--text);
    border: 1px solid #3a4250; border-radius: 4px;
    padding: 7px 9px; letter-spacing: .08em; text-transform: uppercase;
    font-size: 10px; cursor: pointer; line-height: 1;
  }
  button.tool:hover, button.cam:hover, button.mini:hover { border-color: #6d7888; }
  button.tool.active { background: var(--amber-2); border-color: var(--amber); color: #fff8ec; }
  button.tool:disabled, button.cam:disabled { opacity: .38; cursor: not-allowed; }
  button.danger.active { background: #6e2c26; border-color: var(--bad); color: #ffd8d4; }
  .srvline { color: var(--muted); font-size: 12px; letter-spacing: .04em; padding: 0 6px; }
  .srvline strong { color: var(--text); font-weight: 650; }
  h2 {
    margin: 14px 0 8px; font-size: 10px; letter-spacing: .16em; color: var(--muted); font-weight: 650;
  }
  h2:first-child { margin-top: 0; }
  .camrow, .optrow { display: flex; flex-wrap: wrap; gap: 6px; }
  .note { color: var(--muted); font-size: 12px; line-height: 1.45; }
  .rmap { display: flex; flex-direction: column; gap: 1px; background: #0e1114; border: 1px solid var(--line); padding: 4px; }
  .ublock {
    display: grid; grid-template-columns: 36px 1fr; gap: 6px; align-items: center;
    min-height: 16px; padding: 1px 4px; cursor: pointer; border-left: 3px solid transparent;
    color: #c5ced8; font-size: 10px;
  }
  .ublock .un { color: #66707c; font-variant-numeric: tabular-nums; font-family: ui-monospace, Consolas, monospace; }
  .ublock.empty { min-height: 8px; cursor: default; opacity: .55; }
  .ublock.blank { background: repeating-linear-gradient(-45deg, #1a1e23, #1a1e23 4px, #222831 4px, #222831 8px); }
  .ublock.sel { outline: 1px solid var(--amber); background: rgba(227,162,58,.08); }
  .ublock:hover:not(.empty) { background: rgba(255,255,255,.04); }
  .sw { width: 8px; height: 8px; display: inline-block; margin-right: 4px; vertical-align: middle; }
  .arch-gpu { background: #e3a23a; }
  .arch-virt { background: #7ea2e8; }
  .arch-compute { background: #3dce8e; }
  .arch-storage { background: #9aa8b8; }
  .arch-database { background: #c58be0; }
  .arch-firewall { background: #e07a68; }
  .arch-switch { background: #6ec8c0; }
  .powerlist { display: flex; flex-direction: column; gap: 4px; }
  .prow { display: grid; grid-template-columns: 1fr auto; gap: 8px; font-size: 11px; color: #c5ced8; }
  .bar { height: 4px; background: #2a313a; margin-top: 2px; }
  .bar > i { display: block; height: 100%; background: var(--amber); }
  .total { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
  .heat {
    margin-top: 8px; padding: 8px; background: #12161b; border: 1px solid var(--line); color: var(--muted); line-height: 1.4;
  }
  .heat b { color: var(--text); }
  .card {
    background: #12161b; border: 1px solid var(--line); padding: 10px; margin-bottom: 8px;
  }
  .kicker { color: var(--amber); letter-spacing: .14em; font-size: 10px; text-transform: uppercase; }
  .card h3 { margin: 4px 0 8px; font-size: 16px; letter-spacing: .04em; }
  .kv { display: grid; grid-template-columns: 108px 1fr; gap: 3px 8px; font-size: 12px; }
  .kv span { color: var(--muted); }
  .why { color: #c5ced8; line-height: 1.45; margin: 8px 0 0; }
  .banner {
    display: none; padding: 8px; border: 1px solid var(--bad); background: rgba(225,93,79,.1);
    color: #ffd0cb; margin-bottom: 8px; line-height: 1.4;
  }
  .banner.show { display: block; }
  .sensor { margin: 6px 0; }
  .sensor .sl { display: flex; justify-content: space-between; font-size: 11px; color: #c5ced8; font-variant-numeric: tabular-nums; }
  .sensor .track { height: 5px; background: #2a313a; margin-top: 3px; }
  .sensor .track i { display: block; height: 100%; width: 0; background: var(--good); }
  .sensor.warn .track i { background: var(--warn); }
  .sensor.bad .track i { background: var(--bad); }
  .parts details { border-bottom: 1px solid var(--line); padding: 4px 0; }
  .parts summary { cursor: pointer; color: #d5dbe3; font-size: 12px; }
  .parts button.link {
    display: block; width: 100%; text-align: left; background: transparent; border: 0; color: #b7c0ca;
    padding: 3px 0 3px 8px; cursor: pointer; font-size: 12px;
  }
  .parts button.link:hover, .parts button.link.on { color: var(--amber); }
  .modal {
    position: fixed; inset: 0; background: rgba(8,10,12,.72); display: none;
    align-items: center; justify-content: center; z-index: 20; padding: 24px;
  }
  .modal.show { display: flex; }
  .sheet {
    width: min(980px, 100%); max-height: min(760px, 100%); overflow: auto;
    background: #171b21; border: 1px solid var(--line); box-shadow: var(--shadow); padding: 16px 16px 20px;
  }
  .sheet header.mh { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
  .cols { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .col { background: #101418; border: 1px solid var(--line); padding: 8px; }
  .col h4 { margin: 0 0 8px; font-size: 11px; letter-spacing: .08em; }
  .mrow { margin: 5px 0; }
  .mrow label { display: flex; justify-content: space-between; color: var(--muted); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
  .mrow .track { height: 6px; background: #2a313a; }
  .mrow .track i { display: block; height: 100%; background: linear-gradient(90deg, #8a6420, #e3a23a); }
  .pop {
    position: fixed; bottom: 86px; left: 50%; transform: translateX(-50%);
    background: #171b21; border: 1px solid var(--line); padding: 10px; display: none; gap: 6px; z-index: 15;
    box-shadow: var(--shadow);
  }
  .pop.show { display: flex; flex-wrap: wrap; max-width: 720px; justify-content: center; }
  .hint { color: var(--muted); font-size: 11px; width: 100%; margin-bottom: 4px; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 11px; margin-top: 6px; }
  .legend b { font-weight: 600; }
  .c-air { color: #9ad7ff; } .c-pwr { color: #ffb15a; } .c-data { color: #7dffe1; }
  @media (max-width: 1180px) {
    #app { grid-template-columns: 260px minmax(0,1fr) 300px; }
    .cols { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>

const pcbCache = new Map();
function pcbTex(kind) {
  if (pcbCache.has(kind)) return pcbCache.get(kind);
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 1024;
  const g = c.getContext('2d');
  g.fillStyle = '#0e4c2e';
  g.fillRect(0, 0, 1024, 1024);
  g.fillStyle = '#0c4128';
  for (let i = 0; i < 22; i++) g.fillRect((i * 47) % 1024, (i * 88) % 1024, 220, 10);
  let s = 2161 + kind.length * 131;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  g.strokeStyle = '#d4b56a';
  g.globalAlpha = 0.45;
  g.lineWidth = 2;
  for (let i = 0; i < 70; i++) {
    g.beginPath();
    let x = rnd() * 1024, y = rnd() * 1024;
    g.moveTo(x, y);
    for (let k = 0; k < 5; k++) {
      if (rnd() > 0.45) x = Math.max(0, Math.min(1024, x + (rnd() - 0.5) * 260));
      else y = Math.max(0, Math.min(1024, y + (rnd() - 0.5) * 220));
      g.lineTo(x, y);
    }
    g.stroke();
  }
  g.globalAlpha = 0.8;
  g.fillStyle = '#e6c56e';
  for (let i = 0; i < 140; i++) {
    g.beginPath();
    g.arc(rnd() * 1024, rnd() * 1024, 2.1, 0, Math.PI * 2);
    g.fill();
  }
  g.globalAlpha = 1;
  g.fillStyle = '#e7f0dc';
  g.font = 'bold 42px sans-serif';
  g.fillText(kind.toUpperCase(), 36, 64);
  g.font = '24px sans-serif';
  g.fillText('BMC', 48, 960);
  g.fillText('VRM', 820, 80);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 4;
  pcbCache.set(kind, t);
  return t;
}
function pcbMat(kind) {
  const m = mats.pcb.clone();
  m.map = pcbTex(kind);
  m.color.set(0xffffff);
  return m;
}

function psuPositions(spec, h, d, len) {

    for (const y of ys) for (const x of xs) {
      out.push({ x, y, z, w: 0.072, h: 0.038, d: len, ...spec.psus[i++] });
    }
  } else if (spec.psuLayout === 'stack') {
    out.push({ x: 0.155, y: 0.022, z, w: 0.074, h: 0.038, d: len, ...spec.psus[0] });
    out.push({ x: 0.155, y: -0.022, z, w: 0.074, h: 0.038, d: len, ...spec.psus[1] });
  } else {
    const y = 0;
    const x0 = spec.archetype === 'firewall' || spec.archetype === 'switch' ? 0.10 : 0.11;
    out.push({ x: x0, y, z, w: 0.070, h: Math.min(0.038, h - 0.006), d: len, ...spec.psus[0] });
    out.push({ x: x0 + 0.076, y, z, w: 0.070, h: Math.min(0.038, h - 0.006), d: len, ...spec.psus[1] });

}

  addBox(g, w * 0.92, h * 0.78, d * 0.84, 0, 0, -d * 0.04, mats.drive);
  const face = addBox(g, w, h, 0.004, 0, 0, d / 2 - 0.002, mats.edge);
  addBox(g, w * 0.18, h * 0.45, 0.005, -w * 0.28, 0, d / 2, mats.latch);
  const led = makeLED(g, 0x39ff88, w * 0.32, h * 0.18, d / 2 + 0.001, 0.003, 0.002, 0.0015);
  const fault = makeLED(g, 0x39ff88, w * 0.32, -h * 0.12, d / 2 + 0.001, 0.003, 0.002, 0.0015);
  fault.material.emissiveIntensity = 0.15;
  g.userData.statusLed = led;
  g.userData.faultLed = fault;
  g.userData.size = { w, h, d };
  faceZ = d / 2;
  g.userData.faceZ = faceZ;
  return g;
}

function makeDIMM(populated, label, gb, vlp) {
  const g = new THREE.Group();
  const len = 0.118;
  const tall = vlp ? 0.018 : 0.031;
  addBox(g, len, 0.004, 0.006, 0, 0.002, 0, mats.slot);
  addBox(g, 0.004, 0.008, 0.007, -len / 2 + 0.002, 0.006, 0, mats.latch);
  addBox(g, 0.004, 0.008, 0.007, len / 2 - 0.002, 0.006, 0, mats.latch);
  if (populated) {
    const pcb = addBox(g, len - 0.01, tall, 0.0032, 0, tall / 2 + 0.004, 0, mats.dimm);
    const chips = 8;
    for (let i = 0; i < chips; i++) {
      const x = -0.042 + i * 0.012;
      addBox(g, 0.009, tall * 0.42, 0.0012, x, tall * 0.55, 0.0022, mats.chip);
    }
    addBox(g, len - 0.02, 0.003, 0.0014, 0, 0.006, 0.002, mats.gold);
    pcb.userData.dimmBody = true;
  }
  return g;
}

function makeHeatsink(w, h, d, parent, x, y, z) {
  const base = addBox(parent, w, 0.004, d, x, y, z, mats.copper);
  const fins = new THREE.InstancedMesh(boxG(0.0013, h, d * 0.92), mats.hs, 22);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < 22; i++) {
    dummy.position.set(x + (i - 10.5) * (w * 0.85 / 22), y + h / 2 + 0.002, z);
    dummy.updateMatrix();
    fins.setMatrixAt(i, dummy.matrix);
  }
  fins.instanceMatrix.needsUpdate = true;
  parent.add(fins);
  return { base, fins };
}

function makeCPU(parent, cpu, boardY, vlp, idx) {
  const g = new THREE.Group();
  g.position.set(cpu.x, boardY, cpu.z);
  const sock = 0.062;
  addBox(g, sock + 0.01, 0.004, sock + 0.01, 0, 0.004, 0, mats.slot);
  addBox(g, sock * 0.72, 0.003, sock * 0.72, 0, 0.008, 0, mats.hsD);
  addBox(g, 0.004, 0.003, 0.004, -sock * 0.42, 0.009, sock * 0.42, mats.gold);
  const hsH = vlp ? 0.016 : (cpu.hsH || (cpu.tdp > 300 ? 0.048 : cpu.tdp > 200 ? 0.042 : 0.036));
  makeHeatsink(0.068, hsH, 0.068, g, 0, 0.010, 0);
  for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
    addCyl(g, 0.003, 0.006, sx * 0.038, 0.012, sz * 0.038, mats.edge);
  }
  const silkL = silk(cpu.name, 0.04, 0.01);
  silkL.position.set(0, 0.001, sock * 0.85);
  g.add(silkL);
  const side = cpu.x > 0 ? 1 : -1;
  for (let i = 0; i < 6; i++) {
    addBox(g, 0.006, 0.007, 0.006, side * (0.046 + (i % 3) * 0.009), 0.008, -0.012 + Math.floor(i / 3) * 0.012, mats.hsD);
  }
  const capCount = 10;
  const caps = new THREE.InstancedMesh(cylG(0.0016, 0.0016, 0.005, 8), mats.chip, capCount);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < capCount; i++) {
    dummy.position.set(side * 0.05, 0.006, 0.02 + i * 0.0045);
    dummy.updateMatrix();
    caps.setMatrixAt(i, dummy.matrix);
  }
  g.add(caps);
  tag(g, 'Compute', cpu.name, {
    Type: 'Server CPU',
    Role: idx === 0 ? 'Primary socket / NUMA node 0' : 'Second socket / NUMA node 1',
    Cores: String(cpu.cores),
    'Thermal design power': cpu.tdp + ' W',
    Cooling: vlp ? 'Low-profile fin stack, fins aligned front-to-rear' : 'Passive fin stack in the chassis air stream. No dedicated fan on the socket.',
    Placement: 'Downstream of the fan wall so the coldest air hits the fins first. DIMM channels sit on the upstream and downstream edges of the socket, which is where the memory controller pins exit.',
    'Why not a tower cooler': 'Rack servers are front-to-rear. A tower cooler would block the stream and is the wrong service model.'
  });
  g.userData.role = 'cpu';
  g.userData.index = idx;
  parent.add(g);

  const banks = [];
  const addBank = (zSign, count, pop, prefix) => {
    if (!count) return;
    const pitch = 0.0076;
    for (let i = 0; i < count; i++) {
      const populated = i < pop;
      const label = prefix + (i + 1);
      const dimm = makeDIMM(populated, label, 0, vlp);
      const z = zSign * (0.040 + i * pitch);
      dimm.position.set(cpu.x, boardY, cpu.z + z);
      const channel = prefix;
      tag(dimm, 'Memory', 'DIMM ' + label, {
        Type: populated ? (vlp ? 'ECC VLP RDIMM' : 'ECC RDIMM') : 'Empty DIMM slot',
        Label: label,
        Capacity: populated ? (cpu.dimmGB || '') : '—',
        CPU: cpu.name,
        'Memory channel group': channel,
        Slot: String(i + 1),
        Populated: populated ? 'Yes' : 'No',
        Placement: 'Slots run left-to-right and are stacked along the airflow axis so air passes through the gaps. Population normally fills the first slot of each channel before the second. Empty slots stay on pitch so an upgrade does not retune the air path.',
        Note: 'Labels are channel-group teaching labels, not a specific vendor silkscreen.'
      });
      if (populated) dimm.userData.info.Capacity = '';
      dimm.userData.role = 'dimm';
      parent.add(dimm);
      banks.push(dimm);
    }
  };
  addBank(1, cpu.slotsF, cpu.popF, idx === 0 ? 'A' : 'C');
  addBank(-1, cpu.slotsR, cpu.popR, idx === 0 ? 'B' : 'D');
  return g;
}

function makePSU(p, index) {
  const g = new THREE.Group();
  g.position.set(p.x, p.y, p.z);
  addBox(g, p.w, p.h, p.d, 0, 0, 0, mats.psu);
  addBox(g, p.w * 0.72, p.h * 0.55, 0.004, 0, 0, -p.d / 2 - 0.001, mats.perf);
  addBox(g, p.w * 0.22, p.h * 0.35, 0.008, p.w * 0.22, 0, -p.d / 2, mats.latch);
  addBox(g, p.w * 0.55, 0.004, 0.008, 0, -p.h / 2 + 0.002, p.d / 2, mats.gold);
  const led = makeLED(g, 0x39ff88, -p.w * 0.28, p.h * 0.22, -p.d / 2 - 0.002, 0.004, 0.003, 0.002);
  g.userData.statusLed = led;
  g.userData.role = 'psu';
  g.userData.index = index;
  g.userData.feed = p.feed;
  tag(g, 'Power', 'PSU ' + (index + 1), {
    Type: 'Hot-swap redundant PSU',
    Output: p.watt + ' W',
    Feed: 'PDU-' + p.feed,
    Service: 'Rear-accessible. The latch releases the module; the gold-finger connector blind-mates at the inner end.',
    Redundancy: 'Paired so one supply, or one rack feed, can drop without taking the host down — if the survivors are rated for the operating load, not just the idle load.',
    Air: 'Most enterprise PSUs intake from inside the chassis and exhaust out the rear grille. They are part of the air path, not a sealed box.'
  });
  return g;
}

function portGeo(type) {
  if (type === 'qsfpdd') return { w: 0.024, h: 0.014, d: 0.022 };
  if (type === 'qsfp') return { w: 0.020, h: 0.012, d: 0.020 };
  if (type === 'rj45') return { w: 0.016, h: 0.013, d: 0.016 };
  return { w: 0.014, h: 0.011, d: 0.018 };
}
function makePort(type, x, y, z, face) {
  const s = portGeo(type);
  const g = new THREE.Group();
  g.position.set(x, y, z);
  if (face === 'rear') g.rotation.y = Math.PI;
  addBox(g, s.w, s.h, s.d, 0, 0, s.d / 2, mats.edge);
  addBox(g, s.w * 0.72, s.h * 0.62, 0.004, 0, 0, s.d + 0.001, mats.port);
  const led = makeLED(g, type === 'rj45' ? 0x3aa0ff : 0x39ff88, 0, s.h * 0.7, s.d + 0.002, 0.003, 0.002, 0.0015);
  g.userData.statusLed = led;
  g.userData.portType = type;
  return g;
}

function makeCage(type) {
  const names = { sfp: 'SFP+', qsfp: 'QSFP28', qsfpdd: 'QSFP-DD', rj45: 'RJ45' };
  return names[type] || type;
}

const detailCache = new Map();
let activeDetail = null;

function assemble(spec) {
  const L = layoutFor(spec);

  addBox(A.chassis, 0.02, h * 0.35, 0.006, -w / 2 - 0.008, h * 0.22, zf - 0.004, mats.edge);
  addBox(A.chassis, 0.02, h * 0.35, 0.006, w / 2 + 0.008, h * 0.22, zf - 0.004, mats.edge);

  addBox(A.chassis, 0.012, h * 0.7, 0.008, w / 2 - 0.02, 0, L.fans.z - 0.03, frameMat());
  addBox(A.chassis, 0.008, 0.012, d * 0.55, -w / 2 + 0.006, -h / 2 + 0.01, -0.02, mats.edge);

  }
  tag(cover, 'Mechanical', 'Top cover', {
    Type: 'Removable service cover',
    Motion: 'Slides toward the rear, then lifts — the usual tool-less direction so it clears the rack above.',

  if (L.board) {

    });
    const mcio = new THREE.Group();
    const n = spec.archetype === 'gpu' ? 8 : 6;
    for (let i = 0; i < n; i++) {
      addBox(mcio, 0.012, 0.006, 0.008, b.x - b.w * 0.28 + i * 0.016, boardY + 0.006, b.z + b.d / 2 - 0.01, mats.plastic);

    tag(mcio, 'Board', 'MCIO / PCIe cable connectors', {

      Role: 'Lanes leave the board on cables to NVMe backplanes and risers. Modern servers do this instead of a row of long consumer slots.',

    });
    A.board.add(mcio);
    const bmc = new THREE.Group();
    bmc.position.set(b.x - b.w * 0.32, boardY, b.z - b.d * 0.32);
    addBox(bmc, 0.016, 0.004, 0.016, 0, 0.005, 0, mats.ic);
    addBox(bmc, 0.006, 0.003, 0.003, 0.014, 0.004, 0, mats.hsD);
    const bmcSilk = silk('BMC', 0.02, 0.007);
    bmcSilk.position.set(0, 0.002, 0.016);
    bmc.add(bmcSilk);
    tag(bmc, 'Board', 'BMC', {
      Type: 'Baseboard management controller',
      Role: 'Out-of-band power, sensors, console, and a dedicated network interface that stays up when the host OS does not.',

    });
    A.board.add(bmc);
    const chipset = new THREE.Group();
    chipset.position.set(b.x + b.w * 0.18, boardY, b.z - b.d * 0.1);
    addBox(chipset, 0.022, 0.004, 0.022, 0, 0.005, 0, mats.ic);
    makeHeatsink(0.024, 0.008, 0.024, chipset, 0, 0.008, 0);
    tag(chipset, 'Board', 'Chipset / platform controller', {
      Type: 'Platform controller',
      Role: 'Extra I/O, management fabric, and lanes that do not come straight from the CPU.',

        const m2 = new THREE.Group();
        m2.position.set(b.x - b.w * 0.22, boardY, b.z - 0.02 - i * 0.02);
        addBox(m2, 0.022, 0.002, 0.06, 0, 0.004, 0, mats.dimm);
        addBox(m2, 0.012, 0.002, 0.01, 0, 0.006, 0.01, mats.chip);
        tag(m2, 'Storage', 'M.2 ' + (i + 1), {
          Type: 'M.2 module',
          Role: spec.drives.kind === 'm2' ? 'Boot image and logs for the appliance' : 'Internal boot device, not a hot-swap bay',
          Service: 'Requires the cover. Not a front-service part. Do not use this as the only copy of data you cannot reinstall.'
        });

      }

  }

  const cpuGroups = [];
  (L.cpus || []).forEach((c, i) => {
    c.dimmGB = spec.dimmGB;
    if (spec.u >= 4 && !spec.vlp) c.hsH = 0.052;

    const gb = spec.dimmGB;
    g.traverse(o => {
      if (o.userData && o.userData.info && o.userData.role === 'dimm' && o.userData.info.Populated === 'Yes') {

  }

  if (spec.archetype === 'storage') {

    A.accel.add(bridge);
    const bus = new THREE.Group();
    bus.position.set(w / 2 - 0.03, -h / 2 + 0.02, G.z - 0.02);
    addBox(bus, 0.012, 0.008, 0.28, 0, 0, 0, mats.copperBus);

      Type: 'Distribution busbar',

      Why: spec.gpus + ' modules at ' + spec.gpuTdp + ' W is about ' + Math.round(spec.gpus * spec.gpuTdp / 48) + ' A at 48 V. The same power at 12 V would be about ' + Math.round(spec.gpus * spec.gpuTdp / 12) + ' A. The bar exists because of that arithmetic.',
      CPUs: 'Host sockets still use a local 12 V VRM stage on the motherboard. They are not hung on the accelerator bus.'

  if (L.asic) {

    addBox(asic, 0.045, 0.005, 0.045, 0, 0.006, 0, mats.ic);

    tag(asic, 'Network', 'Switch ASIC', {
      Type: 'Forwarding ASIC',

      Cooling: 'Fin stack in the front-to-rear stream. This is the hottest part of the appliance.',
      Why: 'Treating a ToR switch as "a 1U server with lots of ports" misses the layout. The ASIC is centered; the CPU is subordinate.'
    });
    A.board.add(asic);
    for (let i = 0; i < 8; i++) {

      if (spec.extraRiser === 'hba') addBox(riser, 0.004, 0.038, 0.1, -0.012, 0.028, 0.01, mats.chip);
      tag(riser, 'Network', spec.extraRiser === 'hba' ? 'Riser: NIC + HBA' : 'PCIe riser', {
        Type: 'Vertical riser',
        Role: spec.u === 1 ? '1U cannot stand a full-height card up, so low-profile or OCP mezzanines are used instead.' : 'Turns motherboard lanes into a full-height card the rear bracket can retain.',
        Connection: 'Riser plugs into the board; the card plugs into the riser. Neither floats.',
        Service: 'The assembly comes out toward the rear or straight up with the cover off. It does not require pulling the fan wall.'
      });
      if (spec.u >= 2) A.io.add(riser);
    }
    if (spec.u === 1 && spec.archetype !== 'switch' && spec.archetype !== 'firewall') {
      const ocp = new THREE.Group();
      ocp.position.set(-0.12, boardY + 0.006, zr + 0.06);
      addBox(ocp, 0.07, 0.004, 0.08, 0, 0, 0, pcbMat('ocp'));
      addBox(ocp, 0.02, 0.003, 0.012, 0, 0.004, -0.03, mats.gold);

        Type: 'Horizontal NIC mezzanine',

    tag(duct, 'Cooling', 'Air shroud', {
      Type: 'Sheet-metal air duct',
      Role: 'Stops fan pressure from leaking into empty volume above the sockets. It forces the stream through DIMM gaps and heatsink fins.',

  const lcd = makeLCD(spec.short, 'OK');
  lcd.position.set(w / 2 - 0.03, h / 2 - 0.012, zf - 0.002);

  const selectables = [];

function makeLCD(title, status) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 80;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.046, 0.014), new THREE.MeshBasicMaterial({ transparent: true }));
  mesh.userData.lcd = { canvas: c, title };
  paintLCD(mesh, status);
  return mesh;
}
function paintLCD(mesh, status) {
  const { canvas, title } = mesh.userData.lcd;
  const g = canvas.getContext('2d');
  g.fillStyle = '#0c1210';
  g.fillRect(0, 0, 256, 80);
  g.strokeStyle = '#1e3a32';
  g.strokeRect(2, 2, 252, 76);
  g.fillStyle = status === 'OK' ? '#37e08a' : '#ff5d4a';
  g.font = 'bold 28px sans-serif';
  g.fillText(title, 12, 34);
  g.font = '22px sans-serif';
  g.fillText(status, 12, 64);
  const tex = new THREE.CanvasTexture(canvas);
  tex.encoding = THREE.sRGBEncoding;
  mesh.material.map = tex;
  mesh.material.needsUpdate = true;
}

function makePaths(spec, L) {
  const air = [];
  const y = spec.vlp ? 0.0 : 0.008;
  const zFront = L.zf - 0.02;
  const zRear = L.zr + 0.03;
  const fanZ = L.fans ? L.fans.z : 0;
  (L.cpus || []).forEach(c => {
    air.push([
      new THREE.Vector3(c.x, y, zFront),
      new THREE.Vector3(c.x, y, fanZ),
      new THREE.Vector3(c.x + 0.012, y, c.z + 0.02),
      new THREE.Vector3(c.x + 0.012, y, c.z - 0.03),
      new THREE.Vector3(c.x * 0.4, y, zRear)
    ]);
  });
  if (spec.archetype === 'gpu') {
    const gaps = [-0.138, -0.046, 0.046, 0.138];
    gaps.forEach(x => {
      air.push([
        new THREE.Vector3(Math.min(0.12, Math.max(-0.02, x)), 0.02, zFront),
        new THREE.Vector3(x, 0.01, fanZ),
        new THREE.Vector3(x, 0.0, L.gpus.z),
        new THREE.Vector3(x * 0.45, 0.0, zRear)
      ]);
    });
  }
  if (spec.archetype === 'storage') {
    air.length = 0;
    for (let i = 0; i < 3; i++) {
      const x = -0.12 + i * 0.12;
      air.push([
        new THREE.Vector3(x, 0.02, zFront),
        new THREE.Vector3(x, 0.0, L.backplane.z),
        new THREE.Vector3(x, 0.0, fanZ),
        new THREE.Vector3(x * 0.6, 0.0, L.cpus[0].z),
        new THREE.Vector3(0.02, 0.0, zRear)
      ]);
    }
  }
  const power = [];
  (L.psus || []).forEach(p => {
    const start = new THREE.Vector3(p.x, p.y, p.z + p.d / 2);
    (L.cpus || []).forEach(c => {
      power.push([start, new THREE.Vector3(c.x, L.boardY + 0.01, c.z - 0.02)]);
    });
    if (L.gpus) power.push([start, new THREE.Vector3(0.18, -L.h / 2 + 0.02, L.gpus.z)]);
    if (spec.archetype === 'storage') power.push([start, new THREE.Vector3(0.1, 0, L.backplane.z)]);
  });
  const data = [];
  if (spec.archetype === 'gpu') {
    const cpu = L.cpus[0];
    const nvme = new THREE.Vector3(L.drives.x0, 0, L.drives.z);
    data.push([nvme, new THREE.Vector3(cpu.x, y + 0.02, cpu.z), new THREE.Vector3(0, y + 0.03, L.gpus.z), new THREE.Vector3(L.ports.x, y, L.zr + 0.04)]);
  } else if (spec.archetype === 'storage') {
    data.push([
      new THREE.Vector3(0, 0.02, L.drives.z),
      new THREE.Vector3(0, 0.02, L.backplane.z),
      new THREE.Vector3(L.hba.x, 0.03, L.hba.z),
      new THREE.Vector3(L.cpus[0].x, 0.02, L.cpus[0].z),
      new THREE.Vector3(L.ports.x, 0.02, L.zr + 0.04)
    ]);
  } else if (spec.archetype === 'database') {
    const cpu = L.cpus[0];
    data.push([
      new THREE.Vector3(L.drives.x0, 0.01, L.drives.z),
      new THREE.Vector3(cpu.x, 0.02, cpu.z),
      new THREE.Vector3(cpu.x, 0.03, cpu.z + 0.04),
      new THREE.Vector3(L.ports.x, 0.01, L.zr + 0.04)
    ]);
  } else if (L.cpus && L.cpus[0]) {
    const cpu = L.cpus[0];
    const z0 = L.drives && L.drives.z ? L.drives.z : L.zf - 0.05;
    data.push([
      new THREE.Vector3(-0.05, 0.01, z0),
      new THREE.Vector3(cpu.x, 0.015, cpu.z),
      new THREE.Vector3(L.ports.x, 0.01, L.ports.face === 'front' ? L.zf - 0.04 : L.zr + 0.04)
    ]);
  }
  return { air, power, data };
}

function getDetail(id) {

function setCover(detail, t) {
  const cover = detail.userData.A.cover;
  const base = detail.userData.coverBase;
  const d = detail.userData.spec.depth;
  const h = detail.userData.L.h;
  const e = detail.userData._explode || 0;
  cover.position.set(
    base.x,
    base.y + t * (0.045 + h * 0.18) + e * 0.14,
    base.z - t * d * 0.36 + e * -0.04
  );
}
function applyExplode(detail, t) {
  detail.userData._explode = t;
  const off = {
    cover: [0, 0.14, -0.04],
    accel: [0, 0.10, 0],
    duct: [0.08, 0.07, 0],
    cpu: [0, 0.055, 0],
    fans: [0, 0.02, 0.10],
    storage: [0, 0, 0.11],
    backplane: [0, 0.03, 0.06],
    io: [0, 0.04, -0.08],
    power: [0, 0.015, -0.10],
    board: [0, 0.02, 0],
    chassis: [0, -0.035, 0]
  };
  const A = detail.userData.A;
  Object.keys(off).forEach(k => {
    if (!A[k]) return;
    if (k === 'cover') return;
    A[k].position.set(off[k][0] * t, off[k][1] * t, off[k][2] * t);
  });
  setCover(detail, S.coverNow);
}
function applyCutaway(detail, t) {
  detail.userData.wallMats.forEach(m => { m.opacity = 1 - t * 0.93; m.transparent = true; });
  detail.userData.frameMats.forEach(m => { m.opacity = 1 - t * 0.55; m.transparent = true; });
  (detail.userData.wallMeshes || []).forEach(m => {
    m.raycast = t > 0.55 ? () => {} : THREE.Mesh.prototype.raycast;
  });
}

      const cloned = list.map(m => {
        const c = m.clone();
        c.userData._opBase = m.opacity === undefined ? 1 : m.opacity;
        c.transparent = !!c.transparent || c.userData._opBase < 0.99;
        return c;
      });
      o.material = Array.isArray(o.material) ? cloned : cloned[0];
      o.userData._fadeBound = true;
    }
    const now = Array.isArray(o.material) ? o.material : [o.material];
    now.forEach(m => {
      const base = m.userData._opBase === undefined ? 1 : m.userData._opBase;
      m.opacity = base * opacity;

  slider.getWorldPosition(wp);
  const camTo = wp.clone().add(new THREE.Vector3(0.85, 0.42, spec.depth * 0.35));
  const tgtTo = wp.clone().add(new THREE.Vector3(0, 0, spec.depth * 0.2));
  const camFrom = camera.position.clone();
  const tgtFrom = controls.target.clone();
  S.phase = 'extract';
  play(1.15, (e) => {
    slider.position.z = fromZ + (toZ - fromZ) * e;
    camera.position.lerpVectors(camFrom, camTo, e * 0.65);
    controls.target.lerpVectors(tgtFrom, tgtTo, e * 0.65);
  }, () => startIsolate(spec, rig));
}
function startIsolate(spec, rig) {
  const slider = rig.userData.slider;
  slider.updateWorldMatrix(true, true);
  const detail = getDetail(spec.id);
  detail.position.setFromMatrixPosition(slider.matrixWorld);
  detail.quaternion.setFromRotationMatrix(slider.matrixWorld);
  detail.userData._explode = 0;
  applyExplode(detail, 0);
  S.coverNow = 0;
  setCover(detail, 0);
  scene.add(detail);
  activeDetail = detail;
  slider.visible = false;
  paintFailure();
  const fromPos = detail.position.clone();
  const fromQuat = detail.quaternion.clone();
  const toPos = new THREE.Vector3(0, 1.06, 0);
  const toQuat = new THREE.Quaternion();
  S.cover = 1;
  const camFrom = camera.position.clone();
  const tgtFrom = controls.target.clone();
  S.phase = 'isolate';
  play(1.3, (e) => {
    detail.position.lerpVectors(fromPos, toPos, e);
    detail.quaternion.copy(fromQuat).slerp(toQuat, e);
    setOpacityOn(rackRoot, 1 - e);
    const cam = sliceCam('whole');
    if (cam) {
      camera.position.lerpVectors(camFrom, cam.pos, e);
      controls.target.lerpVectors(tgtFrom, cam.target, e);
    }
  }, () => {
    rackRoot.visible = false;
    setOpacityOn(rackRoot, 1);
    S.mode = 'slice';
    S.phase = 'idle';
    S.cam = 'whole';
    controls.enabled = true;
    const cam = sliceCam('whole');

}
function returnToRack() {

  S.explode = 0;
  S.cover = 0;
  S.cutaway = 0;
  S.air = false;
  S.power = false;
  S.data = false;

  S.phase = 'closing';
}
function startRejoin() {
  const detail = activeDetail;
  const spec = detail.userData.spec;
  const rig = rigById[spec.id];
  rackRoot.visible = true;
  setOpacityOn(rackRoot, 0);
  const slider = rig.userData.slider;
  slider.updateWorldMatrix(true, true);
  const toPos = new THREE.Vector3();
  const toQuat = new THREE.Quaternion();
  slider.getWorldPosition(toPos);
  slider.getWorldQuaternion(toQuat);
  const fromPos = detail.position.clone();
  const fromQuat = detail.quaternion.clone();

  const tgtFrom = controls.target.clone();

    play(0.95, (e) => { slider.position.z = fromZ + (homeZ - fromZ) * e; }, () => {

      controls.target.copy(camTo.target);

function ensureOverlays(detail) {
  if (detail.userData.overlays) return detail.userData.overlays;
  const o = { air: new THREE.Group(), power: new THREE.Group(), data: new THREE.Group() };
  const paths = detail.userData.paths;
  o.air.add(particleField(paths.air, 0x9ad7ff));
  paths.power.forEach(pts => o.power.add(pathTube(pts, 0xffb15a, 0.0032)));
  paths.data.forEach(pts => o.data.add(pathTube(pts, 0x7dffe1, 0.0028)));
  o.air.visible = o.power.visible = o.data.visible = false;
  detail.add(o.air, o.power, o.data);
  detail.userData.overlays = o;
  return o;
}
function particleField(paths, color) {
  const g = new THREE.Group();
  const geom = new THREE.SphereGeometry(0.0045, 6, 6);
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.85, depthWrite: false });
  paths.forEach(pts => {
    const clean = dedupe(pts);
    if (clean.length < 2) return;
    const curve = new THREE.CatmullRomCurve3(clean);
    const n = 14;
    const mesh = new THREE.InstancedMesh(geom, mat, n);
    mesh.userData.curve = curve;
    mesh.userData.n = n;
    mesh.userData.phase = Math.random();
    mesh.raycast = () => {};
    g.add(mesh);
  });
  g.userData.kind = 'air';
  return g;
}
function pathTube(pts, color, radius) {
  const clean = dedupe(pts);
  const curve = new THREE.CatmullRomCurve3(clean);
  const c = document.createElement('canvas');
  c.width = 64; c.height = 8;
  const g = c.getContext('2d');
  g.clearRect(0, 0, 64, 8);
  g.fillStyle = '#' + color.toString(16).padStart(6, '0');
  g.fillRect(0, 0, 26, 8);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.repeat.set(6, 1);
  const mat = new THREE.MeshBasicMaterial({ map: tex, color, transparent: true, opacity: 0.9, depthWrite: false });
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 28, radius, 5, false), mat);
  mesh.raycast = () => {};
  return mesh;
}
function dedupe(pts) {
  const out = [pts[0].clone()];
  for (let i = 1; i < pts.length; i++) if (pts[i].distanceTo(out[out.length - 1]) > 0.005) out.push(pts[i].clone());
  if (out.length < 2) out.push(out[0].clone().add(new THREE.Vector3(0, 0.01, 0)));
  return out;
}
function hideOverlays(detail) {
  if (!detail || !detail.userData.overlays) return;
  const o = detail.userData.overlays;
  o.air.visible = false; o.power.visible = false; o.data.visible = false;
}
function syncOverlays() {
  if (!activeDetail) return;
  const o = ensureOverlays(activeDetail);
  o.air.visible = S.air;
  o.power.visible = S.power;
  o.data.visible = S.data;
}
function animateAir(dt, t) {
  if (!activeDetail || !S.air || !activeDetail.userData.overlays) return;
  const dummy = new THREE.Object3D();
  activeDetail.userData.overlays.air.children.forEach(mesh => {
    if (!mesh.userData.curve) return;
    const curve = mesh.userData.curve;
    for (let i = 0; i < mesh.userData.n; i++) {
      const u = (mesh.userData.phase + t * 0.18 + i / mesh.userData.n) % 1;
      const p = curve.getPointAt(u);
      dummy.position.copy(p);
      dummy.scale.setScalar(0.7 + 0.4 * Math.sin(u * Math.PI));
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
    }
    mesh.instanceMatrix.needsUpdate = true;
  });
}
function animateDashes(dt) {
  if (!activeDetail || !activeDetail.userData.overlays) return;
  ['power', 'data'].forEach(k => {
    if (!activeDetail.userData.overlays[k].visible) return;
    activeDetail.userData.overlays[k].children.forEach(m => {
      if (m.material && m.material.map) m.material.map.offset.x -= dt * 0.6;
    });
  });
}

function baseline(spec) {
  return {
    temps: spec.cpus.map(c => c.temp),
    gpu: spec.gpuTemp || 0,
    asic: spec.asicTemp || 0,
    mem: spec.memUsed,
    stor: spec.storageUsed,
    net: spec.netGbps,
    fan: spec.fanRPM,
    power: spec.power
  };
}
function sampleHealth(spec, t) {
  const b = live[spec.id];
  const wave = (amp, ph = 0) => Math.sin(t * 0.17 + ph) * amp + Math.sin(t * 0.05 + ph) * amp * 0.35;
  const k = S.failure && S.selectedId === spec.id ? Math.min(1, S.failT / 8) : 0;
  const temps = b.temps.map((v, i) => v + wave(0.8, i) + (S.failure === 'fan' && S.selectedId === spec.id ? (12 - i) * k : 0) + (S.failure === 'gpu' && S.selectedId === spec.id ? 2 * k : 0));
  let gpu = b.gpu + wave(0.7, 2);
  if (S.failure === 'gpu' && S.selectedId === spec.id) gpu += 24 * k;
  if (S.failure === 'fan' && S.selectedId === spec.id && spec.gpus) gpu += 8 * k;
  let fan = b.fan + wave(80, 1);
  if (S.failure === 'fan' && S.selectedId === spec.id) fan *= 1 + 0.28 * k;
  if (S.failure === 'gpu' && S.selectedId === spec.id) fan *= 1 + 0.22 * k;
  let power = b.power * (1 + wave(0.008, 0.4));
  if (S.failure === 'psu' && S.selectedId === spec.id) power *= 1 + 0.03 * k;
  if (S.failure === 'gpu' && S.selectedId === spec.id && gpu > 92) power *= 1 - 0.08 * k;
  let net = Math.max(0, b.net + wave(b.net * 0.03, 1.2));
  if (S.failure === 'nic' && S.selectedId === spec.id) net *= 1 - 0.46 * k;
  return {
    temps, gpu, asic: b.asic + wave(0.5, 0.6),
    mem: Math.min(spec.ramTotal, Math.max(0, b.mem + wave(spec.ramTotal * 0.004, 0.2))),
    stor: b.stor,
    net, fan, power
  };
}

function paintFailure() {
  const spec = SPEC_BY[S.selectedId];
  if (!spec) return;
  const applyTo = (root) => {
    if (!root) return;
    root.traverse(o => {
      if (o.userData && o.userData.statusLed) {
        const led = o.userData.statusLed;
        const role = o.userData.role;
        const index = o.userData.index;
        let hex = led.userData.baseHex || 0x39ff88;
        let inten = 1.3;
        if (S.failure === 'fan' && role === 'fan' && index === 2) { hex = 0xff3b30; o.userData.failed = true; }
        else if (role === 'fan') o.userData.failed = false;
        if (S.failure === 'psu' && role === 'psu' && index === 0) { hex = 0xff3b30; inten = 1.6; }
        if (S.failure === 'psu' && role === 'psu' && index !== 0) { hex = 0xffb020; }
        if (S.failure === 'drive' && role === 'drive' && index === 1) { hex = 0xff3b30; }
        if (S.failure === 'gpu' && role === 'gpu' && index === 3) { hex = 0xff5a2a; }
        if (S.failure === 'nic' && role === 'nic' && index === 0) { hex = 0x221111; inten = 0.1; }
        if (!S.failure) {
          hex = led.userData.baseHex || 0x39ff88;
          if (role === 'fan') o.userData.failed = false;
        }
        led.material.emissive.setHex(hex);
        led.material.emissiveIntensity = inten;
        if (o.userData.faultLed) {
          const badDrive = S.failure === 'drive' && role === 'drive' && index === 1;
          o.userData.faultLed.material.emissive.setHex(badDrive ? 0xff3b30 : 0x14301c);
          o.userData.faultLed.material.emissiveIntensity = badDrive ? 1.8 : 0.2;
        }
      }
      if (o.userData && o.userData.ledRole && o.userData.ledRole !== 'fan' && o.material && o.material.emissive) {
        const role = o.userData.ledRole;
        const index = o.userData.ledIndex;
        let hex = o.userData.baseHex || 0x39ff88;
        let inten = 1.2;
        if (S.failure === 'psu' && role === 'psu' && index === 0) { hex = 0xff3b30; inten = 1.6; }
        if (S.failure === 'psu' && role === 'psu' && index !== 0) { hex = 0xffb020; }
        if (S.failure === 'nic' && role === 'nic') { hex = 0x221111; inten = 0.08; }
        if (S.failure && role === 'health') { hex = 0xff3b30; }
        if (!S.failure && role === 'health') hex = 0x39ff88;
        o.material.emissive.setHex(hex);
        o.material.emissiveIntensity = inten;
      }
    });
  };
  applyTo(rigById[spec.id] && rigById[spec.id].userData.shell);
  if (activeDetail && activeDetail.userData.spec.id === spec.id) applyTo(activeDetail);
  const shell = rigById[spec.id].userData.shell;
  if (shell.userData.healthLed) {
    const bad = !!S.failure;
    shell.userData.healthLed.material.emissive.setHex(bad ? 0xff3b30 : 0x39ff88);
  }
  if (activeDetail && activeDetail.userData.lcd) paintLCD(activeDetail.userData.lcd, S.failure ? 'FAULT' : 'OK');
}

function selectServer(id, frame) {
  S.selectedId = id;
  S.component = null;
  if (frame && S.mode === 'rack') {
    const spec = SPEC_BY[id];
    const y = RACK.mountY + (spec.uStart + spec.u / 2 - 0.5) * U_H;
    const cam = rackCam('threequarter');
    const tgt = new THREE.Vector3(0, y, 0.1);
    const pos = tgt.clone().add(new THREE.Vector3(1.5, 0.35, 1.7).normalize().multiplyScalar(2.4));
    playCam(pos, tgt, 0.7);
  }
  updateUI();
}
function stepServer(dir) {
  const i = SPECS.findIndex(s => s.id === S.selectedId);
  const n = SPECS[(i + dir + SPECS.length) % SPECS.length];
  S.selectedId = n.id;
  S.component = null;
  S.failure = null;
  if (S.mode === 'slice' && S.phase === 'idle' && !TR) {
    if (activeDetail) {
      hideOverlays(activeDetail);
      scene.remove(activeDetail);
    }
    const detail = getDetail(n.id);
    detail.position.set(0, 1.06, 0);
    detail.quaternion.identity();
    S.coverNow = 1;
    S.explodeNow = S.explode;
    applyExplode(detail, S.explodeNow);
    setCover(detail, 1);
    applyCutaway(detail, S.cutNow);
    scene.add(detail);
    activeDetail = detail;
    syncOverlays();
    paintFailure();
    focusPreset('whole');
  }
  updateUI();
}

let downXY = null;
function onDown(e) { downXY = [e.clientX, e.clientY]; }
function onUp(e) {
  if (!downXY || TR || S.phase !== 'idle') return;
  const dx = e.clientX - downXY[0], dy = e.clientY - downXY[1];
  if (dx * dx + dy * dy > 16) return;
  const hit = pick(e);
  if (S.mode === 'rack') {
    if (hit && hit.userData.serverId) selectServer(hit.userData.serverId, false);
  } else if (hit) {
    S.component = hit;
    updateUI();
    fitHelper(selBox, hit);
  } else {
    S.component = null;
    updateUI();
  }
}
function onMove(e) {
  if (TR) return;
  const hit = pick(e);
  S.hover = hit;
  document.body.style.cursor = hit ? 'pointer' : 'default';
}
function pick(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width) * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1
  );
  const ray = new THREE.Raycaster();
  ray.setFromCamera(ndc, camera);
  const roots = S.mode === 'slice' && activeDetail ? [activeDetail] : Object.values(rigById).map(r => r.userData.shell);
  const hits = ray.intersectObjects(roots, true);
  for (const h of hits) {
    let o = h.object;
    while (o) {
      if (o.userData && (o.userData.selectable || o.userData.serverId)) return o;
      o = o.parent;
    }
  }
  return null;
}
function onKey(e) {
  if (e.key === 'Escape') {
    if (S.mode === 'slice') returnToRack();
    else { S.component = null; updateUI(); }
  } else if (e.key === '1') S.mode === 'slice' ? focusPreset('whole') : focusRack('front');
  else if (e.key === '2') S.mode === 'slice' ? focusPreset('top') : focusRack('threequarter');
  else if (e.key === '3') S.mode === 'slice' ? focusPreset('eng') : focusRack('side');
  else if (e.key === '4') S.mode === 'slice' ? focusPreset('rear') : focusRack('rear');
  else if (e.key === '[') stepServer(-1);
  else if (e.key === ']') stepServer(1);
  else if (e.key === 'o' || e.key === 'O') { if (S.mode === 'slice') { S.cover = S.cover > 0.5 ? 0 : 1; updateUI(); } }
  else if (e.key === 'e' || e.key === 'E') { if (S.mode === 'slice') { S.explode = S.explode > 0.5 ? 0 : 1; updateUI(); } }
  else if (e.key === 'c' || e.key === 'C') { if (S.mode === 'slice') { S.cutaway = S.cutaway > 0.5 ? 0 : 1; updateUI(); } }
}

function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - (loop.last || now)) / 1000);
  loop.last = now;
  const t = now / 1000;
  if (TR) {
    TR.t += dt;
    const k = Math.min(1, TR.t / TR.dur);
    const e = k * k * (3 - 2 * k);
    TR.fn(e);
    if (k >= 1) {
      const done = TR.done;
      TR = null;
      if (done) done();
    }
  }
  if (activeDetail) {
    S.coverNow += (S.cover - S.coverNow) * Math.min(1, dt * 4);
    S.explodeNow += (S.explode - S.explodeNow) * Math.min(1, dt * 3.2);
    S.cutNow += (S.cutaway - S.cutNow) * Math.min(1, dt * 5);
    applyExplode(activeDetail, S.explodeNow);
    applyCutaway(activeDetail, S.cutNow);
    activeDetail.userData.fanList.forEach(f => {
      const boost = (S.failure === 'fan' || S.failure === 'gpu') && S.selectedId === activeDetail.userData.spec.id ? 1.3 : 1;
      if (!f.userData.failed) f.userData.blades.rotation.z += dt * f.userData.speed * boost;
    });
  }
  if (S.phase === 'closing' && S.coverNow < 0.03 && S.explodeNow < 0.03 && !TR) startRejoin();
  if (S.failure) S.failT += dt;
  animateAir(dt, t);
  animateDashes(dt);
  shellLeds.forEach((led, i) => {
    if (!led.material) return;
    const pulse = 0.65 + Math.sin(t * 3 + i) * 0.35;
    if (led.material.emissiveIntensity > 0.4) led.material.emissiveIntensity = pulse * 1.3;
  });
  if (S.hover && S.hover !== S.component) fitHelper(hoverBox, S.hover);
  else hoverBox.visible = false;
  if (S.component) fitHelper(selBox, S.component);
  else if (S.mode === 'rack' && S.selectedId && rigById[S.selectedId]) fitHelper(selBox, rigById[S.selectedId].userData.shell);
  else selBox.visible = false;
  controls.update();
  renderer.render(scene, camera);
  fpsAcc += dt; fpsN++;
  if (fpsAcc >= 0.4) {
    fpsVal = fpsN / fpsAcc;
    fpsN = 0; fpsAcc = 0;
    document.getElementById('fps').textContent = fpsVal.toFixed(0);
    document.getElementById('draws').textContent = String(renderer.info.render.calls);
    const tris = renderer.info.render.triangles;
    document.getElementById('tris').textContent = tris > 1000000 ? (tris / 1000000).toFixed(2) + 'M' : tris > 1000 ? (tris / 1000).toFixed(1) + 'k' : String(tris);
  }
  healthT += dt;
  if (healthT > 0.45) { healthT = 0; paintHealth(); }
}

      <p class="note">Airflow, power, and data overlays are teaching diagrams. They are routed around the solid zones, but they are not CFD and they are not PCB traces. Power figures are operating estimates, not nameplate and not measurements. Comparison bars are architectural emphasis, not benchmarks.</p>
    </div>`;
  document.getElementById('closeHelp').onclick = () => document.getElementById('helpModal').classList.remove('show');
}

function btn(id, label) { return `<button class="tool" data-act="${id}" id="act-${id}">${label}</button>`; }
function camBtn(id, label) { return `<button class="cam" data-act="cam" data-cam="${id}">${label}</button>`; }

function onTool(e) {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'rack') {
    if (S.mode === 'slice') returnToRack();
    else focusRack('threequarter');
  } else if (act === 'slice') goSlice();
  else if (act === 'cover' && S.mode === 'slice') { S.cover = S.cover > 0.5 ? 0 : 1; }
  else if (act === 'cut' && S.mode === 'slice') S.cutaway = S.cutaway > 0.5 ? 0 : 1;
  else if (act === 'explode' && S.mode === 'slice') S.explode = S.explode > 0.5 ? 0 : 1;
  else if (act === 'air' && S.mode === 'slice') S.air = !S.air;
  else if (act === 'power' && S.mode === 'slice') S.power = !S.power;
  else if (act === 'data' && S.mode === 'slice') S.data = !S.data;
  else if (act === 'fail') document.getElementById('failPop').classList.toggle('show');
  else if (act === 'compare') showCompare();
  else if (act === 'help') document.getElementById('helpModal').classList.add('show');
  else if (act === 'reset') resetAll();
  else if (act === 'prev') stepServer(-1);
  else if (act === 'next') stepServer(1);
  else if (act === 'cam') focusPreset(b.dataset.cam);
  syncOverlays();
  updateUI();
}

function resetAll() {
  if (TR) return;
  S.failure = null;
  S.failT = 0;
  S.air = S.power = S.data = false;
  S.explode = 0;
  S.cutaway = 0;
  S.cover = S.mode === 'slice' ? 1 : 0;
  S.component = null;
  setDoors(true);
  setSides(true);
  paintFailure();
  if (activeDetail) hideOverlays(activeDetail);
  if (S.mode === 'slice') focusPreset('whole');
  else focusRack('threequarter');
  updateUI();
}

function showCompare() {
  const rows = [
    ['cpu', 'CPU capability'], ['gpu', 'GPU capability'], ['mem', 'Memory capacity'],
    ['storage', 'Storage capacity'], ['net', 'Network capability'], ['power', 'Power consumption'],
    ['cooling', 'Cooling requirement'], ['complexity', 'Implementation complexity']
  ];
  const prim = ['cn-01', 'hv-a', 'ai-01', 'obj-01', 'db-01'].map(id => SPEC_BY[id]);
  const cols = prim.map(s => `<div class="col"><h4>${esc(s.archetypeLabel)}</h4><div class="note" style="min-height:48px">${esc(s.designPriority)}</div>` +
    rows.map(([k, label]) => `<div class="mrow"><label><span>${label}</span><span>${s.scores[k]}</span></label><div class="track"><i style="width:${s.scores[k] * 10}%"></i></div></div>`).join('') +
    `</div>`).join('');
  document.getElementById('compareModal').innerHTML = `<div class="sheet">
    <header class="mh"><div><div class="kicker">Architectural emphasis</div><h3 style="margin:4px 0">Archetype comparison</h3></div>
    <button class="tool" id="closeCmp">Close</button></header>
    <p class="note">These bars compare design emphasis inside this lab only. They are not benchmark scores, not SPEC results, and not measured throughput.</p>
    <div class="cols">${cols}</div>
  </div>`;
  document.getElementById('compareModal').classList.add('show');
  document.getElementById('closeCmp').onclick = () => document.getElementById('compareModal').classList.remove('show');
}

function updateUI() {
  Object.values(rigById).forEach(r => {
    const on = S.mode === 'rack' && r.userData.spec.id === S.selectedId;
    (r.userData.marks || []).forEach(m => { m.visible = on; });
  });
  document.body.classList.toggle('slice', S.mode === 'slice');
  document.getElementById('modepill').textContent = S.mode === 'slice' ? 'SINGLE SLICE' : 'FULL RACK';
  const setActive = (id, on) => { const n = document.getElementById(id); if (n) n.classList.toggle('active', !!on); };
  setActive('act-rack', S.mode === 'rack');
  setActive('act-slice', S.mode === 'slice');
  setActive('act-cover', S.mode === 'slice' && S.cover > 0.5);
  setActive('act-cut', S.cutaway > 0.5);
  setActive('act-explode', S.explode > 0.5);
  setActive('act-air', S.air);
  setActive('act-power', S.power);
  setActive('act-data', S.data);
  setActive('act-fail', !!S.failure);
  const coverBtn = document.getElementById('act-cover');
  if (coverBtn) {
    coverBtn.textContent = S.cover > 0.5 ? 'Close Cover' : 'Open Cover';
    coverBtn.disabled = S.mode !== 'slice';
  }
  ['act-cut', 'act-explode', 'act-air', 'act-power', 'act-data'].forEach(id => {
    const n = document.getElementById(id); if (n) n.disabled = S.mode !== 'slice';
  });
  const spec = SPEC_BY[S.selectedId];
  const idx = SPECS.findIndex(s => s.id === S.selectedId);
  const line = document.getElementById('srvline');
  if (line && spec) line.innerHTML = `<strong>SERVER ${String(idx + 1).padStart(2, '0')} / ${String(SPECS.length).padStart(2, '0')}</strong> ${esc(spec.name)} · ${spec.u}U · U${spec.uStart}–U${spec.uStart + spec.u - 1}`;
  document.querySelectorAll('#slicebar .cam').forEach(b => {
    const cam = b.dataset.cam;
    const focus = spec && layoutFor(spec).focus;
    if (cam === 'gpu') b.disabled = !(focus && focus.gpu);
    if (cam === 'storage') b.disabled = !(focus && focus.storage);
    b.classList.toggle('active', S.cam === cam && S.mode === 'slice');
  });
  renderLeft();
  renderRight();
}

function renderLeft() {
  const spec = SPEC_BY[S.selectedId];
  const cams = S.mode === 'slice'
    ? ''
    : `<div class="camrow">
        <button class="cam" id="cf">Full Rack Front</button>
        <button class="cam" id="c34">Full Rack 3/4</button>
        <button class="cam" id="cs">Full Rack Side</button>
        <button class="cam" id="cr">Full Rack Rear</button>
      </div>`;
  const occ = Array(43).fill(null);
  SPECS.forEach(s => { for (let u = s.uStart; u < s.uStart + s.u; u++) occ[u] = s; });
  BLANKS.forEach(u => { if (!occ[u]) occ[u] = 'blank'; });
  let map = '';
  for (let u = 42; u >= 1;) {
    const item = occ[u];
    if (item && item !== 'blank') {
      const top = item.uStart + item.u - 1;
      if (u === top) {
        map += `<div class="ublock ${item.id === S.selectedId ? 'sel' : ''}" data-id="${item.id}" style="min-height:${item.u * 14}px;border-left-color:var(--amber)">
          <span class="un">U${top}${item.u > 1 ? '–' + item.uStart : ''}</span>
          <span><i class="sw ${ARCH_CLASS[item.archetype]}"></i>${esc(item.short)} · ${item.u}U</span></div>`;
        u = item.uStart - 1;
        continue;
      }
    }
    if (item === 'blank') map += `<div class="ublock blank"><span class="un">U${u}</span><span>Blanking</span></div>`;
    else map += `<div class="ublock empty"><span class="un">U${u}</span><span></span></div>`;
    u--;
  }
  const maxP = Math.max(...SPECS.map(s => s.power));
  const total = SPECS.reduce((a, s) => a + s.power, 0);
  const btu = Math.round(total * 3412);
  const powers = SPECS.map(s => `<div class="prow"><span>${esc(s.short)}</span><span>${s.power.toFixed(2)} kW</span></div><div class="bar"><i style="width:${(s.power / maxP) * 100}%"></i></div>`).join('');
  const parts = S.mode === 'slice' && activeDetail ? renderParts(activeDetail) : '';
  document.getElementById('left').innerHTML = `
    <h2>Camera</h2>
    ${S.mode === 'rack' ? cams : '<p class="note">Slice presets are on the bottom bar. Orbit, zoom, and pan remain available.</p>'}
    <h2>Rack options</h2>
    <div class="optrow">
      <button class="mini" id="doorBtn">${S.doorsOpen ? 'Close Doors' : 'Open Doors'}</button>
      <button class="mini" id="sideBtn">${S.sides ? 'Remove Side Panels' : 'Fit Side Panels'}</button>
    </div>
    <h2>Rack A-14 elevation</h2>
    <div class="rmap">${map}</div>
    <p class="note" style="margin-top:6px">Blanking panels stop cold air bypassing the load and recirculating. Empty U space is intentional, not unfinished.</p>
    ${parts ? `<h2>Slice parts</h2><div class="parts">${parts}</div>` : ''}
    <h2>Rack power</h2>
    <div class="powerlist">${powers}</div>
    <div class="total"><span>TOTAL</span><span>${total.toFixed(2)} kW</span></div>
    <div class="heat"><b>Estimated heat output ${total.toFixed(2)} kW · ${btu.toLocaleString()} BTU/h</b><br>Nearly every watt drawn by the rack becomes heat the room cooling system has to remove. Nameplate PSU watts are higher than these operating estimates and are not a breaker design.</div>
  `;
  const left = document.getElementById('left');
  left.querySelectorAll('.ublock[data-id]').forEach(n => n.onclick = () => selectServer(n.dataset.id, S.mode === 'rack'));
  const cf = document.getElementById('cf'); if (cf) cf.onclick = () => focusRack('front');
  const c34 = document.getElementById('c34'); if (c34) c34.onclick = () => focusRack('threequarter');
  const cs = document.getElementById('cs'); if (cs) cs.onclick = () => focusRack('side');
  const cr = document.getElementById('cr'); if (cr) cr.onclick = () => focusRack('rear');
  document.getElementById('doorBtn').onclick = () => { setDoors(!S.doorsOpen); updateUI(); };
  document.getElementById('sideBtn').onclick = () => { setSides(!S.sides); updateUI(); };
  left.querySelectorAll('.parts button.link').forEach(n => n.onclick = () => {
    const obj = activeDetail.userData.selectables.find(o => o.uuid === n.dataset.uuid);
    if (obj) { S.component = obj; updateUI(); }
  });
}
function renderParts(detail) {
  const groups = {};
  detail.userData.selectables.forEach(o => {
    const cat = o.userData.category || 'Other';
    if (cat === 'Memory' || cat === 'Storage' && o.userData.role === 'drive') {
      groups[cat] = groups[cat] || [];
      groups[cat].push(o);
    } else {
      groups[cat] = groups[cat] || [];
      if (groups[cat].length < 12) groups[cat].push(o);
    }
  });
  return Object.keys(groups).map(cat => {
    const items = groups[cat];
    const shown = items.slice(0, cat === 'Memory' || cat === 'Storage' ? 6 : 12);
    const more = items.length - shown.length;
    return `<details ${cat === 'Compute' || cat === 'Accelerator' || cat === 'Power' ? 'open' : ''}><summary>${esc(cat)} (${items.length})</summary>` +
      shown.map(o => `<button class="link ${S.component === o ? 'on' : ''}" data-uuid="${o.uuid}">${esc(o.userData.title)}</button>`).join('') +
      (more > 0 ? `<div class="note" style="padding-left:8px">+${more} more in the 3D view</div>` : '') +
      `</details>`;
  }).join('');
}

function renderRight() {
  const spec = SPEC_BY[S.selectedId];
  if (!spec) {
    document.getElementById('right').innerHTML = '<p class="note">Select a server.</p>';
    return;
  }
  const uEnd = spec.uStart + spec.u - 1;
  const dimmSlots = spec.cpus.reduce((a, c) => a + c.slotsF + c.slotsR, 0);
  const dimmPop = spec.cpus.reduce((a, c) => a + c.popF + c.popR, 0);
  const psuW = spec.psus.reduce((a, p) => a + p.watt, 0);
  const feeds = spec.psus.map((p, i) => 'PSU' + (i + 1) + '→PDU-' + p.feed).join(' · ');
  const comp = S.component && S.component.userData.info ? S.component : null;
  const failText = failureText(spec);
  document.getElementById('right').innerHTML = `
    <div class="banner ${failText ? 'show' : ''}" id="failBanner">${failText || ''}</div>
    <div class="card">
      <div class="kicker">${esc(spec.archetypeLabel)}</div>
      <h3>${esc(spec.name)}</h3>
      <div class="kv">
        <span>Rack position</span><div>U${spec.uStart}–U${uEnd}</div>
        <span>Height</span><div>${spec.u}U · ${(spec.u * 44.45).toFixed(2)} mm</div>
        <span>Purpose</span><div>${esc(spec.purpose)}</div>
        <span>Priority</span><div>${esc(spec.designPriority)}</div>
        <span>CPUs</span><div>${spec.cpus.map(c => c.cores + '-core / ' + c.tdp + ' W').join(' + ')}</div>
        <span>Memory</span><div>${dimmPop} / ${dimmSlots} slots · ${spec.ramTotal} GB ${esc(spec.dimmType)}</div>
        <span>Accelerators</span><div>${spec.gpus ? spec.gpus + ' × ' + spec.gpuTdp + ' W class' : 'None'}</div>
        <span>Storage</span><div>${spec.drives.count ? spec.drives.count + ' × ' + esc(spec.drives.label) : 'Boot media only'}</div>
        <span>Network</span><div>${esc(spec.nicLabel)}</div>
        <span>PSUs</span><div>${spec.psus.length} × up to ${spec.psus[0].watt} W · ${feeds}</div>
        <span>PSU nameplate</span><div>${(psuW / 1000).toFixed(1)} kW installed, not the operating draw</div>
        <span>Operating est.</span><div>${spec.power.toFixed(2)} kW</div>
      </div>
      <p class="why">${esc(spec.why)}</p>
      ${S.mode === 'rack' ? '<button class="tool" id="inspectBtn" style="margin-top:10px">Inspect Slice</button>' : '<button class="tool" id="returnBtn" style="margin-top:10px">Return to Rack</button>'}
    </div>
    <div class="card" id="healthCard"><div class="kicker">Health</div><div id="healthBody"></div></div>
    <div class="card" id="compCard" style="${comp ? '' : 'display:none'}">
      <div class="kicker">${comp ? esc(comp.userData.category) : ''}</div>
      <h3 style="font-size:15px">${comp ? esc(comp.userData.title) : ''}</h3>
      <div class="kv">${comp ? Object.entries(comp.userData.info).map(([k, v]) => `<span>${esc(k)}</span><div>${esc(v)}</div>`).join('') : ''}</div>
    </div>
    <div class="card" id="overlayNote">
      <div class="kicker">Overlays</div>
      <p class="why" id="overlayText"></p>
      <div class="legend"><span class="c-air"><b>Air</b> particles</span><span class="c-pwr"><b>Power</b> amber</span><span class="c-data"><b>Data</b> mint</span></div>
    </div>
  `;
  const ib = document.getElementById('inspectBtn');
  if (ib) ib.onclick = () => goSlice();
  const rb = document.getElementById('returnBtn');
  if (rb) rb.onclick = () => returnToRack();
  paintHealth();
  const ot = document.getElementById('overlayText');
  if (ot) {
    const bits = [];
    if (S.air) bits.push(spec.airStory);
    if (S.power) bits.push('Power overlay: AC inlet at the PSU rear, through the supply, then to the motherboard VRMs' + (spec.gpus ? ', the 48 V accelerator bus,' : '') + (spec.archetype === 'storage' ? ', the drive backplane,' : '') + ' and local loads. Redundant supplies are drawn as parallel sources, not a single cord.');
    if (S.data) bits.push(spec.dataStory);
    if (!bits.length) bits.push('Enable Airflow, Power, or Data in the toolbar. Paths are conceptual and follow the mechanical zones of this archetype.');
    ot.textContent = bits.join(' ');
  }
}
function paintHealth() {
  const host = document.getElementById('healthBody');
  const spec = SPEC_BY[S.selectedId];
  if (!host || !spec) return;
  const h = sampleHealth(spec, performance.now() / 1000);
  const rows = [];
  h.temps.forEach((v, i) => rows.push(sensor(spec.cpus[i].name, v.toFixed(0) + '°C', v / 105, v > 90 ? 'bad' : v > 80 ? 'warn' : '')));
  if (spec.gpus) rows.push(sensor('GPU average', h.gpu.toFixed(0) + '°C', h.gpu / 105, h.gpu > 92 ? 'bad' : h.gpu > 84 ? 'warn' : ''));
  if (spec.asic) rows.push(sensor('Switch ASIC', h.asic.toFixed(0) + '°C', h.asic / 105, h.asic > 90 ? 'warn' : ''));
  rows.push(sensor('Memory', Math.round(h.mem) + ' / ' + spec.ramTotal + ' GB', h.mem / spec.ramTotal, ''));
  if (spec.storageTB > 1) rows.push(sensor('Storage', h.stor.toFixed(1) + ' / ' + spec.storageTB + ' TB', h.stor / spec.storageTB, S.failure === 'drive' && S.selectedId === spec.id ? 'warn' : ''));
  rows.push(sensor('Network', h.net.toFixed(1) + ' Gbit/s', Math.min(1, h.net / spec.netCap), S.failure === 'nic' && S.selectedId === spec.id ? 'bad' : ''));
  rows.push(sensor('Fans', Math.round(h.fan).toLocaleString() + ' RPM', Math.min(1, h.fan / (spec.fanRPM * 1.45)), S.failure === 'fan' && S.selectedId === spec.id ? 'warn' : ''));
  rows.push(sensor('Power', h.power.toFixed(2) + ' kW', Math.min(1, h.power / (spec.power * 1.35)), ''));
  if (S.failure === 'drive' && S.selectedId === spec.id) rows.push(sensor('Array', 'DEGRADED', 0.7, 'warn'));
  if (S.failure === 'psu' && S.selectedId === spec.id) rows.push(sensor('Power path', 'REDUNDANCY LOST', 0.85, 'bad'));
  host.innerHTML = rows.join('');
}
function sensor(label, value, pct, cls) {
  return `<div class="sensor ${cls || ''}"><div class="sl"><span>${esc(label)}</span><span>${esc(value)}</span></div><div class="track"><i style="width:${Math.max(2, Math.min(100, pct * 100))}%"></i></div></div>`;
}
function failureText(spec) {
  if (!S.failure || S.selectedId !== spec.id) return '';
  if (S.failure === 'fan') return 'Fan 3 stopped. Neighbors ramp RPM to hold the pressure budget. Temperatures climb because the same heat now crosses less air. A BMC should page on lost fan redundancy before a thermal trip. The 3D blades on the failed module are stopped; the health LED is latched red.';
  if (S.failure === 'psu') return 'PSU 1 is offline and its LED is red. The host stays up if the surviving supplies can carry the operating load — that is the entire point of an A/B feed split. Their share of current rises. A second loss on the same feed is a different, worse event. Watch the GPU node: 2+2 only protects a feed failure if two PSUs can cover the draw.';
  if (S.failure === 'drive') return 'Bay 2 reports a failed drive. The carrier fault LED is latched. A redundant pool goes degraded, not offline. The backplane port stays powered so a replacement can be seated from the front without opening the motherboard zone. Rebuild traffic is why storage networks and HBAs are sized for more than the steady client load.';
  if (S.failure === 'gpu') return spec.gpus ? 'Accelerator 4 is climbing toward throttle. Fans go to a higher command. If the inlet or a dead fan is the cause, clocks drop and the BMC may power-brake the board. The large fan wall and the open intake exist for this case, not for looks.' : '';
  if (S.failure === 'nic') return 'Primary data link is down and that port LED is dark. A dual-homed host should shift traffic to the remaining port. The BMC port is a different interface on purpose — losing the data plane should not also hide the machine from the operator.';
  return '';
}

try { init(); }
catch (err) {
  const vp = document.getElementById('viewport');
  vp.innerHTML = '<pre style="color:#fff;padding:16px;white-space:pre-wrap"></pre>';
  vp.querySelector('pre').textContent = String(err && err.stack || err);
}
</script>
</body>
</html>
