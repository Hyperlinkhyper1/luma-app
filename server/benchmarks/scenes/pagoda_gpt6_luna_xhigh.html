<body>
  <div id="hud"><div id="title">VOXEL GARDEN</div><div id="stats">Building the spring garden…</div><div id="subtitle">Spring Festival · Five-Story Pagoda</div></div>
  <div id="hint">Drag to orbit · scroll to zoom<br>Click a lantern or pagoda floor</div>
  <div id="clock"><label for="daylight">Daylight</label><input id="daylight" type="range" min="0" max="1" step="0.001" value="0.31" aria-label="Control daylight cycle"><time id="clockLabel">07:26</time></div>
  <div id="signature">Ukiyo-e · Monument Valley · Luma</div>
  <div id="error" role="alert">This scene needs WebGL and a connection to load Three.js r160.</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const PALETTE={vermillion:0xc73e1d,gold:0xe8b86d,teak:0x4a2c1a,jade:0x2d6a4f,jadeLight:0x40916c,sakura:0xffb7c5,sakuraBright:0xff8fab,sakuraPale:0xffe5ec,stone:0x9aa0a6,pond:0x7ed6df,moss:0x606c38,leaf:0x53794a,deepLeaf:0x314f3d,soil:0x423a32,cream:0xf3d9b2};
    const COLORS={dawn:0xe9ae91,day:0x9bcad1,dusk:0xdb8f82,night:0x2b4059};
    const scene=new THREE.Scene();
    scene.background=new THREE.Color(COLORS.day);
    scene.fog=new THREE.Fog(COLORS.day,72,155);

    const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,260);
    camera.position.set(0,5,38);
    const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
    renderer.setSize(innerWidth,innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
    renderer.shadowMap.enabled=true;
    renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    renderer.toneMapping=THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure=1.18;
    renderer.outputColorSpace=THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls=new OrbitControls(camera,renderer.domElement);
    controls.target.set(0,11,-1);
    controls.enableDamping=true;
    controls.dampingFactor=.055;
    controls.minDistance=26;
    controls.maxDistance=112;
    controls.maxPolarAngle=Math.PI*.48;
    controls.autoRotate=false;
    controls.autoRotateSpeed=.2;
    const hemi=new THREE.HemisphereLight(0xffe8ce,0x34483f,1.48);
    scene.add(hemi);
    const sun=new THREE.DirectionalLight(0xffe5c2,2.8);
    sun.position.set(-34,56,30);
    sun.castShadow=true;
    sun.shadow.mapSize.set(2048,2048);
    sun.shadow.autoUpdate=false;
    sun.shadow.needsUpdate=true;
    Object.assign(sun.shadow.camera,{left:-54,right:54,top:54,bottom:-54,near:1,far:145});
    sun.shadow.bias=-.00028;
    sun.shadow.normalBias=.035;
    scene.add(sun);

    const world=new THREE.Group();
    scene.add(world);
    const unitBox=new THREE.BoxGeometry(1,1,1);
    const matrixHelper=new THREE.Object3D();
    const batches=new Map();
    const groupRoots=new Map();
    const materialCache=new Map();
    let activeScope=null;
    let placedVoxels=0;
    let pagodaVoxels=0;
    const countByKind={};
    let randomSeed=7130922;
    function random(){randomSeed=(randomSeed*1664525+1013904223)>>>0;return randomSeed/4294967296}
    function colorFor(color,shade){return new THREE.Color(color).multiplyScalar(shade).getHex()}
    function voxel(color,x,y,z,sx=1,sy=1,sz=1,kind='garden',glow=false,shade=1){
      const tint=colorFor(color,shade);
      const scopeId=activeScope?activeScope.id:'world';
      const castShadow=!['terrain','island-rock','floating-island','floating-island-rock','floating-island-flora','flower','waterfall','petals','pond-edge'].includes(kind);
      const key=scopeId+':'+tint+':'+(glow?'g':'n')+':'+(castShadow?'s':'n');
      let batch=batches.get(key);
      if(!batch){batch={color:tint,glow:glow,castShadow:castShadow,scopeId:scopeId,items:[]};batches.set(key,batch)}
      batch.items.push([x,y,z,sx,sy,sz]);
      placedVoxels++;
      countByKind[kind]=(countByKind[kind]||0)+1;
      if(kind==='pagoda')pagodaVoxels++;
    }
    function standardMaterial(color,glow){
      const key=color+':'+glow;
      if(!materialCache.has(key)){
        const tint=new THREE.Color(color);
        materialCache.set(key,new THREE.MeshStandardMaterial({color:tint,roughness:.79,metalness:glow?.12:0,emissive:glow?tint:0x000000,emissiveIntensity:glow?1.55:0}));
      }
      return materialCache.get(key);
    }
    function flushVoxels(){
      for(const batch of batches.values()){
        const root=batch.scopeId==='world'?world:groupRoots.get(batch.scopeId);
        const mesh=new THREE.InstancedMesh(unitBox,standardMaterial(batch.color,batch.glow),batch.items.length);
        mesh.castShadow=batch.castShadow;
        mesh.receiveShadow=true;
        mesh.instanceMatrix.setUsage(THREE.StaticDrawUsage);
        for(let i=0;i<batch.items.length;i++){
          const item=batch.items[i];
          matrixHelper.position.set(item[0],item[1],item[2]);
          matrixHelper.scale.set(item[3],item[4],item[5]);
          matrixHelper.updateMatrix();
          mesh.setMatrixAt(i,matrixHelper.matrix);
        }
        mesh.instanceMatrix.needsUpdate=true;
        root.add(mesh);
      }
      batches.clear();
    }
    function beginAnimatedGroup(id,x=0,y=0,z=0){
      const group=new THREE.Group();
      group.position.set(x,y,z);
      group.name=id;
      world.add(group);
      groupRoots.set(id,group);
      activeScope={id:id,group:group};
      return group;
    }
    function endAnimatedGroup(){activeScope=null}

    // Main 64 × 64 ground grid. Its irregular perimeter continues downward
    // into a layered rock island so the garden truly floats above the clouds.
    const GRID=64;
    function islandEdge(x,z,base){const a=Math.atan2(z,x);return base+1.12*Math.sin(a*5+.4)+.64*Math.cos(a*9-1.1)+.36*Math.sin(a*13)}
    function inMainIsland(x,z,radius){return Math.hypot(x,z)<islandEdge(x,z,radius)}
    for(let iz=0;iz<GRID;iz++)for(let ix=0;ix<GRID;ix++){
      const x=ix-31.5,z=iz-31.5;
      if(!inMainIsland(x,z,30.4))continue;
      const noise=Math.sin(x*.16+z*.12)*.045+Math.cos(z*.24-x*.09)*.025;
      const swatch=((ix*19+iz*31)%13===0)?0x73804b:(((ix*11+iz*7)%9===0)?0x3e7651:PALETTE.moss);
      voxel(swatch,x,-.42+noise,z,.96,.82,.96,'terrain',false,((ix+iz)%5===0)?1.06:1);
    }
    const rockColors=[0x514a43,0x655a4d,0x74695b,0x47433d,0x5c6253];
    const cliffRings=[30.2,28.9,27.3,25.4,23.1,20.4,17.2,13.4,9.3,5.3,1.7];
    for(let layer=0;layer<cliffRings.length-1;layer++){
      const outer=cliffRings[layer],inner=cliffRings[layer+1],y=-.98-layer*.88;
      for(let z=-31;z<=31;z++)for(let x=-31;x<=31;x++){
        const r=Math.hypot(x,z),edge=islandEdge(x,z,outer);
        if(r<=edge&&r>inner-1.1){
          if(random()<.88){const c=rockColors[(Math.abs(x*3+z*5+layer*7))%rockColors.length];voxel(c,x,y,z,.96,.88,.96,'island-rock',false,.91+random()*.17)}
        }
      }
    }

    // Five independent, progressively smaller stories. The double-layered
    // hip roofs use stepped voxel courses and swept corner eaves.
    const PAGODA_X=0,PAGODA_Z=-1;
    const floorBases=[.18,4.45,8.42,12.10,15.52];
    const floorHeights=[3.58,3.30,3.02,2.80,2.48];
    const wallHalf=[4.05,3.45,2.90,2.38,1.91];
    const roofHalf=[6.15,5.33,4.58,3.88,3.22];
    const frontZ=1;
    function pagodaBlock(c,x,y,z,sx=1,sy=1,sz=1,glow=false,shade=1){voxel(c,PAGODA_X+x,y,PAGODA_Z+z,sx,sy,sz,'pagoda',glow,shade)}
    // Stone foundation and a warm, visible interior plinth.
    for(let z=-5;z<=5;z++)for(let x=-5;x<=5;x++){
      if(Math.max(Math.abs(x),Math.abs(z))<5)pagodaBlock(0x77766a,x*.9,.15,z*.9,.88,.34,.88,false,((x+z)%4===0)?1.08:1);
    }
    pagodaBlock(PALETTE.gold,0,.42,0,8.9,.24,8.9,false,1.08);
    for(let floor=0;floor<5;floor++){
      const base=floorBases[floor],h=floorHeights[floor],half=wallHalf[floor],roof=roofHalf[floor];
      const storyTint=floor%2===0?PALETTE.vermillion:0xb7361d;
      // Balcony planks, perimeter rail, and deep teak structure.
      const balcony=half+.72;
      for(let i=-Math.ceil(balcony*2);i<=Math.ceil(balcony*2);i++){
        const p=i*.48;if(Math.abs(p)>balcony)continue;
        pagodaBlock(PALETTE.teak,p,base+.12,-balcony,.48,.22,.48,false,.9);
        pagodaBlock(PALETTE.teak,p,base+.12,balcony,.48,.22,.48,false,.9);
        pagodaBlock(PALETTE.teak,-balcony,base+.12,p,.48,.22,.48,false,.9);
        pagodaBlock(PALETTE.teak,balcony,base+.12,p,.48,.22,.48,false,.9);
      }
      const postYs=Math.max(3,Math.ceil(h/.55));
      for(let side=-1;side<=1;side++)for(const sign of [-1,1]){
        const coord=side*half;
        for(let yi=0;yi<postYs;yi++){
          const py=base+.40+yi*(h-.55)/postYs;
          pagodaBlock(storyTint,-half,py,coord,.38,.45,.38,false,.94);
          pagodaBlock(storyTint,half,py,coord,.38,.45,.38,false,.94);
          pagodaBlock(storyTint,coord,py,-half,.38,.45,.38,false,.94);
          pagodaBlock(storyTint,coord,py,half,.38,.45,.38,false,.94);
        }
      }
      // Continuous upper wall bands make the storeys read as real rooms while
      // leaving a broad double door and lit shoji windows on the front.
      const wallY=base+h-.38;
      const wallSteps=Math.max(4,Math.round(half*3));
      for(let i=0;i<=wallSteps;i++){
        const p=-half+(2*half*i/wallSteps);
        const isDoor=Math.abs(p)<.82&&floor===0;
        const isWindow=Math.abs(p)>half*.36&&Math.abs(p)<half*.78;
        if(!isDoor&&!isWindow){
          pagodaBlock(storyTint,p,wallY,half,.38,.66,.3,false,.96);
          pagodaBlock(PALETTE.teak,p,wallY,-half,.38,.66,.3,false,.92);
        }
        pagodaBlock(storyTint,-half,wallY,p,.3,.66,.38,false,.96);
        pagodaBlock(storyTint,half,wallY,p,.3,.66,.38,false,.96);
        if(isWindow){
          pagodaBlock(0xffc579,p,base+h*.61,half+.04,.32,.68,.12,true,1.03);
          pagodaBlock(PALETTE.teak,p,base+h*.61,-half-.04,.32,.68,.12,false,.9);
        }
      }
      // Warm lattice on each floor and discreet gold fascia.
      for(let sideSign of [-1,1])for(let w=-1;w<=1;w++){
        const x=w*half*.55;
        pagodaBlock(PALETTE.gold,x,base+h*.55,sideSign*(half+.08),.16,.12,.12,false,1.04);
        pagodaBlock(PALETTE.gold,sideSign*(half+.08),base+h*.55,x,.12,.12,.16,false,1.04);
      }
      // Two gently pitched courses form a pagoda roof with lifted corners.
      const step=.48;
      for(let course=0;course<2;course++){
        const R=roof-(course===0?0:.18);
        for(let z=-R;z<=R+.001;z+=step)for(let x=-R;x<=R+.001;x+=step){
          const nx=Math.abs(x)/R,nz=Math.abs(z)/R,edge=Math.max(nx,nz);
          const crown=(1-edge)*.50;
          const curl=(Math.pow(nx,7)+Math.pow(nz,7))*.30;
          const y=base+h+.08+crown+curl-course*.36;
          const tile=course===0?(floor%2?0x28624d:PALETTE.jade):(floor%2?PALETTE.jade:0x24533f);
          pagodaBlock(tile,x,y,z,.47,.38,.47,false,((Math.round(x*2)+Math.round(z*2)+floor)%7===0)?1.11:1);
        }
      }
      // Gold-edged eaves and four ornamental lifted tips per storey.
      for(let side=-1;side<=1;side++)for(let i=-Math.floor(roof*2);i<=Math.floor(roof*2);i++){
        const p=i*.48;
        pagodaBlock(PALETTE.gold,p,base+h+.30,side*roof,.24,.12,.24,false,.9);
        pagodaBlock(PALETTE.gold,side*roof,base+h+.30,p,.24,.12,.24,false,.9);
      }
      for(const sx of [-1,1])for(const sz of [-1,1]){
        const tipX=sx*(roof-.1),tipZ=sz*(roof-.1);
        for(let j=0;j<3;j++)pagodaBlock(PALETTE.gold,tipX+sx*j*.26,base+h+.46+j*.19,tipZ+sz*j*.26,.30,.22,.30,false,1.02);
      }
      // Layered brackets under the roof make the large eaves feel supported.
      for(let side=-1;side<=1;side++)for(let i=-3;i<=3;i++){
        const p=i*half*.28;
        pagodaBlock(PALETTE.gold,p,base+h-.17,side*(half+.18),.20,.23,.20,false,.9);
        pagodaBlock(PALETTE.teak,side*(half+.18),base+h-.42,p,.24,.26,.24,false,.92);
      }
    }
    // Openable double doors are the only separately animated pagoda meshes.
    const doors=[];
    const doorMaterial=new THREE.MeshStandardMaterial({color:PALETTE.teak,roughness:.62,metalness:.04});
    for(const side of [-1,1]){
      const pivot=new THREE.Group();
      pivot.position.set(PAGODA_X+side*.78,floorBases[0]+.45,PAGODA_Z+frontZ+.52);
      const leaf=new THREE.Mesh(new THREE.BoxGeometry(.72,2.62,.18),doorMaterial);
      leaf.position.set(-side*.36,1.31,0);
      leaf.castShadow=true;
      pivot.add(leaf);
      const panel=new THREE.Mesh(new THREE.BoxGeometry(.46,1.98,.035),new THREE.MeshStandardMaterial({color:0x633821,roughness:.68}));
      panel.position.set(-side*.36,1.35,.11);
      pivot.add(panel);
      world.add(pivot);
      doors.push({pivot:pivot,side:side,target:0});
    }
    const pickTargets=[];
    for(let floor=0;floor<5;floor++){
      const picker=new THREE.Mesh(new THREE.BoxGeometry(wallHalf[floor]*2,floorHeights[floor]+1.4,wallHalf[floor]*2),new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}));
      picker.position.set(PAGODA_X,floorBases[floor]+floorHeights[floor]*.5,PAGODA_Z);
      picker.userData={type:'floor',floor:floor};
      world.add(picker);pickTargets.push(picker);
    }
    // The lotus finial rises above all five roof tiers to a full 28 metres.
    for(let i=0;i<14;i++)pagodaBlock(PALETTE.gold,0,20.8+i*.34,PAGODA_Z,.32,.30,.32,false,1.03);
    for(let i=0;i<5;i++){
      const y=21.1+i*1.05;
      for(let a=0;a<8;a++){
        const angle=a*Math.PI/4;
        pagodaBlock(PALETTE.gold,Math.cos(angle)*(.38+i*.045),y, PAGODA_Z+Math.sin(angle)*(.38+i*.045),.25,.24,.25,false,1.02);
      }
    }
    pagodaBlock(PALETTE.gold,0,27.25,PAGODA_Z,.94,.44,.94,false,1.07);
    pagodaBlock(PALETTE.gold,0,27.76,PAGODA_Z,.55,.56,.55,false,1.13);
    pagodaBlock(PALETTE.gold,0,28.17,PAGODA_Z,.25,.35,.25,false,1.18);

    // A turning stone approach bends like a garden path toward the entrance.
    const path=[[-.5,19],[.2,15],[-3.3,12],[-3.3,8],[0,5.0]];
    for(let segment=0;segment<path.length-1;segment++){
      const a=path[segment],b=path[segment+1],length=Math.hypot(b[0]-a[0],b[1]-a[1]),steps=Math.ceil(length/.62);
      for(let i=0;i<=steps;i++){
        const t=i/steps,cx=a[0]+(b[0]-a[0])*t,cz=a[1]+(b[1]-a[1])*t;
        for(let lane=-2;lane<=2;lane++){
          const sideX=-(b[1]-a[1])/length,sideZ=(b[0]-a[0])/length;
          const x=cx+sideX*lane*.68,z=cz+sideZ*lane*.68;
          voxel((i+lane)%3===0?0xb2aaa0:PALETTE.stone,x,-.01,z,.60,.20,.61,'path',false,.91+random()*.14);
        }
      }
    }
    for(let step=0;step<5;step++)for(let lane=-3;lane<=3;lane++)voxel(PALETTE.stone,lane*.55,.22+step*.08,PAGODA_Z+4+step*.72,.52,.25,.50,'path',false,.96);

    // Main pond, stepping stones, and an arched plank bridge.
    const pondCenter={x:16.1,z:2.6};
    const pondShape=new THREE.Shape();
    pondShape.moveTo(10.5,3.3);pondShape.quadraticCurveTo(15,5.2,19.2,3.4);pondShape.quadraticCurveTo(23.8,1.7,22.7,-2.4);pondShape.quadraticCurveTo(22.3,-6.2,17.2,-8.3);pondShape.quadraticCurveTo(12.4,-8.7,10,-5.3);pondShape.quadraticCurveTo(8.8,-1.2,10.5,3.3);
    const pondGeo=new THREE.ShapeGeometry(pondShape,18);
    const pondMat=new THREE.MeshStandardMaterial({color:PALETTE.pond,roughness:.24,metalness:.12,transparent:true,opacity:.88,emissive:0x1e737b,emissiveIntensity:.14,side:THREE.DoubleSide});
    const pond=new THREE.Mesh(pondGeo,pondMat);pond.rotation.x=-Math.PI/2;pond.position.set(0,.17,0);pond.receiveShadow=true;world.add(pond);
    for(let z=-4;z<=8;z++)for(let x=9;x<=23;x++){
      const dx=(x-16.2)/6.8,dz=(z-2.1)/6.5;
      const value=dx*dx+dz*dz+.11*Math.sin(x*1.7+z*.8);
      if(value>.91&&value<1.24&&random()>.22)voxel((x+z)%3===0?0x857d70:PALETTE.stone,x,.08,z,.78,.22,.72,'pond-edge',false,.93+random()*.15);
    }
    // The bridge arches gently over the pond from one mossy bank to the other.
    for(let i=0;i<=22;i++){
      const x=10.1+i*.56,arch=Math.sin(Math.PI*i/22);
      for(let lane=-2;lane<=2;lane++){
        voxel(lane%2===0?0x80502e:PALETTE.teak,x,.50+arch*1.02,5.1+lane*.30,.54,.24,.28,'bridge',false,(i%4===0)?1.08:1);
      }
      if(i%2===0){
        voxel(PALETTE.teak,x,.97+arch,4.3,.22,.92,.22,'bridge',false,.92);
        voxel(PALETTE.teak,x,.97+arch,5.9,.22,.92,.22,'bridge',false,.92);
      }
    }
    for(let side of [-1,1])for(let i=0;i<8;i++){
      const x=11.2+i*1.38,y=1.5+Math.sin(Math.PI*i/7)*.9;
      voxel(PALETTE.teak,x,y,5.08+side*.7,.13,.18,1.3,'bridge',false,.9);
    }
    const rippleMeshes=[];
    for(let i=0;i<8;i++){
      const ring=new THREE.Mesh(new THREE.TorusGeometry(.38+i*.055,.025,5,24),new THREE.MeshStandardMaterial({color:0xd3ffff,transparent:true,opacity:.34,roughness:.22,metalness:.1}));

    const lookStart=new THREE.Vector3(0,5.7,18.5);

    const introStarted=performance.now();
    let introActive=true;

    const smoothstep=(a,b,x)=>{const t=THREE.MathUtils.clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
    const tmpColor=new THREE.Color();

    function updatePetals(now,dt){

      renderer.render(scene,camera);
      frames++;
      if(now-fpsClock>=900){fps=Math.round(frames*1000/(now-fpsClock));window.__VOXEL__.fps=fps;stats.textContent=Math.round(placedVoxels/1000)+'k voxels | '+fps+' FPS';frames=0;fpsClock=now;}
    }
    window.__VOXEL__={voxelCount:placedVoxels,fps:0,pagodaFloors:5,timeOfDay:timeOfDay};
    window.__VOXEL__.voxelBreakdown={...countByKind,pagoda:pagodaVoxels};
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5))});
    requestAnimationFrame(animate);
  </script>
</body>
</html>
