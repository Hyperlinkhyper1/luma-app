<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Sports Car Benchmark</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
      color: #fff;
    }
    #webgl-container { width: 100vw; height: 100vh; }
    .ui-panel {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255,255,255,0.1);
      padding: 10px;
      border-radius: 5px;
      backdrop-filter: blur(4px);
    }
    .config-panel { display: none; }
    .config-panel.active { display: block; }
    button { margin: 2px; }
  </style>
</head>
<body>
<div id="webgl-container"></div>
<div class="ui-panel" id="config-panel">
  <button id="toggle-config">Config</button>
  <div id="paint-colors"></div>
  <button id="toggle-doors">Toggle Doors</button>
  <button id="toggle-headlights">Toggle Headlights</button>
  <button id="xray-view">X-Ray View</button>
  <button id="drive-mode">Drive Mode</button>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// Global vars
let scene, camera, renderer, controls, composer;
let car, chassis;
let currentMode = 'showroom';
let doorsOpen = false;
let headlightsOn = true;
let xrayActive = false;
let driveActive = false;

initScene();
animate();

function initScene() {
  const container = document.getElementById('webgl-container');

  // Scene setup
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);

  const envMap = generateEnvironmentMap();
  scene.environment = envMap;

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 1.5, 6);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.outputEncoding = THREE.sRGBEncoding;
  container.appendChild(renderer.domElement);

  composer = new EffectComposer(renderer);
  const renderPass = new RenderPass(scene, camera);
  composer.addPass(renderPass);
  const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.5, 0.4, 0.85);
  composer.addPass(bloomPass);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  // Lights
  const hemiLight = new THREE.HemisphericLight(0xffffff, 0.6);
  scene.add(hemiLight);
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(5, 10, 7);
  scene.add(dirLight);

  // Ground
  const groundGeo = new THREE.PlaneGeometry(100, 100);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Build car
  car = buildCar();
  scene.add(car);

  // UI Events
  document.getElementById('toggle-config').addEventListener('click', () => {
    document.getElementById('config-panel').classList.toggle('active');
  });
  document.getElementById('toggle-doors').addEventListener('click', toggleDoors);
  document.getElementById('toggle-headlights').addEventListener('click', toggleHeadlights);
  document.getElementById('xray-view').addEventListener('click', toggleXRay);
  document.getElementById('drive-mode').addEventListener('click', startDriveMode);

  setupPaintColors();

  window.addEventListener('resize', onWindowResize);
}

function buildCar() {
  const carGroup = new THREE.Group();

  // Body using lathed geometry
  const bodyPoints = [
    new THREE.Vector2(0, 0),
    new THREE.Vector2(0.3, 0.5),
    new THREE.Vector2(0.6, 1.15),
    new THREE.Vector2(0.4, 1.15),
    new THREE.Vector2(0.1, 0.8),
    new THREE.Vector2(0, 0)
  ];
  const latheGeo = new THREE.LatheGeometry(bodyPoints, 64);
  const bodyMat = new THREE.MeshPhysicalMaterial({
    color: 0xff0000,
    metalness: 0.7,
    roughness: 0.1,
    clearcoat: 0.5,
    clearcoatRoughness: 0.1,
    envMap: scene.environment
  });
  const body = new THREE.Mesh(latheGeo, bodyMat);
  body.castShadow = true;
  body.receiveShadow = true;
  carGroup.add(body);

  // Wheels
  const wheelGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.15, 32);
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
  const wheelPositions = [
    [-1.2, 0.3, -1.6], [1.2, 0.3, -1.6],
    [-1.2, 0.3, 1.6], [1.2, 0.3, 1.6]
  ];
  for (let i = 0; i < 4; i++) {
    const wheel = new THREE.Mesh(wheelGeo, wheelMat);
    wheel.position.set(...wheelPositions[i]);
    if (i % 2 === 0) wheel.rotation.y = Math.PI;
    carGroup.add(wheel);
  }

  // Interior
  const seatGeo = new THREE.BoxGeometry(0.5, 0.2, 0.4);
  const seatMat = new THREE.MeshStandardMaterial({ color: 0x2222aa });
  const driverSeat = new THREE.Mesh(seatGeo, seatMat);
  driverSeat.position.set(-0.3, 0.5, 0);
  const passengerSeat = driverSeat.clone();
  passengerSeat.position.set(0.3, 0.5, 0);
  carGroup.add(driverSeat, passengerSeat);

  // Steering wheel
  const wheelShape = new THREE.RingGeometry(0.15, 0.2, 16);
  const steerMat = new THREE.MeshStandardMaterial({ color: 0x444444 });
  const steeringWheel = new THREE.Mesh(wheelShape, steerMat);
  steeringWheel.position.set(-0.3, 0.6, 0.2);
  carGroup.add(steeringWheel);

  // Glass canopy
  const canopyGeo = new THREE.SphereGeometry(0.7, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
  const glassMat = new THREE.MeshPhysicalMaterial({
    color: 0xaaaaff,
    transparent: true,
    opacity: 0.3,
    metalness: 0.1,
    roughness: 0.05,
    transmission: 0.8
  });
  const canopy = new THREE.Mesh(canopyGeo, glassMat);
  canopy.position.y = 1.0;
  carGroup.add(canopy);

  // Emblem
  const emblemGeo = new THREE.SphereGeometry(0.05, 16, 16);
  const emblemMat = new THREE.MeshStandardMaterial({ color: 0xffd700 });
  const emblem = new THREE.Mesh(emblemGeo, emblemMat);
  emblem.position.set(0, 1.1, 1.65);
  carGroup.add(emblem);

  return carGroup;
}

function generateEnvironmentMap() {
  const cubeRenderTarget = new THREE.WebGLCubeRenderTarget(512);
  const pmremGenerator = new THREE.PMREMGenerator(renderer);
  pmremGenerator.compileCubemapToLinear();
  const sceneBG = new THREE.Scene();
  sceneBG.background = new THREE.Color(0x333333);
  const envMap = pmremGenerator.fromScene(sceneBG).texture;
  pmremGenerator.dispose();
  return envMap;
}

function setupPaintColors() {
  const colors = [
    { name: 'Red', value: '#ff0000' },
    { name: 'Blue', value: '#0000ff' },
    { name: 'Black', value: '#000000' },
    { name: 'White', value: '#ffffff' },
    { name: 'Metallic', value: '#c0c0c0' },
    { name: 'Matte', value: '#008800' }
  ];
  const container = document.getElementById('paint-colors');
  container.innerHTML = '';
  colors.forEach(c => {
    const btn = document.createElement('button');
    btn.textContent = c.name;
    btn.style.backgroundColor = c.value;
    btn.addEventListener('click', () => applyPaintColor(c.value));
    container.appendChild(btn);
  });
}

function applyPaintColor(hex) {
  car.traverse(child => {
    if (child.material && child.material.type === 'MeshPhysicalMaterial') {
      const color = new THREE.Color(hex);
      if (hex === '#c0c0c0') {
        child.metalness = 1;
        child.roughness = 0.2;
      } else if (hex === '#008800') {
        child.metalness = 0;
        child.roughness = 0.9;
      } else {
        child.metalness = 0.7;
        child.roughness = 0.1;
      }
      child.color = color;
    }
  });
}

function toggleDoors() {
  doorsOpen = !doorsOpen;
  // Simple animation simulation
  car.traverse(child => {
    if (child.name.includes('door')) {
      child.rotation.y = doorsOpen ? Math.PI / 4 : 0;
    }
  });
}

function toggleHeadlights() {
  headlightsOn = !headlightsOn;
  // Simulate light change (not implemented visually here due to complexity)
}

function toggleXRay() {
  xrayActive = !xrayActive;
  car.traverse(child => {
    if (child.material) {
      child.material.transparent = true;
      child.material.opacity = xrayActive ? 0.3 : 1;
    }
  });
}

function startDriveMode() {
  driveActive = true;
  currentMode = 'drive';
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  composer.render();
}
</script>
</body>
</html>
