<!DOCTYPE html>
<html>
<head>
  <title>3D Train World Benchmark</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #info, #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      padding: 10px;
      border-radius: 5px;
    }
    #info {
      left: auto;
      right: 10px;
    }
    #ui button {
      margin-top: 5px;
    }
    #schematic {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 300px;
      height: 300px;
      border: 1px solid #fff;
      pointer-events: none;
    }
    #stats {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      padding: 5px;
      border-radius: 5px;
      font-size: 12px;
    }
  </style>
  <script type="importmap">
    {"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { Water } from 'three/addons/objects/Water.js';
    import { Sky } from 'three/addons/objects/Sky.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    let scene, camera, renderer, controls, clock, stats;
    let trains = [], signals = [], switches = [], blocks = [], routes = {};
    let schematic = document.getElementById('schematic');
    let ui = document.getElementById('ui');
    let info = document.getElementById('info');
    let timeScale = 1, day = 0.5;

    init();
    animate();

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xcccccc);
      scene.environment = new RoomEnvironment();

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 500;
      camera.position.y = 100;

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.minDistance = 100;
      controls.maxDistance = 1000;

      clock = new THREE.Clock();

      // Create track, signals, switches, and blocks
      createTrack();
      createSignals();
      createSwitches();
      createBlocks();

      // Create trains
      createTrain('Steam', 0xFF0000, [0, 1, 2, 3, 4]);
      createTrain('Electric', 0x00FF00, [5, 6, 7, 8, 9]);
      createTrain('Freight', 0x0000FF, [10, 11, 12, 13, 14]);

      // Create UI
      createUI();

      // Start simulation
      updateSignals();
      updateRoutes();
    }

    function createTrack() {
      // Create track geometry and add to scene
      let geometry = new THREE.Geometry();
      let material = new THREE.LineBasicMaterial({ color: 0x333333 });
      let points = [
        // Add your track points here
      ];
      geometry.vertices.push.apply(points);
      let line = new THREE.Line(geometry, material);
      scene.add(line);

      // Create water and add to scene
      let waterGeometry = new THREE.PlaneGeometry(1000, 1000);
      let water = new Water(waterGeometry, {
        textureWidth: 512,
        textureHeight: 512,
        waterNormals: new THREE.TextureLoader().load('https://threejs.org/examples/textures/waternormals.jpg', function() {}),
        sunDirection: new THREE.Vector3(),
        sunColor: 0xffffff,
        waterColor: 0x0010ff,
        distortionScale: 3.7,
        fog: scene.fog !== undefined
      });
      water.rotation.x = -Math.PI / 2;
      scene.add(water);

      // Create sky and add to scene
      let sky = new Sky();
      sky.scale.setScalar(1000);
      scene.add(sky);
      let sun = new THREE.Vector3();
      let uniforms = sky.material.uniforms;
      uniforms['turbidity'].value = 10;
      uniforms['rayleigh'].value = 1;
      uniforms['luminance'].value = 1;
      uniforms['sun'].value.copy(sun);
      sun.copy(sky.position);
    }

    function createSignals() {
      // Add signals to scene and signals array
      signals.push({ position: new THREE.Vector3(), aspect: 'GREEN' });
      // Add more signals here...
    }

    function createSwitches() {
      // Add switches to scene and switches array
      switches.push({ position: new THREE.Vector3(), state: 'STRAIGHT' });
      // Add more switches here...
    }

    function createBlocks() {
      // Divide track into blocks and add to blocks array
      blocks.push({ start: 0, end: 10 });
      // Add more blocks here...
    }

    function createTrain(name, color, cars) {
      let train = {
        name: name,
        color: color,
        cars: cars,
        speed: 0,
        position: new THREE.Vector3(),
        direction: 1,
        state: 'RUNNING',
        nextSignal: null,
        nextBlock: null,
        route: null,
      };
      trains.push(train);

      // Create train geometry and add to scene
      let geometry = new THREE.Geometry();
      let material = new THREE.MeshBasicMaterial({ color: color });
      let points = [
        // Add train points here
      ];
      geometry.vertices.push.apply(points);
      let mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);
      train.mesh = mesh;
    }

    function createUI() {
      // Create UI elements and add to ui div
      let button = document.createElement('button');
      button.innerHTML = 'Pause';
      button.addEventListener('click', function() {
        timeScale = timeScale === 1 ? 0 : 1;
        button.innerHTML = timeScale === 1 ? 'Pause' : 'Play';
      });
      ui.appendChild(button);

      button = document.createElement('button');
      button.innerHTML = '2x';
      button.addEventListener('click', function() {
        timeScale = timeScale === 2 ? 1 : 2;
        button.innerHTML = timeScale === 2 ? '1x' : '2x';
      });
      ui.appendChild(button);

      button = document.createElement('button');
      button.innerHTML = '4x';
      button.addEventListener('click', function() {
        timeScale = timeScale === 4 ? 2 : 4;
        button.innerHTML = timeScale === 4 ? '2x' : '4x';
      });
      ui.appendChild(button);

      let slider = document.createElement('input');
      slider.type = 'range';
      slider.min = '0';
      slider.max = '1';
      slider.step = '0.01';
      slider.value = day;
      slider.addEventListener('input', function() {
        day = parseFloat(slider.value);
      });
      ui.appendChild(slider);

      // Create schematic canvas and add to schematic div
      let canvas = document.createElement('canvas');
      canvas.width = 300;
      canvas.height = 300;
      schematic.appendChild(canvas);
      let ctx = canvas.getContext('2d');
      updateSchematic(ctx);

      // Create info panel and add to info div
      let panel = document.createElement('div');
      panel.innerHTML = 'How the signalling works:';
      info.appendChild(panel);

      // Create stats panel and add to stats div
      stats = new Stats();
      stats.showPanel(0);
      stats.domElement.style.position = 'absolute';
      stats.domElement.style.top = '0px';
      document.body.appendChild(stats.domElement);
    }

    function updateSignals() {
      // Update signal aspects based on block occupancy and routes
      for (let signal of signals) {
        let block = blocks[signal.position.x];
        let occupied = false;
        for (let train of trains) {
          if (train.cars.some(car => car >= block.start && car <= block.end)) {
            occupied = true;
            break;
          }
        }
        if (signal.route && signal.route.reserved) {
          signal.aspect = 'RED';
        } else if (occupied) {
          signal.aspect = 'RED';
        } else if (signal.nextSignal && signal.nextSignal.aspect === 'RED') {
          signal.aspect = 'YELLOW';
        } else {
          signal.aspect = 'GREEN';
        }
      }
    }

    function updateRoutes() {
      // Update reserved routes based on train positions and directions
      for (let route in routes) {
        let reserved = false;
        for (let train of trains) {
          if (train.route === route) {
            reserved = true;
            break;
          }
        }
        routes[route].reserved = reserved;
      }
    }

    function updateTrains(delta) {
      // Update train positions, speeds, and states based on signals and routes
      for (let train of trains) {
        let block = blocks[train.position.x];
        let nextBlock = blocks[train.nextBlock];
        let nextSignal = signals[train.nextSignal];

        if (train.state === 'RUNNING') {
          if (nextSignal.aspect === 'RED') {
            train.speed -= 0.1 * delta;
            if (train.speed < 0) train.speed = 0;
          } else if (nextSignal.aspect === 'YELLOW') {
            train.speed -= 0.05 * delta;
            if (train.speed < 0) train.speed = 0;
          } else {
            train.speed += 0.1 * delta;
            if (train.speed > train.maxSpeed) train.speed = train.maxSpeed;
          }
          train.position.x += train.speed * train.direction * delta;
          train.mesh.position.x = train.position.x;
        } else if (train.state === 'WAITING') {
          // Wait for route to be reserved
          if (train.route && train.route.reserved) {
            train.state = 'RUNNING';
          }
        } else if (train.state === 'DWELLING') {
          // Dwell at station for a set time
          train.dwellTime -= delta;
          if (train.dwellTime <= 0) {
            train.state = 'RUNNING';
          }
        }

        // Check if train has reached next block or signal
        if (train.position.x === nextBlock.end) {
          train.nextBlock = nextBlock.next;
          train.nextSignal = nextSignal.next;
          train.route = null;
          updateRoutes();
        } else if (train.position.x === nextSignal.position.x) {
          train.nextSignal = nextSignal.next;
          if (nextSignal.aspect === 'RED') {
            train.state = 'WAITING';
            train.route = nextSignal.route;
            updateRoutes();
          }
        }

        // Update train state based on position and direction
        if (train.position.x === block.start && train.direction === 1) {
          train.state = 'DWELLING';
          train.dwellTime = train.dwellTimeMax;
        } else if (train.position.x === block.end && train.direction === -1) {
          train.state = 'DWELLING';
          train.dwellTime = train.dwellTimeMax;
        }
      }
    }

    function updateSchematic(ctx) {
      // Clear canvas and draw schematic based on block occupancy and signal aspects
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let block of blocks) {
        let color = block.occupied ? '#f00' : '#0f0';
        ctx.fillStyle = color;
        ctx.fillRect(block.start * 10, 0, (block.end - block.start + 1) * 10, 10);
      }
      ctx.stroke();
      for (let signal of signals) {
        let color = signal.aspect === 'RED' ? '#f00' : signal.aspect === 'YELLOW' ? '#ff0' : '#0f0';
        ctx.fillStyle = color;
        ctx.fillRect(signal.position.x * 10, 0, 10, 10);
      }
      for (let train of trains) {
        ctx.fillStyle = train.color;
        ctx.fillText(train.name, train.position.x * 10 - 10, 10);
      }
      for (let route in routes) {
        if (routes[route].reserved) {
          ctx.strokeStyle = '#00f';
          ctx.beginPath();
          for (let point of routes[route].points) {
            ctx.lineTo(point.x * 10, point.y * 10);
          }
          ctx.stroke();
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      let delta = clock.getDelta() * timeScale;
      stats.begin();
      updateSignals();
      updateRoutes();
      updateTrains(delta);
      updateSchematic(schematic.getContext('2d'));
      renderer.render(scene, camera);
      stats.end();
    }
  </script>
  <div id="ui"></div>
  <div id="info"></div>
  <canvas id="schematic"></canvas>
  <div id="stats"></div>
</body>
</html>
