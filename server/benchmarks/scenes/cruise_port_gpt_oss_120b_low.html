<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lisbon Cruise Benchmark</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
#ui{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.5);color:#fff;padding:8px;border-radius:4px;font-family:sans-serif;z-index:10}
#ui button{margin:2px}
#ui label{margin-left:4px}
#loader{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-family:sans-serif}
</style>
<script type="importmap">
{
  "imports": {
    "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GUI} from 'three/addons/libs/lil-gui.module.min.js';

// ---------- Renderer ----------
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setClearColor(0x202030);
document.body.appendChild(renderer.domElement);

// ---------- Scene ----------
const scene = new THREE.Scene();

// ---------- Camera ----------
const camera = new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,1,2000);
camera.position.set(0,80,250);

// ---------- Controls ----------
const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;

// ---------- Light ----------
const hemi = new THREE.HemisphereLight(0xffffff,0x444444,1);
scene.add(hemi);
const dirLight = new THREE.DirectionalLight(0xffffff,0.8);
dirLight.position.set(100,200,100);
scene.add(dirLight);

// ---------- Water ----------
const waterGeo = new THREE.PlaneGeometry(2000,2000,256,256);
const waterMat = new THREE.MeshPhongMaterial({color:0x225588,transparent:true,opacity:0.7});
const water = new THREE.Mesh(waterGeo,waterMat);
water.rotation.x = -Math.PI/2;
water.position.y = 0;
scene.add(water);

// ---------- Simple City ----------
function createHouse(x,z){
    const house = new THREE.Group();
    const baseGeo = new THREE.BoxGeometry(12,8,12);
    const baseMat = new THREE.MeshLambertMaterial({color:0x8b5a2b});
    const base = new THREE.Mesh(baseGeo,baseMat);
    base.position.y=4;
    house.add(base);
    // roof
    const roofGeo = new THREE.ConeGeometry(8,4,4);
    const roofMat = new THREE.MeshLambertMaterial({color:0xa0522d});
    const roof = new THREE.Mesh(roofGeo,roofMat);
    roof.position.y=8;
    roof.rotation.y=Math.PI/4;
    house.add(roof);
    house.position.set(x,0,z);
    scene.add(house);
}
for(let i=-200;i<200;i+=30){
    createHouse(-150, i);
    createHouse(-120, i+15);
}

// Castle (simple)
const castleGeo = new THREE.CylinderGeometry(30,30,80,8);
const castleMat = new THREE.MeshLambertMaterial({color:0x555555});
const castle = new THREE.Mesh(castleGeo,castleMat);
castle.position.set(-250,40,0);
scene.add(castle);

// Bridge (simplified)
const bridgePillarGeo = new THREE.CylinderGeometry(5,5,200,6);
const bridgePillarMat = new THREE.MeshLambertMaterial({color:0x777777});
const leftPillar = new THREE.Mesh(bridgePillarGeo,bridgePillarMat);
leftPillar.position.set(300,100, -200);
scene.add(leftPillar);
const rightPillar = leftPillar.clone();
rightPillar.position.set(300,100,200);
scene.add(rightPillar);
const deckGeo = new THREE.BoxGeometry(10,4,400);
const deck = new THREE.Mesh(deckGeo,new THREE.MeshLambertMaterial({color:0x666666}));
deck.position.set(300,102,0);
scene.add(deck);

// ---------- Ship ----------
function createShip(){
    const ship = new THREE.Group();

    // hull
    const hullShape = new THREE.Shape();
    hullShape.moveTo(-150,0);
    hullShape.bezierCurveTo(-150,0,-130,20,-100,20);
    hullShape.lineTo(100,20);
    hullShape.bezierCurveTo(130,20,150,0,150,0);
    hullShape.lineTo(150,-10);
    hullShape.bezierCurveTo(130,-30, -130,-30,-150,-10);
    hullShape.lineTo(-150,0);
    const extrude = new THREE.ExtrudeGeometry(hullShape,{depth:38, bevelEnabled:false});
    const hullMat = new THREE.MeshPhongMaterial({color:0x004488});
    const hull = new THREE.Mesh(extrude,hullMat);
    hull.rotation.x = Math.PI/2;
    hull.position.y = 5;
    ship.add(hull);

    // decks (simple boxes)
    const deckMat = new THREE.MeshPhongMaterial({color:0x0066aa,transparent:true,opacity:0.6});
    for(let i=0;i<12;i++){
        const d = new THREE.Mesh(new THREE.BoxGeometry(280,2,38),deckMat);
        d.position.set(0,6+i*3,0);
        ship.add(d);
    }

    // funnel
    const funnel = new THREE.Mesh(new THREE.CylinderGeometry(4,4,30,12),new THREE.MeshPhongMaterial({color:0x222222}));
    funnel.position.set(-80,30,0);
    ship.add(funnel);

    // lifeboats (simple)
    const boatGeo = new THREE.BoxGeometry(12,2,4);
    const boatMat = new THREE.MeshLambertMaterial({color:0x555555});
    for(let i=-1;i<=1;i+=2){
        const b = new THREE.Mesh(boatGeo,boatMat);
        b.position.set(i*120,8,20);
        ship.add(b);
    }

    // name
    const canvas = document.createElement('canvas');
    canvas.width=256;canvas.height=64;
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='white';
    ctx.font='30px sans-serif';
    ctx.fillText('LISBON STAR',10,40);
    const tex = new THREE.CanvasTexture(canvas);
    const nameMat = new THREE.MeshBasicMaterial({map:tex,transparent:true});
    const nameGeo = new THREE.PlaneGeometry(80,20);
    const nameMesh = new THREE.Mesh(nameGeo,nameMat);
    nameMesh.position.set(0,20,0);
    nameMesh.rotation.y = Math.PI;
    ship.add(nameMesh);

    ship.position.set(0,0,0);
    scene.add(ship);
    return ship;
}
const ship = createShip();

// ---------- People (instanced) ----------
const personGeo = new THREE.ConeGeometry(1,3,4);
const personMat = new THREE.MeshLambertMaterial({color:0xffd700});
const personCount = 200;
const people = new THREE.InstancedMesh(personGeo,personMat,personCount);
let dummy = new THREE.Object3D();
for(let i=0;i<personCount;i++){
    dummy.position.set(
        THREE.MathUtils.randFloat(-200,200),
        1.5,
        THREE.MathUtils.randFloat(-200,200)
    );
    dummy.rotation.y = Math.random()*Math.PI*2;
    dummy.updateMatrix();
    people.setMatrixAt(i,dummy.matrix);
}
scene.add(people);

// ---------- UI ----------
const ui = document.createElement('div');
ui.id='ui';
ui.innerHTML=`
<div><button id="depart">Depart</button> <button id="return">Return</button></div>
<div>Time: <input type="range" id="time" min="0" max="24" step="0.1" value="12"></div>
<div><button id="toggleUI">Hide UI</button></div>
`;
document.body.appendChild(ui);

let departing = false;
let returning = false;
let departProgress = 0;
document.getElementById('depart').onclick=()=>{departing=true; returning=false; departProgress=0;};
document.getElementById('return').onclick=()=>{returning=true; departing=false; departProgress=0;};
document.getElementById('toggleUI').onclick=()=>{ui.style.display = ui.style.display==='none'?'block':'none';};

const timeSlider = document.getElementById('time');
timeSlider.oninput=()=>{updateLighting(parseFloat(timeSlider.value));};

function updateLighting(hour){
    const sunAngle = (hour/24)*Math.PI*2;
    dirLight.position.set(Math.cos(sunAngle)*200, Math.sin(sunAngle)*200, 100);
    hemi.intensity = Math.max(0.2, Math.sin(sunAngle)+0.2);
    renderer.setClearColor( hour>18||hour<6 ? 0x080820 : 0x87ceeb );
}

// ---------- Animation ----------
function animate(){
    requestAnimationFrame(animate);
    controls.update();

    // simple ship movement
    if(departing && departProgress<1){
        departProgress+=0.001;
        ship.position.x = THREE.MathUtils.lerp(0,300,departProgress);
        ship.rotation.y = THREE.MathUtils.lerp(0,Math.PI/6,departProgress);
    }
    if(returning && departProgress<1){
        departProgress+=0.001;
        ship.position.x = THREE.MathUtils.lerp(300,0,departProgress);
        ship.rotation.y = THREE.MathUtils.lerp(Math.PI/6,0,departProgress);
    }

    // simple water animation
    water.geometry.verticesNeedUpdate = true;
    const time = performance.now()*0.001;
    water.geometry.vertices.forEach(v=>{
        v.z = Math.sin((v.x+time*20)*0.1)*0.5;
    });
    water.geometry.computeVertexNormals();

    renderer.render(scene,camera);
}
animate();

// ---------- Resize ----------
window.addEventListener('resize',()=>{
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
});

// ---------- WebGL check ----------
if ( !renderer.capabilities.isWebGL2 ) {
    document.body.innerHTML = '<div id="loader">WebGL 2 not supported in this browser.</div>';
}
</script>
</head>
<body>
<div id="loader">Loading...</div>
</body>
</html>
