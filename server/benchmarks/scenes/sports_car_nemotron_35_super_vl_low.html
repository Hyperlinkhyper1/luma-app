.btn:hover{background:rgba(255,255,255,0.14)}
.btn.active{background:#1d4ed8;border-color:#3b82f6;color:#ffffff}
.btn.danger{background:#7f1d1d;border-color:#b91c1c;color:#fecaca}
label{font-size:11px;color:#9fb0c4;user-select:none}
.sw{width:18px;height:18px;border-radius:4px;border:1px solid rgba(255,255,255,0.25);cursor:pointer;box-shadow:0 0 0 1px rgba(0,0,0,0.35) inset}
.sw.active{border-color:#fff;box-shadow:0 0 0 1px #fff,0 0 10px rgba(255,255,255,0.35) inset}
#cover{position:fixed;inset:0;z-index:50;background:#070a12;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s}
#cover.hidden{opacity:0;pointer-events:none}
#cover b{font-size:16px;letter-spacing:2px;color:#eef2f7;margin-bottom:8px}
#cover .bar{width:220px;height:3px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden}
#cover .fill{width:0%;height:100%;background:#2563eb;transition:width .3s}
#hud{position:absolute;bottom:26px;left:26px;display:flex;gap:16px;align-items:flex-end;pointer-events:none;color:#fff;font-size:11px;font-variant-numeric:tabular-nums}
.gauge{text-align:right}
.gauge .val{font-size:28px;font-weight:700;line-height:1}
.gauge .lab{color:#9fb0c4;font-size:10px}
.gear{font-size:20px;font-weight:800;color:#fbbf24}
#minimap{position:absolute;bottom:26px;right:26px;width:170px;height:170px;background:rgba(2,6,10,0.75);border:1px solid rgba(255,255,255,0.12);border-radius:50%;overflow:hidden;pointer-events:none}
#minimap canvas{width:100%;height:100%;display:block}
.tooltip{position:absolute;background:rgba(10,14,20,0.9);color:#eef2f7;padding:6px 10px;border-radius:6px;font-size:11px;pointer-events:none;z-index:100;display:none;border:1px solid rgba(255,255,255,0.12)}
.actionbar{position:absolute;top:24px;right:24px;display:flex;gap:10px;z-index:30}
.hidebtn{position:absolute;top:12px;right:12px;width:34px;height:34px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.14);border-radius:8px;color:#eef2f7;cursor:pointer;font-size:13px;z-index:40;display:flex;align-items:center;justify-content:center}
.hidebtn:hover{background:rgba(255,255,255,0.16)}
</style>

<body>
<div id="cover"><b>APEX ONE</b><div class="bar"><div id="fill" class="fill"></div></div></div>
<div id="three"></div>
<div id="ui">

<div class="row"><label style="flex:0 0 52px">Paint</label><div id="paintOpts" style="flex:1;display:flex;flex-wrap:wrap;gap:6px"></div></div>
<div class="row"><label style="flex:0 0 52px">Finish</label><div style="flex:1"><label style="margin-right:8px"><div class="sw" id="swMet" style="background:#b0b7c0"></div> Metallic</label><label><div class="sw" id="swMat" style="background:#8a929c"></div> Matte</label></div></div>

</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { PMREMGenerator } from 'three/addons/pmrem/PMREMGenerator.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

if(!WebGLRenderingContext && !WebGL2RenderingContext){
  document.body.innerHTML='<div style="height:100%;display:flex;align-items:center;justify-content:center;background:#04070c;color:#eef2f7;font-family:sans-serif">WebGL is not available on this device.</div>';
}

// ---------- setup ----------
const cover=document.getElementById('cover');
const fill=document.getElementById('fill');
let loaded=false;
function setProgress(v){fill.style.width=v+'%';if(v>=100){setTimeout(()=>{cover.classList.add('hidden');loaded=true;},300)}}
setProgress(10);

const canvas=document.createElement('canvas');
document.getElementById('three').appendChild(canvas);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x04070c);
scene.fog=new THREE.FogExp2(0x04070c,0.0005);

const camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,0.1,2000);
camera.position.set(0,1.6,-7);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=0.06;
controls.minDistance=1.2;
controls.maxDistance=28;
controls.target.set(2.25,0.85,0);

const pmrem=new PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const envScene=new RoomEnvironment();
const envRender=pmrem.fromScene(envScene);
const envMap=envRender.texture;
pmrem.dispose();

// ---------- procedural textures ----------
function canvasTexture(w,h,draw){
  const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');draw(ctx,w,h);
  const t=new THREE.CanvasTexture(c);t.needsUpdate=true;return t;
}
const carbonTex=canvasTexture(256,256,(ctx,w,h)=>{
  ctx.fillStyle='#0b0e14';ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='rgba(140,150,160,0.18)';ctx.lineWidth=2;
  for(let y=-40;y<h+40;y+=48){ctx.beginPath();ctx.moveTo(-40,y);ctx.lineTo(w+40,y-80);ctx.stroke()}
  for(let x=-40;x<w+40;x+=48){ctx.beginPath();ctx.moveTo(x,-40);ctx.lineTo(x-80,h+40);ctx.stroke()}
});
const brushedTex=canvasTexture(512,512,(ctx,w,h)=>{
  const grad=ctx.createLinearGradient(0,0,w,0);grad.addColorStop(0,'#8a92a0');grad.addColorStop(0.5,'#b9c2cc');grad.addColorStop(1,'#8a92a0');
  ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
  for(let i=0;i<400;i++){ctx.strokeStyle='rgba(255,255,255,0.03)';ctx.beginPath();ctx.moveTo(Math.random()*w,Math.random()*h);ctx.lineTo(Math.random()*w*0.4+Math.random()*w*0.6,Math.random()*h);ctx.stroke()}
});
const rubberTex=canvasTexture(256,256,(ctx,w,h)=>{
  ctx.fillStyle='#0a0a09';ctx.fillRect(0,0,w,h);
  ctx.fillStyle='rgba(255,255,255,0.02)';
  for(let i=0;i<60;i++){ctx.beginPath();ctx.arc(Math.random()*w,Math.random()*h,Math.random()*3+1,0,Math.PI*2);ctx.fill()}
});

// ---------- materials ----------
const paintParams={color:0x00214a,metalness:0.45,roughness:0.28,clearcoat:1.0,clearcoatRoughness:0.12};
const paintMat=new THREE.MeshPhysicalMaterial({color:paintParams.color,metalness:paintParams.metalness,roughness:paintParams.roughness,clearcoat:paintParams.clearcoat,clearcoatRoughness:paintParams.clearcoatRoughness,envMap,envMapIntensity:1.5});
const paintMatte=new THREE.MeshPhysicalMaterial({color:paintParams.color,metalness:0.08,roughness:0.75,clearcoat:0.06,clearcoatRoughness:0.6,envMap,envMapIntensity:0.5});
let activePaint=paintMat;

const glassMat=new THREE.MeshPhysicalMaterial({color:0x111827,metalness:0,roughness:0.05,transmission:0.62,thickness:0.4,transparent:true,opacity:0.72,envMap,envMapIntensity:1.2,side:THREE.DoubleSide});
const rubberMat=new THREE.MeshStandardMaterial({color:0x0b0b0a,metalness:0.02,roughness:1.0,map:rubberTex});
const rimMat=new THREE.MeshStandardMaterial({color:0xa0a8b0,metalness:0.85,roughness:0.25,envMap,envMapIntensity:1});
const brakeMat=new THREE.MeshStandardMaterial({color:0x1a1a1a,metalness:0.6,roughness:0.4});
const caliperMat=new THREE.MeshStandardMaterial({color:0xb91c1c,metalness:0.4,roughness:0.35});
const carbonMat=new THREE.MeshStandardMaterial({color:0x10141a,metalness:0.15,roughness:0.35,map:carbonTex,envMap,envMapIntensity:0.8});
const metalMat=new THREE.MeshStandardMaterial({color:0xb0b7c0,metalness:1,roughness:0.18,envMap,envMapIntensity:1});
const lightMat=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xffffff,emissiveIntensity:8});

// ---------- car geometry helpers ----------
function loft(sections){
  const S=sections.length,V=sections[0].pts.length;
  const pos=[],uv=[],idx=[];
  const P=[];
  for(let i=0;i<S;i++){
    const row=[];
    for(let j=0;j<V;j++){const p=sections[i].pts[j];row.push(new THREE.Vector3(sections[i].x,p[0],p[1]))}
    P.push(row)
  }
  for(let i=0;i<S;i++)for(let j=0;j<V;j++){pos.push(P[i][j].x,P[i][j].y,P[i][j].z);uv.push(i/(S-1),j/(V-1))}
  for(let i=0;i<S-1;i++)for(let j=0;j<V;j++){
    const j1=(j+1)%V,a=i*V+j,b=i*V+j1,c=(i+1)*V+j1,d=(i+1)*V+j;
    idx.push(a,b,d);idx.push(b,c,d)
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new Float32BufferAttribute(uv,2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

const bodySections=[
  {x:0.10,pts:[[-0.12,0],[-0.06,0.78],[0.32,0.92],[0.42,0.78],[0.52,0.55],[0.55,0],[0.52,-0.55],[0.42,-0.78],[0.32,-0.92],[-0.06,-0.78]]},
  {x:0.72,pts:[[-0.14,0],[-0.08,1.02],[0.42,1.18],[0.55,1.0],[0.68,0.72],[0.72,0],[0.68,-0.72],[0.55,-1.0],[0.42,-1.18],[-0.08,-1.02]]},
  {x:1.30,pts:[[-0.16,0],[-0.10,1.28],[0.72,1.42],[0.90,1.22],[1.05,0.95],[1.12,0],[1.05,-0.95],[0.90,-1.22],[0.72,-1.42],[-0.10,-1.28]]},
  {x:1.90,pts:[[-0.18,0],[-0.12,1.42],[1.02,1.52],[1.22,1.34],[1.38,1.06],[1.45,0],[1.38,-1.06],[1.22,-1.34],[1.02,-1.52],[-0.12,-1.42]]},
  {x:2.55,pts:[[-0.20,0],[-0.14,1.46],[1.08,1.56],[1.28,1.40],[1.44,1.12],[1.50,0],[1.44,-1.12],[1.28,-1.40],[1.08,-1.56],[-0.14,-1.46]]},
  {x:3.10,pts:[[-0.20,0],[-0.14,1.40],[1.00,1.50],[1.18,1.34],[1.32,1.06],[1.38,0],[1.32,-1.06],[1.18,-1.34],[1.00,-1.50],[-0.14,-1.40]]},
  {x:3.55,pts:[[-0.18,0],[-0.12,1.22],[0.82,1.34],[0.96,1.18],[1.08,0.92],[1.12,0],[1.08,-0.92],[0.96,-1.18],[0.82,-1.34],[-0.12,-1.22]]},
  {x:3.90,pts:[[-0.16,0],[-0.10,1.02],[0.66,1.14],[0.78,0.98],[0.88,0.72],[0.90,0],[0.88,-0.72],[0.78,-0.98],[0.66,-1.14],[-0.10,-1.02]]},
  {x:4.20,pts:[[-0.14,0],[-0.08,0.78],[0.48,0.90],[0.58,0.74],[0.66,0.52],[0.68,0],[0.66,-0.52],[0.58,-0.74],[0.48,-0.90],[-0.08,-0.78]]},
  {x:4.48,pts:[[-0.12,0],[-0.06,0.58],[0.34,0.68],[0.42,0.54],[0.48,0.36],[0.50,0],[0.48,-0.36],[0.42,-0.54],[0.34,-0.68],[-0.06,-0.58]]}
];

const car=new THREE.Group();
car.name='car';
const body=new THREE.Mesh(loft(bodySections),activePaint);
body.castShadow=true;body.receiveShadow=true;car.add(body);

// shut lines
function shutLine(x0,x1,y,z,sx,sy){
  const sh=new THREE.Shape();sh.moveTo(-0.003,-0.003);sh.lineTo(0.003,-0.003);sh.lineTo(0.003,0.003);sh.lineTo(-0.003,0.003);
  const m=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:sx,bevelEnabled:false}),new THREE.MeshStandardMaterial({color:0x060a0f}));
  m.position.set((x0+x1)/2,y,z);m.rotation.y=sy;m.scale.set(Math.abs(x1-x0),1,1);return m;
}
car.add(shutLine(1.3,2.6,1.44,-1.62,0,0));
car.add(shutLine(1.3,2.6,1.44,1.62,0,0));
car.add(shutLine(0.7,1.35,1.42,-1.58,0,Math.PI/2));
car.add(shutLine(0.7,1.35,1.42,1.58,0,Math.PI/2));

// front splitter
const spShape=new THREE.Shape();spShape.moveTo(-0.1,-0.14);spShape.lineTo(4.6,-0.14);spShape.lineTo(4.6,0.02);spShape.lineTo(-0.1,0.02);spShape.closePath();
const splitter=new THREE.Mesh(new THREE.ExtrudeGeometry(spShape,{depth:0.16,bevelEnabled:false}),carbonMat);
splitter.position.set(2.2,-0.22,0);splitter.rotation.z=Math.PI/2;car.add(splitter);

// rear diffuser + fins
const difShape=new THREE.Shape();difShape.moveTo(3.7,-0.10);difShape.lineTo(4.48,-0.10);difShape.lineTo(4.48,-0.78);difShape.lineTo(3.7,-0.72);difShape.closePath();
const diffuser=new THREE.Mesh(new THREE.ExtrudeGeometry(difShape,{depth:0.14,bevelEnabled:false}),carbonMat);
diffuser.position.set(2.2,-0.04,0);diffuser.rotation.z=Math.PI/2;car.add(diffuser);
for(let i=-1;i<=1;i+=1){
  const fin=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.22,0.10),carbonMat);
  fin.position.set(2.2,-0.34, i*0.55);car.add(fin)
}

// exhaust tips
for(let s=-1;s<=1;s+=2){
  const tip=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,0.11,16),metalMat);
  tip.rotation.z=Math.PI/2;tip.position.set(2.2,-0.52,s*0.62);car.add(tip)
  const inn=new THREE.Mesh(new THREE.CylinderGeometry(0.028,0.028,0.115,12),new THREE.MeshStandardMaterial({color:0x111111}));
  inn.rotation.z=Math.PI/2;inn.position.set(2.2,-0.52,s*0.62);car.add(inn)
}

// ---------- wheels ----------
function buildWheel(){
  const g=new THREE.Group();
  const tire=new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.35,0.27,36,1,true),rubberMat);
  tire.rotation.x=Math.PI/2;g.add(tire);
  const rimG=new THREE.Group();
  const lip=new THREE.Mesh(new THREE.TorusGeometry(0.315,0.024,14,64),rimMat);lip.rotation.x=Math.PI/2;rimG.add(lip);
  const spokeShape=new THREE.Shape();spokeShape.moveTo(-0.014,0.10);spokeShape.lineTo(0.014,0.10);spokeShape.lineTo(0.055,0.26);spokeShape.lineTo(-0.055,0.26);spokeShape.closePath();
  const spokeGeo=new THREE.ExtrudeGeometry(spokeShape,{depth:0.02,bevelEnabled:true,bevelThickness:0.004,bevelSize:0.004});
  for(let i=0;i<5;i++){const s=new THREE.Mesh(spokeGeo,rimMat);s.rotation.z=(i/5)*Math.PI*2;rimG.add(s)}
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.27,16),metalMat);hub.rotation.x=Math.PI/2;rimG.add(hub);
  rimG.rotation.x=Math.PI/2;g.add(rimG);
  const discShape=new THREE.Shape();discShape.absarc(0,0,0.285,0,Math.PI*2);
  for(let k=0;k<12;k++){const a=(k/12)*Math.PI*2;const h=new THREE.Path();h.absarc(Math.cos(a)*0.20,Math.sin(a)*0.20,0.015,0,Math.PI*2);discShape.holes.push(h)}
  const disc=new THREE.Mesh(new THREE.ExtrudeGeometry(discShape,{depth:0.024,bevelEnabled:false}),brakeMat);disc.rotation.x=Math.PI/2;g.add(disc);
  const calShape=new THREE.Shape();calShape.moveTo(-0.03,-0.055);calShape.lineTo(0.03,-0.055);calShape.lineTo(0.03,0.055);calShape.lineTo(-0.01,0.055);calShape.lineTo(-0.01,0.018);calShape.lineTo(-0.03,0.018);calShape.closePath();
  const caliper=new THREE.Mesh(new THREE.ExtrudeGeometry(calShape,{depth:0.032,bevelEnabled:true,bevelThickness:0.004,bevelSize:0.004}),caliperMat);
  caliper.rotation.x=Math.PI/2;caliper.position.set(0,-0.035,0.205);g.add(caliper);
  return g;
}
const wheelFL=buildWheel();wheelFL.position.set(1.05,0,-0.98);car.add(wheelFL);
const wheelFR=buildWheel();wheelFR.position.set(1.05,0,0.98);car.add(wheelFR);
const wheelRL=buildWheel();wheelRL.position.set(3.62,0,-0.98);car.add(wheelRL);
const wheelRR=buildWheel();wheelRR.position.set(3.62,0,0.98);car.add(wheelRR);
const wheels=[wheelFL,wheelFR,wheelRL,wheelRR];

// headlights
function buildHeadlight(side){
  const g=new THREE.Group();g.position.set(0.25,0.52,side*0.92);
  const house=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.075,0.11),new THREE.MeshStandardMaterial({color:0x0a0e14}));house.rotation.y=side*0.15;g.add(house);
  const lens=new THREE.Mesh(new THREE.SphereGeometry(0.034,16,16,0,Math.PI*2,0,Math.PI/2),glassMat);lens.position.z=side*0.065;g.add(lens);
  const drl=new THREE.Mesh(new THREE.TorusGeometry(0.022,0.005,8,16),lightMat);drl.position.z=side*0.045;drl.rotation.x=Math.PI/2;g.add(drl);
  const proj=new THREE.SpotLight(0xffffff,0,12,Math.PI/6,0.5,1);proj.position.set(0,0,side*0.09);proj.target.position.set(12,0,side*1.5);g.add(proj);g.add(proj.target);
  g.userData.light=proj;g.userData.drl=drl;
  return g;
}
const headL=buildHeadlight(-1);const headR=buildHeadlight(1);car.add(headL,headR);

// taillights
function buildTaillight(side){
  const g=new THREE.Group();g.position.set(4.32,0.56,side*0.98);
  const shape=new THREE.Shape();shape.moveTo(-0.05,-0.035);shape.lineTo(0.05,-0.035);shape.lineTo(0.055,0.035);shape.lineTo(-0.055,0.035);shape.closePath();
  const red=new THREE.Mesh(new THREE.ExtrudeGeometry(shape,{depth:0.035,bevelEnabled:true,bevelThickness:0.005,bevelSize:0.005}),new THREE.MeshStandardMaterial({color:0x7f0a0a,emissive:0x220000,emissiveIntensity:2}));

let audioCtx,osc,gainNode,noiseNode,noiseBuffer;
function initAudio(){
  if(audioCtx)return;
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  osc=audioCtx.createOscillator();osc.type='sawtooth';osc.frequency.setValueAtTime(110,audioCtx.currentTime);
  gainNode=audioCtx.createGain();gainNode.gain.setValueAtTime(0,audioCtx.currentTime);
  osc.connect(gainNode).connect(audioCtx.destination);osc.start();
  const bufferSize=4096;noiseBuffer=audioCtx.createBuffer(1,bufferSize,audioCtx.sampleRate);const data=noiseBuffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++)data[i]=Math.random()*2-1;
  noiseNode=audioCtx.createBufferSource();noiseNode.buffer=noiseBuffer;noiseNode.loop=true;
  const nf=audioCtx.createBiquadFilter();nf.type='bandpass';nf.frequency.value=400;nf.Q.value=2;
  noiseNode.connect(nf).connect(gainNode);noiseNode.start();
}

function updateDriveCamera(dt){
  const pos=car.position;const dir=new THREE.Vector3();car.getWorldDirection(dir);dir.y=0;dir.normalize();
  const right=new THREE.Vector3().cross(dir,new THREE.Vector3(0,1,0)).normalize();
  const up=new THREE.Vector3(0,1,0);
  let eye,target;
  if(camModes[camIdx]==='chase'){eye=pos.clone().add(dir.multiplyScalar(-6.5)).add(up.multiplyScalar(2.2));target=pos.clone().add(dir.multiplyScalar(8))}
  else if(camModes[camIdx]==='bonnet'){eye=pos.clone().add(dir.multiplyScalar(1.8)).add(up.multiplyScalar(1.0));target=pos.clone().add(dir.multiplyScalar(14))}
  else if(camModes[camIdx]==='cockpit'){eye=pos.clone().add(dir.multiplyScalar(0.7)).add(up.multiplyScalar(1.05)).add(right.multiplyScalar(-0.05));target=pos.clone().add(dir.multiplyScalar(10)).add(up.multiplyScalar(0.3))}
  else{
    const tp=trackPts[Math.floor((Date.now()%10000)/10000*trackPts.length)];eye=tp.clone().add(new THREE.Vector3(0,7,-12));target=pos;
  }
  camera.position.lerp(eye,dt*5);camera.lookAt(target);
}

// ---------- physics ----------
function closestTrackPoint(p){
  let best=0,bd=1e9;
  for(let i=0;i<trackPts.length;i++){const d=p.distanceTo(trackPts[i]);if(d<bd){bd=d;best=i}}
  return best;
}
function drivePhysics(dt){
  const accel=keys['KeyW']||keys['ArrowUp']?1:0;
  const brakeI=keys['KeyS']||keys['ArrowDown']?1:0;
  carState.throttle=THREE.MathUtils.lerp(carState.throttle,accel,dt*5);
  carState.brake=THREE.MathUtils.lerp(carState.brake,brakeI,dt*8);
  let steerInput=0;
  if(keys['KeyA']||keys['ArrowLeft'])steerInput=-1;
  if(keys['KeyD']||keys['ArrowRight'])steerInput=1;
  const speedSens=Math.max(0.3,1-carState.speed/260);
  carState.steer=THREE.MathUtils.lerp(carState.steer,steerInput*0.42*speedSens,dt*6);
  // engine
  const targetRpm=800+(carState.speed/300)*6400;
  carState.rpm=THREE.MathUtils.lerp(carState.rpm,targetRpm,dt*(2+carState.throttle*3));
  if(carState.rpm>7000){carState.rpm=7000;if(carState.gear<5&&!carState.manual){carState.gear++}}
  if(carState.rpm<1200&&carState.gear>1&&carState.throttle<0.2){carState.gear--}
  // force
  const torqueCurve=Math.sin((carState.rpm-800)/6400*Math.PI);
  const driveForce=carState.throttle*torqueCurve*4200*(carState.gearRatios[carState.gear-1])*carState.finalDrive/carState.wheelRadius;
  const drag=carState.speed*carState.speed*0.45;
  const brakeForce=carState.brake*7500;
  const handBrakeForce=carState.handbrake?4000:0;
  const acc=(driveForce-drag-brakeForce-handBrakeForce)/carState.mass;
  carState.speed=Math.max(0,carState.speed+acc*dt);
  // steering / lateral
  const steerAngle=carState.steer;
  const lateralGrip=1.0-Math.min(1,carState.speed/320)*0.45;
  const overdrive=Math.abs(steerAngle)*carState.speed*0.009;
  let slide=0;
  if(overdrive>lateralGrip){slide=(overdrive-lateralGrip)*1.2}
  if(carState.handbrake)slide+=0.5;
  const yaw=(steerAngle*carState.speed*0.0014)-slide*0.05*Math.sign(steerInput||1);
  car.rotateY(yaw*dt);
  const dir=new THREE.Vector3();car.getWorldDirection(dir);dir.y=0;dir.normalize();
  const move=dir.clone().multiplyScalar(carState.speed*dt);
  // drift lateral
  const right=new THREE.Vector3().cross(dir,new THREE.Vector3(0,1,0)).normalize();
  move.add(right.multiplyScalar(-slide*carState.speed*0.6*dt));
  car.position.add(move);
  // suspension visual
  const roll=steerAngle*carState.speed*0.0005;
  const pitch=(driveForce-brakeForce)*0.000015;
  car.rotation.z=-roll;car.rotation.x=pitch;
  // wheels
  const wheelRot=carState.speed/carState.wheelRadius*dt;
  wheels.forEach((w,i)=>{
    const isFront=i<2;
    w.rotation.x+=wheelRot;
    w.rotation.y=steerAngle*(isFront?1:0);
  });
  // wing
  if(carState.speed>33.3){wingGroup.visible=true;wingGroup.position.y=THREE.MathUtils.lerp(wingGroup.position.y,0.62,dt*2);wingGroup.rotation.x=THREE.MathUtils.lerp(wingGroup.rotation.x,-0.25,dt*2)}
  else{wingGroup.position.y=THREE.MathUtils.lerp(wingGroup.position.y,0.0,dt*2);wingGroup.rotation.x=THREE.MathUtils.lerp(wingGroup.rotation.x,0,dt*2)}
  // lights braking
  const brakeLight=carState.brake>0.3;
  [tailL,tailR].forEach(t=>{t.userData.red.material.emissiveIntensity=brakeLight?10:2;t.userData.point.intensity=brakeLight?4:0});
}
// ---------- skid / smoke ----------
const particles=[];const skids=[];
function spawnSkid(x,z){
  if(Math.random()>0.4)return;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(0.14,0.14),new THREE.MeshStandardMaterial({color:0x222222,transparent:true,opacity:0.45}));
  m.position.set(x,0.02,z);m.rotation.x=-Math.PI/2;scene.add(m);skids.push({mesh:m,life:1});
}
function spawnSmoke(x,z){
  if(Math.random()>0.6)return;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(0.5,0.5),new THREE.MeshStandardMaterial({color:0x888888,transparent:true,opacity:0.35}));
  m.position.set(x,0.35,z);scene.add(m);particles.push({mesh:m,life:1,dy:0.8});
}
function updateFx(dt){
  for(let i=skids.length-1;i>=0;i--){const s=skids[i];s.life-=dt*0.8;s.mesh.material.opacity=0.45*s.life;s.mesh.scale.setScalar(0.5+0.5*s.life);if(s.life<=0){scene.remove(s.mesh);skids.splice(i,1)}}
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt*0.6;p.mesh.position.y+=p.dy*dt;p.mesh.material.opacity=0.35*p.life;p.mesh.scale.setScalar(1+2*(1-p.life));if(p.life<=0){scene.remove(p.mesh);particles.splice(i,1)}}
}
// ---------- minimap ----------
function drawMinimap(){
  mmCtx.clearRect(0,0,170,170);
  mmCtx.strokeStyle='rgba(255,255,255,0.15)';mmCtx.lineWidth=2;mmCtx.beginPath();
  mmCtx.arc(85,85,78,0,Math.PI*2);mmCtx.stroke();
  let cx=0,cz=0;
  trackPts.forEach(p=>{cx+=p.x;cz+=p.z});
  cx/=trackPts.length;cz/=trackPts.length;
  let minx=1e9,maxx=-1e9,minz=1e9,maxz=-1e9;
  trackPts.forEach(p=>{minx=Math.min(minx,p.x);maxx=Math.max(maxx,p.x);minz=Math.min(minz,p.z);maxz=Math.max(maxz,p.z)});
  const sx=150/(maxx-minx),sz=150/(maxz-minz),sc=Math.min(sx,sz);
  mmCtx.strokeStyle='rgba(100,160,255,0.35)';mmCtx.lineWidth=3;mmCtx.beginPath();
  trackPts.forEach((p,i)=>{const x=85+(p.x-(minx+maxx)/2)*sc;const y=85+(p.z-(minz+maxz)/2)*sc;if(i===0)mmCtx.moveTo(x,y);else mmCtx.lineTo(x,y)});
  mmCtx.closePath();mmCtx.stroke();
  const cxp=85+(car.position.x-(minx+maxx)/2)*sc;const cyp=85+(car.position.z-(minz+maxz)/2)*sc;
  mmCtx.fillStyle='#fbbf24';mmCtx.beginPath();mmCtx.arc(cxp,cyp,4,0,Math.PI*2);mmCtx.fill();
}
// ---------- modes ----------
function enterShowroom(){
  mode='showroom';document.getElementById('cfg').hidden=false;document.getElementById('btnShowroom').classList.add('hidden');
  driveUI.style.display='none';mm.style.display='none';trackGroup.visible=false;
  camera.position.set(0,2,-9);controls.enabled=true;controls.target.set(2.25,0.9,0);resetCar();
}
function enterDrive(){
  initAudio();setMuted(mute);
  mode='drive';document.getElementById('cfg').hidden=true;document.getElementById('btnShowroom').classList.remove('hidden');
  driveUI.style.display='flex';mm.style.display='block';trackGroup.visible=true;
  controls.enabled=false;resetCar();
  wingGroup.visible=false;
}
// lap timing
let lapStart=Date.now(),bestLap=999999,lastCp=0;
function updateLap(){
  const cp=closestTrackPoint(car.position);
  if(cp<50&&lastCp>300){
    const t=Date.now()-lapStart;if(t<bestLap)bestLap=t;lapStart=Date.now();
  }lastCp=cp;
  const ms=Date.now()-lapStart;
  const s=Math.floor(ms/1000),cs=Math.floor((ms%1000)/10);
  document.getElementById('lap').textContent=s+':'+(cs<10?'0':'')+cs+'.0'+'   best '+(bestLap===999999?'--':Math.floor(bestLap/1000)+':'+(Math.floor(bestLap%1000/10)<10?'0':'')+Math.floor(bestLap%1000/10));
}

// ---------- animate ----------
const clock=new THREE.Clock();let showStart=Date.now();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const t=Date.now()-showStart;
  if(mode==='showroom'){
    turnAngle+=dt*0.12;
    car.rotation.y=turnAngle;
    reveal=Math.min(1,reveal+dt*0.5);
    body.material.opacity=1-Math.pow(1-reveal,3);
    body.material.transparent=reveal<1;
    body.material.needsUpdate=true;
    const phase=t/1200;
    [softL,softR,backL].forEach((l,i)=>{l.intensity=2+Math.sin(phase+i)*0.8});
    controls.update();
    applyPresetPreset();
    // doors
    const doorTarget=doorsOpen?1.35:0;
    doorL.rotation.x=THREE.MathUtils.lerp(doorL.rotation.x,doorTarget,dt*3);
    doorR.rotation.x=THREE.MathUtils.lerp(doorR.rotation.x,doorTarget,dt*3);
    doorL.position.y=1.0+Math.sin(doorL.rotation.x)*0.8;doorL.position.z=-1.62+Math.cos(doorL.rotation.x)*0.0-0;
    doorR.position.y=1.0+Math.sin(doorR.rotation.x)*0.8;doorR.position.z=1.62;
    composer.render();
  }else{
    drivePhysics(dt);
    updateDriveCamera(dt);
    updateFx(dt);
    updateLap();
    document.getElementById('spd').textContent=Math.floor(carState.speed*3.6);
    document.getElementById('rpm').textContent=Math.floor(carState.rpm);
    document.getElementById('gear').textContent=carState.gear;
    // audio
    if(gainNode){
      const base=60+(carState.rpm/7200)*340;
      osc.frequency.setTargetAtTime(base*carState.gearRatios[carState.gear-1]/3.6,audioCtx.currentTime,0.03);
      gainNode.gain.setTargetAtTime(0.2+carState.throttle*0.25,audioCtx.currentTime,0.05);
    }
    drawMinimap();
    renderer.render(scene,camera);
  }
}
let applyPresetPreset=applyPreset;

// loader finish
setTimeout(()=>{setProgress(100)},500);
animate();
</script>
