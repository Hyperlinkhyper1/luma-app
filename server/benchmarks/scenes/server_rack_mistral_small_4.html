        .server-item.selected {

        .component-info {
            margin-top: 10px;

        }

        .health-panel {

        }

        .health-metric {
            display: flex;

        .health-bar {

        .health-bar-fill {

        .rack-unit {

        .rack-unit:nth-child(odd) {

        .failure-warning {

        }

        .comparison-container {
            display: flex;

        }

        .comparison-item {

        .comparison-bar {

        .comparison-bar-fill {

        #rack-power-display {

        }

        .power-item {

    <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.132.2/examples/jsm/"}}</script>
<script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.module.js';
        import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.132.2/examples/jsm/controls/OrbitControls.js';

        // Main application class
        class ServerArchitectureLab {
            constructor() {
                this.initThreeJS();
                this.initScene();
                this.initUI();
                this.initServers();
                this.initRack();
                this.setupEventListeners();
                this.animate();
                this.updateStats();
            }

            initThreeJS() {
                this.container = document.getElementById('main-container');
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x222222);

                this.camera = new THREE.PerspectiveCamera(60, this.container.clientWidth / this.container.clientHeight, 0.1, 1000);
                this.camera.position.set(0, 2, 5);

                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                this.renderer.setPixelRatio(window.devicePixelRatio);
                this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                this.container.appendChild(this.renderer.domElement);

                this.controls = new OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.05;

                // Lighting
                this.ambientLight = new THREE.AmbientLight(0x404040, 0.5);
                this.scene.add(this.ambientLight);

                this.directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                this.directionalLight.position.set(10, 20, 15);
                this.directionalLight.castShadow = true;
                this.directionalLight.shadow.mapSize.width = 2048;
                this.directionalLight.shadow.mapSize.height = 2048;
                this.directionalLight.shadow.camera.near = 0.5;
                this.directionalLight.shadow.camera.far = 50;
                this.scene.add(this.directionalLight);

                this.hemisphereLight = new THREE.HemisphereLight(0x404040, 0x101010, 0.3);
                this.scene.add(this.hemisphereLight);

                // Stats
                this.stats = {
                    fps: 0,
                    drawCalls: 0,
                    triangles: 0
                };

                // State
                this.mode = 'rack'; // 'rack' or 'slice'
                this.selectedServer = null;
                this.currentSliceServer = null;
                this.airflowVisible = false;
                this.powerPathVisible = false;
                this.dataPathVisible = false;
                this.cutawayVisible = false;
                this.exploded = false;
                this.coverOpen = false;
                this.failureMode = null;
                this.failureTimer = 0;
                this.simulatedTemps = {};
                this.simulatedPowers = {};
            }

            initScene() {
                // Create background plane
                const bgGeometry = new THREE.PlaneGeometry(100, 100);
                const bgMaterial = new THREE.MeshStandardMaterial({
                    color: 0x1a1a1a,
                    roughness: 0.8,
                    metalness: 0.2
                });
                const bgPlane = new THREE.Mesh(bgGeometry, bgMaterial);
                bgPlane.rotation.x = -Math.PI / 2;
                bgPlane.position.y = -1;
                this.scene.add(bgPlane);

                // Create rack group
                this.rackGroup = new THREE.Group();
                this.scene.add(this.rackGroup);

                // Create slice group (initially hidden)
                this.sliceGroup = new THREE.Group();
                this.sliceGroup.visible = false;
                this.scene.add(this.sliceGroup);

                // Create airflow particles
                this.airflowParticles = [];
                this.initAirflowParticles();

                // Create power path lines
                this.powerPathLines = [];
                this.initPowerPathLines();

                // Create data path lines
                this.dataPathLines = [];
                this.initDataPathLines();
            }

            initAirflowParticles() {
                const particleCount = 2000;
                const particles = new THREE.BufferGeometry();
                const positions = new Float32Array(particleCount * 3);
                const colors = new Float32Array(particleCount * 3);
                const sizes = new Float32Array(particleCount);

                for (let i = 0; i < particleCount; i++) {
                    positions[i * 3] = (Math.random() - 0.5) * 20;
                    positions[i * 3 + 1] = Math.random() * 10;
                    positions[i * 3 + 2] = (Math.random() - 0.5) * 20;

                    colors[i * 3] = 0.2 + Math.random() * 0.3;
                    colors[i * 3 + 1] = 0.6 + Math.random() * 0.3;
                    colors[i * 3 + 2] = 1.0;

                    sizes[i] = 0.1 + Math.random() * 0.3;
                }

                particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                particles.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                particles.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

                const particleMaterial = new THREE.PointsMaterial({
                    size: 0.2,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.6,
                    sizeAttenuation: true
                });

                this.airflowParticleSystem = new THREE.Points(particles, particleMaterial);
                this.airflowParticleSystem.visible = false;
                this.scene.add(this.airflowParticleSystem);
            }

            initPowerPathLines() {
                this.powerPathLines = [];
                for (let i = 0; i < 50; i++) {
                    const lineGeometry = new THREE.BufferGeometry();
                    const lineMaterial = new THREE.LineBasicMaterial({
                        color: 0xffff00,
                        transparent: true,
                        opacity: 0.5,
                        linewidth: 2
                    });

                    const line = new THREE.Line(lineGeometry, lineMaterial);
                    line.visible = false;
                    this.scene.add(line);
                    this.powerPathLines.push(line);
                }
            }

            initDataPathLines() {
                this.dataPathLines = [];
                for (let i = 0; i < 30; i++) {
                    const lineGeometry = new THREE.BufferGeometry();
                    const lineMaterial = new THREE.LineBasicMaterial({
                        color: 0x00ff00,
                        transparent: true,
                        opacity: 0.6,
                        linewidth: 1.5
                    });

                    const line = new THREE.Line(lineGeometry, lineMaterial);
                    line.visible = false;
                    this.scene.add(line);
                    this.dataPathLines.push(line);
                }
            }

            initUI() {
                // Server list
                this.serverList = document.getElementById('server-list');

                // Server info
                this.serverInfo = document.getElementById('server-info');
                this.componentInfo = document.getElementById('component-info');

                // Setup buttons
                document.getElementById('rack-view').addEventListener('click', () => this.setMode('rack'));
                document.getElementById('slice-view').addEventListener('click', () => this.setMode('slice'));
                document.getElementById('open-cover').addEventListener('click', () => this.toggleCover());
                document.getElementById('cutaway').addEventListener('click', () => this.toggleCutaway());
                document.getElementById('explode').addEventListener('click', () => this.toggleExplode());
                document.getElementById('airflow').addEventListener('click', () => this.toggleAirflow());
                document.getElementById('power-path').addEventListener('click', () => this.togglePowerPath());
                document.getElementById('data-path').addEventListener('click', () => this.toggleDataPath());
                document.getElementById('failures').addEventListener('click', () => this.toggleFailures());
                document.getElementById('reset').addEventListener('click', () => this.resetSimulation());
            }

            initServers() {
                this.servers = [];

                // Server 1: 4U AI/GPU Server (U39-U42)
                this.servers.push(this.createAIGPUServer(39, 42, 'AI COMPUTE NODE'));

                // Server 2: 2U Virtualization Server (U37-U38)
                this.servers.push(this.createVirtualizationServer(37, 38, 'VIRTUALIZATION HOST'));

                // Server 3: 1U General Purpose (U35-U36)
                this.servers.push(this.createGeneralPurposeServer(35, 36, 'WEB SERVER'));

                // Server 4: 1U General Purpose (U34)
                this.servers.push(this.createGeneralPurposeServer(34, 34, 'APP SERVER'));

                // Server 5: 4U Storage Server (U30-U33)
                this.servers.push(this.createStorageServer(30, 33, 'STORAGE ARRAY'));

                // Server 6: 1U Network Appliance (U29)
                this.servers.push(this.createNetworkAppliance(29, 29, 'NETWORK FIREWALL'));

                // Server 7: 2U Database Server (U27-U28)
                this.servers.push(this.createDatabaseServer(27, 28, 'DATABASE SERVER'));

                // Empty units
                for (let u = 43; u <= 42; u--) {
                    this.createEmptyUnit(u);
                }
            }

            initRack() {
                // Create 42U rack
                const rackHeight = 42 * 44.45;
                const rackDepth = 120;
                const rackWidth = 60;

                // Rack frame
                const rackFrameGeometry = new THREE.BoxGeometry(rackWidth, rackHeight, 10);
                const rackFrameMaterial = new THREE.MeshStandardMaterial({
                    color: 0x333333,
                    metalness: 0.8,
                    roughness: 0.3
                });

                // Front rails
                const frontRailGeometry = new THREE.BoxGeometry(2, rackHeight, 5);
                const frontRailMaterial = new THREE.MeshStandardMaterial({
                    color: 0x555555,
                    metalness: 0.9,
                    roughness: 0.2
                });

                // Rear rails
                const rearRailGeometry = new THREE.BoxGeometry(2, rackHeight, 5);
                const rearRailMaterial = rackFrameMaterial;

                // Create rack structure
                this.rackFrame = new THREE.Mesh(rackFrameGeometry, rackFrameMaterial);
                this.rackFrame.position.set(0, rackHeight / 2 - 22.225, -rackDepth / 2 + 5);
                this.rackGroup.add(this.rackFrame);

                // Front rails
                const frontLeftRail = new THREE.Mesh(frontRailGeometry, frontRailMaterial);
                frontLeftRail.position.set(-rackWidth / 2 + 1, rackHeight / 2 - 22.225, -rackDepth / 2 + 7.5);
                this.rackGroup.add(frontLeftRail);

                const frontRightRail = new THREE.Mesh(frontRailGeometry, frontRailMaterial);
                frontRightRail.position.set(rackWidth / 2 - 1, rackHeight / 2 - 22.225, -rackDepth / 2 + 7.5);
                this.rackGroup.add(frontRightRail);

                // Rear rails
                const rearLeftRail = new THREE.Mesh(rearRailGeometry, rearRailMaterial);
                rearLeftRail.position.set(-rackWidth / 2 + 1, rackHeight / 2 - 22.225, rackDepth / 2 - 7.5);
                this.rackGroup.add(rearLeftRail);

                const rearRightRail = new THREE.Mesh(rearRailGeometry, rearRailMaterial);
                rearRightRail.position.set(rackWidth / 2 - 1, rackHeight / 2 - 22.225, rackDepth / 2 - 7.5);
                this.rackGroup.add(rearRightRail);

                // Rack unit markings
                for (let u = 0; u <= 42; u++) {
                    const unitHeight = 44.45;
                    const yPos = u * unitHeight + unitHeight / 2 - 22.225;

                    // Front rail markings
                    const frontMarking = new THREE.Mesh(
                        new THREE.PlaneGeometry(40, 20),
                        new THREE.MeshBasicMaterial({ color: 0x666666, transparent: true, opacity: 0.3 })
                    );
                    frontMarking.position.set(-rackWidth / 2 + 5, yPos, -rackDepth / 2 + 10);
                    frontMarking.rotation.y = Math.PI / 2;
                    this.rackGroup.add(frontMarking);

                    const unitText = document.createElement('div');
                    unitText.style.position = 'absolute';
                    unitText.style.color = '#888';
                    unitText.style.fontSize = '10px';
                    unitText.style.fontFamily = 'monospace';
                    unitText.textContent = `U${42 - u}`;
                    unitText.style.top = `${50 + u * 20}px`;
                    unitText.style.left = '10px';
                    this.serverList.appendChild(unitText);
                }

                // Install servers in rack
                this.servers.forEach(server => {
                    this.rackGroup.add(server.mesh);
                    server.mesh.position.y = server.startUnit * 44.45 + (server.endUnit - server.startUnit) * 22.225;
                    server.mesh.position.z = -55;
                });

                // Add rack accessories
                this.addRackAccessories();
            }

            addRackAccessories() {
                const rackHeight = 42 * 44.45;
                const rackDepth = 120;
                const rackWidth = 60;

                // Top frame
                const topFrameGeometry = new THREE.BoxGeometry(rackWidth + 20, 10, rackDepth + 20);
                const topFrameMaterial = new THREE.MeshStandardMaterial({
                    color: 0x444444,
                    metalness: 0.7,
                    roughness: 0.4
                });
                const topFrame = new THREE.Mesh(topFrameGeometry, topFrameMaterial);
                topFrame.position.set(0, rackHeight + 5, 0);
                this.rackGroup.add(topFrame);

                // Bottom frame
                const bottomFrameGeometry = new THREE.BoxGeometry(rackWidth + 20, 10, rackDepth + 20);
                const bottomFrame = new THREE.Mesh(topFrameGeometry, topFrameMaterial);
                bottomFrame.position.set(0, -5, 0);
                this.rackGroup.add(bottomFrame);

                // Side panels
                const sidePanelGeometry = new THREE.BoxGeometry(5, rackHeight, rackDepth);
                const sidePanelMaterial = new THREE.MeshStandardMaterial({
                    color: 0x333333,
                    metalness: 0.6,
                    roughness: 0.5
                });

                const leftPanel = new THREE.Mesh(sidePanelGeometry, sidePanelMaterial);
                leftPanel.position.set(-rackWidth / 2 - 2.5, rackHeight / 2 - 22.225, 0);
                this.rackGroup.add(leftPanel);

                const rightPanel = new THREE.Mesh(sidePanelGeometry, sidePanelMaterial);
                rightPanel.position.set(rackWidth / 2 + 2.5, rackHeight / 2 - 22.225, 0);
                this.rackGroup.add(rightPanel);

                // Feet
                const footGeometry = new THREE.CylinderGeometry(5, 8, 10, 16);
                const footMaterial = new THREE.MeshStandardMaterial({
                    color: 0x222222,
                    metalness: 0.8,
                    roughness: 0.3
                });

                for (let i = -1; i <= 1; i += 2) {
                    for (let j = -1; j <= 1; j += 2) {
                        const foot = new THREE.Mesh(footGeometry, footMaterial);
                        foot.position.set(
                            i * (rackWidth / 2 + 10),
                            -5,
                            j * (rackDepth / 2 + 10)
                        );
                        foot.rotation.x = Math.PI / 2;
                        this.rackGroup.add(foot);
                    }
                }
            }

            createAIGPUServer(startUnit, endUnit, name) {
                const height = (endUnit - startUnit + 1) * 44.45;
                const server = {
                    name: name,
                    startUnit: startUnit,
                    endUnit: endUnit,
                    height: height,
                    type: 'gpu',
                    position: { x: 0, y: 0, z: 0 },
                    mesh: new THREE.Group(),
                    components: [],
                    selected: false,
                    power: 8000,
                    temp: 75
                };

                // Create chassis
                const chassisGeometry = new THREE.BoxGeometry(55, height, 80);
                const chassisMaterial = new THREE.MeshStandardMaterial({
                    color: 0x1a1a1a,
                    metalness: 0.8,
                    roughness: 0.2
                });
                const chassis = new THREE.Mesh(chassisGeometry, chassisMaterial);
                chassis.castShadow = true;
                chassis.receiveShadow = true;
                server.mesh.add(chassis);
                server.components.push({ name: 'chassis', mesh: chassis });

                // Create front bezel
                const bezelGeometry = new THREE.BoxGeometry(57, height, 2);
                const bezelMaterial = new THREE.MeshStandardMaterial({
                    color: 0x333333,
                    metalness: 0.7,
                    roughness: 0.3
                });
                const bezel = new THREE.Mesh(bezelGeometry, bezelMaterial);
                bezel.position.z = 41;
                chassis.add(bezel);

                // Create GPU modules (4x)
                for (let i = 0; i < 4; i++) {
                    const gpuGroup = new THREE.Group();
                    gpuGroup.position.set(-15 + i * 12, 100, 30);

            setMode(mode) {
                if (this.mode === mode) return;

                this.mode = mode;

                if (mode === 'rack') {
                    // Switch to rack view
                    this.rackGroup.visible = true;
                    this.sliceGroup.visible = false;
                    this.controls.reset();
                    this.camera.position.set(0, 2, 5);
                    this.camera.lookAt(0, 2, 0);

                    // Reset slice server position
                    if (this.currentSliceServer) {
                        this.currentSliceServer.mesh.position.copy(this.currentSliceServer.originalPosition);
                        this.currentSliceServer.mesh.rotation.set(0, 0, 0);
                    }

                    // Update UI
                    document.getElementById('rack-view').classList.add('active');
                    document.getElementById('slice-view').classList.remove('active');
                } else {
                    // Switch to slice view
                    this.rackGroup.visible = false;
                    this.sliceGroup.visible = true;

                    // Position slice server
                    if (this.selectedServer) {
                        this.currentSliceServer = this.selectedServer;
                        this.currentSliceServer.originalPosition = this.currentSliceServer.mesh.position.clone();

                        // Position in slice view
                        this.currentSliceServer.mesh.position.set(0, this.currentSliceServer.height / 200, 0);
                        this.currentSliceServer.mesh.rotation.set(0, Math.PI / 4, 0);

                        // Add to slice group
                        this.sliceGroup.add(this.currentSliceServer.mesh);
                    }

                    // Update UI
                    document.getElementById('rack-view').classList.remove('active');
                    document.getElementById('slice-view').classList.add('active');
                }
            }

            toggleCover() {
                this.coverOpen = !this.coverOpen;

                if (this.currentSliceServer) {
                    // Find top cover component
                    const coverComponent = this.currentSliceServer.components.find(c => c.name === 'top-cover');
                    if (coverComponent) {
                        coverComponent.mesh.visible = !this.coverOpen;
                    }
                }

                document.getElementById('open-cover').classList.toggle('active', this.coverOpen);
            }

            toggleCutaway() {
                this.cutawayVisible = !this.cutawayVisible;

                if (this.currentSliceServer) {
                    // Find chassis component
                    const chassisComponent = this.currentSliceServer.components.find(c => c.name === 'chassis');
                    if (chassisComponent) {
                        chassisComponent.mesh.material.transparent = this.cutawayVisible;
                        chassisComponent.mesh.material.opacity = this.cutawayVisible ? 0.3 : 1.0;
                    }
                }

                document.getElementById('cutaway').classList.toggle('active', this.cutawayVisible);
            }

            toggleExplode() {
                this.exploded = !this.exploded;

                if (this.currentSliceServer) {
                    const offset = this.exploded ? 30 : 0;

                    this.currentSliceServer.components.forEach(component => {
                        if (component.name === 'chassis') {
                            component.mesh.position.y = offset;
                        } else if (component.name.startsWith('cpu-') || component.name === 'cpu-area') {
                            component.mesh.position.y = 150 + offset;
                        } else if (component.name.startsWith('gpu-') || component.name === 'memory-area') {
                            component.mesh.position.y = 100 + offset;
                        } else if (component.name === 'fan-wall') {
                            component.mesh.position.y = 50 + offset;
                        } else if (component.name === 'psu-area') {
                            component.mesh.position.y = 20 + offset;
                        }
                    });
                }

                document.getElementById('explode').classList.toggle('active', this.exploded);
            }

            toggleAirflow() {
                this.airflowVisible = !this.airflowVisible;
                this.airflowParticleSystem.visible = this.airflowVisible;
                document.getElementById('airflow').classList.toggle('active', this.airflowVisible);

            togglePowerPath() {

            resetSimulation() {
                this.airflowVisible = false;
                this.powerPathVisible = false;
                this.dataPathVisible = false;
                this.cutawayVisible = false;
                this.exploded = false;
                this.coverOpen = false;
                this.failureMode = null;

                this.airflowParticleSystem.visible = false;
                this.powerPathLines.forEach(line => line.visible = false);
                this.dataPathLines.forEach(line => line.visible = false);

                document.getElementById('airflow').classList.remove('active');
                document.getElementById('power-path').classList.remove('active');

                document.getElementById('cutaway').classList.remove('active');
                document.getElementById('explode').classList.remove('active');
                document.getElementById('open-cover').classList.remove('active');

                // Reset server positions
                if (this.currentSliceServer) {
                    this.currentSliceServer.mesh.position.copy(this.currentSliceServer.originalPosition);
                    this.currentSliceServer.mesh.rotation.set(0, 0, 0);

                    this.currentSliceServer.components.forEach(component => {
                        component.mesh.position.set(0, 0, 0);
                        component.mesh.rotation.set(0, 0, 0);
                    });
                }

                // Reset temps and power
                this.simulatedTemps = {};
                this.simulatedPowers = {};

                // Update health display
                document.getElementById('cpu1-temp').textContent = '65°C';
                document.getElementById('cpu2-temp').textContent = '62°C';

            setupEventListeners() {
                // Server selection
                this.raycaster = new THREE.Raycaster();
                this.mouse = new THREE.Vector2();

                this.container.addEventListener('mousemove', (event) => {
                    if (this.mode !== 'rack') return;

                    this.mouse.x = (event.clientX / this.container.clientWidth) * 2 - 1;
                    this.mouse.y = -(event.clientY / this.container.clientHeight) * 2 + 1;

                    this.raycaster.setFromCamera(this.mouse, this.camera);

                    const intersects = this.raycaster.intersectObjects(
                        this.servers.map(s => s.mesh),
                        true
                    );

                    if (intersects.length > 0) {
                        const server = intersects[0].object.userData.server;
                        if (server && server !== this.selectedServer) {
                            // Highlight server
                            if (this.selectedServer) {
                                this.selectedServer.mesh.children.forEach(child => {
                                    if (child.material) child.material.emissive.setHex(0x000000);
                                });
                            }

                            this.selectedServer = server;
                            server.selected = true;
                            server.mesh.children.forEach(child => {
                                if (child.material) child.material.emissive.setHex(0x4fc3f7);
                            });

                            // Update UI
                            this.updateServerInfo();
                        }
                    } else if (this.selectedServer) {
                        // Clear selection
                        this.selectedServer.mesh.children.forEach(child => {
                            if (child.material) child.material.emissive.setHex(0x000000);
                        });
                        this.selectedServer = null;
                        this.updateServerInfo();
                    }
                });

                this.container.addEventListener('click', (event) => {
                    if (this.mode !== 'rack') return;

                    this.mouse.x = (event.clientX / this.container.clientWidth) * 2 - 1;
                    this.mouse.y = -(event.clientY / this.container.clientHeight) * 2 + 1;

                    this.raycaster.setFromCamera(this.mouse, this.camera);

                    const intersects = this.raycaster.intersectObjects(
                        this.servers.map(s => s.mesh),
                        true
                    );

                    if (intersects.length > 0) {
                        const server = intersects[0].object.userData.server;
                        if (server) {
                            // Select server
                            this.selectedServer = server;

                            // Update UI
                            this.updateServerInfo();

                            // Enable slice view button
                            document.getElementById('slice-view').disabled = false;
                        }
                    }
                });

                // Component selection in slice view
                this.sliceGroup.addEventListener('click', (event) => {
                    if (this.mode !== 'slice' || !this.currentSliceServer) return;

                    this.mouse.x = (event.clientX / this.container.clientWidth) * 2 - 1;
                    this.mouse.y = -(event.clientY / this.container.clientHeight) * 2 + 1;

                    this.raycaster.setFromCamera(this.mouse, this.camera);

                    const intersects = this.raycaster.intersectObjects(
                        this.currentSliceServer.components.map(c => c.mesh),
                        true
                    );

                    if (intersects.length > 0) {
                        const component = intersects[0].object.userData.component;
                        if (component) {
                            this.updateComponentInfo(component);
                        }
                    }
                });
            }

            updateServerInfo() {
                if (!this.selectedServer) {
                    this.serverInfo.innerHTML = '<p>Select a server to view details</p>';
                    return;
                }

                const server = this.selectedServer;
                let html = `
                    <h4>${server.name}</h4>
                    <p><strong>Rack position:</strong> U${server.startUnit}-U${server.endUnit}</p>
                    <p><strong>Height:</strong> ${server.endUnit - server.startUnit + 1}U</p>
                    <p><strong>Purpose:</strong> ${server.info.purpose}</p>
                    <p><strong>Power:</strong> ${server.power} W typical</p>
                `;

                html += '<h5>Architecture</h5><p>';
                html += `${server.info.cpus}<br>`;
                html += `${server.info.memory}<br>`;
                html += `${server.info.storage}<br>`;
                html += `${server.info.networking}<br>`;
                html += `Cooling: ${server.info.cooling}`;
                html += '</p>';

                html += `<h5>Design Priority</h5><p>${server.info.designPriority || 'Balanced enterprise compute'}</p>`;

                this.serverInfo.innerHTML = html;
            }

            updateComponentInfo(component) {
                if (!component) {
                    this.componentInfo.innerHTML = '<p>Select a component</p>';
                    return;
                }

                let html = `
                    <h4>${component.name.replace(/-/g, ' ')}</h4>
                    <p><strong>Type:</strong> ${this.getComponentType(component.name)}</p>
                    <p><strong>Role:</strong> ${this.getComponentRole(component.name)}</p>
                `;

                this.componentInfo.innerHTML = html;
            }

            getComponentType(name) {
                if (name.includes('cpu')) return 'Server CPU';
                if (name.includes('gpu')) return 'GPU Accelerator';
                if (name.includes('memory') || name.includes('dimm')) return 'Memory Module';
                if (name.includes('fan')) return 'Cooling Fan';
                if (name.includes('psu')) return 'Power Supply Unit';
                if (name.includes('chassis')) return 'Server Chassis';
                if (name.includes('storage')) return 'Storage System';
                return 'Component';
            }

            getComponentRole(name) {
                if (name.includes('cpu')) return 'General processing';
                if (name.includes('gpu')) return 'AI / compute acceleration';
                if (name.includes('memory')) return 'System memory';
                if (name.includes('fan')) return 'Airflow management';
                if (name.includes('psu')) return 'Power delivery';
                if (name.includes('chassis')) return 'Structural enclosure';
                if (name.includes('storage')) return 'Data storage';
                return 'System component';
            }

            updateStats() {
                // Update FPS counter
                setInterval(() => {
                    const now = performance.now();
                    const delta = now - this.lastTime;
                    this.lastTime = now;

                    this.frameCount++;
                    this.totalTime += delta;

                    if (this.totalTime >= 1000) {
                        const fps = Math.round((this.frameCount * 1000) / this.totalTime);
                        document.getElementById('fps').textContent = fps;
                        this.frameCount = 0;
                        this.totalTime = 0;
                    }
                }, 1000);

                // Update draw calls and triangles (simplified)
                this.lastTime = performance.now();
                this.frameCount = 0;
                this.totalTime = 0;
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                // Update controls
                this.controls.update();

                // Update airflow particles
                if (this.airflowVisible && this.currentSliceServer) {
                    const particles = this.airflowParticleSystem.geometry.attributes.position.array;
                    const time = Date.now() * 0.001;

                    for (let i = 0; i < particles.length / 3; i++) {
                        // Simulate airflow from front to back
                        particles[i * 3] += Math.sin(time + i) * 0.02;
                        particles[i * 3 + 2] += Math.cos(time * 0.8 + i) * 0.03;

                        // Reset if out of bounds
                        if (particles[i * 3] > 30) particles[i * 3] = -30;
                        if (particles[i * 3 + 2] > 30) particles[i * 3 + 2] = -30;
                    }

                    this.airflowParticleSystem.geometry.attributes.position.needsUpdate = true;
                }

                // Update power path lines
                if (this.powerPathVisible && this.currentSliceServer) {
                    this.updatePowerPathLines();
                }

                // Update data path lines
                if (this.dataPathVisible && this.currentSliceServer) {
                    this.updateDataPathLines();
                }

                // Update failure simulation
                if (this.failureMode) {
                    this.updateFailureSimulation();
                }

                // Render
                this.renderer.render(this.scene, this.camera);
            }

            updatePowerPathLines() {
                // Simplified power path visualization
                const lines = this.powerPathLines;
                let lineIndex = 0;

                if (this.currentSliceServer.type === 'gpu') {
                    // AC -> PSU -> Motherboard -> CPU -> GPU
                    const start = new THREE.Vector3(-25, 10, -20);
                    const psu1 = new THREE.Vector3(-20, 20, -35);
                    const psu2 = new THREE.Vector3(0, 20, -35);
                    const mb = new THREE.Vector3(0, 150, 15);
                    const cpu1 = new THREE.Vector3(-10, 150, 20);
                    const cpu2 = new THREE.Vector3(10, 150, 20);
                    const gpu1 = new THREE.Vector3(-15, 100, 30);
                    const gpu2 = new THREE.Vector3(-3, 100, 30);
                    const gpu3 = new THREE.Vector3(9, 100, 30);
                    const gpu4 = new THREE.Vector3(21, 100, 30);

                    // Draw power lines
                    this.drawPowerLine(lines, lineIndex++, start, psu1, 0xffff00);
                    this.drawPowerLine(lines, lineIndex++, start, psu2, 0xffff00);
                    this.drawPowerLine(lines, lineIndex++, psu1, mb, 0xffff00);
                    this.drawPowerLine(lines, lineIndex++, psu2, mb, 0xffff00);
                    this.drawPowerLine(lines, lineIndex++, mb, cpu1, 0xffff00);
                    this.drawPowerLine(lines, lineIndex++, mb, cpu2, 0xffff00);
                    this.drawPowerLine(lines, lineIndex++, mb, gpu1, 0xffff00);
                    this.drawPowerLine(lines, lineIndex++, mb, gpu2, 0xffff00);
                    this.drawPowerLine(lines, lineIndex++, mb, gpu3, 0xffff00);
                    this.drawPowerLine(lines, lineIndex++, mb, gpu4, 0xffff00);
                }
            }

            drawPowerLine(lines, index, start, end, color) {
                if (index >= lines.length) return;

                const line = lines[index];
                const positions = [start.x, start.y, start.z, end.x, end.y, end.z];

                line.geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                line.material.color.setHex(color);
            }

            updateDataPathLines() {
                // Simplified data path visualization
                const lines = this.dataPathLines;
                let lineIndex = 0;

                if (this.currentSliceServer.type === 'gpu') {
                    // NVMe -> CPU -> RAM -> PCIe -> GPU -> NIC
                    const nvme = new THREE.Vector3(-15, 220, 38);
                    const cpu = new THREE.Vector3(0, 150, 20);
                    const ram = new THREE.Vector3(0, 100, 15);
                    const pcie = new THREE.Vector3(0, 180, -30);
                    const gpu = new THREE.Vector3(0, 100, 30);
                    const nic = new THREE.Vector3(18, 180, -38);

                    this.drawDataLine(lines, lineIndex++, nvme, cpu, 0x00ff00);
                    this.drawDataLine(lines, lineIndex++, cpu, ram, 0x00ff00);
                    this.drawDataLine(lines, lineIndex++, ram, pcie, 0x00ff00);
                    this.drawDataLine(lines, lineIndex++, pcie, gpu, 0x00ff00);
                    this.drawDataLine(lines, lineIndex++, gpu, nic, 0x00ff00);
                } else if (this.currentSliceServer.type === 'storage') {
                    // Drives -> Backplane -> HBA -> CPU -> NIC
                    const drives = new THREE.Vector3(0, 150, 35);
                    const backplane = new THREE.Vector3(0, 150, 25);
                    const hba = new THREE.Vector3(0, 150, 20);
                    const cpu = new THREE.Vector3(0, 150, 15);
                    const nic = new THREE.Vector3(15, 180, -38);

                    this.drawDataLine(lines, lineIndex++, drives, backplane, 0x00ff00);
                    this.drawDataLine(lines, lineIndex++, backplane, hba, 0x00ff00);
                    this.drawDataLine(lines, lineIndex++, hba, cpu, 0x00ff00);
                    this.drawDataLine(lines, lineIndex++, cpu, nic, 0x00ff00);
                }
            }

            drawDataLine(lines, index, start, end, color) {
                if (index >= lines.length) return;

                const line = lines[index];
                const positions = [start.x, start.y, start.z, end.x, end.y, end.z];

                line.geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                line.material.color.setHex(color);
            }

            updateFailureSimulation() {
                this.failureTimer += 0.01;

                if (this.failureMode === 'fan') {
                    // Simulate fan failure
                    const fanRPM = 12500 - Math.sin(this.failureTimer * 2) * 2000;
                    document.getElementById('fan-rpm').textContent = Math.round(fanRPM).toString();

                    // Increase temps
                    const tempIncrease = Math.sin(this.failureTimer) * 15;
                    document.getElementById('cpu1-temp').textContent = `${65 + tempIncrease}°C`;
                    document.getElementById('cpu2-temp').textContent = `${62 + tempIncrease}°C`;
                }
            }
        }

        // Initialize the application when loaded
        window.addEventListener('load', () => {
            new ServerArchitectureLab();
        });
    </script>
</body>
</html>
