<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { Water } from 'three/addons/objects/Water.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ===================================================================== */
/*  GLOBALS                                                              */
/* ===================================================================== */
const clamp = THREE.MathUtils.clamp;
const lerp  = THREE.MathUtils.lerp;
const smooth= THREE.MathUtils.smoothstep;
const rand  = (a,b)=>a+Math.random()*(b-a);
const TAU   = Math.PI*2;

const QUAY_Y = 4.0;
const BERTH_Z = 26.0;      // ship centre offset from quay edge (z=0)

const state = {
  hour: 17.4, playing: false, weather: 'clear',
  walk: false, departT: 0, departTarget: 0, sailing: false,
  gangwayT: 0
};

let scene, camera, renderer, composer, bloom, controls, sky, water;
let sunLight, hemi, ambLight, moonLight;
let shipRoot, shipHull;
let stars, rainPoints;
const nightMats = [];        // {mat, max}
const lampsMats = [];
let gulls = [], movingBoats = [], vehicles = [], peopleIM = null, peopleData = [];
let gangways = [], moorLines = [];
let tramGroup, forklift, tugGroup, radarDish;
let clock = new THREE.Clock();
let camTween = null;
let waterTime = 0;

const PRESETS = {
  miradouro:  { pos: [-168, 84, -196], target: [-8, 26, 30] },
  waterfront: { pos: [-104, 7.4, -7],  target: [16, 26, 26] },
  aerial:     { pos: [352, 336, 404],  target: [0, 18, 24] },
  river:      { pos: [236, 16, 438],   target: [-36, 34, 28] },
  deck:       { pos: [-62, 59.6, 26],  target: [-120, 28, -190] }
};

/* ===================================================================== */
/*  SMALL HELPERS                                                        */
/* ===================================================================== */
function nonIdx(g){ return g.index ? g.toNonIndexed() : g; }
function mergeG(list){
  const arr = list.map(nonIdx);
  const m = mergeGeometries(arr, false);
  arr.forEach(g=>{ if(g!==list[0]) g.dispose && g.dispose(); });
  return m;
}
function boxGeo(w,h,d,x,y,z){
  const g = new THREE.BoxGeometry(w,h,d);
  g.translate(x||0,y||0,z||0);
  return g;
}
function addBox(parent, mat, w,h,d, x,y,z, ry){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); if(ry) m.rotation.y = ry;
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m); return m;
}

/* ===================================================================== */
/*  SUN / SKY / TIME                                                     */
/* ===================================================================== */
const sunDir = new THREE.Vector3();
const cNightFog = new THREE.Color(0x0a1420);
const cDuskFog  = new THREE.Color(0xd79a6a);
const cDayFog   = new THREE.Color(0xa9c4dd);
const cHazeFog  = new THREE.Color(0xcbb79c);

function updateEnvironment(){
  const hour = state.hour;
  const phi = (hour - 6) / 12 * Math.PI;
  sunDir.set(Math.cos(phi)*0.86, Math.sin(phi), 0.46).normalize();

  const elev = sunDir.y;
  const dayF = smooth(elev, -0.14, 0.18);
  const golden = 1 - smooth(elev, 0.02, 0.42);

  // ---- sky
  if (sky){
    const u = sky.material.uniforms;
    u.turbidity.value = 4 + 6*golden + (state.weather==='haze'?8:0);
    u.rayleigh.value  = 1.4 + 2.2*golden + (state.weather==='haze'?1.2:0);
    u.mieCoefficient.value = 0.004 + 0.006*golden + (state.weather==='haze'?0.012:0);
    u.mieDirectionalG.value = 0.82;
    u.sunPosition.value.copy(sunDir);
  }

  // ---- sun light
  const warmC = new THREE.Color(0xff8b46);
  const dayC  = new THREE.Color(0xfff4e2);
  const sunC  = warmC.clone().lerp(dayC, smooth(elev, 0.02, 0.5));
  if (sunLight){
    sunLight.color.copy(sunC);
    sunLight.intensity = Math.pow(Math.max(elev,0), 0.55) * 3.3;
    sunLight.position.copy(sunDir).multiplyScalar(520).add(new THREE.Vector3(0,20,0));
    sunLight.visible = elev > -0.03;
  }
  if (moonLight){
    moonLight.intensity = (1-dayF) * 0.22;
    moonLight.position.set(-sunDir.x*400, 320, -sunDir.z*400);
  }
  if (hemi){
    const skyC = new THREE.Color(0x9dc4e8).lerp(new THREE.Color(0x2a1a14), 1-dayF);
    hemi.color.copy(skyC);
    hemi.groundColor.setHex(0x3a2a20).lerp(new THREE.Color(0x0a0e14), 1-dayF);
    hemi.intensity = 0.35 + 0.55*dayF;
  }
  if (ambLight){
    ambLight.intensity = 0.10 + 0.18*dayF;
  }

  // ---- fog
  let fogC;
  if (state.weather === 'haze'){
    fogC = cHazeFog.clone().multiplyScalar(0.25 + 0.75*dayF);
  } else if (elev > 0.22){
    fogC = cDayFog.clone();
  } else if (elev > -0.06){
    fogC = cDuskFog.clone().lerp(cDayFog, smooth(elev, -0.06, 0.22));
  } else {
    fogC = cNightFog.clone();
  }
  scene.fog.color.copy(fogC);
  scene.fog.density = state.weather === 'haze' ? 0.0011 : (state.weather==='rain' ? 0.0009 : 0.00034);

  // ---- water
  if (water){
    const u = water.material.uniforms;
    u.sunDirection.value.copy(sunDir);
    u.sunColor.value.copy(sunC).multiplyScalar(Math.max(0.15, Math.pow(Math.max(elev,0),0.5)));
    const wc = new THREE.Color(0x2a5a63).multiplyScalar(0.22 + 0.9*dayF);
    u.waterColor.value.copy(wc);
    u.distortionScale.value = state.weather==='rain' ? 7.0 : (state.weather==='haze'?4.2:3.4);
  }

  // ---- night emissives
  const nightF = 1 - smooth(elev, -0.06, 0.16);
  for (const n of nightMats) n.mat.emissiveIntensity = n.max * nightF;
  for (const n of lampsMats) n.mat.emissiveIntensity = n.max * nightF;

  if (stars) stars.material.opacity = nightF * 0.9;
  if (renderer) renderer.toneMappingExposure = 0.58 - 0.10*nightF;
  if (bloom) bloom.strength = 0.32 + 0.55*nightF;
}

/* ===================================================================== */
/*  WATER NORMAL MAP                                                     */
/* ===================================================================== */
function makeWaterNormals(size=256){
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  const h = (x,y)=>{
    const a = TAU/size;
    return Math.sin(a*(2*x+1*y)+0.3)*1.0
         + Math.sin(a*(3*x-2*y)+1.7)*0.62
         + Math.sin(a*(1*x+4*y)+3.1)*0.44
         + Math.sin(a*(5*x+3*y)+0.6)*0.24;
  };
  for (let y=0;y<size;y++){
    for (let x=0;x<size;x++){
      const dx = h((x+1)%size,y) - h((x-1+size)%size,y);
      const dy = h(x,(y+1)%size) - h(x,(y-1+size)%size);
      let nx = -dx*2.2, ny = -dy*2.2, nz = 1;
      const l = Math.hypot(nx,ny,nz);
      const i = (y*size+x)*4;
      img.data[i]   = (nx/l*0.5+0.5)*255;
      img.data[i+1] = (ny/l*0.5+0.5)*255;
      img.data[i+2] = (nz/l*0.5+0.5)*255;
      img.data[i+3] = 255;
    }
  }
  ctx.putImageData(img,0,0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.needsUpdate = true;
  return t;
}

/* ===================================================================== */
/*  SHIP                                                                 */
/* ===================================================================== */
function buildHullGeometry(){
  const NS = 46, M = 9;
  const ringLen = 2*M-1;
  const cAnti = new THREE.Color(0x7e2a22);
  const cBoot = new THREE.Color(0x10161c);
  const cNavy = new THREE.Color(0x142c46);
  const cTop  = new THREE.Color(0xf1f4f7);

  function colorForY(y){
    if (y < -1.0) return cAnti;
    if (y < 0.7)  return cBoot;
    if (y < 9.2)  return cNavy;
    return cTop;
  }
  function section(t, s){
    let f;
    if (t > 0.70){ const u = (1-t)/0.30; f = Math.pow(Math.max(u,0), 0.55); }
    else if (t < 0.13){ const u = t/0.13; f = 0.60 + 0.40*Math.pow(u,0.7); }
    else f = 1;
    const halfW = 19*f;
    const deckY = 11 + 2.4*Math.pow(t,3) + 1.5*Math.pow(1-t,4);
    const keelY = -9 + 5.6*Math.pow(t,5);
    const xBase = 150 - 300*t;
    const zs = halfW*Math.pow(Math.sin(s*Math.PI/2), 0.72);
    const ys = keelY + (deckY-keelY)*Math.pow(s, 1.9);
    const rakeBow  = -11*Math.pow(Math.max(0,(t-0.55)/0.45), 2.0)*Math.pow(s,1.5);
    const rakeStern=   7*Math.pow(Math.max(0,(0.15-t)/0.15), 2.0)*(1-Math.pow(s,1.4));
    return { x: xBase+rakeBow+rakeStern, y: ys, z: zs };
  }

  const grid = [];
  for (let i=0;i<=NS;i++){
    const t = i/NS; const row = [];
    for (let k=0;k<ringLen;k++){
      let s, sgn;
      if (k < M){ s = 1 - k/(M-1); sgn = 1; }
      else { s = (k-M+1)/(M-1); sgn = -1; }
      const p = section(t, s);
      p.z *= sgn;
      row.push(p);
    }
    grid.push(row);
  }

  const pos=[], col=[], idx=[], vidx=[];
  for (let i=0;i<=NS;i++){
    const row=[]; 
    for (let k=0;k<ringLen;k++){
      const p = grid[i][k]; const c = colorForY(p.y);
      pos.push(p.x,p.y,p.z); col.push(c.r,c.g,c.b);
      row.push(pos.length/3-1);
    }
    vidx.push(row);
  }
  for (let i=0;i<NS;i++)
    for (let k=0;k<ringLen-1;k++){
      const a=vidx[i][k], b=vidx[i][k+1], c=vidx[i+1][k+1], d=vidx[i+1][k];
      idx.push(a,b,c, a,c,d);
    }
  // deck cap
  for (let i=0;i<NS;i++){
    const a=vidx[i][0], b=vidx[i][ringLen-1], c=vidx[i+1][ringLen-1], d=vidx[i+1][0];
    idx.push(a,b,c, a,c,d);
  }
  // transom
  let cx=0,cy=0,cz=0;
  for (let k=0;k<ringLen;k++){ cx+=grid[0][k].x; cy+=grid[0][k].y; cz+=grid[0][k].z; }
  cx/=ringLen; cy/=ringLen; cz/=ringLen;
  const ci = pos.length/3; pos.push(cx,cy,cz);
  const cc = colorForY(cy); col.push(cc.r,cc.g,cc.b);
  for (let k=0;k<ringLen-1;k++) idx.push(ci, vidx[0][k], vidx[0][k+1]);

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function roundedRectShape(w,d,r){
  const s = new THREE.Shape();
  const x=-w/2, y=-d/2;
  s.moveTo(x+r,y);
  s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+d-r); s.quadraticCurveTo(x+w,y+d,x+w-r,y+d);
  s.lineTo(x+r,y+d); s.quadraticCurveTo(x,y+d,x,y+d-r);
  s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y);
  return s;
}
function blockGeometry(w,d,h,r){
  const shape = roundedRectShape(w,d,Math.min(r, Math.min(w,d)/2-0.01));
  const g = new THREE.ExtrudeGeometry(shape,{depth:h, bevelEnabled:false, curveSegments:5, steps:1});
  g.rotateX(-Math.PI/2);
  return g;
}

function makeTextTexture(text, sub, color){
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 320;
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,1024,320);
  ctx.font = 'bold 118px Georgia, "Times New Roman", serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle = color || '#101d2b';
  ctx.fillText(text, 512, sub?120:160);
  if (sub){
    ctx.font = '46px Georgia, serif';
    ctx.fillStyle = color || '#101d2b';
    ctx.fillText(sub, 512, 232);
  }
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 4;
  return t;
}

function buildShip(){
  const S = new THREE.Group();

  const M = {
    white:  new THREE.MeshStandardMaterial({color:0xf3f5f8, roughness:0.52, metalness:0.06}),
    white2: new THREE.MeshStandardMaterial({color:0xe3e8ee, roughness:0.6, metalness:0.05}),
    navy:   new THREE.MeshStandardMaterial({color:0x142c46, roughness:0.45, metalness:0.18}),

  /* ---------------- superstructure ---------------- */

  addBlock(M.white, 252, 34.5, 15.6, 3.0,  15, 11.0);   // main house  11 -> 26.6
  addBlock(M.white, 240, 33.0, 21.7, 2.6,   9, 26.6);   // balcony block 26.6 -> 48.3

  /* top deck: pool, slides, loungers, track */

    // track (rounded rectangle ring)

    // water slides

    const mkSlide = (mat, x0, y0, z0, x1, y1, z1, bend)=>{
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(x0,y0,z0),
        new THREE.Vector3(x0-3,y0+2,z0+bend),

      const g = new THREE.TubeGeometry(curve, 42, 0.95, 9, false);
      const m = new THREE.Mesh(g, mat); S.add(m); return m;
    };
    mkSlide(slideMat, 92, 68.5, -4, 56, 59.0, -1, 5);
    mkSlide(slideMat2, 96, 66.0, 4, 46, 59.0, 2, -5);

    // slide tower
    const tower = new THREE.Mesh(new THREE.CylinderGeometry(3.4,4.0,11,12), M.white2);
    tower.position.set(96, 62.5, 0); S.add(tower);
    const towTop = new THREE.Mesh(new THREE.CylinderGeometry(4.6,4.6,0.6,12), M.teal);

    addBox(S, M.white2, 16,3.2,9, 78,59.5,-10);

    canopy.scale.set(1,1,0.9);

  /* hull name plaques */

  /* stern pool + aft terraces */
  {
    const aftDeck = new THREE.Mesh(new THREE.BoxGeometry(30,0.6,26), M.wood);

  S.traverse(o=>{ if(o.isMesh){ o.castShadow = o.castShadow||false; o.receiveShadow = true; } });
  return S;

function terrainHeight(x,z){
  if (z > -58) return QUAY_Y;
  const t = clamp((-z - 58)/380, 0, 1);
  let h = QUAY_Y + 86*Math.pow(t, 1.32);
  h += 24*Math.exp(-(((x+150)*(x+150))/(2*118*118) + ((z+252)*(z+252))/(2*92*92)));
  h += 5*Math.sin(x*0.011)*Math.cos(z*0.013)*t;
  return h;
}

function gableRoofGeometry(){
  const tri = new THREE.Shape();
  tri.moveTo(-0.5,0); tri.lineTo(0.5,0); tri.lineTo(0,1); tri.closePath();
  const g = new THREE.ExtrudeGeometry(tri,{depth:1,bevelEnabled:false});
  g.translate(0,0,-0.5);
  return g;
}

function buildLisbon(){
  const G = new THREE.Group();
  const cityMats = {};

  /* ------------ terrain ------------ */
  {
    const W = 2400, D = 900, segX = 96, segZ = 44;
    const geo = new THREE.PlaneGeometry(W, D, segX, segZ);
    geo.rotateX(-Math.PI/2);
    const pos = geo.attributes.position;
    for (let i=0;i<pos.count;i++){
      const x = pos.getX(i), z = pos.getZ(i) - (D/2 + 58);
      pos.setX(i, x);
      pos.setZ(i, z);
      pos.setY(i, terrainHeight(x, z) - 0.4);
    }
    geo.computeVertexNormals();
    const mat = new THREE.MeshLambertMaterial({color:0x6a6152});
    const tm = new THREE.Mesh(geo, mat); tm.receiveShadow = true;
    G.add(tm);
  }

  /* ------------ quay platform ------------ */
  {
    const qmat = new THREE.MeshStandardMaterial({color:0x8b8f94, roughness:0.92, metalness:0.02});
    const quay = new THREE.Mesh(new THREE.BoxGeometry(2100, 9, 62), qmat);
    quay.position.set(-180, QUAY_Y-4.5, -29);
    quay.receiveShadow = true; quay.castShadow = true;
    G.add(quay);

    // kerb / edge stripe
    const edge = new THREE.Mesh(new THREE.BoxGeometry(2100, 0.25, 1.2),
      new THREE.MeshStandardMaterial({color:0xb9b3a2, roughness:0.9}));
    edge.position.set(-180, QUAY_Y+0.12, -0.6); G.add(edge);
  }

  /* ------------ houses ------------ */
  {
    const bodyGeo = new THREE.BoxGeometry(1,1,1); bodyGeo.translate(0,0.5,0);
    const roofGeo = gableRoofGeometry();
    const bodyMat = new THREE.MeshLambertMaterial({vertexColors:false});
    const roofMat = new THREE.MeshLambertMaterial({color:0xb2512f});

    const palette = [0xf3ead9,0xf7dcae,0xecb9a4,0xf2cdb4,0xe2e8d9,0xf6e8cd,
                     0xebd6ba,0xd9e2e8,0xf2d9c2,0xcddde8,0xbcd0dd,0xf0e0c0];

    const houses = [];
    for (let gx=-600; gx<=560; gx+=14){
      for (let gz=-460; gz<=-64; gz+=13){
        if (Math.random() < 0.17) continue;
        // streets
        if (Math.abs(gx-110) < 12) continue;
        if (Math.abs(gz+150) < 8) continue;
        const x = gx + rand(-3.5,3.5);
        const z = gz + rand(-3.5,3.5);
        const dxc = x+150, dzc = z+252;
        if (dxc*dxc/(80*80) + dzc*dzc/(72*72) < 1) continue;   // castle
        if (Math.abs(x-64) < 26 && Math.abs(z+128) < 30) continue; // pantheon
        if (Math.abs(x-16) < 30 && Math.abs(z+178) < 32) continue; // sé
        if (Math.abs(x+430) < 130 && z > -140) continue;         // praça
        const y = terrainHeight(x,z);
        if (y > 108) continue;
        const w = rand(7,13), d = rand(7,13);
        const floors = 3 + Math.floor(Math.random()*3);
        const h = floors*3.2 + rand(-0.6,0.8);
        houses.push({x,y,z,w,d,h,rot: (Math.random()<0.6?0:Math.PI/2)+rand(-0.18,0.18),
                     c: palette[(Math.random()*palette.length)|0],
                     roof: Math.random()<0.22});
      }
    }

    const bodyIM = new THREE.InstancedMesh(bodyGeo, bodyMat, houses.length);
    const roofIM = new THREE.InstancedMesh(roofGeo, roofMat, houses.length);
    bodyIM.castShadow = true; bodyIM.receiveShadow = true;
    roofIM.castShadow = true; roofIM.receiveShadow = true;
    const d = new THREE.Object3D(); const col = new THREE.Color();
    let ri = 0;
    houses.forEach((h,i)=>{
      d.position.set(h.x, h.y-1.6, h.z);
      d.rotation.set(0, h.rot, 0);
      d.scale.set(h.w, h.h, h.d);
      d.updateMatrix();
      bodyIM.setMatrixAt(i, d.matrix);
      bodyIM.setColorAt(i, col.setHex(h.c));
      if (!h.roof){
        d.position.set(h.x, h.y-1.6+h.h, h.z);
        d.scale.set(h.w*1.12, rand(1.8,3.2), h.d*1.12);
        d.updateMatrix();

function makePersonGeometry(){
  const body = new THREE.CapsuleGeometry(0.24, 0.82, 3, 7);
  body.translate(0, 0.86, 0);
  const head = new THREE.SphereGeometry(0.21, 8, 6);
  head.translate(0, 1.55, 0);
  return mergeG([body, head]);
}

function buildPortLife(){
  const G = new THREE.Group();

  /* --- pedestrians --- */
  {
    const geo = makePersonGeometry();
    const mat = new THREE.MeshLambertMaterial({vertexColors:false});
    const N = 90;
    peopleIM = new THREE.InstancedMesh(geo, mat, N);
    peopleIM.castShadow = true;
    peopleIM.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    const col = new THREE.Color();
    const cols = [0x2c3e57,0x8c3b3b,0x3b6b4a,0xd9d3c6,0x4a4a58,0xc0873b,0x2b6b74,0xe0e0e0];
    for (let i=0;i<N;i++){
      const lane = Math.random()<0.5 ? -6 : -14;
      peopleData.push({
        x: rand(-260, 260), z: lane + rand(-2.2,2.2),
        dir: Math.random()<0.5?1:-1,
        speed: rand(1.0,1.7),
        phase: Math.random()*TAU,
        scale: rand(0.92,1.08)
      });
      peopleIM.setColorAt(i, col.setHex(cols[(Math.random()*cols.length)|0]));
    }
    if (peopleIM.instanceColor) peopleIM.instanceColor.needsUpdate = true;
    G.add(peopleIM);
  }

  /* --- provisioning trucks / taxis / coach --- */
  function makeTruck(color, len, hgt){
    const g = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({color, roughness:0.55, metalness:0.25});
    const cabMat = new THREE.MeshStandardMaterial({color:0xe8e8e8, roughness:0.5, metalness:0.15});
    const glassM = new THREE.MeshStandardMaterial({color:0x22303c, roughness:0.15, metalness:0.6});
    const cab = new THREE.Mesh(new THREE.BoxGeometry(len*0.28, hgt*0.85, 2.5), cabMat);
    cab.position.set(len*0.33, hgt*0.45, 0); g.add(cab);
    const wind = new THREE.Mesh(new THREE.BoxGeometry(0.12, hgt*0.42, 2.2), glassM);
    wind.position.set(len*0.47, hgt*0.55, 0); g.add(wind);
    const cargo = new THREE.Mesh(new THREE.BoxGeometry(len*0.66, hgt, 2.6), bodyMat);
    cargo.position.set(-len*0.12, hgt*0.5, 0); g.add(cargo);
    const wg = new THREE.CylinderGeometry(0.62,0.62,0.5,10);
    wg.rotateX(Math.PI/2);
    for (const wx of [len*0.3, -len*0.25, -len*0.42])
      for (const wz of [-1.2, 1.2]){
        const w = new THREE.Mesh(wg, new THREE.MeshStandardMaterial({color:0x14181c, roughness:0.9}));
        w.position.set(wx, 0.62, wz); g.add(w);

/*  MOORING / GANGWAYS                                                   */
/* ===================================================================== */
function buildMooring(){
  const G = new THREE.Group();
  const ropeMat = new THREE.MeshStandardMaterial({color:0x2a2622, roughness:0.95});
  const mkLine = (a,b,sag)=>{
    const mid = a.clone().add(b).multiplyScalar(0.5); mid.y -= sag;
    const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
    const geo = new THREE.TubeGeometry(curve, 14, 0.18, 5, false);
    const m = new THREE.Mesh(geo, ropeMat);
    G.add(m); moorLines.push(m);
  };
  const SZ = BERTH_Z;
  // bow lines
  mkLine(new THREE.Vector3(-146, 12.5, SZ+4), new THREE.Vector3(-196, QUAY_Y+1.8, -2.4), 3.0);
  mkLine(new THREE.Vector3(-142, 12.0, SZ+7), new THREE.Vector3(-186, QUAY_Y+1.8, -2.4), 3.4);
  mkLine(new THREE.Vector3(-150, 11.0, SZ),   new THREE.Vector3(-204, QUAY_Y+1.8, -2.4), 2.6);
  // stern lines
  mkLine(new THREE.Vector3(146, 12.5, SZ+4),  new THREE.Vector3(204, QUAY_Y+1.8, -2.4), 2.8);
  mkLine(new THREE.Vector3(142, 12.0, SZ+7),  new THREE.Vector3(190, QUAY_Y+1.8, -2.4), 3.2);
  mkLine(new THREE.Vector3(150, 11.0, SZ),    new THREE.Vector3(212, QUAY_Y+1.8, -2.4), 2.4);

  /* gangways */
  const mkGangway = (x)=>{
    const g = new THREE.Group();
    const deckMat = new THREE.MeshStandardMaterial({color:0x9aa3ac, roughness:0.7, metalness:0.3});
    const railMat = new THREE.MeshStandardMaterial({color:0xd6dde4, roughness:0.4, metalness:0.5});
    const L = 8.6;
    const deck = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.24, L), deckMat);
    g.add(deck);
    for (const sx of [-1.45, 1.45]){
      const r = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, L), railMat);
      r.position.set(sx, 1.05, 0); g.add(r);
      const r2 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, L), railMat);
      r2.position.set(sx, 0.55, 0); g.add(r2);
      for (let i=0;i<5;i++){
        const p = new THREE.Mesh(new THREE.BoxGeometry(0.08,1.1,0.08), railMat);
        p.position.set(sx, 0.55, -L/2 + i*(L/4)); g.add(p);
      }
    }
    g.traverse(o=>{ if(o.isMesh){o.castShadow=true;o.receiveShadow=true;} });
    return {group:g, x};
  };

  gangways = [mkGangway(-34), mkGangway(30)];
  for (const gw of gangways){
    G.add(gw.group);
  }
  return G;
}

function updateGangways(){
  const t = state.gangwayT;
  for (const gw of gangways){
    const zStart = -0.6, zEnd = 7.0;
    const yStart = QUAY_Y + 0.15, yEnd = 7.4;
    const dz = zEnd - zStart, dy = yEnd - yStart;
    const ang = Math.atan2(dy, dz);
    const cx = gw.x, cz = (zStart+zEnd)/2, cy = (yStart+yEnd)/2;
    gw.group.position.set(cx, cy + t*1.6, cz + t*2.4);
    gw.group.rotation.x = -ang - t*1.15;
    gw.group.visible = t < 0.96;
  }
}

function buildRain(){
  const N = 3500;
  const pos = new Float32Array(N*3);
  const vel = new Float32Array(N);
  for (let i=0;i<N;i++){
    pos[i*3]   = rand(-160,160);
    pos[i*3+1] = rand(0,140);
    pos[i*3+2] = rand(-160,160);
    vel[i] = rand(38,58);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const m = new THREE.PointsMaterial({color:0xaecbe0, size:0.32, transparent:true, opacity:0.55, sizeAttenuation:true});
  rainPoints = new THREE.Points(g, m);
  rainPoints.userData.vel = vel;
  rainPoints.frustumCulled = false;
  rainPoints.visible = false;
  return rainPoints;
}

function buildScene(){

  camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.6, 24000);

  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.58;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false;
  document.getElementById('app').appendChild(renderer.domElement);

  /* --- sky --- */
  sky = new Sky();
  sky.scale.setScalar(450000);
  scene.add(sky);

  /* --- lights --- */
  sunLight = new THREE.DirectionalLight(0xffe3c0, 3.0);
  sunLight.position.set(-300, 300, 200);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.set(2048, 2048);
  const sc = sunLight.shadow.camera;
  sc.left = -320; sc.right = 320; sc.top = 320; sc.bottom = -320;
  sc.near = 1; sc.far = 1400;
  sunLight.shadow.bias = -0.0006;
  sunLight.shadow.normalBias = 0.6;
  sunLight.target.position.set(0, 15, 10);
  scene.add(sunLight);
  scene.add(sunLight.target);

  moonLight = new THREE.DirectionalLight(0x9fb6e0, 0.22);
  moonLight.position.set(300, 320, -200);
  scene.add(moonLight);

  hemi = new THREE.HemisphereLight(0x9dc4e8, 0x3a2a20, 0.75);
  scene.add(hemi);

  ambLight = new THREE.AmbientLight(0x24313d, 0.2);
  scene.add(ambLight);

  /* --- stars --- */
  {
    const N = 1400;
    const p = new Float32Array(N*3);
    for (let i=0;i<N;i++){
      const v = new THREE.Vector3(rand(-1,1), rand(0.02,1), rand(-1,1)).normalize().multiplyScalar(9000);
      p[i*3]=v.x; p[i*3+1]=v.y; p[i*3+2]=v.z;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(p,3));
    stars = new THREE.Points(g, new THREE.PointsMaterial({
      color:0xffffff, size:2.0, sizeAttenuation:false, transparent:true, opacity:0, depthWrite:false
    }));
    stars.frustumCulled = false;
    scene.add(stars);
  }

  /* --- water --- */
  {
    const waterNormals = makeWaterNormals(256);
    waterNormals.repeat.set(90, 90);
    water = new Water(new THREE.PlaneGeometry(16000, 16000), {
      textureWidth: 512,
      textureHeight: 512,
      waterNormals,
      sunDirection: sunDir.clone(),
      sunColor: 0xffffff,
      waterColor: 0x244e58,
      distortionScale: 3.4,
      fog: true
    });
    water.rotation.x = -Math.PI/2;
    water.position.y = 0;
    water.material.uniforms.size.value = 2.6;
    scene.add(water);
  }

  /* --- content --- */
  const lisbon = buildLisbon();
  scene.add(lisbon);

  shipRoot = new THREE.Group();
  shipRoot.position.set(0, 0, BERTH_Z);
  const ship = buildShip();
  shipRoot.add(ship);
  scene.add(shipRoot);

  scene.add(buildMooring());
  scene.add(buildPortLife());
  scene.add(buildRain());
  updateGangways();

  /* --- controls --- */
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(-8, 26, 30);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.maxPolarAngle = Math.PI*0.495;
  controls.minDistance = 12;
  controls.maxDistance = 2600;
  controls.update();

  /* --- composer --- */
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth*0.5, innerHeight*0.5), 0.4, 0.6, 0.86);
  composer.addPass(bloom);
  composer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  composer.setSize(innerWidth, innerHeight);

  updateEnvironment();
}

/* ===================================================================== */
/*  INTERACTION                                                          */
/* ===================================================================== */
const keys = {};
let walkYaw = 0, walkPitch = 0, isLocked = false, dragging = false;

function enterWalk(){
  state.walk = true;
  controls.enabled = false;
  camera.position.set(-70, QUAY_Y + 1.72, -12);
  walkYaw = -Math.PI*0.32; walkPitch = -0.02;
  applyWalkRotation();
  document.getElementById('walkBtn').classList.add('on');
  showHint('WASD to walk · drag / click to look · ESC to leave');
  if (renderer.domElement.requestPointerLock){
    try { renderer.domElement.requestPointerLock(); } catch(e){}
  }
}
function exitWalk(){
  state.walk = false;
  controls.enabled = true;
  document.getElementById('walkBtn').classList.remove('on');
  controls.target.copy(camera.position).add(new THREE.Vector3(-1,-0.15,-1).multiplyScalar(50));
  controls.update();
  showHint('');
  if (document.exitPointerLock) document.exitPointerLock();
}
function applyWalkRotation(){
  camera.quaternion.setFromEuler(new THREE.Euler(walkPitch, walkYaw, 0, 'YXZ'));
}

let hintTimer = 0;
function showHint(t){
  const el = document.getElementById('hint');
  el.textContent = t;
  el.classList.toggle('show', !!t);
  clearTimeout(hintTimer);
  if (t) hintTimer = setTimeout(()=>el.classList.remove('show'), 4200);
}

function setupInput(){
  addEventListener('keydown', e=>{
    keys[e.code] = true;
    if (e.code === 'Escape' && state.walk) exitWalk();
  });
  addEventListener('keyup', e=>{ keys[e.code] = false; });

  renderer.domElement.addEventListener('mousedown', e=>{
    if (!state.walk) return;
    if (!isLocked){
      dragLook = true;
      if (renderer.domElement.requestPointerLock){
        try { renderer.domElement.requestPointerLock(); } catch(err){}
      }
    }
  });
  let dragLook = false;
  addEventListener('mouseup', ()=>{ dragLook = false; });
  addEventListener('mousemove', e=>{
    if (!state.walk) return;
    if (isLocked || dragLook){
      walkYaw   -= e.movementX * 0.0022;
      walkPitch -= e.movementY * 0.0022;
      walkPitch = clamp(walkPitch, -1.25, 1.15);
      applyWalkRotation();
    }
  });
  document.addEventListener('pointerlockchange', ()=>{
    isLocked = document.pointerLockElement === renderer.domElement;
  });
}

/* ===================================================================== */
/*  UPDATE LOOPS                                                         */
/* ===================================================================== */
function shipPose(p){
  const e2 = smooth(p, 0.10, 0.55);
  const e3 = smooth(p, 0.32, 1.0);
  const x = -2380*e3;
  const z = BERTH_Z + 52*e2 + 350*e3;
  const yaw = 0.16*e3;
  return {x, z, yaw};
}

function updateShip(dt){
  // departure interpolation
  state.departT += (state.departTarget - state.departT) * Math.min(1, dt*0.55);
  const p = state.departT;
  const pose = shipPose(p);
  const tt = clock.elapsedTime;
  shipRoot.position.x = pose.x;
  shipRoot.position.z = pose.z;
  shipRoot.position.y = Math.sin(tt*0.45)*0.12;
  shipRoot.rotation.y = pose.yaw + Math.sin(tt*0.30)*0.006;
  shipRoot.rotation.z = Math.sin(tt*0.37+1.2)*0.004;

  // gangways retract
  const gwTarget = p > 0.05 ? 1 : 0;
  state.gangwayT += (gwTarget - state.gangwayT) * Math.min(1, dt*2.2);
  updateGangways();

  // mooring lines
  const lf = 1 - clamp(p*6, 0, 1);
  for (const l of moorLines){
    l.visible = lf > 0.02;
    l.scale.setScalar(Math.max(0.001, lf));
  }

  // radar rotation
  if (radarDish) radarDish.rotation.y += dt*1.6;

  // tug boat
  if (tugGroup){
    const duty = smooth(p, 0.08, 0.30) * (1 - smooth(p, 0.55, 0.75));
    const tx = -150 + duty*30 + smooth(p,0.5,1)*(-160);
    tugGroup.position.x = lerp(-186, tx, Math.min(1, p*7));
    tugGroup.position.z = 34 + duty*10 + smooth(p,0.4,1)*120;
    tugGroup.rotation.y = -duty*0.5;
  }
}

function updateWater(dt){
  if (!water) return;
  waterTime += dt;
  water.material.uniforms.time.value = waterTime * 0.55;
}

function updatePeople(dt){
  if (!peopleIM) return;
  const d = new THREE.Object3D();
  const tt = clock.elapsedTime;
  for (let i=0;i<peopleData.length;i++){
    const p = peopleData[i];
    p.x += p.dir * p.speed * dt;
    if (p.x > 300){ p.x = 300; p.dir = -1; }
    if (p.x < -300){ p.x = -300; p.dir = 1; }
    const bob = Math.sin(tt*7*p.speed + p.phase)*0.06;
    d.position.set(p.x, QUAY_Y + bob, p.z);
    d.rotation.set(0, p.dir>0 ? -Math.PI/2 : Math.PI/2, 0);
    d.scale.setScalar(p.scale);
    d.updateMatrix();
    peopleIM.setMatrixAt(i, d.matrix);
  }
  peopleIM.instanceMatrix.needsUpdate = true;
}

function updateVehicles(dt){
  for (const v of vehicles){
    v.obj.position.x += v.dir * v.speed * dt;
    if (v.obj.position.x > v.maxX){ v.dir = -1; v.obj.rotation.y = Math.PI; }
    if (v.obj.position.x < v.minX){ v.dir = 1; v.obj.rotation.y = 0; }
  }
  if (forklift){
    forklift.t += dt*0.34;
    const s = (Math.sin(forklift.t)+1)/2;
    forklift.obj.position.x = lerp(-46, 4, s);
    forklift.obj.position.z = lerp(-12, -9, s);
    forklift.obj.rotation.y = Math.cos(forklift.t) > 0 ? 0 : Math.PI;
  }
}

function updateBoats(dt){
  const tt = clock.elapsedTime;
  for (const b of movingBoats){
    if (b.type === 'ferry'){
      b.t += dt * b.speed * 0.02;
      const v = (Math.sin(b.t)+1)/2;
      b.obj.position.z = lerp(b.from, b.to, v);
      b.obj.rotation.y = (b.to > b.from) ? 0 : Math.PI;
      b.obj.position.x += Math.sin(tt*0.2 + b.t)*0.01;
    } else if (b.type === 'sail'){
      const a = tt*b.sp + b.phase;
      b.obj.position.x = b.cx + Math.cos(a)*b.r;
      b.obj.position.z = b.cz + Math.sin(a)*b.r*0.6;
      b.obj.rotation.y = -a + Math.PI/2;
      b.obj.rotation.z = Math.sin(tt*0.9 + b.phase)*0.045;
    } else if (b.type === 'pilot'){
      b.obj.position.x = 70 + Math.sin(tt*0.18)*46;
      b.obj.position.z = 96 + Math.cos(tt*0.24)*22;
      b.obj.rotation.y = Math.atan2(Math.cos(tt*0.18)*46*0.18, Math.cos(tt*0.24)*22*0.24);
      b.obj.position.y = Math.sin(tt*1.1)*0.28;
    }
  }
}

function updateGulls(dt){
  const tt = clock.elapsedTime;
  for (const g of gulls){
    const a = tt*g.sp + g.ph;
    g.obj.position.set(
      g.cx + Math.cos(a)*g.r,
      g.cy + Math.sin(a*1.7)*3.2,
      g.cz + Math.sin(a)*g.r*0.7
    );
    g.obj.rotation.y = -a + Math.PI/2;
    const flap = Math.sin(tt*g.flap + g.ph)*0.55;
    g.obj.userData.wings[0].rotation.z = flap;
    g.obj.userData.wings[1].rotation.z = -flap;
  }
}

function updateRain(dt){
  if (!rainPoints || !rainPoints.visible) return;
  const pos = rainPoints.geometry.attributes.position;
  const vel = rainPoints.userData.vel;
  const arr = pos.array;
  const cx = camera.position.x, cz = camera.position.z;
  for (let i=0;i<arr.length/3;i++){
    arr[i*3+1] -= vel[i]*dt;
    if (arr[i*3+1] < 0){
      arr[i*3]   = cx + rand(-150,150);
      arr[i*3+1] = 130;
      arr[i*3+2] = cz + rand(-150,150);
    }
  }
  pos.needsUpdate = true;
}

function updateWalk(dt){
  const speed = keys['ShiftLeft']||keys['ShiftRight'] ? 16 : 6.5;
  const fwd = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  fwd.y = 0; fwd.normalize();
  const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,1,0)).normalize();
  const mv = new THREE.Vector3();
  if (keys['KeyW']||keys['ArrowUp']) mv.add(fwd);
  if (keys['KeyS']||keys['ArrowDown']) mv.sub(fwd);
  if (keys['KeyD']||keys['ArrowRight']) mv.add(right);
  if (keys['KeyA']||keys['ArrowLeft']) mv.sub(right);
  if (mv.lengthSq()>0){
    mv.normalize().multiplyScalar(speed*dt);
    camera.position.add(mv);
  }
  camera.position.x = clamp(camera.position.x, -420, 420);
  camera.position.z = clamp(camera.position.z, -52, -1.2);
  camera.position.y = QUAY_Y + 1.72;
}

function updateTimeCycle(dt){
  if (state.playing){
    state.hour += dt * 0.16;
    if (state.hour >= 24) state.hour -= 24;
    document.getElementById('timeSlider').value = state.hour.toFixed(2);
    updateClockLabel();
    updateEnvironment();
  }
}

function updateClockLabel(){
  const h = Math.floor(state.hour);
  const m = Math.floor((state.hour - h)*60);
  document.getElementById('clock').textContent =
    String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}

/* ===================================================================== */
/*  MAIN LOOP                                                            */
/* ===================================================================== */
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  updateTimeCycle(dt);
  updateShip(dt);
  updateWater(dt);
  updatePeople(dt);
  updateVehicles(dt);
  updateBoats(dt);
  updateGulls(dt);
  updateRain(dt);

  if (camTween){
    camTween.t += dt;
    const k = clamp(camTween.t / camTween.dur, 0, 1);
    const e = k<0.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
    camera.position.lerpVectors(camTween.fromP, camTween.toP, e);
    controls.target.lerpVectors(camTween.fromT, camTween.toT, e);
    if (k >= 1) camTween = null;
  }

  if (state.walk) updateWalk(dt);
  else controls.update();

  renderer.shadowMap.needsUpdate = true;
  composer.render();
}

/* ===================================================================== */
/*  UI WIRING                                                            */
/* ===================================================================== */
function goPreset(k){
  if (state.walk) exitWalk();
  const p = PRESETS[k];
  camTween = {
    t:0, dur:1.5,
    fromP: camera.position.clone(),
    fromT: controls.target.clone(),
    toP: new THREE.Vector3(...p.pos),
    toT: new THREE.Vector3(...p.target)
  };
}

function horn(){
  try {
    if (!window._actx) window._actx = new (window.AudioContext||window.webkitAudioContext)();
    const ctx = window._actx;
    if (ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;
    const master = ctx.createGain();
    master.gain.setValueAtTime(0.0001, now);
    master.gain.exponentialRampToValueAtTime(0.30, now + 0.25);
    master.gain.setValueAtTime(0.30, now + 1.5);
    master.gain.exponentialRampToValueAtTime(0.0008, now + 3.6);
    master.connect(ctx.destination);
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 1150; lp.Q.value = 0.8;
    lp.connect(master);
    [[55,0.5],[82.4,0.32],[110.5,0.22],[164.8,0.10]].forEach(([f,g])=>{
      const o = ctx.createOscillator();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(f*1.07, now);
      o.frequency.linearRampToValueAtTime(f, now + 0.7);
      const gg = ctx.createGain(); gg.gain.value = g;
      o.connect(gg); gg.connect(lp);
      o.start(now); o.stop(now + 3.7);
    });
  } catch(e){ /* audio unavailable */ }
}

function setupUI(){
  document.querySelectorAll('[data-cam]').forEach(b=>{
    b.addEventListener('click', ()=>goPreset(b.dataset.cam));
  });
  document.getElementById('walkBtn').addEventListener('click', ()=>{
    if (state.walk) exitWalk(); else enterWalk();
  });
  document.getElementById('playBtn').addEventListener('click', ()=>{
    state.playing = !state.playing;
    document.getElementById('playBtn').textContent = state.playing ? '❚❚' : '▶';
  });
  const slider = document.getElementById('timeSlider');
  slider.addEventListener('input', ()=>{
    state.hour = parseFloat(slider.value);
    updateClockLabel();
    updateEnvironment();
  });
  document.querySelectorAll('[data-w]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('[data-w]').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      state.weather = b.dataset.w;
      rainPoints.visible = state.weather === 'rain';
      updateEnvironment();
    });
  });

  const btn = document.getElementById('depart');
  btn.addEventListener('click', ()=>{
    if (!state.sailing){
      state.sailing = true;
      state.departTarget = 1;
      btn.classList.add('back');
      btn.textContent = 'RETURN TO BERTH';
      horn();
      showHint('Gangways retracted — mooring lines released — tug assisting');
    } else {
      state.sailing = false;
      state.departTarget = 0;
      btn.classList.remove('back');
      btn.textContent = 'DEPARTURE';
      showHint('Returning to berth');
    }
  });

  document.getElementById('hideBtn').addEventListener('click', ()=>{
    document.body.classList.add('hideui');
  });
  document.getElementById('showBtn').addEventListener('click', ()=>{
    document.body.classList.remove('hideui');
  });

  addEventListener('resize', onResize);
  addEventListener('orientationchange', onResize);
}

function onResize(){
  const w = innerWidth, h = innerHeight;
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(w, h);
  composer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  composer.setSize(w, h);
  bloom.setSize(w*0.5, h*0.5);
}

/* ===================================================================== */
/*  BOOT                                                                 */
/* ===================================================================== */
const wait = ()=>new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));

async function boot(){
  const bar = document.querySelector('#bar > i');
  const statusEl = document.getElementById('load-status');
  const steps = [
    ['Charting the Tagus', 18],
    ['Raising Alfama', 38],
    ['Building the cruise terminal', 56],
    ['Naming the ship', 74],
    ['Filling the port with life', 90],
    ['Casting off', 100]
  ];
  let si = 0;
  const advance = async ()=>{
    bar.style.width = steps[si][1] + '%';
    statusEl.textContent = steps[si][0];
    si++;
    await wait();
  };

  try {
    await advance();
    buildScene();
    await advance();
    setupInput();
    setupUI();
    await advance();
    await advance();
    updateEnvironment();
    updateClockLabel();
    await advance();
    renderer.compile(scene, camera);
    await advance();
    animate();
    setTimeout(()=>{
      document.getElementById('loading').classList.add('hide');
      showHint('Drag to orbit · use the panel to explore Lisbon');
    }, 260);
  } catch (err){
    console.error(err);
    document.getElementById('gl-error').classList.add('show');
  }
}

// WebGL availability check
(function(){
  try {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl2') || c.getContext('webgl') || c.getContext('experimental-webgl');
    if (!gl) throw new Error('no webgl');
  } catch(e){
    document.getElementById('gl-error').classList.add('show');
    document.getElementById('loading').classList.add('hide');
    throw e;
  }
})();

boot();
</script>
