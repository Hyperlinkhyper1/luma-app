<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedural 3D V8 Engine Simulation</title>
<style>
    body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: 'Segoe UI', sans-serif; color: #eee; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; outline: none; }
    #ui {
        position: absolute; top: 10px; right: 10px; width: 320px;
        background: rgba(20, 24, 28, 0.85); backdrop-filter: blur(10px);
        border: 1px solid #444; border-radius: 8px; padding: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 12px; }
    .row:last-child { border-bottom: none; }
    label { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: space-between; }
    input[type=range] { width: 100%; accent-color: #4f9; background: #333; }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    button {
        background: #333; border: 1px solid #555; color: #eee; padding: 6px;
        border-radius: 4px; cursor: pointer; font-size: 11px; transition: 0.2s;
    }
    button:hover { background: #444; border-color: #888; }
    button.active { background: #2a8; border-color: #4f9; color: #000; font-weight: bold; }
    .val { font-family: monospace; color: #4f9; }
    h2 { font-size: 14px; margin: 0 0 8px 0; border-bottom: 2px solid #4f9; padding-bottom: 4px; display: inline-block; }
    .cyl-select { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
    .cyl-btn { flex: 1; padding: 4px; text-align: center; background: #222; border: 1px solid #444; color: #777; font-size: 10px; cursor: pointer; }
    .cyl-btn.active { background: #4f9; color: #000; border-color: #4f9; font-weight: bold; }
    #info { position: absolute; bottom: 20px; left: 20px; font-family: monospace; font-size: 11px; color: #888; pointer-events: none; }
</style>
</head>
<body>

<div id="ui">
    <div class="row">
        <h2>ENGINE CONTROLS</h2>
        <label>RPM <span id="rpmVal" class="val">700</span></label>
        <input type="range" id="rpmSlider" min="0" max="8000" value="700">
        <div class="btn-grid" style="grid-template-columns: repeat(4, 1fr); gap:4px;">
            <button id="pStop">STOP</button>
            <button id="pIdle" class="active">IDLE</button>
            <button id="p2000">2k</button>
            <button id="p4000">4k</button>
            <button id="p6000">6k</button>
            <button id="p8000">8k</button>
        </div>
        <label style="margin-top:6px">SIM SPEED <span id="simSpeedVal" class="val">1.0x</span></label>
        <input type="range" id="simSpeed" min="0.05" max="2.0" step="0.05" value="1">
    </div>

    <div class="row">
        <h2>CRANK MANUAL SCRUB</h2>
        <input type="range" id="crankScrub" min="0" max="360" value="0">
        <label>CRANK ANGLE <span id="crankAngleVal" class="val">0°</span></label>
        <button id="pCycleMode" style="width:100%; margin-top:4px; font-size:10px; background:#2a8; color:#000; border:none; font-weight:bold;">NORMAL SIMULATION</button>
    </div>

    <div class="row">
        <h2>MANUAL CYCLE INSPECTION</h2>
        <div class="cyl-select" id="cylGrid">
            <!-- Buttons 1-8 injected here -->
        </div>
        <label style="margin-top:8px">PHASE <span id="cylPhaseVal" class="val">--</span></label>
        <div id="cylState" style="font-size:10px; color:#aaa; line-height:1.4">Select a cylinder...</div>
    </div>

    <div class="row">
        <h2>CAMERA</h2>
        <div class="btn-grid">
            <button class="cam-btn" data="hero">HERO</button>
            <button class="cam-btn" data="front">FRONT</button>
            <button class="cam-btn" data="side">SIDE</button>
            <button class="cam-btn" data="top">TOP</button>
            <button class="cam-btn" data="internal">INTERNAL</button>
        </div>
    </div>

    <div class="row">
        <h2>EXPLoded / VISIBILITY</h2>
        <label>EXPLODE <span id="explodeVal" class="val">0</span></label>
        <input type="range" id="explode" min="0" max="250" value="0">
        <div class="btn-grid" style="grid-template-columns: repeat(4, 1fr); gap:3px;">
            <button class="vis-btn" data="block" style="background:#444">BLOCK</button>
            <button class="vis-btn" data="crank">CRANK</button>
            <button class="vis-btn" data="heads">HEADS</button>
            <button class="vis-btn" data="valves">VALVES</button>
            <button class="vis-btn" data="timing">TIMING</button>
            <button class="vis-btn" data="intake">INTAKE</button>
            <button class="vis-btn" data="exhaust">EXH</button>
            <button class="vis-btn" data="combustion">FIRE</button>
        </div>
    </div>
</div>

<div id="info">
    <span style="color:#4f9">STATUS:</span> <span id="statusText">IDLE</span><br>
    <span style="color:#4f9">MECHANICS:</span> <span id="physicsText">READY</span>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================
// CONSTANTS & CONFIG
// ============================================================
const RPM_TO_ANGLE = 360 / 60; 
const CYCLE_DEG = 720;

// Firing Order: 1-8-4-3-6-5-7-2
// Bank A = 1,3,5,7 ; Bank B = 2,4,6,8
const FIRED_ORDER = [1, 8, 4, 3, 6, 5, 7, 2];
const BANK_A = [1, 3, 5, 7];
const BANK_B = [2, 4, 6, 8];

// Cross Plane Crankshaft geometry (Main/Counterweight/Throw orientation)
// We define throw angles for the 4 pairs of journals around the crankshaft X axis
const CRANK_PHASES = [0, 180, 180, 0]; // Pair 1: 0/180, Pair 2: 180/0 (Standard Crossplane: 0, 90, 270, 180 relative rotation of pairs... actually: throw 1 @0, throw 2 @90, throw 3 @270, throw 4 @180)

// Correct cross plane geometry relative to throw 1:
// Throw 1: 0°
// Throw 2: 90°
// Throw 3: 270°
// Throw 4: 180°
const THROW_ANGLES = [0, 90, 270, 180]; 

// Firing interval: 720/8 = 90° crank. 
// Bank firing intervals: A fires A0, then B?, etc.
// Firing order 1-8-4-3-6-5-7-2 corresponds to crank phases:
// 1:0, 8:90, 4:180, 3:270, 6:360(0), 5:450(90), 7:540(180), 2:630(270) -- wait, phase wrap.
// Let's map firing order -> physical crank phase of that cylinder's throw.
// Cylinder 1 -> Throw 1 (0)
// Cylinder 8 -> Throw 2 (90) -- wait, let's check math.
// Throw angles: T1=0, T2=90, T3=270, T4=180.
// Cyl 1 @ T1 (0) fires at 360 (power).
// Next event 90 deg later. Need a throw at 90. T2 is cyl 8. Correct.
// Next 180. T4 is cyl 7? No, order is 4. So cylinder 4 is on T4.
// Next 270. Order 3. Cylinder 3 is on T3.
// So: C1:T1(0), C8:T2(90), C4:T4(180), C3:T3(270), C6:T1(0)+360, C5:T2(90)+360, C7:T4(180)+360, C2:T3(270)+360.
// Bank A: 1,3,5,7 -> T1, T3, T2, T4.
// Bank B: 2,4,6,8 -> T3, T4, T1, T2.

const CYL_ORDER_IN_THROWS = [
    { id: 1, throwIdx: 0, bank: 'A' }, // 0
    { id: 8, throwIdx: 1, bank: 'B' }, // 90
    { id: 4, throwIdx: 3, bank: 'B' }, // 180
    { id: 3, throwIdx: 2, bank: 'A' }, // 270
    { id: 6, throwIdx: 0, bank: 'B' }, // 360
    { id: 5, throwIdx: 1, bank: 'A' }, // 450
    { id: 7, throwIdx: 3, bank: 'A' }, // 540
    { id: 2, throwIdx: 2, bank: 'B' }, // 630
];
// Bank A: 1,3,5,7 -> throws 0,2,1,3
// Bank B: 8,4,5,2 -> throws 1,3,1,2 (wait 5 is A). Bank B: 8,4,6,2 -> throws 1,3,0,2.

// Geometry dimensions (scaled units)
const G = {
    r: 1.4,      // Crank radius
    l: 4.8,      // Rod length
    bore: 1.5,   // Bore diameter
    stroke: 2.8,
    deck: 5.5,   // Deck height above crank center
    banksAngle: 90,
    rods: { width: 0.7, depth: 0.6 },
    headZ: 9.0,
};

// ============================================================
// MATH HELPERS
// ============================================================
const v3A = new THREE.Vector3(), v3B = new THREE.Vector3();
function degToRad(d){ return d*Math.PI/180; }
function lerp(a, b, t){ return a+(b-a)*t; }

// Slider crank kinematics
function sliderCrank(thetaDeg, crankRadius, rodLength) {
    const th = degToRad(thetaDeg);
    const x = crankRadius * Math.cos(th) + Math.sqrt(rodLength*rodLength - (crankRadius * Math.sin(th))**2);
    const phi = Math.asin((crankRadius * Math.sin(th)) / rodLength); // Rod angular deflection
    return { x, phi }; // x is along the cylinder axis relative to crank center
}

function cycleState(phaseDeg) {
    // 4 stroke: 0-720. Returns { intake: 0/1, exhaust: 0/1, power: 0/1, compression: 0/1, p: phase (0-720) }
    const p = phaseDeg % 720;
    let name = 'INTAKE';
    if(p>=180&&p<360) name='COMP';
    if(p>=360&&p<540) name='POWER';
    if(p>=540&&p<720) name='EXHAUST';
    return { p, name };
}

// ============================================================
// GEOMETRY BUILDERS
// ============================================================
function createPistonGeo() {
    // Short cylinder with ring grooves, scaled x/y to match bore, z=stroke-ish
    const geo = new THREE.CylinderGeometry(G.bore, G.bore, 1.2, 32, 1);
    geo.translate(0, 0, -0.6);
    // Add rings
    const pos = geo.attributes.position;
    const verts = pos.count;
    // Simple approach: scale z to make rings visible on cylinder, use segments
    return geo;
}

function createRodGeo() {
    // Tapered body + large end cap + small end tube
    const body = new THREE.BoxGeometry(G.rods.depth, G.l, G.rods.width);
    const smallEnd = new THREE.CylinderGeometry(G.rods.width/2, G.rods.width/2, 0.8, 24);
    const bigEnd = new THREE.CylinderGeometry(G.rods.width, G.rods.width, 2.6, 24);
    const group = new THREE.Group();
    group.add(body, smallEnd, bigEnd);
    return new THREE.InstancedMesh ? body : body;
}

// ============================================================
// SIMULATION
// ============================================================
class Engine {
    constructor() {
        this.rpm = 700;
        this.time = 0;
        this.angle = 0; // Master crank angle 0..720 (or higher)
        this.manualMode = false;
        this.manualAngle = 0;
        this.simSpeed = 1;
        this.camAngle = 0; // Half of master
        
        // Banks geometry transforms
        this.bankAAxis = new THREE.Vector3(0,1,0); // Local up of bank A
        this.bankAAxis.applyAxisAngle(new THREE.Vector3(1,0,0), degToRad(45));
        this.bankBAxis = new THREE.Vector3(0,1,0);
        this.bankBAxis.applyAxisAngle(new THREE.Vector3(1,0,0), degToRad(-45));
        
        // Per-cylinder derived data
        this.cyls = []; // 8 cylinder objects
        this.fireTimes = {}; // firing order phase mapping
        
        this.particles = [];
        this.init();
    }

    init() {
        // Build cylinder phasing map based on firing order and throw geometry
        // FIRED_ORDER is sequence. Their crank phases are fixed by their physical throw position.
        // We assign each cylinder an offset within a 720 cycle.
        // 1 fires at 360. 8 fires at 360+90=450. 4 fires at 360+180=540. 3 fires at 360+270=630. 6 fires at 720(0).
        // Cyl firing offset (power start) = index * 90.
        for(let i=0; i<8; i++){
            const def = CYL_ORDER_IN_THROWS[FIRED_ORDER.indexOf(i+1)];
            const firingOffset = i * 90; // 90 degrees after 360 reference. e.g. 1 fires at 360.
            // Phase = (masterAngle - firingOffset) mod 720. When masterAngle == firingOffset + 720 (next TDC)? 
            // Standard: 1 fires at 360 deg (2 full rotations). 
            // Let masterAngle be global accumulated. Cyl phase = (masterAngle - firingOffset) % 720.
            // For cyl 1: phase 0 at angle 0. At angle 360, phase 360 -> POWER. Correct.
            // Cyl 8 fires at 450 global. Phase at 450 -> 360. Correct.
            this.cyls.push({
                id: i+1, throwIdx: def.throwIdx, bank: def.bank, firingOffset: firingOffset,
                // Derived geometry positions (calculated later per frame)
            });
        }
    }

    update(dt) {
        if (!this.manualMode) {
            const deltaAngle = (this.rpm / 60) * RPM_TO_ANGLE * dt * this.simSpeed;
            this.angle += deltaAngle;
            this.camAngle = this.angle * 0.5;
        } else {
            this.angle = this.manualAngle;
            this.camAngle = this.angle * 0.5;
        }
    }
}

// ============================================================
// APP / SCENE
// ============================================================
const app = {
    scene: null, renderer: null, camera: null, controls: null,
    engine: null,
    groups: {}, // meshes by category for toggling
    instanced: {}, // cylinder meshes
    sparkPistol: [],
    explosion: [],
    
    init() {
        // --- Renderer ---
        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(this.renderer.domElement);

        // --- Scene & Lights ---
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x111111);
        this.scene.fog = new THREE.FogExp2(0x111111, 0.02);

        const hemi = new THREE.HemisphereLight(0xaaccff, 0x221100, 0.6);
        this.scene.add(hemi);
        
        const sun = new THREE.DirectionalLight(0xffffff, 1.5);
        sun.position.set(20, 30, 20);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048; sun.shadow.mapSize.height = 2048;
        sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 100;
        sun.shadow.camera.left = -25; sun.shadow.camera.right = 25;
        sun.shadow.camera.top = 25; sun.shadow.camera.bottom = -25;
        this.scene.add(sun);

        // Rim light
        const rim = new THREE.SpotLight(0x4466ff, 2);
        rim.position.set(-20, 10, -10);
        rim.lookAt(0,0,0);
        this.scene.add(rim);
        
        const fill = new THREE.PointLight(0xffaa88, 1, 40);
        fill.position.set(10, -10, 20);
        this.scene.add(fill);

        // --- Camera ---
        this.camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 200);
        this.camera.position.set(8, 6, 12);
        this.controls = new OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;
        this.controls.target.set(0, 2, 0);

        // --- Materials ---
        const base = (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.7, metalness: 0.6 });
        this.mats = {
            block: base(0x2b2b2b),
            blockDark: base(0x151515),
            piston: new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.4, metalness: 0.7 }),
            rod: base(0x554433), // Bronze-ish
            crank: new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.3, metalness: 0.8 }),
            crankWeb: new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.3, metalness: 0.9 }),
            cam: new THREE.MeshStandardMaterial({ color: 0x665544, roughness: 0.3, metalness: 0.8 }),
            valve: new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.2, metalness: 0.9 }),
            spring: new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5, metalness: 0.4 }),
            intake: base(0x888888),
            exhaust: new THREE.MeshStandardMaterial({ color: 0x3d2817, roughness: 0.6, metalness: 0.5 }), // heat dark
            exhaustInner: base(0xcc5522),
            head: base(0x999999),
            pulley: base(0x222222),
            belt: new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 }),
            flywheel: new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5, metalness: 0.8 }),
            plastic: base(0x111111), // valve covers
        };

        // --- Engine Construction ---
        this.engine = new Engine();
        this.build();

        // --- Animation Loop ---
        this.clock = new THREE.Clock();
        this.render();
        this.resize();
        window.addEventListener('resize', () => this.resize());

        // --- UI ---
        this.setupUI();
    },

    resize() {
        this.camera.aspect = window.innerWidth / window.innerHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(window.innerWidth, window.innerHeight);
    },

    build() {
        const eng = this.engine;
        const s = 1.0; // scale

        // --- Main Group for Engine ---
        this.groups.engine = new THREE.Group();
        this.scene.add(this.groups.engine);

        // 1. ENGINE BLOCK (Cutaway style)
        this.groups.block = new THREE.Group();
        const blockGeo = new THREE.BoxGeometry(18, 11, 11);
        const blockMesh = new THREE.Mesh(blockGeo, this.mats.block);
        // Cutaway: remove top half front-ish? 
        // We build a "crankcase" lower box and "deck" upper box with cutout for V
        const deckGeo = new THREE.BoxGeometry(16, 2, 10);
        const deck = new THREE.Mesh(deckGeo, this.mats.head);
        // Cut a wedge out of the V valley on the block sides? 
        // For simplicity and visual clarity of internals:
        // Make the block a wide base box, with top faces cut to reveal cylinder walls.
        
        // Main Crankcase
        this.crankcase = new THREE.Mesh(new THREE.BoxGeometry(18, 4, 11), this.mats.block);
        this.crankcase.position.y = 2;
        this.crankcase.receiveShadow = true;
        this.groups.block.add(this.crankcase);

        // Deck (Head surface)
        this.deck = new THREE.Mesh(new THREE.BoxGeometry(16, 2.5, 10), this.mats.blockDark);
        this.deck.position.y = 6.25;
        this.deck.receiveShadow = true;
        // Cut V slot for camshafts
        const camSlot = new THREE.Mesh(new THREE.BoxGeometry(6, 2.5, 10), new THREE.MeshBasicMaterial({color:0x000000}));
        camSlot.position.set(0, 6.25, 0);
        this.deck.add(camSlot);
        
        // Cut out bores from deck: create hole group? simpler: use boolean concept by subtraction... 
        // We can't easily do boolean without CSG lib. So we simulate bores by placing a "Bore Tube" geometry 
        // inside the deck that matches the block color exactly (illusion).
        this.bores = [];
        const boreSide = 1.45;
        const boreHole = new THREE.BoxGeometry(1.6, 2.5, 1.6);
        CYL_ORDER_IN_THROWS.forEach(c => {
            const hole = new THREE.Mesh(boreHole, this.mats.blockDark);
            // World position of cylinder center line at deck height
            const pos = this.getCylinderWorldCenter(c);
            pos.y = 6.25;
            hole.position.copy(pos);
            if(c.bank==='A') hole.rotation.set(0,0,-degToRad(45));
            else hole.rotation.set(0,0,degToRad(45));
            this.deck.add(hole);
            this.bores.push({ mesh: hole, cyl: c });
        });

        this.groups.heads = new THREE.Group();
        this.groups.valves = new THREE.Group();
        this.groups.block.add(this.groups.heads);
        this.groups.engine.add(this.groups.block);
        this.groups.engine.add(this.groups.heads);

        // --- 2. CRANKSHAFT ---
        this.groups.crank = new THREE.Group();
        this.groups.engine.add(this.groups.crank);
        this.buildCrankshaft();

        // --- 3. CYLINDERS, PISTONS, RODS, VALVES ---
        CYL_ORDER_IN_THROWS.forEach(def => {
            this.buildCylinder(def);
        });

        // --- 4. CAMSHAFTS ---
        this.groups.camA = new THREE.Group(); // Bank A cam
        this.groups.camB = new THREE.Group(); // Bank B cam
        this.groups.heads.add(this.groups.camA);
        this.groups.heads.add(this.groups.camB);
        this.buildCamshaft(this.groups.camA, 'A');
        this.buildCamshaft(this.groups.camB, 'B');

        // --- 5. PUSHRODS / VALVETRAIN (Attached to heads, animated in loop) ---
        this.pushrods = [];
        CYL_ORDER_IN_THROWS.forEach(def => {
            const pr = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 3.5, 8), this.mats.crankWeb);
            this.pushrods[def.id] = pr;
            this.groups.valves.add(pr);
        });

        // --- 6. TIMING DRIVE (Front of engine) ---
        this.groups.timing = new THREE.Group();
        this.buildTiming();
        this.groups.engine.add(this.groups.timing);

        // --- 7. INTAKE ---
        this.groups.intake = new THREE.Group();
        this.buildIntake();
        this.groups.engine.add(this.groups.intake);

        // --- 8. EXHAUST ---
        this.groups.exhaust = new THREE.Group();
        this.buildExhaust();
        this.groups.engine.add(this.groups.exhaust);

        // --- 9. VALVE COVERS ---
        this.covers = [];
        const cov = new THREE.Mesh(new THREE.BoxGeometry(15, 1.6, 2.6), this.mats.plastic);
        cov.position.set(0, 7.3, 0);
        cov.rotation.set(0,0,degToRad(45)); // aligned with V
        this.groups.heads.add(cov);
        
        // --- 10. ACCESSORIES (Front) ---
        this.buildAccessories();
    },

    getCylinderWorldCenter(cyl) {
        // Local engine coords. Bank angle 45.
        // Y offset from center line based on throw? Piston stays at fixed X/Z (rotated).
        const x = cyl.id * 1.1 - 4.4; // spacing
        const axis = cyl.bank === 'A' ? this.engine.bankAAxis : this.engine.bankBAxis;
        const center = new THREE.Vector3(x, 0, 0).applyAxisAngle(new THREE.Vector3(0,1,0), 0); // center line
        const p = v3A.copy(center).multiplyScalar(1); // just (x,0,0)
        p.y = G.deck + 1.2; // Top of piston at TDC roughly
        // Apply bank rotation around Z axis? No, around X axis? 
        // Banks are usually rotated around the Crankshaft axis (X) in a V8? 
        // Actually usually Y is vertical. Bank A +45deg around Z, Bank B -45deg around Z. 
        // My engine is rotated for view anyway. Let's stick to standard Z-axis bank rotation.
        // Re-calc: Bank axis rotation around Z.
        const ax = cyl.bank==='A' ? degToRad(-45) : degToRad(45);
        const dir = new THREE.Vector3(0,1,0).applyAxisAngle(new THREE.Vector3(0,0,1), ax);
        return v3A.set(x, G.deck + 1.2, 0).add(dir.clone().multiplyScalar(0)); 
    },

    // Correct: cylinder motion is along vector rotated in XZ plane by bank angle.
    // Crankshaft axis = X. Y = Up. Z = Forward.
    // So Bank A is +45 from Y in Z direction? No. V angle opens UP. 
    // Bank A axis = rotate(0,1,0) by -45 around Z.
    getBankDirection(bank) {
        const ax = bank==='A' ? -45 : 45;
        return new THREE.Vector3(0,1,0).applyAxisAngle(new THREE.Vector3(0,0,1), degToRad(ax));
    },

    buildCrankshaft() {
        const eng = this.engine;
        const cx = this.groups.crank;
        const throwLen = 3.2;
        
        // Main journals (3) + End

            pr.rotation.x += Math.PI; // flip since pushrod geometry built bottom-up? lookAt handles.

            // Valve mesh
            const vm = this.valveMeshes[def.id];
            const vmPos = v3A.copy(valveBase).add(vDir.clone().multiplyScalar(0.4 + vL));
            vm.position.copy(vmPos);
            // Valve orientation is applied via the quaternion below.
            // Simple: align valve stem to vDir. Valve geometry built with stem along +Y.
            const rot = new THREE.Quaternion();
            rot.setFromUnitVectors(new THREE.Vector3(0,1,0), vDir);
            vm.quaternion.copy(rot);

            // Spring
            const sm = this.springMeshes[def.id];
            sm.position.copy(v3A.copy(valveBase).add(vDir.clone().multiplyScalar(0.4)));
            sm.scale.set(0.3, 1 - vL, 0.3); // compress
            sm.quaternion.copy(rot);

            // Rocker arm (visual)
            const rm = this.rockerMeshes[def.id];
            rm.position.copy(rockerPivot);
            const armDir = v3A.subVectors(vmPos, rockerPivot); // tip position
            rm.lookAt(armDir);
            // Rocker angle: armDir angle relative to horizontal.
            // Rocker pivots, pushes valve UP.
            // Pushrod pushes rocker DOWN (towards cam). Rocker pushes valve UP (+vDir).
            // Geometry: Pushrod contact is +vDir side (inner), Valve contact is -vDir side (outer) relative to pivot?
            // Rocker arm: pivot between. Pushrod contact: near cam (vDir side). Valve contact: away.
            // If lift requires arm to rotate +theta, pushrod contact must move +vDir side? 
            // Simple lookAt approx is fine visually.
            
            // Combustion
            if(cycle.name === 'POWER' && Math.sin(degToRad(eff)) > 0.8 && Math.random() > 0.85) {
                this.spawnCombustion(def.id, vmPos);
            }

            // Update engine stats
            this.cylStats[def.id] = { phase: eff, name: cycle.name, power: cycle.name==='POWER' };
            this.cylStats[def.id].pistonZ = pPos.z.toFixed(1);
            this.cylStats[def.id].rodAngle = (def.bankDir.angleTo(bPos.clone().sub(wPos)) * 180/Math.PI).toFixed(0);
        }
    },
    
    getValveLift(phase) {
        // Intake / Exhaust lift curves. 
        // 720 cycle. Intake open 0-180? Intake stroke 0-180.
        // Standard: Intake opens 20 BTDC, closes 50 ABDC.
        // Phase range 0..720. Intake stroke 0..180.
        // IO (deg) = 20 (before 360? No before TDC=180? TDC is 180 or 360 depending on start).
        // Let phase 0 = TDC Exhaust? Let's align: 0=Intake TDC? 
        // 0-180 Intake. TDC between Exh(540-720) and Intake(0-180) is phase 0/720.
        // TDC between Intake and Comp is 180.
        // Intake opens at 720-20=700. Closes at 180+50=230.
        // Exhaust opens at 360+50=410. Closes at 720-20=700.
        const openIntake = 700; const closeIntake = 230;
        const openExh = 410; const closeExh = 700;
        const L = 0.4; // max lift
        const get = (start, end) => {
            // wrap start..end across 720
            const d = degToRad(360); // full lift at top dead center between
            // Map phase to [-180, 180] around top center (midpoint of open/close)
            let mid = (start + end)/2;
            if(start > end) mid += 360;
            let diff = phase - mid;
            if(diff > 180) diff -= 360;
            if(diff < -180) diff += 360;
            // cosine bump
            return Math.max(0, Math.cos(degToRad(diff)) * L * 0.7);
        };
        const il = get(openIntake, closeIntake);
        const el = get(openExh, closeExh);
        return { il, el };
    },

    buildCamshaft(group, bank) {
        const dir = this.getBankDirection(bank);
        // Cam lobes
        const lobes = [];
        for(let i=0; i<4; i++){
            // Lobe offset along cam axis (aligned with cylinder x spacing)
            const lobe = new THREE.Group();
            const profile = new THREE.CylinderGeometry(0, 0.6, 0.2, 24);
            profile.rotateX(Math.PI/2);
            profile.translate(0.3, 0, 0.2); // eccentric
            const body = new THREE.Mesh(profile, this.mats.cam);
            lobe.add(body);
            lobe.position.x = i*1.1 - 2.2;
            group.add(lobe);
            lobes.push(lobe);
        }
        this.camLobes[bank] = lobes;
        // Cam bearing caps
        const cap = new THREE.Mesh(new THREE.BoxGeometry(0.6,0.5,3.5), this.mats.blockDark);
        cap.position.set(0, 0.2, 0);
        group.add(cap);
        // Axis
        const axis = new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2, 10, 16), this.mats.cam);
        axis.rotation.z = Math.PI/2;
        group.add(axis);
        
        // Update position for mechanics
        this.camAPos = dir.clone().multiplyScalar(2.8); // fixed cam position for linkage
        this.camBPos = dir.clone().multiplyScalar(2.8);
    },
    
    buildTiming() {
        // Crank Pulley @ front (Z=-5)
        const cp = new THREE.Mesh(new THREE.CylinderGeometry(0.8,0.8,1.2,16), this.mats.pulley);
        cp.position.set(0,0,-5.2); cp.rotation.x = Math.PI/2;
        const cpBelt = new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.6,1.4,16), this.mats.belt);
        cpBelt.position.set(0,0,-5.2); cpBelt.rotation.x=Math.PI/2;
        this.groups.timing.add(cp, cpBelt);
        this.crankPulley = cp;

        // Belt loop visual (simple quad approximated by 2 cylinders for sides)
        const topBelt = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06, 16, 8), this.mats.belt);
        topBelt.position.set(0, 5.5, -5.2); topBelt.rotation.x = Math.PI/2;
        this.groups.timing.add(topBelt);
        
        // Cam Gears @ top (Z=5.5)
        const cGear = new THREE.Mesh(new THREE.TorusGeometry(1.4, 0.15, 8, 32), this.mats.flywheel);
        cGear.rotation.y = Math.PI/2;
        cGear.position.set(-4, 5.5, -5.2);
        const cGearB = new THREE.Mesh(new THREE.TorusGeometry(1.4, 0.15, 8, 32), this.mats.flywheel);
        cGearB.rotation.y = Math.PI/2;
        cGearB.position.set(4, 5.5, -5.2);
        this.groups.timing.add(cGear, cGearB);
        this.cGear = cGear;
        this.cGearB = cGearB;
        
        // Belt from crank to cam gears (visual cylinders)
        const b1 = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06, 12, 8), this.mats.belt);
        b1.position.set(0, 2.65, -5.2); b1.rotation.x=Math.PI/2;
        this.groups.timing.add(b1);
    },

    buildIntake() {
        // Intake plenum + runners. 
        // Bank A intake on +X side? 
        // Intake manifold on top.
        const intMat = this.mats.intake;
        // Plenum
        const pGeo = new THREE.CylinderGeometry(1.2, 1.8, 12, 12);
        pGeo.rotateZ(Math.PI/2);
        const plenum = new THREE.Mesh(pGeo, intMat);
        plenum.position.set(0, 8.2, 0);
        plenum.rotation.set(0,0,degToRad(45));
        this.groups.intake.add(plenum);
        
        // Runners to each head port
        CYL_ORDER_IN_THROWS.forEach((def, i) => {
            const runner = new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.35, 3, 8), intMat);
            // position between plenum and head
            const center = v3A.copy(def.id*1.1-4.4, 0, 0);
            const dir = this.getBankDirection(def.bank);
            runner.position.copy(center).add(v3A.copy(dir).multiplyScalar(5.2));
            runner.position.y += 1.8;
            runner.rotation.copy(dir.clone().angleTo(new THREE.Vector3(0,1,0)) ? 0 : 0);
            // Align runner to bank
            runner.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
            runner.position.y += 0.4;
            this.groups.intake.add(runner);
        });
    },

    buildExhaust() {
        // Headers per bank. Pipes twist from head out.
        CYL_ORDER_IN_THROWS.forEach((def, i) => {
            if(def.bank !== 'A') return; // Headers on both banks for symmetry? Usually one side. Let's do both for visual density.
            const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.7, 3.5, 8), this.mats.exhaust);
            pipe.rotation.x = Math.PI/2;
            const center = v3A.copy(def.id*1.1-4.4, 0, 0);
            const dir = this.getBankDirection(def.bank);
            pipe.position.copy(center);
            // Offset exhaust side (outer bank)
            const off = dir.clone().normalize().applyAxisAngle(new THREE.Vector3(0,0,1), degToRad(45)).multiplyScalar(0.8);
            pipe.position.add(off);
            pipe.position.y = 4;
            this.groups.exhaust.add(pipe);
        });
    },

    buildAccessories() {
        // Water pump / alternator on front
        const wPump = new THREE.Mesh(new THREE.CylinderGeometry(0.7,0.7,1,12), this.mats.pulley);
        wPump.position.set(0, 5.5, -5.0); wPump.rotation.x = Math.PI/2;
        this.groups.timing.add(wPump);
        this.accessories = [wPump];
    },

    spawnCombustion(cylId, pos) {
        const geo = new THREE.SphereGeometry(0.1, 8, 8);
        const mat = new THREE.MeshBasicMaterial({ color: 0xff4400 });
        const p = new THREE.Mesh(geo, mat);
        p.position.copy(pos).add(v3A.set(0,0.2,0));
        p.userData = { life: 1.0, max: 1.0 };
        this.scene.add(p);
        this.explosion.push(p);
    },

    render() {
        requestAnimationFrame(() => this.render());
        const dt = this.clock.getDelta();
        if(this.engine) this.engine.update(dt);
        
        // Update cam/throw visual rotation
        if(this.engine) {
            const a = this.engine.angle;
            this.groups.camA.rotation.x = a * 0.5 + (this.engine.bankA ? 0 : 180); // cam phasing approx
            this.groups.camB.rotation.x = a * 0.5;
            this.crankPulley.rotation.x = a;
            this.cGear.rotation.x = a * 0.5;
            this.cGearB.rotation.x = a * 0.5;
            
            // Explode
            this.groups.heads.position.set(0, (this.explodeVal/10), 0);
            this.groups.intake.position.set(0, (this.explodeVal/10), 0);
            this.groups.exhaust.position.set(0, (this.explodeVal/10), 0);
            this.groups.timing.position.set(0, (this.explodeVal/15), 0);
        }
        
        this.updateMechanics(dt);

        // Expire particles
        for(let i=this.explosion.length-1; i>=0; i--){
            const p = this.explosion[i];
            p.userData.life -= dt;
            p.scale.setScalar(p.userData.life);
            p.material.opacity = p.userData.life;
            if(p.userData.life <= 0){
                this.scene.remove(p);
                this.explosion.splice(i, 1);
            }
        }
        
        this.controls.update();
        this.renderer.render(this.scene, this.camera);
    },

    setupUI() {
        const ui = {
            rpm: 700, simSpeed: 1, manual: false, explode: 0
        };
        this.ui = ui;
        this.explodeVal = 0;

        // Cyl Grid
        const grid = document.getElementById('cylGrid');
        for(let i=1; i<=8; i++){
            const b = document.createElement('div');
            b.className = 'cyl-btn';
            b.innerText = i;
            b.onclick = () => this.selectCylinder(i, b);
            grid.appendChild(b);
        }
        
        // RPM
        document.getElementById('rpmSlider').addEventListener('input', (e) => {
            ui.rpm = parseInt(e.target.value);
            document.getElementById('rpmVal').innerText = ui.rpm;
            this.engine.rpm = ui.rpm;
        });
        // Buttons
        const btns = ['pIdle','p2000','p4000','p6000','p8000','pStop'];
        btns.forEach(id => {
            document.getElementById(id).addEventListener('click', (e) => {
                document.querySelectorAll('button[id^=p]').forEach(b=>b.classList.remove('active'));
                e.target.classList.add('active');
                if(id==='pStop') ui.rpm = 0;
                else ui.rpm = parseInt(id.substring(1));
                this.engine.rpm = ui.rpm;
                document.getElementById('rpmVal').innerText = ui.rpm;
            });
        });
        // Sim Speed
        document.getElementById('simSpeed').addEventListener('input', (e) => {
            ui.simSpeed = parseFloat(e.target.value);
            document.getElementById('simSpeedVal').innerText = ui.simSpeed.toFixed(2)+'x';
        });
        // Cycle Mode
        document.getElementById('pCycleMode').addEventListener('click', (e) => {
            ui.manual = !ui.manual;
            this.engine.manualMode = ui.manual;
            e.target.classList.toggle('active');
            e.target.classList.toggle('active', !ui.manual);
            e.target.style.background = ui.manual ? '#2a8' : '';
            document.getElementById('crankScrub').disabled = ui.manual;
        });
        // Crank Scrub
        document.getElementById('crankScrub').addEventListener('input', (e) => {
            this.engine.manualAngle = parseInt(e.target.value);
            this.engine.manualMode = true;
            document.getElementById('crankAngleVal').innerText = this.engine.manualAngle+'°';
        });
        // Explode
        document.getElementById('explode').addEventListener('input', (e) => {
            this.explodeVal = parseInt(e.target.value);
            document.getElementById('explodeVal').innerText = this.explodeVal;
        });
        // Visibility
        document.querySelectorAll('.vis-btn').forEach(b => {
            b.addEventListener('click', () => {
                b.classList.toggle('active');
                const key = b.dataset.view || b.dataset.id || b.dataset.name; // handle dataset name variants
                const k = b.getAttribute('data').split(' ')[0];
                const el = this.groups[k];
                if(el) el.visible = !el.visible;
                b.style.opacity = el ? (el.visible ? 1 : 0.3) : 1;
            });
        });
        // Cameras
        document.querySelectorAll('.cam-btn').forEach(b => {
            b.addEventListener('click', () => {
                const pos =                            b.dataset.view === 'hero' ? [8,6,12] : 
                            b.dataset.view === 'front' ? [0, 5, 10] :
                            b.dataset.view === 'side' ? [10, 4, 0] :
                            b.dataset.view === 'top' ? [0, 20, 0] : [0, 5, 5];
                this.camera.position.set(...pos);
                this.controls.target.set(0, 3, 0);
            });
        });
    },

    selectCylinder(id, el) {
        document.querySelectorAll('.cyl-btn').forEach(b=>b.classList.remove('active'));
        el.classList.add('active');
        const c = this.engine.cyls.find(c=>c.id===id);
        if(c){
            const eff = (this.engine.angle - c.firingOffset) % 720;
            const p = eff < 0 ? eff + 720 : eff;
            const st = cycleState(p);
            document.getElementById('cylPhaseVal').innerText = p.toFixed(0) + '°';
            document.getElementById('cylState').innerText = 
                `CYL ${id} | ${st.name} STROKE | THROW PHASE ${c.throwIdx*90}°`;
        }
    }
};

// Fix map usage (CYL_ORDER_IN_THROWS must be global)

// Patch app methods to reference global CYL_ORDER_IN_THROWS
Engine.prototype.init = function() {
    const FIRED_ORDER = [1, 8, 4, 3, 6, 5, 7, 2];
    for(let i=0; i<8; i++){
        const def = CYL_ORDER_IN_THROWS[FIRED_ORDER.indexOf(i+1)];
        const firingOffset = i * 90;
        this.cyls.push({ id: i+1, throwIdx: def.throwIdx, bank: def.bank, firingOffset: firingOffset });
    }
};

// Initialize global references in app
app.valveMeshes = {};
app.springMeshes = {};
app.rockerMeshes = {};
app.pistons = {};
app.rods = {};
app.camAPos = new THREE.Vector3();
app.camBPos = new THREE.Vector3();
app.camLobes = {};
app.cylStats = {};

// Patch buildCylinder to create valve meshes
const originalBuildCylinder = app.buildCylinder;
app.buildCylinder = function(def) {
    originalBuildCylinder.call(this, def);
    // Valve
    const vm = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.14,1.6,12), this.mats.valve);
    vm.position.y = 1.0;
    const head = new THREE.Mesh(new THREE.ConeGeometry(0.25,0.4,16), this.mats.valve);
    head.position.y = 0.4;
    vm.add(head);
    this.valveMeshes[def.id] = vm;
    // Spring
    const sm = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,1.2,4), this.mats.spring);
    sm.scale.set(1,1,1);
    // Helical spring via tube? Using scaled cylinder for simplicity.
    // Better: Tube geometry with radius twist
    const path = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0,0,0), new THREE.Vector3(0.1,0.6,0.1), new THREE.Vector3(0,1.2,0)
    ]);
    const spGeo = new THREE.TubeGeometry(path, 8, 0.04, 4, false);
    const spr = new THREE.Mesh(spGeo, this.mats.spring);
    spr.scale.set(0.9,0.9,0.9);
    this.springMeshes[def.id] = spr;
    // Rocker
    const rm = new THREE.Mesh(new THREE.BoxGeometry(0.8,0.15,1.6), this.mats.valve);
    rm.position.y = 0.05;
    this.rockerMeshes[def.id] = rm;
};

app.init();
</script>
