<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mechanical Keyboard Showcase</title>
<style>
  :root{
    --case-top:#3a4256;
    --case-side:#2a3044;
    --case-front:#232838;
    --pcb:#5a3a2a;
    --pcb-side:#3f2819;
    --foam:#c9a24b;
    --plate:#6a7080;
    --accent:#ff7a45;
    --accent2:#4fd1c5;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:radial-gradient(circle at 50% 30%,#1b2130 0%,#0c0f18 70%);
    color:#e6e9f0;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  header{
    text-align:center;
    padding:14px 10px 4px;
    z-index:20;
    pointer-events:none;
  }
  header h1{
    font-size:clamp(16px,3vw,26px);
    font-weight:700;
    letter-spacing:2px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  header p{font-size:12px;color:#8c94a8;margin-top:4px;letter-spacing:1px;}

  /* Scene */
  #scene-wrap{
    flex:1;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    perspective:1600px;
    perspective-origin:50% 42%;
    min-height:0;
  }
  #scene{
    transform-style:preserve-3d;
    transform:rotateX(58deg) rotateZ(0deg) scale(var(--sceneScale,1));
    transition:transform .3s ease;
    position:relative;
  }
  .layer{
    position:absolute;
    transform-style:preserve-3d;
    left:50%;top:50%;
  }

  /* Generic 3D box helper via faces */
  .box-face{position:absolute;backface-visibility:hidden;}

  /* Case */
  #kb{
    transform-style:preserve-3d;
    position:relative;
  }

  .key{
    position:absolute;
    transform-style:preserve-3d;
    cursor:pointer;
  }
  .kc-face{
    position:absolute;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:600;color:#e9edf5;
    text-shadow:0 1px 1px rgba(0,0,0,.4);
    backface-visibility:hidden;
    user-select:none;
  }

  /* Controls */
  #controls{
    position:relative;
    z-index:30;
    display:flex;
    gap:10px;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    padding:10px 12px 18px;
  }
  button.ctrl{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.14);
    color:#e6e9f0;
    padding:9px 16px;
    border-radius:10px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    backdrop-filter:blur(6px);
    transition:.2s;
    display:flex;align-items:center;gap:7px;
  }
  button.ctrl:hover{background:rgba(255,255,255,.14);border-color:var(--accent);}
  button.ctrl:active{transform:translateY(1px);}
  .ctrl.on{border-color:var(--accent2);color:var(--accent2);}
  .slider-wrap{display:flex;align-items:center;gap:8px;font-size:12px;color:#9aa2b6;}
  input[type=range]{accent-color:var(--accent);cursor:pointer;}

  #hint{
    position:fixed;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    background:rgba(15,18,28,.92);
    border:1px solid var(--accent);
    padding:14px 22px;
    border-radius:12px;
    font-size:14px;
    z-index:50;
    transition:opacity .5s;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
    text-align:center;
  }
  #hint.hide{opacity:0;pointer-events:none;}
  #status{
    position:fixed;bottom:6px;left:0;right:0;
    text-align:center;font-size:11px;color:#5c6376;letter-spacing:1px;
    pointer-events:none;
  }
  .drag-hint{position:fixed;top:70px;right:14px;font-size:11px;color:#6b7488;z-index:20;}
</style>
</head>
<body>
<header>
  <h1>AURORA65 — 3D KEYBOARD</h1>
  <p>EXPLODED ASSEMBLY · GASKET MOUNT · HOT-SWAP</p>
</header>

<div class="drag-hint">drag to rotate · scroll to zoom</div>

<div id="scene-wrap">
  <div id="scene">
    <div id="kb"></div>
  </div>
</div>

<div id="controls">
  <button class="ctrl" id="replayBtn">↻ Replay Assembly</button>
  <button class="ctrl" id="muteBtn">🔊 Sound On</button>
  <button class="ctrl on" id="rgbBtn">✦ RGB On</button>
  <div class="slider-wrap">
    Hue <input type="range" id="hueSlider" min="0" max="360" value="20">
  </div>
</div>

<div id="hint">🔊 Click anywhere or press a key to enable sound & start</div>
<div id="status"></div>

<script>
(function(){
  "use strict";

  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ============ KEYBOARD LAYOUT (65%) ============ */
  // Each key: label, secondary width(u), row. Special types get sounds/colors.
  const U = 42;      // unit size px
  const GAP = 4;     // gap between keys
  const rows = [
    [ ["Esc",1,"mod"],["1",1],["2",1],["3",1],["4",1],["5",1],["6",1],["7",1],["8",1],["9",1],["0",1],["-",1],["=",1],["Bksp",2,"bksp"],["~",1,"knobcol"] ],
    [ ["Tab",1.5,"mod"],["Q",1],["W",1],["E",1],["R",1],["T",1],["Y",1],["U",1],["I",1],["O",1],["P",1],["[",1],["]",1],["\\",1.5],["Del",1,"mod"] ],
    [ ["Caps",1.75,"mod"],["A",1],["S",1],["D",1],["F",1],["G",1],["H",1],["J",1],["K",1],["L",1],[";",1],["'",1],["Enter",2.25,"enter"],["PgUp",1,"mod"] ],
    [ ["Shift",2.25,"mod"],["Z",1],["X",1],["C",1],["V",1],["B",1],["N",1],["M",1],[",",1],[".",1],["/",1],["Shift",1.75,"mod"],["↑",1,"mod"],["PgDn",1,"mod"] ],
    [ ["Ctrl",1.25,"mod"],["Win",1.25,"mod"],["Alt",1.25,"mod"],["Space",6.25,"space"],["Alt",1,"mod"],["Fn",1,"mod"],["←",1,"mod"],["↓",1,"mod"],["→",1,"mod"] ]
  ];

  // Map physical keys -> label matching
  const keyMap = {
    "Escape":"Esc","Backspace":"Bksp","Tab":"Tab","CapsLock":"Caps","Enter":"Enter",
    "ShiftLeft":"Shift","ShiftRight":"Shift","ControlLeft":"Ctrl","ControlRight":"Ctrl",
    "AltLeft":"Alt","AltRight":"Alt","MetaLeft":"Win","MetaRight":"Win","Space":"Space",
    "ArrowUp":"↑","ArrowDown":"↓","ArrowLeft":"←","ArrowRight":"→",
    "Delete":"Del","Backquote":"~","Minus":"-","Equal":"=",
    "BracketLeft":"[","BracketRight":"]","Backslash":"\\","Semicolon":";","Quote":"'",
    "Comma":",","Period":".","Slash":"/","PageUp":"PgUp","PageDown":"PgDn"
  };

  const kb = document.getElementById('kb');
  const scene = document.getElementById('scene');

  // Compute total board width in units
  let maxRowU = 0;
  rows.forEach(r=>{ let s=0; r.forEach(k=>s+=k[1]); maxRowU=Math.max(maxRowU,s); });
  const boardW = maxRowU*U + (maxRowU-1)*0 + 26; // padding
  const boardH = rows.length*U + (rows.length-1)*0 + 26;
  const CASE_MARGIN = 16;
  const caseW = boardW + CASE_MARGIN*2;
  const caseH = boardH + CASE_MARGIN*2;

  // z-heights for layers (stack thickness)
  const Z = {
    caseBottom: 0,
    pcb: 8,
    foam: 14,
    plate: 20,
    switchBase: 24,
    keycap: 40
  };

  /* ---------- Helper: build a 3D box with 6 faces ---------- */
  function makeBox(w,h,depth, colors, cls){
    const el = document.createElement('div');
    el.className = 'layer '+(cls||'');
    el.style.width=w+'px'; el.style.height=h+'px';
    el.style.marginLeft=(-w/2)+'px'; el.style.marginTop=(-h/2)+'px';
    const {top,side,front}=colors;
    el.appendChild(makeFace(w,h,top,`translateZ(${depth}px)`));               // top
    el.appendChild(makeFace(w,h,shade(front,-.15),`translateZ(0px)`));        // bottom
    el.appendChild(makeFace(w,depth,front,`translateY(${h}px) rotateX(-90deg)`,'top left')); // front (bottom edge)
    el.appendChild(makeFace(w,depth,shade(front,-.1),`rotateX(-90deg) translateY(${-depth}px)`,'bottom left')); // back
    el.appendChild(makeFace(depth,h,side,`rotateY(-90deg) translateX(${-depth}px)`,'top left'));   // left
    el.appendChild(makeFace(depth,h,shade(side,-.08),`translateX(${w}px) rotateY(90deg)`,'top left'));  // right
    return el;
  }
  function makeFace(w,h,bg,tf,origin){
    const d=document.createElement('div');
    d.className='box-face';
    d.style.width=w+'px'; d.style.height=h+'px';
    d.style.background=bg;
    d.style.transform=tf;
    if(origin) d.style.transformOrigin=origin;
    d.style.left='0'; d.style.top='0';
    return d;
  }
  function shade(hex,amt){
    // hex like #rrggbb -> lighten/darken
    let c=hex;
    if(c[0]!=='#') return c;
    let r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);
    r=Math.max(0,Math.min(255,Math.round(r+255*amt)));
    g=Math.max(0,Math.min(255,Math.round(g+255*amt)));
    b=Math.max(0,Math.min(255,Math.round(b+255*amt)));
    return `rgb(${r},${g},${b})`;
  }

  /* ---------- Build layers ---------- */
  // CASE (bottom tray) — bigger, with sloped feel via thickness
  const caseBottom = makeBox(caseW, caseH, 18, {top:getComputedStyle(document.documentElement).getPropertyValue('--case-side').trim(), side:'#2a3044', front:'#232838'}, 'case');
  caseBottom.style.transform = `translateZ(${Z.caseBottom}px)`;
  caseBottom.dataset.z = Z.caseBottom;

  // PCB
  const pcb = makeBox(boardW, boardH, 4, {top:'#5a3a2a', side:'#3f2819', front:'#3f2819'}, 'pcb');
  // add PCB detail (traces / hotswap dots) on top face
  addPcbDetail(pcb, boardW, boardH);

  // FOAM
  const foam = makeBox(boardW-6, boardH-6, 5, {top:'#c9a24b', side:'#a8853a', front:'#a8853a'}, 'foam');

  // PLATE
  const plate = makeBox(boardW-2, boardH-2, 3, {top:'#6a7080', side:'#4c515e', front:'#4c515e'}, 'plate');
  // plate cutouts (cosmetic grid)
  addPlateHoles(plate);

  const layers=[caseBottom, pcb, foam, plate];
  layers.forEach(l=>kb.appendChild(l));

  /* ---------- Switches & Keycaps ---------- */
  const keyElems=[];   // {el,cap,switch,label,type,cx,cy}
  let switchList=[]; let capList=[];

  function buildKeys(){
    // total board pixel origin (top-left of key area inside case)
    const startX = -boardW/2 + 13;
    const startY = -boardH/2 + 13;
    rows.forEach((row,ri)=>{
      let x=startX;
      const y=startY + ri*U;
      row.forEach((key)=>{
        const [label,w,type]=key;
        const kw = w*U - GAP;
        const kh = U - GAP;
        const cx = x + kw/2 + GAP/2;
        const cy = y + kh/2 + GAP/2;

        // SWITCH housing
        const sw = document.createElement('div');
        sw.className='key switch';
        sw.style.width=(kw*0.5)+'px';
        sw.style.height=(kh*0.5)+'px';
        sw.style.left=(cx - kw*0.25)+'px';
        sw.style.top=(cy - kh*0.25)+'px';
        buildSwitchBox(sw, kw*0.5, kh*0.5);
        sw.style.transform=`translateZ(${Z.switchBase}px)`;
        sw.dataset.finalZ=Z.switchBase;

        // KEYCAP (interactive)
        const cap = document.createElement('div');
        cap.className='key cap';
        cap.style.width=kw+'px';
        cap.style.height=kh+'px';
        cap.style.left=(cx - kw/2)+'px';
        cap.style.top=(cy - kh/2)+'px';
        buildKeycapBox(cap, kw, kh, label, type);
        cap.dataset.finalZ=Z.keycap;
        cap.style.transform=`translateZ(${Z.keycap}px)`;

        const rec={el:cap, sw, label, type:type||'letter', cx, cy};
        cap.addEventListener('click', ()=>pressKey(rec,true));
        keyElems.push(rec);
        switchList.push(sw);
        capList.push(cap);
        kb.appendChild(sw);
        kb.appendChild(cap);
        x += w*U;
      });
    });
    // Rotary knob (replace the ~ key position at top-right as accent) -> add separate knob
    addKnob(startX, startY);
  }

  let knob=null;
  function addKnob(sx,sy){
    // put knob at far top-right, above layout, on the case edge
    knob=document.createElement('div');
    knob.className='key knob';
    const d=26;
    knob.style.width=d+'px'; knob.style.height=d+'px';
    knob.style.left=(caseW/2 - d - 6 - caseW/2 + caseW/2)+'px'; // placeholder
    knob.style.left=(boardW/2 - d + 2)+'px';
    knob.style.top=(-boardH/2 - d - 2)+'px';
    // cylinder-ish: stacked faces
    knob.innerHTML='';
    const cyl=document.createElement('div');
    cyl.style.cssText=`position:absolute;width:${d}px;height:${d}px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5a6070,#2b3040);transform:translateZ(52px);box-shadow:0 0 0 2px #1a1e2a;`;
    const cylTop=document.createElement('div');
    cylTop.style.cssText=`position:absolute;width:${d}px;height:${d}px;border-radius:50%;background:conic-gradient(#3a4050,#565d70,#3a4050,#565d70,#3a4050);transform:translateZ(58px);`;
    const nub=document.createElement('div');
    nub.style.cssText=`position:absolute;width:3px;height:9px;background:var(--accent);left:${d/2-1.5}px;top:2px;border-radius:2px;transform:translateZ(59px);`;
    knob.appendChild(cyl);knob.appendChild(cylTop);knob.appendChild(nub);
    knob.dataset.finalZ=52;
    knob.rot=0;
    knob.addEventListener('click',()=>{
      knob.rot+=45;
      cylTop.style.transform=`translateZ(58px) rotate(${knob.rot}deg)`;
      nub.style.transform=`translateZ(59px) rotate(${knob.rot}deg)`;
      playSound('knob');
    });
    kb.appendChild(knob);
  }

  function buildSwitchBox(el,w,h){
    // switch = colored top housing + stem cross
    const colors={top:'#33384a',side:'#22263a',front:'#22263a'};
    const depth=12;
    el.appendChild(makeFace(w,h,'#3a4054',`translateZ(${depth}px)`));
    el.appendChild(makeFace(w,depth,'#20243a',`translateY(${h}px) rotateX(-90deg)`,'top left'));
    el.appendChild(makeFace(w,depth,'#191d30',`rotateX(-90deg) translateY(${-depth}px)`,'bottom left'));
    el.appendChild(makeFace(depth,h,'#252a40',`rotateY(-90deg) translateX(${-depth}px)`,'top left'));
    el.appendChild(makeFace(depth,h,'#191d30',`translateX(${w}px) rotateY(90deg)`,'top left'));
    // stem (cross) small red/accent
    const stem=document.createElement('div');
    stem.style.cssText=`position:absolute;width:${w*0.45}px;height:${h*0.45}px;left:${w*0.275}px;top:${h*0.275}px;background:var(--accent);transform:translateZ(${depth+2}px);border-radius:2px;box-shadow:0 0 4px rgba(255,120,60,.4);`;
    stem.className='sw-stem';
    el.appendChild(stem);
  }

  function buildKeycapBox(el,w,h,label,type){
    let topCol='#e9edf5', sideCol='#c3c9d6', frontCol='#b3bac9';
    if(type==='mod'||type==='bksp'){ topCol='#aeb6c6'; sideCol='#8b93a6'; frontCol='#7f8798'; }
    if(type==='enter'){ topCol='#ff7a45'; sideCol='#d55f31'; frontCol='#c25327'; }
    if(type==='space'){ topCol='#c6ccd9'; sideCol='#9aa1b2'; frontCol='#8d95a6'; }
    if(type==='knobcol'){ topCol='#4fd1c5'; sideCol='#37a99e'; frontCol='#2f9990'; }
    const depth=14;
    el.dataset.depth=depth;
    // top face slightly inset dish look via gradient
    const top=makeFace(w,h,`linear-gradient(145deg, ${shadeHex(topCol,18)}, ${topCol} 55%, ${shadeHex(topCol,-10)})`,`translateZ(${depth}px)`);
    top.style.borderRadius='4px';
    top.classList.add('cap-top');
    // label
    const lbl=document.createElement('div');
    lbl.className='kc-face';
    lbl.textContent=label;
    lbl.style.cssText+=`width:${w}px;height:${h}px;transform:translateZ(${depth+0.5}px);color:${(type==='enter'||type==='knobcol')?'#12151c':'#2a2f3c'};font-size:${label.length>2?9:11}px;padding:3px;`;
    lbl.style.alignItems='flex-start'; lbl.style.justifyContent='flex-start';
    el.appendChild(top);
    el.appendChild(makeFace(w,depth,frontCol,`translateY(${h}px) rotateX(-90deg)`,'top left'));
    el.appendChild(makeFace(w,depth,shadeHex(frontCol,-8),`rotateX(-90deg) translateY(${-depth}px)`,'bottom left'));
    el.appendChild(makeFace(depth,h,sideCol,`rotateY(-90deg) translateX(${-depth}px)`,'top left'));
    el.appendChild(makeFace(depth,h,shadeHex(sideCol,-8),`translateX(${w}px) rotateY(90deg)`,'top left'));
    el.appendChild(lbl);
  }

  function shadeHex(hex,pct){
    if(hex[0]!=='#') return hex;
    let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    const f=c=>Math.max(0,Math.min(255,Math.round(c+ (pct/100)*255)));
    return `rgb(${f(r)},${f(g)},${f(b)})`;
  }

  function addPcbDetail(el,w,h){
    const top=el.querySelector('.box-face');
    // add golden hotswap sockets grid + accent traces overlay
    const overlay=document.createElement('div');
    overlay.style.cssText=`position:absolute;inset:0;width:${w}px;height:${h}px;transform:translateZ(4.1px);pointer-events:none;
      background:
        radial-gradient(circle at 20% 30%, rgba(255,215,120,.25) 0 6px, transparent 7px),
        repeating-linear-gradient(90deg, transparent 0 20px, rgba(255,215,120,.06) 20px 21px),
        repeating-linear-gradient(0deg, transparent 0 20px, rgba(255,215,120,.05) 20px 21px);`;
    el.appendChild(overlay);
  }
  function addPlateHoles(el){
    const overlay=document.createElement('div');
    overlay.style.cssText=`position:absolute;inset:0;transform:translateZ(3.1px);pointer-events:none;
      background:repeating-linear-gradient(90deg, transparent 0 34px, rgba(0,0,0,.22) 34px 42px);
      mix-blend-mode:multiply;`;
    el.appendChild(overlay);
  }

  buildKeys();

  /* Sort switches & caps left-to-right (by cx then cy) for install order */
  const orderByX=(a,b)=> (a.cx - b.cx) || (a.cy - b.cy);
  keyElems.sort(orderByX);
  switchList = keyElems.map(k=>k.sw);
  capList = keyElems.map(k=>k.el);

  /* ============ RESPONSIVE SCALE ============ */
  function fitScene(){
    const wrap=document.getElementById('scene-wrap');
    const avail=Math.min(wrap.clientWidth, wrap.clientHeight*1.7);
    let s = avail / (caseW*1.35);
    s=Math.max(0.45,Math.min(1.25,s));
    userScale = userScale || s;
    document.documentElement.style.setProperty('--sceneScale', (s*userZoom));
    baseFitScale=s;
  }
  let baseFitScale=1, userZoom=1, userScale=null;
  window.addEventListener('resize',fitScene);

  /* ============ 3D ROTATION (drag) & ZOOM ============ */
  let rotX=58, rotZ=0, dragging=false, lastX=0,lastY=0;
  function applyScene(){
    scene.style.transform=`rotateX(${rotX}deg) rotateZ(${rotZ}deg)`;
    document.documentElement.style.setProperty('--sceneScale',(baseFitScale*userZoom));
  }
  const wrap=document.getElementById('scene-wrap');
  wrap.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;scene.style.transition='none';});
  window.addEventListener('pointerup',()=>{dragging=false;scene.style.transition='transform .3s ease';});
  window.addEventListener('pointermove',e=>{
    if(!dragging)return;
    rotZ += (e.clientX-lastX)*0.4;
    rotX -= (e.clientY-lastY)*0.3;
    rotX=Math.max(20,Math.min(80,rotX));
    lastX=e.clientX;lastY=e.clientY;
    applyScene();
  });
  wrap.addEventListener('wheel',e=>{
    e.preventDefault();
    userZoom *= e.deltaY<0?1.08:0.93;
    userZoom=Math.max(0.5,Math.min(2.2,userZoom));
    applyScene();
  },{passive:false});

  /* ============ WEB AUDIO ============ */
  let AC=null, masterGain=null, muted=false, audioReady=false;
  function initAudio(){
    if(audioReady)return;
    try{
      AC=new (window.AudioContext||window.webkitAudioContext)();
      masterGain=AC.createGain();
      masterGain.gain.value=0.5;
      masterGain.connect(AC.destination);
      audioReady=true;
    }catch(e){}
  }
  function resumeAudio(){ if(AC&&AC.state==='suspended')AC.resume(); }

  // synthesize a "thock" click. type controls pitch/character.
  function playSound(type){
    if(!audioReady||muted||!AC)return;
    resumeAudio();
    const now=AC.currentTime;
    let baseFreq=420, dur=0.11, noiseAmt=0.35, q=6, wave='triangle';
    switch(type){
      case 'space': baseFreq=150; dur=0.16; noiseAmt=0.5; q=4; break;
      case 'enter': baseFreq=300; dur=0.13; noiseAmt=0.4; break;
      case 'bksp':  baseFreq=260; dur=0.12; noiseAmt=0.45; break;
      case 'mod':   baseFreq=340; dur=0.10; noiseAmt=0.4; break;
      case 'knob':  baseFreq=800; dur=0.05; noiseAmt=0.15; wave='square'; break;
      default:      baseFreq=430 + Math.random()*40; // letters
    }
    // Tone (body)
    const osc=AC.createOscillator();
    osc.type=wave;
    osc.frequency.setValueAtTime(baseFreq,now);
    osc.frequency.exponentialRampToValueAtTime(baseFreq*0.6,now+dur);
    const g=AC.createGain();
    g.gain.setValueAtTime(0.0001,now);
    g.gain.exponentialRampToValueAtTime(0.5,now+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,now+dur);
    osc.connect(g);g.connect(masterGain);
    osc.start(now);osc.stop(now+dur+0.02);

    // Click noise burst (attack)
    const bufSize=AC.sampleRate*0.04;
    const buffer=AC.createBuffer(1,bufSize,AC.sampleRate);
    const data=buffer.getChannelData(0);
    for(let i=0;i<bufSize;i++){data[i]=(Math.random()*2-1)*Math.pow(1-i/bufSize,3);}
    const noise=AC.createBufferSource();noise.buffer=buffer;
    const nf=AC.createBiquadFilter();nf.type='bandpass';nf.frequency.value=baseFreq*3.2;nf.Q.value=q;
    const ng=AC.createGain();ng.gain.value=noiseAmt;
    noise.connect(nf);nf.connect(ng);ng.connect(masterGain);
    noise.start(now);noise.stop(now+0.05);
  }

  /* ============ KEY PRESS ANIMATION ============ */
  const activePress=new Set();
  function pressKey(rec, release){
    initAudio();
    playSound(rec.type);
    const cap=rec.el;
    const finalZ=parseFloat(cap.dataset.finalZ);
    cap.style.transition='transform .05s ease';
    cap.style.transform=`translateZ(${finalZ-8}px)`;
    if(release!==false){
      clearTimeout(cap._rel);
      cap._rel=setTimeout(()=>{
        cap.style.transition='transform .12s ease';
        cap.style.transform=`translateZ(${finalZ}px)`;
      },100);
    }
  }
  function holdKey(rec){
    initAudio();playSound(rec.type);
    const cap=rec.el;const finalZ=parseFloat(cap.dataset.finalZ);
    cap.style.transition='transform .05s ease';
    cap.style.transform=`translateZ(${finalZ-8}px)`;
  }
  function releaseKey(rec){
    const cap=rec.el;const finalZ=parseFloat(cap.dataset.finalZ);
    cap.style.transition='transform .12s ease';
    cap.style.transform=`translateZ(${finalZ}px)`;
  }

  function findKeyByEvent(e){
    const code=e.code;
    let label=keyMap[code];
    if(!label){
      // single char keys
      if(/^Key([A-Z])$/.test(code)) label=code.slice(3);
      else if(/^Digit(\d)$/.test(code)) label=code.slice(5);
    }
    if(!label)return null;
    // find matching, prefer not already active
    return keyElems.find(k=>k.label.toLowerCase()===label.toLowerCase() && !activePress.has(k))
        || keyElems.find(k=>k.label.toLowerCase()===label.toLowerCase());
  }

  window.addEventListener('keydown',e=>{
    if(e.repeat)return;
    hideHint();
    const rec=findKeyByEvent(e);
    if(rec){
      if(e.code==='Space'||e.code==='Tab'||e.code.startsWith('Arrow')) e.preventDefault();
      activePress.add(rec);
      holdKey(rec);
    }
  });
  window.addEventListener('keyup',e=>{
    const label=keyMap[e.code] || (/^Key([A-Z])$/.test(e.code)?e.code.slice(3):(/^Digit(\d)$/.test(e.code)?e.code.slice(5):null));
    if(!label)return;
    keyElems.forEach(k=>{
      if(k.label.toLowerCase()===label.toLowerCase() && activePress.has(k)){
        activePress.delete(k);releaseKey(k);
      }
    });
  });

  /* ============ RGB LIGHTING ============ */
  let rgbOn=true, rgbHue=20, rgbRAF=null;
  const rgbGlow=document.createElement('div');
  rgbGlow.style.cssText=`position:absolute;width:${boardW+30}px;height:${boardH+30}px;left:50%;top:50%;margin-left:${-(boardW+30)/2}px;margin-top:${-(boardH+30)/2}px;transform:translateZ(2px);border-radius:14px;pointer-events:none;filter:blur(10px);`;
  kb.appendChild(rgbGlow);
  function rgbLoop(t){
    if(rgbOn){
      const h=(rgbHue + (t*0.02)%360);
      rgbGlow.style.boxShadow=`0 0 30px 8px hsl(${h%360} 90% 55% / .55), 0 0 60px 20px hsl(${(h+40)%360} 90% 50% / .3)`;
      // tint switch stems subtly
      document.querySelectorAll('.sw-stem').forEach((s,i)=>{
        s.style.background=`hsl(${(h+i*4)%360} 90% 60%)`;
        s.style.boxShadow=`0 0 4px hsl(${(h+i*4)%360} 90% 60% / .6)`;
      });
    }
    rgbRAF=requestAnimationFrame(rgbLoop);
  }
  function setRGB(on){
    rgbOn=on;
    if(!on){rgbGlow.style.boxShadow='none';document.querySelectorAll('.sw-stem').forEach(s=>{s.style.background='var(--accent)';s.style.boxShadow='none';});}
  }

  /* ============ EXPLODED ASSEMBLY ANIMATION ============ */
  // Utility tween
  function tween(el, props, dur, delay, ease){
    return new Promise(res=>{
      if(prefersReduced){ Object.assign(el.style,props.final||{}); res(); return; }
      setTimeout(()=>{
        el.style.transition=`transform ${dur}ms ${ease||'cubic-bezier(.22,1,.36,1)'}, opacity ${dur}ms ease`;
        requestAnimationFrame(()=>{
          if(props.transform!==undefined) el.style.transform=props.transform;
          if(props.opacity!==undefined) el.style.opacity=props.opacity;
        });
        setTimeout(res, dur+20);
      }, delay||0);
    });
  }
  const wait=ms=>new Promise(r=>setTimeout(r,prefersReduced?0:ms));

  let assembling=false;
  function resetToExploded(){
    // set everything exploded/hidden above
    caseBottom.style.transition='none';
    caseBottom.style.transform=`translateZ(${Z.caseBottom}px) translateY(${prefersReduced?0:200}px)`;
    caseBottom.style.opacity='0';
    pcb.style.transition='none';pcb.style.opacity='0';pcb.style.transform=`translateZ(${Z.pcb+260}px)`;
    foam.style.transition='none';foam.style.opacity='0';foam.style.transform=`translateZ(${Z.foam+340}px)`;
    plate.style.transition='none';plate.style.opacity='0';plate.style.transform=`translateZ(${Z.plate+420}px)`;
    switchList.forEach(sw=>{sw.style.transition='none';sw.style.opacity='0';sw.style.transform=`translateZ(${Z.switchBase+300}px)`;});
    capList.forEach(c=>{c.style.transition='none';c.style.opacity='0';c.style.transform=`translateZ(${Z.keycap+380}px)`;});
    if(knob){knob.style.transition='none';knob.style.opacity='0';knob.style.transform=`translateZ(${52+300}px)`;}
    rgbGlow.style.opacity='0';
  }

  async function runAssembly(){
    if(assembling)return;
    assembling=true;
    resetToExploded();
    await wait(60);

    // 1. CASE tray settles
    await tween(caseBottom,{transform:`translateZ(${Z.caseBottom}px) translateY(0px)`,opacity:'1'},650,0);
    await wait(120);
    // 2. PCB drops in
    await tween(pcb,{transform:`translateZ(${Z.pcb}px)`,opacity:'1'},650,0);
    await wait(120);
    // 3. FOAM
    await tween(foam,{transform:`translateZ(${Z.foam}px)`,opacity:'1'},650,0);
    await wait(120);
    // 4. PLATE
    await tween(plate,{transform:`translateZ(${Z.plate}px)`,opacity:'1'},650,0);
    await wait(150);

    // 5. Switches left-to-right, one by one
    rgbGlow.style.transition='opacity .6s';rgbGlow.style.opacity='1';
    const swStep = prefersReduced?0:38;
    for(let i=0;i<switchList.length;i++){
      const sw=switchList[i];
      tween(sw,{transform:`translateZ(${Z.switchBase}px)`,opacity:'1'},260,0);
      if(!prefersReduced) await wait(swStep);
    }
    if(knob) tween(knob,{transform:`translateZ(52px)`,opacity:'1'},400,0);
    await wait(200);

    // 6. Keycaps left-to-right, one by one, with tiny sound
    const capStep = prefersReduced?0:46;
    for(let i=0;i<capList.length;i++){
      const cap=capList[i];
      const fz=parseFloat(cap.dataset.finalZ);
      tween(cap,{transform:`translateZ(${fz}px)`,opacity:'1'},280,0);
      if(audioReady && !muted && !prefersReduced && i%2===0){
        // subtle install tick
        try{playSound('letter');}catch(e){}
      }
      if(!prefersReduced) await wait(capStep);
    }
    assembling=false;
  }

  /* ============ CONTROLS ============ */
  const hint=document.getElementById('hint');
  function hideHint(){hint.classList.add('hide');}
  document.getElementById('replayBtn').addEventListener('click',()=>{initAudio();resumeAudio();hideHint();runAssembly();});
  const muteBtn=document.getElementById('muteBtn');
  muteBtn.addEventListener('click',()=>{
    initAudio();
    muted=!muted;
    if(masterGain)masterGain.gain.value=muted?0:0.5;
    muteBtn.textContent=muted?'🔇 Muted':'🔊 Sound On';
    muteBtn.classList.toggle('on',!muted);
  });
  const rgbBtn=document.getElementById('rgbBtn');
  rgbBtn.addEventListener('click',()=>{
    setRGB(!rgbOn);
    rgbBtn.textContent=rgbOn?'✦ RGB On':'✦ RGB Off';
    rgbBtn.classList.toggle('on',rgbOn);
  });
  document.getElementById('hueSlider').addEventListener('input',e=>{rgbHue=+e.target.value;});

  /* First interaction enables audio */
  function firstInteract(){
    initAudio();resumeAudio();hideHint();
    window.removeEventListener('pointerdown',firstInteract);
  }
  window.addEventListener('pointerdown',firstInteract);
  window.addEventListener('keydown',()=>{initAudio();resumeAudio();hideHint();},{once:true});

  document.getElementById('status').textContent='65% LAYOUT · 68 KEYS · GENERATED AUDIO · CSS 3D';

  /* ============ INIT ============ */
  fitScene();
  applyScene();
  requestAnimationFrame(rgbLoop);
  // auto-hide hint after a while
  setTimeout(()=>{ if(!audioReady) {} }, 8000);
  // start assembly on load
  setTimeout(runAssembly, 400);

})();
</script>
</body>
</html>
