<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HALCYON // MTX-9 — Interactive 3D PC</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:"Inter","Segoe UI",Helvetica,Arial,sans-serif;
  background:#05060a;color:#dfe8f2;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}
#app,#app canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#app canvas{outline:none;touch-action:none}
body::before{
  content:"";position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%,transparent 52%,rgba(0,0,0,.5) 100%);
}

/* ---------------- brand ---------------- */
#brand{
  position:fixed;top:24px;left:30px;z-index:5;pointer-events:none;
  text-shadow:0 2px 18px rgba(0,0,0,.9)
}
#brand .logo{display:flex;align-items:center;gap:11px}
#brand .mark{
  width:23px;height:23px;border:1.5px solid #7f9bb5;transform:rotate(45deg);
  position:relative;box-shadow:0 0 14px rgba(120,180,255,.25)
}
#brand .mark::after{content:"";position:absolute;inset:4px;background:#9fdcff;opacity:.85}
#brand h1{font-size:17px;font-weight:700;letter-spacing:9px;color:#f2f8ff}
#brand p{font-size:8.5px;letter-spacing:3.6px;color:#7e96ab;margin-top:7px}

/* ---------------- hint ---------------- */
#hint{
  position:fixed;top:26px;left:50%;transform:translateX(-50%);z-index:5;
  font-size:9px;letter-spacing:2.6px;color:#8ba3b8;white-space:nowrap;
  padding:8px 15px;border-radius:20px;
  background:rgba(11,16,22,.55);border:1px solid rgba(120,150,180,.12);
  backdrop-filter:blur(8px);transition:opacity .8s ease
}

/* ---------------- HUD ---------------- */
#hud{
  position:fixed;bottom:22px;right:22px;width:304px;z-index:6;
  padding:15px 15px 12px;
  border-radius:15px;
  background:linear-gradient(165deg,rgba(14,18,26,.88),rgba(7,10,14,.93));
  border:1px solid rgba(110,145,175,.16);
  box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.04);
  backdrop-filter:blur(18px)
}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.hd .t{font-size:9.5px;letter-spacing:3px;color:#93a6b8}
.hd .s{font-size:8px;letter-spacing:1.6px;color:#61707f;font-variant-numeric:tabular-nums}
.sec-label{font-size:8px;letter-spacing:2.4px;color:#6f8496;margin-bottom:7px}

.pwr{display:flex;align-items:center;gap:12px;margin-bottom:13px}
#power{
  flex:none;width:51px;height:51px;border-radius:50%;cursor:pointer;
  border:1px solid rgba(120,150,180,.28);
  background:radial-gradient(circle at 50% 32%,#20262f,#0a0d12 72%);
  display:grid;place-items:center;position:relative;
  box-shadow:inset 0 2px 6px rgba(255,255,255,.06),0 6px 16px rgba(0,0,0,.6);
  transition:transform .12s,border-color .3s,box-shadow .3s
}
#power:hover{border-color:rgba(150,210,255,.55);box-shadow:inset 0 2px 8px rgba(255,255,255,.1),0 6px 22px rgba(90,170,255,.2)}
#power:active{transform:scale(.94)}
#power svg{width:23px;height:23px;stroke:#8899aa;stroke-width:1.7;fill:none;transition:stroke .3s,filter .3s}
body.powered #power{border-color:rgba(140,220,255,.5)}
body.powered #power svg{stroke:#9fe4ff;filter:drop-shadow(0 0 7px rgba(120,200,255,.9))}
#pwrlabel{flex:1;min-width:0}
#stat{font-size:11.5px;letter-spacing:1.2px;font-weight:700;color:#cfdae5}
#sub{font-size:8px;letter-spacing:1px;color:#6b7d8d;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.bars{display:flex;gap:4px;margin:8px 0 0}
.bars i{flex:1;height:2px;background:#1c2833;border-radius:2px;transition:background .3s,box-shadow .3s}
body.powered .bars i.on{background:#4fb6ff;box-shadow:0 0 8px rgba(80,180,255,.8)}

/* rgb */
#rgbrow{display:flex;align-items:center;gap:9px}
#rgb{display:block;width:41px;height:31px;padding:0;border:none;cursor:pointer;background:none;border-radius:7px;overflow:hidden}
#rgb::-webkit-color-swatch-wrapper{padding:0}
#rgb::-webkit-color-swatch{border:1px solid rgba(255,255,255,.25);border-radius:7px}
#rgb::-moz-color-swatch{border:1px solid rgba(255,255,255,.25);border-radius:7px}
#hexc{
  flex:1;font:11px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:1.4px;
  color:#c4d4e2;background:#0b1017;border:1px solid #1e2b38;border-radius:7px;
  padding:8px 9px;outline:none;min-width:0
}
#hexc:focus{border-color:#3d7ea8}
.sw{display:flex;gap:5px;margin-top:8px}
.sw i{flex:1;height:4px;border-radius:2px;opacity:.75;cursor:pointer;transition:opacity .2s,transform .15s}
.sw i:hover{opacity:1;transform:scaleY(1.7)}
#hue{width:100%;height:4px;border-radius:3px;margin-top:9px;appearance:none;
  background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);cursor:pointer;opacity:.85}
#hue::-webkit-slider-thumb{appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #222;box-shadow:0 0 0 1px #fff}
#hue::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #222}

/* perf */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
.cell{background:#0a0f15;border:1px solid #16212c;border-radius:8px;padding:7px 9px}
.cell .k{display:flex;justify-content:space-between;font-size:8px;letter-spacing:1.1px;color:#6d8193}
.cell .k b{color:#9fb4c6;font-weight:600;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:3px;margin-top:5px;height:3px}
.seg i{flex:1;background:#182430;border-radius:1.5px}
.seg i.on{background:var(--rc,#57c7ff)}
.seg i.on:nth-child(n){box-shadow:0 0 7px var(--rc,#57c7ff)}

/* modes */
.modes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px}
.mode{
  cursor:pointer;padding:8px 4px 7px;border-radius:7px;text-align:center;
  background:#0a0f15;border:1px solid #16212c;transition:border-color .2s,background .2s
}
.mode:hover{background:#101821}
.mode .ic{width:18px;height:18px;margin:0 auto 4px;display:block;opacity:.8}
.mode .lb{font-size:7.5px;letter-spacing:1.4px;color:#7d90a1}
.mode.on{border-color:rgba(120,200,255,.55);background:rgba(40,100,150,.18)}
.mode.on .lb{color:#bfe4ff}
.mode.on .ic{opacity:1;filter:drop-shadow(0 0 5px rgba(110,200,255,.8))}

/* footer */
.hf{display:flex;justify-content:space-between;align-items:center;margin-top:11px}
.hf .l{font-size:7.5px;letter-spacing:1.6px;color:#5d7082}
.hf .r{display:flex;align-items:center;gap:5px}
.hf .dot{width:5px;height:5px;border-radius:50%;background:#2a3a48;transition:.3s}
body.powered .hf .dot{background:#53d68a;box-shadow:0 0 8px #53d68a}

/* ---------------- small screens ---------------- */
@media(max-width:760px){
  #hud{width:266px;right:12px;bottom:12px;padding:12px}
  #brand{top:14px;left:16px}
  #brand h1{font-size:14px;letter-spacing:6px}
  #hint{display:none}
}
@media(max-height:640px){
  #hud{width:276px;bottom:10px;right:10px;padding:11px}
  .grid2{margin-top:9px}
  .modes{margin-top:9px}
}
</style>
</head>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   RENDERER / SCENE
============================================================ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060a);
scene.fog = new THREE.FogExp2(0x04060a, 0.030);

const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.1, 120);
camera.position.set(7.6, 4.5, 9.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.15, 2.55, 0.15);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.enablePan = false;
controls.minDistance = 6.0;
controls.maxDistance = 17.5;
controls.minPolarAngle = 0.30;
controls.maxPolarAngle = Math.PI/2 - 0.035;
controls.rotateSpeed = 0.62;
controls.zoomSpeed = 0.75;
controls.autoRotateSpeed = 0.55;
controls.update();

/* ============================================================
   UTIL
============================================================ */
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
const lerp = (a,b,t)=>a+(b-a)*t;
const V2 = (x,y)=>new THREE.Vector2(x,y);
const V3 = (x,y,z)=>new THREE.Vector3(x,y,z);
const YAXIS = V3(0,1,0);

function roundedRectShape(w,h,r){
  const s = new THREE.Shape();
  s.moveTo(-w/2+r, -h/2);
  s.lineTo(w/2-r, -h/2); s.quadraticCurveTo(w/2,-h/2, w/2,-h/2+r);
  s.lineTo(w/2, h/2-r);  s.quadraticCurveTo(w/2,h/2, w/2-r,h/2);
  s.lineTo(-w/2+r, h/2); s.quadraticCurveTo(-w/2,h/2, -w/2,h/2-r);
  s.lineTo(-w/2, -h/2+r);s.quadraticCurveTo(-w/2,-h/2, -w/2+r,-h/2);
  return s;
}
function roundedBox(w,h,d,r,mat,seg=4){
  r = Math.min(r, w/2-1e-4, h/2-1e-4, d/2-1e-4);
  const shape = roundedRectShape(w,h,r);
  const g = new THREE.ExtrudeGeometry(shape,{depth:Math.max(0.001,d-2*r),bevelEnabled:true,
    bevelThickness:r,bevelSize:r,bevelSegments:seg,curveSegments:seg*2,steps:1});
  g.center();
  const m = new THREE.Mesh(g,mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function box(w,h,d,mat){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.castShadow=true; m.receiveShadow=true; return m; }
function cyl(r1,r2,h,mat,seg=28){ const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg),mat); m.castShadow=true; m.receiveShadow=true; return m; }
function sphere(r,mat,seg=18){ const m=new THREE.Mesh(new THREE.SphereGeometry(r,seg,seg),mat); m.castShadow=true; return m; }

function makeGlowTexture(){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.25,'rgba(255,255,255,.55)');
  g.addColorStop(0.55,'rgba(255,255,255,.14)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const GLOW = makeGlowTexture();

function glowSprite(size, color, opacity=0.7){
  const m=new THREE.Sprite(new THREE.SpriteMaterial({
    map:GLOW, color, transparent:true, opacity,
    blending:THREE.AdditiveBlending, depthWrite:false, depthTest:true
  }));
  m.scale.set(size,size,1); m.renderOrder=6;
  return m;
}

/* canvas texture helper */
function canvasTex(w,h,draw,repeatX=1,repeatY=1){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d'); draw(ctx,w,h);
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(repeatX,repeatY);
  t.anisotropy=4;
  return t;
}

/* ============================================================
   MATERIALS
============================================================ */
const M = {
  frame:   new THREE.MeshStandardMaterial({color:0x23262c, metalness:.95, roughness:.34}),
  frameDk: new THREE.MeshStandardMaterial({color:0x121419, metalness:.92, roughness:.44}),
  panel:   new THREE.MeshPhysicalMaterial({color:0x0c0f14, metalness:.55, roughness:.22,
             clearcoat:1, clearcoatRoughness:.12}),
  glass:   new THREE.MeshPhysicalMaterial({color:0x9fc4e0, metalness:0, roughness:.045,
             transparent:true, opacity:.105, clearcoat:1, clearcoatRoughness:.03,
             side:THREE.DoubleSide, depthWrite:false, transmission:0}),
  black:   new THREE.MeshStandardMaterial({color:0x0b0c10, metalness:.30, roughness:.62}),
  rubber:  new THREE.MeshStandardMaterial({color:0x08090b, metalness:.05, roughness:.92}),
  steel:   new THREE.MeshStandardMaterial({color:0x9aa3ad, metalness:1.0, roughness:.28}),
  copper:  new THREE.MeshStandardMaterial({color:0xb87333, metalness:1.0, roughness:.32}),
  chrome:  new THREE.MeshStandardMaterial({color:0xd7dee6, metalness:1.0, roughness:.12}),
  fanBlade:new THREE.MeshStandardMaterial({color:0x0d0f13, metalness:.55, roughness:.40}),
  fanBlade2:new THREE.MeshStandardMaterial({color:0x1b1f26, metalness:.7, roughness:.32}),
  pcb:     new THREE.MeshStandardMaterial({color:0x0d1a14, metalness:.25, roughness:.68}),
  gpuBody: new THREE.MeshStandardMaterial({color:0x14161b, metalness:.75, roughness:.40}),
  mobo:    new THREE.MeshStandardMaterial({color:0x0a0d11, metalness:.35, roughness:.62}),
  psuBody: new THREE.MeshStandardMaterial({color:0x101217, metalness:.55, roughness:.55}),
  chromeDk:new THREE.MeshStandardMaterial({color:0x2a2f36, metalness:.9, roughness:.35})
};

const ledMats = [];
const ledMeshes = [];
function ledMat(baseIntensity=2.6){
  const m = new THREE.MeshStandardMaterial({
    color:0x0a0b0e, emissive:new THREE.Color(0x35c9ff), emissiveIntensity:0,
    metalness:0, roughness:.45
  });
  m.userData.base = baseIntensity;
  ledMats.push(m);
  return m;
}
const ledMatsStatic = [];
function ledMatStatic(baseIntensity=2.0){
  const m = new THREE.MeshStandardMaterial({
    color:0x08090c, emissive:new THREE.Color(0x35c9ff), emissiveIntensity:0,
    metalness:0, roughness:.5
  });
  m.userData.base = baseIntensity;
  ledMatsStatic.push(m);
  return m;
}

/* cable / tube material created later once scene exists */

/* ============================================================
   ENVIRONMENT
============================================================ */
(function environment(){
  // floor
  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(26,72),
    new THREE.MeshStandardMaterial({color:0x05070a, metalness:.32, roughness:.42})
  );
  floor.rotation.x = -Math.PI/2; floor.receiveShadow = true;
  scene.add(floor);

  // concentric guide rings
  const ringMat = new THREE.MeshBasicMaterial({color:0x1a2b3a, transparent:true, opacity:.55});
  for(const r of [3.4, 4.9, 6.9]){
    const ring = new THREE.Mesh(new THREE.RingGeometry(r, r+0.012, 96), ringMat);
    ring.rotation.x = -Math.PI/2; ring.position.y = 0.004; scene.add(ring);
  }
  // radial ticks
  const tickMat = new THREE.MeshBasicMaterial({color:0x16222e, transparent:true, opacity:.7});
  for(let i=0;i<72;i++){
    const a = i/72*Math.PI*2;
    const t = new THREE.Mesh(new THREE.PlaneGeometry(0.012, i%6===0?0.20:0.09), tickMat);
    t.rotation.x = -Math.PI/2; t.rotation.z = -a;
    t.position.set(Math.sin(a)*6.9, 0.005, Math.cos(a)*6.9);
    scene.add(t);
  }

  // contact shadow blob
  const tex = canvasTex(256,256,(x,w,h)=>{
    const g=x.createRadialGradient(w/2,h/2,4,w/2,h/2,w/2);
    g.addColorStop(0,'rgba(0,0,0,.85)');
    g.addColorStop(.45,'rgba(0,0,0,.38)');
    g.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=g;x.fillRect(0,0,w,h);
  });
  const blob = new THREE.Mesh(new THREE.PlaneGeometry(7.6,6.4),
    new THREE.MeshBasicMaterial({map:tex, transparent:true, depthWrite:false}));
  blob.rotation.x=-Math.PI/2; blob.position.y=0.006; scene.add(blob);

  // dust particles
  const N=380, pos=new Float32Array(N*3), sizes=new Float32Array(N);
  for(let i=0;i<N;i++){
    const r = 4 + Math.random()*15;
    const a = Math.random()*Math.PI*2;
    pos[i*3]   = Math.cos(a)*r;
    pos[i*3+1] = Math.random()*10.5;
    pos[i*3+2] = Math.sin(a)*r;
    sizes[i] = Math.random();
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const pmat = new THREE.PointsMaterial({
    size:.035, map:GLOW, color:0x6f9dc0, transparent:true, opacity:.45,
    blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true
  });
  const pts = new THREE.Points(g,pmat); pts.name='dust'; scene.add(pts);
  window.__dust = pts;
})();

/* ============================================================
   LIGHTING RIG
============================================================ */
const hemi = new THREE.HemisphereLight(0x5d7893, 0x05070a, .42);
scene.add(hemi);
scene.add(new THREE.AmbientLight(0x33445a, .20));

const key = new THREE.DirectionalLight(0xdfe9f7, 1.55);
key.position.set(5.5, 9.5, 6.5);
key.castShadow = true;

/* ---- FANS ------------------------------------------------------ */
function makeFan(radius, depth, isTop=false){
  const g = new THREE.Group();
  const frameMat = M.frameDk;
  // frame (square with rounded corners)
  const fr = roundedBox(radius*2+0.10, radius*2+0.10, depth, 0.035, frameMat);
  g.add(fr);
  // aperture
  const ap = new THREE.Mesh(new THREE.CircleGeometry(radius*0.96, 40), M.black);
  ap.position.z = depth/2 - 0.002; g.add(ap);
  const apb = ap.clone(); apb.position.z = -depth/2 + 0.002; apb.rotation.y = Math.PI; g.add(apb);

  // hub + blades
  const hubG = new THREE.Group();
  const hub = cyl(radius*0.30, radius*0.30, depth*0.60, M.chromeDk, 26);
  hub.rotation.x = Math.PI/2; hubG.add(hub);
  const hubcap = cyl(radius*0.13, radius*0.15, depth*0.72, M.steel, 22);
  hubcap.rotation.x = Math.PI/2; hubG.add(hubcap);

  const bladeCount = 9;
  for(let i=0;i<bladeCount;i++){
    const a = i/bladeCount*Math.PI*2;
    const shape = new THREE.Shape();
    const r0 = radius*0.30, r1 = radius*0.95;
    shape.moveTo(0, -r0);
    shape.quadraticCurveTo(radius*0.55, -r0*1.4, radius*0.62, -r1*0.55);
    shape.quadraticCurveTo(radius*0.70, -r1*1.05, radius*0.34, -r1*1.02);
    shape.quadraticCurveTo(radius*0.16, -r1*0.86, radius*0.05, -r0*1.10);
    shape.lineTo(0,-r0);
    const bg = new THREE.ExtrudeGeometry(shape,{depth:depth*0.30,bevelEnabled:true,bevelSize:0.006,
      bevelThickness:0.006,bevelSegments:1,curveSegments:8});
    bg.center();
    const blade = new THREE.Mesh(bg, M.fanBlade);
    // place blade: rotate around Z then tilt
    const pivot = new THREE.Group();
    pivot.rotation.z = a;
    const tilt = new THREE.Group();
    tilt.position.set(0, -radius*0.56, 0);
    tilt.rotation.y = 0.42;
    tilt.rotation.x = 0.22;
    tilt.add(blade);
    pivot.add(tilt);
    // push outward
    blade.position.set(0, 0, 0);
    hubG.add(pivot);
  }
  // LED ring on frame
  const ringMat = ledMat(3.4);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(radius*0.985, 0.020, 10, 52), ringMat);
  ring.position.z = depth/2 + 0.004; g.add(ring);
  const ring2 = new THREE.Mesh(new THREE.TorusGeometry(radius*0.985, 0.014, 8, 52), ringMat);
  ring2.position.z = -depth/2 - 0.004; g.add(ring2);
  // ring glow plane behind blades
  const gp = new THREE.Mesh(new THREE.PlaneGeometry(radius*1.97, radius*1.97),
    new THREE.MeshBasicMaterial({map:GLOW, color:0x35c9ff, transparent:true, opacity:0,
      blending:THREE.AdditiveBlending, depthWrite:false}));
  gp.position.z = depth/2 + 0.012; g.add(gp);

  const aura = glowSprite(radius*3.6, 0x35c9ff, 0);
  aura.position.z = depth/2 + 0.05; g.add(aura);

  g.add(hubG);
  g.userData.hub = hubG;
  g.userData.led = ringMat;
  g.userData.glow = gp;
  g.userData.aura = aura;
  g.userData.radius = radius;
  g.userData.spin = 0;
  partRegistry.fans.push(g);
  return g;
}

  const c = new THREE.Color(hex);
  if(!isFinite(c.r)||!isFinite(c.g)||!isFinite(c.b)) return;
  S.rgb.r=c.r; S.rgb.g=c.g; S.rgb.b=c.b;
  BASE_HEX.copy(c);
  const hsl={}; c.getHSL(hsl);
  S.hue = hsl.h*360;
  if(!fromHex){ hexInput.value = '#'+c.getHexString().toUpperCase(); rgbInput.value = '#'+c.getHexString(); }
  hueInput.value = S.hue;
  updateAccent();
}

const clock = new THREE.Clock();

function easeOutCubic(t){ return 1-Math.pow(1-t,3); }

function updateFans(dt){
  // powered state ramp
  const target = S.power ? 1 : 0;
  S.powerLevel += (target - S.powerLevel) * Math.min(1, dt*2.2);
  const lvl = S.powerLevel;

  const fanTarget = S.fanBoost ? 3.4 : 1.0;
  S.fanSpeed = lerp(S.fanSpeed, fanTarget, Math.min(1, dt*1.6));

  for(const f of partRegistry.fans){
    const boost = f.userData.isGpu ? (S.gpu/100)*1.1 : 0;
    const spd = (f.userData.baseSpeed||1) * (S.fanSpeed + boost) * lvl;
    f.userData.spin += dt * spd * 7.2;
    const hub = f.userData.hub;
    hub.rotation.z = -f.userData.spin;
    // led ring intensity
    const lm = f.userData.led;
    lm.userData.base = 3.4;
  }
}

function updateLEDs(t){
  const lvl = S.powerLevel;
  const hueBase = S.hue/360;

  // compute per-material colors
  for(let i=0;i<ledMats.length;i++){
    const m = ledMats[i];
    const base = m.userData.base || 2.2;
    let intensity = base;
    let col = tmpColor;
    if(S.mode===0){
      // rainbow wave — phase by index
      const h = (hueBase + i*0.035 + t*0.055) % 1;
      col.setHSL(h, 0.85, 0.55);
    } else if(S.mode===1){
      col.setRGB(S.rgb.r,S.rgb.g,S.rgb.b);
      intensity *= 1.05;
    } else {
      const pulse = 0.35 + 0.65*(0.5+0.5*Math.sin(t*1.35 - i*0.06));
      intensity *= pulse;
      col.setRGB(S.rgb.r,S.rgb.g,S.rgb.b);
    }
    m.emissive.copy(col);
    m.emissiveIntensity = intensity * lvl;
  }
  for(const m of ledMatsStatic){
    m.emissive.setRGB(S.rgb.r,S.rgb.g,S.rgb.b);
    m.emissiveIntensity = 1.35 * lvl;
  }

  // fan glows + auras
  for(const f of partRegistry.fans){
    const gp = f.userData.glow;
    const lm = f.userData.led;
    let col = tmpColor2;
    if(S.mode===0){
      col.setHSL((hueBase + (f.position.y*0.05) + t*0.09)%1, .9,.55);
    } else col.setRGB(S.rgb.r,S.rgb.g,S.rgb.b);
    lm.emissive.copy(col);
    gp.material.color.copy(col);
    gp.material.opacity = 0.16*lvl*(S.mode===2? (0.5+0.5*Math.sin(t*1.35)):1);
    if(f.userData.aura){
      f.userData.aura.material.color.copy(col);
      f.userData.aura.material.opacity = 0.11*lvl;
    }
  }
  for(const a of partRegistry.auras){
    const c = S.mode===0 ? tmpColor2.setHSL((hueBase+t*0.05)%1,.9,.55) : tmpColor2.setRGB(S.rgb.r,S.rgb.g,S.rgb.b);
    a.material.color.copy(c);
    const flick = 0.88 + 0.12*Math.sin(t*2.1);
    a.material.opacity = (a===undefined?0:0.14)*lvl*flick*(S.mode===2?(0.45+0.55*Math.abs(Math.sin(t*1.35))):1);
  }

  // practical lights follow the accent
  let cA, cB;
  if(S.mode===0){
    cA = tmpColor.setHSL((hueBase + t*0.06)%1,.9,.55);
    cB = tmpColor2.setHSL((hueBase + 0.45 + t*0.06)%1,.9,.55);
  } else { cA = tmpColor.setRGB(S.rgb.r,S.rgb.g,S.rgb.b); cB = tmpColor2.copy(tmpColor); }
  const flick = 0.92 + 0.08*Math.sin(t*3.1) + 0.02*Math.sin(t*7.3);
  pLightA.color.copy(cA); pLightA.intensity = 2.4*lvl*flick;
  pLightB.color.copy(cB); pLightB.intensity = 1.9*lvl*flick;
  underGlow.color.copy(cA); underGlow.intensity = Math.max(underGlow.intensity, 3.0*lvl*0.9);
  pLightC.intensity = 1.5*lvl;

  // screen backlight handled in draw
  renderer.toneMappingExposure = 1.05;
}

function updatePerf(dt){
  const lvl = S.powerLevel;
  if(lvl > 0.05){
    const targetCpu = (S.fanBoost? 12 : 34) + Math.sin(S.time*0.7)*7 + Math.sin(S.time*2.3)*3;
    const targetGpu = (S.fanBoost? 22 : 58) + Math.sin(S.time*0.45+1.2)*10 + Math.sin(S.time*1.9)*4;
    S.cpu = lerp(S.cpu, clamp(targetCpu,8,96), Math.min(1,dt*1.5));
    S.gpu = lerp(S.gpu, clamp(targetGpu,10,99), Math.min(1,dt*1.2));
    const targetTemp = 34 + S.cpu*0.42 + (S.fanBoost? -6: 3) + Math.sin(S.time*0.3)*1.2;
    S.temp = lerp(S.temp, clamp(targetTemp,32,78), Math.min(1,dt*0.8));
    S.rpm = lerp(S.rpm, (S.fanBoost? 1580: 980) + S.cpu*2.6 + Math.sin(S.time*1.4)*14, Math.min(1,dt*1.5));
  } else {
    S.cpu = lerp(S.cpu, 0, Math.min(1,dt*3));
    S.gpu = lerp(S.gpu, 0, Math.min(1,dt*3));
    S.temp = lerp(S.temp, 26, Math.min(1,dt*0.7));
    S.rpm = lerp(S.rpm, 0, Math.min(1,dt*2.5));
  }
  cpuEl.textContent = lvl>0.08 ? Math.round(S.cpu)+'%' : '0%';
  gpuEl.textContent = lvl>0.08 ? Math.round(S.gpu)+'%' : '0%';
  ctEl.textContent = lvl>0.08 ? Math.round(S.temp)+'°C' : '--';
  rpmEl.textContent = Math.round(S.rpm).toLocaleString();

  const rc = '#'+BASE_HEX.getHexString();
  paintSeg(segEls.cpu, S.cpu/100, rc);
  paintSeg(segEls.gpu, S.gpu/100, rc);
  const tempV = clamp((S.temp-30)/55,0,1);
  paintSeg(segEls.ct, tempV, tempV>0.7 ? '#ff6b5a' : (tempV>0.45 ? '#ffbe55' : rc));
  paintSeg(segEls.rpm, clamp(S.rpm/1800,0,1), rc);
}

function updateBoot(dt){
  if(!S.booting) return;
  S.bootT += dt;
  for(const e of S.events){
    if(!e.done && S.bootT >= e.t){ e.done = true; e.f(); }
  }
  // boot bar progress
  const bars=[...$('bootbars').children];
  const p = clamp(S.bootT/3.0,0,1);
  bars.forEach((b,i)=> b.classList.toggle('on', i < Math.round(p*12)));
}

function updateScreen(t){
  if(S.screenState==='off' && S.powerLevel<0.03){
    // still draw occasionally
  }
  screen.draw(S.screenState, Math.round(S.cpu), Math.round(S.temp), Math.round(S.rpm), Math.round(fpsAvg), t);
  screen.tex.needsUpdate = true;
}

/* ============================================================
   MAIN LOOP
============================================================ */
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  S.time += dt;

  // boot / power
  updateBoot(dt);
  updateFans(dt);
  updateLEDs(S.time);
  updatePerf(dt);

  // dust
  const dust = window.__dust;
  if(dust){
    dust.rotation.y += dt*0.012;
    const pos = dust.geometry.attributes.position;
    for(let i=0;i<pos.count;i++){
      let y = pos.getY(i) + dt*0.10*(0.4+ (i%7)/10);
      if(y>11) y = 0;
      pos.setY(i,y);
    }
    pos.needsUpdate = true;
    dust.material.opacity = 0.16 + 0.20*S.powerLevel;
    dust.material.color.setHSL((S.hue/360 + S.time*0.02)%1, .55,.62);
  }

  // camera transition to hero view at boot (subtle dolly)
  if(S.booting && S.bootT<3.0 && !controls.autoRotate){
    // tiny push-in is handled by controls, no forced movement (avoid nausea)
  }

  // screen update at 8 fps
  scrTimer += dt;
  if(scrTimer > 0.13){ scrTimer = 0; updateScreen(S.time); }

  // fps
  frames++; fpsTimer += dt;
  if(fpsTimer >= 0.5){
    fpsAvg = frames/fpsTimer; frames=0; fpsTimer=0;
    fpsEl.textContent = Math.round(clamp(fpsAvg, 1, 240));
  }

  controls.update();
  composer.render();
}

/* ============================================================
   POST PROCESSING
============================================================ */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.72, 0.72, 0.62);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ============================================================
   RESIZE
============================================================ */
addEventListener('resize', ()=>{
  const w = innerWidth, h = innerHeight;
  camera.aspect = w/h; camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(w,h);
  composer.setSize(w,h);
  // adapt HUD scale for small view
  const hud = document.getElementById('hud');
  if(w < 620) hud.style.transform = 'scale(.92)'; else hud.style.transform = '';
});

/* ============================================================
   GO
============================================================ */
animate();
</script>
