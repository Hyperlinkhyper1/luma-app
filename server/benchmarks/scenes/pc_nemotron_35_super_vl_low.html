<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetheris Nova — Interactive 3D PC Build</title>
<style>
:root {
  --accent: #00ff88;
  --panel-bg: rgba(14, 14, 22, 0.72);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden; background: #040408;
  font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #e8eaf2;
}
#canvas {
  position: absolute; inset: 0; z-index: 1; display: block;
}
#hud {
  position: absolute; right: 24px; bottom: 24px; width: 310px; z-index: 100;
  pointer-events: auto; display: flex; flex-direction: column; gap: 10px;
}
.panel {
  background: var(--panel-bg);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.07);
  border-radius: 16px;
  padding: 18px;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55);
}
.panel h2 {
  font-size: 12px; text-transform: uppercase; letter-spacing: 2.5px;
  color: #8a8ea0; margin-bottom: 14px; padding-bottom: 8px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}
.row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.row.display { flex-direction: row; justify-content: space-between; align-items: center; }
.row label { font-size: 11.5px; color: #a9aec4; white-space: nowrap; }
button {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.10);
  color: #e8eaf2; padding: 10px 14px; border-radius: 10px;
  font-size: 13px; cursor: pointer; transition: all 0.18s;
  text-align: left; outline: none;
}
button:hover { background: rgba(255, 255, 255, 0.10); border-color: rgba(255, 255, 255, 0.25); }
button:active { transform: translateY(1px); }
.power-btn { display: flex; align-items: center; gap: 10px; font-weight: 800;
  font-size: 15px; text-transform: uppercase; letter-spacing: 1px; text-align: left;
}
.power-btn span:nth-child(2) { display: block; }
.power-btn.off { color: #ff6b6b; border-color: rgba(255, 107, 107, 0.35); }
.power-btn.off:hover { background: rgba(255, 107, 107, 0.12); border-color: #ff6b6b; }
.power-btn.on { color: #4ade80; border-color: rgba(74, 222, 128, 0.35);
  box-shadow: 0 0 24px rgba(74, 222, 128, 0.18); }
.power-btn.on:hover { background: rgba(74, 222, 128, 0.12); border-color: #4ade80; }
input[type="color"] {
  width: 100%; height: 32px; border: none; border-radius: 10px; background: none;
  cursor: pointer; overflow: hidden;
}
input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
input[type="color"]::-webkit-color-swatch { border: none; border-radius: 10px; }
input[type="range"] {
  width: 100%; height: 6px; border-radius: 3px; background: #22262e;
  appearance: none; outline: none; cursor: pointer; accent-color: var(--accent);
}
input[type="range"]::-webkit-slider-thumb {
  appearance: none; width: 16px; height: 16px; background: #ffffff;
  border-radius: 50%; cursor: pointer; border: 1px solid rgba(255,255,255,0.4);
}
select {
  width: 100%; background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.10); color: #e8eaf2;
  padding: 8px 10px; border-radius: 10px; font-size: 13px; outline: none; cursor: pointer;
}
select:hover { border-color: rgba(255, 255, 255, 0.25); }
.stats {
  margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.05);
  font-size: 11.5px; color: #8a8ea0; line-height: 1.75;
}
.stats b { color: #e8eaf2; font-variant-numeric: tabular-nums; }
.hint {
  position: absolute; left: 24px; bottom: 24px; color: #6b7086; font-size: 12px;
  pointer-events: none; z-index: 100;
}
.hint kbd {
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14);
  border-radius: 5px; padding: 0 6px; color: #c8ccd8; font-family: monospace;
  font-size: 11px; margin: 0 2px;
}
</style>
</head>
<body>
<div id="canvas"></div>

<div id="hud">
  <div class="panel">
    <h2>Aetheris Nova</h2>
    <div class="row">
      <button id="btnPower" class="power-btn off">
        <span>⏻</span>
        <span>POWER ON</span>
      </button>
    </div>
    <div class="row display">
      <label>RGB Color</label>
      <input type="color" id="rgbPicker" value="#00ff88">
    </div>
    <div class="row display">
      <label>Brightness</label>
      <input type="range" id="rgbBrightness" min="0" max="1" step="0.05" value="1">
    </div>
    <div class="row display">
      <label>Lighting Mode</label>
      <select id="rgbMode">
        <option value="static">Static</option>
        <option value="breathing">Breathing</option>
        <option value="spectrum">Spectrum</option>
      </select>
    </div>
    <div class="row display">
      <label>Fan Curve</label>
      <select id="fanSpeed">
        <option value="0.4">Silent</option>
        <option value="1.0" selected>Performance</option>
        <option value="1.7">Max</option>
      </select>
    </div>
    <div class="row display">
      <label>Side Panel</label>
      <button id="btnPanel">Close Panel</button>
    </div>
    <div class="stats">
      <div id="statPower">Status: <b>OFF</b></div>
      <div id="statCpu">CPU: <b>--°C</b></div>
      <div id="statGpu">GPU: <b>--°C</b></div>
      <div id="statUptime">Uptime: <b>--:--:--</b></div>
      <div id="statFps">FPS: <b>--</b></div>
    </div>
  </div>
</div>

<div class="hint">Orbit: <kbd>Left Drag</kbd> • Zoom: <kbd>Scroll</kbd> • Pan: <kbd>Right Drag</kbd></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Core setup ----------
const container = document.getElementById('canvas');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050509, 0.035);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 60);
camera.position.set(4.6, 2.4, 4.2);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.rotateSpeed = 0.7;
controls.minDistance = 2.2;
controls.maxDistance = 14;
controls.target.set(0, 0, 0);

// ---------- Materials ----------
const matCase = new THREE.MeshStandardMaterial({ color: 0x15171e, roughness: 0.45, metalness: 0.9 });
const matCaseDark = new THREE.MeshStandardMaterial({ color: 0x0c0d11, roughness: 0.5, metalness: 0.95 });
const matGlass = new THREE.MeshStandardMaterial({ color: 0xaad4ff, transparent: true, opacity: 0.17, roughness: 0.04, metalness: 0 });
const matPCB = new THREE.MeshStandardMaterial({ color: 0x0a140a, roughness: 0.85, metalness: 0.04 });
const matPCB2 = new THREE.MeshStandardMaterial({ color: 0x060a06, roughness: 0.9, metalness: 0.02 });
const matMetal = new THREE.MeshStandardMaterial({ color: 0x2c343e, roughness: 0.35, metalness: 0.9 });
const matMetalDark = new THREE.MeshStandardMaterial({ color: 0x161a20, roughness: 0.4, metalness: 0.9 });
const matMetalBright = new THREE.MeshStandardMaterial({ color: 0x9aa5b2, roughness: 0.25, metalness: 0.95 });
const matPlastic = new THREE.MeshStandardMaterial({ color: 0x111319, roughness: 0.55, metalness: 0.12 });
const matFanFrame = new THREE.MeshStandardMaterial({ color: 0x0f0f13, roughness: 0.45, metalness: 0.6 });
const matFanBlade = new THREE.MeshStandardMaterial({ color: 0x08080b, roughness: 0.5, metalness: 0.55 });
const matRGB = new THREE.MeshStandardMaterial({ color: 0x00ff88, emissive: 0x00ff88, emissiveIntensity: 1, roughness: 0.1, metalness: 0 });
const matRGBSoft = new THREE.MeshStandardMaterial({ color: 0x00ff88, emissive: 0x00ff88, emissiveIntensity: 0.55, roughness: 0.1, metalness: 0 });
const matTube = new THREE.MeshStandardMaterial({ color: 0x090909, roughness: 0.85, metalness: 0.04 });
const matScreen = new THREE.MeshBasicMaterial({ color: 0x001a10 });

// ---------- Helpers ----------
function box(w, h, d, mat, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, cast = true, rec = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  m.castShadow = cast;
  m.receiveShadow = rec;
  return m;
}

function createFan(radius = 0.22) {
  const group = new THREE.Group();
  const frame = new THREE.Mesh(new THREE.RingGeometry(radius * 0.82, radius, 32), matFanFrame);
  group.add(frame);

  const rotor = new THREE.Group();
  const inner = new THREE.Mesh(new THREE.RingGeometry(0, radius * 0.82, 32), matFanBlade);
  rotor.add(inner);
  const hub = box(radius * 0.3, radius * 0.3, 0.05, matFanFrame, 0, 0, 0);
  rotor.add(hub);
  const blades = 9;
  for (let i = 0; i < blades; i++) {
    const a = (i / blades) * Math.PI * 2;
    const b = box(radius * 0.88, 0.035, 0.04, matFanBlade, Math.cos(a) * radius * 0.36, Math.sin(a) * radius * 0.36, 0);
    b.rotation.z = a;
    rotor.add(b);
  }
  const rgbRing = new THREE.Mesh(new THREE.RingGeometry(radius * 0.91, radius * 0.97, 32), matRGB);
  rotor.add(rgbRing);
  group.add(rotor);
  return { group, rotor };
}

function addCable(points, radius = 0.025, mat = matTube) {
  const curve = new THREE.CatmullRomCurve3(points);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 45, radius, 6, false), mat);
  tube.castShadow = true;
  tube.receiveShadow = true;
  return tube;
}

// ---------- Scene groups ----------
const caseGroup = new THREE.Group();
const internals = new THREE.Group();
scene.add(caseGroup);
scene.add(internals);

// ---------- Case ----------
// shell
caseGroup.add(box(2.2, 0.14, 1.8, matCaseDark, 0, -1.96, 0)); // bottom
caseGroup.add(box(2.2, 0.14, 1.8, matCase, 0, 1.96, 0)); // top
caseGroup.add(box(0.12, 3.72, 1.6, matCase, -1.08, 0, 0)); // left
const rightFrame = box(0.12, 3.72, 1.6, matCaseDark, 1.08, 0, 0);
caseGroup.add(rightFrame);
const glassPanel = box(0.05, 3.5, 1.45, matGlass, 1.055, 0, 0);
caseGroup.add(glassPanel);
caseGroup.add(box(2.2, 3.72, 0.1, matCaseDark, 0, 0, -0.855)); // front

// front mesh slats
for (let i = -2; i <= 2; i++) {
  const slat = box(0.04, 3.0, 0.09, matCase, i * 0.55, 0, -0.848);
  slat.material = new THREE.MeshStandardMaterial({ color: 0x15171e, transparent: true, opacity: 0.45, roughness: 0.6, metalness: 0.8 });
  caseGroup.add(slat);
}

// front RGB strip
const frontStrip = box(1.8, 0.07, 0.1, matRGB, 0, -1.55, -0.848);
caseGroup.add(frontStrip);

// front IO
caseGroup.add(box(0.45, 0.09, 0.04, matMetalBright, -0.55, -1.25, -0.848));
const pwrLed = box(0.09, 0.09, 0.03, matRGBSoft, -0.58, -1.25, -0.848);
caseGroup.add(pwrLed);

// case power button on top edge
const caseBtn = box(0.14, 0.02, 0.07, matRGBSoft, -0.45, 1.76, -0.845);
caseGroup.add(caseBtn);

// feet
for (const [x, z] of [[-0.9, -0.7], [0.9, -0.7], [-0.9, 0.7], [0.9, 0.7]]) {
  caseGroup.add(box(0.17, 0.12, 0.17, matCaseDark, x, -2.01, z));
}

// ---------- Motherboard ----------
const mobo = box(0.09, 2.9, 1.7, matPCB, 0.865, 0, 0);
mobo.receiveShadow = true;
internals.add(mobo);

// motherboard LED dots
for (let i = 0; i < 6; i++) {
  internals.add(box(0.02, 0.02, 0.012, matRGBSoft, 0.875, -1.1 + i * 0.46, 0.6));
}

// traces
for (let i = 0; i < 12; i++) {
  internals.add(box(0.012, 0.05, 0.018, matRGBSoft, 0.865, -1.45 + i * 0.26, (Math.random() * 1.4) - 0.7));
}

// ---------- RAM ----------
function addRAM(y, z) {
  const g = new THREE.Group();
  g.add(box(0.52, 0.1, 0.04, matPCB2, 0.56, y, z));
  g.add(box(0.52, 0.05, 0.048, matGlass, 0.56, y + 0.075, z));
  g.add(box(0.52, 0.016, 0.055, matRGB, 0.56, y + 0.106, z));
  internals.add(g);
}
addRAM(1.28, -0.52);
addRAM(0.78, 0.48);

// ---------- AIO Liquid Cooling ----------
const cpuBlock = box(0.4, 0.2, 0.4, matMetal, 0.68, 0.3, -0.05);
cpuBlock.castShadow = true;
cpuBlock.receiveShadow = true;
internals.add(cpuBlock);
internals.add(box(0.26, 0.05, 0.26, matRGB, 0.68, 0.41, -0.05)); // pump head

const res = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.45, 20), matMetal);
res.position.set(0.32, -1.48, -0.34);
res.rotation.z = 0.22;
res.castShadow = true;
internals.add(res);
internals.add(box(0.17, 0.04, 0.17, matRGB, 0.32, -1.265, -0.34)); // reservoir cap glow

// tubes pump -> radiator
internals.add(addCable([
  new THREE.Vector3(0.68, 0.4, -0.05),
  new THREE.Vector3(0.55, 0.95, -0.22),
  new THREE.Vector3(0.42, 1.78, -0.32)
]));
internals.add(addCable([
  new THREE.Vector3(0.68, 0.4, 0.05),
  new THREE.Vector3(0.5, 0.6, 0.26),
  new THREE.Vector3(0.42, 1.78, 0.32)
]));

// radiator + top fans
const rad = box(1.3, 0.14, 1.1, matMetalDark, 0.44, 1.88, 0);
rad.castShadow = true; rad.receiveShadow = true;
internals.add(rad);
for (let zz = -0.45; zz <= 0.45; zz += 0.11) {
  internals.add(box(1.28, 0.016, 0.05, matMetal, 0.44, 1.945, zz));
}

// ---------- GPU (vertical mount) ----------
const gpuGroup = new THREE.Group();
gpuGroup.add(box(0.1, 1.05, 1.18, matPlastic, 0.59, -0.85, 0)); // shroud
gpuGroup.add(box(0.04, 1.05, 1.22, matMetalDark, 0.63, -0.85, 0)); // backplate
const gpuStrip = box(0.1, 0.05, 1.1, matRGB, 0.59, -0.27, 0);
gpuGroup.add(gpuStrip);
internals.add(gpuGroup);

for (let i = -1; i <= 1; i++) {
  const fan = createFan(0.2);
  fan.group.position.set(0.565, -0.85 + i * 0.48, 0);
  fan.group.rotation.y = Math.PI / 2; // face +X (out through glass)
  gpuGroup.add(fan.group);
}

// ---------- Fans ----------
const fans = [];

function addFanObj(x, y, z, rx = 0, ry = 0, rz = 0, name = 'fan', mult = 1) {
  const f = createFan(0.24);
  f.group.position.set(x, y, z);
  f.group.rotation.set(rx, ry, rz);
  internals.add(f.group);
  fans.push({ rotor: f.rotor, current: 0, target: 0, mult, name });
}

// front intake (visible through mesh)
for (let i = -1; i <= 1; i++) {
  addFanObj(i * 0.6, -1.0, -0.62, 0, 0, 0, `front${i}`, 0.95);
}
// top exhaust
for (let zz = -0.38; zz <= 0.38; zz += 0.76) {
  addFanObj(0.44, 1.82, zz, -Math.PI / 2, 0, 0, `top${zz}`, 1.0);
}
// GPU fans already added manually; track them
for (let i = -1; i <= 1; i++) {
  fans.push({ rotor: null, current: 0, target: 0, mult: 1.2, name: `gpu${i} ` });
}
// rear/side exhaust
const rear = createFan(0.22);
rear.group.position.set(0.9, 0, 0.55);
rear.group.rotation.y = Math.PI / 2;
internals.add(rear.group);
fans.push({ rotor: rear.rotor, current: 0, target: 0, mult: 0.8, name: 'rear' });
// PSU fan
const psu = createFan(0.18);
psu.group.position.set(-0.15, -1.82, 0.6);
psu.group.rotation.y = Math.PI / 2;
internals.add(psu.group);
fans.push({ rotor: psu.rotor, current: 0, target: 0, mult: 0.7, name: 'psu' });

// GPU rotors (collect from gpuGroup children roughly)
const gpuRotors = [];
gpuGroup.traverse((c) => { if (c.isMesh && c.geometry.type === 'RingGeometry' && c.parent && c.parent.parent === gpuGroup) {} });
// Simpler: we stored fan groups inline above; collect rotors from group children
const tmpFans = [];
gpuGroup.traverse((c) => {
  if (c.isMesh && c.material === matFanBlade && c.parent) {
    tmpFans.push(c.parent);
  }
});

// ---------- PSU shroud ----------
internals.add(box(1.5, 1.25, 1.45, matCaseDark, -0.15, -1.3, 0));
internals.add(addCable([
  new THREE.Vector3(-0.15, -1.55, 0.32),
  new THREE.Vector3(0.25, -0.15, 0.28),
  new THREE.Vector3(0.87, 0.85, 0.05)
]));

// M.2 SSD
internals.add(box(0.05, 0.06, 0.6, matPCB2, 0.74, 0.42, 0.12));
internals.add(box(0.05, 0.06, 0.6, matMetal, 0.74, 0.452, 0.12));

// ---------- Floor ----------
const floor = new THREE.Mesh(new THREE.PlaneGeometry(24, 24), new THREE.MeshStandardMaterial({ color: 0x09090d, roughness: 0.8, metalness: 0.15 }));
floor.rotation.x = -Math.PI / 2;
floor.position.y = -2.04;
floor.receiveShadow = true;
scene.add(floor);

// ---------- Lighting ----------
const hemi = new THREE.HemisphereLight(0x1a1a2e, 0x050508, 0.5);
scene.add(hemi);

const dir = new THREE.DirectionalLight(0xffffff, 1.1);
dir.position.set(5, 9, 4);
dir.castShadow = true;
dir.shadow.camera.left = -3; dir.shadow.camera.right = 3;
dir.shadow.camera.top = 3; dir.shadow.camera.bottom = -3;
dir.shadow.camera.near = 0.5; dir.shadow.camera.far = 14;
dir.shadow.mapSize.width = 1024; dir.shadow.mapSize.height = 1024;
scene.add(dir);

const rgbFill = new THREE.PointLight(0x00ff88, 0, 12);
rgbFill.position.set(0, 0, 0);
scene.add(rgbFill);

// ---------- Pump bubbles ----------
const bubbleCount = 64;
const bubblePos = new Float32Array(bubbleCount * 3);
const bubbleVel = new Float32Array(bubbleCount);
for (let i = 0; i < bubbleCount; i++) {
  bubblePos[i * 3] = 0.32 + (Math.random() - 0.5) * 0.08;
  bubblePos[i * 3 + 1] = -1.26 + Math.random() * 0.5;
  bubblePos[i * 3 + 2] = -0.34 + (Math.random() - 0.5) * 0.08;
  bubbleVel[i] = 0.12 + Math.random() * 0.18;
}
const bubbleGeo = new THREE.BufferGeometry();
bubbleGeo.setAttribute('position', new THREE.BufferAttribute(bubblePos, 3));
const bubbleMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.022, transparent: true, opacity: 0.5, sizeAttenuation: true });
const bubbles = new THREE.Points(bubbleGeo, bubbleMat);
internals.add(bubbles);

// ---------- State ----------
const state = {
  power: false,
  color: new THREE.Color('#00ff88'),
  brightness: 1,
  mode: 'static',
  fanSpeed: 1,
  panelOpen: false,
  startTime: null,
  offTime: null
};

const els = {
  btnPower: document.getElementById('btnPower'),
  rgbPicker: document.getElementById('rgbPicker'),
  rgbBrightness: document.getElementById('rgbBrightness'),
  rgbMode: document.getElementById('rgbMode'),
  fanSpeed: document.getElementById('fanSpeed'),
  btnPanel: document.getElementById('btnPanel'),
  statPower: document.getElementById('statPower'),
  statCpu: document.getElementById('statCpu'),
  statGpu: document.getElementById('statGpu'),
  statUptime: document.getElementById('statUptime'),
  statFps: document.getElementById('statFps')
};

function setPowerUI() {
  if (state.power) {
    els.btnPower.classList.remove('off');
    els.btnPower.classList.add('on');
    els.btnPower.querySelectorAll('span')[1].textContent = 'POWER OFF';
    els.statPower.innerHTML = 'Status: <b>ONLINE</b>';
    document.documentElement.style.setProperty('--accent', state.color.getStyle());
  } else {
    els.btnPower.classList.remove('on');
    els.btnPower.classList.add('off');
    els.btnPower.querySelectorAll('span')[1].textContent = 'POWER ON';
    els.statPower.innerHTML = 'Status: <b>OFF</b>';
  }
}
setPowerUI();

function applyRGB(intensity) {
  const c = state.color;
  matRGB.emissive.copy(c);
  matRGB.emissiveIntensity = intensity;
  matRGBSoft.emissive.copy(c);
  matRGBSoft.emissiveIntensity = intensity * 0.6;
  matRGBSoft.color.copy(c).multiplyScalar(intensity * 0.4);
  bubbleMat.color.copy(c);
  pwrLed.material.emissive.copy(c);
  pwrLed.material.emissiveIntensity = intensity * 0.9;
  caseBtn.material.emissive.copy(c);
  caseBtn.material.emissiveIntensity = intensity * 0.9;
  rgbFill.color.copy(c);
  rgbFill.intensity = state.power ? 1.8 * intensity : 0;
}

// ---------- HUD wiring ----------
els.btnPower.addEventListener('click', () => {
  state.power = !state.power;
  if (state.power) state.startTime = performance.now() * 0.001;
  else state.offTime = performance.now() * 0.001;
  setPowerUI();
});
els.rgbPicker.addEventListener('input', (e) => {
  state.color.setHex(parseInt(e.target.value.slice(1), 16));
  document.documentElement.style.setProperty('--accent', state.color.getStyle());
});
els.rgbBrightness.addEventListener('input', (e) => { state.brightness = parseFloat(e.target.value); });
els.rgbMode.addEventListener('change', (e) => { state.mode = e.target.value; });
els.fanSpeed.addEventListener('change', (e) => { state.fanSpeed = parseFloat(e.target.value); });
els.btnPanel.addEventListener('click', () => {
  state.panelOpen = !state.panelOpen;
  els.btnPanel.textContent = state.panelOpen ? 'Open Panel' : 'Close Panel';
});

// ---------- Stats / FPS ----------
let frames = 0, lastFps = 0, lastStat = 0;
function updateStats(t) {
  const cpu = 38 + 5 * Math.sin(t * 0.7) + 3 * Math.sin(t * 2.1) + (state.power ? state.fanSpeed * 1.5 : 0);
  const gpu = 52 + 7 * Math.sin(t * 0.9) + 4 * Math.sin(t * 1.4) + (state.power ? state.fanSpeed * 2 : 0);
  els.statCpu.innerHTML = `CPU: <b>${cpu.toFixed(0)}°C</b>`;
  els.statGpu.innerHTML = `GPU: <b>${gpu.toFixed(0)}°C</b>`;
  if (state.power && state.startTime) {
    const sec = Math.floor(t - state.startTime);
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    els.statUptime.innerHTML = `Uptime: <b>${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}</b>`;
  } else {
    els.statUptime.innerHTML = 'Uptime: <b>--:--:--</b>';
  }
}
function updateFPS(t) {
  frames++;
  if (t - lastFps >= 1) {
    els.statFps.innerHTML = `FPS: <b>${frames}</b>`;
    frames = 0;
    lastFps = t;
  }
}

// ---------- Animation loop ----------
let last = performance.now();
function animate() {
  const now = performance.now();
  const t = now * 0.001;
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.1) dt = 0.1;

  controls.update();

  // power timing
  if (state.power) {
    if (!state.startTime) state.startTime = t;
    state.offTime = null;
  } else {
    if (!state.offTime) state.offTime = t;
    state.startTime = null;
  }
  const e = state.startTime !== null ? t - state.startTime : 0;
  const offE = state.offTime !== null ? t - state.offTime : 0;

  // lighting intensity
  let intensity = state.brightness;
  if (state.power) {
    const fade = Math.min(Math.max((e - 1.6) / 1.1, 0), 1);
    let modeMult = 1;
    if (state.mode === 'breathing') modeMult = 0.45 + 0.55 * Math.abs(Math.sin(t * 2.5));
    else if (state.mode === 'spectrum') state.color.setHSL((t * 0.07) % 1, 0.85, 0.55);
    intensity = state.brightness * fade * modeMult;
  } else {
    intensity = state.brightness * Math.max(0, 1 - offE / 0.8);
  }
  applyRGB(intensity);

  // fans startup sequence
  const base = state.power ? state.fanSpeed : 0;
  for (const f of fans) {
    let mult = 1;
    if (f.name.startsWith('psu')) mult = e > 0.15 ? 1 : 0;
    else if (f.name.startsWith('rear')) mult = e > 0.45 ? 1 : 0;
    else if (f.name.startsWith('front')) {
      const n = parseFloat(f.name.slice(5));
      mult = e > 0.75 + n * 0.32 ? 1 : 0;
    } else if (f.name.startsWith('top') || f.name.startsWith('gpu')) mult = e > 1.5 ? 1 : 0;
    if (!state.power) mult = 0;
    f.target = base * mult;
    f.current += (f.target - f.current) * dt * 7;
    if (f.rotor) f.rotor.rotation.z += f.current * dt;
  }
  // GPU rotors (spun manually since we pushed placeholders earlier)
  // GPU fans were added to gpuGroup; their rotors are in tmpFans but we need target by index:
  const gpuFanList = [];
  gpuGroup.traverse((c) => {
    if (c.isMesh && c.material === matFanBlade && c.parent) {
      gpuFanList.push(c.parent);
    }
  });
  const gpuTarget = state.power ? base * 1.2 * (e > 1.5 ? 1 : 0) : 0;
  gpuFanList.forEach((rotor) => {
    // find or create current speed storage on rotor userData
    if (!rotor.userData.cur) rotor.userData.cur = 0;
    rotor.userData.cur += (gpuTarget - rotor.userData.cur) * dt * 7;
    rotor.rotation.z += rotor.userData.cur * dt;
  });

  // bubbles
  if (state.power && e > 2.8) {
    const pos = bubbles.geometry.attributes.position.array;
    for (let i = 0; i < bubbleCount; i++) {
      pos[i * 3 + 1] += bubbleVel[i] * dt;
      if (pos[i * 3 + 1] > 2.1) {
        pos[i * 3 + 1] = -1.25;
        pos[i * 3] = 0.32 + (Math.random() - 0.5) * 0.08;
        pos[i * 3 + 2] = -0.34 + (Math.random() - 0.5) * 0.08;
      }
    }
    bubbles.geometry.attributes.position.needsUpdate = true;
    bubbles.visible = true;
  } else {
    bubbles.visible = false;
  }

  // side panel slide
  const panelTarget = state.panelOpen ? 1.85 : 1.055;
  glassPanel.position.x += (panelTarget - glassPanel.position.x) * dt * 5;

  // subtle camera drift when powered
  controls.autoRotate = state.power;
  controls.autoRotateSpeed = 0.6;

  if (t - lastStat > 0.2) { updateStats(t); lastStat = t; }
  updateFPS(t);

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

// ---------- Resize ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

requestAnimationFrame(animate);
</script>
</body>
</html>
