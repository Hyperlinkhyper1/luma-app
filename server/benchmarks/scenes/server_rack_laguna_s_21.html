  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">

    let scene, camera, renderer, controls;

    let airflowEnabled = false, powerEnabled = false, dataEnabled = false;
    let exploded = false, cutaway = false, coverOpen = false;

    let health = {};
    let componentHighlights = [];

    initScene();

    function initScene() {
      // Scene setup
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0a12);
      scene.fog = new THREE.FogExp2(0x0a0a12, 0.00002);

      const width = window.innerWidth;
      const height = window.innerHeight;

      camera = new THREE.PerspectiveCamera(45, width / height, 1, 20000);
      camera.position.set(0, 1250, -3100);
      camera.lookAt(0, 900, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setPixelRatio(window.devicePixelRatio > 1.5 ? 1.5 : window.devicePixelRatio);
      renderer.setSize(width, height);
      renderer.setAnimationLoop(animate);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowMap;
      document.getElementById('canvasContainer').appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 1.8;
      controls.target.set(0, 900, 0);
      controls.minDistance = 300;
      controls.maxDistance = 9000;

      // Lighting
      const hemi = new THREE.HemisphereLight(0xaaaaaa, 0x333344, 1.8);
      scene.add(hemi);

      const dirLight = new THREE.DirectionalLight(0xffffff, 3.0);
      dirLight.position.set(5, 15, 10);
      dirLight.castShadow = true;
      dirLight.shadow.camera.left = -100;
      dirLight.shadow.camera.right = 100;
      dirLight.shadow.camera.top = 100;
      dirLight.shadow.camera.bottom = -100;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      scene.add(dirLight);

      const fillLight = new THREE.DirectionalLight(0x6677aa, 0.3);
      fillLight.position.set(-10, 5, -10);
      scene.add(fillLight);

      // Rack group
      rackGroup = new THREE.Group();
      scene.add(rackGroup);

      // Slice group
      sliceGroup = new THREE.Group();
      sliceGroup.visible = false;
      scene.add(sliceGroup);

      // Resize handler
      window.addEventListener('resize', onWindowResize);

      // Mouse events
      renderer.domElement.addEventListener('pointermove', onPointerMove);
      renderer.domElement.addEventListener('pointerdown', onPointerDown);

      // UI
      setupUI();

      // Generate servers
      generateServers();
      buildRack();
      buildRackServers();
      buildSlice();
      updateServerList();
      updateStatsDisplay();
      simulateHealth();
    }

    function onWindowResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    function buildRack() {
      const U = 44.45; // mm per rack unit
      const rackWidth = 600;
      const rackDepth = 1000;
      const rackHeight = 42 * U;

      const frameMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, metalness: 0.6, roughness: 0.4 });
      const railMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.7, roughness: 0.3 });
      const panelMat = new THREE.MeshStandardMaterial({ color: 0x0f0f12, metalness: 0.3, roughness: 0.7 });
      const doorMat = new THREE.MeshStandardMaterial({ color: 0x1e1e22, metalness: 0.2, roughness: 0.8, transparent: true, opacity: 0.7 });

      // Structural frame (4 vertical posts)
      const postGeo = new THREE.BoxGeometry(40, rackHeight, 40);
      const frontLeft = new THREE.Mesh(postGeo, frameMat);
      frontLeft.position.set(-rackWidth/2 + 20, rackHeight/2, -rackDepth/2 + 20);
      frontLeft.castShadow = true; frontLeft.receiveShadow = true;
      rackGroup.add(frontLeft);

      const frontRight = new THREE.Mesh(postGeo, frameMat);
      frontRight.position.set(rackWidth/2 - 20, rackHeight/2, -rackDepth/2 + 20);
      rackGroup.add(frontRight);

      const rearLeft = new THREE.Mesh(postGeo, frameMat);
      rearLeft.position.set(-rackWidth/2 + 20, rackHeight/2, rackDepth/2 - 20);
      rackGroup.add(rearLeft);

      const rearRight = new THREE.Mesh(postGeo, frameMat);
      rearRight.position.set(rackWidth/2 - 20, rackHeight/2, rackDepth/2 - 20);
      rackGroup.add(rearRight);

      // Horizontal top/bottom rails
      const hRailGeo = new THREE.BoxGeometry(rackWidth - 40, 40, 40);
      const topRail = new THREE.Mesh(hRailGeo, frameMat);
      topRail.position.set(0, rackHeight - 20, 0);
      rackGroup.add(topRail);

      const bottomRail = new THREE.Mesh(hRailGeo, frameMat);
      bottomRail.position.set(0, 20, 0);
      rackGroup.add(bottomRail);

      // Rear horizontal rails (for PDU mounting)
      const rearTopRail = new THREE.Mesh(hRailGeo, frameMat);
      rearTopRail.position.set(0, rackHeight - 20, rackDepth - 40);
      rackGroup.add(rearTopRail);

      const rearBottomRail = new THREE.Mesh(hRailGeo, frameMat);
      rearBottomRail.position.set(0, 20, rackDepth - 40);
      rackGroup.add(rearBottomRail);

      // Vertical mounting rails (front)
      const vRailGeo = new THREE.BoxGeometry(10, rackHeight, 10);
      const frontVLeft = new THREE.Mesh(vRailGeo, railMat);
      frontVLeft.position.set(-rackWidth/2 + 60, rackHeight/2, -rackDepth/2 + 30);
      rackGroup.add(frontVLeft);

      const frontVRight = new THREE.Mesh(vRailGeo, railMat);
      frontVRight.position.set(rackWidth/2 - 60, rackHeight/2, -rackDepth/2 + 30);
      rackGroup.add(frontVRight);

      // Mounting holes on front rails
      const holeGeo = new THREE.CylinderGeometry(3, 3, 6, 16);
      const holeMat = new THREE.MeshStandardMaterial({ color: 0x111 });
      for (let u = 1; u <= 42; u++) {
        const y = rackHeight - (u * U) + U/2;
        const leftHole = new THREE.Mesh(holeGeo, holeMat);
        leftHole.position.set(-rackWidth/2 + 75, y, -rackDepth/2 + 30);
        leftHole.rotation.y = Math.PI/2;
        rackGroup.add(leftHole);
        const rightHole = new THREE.Mesh(holeGeo, holeMat);
        rightHole.position.set(rackWidth/2 - 75, y, -rackDepth/2 + 30);
        rightHole.rotation.y = Math.PI/2;
        rackGroup.add(rightHole);
      }

      // Rack unit labels (simple text placeholders handled via sprites or skipped for perf)
      // Instead, add small cylinders as visual markers every 1U
      const markerGeo = new THREE.SphereGeometry(2, 8, 8);
      const markerMat = new THREE.MeshStandardMaterial({ color: 0x444 });
      for (let u = 1; u <= 42; u++) {
        const y = rackHeight - (u * U) + U/2;
        const m = new THREE.Mesh(markerGeo, markerMat);
        m.position.set(-rackWidth/2 + 50, y, -rackDepth/2 + 30);
        rackGroup.add(m);
      }

      // Rear door (semi-transparent)
      const doorGeo = new THREE.BoxGeometry(rackWidth - 20, rackHeight - 60, 15);
      const rearDoorL = new THREE.Mesh(doorGeo, doorMat);
      rearDoorL.position.set(-rackWidth/4, rackHeight/2, rackDepth/2 - 10);
      rearDoorL.receiveShadow = true;
      rackGroup.add(rearDoorL);

      const rearDoorR = new THREE.Mesh(doorGeo, doorMat);
      rearDoorR.position.set(rackWidth/4, rackHeight/2, rackDepth/2 - 10);
      rackGroup.add(rearDoorR);

      // Side panels
      const sideGeo = new THREE.BoxGeometry(10, rackHeight - 60, rackDepth - 20);
      const sideL = new THREE.Mesh(sideGeo, panelMat);
      sideL.position.set(-rackWidth/2 - 5, rackHeight/2, 0);
      rackGroup.add(sideL);
      const sideR = new THREE.Mesh(sideGeo, panelMat);
      sideR.position.set(rackWidth/2 + 5, rackHeight/2, 0);
      rackGroup.add(sideR);

      // Feet/casters
      const footGeo = new THREE.CylinderGeometry(15, 15, 10, 16);
      const footMat = new THREE.MeshStandardMaterial({ color: 0x111 });
      const footPositions = [
        [-rackWidth/2 + 60, 10, -rackDepth/2 + 60],
        [rackWidth/2 - 60, 10, -rackDepth/2 + 60],
        [-rackWidth/2 + 60, 10, rackDepth/2 - 60],
        [rackWidth/2 - 60, 10, rackDepth/2 - 60]
      ];
      footPositions.forEach(pos => {
        const foot = new THREE.Mesh(footGeo, footMat);
        foot.position.set(...pos);
        rackGroup.add(foot);
      });

      // Vertical PDUs (rear)
      const pduGeo = new THREE.BoxGeometry(20, rackHeight - 100, 10);
      const pduMat = new THREE.MeshStandardMaterial({ color: 0x0066cc });
      const pduA = new THREE.Mesh(pduGeo, pduMat);
      pduA.position.set(-rackWidth/2 + 30, rackHeight/2, rackDepth - 30);
      pduA.userData = { type: "pdu", side: "A" };
      rackGroup.add(pduA);

      const pduB = new THREE.Mesh(pduGeo, pduMat);
      pduB.position.set(rackWidth/2 - 30, rackHeight/2, rackDepth - 30);
      pduB.userData = { type: "pdu", side: "B" };
      rackGroup.add(pduB);

      // Rear cable management bars
      const cableBarGeo = new THREE.CylinderGeometry(5, 5, rackWidth - 40, 12);
      const cableMat = new THREE.MeshStandardMaterial({ color: 0x333 });
      const cableAM = new THREE.Mesh(cableBarGeo, cableMat);
      cableAM.position.set(0, rackHeight/2 - 100, rackDepth - 25);
      cableAM.rotation.z = Math.PI/2;
      rackGroup.add(cableAM);

      const cableBM = new THREE.Mesh(cableBarGeo, cableMat);
      cableBM.position.set(0, rackHeight/2 - 300, rackDepth - 25);
      cableBM.rotation.z = Math.PI/2;
      rackGroup.add(cableBM);

      // Top frame crossbars
      for (let i = 0; i < 3; i++) {
        const crossGeo = new THREE.BoxGeometry(20, rackHeight - 80, 10);
        const cross = new THREE.Mesh(crossGeo, frameMat);
        cross.position.set(0, rackHeight/2, -rackDepth/2 + 50 + i * (rackDepth/3));
        rackGroup.add(cross);
      }
    }

    function labelTexture(text, color) {
      const c = document.createElement('canvas'); c.width = 512; c.height = 64;
      const x = c.getContext('2d');
      x.fillStyle = color; x.fillRect(0, 0, 512, 64);
      x.fillStyle = 'rgba(0,0,0,0.35)'; x.fillRect(0, 0, 512, 6); x.fillRect(0, 58, 512, 6);
      x.fillStyle = '#f2f6fa'; x.font = 'bold 26px sans-serif'; x.textBaseline = 'middle'; x.fillText(text, 20, 32);
      for (let i = 0; i < 6; i++) { x.fillStyle = i % 2 ? '#3dff7a' : '#ffb347'; x.fillRect(380 + i * 18, 24, 8, 8); }
      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
    }
    function buildRackServers() {
      const U = 44.45, rackDepth = 1000;
      const colors = { gpu: '#1f4d3a', virtualization: '#2b3f6b', general: '#3a3f47', storage: '#5a3b2a', network: '#4a2f5a', database: '#2f4f5f' };
      servers.forEach((srv, idx) => {
        const h = srv.uHeight * U - 4, depth = 700;
        const y = (srv.positionU - srv.uHeight) * U + (srv.uHeight * U) / 2;
        const color = colors[srv.archetype] || '#3a3f47';
        const body = new THREE.Mesh(new THREE.BoxGeometry(440, h, depth), new THREE.MeshStandardMaterial({ color, metalness: 0.5, roughness: 0.45 }));
        body.position.set(0, y, -rackDepth / 2 + 55 + depth / 2);
        body.castShadow = true; body.receiveShadow = true;
        body.userData.serverIndex = idx;
        const face = new THREE.Mesh(new THREE.PlaneGeometry(440, h), new THREE.MeshBasicMaterial({ map: labelTexture(srv.name + '  ' + srv.uHeight + 'U', color) }));
        face.rotation.y = Math.PI;
        face.position.set(0, y, -rackDepth / 2 + 55 - 0.5);
        face.userData.serverIndex = idx;
        rackGroup.add(body, face);
        rackServerMeshes.push(body, face);
      });
    }

    function buildSlice() {
      appliedCut = null;
      // Clear previous slice
      while(sliceGroup.children.length > 0) sliceGroup.remove(sliceGroup.children[0]);
      
      sliceGroup.visible = false;
      const server = servers[selectedServerIndex];
      const slice = createServerArchetype(server.archetype, server);

      slice.userData.server = server;
      slice.userData.isSelected = true;
      sliceGroup.add(slice);

      // Position server centered
      slice.position.set(0, 5, 0);
      slice.rotation.set(-Math.PI/12, 0, 0);

      // Add base platter
      const baseGeo = new THREE.CylinderGeometry(180, 180, 15, 32);
      const baseMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.8, roughness: 0.3 });
      const base = new THREE.Mesh(baseGeo, baseMat);
      base.position.set(0, -10, 0);
      base.receiveShadow = true;
      slice.add(base);

      buildComponentSelection(slice);
      updateComponentInfoDisplay(null);
    }

    function createServerArchetype(archetype, serverData) {
      const group = new THREE.Group();
      group.userData.components = [];

      // Chassis base
      const uHeightMM = serverData.uHeight * 44.45;
      const chassisW = 480;
      const chassisD = 800;
      const chassisH = uHeightMM;

      const chassisGeo = new THREE.BoxGeometry(chassisW, chassisH, chassisD);
      // The chassis is a see-through shell so the parts inside can be inspected; opening the cover fades it out.
      const chassisMat = new THREE.MeshStandardMaterial({ color: 0x9fb4c8, metalness: 0.3, roughness: 0.4, transparent: true, opacity: 0.35, depthWrite: false });
      const chassis = new THREE.Mesh(chassisGeo, chassisMat);
      chassis.userData.shell = true;
      group.add(chassis);
      const outline = new THREE.LineSegments(new THREE.EdgesGeometry(chassisGeo), new THREE.LineBasicMaterial({ color: 0x6fa8dc }));
      outline.userData.shell = true;
      group.add(outline);

      // PCB base: a thin board under the components
      const pcbGeo = new THREE.BoxGeometry(chassisW - 20, 4, chassisD - 20);
      const pcbMat = new THREE.MeshStandardMaterial({ color: 0x0b6a35, metalness: 0.1, roughness: 0.7 });
      const pcb = new THREE.Mesh(pcbGeo, pcbMat);
      pcb.position.y = -38;
      pcb.userData.board = true;
      pcb.receiveShadow = true;
      group.add(pcb);

      switch(archetype) {
        case 'general': buildGeneralCompute(group, chassisW, chassisD, chassisH); break;
        case 'virtualization': buildVirtualization(group, chassisW, chassisD, chassisH); break;
        case 'gpu': buildGpuServer(group, chassisW, chassisD, chassisH); break;
        case 'storage': buildStorageServer(group, chassisW, chassisD, chassisH); break;
        case 'database': buildDatabaseServer(group, chassisW, chassisD, chassisH); break;
        case 'network': buildNetworkAppliance(group, chassisW, chassisD, chassisH); break;
      }

      return group;
    }

    function buildGeneralCompute(group, w, d, h) {
      const pcbMat = new THREE.MeshStandardMaterial({ color: 0x005522 });

      // CPU sockets (dual)
      const cpuGeo = new THREE.BoxGeometry(40, 10, 40);
      const cpuMat = new THREE.MeshStandardMaterial({ color: 0x222, metalness: 0.9 });
      for(let i=0;i<2;i++){
        const cpu = new THREE.Mesh(cpuGeo, cpuMat);
        cpu.position.set(i===0? -60 : 60, 0, 0);
        cpu.userData = { type:"cpu", label:`CPU ${i+1}`, power:280, role:"General processing" };
        group.add(cpu);
        group.userData.components.push(cpu);

        // Heatsinks
        const hsGeo = new THREE.BoxGeometry(50, 10, 50);
        const hsMat = new THREE.MeshStandardMaterial({ color: 0xaaa, metalness: 0.9, roughness: 0.2 });
        const hs = new THREE.Mesh(hsGeo, hsMat);
        hs.position.set(cpu.position.x, 15, cpu.position.z);
        group.add(hs);

        // VRMs

    function updateHealthMonitor() {

      controls.update();

    function animateCameraToSlice() {

    function resetSliceState() {
      exploded = false;
      cutaway = false;
      coverOpen = false;
      failureSim = { fan:false, psu:false, drive:false, gpu:false, net:false };
      document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      document.getElementById('btnCover').textContent = 'OPEN COVER';
      document.getElementById('btnCutaway').textContent = 'CUTAWAY';
      document.getElementById('btnExplode').textContent = 'EXPLODE';
      document.querySelectorAll('.healthFill').forEach(f=>f.className='healthFill');
      animateSlice();
    }

    function animateSlice() {
      // The cover, explode and cutaway states are eased every frame in updateSliceState().
    }

    function updateSliceState(delta) {
      explodeAmt += ((exploded ? 1 : 0) - explodeAmt) * Math.min(1, delta * 4);
      coverAmt += ((coverOpen ? 1 : 0) - coverAmt) * Math.min(1, delta * 5);
      renderer.localClippingEnabled = true;
      sliceGroup.traverse(o => {
        if(o.userData.shell) {
          if(o.material.opacity !== undefined && o.isMesh) o.material.opacity = 0.35 - 0.31 * coverAmt;
          o.visible = !cutaway;
        } else if(o.isMesh && !o.userData.board) {
          if(!o.userData.base) o.userData.base = o.position.clone();
          const b = o.userData.base;
          o.position.set(b.x * (1 + 0.45 * explodeAmt), b.y + (b.y * 2.2 + 55) * explodeAmt, b.z * (1 + 0.25 * explodeAmt));
        }
        if(o.isMesh && (appliedCut !== cutaway)) {
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          mats.forEach(m => { m.clippingPlanes = cutaway ? [cutPlane] : []; m.clipShadows = true; m.needsUpdate = true; });
        }
      });
      appliedCut = cutaway;
    }

    function createAirflowLines() {
      removeOverlayLines();
      const material = new THREE.LineBasicMaterial({ color: 0x00ccff, transparent: true, opacity: 0.5 });
      const points = [];
      for(let x=-200; x<=200; x+=50) {
        points.push(new THREE.Vector3(x, 0, -300));
        points.push(new THREE.Vector3(x, 20, -150));
        points.push(new THREE.Vector3(x, 20, 150));
        points.push(new THREE.Vector3(x, 0, 300));
      }
      const geo = new THREE.BufferGeometry().setFromPoints(points);
      const line = new THREE.LineSegments(geo, material);
      airflowLines.push(line);
      sliceGroup.add(line);
    }

    function createPowerLines() {
      removeOverlayLines();
      const material = new THREE.LineBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.6 });
      const points = [];
      // PSU -> Motherboard -> CPU -> RAM
      const psuPos = new THREE.Vector3(0, -50, -350);
      points.push(psuPos.clone()); points.push(psuPos.clone().setY(-10));
      points.push(new THREE.Vector3(-80, 0, 0)); points.push(new THREE.Vector3(-80, 0, 0).setY(10));
      points.push(new THREE.Vector3(-80, 0, 0).setZ(-20));
      points.push(new THREE.Vector3(-100, -20, 0).setY(10));
      points.push(new THREE.Vector3(-140, -30, 0).setY(10));

      const psuPos2 = new THREE.Vector3(0, -50, -350);
      points.push(psuPos2.clone()); points.push(psuPos2.clone().setY(-10));
      points.push(new THREE.Vector3(80, 0, 0)); points.push(new THREE.Vector3(80, 0, 0).setY(10));
      points.push(new THREE.Vector3(80, 0, 0).setZ(-20));
      points.push(new THREE.Vector3(100, -20, 0).setY(10));
      points.push(new THREE.Vector3(140, -30, 0).setY(10));

      const geo = new THREE.BufferGeometry().setFromPoints(points);
      const line = new THREE.LineSegments(geo, material);
      powerLines.push(line);
      sliceGroup.add(line);
    }

    function createDataLines() {
      removeOverlayLines();
      const material = new THREE.LineBasicMaterial({ color: 0x00ff88, transparent: true, opacity: 0.6 });
      const points = [];
      // Drive -> Backplane -> CPU -> RAM
      points.push(new THREE.Vector3(0, 100, 360)); // backplane
      points.push(new THREE.Vector3(0, 100, 200));
      points.push(new THREE.Vector3(0, 0, 100));
      points.push(new THREE.Vector3(-140, -30, 0));

      // CPU -> GPU
      points.push(new THREE.Vector3(-100, 0, 0));
      points.push(new THREE.Vector3(-100, 0, 200));

      points.push(new THREE.Vector3(100, 0, 200));
      points.push(new THREE.Vector3(100, 0, 0));

      const geo = new THREE.BufferGeometry().setFromPoints(points);
      const line = new THREE.LineSegments(geo, material);
      dataLines.push(line);
      sliceGroup.add(line);
    }

    function removeOverlayLines() {
      [...airflowLines, ...powerLines, ...dataLines].forEach(l => sliceGroup.remove(l));
      airflowLines.length = 0; powerLines.length = 0; dataLines.length = 0;
    }

    function toggleFailures() {
      const btn = document.getElementById('btnFailures');
      btn.classList.toggle('active');
      if(btn.classList.contains('active')) {
        // Toggle through failure types
        const keys = Object.keys(failureSim);
        let anyActive = keys.some(k => failureSim[k]);
        if(!anyActive) {
          simulationStep = 0;
          runFailureSimulation();
        } else {
          failureSim = { fan:false, psu:false, drive:false, gpu:false, net:false };
        }
      } else {
        failureSim = { fan:false, psu:false, drive:false, gpu:false, net:false };
      }
      simulateHealth();
      if(currentMode==='slice') buildSlice();
    }

    let simulationStep = 0;

    function runFailureSimulation() {
      const seq = ['fan','drive','psu','gpu','net'];
      if(simulationStep < seq.length) {
        failureSim[seq[simulationStep]] = true;
        simulationStep++;
        setTimeout(runFailureSimulation, 2000);
      } else {
        setTimeout(() => {
          failureSim = { fan:false, psu:false, drive:false, gpu:false, net:false };
        }, 3000);
      }
    }

    function resetAll() {
      resetSliceState();
      switchMode('rack');
    }

    function onPointerMove(event) {
      if(currentMode !== 'slice') return;
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(sliceGroup.children, true);
      if(hoveredObject) {
        hoveredObject.material.emissive?.setHex(0x000000);
        hoveredObject = null;
      }
      if(intersects.length > 0) {
        const obj = intersects[0].object;
        if(obj.userData.type) {
          hoveredObject = obj;
          if(obj.material.emissive) obj.material.emissive.setHex(0x333333);
        }
      }
    }

    function onPointerDown(event) {
      if(currentMode === 'rack') {
        const r = renderer.domElement.getBoundingClientRect();
        mouse.x = ((event.clientX - r.left) / r.width) * 2 - 1;
        mouse.y = -((event.clientY - r.top) / r.height) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const hit = raycaster.intersectObjects(rackServerMeshes, false)[0];
        if(hit) selectServer(hit.object.userData.serverIndex);
        return;
      }
      if(currentMode !== 'slice') return;
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(sliceGroup.children, true);
      if(intersects.length > 0) {
        const obj = intersects[0].object;
        if(obj.userData.type) {
          updateComponentInfoDisplay(obj.userData);
        }
      }
    }

    function updateComponentInfoDisplay(data) {
      const el = document.getElementById('componentInfo');
      if(!data) {
        el.textContent = "Hover over components in slice view.";
        return;
      }
      let html = `<div class="metric"><span>Type:</span><span>${data.type}</span></div>`;
      if(data.label) html += `<div class="metric"><span>Label:</span><span>${data.label}</span></div>`;
      if(data.role) html += `<div class="metric"><span>Role:</span><span>${data.role}</span></div>`;
      if(data.power) html += `<div class="metric"><span>Power:</span><span>${data.power} W</span></div>`;
      if(data.capacity) html += `<div class="metric"><span>Capacity:</span><span>${data.capacity} GB</span></div>`;
      if(data.channel) html += `<div class="metric"><span>Channel:</span><span>${data.channel}</span></div>`;
      if(data.output) html += `<div class="metric"><span>Output:</span><span>${data.output} W</span></div>`;
      if(data.feed) html += `<div class="metric"><span>PDU Feed:</span><span>${data.feed}</span></div>`;
      if(data.status) html += `<div class="metric"><span>Status:</span><span>${data.status}</span></div>`;
      if(data.bay) html += `<div class="metric"><span>Bay:</span><span>${data.bay}</span></div>`;
      el.innerHTML = html;
    }

    function updateStatsDisplay() {
      const el = document.getElementById('stats');
      el.textContent = `FPS: ${stats.fps} | Draw Calls: ${stats.drawCalls} | Triangles: ${stats.triangles}`;
    }

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.1);
      const elapsed = clock.elapsedTime;

      // Animate rotating GPUs slightly (if slice)
      if(currentMode === 'slice' && sliceGroup.children.length > 0) {
        sliceGroup.traverse(child => {
          if(child.userData.type === 'gpu') {
            child.rotation.y = Math.sin(elapsed * 2) * 0.02;
          }
        });
      }

      controls.update();
      if(currentMode === 'slice') updateSliceState(delta);

      // Update stats every half second
      fpsFrames++; fpsClock += delta;
      if(fpsClock >= 0.5) { stats.fps = Math.round(fpsFrames / fpsClock); fpsFrames = 0; fpsClock = 0; updateStatsDisplay(); }
      if(Math.floor(elapsed * 2) % 2 === 0) {
        // Placeholder stats - real would come from renderer.info
        stats.drawCalls = renderer.info.render.calls;
        stats.triangles = renderer.info.render.triangles;
      }

      // Simulate slow health fluctuation
      const sec = Math.floor(elapsed) % 5;
      if(sec === 0) {
        simulateHealth();
        if(currentMode === 'slice') updateHealthMonitor();
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
