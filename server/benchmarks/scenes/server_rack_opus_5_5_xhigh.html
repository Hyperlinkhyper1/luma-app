<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rack 42U · Slice Inspector</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#0a0d11; --panel:rgba(13,17,22,.88); --panel2:rgba(20,26,33,.92);
  --line:#232c36; --line2:#33404d; --tx:#d5dce3; --mut:#7b8794; --dim:#56616c;
  --acc:#62c6ff; --acc2:#8fe07a; --warn:#ffb547; --hot:#ff6b3d; --sel:#ffd166;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--tx);
  font:12px/1.4 "Segoe UI",system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
#vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 52%,rgba(0,0,0,.42) 100%)}
.mono{font-family:"Cascadia Mono","Cascadia Code",Consolas,"SFMono-Regular",Menlo,monospace}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;
  box-shadow:0 8px 30px rgba(0,0,0,.35);backdrop-filter:blur(6px)}
.k{color:var(--mut);font-size:10px;letter-spacing:.12em;text-transform:uppercase}

/* header */
#top{position:fixed;left:14px;top:12px;display:flex;align-items:center;gap:12px;pointer-events:none}
#top .brand{display:flex;flex-direction:column}
#top .brand b{font-size:13px;letter-spacing:.16em}
#top .brand span{color:var(--mut);font-size:10.5px;letter-spacing:.08em}
#mode{padding:4px 9px;border:1px solid var(--line2);border-radius:4px;font-size:10.5px;letter-spacing:.16em;
  color:var(--acc);background:rgba(98,198,255,.07)}

/* rack elevation */
#elev{position:fixed;left:14px;top:62px;width:206px;padding:10px 10px 8px;max-height:calc(100% - 136px);overflow:hidden}
#elev h3{margin:0 0 7px;font-size:10px;letter-spacing:.16em;color:var(--mut);font-weight:600;display:flex;justify-content:space-between}
#elevList{position:relative;border-left:1px solid var(--line2);border-right:1px solid var(--line2)}
.ru{position:absolute;left:0;right:0;display:flex;align-items:center;gap:6px;padding:0 6px 0 4px;
  border-bottom:1px solid rgba(255,255,255,.035);font-size:9.5px;letter-spacing:.04em;white-space:nowrap;overflow:hidden}
.ru .u{width:24px;color:var(--dim);font-size:9px;text-align:right;flex:none}
.ru .n{overflow:hidden;text-overflow:ellipsis}
.ru.srv{background:linear-gradient(90deg,rgba(98,198,255,.12),rgba(98,198,255,.04));cursor:pointer;color:#cfe9ff}
.ru.net{background:rgba(143,224,122,.07);color:#cfe8c6}
.ru.pow{background:rgba(255,181,71,.07);color:#f0dcc0}
.ru.blank{color:#4d5761}
.ru.open{color:#7b5148;background:repeating-linear-gradient(135deg,transparent 0 4px,rgba(255,107,61,.06) 4px 8px)}
.ru.hov{outline:1px solid var(--acc);outline-offset:-1px;background:rgba(98,198,255,.22)}
.ru.cur{outline:1px solid var(--sel);outline-offset:-1px;background:rgba(255,209,102,.18);color:#fff3cf}
#elevFoot{margin-top:7px;color:var(--mut);font-size:10px;display:flex;justify-content:space-between}

/* toggles */
#toggles{position:fixed;right:14px;top:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 300px)}
.tg{padding:6px 10px;border:1px solid var(--line2);border-radius:4px;background:var(--panel);font-size:10.5px;letter-spacing:.12em;color:var(--mut);transition:all .15s}
.tg:hover{color:var(--tx);border-color:#4a5967}
.tg.on{color:#08131b;background:var(--acc);border-color:var(--acc)}
.tg.on.air{background:linear-gradient(90deg,#3b8cff,#ff8a3d);border-color:#ff8a3d;color:#fff}

/* presets */
#presets{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 28px)}
.pr{padding:6px 10px;border-radius:4px;font-size:10.5px;letter-spacing:.12em;color:var(--mut);white-space:nowrap}
.pr:hover{color:var(--tx);background:rgba(255,255,255,.05)}
.pr.on{color:var(--tx);background:rgba(98,198,255,.16);box-shadow:inset 0 0 0 1px rgba(98,198,255,.45)}

/* slice header */
#sliceHead{position:fixed;left:50%;top:12px;transform:translateX(-50%);display:none;align-items:stretch;gap:0;padding:0}
#sliceHead button{padding:0 14px;font-size:10.5px;letter-spacing:.14em;color:var(--mut)}
#sliceHead button:hover{color:var(--tx);background:rgba(255,255,255,.04)}
#sliceTitle{padding:7px 16px;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;min-width:250px}
#sliceTitle .a{font-size:10px;letter-spacing:.18em;color:var(--mut)}
#sliceTitle .b{font-size:14px;letter-spacing:.12em;font-weight:600;margin:1px 0}
#sliceTitle .c{font-size:10.5px;letter-spacing:.14em;color:var(--sel)}
#returnBtn{position:fixed;left:14px;top:62px;display:none;padding:8px 12px;font-size:10.5px;letter-spacing:.14em;color:var(--sel);border-color:rgba(255,209,102,.35)}
#returnBtn:hover{background:rgba(255,209,102,.1)}

/* info */
#info{position:fixed;right:14px;top:56px;width:262px;padding:12px 13px;display:none;max-height:calc(100% - 128px);overflow:auto}
#info::-webkit-scrollbar{width:6px}#info::-webkit-scrollbar-thumb{background:#2b3540;border-radius:3px}
#info h4{margin:12px 0 5px;font-size:10px;letter-spacing:.16em;color:var(--mut);font-weight:600}
#info h4:first-child{margin-top:0}
.spec{display:grid;grid-template-columns:72px 1fr;gap:3px 8px;font-size:11px}
.spec .l{color:var(--mut);font-size:10px;letter-spacing:.06em;padding-top:1px}
.flowlist{display:flex;flex-direction:column;gap:2px;font-size:10.5px}
.flowlist div{display:flex;gap:7px;align-items:center;padding:3px 6px;border-radius:3px;background:rgba(255,255,255,.025)}
.flowlist i{font-style:normal;color:var(--dim);font-size:9px;width:34px;flex:none;letter-spacing:.08em}
.flowlist .ar{color:var(--dim);text-align:center;background:none;padding:0;font-size:9px;justify-content:center}
#miniRack{display:flex;gap:9px;align-items:flex-start}
#miniRack svg{flex:none}
#miniRack .t{font-size:10.5px;color:var(--mut)}

/* overlays */
#tip{position:fixed;pointer-events:none;display:none;padding:7px 9px;max-width:270px;z-index:5}
#tip .t1{font-size:11.5px;font-weight:600;letter-spacing:.06em}
#tip .t2{color:var(--mut);font-size:10.5px;margin-top:2px}
#tip .t3{color:var(--sel);font-size:10.5px;letter-spacing:.12em;margin-top:3px}
#card{position:fixed;display:none;width:240px;padding:12px;z-index:6}
#card .h{font-size:13px;font-weight:600;letter-spacing:.1em}
#card .s{color:var(--sel);font-size:10.5px;letter-spacing:.14em;margin:3px 0 8px}
#card .d{color:var(--mut);font-size:10.5px;margin-bottom:10px}
#card .row{display:flex;gap:6px}
.btn{flex:1;padding:8px 6px;border:1px solid var(--line2);border-radius:4px;font-size:10.5px;letter-spacing:.14em;text-align:center}
.btn.p{background:var(--acc);border-color:var(--acc);color:#071018;font-weight:600}
.btn.p:hover{filter:brightness(1.1)}
.btn:hover{border-color:#4d5c6a}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-50%);font-size:10px;letter-spacing:.12em;white-space:nowrap;color:#e6edf3;
  padding:2px 6px;border-radius:3px;background:rgba(9,12,16,.72);border:1px solid rgba(255,255,255,.08)}
.lb.sec{color:#cfe9ff;border-color:rgba(98,198,255,.35)}
.lb.why{white-space:normal;width:190px;line-height:1.35;letter-spacing:.04em;color:#ffe7c9;border-color:rgba(255,138,61,.4);font-size:9.8px}
.lb.dir{background:none;border:0;color:rgba(230,237,243,.5);font-size:11px;letter-spacing:.3em}
.lb.layer{color:var(--sel);border-color:rgba(255,209,102,.4);transform:translate(-100%,-50%)}
.lb.rk{transform:translate(0,-50%);color:#bfd2e2;font-size:9.5px}
.lb.rk::before{content:"";position:absolute;right:100%;top:50%;width:14px;border-top:1px solid rgba(191,210,226,.35)}
.lb.warn{color:#ffc3ad;border-color:rgba(255,107,61,.45)}
#legend{position:fixed;right:14px;bottom:14px;display:none;padding:8px 10px;width:220px}
#legend .bar{height:7px;border-radius:2px;margin:5px 0 3px;background:linear-gradient(90deg,#2f7bff,#29d3e0 30%,#ffd34a 55%,#ff7a1a 80%,#ff2b2b)}
#legend .sc{display:flex;justify-content:space-between;color:var(--mut);font-size:9.5px}
#hint{position:fixed;left:14px;bottom:14px;color:var(--dim);font-size:10px;letter-spacing:.06em;pointer-events:none}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:20;
  color:var(--mut);letter-spacing:.2em;font-size:11px;transition:opacity .5s}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#ffb3a0;z-index:30;background:var(--bg);padding:30px;text-align:center}
#busy{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);display:none;padding:6px 12px;font-size:10.5px;letter-spacing:.16em;color:var(--sel)}

@media (max-width:1060px){ #info{width:220px} #elev{width:176px} }
@media (max-width:860px){ #elev{display:none} #info{display:none!important} #hint{display:none} }
@media (max-height:560px){ #hint{display:none} }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="vignette"></div>
<div id="labels"></div>
<div id="top">
  <div class="brand"><b>RACK A-07</b><span class="mono">42U · 600 × 1200 MM · ROW C</span></div>
  <div id="mode" class="mono">FULL RACK</div>
</div>
<aside id="elev" class="panel">
  <h3><span>RACK ELEVATION</span><span class="mono" id="elevKw"></span></h3>
  <div id="elevList"></div>
  <div id="elevFoot"><span>FRONT VIEW</span><span class="mono" id="elevUse"></span></div>
</aside>
<button id="returnBtn" class="panel">⟵ RETURN TO RACK</button>
<div id="sliceHead" class="panel">
  <button id="prevBtn" title="Previous server (←)">‹ PREVIOUS SERVER</button>
  <div id="sliceTitle"><div class="a mono" id="stA"></div><div class="b" id="stB"></div><div class="c mono" id="stC"></div></div>
  <button id="nextBtn" title="Next server (→)">NEXT SERVER ›</button>
</div>
<div id="toggles"></div>
<aside id="info" class="panel"></aside>
<nav id="presets" class="panel"></nav>
<div id="tip" class="panel"></div>
<div id="card" class="panel"></div>
<div id="legend" class="panel"><div class="k">AIR TEMPERATURE</div><div class="bar"></div><div class="sc mono"><span>22 °C INTAKE</span><span>45</span><span>60 °C+</span></div></div>
<div id="busy" class="panel mono"></div>
<div id="hint" class="mono">DRAG ORBIT · RIGHT-DRAG PAN · WHEEL ZOOM · CLICK A SERVER</div>
<div id="loading" class="mono">BUILDING RACK…</div>
<div id="err" class="mono"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
<script>
'use strict';
/* =====================================================================
   RACK 42U · SLICE INSPECTOR
   Units are metres. Rack world: x across the rack (left → right seen
   from the front), y up, +z toward the front (cold aisle).
   Server local frame: front face at z = 0, rear at z = -D, chassis
   floor at y = 0, centred on x. Layout code speaks in "d" = depth from
   the front face (z = -d), which reads like a spec sheet.
   ===================================================================== */
if (!window.THREE) {
  const e = document.getElementById('err');
  e.style.display = 'flex';
  e.textContent = 'three.js could not be loaded (../../airline_tycoon/scene/vendor/three-0.160.1.min.js).';
  throw new Error('three.js missing');
}
const T = THREE;
const V3 = T.Vector3;
const DEG = Math.PI / 180;
const U = 0.04445;                      // one rack unit
const CW = 0.434, HW = CW / 2;          // chassis width (17.09")
const WALL = 0.0011;                    // sheet steel
const BOARD_Y = 0.0058, PCB_T = 0.0016, BT = BOARD_Y + PCB_T; // mainboard on standoffs
const RACK = { W: 0.6, D: 1.2, H: 2.02, y0: 0.102, zF: 0.47, zR: -0.33, earX: 0.2413, postIn: 0.2245, postOut: 0.2545 };
const INS = { y: 0.86, z: 1.95 };       // inspection plinth (in the cold aisle, in front of the rack)

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;
const smooth = t => t * t * (3 - 2 * t);
function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const colCache = new Map();
function C(hex) { let c = colCache.get(hex); if (!c) { c = new T.Color(hex); colCache.set(hex, c); } return c; }
function shade(hex, k) { const c = C(hex).clone(); c.multiplyScalar(k); return c; }

/* ---------- palette (sober, industrial) ---------- */
const K = {
  steel: '#8f969d', steelD: '#646b72', zinc: '#a7adb2', zincD: '#7d838a', bezel: '#1d2025', bezel2: '#2a2e34',
  cover: '#4d535a', coverD: '#3d4248', plastic: '#141619', plastic2: '#24272b', plastic3: '#33373c', duct: '#0f1113',
  pcbG: '#1c4a31', pcbG2: '#215838', pcbK: '#15181a', pcbB: '#1a2f45', chip: '#121314', chip2: '#1d1f21', chip3: '#2b2d30',
  alu: '#c7ccd1', alu2: '#a2a8ae', aluD: '#7f868c', copper: '#b8703f', gold: '#d2a548', solder: '#bfc4c8',
  choke: '#3b3e43', cap: '#24222a', capTop: '#b9bfc5', smd: '#8a6a49', smdD: '#26272a', white: '#d4d7d8', label: '#a8aaa7',
  terra: '#b4532c', blueT: '#3b6ea7', port: '#09090a', cage: '#b7bcc2', rj: '#c3a24f', cableK: '#141516', cableG: '#5d6064',
  aqua: '#39c2c9', yellow: '#d8b62a', red: '#a83a32', blue: '#3a62ae', rail: '#6f767d', frame: '#25292e',
  ledG: '#41ff6e', ledA: '#ffae1f', ledB: '#3f9cff', ledW: '#e8f1ff', ledR: '#ff3a2e'
};

/* ---------- renderer / scene ---------- */
const canvas = document.getElementById('c');
const renderer = new T.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = T.SRGBColorSpace;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
const scene = new T.Scene();
const BG_HALL = new T.Color('#0d1116'), BG_STUDIO = new T.Color('#17191c');
scene.background = BG_HALL.clone();
const camera = new T.PerspectiveCamera(32, 1, 0.01, 80);

(function buildEnvironment() {
  const s = new T.Scene();
  const g = new T.SphereGeometry(10, 48, 24);
  const p = g.attributes.position, cols = [];
  const top = new T.Color(0.55, 0.58, 0.62), hor = new T.Color(0.2, 0.21, 0.23), bot = new T.Color(0.03, 0.03, 0.035);
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i) / 10, c = new T.Color();
    if (y > 0) c.copy(hor).lerp(top, Math.pow(y, 0.7)); else c.copy(hor).lerp(bot, Math.pow(-y, 0.45));
    cols.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new T.Float32BufferAttribute(cols, 3));
  s.add(new T.Mesh(g, new T.MeshBasicMaterial({ vertexColors: true, side: T.BackSide })));
  const panel = (w, h, x, y, z, k, tint) => {
    const m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ color: new T.Color(k * (tint ? tint[0] : 1), k * (tint ? tint[1] : 1), k * (tint ? tint[2] : 1)), side: T.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); s.add(m);
  };
  panel(7, 3.2, 1, 7.5, 3, 7);
  panel(2.6, 5, -7.5, 3, 2.5, 3.2, [1, 0.97, 0.92]);
  panel(2.4, 5, 7.5, 2.4, -3, 2.4, [0.9, 0.95, 1.05]);
  panel(9, 0.8, 0, 1.5, -8.6, 1.6);
  panel(0.6, 6, 4, 5, 6, 2.4);
  const pm = new T.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(s, 0.035).texture;
  pm.dispose();
})();

const hemi = new T.HemisphereLight(0xdde7f5, 0x15171b, 0.55);
scene.add(hemi);
const key = new T.DirectionalLight(0xfff4e8, 1.75);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.00025;
key.shadow.normalBias = 0.012;
scene.add(key, key.target);
const fill = new T.DirectionalLight(0xc8dcff, 0.55);
const rim = new T.DirectionalLight(0xbfd0ff, 0.9);
scene.add(fill, rim);
function placeLights(center, radius, studio) {
  key.target.position.copy(center);
  key.position.copy(center).add(new V3(studio ? 0.9 : 1.8, studio ? 2.6 : 3.4, studio ? 1.5 : 2.6));
  const sc = key.shadow.camera;
  sc.left = -radius; sc.right = radius; sc.top = radius; sc.bottom = -radius;
  sc.near = 0.1; sc.far = 12; sc.updateProjectionMatrix();
  key.shadow.normalBias = studio ? 0.004 : 0.012;
  fill.position.copy(center).add(new V3(-3, 1.2, 1.5)); fill.target.position.copy(center);
  rim.position.copy(center).add(new V3(-1, 2.2, -3)); rim.target.position.copy(center);
  scene.add(fill.target, rim.target);
}

/* ---------- canvas textures ---------- */
function canvasTex(w, h, draw, opts) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d'); draw(g, w, h);
  const t = new T.CanvasTexture(cv);
  if (!opts || opts.color !== false) t.colorSpace = T.SRGBColorSpace;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  if (opts && opts.repeat) { t.wrapS = t.wrapT = T.RepeatWrapping; }
  return t;
}
// staggered round-hole perforation used as an alpha map (white = metal, black = hole)
const PERF_TEX = canvasTex(64, 64, (g) => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, 64, 64); g.fillStyle = '#000';
  for (const [x, y] of [[16, 16], [48, 48], [-16, 48], [80, 48], [48, -16], [48, 80]]) { g.beginPath(); g.arc(x, y, 11, 0, 7); g.fill(); }
}, { color: false, repeat: true });
// hexagonal honeycomb grille (front intake bezels)
const HEX_TEX = canvasTex(64, 112, (g) => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, 64, 112); g.fillStyle = '#000';
  const hex = (cx, cy, r) => { g.beginPath(); for (let i = 0; i < 6; i++) { const a = Math.PI / 6 + i * Math.PI / 3; g.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a)); } g.closePath(); g.fill(); };
  for (const [x, y] of [[0, 0], [64, 0], [32, 56], [0, 112], [64, 112]]) hex(x, y, 27);
}, { color: false, repeat: true });

/* ---------- geometry accumulation ---------- */
// Everything in an assembly is merged into one draw call per material class,
// with per-vertex colour. A 4U node is a few dozen draw calls, not thousands.
const _v = new V3(), _n = new V3();
class GeoBuf {
  constructor() { this.P = []; this.N = []; this.Cl = []; this.UV = []; this.I = []; this.n = 0; }
  q(ax, ay, az, bx, by, bz, cx, cy, cz, dx, dy, dz, nx, ny, nz, c, ua, va, ub, vb, uc, vc, ud, vd) {
    const P = this.P, N = this.N, Cl = this.Cl, UV = this.UV, i = this.n;
    P.push(ax, ay, az, bx, by, bz, cx, cy, cz, dx, dy, dz);
    N.push(nx, ny, nz, nx, ny, nz, nx, ny, nz, nx, ny, nz);
    Cl.push(c.r, c.g, c.b, c.r, c.g, c.b, c.r, c.g, c.b, c.r, c.g, c.b);
    UV.push(ua, va, ub, vb, uc, vc, ud, vd);
    this.I.push(i, i + 1, i + 2, i, i + 2, i + 3);
    this.n += 4;
  }
  // axis-aligned box from two corners. o.skip bitmask: 1 +x, 2 -x, 4 +y, 8 -y, 16 +z, 32 -z
  box(x0, y0, z0, x1, y1, z1, c, o) {
    if (x0 > x1) { const t = x0; x0 = x1; x1 = t; }

  const hub = new T.CylinderGeometry(0.37, 0.37, 0.8, 28); hub.rotateX(Math.PI / 2);

      const r = lerp(0.36, 0.965, i / (NR - 1)), span = lerp(0.32, 0.52, i / (NR - 1)) * (1.0);
      const a = th0 + (j / (NA - 1) - 0.5) * span + (i / (NR - 1)) * 0.18;

function chassis(ctx) {
  const H = ctx.H, D = ctx.D, B = ctx.A('base'), top = H - 0.0012, s = ctx.spec;

  bx(Cv.steel, -0.05, 0.05, H, H + 0.0005, 0.06, 0.12, K.coverD);

/* ---------- PCB artwork: traces, planes, vias, silkscreen ---------- */
function boardTexture(ctx, b) {
  const pxm = 2600;
  let w = Math.round((b.x1 - b.x0) * pxm), h = Math.round((b.d1 - b.d0) * pxm);
  const sc = Math.min(1, 4096 / Math.max(w, h)); w = Math.max(16, Math.round(w * sc)); h = Math.max(16, Math.round(h * sc));
  const k = w / (b.x1 - b.x0);
  const X = x => (x - b.x0) * k, Y = d => (b.d1 - d) * k;
  const dark = b.color === K.pcbK, r = rng(((b.x0 * 1000) | 0) + ((b.d0 * 1000) | 0) * 7 + (ctx.spec.seed || 1));
  const base = dark ? '#16191b' : '#1b4a30', plane = dark ? '#1d2124' : '#1f5436', trace = dark ? 'rgba(70,82,88,0.75)' : 'rgba(64,140,92,0.72)';
  const silk = dark ? '#cfd3d4' : '#e4e7de';
  const inside = (x, d) => x >= b.x0 && x <= b.x1 && d >= b.d0 && d <= b.d1;
  const fps = ctx.fp.filter(f => f.x1 > b.x0 && f.x0 < b.x1 && f.d1 > b.d0 && f.d0 < b.d1);
  return canvasTex(w, h, g => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    // copper pours under the power hungry parts
    g.fillStyle = plane;
    for (const f of fps) if (f.kind === 'cpu' || f.kind === 'vrm' || f.kind === 'gpu') {
      const m = f.kind === 'vrm' ? 0.006 : 0.012;
      g.fillRect(X(f.x0 - m), Y(f.d1 + m), (f.x1 - f.x0 + 2 * m) * k, (f.d1 - f.d0 + 2 * m) * k);

/* ---------- rack airflow ---------- */
class RackFlow {
  constructor() {

    };
    const rows = [];
    for (const it of RACK_ITEMS) {
      if (it.type === 'blank' || it.type === 'cablemgr' || it.type === 'patch') continue;
      const y0 = uY(it.u), y1 = uY(it.u + it.n);
      if (it.type === 'open') { rows.push({ open: true, y0, y1, it }); continue; }
      let zIn = zF + 0.004, zOut, heat;
      if (it.server) { const sp = SPECS.find(s => s.code === it.server); zOut = zF - sp.D; heat = clamp(sp.draw / sp.cfm / 14, 0.35, 1); }
      else if (it.type === 'switch') { zIn = SW_FRONT_Z; zOut = SW_PORT_Z; heat = 0.55; }
      else { zOut = zF - 0.6; heat = 0.35; }
      rows.push({ y0, y1, zIn, zOut, heat, n: it.n, srv: it.server });
    }
    for (const row of rows) {
      if (row.open) {
        // hot exhaust leaks forward through the hole and is pulled into neighbours' intakes

          const x = lerp(-0.18, 0.18, r()), y = lerp(row.y0 + 0.006, row.y1 - 0.006, r()), dn = r() < 0.5 ? -1 : 1;
          add([new V3(x * 1.2, y + 0.15, -0.95), new V3(x, y, -0.55), new V3(x, y, RACK.zR), new V3(x, y, zF - 0.1), new V3(x, y + dn * 0.015, zF + 0.1), new V3(x * 0.9, y + dn * 0.05, zF + 0.16), new V3(x * 0.9, y + dn * 0.06, zF + 0.02)], 0, 0.95, 'recirc', null);
        }
        continue;
      }
      const cnt = Math.round(5 + row.n * 5 + (row.srv === 'S08' ? 18 : 0));
      for (let k = 0; k < cnt; k++) {
        const x = lerp(-0.19, 0.19, r()), y = lerp(row.y0 + 0.006, row.y1 - 0.006, r());
        const fx = lerp(-0.35, 0.35, r()), fz = lerp(0.8, 1.45, r());
        const pts = [new V3(fx, 0.0, fz), new V3(fx * 0.8, Math.min(y, 0.25) * 0.5 + 0.05, fz - 0.05), new V3(lerp(fx, x, 0.6), y * 0.95, zF + 0.32), new V3(x, y, zF + 0.1), new V3(x, y, row.zIn + 0.004)];
        const pre = pts.length - 1;
        pts.push(new V3(x, y, row.zOut - 0.004), new V3(x, y + 0.01, row.zOut - 0.12), new V3(x * 1.15, y + 0.12 + r() * 0.1, -0.85), new V3(x * 1.3, Math.min(2.6, y + 0.5 + r() * 0.5), -1.15), new V3(x * 1.4, 2.7, -1.4));
        add(pts, pre, row.heat, 'dev', [row.zIn, row.zOut]);
      }
    }
    // over-the-top recirculation above the rack
    for (let k = 0; k < 16; k++) { const x = lerp(-0.25, 0.25, r()); add([new V3(x, 2.2, -1.1), new V3(x, 2.15, -0.5), new V3(x, 2.12, 0.2), new V3(x, 2.02, 0.75), new V3(x, uY(41), zF + 0.2), new V3(x, uY(41) + 0.02, SW_FRONT_Z + 0.02)], 0, 0.8, 'recirc', null); }
    this.n = 1400;
    this.streaks = new Streaks(this.n, scene);
    this.P = [];
    for (let i = 0; i < this.n; i++) this.P.push({ path: (r() * this.paths.length) | 0, s: r(), sp: 0.16 + r() * 0.08 });
    this.pos = new V3(); this.prev = new V3(); this.dir = new V3();
  }
  update(dt) {
    for (let i = 0; i < this.n; i++) {
      const p = this.P[i], path = this.paths[p.path];
      p.s += p.sp * dt / path.len * 2.2;
      if (p.s >= 1) { p.s = 0; p.path = (Math.random() * this.paths.length) | 0; continue; }
      const f = p.s * (path.S.length - 1), k = Math.floor(f), t = f - k;

      if (path.kind === 'recirc') temp = 0.85;
      else {
        const hot = k >= path.hotAt * (path.S.length - 1) / (path.S.length - 1);
        temp = this.pos.z < (path.hide[0] + path.hide[1]) / 2 ? path.heat : 0.04;
        if (this.pos.z < path.hide[0] && this.pos.z > path.hide[1]) alpha = 0;
      }
      this.streaks.set(i, this.pos, this.dir, 0.035, 0.003, temp, alpha);
    }
    this.streaks.commit();
  }
}

    el.dataset.u = it.u;
    el.style.top = ((42 - (it.u + it.n - 1)) * hU) + 'px'; el.style.height = (it.n * hU) + 'px';
    const uTxt = it.n > 1 ? (it.u + it.n - 1) + '' : it.u + '';
    const name = s ? s.spec.code + ' ' + s.spec.name : it.type === 'blank' ? 'blanking panel' : it.type === 'open' ? (it.reserved ? 'reserved · open' : 'open') : it.name;
    el.innerHTML = `<span class="u mono">${hU >= 8 || it.n > 1 ? uTxt : ''}</span><span class="n">${hU >= 7 || it.n > 1 ? name : ''}</span>`;
    if (s) {
      el.onclick = (e) => { if (app.busy) return; if (app.mode === 'rack') { const r = el.getBoundingClientRect(); openCard(it, { clientX: r.right, clientY: r.top + 10 }); } else if (s.i !== app.sel) switchServer(s.i - app.sel); };
      el.onmouseenter = () => { if (app.mode === 'rack' && !app.busy) setHover(it); };
      el.onmouseleave = () => { if (app.mode === 'rack' && !app.busy && !app.card) setHover(null); };
    }
    list.appendChild(el);
  }
  const used = RACK_ITEMS.filter(i => i.type !== 'blank' && i.type !== 'open').reduce((a, i) => a + i.n, 0);
  const kw = servers.reduce((a, s) => a + s.spec.draw, 0) / 1000 + RACK_ITEMS.reduce((a, i) => a + (i.kw || 0), 0);
  $('elevUse').textContent = used + 'U USED · ' + kw.toFixed(1) + ' kW';
  $('elevKw').textContent = servers.length + ' SERVERS';
}
function refreshUI() {
  const slice = app.mode === 'slice', s = servers[app.sel];
  $('mode').textContent = app.busy && app.sel >= 0 ? 'TRANSITION' : slice ? 'SINGLE SLICE' : 'FULL RACK';
  $('sliceHead').style.display = slice && s ? 'flex' : 'none';
  $('returnBtn').style.display = slice ? 'block' : 'none';
  $('elev').style.top = slice ? '106px' : '62px';
  $('info').style.display = slice && s ? 'block' : 'none';
  $('legend').style.display = app.tg.airflow ? 'block' : 'none';
  $('hint').textContent = slice ? 'DRAG ORBIT · RIGHT-DRAG PAN · WHEEL ZOOM · HOVER PARTS · ← → SWITCH SERVER · ESC RETURN' : 'DRAG ORBIT · RIGHT-DRAG PAN · WHEEL ZOOM · CLICK A SERVER · DOUBLE-CLICK TO INSPECT';
  $('hint').style.right = app.tg.airflow ? '250px' : '';
  document.querySelectorAll('.ru.cur').forEach(e => e.classList.remove('cur'));
  if (s && app.sel >= 0) { const row = document.querySelector('.ru[data-u="' + s.spec.uStart + '"]'); if (row) row.classList.add('cur'); }
  // toggles
  const tgs = slice ? [['explode', 'EXPLODED VIEW'], ['cutaway', 'CHASSIS CUTAWAY'], ['airflow', 'SHOW AIRFLOW'], ['labels', 'LABELS']] : [['airflow', 'SHOW AIRFLOW'], ['labels', 'LABELS'], ['cables', 'CABLES']];
  $('toggles').innerHTML = tgs.map(([k, l]) => `<button class="tg${app.tg[k] ? ' on' : ''}${k === 'airflow' ? ' air' : ''}" data-k="${k}">${l}</button>`).join('');
  $('toggles').querySelectorAll('button').forEach(b => b.onclick = () => toggle(b.dataset.k));
  const pl = slice ? SLICE_PRESETS : RACK_PRESETS, cur = slice ? app.slicePreset : app.rackPreset;
  $('presets').innerHTML = pl.map(p => `<button class="pr${p.id === cur ? ' on' : ''}" data-p="${p.id}">${p.label}</button>`).join('');
  $('presets').querySelectorAll('button').forEach(b => b.onclick = () => preset(b.dataset.p));
  $('presets').style.opacity = app.busy ? 0.45 : 1; $('toggles').style.opacity = app.busy ? 0.45 : 1;
  if (slice && s) {
    $('stA').textContent = 'SERVER ' + String(s.i + 1).padStart(2, '0') + ' / ' + String(servers.length).padStart(2, '0');
    $('stB').textContent = s.spec.name;
    $('stC').textContent = s.spec.u + 'U · ' + s.spec.uLabel;
    renderInfo(s);
  }
  updateInsets();
}
function renderInfo(s) {
  const sp = s.spec, dT = 1.76 * sp.draw / sp.cfm;
  let svg = '<svg width="34" height="132" viewBox="0 0 34 132">';
  svg += '<rect x="1" y="1" width="32" height="130" fill="none" stroke="#33404d"/>';
  for (const it of RACK_ITEMS) {
    const y = 2 + (42 - (it.u + it.n - 1)) * 3.04, h = it.n * 3.04 - 0.6;
    const me = it.server === sp.code, srv = !!it.server;
    const col = me ? '#ffd166' : srv ? '#3d6f93' : it.type === 'switch' || it.type === 'patch' ? '#4f7a46' : it.type === 'ups' || it.type === 'ebm' ? '#8a6a3c' : it.type === 'open' ? 'none' : '#20262c';
    svg += `<rect x="3" y="${y.toFixed(1)}" width="28" height="${h.toFixed(1)}" fill="${col}"${it.type === 'open' ? ' stroke="#5a3d36" stroke-dasharray="2 2"' : ''}/>`;
  }
  svg += '</svg>';
  $('info').innerHTML = `
    <h4>FROM THE RACK</h4>
    <div id="miniRack">${svg}<div class="t">This chassis was unlatched from <b style="color:var(--sel)">${sp.uLabel}</b> of rack A-07, slid out on its rails and lifted onto the bench. <br><br>${sp.tag}.<br><br><span class="mono" style="color:var(--dim)">${sp.code} · DEPTH ${Math.round(sp.D * 1000)} MM</span></div></div>
    <h4>SPECIFICATION</h4>
    <div class="spec">${sp.specs.map(r => `<div class="l mono">${r[0]}</div><div>${r[1]}</div>`).join('')}</div>
    <h4>LAYOUT · FRONT → REAR</h4>
    <div class="flowlist">${sp.flowText.map((r, i) => (i ? '<div class="ar">▼</div>' : '') + `<div><i class="mono">${r[0]}</i>${r[1]}</div>`).join('')}</div>
    <h4>THERMAL</h4>
    <div class="spec"><div class="l mono">DRAW</div><div>${sp.draw.toLocaleString('en-US')} W</div><div class="l mono">AIRFLOW</div><div>${sp.cfm.toLocaleString('en-US')} CFM</div><div class="l mono">ΔT</div><div>≈ ${dT.toFixed(1)} °C intake → exhaust</div></div>
    <h4>PART</h4>
    <div id="partInfo" style="font-size:11px;min-height:44px"></div>`;
  setPartHover(app.partHover);
}
function updateInsets() {
  const w = innerWidth, el = $('elev'), inf = $('info');
  const shown = e => getComputedStyle(e).display !== 'none';
  const L = shown(el) ? el.getBoundingClientRect().right + 8 : 0;
  const R = shown(inf) ? w - inf.getBoundingClientRect().left + 8 : 0;
  cam.inset.l = L; cam.inset.r = R; cam.inset.t = app.mode === 'slice' ? 70 : 56; cam.inset.b = 58;
  applyViewOffset();
}
$('returnBtn').onclick = () => back();
$('prevBtn').onclick = () => switchServer(-1);
$('nextBtn').onclick = () => switchServer(1);

/* ---------- scene furniture ---------- */
function buildStudio() {
  const tex = canvasTex(1024, 1024, g => {
    const gr = g.createRadialGradient(512, 512, 40, 512, 512, 512);
    gr.addColorStop(0, '#3a3f45'); gr.addColorStop(0.55, '#26292d'); gr.addColorStop(1, '#17191c');
    g.fillStyle = gr; g.fillRect(0, 0, 1024, 1024);
    g.strokeStyle = 'rgba(255,255,255,0.05)'; g.lineWidth = 1;
    for (let i = 0; i <= 1024; i += 32) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 1024); g.stroke(); g.beginPath(); g.moveTo(0, i); g.lineTo(1024, i); g.stroke(); }
  });
  const m = new T.MeshStandardMaterial({ map: tex, roughness: 0.6, metalness: 0.2, transparent: true, opacity: 0 });
  const disc = new T.Mesh(new T.CircleGeometry(1.15, 72), m);
  disc.rotation.x = -Math.PI / 2; disc.position.set(0, INS.y - 0.035, INS.z); disc.receiveShadow = true; disc.visible = false;
  const ring = new T.Mesh(new T.RingGeometry(1.15, 1.157, 96), new T.MeshBasicMaterial({ color: '#62c6ff', transparent: true, opacity: 0, side: T.DoubleSide }));
  ring.rotation.x = -Math.PI / 2; ring.position.set(0, INS.y - 0.034, INS.z); ring.visible = false;
  scene.add(disc, ring); disc.ring = ring;
  return disc;
}
function buildHighlight() {
  const g = new T.Group();
  const fill = new T.Mesh(new T.BoxGeometry(1, 1, 1), new T.MeshBasicMaterial({ color: '#62c6ff', transparent: true, opacity: 0.075, depthWrite: false }));
  const edge = new T.LineSegments(new T.EdgesGeometry(new T.BoxGeometry(1, 1, 1)), new T.LineBasicMaterial({ color: '#62c6ff', transparent: true, opacity: 0.85 }));
  const rails = new T.Group();
  for (const sx of [-1, 1]) for (const z of [RACK.zF + 0.0008, RACK.zR - 0.0008]) {
    const m = new T.Mesh(new T.BoxGeometry(RACK.postOut - RACK.postIn, 1, 0.0006), new T.MeshBasicMaterial({ color: '#62c6ff', transparent: true, opacity: 0.35, depthWrite: false }));
    m.position.set(sx * (RACK.postIn + RACK.postOut) / 2, 0, z); rails.add(m);
  }
  fill.renderOrder = 3; edge.renderOrder = 3;
  g.add(fill, edge, rails); g.userData = { fill, edge, rails }; g.visible = false;
  scene.add(g);
  return g;
}

/* ---------- main loop ---------- */
let last = performance.now(), clock = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  tick(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
function tick(dt) {
  clock += dt;
  stepTweens(dt);
  stepCamera(dt);
  updateRails();
  for (const m of LED_MATS) m.uniforms.uTime.value = clock;
  const s = servers[app.sel];
  if (s && s.deep && s.deep.group.visible) {
    spinRotors(s.deep.ctx, clock);
    if (s.deep.flow && s.deep.flow.alpha > 0.001) s.deep.flow.update(dt);
  }
  if (rackFlow && app.tg.airflow && app.mode === 'rack' && app.rackFade > 0.01) rackFlow.update(dt);
  if (rackFlow) rackFlow.streaks.opacity(app.tg.airflow && app.mode === 'rack' ? app.rackFade : 0);
  hiGroup.userData.edge.material.opacity = 0.6 + 0.3 * Math.sin(clock * 5);
  drawLabels(app.mode === 'slice' ? sliceLabels() : rackLabels());
}
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  buildElevation(); refreshUI();
  if (!app.busy && !cam.fly) { if (app.mode === 'rack') flyTo(rackView(app.rackPreset), 0.3); else if (app.sel >= 0) flyTo(sliceView(servers[app.sel], app.slicePreset), 0.3); }
}

/* ---------- boot ---------- */
(function boot() {
  try {
    buildRack();
    hallFloorMesh = hallFloor();
    studio = buildStudio();
    hiGroup = buildHighlight();
    partBox = new T.LineSegments(new T.EdgesGeometry(new T.BoxGeometry(1, 1, 1)), new T.LineBasicMaterial({ color: '#ffd166', depthTest: false, transparent: true }));
    partBox.renderOrder = 9; partBox.visible = false;
    placeLights(new V3(0, 1, 0), 1.6, false);
    renderer.setSize(innerWidth, innerHeight, false);
    buildElevation(); refreshUI();
    const v = rackView('34'); flyTo(v, 0);
    cam.dist *= 1.35; cam.az += 0.35;
    requestAnimationFrame(() => flyTo(rackView('34'), 1.8));
    window.addEventListener('resize', resize);
    requestAnimationFrame(t => { last = t; frame(t); });
    const ld = $('loading'); ld.style.opacity = 0; setTimeout(() => ld.remove(), 600);
  } catch (err) {
    console.error(err);
    const e = $('err'); e.style.display = 'flex'; e.textContent = 'Scene failed to build: ' + err.message;
  }
})();

/* ---------- debug / automation hook ---------- */
window.__RACK__ = {
  servers: () => servers.map(s => ({ code: s.spec.code, name: s.spec.name, u: s.spec.uLabel, parts: s.deep ? s.deep.ctx.parts.length : null })),
  state: () => ({ mode: app.mode, busy: app.busy, sel: app.sel, toggles: { ...app.tg }, rackPreset: app.rackPreset, slicePreset: app.slicePreset, cam: { az: cam.az, el: cam.el, dist: cam.dist } }),
  inspect: (n, fast) => { FAST = !!fast; return inspect(n - 1).finally(() => { FAST = false; }); },
  back: (fast) => { FAST = !!fast; return back().finally(() => { FAST = false; }); },
  next: (fast) => { FAST = !!fast; return switchServer(1).finally(() => { FAST = false; }); },
  prev: (fast) => { FAST = !!fast; return switchServer(-1).finally(() => { FAST = false; }); },
  preset: (id, fast) => { FAST = !!fast; return preset(id).finally(() => { FAST = false; }); },
  toggle: (name, on, fast) => { FAST = !!fast; const p = app.mode === 'slice' && ['explode', 'cutaway', 'airflow'].includes(name) ? setToggleSlice(name, on) : Promise.resolve((app.tg[name] !== on) && toggle(name)); return p.finally(() => { FAST = false; }); },
  advance: (sec) => { const n = Math.round(sec * 60); for (let i = 0; i < n; i++) { last = performance.now() - 1000 / 60; tick(1 / 60); } renderer.render(scene, camera); return clock; },
  info: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, geos: renderer.info.memory.geometries, tex: renderer.info.memory.textures })
};

</script>
