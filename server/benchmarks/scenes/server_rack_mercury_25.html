<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Server Architecture Lab</title>
    <style>
        :root {
            --primary: #00d2ff;
            --bg: #111;
            --panel: rgba(20, 25, 35, 0.95);
            --text: #eee;
            --alert: #ff4444;
            --success: #44ff44;
        }
        body { margin: 0; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Segoe UI', monospace; font-size: 12px; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* UI Overlay */
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .panel { pointer-events: auto; background: var(--panel); border: 1px solid #333; padding: 10px; position: absolute; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        
        /* Top Bar */
        #top-bar { top: 10px; left: 10px; width: 250px; }
        .title { font-weight: bold; font-size: 16px; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .stat-row { display: flex; justify-content: space-between; margin-top: 4px; font-size: 11px; }
        
        /* Left Panel - Rack & List */
        #left-panel { top: 60px; left: 10px; width: 280px; height: calc(100% - 140px); overflow-y: auto; }
        .server-item { padding: 8px; border-bottom: 1px solid #333; cursor: pointer; transition: background 0.2s; }
        .server-item:hover { background: rgba(0, 210, 255, 0.1); }
        .server-item.active { background: rgba(0, 210, 255, 0.25); border-left: 3px solid var(--primary); }
        
        /* Right Panel - Details */
        #right-panel { top: 60px; right: 10px; width: 320px; height: calc(100% - 140px); overflow-y: auto; }
        h3 { margin: 0 0 8px 0; font-size: 14px; color: var(--primary); border-bottom: 1px solid #444; padding-bottom: 5px; }
        .health-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .health-box { background: rgba(0,0,0,0.3); padding: 5px; border-radius: 3px; text-align: center; }
        .health-val { display: block; font-size: 14px; font-weight: bold; }
        .health-label { font-size: 10px; color: #aaa; }
        
        /* Bottom Toolbar */
        #toolbar { bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 10px; width: 800px; }
        button { background: #222; color: #ccc; border: 1px solid #444; padding: 8px 12px; cursor: pointer; font-size: 11px; border-radius: 3px; text-transform: uppercase; transition: all 0.2s; }
        button:hover { background: #333; color: #fff; }
        button.active { background: var(--primary); color: #000; border-color: var(--primary); }
        
        /* Floating Info */
        #floating-info { bottom: 100px; right: 10px; width: 200px; display: none; }
        
        /* Comparison Mode */
        #compare-modal { display: none; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 500px; }
        .bar-container { height: 8px; background: #333; margin-top: 2px; border-radius: 4px; overflow: hidden; }
        .bar-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.5s; }
        
        /* Notifications */
        #notification { position: absolute; top: 100px; right: 10px; padding: 10px; background: var(--alert); color: white; display: none; border-radius: 3px; }
    </style>
    <!-- Three.js & OrbitControls -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

<div id="canvas-container"></div>

<div id="ui">
    <div id="top-bar" class="panel">
        <div class="title">Server Architecture Lab</div>
        <div class="stat-row"><span>FPS</span><span id="fps">0</span></div>
        <div class="stat-row"><span>Draw Calls</span><span id="draw">0</span></div>
        <div class="stat-row"><span>Triangles</span><span id="tris">0</span></div>
        <div class="stat-row"><span>Rack Power</span><span id="rack-power">0.0 kW</span></div>
    </div>

    <div id="left-panel" class="panel">
        <h3>Rack Units (1-42)</h3>
        <div id="rack-list"></div>
    </div>

    <div id="right-panel" class="panel">
        <div id="server-details">
            <h3>Server Details</h3>
            <p id="archetype-desc" style="font-size: 11px; color: #aaa;">Select a server from the list.</p>
            <div id="health-panel" style="margin-top: 10px;"></div>
        </div>
    </div>

    <div id="floating-info" class="panel">
        <h3 id="comp-name"></h3>
        <p id="comp-role" style="font-size: 11px;"></p>
        <p id="comp-spec" style="font-size: 11px;"></p>
    </div>

    <div id="compare-modal" class="panel">
        <h3>Archetype Comparison</h3>
        <div id="compare-content"></div>
        <div style="margin-top: 10px; text-align: right;"><button onclick="app.toggleCompare()">Close</button></div>
    </div>

    <div id="toolbar" class="panel">
        <button id="btn-rack" class="active">Rack View</button>
        <button id="btn-slice">Slice View</button>
        <button id="btn-cover">Open Cover</button>
        <button id="btn-cutaway">Cutaway</button>
        <button id="btn-explode">Explode</button>
        <div style="width: 1px; background: #444; margin: 0 5px;"></div>
        <button id="btn-airflow">Airflow</button>
        <button id="btn-power">Power</button>
        <button id="btn-data">Data</button>
        <div style="width: 1px; background: #444; margin: 0 5px;"></div>
        <button id="btn-fail">Failures</button>
        <button id="btn-reset">Reset</button>
        <button id="btn-compare">Compare</button>
    </div>
</div>

<div id="notification"></div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- CONFIG ---
    const CONFIG = {
        U_HEIGHT: 44.45, // mm
        U_DEPTH: 800, // mm
        RACK_WIDTH: 600,
        RACK_HEIGHT: 42,
        SERVER_COLOR: 0x111111,
        PCB_COLOR: 0x003300,
        METAL_COLOR: 0xaaaaaa
    };

    // --- GEOMETRY FACTORY ---
    const Factory = {
        matMetal: new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.4, metalness: 0.6 }),
        matBlack: new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.5, metalness: 0.1 }),
        matGreen: new THREE.MeshStandardMaterial({ color: 0x004400, roughness: 0.7, metalness: 0.0 }),
        matGold: new THREE.MeshStandardMaterial({ color: 0xffaa00, roughness: 0.2, metalness: 0.8 }),
        matSilver: new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.3, metalness: 0.8 }),

        createBox(w, h, d, color = 0xffffff) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.5, metalness: 0.2 });
            return new THREE.Mesh(geo, mat);
        },

        createDIMM() {
            const geo = new THREE.BoxGeometry(15, 20, 1);
            const chipGeo = new THREE.BoxGeometry(2, 3, 0.2);
            const mat = new THREE.MeshStandardMaterial({ color: 0x002222 });
            const mem = new THREE.Mesh(geo, this.matBlack);
            
            for(let i=0; i<4; i++) {
                const chip = new THREE.Mesh(chipGeo, mat);
                chip.position.y = 10;
                chip.position.z = 0.6;
                chip.rotation.x = Math.PI / 2;
                mem.add(chip);
            }
            return mem;
        },

        createFan() {
            const geo = new THREE.CylinderGeometry(20, 20, 5, 32);
            const blades = new THREE.Group();
            for(let i=0; i<4; i++) {
                const blade = new THREE.Mesh(new THREE.BoxGeometry(16, 1, 1), this.matSilver);
                blade.rotation.z = (Math.PI * 2 / 4) * i;
                blades.add(blade);
            }
            const cage = new THREE.Mesh(new THREE.RingGeometry(18, 20, 32), this.matMetal);
            cage.rotation.x = Math.PI / 2;
            const group = new THREE.Group();
            group.add(geo); group.add(blades); group.add(cage);
            group.add.blade = blades;
            return group;
        },

        createCPU() {
            const base = new THREE.Mesh(new THREE.BoxGeometry(30, 2, 30), this.matSilver);
            const hea = new THREE.Mesh(new THREE.BoxGeometry(28, 15, 28), this.matMetal);
            hea.position.y = 10;
            // Fins
            const fin = new THREE.Mesh(new THREE.BoxGeometry(2, 18, 30), this.matMetal);
            for(let i=-10; i<=10; i+=5) {
                const f = fin.clone();
                f.position.x = i;
                hea.add(f);
            }
            const group = new THREE.Group();
            group.add(base); group.add(hea);
            return group;
        },

        createGPU() {
            const body = new THREE.Group();
            const box = new THREE.Mesh(new THREE.BoxGeometry(30, 100, 10), this.matBlack);
            const fan = new THREE.Group();
            for(let i=0; i<2; i++) {
                const f = this.createFan();
                f.scale.set(0.8, 0.8, 0.8);
                f.position.y = 25 - (i*20);
                fan.add(f);
            }
            const p = new THREE.Mesh(new THREE.BoxGeometry(30, 10, 3), this.matGold);
            p.position.set(0, 3, -5);
            body.add(box); body.add(fan); body.add(p);
            return body;
        },

        createPSU() {
            const box = new THREE.Mesh(new THREE.BoxGeometry(20, 150, 10), this.matBlack);
            const fan = new THREE.Mesh(new THREE.CircleGeometry(10), this.matSilver);
            fan.position.set(0, 0, 5);
            box.add(fan);
            return box;
        }
    };

    // --- SERVER ARCHITECTURE ---
    class ServerSystem {
        constructor(type, uSize) {
            this.type = type;
            this.uSize = uSize;
            this.group = new THREE.Group();
            this.components = [];
            this.parts = []; // For cutaway/explode
            this.init();
        }

        init() {
            const h = this.uSize * CONFIG.U_HEIGHT;
            const w = CONFIG.RACK_WIDTH;
            const d = CONFIG.U_DEPTH;

            // Chassis
            const chassis = new THREE.Group();
            
            // Base
            const base = Factory.createBox(w, 2, d, 0x222222);
            chassis.add(base);

            // Rails
            const rail = Factory.createBox(5, h, d, 0x444444);
            const railL = rail.clone(); railL.position.set(-w/2, h/2, 0);
            const railR = rail.clone(); railR.position.set(w/2, h/2, 0);
            chassis.add(railL, railR);

            // Front Plate
            const front = Factory.createBox(w, 2, 5, 0x111111);
            front.position.set(0, h/2, d/2);
            chassis.add(front);

            // Rear Plate
            const rear = Factory.createBox(w, 2, 5, 0x111111);
            rear.position.set(0, h/2, -d/2);
            chassis.add(rear);

            this.chassis = chassis;
            this.parts.push(chassis);
        }

        addComp(name, mesh, x, y, z) {
            mesh.position.set(x, y, z);
            this.group.add(mesh);
            mesh.userData = { name, role: this.type + ' Component' };
            this.components.push(mesh);
        }

        // Abstract build
        build() { throw new Error("Must override"); }
    }

    class GeneralPurposeServer extends ServerSystem {
        build() {
            // Motherboard
            const mb = Factory.createBox(CONFIG.RACK_WIDTH - 50, 2, CONFIG.U_DEPTH - 50, CONFIG.PCB_COLOR);
            mb.position.set(0, 5, 0);
            this.group.add(mb);

            // CPU
            const cpu = Factory.createCPU();
            this.addComp("CPU", cpu, -50, 10, 20);

            // RAM
            for(let i=0; i<8; i++) {
                const d = Factory.createDIMM();
                d.position.set(-70, 15, -10 + i*10);
                this.addComp("DIMM", d, -70, 15, -10 + i*10);
            }

            // Fan
            const fan = Factory.createFan();
            this.addComp("Fan", fan, 150, 10, 0);

            // PSU
            const psu = Factory.createPSU();
            this.addComp("PSU", psu, 150, 5, -50);
        }
    }

    class StorageServer extends ServerSystem {
        build() {
            // Front Drive Bays (Visual only)
            for(let i=0; i<10; i++) {
                const drive = Factory.createBox(100, 30, 10, 0x333333);
                const handle = Factory.createBox(10, 10, 2, 0x555555);
                handle.position.set(55, 0, 0);
                drive.add(handle);
                drive.position.set(-100, 10, 395);
                this.addComp("Drive", drive, -100, 10, 395);
            }

            // Backplane area
            const mb = Factory.createBox(200, 2, 300, CONFIG.PCB_COLOR);
            mb.position.set(-100, 5, -50);
            this.group.add(mb);
            
            // Fans
            const fanGroup = new THREE.Group();
            for(let i=0; i<4; i++) {
                const f = Factory.createFan();
                f.position.set(-50 + i*40, 10, 0);
                fanGroup.add(f);
            }
            this.group.add(fanGroup);

            // PSU
            const psu = Factory.createPSU();
            this.addComp("PSU", psu, 180, 5, -50);
        }
    }

    class GPUTServer extends ServerSystem {
        build() {
            // 4U = huge
            const mb = Factory.createBox(500, 2, 700, CONFIG.PCB_COLOR);
            mb.position.set(0, 10, 0);
            this.group.add(mb);

            // CPU 1
            const cpu1 = Factory.createCPU();
            this.addComp("CPU 1", cpu1, -80, 15, 50);

            // GPU 1, 2 (Vertical)
            const gpu1 = Factory.createGPU();
            gpu1.rotation.z = -Math.PI/2;
            this.addComp("GPU 1", gpu1, -120, 50, 50);
            
            const gpu2 = Factory.createGPU();
            gpu2.rotation.z = -Math.PI/2;
            this.addComp("GPU 2", gpu2, -120, 50, -50);

            // RAM Banks
            for(let i=0; i<16; i++) {
                const d = Factory.createDIMM();
                d.position.set(-70, 20, -80 + i*12);
                this.addComp("DIMM", d, -70, 20, -80 + i*12);
            }

            // Massive Fan Wall
            const fans = new THREE.Group();
            for(let i=0; i<6; i++) {
                const f = Factory.createFan();
                f.scale.set(1.2,1.2,1.2);
                f.position.set(150, 5 + i*25, 0);
                fans.add(f);
            }
            this.group.add(fans);

            // PSU (Multiple)
            for(let i=0; i<2; i++) {
                const psu = Factory.createPSU();
                this.addComp("PSU", psu, 250, 5, 200 - i*150);
            }
        }
    }

    // --- APP ---
    class App {
        constructor() {
            this.scene = new THREE.Scene();
            this.scene.background = new THREE.Color(0x111111);
            
            this.camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 1, 2000);
            this.camera.position.set(0, 300, 1000);

            this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(this.renderer.domElement);

            this.controls = new OrbitControls(this.camera, this.renderer.domElement);
            this.controls.enableDamping = true;
            this.controls.dampingFactor = 0.05;

            // Lighting
            const amb = new THREE.AmbientLight(0x404040, 2);
            this.scene.add(amb);
            const dir = new THREE.DirectionalLight(0xffffff, 2);
            dir.position.set(200, 300, 400);
            dir.castShadow = true;
            this.scene.add(dir);

            // Mode State
            this.mode = 'rack'; // rack or slice
            this.servers = [];
            this.rackGroup = new THREE.Group();
            this.slicedServer = null;

            this.initRack();
            this.initUI();
            
            window.addEventListener('resize', () => this.onResize());
            window.addEventListener('keydown', (e) => {
                if(e.code === 'Space') {
                    if(this.mode === 'slice') this.toRack(); else this.toSlice();
                }
            });

            this.loop();
        }

        initRack() {
            const rack = new THREE.Group();
            const width = CONFIG.RACK_WIDTH;
            const depth = CONFIG.U_DEPTH;
            const height = CONFIG.RACK_HEIGHT * CONFIG.U_HEIGHT;

            // Frame
            const vRail = Factory.createBox(5, height, 5, 0x222222);
            const vPos = [-width/2 - 20, width/2 + 20];
            vPos.forEach(x => {
                const v = vRail.clone();
                v.position.set(x, height/2, 0);
                rack.add(v);
            });
            const hTop = Factory.createBox(width + 40, 5, depth + 50, 0x222222);
            hTop.position.set(0, height, 0);
            rack.add(hTop);

            this.scene.add(rack);
            this.rackGroup = rack;

            // Populate
            const archetypes = [
                { type: 'AI Compute', count: 4, cls: GPUTServer },
                { type: 'Virtualization', count: 2, cls: GeneralPurposeServer },
                { type: 'General Purpose', count: 2, cls: GeneralPurposeServer },
                { type: 'Storage', count: 4, cls: StorageServer },
            ];

            let currentU = 42;
            archetypes.forEach(a => {
                for(let i=0; i<a.count; i++) {
                    currentU--;
                    const srv = new a.cls(a.type, a.count > 2 ? 4 : 1);
                    srv.build();
                    this.scene.add(srv.group);
                    srv.group.position.set(0, currentU * CONFIG.U_HEIGHT, 0);
                    srv.group.userData = { id: currentU, name: a.type, model: srv };
                    this.servers.push(srv);

                    // U Label
                    // simplified for brevity
                    // In a full app, we'd add text sprites here.
                }
            });
        }

        toSlice() {
            if(this.mode === 'slice') return;
            this.mode = 'slice';
            document.getElementById('btn-rack').classList.remove('active');
            document.getElementById('btn-slice').classList.add('active');
            
            // If no selection, pick top one
            if(!this.slicedServer && this.servers.length > 0) this.selectServer(this.servers[0].group);
            
            // Animate Out
            if(this.slicedServer) {
                const srv = this.slicedServer.model;
                // Move forward
                const startPos = this.slicedServer.position.z;
                
                // Simple transition logic
                this.animateProp(this.slicedServer.position, 'z', startPos + 500, 500, () => {
                    // Fade others
                    this.servers.forEach(s => {
                        if(s.group !== this.slicedServer) s.group.visible = false;
                    });
                    this.rackGroup.visible = false;
                    this.toSliceCam();
                });
            }
        }

        toRack() {
            if(this.mode === 'rack') return;
            this.mode = 'rack';
            document.getElementById('btn-rack').classList.add('active');
            document.getElementById('btn-slice').classList.remove('active');
            this.slicedServer = null;
            this.rackGroup.visible = true;
            this.servers.forEach(s => s.group.visible = true);
            this.camera.position.set(0, 300, 1000);
        }

        toSliceCam() {
            // Move to 3/4 view
            this.camera.position.set(200, 150, 200);
            this.controls.target.set(0, 50, 0);
        }

        animateProp(obj, prop, target, dur, cb) {
            const start = obj[prop];
            const diff = target - start;
            const t0 = performance.now();
            const step = (now) => {
                const t = (now - t0) / dur;
                if(t < 1) {
                    obj[prop] = start + diff * t;
                    requestAnimationFrame(step);
                } else {
                    obj[prop] = target;
                    if(cb) cb();
                }
            };
            requestAnimationFrame(step);
        }

        selectServer(mesh) {
            this.slicedServer = mesh;
            this.scene.add(mesh); // Ensure in scene
            // Highlight
            document.querySelectorAll('.server-item').forEach(el => el.classList.remove('active'));
            const el = document.getElementById('srv-' + mesh.userData.id);
            if(el) el.classList.add('active');
            
            // Show Info
            const d = document.getElementById('server-details');
            d.innerHTML = `<h3>${mesh.userData.name}</h3>
            <div class="health-grid">
                <div class="health-box"><span class="health-val" style="color:#4f4">24°C</span><span class="health-label">Inlet</span></div>
                <div class="health-box"><span class="health-val" style="color:#f44">82°C</span><span class="health-label">Core</span></div>
                <div class="health-box"><span class="health-val">0.0%</span><span class="health-label">Storage</span></div>
                <div class="health-box"><span class="health-val">2.4 kW</span><span class="health-label">Power</span></div>
            </div>`;
        }

        initUI() {
            // Rack List
            const list = document.getElementById('rack-list');
            this.servers.forEach(srv => {
                const div = document.createElement('div');
                div.className = 'server-item';
                div.id = 'srv-'+srv.group.userData.id;
                div.innerText = `U${srv.group.userData.id} - ${srv.group.userData.name}`;
                div.onclick = () => this.selectServer(srv.group);
                list.appendChild(div);
            });

            document.getElementById('btn-slice').onclick = () => this.toSlice();
            document.getElementById('btn-rack').onclick = () => this.toRack();
            document.getElementById('btn-reset').onclick = () => this.toRack();

            // Raycaster for interaction
            this.raycaster = new THREE.Raycaster();
            this.mouse = new THREE.Vector2();
            this.scene.addEventListener('mousemove', (e) => {
                this.mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                this.mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                
                if(this.mode === 'rack') {
                    this.raycaster.setFromCamera(this.mouse, this.camera);
                    const intersects = this.raycaster.intersectObjects(this.servers.flatMap(s => s.components));
                    if(intersects.length > 0) {
                        document.body.style.cursor = 'pointer';
                        this.tooltip = intersects[0].object.userData;
                    } else document.body.style.cursor = 'default';
                }
            });

            this.scene.addEventListener('click', (e) => {
                if(this.mode === 'slice') {
                    this.raycaster.setFromCamera(this.mouse, this.camera);
                    const intersects = this.raycaster.intersectObjects(this.slicedServer.model.components);
                    if(intersects.length > 0) {
                        const info = intersects[0].object.userData;
                        document.getElementById('floating-info').style.display = 'block';
                        document.getElementById('comp-name').innerText = info.name;
                        document.getElementById('comp-role').innerText = info.role;
                        document.getElementById('comp-spec').innerText = "Type: Standard Enterprise";
                        setTimeout(() => document.getElementById('floating-info').style.display = 'none', 2000);
                    }
                } else if (intersects.length > 0) {
                    // Rack click logic: finding parent group
                    let target = intersects[0].object;
                    while(target.parent && target.parent !== this.scene) target = target.parent;
                    if(target.userData.id) this.selectServer(target);
                }
            });
        }

        onResize() {
            this.camera.aspect = window.innerWidth / window.innerHeight;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(window.innerWidth, window.innerHeight);
        }

        loop() {
            requestAnimationFrame(() => this.loop());
            this.controls.update();
            this.renderer.render(this.scene, this.camera);
        }
    }

    window.app = new App();
</script>
</body>
</html>
