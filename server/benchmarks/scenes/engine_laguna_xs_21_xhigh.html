<!DOCTYPE html>
<html>
<head>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js"}}</script>
<meta charset="utf-8">
<title>V8 Engine</title>
<style>
    body { margin: 0; overflow: hidden; background: #0a0a10; }
    #ui {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 10;
        color: white;
        font-family: sans-serif;
    }
    #ui button, #ui select {
        margin: 2px;
        padding: 5px 10px;
        background: #333;
        border: 1px solid #555;
        color: white;
        cursor: pointer;
        font-size: 12px;
    }
    #speed {
        color: orange;
        font-weight: bold;
    }
    #highlighted {
        color: yellow;
        font-weight: bold;
    }
</style>
</head>
<body>
<div id="ui">
    <div id="status">RPM: <span id="rpmVal">0</span> | Speed: <span id="speed">1x</span> | Cylinder: <span id="highlighted">-</span></div>
    <br>
    <button onclick="setRPM(0)">STOP</button>
    <button onclick="setRPM(700)">IDLE</button>
    <button onclick="setRPM(2000)">2K</button>
    <button onclick="setRPM(4000)">4K</button>
    <button onclick="setRPM(6000)">6K</button>
    <button onclick="setRPM(8000)">8K</button>
    <button onclick="toggleSlowMo()">SLO-MO</button>
    <button onclick="normalSpeed()">NORMAL</button>
    <br>
    <select onchange="setCrankAngle(this.value)">
        <option value="0">CRANK 0°</option>
        <option value="90">90°</option>
        <option value="180">180°</option>
        <option value="270">270°</option>
        <option value="360">360°</option>
        <option value="540">540°</option>
        <option value="720">720°</option>
    </select>
    <br>
    <select onchange="toggleComponent(this.value)">
        <option value="">Show All</option>
        <option value="cylinder">Inspect Cylinder 1-8</option>
        <option value="pistons">Pistons</option>
        <option value="rods">Rods</option>
        <option value="block">Block</option>
        <option value="crankshaft">Crankshaft</option>
        <option value="camshaft">Camshaft</option>
        <option value="valves">Valves</option>
        <option value="intake">Intake</option>
        <option value="exhaust">Exhaust</option>
        <option value="timing">Timing</option>
        <option value="flywheel">Flywheel</option>
    </select>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/controls/OrbitControls.js';

const canvas = document.createElement('canvas');
document.body.appendChild(canvas);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a10);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(10, 7, 10);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 5;

// Engine Configuration
const CONFIG = {
    bore: 1,
    stroke: 2,
    rodLength: 2.2,
    crankRadius: 1,
    vAngle: 45 * Math.PI / 180, // 45 degrees between each bank
    bankCount: 2,
    cylinderCount: 8,
    firingOrder: [1,8,4,3,6,5,7,2],
    rpm: 0,
    crankAngle: 0,
    paused: false,
    manualAngle: false,
    exploded: false,
    speed: 1,
    highlightCylinder: 0,
    visible: {
        pistons: true,
        rods: true,
        block: true,
        crankshaft: true,
        camshaft: true,
        valves: true,
        intake: true,
        exhaust: true,
        timing: true,
        components: "all"
    }
};

// Geometry Constants
const RADS_PER_REV = 2 * Math.PI;
const RADS_PER_DEG = Math.PI / 180;
const TDC_ANGLE = 0;
const BORE_TO_STROKE_RATIO = CONFIG.bore / CONFIG.stroke;

// Materials
const materialCastIron = new THREE.MeshStandardMaterial({ 
    color: 0x3a3a3a, 
    roughness: 0.9,
    metalness: 0.1,
    envMapIntensity: 0.5
});

const materialAluminum = new THREE.MeshStandardMaterial({ 
    color: 0xc0c0c0, 
    roughness: 0.3,
    metalness: 0.8,
    envMapIntensity: 0.8
});

const materialSteel = new THREE.MeshStandardMaterial({ 
    color: 0x555555, 
    roughness: 0.6,
    metalness: 0.7,
    envMapIntensity: 0.7
});

const materialFlywheel = new THREE.MeshStandardMaterial({ 
    color: 0x222222, 
    roughness: 0.4,
    metalness: 0.9,
    envMapIntensity: 0.8
});

const materialValve = new THREE.MeshStandardMaterial({ 
    color: 0xaaaaaa, 
    roughness: 0.5,
    metalness: 0.9,
    envMapIntensity: 0.9
});

// Helper class for the entire engine
class Engine {
    constructor() {
        this.group = new THREE.Group();
        this.cylinders = [];
        this.camshafts = [];
        this.flywheel = new Flywheel();
        this.timingSystem = new TimingSystem();
        this.block = new Block();
        this.intake = new Intake();
        this.exhaust = new Exhaust();
        
        this.group.add(this.block.group);
        this.group.add(this.flywheel.group);
        this.group.add(this.timingSystem.group);
        this.group.add(this.intake.group);
        this.group.add(this.exhaust.group);
        
        // Create cylinders
        for (let i = 0; i < CONFIG.cylinderCount; i++) {
            this.cylinders.push(new Cylinder(i));
        }
        
        // Create camshafts
        this.createCamshafts();
        
        scene.add(this.group);
    }
    
    createCamshafts() {
        // Left camshaft (exhaust)
        const camLeft = new THREE.Group();
        camLeft.add(new THREE.Mesh(
            new THREE.CylinderGeometry(0.08, 0.08, 0.1, 16),
            materialFlywheel
        ));
        
        // Right camshaft (intake)
        const camRight = new THREE.Group();
        camRight.add(new THREE.Mesh(
            new THREE.CylinderGeometry(0.08, 0.08, 0.1, 16),
            materialFlywheel
        ));
        
        this.camshafts.push(camLeft, camRight);
        camLeft.position.set(-0.5, 1.3, 0);
        camRight.position.set(0.5, 1.3, 0);
        camRight.rotation.y = Math.PI;
        
        this.group.add(camLeft, camRight);
    }
}

class Cylinder {
    constructor(cylinderIndex) {
        this.index = cylinderIndex;
        this.bank = cylinderIndex < 4 ? 0 : 1;
        this.positionInBank = this.bank === 0 ? cylinderIndex : cylinderIndex - 4;
        this.phaseDeg = (CONFIG.firingOrder.indexOf(this.index + 1) * 90) % 360;
        this.group = new THREE.Group();
        
        // Block
        const blockGeometry = new THREE.BoxGeometry(0.08, 0.4, 0.08);
        this.block = new THREE.Mesh(blockGeometry, materialCastIron);
        this.block.position.set(this.bank * 0.9, 0.2, 0);
        this.group.add(this.block);
        
        // Piston
        this.piston = new Piston(this.bank);
        this.piston.group.scale.set(CONFIG.bore / 2, CONFIG.stroke / 2, CONFIG.bore / 2);
        this.group.add(this.piston.group);
        
        // Connecting Rod
        this.rod = new ConnectingRod();
        this.group.add(this.rod.group);
        
        // Valves
        this.intakeValve = new Valve(1);
        this.exhaustValve = new Valve(-1);
        this.group.add(this.intakeValve.group, this.exhaustValve.group);
        
        scene.add(this.group);
    }
    
    update(crankAngle, rpm) {
        const angle = (crankAngle * RADS_PER_DEG) + (this.phaseDeg * RADS_PER_DEG);
        const crankRad = CONFIG.crankRadius;
        const rodLen = CONFIG.rodLength;
        
        const cosT = Math.cos(angle);
        const sinT = Math.sin(angle);
        const rsinT = crankRad * sinT;
        
        // Crank Position (for connecting rod)
        const journalX = -crankRad * cosT;
        const journalZ = Math.sin(-angle) * crankRad; // Negative because of rotation direction
        
        // Piston position (along Y for this bank)
        const y = crankRad * cosT + Math.sqrt(rodLen * rodLen - rsinT * rsinT);
        
        // Update piston position
        this.piston.group.position.y = y;
        
        // Update rod
        const wristX = 0;
        const wristZ = 0;
        this.rod.update(journalX, 0, journalZ, wristX, y, wristZ);
        
        // Update valves
        const cycleAngle = (angle * 180 / Math.PI) % 720;
        
        // Intake: 0-180°C (0-180°)
        if (cycleAngle >= 0 && cycleAngle < 180) {
            this.intakeValve.open(0.4);
            this.exhaustValve.close();
        }
        // Compression: 180-360°
        else if (cycleAngle >= 180 && cycleAngle < 360) {
            this.intakeValve.close();
            this.exhaustValve.close();
        }
        // Power: 360-540°
        else if (cycleAngle >= 360 && cycleAngle < 540) {
            this.intakeValve.close();
            this.exhaustValve.close();
        }
        // Exhaust: 540-720°
        else {
            this.intakeValve.close();
            this.exhaustValve.open(0.3);
        }
    }
}

class Piston {
    constructor(bank) {
        this.group = new THREE.Group();
        this.group.position.x = (bank === 0 ? -0.5 : 0.5);
        
        // Piston crown
        const crownGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.1, 8);
        const crown = new THREE.Mesh(crownGeo, materialAluminum);
        this.group.add(crown);
        
        // Piston skirt
        const skirtGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.8, 12);
        const skirt = new THREE.Mesh(skirtGeo, materialCastIron);
        this.group.add(skirt);
        
        // Wrist pin
        const pinGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.2, 6);
        const pin = new THREE.Mesh(pinGeo, materialSteel);
        pin.position.y = -0.4;
        this.group.add(pin);
    }
}

class ConnectingRod {
    constructor() {
        this.group = new THREE.Group();
        
        const rodGeo = new THREE.BufferGeometry();
        const points = [
            new THREE.Vector3(-0.04, 0, 0),
            new THREE.Vector3(0.04, 0, 0)
        ];
        rodGeo.setFromPoints(points);
        
        this.material = new THREE.LineBasicMaterial({ color: 0x888888 });
        const line = new THREE.Line(rodGeo, this.material);
        this.group.add(line);
        
        // Coupler
        const couplerGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.2, 8);
        const coupler = new THREE.Mesh(couplerGeo, materialSteel);
        this.group.add(coupler);
    }
    
    update(journalX, journalY, journalZ, wristX, wristY, wristZ) {
        const dx = wristX - journalX;
        const dy = wristY - journalY;
        const dz = wristZ - journalZ;
        
        const length = Math.sqrt(dx*dx + dy*dy + dz*dz);
        
        const dirX = dx / length;
        const dirY = dy / length;
        const dirZ = dz / length;
        
        const midX = journalX + (dx / 2);
        const midY = journalY + (dy / 2);
        const midZ = journalZ + (dz / 2);
        
        this.group.position.set(midX, midY, midZ);
        
        const rotation = new THREE.Euler();
        rotation.setFromVector3(new THREE.Vector3(dirZ, dirY, -dirX));
        this.group.rotation.x = rotation.x;
        this.group.rotation.y = rotation.y;
        this.group.rotation.z = rotation.z;
    }
}

class Valve {
    constructor(direction) {
        this.direction = direction;
        this.group = new THREE.Group();
        
        // Valve stem
        const stemGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.5, 6);
        this.stem = new THREE.Mesh(stemGeo, materialValve);
        this.stem.castShadow = true;
        this.group.add(this.stem);
        
        // Valve head
        const headGeo = new THREE.SphereGeometry(0.1, 8, 8);
        this.head = new THREE.Mesh(headGeo, materialValve);
        this.head.position.y = 0.3;
        this.head.castShadow = true;
        this.group.add(this.head);
        
        // Valve spring
        const springGeo = new THREE.TubeGeometry(
            new THREE.CatmullRomCurve3([
                new THREE.Vector3(0.1, 0, 0),
                new THREE.Vector3(0.1, 0.3, 0),
                new THREE.Vector3(0.1, 0.6, 0),
                new THREE.Vector3(0.1, 0.9, 0),
                new THREE.Vector3(0.1, 1.2, 0)
            ]),
            8, 0.01, 8, false
        );
        this.spring = new THREE.Mesh(springGeo, materialValve);
        this.spring.rotation.z = Math.PI / 2;
        this.spring.position.y = 0.35;
        this.group.add(this.spring);
        
        // Position based on cylinder and valve type
        this.group.position.x = (direction > 0 ? 0.7 : -0.7);
        this.group.position.y = 0.8;
        this.group.position.z = 0.2;
        this.group.rotation.z = -Math.PI / 2;
    }
    
    open(max) {
        this.stem.scale.y = 1 + max * 2;
        this.head.position.y = 0.3 + max * 0.4;
        this.spring.scale.y = 1 + max * 0.5;
    }
    
    close() {
        this.stem.scale.y = 1;
        this.head.position.y = 0.3;
        this.spring.scale.y = 1;
    }
}

class Block {
    constructor() {
        this.group = new THREE.Group();
        
        // Main block
        const blockGeo = new THREE.BoxGeometry(2.5, 1.5, 1.5);
        const block = new THREE.Mesh(blockGeo, materialCastIron);
        block.position.set(0, -CONFIG.stroke / 4, 0);
        this.group.add(block);
        
        // Cylinder bores
        for (let i = 0; i < 4; i++) {
            const leftBore = new THREE.Mesh(
                new THREE.CylinderGeometry(0.1, 0.1, 1.5, 12),
                new THREE.MeshBasicMaterial({ color: 0x550000, depthWrite: false })
            );
            leftBore.position.set(-0.7, 0, i * 0.35 - 0.525);
            this.group.add(leftBore);
            
            const rightBore = new THREE.Mesh(
                new THREE.CylinderGeometry(0.1, 0.1, 1.5, 12),
                new THREE.MeshBasicMaterial({ color: 0x550000, depthWrite: false })
            );
            rightBore.position.set(0.7, 0, i * 0.35 - 0.525);
            this.group.add(rightBore);
        }
        
        // Main bearing
        const mainBearingGeo = new THREE.CylinderGeometry(0.25, 0.25, 1.5, 16);
        const mainBearing = new THREE.Mesh(mainBearingGeo, materialSteel);
        mainBearing.rotation.x = Math.PI / 2;
        this.group.add(mainBearing);
    }
}

class Crankshaft {
    constructor() {
        this.group = new THREE.Group();
        const cranksGeo = new THREE.CylinderGeometry(0.1, 0.1, 2, 16);
        const crankshaft = new THREE.Mesh(cranksGeo, materialSteel);
        this.group.add(crankshaft);
    }
    
    update(angle) {
        this.group.rotation.z = -angle * RADS_PER_DEG;
    }
}

class TimingSystem {
    constructor() {
        this.group = new THREE.Group();
        
        // Crank gear
        const crankGearGeo = new THREE.RingGeometry(0.3, 0.35, 32);
        const crankGear = new THREE.Mesh(crankGearGeo, materialSteel);
        this.group.add(crankGear);
        
        // Cam gear
        const camGearGeo = new THREE.RingGeometry(0.68, 0.7, 32);
        const camGear = new THREE.Mesh(camGearGeo, materialSteel);
        camGear.rotation.y = Math.PI;
        this.group.add(camGear);
    }
    
    update(angle) {
        this.group.rotation.z = -angle * RADS_PER_DEG;
    }
}

class Flywheel {
    constructor() {
        this.group = new THREE.Group();
        
        const flywheelGeo = new THREE.CylinderGeometry(1.0, 1.0, 0.2, 32);
        const flywheel = new THREE.Mesh(flywheelGeo, materialFlywheel);
        this.group.add(flywheel);
        
        // Teeth
        const toothGeo = new THREE.BoxGeometry(0.08, 0.15, 0.06);
        for (let i = 0; i < 24; i++) {
            const tooth = new THREE.Mesh(toothGeo, materialFlywheel);
            tooth.rotation.y = i * (Math.PI * 2 / 24);
            tooth.position.set(0.95 * Math.cos(tooth.rotation.y), 0, 0.95 * Math.sin(tooth.rotation.y));
            this.group.add(tooth);
        }
        
        this.group.rotation.z = 0;
    }
}

class Intake {
    constructor() {
        this.group = new THREE.Group();
        
        const runnerGeo = new THREE.CylinderGeometry(0.1, 0.1, 1.5, 8);
        const runner = new THREE.Mesh(runnerGeo, materialAluminum);
        runner.position.set(-0.5, 0.6, 0);
        runner.rotation.z = Math.PI / 4;
        this.group.add(runner);
    }
}

class Exhaust {
    constructor() {
        this.group = new THREE.Group();
        
        const headerGeo = new THREE.CylinderGeometry(0.15, 0.15, 2, 8);
        const header = new THREE.Mesh(headerGeo, materialCastIron);
        header.position.set(0.9, 0.3, 0);
        header.rotation.z = -Math.PI / 6;
        this.group.add(header);
    }
}

// Initialize engine components
const engine = new Engine();
const crankshaft = new Crankshaft();
engine.group.add(crankshaft.group);
const timing = new TimingSystem();
engine.group.add(timing.group);

// Lighting
const ambient = new THREE.AmbientLight(0x404040);
scene.add(ambient);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(10, 20, 10);
scene.add(dirLight);

// Ground
const grid = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
grid.position.y = -CONFIG.stroke / 2 - 0.1;
scene.add(grid);

// Animation loop
let lastTime = 0;
let manualMode = false;

function animate(time) {
    requestAnimationFrame(animate);
    const delta = (time - lastTime) / 1000;
    lastTime = time;
    
    if (!CONFIG.paused) {
        if (manualMode) {
            const speedFactor = CONFIG.speed;
            CONFIG.crankAngle += RADS_PER_DEG * (CONFIG.rpm / 60) * delta * 1000 * speedFactor;
        } else {
            const rpm = CONFIG.rpm;
            if (rpm > 0) {
                const deltaAngle = (rpm / 60) * RADS_PER_DEG * delta * 1000 * CONFIG.speed;
                CONFIG.crankAngle = (CONFIG.crankAngle + deltaAngle) % 360;
            }
        }
    }
    
    // Update all components
    const angle = CONFIG.crankAngle;
    
    engine.cylinders.forEach(c => c.update(angle, CONFIG.rpm));
    crankshaft.update(angle);
    timing.update(angle);
    
    // Handle visibility groups
    const showComponents = CONFIG.visible.components;
    
    engine.block.group.visible = showComponents === 'all' || showComponents === 'block';
    engine.flywheel.group.visible = showComponents === 'all' || showComponents === 'flywheel';
    engine.timingSystem.group.visible = showComponents === 'all' || showComponents === 'timing';
    engine.intake.group.visible = showComponents === 'all' || showComponents === 'intake';
    engine.exhaust.group.visible = showComponents === 'all' || showComponents === 'exhaust';
    
    // Cylinder visibility
    engine.cylinders.forEach(c => {
        c.group.visible = showComponents === 'all' || showComponents === 'cylinder' || showComponents === `cylinder${c.index+1}`;
    });
    
    controls.update();
    renderer.render(scene, camera);
}

// UI Functions
function setRPM(rpm) {
    CONFIG.rpm = rpm;
    CONFIG.crankAngle = 0;
    document.getElementById('rpmVal').textContent = rpm;
}

function toggleSlowMo() {
    CONFIG.speed = 0.25;
    document.getElementById('speed').textContent = '0.25x';
}

function normalSpeed() {
    CONFIG.speed = 1;
    document.getElementById('speed').textContent = '1x';
}

function setCrankAngle(deg) {
    const angle = parseFloat(deg);
    CONFIG.crankAngle = angle;
    CONFIG.manualMode = true;
}

function toggleComponent(path) {
    CONFIG.visible.components = path;
    document.getElementById('highlighted').textContent = CONFIG.highlightCylinder ? `Cylinder ${CONFIG.highlightCylinder}` : '-';
}

// Event listeners
window.addEventListener('resize', () => {
    const w = window.innerWidth;
    const h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
});

document.getElementById('speed').textContent = '1x';
document.getElementById('highlighted').textContent = '-';
setRPM(700);

animate(0);
</script>
</body>
</html>
