    const p = points;
    const mid = (i, j) => [(p[i][0] + p[j][0]) / 2, (p[i][1] + p[j][1]) / 2];
    let d = `M ${mid(p.length - 1, 0)[0]} ${mid(p.length - 1, 0)[1]}`;
    for (let i = 0; i < p.length; i++) {
      const j = (i + 1) % p.length;
      const m = mid(i, j);
      d += ` Q ${p[i][0]} ${p[i][1]} ${m[0]} ${m[1]}`;
    }
    return d + " Z";
  }
  function getConfig(configs, f) {
    f = clamp(f, 0, configs.length - 1);
    const i = Math.floor(f), j = Math.min(i + 1, configs.length - 1), t = f - i;
    return configs[i].map((p, k) => [lerp(p[0], configs[j][k][0], t), lerp(p[1], configs[j][k][1], t)]);
  }

  function setText(index) {
    if (index === lastChapter) return;
    lastChapter = index;
    const ch = chapters[index];
    $("chapterKicker").textContent = `CHAPTER ${String(index + 1).padStart(2, "0")} / 19`;
    $("chapterTitle").textContent = ch.title;
    $("chapterDate").textContent = ch.date;
    const caption = $("chapterCaption");
    while (caption.firstChild) caption.removeChild(caption.firstChild);
    ch.caption.forEach((line, i) => {
      const t = document.createElementNS(NS, "tspan");
      t.setAttribute("x", "92");
      t.setAttribute("dy", i === 0 ? "0" : "27");
      t.textContent = line;
      caption.appendChild(t);
    });
    $("dateReadout").textContent = ch.date;
  }

  function sceneOpacity(index, local) {
    return smooth(0, .12, local) * (1 - smooth(.84, 1, local));
  }

  function updateScene(index, local) {
    for (let i = 0; i < sceneIds.length; i++) {
      const op = i === index ? sceneOpacity(index, local) : 0;
      sceneIds[i].setAttribute("opacity", op.toFixed(3));
    }
    const commonX = Math.sin(ambientTime * .4) * 4;
    $("clouds").setAttribute("transform", `translate(${commonX + 14} 0)`);
    $("rain").setAttribute("transform", `translate(${fract(ambientTime * .2) * -70} 0)`);
    $("steam").setAttribute("transform", `translate(${Math.sin(ambientTime * .8) * 8} ${Math.sin(ambientTime) * 4})`);
    $("birds").setAttribute("transform", `translate(${Math.sin(ambientTime * .15) * 35} ${Math.sin(ambientTime * .3) * 10})`);

    if (index === 0) {
      const approach = smooth(.08, .68, local);
      const x = lerp(1370, 930, approach), y = lerp(115, 360, approach);
      $("theia").setAttribute("cx", x); $("theia").setAttribute("cy", y);
      $("theiaGlow").setAttribute("cx", x); $("theiaGlow").setAttribute("cy", y);
      $("debris").setAttribute("transform", `translate(${-approach * 230} ${approach * 95}) rotate(${-approach * 18} 1300 180)`);
      $("formationFlash").setAttribute("opacity", Math.max(0, 1 - Math.abs(local - .72) * 7));
      $("formationRing").setAttribute("opacity", smooth(.6, .72, local) * (1 - smooth(.72, .98, local)));
      $("formationRing").setAttribute("r", lerp(65, 370, smooth(.62, .95, local)));
    }
    if (index === 1) {
      $("rain").setAttribute("transform", `translate(${fract(ambientTime * .32) * -100} 0)`);
    }
    if (index === 3) {
      $("oxygenBubbles").setAttribute("transform", `translate(0 ${Math.sin(ambientTime * 1.2) * 12})`);
    }
    if (index === 7) {
      $("dinoA").setAttribute("transform", `translate(${650 + Math.sin(ambientTime * .3) * 12} ${585 + Math.sin(ambientTime * .6) * 3}) scale(1.15)`);
      $("dinoB").setAttribute("transform", `translate(${1010 + Math.sin(ambientTime * .25 + 2) * 10} 605) scale(.8)`);
    }
    if (index === 8) {
      const hit = smooth(.18, .48, local);
      const ax = lerp(1390, 980, hit), ay = lerp(70, 330, hit);
      $("asteroid").setAttribute("cx", ax); $("asteroid").setAttribute("cy", ay);
      $("impactHalo").setAttribute("opacity", smooth(.35, .5, local) * (1 - smooth(.62, 1, local)));
      $("impactHalo").setAttribute("r", lerp(80, 310, smooth(.4, .8, local)));
      $("shockRing").setAttribute("opacity", smooth(.4, .48, local) * (1 - smooth(.48, 1, local)));
      $("shockRing").setAttribute("r", lerp(20, 430, smooth(.4, .9, local)));
    }
    if (index === 15) {
      $("ship").setAttribute("transform", `translate(${980 + Math.sin(ambientTime * .25) * 42} ${560 + Math.sin(ambientTime * .5) * 5})`);
    }
    if (index === 16) {
      $("smoke").setAttribute("transform", `translate(${Math.sin(ambientTime * .4) * 12} ${-fract(ambientTime * .12) * 70})`);
    }
    if (index === 17) {
      const flight = fract(ambientTime * .08);
      $("airplane").setAttribute("transform", `translate(${330 + flight * 920} ${390 - Math.sin(flight * Math.PI) * 100}) scale(${.8 + flight * .25})`);
    }
    if (index === 18) {
      $("network").setAttribute("opacity", .45 + Math.sin(ambientTime * 2) * .15);
    }
  }

  function updateEarth(index, local) {
    const configF = [0,0,1,1,1,2,2.3,3,4,4.3,4.5,4.7,4.8,4.9,5,5,5,5,5][index];
    $("landMorph").setAttribute("d", smoothClosed(getConfig(landConfigs, configF)));
    $("islandMorph").setAttribute("d", smoothClosed(getConfig(islandConfigs, configF)));
    $("landMorph").setAttribute("opacity", lerp(.22, 1, clamp(configF / 2)));
    const impactShake = index === 8 ? Math.max(0, 1 - Math.abs(local - .5) * 7) * Math.sin(ambientTime * 40) * 7 : 0;
    const zoom = index >= 10 ? 1.015 : 1;
    $("planet").setAttribute("transform", `translate(${800 + impactShake} ${430}) scale(${zoom}) translate(-800 -430)`);
  }

  function makeParticleGroup(groupId, count, fill, sizeRange) {
    const group = $(groupId);
    for (let i = 0; i < count; i++) {
      const el = document.createElementNS(NS, "circle");
      el.setAttribute("cx", 0); el.setAttribute("cy", 0);
      el.setAttribute("r", lerp(sizeRange[0], sizeRange[1], fract(Math.sin(i * 91.17) * 43758.54)));
      el.setAttribute("fill", fill);
      el.dataset.seed = i;
      group.appendChild(el);
    }
  }
  makeParticleGroup("stars", 42, "#e8f7ff", [.7, 2.1]);
  makeParticleGroup("snow", 40, "#ffffff", [1.4, 3.5]);
  makeParticleGroup("embers", 20, "#ffad45", [1.2, 4.2]);
  makeParticleGroup("dataBits", 24, "#65eaff", [1.3, 3.1]);

  const starEls = Array.from($("stars").children);
  starEls.forEach((el, i) => {
    const s1 = fract(Math.sin(i * 13.7) * 8234.31);
    const s2 = fract(Math.sin(i * 77.13 + 2) * 3421.9);
    el.setAttribute("cx", 60 + s1 * 1480);
    el.setAttribute("cy", 35 + s2 * 470);
  });
  const snowEls = Array.from($("snow").children);
  snowEls.forEach(el => {
    el.dataset.x = fract(Math.sin(Number(el.dataset.seed + 1) * 19.1) * 1872) * 1500 + 50;
    el.dataset.s = .45 + fract(Math.sin(Number(el.dataset.seed + 4) * 5.2) * .7);
  });
  const emberEls = Array.from($("embers").children);
  emberEls.forEach(el => {
    el.dataset.x = 430 + fract(Math.sin(Number(el.dataset.seed + 2) * 31.7) * 7560) * 770;
    el.dataset.s = .7 + fract(Math.sin(Number(el.dataset.seed + 7) * 4.4) * 1.2);
  });
  const dataEls = Array.from($("dataBits").children);
  dataEls.forEach((el, i) => {
    el.dataset.x = 390 + fract(Math.sin(i * 24.1) * 4221) * 850;
    el.dataset.s = .7 + fract(Math.sin(i * 8.3) * 2300) * 1.5;
  });
  const birdsGroup = $("birds");
  for (let i = 0; i < 7; i++) {
    const bird = document.createElementNS(NS, "g");
    const use = document.createElementNS(NS, "use");
    use.setAttribute("href", "#bird");
    use.setAttribute("transform", `scale(${.35 + i * .04})`);
    bird.appendChild(use);
    bird.dataset.x = 470 + i * 78;
    bird.dataset.y = 250 + (i % 3) * 38;
    birdsGroup.appendChild(bird);
  }

  function updateParticles(index) {
    const starOpacity = index === 18 ? .95 : index === 4 ? .3 : .05;
    $("stars").setAttribute("opacity", starOpacity);
    $("snow").setAttribute("opacity", index === 4 ? .9 : index === 5 ? .18 : 0);
    $("embers").setAttribute("opacity", index < 2 ? .75 : index === 2 ? .12 : 0);
    $("dataBits").setAttribute("opacity", index === 18 ? .9 : 0);
    snowEls.forEach(el => {
      const x = Number(el.dataset.x) + Math.sin(ambientTime * .7 + Number(el.dataset.seed)) * 18;
      const y = fract(Number(el.dataset.seed) * .137 + ambientTime * Number(el.dataset.s) * .07) * 430;
      el.setAttribute("transform", `translate(${x} ${y})`);
    });
    emberEls.forEach(el => {
      const y = 710 - fract(Number(el.dataset.seed) * .193 + ambientTime * Number(el.dataset.s) * .08) * 560;
      const x = Number(el.dataset.x) + Math.sin(ambientTime * 1.4 + Number(el.dataset.seed)) * 24;
      el.setAttribute("transform", `translate(${x} ${y})`);
    });
    dataEls.forEach((el, i) => {
      const y = 690 - fract(Number(el.dataset.seed) * .217 + ambientTime * Number(el.dataset.s) * .12) * 330;
      const x = Number(el.dataset.x) + Math.sin(ambientTime * 1.2 + i) * 12;
      el.setAttribute("transform", `translate(${x} ${y})`);
    });
    Array.from(birdsGroup.children).forEach((bird, i) => {
      const x = Number(bird.dataset.x) + ambientTime * (8 + i) % 620;
      const wrapped = 420 + ((x - 420) % 720);
      bird.setAttribute("transform", `translate(${wrapped} ${Number(bird.dataset.y) + Math.sin(ambientTime * 2 + i) * 5})`);
    });
  }

  function buildTicks() {
    const ticks = $("ticks");
    chapters.forEach((ch, i) => {
      const x = xAt(tickPositions[i]);
      const g = document.createElementNS(NS, "g");
      g.setAttribute("class", "interactive");
      g.setAttribute("role", "button");
      g.setAttribute("tabindex", "0");
      g.setAttribute("aria-label", `Jump to ${ch.title}`);
      const line = document.createElementNS(NS, "line");
      line.setAttribute("x1", x); line.setAttribute("x2", x);
      line.setAttribute("y1", "748"); line.setAttribute("y2", "768");
      line.setAttribute("stroke", "#d7e4df"); line.setAttribute("stroke-width", "2");
      const dot = document.createElementNS(NS, "circle");
      dot.setAttribute("cx", x); dot.setAttribute("cy", "757.5"); dot.setAttribute("r", "5");
      dot.setAttribute("fill", i === 18 ? "#fff1a8" : "#a8c3c7");
      const hit = document.createElementNS(NS, "circle");
      hit.setAttribute("cx", x); hit.setAttribute("cy", "757.5"); hit.setAttribute("r", "13");
      hit.setAttribute("fill", "transparent");
      const title = document.createElementNS(NS, "title");
      title.textContent = `${ch.title} — ${ch.date}`;
      g.append(line, dot, hit, title);
      const jump = event => { event.stopPropagation(); seekTo(i * chapterDuration + .01); };
      g.addEventListener("pointerdown", jump);
      g.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") { event.preventDefault(); jump(event); }
      });
      ticks.appendChild(g);
    });
  }
  buildTicks();

  function updatePlayhead(index, local) {
    const next = index < chapters.length - 1 ? tickPositions[index + 1] : 1;
    const p = lerp(tickPositions[index], next, local);
    const x = xAt(p);
    $("playheadLine").setAttribute("x1", x); $("playheadLine").setAttribute("x2", x);
    $("playheadCap").setAttribute("transform", `translate(${x - 70} 0)`);
  }

  function updatePlayIcon() {
    $("pauseIcon").setAttribute("opacity", playing ? 1 : 0);
    $("playIcon").setAttribute("opacity", playing ? 0 : 1);
    $("playButton").setAttribute("aria-label", playing ? "Pause" : "Play");
  }
  function togglePlay() { playing = !playing; updatePlayIcon(); }
  function changeSpeed() {
    speed = speed === .5 ? 1 : speed === 1 ? 2 : .5;
    $("speedText").textContent = `${speed}×`;
  }
  function restart() { playTime = 0; lastChapter = -1; setText(0); }
  function jumpChapter(dir) {
    const index = Math.floor(playTime / chapterDuration);
    let target = dir < 0 ? index - 1 : index + 1;
    if (target < 0) target = 0;
    if (target >= chapters.length) target = chapters.length - 1;
    seekTo(target * chapterDuration + .01);
  }
  function seekTo(time) {
    playTime = clamp(time, 0, totalDuration - .001);
    lastChapter = -1;
  }

  function seekFromPointer(event) {
    const pt = svg.createSVGPoint();
    pt.x = event.clientX; pt.y = event.clientY;
    const local = pt.matrixTransform(svg.getScreenCTM().inverse());
    const p = clamp((local.x - 70) / 1460);
    let i = 0;
    while (i < tickPositions.length - 2 && p > tickPositions[i + 1]) i++;
    const next = i < chapters.length - 1 ? tickPositions[i + 1] : 1;
    const localP = i < chapters.length - 1 ? clamp((p - tickPositions[i]) / (next - tickPositions[i])) : 1;
    seekTo((i + localP) * chapterDuration);
  }

  $("timelineHit").addEventListener("pointerdown", event => {
    event.preventDefault();
    dragging = true;
    $("timelineHit").setPointerCapture(event.pointerId);
    seekFromPointer(event);
  });
  $("timelineHit").addEventListener("pointermove", event => { if (dragging) seekFromPointer(event); });
  $("timelineHit").addEventListener("pointerup", event => {
    dragging = false;
    if ($("timelineHit").hasPointerCapture(event.pointerId)) $("timelineHit").releasePointerCapture(event.pointerId);
  });
  $("timelineHit").addEventListener("pointercancel", () => { dragging = false; });

  $("playButton").addEventListener("click", togglePlay);
  $("restartButton").addEventListener("click", restart);
  $("speedButton").addEventListener("click", changeSpeed);

  function bindButtonKey(id, fn) {
    $(id).addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") { event.preventDefault(); fn(); }
    });
  }
  bindButtonKey("playButton", togglePlay);
  bindButtonKey("restartButton", restart);
  bindButtonKey("speedButton", changeSpeed);

  window.addEventListener("keydown", event => {
    if (event.code === "Space") { event.preventDefault(); togglePlay(); }
    else if (event.key === "ArrowRight") { event.preventDefault(); jumpChapter(1); }
    else if (event.key === "ArrowLeft") { event.preventDefault(); jumpChapter(-1); }
    else if (event.key === "Home") { event.preventDefault(); restart(); }
  });

  function frame(now) {
    const dt = Math.min(.05, (now - lastFrame) / 1000);
    lastFrame = now;
    if (playing && !dragging) {
      playTime += dt * speed;
      ambientTime += dt * speed;
      if (playTime >= totalDuration) {
        playTime %= totalDuration;
        ambientTime = 0;
        lastChapter = -1;
      }
    }
    const chapterFloat = clamp(playTime / chapterDuration, 0, chapters.length - 1);
    const index = Math.min(chapters.length - 1, Math.floor(chapterFloat));
    const local = clamp(chapterFloat - index, 0, 1);
    setText(index);
    updatePalette(index, local);
    updateEarth(index, local);
    updateScene(index, local);
    updateParticles(index);
    updatePlayhead(index, local);
    requestAnimationFrame(frame);
  }

  updatePlayIcon();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
