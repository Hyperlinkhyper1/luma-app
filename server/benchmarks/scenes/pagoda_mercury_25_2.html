<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VOXEL GARDEN</title>
<style>
body, html { margin:0; padding:0; overflow:hidden; background:#000; }
canvas { display:block; }
#hud { position:absolute; top:20px; left:20px; font-family:'Courier New', monospace; color:#fff; text-shadow:0 0 5px rgba(0,0,0,0.5); pointer-events:none; z-index:10; }
h1 { font-size:18px; margin:0 0 5px; text-transform:uppercase; letter-spacing:2px; }
p { font-size:12px; margin:2px 0; opacity:0.8; }
#controls { position:absolute; top:20px; right:20px; z-index:10; pointer-events:auto; }
label { display:block; color:#fff; font-size:12px; margin-bottom:5px; }
input[type=range] { width:150px; }
</style>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="hud">
  <h1>VOXEL GARDEN</h1>
  <p id="stats">Initializing...</p>
  <p>Click lanterns to toggle</p>
</div>
<div id="controls">
  <label>Day/Night Cycle</label>
  <input type="range" id="timeSlider" min="0" max="100" value="20">
  <button id="pauseBtn" style="margin-top:5px; padding:2px 8px;">Pause</button>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const VOXEL_PALETTE = {
  VERMILLION: new THREE.Color('#C73E1D'),
  GOLD: new THREE.Color('#E8B86D'),
  TEAK: new THREE.Color('#4A2C1A'),
  JADE: new THREE.Color('#2D6A4F'),
  JADE_LIGHT: new THREE.Color('#40916C'),
  SAKURA: new THREE.Color('#FFB7C5'),
  SAKURA_DARK: new THREE.Color('#FF8FAB'),
  STONE: new THREE.Color('#9AA0A6'),
  POND: new THREE.Color('#7ED6DF'),
  MOSS: new THREE.Color('#606C38'),
  WHITE: new THREE.Color(0xffffff),
  BROWN: new THREE.Color('#8B4513'),
  BAMBOO: new THREE.Color('#E3D56F')
};

const materials = new Map();
Object.entries(VOXEL_PALETTE).forEach(([k, v]) => {
  materials.set(k, new THREE.MeshStandardMaterial({ color: v, roughness: 0.8, metalness: 0.1 }));
});

const world = new Map(); // color -> [{x,y,z}, ...]

function addVoxel(x, y, z, colorKey) {
  if (!world.has(colorKey)) world.set(colorKey, []);
  world.get(colorKey).push({x,y,z});
}

// --- Scene Setup ---
const scene = new THREE.Scene();
scene.background = new THREE.Color('#222');
scene.fog = new THREE.FogExp2('#222', 0.01);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(60, 30, 60);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.target.set(0, 10, 0);

// --- Lighting ---
const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(50, 80, 50);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
scene.add(sun);

const hemi = new THREE.HemisphereLight(0xccccff, 0x444444, 0.3);
scene.add(hemi);

const lanternLights = [];
for (let i = 0; i < 4; i++) {
  const pl = new THREE.PointLight(0xffaa00, 0, 10);
  pl.position.set(0,0,0);
  scene.add(pl);
  lanternLights.push(pl);
}

// --- Voxel Builder ---

const boxGeo = new THREE.BoxGeometry(1, 1, 1);
const voxelMeshes = [];
world.forEach((positions, key) => {
  const mat = materials.get(key);
  const mesh = new THREE.InstancedMesh(boxGeo, mat, positions.length);
  const dummy = new THREE.Object3D();
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  positions.forEach((p, i) => {
    dummy.position.set(p.x, p.y, p.z);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  });
  scene.add(mesh);
  voxelMeshes.push(mesh);
});

// --- Procedural Generation ---

// Pagoda
function buildPagoda() {
  const baseX = 0, baseZ = 0;
  const groundY = 0;
  
  // Pillars (Vermillion)
  const floorSize = 10;
  const height = 5;
  
  for (let f = 0; f < 5; f++) {
    const floorY = groundY + f * 4;
    const size = floorSize - f;
    
    // Pillars
    for (let px = -1; px <= 1; px++) {
      for (let pz = -1; pz <= 1; pz++) {
        addVoxel(baseX + px*size, floorY, baseZ + pz*size, 'VERMILLION');
        addVoxel(baseX + px*size, floorY+1, baseZ + pz*size, 'VERMILLION');
        addVoxel(baseX + px*size, floorY+2, baseZ + pz*size, 'VERMILLION');
      }
    }
    // Floor Platform
    for (let x = -size; x <= size; x++) {
      for (let z = -size; z <= size; z++) {
         addVoxel(baseX+x, floorY, baseZ+z, 'STONE');
      }
    }
    // Roof
    const roofY = floorY + 3;
    const roofSize = size + 4;
    for (let x = -roofSize; x <= roofSize; x++) {
      for (let z = -roofSize; z <= roofSize; z++) {
        // Curved roof
        const dist = Math.abs(x) + Math.abs(z);
        if (dist <= roofSize + 4) {
          addVoxel(baseX+x, roofY, baseZ+z, 'JADE');
        }
      }
    }
    // Roof Rim
    for (let x = -roofSize; x <= roofSize; x++) {
      addVoxel(baseX+x, roofY, baseZ+roofSize, 'GOLD');
      addVoxel(baseX+x, roofY, baseZ-roofSize, 'GOLD');
    }
    for (let z = -roofSize; z <= roofSize; z++) {
      addVoxel(baseX+roofSize, roofY, baseZ+z, 'GOLD');
      addVoxel(baseX-roofSize, roofY, baseZ+z, 'GOLD');
    }
  }
  // Top Finial
  for (let y=20; y<24; y++) addVoxel(0, y, 0, 'GOLD');
  for (let x=-1; x<=1; x++) for (let z=-1; z<=1; z++) addVoxel(x, 24, z, 'GOLD');
}

// Terrain & Decoration
function buildGarden() {
  // 64x64 Terrain
  const size = 64;
  for (let x = -size/2; x < size/2; x++) {
    for (let z = -size/2; z < size/2; z++) {
      let h = 0;
      if (Math.random() > 0.9) h = 1; // Grass
      else if (Math.random() > 0.95) h = 2; // Moss
      addVoxel(x, 0, z, h === 0 ? 'STONE' : (h===1?'MOSS':'STONE'));
      
      // Pond
      if (Math.abs(x) < 10 && Math.abs(z) < 10) {
         addVoxel(x, 0, z, 'POND');
      }
    }
  }
  
  // Bridge
  for (let i = -5; i < 5; i++) {
    addVoxel(i, 1, 0, 'TEAK');
    addVoxel(i, 2, 0, 'TEAK');
    addVoxel(i, 1, -1, 'TEAK');
    addVoxel(i, 1, 1, 'TEAK');
  }
  
  // Torii Gate
  const toriiX = 25;
  addVoxel(toriiX, 0, 0, 'VERMILLION');
  addVoxel(toriiX, 1, 0, 'VERMILLION');
  addVoxel(toriiX, 2, 0, 'VERMILLION');
  addVoxel(toriiX, 0, 10, 'VERMILLION');
  addVoxel(toriiX, 1, 10, 'VERMILLION');
  addVoxel(toriiX, 2, 10, 'VERMILLION');
  addVoxel(toriiX, 3, 0, 'VERMILLION');
  addVoxel(toriiX, 3, 10, 'VERMILLION');
  addVoxel(toriiX, 3, 0, 'GOLD');
  addVoxel(toriiX, 3, 10, 'GOLD');
  
  // Lanterns
  const lanterns = [
    {x:-10, z:-10}, {x:10, z:-10}, {x:-10, z:10}, {x:10, z:10}
  ];
  lanterns.forEach((l, i) => {
    addVoxel(l.x, 0, l.z, 'STONE');
    addVoxel(l.x, 1, l.z, 'STONE');
    addVoxel(l.x, 2, l.z, 'GOLD');
    addVoxel(l.x, 3, l.z, 'STONE');
    addVoxel(l.x, 4, l.z, 'VERMILLION');
    lanternLights[i].position.set(l.x, 3.5, l.z);
    lanternLights[i].userData = { pos: l, on: true };
  });
  
  // Trees (Simplified Voxel Cones/Cylinders)
  const treeTypes = ['SAKURA', 'TEAK'];
  for(let i=0; i<8; i++) {
    const x = (Math.random()-0.5) * 40;
    const z = (Math.random()-0.5) * 40;
    const color = treeTypes[i%2];
    for (let y=1; y<=5; y++) addVoxel(x, y, z, 'TEAK'); // Trunk
    for (let r=0; r<3; r++) {
      for (let ox=-r; ox<=r; ox++) {
        for (let oz=-r; oz<=r; oz++) {
          addVoxel(x+ox, 5+r, z+oz, color);
        }
      }
    }
  }
}

// Flying Island & Waterfall
function buildFloatingIsland() {
  const fx = -30;
  const fy = 25;
  const fSize = 8;
  
  for (let x = -fSize; x <= fSize; x++) {
    for (let z = -fSize; z <= fSize; z++) {
      // Floating Top
      addVoxel(fx+x, fy, f+z, 'STONE');
      addVoxel(fx+x, fy-1, f+z, 'MOSS');
      
      // Waterfall
      if (x === fSize) {
        for (let y = 0; y > -fy; y -= 1.5) {
          addVoxel(fx+x, fy+y, fz, 'POND');
        }
      }
    }
  }
}

buildPagoda();
buildGarden();
buildFloatingIsland();

// --- Particles (Petals & Birds) ---
const petalGeo = new THREE.PlaneGeometry(0.5, 0.5);
const petalMat = new THREE.MeshBasicMaterial({ color: 0xFFB7C5, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
const petals = new THREE.InstancedMesh(petalGeo, petalMat, 200);
scene.add(petals);
const petalData = [];
for (let i=0; i<200; i++) {
  petalData.push({
    x: (Math.random()-0.5) * 50,
    y: Math.random() * 30,
    z: (Math.random()-0.5) * 50,
    speed: Math.random() * 0.05 + 0.02,
    rotSpeed: Math.random() * 0.02,
    angle: Math.random() * Math.PI * 2
  });
  const d = new THREE.Object3D();
  d.position.set(petalData[i].x, petalData[i].y, petalData[i].z);
  d.rotation.x = petalData[i].angle;
  d.updateMatrix();
  petals.setMatrixAt(i, d.matrix);
}

// --- State & Interaction ---
const statsEl = document.getElementById('stats');
const __VOXEL__ = window.__VOXEL__ = {
  voxelCount: world.get('VERMILLION') ? Object.values(world).reduce((a,b)=>a+b.length,0) : 0,
  fps: 0,
  pagodaFloors: 5,
  timeOfDay: 0.2
};

let clock = new THREE.Clock();
let paused = false;
let dayCycle = 0.2; // 0 to 1

// Intro Camera
let introDone = false;
const startPos = new THREE.Vector3(60, 10, 60);
const targetPos = new THREE.Vector3(20, 15, 20);
camera.position.copy(startPos);

// Controls
document.getElementById('timeSlider').addEventListener('input', e => {
  dayCycle = e.target.value / 100;
});

document.getElementById('pauseBtn').addEventListener('click', e => {
  paused = !paused;
  e.target.innerText = paused ? "Resume" : "Pause";
});

renderer.domElement.addEventListener('click', (e) => {
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  
  // Check lantern click
  const intersects = raycaster.intersectObjects(lanternLights.map(l => l.parent)); // Not ideal, using simple distance check for demo
  // Simplified lantern logic for demo
  lanternLights.forEach((l, i) => {
    if (l.position.distanceTo(raycaster.ray.at(5)) < 2) {
      l.userData.on = !l.userData.on;
      l.intensity = l.userData.on ? 2 : 0;
    }
  });
});

// --- Render Loop ---
let frames = 0;
let lastTime = 0;

function animate() {
  requestAnimationFrame(animate);
  
  const dt = clock.getDelta();
  frames++;
  const now = performance.now();
  if (now - lastTime >= 1000) {
    __VOXEL__.fps = frames;
    statsEl.textContent = `${__VOXEL__.voxelCount} voxels | ${__VOXEL__.fps} FPS`;
    frames = 0;
    lastTime = now;
  }
  
  if (!paused) {
    dayCycle += dt * 0.01; // Auto cycle if slider doesn't override heavily (simplified)
    // Update Sun
    const rad = dayCycle * Math.PI * 2;
    sun.position.set(Math.cos(rad)*100, Math.sin(rad)*100, 0);
    
    // Update Sky/Fog
    const skyColor = new THREE.Color();
    skyColor.setHSL(0.6, 0.5, Math.sin(rad)*0.5+0.1);
    scene.background = skyColor;
    scene.fog.color = skyColor;
    
    // Lantern Flicker
    lanternLights.forEach(l => {
      if(l.userData.on) l.intensity = 1.5 + Math.sin(now * 0.01) * 0.5;
    });
    
    // Particles
    const dummy = new THREE.Object3D();
    for (let i=0; i<200; i++) {
      const p = petalData[i];
      p.y -= p.speed;
      p.x += Math.sin(now * 0.001 + p.angle) * 0.02;
      if (p.y < 0) { p.y = 20; p.x = (Math.random()-0.5)*50; }
      
      dummy.position.set(p.x, p.y, p.z);
      dummy.rotation.y += p.rotSpeed;
      dummy.updateMatrix();
      petals.setMatrixAt(i, dummy.matrix);
    }
    petals.instanceMatrix.needsUpdate = true;
    
    // Camera Intro
    if (!introDone) {
      controls.autoRotate = false;
      camera.position.lerp(targetPos, 0.01);
      if (camera.position.distanceTo(targetPos) < 0.1) introDone = true;
    } else {
      controls.autoRotate = true;
    }
  }
  
  controls.update();
  renderer.render(scene, camera);
}

// Init Stats
statsEl.textContent = `${__VOXEL__.voxelCount} voxels | -- FPS`;
animate();

</script>
</body>
</html>
