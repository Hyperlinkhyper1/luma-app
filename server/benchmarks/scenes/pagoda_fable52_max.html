<!DOCTYPE html>

<head>

<body>
<div id="paper"></div>
<div id="hud">
  <div class="row"><div id="seal">塔</div><div><div id="title">VOXEL GARDEN</div><div id="sub">Spring Festival · Goju-no-To</div></div></div>
  <div id="hudVox">24k voxels | 60 FPS</div>
  <div id="hint">Click lanterns · Click a pagoda floor to open its doors</div>
</div>
<div id="bar">
  <button id="pause" title="Pause the day cycle">❚❚</button>
  <span id="clock">☀ 09:36</span>
  <input id="tod" type="range" min="0" max="24" step="0.01" value="9.6" aria-label="Time of day">
  <span id="lbl">90 s day</span>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------------------------------------------------------------- renderer
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.3, 2600);
const U = { uTime: { value: 0 } };

// ---------------------------------------------------------------- helpers
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function hash2(x, y) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
const hash3 = (x, y, z) => hash2(Math.imul(x | 0, 7919) + Math.imul(z | 0, 104729), Math.imul(y | 0, 31337) - Math.imul(z | 0, 3571));
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fbm = (x, y) => vnoise(x, y) * 0.5 + vnoise(x * 2.1 + 5.2, y * 2.1 + 1.3) * 0.3 + vnoise(x * 4.3 + 9.1, y * 4.3 + 7.7) * 0.2;
function rng(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------------------------------------------------------------- palette
// key -> { hex, kind: std | leaf | glow | water | cloud, rough, metal, amp, emit }
const PAL = {};
const pal = (key, hex, kind = 'std', rough = 0.9, metal = 0, extra = {}) => { PAL[key] = { hex, kind, rough, metal, ...extra }; };
// ground
pal('grass1', '#6F8E3C'); pal('grass2', '#7FA046'); pal('grass3', '#5E7C35'); pal('moss', '#606C38'); pal('mossD', '#4D5A2C');
pal('petalG', '#F2C3CE'); pal('vine', '#4F7A35');
pal('dirt', '#6B4A2E'); pal('dirt2', '#5A3D25');
pal('rock1', '#9C8F7D'); pal('rock2', '#877B6B'); pal('rock3', '#ABA08D'); pal('rock4', '#746A5B'); pal('rockD', '#5C544A');
pal('stone', '#9AA0A6'); pal('stoneL', '#B9BEC2'); pal('stoneD', '#7C828A'); pal('pave', '#C4C0B6'); pal('pave2', '#B2ADA2');
pal('gravel', '#DDD8CB'); pal('gravel2', '#C6C0B1'); pal('sand', '#C2B08B'); pal('pebble', '#8E8679');
// architecture
pal('verm', '#C73E1D', 'std', 0.62); pal('gold', '#E8B86D', 'std', 0.32, 0.75); pal('goldB', '#F6D58E', 'glow', 0.3, 0.6, { emit: '#E8B86D' });
pal('bronze', '#8C6A3F', 'std', 0.45, 0.55); pal('teak', '#4A2C1A', 'std', 0.8); pal('teakL', '#6A4226', 'std', 0.8);
pal('jade1', '#2D6A4F', 'std', 0.5, 0.05); pal('jade2', '#40916C', 'std', 0.5, 0.05); pal('ridge', '#1E4B38', 'std', 0.55); pal('jadeEdge', '#58A57F', 'std', 0.5);
pal('shoji', '#F3E4C4', 'glow', 0.9, 0, { emit: '#FFC46E' });
pal('black', '#2B2522', 'std', 0.7); pal('bamboo1', '#9FB560'); pal('bamboo2', '#C4BA6C'); pal('tie', '#3C2A1A');
pal('jizo', '#B0B4AE'); pal('red', '#B9261C', 'std', 0.8); pal('eye', '#2A2A2A');
pal('plaster', '#EFE6D3', 'std', 0.95);
// festival
pal('chochinR', '#D8432A', 'glow', 0.8, 0, { emit: '#FF7440' }); pal('chochinW', '#F4EBDC', 'glow', 0.85, 0, { emit: '#FFCF8E' });
pal('rope', '#3A2A1E'); pal('straw', '#D6C287'); pal('paper', '#FBFAF4');
pal('noboriR', '#C73E1D', 'leaf', 0.9, 0, { amp: 3 }); pal('noboriW', '#F4EFE6', 'leaf', 0.9, 0, { amp: 3 });
// pond life
pal('lily1', '#4C8A3A'); pal('lily2', '#62A04A'); pal('lotus', '#FF9EB8'); pal('lotusC', '#FFE08A');
for (let i = 0; i < 4; i++) pal('lglow' + i, '#FFE3A6', 'glow', 0.7, 0, { emit: '#FFAF45' });
pal('water', '#7ED6DF', 'water');
// foliage
pal('bark', '#5A3A26'); pal('barkD', '#3F2819');
pal('sak1', '#FFB7C5', 'leaf', 0.85, 0, { amp: 0.8 }); pal('sak2', '#FF8FAB', 'leaf', 0.85, 0, { amp: 0.8 }); pal('sak3', '#FFE5EC', 'leaf', 0.85, 0, { amp: 0.8 });
pal('pine1', '#2F5D3A', 'leaf', 0.9, 0, { amp: 0.3 }); pal('pine2', '#3E7448', 'leaf', 0.9, 0, { amp: 0.3 }); pal('pine3', '#23462C', 'leaf', 0.9, 0, { amp: 0.3 });
pal('maple1', '#A92C25', 'leaf', 0.85, 0, { amp: 0.8 }); pal('maple2', '#D4512A', 'leaf', 0.85, 0, { amp: 0.8 }); pal('maple3', '#E9893A', 'leaf', 0.85, 0, { amp: 0.8 });
pal('willow1', '#9BC25B', 'leaf', 0.85, 0, { amp: 2.2 }); pal('willow2', '#7DA748', 'leaf', 0.85, 0, { amp: 2.2 }); pal('willow3', '#B8D97C', 'leaf', 0.85, 0, { amp: 2.2 });
pal('stem', '#4E7A33'); pal('flC', '#F7D154');
pal('flPink', '#FF8FAB'); pal('flWhite', '#FFF6EE'); pal('flYellow', '#F5C842'); pal('flPurple', '#8E6CC8'); pal('flBlue', '#6F8FDA'); pal('flRed', '#E2463A');
// sky things
pal('cloud', '#FFFFFF', 'cloud', 1); pal('cloudS', '#DCE4F0', 'cloud', 1);
pal('fuji', '#4B5D82', 'std', 1); pal('fujiD', '#3A4868', 'std', 1); pal('snow', '#F2F5FA', 'std', 0.9);

// ---------------------------------------------------------------- materials
const BOX = new THREE.BoxGeometry(1, 1, 1);
const WATER_GEO = new THREE.PlaneGeometry(1, 1, 2, 2).rotateX(-Math.PI / 2).translate(0, 0.2, 0);

function shadeInject(shader, wind) {
  shader.uniforms.uTime = U.uTime;
  shader.vertexShader = shader.vertexShader
    .replace('#include <common>', '#include <common>\nvarying float vShade;\nuniform float uTime;\nuniform float uAmp;')
    .replace('#include <begin_vertex>', `#include <begin_vertex>
      vShade = normal.y > 0.5 ? 1.0 : (normal.y < -0.5 ? 0.78 : mix(0.74, 1.0, clamp(position.y + 0.5, 0.0, 1.0)));
      ${wind ? `
      vec3 ip = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
      float hh = clamp((ip.y - 2.0) / 7.0, 0.0, 1.6);
      float ww = sin(uTime * 1.4 + ip.x * 0.31 + ip.z * 0.23) + 0.45 * sin(uTime * 3.1 + ip.x * 0.9 + ip.y * 0.7);
      transformed.x += ww * 0.07 * hh * uAmp;
      transformed.z += cos(uTime * 1.1 + ip.z * 0.37 + ip.y * 0.2) * 0.045 * hh * uAmp;` : ''}`);
  shader.fragmentShader = shader.fragmentShader
    .replace('#include <common>', '#include <common>\nvarying float vShade;')
    .replace('#include <color_fragment>', '#include <color_fragment>\ndiffuseColor.rgb *= vShade;');
}

const waterMat = new THREE.MeshStandardMaterial({
  color: 0xffffff, roughness: 0.08, metalness: 0.1, transparent: true, opacity: 0.74,
  emissive: '#2a8f9a', emissiveIntensity: 0.18,
});
waterMat.onBeforeCompile = (s) => {
  s.uniforms.uTime = U.uTime;
  s.vertexShader = s.vertexShader
    .replace('#include <common>', '#include <common>\nuniform float uTime;')
    .replace('#include <beginnormal_vertex>', `#include <beginnormal_vertex>
      {
        vec4 wq = instanceMatrix * vec4(position, 1.0);
        float a1 = uTime * 2.2 + wq.x * 1.7 + wq.z * 0.6;
        float a2 = uTime * 3.1 - wq.z * 2.1 + wq.x * 0.4;
        float ddx = 0.0595 * cos(a1) + 0.01 * cos(a2);
        float ddz = 0.021 * cos(a1) - 0.0525 * cos(a2);
        objectNormal = normalize(vec3(-ddx * 3.0, 1.0, -ddz * 3.0));
      }`)
    .replace('#include <begin_vertex>', `#include <begin_vertex>
      {
        vec4 wp0 = instanceMatrix * vec4(transformed, 1.0);
        transformed.y += 0.035 * sin(uTime * 2.2 + wp0.x * 1.7 + wp0.z * 0.6) + 0.025 * sin(uTime * 3.1 - wp0.z * 2.1 + wp0.x * 0.4);
      }`);
};
waterMat.customProgramCacheKey = () => 'vox-water';

const MATS = {};
const GLOW_MATS = {};
const CLOUD_MATS = [];
function mat(key) {
  if (MATS[key]) return MATS[key];
  const p = PAL[key];
  if (p.kind === 'water') return (MATS[key] = waterMat);
  const m = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: p.rough, metalness: p.metal });
  if (p.kind === 'glow') { m.emissive = new THREE.Color(p.emit || p.hex); m.emissiveIntensity = 0.3; GLOW_MATS[key] = m; }
  if (p.kind === 'cloud') { m.emissive = new THREE.Color('#ffffff'); m.emissiveIntensity = 0.25; CLOUD_MATS.push(m); }
  const wind = p.kind === 'leaf';
  m.onBeforeCompile = (s) => { shadeInject(s, wind); s.uniforms.uAmp = { value: p.amp || 0 }; };
  m.customProgramCacheKey = () => (wind ? 'vox-leaf' : 'vox');
  return (MATS[key] = m);
}

// ---------------------------------------------------------------- voxel chunks
// A chunk is a sparse voxel grid at one voxel size. build() drops fully
// enclosed voxels, then emits one InstancedMesh per palette key, with
// per-instance colour carrying neighbour-occupancy AO and a little jitter.
let STATIC_VOXELS = 0;
const CHUNKS = [];
class Chunk {
  // floorY: the chunk stands on ground below this layer, so faces against it are hidden.
  constructor(s = 1, name = '', opts = {}) { this.s = s; this.name = name; this.m = new Map(); this.count = 0; this.floorY = opts.floorY ?? null; }
  k(x, y, z) { return ((x + 1024) * 2048 + (y + 1024)) * 2048 + (z + 1024); }
  set(x, y, z, c) { this.m.set(this.k(x, y, z), [x, y, z, c]); }
  setIfEmpty(x, y, z, c) { const k = this.k(x, y, z); if (!this.m.has(k)) this.m.set(k, [x, y, z, c]); }
  get(x, y, z) { const v = this.m.get(this.k(x, y, z)); return v ? v[3] : undefined; }
  solid(x, y, z) {
    if (this.floorY !== null && y < this.floorY) return true;
    const v = this.m.get(this.k(x, y, z));
    return !!v && PAL[v[3]].kind !== 'water';
  }
  build(opts = {}) {
    const groups = new Map();
    for (const v of this.m.values()) {
      const [x, y, z, c] = v;
      if (PAL[c].kind !== 'water' && this.solid(x + 1, y, z) && this.solid(x - 1, y, z) && this.solid(x, y + 1, z) &&
        this.solid(x, y - 1, z) && this.solid(x, y, z + 1) && this.solid(x, y, z - 1)) continue;
      let arr = groups.get(c);
      if (!arr) groups.set(c, (arr = []));
      arr.push(v);
    }
    const g = new THREE.Group();
    g.name = this.name;
    const s = this.s, M = new THREE.Matrix4(), col = new THREE.Color(), base = new THREE.Color();
    for (const [c, arr] of groups) {
      const p = PAL[c], isW = p.kind === 'water';
      const mesh = new THREE.InstancedMesh(isW ? WATER_GEO : BOX, mat(c), arr.length);
      base.set(p.hex);
      for (let i = 0; i < arr.length; i++) {
        const [x, y, z] = arr[i];
        M.makeScale(s, s, s);
        M.setPosition(x * s, (y + 0.5) * s, z * s);
        mesh.setMatrixAt(i, M);
        let ao = 1;
        if (!isW && p.kind !== 'cloud') {
          // Only what crowds an exposed face darkens it: a voxel with a lid
          // (the cliff and the island's underside) shows its sides and bottom.
          const side = (this.solid(x + 1, y, z) ? 1 : 0) + (this.solid(x - 1, y, z) ? 1 : 0) + (this.solid(x, y, z + 1) ? 1 : 0) + (this.solid(x, y, z - 1) ? 1 : 0);
          if (this.solid(x, y + 1, z)) {
            let below = 0;
            for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) if (this.solid(x + dx, y - 1, z + dz)) below++;
            ao = Math.max(0.7, 1 - side * 0.03 - below * 0.03);
          } else {
            let up = 0;
            for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) if ((dx || dz) && this.solid(x + dx, y + 1, z + dz)) up++;
            ao = Math.max(0.6, 1 - up * 0.045 - side * 0.02);
          }
        }
        const j = isW ? 1 : 0.93 + hash3(x, y, z) * 0.12;
        col.copy(base).multiplyScalar(ao * j);
        mesh.setColorAt(i, col);
      }
      mesh.castShadow = !isW && opts.shadow !== false;
      mesh.receiveShadow = opts.receive !== false;
      mesh.userData.key = c;
      g.add(mesh);
      this.count += arr.length;
    }
    STATIC_VOXELS += this.count;
    CHUNKS.push(this);
    this.group = g;
    return g;
  }
}

// ---------------------------------------------------------------- layout (metres; +z is south, toward the torii)
const PAGODA_Z = -6;
const TREES = [
  { t: 'sakura', x: -15, z: 10, seed: 3 }, { t: 'sakura', x: -21, z: -8, seed: 7 }, { t: 'sakura', x: 21, z: -10, seed: 13 },
  { t: 'pine', x: -20, z: 13, seed: 5 }, { t: 'pine', x: 13, z: -15, seed: 9 },
  { t: 'maple', x: -15, z: -15, seed: 17 }, { t: 'maple', x: 25, z: -3, seed: 19 },
  { t: 'willow', x: 21, z: 6, seed: 23 },
];
const LANTERNS = [{ x: -3.5, z: 2.5, g: 2 }, { x: 3.5, z: 2.5, g: 2 }, { x: -9, z: 16.5, g: 0 }, { x: 8, z: 13, g: 0 }];
const JIZO = [{ x: 5.5, z: 22.6 }, { x: 7.1, z: 22.6 }];
const TORII_Z = 22;
const POND = { x: 16, z: 12, rx: 7, rz: 5.5 };
const PATHS = [
  [[0, 27], [0, 19], [-5, 15], [3, 11], [-2, 8], [0, 5]],
  [[3, 11], [9, 17], [16, 19.5]],
  [[16, 4.5], [11, 1], [7, 0]],
];

// ---------------------------------------------------------------- island shape
const R0 = 29.5;
const edgeR = (th) => R0 * (0.95 + 0.04 * Math.sin(3 * th + 0.6) + 0.025 * Math.sin(5 * th + 2.3) +
  0.018 * Math.sin(9 * th + 1.1) + 0.035 * Math.pow(Math.max(0, Math.sin(th)), 3));
const inIsland = (x, z) => Math.hypot(x, z) < edgeR(Math.atan2(z, x));
const inTerrace = (x, z) => Math.hypot(x - clamp(x, -6, 6), z - clamp(z, -13, 1)) <= 4.3;
const inPond = (x, z) => ((x - POND.x) / POND.rx) ** 2 + ((z - POND.z) / POND.rz) ** 2 < 1 + 0.22 * (vnoise(x * 0.4 + 3, z * 0.4) - 0.5);
const inPondDeep = (x, z) => ((x - POND.x) / (POND.rx - 2.2)) ** 2 + ((z - POND.z) / (POND.rz - 2)) ** 2 < 1;
function segDist(px, pz, ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az, l = dx * dx + dz * dz;
  const t = l ? clamp(((px - ax) * dx + (pz - az) * dz) / l, 0, 1) : 0;
  return Math.hypot(px - ax - dx * t, pz - az - dz * t);
}
const inPath = (x, z) => PATHS.some((p) => p.some((a, i) => i > 0 && segDist(x, z, p[i - 1][0], p[i - 1][1], a[0], a[1]) <= 1.25));
const inGravel = (x, z) => Math.hypot(x + 16, z) <= 5.2;
const ck = (x, z) => (x + 128) * 512 + (z + 128);

// Columns: top voxel y, bottom voxel y and surface type for every island cell.
const COLS = new Map();
let streamEnd = -99;
for (let x = -32; x <= 31; x++) for (let z = -32; z <= 31; z++) {
  if (!inIsland(x, z)) continue;
  const r = Math.hypot(x, z), rr = r / edgeR(Math.atan2(z, x));
  let type = 'grass', top = 0;
  if (inTerrace(x, z)) { type = 'terrace'; top = 2; }
  else if (inPond(x, z)) { type = 'pond'; top = inPondDeep(x, z) ? -2 : -1; }
  else if ((z === 12 || z === 13) && x > POND.x) { type = 'stream'; top = -1; streamEnd = Math.max(streamEnd, x); }
  else if (inPath(x, z)) type = 'path';
  else if (inGravel(x, z)) type = 'gravel';
  else if (Math.hypot(x + 20, z - 13) < 3.4) top = 1;
  let depth = 2.5 + 27 * Math.pow(1 - rr, 1.15) + (fbm(x * 0.12, z * 0.12) - 0.5) * 8 * (1 - rr)
    + 6 * Math.exp(-((x - 8) ** 2 + (z + 4) ** 2) / 60) + 5 * Math.exp(-((x + 10) ** 2 + (z - 6) ** 2) / 50)
    + (hash2(x * 3, z * 5) < 0.05 ? 5 * (1 - rr) : 0);
  const bot = Math.min(top - 2, -Math.round(depth));
  COLS.set(ck(x, z), { x, z, top, bot, type, rr });
}
// Steps where a path meets the terrace.
for (const c of COLS.values()) {
  if (c.type !== 'path') continue;
  let near = false;

    } else {
      s.p.x += (wind + Math.sin(t * 1.9 + s.phase) * 0.35) * dt;
      s.p.z += Math.sin(t * 0.7 + s.phase) * 0.3 * dt;
      s.p.y -= s.fall * dt * (0.8 + 0.4 * Math.sin(t * 2.3 + s.phase));
      s.rot.set(s.rot.x + s.spin.x * dt, s.rot.y + s.spin.y * dt, s.rot.z + s.spin.z * dt);
      const gy = groundY(s.p.x, s.p.z);
      if (s.p.y <= gy + 0.03) {
        s.p.y = gy + 0.03;
        s.rot.x = 0; s.rot.z = 0;
        if (gy === 0.7) { s.rest = 2 + Math.random() * 2; if (Math.random() < 0.35) ripple(s.p.x, s.p.z); }
        else s.rest = 4 + Math.random() * 6;
      } else if (s.p.y < -45) spawnPetal(s, false);
    }
    M4.compose(s.p, Q.setFromEuler(s.rot), S.set(1, 1, 1));
    petals.setMatrixAt(i, M4);
  }
  petals.instanceMatrix.needsUpdate = true;
  // waterfall
  wfTex.offset.y -= dt * 1.5;
  for (let i = 0; i < SPRAY_N; i++) {
    const s = SP[i];
    s.age += dt;
    if (!s.alive) {
      if (s.age < 0) { M4.makeScale(0, 0, 0); spray.setMatrixAt(i, M4); continue; }
      resetSpray(s); s.alive = true;
    }
    if (s.p.y < -50) resetSpray(s);
    s.v.y = Math.max(-16, s.v.y - 9.8 * dt);
    s.p.addScaledVector(s.v, dt);
    const fade = clamp((s.p.y + 50) / 30, 0, 1);
    M4.compose(s.p, Q.identity(), S.setScalar((0.6 + (1 - fade) * 2.2) * Math.min(1, fade * 3)));
    spray.setMatrixAt(i, M4);
  }
  spray.instanceMatrix.needsUpdate = true;
  // fireflies: only after dark, blinking
  const ffShow = smooth(0.25, 0.75, nightF);
  for (let i = 0; i < FF_N; i++) {
    const f = FF[i], blink = Math.max(0, Math.sin(t * 1.7 + f.ph * 3.1)) ** 3;
    V.set(f.x + Math.sin(t * f.sp + f.ph) * 1.4, f.y + Math.sin(t * 0.8 + f.ph) * 0.35, f.z + Math.cos(t * f.sp * 0.8 + f.ph * 1.3) * 1.4);
    M4.compose(V, Q.identity(), S.setScalar(ffShow * (0.35 + 0.65 * blink)));
    fireflies.setMatrixAt(i, M4);
  }
  fireflies.instanceMatrix.needsUpdate = true;
  // cranes
  const fa = t * 0.11;
  const centre = V.set(Math.cos(fa) * 33, 26 + Math.sin(t * 0.3) * 3, PAGODA_Z + Math.sin(fa) * 33);
  const fwd = S.set(-Math.sin(fa), 0, Math.cos(fa));
  const right = V2.crossVectors(fwd, YAXIS).normalize();
  for (const b of BIRDS) {
    b.g.position.copy(centre).addScaledVector(right, b.slot[0]).addScaledVector(fwd, b.slot[1]);
    b.g.position.y += Math.sin(t * 1.3 + b.phase) * 0.4;
    b.g.lookAt(b.g.position.x + fwd.x, b.g.position.y, b.g.position.z + fwd.z);
    b.g.rotateZ(-0.22);
    const flap = Math.sin(t * 3.2 + b.phase) * 0.55 * (0.45 + 0.55 * Math.max(0, Math.sin(t * 0.45 + b.phase))) + 0.06;
    b.wings.forEach((w) => { w.rotation.z = w.scale.x * flap; });
  }
  // islets bob, clouds drift
  for (const o of ISLETS) { o.g.position.y = o.p[1] + Math.sin(t * 0.45 + o.phase) * 0.6; o.g.rotation.y = Math.sin(t * 0.1 + o.phase) * 0.06; }
  for (const c of CLOUDS) { c.g.position.x += c.drift * dt; if (c.g.position.x > 160) c.g.position.x -= 320; }

  // HUD
  fpsFrames++; fpsT += dt;
  if (fpsT >= 0.5) {
    api.fps = Math.round(fpsFrames / fpsT);
    fpsFrames = 0; fpsT = 0;
    elVox.textContent = `${(VOXEL_COUNT / 1000).toFixed(1)}k voxels | ${api.fps} FPS`;
  }
  api.timeOfDay = Math.round(tod * 100) / 100;
  if (!dragging) elTod.value = tod.toFixed(2);
  const hh = Math.floor(tod), mm = Math.floor((tod - hh) * 60);
  elClock.textContent = `${sunY > 0 ? '☀' : '☾'} ${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;

  if (Math.abs(tod - lastShadowTod) > 0.01 || DOORS.some((d) => Math.abs(d.target - d.open) > 0.002)) {
    renderer.shadowMap.needsUpdate = true;
    lastShadowTod = tod;
  }
  // Bloom only matters once something glows: dusk, night, or a lantern switched on.
  const glowing = nightF > 0.12 || festLevel > 0.05 || LAMPS.some((l) => l.level > 0.05);
  if (composer && glowing) composer.render(); else renderer.render(scene, camera);
}
applyTime(tod);
elVox.textContent = `${(VOXEL_COUNT / 1000).toFixed(1)}k voxels | 60 FPS`;
requestAnimationFrame(frame);
</script>
</body>
</html>
