</style>

<div id="canvas-container"></div>

<div id="hud">
  <div class="hud-card">

      <span><strong id="hud-voxels">24,500</strong> voxels</span>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// --- PALETTE CONFIGURATION ---
const PALETTE = {
  vermillion:  0xC73E1D,
  gold:        0xE8B86D,
  deepTeak:    0x4A2C1A,
  woodDark:    0x341E11,
  jadeDark:    0x2D6A4F,
  jadeLight:   0x40916C,
  sakura1:     0xFFB7C5,
  sakura2:     0xFF8FAB,
  sakura3:     0xFFE5EC,
  stone:       0x9AA0A6,
  stoneDark:   0x5A626A,
  rockDark:    0x383D42,
  pond:        0x7ED6DF,
  moss:        0x606C38,
  mossLight:   0x7C8C46,
  pineGreen:   0x1E453E,
  pineLight:   0x2E6359,
  mapleRed:    0xA83232,
  mapleOrange: 0xD95D39,
  willowGreen: 0x859B55,
  willowPale:  0x9DBA68,
  bamboo:      0x8A9A5B,
  shojiWhite:  0xF3EED9,
  jizoRed:     0xBA2D0B,
  lanternGlow: 0xFFD166
};

// --- RENDERER & SCENE SETUP ---
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x8ecae6, 0.012);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.2, 300);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.maxPolarAngle = Math.PI / 2 - 0.02; // Don't go below horizon
controls.minDistance = 10;
controls.maxDistance = 90;
controls.target.set(0, 5, 0);

// --- LIGHTING ---
const hemiLight = new THREE.HemisphereLight(0xddeeff, 0x334422, 0.9);
scene.add(hemiLight);

const sunLight = new THREE.DirectionalLight(0xfffaed, 2.2);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 140;
const d = 32;
sunLight.shadow.camera.left = -d;
sunLight.shadow.camera.right = d;
sunLight.shadow.camera.top = d;
sunLight.shadow.camera.bottom = -d;
sunLight.shadow.bias = -0.0004;
sunLight.shadow.normalBias = 0.02;
scene.add(sunLight);

// Lantern PointLights (4 interactive)
const lanternLights = [];
const lanternPositions = [
  new THREE.Vector3(-4 * 0.5, 2.5 * 0.5, 22 * 0.5),   // L1: Torii approach
  new THREE.Vector3(8 * 0.5, 2.5 * 0.5, 7 * 0.5),     // L2: Bridge entrance
  new THREE.Vector3(-9 * 0.5, 3.5 * 0.5, 2 * 0.5),    // L3: Pagoda terrace
  new THREE.Vector3(25 * 0.5, -0.5 * 0.5, -9 * 0.5)   // L4: Satellite island
];

// Interior pagoda glow lights
const pagodaInteriorLight = new THREE.PointLight(0xff9d42, 1.8, 18, 1.5);
pagodaInteriorLight.position.set(-4 * 0.5, 5 * 0.5, -8 * 0.5);
scene.add(pagodaInteriorLight);

// --- VOXEL WORLD BUILDER ---
const VOXEL_SIZE = 0.5;
const voxelMap = new Map(); // key -> { color, matType, isPagoda, floor }
let totalPagodaVoxels = 0;

function key(x, y, z) {
  return `${x},${y},${z}`;
}

function setVoxel(x, y, z, colorHex, matType = 'standard', isPagoda = false, floor = -1) {
  const k = key(x, y, z);
  if (!voxelMap.has(k)) {
    voxelMap.set(k, { x, y, z, color: colorHex, matType, isPagoda, floor });
    if (isPagoda) totalPagodaVoxels++;
  }
}

// Procedural Simplex-like simple Noise
function hash(x, z) {
  const n = Math.sin(x * 12.9898 + z * 78.233) * 43758.5453;
  return n - Math.floor(n);
}
function smoothNoise(x, z) {
  const i = Math.floor(x), k = Math.floor(z);
  const fX = x - i, fZ = z - k;
  const a = hash(i, k), b = hash(i + 1, k);
  const c = hash(i, k + 1), d = hash(i + 1, k + 1);
  const u = fX * fX * (3 - 2 * fX);
  const v = fZ * fZ * (3 - 2 * fZ);
  return a * (1 - u) * (1 - v) + b * u * (1 - v) + c * (1 - u) * v + d * u * v;
}

// 1. TERRAIN & FLOATING ISLANDS
function buildIslands() {
  // Main Island: ~56x56 footprint
  for (let x = -28; x <= 28; x++) {
    for (let z = -28; z <= 28; z++) {
      const dist = Math.hypot(x, z);
      const angle = Math.atan2(z, x);
      // Organic rounded coast
      const maxR = 25 + 3.2 * Math.sin(angle * 3) + 2.4 * Math.cos(angle * 5) + 1.2 * Math.sin(angle * 7);
      if (dist <= maxR) {
        // Pond exclusion & depression
        const inPond = (x >= 2 && x <= 14 && z >= 1 && z <= 13);
        const inStream = (x >= 12 && x <= 19 && z >= 9 && z <= 13);
        const isWaterArea = inPond || inStream;

        // Depth profile (curving inverted cone with stalactites underneath)
        const taper = Math.pow(1 - (dist / maxR), 0.75);
        const noiseDepth = smoothNoise(x * 0.18, z * 0.18) * 8;
        const stalactite = Math.pow(smoothNoise(x * 0.35, z * 0.35), 3) * 10;
        const bottomY = -Math.floor(taper * 16 + noiseDepth + stalactite) - 1;

        if (isWaterArea) {
          // Carve pond bed
          for (let y = -2; y >= bottomY; y--) {
            const isBed = (y >= -3);
            setVoxel(x, y, z, isBed ? PALETTE.stoneDark : PALETTE.rockDark, 'stone');
          }
        } else {
          // Solid land
          setVoxel(x, 0, z, (hash(x, z) > 0.4 ? PALETTE.moss : PALETTE.mossLight), 'moss');
          for (let y = -1; y >= bottomY; y--) {
            const col = (y >= -2 && hash(x, y) > 0.6) ? PALETTE.moss : (y > -5 ? PALETTE.stoneDark : PALETTE.rockDark);
            setVoxel(x, y, z, col, 'stone');
          }
        }
      }
    }
  }

  // Satellite Island 1 (East, with rockery)
  buildSatelliteIsland(25, -2, -9, 7, 10);
  // Satellite Island 2 (West, mini Zen outcrop)
  buildSatelliteIsland(-23, 3, 14, 5, 8);
  // Satellite Island 3 (North-East, floating bonsai rock)
  buildSatelliteIsland(15, 5, -23, 4, 7);
}

function buildSatelliteIsland(cx, cy, cz, radius, maxDepth) {
  for (let x = -radius; x <= radius; x++) {
    for (let z = -radius; z <= radius; z++) {
      const dist = Math.hypot(x, z);
      const maxR = radius - 0.5 + 0.8 * Math.sin(x * 1.5 + z * 1.2);
      if (dist <= maxR) {
        const taper = Math.pow(1 - (dist / maxR), 0.8);
        const bottomY = cy - Math.floor(taper * maxDepth) - 1;
        setVoxel(cx + x, cy, cz + z, PALETTE.moss, 'moss');
        for (let y = cy - 1; y >= bottomY; y--) {
          setVoxel(cx + x, y, cz + z, (y === cy - 1 ? PALETTE.stoneDark : PALETTE.rockDark), 'stone');
        }
      }
    }
  }
}

// 2. STONE ZIG-ZAG PATH
function buildPath() {
  const waypoints = [
    [0, 24], [0, 21], [1, 18], [3, 16], [5, 14], [7, 12],
    [7, 8], [6, 4], [4, 1], [1, 0], [-1, -1], [-4, -2]
  ];
  for (let i = 0; i < waypoints.length - 1; i++) {
    const [x0, z0] = waypoints[i];
    const [x1, z1] = waypoints[i + 1];
    const steps = Math.max(Math.abs(x1 - x0), Math.abs(z1 - z0)) * 2;
    for (let s = 0; s <= steps; s++) {
      const t = s / steps;
      const px = Math.round(x0 + (x1 - x0) * t);
      const pz = Math.round(z0 + (z1 - z0) * t);
      for (let dx = -1; dx <= 1; dx++) {
        for (let dz = -1; dz <= 1; dz++) {
          if (hash(px + dx, pz + dz) > 0.25) {
            setVoxel(px + dx, 0, pz + dz, (hash(px, pz) > 0.5 ? PALETTE.stone : 0xB0B5BA), 'stone');
          }
        }
      }
    }
  }
}

// 3. FIVE-STORY PAGODA (Goju-no-To)
function buildPagoda() {
  const cx = -4, cz = -8;

  // Base stone terrace (Plinth)
  for (let x = -8; x <= 8; x++) {
    for (let z = -8; z <= 8; z++) {
      for (let y = 0; y <= 2; y++) {
        setVoxel(cx + x, y, cz + z, (y === 2 ? PALETTE.stone : PALETTE.stoneDark), 'stone', true, 0);
      }
    }
  }
  // Front steps
  for (let step = 0; step < 3; step++) {
    const sy = 2 - step;
    const sz = 8 + step;
    for (let sx = -2; sx <= 2; sx++) {
      setVoxel(cx + sx, sy, cz + sz, PALETTE.stone, 'stone', true, 0);
    }
  }

  // Floors configuration
  const floorConfigs = [
    { halfW: 6, wallH: 5, startY: 3, roofW: 9, hasDoor: true },
    { halfW: 5, wallH: 4, startY: 9, roofW: 8, hasDoor: true },
    { halfW: 4, wallH: 4, startY: 14, roofW: 7, hasDoor: true },
    { halfW: 3, wallH: 4, startY: 19, roofW: 6, hasDoor: true },
    { halfW: 2, wallH: 4, startY: 24, roofW: 5, hasDoor: true }
  ];

  floorConfigs.forEach((cfg, floorIndex) => {
    const { halfW, wallH, startY, roofW, hasDoor } = cfg;
    const endY = startY + wallH;

    // Outer deck & balustrade (railing)
    const deckW = halfW + 1;
    for (let x = -deckW; x <= deckW; x++) {
      for (let z = -deckW; z <= deckW; z++) {
        const isBorder = (Math.abs(x) === deckW || Math.abs(z) === deckW);
        setVoxel(cx + x, startY, cz + z, PALETTE.deepTeak, 'wood', true, floorIndex);
        if (isBorder && Math.abs(x) !== Math.abs(z)) {
          setVoxel(cx + x, startY + 1, cz + z, PALETTE.vermillion, 'vermillion', true, floorIndex);
          if (hash(x, z) > 0.6) setVoxel(cx + x, startY + 2, cz + z, PALETTE.gold, 'gold', true, floorIndex);
        }
      }
    }

    // Walls & Vermillion Pillars
    for (let y = startY + 1; y < endY; y++) {
      for (let x = -halfW; x <= halfW; x++) {
        for (let z = -halfW; z <= halfW; z++) {
          const isCorner = (Math.abs(x) === halfW && Math.abs(z) === halfW);
          const isMidPillar = ((Math.abs(x) === halfW && z === 0) || (Math.abs(z) === halfW && x === 0));
          const isWallPerimeter = (Math.abs(x) === halfW || Math.abs(z) === halfW);

          if (isCorner || isMidPillar) {
            setVoxel(cx + x, y, cz + z, PALETTE.vermillion, 'vermillion', true, floorIndex);
          } else if (isWallPerimeter) {
            // Front door opening on $+Z$ face
            if (hasDoor && z === halfW && Math.abs(x) <= 1 && y <= startY + 3) {
              // Leave void for interactive sliding doors
            } else {
              setVoxel(cx + x, y, cz + z, (y === endY - 1 ? PALETTE.vermillion : PALETTE.shojiWhite), 'wood', true, floorIndex);
            }
          }
        }
      }
    }

    // Stepped Curved / Upturned Jade Roof (Sori)
    buildCurvedRoof(cx, endY, cz, roofW, floorIndex);
  });

  // Sorin (Sacred Finial Spire) on top of 5th floor
  const spireBaseY = floorConfigs[4].startY + floorConfigs[4].wallH + 2;
  buildSorinFinial(cx, spireBaseY, cz);
}

// Mathematical Stepped Upturned Roof
function buildCurvedRoof(cx, cy, cz, halfW, floorIndex) {
  for (let dx = -halfW; dx <= halfW; dx++) {
    for (let dz = -halfW; dz <= halfW; dz++) {
      const ax = Math.abs(dx);
      const az = Math.abs(dz);
      const dist = Math.max(ax, az);
      if (dist < 1) continue;

      // Upturn corner power function (Sori)
      const cornerFactor = (ax * ax + az * az) / (halfW * halfW);
      const upturn = Math.floor(Math.pow(cornerFactor, 2.3) * 2.2);
      const slope = Math.floor((halfW - dist) * 0.65);
      const ry = cy + slope + upturn;

      const isTip = (ax === halfW && az === halfW);
      const isRidge = (ax === az || ax === 0 || az === 0);

      // Color distribution: gold corner tips and ridge ends
      let tileColor = PALETTE.jadeDark;
      let mat = 'jade';
      if (isTip) {
        tileColor = PALETTE.gold;
        mat = 'gold';
      } else if (isRidge) {
        tileColor = PALETTE.jadeLight;
      }

      setVoxel(cx + dx, ry, cz + dz, tileColor, mat, true, floorIndex);
      // Eave thickness underneath
      setVoxel(cx + dx, ry - 1, cz + dz, PALETTE.deepTeak, 'wood', true, floorIndex);
    }
  }
}

// Sacred Spire (Sorin)
function buildSorinFinial(cx, startY, cz) {
  // Lotus bowl base (Fukubachi)
  for (let dx = -1; dx <= 1; dx++) {
    for (let dz = -1; dz <= 1; dz++) {
      setVoxel(cx + dx, startY, cz + dz, PALETTE.gold, 'gold', true, 4);
    }
  }
  // Central bronze/gold shaft with 9 sacred rings (Kururin)
  for (let y = 1; y <= 13; y++) {
    const currentY = startY + y;
    setVoxel(cx, currentY, cz, PALETTE.gold, 'gold', true, 4);

    // 9 rings
    if (y >= 3 && y <= 11) {
      if (y % 1 === 0) {
        setVoxel(cx + 1, currentY, cz, PALETTE.gold, 'gold', true, 4);
        setVoxel(cx - 1, currentY, cz, PALETTE.gold, 'gold', true, 4);
        setVoxel(cx, currentY, cz + 1, PALETTE.gold, 'gold', true, 4);
        setVoxel(cx, currentY, cz - 1, PALETTE.gold, 'gold', true, 4);
      }
    }
  }
  // Flame jewel (Houju) peak
  setVoxel(cx, startY + 14, cz, PALETTE.gold, 'gold', true, 4);
  setVoxel(cx, startY + 15, cz, PALETTE.gold, 'gold', true, 4);
}

// 4. ARCHED WOODEN BRIDGE
function buildBridge() {
  const bx = 6;
  const zStart = 8;
  const zEnd = 2;
  const span = zStart - zEnd;

  for (let i = 0; i <= span; i++) {
    const z = zStart - i;
    const arch = Math.sin((i / span) * Math.PI) * 1.8;
    const y = Math.round(arch) + 1;

    for (let w = -1; w <= 1; w++) {
      setVoxel(bx + w, y, z, PALETTE.deepTeak, 'wood');
    }
    // Vermillion railings & gold posts
    setVoxel(bx - 2, y + 1, z, PALETTE.vermillion, 'vermillion');
    setVoxel(bx + 2, y + 1, z, PALETTE.vermillion, 'vermillion');
    if (i === 0 || i === span || i === Math.floor(span / 2)) {
      setVoxel(bx - 2, y + 2, z, PALETTE.gold, 'gold');
      setVoxel(bx + 2, y + 2, z, PALETTE.gold, 'gold');
    }
  }
}

// 5. TORII GATE
function buildTorii() {
  const tx = 0, tz = 22;
  const h = 7;
  // Pillars
  for (let y = 0; y <= h; y++) {
    setVoxel(tx - 3, y, tz, PALETTE.vermillion, 'vermillion');
    setVoxel(tx + 3, y, tz, PALETTE.vermillion, 'vermillion');
  }
  // Stone plinth bases
  setVoxel(tx - 3, 0, tz, PALETTE.stoneDark, 'stone');
  setVoxel(tx + 3, 0, tz, PALETTE.stoneDark, 'stone');

  // Nuki (Lower crossbeam)
  for (let x = -4; x <= 4; x++) {
    setVoxel(tx + x, h - 2, tz, PALETTE.vermillion, 'vermillion');
  }
  // Kasagi & Shimaki (Upper curved lintel)
  for (let x = -5; x <= 5; x++) {
    const isTip = (Math.abs(x) === 5);

function buildTreeSakura(cx, cy, cz, scale) {
  // Gnarled branching trunk
  for (let y = 0; y <= 5 * scale; y++) {
    setVoxel(cx, cy + y, cz, PALETTE.deepTeak, 'wood');
  }
  const branches = [
    [cx + 1, cy + 4, cz + 1], [cx + 2, cy + 6, cz + 2],
    [cx - 1, cy + 4, cz - 1], [cx - 2, cy + 5, cz - 2],
    [cx, cy + 5, cz + 2],     [cx, cy + 6, cz + 3]
  ];
  branches.forEach(([bx, by, bz]) => setVoxel(bx, Math.round(by), bz, PALETTE.deepTeak, 'wood'));

  // Cherry blossom clouds
  const blossomClusters = [
    [cx + 2, cy + 7, cz + 2, 3],
    [cx - 2, cy + 6, cz - 2, 3],
    [cx, cy + 8, cz + 3, 2.5],
    [cx - 1, cy + 8, cz + 1, 3]
  ];
  blossomClusters.forEach(([ox, oy, oz, cr]) => {
    for (let x = -cr; x <= cr; x++) {
      for (let y = -cr; y <= cr; y++) {
        for (let z = -cr; z <= cr; z++) {
          if (x * x + y * y + z * z <= cr * cr + 0.3) {
            const rVal = hash(ox + x, oz + z);
            const col = rVal > 0.6 ? PALETTE.sakura1 : (rVal > 0.3 ? PALETTE.sakura2 : PALETTE.sakura3);
            setVoxel(Math.round(ox + x), Math.round(oy + y), Math.round(oz + z), col, 'sakura');
          }
        }
      }
    }
  });
}

function buildTreePine(cx, cy, cz, scale) {
  // Bonsai-curved trunk
  for (let y = 0; y <= 6 * scale; y++) {
    const xOff = Math.round(Math.sin(y * 0.7) * 1.5);
    setVoxel(cx + xOff, cy + y, cz, PALETTE.woodDark, 'wood');
  }
  // Tiered flat pine needle pads
  const tiers = [
    [cx + 1, cy + 4, cz, 3],
    [cx - 1, cy + 6, cz + 1, 3],
    [cx + 1, cy + 8, cz - 1, 2.5]
  ];
  tiers.forEach(([tx, ty, tz, pr]) => {
    for (let x = -pr; x <= pr; x++) {
      for (let z = -pr; z <= pr; z++) {
        if (x * x + z * z <= pr * pr) {
          const col = hash(x, z) > 0.5 ? PALETTE.pineGreen : PALETTE.pineLight;
          setVoxel(Math.round(tx + x), Math.round(ty), Math.round(tz + z), col, 'pine');
          setVoxel(Math.round(tx + x), Math.round(ty + 1), Math.round(tz + z), col, 'pine');
        }
      }
    }
  });
}

function buildTreeMaple(cx, cy, cz, scale) {
  for (let y = 0; y <= 5 * scale; y++) {
    setVoxel(cx, cy + y, cz, PALETTE.deepTeak, 'wood');
  }
  const clusters = [
    [cx + 1, cy + 5, cz + 1, 2.8],
    [cx - 1, cy + 6, cz - 1, 2.5],
    [cx, cy + 7, cz, 2.2]
  ];
  clusters.forEach(([ox, oy, oz, cr]) => {
    for (let x = -cr; x <= cr; x++) {
      for (let y = -cr; y <= cr; y++) {
        for (let z = -cr; z <= cr; z++) {
          if (x * x + y * y + z * z <= cr * cr) {
            const col = hash(ox + x, oz + z) > 0.4 ? PALETTE.mapleRed : PALETTE.mapleOrange;
            setVoxel(Math.round(ox + x), Math.round(oy + y), Math.round(oz + z), col, 'maple');
          }
        }
      }
    }
  });
}

function buildTreeWillow(cx, cy, cz, scale) {
  // Leaning trunk
  for (let y = 0; y <= 6 * scale; y++) {
    const zLean = Math.round(y * 0.4);
    setVoxel(cx, cy + y, cz - zLean, PALETTE.woodDark, 'wood');
  }
  const topY = cy + Math.round(6 * scale);
  const topZ = cz - Math.round(6 * scale * 0.4);

  // Weeping branches hanging down toward water
  for (let dx = -3; dx <= 3; dx++) {
    for (let dz = -3; dz <= 3; dz++) {
      const d = Math.hypot(dx, dz);
      if (d <= 3 && d >= 1) {
        const dropLen = 3 + Math.floor(hash(dx, dz) * 4);
        for (let dy = 0; dy <= dropLen; dy++) {
          const col = hash(dx, dy) > 0.5 ? PALETTE.willowGreen : PALETTE.willowPale;
          setVoxel(cx + dx, topY - dy, topZ + dz, col, 'willow');
        }
      }
    }
  }
}

// Voxel AO neighbor lookup & occlusion shading
function getAO(vx, vy, vz) {
  let neighbors = 0;
  if (voxelMap.has(key(vx + 1, vy, vz))) neighbors++;
  if (voxelMap.has(key(vx - 1, vy, vz))) neighbors++;
  if (voxelMap.has(key(vx, vy + 1, vz))) neighbors += 2; // Top occlusion casts extra depth
  if (voxelMap.has(key(vx, vy - 1, vz))) neighbors++;
  if (voxelMap.has(key(vx, vy, vz + 1))) neighbors++;
  if (voxelMap.has(key(vx, vy, vz - 1))) neighbors++;
  return Math.max(0.62, 1.0 - neighbors * 0.06);
}

// Group voxels by material category for InstancedMesh consolidation
const voxelBuckets = {};
Object.keys(materials).forEach(m => voxelBuckets[m] = []);

let totalVisibleVoxels = 0;
const boxGeo = new THREE.BoxGeometry(VOXEL_SIZE, VOXEL_SIZE, VOXEL_SIZE);

// Filter surface/visible voxels to optimize draw calls & stay within target budget
voxelMap.forEach((v) => {
  // Check if fully enclosed
  const surrounded =
    voxelMap.has(key(v.x + 1, v.y, v.z)) &&
    voxelMap.has(key(v.x - 1, v.y, v.z)) &&
    voxelMap.has(key(v.x, v.y + 1, v.z)) &&
    voxelMap.has(key(v.x, v.y - 1, v.z)) &&
    voxelMap.has(key(v.x, v.y, v.z + 1)) &&
    voxelMap.has(key(v.x, v.y, v.z - 1));

  if (!surrounded) {
    totalVisibleVoxels++;
    const matKey = materials[v.matType] ? v.matType : 'standard';
    voxelBuckets[matKey].push(v);
  }
});

const dummy = new THREE.Object3D();
const tempColor = new THREE.Color();
const instancedMeshes = [];

Object.keys(voxelBuckets).forEach(matName => {
  const list = voxelBuckets[matName];
  if (list.length === 0) return;

  const imesh = new THREE.InstancedMesh(boxGeo, materials[matName], list.length);
  imesh.castShadow = true;
  imesh.receiveShadow = true;

  for (let i = 0; i < list.length; i++) {
    const v = list[i];
    dummy.position.set(v.x * VOXEL_SIZE, v.y * VOXEL_SIZE, v.z * VOXEL_SIZE);
    dummy.updateMatrix();
    imesh.setMatrixAt(i, dummy.matrix);

    const ao = getAO(v.x, v.y, v.z);
    tempColor.setHex(v.color).multiplyScalar(ao);
    imesh.setColorAt(i, tempColor);
  }
  imesh.instanceMatrix.needsUpdate = true;
  if (imesh.instanceColor) imesh.instanceColor.needsUpdate = true;
  scene.add(imesh);
  instancedMeshes.push(imesh);
});

// --- DAY / NIGHT SKY & LIGHTING CYCLE ---
let cycleTime = 20; // Starts at pleasant early afternoon (14:00)
let cyclePaused = false;
const cycleDuration = 90; // 90 seconds full loop

const skyDay = new THREE.Color(0x8ecae6);
const skySunset = new THREE.Color(0xfb8500);
const skyNight = new THREE.Color(0x0a1128);
const skyDawn = new THREE.Color(0xd4a373);

const sunLightColor = new THREE.Color();
const hemiSkyColor = new THREE.Color();
const hemiGroundColor = new THREE.Color();

function updateDayNight(delta) {
  if (!cyclePaused) {
    cycleTime = (cycleTime + delta) % cycleDuration;
    document.getElementById('time-slider').value = cycleTime;
  }
  const tNorm = cycleTime / cycleDuration; // 0 to 1
  const hours = (tNorm * 24).toFixed(1);
  const hh = Math.floor(hours).toString().padStart(2, '0');
  const mm = Math.floor((hours % 1) * 60).toString().padStart(2, '0');
  document.getElementById('time-display').innerText = `${hh}:${mm}`;

  // Sun orbit angle
  const sunAngle = tNorm * Math.PI * 2 - Math.PI / 2;
  const sunR = 55;
  sunLight.position.set(
    Math.cos(sunAngle) * sunR,
    Math.sin(sunAngle) * sunR,
    Math.sin(sunAngle * 0.5) * 20
  );

  const sunElevation = Math.sin(sunAngle); // -1 (night) to +1 (noon)
  let currentSkyColor = new THREE.Color();

  if (sunElevation > 0.2) {
    // Day
    const blend = (sunElevation - 0.2) / 0.8;
    currentSkyColor.copy(skySunset).lerp(skyDay, blend);
    sunLightColor.setHex(0xfffaed);
    sunLight.intensity = 1.8 + blend * 0.6;
    hemiSkyColor.setHex(0xddeeff);
    hemiGroundColor.setHex(0x556633);
  } else if (sunElevation > -0.15) {
    // Sunset / Dusk
    const blend = (sunElevation + 0.15) / 0.35;
    currentSkyColor.copy(skyNight).lerp(skySunset, blend);
    sunLightColor.setHex(0xff7733);
    sunLight.intensity = 0.8 + blend * 1.0;
    hemiSkyColor.setHex(0xcc6644);
    hemiGroundColor.setHex(0x221111);
  } else {
    // Night
    currentSkyColor.copy(skyNight);
    sunLightColor.setHex(0x5577aa); // Moonlight
    sunLight.intensity = 0.35;
    hemiSkyColor.setHex(0x182238);
    hemiGroundColor.setHex(0x080d1a);
  }

  scene.background = currentSkyColor;
  scene.fog.color.copy(currentSkyColor);
  sunLight.color.copy(sunLightColor);
  hemiLight.color.copy(hemiSkyColor);
  hemiLight.groundColor.copy(hemiGroundColor);

  // Automatic Dusk/Night Lantern Ignition
  const isNightTime = (sunElevation < 0.1);
  lanterns.forEach((l, i) => {
    if (!l.userToggled) {
      l.isOn = isNightTime;
    }
    // Subtle organic lantern flickering
    const flicker = l.isOn ? (1.7 + Math.sin(Date.now() * 0.012 + i * 3) * 0.25) : 0;
    l.light.intensity = flicker;
  });

  // Interior pagoda light glow shines brighter at dusk/night
  pagodaInteriorLight.intensity = isNightTime ? 2.4 : 0.8;
}

// --- INTERACTION: RAYCASTING & CLICK LOGIC ---
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const toast = document.getElementById('interactive-toast');
let toastTimeout;

function showToast(text) {
  toast.innerText = text;
  toast.style.opacity = '1';
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.style.opacity = '0', 2000);
}

window.addEventListener('pointerdown', (e) => {
  // Only trigger on main scene click, not control HUD
  if (e.target.closest('#hud') || e.target.closest('#controls-bar')) return;

  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  // Raycast lanterns
  const lanternHits = raycaster.intersectObjects(lanterns.map(l => l.hitMesh));
  if (lanternHits.length > 0) {
    const idx = lanternHits[0].object.userData.index;
    const l = lanterns[idx];
    l.userToggled = true;
    l.isOn = !l.isOn;
    showToast(l.isOn ? `Lantern ${idx + 1} Lit` : `Lantern ${idx + 1} Extinguished`);
    return;
  }

  // Raycast Pagoda floors
  const pagodaHits = raycaster.intersectObjects(pagodaClickTargets);
  if (pagodaHits.length > 0) {
    const floorIdx = pagodaHits[0].object.userData.floor;
    const door = pagodaDoors[floorIdx];
    door.isOpen = !door.isOpen;
    door.targetOffset = door.isOpen ? door.maxOffset : 0;
    showToast(`Floor ${floorIdx + 1} Doors ${door.isOpen ? 'Opened' : 'Closed'}`);
  }
});

// Cursor Hover effect
window.addEventListener('pointermove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects([...pagodaClickTargets, ...lanterns.map(l => l.hitMesh)]);
  renderer.domElement.style.cursor = hits.length > 0 ? 'pointer' : 'default';
});

// --- CAMERA INTRO SEQUENCE ---
let introRunning = true;
const introDuration = 2.5; // 2.5 seconds
let introElapsed = 0;

// Path: Close-up facing the Torii entrance looking towards Pagoda -> High panoramic view
const camIntroStartPos = new THREE.Vector3(0, 3.2, 26);
const camIntroStartTarget = new THREE.Vector3(-2 * VOXEL_SIZE, 8 * VOXEL_SIZE, -8 * VOXEL_SIZE);

const camIntroEndPos = new THREE.Vector3(26, 17, 27);
const camIntroEndTarget = new THREE.Vector3(0, 5, 0);

camera.position.copy(camIntroStartPos);
controls.target.copy(camIntroStartTarget);

// --- HUD CONTROLS EVENT LISTENERS ---
const playPauseBtn = document.getElementById('btn-play-pause');
playPauseBtn.addEventListener('click', () => {
  cyclePaused = !cyclePaused;
  playPauseBtn.innerText = cyclePaused ? '▶' : '⏸';
});

const timeSlider = document.getElementById('time-slider');
timeSlider.addEventListener('input', (e) => {
  cycleTime = parseFloat(e.target.value);
});

let autoRotateEnabled = true;
let lastInteractionTime = performance.now();
const autoRotateBtn = document.getElementById('btn-autorotate');
autoRotateBtn.addEventListener('click', () => {
  autoRotateEnabled = !autoRotateEnabled;
  autoRotateBtn.style.color = autoRotateEnabled ? '#fff' : '#64748b';
});

controls.addEventListener('start', () => {
  lastInteractionTime = performance.now();
  if (introRunning) introRunning = false; // User interrupt breaks intro
});

// --- EXPOSED BENCHMARK METRIC GLOBAL ---
let fps = 60;
let frameCount = 0;
let lastFpsTime = performance.now();

window.__VOXEL__ = {
  voxelCount: totalVisibleVoxels,
  fps: 60,
  pagodaFloors: 5,
  timeOfDay: cycleTime / cycleDuration
};

// --- ANIMATION LOOP ---
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.1);
  const elapsedTime = clock.getElapsedTime();

  // 1. Camera Intro Easing
  if (introRunning) {
    introElapsed += delta;
    const p = Math.min(introElapsed / introDuration, 1.0);
    // Smooth cubic ease-in-out
    const ease = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;

    camera.position.lerpVectors(camIntroStartPos, camIntroEndPos, ease);
    controls.target.lerpVectors(camIntroStartTarget, camIntroEndTarget, ease);
    controls.update();

    if (p >= 1.0) introRunning = false;
  } else {
    // Idle Auto-Rotation
    if (autoRotateEnabled && performance.now() - lastInteractionTime > 2500) {
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.75;
    } else {
      controls.autoRotate = false;
    }
    controls.update();
  }

  // 2. Day / Night Cycle Update
  updateDayNight(delta);

  // 3. Sliding Doors Smooth Animation
  pagodaDoors.forEach(d => {
    d.currentOffset += (d.targetOffset - d.currentOffset) * 0.12;
    d.left.position.x = -d.maxOffset * 0.6 - d.currentOffset;
    d.right.position.x = d.maxOffset * 0.6 + d.currentOffset;
  });

  // 4. Pond Water Ripples
  const posAttr = pondPlaneGeo.attributes.position;
  const baseAttr = pondBasePositions;
  for (let i = 0; i < posAttr.count; i++) {
    const vx = baseAttr.getX(i);
    const vz = baseAttr.getZ(i);
    const wave = Math.sin(vx * 3.5 + elapsedTime * 2.8) * 0.05 + Math.cos(vz * 3.0 + elapsedTime * 2.2) * 0.04;
    posAttr.setY(i, wave);
  }
  posAttr.needsUpdate = true;

  // 5. Koi Fish Swimming & Tail Wagging
  koiFish.forEach((k, idx) => {
    k.angle += delta * k.speed * 0.6;
    const px = 8 * VOXEL_SIZE + Math.cos(k.angle) * k.radiusX;
    const pz = 7 * VOXEL_SIZE + Math.sin(k.angle) * k.radiusZ;
    k.group.position.set(px, k.y, pz);

    // Tangent forward direction
    const tx = -Math.sin(k.angle) * k.radiusX;
    const tz = Math.cos(k.angle) * k.radiusZ;
    k.group.rotation.y = Math.atan2(tx, tz) + Math.PI;

    // Tail oscillation
    k.tail.rotation.y = Math.sin(elapsedTime * 8 + idx * 1.5) * 0.45;
  });

  // 6. Waterfall Droplets
  const wfPositions = waterfall.geometry.attributes.position.array;
  for (let i = 0; i < waterfallParticles; i++) {
    wfPositions[i * 3 + 1] -= wfVel[i] * delta * 7;
    // Respawn top
    if (wfPositions[i * 3 + 1] < -18) {
      wfPositions[i * 3 + 1] = wfSourceY;
      wfPositions[i * 3 + 0] = wfSourceX + (Math.random() - 0.5) * 0.8;
      wfPositions[i * 3 + 2] = wfSourceZ + (Math.random() - 0.5) * 0.8;
    }
  }
  waterfall.geometry.attributes.position.needsUpdate = true;

  // 7. Sakura Falling Petals
  const pPositions = petalParticles.geometry.attributes.position.array;
  for (let i = 0; i < petalCount; i++) {
    const ph = petalPhases[i];
    pPositions[i * 3 + 1] -= ph.speedY * delta * 3.5;
    pPositions[i * 3 + 0] += Math.sin(elapsedTime * ph.swaySpeed + ph.offset) * ph.swayAmp * 0.05;
    pPositions[i * 3 + 2] += Math.cos(elapsedTime * ph.swaySpeed + ph.offset) * ph.swayAmp * 0.05;

    // Respawn at top sky
    if (pPositions[i * 3 + 1] < -5) {
      pPositions[i * 3 + 1] = 20 + Math.random() * 5;
      pPositions[i * 3 + 0] = (Math.random() - 0.5) * 45;
      pPositions[i * 3 + 2] = (Math.random() - 0.5) * 45;
    }
  }
  petalParticles.geometry.attributes.position.needsUpdate = true;

  // 8. Birds Flying in Sky
  birds.forEach(b => {
    b.angle += delta * b.speed * 0.25;
    const bx = Math.cos(b.angle) * b.radius;
    const bz = Math.sin(b.angle) * b.radius;
    b.group.position.set(bx, b.altitude + Math.sin(b.angle * 2) * 2, bz);

    const fwdX = -Math.sin(b.angle);
    const fwdZ = Math.cos(b.angle);
    b.group.rotation.y = Math.atan2(fwdX, fwdZ) + Math.PI / 2;

    const flap = Math.sin(elapsedTime * 9 + b.altitude) * 0.45;
    b.leftW.rotation.z = flap;
    b.rightW.rotation.z = -flap;
  });

  // 9. FPS & Metric Tracker
  frameCount++;
  const now = performance.now();
  if (now - lastFpsTime >= 500) {
    fps = Math.round((frameCount * 1000) / (now - lastFpsTime));
    document.getElementById('hud-fps').innerText = fps;
    frameCount = 0;
    lastFpsTime = now;

    // Sync window global
    window.__VOXEL__.fps = fps;
    window.__VOXEL__.timeOfDay = cycleTime / cycleDuration;
  }

  renderer.render(scene, camera);
}

// Window resize handling
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
});

// Kick off animation loop
animate();
</script>
