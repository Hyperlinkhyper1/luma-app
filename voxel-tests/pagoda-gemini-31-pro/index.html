<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Pagoda Garden</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        #loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-family: sans-serif; color: white;
            font-size: 24px; text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
            z-index: 10;
        }
        #info {
            position: absolute; bottom: 20px; width: 100%;
            text-align: center; font-family: sans-serif;
            color: white; pointer-events: none;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            z-index: 10;
        }
    </style>
    <!-- Import Maps -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="loading">Generating Voxel World...</div>
    <div id="info">Drag to Rotate | Scroll to Zoom</div>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        const loading = document.getElementById('loading');
        
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#87CEEB');
        scene.fog = new THREE.FogExp2('#87CEEB', 0.012);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(30, 25, 40);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 5, 0);
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // prevent going below ground
        controls.minDistance = 5;
        controls.maxDistance = 120;
        controls.update();
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(40, 60, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.left = -40;
        dirLight.shadow.camera.right = 40;
        dirLight.shadow.camera.top = 40;
        dirLight.shadow.camera.bottom = -40;
        dirLight.shadow.camera.far = 150;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);
        
        // Voxel setup
        const maxVoxels = 60000;
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshStandardMaterial({ 
            color: 0xffffff, 
            roughness: 0.8, 
            metalness: 0.1 
        });
        const instancedMesh = new THREE.InstancedMesh(geometry, material, maxVoxels);
        instancedMesh.castShadow = true;
        instancedMesh.receiveShadow = true;
        scene.add(instancedMesh);
        
        const dummy = new THREE.Object3D();
        const colorObj = new THREE.Color();
        let voxelCount = 0;
        const occupied = new Set();
        
        function addVoxel(x, y, z, hexColor) {
            if (voxelCount >= maxVoxels) return;
            const key = `${x},${y},${z}`;
            if (occupied.has(key)) return;
            occupied.add(key);
            
            dummy.position.set(x, y, z);
            dummy.updateMatrix();
            instancedMesh.setMatrixAt(voxelCount, dummy.matrix);
            
            colorObj.set(hexColor);
            instancedMesh.setColorAt(voxelCount, colorObj);
            
            voxelCount++;
        }
        
        // --- Voxel Builders ---
        function buildTree(cx, cz) {
            let height = 4 + Math.floor(Math.random() * 3);
            for(let y = 1; y <= height; y++) {
                addVoxel(cx, y, cz, '#451a03'); // trunk
            }
            let radius = 3.5;
            let leafColors = ['#f9a8d4', '#f472b6', '#db2777', '#fbcfe8'];
            for(let x = Math.floor(cx - radius); x <= Math.ceil(cx + radius); x++) {
                for(let y = Math.floor(height - 1); y <= Math.ceil(height + radius); y++) {
                    for(let z = Math.floor(cz - radius); z <= Math.ceil(cz + radius); z++) {
                        let dist = Math.sqrt((x-cx)**2 + (y-height)**2 + (z-cz)**2);
                        if (dist <= radius && Math.random() > 0.2) {
                            addVoxel(x, y, z, leafColors[Math.floor(Math.random() * leafColors.length)]);
                        }
                    }
                }
            }
        }
        
        function buildPineTree(cx, cz) {
            let height = 3 + Math.floor(Math.random() * 2);
            for(let y = 1; y <= height; y++) {
                addVoxel(cx, y, cz, '#3e2723');
            }
            let y = height;
            let leafColor = '#064e3b';
            for(let r = 3; r >= 1; r--) {
                for(let x = cx - r; x <= cx + r; x++) {
                    for(let z = cz - r; z <= cz + r; z++) {
                        if (Math.abs(x - cx) + Math.abs(z - cz) <= r * 1.5) {
                            if (Math.random() > 0.1) addVoxel(x, y, z, leafColor);
                        }
                    }
                }
                y++;
                if(r > 1) {
                    for(let x = cx - r + 1; x <= cx + r - 1; x++) {
                        for(let z = cz - r + 1; z <= cz + r - 1; z++) {
                            if (Math.abs(x - cx) + Math.abs(z - cz) <= (r-1) * 1.5) {
                                 if (Math.random() > 0.1) addVoxel(x, y, z, leafColor);
                            }
                        }
                    }
                    y++;
                }
            }
            addVoxel(cx, y, cz, leafColor);
        }
        
        function buildLantern(cx, cz) {
            let stone = '#a8a29e';
            let light = '#fef08a';
            addVoxel(cx, 0, cz, stone);
            addVoxel(cx, 1, cz, stone); 
            addVoxel(cx, 2, cz, light); 
            addVoxel(cx, 3, cz, stone); 
            addVoxel(cx-1, 3, cz, stone);
            addVoxel(cx+1, 3, cz, stone);
            addVoxel(cx, 3, cz-1, stone);
            addVoxel(cx, 3, cz+1, stone);
            addVoxel(cx, 4, cz, stone); 
        }
        
        function buildTorii(cx, cz) {
            let color = '#ef4444'; 
            let topColor = '#1e293b'; 
            
            for(let y = 0; y < 8; y++) {
                addVoxel(cx - 3, y, cz, color);
                addVoxel(cx + 3, y, cz, color);
                addVoxel(cx - 3, y, cz-1, color);
                addVoxel(cx + 3, y, cz-1, color);
            }
            for(let x = cx - 4; x <= cx + 4; x++) {
                addVoxel(x, 5, cz, color);
                addVoxel(x, 5, cz-1, color);
            }
            for(let x = cx - 5; x <= cx + 5; x++) {
                addVoxel(x, 7, cz, color);
                addVoxel(x, 7, cz-1, color);
                addVoxel(x, 8, cz, topColor);
                addVoxel(x, 8, cz-1, topColor);
            }
            addVoxel(cx, 6, cz, color);
            addVoxel(cx, 6, cz-1, color);
        }


        function buildPagoda(cx, cz) {
            // Base
            for(let y = -1; y <= 0; y++) {
                for(let x = cx - 8; x <= cx + 8; x++) {
                    for(let z = cz - 8; z <= cz + 8; z++) {
                        if (z > cz + 8 && z <= cz + 10 && x >= cx - 2 && x <= cx + 2) {
                            if (y === -1 && z === cz + 10) addVoxel(x, y, z, '#d4d4d8');
                            if (y === 0 && z === cz + 9) addVoxel(x, y, z, '#d4d4d8');
                        } else if (z <= cz + 8) {
                            addVoxel(x, y, z, '#e5e5e5');
                        }
                    }
                }
            }
            for(let x = cx - 2; x <= cx + 2; x++) {
                addVoxel(x, -1, cz + 9, '#e5e5e5');
                addVoxel(x, 0, cz + 8, '#e5e5e5'); 
            }


            let size = 6;
            let y = 1;
            let tiers = 5;


            for(let tier = 0; tier < tiers; tier++) {
                let wallHeight = 3;
                
                // Balcony & Floors
                for(let x = cx - size - 1; x <= cx + size + 1; x++) {
                    for(let z = cz - size - 1; z <= cz + size + 1; z++) {
                        let isEdge = (Math.abs(x - cx) === size + 1 || Math.abs(z - cz) === size + 1);
                        if (isEdge) {
                            if (tier === 0 && z === cz + size + 1 && x >= cx - 1 && x <= cx + 1) continue;
                            addVoxel(x, y, z, '#78350f');
                            addVoxel(x, y + 1, z, '#92400e');
                            if ((Math.abs(x - cx) === size + 1 && Math.abs(z - cz) === size + 1)) {
                                addVoxel(x, y + 2, z, '#78350f');
                            }
                        } else {
                             if (tier > 0 && y > 0) addVoxel(x, y, z, '#78350f');
                        }
                    }
                }


                // Walls & Windows
                for(let h = 0; h < wallHeight; h++) {
                    for(let x = cx - size; x <= cx + size; x++) {
                        for(let z = cz - size; z <= cz + size; z++) {
                            let isEdge = (Math.abs(x - cx) === size || Math.abs(z - cz) === size);
                            let isCorner = (Math.abs(x - cx) === size && Math.abs(z - cz) === size);
                            
                            if (isEdge) {
                                if (tier === 0 && h < 2 && z === cz + size && x >= cx - 1 && x <= cx + 1) continue;
                                if (!isCorner && h === 1 && x % 2 === 0) {
                                    addVoxel(x, y + h, z, '#fef08a');
                                } else {
                                    addVoxel(x, y + h, z, '#dc2626');
                                }
                            }
                        }
                    }
                }
                
                y += wallHeight;
                
                // Roof
                let roofSize = size + 2;
                let roofColor1 = '#1e293b';
                let roofColor2 = '#0f172a';
                
                for(let h = 0; h < 2; h++) {
                    let currentSize = roofSize - h;
                    for(let x = cx - currentSize; x <= cx + currentSize; x++) {
                        for(let z = cz - currentSize; z <= cz + currentSize; z++) {
                            let isEdge = (Math.abs(x - cx) === currentSize || Math.abs(z - cz) === currentSize);
                            let isCorner = (Math.abs(x - cx) === currentSize && Math.abs(z - cz) === currentSize);
                            if (isCorner && h === 0) continue; 
                            
                            if (isEdge) addVoxel(x, y + h, z, roofColor1);
                            else if (h === 1) addVoxel(x, y + h, z, roofColor2);
                        }
                    }
                }
                // Upturned eaves
                addVoxel(cx - roofSize, y + 1, cz - roofSize, roofColor1);
                addVoxel(cx + roofSize, y + 1, cz - roofSize, roofColor1);
                addVoxel(cx - roofSize, y + 1, cz + roofSize, roofColor1);
                addVoxel(cx + roofSize, y + 1, cz + roofSize, roofColor1);


                y += 2;
                size -= 1;
            }
            
            // Spire
            for(let h = 0; h < 6; h++) {
                addVoxel(cx, y + h, cz, '#eab308');
                if (h === 1 || h === 3) {
                    addVoxel(cx - 1, y + h, cz, '#eab308');
                    addVoxel(cx + 1, y + h, cz, '#eab308');
                    addVoxel(cx, y + h, cz - 1, '#eab308');
                    addVoxel(cx, y + h, cz + 1, '#eab308');
                }
            }
        }
        
        function buildClouds() {
            for(let c=0; c<12; c++) {
                let cx = Math.random() * 80 - 40;
                let cy = 20 + Math.random() * 10;
                let cz = Math.random() * 80 - 40;
                let w = 3 + Math.floor(Math.random() * 4);
                let h = 1 + Math.floor(Math.random() * 2);
                let d = 3 + Math.floor(Math.random() * 4);
                
                for(let x = Math.floor(cx - w); x <= Math.ceil(cx + w); x++) {
                    for(let y = Math.floor(cy - h); y <= Math.ceil(cy + h); y++) {
                        for(let z = Math.floor(cz - d); z <= Math.ceil(cz + d); z++) {
                            let dist = Math.sqrt((x-cx)**2 + (y-cy)**2 + (z-cz)**2);
                            if (dist < Math.max(w, h, d) * 0.8 && Math.random() > 0.1) {
                                addVoxel(x, y, z, '#ffffff');
                            }
                        }
                    }
                }
            }
        }


        function buildScene() {
            // Garden Ground
            const G_MIN = -25;
            const G_MAX = 25;
            for(let x = G_MIN; x <= G_MAX; x++) {
                for(let z = G_MIN; z <= G_MAX; z++) {
                    let isPath = false;
                    if (x >= -2 && x <= 2 && z >= 8 && z <= G_MAX) isPath = true;
                    
                    let pondDist = Math.sqrt((x - (-12))**2 + (z - 12)**2);
                    let isPond = pondDist < 8;
                    if (x < -12 && z >= 10 && z <= 14) isPond = true; // river
                    
                    if (isPond) {
                        addVoxel(x, -1, z, ['#0ea5e9', '#38bdf8'][Math.floor(Math.random()*2)]);
                    } else if (isPath) {
                        addVoxel(x, 0, z, '#a8a29e');
                    } else {
                        let y = 0;
                        if (x > 15 && z < -10) y = 1 + Math.floor(Math.random()*2);
                        if (x < -15 && z < -15) y = 1;
                        if (x > 18 && z > 15) y = 1;
                        
                        let grass = ['#16a34a', '#22c55e', '#4ade80'];
                        for(let h = -1; h <= y; h++) {
                            addVoxel(x, h, z, h === y ? grass[Math.floor(Math.random()*3)] : '#78350f');
                        }
                        
                        if (y === 0 && Math.random() < 0.04) {
                            addVoxel(x, 1, z, Math.random() < 0.5 ? '#f43f5e' : '#fbbf24');
                        }
                    }
                }
            }
            
            buildPagoda(0, -2);
            buildTorii(0, 20);
            
            buildLantern(-4, 15);
            buildLantern(4, 15);
            buildLantern(-4, 9);
            buildLantern(4, 9);
            
            // Cherry trees
            buildTree(-8, -5);
            buildTree(8, -2);
            buildTree(-10, 2);
            buildTree(12, 6);
            buildTree(14, -12);
            
            // Pine trees
            buildPineTree(18, -18);
            buildPineTree(14, -20);
            buildPineTree(-18, -15);
            buildPineTree(-20, -5);
            buildPineTree(10, 18);
            buildPineTree(-8, 22);
            
            // Lily Pads
            for(let i=0; i<12; i++) {
                let lx = -12 + (Math.random() * 12 - 6);
                let lz = 12 + (Math.random() * 12 - 6);
                let pondDist = Math.sqrt((lx - (-12))**2 + (lz - 12)**2);
                if (pondDist < 7) {
                    addVoxel(Math.round(lx), 0, Math.round(lz), '#4ade80');
                    if (Math.random() < 0.4) addVoxel(Math.round(lx), 1, Math.round(lz), '#f472b6');
                }
            }
            
            // Bridge
            for(let x=-20; x<=-16; x++) {
                for(let z=11; z<=13; z++) {
                    let by = (x === -20 || x === -16) ? 0 : 1;
                    addVoxel(x, by, z, '#92400e');
                    if (z===11 || z===13) addVoxel(x, by+1, z, '#78350f');
                }
            }
            
            buildClouds();
            
            // Falling petals
            for(let i=0; i<150; i++) {
                let px = Math.random() * 50 - 25;
                let py = Math.random() * 10 + 1;
                let pz = Math.random() * 50 - 25;
                let petalColors = ['#f9a8d4', '#f472b6', '#fbcfe8'];
                addVoxel(Math.round(px), Math.round(py), Math.round(pz), petalColors[Math.floor(Math.random()*3)]);
            }
        }
        
        // Use timeout to let the UI update the "generating" text before heavy loop
        setTimeout(() => {
            buildScene();
            
            // Finalize instance data
            instancedMesh.count = voxelCount;
            instancedMesh.instanceMatrix.needsUpdate = true;
            instancedMesh.instanceColor.needsUpdate = true;
            
            loading.style.display = 'none';
        }, 50);


        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
        
        // Window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
