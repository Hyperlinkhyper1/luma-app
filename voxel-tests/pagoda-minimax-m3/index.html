<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Minimax M3 — Spring Festival at the Five-Story Pagoda</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #0a0a0f;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    background: rgba(10, 12, 20, 0.55);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 183, 197, 0.25);
    border-radius: 12px; padding: 12px 16px;
    color: #FFB7C5; pointer-events: none; user-select: none;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  }
  #hud .title { font-size: 14px; letter-spacing: 0.3em; font-weight: 700; color: #FFE5EC; text-transform: uppercase; margin-bottom: 6px; }
  #hud .sub { font-size: 11px; color: #E8B86D; letter-spacing: 0.1em; margin-bottom: 4px; }
  #hud .hint { font-size: 10px; color: #9AA0A6; margin-top: 4px; letter-spacing: 0.05em; }
  #controls {
    position: fixed; bottom: 16px; left: 16px; z-index: 10;
    background: rgba(10, 12, 20, 0.55);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 183, 197, 0.25);
    border-radius: 12px; padding: 10px 14px;
    color: #FFB7C5; user-select: none; font-size: 11px; letter-spacing: 0.05em;
  }
  #controls label { display: block; margin: 4px 0; color: #FFE5EC; }
  #controls input[type=range] { width: 180px; vertical-align: middle; accent-color: #C73E1D; }
  #model-badge {
    position: fixed; top: 16px; right: 16px; z-index: 10;
    background: rgba(199, 62, 29, 0.25);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(232, 184, 109, 0.4);
    border-radius: 12px; padding: 8px 14px;
    color: #E8B86D; font-size: 11px; letter-spacing: 0.2em;
    font-weight: 700; text-transform: uppercase; user-select: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <div class="title">VOXEL GARDEN</div>
  <div class="sub"><span id="voxel-count">0</span> voxels | <span id="fps">0</span> FPS</div>
  <div class="sub">5 Floors • 8 Trees • 6 Koi</div>
  <div class="hint">Click lanterns · Click pagoda floors</div>
</div>
<div id="controls">
  <label>Daylight: <span id="tod-label">0.00</span>
    <input id="tod" type="range" min="0" max="1" step="0.001" value="0.35" />
  </label>
  <label><input id="auto-tod" type="checkbox" checked /> Auto cycle (90s)</label>
</div>
<div id="model-badge">Minimax M3</div>

<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const C = {
  vermillion: new THREE.Color('#C73E1D'),
  vermillionDark: new THREE.Color('#8B2410'),
  gold: new THREE.Color('#E8B86D'),
  goldBright: new THREE.Color('#FFD98C'),
  teak: new THREE.Color('#4A2C1A'),
  teakLight: new THREE.Color('#6B3E22'),
  jadeDark: new THREE.Color('#2D6A4F'),
  jadeLight: new THREE.Color('#40916C'),
  jadeRoof: new THREE.Color('#1F5C3D'),
  sakuraLight: new THREE.Color('#FFB7C5'),
  sakuraMid: new THREE.Color('#FF8FAB'),
  sakuraPale: new THREE.Color('#FFE5EC'),
  stone: new THREE.Color('#9AA0A6'),
  stoneDark: new THREE.Color('#6B6F73'),
  pond: new THREE.Color('#7ED6DF'),
  pondDeep: new THREE.Color('#3E8E9E'),
  moss: new THREE.Color('#606C38'),
  bamboo: new THREE.Color('#7A8B3A'),
  bark: new THREE.Color('#3B2410'),
  leaf: new THREE.Color('#2F6B3A'),
  mapleRed: new THREE.Color('#C73E1D'),
  willow: new THREE.Color('#9CB87A'),
  snow: new THREE.Color('#FFFFFF'),
};

const container = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color('#0a0a0f');
scene.fog = new THREE.Fog('#0a0a0f', 60, 200);

const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 500);
const introStart = new THREE.Vector3(-32, 6, 28);
const introEnd = new THREE.Vector3(-18, 14, 32);
camera.position.copy(introStart);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 8;
controls.maxDistance = 90;
controls.maxPolarAngle = Math.PI * 0.49;
controls.target.set(0, 8, 0);
controls.autoRotate = false;
controls.autoRotateSpeed = 0.4;

let userInteracted = false;
let idleTime = 0;
controls.addEventListener('start', () => { userInteracted = true; idleTime = 0; controls.autoRotate = false; });
controls.addEventListener('end', () => { idleTime = 0; });

const hemi = new THREE.HemisphereLight(0xbfd7ff, 0x4a3a1a, 0.55);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff1d4, 1.1);
sun.position.set(40, 60, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 160;
sun.shadow.camera.left = -50;
sun.shadow.camera.right = 50;
sun.shadow.camera.top = 50;
sun.shadow.camera.bottom = -50;
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.04;
scene.add(sun);
scene.add(sun.target);

const lanternLights = [];
for (let i = 0; i < 4; i++) {
  const pl = new THREE.PointLight(0xffb060, 1.4, 14, 1.8);
  scene.add(pl);
  lanternLights.push({ light: pl, baseIntensity: 1.4, on: true, flickerSeed: Math.random() * 100 });
}

const interiorLight = new THREE.PointLight(0xffc080, 1.6, 18, 1.5);
interiorLight.position.set(0, 22, 0);
scene.add(interiorLight);

const V = 1;
const group = new THREE.Group();
scene.add(group);

const buckets = new Map();
function colorKey(c) { return `${c.r.toFixed(3)}_${c.g.toFixed(3)}_${c.b.toFixed(3)}`; }

function getBucket(color, roughness = 0.85, metalness = 0.05) {
  const key = colorKey(color) + `_${roughness}_${metalness}`;
  if (buckets.has(key)) return buckets.get(key);
  const mat = new THREE.MeshStandardMaterial({ color: color.clone(), roughness, metalness, vertexColors: false });
  const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(V, V, V), mat, 2000);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.count = 0;
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  scene.add(mesh);
  const b = { mesh, color: color.clone(), mat };
  buckets.set(key, b);
  return b;
}

const dummy = new THREE.Object3D();
let totalVoxels = 0;

function placeVoxel(x, y, z, color, opts = {}) {
  const { roughness = 0.85, metalness = 0.05, scale = 1 } = opts;
  const b = getBucket(color, roughness, metalness);
  if (b.mesh.count >= b.mesh.instanceMatrix.array.length / 16) {
    const oldMesh = b.mesh;
    const newCap = Math.floor(oldMesh.instanceMatrix.array.length / 16) * 2;
    const newMesh = new THREE.InstancedMesh(oldMesh.geometry, oldMesh.material, newCap);
    newMesh.castShadow = true;
    newMesh.receiveShadow = true;
    newMesh.count = oldMesh.count;
    newMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    newMesh.matrixAutoUpdate = false;
    newMesh.instanceMatrix.array.set(oldMesh.instanceMatrix.array);
    newMesh.instanceMatrix.needsUpdate = true;
    scene.remove(oldMesh);
    scene.add(newMesh);
    b.mesh = newMesh;
  }
  dummy.position.set(x + V / 2, y + V / 2, z + V / 2);
  dummy.rotation.set(0, 0, 0);
  dummy.scale.set(scale, scale, scale);
  dummy.updateMatrix();
  b.mesh.setMatrixAt(b.mesh.count, dummy.matrix);
  b.mesh.count++;
  totalVoxels++;
}

const TERRAIN = 64;
const HALF = TERRAIN / 2;

function buildTerrain() {
  const heights = [];
  for (let x = 0; x < TERRAIN; x++) {
    heights.push([]);
    for (let z = 0; z < TERRAIN; z++) {
      const dx = x - HALF;
      const dz = z - HALF;
      const d = Math.sqrt(dx * dx + dz * dz);
      let h = 0;
      const pondDx = dx - 18;
      const pondDz = dz + 6;
      const pondD = Math.sqrt(pondDx * pondDx + pondDz * pondDz);
      if (pondD < 9) {
        h = -1.4 * Math.max(0, Math.cos((pondD / 9) * Math.PI * 0.5));
      } else {
        h = 0.6 * Math.cos(d / 28);
      }
      h += 0.25 * Math.sin(x * 0.42) * Math.cos(z * 0.39);
      h += 0.15 * Math.sin(x * 0.91 + z * 0.27);
      const pDx = dx, pDz = dz;
      const pD = Math.sqrt(pDx * pDx + pDz * pDz);
      if (pD < 5) h += 0.6;
      heights[x].push(h);
    }
  }
  for (let x = 0; x < TERRAIN; x++) {
    for (let z = 0; z < TERRAIN; z++) {
      const h = heights[x][z];
      const wx = x - HALF, wz = z - HALF;
      const surfaceY = Math.round(h);
      const pondDx = wx - 18, pondDz = wz + 6;
      const pondD = Math.sqrt(pondDx * pondDx + pondDz * pondDz);
      const inPond = pondD < 8.5 && surfaceY <= 0;
      if (inPond) {
        for (let y = -2; y <= surfaceY; y++) {
          placeVoxel(wx, y, wz, C.pondDeep, { roughness: 0.6, metalness: 0.1 });
        }
        placeVoxel(wx, 0, wz, C.pond, { roughness: 0.25, metalness: 0.15 });
        continue;
      }
      const grassT = (Math.sin(wx * 0.5) * Math.cos(wz * 0.5) + 1) * 0.5;
      const top = grassT > 0.55 ? C.moss : (grassT < 0.2 ? C.stoneDark : C.jadeLight);
      placeVoxel(wx, surfaceY, wz, top, { roughness: 0.95 });
      for (let y = surfaceY - 1; y >= surfaceY - 3; y--) {
        placeVoxel(wx, y, wz, y === surfaceY - 1 ? C.teak : C.teakLight, { roughness: 0.95 });
      }
      if (surfaceY - 4 >= -2) {
        placeVoxel(wx, surfaceY - 4, wz, C.stoneDark, { roughness: 0.95 });
      }
    }
  }
}

function buildPath() {
  const pathPoints = [
    [-28, 0, 14], [-20, 0, 10], [-14, 0, 4], [-8, 0, 2], [-4, 0, -2],
    [0, 0, -2], [4, 0, 0], [8, 0, 2], [12, 0, 0], [16, 0, -2], [20, 0, 0],
  ];
  for (let i = 0; i < pathPoints.length - 1; i++) {
    const [x0, y0, z0] = pathPoints[i];
    const [x1, y1, z1] = pathPoints[i + 1];
    const steps = 5;
    for (let s = 0; s < steps; s++) {
      const t = s / (steps - 1);
      const x = Math.round(x0 + (x1 - x0) * t);
      const z = Math.round(z0 + (z1 - z0) * t);
      for (let ox = -1; ox <= 0; ox++) {
        for (let oz = -1; oz <= 0; oz++) {
          const col = (s % 2 === 0) ? C.stone : C.stoneDark;
          placeVoxel(x + ox, 1, z + oz, col, { roughness: 0.9 });
        }
      }
    }
  }
}

const pagodaRecord = { floors: [] };

function buildPagoda() {
  const floorHeight = 5;
  const floorWidths = [11, 10, 9, 8, 7];
  const pagodaBaseY = 1;

  for (let f = 0; f < 5; f++) {
    const w = floorWidths[f];
    const baseY = pagodaBaseY + f * floorHeight;
    const wallH = 3;
    const floorRec = { f, baseY, w, wallH, doors: [], lanterns: [], doorMeshes: [] };
    pagodaRecord.floors.push(floorRec);

    const half = Math.floor(w / 2);
    const pillarOffsets = [
      [-half, 0, -half], [half, 0, -half], [-half, 0, half], [half, 0, half],
    ];
    if (w >= 9) {
      pillarOffsets.push([0, 0, -half], [0, 0, half], [-half, 0, 0], [half, 0, 0]);
    }
    for (const [px, , pz] of pillarOffsets) {
      for (let y = 0; y < wallH; y++) {
        placeVoxel(px, baseY + y, pz, C.vermillion, { roughness: 0.7, metalness: 0.1 });
      }
    }

    for (let x = -half + 1; x <= half - 1; x++) {
      for (let y = 1; y < wallH - 1; y++) {
        placeVoxel(x, baseY + y, -half, C.teak, { roughness: 0.9 });
      }
    }
    for (let z = -half + 1; z <= half - 1; z++) {
      for (let y = 1; y < wallH - 1; y++) {
        const isWindow = (z % 2 === 0);
        if (!isWindow) {
          placeVoxel(-half, baseY + y, z, C.teak, { roughness: 0.9 });
          placeVoxel(half, baseY + y, z, C.teak, { roughness: 0.9 });
        } else {
          placeVoxel(-half, baseY + y, z, C.gold, { roughness: 0.5, metalness: 0.5 });
          placeVoxel(half, baseY + y, z, C.gold, { roughness: 0.5, metalness: 0.5 });
        }
      }
    }
    const doorWidth = 2;
    for (let x = -half + 1; x <= half - 1; x++) {
      const isDoor = Math.abs(x) < doorWidth;
      for (let y = 1; y < wallH - 1; y++) {
        if (!isDoor) {
          placeVoxel(x, baseY + y, half, C.teak, { roughness: 0.9 });
        }
      }
      if (Math.abs(x) < doorWidth) {
        const doorGeo = new THREE.BoxGeometry(V * 0.95, V * 0.95, 0.15);
        const doorMat = new THREE.MeshStandardMaterial({ color: C.vermillionDark, roughness: 0.6, metalness: 0.1 });
        const dmesh = new THREE.Mesh(doorGeo, doorMat);
        dmesh.position.set(x, baseY + 1.5, half + 0.5);
        dmesh.castShadow = true;
        dmesh.receiveShadow = true;
        dmesh.userData.isDoor = true;
        dmesh.userData.floor = f;
        dmesh.userData.side = x < 0 ? -1 : 1;
        dmesh.userData.openProgress = 0;
        dmesh.userData.target = 0;
        scene.add(dmesh);
        floorRec.doors.push(dmesh);
        floorRec.doorMeshes.push(dmesh);
      }
    }
    for (let x = -half; x <= half; x++) {
      for (let z = -half; z <= half; z++) {
        placeVoxel(x, baseY, z, C.teakLight, { roughness: 0.9 });
      }
    }
    for (let x = -half; x <= half; x++) {
      placeVoxel(x, baseY + wallH, 0, C.gold, { roughness: 0.5, metalness: 0.6 });
    }

    const roofBaseY = baseY + wallH;
    const roofLayers = 2;
    for (let layer = 0; layer < roofLayers; layer++) {
      const ly = roofBaseY + layer;
      const lw = w - 2 - layer * 2;
      if (lw < 2) break;
      const lh = Math.floor(lw / 2);
      for (let x = -lh; x <= lh; x++) {
        for (let z = -lh; z <= lh; z++) {
          if (Math.abs(x) === lh || Math.abs(z) === lh) {
            placeVoxel(x, ly, z, C.jadeRoof, { roughness: 0.6, metalness: 0.1 });
          }
        }
      }
    }
    const topY = roofBaseY + roofLayers;
    placeVoxel(0, topY, 0, C.gold, { roughness: 0.3, metalness: 0.8 });
    placeVoxel(0, topY + 1, 0, C.goldBright, { roughness: 0.2, metalness: 0.9 });

    const cornerY = roofBaseY;
    const cornerH = Math.floor(w / 2);
    const ups = [
      [-cornerH, cornerY, -cornerH], [cornerH, cornerY, -cornerH],
      [-cornerH, cornerY, cornerH], [cornerH, cornerY, cornerH],
    ];
    for (const [ux, uy, uz] of ups) {
      placeVoxel(ux, uy, uz, C.gold, { roughness: 0.4, metalness: 0.7 });
    }
  }

  const top = pagodaBaseY + 5 * floorHeight + 2 + 1;
  for (let i = 0; i < 4; i++) {
    placeVoxel(0, top + i, 0, i % 2 === 0 ? C.gold : C.goldBright, { roughness: 0.2, metalness: 0.95 });
  }
  placeVoxel(0, top + 4, 0, C.sakuraMid, { roughness: 0.2, metalness: 0.4 });

  pagodaRecord.baseY = pagodaBaseY;
  pagodaRecord.height = 28;
}

function buildTree(x, z, type) {
  const trunkH = 3 + Math.floor(Math.random() * 2);
  for (let y = 1; y <= trunkH; y++) {
    placeVoxel(x, y, z, C.bark, { roughness: 0.95 });
  }
  if (type === 'sakura') {
    for (let dx = -2; dx <= 2; dx++) {
      for (let dz = -2; dz <= 2; dz++) {
        for (let dy = 0; dy <= 2; dy++) {
          if (dx * dx + dz * dz + dy * dy <= 6) {
            const col = (dx + dy + dz) % 3 === 0 ? C.sakuraMid : (Math.random() > 0.5 ? C.sakuraLight : C.sakuraPale);
            placeVoxel(x + dx, trunkH + dy + 1, z + dz, col, { roughness: 0.9 });
          }
        }
      }
    }
  } else if (type === 'pine') {
    for (let dy = 0; dy < 4; dy++) {
      const r = 2 - Math.floor(dy / 1.5);
      for (let dx = -r; dx <= r; dx++) {
        for (let dz = -r; dz <= r; dz++) {
          if (dx * dx + dz * dz <= r * r) {
            placeVoxel(x + dx, trunkH + dy + 1, z + dz, C.jadeDark, { roughness: 0.9 });
          }
        }
      }
    }
  } else if (type === 'maple') {
    for (let dx = -2; dx <= 2; dx++) {
      for (let dz = -2; dz <= 2; dz++) {
        for (let dy = 0; dy <= 2; dy++) {
          if (dx * dx + dz * dz + dy * dy <= 6) {
            const col = (dx + dy + dz) % 2 === 0 ? C.mapleRed : new THREE.Color('#8B1A1A');
            placeVoxel(x + dx, trunkH + dy + 1, z + dz, col, { roughness: 0.9 });
          }
        }
      }
    }
  } else if (type === 'willow') {
    for (let dy = 0; dy < 5; dy++) {
      placeVoxel(x, trunkH + dy + 1, z, C.leaf, { roughness: 0.9 });
    }
    for (let dy = 0; dy < 3; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        if (dx !== 0) placeVoxel(x + dx, trunkH + 2 + dy, z, C.willow, { roughness: 0.95 });
      }
    }
  }
}

function buildTrees() {
  buildTree(-22, 0, 'sakura');
  buildTree(-10, -16, 'sakura');
  buildTree(20, -10, 'sakura');
  buildTree(24, 8, 'pine');
  buildTree(-18, -10, 'pine');
  buildTree(10, 14, 'maple');
  buildTree(-26, 8, 'maple');
  buildTree(14, 10, 'willow');
}

function buildFlowers() {
  let placed = 0, attempts = 0;
  while (placed < 40 && attempts < 400) {
    attempts++;
    const x = Math.floor(Math.random() * 40) - 20;
    const z = Math.floor(Math.random() * 40) - 20;
    if (Math.sqrt(x * x + z * z) < 7) continue;
    if (Math.sqrt((x - 18) ** 2 + (z + 6) ** 2) < 10) continue;
    const colPick = Math.random();
    const col = colPick < 0.4 ? C.sakuraMid : (colPick < 0.7 ? C.sakuraLight : (colPick < 0.9 ? C.gold : C.sakuraPale));
    placeVoxel(x, 1, z, col, { roughness: 0.85 });
    if (Math.random() > 0.5) placeVoxel(x, 0, z, C.jadeDark, { roughness: 0.95 });
    placed++;
  }
}

function buildTorii() {
  const tx = -28, tz = 14;
  for (let y = 0; y < 7; y++) {
    placeVoxel(tx - 1, y, tz, C.vermillion, { roughness: 0.6, metalness: 0.1 });
    placeVoxel(tx + 1, y, tz, C.vermillion, { roughness: 0.6, metalness: 0.1 });
  }
  for (let x = -3; x <= 3; x++) {
    placeVoxel(tx + x, 7, tz, C.vermillion, { roughness: 0.6, metalness: 0.1 });
    placeVoxel(tx + x, 8, tz, C.vermillion, { roughness: 0.6, metalness: 0.1 });
  }
  for (let x = -2; x <= 2; x++) {
    placeVoxel(tx + x, 6, tz, C.vermillionDark, { roughness: 0.6, metalness: 0.1 });
  }
  placeVoxel(tx, 6, tz, C.gold, { roughness: 0.4, metalness: 0.7 });
}

function buildFence() {
  const segments = [
    { from: [-30, 0, -22], to: [22, 0, -22] },
    { from: [22, 0, -22], to: [28, 0, 12] },
  ];
  for (const seg of segments) {
    const dx = seg.to[0] - seg.from[0];
    const dz = seg.to[2] - seg.from[2];
    const len = Math.sqrt(dx * dx + dz * dz);
    const steps = Math.floor(len);
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const x = Math.round(seg.from[0] + dx * t);
      const z = Math.round(seg.from[2] + dz * t);
      for (let y = 0; y < 2; y++) {
        placeVoxel(x, y, z, C.bamboo, { roughness: 0.8 });
      }
      if (i % 3 === 0) {
        placeVoxel(x, 2, z, C.bamboo, { roughness: 0.8 });
      }
    }
  }
}

function buildBridge() {
  const startX = -4, endX = 8;
  const span = endX - startX;
  const archSteps = 14;
  for (let i = 0; i <= archSteps; i++) {
    const t = i / archSteps;
    const x = startX + span * t;
    const archY = 4 * Math.sin(t * Math.PI) + 0.6;
    const yi = Math.round(archY);
    for (let ox = -1; ox <= 0; ox++) {
      placeVoxel(Math.round(x) + ox, yi, -2, C.teak, { roughness: 0.85 });
      placeVoxel(Math.round(x) + ox, yi, -1, C.teak, { roughness: 0.85 });
    }
    if (i % 2 === 0) {
      placeVoxel(Math.round(x) - 1, yi + 1, -2, C.vermillion, { roughness: 0.7 });
      placeVoxel(Math.round(x), yi + 1, -1, C.vermillion, { roughness: 0.7 });
      if (i > 0) {
        placeVoxel(Math.round(x), yi + 2, -2, C.vermillion, { roughness: 0.7 });
        placeVoxel(Math.round(x), yi + 2, -1, C.vermillion, { roughness: 0.7 });
      }
    }
  }
}

const lanternRecords = [];
function buildLanterns() {
  const positions = [[-22, 0, 8], [16, 0, 12], [8, 0, -16], [-14, 0, -14]];
  for (let i = 0; i < 4; i++) {
    const [x, , z] = positions[i];
    placeVoxel(x, 0, z, C.stone, { roughness: 0.9 });
    placeVoxel(x, 1, z, C.stoneDark, { roughness: 0.9 });
    placeVoxel(x, 2, z, C.teak, { roughness: 0.9 });
    placeVoxel(x, 3, z, C.vermillion, { roughness: 0.6, metalness: 0.2 });
    placeVoxel(x, 4, z, C.gold, { roughness: 0.3, metalness: 0.7 });
    placeVoxel(x, 5, z, C.teak, { roughness: 0.9 });
    lanternLights[i].light.position.set(x + 0.5, 4, z + 0.5);
    lanternRecords.push({ x, z, idx: i });
  }
}

function buildJizo() {
  const positions = [[-16, 0, -6], [12, 0, -8]];
  for (const [x, , z] of positions) {
    placeVoxel(x, 0, z, C.stone, { roughness: 0.9 });
    placeVoxel(x, 1, z, C.stone, { roughness: 0.9 });
    placeVoxel(x, 2, z, C.stone, { roughness: 0.9 });
    placeVoxel(x, 3, z, C.stone, { roughness: 0.9 });
    placeVoxel(x, 4, z, C.stone, { roughness: 0.9 });
    placeVoxel(x, 2, z + 1, C.vermillion, { roughness: 0.7 });
  }
}

const koi = [];
const koiColors = [
  new THREE.Color('#FF6B35'), new THREE.Color('#FFFFFF'),
  new THREE.Color('#FFD700'), new THREE.Color('#FF8FAB'),
  new THREE.Color('#C73E1D'), new THREE.Color('#FFE5EC'),
];
function buildKoi() {
  for (let i = 0; i < 6; i++) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.35, 0.35),
      new THREE.MeshStandardMaterial({ color: koiColors[i], roughness: 0.6, metalness: 0.1 }));
    g.add(body);
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.28, 0.28),
      new THREE.MeshStandardMaterial({ color: koiColors[i], roughness: 0.6, metalness: 0.1 }));
    head.position.set(0.55, 0, 0);
    g.add(head);
    const tail = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.3, 0.05),
      new THREE.MeshStandardMaterial({ color: koiColors[i], roughness: 0.6, metalness: 0.1 }));
    tail.position.set(-0.55, 0, 0);
    g.add(tail);
    scene.add(g);
    koi.push({
      group: g, body, head, tail,
      phase: Math.random() * Math.PI * 2,
      speed: 0.3 + Math.random() * 0.3,
      radius: 4 + Math.random() * 2.5,
      cx: 18, cz: -6, yBase: 0.2,
    });
  }
}

const petals = [];
function buildPetals() {
  const petalGeo = new THREE.PlaneGeometry(0.25, 0.25);
  const petalMat = new THREE.MeshStandardMaterial({
    color: C.sakuraLight, roughness: 0.8,
    side: THREE.DoubleSide, transparent: true, opacity: 0.95,
  });
  for (let i = 0; i < 140; i++) {
    const m = new THREE.Mesh(petalGeo, petalMat);
    m.position.set((Math.random() - 0.5) * 60, 12 + Math.random() * 18, (Math.random() - 0.5) * 60);
    m.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
    scene.add(m);
    petals.push({
      mesh: m,
      vy: 0.4 + Math.random() * 0.5,
      vx: (Math.random() - 0.5) * 0.4,
      vz: (Math.random() - 0.5) * 0.4,
      rotSpeed: (Math.random() - 0.5) * 1.5,
      phase: Math.random() * Math.PI * 2,
    });
  }
}

const birds = [];
function buildBirds() {
  const birdMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.7 });
  for (let i = 0; i < 5; i++) {
    const g = new THREE.Group();
    const left = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.05, 0.25), birdMat);
    left.position.set(-0.3, 0, 0);
    g.add(left);
    const right = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.05, 0.25), birdMat);
    right.position.set(0.3, 0, 0);
    g.add(right);
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.15, 0.15), birdMat);
    g.add(body);
    scene.add(g);
    birds.push({
      group: g, leftWing: left, rightWing: right,
      radius: 25 + Math.random() * 15,
      y: 22 + Math.random() * 8,
      speed: 0.15 + Math.random() * 0.15,
      phase: Math.random() * Math.PI * 2,
      wingPhase: Math.random() * Math.PI * 2,
    });
  }
}

const flyingIslands = [];
function buildFlyingIslands() {
  const main = new THREE.Group();
  const grass = new THREE.Mesh(new THREE.BoxGeometry(10, 1, 10),
    new THREE.MeshStandardMaterial({ color: C.jadeLight, roughness: 0.9 }));
  grass.position.y = 0; grass.castShadow = true; grass.receiveShadow = true;
  main.add(grass);
  for (let x = -5; x <= 5; x++) {
    for (let z = -5; z <= 5; z++) {
      const d = Math.sqrt(x * x + z * z);
      if (d < 4.5) {
        const h = -1 - Math.floor((4.5 - d) * 0.8);
        const stone = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1),
          new THREE.MeshStandardMaterial({ color: C.stoneDark, roughness: 0.95 }));
        stone.position.set(x, h, z); stone.castShadow = true; stone.receiveShadow = true;
        main.add(stone);
        if (d > 3.5) {
          for (let k = 1; k <= 3; k++) {
            const s2 = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1, 0.7),
              new THREE.MeshStandardMaterial({ color: C.stone, roughness: 0.95 }));
            s2.position.set(x * 0.7, h - k, z * 0.7); s2.castShadow = true;
            main.add(s2);
          }
        }
      }
    }
  }
  for (let y = 0; y < 3; y++) {
    for (let dx = -1; dx <= 1; dx++) {
      for (let dz = -1; dz <= 1; dz++) {
        if (Math.abs(dx) === 1 || Math.abs(dz) === 1) {
          const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.5, 0.4),
            new THREE.MeshStandardMaterial({ color: C.vermillion, roughness: 0.7 }));
          pillar.position.set(dx * 1.2, 1 + y * 0.5, dz * 1.2);
          pillar.castShadow = true;
          main.add(pillar);
        }
      }
    }
  }
  const roof = new THREE.Mesh(new THREE.ConeGeometry(2, 1.5, 4),
    new THREE.MeshStandardMaterial({ color: C.jadeRoof, roughness: 0.6 }));
  roof.position.y = 3.2; roof.rotation.y = Math.PI / 4; roof.castShadow = true;
  main.add(roof);
  const treeTrunk = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1, 0.3),
    new THREE.MeshStandardMaterial({ color: C.bark, roughness: 0.95 }));
  treeTrunk.position.set(-3, 1.5, 2); treeTrunk.castShadow = true;
  main.add(treeTrunk);
  const treeLeaf = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1, 1.5),
    new THREE.MeshStandardMaterial({ color: C.sakuraLight, roughness: 0.9 }));
  treeLeaf.position.set(-3, 2.5, 2); treeLeaf.castShadow = true;
  main.add(treeLeaf);

  main.position.set(20, 32, -8);
  scene.add(main);
  flyingIslands.push({ obj: main, baseY: 32, bob: Math.random() * Math.PI * 2 });

  const smallConfigs = [
    { pos: [-22, 26, -18], size: 5 },
    { pos: [12, 38, 14], size: 4 },
    { pos: [-30, 22, 8], size: 3 },
  ];
  for (const cfg of smallConfigs) {
    const g = new THREE.Group();
    const top = new THREE.Mesh(new THREE.BoxGeometry(cfg.size, 1, cfg.size),
      new THREE.MeshStandardMaterial({ color: C.moss, roughness: 0.9 }));
    top.castShadow = true; top.receiveShadow = true;
    g.add(top);
    for (let x = -cfg.size / 2; x <= cfg.size / 2; x++) {
      for (let z = -cfg.size / 2; z <= cfg.size / 2; z++) {
        const d = Math.sqrt(x * x + z * z);
        if (d < cfg.size * 0.4) {
          const s = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1, 0.7),
            new THREE.MeshStandardMaterial({ color: C.stone, roughness: 0.95 }));
          s.position.set(x, -1 - Math.floor((cfg.size * 0.4 - d) * 0.4), z);
          s.castShadow = true;
          g.add(s);
        }
      }
    }
    g.position.set(cfg.pos[0], cfg.pos[1], cfg.pos[2]);
    scene.add(g);
    flyingIslands.push({ obj: g, baseY: cfg.pos[1], bob: Math.random() * Math.PI * 2 });
  }
}

const waterfallGroup = new THREE.Group();
function buildWaterfall() {
  const cliff = new THREE.Mesh(new THREE.BoxGeometry(6, 8, 6),
    new THREE.MeshStandardMaterial({ color: C.stone, roughness: 0.95 }));
  cliff.position.set(0, -4, 0); cliff.castShadow = true; cliff.receiveShadow = true;
  waterfallGroup.add(cliff);

  const top = new THREE.Mesh(new THREE.BoxGeometry(6, 1, 6),
    new THREE.MeshStandardMaterial({ color: C.moss, roughness: 0.9 }));
  top.position.set(0, 0.5, 0); top.castShadow = true; top.receiveShadow = true;
  waterfallGroup.add(top);

  const waterMat = new THREE.MeshStandardMaterial({
    color: C.pond, roughness: 0.25, metalness: 0.1,
    transparent: true, opacity: 0.85,
  });
  for (let i = 0; i < 12; i++) {
    const w = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 0.6), waterMat);
    w.position.set(0, -i * 0.7, 2.5);
    w.rotation.x = -Math.PI / 2 + 0.05;
    waterfallGroup.add(w);
  }
  const pool = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.5, 0.3, 16),
    new THREE.MeshStandardMaterial({ color: C.pondDeep, roughness: 0.3, metalness: 0.2, transparent: true, opacity: 0.8 }));
  pool.position.set(0, -8.4, 2.5);
  waterfallGroup.add(pool);

  const mistMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.25, roughness: 1 });
  for (let i = 0; i < 12; i++) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.4, 6, 6), mistMat);
    m.position.set((Math.random() - 0.5) * 2, -8 + Math.random() * 1.5, 2.5 + (Math.random() - 0.5) * 1.2);
    waterfallGroup.add(m);
  }

  waterfallGroup.position.set(20, 32, -3);
  scene.add(waterfallGroup);
}

buildTerrain();
buildPath();
buildPagoda();
buildTrees();
buildFlowers();
buildTorii();
buildFence();
buildBridge();
buildLanterns();
buildJizo();
buildKoi();
buildPetals();
buildBirds();
buildFlyingIslands();
buildWaterfall();

document.getElementById('voxel-count').textContent = totalVoxels.toLocaleString();

const skyGeo = new THREE.SphereGeometry(200, 32, 16);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: {
    topColor: { value: new THREE.Color('#0a0a1a') },
    horizonColor: { value: new THREE.Color('#FFB7C5') },
    sunPos: { value: new THREE.Vector3(0.5, 0.5, 0.5) },
    sunColor: { value: new THREE.Color('#FFE5B0') },
  },
  vertexShader: `
    varying vec3 vWorldPos;
    void main() {
      vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 topColor;
    uniform vec3 horizonColor;
    uniform vec3 sunPos;
    uniform vec3 sunColor;
    varying vec3 vWorldPos;
    void main() {
      vec3 dir = normalize(vWorldPos);
      float h = clamp(dir.y * 0.5 + 0.5, 0.0, 1.0);
      vec3 sky = mix(horizonColor, topColor, pow(h, 0.6));
      float sd = max(dot(dir, normalize(sunPos)), 0.0);
      sky += sunColor * pow(sd, 64.0) * 1.2;
      sky += sunColor * 0.15 * pow(sd, 4.0);
      gl_FragColor = vec4(sky, 1.0);
    }
  `,
});
const sky = new THREE.Mesh(skyGeo, skyMat);
scene.add(sky);

let timeOfDay = 0.35;
let autoCycle = true;
const cycleSpeed = 1 / 90;
const todInput = document.getElementById('tod');
const todLabel = document.getElementById('tod-label');
const autoInput = document.getElementById('auto-tod');
todInput.addEventListener('input', () => {
  timeOfDay = parseFloat(todInput.value);
  autoCycle = false; autoInput.checked = false;
});
autoInput.addEventListener('change', () => { autoCycle = autoInput.checked; });

function updateDayNight() {
  const ang = timeOfDay * Math.PI * 2 - Math.PI * 0.5;
  const sunDir = new THREE.Vector3(Math.cos(ang), Math.sin(ang), 0.4).normalize();
  const sunDist = 70;
  sun.position.set(sunDir.x * sunDist, sunDir.y * sunDist + 20, sunDir.z * sunDist);
  sun.target.position.set(0, 0, 0);
  sun.target.updateMatrixWorld();

  const dayness = Math.max(0, Math.sin(ang));
  sun.intensity = 0.15 + dayness * 1.3;
  sun.color.setHSL(0.08 + (1 - dayness) * 0.02, 0.5, 0.6 + dayness * 0.2);
  hemi.intensity = 0.2 + dayness * 0.55;
  renderer.toneMappingExposure = 0.6 + dayness * 0.7;

  const isDusk = (timeOfDay > 0.7 && timeOfDay < 0.95) || (timeOfDay > 0.2 && timeOfDay < 0.3);
  if (dayness > 0.5) {
    skyMat.uniforms.topColor.value.set('#3a78c2');
    skyMat.uniforms.horizonColor.value.set('#bfe4ff');
    skyMat.uniforms.sunColor.value.set('#fff5cc');
    scene.background = new THREE.Color('#5da4d9');
  } else if (isDusk) {
    skyMat.uniforms.topColor.value.set('#1a1a4a');
    skyMat.uniforms.horizonColor.value.set('#FF8FAB');
    skyMat.uniforms.sunColor.value.set('#FFB7C5');
    scene.background = new THREE.Color('#3a2a4a');
  } else {
    skyMat.uniforms.topColor.value.set('#05050f');
    skyMat.uniforms.horizonColor.value.set('#1a1530');
    skyMat.uniforms.sunColor.value.set('#9AA0A6');
    scene.background = new THREE.Color('#0a0a0f');
  }
  skyMat.uniforms.sunPos.value.copy(sunDir);
  scene.fog.color.copy(scene.background);
  scene.fog.far = 140 - dayness * 30;

  const lanternsOn = dayness < 0.55;
  for (let i = 0; i < 4; i++) {
    const l = lanternLights[i];
    l.on = lanternsOn;
    if (lanternsOn) {
      const flick = 0.85 + 0.25 * Math.sin(performance.now() * 0.01 + l.flickerSeed) +
                    0.1 * Math.sin(performance.now() * 0.04 + l.flickerSeed * 2);
      l.light.intensity = l.baseIntensity * flick;
    } else {
      l.light.intensity = 0;
    }
  }
  interiorLight.intensity = 1.6 - dayness * 1.0;
}
updateDayNight();

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const downPos = new THREE.Vector2();
let isDragging = false;

renderer.domElement.addEventListener('pointerdown', (e) => {
  downPos.set(e.clientX, e.clientY);
  isDragging = false;
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (downPos.x !== null) {
    if (Math.abs(e.clientX - downPos.x) > 4 || Math.abs(e.clientY - downPos.y) > 4) {
      isDragging = true;
    }
  }
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (isDragging) { isDragging = false; return; }
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const doorMeshes = [];
  for (const f of pagodaRecord.floors) {
    for (const d of f.doorMeshes) doorMeshes.push(d);
  }
  const hits = raycaster.intersectObjects(doorMeshes, false);
  if (hits.length > 0) {
    const d = hits[0].object;
    d.userData.target = d.userData.target > 0.5 ? 0 : 1;
    return;
  }
  const spheres = [];
  const sphereRefs = [];
  for (const rec of lanternRecords) {
    const s = new THREE.Mesh(new THREE.SphereGeometry(0.9, 8, 8),
      new THREE.MeshBasicMaterial({ visible: false }));
    s.position.set(rec.x + 0.5, 4, rec.z + 0.5);
    s.userData.lanternIdx = rec.idx;
    scene.add(s);
    spheres.push(s);
    sphereRefs.push(s);
  }
  const lh = raycaster.intersectObjects(spheres, false);
  if (lh.length > 0) {
    const idx = lh[0].object.userData.lanternIdx;
    lanternLights[idx].on = !lanternLights[idx].on;
  }
  for (const s of sphereRefs) scene.remove(s);
});

const clock = new THREE.Clock();
let fpsAccum = 0, fpsCount = 0;
let lastFpsUpdate = performance.now();
const fpsEl = document.getElementById('fps');

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  fpsAccum += dt; fpsCount++;
  const now = performance.now();
  if (now - lastFpsUpdate > 500) {
    fpsEl.textContent = String(Math.round(fpsCount / fpsAccum));
    fpsAccum = 0; fpsCount = 0;
    lastFpsUpdate = now;
  }

  if (autoCycle) {
    timeOfDay = (timeOfDay + cycleSpeed * dt) % 1;
    todInput.value = String(timeOfDay);
  }
  todLabel.textContent = timeOfDay.toFixed(2);
  updateDayNight();

  if (t < 2.5) {
    const k = t / 2.5;
    const e = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(introStart, introEnd, e);
    controls.target.lerp(new THREE.Vector3(0, 10, 0), e);
  } else {
    idleTime += dt;
    if (idleTime > 4) controls.autoRotate = true;
  }

  for (const f of pagodaRecord.floors) {
    for (const d of f.doorMeshes) {
      const target = d.userData.target;
      const cur = d.userData.openProgress;
      const next = cur + (target - cur) * Math.min(1, dt * 4);
      d.userData.openProgress = next;
      const swing = next * Math.PI * 0.5;
      if (d.userData.baseZ === undefined) d.userData.baseZ = d.position.z;
      const side = d.userData.side;
      const pivotX = side > 0 ? -0.4 : 0.4;
      if (d.userData.origX === undefined) d.userData.origX = d.position.x;
      d.position.x = d.userData.origX;
      d.position.z = d.userData.baseZ + Math.sin(swing) * 0.6 * side;
      d.rotation.y = swing * side;
    }
  }

  for (let i = 0; i < koi.length; i++) {
    const k = koi[i];
    k.phase += dt * k.speed;
    const px = k.cx + Math.cos(k.phase) * k.radius;
    const pz = k.cz + Math.sin(k.phase * 0.7) * k.radius;
    k.group.position.set(px, k.yBase, pz);
    k.group.rotation.y = -k.phase + Math.PI / 2;
    k.tail.rotation.y = Math.sin(t * 6 + i) * 0.4;
  }

  for (const p of petals) {
    p.phase += dt;
    p.mesh.position.y -= p.vy * dt;
    p.mesh.position.x += p.vx * dt + Math.sin(p.phase * 0.8) * 0.02;
    p.mesh.position.z += p.vz * dt + Math.cos(p.phase * 0.7) * 0.02;
    p.mesh.rotation.x += p.rotSpeed * dt;
    p.mesh.rotation.z += p.rotSpeed * 0.7 * dt;
    if (p.mesh.position.y < 0) {
      p.mesh.position.y = 28 + Math.random() * 5;
      p.mesh.position.x = (Math.random() - 0.5) * 60;
      p.mesh.position.z = (Math.random() - 0.5) * 60;
    }
  }

  for (const fi of flyingIslands) {
    fi.obj.position.y = fi.baseY + Math.sin(t * 0.5 + fi.bob) * 0.3;
    fi.obj.rotation.y = Math.sin(t * 0.2 + fi.bob) * 0.03;
  }
  waterfallGroup.position.y = 32 + Math.sin(t * 0.5) * 0.3;

  for (let i = 0; i < birds.length; i++) {
    const b = birds[i];
    b.phase += dt * b.speed;
    const bx = Math.cos(b.phase) * b.radius;
    const bz = Math.sin(b.phase * 0.6) * b.radius * 0.6;
    b.group.position.set(bx, b.y + Math.sin(t + i) * 0.3, bz);
    b.group.rotation.y = -b.phase + Math.PI / 2;
    b.wingPhase += dt * 8;
    b.leftWing.rotation.z = Math.sin(b.wingPhase) * 0.5;
    b.rightWing.rotation.z = -Math.sin(b.wingPhase) * 0.5;
  }

  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

window.__VOXEL__ = {
  voxelCount: totalVoxels,
  fps: 0,
  pagodaFloors: 5,
  timeOfDay: 0.35,
  scene, camera, renderer,
  update() {
    window.__VOXEL__.voxelCount = totalVoxels;
    window.__VOXEL__.fps = parseInt(fpsEl.textContent) || 0;
    window.__VOXEL__.timeOfDay = timeOfDay;
  },
};

animate();
</script>
