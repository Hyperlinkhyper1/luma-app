<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1740" width="1240" height="1740" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Luma Auto with Ultra Reasoning: from prompt to output</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2D3D"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E9F6E"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0B1F3A" flood-opacity="0.10"/>
    </filter>
    <style>
      .panel { fill: #EAF0F7; stroke: #4A90E2; stroke-width: 3; }
      .tab { fill: #5B9BEF; }
      .tab-text { fill: #0B1F3A; font-size: 18px; font-weight: 800; letter-spacing: 0.3px; }
      .panel-title { fill: #0F2A4A; font-size: 20px; font-weight: 700; }
      .panel-note { fill: #4A6382; font-size: 13px; }
      .box { fill: #FFFFFF; stroke: #3D7FD9; stroke-width: 2; }
      .gray { fill: #F7F9FC; stroke: #8A9BB0; stroke-width: 1.5; }
      .t { fill: #0F2A4A; font-size: 15px; font-weight: 700; text-anchor: middle; }
      .ts { fill: #0F2A4A; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .s { fill: #2B4A6F; font-size: 12.5px; text-anchor: middle; }
      .ss { fill: #2B4A6F; font-size: 11.5px; text-anchor: middle; }
      .r { fill: #2F6FC9; font-size: 11.5px; font-weight: 700; text-anchor: middle; }
      .f { fill: #0F2A4A; font-size: 13px; font-style: italic; text-anchor: middle; }
      .g { fill: #8A9BB0; }
      .gt { fill: #3B4B5E; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
      .gs { fill: #5B6B7E; font-size: 11.5px; text-anchor: middle; }
      .line { stroke: #1F2D3D; stroke-width: 1.6; fill: none; }
      .green { stroke: #2E9F6E; stroke-width: 2; fill: none; }
      .green-text { fill: #2E9F6E; font-size: 13px; font-weight: 700; }
      .label { fill: #1F2D3D; font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1240" height="1740" fill="#F3F5F9"/>
  <rect x="16" y="16" width="1208" height="1708" rx="22" fill="#FFFFFF" filter="url(#shadow)"/>

  <text x="48" y="62" fill="#0B1F3A" font-size="25" font-weight="800">Luma Auto + Ultra Reasoning</text>
  <text x="48" y="86" fill="#4A6382" font-size="14">One Assistant message, from prompt to reply</text>

  <!-- ============ INPUT ============ -->
  <rect x="180" y="118" width="200" height="46" rx="6" class="gray"/>
  <text x="280" y="138" class="gt">Plan</text>
  <text x="280" y="155" class="gs">Free · Orbit · Nova</text>

  <rect x="470" y="112" width="300" height="62" rx="6" class="box"/>
  <text x="620" y="137" class="t">User prompt</text>
  <text x="620" y="157" class="s">text · attachments · chat history</text>

  <rect x="860" y="118" width="220" height="46" rx="6" class="gray"/>
  <text x="970" y="138" class="gt">Server status</text>
  <text x="970" y="155" class="gs">picture std / pro available?</text>

  <line x1="280" y1="164" x2="280" y2="224" class="line" marker-end="url(#arrow)"/>
  <line x1="970" y1="164" x2="970" y2="224" class="line" marker-end="url(#arrow)"/>

  <!-- ============ STEP 1 · LUMA AUTO ============ -->
  <rect x="40" y="226" width="1160" height="330" rx="14" class="panel"/>
  <rect x="40" y="198" width="250" height="40" rx="10" class="tab"/>
  <text x="58" y="225" class="tab-text">STEP 1 · LUMA AUTO</text>
  <text x="64" y="266" class="panel-title">Auto Router</text>
  <text x="1176" y="266" class="panel-note" text-anchor="end">routeAutoRequest · offline · no model call</text>

  <path d="M620,174 V286 H137 V298" class="line" marker-end="url(#arrow)"/>

  <!-- seven checks, first match wins -->
  <g>
    <rect x="64" y="300" width="146" height="86" rx="6" class="box"/>
    <text x="137" y="324" class="ts">① File asked?</text>
    <text x="137" y="344" class="ss">“make a pdf…”</text>
    <text x="137" y="368" class="r">File · Nebula</text>

    <rect x="225" y="300" width="146" height="86" rx="6" class="box"/>
    <text x="298" y="324" class="ts">② Edit picture?</text>
    <text x="298" y="344" class="ss">image + edit verb</text>
    <text x="298" y="368" class="r">Picture Pro</text>

    <rect x="386" y="300" width="146" height="86" rx="6" class="box"/>
    <text x="459" y="324" class="ts">③ New picture?</text>
    <text x="459" y="344" class="ss">draw · generate image</text>
    <text x="459" y="368" class="r">Std · Pro if detailed</text>

    <rect x="547" y="300" width="146" height="86" rx="6" class="box"/>
    <text x="620" y="324" class="ts">④ Research?</text>
    <text x="620" y="344" class="ss">research · in-depth</text>
    <text x="620" y="368" class="r">Research · Pulsar</text>

    <rect x="708" y="300" width="146" height="86" rx="6" class="box"/>
    <text x="781" y="324" class="ts">⑤ Hard?</text>
    <text x="781" y="344" class="ss">code · maths · long</text>
    <text x="781" y="368" class="r">Pulsar / Nebula</text>

    <rect x="869" y="300" width="146" height="86" rx="6" class="box"/>
    <text x="942" y="324" class="ts">⑥ Standard?</text>
    <text x="942" y="344" class="ss">explain · translate</text>
    <text x="942" y="368" class="r">Nebula</text>

    <rect x="1030" y="300" width="146" height="86" rx="6" class="box"/>
    <text x="1103" y="324" class="ts">⑦ Everything else</text>
    <text x="1103" y="344" class="ss">small talk · facts</text>
    <text x="1103" y="368" class="r">Aurora (cheapest)</text>

    <line x1="210" y1="343" x2="224" y2="343" class="line" marker-end="url(#arrow)"/>
    <line x1="371" y1="343" x2="385" y2="343" class="line" marker-end="url(#arrow)"/>
    <line x1="532" y1="343" x2="546" y2="343" class="line" marker-end="url(#arrow)"/>
    <line x1="693" y1="343" x2="707" y2="343" class="line" marker-end="url(#arrow)"/>
    <line x1="854" y1="343" x2="868" y2="343" class="line" marker-end="url(#arrow)"/>
    <line x1="1015" y1="343" x2="1029" y2="343" class="line" marker-end="url(#arrow)"/>
  </g>

  <!-- green bracket under the checks -->
  <path d="M64,392 V400 H1176 V392" class="green"/>
  <text x="1176" y="420" class="green-text" text-anchor="end">first match wins</text>

  <rect x="64" y="440" width="330" height="58" rx="6" class="gray"/>
  <text x="229" y="463" class="gt">+ menu mode or file type picked?</text>
  <text x="229" y="482" class="gs">your choice wins · Auto only picks the model</text>
  <line x1="394" y1="469" x2="448" y2="469" class="line" marker-end="url(#arrow)"/>

  <line x1="620" y1="400" x2="620" y2="434" class="line" marker-end="url(#arrow)"/>
  <rect x="450" y="436" width="340" height="62" rx="6" class="box"/>
  <text x="620" y="461" class="t">AutoRoute</text>
  <text x="620" y="481" class="s">kind · mode · compose mode · tier · file type</text>

  <rect x="852" y="440" width="324" height="58" rx="6" class="gray"/>
  <text x="1014" y="463" class="gt">Effort level (Low … Max)</text>
  <text x="1014" y="482" class="gs">server decides reasoning + charge</text>
  <line x1="852" y1="469" x2="792" y2="469" class="line" marker-end="url(#arrow)"/>

  <!-- ============ ULTRA GATE ============ -->
  <path d="M620,498 V566 H450 V594" class="line" marker-end="url(#arrow)"/>

  <rect x="64" y="612" width="150" height="44" rx="6" class="gray"/>
  <text x="139" y="631" class="gt">Ultra switch</text>
  <text x="139" y="647" class="gs">on · Nova plan</text>
  <line x1="214" y1="634" x2="248" y2="634" class="line" marker-end="url(#arrow)"/>

  <rect x="250" y="596" width="400" height="76" rx="6" class="box"/>
  <text x="450" y="622" class="t">Ultra Reasoning gate</text>
  <text x="450" y="644" class="f">Ultra on · Nova · Luma AI</text>
  <text x="450" y="662" class="f">route is chat or research · no file</text>

  <line x1="650" y1="634" x2="888" y2="634" class="line" marker-end="url(#arrow)"/>
  <text x="700" y="626" class="label">no</text>

  <line x1="450" y1="672" x2="450" y2="710" class="line" marker-end="url(#arrow)"/>
  <text x="460" y="696" class="label">yes</text>

  <rect x="190" y="712" width="520" height="70" rx="6" class="box"/>
  <text x="450" y="738" class="t">Ultra override</text>
  <text x="450" y="762" class="f">mode → strongest (Pulsar) · effort → Max · Auto label off</text>

  <line x1="450" y1="782" x2="450" y2="900" class="line" marker-end="url(#arrow)"/>

  <!-- ============ NORMAL PATH ============ -->
  <rect x="890" y="610" width="310" height="300" rx="14" class="panel"/>
  <rect x="890" y="584" width="190" height="38" rx="10" class="tab"/>
  <text x="906" y="610" class="tab-text">NORMAL PATH</text>
  <text x="914" y="648" class="panel-note">one call, no review</text>

  <rect x="914" y="664" width="262" height="58" rx="6" class="box"/>
  <text x="1045" y="688" class="t">Picture</text>
  <text x="1045" y="708" class="s">luma image server · std / pro</text>

  <rect x="914" y="738" width="262" height="58" rx="6" class="box"/>
  <text x="1045" y="762" class="t">File</text>
  <text x="1045" y="782" class="s">create_artifact → .pdf .csv .svg …</text>

  <rect x="914" y="812" width="262" height="58" rx="6" class="box"/>
  <text x="1045" y="836" class="t">Chat</text>
  <text x="1045" y="856" class="s">routed mode · chosen effort</text>

  <path d="M1200,760 H1212 V1635 H652" class="line" marker-end="url(#arrow)"/>

  <!-- ============ PASS 1 · RESEARCH ============ -->
  <rect x="40" y="846" width="820" height="350" rx="14" class="panel"/>
  <rect x="40" y="818" width="250" height="40" rx="10" class="tab"/>
  <text x="58" y="845" class="tab-text">PASS 1 · RESEARCH</text>
  <text x="64" y="886" class="panel-title">Deep research</text>
  <text x="836" y="886" class="panel-note" text-anchor="end">first draft · Max effort</text>

  <rect x="250" y="902" width="400" height="62" rx="6" class="box"/>
  <text x="450" y="927" class="t">Lead</text>
  <text x="450" y="947" class="s">splits the question into ≤ 4 sub-questions</text>

  <path d="M450,964 V982" class="line"/>
  <path d="M144,982 H666" class="line"/>
  <line x1="144" y1="982" x2="144" y2="998" class="line" marker-end="url(#arrow)"/>
  <line x1="318" y1="982" x2="318" y2="998" class="line" marker-end="url(#arrow)"/>
  <line x1="492" y1="982" x2="492" y2="998" class="line" marker-end="url(#arrow)"/>
  <line x1="666" y1="982" x2="666" y2="998" class="line" marker-end="url(#arrow)"/>

  <rect x="64" y="1000" width="160" height="62" rx="6" class="box"/>
  <text x="144" y="1025" class="t">Agent 1</text>
  <text x="144" y="1045" class="ss">sub-question · notes</text>
  <rect x="238" y="1000" width="160" height="62" rx="6" class="box"/>
  <text x="318" y="1025" class="t">Agent 2</text>
  <text x="318" y="1045" class="ss">sub-question · notes</text>
  <rect x="412" y="1000" width="160" height="62" rx="6" class="box"/>
  <text x="492" y="1025" class="t">Agent 3</text>
  <text x="492" y="1045" class="ss">sub-question · notes</text>
  <rect x="586" y="1000" width="160" height="62" rx="6" class="box"/>
  <text x="666" y="1025" class="t">Agent 4</text>
  <text x="666" y="1045" class="ss">sub-question · notes</text>

  <path d="M756,1000 H766 V1062 H756" class="green"/>
  <text x="776" y="1030" class="green-text" font-size="20">× 4</text>
  <text x="776" y="1048" class="green-text" font-size="11.5">in parallel</text>

  <path d="M144,1062 V1080 M318,1062 V1080 M492,1062 V1080 M666,1062 V1080 M144,1080 H666" class="line"/>
  <line x1="450" y1="1080" x2="450" y2="1110" class="line" marker-end="url(#arrow)"/>

  <rect x="250" y="1112" width="400" height="58" rx="6" class="box"/>
  <text x="450" y="1136" class="t">Writer</text>
  <text x="450" y="1156" class="s">first draft from the agents' notes</text>

  <line x1="450" y1="1170" x2="450" y2="1318" class="line" marker-end="url(#arrow)"/>
  <text x="460" y="1222" class="label">draft</text>

  <!-- ============ PASS 2 · REVIEW LOOP ============ -->
  <rect x="40" y="1262" width="820" height="300" rx="14" class="panel"/>
  <rect x="40" y="1234" width="290" height="40" rx="10" class="tab"/>
  <text x="58" y="1261" class="tab-text">PASS 2 · REVIEW LOOP</text>
  <text x="64" y="1302" class="panel-title">Check &amp; improve</text>
  <text x="836" y="1302" class="panel-note" text-anchor="end">up to 3 rounds · stops on pass</text>

  <rect x="250" y="1320" width="400" height="62" rx="6" class="box"/>
  <text x="450" y="1345" class="t">Strict reviewer</text>
  <text x="450" y="1365" class="s">verdict: pass | revise + issues</text>

  <line x1="450" y1="1382" x2="450" y2="1410" class="line" marker-end="url(#arrow)"/>

  <rect x="330" y="1412" width="240" height="50" rx="6" class="gray"/>
  <text x="450" y="1433" class="gt">pass, or round 3 done?</text>
  <text x="450" y="1451" class="gs">yes → reply · no → rewrite</text>

  <line x1="570" y1="1437" x2="628" y2="1437" class="line" marker-end="url(#arrow)"/>
  <text x="580" y="1429" class="label">no</text>

  <rect x="630" y="1408" width="206" height="58" rx="6" class="box"/>
  <text x="733" y="1432" class="t">Reviser</text>
  <text x="733" y="1452" class="ss">rewrites, fixing every issue</text>

  <path d="M733,1408 V1351 H652" class="line" marker-end="url(#arrow)"/>
  <text x="742" y="1380" class="label">new draft</text>

  <path d="M236,1324 H228 V1462 H236" class="green"/>
  <text x="140" y="1388" class="green-text" text-anchor="middle">Repeat</text>
  <text x="140" y="1406" class="green-text" text-anchor="middle">≤ 3 rounds</text>

  <line x1="450" y1="1462" x2="450" y2="1598" class="line" marker-end="url(#arrow)"/>
  <text x="460" y="1530" class="label">yes</text>

  <!-- ============ LUMA SERVER ============ -->
  <rect x="890" y="980" width="310" height="500" rx="14" class="panel"/>
  <rect x="890" y="954" width="190" height="38" rx="10" class="tab"/>
  <text x="906" y="980" class="tab-text">LUMA SERVER</text>
  <text x="914" y="1018" class="panel-note">counts usage · never the app</text>

  <rect x="914" y="1034" width="262" height="58" rx="6" class="box"/>
  <text x="1045" y="1058" class="t">/ai/google/chat</text>
  <text x="1045" y="1078" class="s">plan check · usage left?</text>
  <line x1="1045" y1="1092" x2="1045" y2="1108" class="line" marker-end="url(#arrow)"/>

  <rect x="914" y="1110" width="262" height="58" rx="6" class="box"/>
  <text x="1045" y="1134" class="t">Effort plan</text>
  <text x="1045" y="1154" class="s">luma_effort=max → high · 16k out</text>
  <line x1="1045" y1="1168" x2="1045" y2="1184" class="line" marker-end="url(#arrow)"/>

  <rect x="914" y="1186" width="262" height="58" rx="6" class="box"/>
  <text x="1045" y="1210" class="t">Upstream model</text>
  <text x="1045" y="1230" class="s">operator's route for Pulsar</text>
  <line x1="1045" y1="1244" x2="1045" y2="1260" class="line" marker-end="url(#arrow)"/>

  <rect x="914" y="1262" width="262" height="70" rx="6" class="box"/>
  <text x="1045" y="1286" class="t">Charge</text>
  <text x="1045" y="1306" class="f">tokens × 2.5 (Pulsar)</text>
  <text x="1045" y="1323" class="f">× 3.5 (Max effort)</text>

  <text x="914" y="1366" class="panel-note">Every call in Pass 1 and Pass 2</text>
  <text x="914" y="1384" class="panel-note">goes through here and is charged:</text>
  <text x="914" y="1402" class="panel-note">lead, 4 agents, writer, each review</text>
  <text x="914" y="1420" class="panel-note">and each rewrite.</text>

  <!-- green link: every pass call is metered by the server -->
  <path d="M860,1024 H876 V1440 H860" class="green"/>
  <line x1="876" y1="1150" x2="890" y2="1150" class="green" marker-end="url(#arrow-green)"/>

  <!-- ============ OUTPUT ============ -->
  <rect x="250" y="1600" width="400" height="70" rx="6" class="box"/>
  <text x="450" y="1626" class="t">Reply</text>
  <text x="450" y="1646" class="s">“Ultra Reasoning · checked N times” badge</text>
  <text x="450" y="1662" class="ss">normal path: “Auto · Luma Nebula” etc.</text>

  <!-- legend -->
  <rect x="64" y="1690" width="22" height="14" rx="3" class="box"/>
  <text x="94" y="1702" fill="#3B4B5E" font-size="12">model call / step</text>
  <rect x="220" y="1690" width="22" height="14" rx="3" class="gray"/>
  <text x="250" y="1702" fill="#3B4B5E" font-size="12">input or decision</text>
  <path d="M384,1697 H410" class="green"/>
  <text x="418" y="1702" fill="#3B4B5E" font-size="12">loop / metered by server</text>
</svg>
